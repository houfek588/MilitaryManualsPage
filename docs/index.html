<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vojenské manuály</title>
<link rel="stylesheet" href="assets/app.css?v=202611131013">
</head>
<body>
<header class="hlava"><div class="wrap hlava-in"><a class="logo" href="index.html">Vojenské manuály<small>české překlady raně novověkých vojenských příruček</small></a>
<button id="prepinac-tema" class="tl ikona" type="button" title="Světlý / tmavý režim" aria-label="Přepnout motiv">◐</button></div></header>
<main class="wrap">
  <h1>Knihovna</h1>
  <p class="uvod">Dvojjazyčné edice vojenských traktátů 16. století: německý originál podle digitalizace a český překlad
  s poznámkami, věcným rejstříkem a odkazy na skeny tisku. Funguje i offline – stačí otevřít tento soubor.</p>
  <div class="dlazdice" id="knihy"></div>
</main>
<script>
const KNIHY = [{"id": "fronsberger-1564", "nazev": "Válečný řád a zřízení", "nazev_orig": "Kriegs Ordnung vnd Regiment", "autor": "Leonhart Fronsperger", "rok": 1564, "popis": "Příručka organizace žoldnéřského vojska 16. století: úřady, přísahy a povinnosti velitelů jízdy, pěchoty a dělostřelectva, soudní řád lancknechtů, artikulní list, posádky a obrana měst a obecná poučení o vedení války.", "stav": {"zkontrolovano": 249}, "stran": 249}];
const STAVY = {zkontrolovano:'zkontrolováno', prelozeno:'přeloženo', castecne:'částečně', chybi_preklad:'bez překladu', chybi_original:'bez textu'};
document.getElementById('knihy').innerHTML = KNIHY.map(k => {
  const hotovo = (k.stav.zkontrolovano||0) + (k.stav.prelozeno||0);
  return `<a class="dl kniha" href="${k.id}/index.html"><span class="rok">${k.rok}</span><b>${k.nazev}</b>
  <i class="de">${k.nazev_orig}</i><span>${k.autor}</span><p>${k.popis}</p>
  <span class="m">${hotovo} z ${k.stran} stran přeloženo · ${Object.entries(k.stav).map(([s,n])=>`${STAVY[s]||s} ${n}`).join(' · ')}</span></a>`;
}).join('');
(function(){ const r=document.documentElement; let t=null; try{t=localStorage.getItem('tema')}catch(e){}
  if(t) r.dataset.theme=t;
  document.getElementById('prepinac-tema').onclick=()=>{const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = dark?'light':'dark'; try{localStorage.setItem('tema', r.dataset.theme)}catch(e){}};})();
</script>
</body>
</html>
