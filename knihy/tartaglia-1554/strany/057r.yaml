  de: |-
    metter rettamente in disegno sopra à uno foglio di carta un'altra figura simile alla proposta .a.b.c.d.e. el si debbe far piantare una bacchettina per ciascaduno delli detti cinque angoli, ouer cantoni .a.b.c.d.e. & dapoi el si debbe intrare nel detto sito, ouer loco, & andare nel mezzo di quello, ouer circa al mezzo (perche piu e manco del mezzo non importa, & iui piantarui quel bastone con el detto nostro bossolo in cima, et dapoi che sara piantato bisognara torzerlo, & fermarlo talmente, che el detto bossolo stia ben assettato, cioe, che la lenguella della calamita stia giusta secondo el suo ordine, come fu detto di sopra, cioe, che la ponta di detta lenguella, ouer lanzetta guardi rettamente uerso la Tramontana del detto istrumento, il che si conosce facilmente per mezzo di quella linea, che ua da Tramontana al Ostro, di sotto della detta lenguella, ouer lanzetta, cioe, come se costuma in assettar quelli horologietti, che uien de Alemagna, quando se uol saper quante hore sono, con el sole, & dapoi che tal istrumento sara talmente assettato, el si de girar la dioptra, ouer trasguardo del detto istrumento, talmente che cignando con uno occhio per quelli dui busettini della detta dioptra (se tal dioptra hauera detti busettini) chel si ueda una di quelle .5. bacchette piantate, oueramente se la detta dioptra non hauera li detti dui busettini, ma che hauesse quelle due pontine acute, come di sopra fu detto, le qual due pontine à me mi pareno molto pin accommode che li busi, el si de guardare una di dette bacchette, & uoltar tanto la detta dioptra, che la linea uisuale se incontri con le dette due pontine de detta dioptra, & con quella bacchetta che si guardara, & fatto questo el si de annotare sopra una policetta, per qual grado (de quelli .360. se saranno .360. oueramenta de quelle .72. parti sel detto istrumento sara diuiso in .72. parti à gradi .5. per parte, passara la detta linea uisuale (il qual grado la dioptra lo fara manifesto) & per esser impossibile à dar in un piccol spatio perfetto essempio in figura à questa materia, se sforzaremo al men con parole di supplire à quello, che non si puo dar in figura, hor poniamo che à trasguardare quella bacchetta posta in ponto .a. la nostra linea uisuale passi alli .3. gradi de Sirocco uerso Ostro, fatto questo, el si de misurare, ouer far misurare quanto è dal pede del nostro
  cs: |-
    zakreslit správně na list papíru jiný obrazec podobný danému a b c d e, je třeba dát zarazit tyčku do každého z oněch pěti úhlů čili rohů a, b, c, d, e. Potom se má vejít do toho místa {sito} či prostoru a dojít doprostřed nebo přibližně doprostřed něj (neboť na tom, je-li to víc nebo méně než přesně uprostřed, nezáleží) a tam zarazit onu hůl s naší buzolou {bossolo} na vršku. Když je zaražena, bude třeba ji natočit a upevnit tak, aby buzola byla dobře usazena, totiž aby magnetický jazýček {lenguella della calamita} stál správně podle svého řádu, jak bylo řečeno výše: aby hrot jazýčku čili střelky {lanzetta} mířil přímo k severu {Tramontana} nástroje. To se snadno pozná podle oné čáry, která vede pod jazýčkem čili střelkou od severu k jihu {Ostro}, stejně jako se to dělá při usazování oněch malých hodin, které přicházejí z Německa,[^1] když chceme podle slunce zjistit, kolik je hodin. Když je nástroj takto usazen, je třeba otáčet dioptrou {dioptra} čili průzorem {trasguardo} nástroje tak dlouho, až – mhouříce jedno oko a dívajíce se skrze ty dvě dírky {busettini} dioptry (pokud dioptra ty dírky má) – uvidíme jednu z oněch pěti zaražených tyček. Nebo, nemá-li dioptra ty dvě dírky, ale ony dva ostré hroty, jak bylo řečeno výše – a ty dva hroty se mi zdají mnohem vhodnější[^2] než dírky –, je třeba zamířit na jednu z těch tyček a otáčet dioptrou tak dlouho, až se zorná čára {linea uisuale} setká s oběma hroty dioptry i s tyčkou, na niž hledíme. Když je to hotovo, je třeba zapsat na lístek {policetta}, kterým stupněm {grado} (ze 360, bude-li jich 360, nebo z oněch 72 dílů, bude-li nástroj rozdělen na 72 dílů po 5 stupních) zorná čára prochází (ten stupeň ukáže dioptra). A protože v malém prostoru není možné podat k této látce dokonalý příklad v obrázku, budeme se aspoň slovy snažit doplnit to, co nelze ukázat obrázkem. Předpokládejme tedy, že když zaměřujeme tyčku postavenou v bodě a, prochází naše zorná čára třetím stupněm od jihovýchodu {Sirocco} k jihu. Když je to hotovo, je třeba změřit nebo dát změřit, jak je to daleko od paty našeho
- typ: obrazek
  soubor: drevorez-113.jpg
  popis: Pětiúhelníková krajinka s rohy A (vlevo nahoře), E (vpravo nahoře), D (vpravo), C (dole) a B (vlevo); v každém rohu je zaražena svislá tyčka. Uprostřed stojí buzola s dioptrou, od níž vedou přímky ke všem pěti rohům. Buzola je kreslena otočená o 180°, jak ji vidí měřič při pohledu na obrazec – nahoře je O (Ostro – jih), vpravo nahoře G (Garbino – jihozápad), vpravo P (Ponente – západ), vpravo dole M (Maistro – severozápad), dole T (Tramontana – sever), vlevo dole G (Greco – severovýchod), vlevo L (Levante – východ) a vlevo nahoře S (Sirocco – jihovýchod); střelka míří k T. Pod obrazcem je signatura P.
poznamky:
- n: 1
  text: Horologietti che uien de Alemagna – malé přenosné sluneční hodiny s vestavěným kompasem (Kompasssonnenuhr), vyráběné hlavně v Norimberku a Augsburku; před odečtením času se musely kompasem natočit k severu.
- n: 2
  text: V tisku „pin accommode“ – tisková chyba (převrácené u) za „piu accommode“; v originále ponecháno. Podobně dále „oueramenta“ za „oueramente“. Závorka „(perche piu e manco…“ a „(de quelli .360.…“ není v tisku uzavřena.
