- typ: odstavec
  de: |-
    N. Vostra Signoria non me ne dica piu, perche mi bastaua della mita di questi che ho notati.
  cs: |-
    **Nicolò.** Vaše Milost {Vostra Signoria} mi už víc nemusí říkat, vždyť by mi stačila i polovina těch, které jsem si zapsal.
- typ: odstavec
  de: |-
    P. Me ne resta de dirui solamente sei altri, e pero compiteli, cioe ui sono anchora bombarde de lire.250.di balla di pietra, di longhezza piedi.10.e meggio, che uol di metallo lire.8900.& per condurle para.18.in.19.de buoui.
  cs: |-
    **Převor.** Zbývá mi říci vám už jen šest dalších, tak je dopište. Jsou ještě bombardy {bombarde} na 250 liber kamenné koule, dlouhé 10 a půl stopy, které potřebují 8900 liber kovu a k převozu 18 až 19 párů volů.
- typ: seznam
  de:
  - Altre da lire.150.longhe piedi.10.che uol di metallo lire.6146.& per condurle buoui para.12.
  - Altre da lire.100.longhe pur piedi.10.che uol di metallo lire.5500.& per condurle buoui para.11.
  - Altre pur da lire.100.longhe solamente piedi.8.e meggio, che uol di metallo lire.4500.& per condurle buoui para.9.
  - Anchora ui sono cortaldi da lire.45.longhi piedi.7.che uoleno di metallo lire.2740.& per condurli buoui para.5.
  - Vn'altra sorte de cortaldi da lire.30.longhi piedi.7.e meggio, uoleno di metallo lire.1600.& per condurli buoui para.3.& cosi faremo fine.
  cs:
  - Jiné na 150 liber, dlouhé 10 stop, které potřebují 6146 liber kovu a k převozu 12 párů volů.
  - Jiné na 100 liber, rovněž dlouhé 10 stop, které potřebují 5500 liber kovu a k převozu 11 párů volů.
  - Jiné rovněž na 100 liber, dlouhé jen 8 a půl stopy, které potřebují 4500 liber kovu a k převozu 9 párů volů.
  - Jsou ještě kortaldy {cortaldi}[^3] na 45 liber, dlouhé 7 stop, které potřebují 2740 liber kovu a k převozu 5 párů volů.
  - Jiný druh kortaldů na 30 liber, dlouhých 7 a půl stopy, které potřebují 1600 liber kovu a k převozu 3 páry volů. A tím skončíme.
poznamky:
- n: 1
  text: Passavolante – dlouhé dělo malé až střední ráže (kulverinového typu) na daleké střely.
- n: 2
  text: U kolubriny a kanonu na 30 liber nechal tisk pro délku a váhu kovu prázdné místo – údaje zřejmě chyběly už v převorově zápisníku.
- n: 3
  text: Cortaldo (kortald) – krátké těžké dělo velké ráže na kamenné koule.
