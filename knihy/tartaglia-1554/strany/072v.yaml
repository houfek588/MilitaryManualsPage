bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    falconetti, che saranno sotto à quelli argenetti per longo all'una, e l'altra cortina, e perche comprendo essere impossibile da potere essere ouiate tai difese da nemici, non credo che sariano cosi pazzi, per grossi che fusseno, che se mettessono à tal impresa, cioe à uoler dar battaglia à una citta, talmente fortificata, eglie ben uero, che tal forma è alquanto mostruosa da uedere, nel resto poi la commendamo assai.
  cs: |-
    falkonety {falconetti}, které budou stát pod oněmi náspky {argenetti} podél jedné i druhé kurtiny {cortina}. A protože chápu, že je nemožné, aby nepřátelé takové obraně zabránili, nevěřím, že by byli tak šílení, aby se – jakkoli početní – pustili do takového podniku, totiž chtít podniknout útok na takto opevněné město {citta}. Je ovšem pravda, že tento tvar je na pohled poněkud nestvůrný, ve všem ostatním ho však velmi chválíme.
- typ: odstavec
  de: |-
    N. Signor Clarissimo, se la natura hauesse principiato, & sempre continuato à far tutti gli huomini senza naso, et senza orecchie, et che dapoi per sorte ne facesse uno con il naso, et orecchie, certamente à tutti gli altri huomini pareria cosa mostruosa da uedere, il medesimo dico di questa nostra forma de fortificatione, la quale per esser molto diuersa dall'uso comune, à quella pare, & à molti altri parera mostruosa cosa da uedere, pur sia, come si uoglia, doue, che è necessario la fortezza, non si debbe far conto di bellezza.
  cs: |-
    **Nicolò.** Slovutný pane, kdyby příroda byla začala a pořád pokračovala dělat všechny lidi bez nosu a bez uší a potom náhodou udělala jednoho s nosem a ušima, jistě by se všem ostatním lidem zdál na pohled nestvůrný. Totéž říkám o tomto našem tvaru opevnění {fortificatione}: protože se velmi liší od obvyklého zvyku, zdá se Vaší Urozenosti a mnohým jiným se bude zdát na pohled nestvůrný. Ať je tomu jakkoli, tam, kde je třeba síly, se nemá hledět na krásu.
- typ: odstavec
  de: |-
    S. M. Eglie il uero.
  cs: |-
    **Pan Marcantonio.** To je pravda.
- typ: obrazek
  soubor: drevorez-144.jpg
  popis: |-
    Dřevořez k prvnímu tvaru opevnění z Dodatku, vytištěný na šířku (otočený o 90°) vedle úzkého sloupce textu; tentýž otisk je na proužku papíru přiloženém u [[071r|listu 71r]]. Perspektivní pohled na dva celé úseky kurtin s příkopem a vnějším náspem, zalomené v tupém úhlu dovnitř k městu. Ve vnitřním úhlu je bašta B s malými kulatými kavalíry 2 a 3 po stranách; na vnějších úhlech bašty A a C (u jejich boků drobná písmena S a X, srov. boky s.t. a u.x. v textu), od nichž pokračují části dalších kurtin k bodům D a E. Uprostřed temene kurtin malé čtyřhranné kavalíry F a G; na temeni kurtin řada šikmých příček s náspky (parianette), dvě z nich označeny P a R. Vnější břeh příkopu (násep) je označen M a L podél kurtiny A–B, K, H, I u bašty B, N a O podél kurtiny B–C; v předpolí před zalomením („zálivový prostor“) písmena Z, 4, Y. Nahoře měřítko s čísly 30 a 150 a písmenem R (120 kroků).
