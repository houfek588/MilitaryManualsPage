  de: |-
    altra forma, & con altre particolarita de piu. Et questo tal modo, ouer forma non solamente hauera in se quella nostra terza qualita, ouer conditione, che Vostra Magnificentia tanto desidera di uedere: ma hauera anchora in se la seconda, & terza, & piu, che la non potra esser danneggiata da nemici con le artegliarie, come, che sopra il disegno de due sole cortine intiere, & parte de due altre insieme congionte con le sue fosse, baluardi, & cauallieri alli suoi consueti luochi, à quella faro uedere, & toccare.
  cs: |-
    jiném tvaru a s několika dalšími zvláštnostmi navíc. A tento způsob neboli tvar bude mít nejen onu naši třetí vlastnost neboli podmínku, kterou si Vaše Urozenost tak přeje vidět, ale bude mít také druhou a třetí[^1] a navíc to, že mu nepřátelé nebudou moci uškodit dělostřelectvem {artegliarie}, jak Vaší Urozenosti ukážu a doložím na výkrese pouhých dvou celých kurtin {cortine} a části dvou dalších, spojených dohromady s jejich příkopy {fosse}, baštami {baluardi} a kavalíry {cauallieri} na obvyklých místech.
- typ: odstavec
  de: |-
    S. M. Questo hauero ben accaro di uedere.
  cs: |-
    **Pan Marcantonio.** To uvidím velmi rád.
- typ: odstavec
  de: |-
    N. Questo sotto scritto, Signor Clarissimo, è il disegno di quelle cortine di sopra narrate à Vostra Magnificentia, secondo la forma delle quale, uoglio, che siano fatte tutte le cortine, fosse, baluardi, & cauallieri, che circondano tal citta, cioe far, che ogni due cortine uadino à ingolfarsi con dui capi uerso il corpo della citta, formando un angolo ottuso, si come fanno le sotto scritte due a.b. & c.b. in ponto .b. & che li altri dui capi se istendino in fuora, causando con le altre due circonstante cortine dui alti angoli ottusi, uerso la campagna, come fanno le medesime sottoscritte .a.b. & .b.c. con le due parti .a.d. & .c.e. in li dui ponti .a. & .c. et in ciascun de detti angoli ui se gli debbe constituir un baluardo, secondo, che nelle dette moderne fortificationi si costuma con le sue canonere nella piazza da basso, che guardino non solamente le due circostante cortine, & fosse, ma anchora li dui circostanti baluardi: ma le canonere della piazza di sopra parte debbono guardare pur le due circostante cortine, fosse, & baluardi, et parte guardino minutamente quel spatio ingolfato dentro dalle lettere .o.y.4.z.m.l.k.h.i.n.o. & anchora la campagna di fuora dalle lettere .o.y.z.m. & massime li dui baluardi .a. & .c. non solamente debbono guardar la campagna, ma l'uno debbe guardar l'argine, che è opposito all'altro, cioe il baluardo .a. debbe guardar quel spacio, che è di fora dil ponto .o. & il baluardo .c. debbe guardare quel spacio, che è di fora del ponto .m. & il baluardo .b. non solamente debbe guardar per tutto il detto spatio, dentro delle dette lettere .o.y.4.z.m.l.k.h.i.n.o. & anchora di fora da dette lettere: ma particolarmente debbe guardare à longo, doue sono .k.l.m. & .i.n.o. Et fatto questo, uolendo seguir il moderno uso di fortificare, si debbe far nel meggio della summita de ciascuna cortina un caualleretto, si come sono li dui .f.g. non molto larghi, ne longhi, ma solamente di tal capacita, che ui possa star suso dui, ouer tre sacri, per cadauno, & l'officio de questi dui caualleretti sia principalmente di guardar li dui circostanti baluardi: & oltra di questo uoglio, che guardino quel spatio ingolfato, & anchora la campagna istrinseca, uero è, che il caualliero .f. forsi con difficulta potra guardare quella riuera de fora della fossa, che procede secondo le lettere .k.l.m. per esser troppo sotto di lui: ma tal riuera .k.l.m. sara commodamente guardata dall'altro caualleretto .g. & dal baluardo .b. & il detto caualliero .f. insieme con el detto baluardo .b. guardaranno commodamente la riuera, ouer argine, che procede secondo le lettere .i.n.o. Oltra di questo uoglio, che dal'una, et l'altra banda del baluardo .b. sia fatto un caualleretto piccolo quadrangolo (si come sono li dui .f. & .g.) oueramente tondo nella summita, si come sono li dui signati per .2. & .3. di tal capacita, che ui se possa accommodar sopra, pur dui, ouer tre sacri da .12. lire di balla per ciascadun de loro, & uoglio, che ciascaduno de loro sia talmente assettato, che possa guardare l'uno, & l'altro di dui baluardi .a. & .c. la qual cosa si potra fare facilmente:
  cs: |-
    **Nicolò.** Toto níže vyobrazené, slovutný pane, je výkres[^2] oněch kurtin, o nichž jsem Vaší Urozenosti vyprávěl výše; podle jejich tvaru chci, aby byly udělány všechny kurtiny, příkopy, bašty a kavalíry, které takové město {citta} obklopují. Totiž udělat to tak, aby se každé dvě kurtiny dvěma konci zalamovaly dovnitř k tělesu města a tvořily tupý úhel, jako to dělají níže vyobrazené dvě kurtiny a.b. a c.b. v bodě b.; a aby se jejich další dva konce rozbíhaly ven a tvořily se dvěma sousedními kurtinami dva další[^4] tupé úhly směrem do předpolí {campagna}, jako to dělají tytéž vyobrazené a.b. a b.c. se dvěma částmi a.d. a c.e. ve dvou bodech a. a c. A v každém z těchto úhlů se má zřídit bašta, jak je u zmíněných moderních opevnění zvykem, se střílnami {canonere} na dolní plošině {piazza da basso}, které by střežily nejen obě sousední kurtiny a příkopy, ale i obě sousední bašty. Střílny horní plošiny však mají zčásti rovněž střežit obě sousední kurtiny, příkopy a bašty a zčásti pečlivě střežit onen zálivový prostor[^3] uvnitř písmen o.y.4.z.m.l.k.h.i.n.o. a také předpolí vně písmen o.y.z.m. Zvláště obě bašty a. a c. mají střežit nejen předpolí, ale každá má střežit násep {argine} protilehlý té druhé, totiž bašta a. má střežit prostor, který je vně bodu o., a bašta c. prostor, který je vně bodu m. Bašta b. pak má střežit nejen celý zmíněný prostor uvnitř uvedených písmen o.y.4.z.m.l.k.h.i.n.o. a také vně nich, ale zvláště má střežit podélně tam, kde jsou k.l.m. a i.n.o. Když se to udělá a chce-li se zachovat moderní zvyk opevňování, má se uprostřed temene každé kurtiny udělat malý kavalír {caualleretto}, jako jsou ty dva f.g., ne příliš široký ani dlouhý, ale jen tak prostorný, aby se na každý vešla dvě nebo tři sakry {sacri}; úkolem těchto dvou malých kavalírů ať je především střežit obě sousední bašty. A kromě toho chci, aby střežily onen zálivový prostor a také vnější předpolí. Je ovšem pravda, že kavalír f. bude snad jen obtížně střežit onen břeh {riuera} vně příkopu, který probíhá podle písmen k.l.m., protože leží příliš pod ním; tento břeh k.l.m. však pohodlně ostřeží druhý malý kavalír g. a bašta b. A zmíněný kavalír f. spolu se zmíněnou baštou b. pohodlně ostřeží břeh neboli násep, který probíhá podle písmen i.n.o. Kromě toho chci, aby se z jedné i druhé strany bašty b. udělal malý kavalír, nahoře čtyřhranný (jako jsou ty dva f. a g.), nebo kulatý, jako jsou ty dva označené 2. a 3., tak prostorný, aby se na každý z nich daly umístit také dvě nebo tři sakry na kouli o 12 librách {lire}; a chci, aby každý z nich byl postaven tak, aby mohl střežit jednu i druhou z obou bašt a. a c., což se dá snadno provést:
- typ: obrazek
  soubor: drevorez-141.jpg
  popis: |-
    Proužek papíru přiložený u skenu vpravo vedle listu 71 (není součástí sazby této strany) s otiskem téhož dřevořezu, který je v tisku na straně [[072v|72v]]; podrobný popis je tam. Obraz je otočený o 90°: dvě celé kurtiny zalomené v tupém úhlu dovnitř k městu s baštou B ve vnitřním úhlu a malými kulatými kavalíry 2 a 3 po jejích stranách, bašty A a C na vnějších úhlech, části dalších kurtin k bodům D a E, malé čtyřhranné kavalíry F a G uprostřed kurtin, příčky na temeni kurtin (P, R), vnější břeh příkopu s písmeny M, L, K, H, I, N, O, v předpolí písmena Z, 4, Y a měřítko 30–150 se značkou R.
poznamky:
- n: 1
  text: V tisku „la seconda, & terza“ – třetí vlastnost je však jmenována už v předchozí větě; patrně má jít o druhou a čtvrtou (nebo jinou) vlastnost. Chyba předlohy, ponechána.
- n: 2
  text: Výkres je v tisku otištěn na straně [[072v|72v]]. Na skenu 141 je vpravo vedle listu 71 přiložen proužek papíru se stejným dřevořezem; edice ho uvádí i zde, ale jde o týž obraz.
- n: 3
  text: Spatio ingolfato – prostor „zálivu“ před kurtinami zalomenými dovnitř, který je ostřelován z více stran (třetí podmínka šesté knihy).
- n: 4
  text: V tisku „dui alti angoli ottusi“ (dva vysoké tupé úhly), patrně tisková chyba za „altri“ (další); překládáno podle smyslu.
