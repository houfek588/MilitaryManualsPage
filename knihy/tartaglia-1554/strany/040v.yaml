  de: |-
    della prima, et cosi con tai auisi ragioneuoli, alcuni sono andati uariando tal ordine per fin à questi tempi, uero è, che ui sono alcuni ordini delli sopra notati, che con poca ragion, & manco giudicio sono stati ordinati, anzi credo che siano stati alcuni, che per non uoler far, come faceuano gli altri) per mostrar di saper piu di loro) senza altra ragione hanno uoluto formar nuoui ordini, cioe crescendo il carbone, & sminuendo il solfere, altri in crescere il solfere, & sminuire il carbone, altri uariando tutti tre li detti materiali in certe stranie proportioni, accio che para con maggior sapientia, & sottilita ritrouato.
  cs: |-
    než první. A tak s takovými rozumnými nápady někteří až do dnešní doby ten předpis obměňovali. Je ovšem pravda, že některé z výše zapsaných předpisů byly stanoveny s malým rozumem a ještě menším úsudkem; ba myslím, že byli i někteří, kteří – aby nedělali, co dělali jiní, a ukázali, že vědí víc než oni – bez jiného důvodu chtěli vytvořit nové předpisy, totiž přidáváním uhlí a ubíráním síry, jiní přidáváním síry a ubíráním uhlí, jiní obměňováním všech tří přísad v jakýchsi podivných poměrech, aby se zdálo, že to nalezli s větší moudrostí a důvtipem.
- typ: odstavec
  de: |-
    P. Eglie questo, si come sono anchora quelli compositori, che non sanno dire, ne fare, se non quello, che hanno detto, ouer fatto gli altri, ma perche si uergognano alle uolte apparere che habbiano imparato, ouer tolto da quelli tali se sforzan di uariar alquanto il modo, ouer il parlare.
  cs: |-
    **Převor.** Je to tak, jako je tomu i s těmi spisovateli, kteří nedovedou říci ani udělat nic jiného, než co řekli nebo udělali jiní; ale protože se někdy stydí, aby nebylo vidět, že se to od nich naučili nebo to od nich převzali, snaží se poněkud obměnit postup nebo vyjádření.
