  text: Radice propinqua – „blízká“ odmocnina, tj. celá část druhé odmocniny nečtvercového čísla (u 4000 je to 63, neboť 63² = 3969 a 64² = 4096); přebytek nad čtvercem (zde 31) zůstává mimo šik.
