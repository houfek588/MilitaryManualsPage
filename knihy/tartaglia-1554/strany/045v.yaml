  de: |-
    della nostra radice, cioe el treppio de sessantatre, che saria .189. et .189. file à fanti .21. per fila ue ne peruenira.
  cs: |-
    naší odmocniny {radice}, totiž trojnásobek šedesáti tří, což by bylo 189; a 189 řad {file} po 21 pěšácích {fanti} v řadě vám z toho vzejde.
- typ: odstavec
  de: |-
    C.H. Doue sapro io doue se debbia mettere quelle due, & due file de archibuseri, per cognoscere el luoco doue se debbia smembrare in tre parte per metterli in battaglia quadra di gente.
  cs: |-
    **Hrabě Hieronimo.** Jak se dozvím, kam se mají postavit ty dvě a dvě řady arkebuzírů {archibuseri}, aby se poznalo místo, kde se má [sled] rozčlenit na tři části, když je chceme postavit do šiku čtvercového co do mužstva {battaglia quadra di gente}?
- typ: odstavec
  de: |-
    N. La uostra radice (cioe sessantatre) ui da el tutto, cioe, che tal diuisione se fa alle .63. & .63. file talmente, che la prima parte sara de sessantatre file, & cosi etiam la seconda, & la terza.
  cs: |-
    **Nicolò.** Vaše odmocnina (totiž šedesát tři) vám dá všechno: to rozdělení se provede vždy po 63 a 63 řadách, takže první část bude mít šedesát tři řad, a stejně tak i druhá a třetí.
- typ: odstavec
  de: |-
    C.H. Ve ho inteso benissimo in quanto a questa parte, e pero seguitate.
  cs: |-
    **Hrabě Hieronimo.** Pokud jde o tuto část, porozuměl jsem vám velmi dobře, a proto pokračujte.
- typ: odstavec
  de: |-
    N. Ma se nel partire la uostra radice per tre ui auanzasse uno (come accaderia se li proposti fanti fusseno .5776. che la radice di quelli saria settantasei, la qual radice diuidendola per tre, ne ueneria .25. & auanzeria uno: hor dico, che tutte le file, che reusciran de questi tai fanti saranno pur el treppio della radice, cioe el treppio de settantasei, che saria .228. & perche tutta questa fila de file ua diuisa sempre in tre parti (come di sopra fu detto, etiam fatto) a settantasei file per parte (cioe tanto quanto è la nostra radice) hor dico, che la prima, & la ultima de queste tre parte, si debbano far caminar a uinticinque fanti per fila, cioe quanto che è il terzo della nostra radice, & perche el ne auanzo uno (come di sopra appare) dico che quel tal .1. si debbe mettere sempre nella seconda parte, cioe in quella di mezzo, cioe facendo caminar quelli della detta seconda parte à .26. fanti per fila, talmente, che la prima, & la ultima parte della gran fila delle file, saranno à .25. fanti per fila, & la seconda parte sara de fanti .26. per fila, & il medesimo si debbe fare in ogni altra radice, che partita per .3. ue auanzi solamente .1. ma quando l'auanzasse .2. seguita tutto al contrario, cioe, che la prima, & la ultima parte uuol esser de uno fante de piu, di quello sara el terzo della nostra radice, come, essempi gratia se li detti fanti fusseno .2809. la sua radice sara .53. la qual partita per tre, ne uien .17. & auanza .2. e per tanto dico, che tai fanti se ne formara file .159. (cioe el treppio de .53.) le quale file .159. diuidendole pur in tre parti, ne uenira .53. per parte, cioe el numero della radice, & la prima, & terza parte uol esser de uno fante de piu del terzo della nostra radice, cioe uoleno esser de fanti .18. per fila, & la seconda parte, cioe la parte de mezzo, uol esser puramente el terzo della nostra radice, cioe de fanti .17. per fila talmente, che de tutte le .159. file, le prime .53. file, & cosi le ultime .53. file uoranno esser de fanti .18. per fila, & le .53. file di mezzo uoranno esser solamente de fanti .17. per fila. Et in quella che nel partire la radice per .3. auanza solamente uno ua al contrario di questa, cioe, che la prima, & terza parte della detta gran fila delle file, uoleno sempre tanti fanti per fila, quanto sara la terza parte integra della nostra radice, & la parte di mezzo, cioe la seconda uora uno fante de piu del ditto terzo della nostra radice. Et perche mai puo auanzar piu che uno, ouer dui, à partire la detta nostra radice per .3. le dette nostre regole ue satisfaranno in ogni quantita de fanti si quadrata, ouer non quadrata, perche, come di sopra fu detto, nelle quantita, ouer numeri non quadrati, sempre se piglia la radice propinqua di quel tal numero, & di quella se ne serue, come di sopra è stato detto, & de quello residuo, ouer superfluo de fanti, che soperchiasseno el quadrato di tal radice el sargente li assetta secondo el suo parere, essempi gratia, se li detti fanti fusseno quattromilla, el qual numero non è quadrato, nondimeno dico, che di quello se debbia cauar la sua radice propinqua, la quale sara 63. (uero è, che
  cs: |-
    **Nicolò.** Kdyby však při dělení vaší odmocniny třemi zbyla jedna (jak by se stalo, kdyby zadaných pěšáků bylo 5776; jejich odmocnina by byla sedmdesát šest, a když ji dělíme třemi, vyšlo by 25 a zbyla by jedna), pravím, že všech řad, které z těchto pěšáků vzejdou, bude opět trojnásobek odmocniny, totiž trojnásobek sedmdesáti šesti, což by bylo 228. A protože celý tento sled řad {fila de file} se vždy dělí na tři části (jak bylo výše řečeno i provedeno), po sedmdesáti šesti řadách na část (tj. tolik, kolik činí naše odmocnina), pravím, že první a poslední z těchto tří částí se mají nechat pochodovat po dvaceti pěti pěšácích v řadě, tj. kolik činí třetina naší odmocniny. A protože zbyla jedna (jak je vidět výše), pravím, že tu jednu je třeba dát vždy do druhé části, tj. do prostřední, a nechat ty z druhé části pochodovat po 26 pěšácích v řadě; tak budou první a poslední část velkého sledu řad po 25 pěšácích v řadě a druhá část po 26 pěšácích v řadě. Totéž se má udělat u každé jiné odmocniny, z níž po dělení třemi zbude jen 1. Když však zbudou 2, je tomu zcela naopak: první a poslední část má mít o jednoho pěšáka víc, než činí třetina naší odmocniny. Například kdyby těch pěšáků bylo 2809, jejich odmocnina bude 53; ta dělená třemi dá 17 a zbudou 2. Pravím tedy, že z těch pěšáků se utvoří 159 řad (tj. trojnásobek 53); když se těch 159 řad rozdělí opět na tři části, vyjde 53 na část, tj. číslo odmocniny. První a třetí část má mít o jednoho pěšáka víc, než je třetina naší odmocniny, totiž po 18 pěšácích v řadě, a druhá, prostřední část má mít právě třetinu naší odmocniny, totiž po 17 pěšácích v řadě; takže ze všech 159 řad prvních 53 a stejně tak posledních 53 řad bude po 18 pěšácích v řadě a prostředních 53 řad jen po 17 pěšácích v řadě. V onom případě, kdy při dělení odmocniny třemi zbude jen jedna, je tomu naopak: první a třetí část zmíněného velkého sledu řad mají vždy tolik pěšáků v řadě, kolik činí celá třetina naší odmocniny, a prostřední, tj. druhá část bude mít o jednoho pěšáka víc než ta třetina naší odmocniny. A protože při dělení naší odmocniny třemi nemůže nikdy zbýt víc než jedna nebo dvě, tato naše pravidla vám postačí pro každý počet pěšáků, čtvercový i nečtvercový. Neboť jak bylo řečeno výše, u nečtvercových počtů neboli čísel se vždy vezme nejbližší odmocnina {radice propinqua}[^1] toho čísla a s ní se pracuje, jak bylo řečeno výše; a ten zbytek neboli přebytek pěšáků, o který by [jejich počet] přesahoval čtverec té odmocniny, rozestaví šikovatel {sargente} podle svého uvážení. Například kdyby těch pěšáků bylo čtyři tisíce, což není čtvercové číslo, pravím přesto, že se z něho má vytáhnout nejbližší odmocnina, a ta bude 63 (ovšem
