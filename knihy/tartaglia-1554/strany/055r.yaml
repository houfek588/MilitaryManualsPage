  de: |-
    & una fra Ponente, & Ostro, & una fra Ostro, & Leuante. Anchora cadauna di queste quattro parti se diuide pur in due parti eguali, & quella diuisione che fra Leuante, & Tramontana, ui se scriue Grego, & à quella che è fra Tramontana, e Ponente, ui se scriue Maistro, & à quella che è fra Ponente, & Ostro, ui se scriue Garbino. Et à quella, che è fra Ostro, e Leuante, ui se scriue Sirocco, & cosi la circonferentia di tal primo cerchio uenira à esser diuisa in otto parti eguali, & cadauna di quelle diuisioni se chiama uento, e pero tal circonferentia sera diuisa in otto uenti, & cadauno de quelli si chiama, come di sopra è stato detto, nondimeno per abbreuiar scrittura in luoco di Leuante, ui se scriue un .L. et in luoco di Ponente, ui se scriue un .P. & in luoco di Tramontana, ui se scriue un .T. & in luoco di Ostro, ui se scriue un .O. & in luoco di Grego, ui se scriue un .G. & in luoco di Garbino, ui se scriue un'altro .G. & in luoco di Maistro, ui se scriue un .M. & in luoco de Sirocco, ui se scriue un .S. come di sotto nella figura appare. Anchora se diuide cadauna di quelle ottaue parti di detta circonferentia, primamente in tre parti eguali, & cadauna di quelle terze parti se diuide anchora in altre tre parti eguali, & cadauna di queste ultime parti (essendo lo detto tondo di lamma, di competente grandezza) si debbono ultimamente diuidere in cinque parti eguali, il che facendo se trouara tutta la circonferentia del detto primo cerchio esser diuisa in .360. parti eguali (secondo l'ordine, & diuisione delli antichi chorographi) & cadauna di queste tal parti se chiama grado, & accio che tai diuisioni, siano apparente se segnano cadauna con una lineeta longa una meggia costa di cortello, et queste tai lineete (accio che tutte tendano al centro di tal cerchio) se descriuono con una rega giustando tal rega con il centro di tal cerchio, & con il ponto di quella diuisione che si uol signare nella detta circonferentia, & accio che tai diuisioni si possano con facilita numerare (occorrendo il bisogno) à ogni cinque de tai diuisioni piccole ui se fa una diuisione che trauersi tutto quel spacio che è fra la circonferentia del detto primo cerchio, & la circonferentia del secondo. Ma se per caso il sopradetto tondo di lamma, fusse talmente piccolo, che quelle ultime terze parti non fusseno atte, per la sua piccolezza, à esser diuise nelle sopradette cinque parti eguali, se lassariano star cosi, per il che la circonferentia del detto primo cerchio ueneria à esser diuisa solamente in .72. parti eguali, onde facendo tai .72. parti, apparente con il tirarui quella lineeta per fina alla circonferentia del menor cerchio secondo l'ordine detto di sopra, cioe che tutte le dette lineete tendano al centro delli detti cerchij, si come appare nella figura sottoscritta, ma bisogna notare che si ben la circonferentia di tal lamma, per la sua piccolezza, sara diuisa solamente nelle sopradette .72. parti eguali, come nella detta sottoscrita figura appare, nondimeno tutta la detta circonferentia con lo intelletto se debbe intendere esser diuisa pur nelle dette .360. parti eguali, cioe in .360. gradi, & pero nel computar le sottoscritte .72. diuisioni, per cadauna di quelle, ui se computa cinque gradi, perche .5. fia .72. uien à fare li detti .360. gradi, & dapoi che se haueran fatte tutte queste cose, ouer diuisioni, ui se debbe far assaldare una armilla della medesima sorte di banda di ottone, ouer di rame à torno al centro, cioe uno cerchio della detta banda larga almen dui dedi, qual uenghi affare à modo di una scatolina à torno al detto centro della detta prima lamma circolare, talmente che sia concentrica con quella, & nel
  cs: |-
    jeden mezi Ponente a Ostrem a jeden mezi Ostrem a Levante. Dále se každý z těchto čtyř dílů rozdělí ještě na dva stejné díly: k dělicímu bodu mezi Levante a Tramontanou se napíše Grego [severovýchod], k tomu, který je mezi Tramontanou a Ponente, se napíše Maistro [severozápad], k tomu, který je mezi Ponente a Ostrem, se napíše Garbino [jihozápad], a k tomu, který je mezi Ostrem a Levante, se napíše Sirocco [jihovýchod]. Tak bude obvod prvního kruhu rozdělen na osm stejných dílů; každý z těchto dělicích bodů se nazývá vítr {uento}, a proto bude ten obvod rozdělen na osm větrů[^1] a každý z nich se jmenuje, jak bylo řečeno výše. Pro zkrácení zápisu se však místo Levante napíše L, místo Ponente P, místo Tramontany T, místo Ostra O, místo Grega G, místo Garbina další G, místo Maistra M a místo Sirocca S, jak je vidět níže na obrazci. Dále se každá z těch osmin obvodu rozdělí nejprve na tři stejné díly, každá z těch třetin se rozdělí opět na tři stejné díly a každý z těchto posledních dílů (je-li ten plechový kotouč přiměřené velikosti) se má nakonec rozdělit na pět stejných dílů. Když se to udělá, ukáže se, že celý obvod prvního kruhu je rozdělen na 360 stejných dílů (podle řádu a dělení starých chorografů) a každý z těchto dílů se nazývá stupeň {grado}. Aby byly tyto dílky zřetelné, vyznačí se každý čárkou dlouhou jako polovina hřbetu nože; tyto čárky se (aby všechny směřovaly ke středu toho kruhu) rýsují podle pravítka, které se přiloží ke středu kruhu a k bodu toho dělení, který se má na obvodu vyznačit. A aby se tyto dílky daly (bude-li třeba) snadno počítat, udělá se po každých pěti takových malých dílcích čárka, která protne celý prostor mezi obvodem prvního a obvodem druhého kruhu. Kdyby však zmíněný plechový kotouč byl náhodou tak malý, že by ty poslední třetiny pro svou malost nebylo možné rozdělit na zmíněných pět stejných dílů, nechaly by se tak, takže obvod prvního kruhu by byl rozdělen jen na 72 stejné díly. Těchto 72 dílů se zviditelní tím, že se ona čárka protáhne až k obvodu menšího kruhu podle výše řečeného řádu, totiž aby všechny čárky směřovaly ke středu těch kruhů, jak je vidět na obrazci níže. Je však třeba si uvědomit, že ačkoli obvod takového plechu bude pro svou malost rozdělen jen na zmíněných 72 stejných dílů, jak je vidět na obrazci níže, přesto je třeba si celý obvod v duchu představovat rozdělený na zmíněných 360 stejných dílů, tj. na 360 stupňů; proto se při počítání níže uvedených 72 dílků počítá na každý z nich pět stupňů, protože 5krát 72 dává zmíněných 360 stupňů. Když se všechny tyto věci neboli dělení udělají, má se kolem středu dát připájet obruč {armilla} z pásu téhož mosazného nebo měděného plechu, tj. kruh z toho pásu široký nejméně dva prsty {dedi}, který bude kolem středu té první kruhové desky tvořit jakési pouzdro {scatolina}, a to tak, aby s ní byl soustředný. Do
