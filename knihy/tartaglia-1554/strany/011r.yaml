bloky:
- typ: odstavec
  de: |-
    S.D. Questo ui concedo ben, cioè che tirando o rettamente in suso uerso il cielo, ouer rettamente in zoso uerso il centro del mondo, che il transito, ouer moto di tal balla, sia totalmente retto. & anchora ui concedo che in tai dui uersi tal balla uada molto piu per linea retta che in qual si uoglia altra elleuatione, ouer in qual si uoglia altro uerso. Ma che in ogni altro uerso delli detti dui in fuora la non uada parte alcuna del suo moto rettamente, cioè per retta linea, la non mi pare cosa da credere, ne io la credo, perche se ben ue aricordati di sopra dicesti che per quelli dui tiri a Verona tirati, uoi trouasti che la detta colobrina da lire .20. tiraua de mira, cioè per retta linea in quanto al senso, circa passa .200. essendo aliuellata, hor se tal tramito de passa .200. uoi trouati poi con ragione non esser totalmente retto, cioè totalmente per linea retta, io uel credo, et uel concedo. Ma se tal pezzo non puol tirare per retta linea li detti passa .200. non uoleti concedere che una tal machina ne tiri al manco la mita, cioè passa .100. & se non .100. al men .50.
  cs: |-
    **Pan vévoda.** To vám jistě přiznávám, totiž že když se střílí přímo vzhůru k nebi nebo přímo dolů ke středu světa, je dráha čili pohyb takové koule {balla} zcela přímý; a přiznávám vám také, že v těchto dvou směrech letí koule mnohem víc po přímce {linea retta} než při kterékoli jiné elevaci {elleuatione} čili v kterémkoli jiném směru. Ale že by v každém jiném směru kromě těchto dvou neletěla přímo, tj. po přímce, žádnou částí svého pohybu, to se mi nezdá k uvěření a nevěřím tomu. Neboť jestli si dobře vzpomínáte, řekl jste výše, že podle oněch dvou výstřelů vypálených ve Veroně jste zjistil, že zmíněná kolubrina {colobrina} na kouli o 20 librách {lire} dostřelila vodorovně po mířidlech {de mira}, tj. po přímce, nakolik to lze smysly posoudit, asi 200 kroků {passa}. Jestliže pak tuto dráhu {tramito} 200 kroků rozumem shledáváte nikoli zcela přímou, tj. ne zcela po přímce, tomu věřím a to přiznávám. Ale když takové dělo {pezzo} nemůže po přímce dostřelit zmíněných 200 kroků, nechcete připustit, že takový stroj dostřelí aspoň polovinu, totiž 100 kroků, a ne-li 100, tedy aspoň 50?
- typ: odstavec
  de: |-
    N. Non solamente la non tirara li detti passa .50. per linea perfettamente retta, ma la non tirara un passo solo.
  cs: |-
    **Nicolò.** Nejenže nedostřelí zmíněných 50 kroků po dokonale přímé čáře, ale nedostřelí tak ani jediný krok.
- typ: odstavec
  de: |-
    S.D. Eglie una pacia la uostra.
  cs: |-
    **Pan vévoda.** To je od vás bláznovství.
- typ: odstavec
  de: |-
    N. La ragione è quella che acquieta lo intelletto delli huomini, perche quella, ne discerne il uero dal falso.
  cs: |-
    **Nicolò.** Rozum je to, co uspokojuje lidskou mysl, neboť on nám rozlišuje pravdu od nepravdy.
- typ: odstavec
  de: |-
    S.D. Eglie il uero.
  cs: |-
    **Pan vévoda.** To je pravda.
- typ: odstavec
  de: |-
    N. Dapoi adunque che la opinione di uostra Eccellentia è che la balla tirata da tal colobrina aliuellata, debbia andare una parte del suo transito, ouer moto uiolente per linea retta, & il restante poi per linea curua stante che questo fusse il uero, uoria sapere da quella, qual è la causa propria che tal balla uada cosi per linea retta, in quella parte, doue che quella suppone che uada cosi rettamente, & quala sia medesimamente la causa che lei uada cosi per linea curua, in quella parte, doue suppone uostra Eccellentia che uada cosi curuamente.
  cs: |-
    **Nicolò.** Když je tedy mínění Vaší Excelence takové, že koule vystřelená z takové kolubriny ve vodorovné poloze {aliuellata} má jednu část své dráhy čili násilného pohybu {moto uiolente} letět po přímce a zbytek pak po křivce, chtěl bych od Vás – za předpokladu, že je to pravda – vědět, jaká je vlastní příčina, že koule letí po přímce v té části, kde podle Vašeho předpokladu letí přímo, a stejně tak jaká je příčina, že letí po křivce v té části, kde podle předpokladu Vaší Excelence letí zakřiveně.
- typ: odstavec
  de: |-
    S.D. La grandissima uelocita che se ritroua nel moto di tal balla, nel uscir della bocca del pezzo, è la propria causa che tal balla per un poco di tempo, ouer spacio uada rettamente per aere, ma dapoi mancando alquanto in quella il uigore, & la uelocita, comincia poi ad alentarse & ad abbassarse successiuamente uerso terra, & cosi ua continuando per fin che percuote sopra quella.
  cs: |-
    **Pan vévoda.** Převeliká rychlost, kterou má pohyb takové koule, když vylétá z ústí {bocca} děla, je vlastní příčinou, že koule po krátký čas čili kus prostoru letí vzduchem přímo; ale když pak její síla a rychlost poněkud ochabne, začne se zpomalovat a postupně klesat k zemi, a tak pokračuje, dokud na ni nedopadne.
- typ: odstavec
  de: |-
    N. Certamente uostra Eccellentia non potea risponder meglio di quello ha risposto, cioè a dire che la gran uelocita è la propria causa, di redure il moto di tal balla (se possibil è) alla rettitudine, & similmente, il mancar della uelocita in quella, e la propria causa di farla tendere & declinare nel suo moto curuamente uerso terra, & quanto piu ua mancando in quella la detta uelocita, tanto piu fa maggiore la sua declinatione, ouer curuita, & tutto questo procede, perche ogni corpo graue spinto uiolentemente per aere, quanto piu ua ueloce, tanto piu in tal moto se fa men graue, e pero ua piu rettamente per aere, perche lo aere piu facilmente sostenta un corpo quanto piu eglie leue, tamen nel far di suoi effetti in tal moto assumme molto maggior grauita della sua propria, e pero quanto piu un corpo graue ua ueloce (nel moto uiolente) tanto maggior effetto fa in ogni resistente. Similmente quanto piu ua mancando in quello la uelocita, tanto piu in tal moto gli ua crescendo la grauita, la qual grauita, continuamente lo ua stimulando, & tirando uerso terra. Ma nel far de suoi effetti in tal moto assumme maggior leuita, ouer minor grauita, e pero fa minor effetto.
  cs: |-
    **Nicolò.** Vaše Excelence jistě nemohla odpovědět lépe, než odpověděla: totiž že velká rychlost je vlastní příčinou, která přivádí pohyb takové koule (pokud je to možné) k přímosti, a podobně že ubývání rychlosti je vlastní příčinou, proč se koule ve svém pohybu zakřiveně odklání a sklání k zemi; a čím víc jí rychlosti ubývá, tím větší je její sklon {declinatione} čili zakřivení. To vše pochází z toho, že každé těžké těleso hnané násilně vzduchem se v tomto pohybu stává tím méně těžkým, čím rychleji letí, a proto letí vzduchem přímočařeji, neboť vzduch nese těleso tím snáze, čím je lehčí; avšak při svých účincích nabývá v tomto pohybu tíže mnohem větší, než je jeho vlastní, a proto čím rychleji těžké těleso (v násilném pohybu) letí, tím větší účinek má v každé překážce. Podobně čím víc mu ubývá rychlosti, tím víc mu v tomto pohybu přibývá tíže, a ta tíže je neustále pobízí a táhne k zemi; ale při svých účincích nabývá v tomto pohybu větší lehkosti čili menší tíže, a proto má menší účinek.[^1]
- typ: odstavec
  de: |-
    S.D. Questo uostro discorso non me dispiace, e pero seguitate.
  cs: |-
    **Pan vévoda.** Tento váš výklad se mi zamlouvá, pokračujte tedy.
- typ: odstavec
  de: |-
    N. Dico adunque che da queste cose dette, & per ragion naturale approbate, nasce
  cs: |-
