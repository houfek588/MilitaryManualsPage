poznamky:
- n: 1
  text: |-
    Tartaglia tu vykládá, ještě v rámci předgalileovské fyziky, že rychle letící koule je „lehčí“ (vzduch ji snáze nese, a proto letí přímočařeji), ale při nárazu působí, jako by byla těžší (tj. má větší ráznost); se ztrátou rychlosti naopak „těžkne“ a padá k zemi.
