    **Dělostřelec.** Chci vám vyprávět příhodu, nad kterou se jistě velmi podivíte, a je to tato. Když jsem jednou vedl ostřelování {batteria}, stalo se po mnoha výstřelech, že se dělo pro jakousi nehodu při
poznamky:
- n: 1
  text: „Io non ho grammatica“ – doslova „nemám gramatiku“, tj. neznám latinu, nemám školní vzdělání.
- n: 2
  text: Arti mecaniche a arti liberali – řemeslná (mechanická) umění a svobodná umění; středověké a renesanční dělení dovedností.
