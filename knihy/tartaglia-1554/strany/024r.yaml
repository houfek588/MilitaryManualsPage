  de: |-
    BOMBARDIERO. Ve uoglio raccontar una nouella, della quale son certo ue ne marauigliareti molto, la qual è questa. Ritrouandomi una uolta à fare una batteria, & dapoi molti tiri, accadete che per uno certo disconcio, il pezzo nel
