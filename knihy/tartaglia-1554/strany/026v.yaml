    Dvacátý čtvrtý dotaz, který položil týž mistr Alberghetto
- typ: odstavec
  de: |-
    ALBERGHETTO. Vn'altro dubbio ue uoglio addimandare. Accadete una uolta, che prouandosi alcuni pezzi à lio, uno de ditti pezzi dapoi alcuni tiri nel discargarse, andete con la testa dauanti in terra, cioe con la bocca, et subito che tal pezzo fu gionto con la detta bocca in terra (doue era molta sabbia, ouer sabbione) tiro
  cs: |-
    **Alberghetto.** Chci se vás zeptat ještě na jednu pochybnost. Jednou se stalo, že když se na Lidu[^1] zkoušelo několik děl {pezzi}, jedno z nich po několika ranách při výstřelu dopadlo předkem, to jest ústím, na zem; a jakmile se to dělo ústím dotklo země (kde bylo mnoho písku neboli hrubého písku), vtáhlo
poznamky:
- n: 1
  text: „à Lio“ – benátsky Lido, písčitý ostrov oddělující benátskou lagunu od moře; na jeho plážích se zkoušela děla odlitá v Arzenálu.
