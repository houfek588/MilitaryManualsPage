- typ: odstavec
  pokracovani: true
  de: |-
    un segno propinquo è sempre suggetto à dar alquanto di sotto dal segno, cioe piu basso del segno, & che tal bassezza non puo eccedere la grossezza d'un dedo, o poco piu, & io ho uisto molti, che con uno medesimo schioppo, in una non molto longa distantia tirando de continuo à un segno hauer dato talhora molto di sopra dal segno, & talhora molto di sotto, & talhora molto costero, & talhora nel proprio segno, e per tanto ue adimando la causa di questo inconueniente, il quale me pare esser molto discordante à tutte le uostre ragioni adutte in tutte le uostre argumentationi.
  cs: |-
    blízký cíl {segno} vždy náchylný trefit poněkud pod cíl, to jest níž než cíl, a že toto snížení nemůže přesáhnout tloušťku jednoho prstu {dedo} nebo o málo víc. Viděl jsem však mnoho střelců, kteří touž ručnicí {schioppo} na nepříliš velkou vzdálenost, když stříleli bez přestání do cíle, trefili jednou hodně nad cíl, jindy hodně pod něj, jindy hodně stranou {costero} a jindy přímo do cíle. Ptám se vás proto po příčině tohoto rozporu, který se mi zdá velmi nesouhlasit se všemi důvody, jež jste uvedl ve všech svých výkladech.
- typ: odstavec
  de: |-
    N. Bisogna sapere, che tutti gli errori occorrenti nel tirar de schioppo, alcuni ponno esser causati solamente dalle mire, & alcuni altri solamente per difetto da colui che tira, & alcuni altri per difetto dell'uno, & dell'altro, cioe & dalle mire, & da colui che tira. Gli errori adunque, delli quali nelle precedente nostre argumentationi hauemo parlato, sono quelli che solamente dalle mire ponno esser causati, non interponendoui alcuno minimo difetto de colui, che tira (come piu uolte alli suoi lochi è stato detto) perche gli errori che procedeno simplicemente dalle due mire hanno in se regola è misura, come alli suoi lochi è stato detto, ma quelli che simplicemente procedeno per difetto di colui che tira, non hanno in se alcun ordine, ouer regolarita, perche la maggior parte de tai errori, procedeno per causa de qualche mouimento, che ha fatto con il schioppo colui che tira, dapoi che ha presa la mira, ouer nel discargar del schioppo, perche ogni minimo moto fatto in quello istante, che se discarga il detto schioppo puo causar grande errore al luoco, ouer al segno doue se tira de mira, & tanto piu quanto piu tal segno sara lontano, & perche tal mouimento del schioppo (qual puo occorrere, per il menar del fiato, ouer per il batter del polso, ouer per tremar della mano) non ha in si regolarita alcuna, e per tanto quando che il segno fusse ben precisamente nel ponto doue concorre la linea uisuale con il uiaggio qual doueria far la balla (nel qual luoco alla ragion delle mire lui doueria dar precisamente in brocca) nondimeno quel tale, mouendo il schioppo lui è soggetto à errare in tutti i uersi, cioe che eglie soggetto si à dar di sopra, come di sotto dal segno, & cosi anchora à dar costero si dalla banda destra, come dalla sinistra, uero è, che eglie etiam soggetto à dar per sorte in brocca, & tutti questi medesimi accidenti gli puo accasare quando che il segno fusse di qua, ouer di la di tal concorso, uero è, che quando il detto segno fusse di la da tal concorso, gli errori si causano maggiori (per la gran distantia) di quello fariano essendo di qua, per esser piu propinquo, perche in uero quanto piu il segno è propinquo à colui, che tira, tanto piu ogni specie di errore se sminuisse in lui, e pero tanto piu se è soggetto à darui dentro, ouer à far piu bella botta, come fu detto nel precedente quesito, & à tutti questi medesimi accidenti, anchora è soggetto quando che nelle mire fusse qualche difetto, cioe che per il mouimento del detto schioppo lui è soggetto à dare si di sopra, come di sotto del segno, & etiam costero. Anchora eglie soggetto à dar precisamente in brocca, perche quel moto del schioppo, potria per sorte esser tale che medicaria il difetto delle mire, & daria in brocca, uero è, che non saria per suo sapere, ma solamente per sorte.
  cs: |-
    **Nicolò.** Je třeba vědět, že ze všech chyb, které se při střelbě z ručnice vyskytují, mohou být některé způsobeny jen mířidly {mire}, jiné jen vinou toho, kdo střílí, a jiné vinou obojího, totiž mířidel i střelce. Chyby, o nichž jsme mluvili v předešlých výkladech, jsou tedy ty, které mohou být způsobeny jen mířidly, aniž by se k nim přidala sebemenší vina střelce (jak bylo na příslušných místech mnohokrát řečeno). Chyby, které pocházejí prostě z obou mířidel, mají totiž v sobě pravidlo a míru, jak bylo na příslušných místech řečeno; ty však, které pocházejí prostě z viny střelce, nemají v sobě žádný řád ani pravidelnost. Většina takových chyb totiž vzniká z nějakého pohybu, který střelec udělal s ručnicí poté, co zamířil, nebo při výstřelu; každý sebemenší pohyb v okamžiku, kdy ručnice vystřelí, může totiž způsobit velkou chybu vůči místu neboli cíli {segno}, na který se míří, a to tím větší, čím dál bude cíl. A protože takový pohyb ručnice (který může vzniknout dechem, tepem nebo třesem ruky) nemá v sobě žádnou pravidelnost, pak i kdyby byl cíl naprosto přesně v bodě, kde se zorná čára {linea uisuale} sbíhá s cestou, kterou by měla koule {balla} vykonat (na kterémžto místě by podle mířidel měl trefit přesně do středu {brocca}), přece je takový střelec, pohne-li ručnicí, náchylný chybit všemi směry: může trefit nad cíl i pod něj, a stejně tak stranou {costero}, ať napravo, či nalevo; je ovšem pravda, že může také náhodou trefit do středu. Všechny tyto příhody ho mohou potkat, ať je cíl před tímto setkáním čar, nebo za ním; je však pravda, že je-li cíl za ním, vznikají chyby (kvůli velké vzdálenosti) větší, než kdyby byl před ním, tedy blíže. Neboť vskutku čím blíže je cíl ke střelci, tím víc se u něho každý druh chyby zmenšuje, a tím spíše tedy cíl trefí neboli udělá krásnější ránu {botta}, jak bylo řečeno v předešlém dotazu. Všem týmž příhodám je vystaven i tehdy, když mají mířidla nějakou vadu: pohybem ručnice může trefit nad cíl i pod něj, a také stranou. Může také trefit přesně do středu, protože takový pohyb ručnice by mohl náhodou být takový, že by vadu mířidel napravil, a trefil by do středu; to by však nebylo jeho uměním, nýbrž jen náhodou.
- typ: odstavec
  de: |-
    S. Non piu, che ue ho inteso benissimo, et questa uostra argumentatione, me ha certamente da ogni mio scropoloso dubbio rettamente chiarito.
  cs: |-
    **Ručničář.** Už nic víc, velmi dobře jsem vám porozuměl, a tento váš výklad mi věru správně objasnil každou mou úzkostlivou pochybnost.
