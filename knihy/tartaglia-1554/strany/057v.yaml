  de: |-
    istrumento alla detta bacchetta posta in ponto .a. hor poniamo che ui sia passa .54. hor dico, che di tutto questo se ne debbe far memoria sopra una policetta in questa forma, cioe à gradi tre de Sirocco uerso Ostro passa .54. fatto questo, el si de uoltar la detta dioptra (stando pero lo istrumento sempre fermo e fisso secondo el suo ordine) talmente, che per el medesimo modo el si ueda l'altra bacchetta che seguita, poniamo quella posta in ponto .b. & uisto, et notato el grado, etiam la distantia, che sara dal pie del nostro istrumento per fin al ponto .b. sopra la nostra polizetta alla similitudine dell'altra, & con tal modo, e uia si de procedere à cadauna delle altre tre bacchette poste nelli altri tre angoli, ouer cantoni .c.d, & .e. & per abbreuiar scrittura, poniamo che le dette cinque distantie annotate sopra alla detta polizetta uadano, & siano tanto quanto qua di sotto appare, perche cosi debbono esser notate.
  cs: |-
    nástroje k oné tyčce {bacchetta} postavené v bodě a; předpokládejme, že je to 54 kroků {passa}. Pravím tedy, že o tom všem je třeba učinit záznam na lístku {policetta} v této podobě, totiž: 3 stupně od jihovýchodu {Sirocco} k jihu {Ostro}, 54 kroků. Když je to hotovo, je třeba otočit dioptrou {dioptra} (přičemž nástroj stále stojí pevně a nehnutě podle svého řádu) tak, abychom stejným způsobem uviděli další tyčku, která následuje, řekněme tu postavenou v bodě b. Když ji uvidíme, zapíšeme na náš lístek stupeň a také vzdálenost od paty našeho nástroje až k bodu b, podobně jako u první. A týmž způsobem a postupem je třeba pokračovat u každé z ostatních tří tyček, postavených v ostatních třech úhlech čili rohách c, d a e. A abychom zkrátili psaní, předpokládejme, že těch pět vzdáleností zapsaných na lístku vychází a činí tolik, kolik je vidět zde níže, neboť takto mají být zapsány.
