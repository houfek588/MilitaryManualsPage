  de: |-
    rettamente secondo lo assis del uacuo della canna, & perche il transito, ouer uiaggio, qual debbe far la balla (quantunque il non sia retto, ne che uada realmente per la detta linea che procede rettamente secondo l'ordine del assis del uacuo della canna del pezzo) tamen per molto spacio ua quasi contiguo con quella, ouer poco lontano da quella. E per tanto tal segamento puo esser in tal luoco che la medesima linea uisuale seghera anchora il transito, ouer uiaggio qual debbe far la balla. (Et questo accadera quando che la mira dauanti sara piu bassa del douere rispetto a quella de drio) & puo anchora esser in tal luoco, che non solamente la detta linea uisuale non seghera il detto transito, ouer uiaggio, ma anchora non lo toccata, & questo accadera quando che la mira dauanti non sara a sufficientia piu bassa di quella de drio. Anchora puo esser in tal luoco che tal linea uisuale sara contingente con il detto transito, ouer uiaggio qual debbe far la balla, & questo occorrera quando che la mira dauanti hauera la sua debita & conueniente bassezza rispetto alla mira de drio, se per sorte adunque la nostra linea uisuale seghera il detto transito, ouer uiaggio qual debbe far la balla, & che per sorte anchora il segno che se tuol de mira, sia precisamente nel ponto di tal intersecatione senza dubbio la balla dara precisamente in brocca, ma se per caso il detto segno sara di dentro da tal intersecatione, cioe piu in uerso il pezzo, tal balla dara sempre alquanto di sotto dal segno, cioe dalla brocca di quello, & quanto piu il detto segno sara remoto, ouer lontano da tal intersecatione, cioe piu uerso il pezzo, tanto piu basso dal segno, ouer dalla brocca di quello, dara la detta balla. Ma se per caso il detto segno sara alquanto fuora della detta intersecatione, cioe alquanto piu alta de tal intersecatione, tal balla dara di sopra dal detto segno, & quanto piu sara da quello lontano (per un certo spacio) tanto piu dara di sopra da quello.
  cs: |-
    přímo podél osy {assis} vývrtu {uacuo} hlavně {canna}. A protože dráha {transito} čili cesta {uiaggio}, kterou má koule {balla} vykonat (ačkoli není přímá a koule ve skutečnosti neletí po uvedené přímce vedoucí podél osy vývrtu hlavně děla), přece jen na velkém úseku vede téměř těsně při ní čili nedaleko od ní, může to protnutí ležet na takovém místě, že táž zorná čára {linea uisuale} protne i dráhu čili cestu, kterou má koule vykonat. (A to se stane, když bude přední mířidlo {mira dauanti} vzhledem k zadnímu {mira de drio} nižší, než náleží.) Může také ležet na takovém místě, že uvedená zorná čára onu dráhu čili cestu nejen neprotne, ale ani se jí nedotkne;[^1] a to se stane, když přední mířidlo nebude oproti zadnímu dost nízké. A konečně může ležet na takovém místě, že se zorná čára oné dráhy čili cesty koule dotkne, a to nastane, když bude mít přední mířidlo vůči zadnímu náležitou a přiměřenou nízkost. Protne-li tedy naše zorná čára dráhu čili cestu, kterou má koule vykonat, a bude-li cíl {segno}, na který se míří, náhodou ležet přesně v bodě tohoto průsečíku, koule bez pochyby zasáhne přesně do středu {in brocca}. Bude-li však cíl před tímto průsečíkem, totiž blíže k dělu {pezzo}, zasáhne koule vždy poněkud pod cíl, totiž pod jeho střed; a čím dál bude cíl od tohoto průsečíku směrem k dělu, tím níže pod cílem čili pod jeho středem koule zasáhne. Bude-li však cíl poněkud za tímto průsečíkem, to jest poněkud výše než tento průsečík, zasáhne koule nad cíl, a čím dál od něj bude (v jistém úseku), tím víc nad něj zasáhne.
- typ: odstavec
  de: |-
    P. Non ue intendo troppo bene.
  cs: |-
    **Převor.** Nerozumím vám příliš dobře.
- typ: odstavec
  de: |-
    N. Poniamo per figura la sottoscritta artegliaria, & le due mire di quella siano.c.&.d.& sia la mira.d.piu bassa della mira.c.& sia la linea che procede rettamente secondo l'ordine del assis del uacuo della canna, la.f.g.& il transito, ouer uiaggio qual debbe far la balla la linea.h.i.& la nostra linea uisuale quella che procede rettamente secondo l'ordine delle due istreme ponte delle due mire.c.&.d.la quale necessariamente (come è detto) seghera la linea.f.g.& per tanto poniamo anchor che quella seghi la detta linea.h.i.in ponto.k.(come di sotto appar in figura) hor dico, che se il segno che se tuol de mira sara precisamente in ponto.k.tal balla dara precisamente in brocca, & se per caso il detto segno fusse di dentro di tal intersecatione, cioe in uerso del pezzo, come saria a dire in ponto.m.tal balla dara sempre alquanto di sotto dalla brocca del detto segno, perche per tutto tal luoco, ouer spacio il transito della balla passa sempre di sotto dalla nostra linea uisuale, & quanto piu remoto sara il detto segno dal ponto.k.cioe quanto piu sara uerso il pezzo, tanto piu bassa sara la detta nostra botta, niente dimeno tal bassezza in un simil caso mai puo esser eguale alla differentia, che è dalla istremita della mira dinanti, cioe dal ponto.d.al centro del foro del pezzo, ouer uacuo della canna, la qual differentia è circa alla mita della grossezza del pezzo nella parte de drio, cioe nella culatta, e per tanto, essendo il segno doue se tira de mira di qua da tal intersecatione, il bombardiero è soggietto a poco errore (per conto delle mire.) Ma quando tal segno fusse alquanto fuora da tal intersecatione, come saria a dire in ponto.l.tal balla
  cs: |-
    **Nicolò.** Znázorněme si to na níže nakresleném děle {artegliaria}; jeho dvě mířidla {mire} budiž c a d, přičemž mířidlo d je nižší než mířidlo c. Přímka vedoucí podél osy vývrtu hlavně budiž f g, dráha čili cesta, kterou má koule vykonat, čára h i a naše zorná čára ta, která vede přímo přes oba krajní hroty obou mířidel c a d; ta nutně (jak bylo řečeno) protne přímku f g. Předpokládejme proto také, že protne uvedenou čáru h i v bodě k (jak je vidět níže na obrazci). Pravím tedy, že bude-li cíl, na který se míří, přesně v bodě k, koule zasáhne přesně do středu; a bude-li cíl náhodou před tímto průsečíkem, totiž směrem k dělu, například v bodě m, zasáhne koule vždy poněkud pod střed cíle, protože na celém tomto místě čili úseku probíhá dráha koule vždy pod naší zornou čárou; a čím dál bude cíl od bodu k, to jest čím blíž k dělu, tím níž bude naše rána {botta}. Přesto se tato nízkost v takovém případě nikdy nemůže rovnat rozdílu mezi vrcholem předního mířidla, totiž bodem d, a středem vývrtu {foro} děla čili dutiny hlavně; tento rozdíl činí asi polovinu tloušťky děla v jeho zadní části, totiž na závěru {culatta}. A proto, je-li cíl, na který se míří, na této straně průsečíku, podléhá dělostřelec {bombardiero} jen malé chybě (pokud jde o mířidla). Ale kdyby byl cíl poněkud za tímto průsečíkem, například v bodě l, koule
