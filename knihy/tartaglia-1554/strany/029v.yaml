  de: |-
    banda, la mia longa isperientia pare, che non corresponda precisamente à questo: ma innanti che io ue dica in que conto la non me corresponda, uoglio che me chiariti questo altro dubbio, cioe. Donde procede, che ogni schioppettero, & anchor bombardiero generalmente quanto piu sta propinquo à un segno tolto de mira, tanto piu è atto à darui dentro, ouer à far piu bella botta, & in ogni qualita de mire.
  cs: |-
    stranu se zdá, že mé dlouhé zkušenosti to přesně neodpovídá. Než vám však povím, v čem mi to neodpovídá, chci, abyste mi objasnil tuto jinou pochybnost, totiž: čím to je, že každý ručničář {schioppettero} i dělostřelec obecně tím spíše trefí zamířený cíl {segno} neboli udělá tím krásnější ránu {botta}, čím blíže k němu stojí, a to při jakémkoli druhu mířidel {mire}?
- typ: odstavec
  de: |-
    N. Per risoluere regolatamente questo uostro dubbio, in tutte le sorte, ouer qualita de differentie che occorrer possa nelle due mire. Incominciaremo prima, quando che per sorte la mira dauanti fusse precisamente di quella medesima altezza, che è quella de drio. Dico adunque, che quando la mira dauanti sara egualmente alta à quella de drio in tal caso, quanto piu colui, che tirara stara propinquo al segno, tanto piu sara atto à darui dentro, ouer à far piu bella botta, & questo seguita per due cause. La prima è, perche sempre (come fu detto sopra el settimo Quesito) tal schioppo, ouer pezzo dara di sotto dal segno, che se tol de mira, & tanto piu bassa sara tal botta, quanto che piu lontano sara dal detto segno, & è conuerso, quanto che piu propinquo sara al segno, tanto men bassa sara tal botta, & la menor bassezza, che ui possa occorrere in simel caso, saria quella, quando, che se stesse tanto propinquissimo al segno, che la istremita della mira de nanti, toccasse quasi el detto segno, che si tol de mira, la qual bassezza puo esser circa à tanto, quanto che è la distantia, che è dalla istremita de l'una, e l'altra mira al uacuo della canna, la quale puo esser poco piu della grossezza del mettallo del pezzo ne la parte de drio, che in un schioppo puo esser circa à tanto, quanto è la grossezza di un dedo, & in un pezzo grosso tanto piu, quanto piu sara grosso di mettallo nella parte de drio. Et quantunque la balla subito, che è uscita della bocca del schioppo, ouer pezzo, uada continuamente declinando al basso (come si dimostra nel terzo Quesito) tamen per un poco di tempo, ouer spatio, quando che tal balla si potesse uedere tal suo declinare non saria sensibile, cioe che'l nostro occhio non lo potria discernere, e pero in un corto spatio, per conto delle dette mire, tal schioppo puo dar poco piu basso del segno tolto de mira di quella grossezza d'un dedo, detta di sopra, dico per uigor delle mire, e non per difetto di colui che tira, perche li difetti, & accidenti, che puo occorrere per difetto di colui che tira, non se comprendono nelli nostri ragionamenti, & questa è la prima causa, che un schioppettero, & anchor bombardiero, quando che la mira dauanti è di quella medesima altezza, che è quella de drio, quanto piu stara propinquo al segno tolto de mira, tanto piu sara atto à darui dentro, ouer à far piu bella botta di quello sara à starui piu lontano, et per questa medesima causa occorreria el medesimo, quando che la mira de nanti fusse alquanto piu alta di quella de drio, perche in simel caso, come fu detto nel detto settimo Quesito, sempre tal pezzo dara di sotto dal segno tolto de mira, & tanto piu di sotto, quanto che piu sara lontano dal detto segno, & la menor bassezza che ui possi occorrere in tal caso puo esser circa à tanto, quanto che sara dalla istremita della mira dauanti, al uacuo della canna de tal schioppo, ouer artegliaria, ouer poco piu, la qual cosa, quando che'l segno fusse, come di sopra dissi, propinquissimo alla bocca del schioppo potria esser poco piu dell'altra, cioe poco piu della grossezza d'un dedo, uero è che in distantie equale daria alquanto piu basso dell'altra, detta di sopra, ma poco piu basso, massime in una piccola distantia, si che, come di
  cs: |-
    **Nicolò.** Abychom tuto vaši pochybnost řádně rozřešili pro všechny druhy neboli způsoby rozdílů, které mohou u obou mířidel nastat, začneme nejprve případem, kdy by přední mířidlo {mira dauanti} bylo náhodou přesně téže výšky jako zadní {mira de drio}. Pravím tedy: když bude přední mířidlo stejně vysoké jako zadní, pak v takovém případě čím blíže bude střelec stát k cíli, tím spíše jej trefí neboli udělá krásnější ránu, a to ze dvou příčin. První je ta, že taková ručnice {schioppo} nebo dělo {pezzo} vždy (jak bylo řečeno v sedmém dotazu) zasáhne pod cíl, na který se míří, a rána bude tím níž, čím dál bude od cíle, a naopak čím blíže bude k cíli, tím méně nízko bude rána. Nejmenší snížení, které v takovém případě může nastat, by bylo tehdy, kdyby se stálo tak docela blízko u cíle, že by se konec předního mířidla zamířeného cíle skoro dotýkal; toto snížení může být zhruba tak velké jako vzdálenost od konce jednoho i druhého mířidla k vývrtu {uacuo} hlavně {canna}, což může být o málo víc než tloušťka kovu děla v jeho zadní části: u ručnice to může být zhruba tloušťka jednoho prstu {dedo}, u velkého děla tím víc, čím silnější bude kov v jeho zadní části. A ačkoli koule {balla}, jakmile vyjde z ústí ručnice nebo děla, neustále klesá dolů (jak se dokazuje ve třetím dotazu), přece by po krátký čas neboli úsek, i kdyby se dala vidět, nebylo její klesání znatelné, to jest naše oko by je nemohlo rozeznat. Proto na krátkém úseku může taková ručnice kvůli mířidlům zasáhnout pod zamířený cíl jen o málo víc než o onu tloušťku jednoho prstu, o níž byla řeč – myslím vlivem mířidel, a ne vinou toho, kdo střílí, neboť vady a nehody, které mohou nastat vinou střelce, do našeho výkladu nespadají. To je první příčina, proč ručničář i dělostřelec, když je přední mířidlo téže výšky jako zadní, tím spíše trefí zamířený cíl neboli udělá krásnější ránu, čím blíže k němu stojí, než kdyby stál dál. A z téže příčiny by se stalo totéž, kdyby přední mířidlo bylo poněkud vyšší než zadní, neboť v takovém případě, jak bylo řečeno v tomtéž sedmém dotazu, zasáhne takové dělo vždy pod zamířený cíl, a to tím níž, čím dál od cíle bude. Nejmenší snížení, které v tomto případě může nastat, může být zhruba tak velké, jako je vzdálenost od konce předního mířidla k vývrtu hlavně té ručnice nebo děla {artegliaria}, nebo o málo víc; to by, kdyby cíl byl, jak jsem řekl výše, zcela blízko u ústí ručnice, mohlo být o málo víc než v předešlém případě, to jest o málo víc než tloušťka jednoho prstu. Je ovšem pravda, že ve stejných vzdálenostech by rána padla poněkud níž než v předešlém, výše popsaném případě, ale jen o málo níž, zvláště na malou vzdálenost. Takže, jak bylo
