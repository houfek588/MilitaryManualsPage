  de: |-
    tutta la cortina, et à tutti li baluardi perche de quelli non potra esser uisto ne battuto da nemici con le sue artegliarie, eccetto che quella soprema parte de dui piedi, che se lascera scoperta per poter tirar di fuora con le artegliarie della citta. Et quel spacio largo .12. piedi, uel circa (lasciato fra la fossa, et lo detto argine di fuora) formara una uia coperta, ouer secreta, per laquale potra andare secretamente caualli, et fanti, et altri sicuramente à torno atorno di fuora uia di tal citta, cioe atorno della fossa di fuora uia, et se douera lasciar alcune aperture penetrante il muro, quasi tutto l'argine, che se dicono porte false fatte di muro sempio, cioe d'una piera, coperte di fuora uia leggiermente di terra, accio che per tutto ui paia argine, le quai porte false si possino facilmente rouinare per poter uscir tacitamente la notte, & andare à far qualche strettagema, ouer improuiso assalto alli nemici, le quai porte false se potriano fare fra il ponto .m. et .l. et fra il ponto .n. et .o. ouer in altri simili lochi, uero è, che tal uia secreta, o uogliam dir coperta non si discernera nella nostra figura, perche la non ui è stata posta, perche uolendola far à misura saria da se cosa insensibile, et restaria in tutto coperta dal nostro argine, e pero bisogna che con la pura imaginatiua sia uista, et intesa. Et questa tal uia uenira à esser ottimamente guardata, et difesa, non solamente dalli baluardi, et dalli dui caualleretti .2. et .3. et dalli falconetti che staranno sotto à quelli argenetti della sua opposita cortina, ma anchora piu minutamente sara guardata, et difesa da quelli archibuseri, che saranno sotto alli medesimi arginetti, perche tal uia uoglio che la sia totalmente discoperta uerso la citta, la qual uia hauera anchora quest'altra proprieta, che se nella fossa non ui fusse acqua, et che li nemici per sorte con trincere penetrassono nella detta fossa, per minare, ouer scalare le mura, ouer cortine di tal citta quelli della terra potranno uenire sicuramente per tal uia à offendere li detti nemici nella schena con archibusi, balestre, archi, et altre cose simili. Dico oltra à quello, che faranno poi li baluardi, caualleri, falconetti, et archibusi, che saranno su la cortina di dentro della citta. Et cosi sara compita questa nostra prima forma de fortificare, la qual forma se trouara hauere in se non solamente tutte quelle .3. qualita, ouer conditioni dette, nel .3. 4. et .5. quesito del nostro .6. libro (come che V. M. con il suo sano intelletto puo facilmente comprendere) ma ui ha anchora questo de piu, che tal citta (come fu detto di sopra) non puo esser danneggiata da nemici con le artegliarie, la qual cosa di quanta autorita, et importantia la sia, à V. M. ne lasso il giudicio. Poi di quella uia coperta, o uogliam dir secreta, non uoglio star à narrare di quanta comodita, et utilita, la sia à quelli della terra, et de danno et terrore alli nemici per causa delli improuisi assalimenti, che di notte gli uerranno fatti da diuerse bande per uia di quelle porte false. Et accio che V. M. possa grosso modo intendere, le misure, et distantie di tal nostra forma ui ho descritta la scala, da noi usata nella designation di quella, la qual scala è la linea .R. longa passa .120. uero che nelle materie piccole non ui se è osseruato le sue debite misure.
  cs: |-
    celé kurtině {cortina} a všem baštám {baluardi}, takže je nepřátelé nebudou moci svým dělostřelectvem {artegliarie} vidět ani ostřelovat, kromě oné nejvyšší části o dvou stopách {piedi}, která se ponechá odkrytá, aby se z městského dělostřelectva dalo střílet ven. A onen prostor asi 12 stop široký (ponechaný mezi příkopem {fossa} a uvedeným vnějším náspem {argine}) vytvoří krytou neboli tajnou cestu {uia coperta, ouer secreta},[^1] po níž budou moci koně, pěšáci {fanti} a jiní skrytě a bezpečně procházet dokola vně takového města {citta}, totiž kolem příkopu z vnější strany. A mají se ponechat nějaké otvory pronikající zdí a skoro celým náspem, kterým se říká falešné brány {porte false},[^2] zazděné prostou zdí, totiž na tloušťku jednoho kamene, a zvenčí lehce zasypané zeminou, aby to všude vypadalo jako násep. Tyto falešné brány se dají snadno vybourat, aby se dalo v noci potichu vyjít a provést nějakou lest neboli nenadálý útok na nepřátele. Takové falešné brány by se daly udělat mezi body m. a l. a mezi body n. a o. nebo na jiných podobných místech. Je ovšem pravda, že tuto tajnou neboli krytou cestu na našem obrazci nerozeznáte, protože na něj nebyla zakreslena; kdyby se totiž měla nakreslit v měřítku, byla by sama o sobě nepostřehnutelná a zůstala by celá zakryta naším náspem. Proto je třeba si ji vidět a pochopit pouhou představivostí. A tato cesta bude znamenitě střežena a bráněna nejen baštami a oběma malými kavalíry {caualleretti} 2. a 3. a falkonety {falconetti}, které budou stát pod oněmi náspky {argenetti} protější kurtiny, ale ještě pečlivěji ji budou střežit a bránit arkebuzíři {archibuseri}, kteří budou pod týmiž náspky; chci totiž, aby tato cesta byla směrem k městu zcela odkrytá. Tato cesta bude mít ještě další vlastnost: kdyby v příkopu nebyla voda a nepřátelé snad pronikli zákopy {trincere} do příkopu, aby podkopávali nebo zlézali hradby {mura} neboli kurtiny takového města, budou moci obránci města bezpečně přijít touto cestou a bít nepřátele do zad arkebuzami {archibusi}, kušemi, luky a jinými podobnými věcmi – nemluvě o tom, co pak udělají bašty, kavalíry, falkonety a arkebuzy, které budou na vnitřní kurtině města. A tak bude dokončen tento náš první tvar opevnění. Tento tvar bude mít v sobě nejen všechny ony tři vlastnosti neboli podmínky, o nichž se mluví ve třetím, čtvrtém a pátém dotazu naší šesté knihy (jak Vaše Urozenost svým zdravým rozumem snadno pochopí), ale má navíc i to, že takovému městu (jak bylo řečeno výše) nepřátelé nemohou uškodit dělostřelectvem; jakou to má váhu a důležitost, nechávám na úsudku Vaší Urozenosti. Dále nechci rozvádět, jak velkou výhodu a užitek přinese ona krytá neboli tajná cesta obráncům města a jakou škodu a hrůzu nepřátelům kvůli nenadálým útokům, které na ně budou v noci podnikány z různých stran skrze ony falešné brány. A aby Vaše Urozenost mohla zhruba pochopit míry a vzdálenosti tohoto našeho tvaru, zakreslil jsem vám měřítko, jehož jsme při jeho kreslení užili; tím měřítkem je čára R., dlouhá 120 kroků {passa}.[^3] Je ovšem pravda, že u drobných věcí nebyly dodrženy jejich náležité míry.
- typ: odstavec
  de: |-
    S. M. Non me importa à uederla tanto per sottile, mi basta assai, che gli uedo quella uostra .3. qualita, ouer conditione da me desiderata di uedere, et molto maggiore di quello preponeti nel .5. quesito. Perche uedo chiaramente, che se li nemici deliberasseno di dar una battaglia generale à tal citta subito, che quelli saranno entrati in quello ingolfato piano, cioe di dentro da quelle lettere m.z.4.y.o. non solamente saranno offesi da quelli della terra da quattro bande con le artegliarie, ma da piu de .20. bande, perche conosco, che non solamente saranno offesi dalli .3. baluardi, & dalli .4. caualleretti, Ma anchora da tutti quelli
  cs: |-
    **Pan Marcantonio.** Nezáleží mi na tom, abych ji viděl tak podrobně; úplně mi stačí, že tu vidím onu vaši třetí vlastnost neboli podmínku, kterou jsem si přál vidět, a to mnohem větší, než ji předkládáte v pátém dotazu.[^4] Jasně totiž vidím, že kdyby se nepřátelé rozhodli podniknout na takové město všeobecný útok, pak jakmile vstoupí na onu zálivovou rovinu, totiž dovnitř písmen m.z.4.y.o., budou je obránci města zasahovat dělostřelectvem nejen ze čtyř stran, ale z více než dvaceti stran, neboť poznávám, že je budou zasahovat nejen tři bašty a čtyři malé kavalíry, ale také všechny ty
poznamky:
- n: 1
  text: Uia coperta – krytá cesta za vnějším náspem příkopu, chráněná před pohledem a palbou z pole; Tartaglia ji však ponechává odkrytou směrem k městu, aby ji obránci mohli ostřelovat, kdyby ji obsadil nepřítel.
- n: 2
  text: Porte false – skryté výpadové branky (fortny) zazděné tenkou zdí, kterou lze v noci rychle vybourat.
- n: 3
  text: V tisku znak připomínající ℞ (R se šikmým tahem). Na dřevořezu (s. [[072v|72v]]) je měřítko s písmenem R a čísly 30 a 150; rozdíl 150 − 30 = 120 kroků odpovídá délce udané v textu.
- n: 4
  text: V šesté knize je každá podmínka vyložena o dva dotazy dál, než je její pořadí, např. třetí podmínka (ostřelování útočníků alespoň ze čtyř stran) v pátém dotazu. Proto Nicolò výše uvádí první až třetí podmínku jako „3., 4. a 5. dotaz“.
