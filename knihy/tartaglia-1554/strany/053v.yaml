poznamky:
- n: 1
  text: Sophi (Sofi) – dobové italské označení perského šáha z dynastie Safíovců; míněna bitva u Čaldiránu (1514), kde turecký sultán Selim I. díky dělostřelectvu a janičářským palným zbraním porazil šáha Ismáila I.
- n: 2
  text: Obléhání Rhodu sultánem Sulejmanem I. roku 1522, kterého se Gabriele Tadino účastnil jako inženýr řádu johanitů; po půlroční obraně řád ostrov opustil.
