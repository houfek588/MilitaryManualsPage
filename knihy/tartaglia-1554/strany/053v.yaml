bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    ne offeso da alcuna moltitudine de caualli, & circa cio ui ho studiato molti giorni, & mesi, ma finalmente per certe ragioni ho compreso non esser possibile, perche una cosa sola mi guasta ogni disegno.
  cs: |-
    ani poškozeno žádným množstvím jízdy {caualli}. O tom jsem přemýšlel mnoho dní a měsíců, ale nakonec jsem z jistých důvodů pochopil, že to není možné, protože jediná věc mi kazí každý záměr.
- typ: odstavec
  de: |-
    N. Eglie il uero, che tal cosa non è molto facile, nondimeno el non è da concludere cosi absolutamente, che la sia impossibile, perche secondo, che lo ingegno de l'huomo ha ritrouato (con ragion & arte) che uno sol huomo leui, ouer conduca tal peso, che quattro, e piu huomini naturalmente per se non sariano atti ad alleuarlo, ouer condurlo, cosi anchora eglie da pensare, che con ragion, & arte sia possibile di ritrouare tal modo, e forma di ordinare uno essercito che sia atto, & sicuro à superare, & rompere ogni altro essercito, quantunque el fusse di tre, & anchor de quattro tanta moltitudine di gente di piu, & in qual si uoglia forma.
  cs: |-
    **Nicolò.** Je pravda, že ta věc není příliš snadná, přesto nelze tak bezvýhradně uzavřít, že je nemožná. Neboť jako lidský důmysl nalezl (rozumem a uměním) způsob, aby jediný člověk zvedl nebo dopravil takové břemeno, jaké by čtyři i více lidí pouhou přirozenou silou nedokázali zvednout ani dopravit, tak je také třeba se domnívat, že rozumem a uměním lze nalézt takový způsob a tvar sestavení vojska {essercito}, které by bylo s jistotou schopno přemoci a rozbít každé jiné vojsko, i kdyby bylo třikrát, ba i čtyřikrát početnější, a to v jakémkoli tvaru.
- typ: odstavec
  de: |-
    P. El potria esser questo, che uoi diceti, quando che el non ui se interponesse artegliarie, archibusi, et archi, perche in uero doue è maggior essercito à questi tempi, eglie da giudicare, che iui sia anchor maggior numero de tai bellici istrumenti, per la autorita de quali, & non per altro el detto Turco riportò honorata uittoria contra el Sophi, al qual Sophi non li giouò hauer uno essercito tutto de huomini generosi, & honoratamente armati, & con mirabel ordine ordinati, perche, come cominciorno ad esser salutati dalle artegliarie, archibusi, & archi Turcheschi ogni suo ordine diuento uano. Et me arricordo quando, chel Turco uenne all'impresa de Rhodi, che io uolsi andare con una bona banda de ottimi fanti, ad assaltare una grande moltitudine de Turchi, che erano uenuti in un certo luoco non molto lontano dalla terra: ma scoperti, che nui fussemo à quelli fu tanta la moltitudine delle frizze, che ne incominciorno à piouere sopra la testa, che fussemo sforzati immediate à ritornar nella terra, uero è che erano piu di tre tanti de noi, & nondimeno se la tanta moltitudine delle sue frizze non fusse stata, & che se fussemo potesti approssimar à quelli con le nostre picche, & spade, senza dubbio li haueressimo sbaratati, & massime, che non haueuano artegliaria con loro, per esser gente che andaseuano robando, & depredando per l'isola: si che uoglio inferire, che se tai machine non fusse, credo chel se potria ritrouare de ordinare uno essercito con tal artificioso modo, che fusse atto a rompere un'altro essercito molto maggior di lui, come fu detto sopra al cuneo, ma quando, che la parte contraria habbia gran coppia de artegliarie, archibusi, & archi, non credo che la natura, ne l'arte ui potesse fare equiualente riparo, saluo, che con altre tante, ouer con maggior quantita di quelle, perche à tai machine, & massime alle artegliarie, non ui si puo trouar ingegno, che ui duri, ne medicina, che ui uaglia, & se queste tai machine fusseno state al tempo antiquo, li elephanti haueriano persa la scrimia, & li carri falcati ui sariano stati di poco giouamento, ouer profitto.
  cs: |-
    **Převor.** Mohlo by tomu být, jak říkáte, kdyby do toho nevstupovala děla {artegliarie}, arkebuzy {archibusi} a luky. Neboť kde je v dnešní době větší vojsko, tam je třeba předpokládat i větší počet takových válečných nástrojů; jejich mocí, a ničím jiným, dobyl zmíněný Turek čestného vítězství nad Sofim[^1], jemuž nebylo nic platné, že měl vojsko složené ze samých statečných mužů, čestně ozbrojených a sestavených v podivuhodném pořádku, neboť jakmile je začala zdravit turecká děla, arkebuzy a luky, všechen jeho pořádek přišel vniveč. A vzpomínám si, že když Turek podnikl tažení na Rhodos[^2], chtěl jsem se s dobrým oddílem výborných pěšáků {fanti} vrhnout na velké množství Turků, kteří přitáhli na jisté místo nedaleko města. Ale jakmile nás spatřili, bylo tak veliké množství šípů, které nám začaly pršet na hlavu, že jsme byli nuceni ihned se vrátit do města. Je pravda, že jich bylo víc než třikrát tolik co nás; a přesto, kdyby nebylo toho velikého množství jejich šípů a kdybychom se k nim mohli přiblížit se svými píkami {picche} a meči, bez pochyby bychom je rozprášili, zvláště proto, že neměli s sebou děla, neboť to byli lidé, kteří chodili po ostrově loupit a plenit. Chci tedy říci, že kdyby takových strojů nebylo, myslím, že by se našel způsob, jak sestavit vojsko tak důmyslně, aby bylo schopné rozbít jiné vojsko mnohem větší, než je samo, jak bylo řečeno výše o klínu {cuneo}. Ale když má protivná strana velké množství děl, arkebuz a luků, nemyslím, že by proti tomu příroda nebo umění mohly zjednat rovnocennou ochranu, leda zase tolika nebo ještě větším množstvím týchž [zbraní]. Neboť proti takovým strojům, a zvláště proti dělům, nelze najít důmysl, který by obstál, ani lék, který by pomohl; a kdyby takové stroje byly v dávných dobách, sloni by byli ztratili svou zdatnost a vozy se srpy by byly k malému užitku či prospěchu.
- typ: odstavec
  de: |-
    N. Eglie da tener per fermo, che la natura mai creasse, ne crea alcun si crudo ueleno, che anchor immediate non creasse, ouar crei la sua propria medecina, quantunque cosi immediate la non sia conosciuta dalli huomini, similmente dico, che l'arte mai ritrouo, ne puo ritrouare cosa cosi noceuole all'huomo, che quella non sia anchor atta à ritrouarui immediate il suo conueniente rimedio, anchor che la ignorantia delli huomini non lo sappia alle uolte cosi all'improuiso immaginare, ouer ritrouare.
  cs: |-
    **Nicolò.** Je třeba pevně věřit, že příroda nikdy nestvořila ani nestvoří tak krutý jed, aby hned nestvořila i jeho vlastní lék, i když ho lidé hned tak nepoznají. Podobně pravím, že umění nikdy nenalezlo ani nemůže nalézt věc pro člověka tak škodlivou, aby nebylo zároveň schopno nalézt proti ní náležitou nápravu, i když ji lidská nevědomost někdy nedovede tak znenadání vymyslet či nalézt.
- typ: odstavec
  de: |-
