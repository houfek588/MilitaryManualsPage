  de: |-
    perche subito, che la balla sia in moto con facilita tal essalatione ue l'andaria mantenendo, non occorrendoui altro impedimento, ma subito, come la balla aggionge alla bocca del pezzo iui truoua tutto lo aere estrinsico: el quale, quanto che con piu maggiore prestezza uien la balla insieme con la detta essalatione, che la spinge ad assaltarlo tanto piu unitamente, et con maggiore uigorosita ui si oppone gagliardamente all'incontro, per resistere à tal moto subitano, onde in tal luoco ui se uiene à causare un'altra difficulta, ouer rissa fra la essalatione intrinsica (che spinge la balla) & l'aere estrinsico, cioe l'un uoria uscire, & l'altro non uoria che uscidesse, pur finalmente lo intrinsico per esser di maggior possanza, e uigore uscisse con uittoria rompendo, & spezzando el suo nemico, nel quale rompimento se causa quel cosi gran suono, perche ogni suono dalli Sapienti se diffinisse non esser altro, che la percussione fatta de dui corpi inanimati, insieme, e pero in questo caso non puo procedere da altro, che dalla percussione fatta da quella essalatione, causata dentro dal pezzo, con lo aere estrinsico, trouandose adunque la bocca del pezzo quasi nel mezzo di tal abbattimento, uiene à patire grandamente in generale, e questa è la causa, che in tal luoco el pezzo non hauendoui la sua conueniente grossezza, ouer essendoui qualche occulto diffetto causato nel gettarlo, facilmente crepa.
  cs: |-
    neboť jakmile je koule {balla} v pohybu, výpar {essalatione} ji v něm snadno udržuje, nenastane-li jiná překážka. Jakmile však koule dorazí k ústí děla {pezzo}, narazí tam na všechen vnější vzduch; a ten, čím větší rychlostí přichází koule spolu s výparem, který ji žene, aby na něj udeřila, tím soudržněji a s tím větší silou se jí mocně staví na odpor, aby odolal takovému náhlému pohybu. Proto tam vzniká další obtíž neboli rvačka mezi vnitřním výparem (který žene kouli) a vnějším vzduchem: jeden by chtěl ven a druhý by ho nechtěl pustit. Nakonec však vnitřní, protože má větší moc a sílu, vyrazí vítězně ven a svého nepřítele roztrhne a rozbije; a při tomto roztržení vzniká onen tak veliký zvuk, neboť mudrci definují každý zvuk jako nic jiného než náraz dvou neživých těles o sebe. V tomto případě tedy nemůže pocházet z ničeho jiného než z nárazu onoho výparu, vzniklého uvnitř děla, na vnější vzduch. Protože se ústí děla nachází takřka uprostřed tohoto střetu, je vůbec velmi namáháno; a to je příčina, proč se dělo, nemá-li na tom místě náležitou tloušťku nebo má-li tam nějakou skrytou vadu vzniklou při lití, snadno roztrhne.
- typ: odstavec
  de: |-
    G. Queste due uostre ragioni molto me quadrano, ma resta un'altro dubbio, el quale è questo, che quantunque la maggior parte delle uolte creppano (come di sopra è detto) nella parte de drio doue sta la poluere, ouer nella bocca, pur alcune uolte creppano anchora nel mezzo, e pero haria à caro, che me assignasti la causa di questo.
  cs: |-
    **Slévač.** Tyto vaše dva důvody mě plně uspokojují, ale zbývá ještě jedna pochybnost, a to tato: ačkoli se děla většinou trhají (jak bylo řečeno výše) vzadu, kde je prach {poluere}, nebo u ústí, někdy se přece trhají i uprostřed. Byl bych proto rád, kdybyste mi uvedl i příčinu toho.
- typ: odstavec
  de: |-
    N. Le due cause di sopra per me assignate, sono cause generale, che sempre per ordinario fanno patire generalmente ogni specie di pezzo nelli preditti dui luochi piu che in altro luoco, ma oltra le dette cause generale, bisogna pensare, & credere, che per accidente ue ne possa occorrere molte altre, le quale non solamente puono augumentar passion al pezzo nelli medemi dui luochi, cioe de drio, & nella bocca, ma anchora nel mezzo della canna, essempi gratia, se per mala sorte la balla nel scorrere per la canna trouasse qualche picciol pieretta in forma di cuneo, ouer altro corpetto duro, & che per sorte la balla ui scorresse per di sopra tal pieretta, ouer corpetto interromperia necessariamente el moto, ouer corso della balla, per il che la balla saria sforzata in tal luoco à far de due cose l'una, ò à intertenersi (& questo seguiria quando la balla andasse molto serrata nel pezzo) ouer tal balla nel passarui sopra facesse un salteto, & questo potria far, quando la canna del pezzo fusse alquanto piu larga della grossezza della balla, se per caso adunque la balla fusse intertenuta da tal pieretta, ouer corpetto in forma de cuneo, per tal intertenimento (essendo gaiardo) saria sforzato tal pezzo di crepare, & se tal cuneo fusse trouato dalla balla nel principio del suo moto, tal pezzo creparia pur nella parte doue sta la poluere, & se tal cuneo fusse trouato nel mezzo della canna, & nel mezzo della canna naturalmente crepparia, & se fusse trouato appresso alla bocca, & nella bocca crepperia. Ma se per caso la balla hauera luoco di posser passar di sopra à tal corpetto, nel passarui (come di sopra dissi necessariamente fara un saltetto, nel qual saltetto percottera nella summita della canna, & rebattera poi nel fondo, la qual percussione, & repercussion, non puo esser tanto debile, che non sia atta à far creppare el pezzo in tal luoco, et questa è una delle cause accidentale, che è atta à
  cs: |-
    **Nicolò.** Dvě příčiny, které jsem uvedl výše, jsou příčiny obecné, které obvykle vždy namáhají každý druh děla na obou zmíněných místech víc než jinde. Kromě těchto obecných příčin je však třeba se domnívat a věřit, že náhodou může nastat mnoho dalších, které mohou zvýšit namáhání děla nejen na těchže dvou místech, totiž vzadu a u ústí, ale i uprostřed hlavně {canna}. Například kdyby koule při běhu hlavní neštěstím narazila na nějaký kamínek ve tvaru klínu nebo jiné tvrdé tělísko a kdyby náhodou přes ten kamínek nebo tělísko přejížděla, nutně by se tím přerušil pohyb neboli běh koule. Koule by pak byla na tom místě nucena udělat jedno ze dvou: buď se zaseknout (a to by se stalo, kdyby šla v děle velmi těsně), anebo při přejíždění poskočit (a to by mohla, kdyby hlaveň děla byla o něco širší než tloušťka koule). Kdyby se tedy koule o takový kamínek neboli klínovité tělísko zasekla, bylo by dělo tímto zaseknutím (je-li prudké) nuceno se roztrhnout. A kdyby koule na takový klín narazila na počátku svého pohybu, dělo by se roztrhlo právě tam, kde je prach; kdyby na něj narazila uprostřed hlavně, roztrhlo by se přirozeně uprostřed hlavně; a kdyby na něj narazila blízko ústí, roztrhlo by se u ústí. Bude-li však mít koule náhodou místo, aby přes to tělísko přejela, nutně při přejíždění (jak jsem řekl výše) poskočí; při tom poskoku udeří do vršku hlavně a pak se odrazí na dno, a tento náraz a odraz nemůže být tak slabý, aby nedokázal dělo na tom místě roztrhnout. To je jedna z náhodných příčin, která může
