  de: |-
    E dapoi questo, bisogna farui una dioptra pur di legno d'ancipresso (se possibile è) ouer di qualche altro, che sia ben secco, talmente, che per tempo non faccia mutatione, che in cio l'ancipresso l'ha piu de tutti. Et per far questa dioptra, che sia giustissima, bisogna far fare una reghetta, ouer listetta del detto legno, longa circa un brazzo, e mezzo, & larga circa à un dedo, & grossa circa à una costa di cortello, & questa tal righetta uol esser rettissima, & giustissima, & per conoscere se tal regha sara giusta, se potra conoscere per quel modo posto nel terzo libro della nostra noua scientia, & dapoi fatta questa tal regha, di quella bisogna segarne fuora otto pezzetti, cioe quattro maggiori, & quattro menori, li quattro maggiori uoleno esser di tal longhezza, che sopragionti, & incolati, come di sotto appar in ponto .e. & .f. siano alquanto piu del diametro del detto istromento. Et bisogna notar, che tal sopragiontion uol esser fatta per grossezza, & uol esser tanta, quanto che è la sua larghezza, & con tal modo, & ordine, che questi dui par de pezzi (cosi congionti, & incolati) ponendoli luno sopra l'altro in perfetta croce, cioe perfetta linea à squadra (come di sopra appar in figura) uegono à fare, ouer à formare nella sua congiontione uno quadretto (come nella detta sottoscritta figura appare) el qual quadretto uenghi à causar un angolo in ponto .g. & un altro à quel opposito in ponto .h. Et cosi questi dui par de pezzi uogliono esser perfettamente incolati in tal positione, cioe, come nella detta sottoscritta figura appare. Gli altri .4. pezzetti menori, li quali poniamo che siano li sopra notati per .a.b.c.d. uogliono esser piu corti delli altri .4. maggiori, tanto quanto è la larghezza de cadauno de loro, perche de quelli uoglio che se ne serui per redure la soprascritta croce tutta piana, e solida, perche eglie manifesto, che li dui brazzi .i.h.g.k. per esser sopra posti alli altri dui, non toccano el piano doue se ripossa li detti altri dui brazzi à quelli sottoposti, anci stanno in aere, cioe lontani dal detto piano tanto quanto è la grossezza de cadauno de loro, e pero per impir quel uacuo uoglio,
  cs: |-
    Potom je třeba udělat dioptru {dioptra}, rovněž z cypřišového dřeva {legno d'ancipresso} (je-li to možné) nebo z nějakého jiného, které je dobře vyschlé, aby se časem neměnilo – a tuto vlastnost má cypřiš ze všech nejvíce. A aby byla tato dioptra co nejpřesnější, je třeba dát udělat z toho dřeva pravítko čili lištu dlouhou asi půldruhého lokte {brazzo}, širokou asi na prst a silnou asi jako hřbet nože; a tato lišta má být naprosto rovná a přesná. Zda je takové pravítko přesné, lze poznat způsobem, který je uveden ve třetí knize naší Nové vědy.[^1] Když je pravítko hotové, je třeba z něho uříznout osm kousků, totiž čtyři větší a čtyři menší. Čtyři větší mají mít takovou délku, aby po přeložení přes sebe a slepení, jak je vidět níže u bodů e a f, byly o něco delší než průměr nástroje. A je třeba si povšimnout, že to přeložení se má udělat na tloušťku a má být tak dlouhé, jaká je šířka [lišty], a to tak a takovým pořádkem, aby tyto dva páry kusů (takto spojené a slepené), položí-li se jeden na druhý do dokonalého kříže, totiž v dokonalém pravém úhlu (jak je vidět na obrázku nahoře), vytvořily čili utvořily v místě svého spojení malý čtverec (jak je vidět na níže zmíněném obrázku), a ten čtverec aby vytvořil jeden roh v bodě g a druhý, protilehlý, v bodě h. A tyto dva páry kusů mají být v této poloze dokonale slepeny, totiž tak, jak je vidět na níže zmíněném obrázku. Ostatní čtyři menší kousky, o nichž předpokládejme, že jsou to ty výše označené a, b, c, d, mají být kratší než čtyři větší právě o šířku každého z nich, protože je chci použít k tomu, aby se výše popsaný kříž stal celý rovný a pevný. Je totiž zřejmé, že obě ramena i h a g k, protože jsou položena na druhých dvou, se nedotýkají roviny, na níž spočívají ona druhá dvě ramena pod nimi, nýbrž jsou ve vzduchu, totiž vzdálena od té roviny o tloušťku každého z nich. A proto, abychom vyplnili tu mezeru, chci,
- typ: obrazek
  soubor: drevorez-124.jpg
  popis: Dřevěná buzola – čtvercová deska s nalepeným papírovým kotoučem (vnější kruh s dělením na stupně, vnitřní kruh s osmi větry). Kresba je otočená severem dolů – písmena čtená po obvodu jsou O (Ostro – jih) nahoře, G (Garbino – jihozápad), P (Ponente – západ) vpravo, M (Maistro – severozápad), T (Tramontana – sever) dole, G (Greco – severovýchod), L (Levante – východ) vlevo a S (Sirocco – jihovýchod). Uprostřed dolní strany desky je připojena malá čtvercová destička s vsazenými kompasovými hodinkami (soustředné kroužky), umístěná u písmene T.
- typ: obrazek
  soubor: drevorez-124b.jpg
  popis: 'Díly dřevěné dioptry: vlevo nahoře dvě dlouhé lišty, pod nimi čtyři krátké lišty A, B, C, D; vpravo dva páry lišt přeplátovaných přes sebe na tloušťku s přesahem rovným šířce lišty – pár E a pár F.'
- typ: obrazek
  soubor: drevorez-124c.jpg
  popis: Oba slepené páry lišt položené na sebe do pravoúhlého kříže; vodorovné rameno vede od I vlevo ke K vpravo, svislé rameno shora dolů. V místě spojení vzniká malý čtverec s rohy H (vpravo nahoře) a G (vlevo dole).
poznamky:
