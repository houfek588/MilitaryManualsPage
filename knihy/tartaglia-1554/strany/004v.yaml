  de: |-
    ne uoglia esser possessore, perche se tutti li nostri anciani il medesimo hauesseno osseruato, poco dalli animali irrationali al presente saressimo differenti adunque per non incorrere in questo biasimo. Ho deliberato di uolere tai mei quesiti, ouer inuentioni mandar al tutto in luce, & per dar principio ad essequire tal mio bon uolere, ne ho raccolto per al presente una parte da un mio memoriale nel qual sempre per bona memoria tutti li notabili, che me ueneuan fatti de mia man notaua, & questa parte la ho distribuita in nuoue libri distinti secondo la qualità delle materie conforme de tai Quesiti. Dapoi uenendomi ad aricordare, che ragionando un giorno, con el nostro honorando compare, messer Ricardo Ventuorth, gentil'huomo di uostra Sacra Maestà, elqual predicandomi della Magnificentia, Magnanimità, Liberalità, Generosità, Humanità, & Clementia di uostra Altezza, mi disse anchora, qualmente uostra Celsitudine si dilettaua grandamente di tutte le cose alla guerra pertinente. Il che pensando, mi ha datto ardire (Quantunque in me non sia quella eloquentia, & ornato dire, che se rechiederia all'udito di uostra Serenità) di douere tai mei Quesiti, ouer interrogationi, con le sue risolute risposte à quella offerire, & dedicare, non come cosa conueniente à uostra Sublimità (perche in uero le cose di profondissima dottrina, narrate, & esplicate con ellegante, & terso stile, non potriano aggiungere al primo grado di uostra altezza, non che queste nostre, che sono cose Mechanice, e plebee, & similmente dette, & prononciate con rozzo & basso stile.) Ma solamente come cose nuoue à quella le offerisco, & dedico, come si costuma à fare delli primi frutti, che al principio di sua stagione uengono ritrouati, liquali (anchor che siano alquanto immatturi, & di puoca sostantia, & men sapore) sempre se sogliono appresentare à persone Magnifiche & signorile, non per la qualita della materia, ma per la nouità di quella, perche le cose nuoue naturalmente sogliono aggradire al intelletto humano, & cio mi ha dato à credere, tai nostre inuentioni non douere à uostra Clementia in tutto dispiacere anzi aggradirli alquanto, il che essendo (come desidero) mi darà animo di douere per l'auenire piu oltra tentare, alli piedi della quale, prostrato in terra con le man gionte, & capo chino humilmente mi raccomando.
  cs: |-
    být jejím vlastníkem – neboť kdyby totéž byli zachovávali všichni naši předkové, lišili bychom se dnes jen málo od nerozumných zvířat –, rozhodl jsem se, abych této hany neutrpěl, vydat tyto své dotazy {quesiti} čili vynálezy zcela na světlo. A abych svou dobrou vůli začal uskutečňovat, vybral jsem prozatím jejich část ze svého zápisníku {memoriale}, do něhož jsem vždy pro dobrou paměť vlastní rukou zapisoval všechno pozoruhodné, nač jsem byl tázán, a tuto část jsem rozdělil do devíti knih, rozlišených podle povahy látky, jíž se ty dotazy týkaly. Potom jsem si vzpomněl, jak jsem jednoho dne rozmlouval s naším ctihodným kmotrem {compare}, panem Richardem Wentworthem[^1], šlechticem Vašeho posvátného Veličenstva, který mi vyprávěl o vznešenosti, velkomyslnosti, štědrosti, šlechetnosti, lidskosti a milostivosti Vaší Výsosti a řekl mi také, že Vaše Vznešenost nachází velikou zálibu ve všech věcech, jež se týkají války. Pomyšlení na to mi dodalo odvahy (ačkoli nemám onu výmluvnost a ozdobnou řeč, jakou by si žádal sluch Vaší Jasnosti), abych tyto své dotazy čili tázání s jejich rozhodnými odpověďmi Vám nabídl a připsal – ne jako věc hodnou Vaší Svrchovanosti (neboť věru ani věci nejhlubšího učení, vyložené a vysvětlené ladným a uhlazeným slohem, by nemohly dosáhnout prvního stupně Vaší výsosti, natož tyto naše, které jsou věcmi řemeslnými {Mechanice} a prostými a jsou také tak řečeny a vysloveny hrubým a nízkým slohem), nýbrž jen jako věci nové Vám je nabízím a připisuji, jak je zvykem činit s prvními plody, jež se najdou na počátku své doby. Ty (ač bývají poněkud nedozrálé, málo vydatné a méně chutné) se vždy podávají osobám vznešeným a panským, ne pro jakost samé věci, ale pro její novost, neboť nové věci přirozeně lahodí lidskému rozumu. To mě přivedlo k víře, že se tyto naše vynálezy nebudou Vaší Milostivosti zcela nelíbit, ba že se jí poněkud zalíbí; stane-li se tak (jak si přeji), dodá mi to odvahy pokusit se do budoucna o víc. K jejím nohám se, padlý k zemi se sepjatýma rukama a skloněnou hlavou, pokorně poroučím.
poznamky:
- n: 1
  text: |-
    Messer Ricardo Ventuorth – anglický šlechtic Richard Wentworth, který pobýval v Benátkách a studoval u Tartaglii matematiku; je hlavním tazatelem páté knihy (zaměřování buzolou) a objevuje se i v knize IX. „Compare“ znamená kmotra, v benátské řeči i blízkého důvěrného přítele.
