  cs: |-
    **Nicolò.** Naopak, z mnoha důvodů nutně musí být tento mnohem přesnější než ten
- typ: obrazek
  soubor: drevorez-125b.jpg
  popis: Hotový dřevěný nástroj – čtvercová deska s nalepeným papírovým kotoučem s dělením na stupně a osmi větry (T nahoře, G vpravo nahoře, L vpravo, S vpravo dole, O dole, G vlevo dole, P vlevo, M vlevo nahoře). Uprostřed horní strany desky jsou vsazeny kompasové hodinky (u T), v levém horním rohu desky je kroužek O. Ve středu je na kolíčku otočně upevněna dřevěná křížová dioptra; hlavní rameno se zaměřovacími nástavci na koncích vede šikmo od severovýchodu k jihozápadu, příčné rameno nese na severozápadním konci ramínko ve tvaru T.
poznamky:
- n: 1
  text: V tisku „che otto à cadauno“ – vypadlé (či nevytištěné) s, má být „che sotto“ (aby pod každé…); v originále ponecháno podle tisku.
- n: 2
  text: Marcello – benátská stříbrná mince v hodnotě 10 soldů (půl liry), ražená od dóžete Nicolò Marcella (1473).
