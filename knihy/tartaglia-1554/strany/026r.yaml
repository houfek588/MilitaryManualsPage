  de: |-
    modo. La asta, che ua per dentro uia prima la distendaremo, & giustaremo rettamente per la parte superiore del uacuo de detta canna, & fatto questo misuraremo, ouer che faremo misurare sottilmente quanto che sara distante dal mettallo la istrema parte, cioe il capo di quella asta, ouer lista, che procede de fuora uia, fatto questo el si de uoltar alquanto dalla banda del detto uacuo della canna la detta asta, ouer lista, che ua per dentro, cioe mutarui alquanto luoco, & in questo secondo luoco far come prima, cioe far guardare, & misurare con diligentia quanto che sara distante dal mettallo la detta estrema parte, ouer capo di quella asta, ouer lista, che procede de fuora uia, & se in questo secondo luoco lui sara precisamente tanto lontano dal mettallo, quanto che era nella prima positione, se potra concluder el mettallo esser nelli detti dui luochi egualmente grosso, ma se sara piu lontano, se potra concludere in questo secondo luoco esserui piu sottile el mettallo, che nel primo, & tanto piu sottile, quanto che la detta lontananza dal detto mettallo in questa seconda positione sara maggiore della prima. Et simelmente, se per caso in questa seconda positione el detto capo della detta asta, ouer lista sara piu propinquo al mettallo della prima, seguira tutto al contrario, cioe, che in questo secondo luoco ui sara piu grosso el mettallo, che nel primo, & con tal ordine procedendo de in parte in parte, ouer de banda in banda d'intorno à tutto el pezzo con tal euidentia se conoscera s'el detto foro sara precisamente, ouer rettamente in mezzo del mettallo, ouer non, perche s'el mettallo se trouara egualmente grosso, se potra concludere tal foro esser rettamente in mezzo del mettallo, & tirara etiam li suoi tiri rettamente, secondo la apparentia di tutto el pezzo: & se per caso se trouara esser piu grosso el mettallo da una banda, che dall'altra, se potra concludere, tal foro non esser rettamente in mezzo del mettallo, & consequentemente non tirara li suoi tiri retti, secondo la apparentia de tutto el pezzo: ma li tirara sempre pendenti, ouer obliqui uerso à quella banda doue che sara piu grosso el mettallo, cioe si tal grossezza sara dalla banda destra lui tirara costero uerso la medesima parte, ouer banda destra, & è conuerso: & se tal grossezza sara in sgalembro poniamo fra la parte, ouer banda destra, & la parte suprema del pezzo lui tirara medesimamente li detti suoi tiri in sgalembro, cioe obliqui, ouer pendenti in suso: ma uerso la medema banda doue è tal grossezza, et cosi si debbe intender, et concludere in qual si uoglia banda, che fusse tal maggior grossezza di mettallo. Et per esser meglio inteso sotto breuita pongo per essempio figurale, che sia lo sotto scritto pezzo di artegliaria, et che in quello uogliamo inuestigare quello, che di sopra fu proposto, cioe s'el suo foro, ouer uacuo della canna giace rettamente in mezzo dil mettallo, hor per uoler inuestigar tal cosa, dico, che el si die pigliar due aste dritte, et eguale, ouer due listette, come sono le due. a. b. & c. d. & con dui trauersi da un capo, ouer sopra un brazzo de tabula inchiodaruele, che stiano equidistante, et lontane l'una dall'altra alquanto piu di quello, che è la mitta della grossezza di tutto el pezzo nella parte de drio, et longhe tanto piu del uacuo della canna di tal pezzo, quanto che bisogna per mettere in li dui trauersi, ouer tabula, et dapoi cazzar l'una de dette aste, ouer liste (poniamo la. d c.) per il foro, ouer uacuo della canna, talmente che stia uniuersalmente per longo contingente con la parte superiore del foro, ouer uacuo de detta canna, come in questa prima figura appare, e dapoi misurare, ouer far misurar sottilmente la distantia, che è dal ponto. a.
  cs: |-
    způsobem. Tyč, která vede uvnitř, nejprve natáhneme a srovnáme přesně podél horní strany vývrtu {uacuo} hlavně {canna}. Když je to hotovo, změříme nebo dáme pečlivě změřit, jak daleko bude od kovu krajní část, to jest konec té tyče neboli lišty, která vede venku. Potom je třeba tyč neboli lištu, která vede uvnitř, poněkud pootočit k jiné straně vývrtu hlavně, to jest trochu změnit její místo, a na tomto druhém místě udělat totéž co předtím, totiž pozorně prohlédnout a změřit, jak daleko bude od kovu krajní část neboli konec tyče či lišty, která vede venku. Bude-li na tomto druhém místě přesně tak daleko od kovu jako v první poloze, lze usoudit, že kov je na obou místech stejně silný. Bude-li však dál, lze usoudit, že na tomto druhém místě je kov tenčí než na prvním, a to o tolik tenčí, o kolik bude vzdálenost od kovu v této druhé poloze větší než v první. A podobně, bude-li v této druhé poloze konec tyče neboli lišty blíže ke kovu než v první, platí pravý opak, totiž že na tomto druhém místě bude kov silnější než na prvním. Budeme-li takto postupovat kousek po kousku neboli strana po straně kolem celého děla {pezzo}, poznáme zřetelně, zda je vývrt {foro} přesně neboli rovně uprostřed kovu, či nikoli. Shledá-li se totiž kov všude stejně silný, lze usoudit, že vývrt je rovně uprostřed kovu a že dělo bude také střílet své rány {tiri} přímo, podle toho, jak celé dělo vypadá navenek. Shledá-li se však, že je kov na jedné straně silnější než na druhé, lze usoudit, že vývrt není rovně uprostřed kovu, a tedy že dělo nebude střílet své rány přímo podle vnějšího vzhledu celého děla, nýbrž vždy odchýleně neboli šikmo k té straně, kde bude kov silnější. To jest, bude-li tato větší síla na pravé straně, bude střílet stranou {costero} k téže, totiž pravé straně, a naopak. A bude-li větší síla šikmo {in sgalembro}, řekněme mezi pravou stranou a horní částí děla, bude dělo své rány střílet rovněž šikmo, to jest odchýleně neboli s odklonem vzhůru, ale k téže straně, kde je ta větší síla; a tak je třeba to chápat a usuzovat, ať je větší síla kovu na kterékoli straně. Abych byl stručně a lépe pochopen, předpokládejme pro názornost, že máme níže nakreslené dělo {pezzo di artegliaria} a chceme u něj zjistit to, co bylo navrženo výše, totiž zda jeho vývrt neboli dutina hlavně leží rovně uprostřed kovu. Abychom to zjistili, pravím, že je třeba vzít dvě rovné a stejné tyče nebo dvě lištičky, jako jsou tyto dvě, a. b. a c. d., a na jednom konci je přibít na dvě příčky {trauersi} neboli na prkno dlouhé loket {brazzo} tak, aby byly rovnoběžné a od sebe vzdálené o něco víc, než je polovina tloušťky celého děla v jeho zadní části, a delší než vývrt hlavně toho děla o tolik, kolik je třeba k připevnění na obě příčky neboli prkno. Potom jednu z těch tyčí neboli lišt (řekněme d c.) zasunout do vývrtu neboli dutiny hlavně tak, aby po celé délce přiléhala k horní části vývrtu neboli dutiny hlavně, jak je vidět na tomto prvním obrazci, a pak změřit nebo dát pečlivě změřit vzdálenost, která je od bodu a.
