bloky:
- typ: odstavec
  de: |-
    SVpposte adunque le sopradette suppositione, adduco questa propositione, & dico che ogni librato peso partendosi dal sito, ouer luoco della equalita, quel si fa piu leue, & tanto piu, quanto piu sara lontano dal detto luoco della equalita. Et per essempio di questa propositione sia la libra .a.b. (della figura precedente) girabile sopra el detto centro .c. con li dui medesimi corpi .a. & .b. (equali) appesi, ouer congionti alle due estremita di ambi dui li brazzi della detta libra, & stiano nel medesimo sito della equalita (come di sopra fu supposto) hor dico, che remouando l'uno, & l'altro de detti corpi dal detto sito della equalita (cioè arbassandone uno, & elleuando l'altro) l'uno, e l'altro de quelli sara fatto piu leue secondo el luoco, & tanto piu leui, quanto che piu saranno allontanati dal detto luoco della equalita. Et per dimostrar questo sia arbassato el corpo .a. (della detta figura precedente) per fina al ponto .u. (come nella sotto scritta figura appare, & l'altro suo opposito (cioè el corpo .b.) uerra à esserse elleuato per in fina al ponto .i. & sia diuiso l'uno, e l'altro di dui archi .a.u. & .i.b. in quante parti si uoglia, equale hor poniamo l'uno, e l'altro in trei parti equali in li ponti .l.n. et .q.s. & dalli trei ponti .n.l.i. siano tirate le tre linee .n.o. .l.m. & .i.k. equidistante al diametro .b.a. le quale segarano la linea .e.f. della direttione nelli trei ponti .z.y.x. simelmente dalli trei ponti .q.s.u. siano tirate le tre linee .q.p. .s.r. & .u.t. pur equidistante alla medema linea .a.b. le quale segarano la medema linea della direttione nelli tre ponti, &.ꝯ.ꝝ. Onde per queste cose cosi desposite ueniremo ad hauer diuiso tutto el decenso .a.u. fatto dal detto corpo .a. nel discender in ponto .u. in trei decensi, ouer parti equali, le quale sono .a.q. .q.s. & .s.u. Et simelmente tutto el decenso .i.b. qual faria el detto corpo .b. nel discendere, ouer ritornare al suo primo luoco (cioè in ponto .b.) uerra à esser diuiso in trei decensi, ouer in tre parti equali, le quali sono .i.l. .l.n. & .n.b. & cadauno de questi tre, & tre partiali decensi capisse una parte della linea della direttione, cioè el decenso dal .a. al .q. piglia, ouer capisse dalla linea della direttione la parte .c.&. lo decenso .q.s. piglia, ouer capisse la parte, &.ꝯ. & lo decenso .s.u. capisse la parte .ꝯ.ꝝ. & perche la parte .c.&. è maggiore della parte .&.ꝯ. (come facilmente geometrice se puo prouare) onde (per la seconda suppositione) el decenso .q.s. uerra à esser piu obliquo del decenso .a.q. onde piu leue sara el detto corpo .a. (per la suppositione) stante quello in ponto .q. di quello sara, stante quello in ponto .a. Simelmente perche la parte .ꝯ.ꝝ. (della linea della direttione) è menore della parte .&.ꝯ. el decenso .s.u. (per la medesima seconda suppositione sara piu obliquo del decenso .q.s. & consequentemente) per la prima suppositione piu leue sara el detto corpo .a. stante quello in ponto .s. di quello sara stante in ponto .q. Et tutto questo, & per li medesimi modi se demostrara nella opposita parte del corpo .b. cioè chel decenso di quello dal ponto .i. al ponto .l. è piu obliquo di quello, che è dal ponto .l. al ponto .n. (per la detta seconda suppositione) perche la parte .x.y. che capisse della linea della direttione, è menore della parte .y.z. onde per la detta prima suppositione piu leue sara el detto corpo stante quello in ponto .i. di quello sara stante quello in ponto .l. & per le medesime ragioni piu leue sara stante quello in ponto .l. di quello sara stante in ponto .n. & simelmente piu leue sara stante in ponto .n. di quello sara stante in ponto .b. (sito della equalita) che è il proposito.
  cs: |-
    Za těchto předpokladů {suppositione} uvádím tuto větu {propositione} a pravím: každé závaží zavěšené na váze {librato peso}, vzdaluje-li se z polohy čili místa rovnosti {sito della equalita}, stává se lehčím, a to tím lehčím, čím dále bude od zmíněného místa rovnosti. Za příklad této věty budiž váha a b (z předchozího obrazce), otáčivá kolem zmíněného středu c, se dvěma týmiž (stejnými) tělesy a a b zavěšenými čili připojenými na oba konce obou ramen té váhy, a nechť jsou v téže poloze rovnosti (jak bylo výše předpokládáno). Nyní pravím, že když se obě tato tělesa z polohy rovnosti vychýlí (totiž jedno se sníží a druhé zvedne), stane se každé z nich lehčím podle polohy, a to tím lehčím, čím více budou od zmíněného místa rovnosti vzdálena. Abych to dokázal, budiž těleso a (z předchozího obrazce) sníženo až do bodu u (jak je vidět na níže uvedeném obrazci), takže druhé, protilehlé těleso (totiž b) se zvedne až do bodu i. Oba oblouky a u a i b budiž rozděleny na libovolný počet stejných dílů; nyní je rozdělme každý na tři stejné díly v bodech l, n a q, s. Ze tří bodů n, l, i budiž vedeny tři čáry n o, l m a i k rovnoběžné s průměrem b a, které protnou čáru směru {linea della direttione} e f ve třech bodech z, y, x; podobně ze tří bodů q, s, u budiž vedeny tři čáry q p, s r a u t, rovněž rovnoběžné s touž čárou a b, které protnou tutéž čáru směru ve třech bodech &, ꝯ, ꝝ[^1]. Tímto uspořádáním rozdělíme celé klesání {decenso} a u, které vykoná těleso a při sestupu do bodu u, na tři klesání čili tři stejné díly, totiž a q, q s a s u. A podobně celé klesání i b, které by vykonalo těleso b při sestupu čili návratu na své první místo (totiž do bodu b), bude rozděleno na tři klesání čili tři stejné díly, totiž i l, l n a n b. Každé z těchto tří a tří dílčích klesání pojme jednu část čáry směru: klesání z a do q zabírá čili pojme z čáry směru část c &, klesání q s zabírá čili pojme část & ꝯ a klesání s u pojme část ꝯ ꝝ. A protože část c & je větší než část & ꝯ (jak lze snadno geometricky dokázat), bude podle druhého předpokladu klesání q s šikmější {obliquo} než klesání a q; proto bude těleso a (podle [prvního] předpokladu) lehčí, když bude v bodě q, než když bude v bodě a. Podobně, protože část ꝯ ꝝ (čáry směru) je menší než část & ꝯ, bude klesání s u podle téhož druhého předpokladu šikmější než klesání q s, a tudíž bude podle prvního předpokladu těleso a lehčí, když bude v bodě s, než když bude v bodě q. To vše se týmž způsobem dokáže i na protější straně u tělesa b: totiž že jeho klesání z bodu i do bodu l je šikmější než klesání z bodu l do bodu n (podle zmíněného druhého předpokladu), protože část x y, kterou pojme z čáry směru, je menší než část y z; proto podle zmíněného prvního předpokladu bude toto těleso lehčí, když bude v bodě i, než když bude v bodě l, z týchž důvodů bude lehčí v bodě l než v bodě n, a podobně bude lehčí v bodě n než v bodě b (v poloze rovnosti), což bylo dokázati.
poznamky:
- n: 1
  text: |-
    Když tiskaři došla písmena abecedy, označil body na svislici znaky „&“ (et), „ꝯ“ (zkratka con-) a „ꝝ“ (zkratka -rum); v přepisu i překladu jsou ponechány. Na obrazci na [[009v|následující straně]] je střed vah označen c a body na svislici shora x, y, z, c, &, ꝯ, ꝝ. Závorky v textu jsou v tisku místy umístěny nepřesně (např. „per la medesima seconda suppositione … & consequentemente)“).
