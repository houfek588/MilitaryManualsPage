  de: |-
    rettilinea inscritta in quella curuilinea, & darui poi alli suoi debiti luochi alquanto di curuita per pratica, cioe à descrittione, & per esser meglio inteso, supponeremo che il sia uno paese contenuto la maggior parte da linee curue, come di sotto appare in figura. Dico à uoler metter in dissegno questa tal figura, et altre simile piantato, che se habbia il detto nostro istromento in meggio del detto sito, uel circa, come di sotto appare, & quello agiustato, ouer assettato secondo il suo ordine el si de far piantar molte bacchette per la circonferentia di quelle curuita, & doue è maggior curuita piantarui molto piu spesse le dette bacchette per potersi con linee rette piu approssimarse à quella curuita, come di sotto appare, & supponer che quelle differentie che è da bacchetta à bacchetta siano lati de una figura rettelinea inscritta in quella figura curuilinea, e pertanto el si debbe andar trasguardando con la nostra dioptra cadauna di dette bacchette, & notare nella pollicetta per qual grado passara cadauna linea uisuale con la sua quantita di passa, che sara dal piede dell'istromento à cadauna bacchetta, & fatto questo, il se debbe far un qualche segno, ouer nota per memoria de quelle sue curuita, cioe se tai curuita danno in fuora, ouer se se incarnano in dentro della figura, & dapoi cauar l'istromento, & andarsene à casa, & uolendo poi mettere tal dissegno in carta, ouer in tela, distesa quella sopra una tauola secondo il solito, il si de prima mettere in dissegno quella figura rettelinea inscritta (ma non tirar li suoi lati per linea retta, ma andar congiongendo le istremita di quelle linee (terminate con il solito ponto fermo) con una linea alquanto curuata in fuora, ouer in dentro secondo che dinotara quel segno che gia fu annotato per memoria, ilche facendo se fara una figura simile à quella di quel tal paese. ouer sito, granda, ouer piccola secondo che si uorra, cioe uolendola far granda se fara anchora la nostra scala (detta nel precedente quesito) de .100. passa alquanto longa, & uolendola piccola, se fara la detta scala alquanto curta, & bisogna notare, che quantunque io habbia tirate quelle .25. linee nel nostro dissegno tutte apparente, et l'haggio fatto, accio che piu euidentemente si ueda il modo de procedere, perche le dette .25. linee sono relatiue à quelli .25. interualli, che sono dal piede del nostro
  cs: |-
    přímočarý obrazec vepsaný do onoho křivočarého a dát mu pak na příslušných místech od ruky, totiž odhadem,[^1] trochu zakřivení. A abych byl lépe pochopen, předpokládejme krajinu {paese} ohraničenou z větší části křivkami, jak je vidět níže na obrázku. Pravím, že chceme-li zakreslit takový obrazec a jiné podobné, když jsme náš nástroj zarazili uprostřed toho místa {sito} nebo zhruba uprostřed, jak je vidět níže, a vyrovnali či usadili ho podle jeho řádu, je třeba dát po obvodu oněch zakřivení zarazit mnoho tyček {bacchette}, a kde je zakřivení větší, zarazit tyčky mnohem hustěji, aby se přímkami dalo tomu zakřivení co nejvíce přiblížit, jak je vidět níže; a předpokládat, že ty úseky mezi jednotlivými tyčkami jsou strany přímočarého obrazce vepsaného do onoho křivočarého obrazce. Proto je třeba postupně zaměřit naší dioptrou {dioptra} každou z těch tyček a zapsat na lístek {pollicetta}, kterým stupněm prochází každá zorná čára {linea uisuale}, spolu s počtem kroků {passa} od paty nástroje k té které tyčce. Když je to hotovo, je třeba udělat si nějakou značku nebo poznámku pro paměť o těch zakřiveních, totiž zda se vyklenují ven, nebo zda se zahlubují dovnitř obrazce. Potom se nástroj vytáhne a jde se domů. A když pak chceme tu kresbu přenést na papír nebo plátno, rozprostřené jako obvykle na desce, je třeba nejprve zakreslit onen vepsaný přímočarý obrazec (avšak jeho strany nevést přímou čarou, nýbrž spojovat konce oněch přímek (ukončených obvyklým pevným bodem) čárou poněkud vyklenutou ven nebo dovnitř, podle toho, co ukazuje ona značka, která byla zapsána pro paměť. Tím se vytvoří obrazec podobný obrazci té krajiny čili místa, velký nebo malý, jak budeme chtít: totiž chceme-li ho udělat velký, uděláme i naše měřítko {scala} o 100 krocích (zmíněné v předchozím dotazu) poněkud delší, a chceme-li ho malý, uděláme měřítko poněkud kratší. A je třeba si povšimnout, že ačkoli jsem v naší kresbě narýsoval oněch 25 přímek všechny viditelně – a učinil jsem tak proto, aby byl postup zřetelněji vidět, neboť těch 25 přímek odpovídá oněm 25 vzdálenostem, které vedou od paty našeho
- typ: obrazek
  soubor: drevorez-117.jpg
  popis: Zakreslování krajiny ohraničené převážně křivkami. Nahoře je obvod tvořen velkým obloukem, po stranách mírně prohnutými čarami, dole lomenou čarou z přímých úseků. Po celém obvodu stojí svislé tyčky, na oblouku hustě vedle sebe. Uprostřed je buzola s otočnou dioptrou (bez písmen) a od jejího středu vede ke každé tyčce přímka – celkem 25 zorných čar. Písmena obrazec nemá.
poznamky:
- n: 1
  text: „Per pratica, cioe à descrittione“ – patrně „a discretione“ (podle uvážení, odhadem); Tartaglia slova descrittione a discretione zaměňuje (srov. „discretion piccole“ na 58v).
