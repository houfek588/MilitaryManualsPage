  de: |-
    dara di sopra dal segno, perche per un longo tramito, ouer spacio, il transito della balla passa di sopra dalla linea uisuale, e pero quanto piu lontano sara il detto segno dal ponto.k.per un longo spacio, tanto piu alta sara la botta, uero è, che à longo andare la balla con il transito suo curuo, ouer naturale ritornera à segare un'altra uolta la nostra linea uisuale, perche la nostra linea uisuale.c.d.k.l.procede in infinito rettamente, & la balla per il transito.h.k.i.non procede in infinito, anci con tempo ua mancando, & si ua curuando uerso il centro del mondo, & finalmente se redrizza rettamente di moto naturale (non trouando resistentia) uerso il detto centro del mondo, e pero eglie necessario che a longo andare che la ritorni con il transito suo à intersecarse un'altra uolta con la nostra linea uisuale, e pero se il detto segno fusse tanto, & tanto lontano, cioe tanto oltra la prima intersecatione fatta in ponto.k.& che per sorte fusse anchora precisamente in quella altra seconda intersecatione, senza dubbio in tal luoco cosi lontano se daria precisamente in brocca, perche ogni uolta che la nostra linea uisuale seghi il transito della balla, eglie necessario che la seghi quello in dui lochi, l'uno de quali, cioe il primo, non puo esser molto lontano, ma l'altro, cioe il secondo è necessario che sia molto, e molto lontano, cioe quasi in fine del suo moto uiolente, & tal hora potria esser nel suo moto, ouer transito naturale, e pero in tal caso essendo il segno che se tuol de mira, in qual si uoglia de questi dui lochi, ouer intersecationi, necessariamente se daria in brocca.
  cs: |-
    zasáhne nad cíl {segno}, neboť na dlouhé cestě {tramito} čili úseku probíhá dráha {transito} koule {balla} nad zornou čárou {linea uisuale}; a proto čím dál bude cíl od bodu k, na dlouhém úseku, tím výše bude rána {botta}. Je ovšem pravda, že nakonec koule se svou zakřivenou čili přirozenou dráhou opět protne naši zornou čáru. Naše zorná čára c d k l totiž pokračuje přímo do nekonečna, kdežto koule po dráze h k i do nekonečna nepokračuje, nýbrž časem ochabuje a zakřivuje se ke středu světa, až se nakonec přirozeným pohybem {moto naturale} (nenajde-li odpor) narovná přímo k tomuto středu světa. Proto musí nakonec svou dráhou naši zornou čáru znovu protnout. Kdyby tedy cíl byl tak a tak daleko, totiž tolik za prvním průsečíkem v bodě k, že by náhodou ležel přesně i v tom druhém průsečíku, bez pochyby by se na tom tak vzdáleném místě zasáhlo přesně do středu {in brocca}. Kdykoli totiž naše zorná čára protne dráhu koule, musí ji protnout na dvou místech: jedno z nich, totiž první, nemůže být příliš daleko, ale druhé musí být velmi, velmi daleko, totiž skoro na konci jejího násilného pohybu {moto uiolente}, a někdy by mohlo ležet i v jejím přirozeném pohybu čili dráze. A proto, bude-li cíl, na který se míří, na kterémkoli z těchto dvou míst čili průsečíků, zasáhne se nutně do středu.
