  cs: |-
    **Nicolò.** Mějme například níže nakreslené dělo {artegliaria} se dvěma mířidly {mire} c a d podle našeho předpokladu, totiž že mířidlo d je o tolik nižší než mířidlo c, že naše zorná čára protne dráhu čili cestu {uiaggio}, kterou má koule vykonat. Celá dráha čili cesta, kterou koule (nenajde-li odpor) násilným pohybem vykonala nebo by vykonala, budiž celá čára h i k l m, a čára m n budiž ta část dráhy čili cesty, kterou vykonala nebo by vykonala přirozeným pohybem. Pravím tedy: protne-li naše zorná čára (vedoucí přes vrcholy obou mířidel c a d) uvedenou dráhu čili cestu h i k l m n, a pokračuje-li přímo do nekonečna, musí (z důvodů uvedených výše) tuto dráhu čili cestu protnout na dvou místech, totiž jednou v přímé (čili méně zakřivené) části h i k a podruhé v zakřivené části k l m nebo v přirozené dráze m n. Předpokládejme nyní, že ji v přímé části h i k protne v bodě i a v zakřivené v bodě l (jak je vidět na obrazci). Uzavírám tedy, že bude-li zamířený cíl
