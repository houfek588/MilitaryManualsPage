  de: |-
    PRIORE. Questa Speculatione molto mi piace, & è molto bella, ma non ho troppo ben intesa questa ultima particularita che mi haueti detta, cioe che in dui segni posti in dui diuersi luoghi, ui si possa tirar, & dar de mira, e pero datime un'essempio se possibil è in figura, perche à mi me pare che tal cosa non sia possibile.
  cs: |-
    **Převor.** Tato úvaha {Speculatione} se mi velmi líbí a je velmi krásná, ale ne zcela dobře jsem pochopil tu poslední zvláštnost, kterou jste mi řekl, totiž že na dva cíle postavené na dvou různých místech lze střílet a zasáhnout je podle mířidel {de mira}. Dejte mi proto, je-li to možné, příklad na obrazci, neboť se mi zdá, že taková věc není možná.
