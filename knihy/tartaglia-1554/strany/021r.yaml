  de: |-
    se gli da el fuoco, se abbrusa auanti di quella, che glie piu remota, & per esser meglio inteso, diuidamo con la mente tutta la longhezza della poluere, che se ritroua in detta canna in quattro parti equali. Dico adunque, che quella quarta parte, che termina al buso, doue che ui si da el fuoco, se abbrusa auanti dell'altra consequente parte, & brusiando genera tanta gran quantita di essalation uentosa, che diece luochi equali al luoco della poluere abbrusata non sariano capaci per la detta essalatione, & per tanto secondo che la detta essalatione continuamente se ua causando, per la poluere, che continuamente se ua abbrusando. Anchora eglie necessario à quella tal essalatione continuamente andarse acquistando per forza luoco maggiore assai, di quello della poluere, da che eglie causata, & questo luoco la nol puol acquistare, saluo che per due uie. La prima è spingendo per forza auanti il restante della poluere, non abbrusata, che è uerso la bocca del pezzo insieme con la balla, oueramente far crepare il pezzo, & perche eglie da credere, che piu facil ui sia à spingere fuora la detta poluere insieme con la balla, che à far creppar il pezzo, & massime per esser la balla nella istremita della canna, diremo adunque, che la prima quarta parte de ditta nostra poluere, che prima se abbrusa, brusando continuamente ua spingendo auanti l'altra poluere, che si ua trouando auanti di se, & consequentemente quella spenge la balla, et per esser la balla cosi propinquissima all'uscita alla prima, & minima urtata, che nel principio sente, quella uscisse del pezzo subito, spinta solamente dalla poluer sana (come detto) & non dalla propria essalatione della poluere abbrusata, lo qual spengimento (per esser fatto cosi nel principio) non puo esser se non dabole nella balla, dico debole rispetto à quello che saria, quando che quella fusse spinta dalla propria essalatione uentosa, et nel colmo della gran furia di quella: Et oltra di questo, la balla nell'uscire del pezzo è seguitata (per alquanto) dalla poluere sana, la qual poluere da li à un puoco cade in terra, la qual poluere nel andar per aere, & poi nel cader in terra, molto interrompe el moto di quella essalatione uentosa, che dapoi seguita la balla, il che non poco nuoce al moto di quella, Si che per queste ragioni tal balla (in simel caso) non andara molto da lontano: ma che ricargasse tal pezzo con alquanto men poluer senza dubbio lui tiraraue assai piu di quello faria, essendo cosi piena la canna, perche se in questo secondo modo ui mancasse à impire tutta la canna dui diametri di balla, cargato che sia la balla, non se ritrouara cosi nella istremita della bocca del pezzo, ma piu in dentro, & pero quella non uscira cosi della bocca del pezzo alla prima, & minima urtata dalla poluere, anci resistera per un poco piu dell'altra, nel qual tempo, molto piu poluere sara abbrusata, et consequentemente maggior quantita de essalatione uentosa sara causata, & tal balla da maggior impeto, ouer furore sara urtata, & spinta, dico urtata, & spinta pur dalla poluere, & non dalla propria essalatione uentosa, si come dell'altro tiro fu detto, & cosi per tale euidente ragioni, in questo secondo tiro con men poluere, conchiudemo che tirara piu lontano di quello, faria al primo con quasi tutta la canna piena di poluere, et simelmente, che recargasse tal pezzo anchor con men poluere, cioè poniamo con tanta poluere, che ui mancasse à impire tutta la canna tre diametri di balla, dico che in tal caso lui tiraria piu di quello faria cargandolo, secondo che di sopra fu detto, cioè solamente per dui diametri manco, & cosi chel cargasse per quattro diametri manco
  cs: |-
    se dává oheň, shoří dříve než ta, která je od něj vzdálenější. A abych byl lépe pochopen, rozdělme si v duchu celou délku prachu {poluere}, který je v hlavni {canna}, na čtyři stejné díly. Pravím tedy, že ta čtvrtina, která sahá k otvoru {buso}, kudy se dává oheň, shoří dříve než následující díl a hořením vytvoří tak velké množství větrného výparu {essalation uentosa}, že by deset míst rovných místu spáleného prachu nestačilo tento výpar pojmout. A proto, jak tento výpar ze stále hořícího prachu neustále vzniká, musí si také neustále silou získávat mnohem větší místo, než je místo prachu, z něhož vzniká; a toto místo si nemůže získat jinak než dvěma cestami. První je, že silou žene před sebou zbytek nespáleného prachu, který je směrem k ústí děla {pezzo}, spolu s koulí {balla}; druhá, že dělo roztrhne. A protože je třeba věřit, že je snazší vytlačit uvedený prach spolu s koulí ven než roztrhnout dělo, zvláště když je koule na samém konci hlavně, řekneme tedy, že první čtvrtina našeho prachu, která shoří jako první, hořením neustále žene před sebou ostatní prach, který nachází před sebou, a ten pak žene kouli. A protože je koule tak velmi blízko u východu, vyletí z děla hned při prvním a nejmenším nárazu, který na počátku pocítí, hnána jen neporušeným prachem (jak bylo řečeno), a ne vlastním výparem spáleného prachu. Toto pohánění (protože se děje tak na počátku) nemůže být na kouli než slabé – slabé, říkám, ve srovnání s tím, jaké by bylo, kdyby ji hnal vlastní větrný výpar, a to na vrcholu jeho velké zuřivosti. A kromě toho kouli při výletu z děla (nějakou dobu) sleduje neporušený prach, který za chvíli padá na zem; tento prach při letu vzduchem a pak při pádu na zem velmi přerušuje pohyb onoho větrného výparu, který potom kouli sleduje, a to jejímu pohybu nemálo škodí. Z těchto důvodů tedy taková koule (v takovém případě) nedoletí příliš daleko. Kdyby se však dělo znovu nabilo s o něco menším množstvím prachu, bez pochyby by dostřelilo mnohem dál, než když je hlaveň takto plná. Kdyby totiž při tomto druhém způsobu chyběly do naplnění celé hlavně dva průměry koule, nebude koule po nabití tak na samém konci ústí děla, nýbrž hlouběji uvnitř; proto nevyletí z ústí děla hned při prvním a nejmenším nárazu prachu, nýbrž odolá o něco déle než ta první. Během té doby shoří mnohem víc prachu, a tudíž vznikne větší množství větrného výparu, a koule bude naražena a hnána větším náporem čili zuřivostí – naražena a hnána, říkám, stále ještě prachem, a ne vlastním větrným výparem, jak bylo řečeno o prvním výstřelu. A tak z těchto zřejmých důvodů uzavíráme, že při tomto druhém výstřelu s menším množstvím prachu dostřelí dál než při prvním s hlavní téměř celou plnou prachu. A podobně, kdyby se dělo nabilo ještě menším množstvím prachu, řekněme tolika, aby do naplnění celé hlavně chyběly tři průměry koule, pravím, že v takovém případě by dostřelilo dál, než kdyby se nabilo, jak bylo řečeno výše, totiž jen o dva průměry méně. A tak kdyby se nabilo o čtyři průměry méně,
