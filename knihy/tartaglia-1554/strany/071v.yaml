  de: |-
    perche sensibilmente si uede, che il cauallero .2. puo guardare, et difendere la banda .u.x. del baluardo .c. & similmente la banda .s.t. del baluardo .a. & quelle medesime puol guardar anchora lo cauallero .3. Et oltra di questo uoglio, che guardino per longo uia tutto quel spacio ingolfato per fin nella campagna istrinseca, & massime uoglio, che guardino quelle riuere, ouer spacij arginati, che procedono secondo le lettere .i.n.o. & .k.l.m. ilche commodamente faranno, uero è, che discommodamente potranno guardare il spacio, che procede secondo le lettere .k.h.i. per esser forsi troppo sotto de loro, ma tal parte potra esser facilmente guardata, & difesa dalli dui baluardi .a. & .c. & dalli dui caualleri .f. & .g. & da molte altre bande, come nel nostro processo se intendera. Perche uoglio anchora, che nella sommita di ciascaduna cortina (per longo uia) sia fatto con trauetti piantati, & buone tauole molte parianette alte alquanto piu dell'altezza de un'huomo, le quai parianette trauersino tutta la sommita della detta cortina, ma che tal trauersamento non uadi ad angolo retto sopra alla detta cortina, anci uoglio, che procedano con la parte di fuora alquanto uerso la citta, & con la parte di dentro obliquarsi in fuora uerso la campagna, come si uede designato nella presente figura, uero è, che le dette parianette uogliono esser alquanto piu oblique di quello che mostra la figura per le ragioni, che di sotto se dira, fatto questo, uoglio che dalla banda che guarda uerso la campagna di ciascaduna di dette parianette ue sia fatto un'arginetto di terra (come si uede nelle due parianette .p. & .r.) di tanta grossezza, che non possa esser danneggiato da nemici con le sue artegliarie, & sotto à ciascaduno de detti argenetti, uoglio che ui sia assettato, ouer posto un falconetto da .6. ouer da .3. lire di balla, & per questo uoglio che le dette parianette, & argenetti siano alti alquanto piu de un'huomo, accio che facciano scudo à ciascun de detti falconetti, che non possano esser danneggiati da nemici con le sue artegliarie, & uoglio anchora che tai argenetti stiano alquanto obliqui con la parte dauanti uerso la citta, accio che li nemici non possino uedere ne tirare per la parte dauanti sotto alli detti argenetti, cioe nel luoco doue sta li detti falconetti, perche il proprio officio de tutti questi falconetti, uoglio che sia di guardare minutamente tutto quel spacio ingolfato fra le gia dette lettere .o.y.z.m.l.k.h.i.n. & alquanto piu in fuora del angolo .o. & .m. cioe cercar de far che gli falconetti della cortina .a.b. tutti possino tirare, & guardare stanti sotto al suo arginetto, per otto, ouer dieci passa piu in fuora del ponto .o. & quelli della cortina .c.b. guardino il medesimo piu in fuora del ponto .m. accio che niun sia sicuro sotto alli argini di terra, che saranno di fuora del fosso à de rimpetto delli dui baluardi .a. & .c. perche nel far delli fossi, ouer fosse, uoglio che la mitta della terra, che se ne caua sia gettata di dentro della citta per far li argeni de drio alle cortine con li suoi contraforti, come si costuma nelle moderne fortificationi. Et uoglio che per piedi .12. (uel circa) lontano da lhoro della fossa di fuora uia sia fatto un muro commune secondo l'andar della detta fossa, alto circa dui piedi manco della cortina di dentro, & à quel tal muro di fuora uia farui li suoi contraforti, & fra quelli contraforti gettarui quella mitta della terra, che se caua della gia detta fossa, facendo con tal terra un grosso argine di fuora uia di tal muro, il qual argine uada procedendo secondo le lettere .m.l.k.h.i.n.o. & discendendo à scarpa uerso lo ingolfato spacio, che è di fuora uia, il qual argine oltra che uenira à far scudo quasi à
  cs: |-
    neboť je zřetelně vidět, že kavalír {cauallero} 2. může střežit a bránit stranu u.x. bašty {baluardo} c. a podobně stranu s.t. bašty a.; a tytéž strany může střežit i kavalír 3. Kromě toho chci, aby podélně střežily celý onen zálivový prostor až do vnějšího předpolí {campagna}, a zvláště chci, aby střežily ony břehy {riuere} neboli prostory s náspy, které probíhají podle písmen i.n.o. a k.l.m., což pohodlně dokážou. Je ovšem pravda, že jen nepohodlně budou moci střežit prostor, který probíhá podle písmen k.h.i., protože leží snad příliš pod nimi; tuto část však mohou snadno střežit a bránit obě bašty a. a c., oba kavalíry f. a g. a také mnoho jiných míst, jak se z našeho výkladu pochopí. Chci totiž také, aby se na temeni každé kurtiny {cortina} (podél ní) udělalo ze zaražených trámků a dobrých prken mnoho příček {parianette}[^1] o něco vyšších, než je výška člověka; tyto příčky ať přetínají celé temeno kurtiny, ale ne v pravém úhlu ke kurtině, nýbrž chci, aby se vnější částí poněkud stáčely k městu {citta} a vnitřní částí šikmo ven k předpolí, jak je vidět nakresleno na tomto obrazci. Je ovšem pravda, že tyto příčky mají být o něco šikmější, než ukazuje obrazec, a to z důvodů, které budou řečeny níže. Když se to udělá, chci, aby se na straně každé příčky obrácené k předpolí udělal hliněný náspek {arginetto} (jak je vidět u dvou příček p. a r.), tak silný, aby mu nepřátelé nemohli uškodit svým dělostřelectvem {artegliarie}; a pod každý z těch náspků chci, aby se postavil neboli umístil falkonet {falconetto} na kouli o 6 nebo 3 librách {lire}. Proto chci, aby tyto příčky a náspky byly o něco vyšší než člověk, aby každému z falkonetů dělaly štít a nepřátelé mu nemohli uškodit svým dělostřelectvem. A chci také, aby tyto náspky stály poněkud šikmo, přední částí k městu, aby nepřátelé nemohli zpředu vidět ani střílet pod tyto náspky, totiž na místo, kde stojí falkonety. Chci totiž, aby vlastním úkolem všech těchto falkonetů bylo pečlivě střežit celý onen zálivový prostor mezi už uvedenými písmeny o.y.z.m.l.k.h.i.n. a ještě o něco dál ven od úhlů o. a m.; totiž zařídit, aby všechny falkonety kurtiny a.b. mohly, stojíce pod svým náspkem, střílet a střežit osm až deset kroků {passa} dále ven od bodu o., a falkonety kurtiny c.b. totéž dále ven od bodu m., aby nikdo nebyl v bezpečí pod hliněnými náspy {argini}, které budou vně příkopu {fosso} naproti oběma baštám a. a c. Při kopání příkopů totiž chci, aby se polovina vykopané zeminy házela dovnitř města k vytvoření náspů za kurtinami s jejich opěrnými pilíři {contraforti}, jak je u moderních opevnění {fortificationi} obvyklé. A chci, aby se asi 12 stop {piedi} od vnějšího okraje příkopu udělala podél příkopu prostá zeď, asi o dvě stopy nižší než vnitřní kurtina; z vnější strany se k ní udělají opěrné pilíře a mezi ně se nasype ona polovina zeminy vykopané z příkopu, takže vně zdi vznikne mohutný násep, který bude probíhat podle písmen m.l.k.h.i.n.o. a svažovat se ve svahu {scarpa} k vnějšímu zálivovému prostoru. Tento násep kromě toho, že bude dělat štít téměř
poznamky:
- n: 1
  text: Parianette – příčné stěnky (traverzy) z trámků a prken napříč ochozem kurtiny, za nimiž stojí falkonety kryté hliněným náspkem; Tartaglia je natáčí šikmo, aby kryly děla před přímou palbou z pole.
