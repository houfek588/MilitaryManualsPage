bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    me par molto difficile da intendere.
  cs: |-
    zdá velmi nesnadné ji pochopit.
- typ: odstavec
  de: |-
    N. La non è cosi difficile, come la pare, & che il sia il uero, sia essempi gratia fanti .25. in forma quadra di gente, come di sopra appare in figura, & per esser meglio inteso me apparso di formar tal figura con .25. lettere del nostro alphabeto, hor uolendo trasmutare cal figura quadrata di gente, in una figura cunea, primamente gli faccio uoltar tutti con la faccia in quel uerso che è fra la fronte, & quel fianco doue mi pare di uoler costituire la ponta del cuneo, essempi gratia uolendo che la ponta di tal figura cunea sia l'angolo .e. faro che tutti si uoltano con
  cs: |-
    **Nicolò.** Není tak nesnadná, jak se zdá, a na důkaz, že je tomu tak: mějme například 25 pěšáků {fanti} ve tvaru čtverce co do mužstva {forma quadra di gente}, jak je vidět výše na obrazci; abych byl lépe pochopen, rozhodl jsem se vytvořit ten obrazec z 25 písmen naší abecedy. Chci-li tedy přeměnit tento obrazec čtvercový co do mužstva v obrazec klínový {figura cunea}, nejprve je všechny nechám obrátit tváří tím směrem, který leží mezi čelem {fronte} a tím bokem, kde chci zřídit hrot klínu. Chci-li například, aby hrotem toho klínového obrazce byl roh e, nechám všechny obrátit
- typ: obrazek
  soubor: drevorez-104.jpg
  popis: >-
    Týž čtverec z 25 písmen (a b c d e / f g h i k / l m n o p / q r ſ t u / x y z & ꝯ), ale každé
    písmeno je pootočené o 45° doprava, tj. pěšáci se obrátili šikmo mezi čelo a pravý bok. Šikmo
    vpravo nahoře u rohu e nápis „fronte“ (nové čelo).
- typ: odstavec
  de: |-
    la faccia per quel uerso che è fra la fronte, & il fianco destro, cioe uerso l'angolo .e. la qual cosa essequida tal figura uerra à stare, come qui sotto appare, nella qual figura il si uede che ui sono molti fanti che non hanno compagno nella consueta distantia auanti di se, uero che hanno ben compagno rettamente auanti di se, ma molto piu lontano del solito, cioe il doppio del solito, come appare al .f. il qual ha rettamente auanti di se il .b. ma la distantia che è dal detto .f. al detto .b. è il doppio della distantia consueta, onde sel .f. uorra osseruare li precetti di sopra adutti, subito che hauera uoltato la faccia uerso tal uerso immediate se andara ad approssimarse al detto .b. nella consueta distantia, il che facendo se cacciara fra .a. et .g. uero è, che il detto .g. non restara nel suo luoco presente, ma se trasferira appresso al .c. in distantia consueta, & nel luoco doue prima era il .g. ui conueneria uenir .l. tal chel .f. se trouara fra .a. & .l. & cosi se tutti gli altri procederanno auanti secondo il detto ordine, cioe per fina che trouano compagno in distantia consueta auanti di se la .h. se andara ad approssimarse al .d. & lo .m. seguitara la detta .h. & il .q. seguitara drio al detto .m. tutti per fina alla consueta distantia, & cosi lo .i. se approssimara al .e. & lo .n. seguitara lo .i. & lo .r. seguitara lo .n. & lo .x. seguitara il detto .r. tutti per fin alla consueta distantia similmente lo .o. se approssimara al .k. & lo .s. seguitara lo .o. & .y. seguitara .s. pur per fin à distantia consueta, & cosi .t. se approssimara al .p. & .z. seguitara .t. pur per fin alla consueta distantia, & similmente, & se approssimata al .u. pur nella detta consueta distantia, la qual cosa osseruata tal ordinanza quadra di gente se sara trasmutata in una ordinanza cunea, come di sotto appare in figura, & la ponta di tal figura uerra à esser l'angolo .e. & con tal ordine se procederia se tal essercito fusse ben de .100000. fanti, pur che li detti fanti siano ben auertiti, & amaestrati di quanto di sopra è stato detto, si del sapersi uoltar, come del caminare.
  cs: |-
    tváří tím směrem, který leží mezi čelem a pravým bokem {fianco destro}, tj. k rohu e. Když se to provede, bude obrazec vypadat tak, jak je vidět zde výše[^1]. Na tom obrazci je vidět, že je tam mnoho pěšáků, kteří nemají druha v obvyklé vzdálenosti před sebou; mají sice druha přímo před sebou, ale mnohem dál než obvykle, totiž dvakrát dál než obvykle[^2], jak je vidět u f, které má přímo před sebou b, ale vzdálenost od f k b je dvojnásobkem obvyklé vzdálenosti. Bude-li tedy f chtít dodržet výše uvedená pravidla, jakmile se obrátí tváří tímto směrem, hned se přiblíží k b na obvyklou vzdálenost, a tím se vsune mezi a a g. Ovšem g nezůstane na svém nynějším místě, ale přesune se k c na obvyklou vzdálenost, a na místo, kde předtím bylo g, by mělo přijít l, takže f se ocitne mezi a a l. A tak budou-li všichni ostatní postupovat vpřed podle zmíněného řádu, totiž dokud nenajdou druha v obvyklé vzdálenosti před sebou: h se přiblíží k d, m půjde za h a q půjde za m, všichni až na obvyklou vzdálenost; stejně tak i se přiblíží k e, n půjde za i, r půjde za n a x půjde za r, všichni až na obvyklou vzdálenost; podobně o se přiblíží ke k, s půjde za o a y půjde za s, rovněž až na obvyklou vzdálenost; a stejně t se přiblíží k p a z půjde za t, rovněž až na obvyklou vzdálenost; a podobně & se přiblíží k u, rovněž na zmíněnou obvyklou vzdálenost. Když se to dodrží, přemění se ten šik {ordinanza} čtvercový co do mužstva v klínový šik, jak je vidět níže na obrazci, a hrotem toho obrazce bude roh e. A týmž řádem by se postupovalo, i kdyby to vojsko {essercito} mělo 100000 pěšáků, jen když budou ti pěšáci dobře poučeni a vycvičeni ve všem, co bylo řečeno výše, jak v obracení, tak v chůzi.
- typ: odstavec
  de: |-
    P. Questa è una bella inuentione, & di molta importantia, perche reducendo cosi
  cs: |-
    **Převor.** To je krásný vynález a velmi důležitý, protože když se takto
poznamky:
- n: 1
  text: Tisk říká „come qui sotto appare“ (jak je vidět zde níže), obrazec s pootočenými písmeny je však vysázen nad tímto odstavcem.
- n: 2
  text: Ve skutečnosti je úhlopříčná vzdálenost ve čtverci √2krát (asi 1,4krát) větší než obvyklý rozestup, ne dvojnásobná; Tartaglia zde počítá zjednodušeně. Tisková chyba „cal figura“ (místo „tal figura“) a „se approssimata“ (místo „se approssimara“) je v originále ponechána.
