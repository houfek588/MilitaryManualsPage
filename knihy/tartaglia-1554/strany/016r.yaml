    mira, sara in qual si uoglia delle dette due intersecationi, cioe in ponto.i.ouer in ponto.l.necessariamente la balla dara precisamente in brocca, & quando che il detto segno sara piu in fuora della prima intersecatione, cioe dal ponto.i.per fin al ponto.k.tanto piu alta sara la detta botta, ma quanto piu oltra al detto ponto.k.per fin al ponto.l.sara il detto segno tanto men alta sara la detta botta, ma quando che il detto segno fusse per alquanto oltra al ponto.l.tal botta necessariamente dara di sotto dal segno, & quando tal segno sara molto oltra al ponto.l.la detta balla non potra arriuare al segno, come (per ragion naturale) credo, che quella possa facilmente comprendere.
  cs: |-
    v kterémkoli z obou uvedených průsečíků, totiž v bodě i nebo v bodě l, zasáhne koule {balla} nutně přesně do středu {in brocca}. Čím dál bude cíl {segno} za prvním průsečíkem, totiž od bodu i až po bod k, tím výše bude rána {botta}; ale čím dál bude cíl za bodem k až po bod l, tím méně vysoko bude rána. Kdyby však cíl byl poněkud za bodem l, rána nutně zasáhne pod cíl, a bude-li cíl daleko za bodem l, koule k němu vůbec nebude moci doletět, jak, myslím, Vaše Milost snadno pochopí přirozeným rozumem.
