  de: |-
    N. Hiersera (se ben mi aricordo) fu detto tutti gli effetti, ouer botte che puo occorrere, quando che per la molta cortezza, ouer bassezza della mira denanti rispetto à quella de drio, la nostra linea uisuale seghera il transito, ouer uiaggio qual debbe far la balla. Et questa sera uoglio dichiarire tutti gli effetti, ouer botte, che puo occorrere, quando che la detta mira de nanti non è talmente piu corta, ouer bassa della mira de drio, quanto ui si conuegneria, per la qual causa, la nostra linea uisuale non procede tanto al basso che si possa congiongere con il transito, ouer uiaggio qual debbe far la balla, e pero in simil caso, sempre la balla dara di sotto dal segno, perche per tutto tal luoco, ouer spacio, il transito della balla passa di sotto della nostra linea uisuale, uero è, che ui è un certo luoco, nel quale la nostra linea uisuale piu se appropinqua al detto transito della balla che in ogni altro luoco, e per tanto, se per caso il segno doue se tira de mira sara nel detto luoco, a ben che la balla dara di sotto da quello pur ui dara piu propinquo che in ogni altro luoco essempi gratia sia per figura lo sottoscritto pezzo di artegliaria; le due mire delquale siamo.c.&.d.& sia il transito della balla la linea.h.i.k.& sia pur la mira denanti, cioe la.d.alquanto piu corta, ouer piu bassa della.c.ma in tanta poca quantita che la linea uisuale che transira per le istremita di quelle (quala sia la linea.c.d.m.l.) non tocchi lo detto transito.h.i.k.et sia il ponto.m.il luoco di tal linea piu propinquo al detto transito di
  cs: |-
    **Nicolò.** Včera večer (dobře-li si vzpomínám) byly popsány všechny účinky čili rány, k nimž může dojít, když pro velkou krátkost čili nízkost předního mířidla {mira denanti} vzhledem k zadnímu {mira de drio} naše zorná čára {linea uisuale} protne dráhu {transito} čili cestu, kterou má koule vykonat. A dnes večer chci objasnit všechny účinky čili rány, k nimž může dojít, když přední mířidlo není o tolik kratší čili nižší než zadní, kolik by náleželo; proto naše zorná čára nevede tak nízko, aby se mohla s dráhou čili cestou koule setkat. V takovém případě koule vždy zasáhne pod cíl, protože na celém tomto místě čili úseku probíhá dráha koule pod naší zornou čárou. Je ovšem pravda, že je jisté místo, kde se naše zorná čára k dráze koule přibližuje víc než kdekoli jinde; a proto bude-li cíl, na který se míří, náhodou na tomto místě, koule sice zasáhne pod něj, ale přece blíž k němu než kdekoli jinde. Například: mějme na obrazci níže nakreslené dělo {pezzo di artegliaria}, jehož dvě mířidla {mire} jsou c a d, a dráha koule budiž čára h i k. Přední mířidlo, totiž d, budiž poněkud kratší čili nižší než c, ale o tak málo, aby se zorná čára vedoucí přes jejich vrcholy (kterou budiž čára c d m l) nedotkla uvedené dráhy h i k; a bod m budiž místo této čáry, které je k uvedené dráze blíž než
