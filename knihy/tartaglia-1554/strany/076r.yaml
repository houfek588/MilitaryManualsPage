bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    rouinate da nemici con le artegliarie, che tal citta sia quasi piu forte con tai mura rouinate, che si quelle fusseno intiere, & sane, della qual cosa molti se sono scandalizzati di uoi.
  cs: |-
    rozbořeny nepřátelským dělostřelectvem {artegliarie}, bylo takové město s rozbořenými hradbami skoro silnější, než kdyby byly celé a neporušené. Nad tím se na vás mnozí pohoršovali.
- typ: odstavec
  de: |-
    N. Signor clarissimo, credo ueramente, che molti se ne siano scandalizzati, pensando loro, che io uoglia forsi dire, che rouinate le dette mura per fin alli fondamenti, ma io non uoglio dir cosi, anci uoglio dire, che rouinata quella parte apparente di sopra al horo della fossa (come si costuma communamente nelle batterie) che ne seguiria poi quello, che hauemo detto nel detto Sesto Quesito del nostro Sesto libro, cioe che tal citta saria quasi piu forte con tai parti de mura rouinate di quello saria essendo intiere, e sane.
  cs: |-
    **Nicolò.** Slovutný pane, opravdu věřím, že se nad tím mnozí pohoršili, protože si myslí, že snad chci říci, že hradby {mura} jsou rozbořeny až do základů. Tak to ale říci nechci; chci naopak říci, že když se rozboří ta část, která vyčnívá nad okraj příkopu {fossa} (jak se při ostřelování {batterie} obvykle děje), pak z toho plyne to, co jsme řekli ve zmíněném šestém dotazu naší šesté knihy, totiž že takové město by bylo s takto rozbořenými částmi hradeb skoro silnější, než kdyby byly celé a neporušené.
- typ: odstavec
  de: |-
    S. M. Intendetela mo, come uoleti, che per qual modo si uoglia la me par cosa granda, & se possibil fusse di farme intendere con parole la qualita di tal uostra forma de mura, me faresti cosa gratissima, delle altre cose poi, che me haueti promesso aspettaro fin che uorreti uoi, accio le possate far con uostra commodita.
  cs: |-
    **Pan Marcantonio.** Rozumějte tomu, jak chcete, ať tak či onak, zdá se mi to velkou věcí. A kdyby bylo možné vysvětlit mi slovy povahu tohoto vašeho tvaru hradeb, prokázal byste mi velkou laskavost; na ostatní věci, které jste mi slíbil, pak počkám, dokud budete chtít, abyste je mohl udělat v klidu.
- typ: odstavec
  de: |-
    N. Signor Magnifico, eglie cosa chiara per ragion naturale, che quando li nemici uogliono battere una citta con le artegliarie non cercano da battere ne da rouinare quella parte dete de mura, ouer cortina, che non uedono, ma solamente quella parte, che è apparente di sopra al horo della fossa, perche rouinata che sia tal parte apparente, cadendo tal rouinamento nella fossa gli uien à far una scala di poter ascendere, & da entrare commodamente nella detta citta. E per tanto nel fabricar le dette mura, ouer cortine, quando che sono elleuate quasi alla altezza del horo della fossa, uorria, che quella parte, che gli manca à compirle in altezza, fusseno fabricate piu in dentro uerso la citta talmente, che uenghi à restar de fuora uia un spacio nella sommita del primo muro, il qual spacio uoglio che sia di tanta capacita, che sia atto à riceuere, & tenere sopra di se quasi tutto il rouinazzo, di quella seconda parte di cortina (fatta piu in dentro) se rouinata fusse da nemici con le artegliarie (o poco manco) uero è, che bisogna auertire nel far li baluardi di farli con tal modo, e misura, che habbiano almen due, ouer tre canonere per banda, che rettamente possano tirare à longo per tutto quel tal spacio, ma dico con l'uno, & l'altro di dui baluardi, posti alla guardia di quella tal cortina, la qual cosa facendo tal forma de cortina hauera in se la detta nostra qualita, perche se quella seconda parte di cortina (fatta piu in dentro) apparente di sopra lo horo della fossa sara per sorte rouinata da nemici, con le artegliarie. Quel rouinazzo di tal cortina restara assunato sopra di quel spacio (gia lasciato per tal effetto) & perche ogni uolta, che tal parte apparente di una tal cortina uenga rouinata da nemici con le artegliarie, non la rouinaranno mai totalmente, ma rouinaranno solamente quella parte composta di pietre, & malta, ma quella parte poi che è di terra fra quelli contraforti (che noi chiamamo argine) non restara, mai totalmente rouinata, ma de quella ne rouinara solamente una certa parte, che se tirara drio la cortina di pietre, e malta, nel cader chi fara, & restara poi una certa discesa, ouer montata di terra insieme con certe reliquie di quelli contraforti gia fatti de drio à tal cortina fatta de pietre, e malta, la qual discesa, ouer montata non sara molto facile di ascendere. E per tanto se li nemici dapoi che haueranno rouinata tal muraglia, ouer cortina, deliberaranno di uoler entrare in tal citta, prima gli sara necessario à portar scale di poter ascendere dal fondo della fossa per fin à quel spacio doue se ripossara quel rouinamento, il qual spacio per esser tutto
  cs: |-
    **Nicolò.** Urozený pane, z přirozeného rozumu je jasné, že když chtějí nepřátelé ostřelovat město dělostřelectvem, nesnaží se ostřelovat ani bořit tu část hradeb neboli kurtiny {cortina}, kterou nevidí, nýbrž jen tu část, která vyčnívá nad okraj příkopu; neboť jakmile se tato vyčnívající část rozboří, sutiny spadnou do příkopu a poslouží jim jako schody, po nichž mohou vystoupit a pohodlně vniknout do města. Proto bych chtěl, aby se při stavbě těchto hradeb neboli kurtin, když už jsou vyzdviženy skoro do výše okraje příkopu, ta část, která jim chybí do plné výšky, stavěla více uvnitř, směrem k městu, a to tak, aby na temeni první zdi zůstal zvenčí volný prostor. Chci, aby tento prostor byl tak velký, aby dokázal pojmout a udržet na sobě skoro všechny sutiny (nebo o málo méně) oné druhé části kurtiny (postavené více uvnitř), kdyby ji nepřátelé rozbořili dělostřelectvem. Je ovšem pravda, že při stavbě bašt {baluardi} je třeba dbát, aby se udělaly takovým způsobem a v takové míře, aby měly na každé straně alespoň dvě nebo tři střílny {canonere}, které by mohly přímo střílet podélně po celém tom prostoru, a to, pravím, z jedné i druhé z obou bašt postavených ke stráži té kurtiny. Když se to udělá, bude mít takový tvar kurtiny v sobě onu naši vlastnost: kdyby totiž nepřátelé tu druhou část kurtiny (postavenou více uvnitř), vyčnívající nad okraj příkopu, náhodou rozbořili dělostřelectvem, zůstanou sutiny té kurtiny nashromážděny na onom prostoru (k tomu účelu už ponechaném). A protože kdykoli nepřátelé vyčnívající část takové kurtiny dělostřelectvem rozboří, nikdy ji nerozboří úplně, nýbrž rozboří jen tu část, která je z kamene a malty; ta část, která je z hlíny mezi opěrnými pilíři {contraforti} (a kterou nazýváme násep {argine}), však nikdy nezůstane úplně rozbořena, nýbrž se z ní zboří jen určitá část, kterou s sebou strhne kamenná a maltová kurtina, když bude padat. Zůstane pak určitý svah neboli stoupání z hlíny spolu s jistými zbytky opěrných pilířů, které byly už dříve postaveny za tou kurtinou z kamene a malty; a tento svah neboli stoupání nebude příliš snadné vylézt. Pokud se tedy nepřátelé, když tuto hradbu {muraglia} neboli kurtinu rozboří, rozhodnou vniknout do takového města, budou nejprve muset přinést žebříky, aby mohli vystoupit ze dna příkopu až na ten prostor, kde budou ležet sutiny; a protože tento prostor bude celý
