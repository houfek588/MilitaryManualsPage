  de: |-
    sopra è detto, questa è la prima causa, che un schioppettero, & anchor bombardiero, quando che la mira dauanti fusse ben alquanto piu alta di quella de drio, quanto piu stara propinquo al segno tolto de mira, tanto piu sara atto à darui dentro, ouer à fare piu bella botta di quello saria à starui piu lontano. Ma oltra à questa prima causa io reputo, che la ragion naturale ne insegni una altra al detto bombardiero, ouer schioppettero, la qual è questa, che ogni uolta, che lui è molto propinquo al segno doue uol tirare, che lui non pigli la mira nel proprio segno, ma alquanto di sopra dal segno, perche el die comprendere per discretione naturale, che le istremita delle due mire sono alquanto piu ad alto della bocca del pezzo, doue uscisse la balla, la qual cosa facendo, uiene à medicare quel poco errore, detto di sopra, che doueria far in bassezza quel tal tiro, il che lo fa piu atto à dar precisamente in brocca. Et per tanto dico, se quando la mira dauanti è equalmente alta, & anchor alquanto piu alta di quella de drio, el bombardiero, ouer schioppettero è tanto piu atto à dar nel segno doue tira, ouer à far piu bella botta, quanto piu ui sta propinquo, per le due ragioni di sopra adutte, molto maggiormente, per le medesime ragione, seguiria el medesimo, quando che la mira dauanti sara alquanto piu bassa di quella de drio, & sia tal sua bassezza troppo, ouer poco à sufficienza: perche in qual si uoglia modo, che la sia piu bassa, la uien à unir piu la linea uisuale con el uiaggio qual debba far la balla, et continuamente piu per fina al luoco doue che tal linea uisuale sega, ouer tocca, ouer che passa piu propinqua al detto transito, ouer uiaggio, qual debbe far la balla di quello si fa nelle due positione dette di sopra, perche in quella la detta linea uisuale continuamente si ua discostando dal detto transito, ouer uiaggio, che debbe far la balla, & in queste continuamente la ui si ua piu accostando, per fin al luoco detto di sopra, & quantunque anchora in questa seconda positione de mire quanto piu el segno, che se tuol de mira, sara de qua dal luoco doue concorrera la linea uisuale con el detto transito, ouer uiaggio, ouer dal luoco, doue che piu transiranno uicine, ouer propinque, dette linee, tanto piu bassa sara la botta, come se dimostra nel settimo, ottauo, & nono Quesito, tamen la bassezza puo esser poca, come fu detto sopra li predetti Quesiti, perche la maggiore che ui possa occorrere saria quella, che nelle altre due prime era la maggiore, cioe quando che'l segno, che se tol de mira fusse propinquissimo alla mira dauanti, cioe alla bocca del schioppo, ouer pezzo, la qual di sopra determinassimo in un schioppo poter esser poco piu della grossezza d'un dedo, se la maggior bassezza adunque è poco piu d'un dedo in un schioppo stando al segno propinquissimo alla bocca di quello. Essendo adunque tal segno alquanto lontano da detta bocca, necessariamente men bassa sara la sua botta, cioe men di quella grossezza d'un dedo, & tanto men bassa, quanto che sara piu lontano dalla bocca del schioppo, pur che non sia oltra alla detta intersecatione, ouer toccamento che fa la detta linea uisuale con el transito della balla, ouer alla maggior propinquita di quelle, essendo adunque tal segno lontano al men diece passa della detta bocca del schioppo, quasi che la bassezza de tal botta non saria sensibile, oltra che, come di sopra dissi, quando che colui, che tira è molto propinquo al segno doue tira, credo per una certa descretione naturale, che lui non pigli la mira precisamente nella brocca, ma una minima cosa piu alto, perche lui die comprendere per ragion naturale, come di sopra dissi, che la
  cs: |-
    řečeno výše, to je první příčina, proč ručničář i dělostřelec, i když je přední mířidlo {mira dauanti} poněkud vyšší než zadní, tím spíše trefí zamířený cíl {segno} neboli udělá krásnější ránu {botta}, čím blíže k němu stojí, než kdyby stál dál. Kromě této první příčiny se však domnívám, že přirozený rozum učí dělostřelce nebo ručničáře ještě jinou věc, a to tuto: kdykoli je velmi blízko u cíle, na který chce střílet, ať nemíří přímo do cíle, ale poněkud nad něj, neboť z přirozeného úsudku musí chápat, že konce obou mířidel jsou o něco výš než ústí děla {pezzo}, odkud vychází koule {balla}. Když to tak dělá, napraví tu malou chybu, o níž byla řeč výše, kterou by taková rána {tiro} měla směrem dolů, a to mu umožní trefit přesně do středu {brocca}. Proto pravím: jestliže dělostřelec nebo ručničář, když je přední mířidlo stejně vysoké jako zadní nebo i poněkud vyšší, tím spíše trefí cíl, na který střílí, neboli udělá krásnější ránu, čím blíže k němu stojí, a to ze dvou výše uvedených důvodů, pak z týchž důvodů platí totéž ještě mnohem víc, když bude přední mířidlo poněkud nižší než zadní, ať je ta nízkost přílišná, nebo jen malá či právě dostatečná. Ať je totiž nižší jakkoli, sbližuje víc zornou čáru {linea uisuale} s cestou, kterou má koule vykonat, a to stále víc až k místu, kde zorná čára protíná dráhu {transito} neboli cestu koule, nebo se jí dotýká, nebo kde k ní prochází nejblíže, než je tomu ve dvou výše uvedených polohách. V oněch se totiž zorná čára od dráhy neboli cesty koule neustále vzdaluje, kdežto v těchto se k ní neustále přibližuje až k místu, o němž byla řeč. A ačkoli i v této druhé poloze mířidel platí, že čím víc bude zamířený cíl před místem, kde se zorná čára sbíhá s dráhou neboli cestou, nebo před místem, kde obě čáry procházejí nejblíže u sebe, tím níž bude rána, jak se dokazuje v sedmém, osmém a devátém dotazu, přece může být to snížení malé, jak bylo řečeno v uvedených dotazech. Největší, které může nastat, by totiž bylo to, které bylo největší i v obou prvních polohách, totiž když by zamířený cíl byl zcela blízko u předního mířidla, to jest u ústí ručnice {schioppo} nebo děla; a to jsme výše u ručnice určili na o málo víc než tloušťku jednoho prstu {dedo}. Je-li tedy největší snížení u ručnice o málo víc než jeden prst, když stojí cíl zcela blízko u jejího ústí, pak je-li cíl od ústí poněkud vzdálen, bude rána nutně méně nízko, to jest méně než o tloušťku jednoho prstu, a to tím méně, čím dál bude od ústí ručnice – jen když nebude za průsečíkem {intersecatione} neboli bodem dotyku {toccamento} zorné čáry s dráhou koule nebo za místem jejich největšího přiblížení. Je-li tedy cíl od ústí ručnice vzdálen aspoň deset kroků {passa}, nebude snížení takové rány téměř znatelné; nadto, jak jsem řekl výše, když je střelec velmi blízko u cíle, na který střílí, myslím, že z jakéhosi přirozeného úsudku nemíří přesně do středu, ale nepatrně výš, neboť z přirozeného rozumu musí chápat, jak jsem řekl výše, že
