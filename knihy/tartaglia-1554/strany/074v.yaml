poznamky:
- n: 1
  text: Eukleidés, Základy I, 13 – úhly, které tvoří přímka postavená na jiné přímce, jsou buď dva pravé, nebo dohromady rovny dvěma pravým.
- n: 2
  text: Pátý Eukleidův postulát o rovnoběžkách – dvě přímky, s nimiž příčka svírá na téže straně vnitřní úhly menší než dva pravé, se na té straně protnou; „obrácené znění“ = jsou-li tyto úhly větší, přímky se na té straně rozbíhají.
