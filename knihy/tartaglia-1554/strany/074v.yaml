  de: |-
    S. M. E ho ben inteso da molti pratici fortificatori de citta esser difficultosissimo à poter fortificar un angolo retto de una citta, & molto piu un angolo acuto, & quantunque la isperienza ne faccia chiari di questo, nondimeno con queste uostre Euclidiane argumentationi, me haueti fatto perfettamente conoscere la causa propinqua de tali effetti.
  cs: |-
    **Pan Marcantonio.** Slyšel jsem sice od mnoha zkušených stavitelů městských opevnění, že je velmi obtížné opevnit pravý úhel města, a ještě mnohem obtížnější úhel ostrý; a ačkoli nás o tom poučuje zkušenost, přece jste mi těmito svými eukleidovskými důkazy dal dokonale poznat nejbližší příčinu takových účinků.
