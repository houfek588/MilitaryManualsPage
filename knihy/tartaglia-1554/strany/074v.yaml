  de: |-
    linea .b.c. per la qual cosa il nostro primo proposito uenera à esser manifesto: perche, se la linea .e.g. (lato del baluardo) non puo concorrere con la linea .a.b. eglie cosa chiara che in alcun luoco di detta linea, ouer cortina .a.b. poter esser fatto una canonera, che possa ueder, ne tirar, ouer difendere il detto lato .g.e. di tal baluardo, et con le medesime ragioni se approuara, l'altro lato .e.h. dal detto baluardo esser equidistante alla linea, ouer cortina .b.c. e per questo esser impossibile potersi far una canonera in alcun luoco di detta cortina .b.c. che possa guardare il lato .e.h. dil detto baluardo. Et molto piu seguiria tal impossibilita, quando, che tutto langolo .g.e.h. del detto baluardo fusse maggior del angolo .a.b.c. perche seguiria, che anchora la mitta di tal angolo fusse anchor maggiore della mitta del angolo della cortina, cioe, che langolo .g.e.b. fusse maggiore del angolo .a.b.d. Et perche lo detto angolo .a.b.d. insieme con langolo .a.b.e. (per la .13. del primo di Euclide) saranno eguali à dui angoli retti, per il che li dui angoli .a.b.e. & .g.e.b. saranno maggiori di dui angoli retti, onde (per lo conuerso modo della quinta petitione del nostro Euclide) protratta la linea .e.g. dalla banda dal .g. continuamente se andara allargando, & alluntanando dalla cortina .b.a. e pero molto piu euidente se manifesta la sopra detta impossibilita, & per le medesime ragioni se dimostrara dell'altro lato e.h. con la cortina .b.c. Ma se lo detto angolo .g.e.h. del baluardo sara menore del angolo .a.b.c. della cortina, seguira, che langolo .g.e.b. sia anchor minore del angolo .a.b.d. & simelmente (per la detta .13. del primo di Euclide) seguira, che li dui angoli .g.e.b. & .e.b.a. siano menori de dui angoli retti, onde (per la detta quinta petitione) protratta la linea .e.g. insieme con la linea .b.a. eglie necessario, che concorreno insieme, e pero tutte le canonere fatte à canto al luoco di tal concorso, quelle guardaranno rettamente il detto lato .g.e. & questo medesimo seguira nella cortina .b.c. cioe, che quella concorrera con la linea .e.h. essendo protratta in diretto uerso .c. et cosi tutte le canonere, che saran fatte à canto al luoco di tal concorso, ò siano di sopra, ouer di sotto di tal luoco, cioe, ò siano de baluardi, ouer de caualleri guardaranno rettamente il detto lato .e.h. del baluardo. Et bisogna notar, che quanto piu sara menore langolo del baluardo del angolo delle cortine, tanto piu propinquo al detto baluardo se fara tal concorso, et tanto piu debile sara tal baluardo, & per il contrario, quanto manco sminuera langolo del detto baluardo del angolo delle due cortine, tanto piu lontano dal detto baluardo se fara tal concorso, & piu gagliardo, ouer forte sara tal baluardo, e per tanto dico, che uolendo far un baluardo sopra à un angolo retto de due cortine, eglie necessario (uolendo far, che tal baluardo sia guardato da altri baluardi, ouer caualleri) à far tal baluardo de angolo acuto, & ogni baluardo de angolo acuto uien à esser debole, & tanto piu debole sara, quanto piu acuto angolo contenera: e pero, quando, che langolo contenuto dalle due cortine sara poi acuto, de necessita molto piu acuto bisognara far langolo del detto baluardo, & consequentemente molto piu debole uenira à esser tal baluardo.
  cs: |-
    čarou b.c. Tím bude naše první tvrzení zřejmé: neboť nemůže-li se čára e.g. (strana bašty {baluardo}) protnout s čarou a.b., je jasné, že na žádném místě této čáry neboli kurtiny {cortina} a.b. nelze udělat střílnu {canonera}, která by mohla vidět, ostřelovat nebo bránit uvedenou stranu g.e. takové bašty. Stejnými důvody se dokáže, že druhá strana e.h. bašty je rovnoběžná s čarou neboli kurtinou b.c., a že proto nelze na žádném místě kurtiny b.c. udělat střílnu, která by mohla střežit stranu e.h. této bašty. A tím spíše by tato nemožnost nastala, kdyby celý úhel bašty g.e.h. byl větší než úhel a.b.c.; plynulo by z toho totiž, že i polovina tohoto úhlu je větší než polovina úhlu kurtiny, totiž že úhel g.e.b. je větší než úhel a.b.d. A protože úhel a.b.d. spolu s úhlem a.b.e. (podle 13. [věty] první [knihy] Eukleidovy)[^1] se rovnají dvěma pravým úhlům, budou úhly a.b.e. a g.e.b. větší než dva pravé úhly; odtud (podle obráceného znění pátého postulátu {petitione} našeho Eukleida)[^2] se čára e.g., prodloužená na straně g., bude ustavičně rozbíhat a vzdalovat od kurtiny b.a., a tím ještě zřetelněji vyjde najevo zmíněná nemožnost; stejnými důvody se to dokáže o druhé straně e.h. vůči kurtině b.c. Bude-li však úhel bašty g.e.h. menší než úhel kurtiny a.b.c., bude i úhel g.e.b. menší než úhel a.b.d., a podobně (podle zmíněné 13. [věty] první [knihy] Eukleidovy) budou oba úhly g.e.b. a e.b.a. menší než dva pravé úhly; odtud (podle zmíněného pátého postulátu) se čára e.g. a čára b.a., budou-li prodlouženy, nutně protnou. Proto všechny střílny udělané poblíž místa tohoto průsečíku budou přímo střežit uvedenou stranu g.e. Totéž nastane u kurtiny b.c., totiž že se protne s čarou e.h. prodlouženou přímo směrem k c.; a tak všechny střílny, které budou udělány poblíž místa tohoto průsečíku, ať nad ním, nebo pod ním, totiž ať na baštách, nebo na kavalírech {caualleri}, budou přímo střežit uvedenou stranu bašty e.h. A je třeba poznamenat, že čím menší bude úhel bašty oproti úhlu kurtin, tím blíže k baště bude tento průsečík a tím slabší bude bašta; a naopak, čím méně bude úhel bašty zmenšen oproti úhlu obou kurtin, tím dále od bašty bude průsečík a tím pevnější neboli silnější bude bašta. A proto pravím, že chce-li se udělat bašta na pravém úhlu dvou kurtin, je nutné (mají-li ji střežit jiné bašty nebo kavalíry) udělat ji s ostrým úhlem; a každá bašta s ostrým úhlem je slabá, a tím slabší, čím ostřejší úhel obsahuje. A proto, když pak bude úhel sevřený oběma kurtinami ostrý, bude nutně třeba udělat úhel bašty ještě mnohem ostřejší, a v důsledku toho bude taková bašta mnohem slabší.
