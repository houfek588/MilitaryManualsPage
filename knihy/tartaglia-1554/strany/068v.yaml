  de: |-
    piedi .8. che con li piedi dui di detta cortina uengono poi à fare piedi .10. di parapetto, la altezza di detta cortine, si costuma far de piedi .34 cominciando dal pian del fosso. La longhezza di dette cortine si fa tal hora de passa .250. tal hora de passa .300. et tal hora de piu secondo il bisogno, come haueti inteso, sopra la pianta di Turino, che due delle sue cortine son de passa .360. l'una, & l'altre poco meno. Li baluardi poi nel fondo si fanno di grossezza de piedi .8. ma per fin alla altezza de piedi .10. se uanno restringendo talmente che se reduce in piedi .6. (per il retirar della scarpa, la qual se ua retirando in ogni .5. piedi, un piede. Et da quel in suso se fa de piedi .2. Ma ui fanno poi li contraforti, di grossezza de piedi .2. & longhi nel fondo piedi .27. ma in cima solamente piedi .22. che con li piedi .2. della muraglia fanno piedi .24. di grossezza, & di questa grossezza se ne fa il parapetto de piedi .18. & il corritore de piedi .6. L'altezza di baluardi se fa de piedi .37. che uien ad auanzare piedi .3. di sopra alle cortine. Le prime piazze da basso delli detti baluardi sono alte dal pian del fosso piedi .17. & cosi le lor canonere, & lor parapetti de piedi .24. di grossezza. Il merlon se fa di altezza piedi .8. dal pian delle canonere. Et le dette canonere, se fanno de piedi .10. in bocca, & in meggio de piedi .5. La retirata della piazza da basso si fa di passa .10. & la larghezza se fa de passa .11. Del piano della piazza di sotto, à quello della piazza di sopra, se fa piedi .13. di altezza. La piazza granda in su la entrata se fa di larghezza passa .16. & nel meggio passa .28. & di larghezza passa .25. & piede uno, cioe piedi .126. & cosi con tal ordine, e misura se fanno quasi tutti li baluardi. Li cauallieri, ouer forme piatte, se fanno nel meggio delle cortine, & tai cauallieri se fanno alcuni di longhezza passa .32. (cioe secondo l'andar della cortina) & di larghezza passa .18. Alcuni altri si fanno di longhezza passa .26. & di larghezza passa .14. Et la altezza de detti cauallieri se fanno communamente de piedi .44. che ueneria ad ascendere piedi .10. di sopra la cortina. Li parapetti de detti cauallieri se fanno di grossezza de piedi .24. Et cosi con tal ordine, e misura se fanno quasi tutti li cauallieri, ouer forme piatte. Il fosso poi nel fondo si fa di larghezza passa .14. & in bocca passa .16. & di altezza passa .4. & cosi con tal ordine, & misura si fa communamente tutte le fosse. La contramina poi se fa di larghezza piedi .3. e meggio, & di altezza piedi .7. & ha li suoi foratori, & ui si fanno anchora due porte per uscir li fanti, & questa contramina la fanno sotto terra, per non indebelir il muro. Et cosi con tal ordine, e misura se procede generalmente quasi in tutte le moderne fortificationi.
  cs: |-
    o osmi stopách {piedi}, které spolu se dvěma stopami kurtiny {cortina} dávají 10 stop předprsně {parapetto}. Výška kurtin se obvykle dělá 34 stopy, počítáno od dna příkopu {fosso}. Délka kurtin se dělá někdy 250 kroků {passa}, někdy 300 kroků a někdy i více podle potřeby, jak jste slyšel o půdorysu {pianta} Turína, kde dvě jeho kurtiny mají každá 360 kroků a ostatní o málo méně. Bašty {baluardi} se pak u základu dělají 8 stop silné, ale do výšky 10 stop se postupně zužují, až mají jen 6 stop (kvůli ustupování svahu {scarpa}, který ustupuje o jednu stopu na každých 5 stop).[^1] Odtud nahoru se dělají 2 stopy silné. K nim se ale dělají opěrné pilíře {contraforti} 2 stopy silné, dole 27 stop dlouhé, nahoře však jen 22 stopy, které se 2 stopami hradby {muraglia} dávají 24 stopy tloušťky; z této tloušťky připadá 18 stop na předprseň a 6 stop na ochoz {corritore}. Výška bašt se dělá 37 stop, takže převyšují kurtiny o 3 stopy. První, dolní plošiny {piazze da basso}[^2] těchto bašt jsou 17 stop nade dnem příkopu a stejně tak jejich střílny {canonere}, a jejich předprsně jsou 24 stopy silné. Merlon {merlon}[^3] se dělá 8 stop vysoký nad úrovní střílen. Střílny se dělají 10 stop široké v ústí a 5 stop uprostřed. Hloubka {retirata}[^4] dolní plošiny se dělá 10 kroků a šířka 11 kroků. Od úrovně dolní plošiny k úrovni horní plošiny je 13 stop výšky. Velká plošina u vstupu se dělá 16 kroků široká, uprostřed 28 kroků a 25 kroků a jednu stopu široká, totiž 126 stop.[^5] A podle takového řádu a takových měr se dělají téměř všechny bašty. Kavalíry {cauallieri} neboli ploché bašty {forme piatte} se dělají uprostřed kurtin; některé z nich se dělají 32 kroků dlouhé (totiž ve směru kurtiny) a 18 kroků široké, jiné 26 kroků dlouhé a 14 kroků široké. Výška kavalírů se obvykle dělá 44 stopy, takže vystupují 10 stop nad kurtinu. Předprsně kavalírů se dělají 24 stopy silné. A podle takového řádu a takových měr se dělají téměř všechny kavalíry neboli ploché bašty. Příkop se pak dělá u dna 14 kroků široký, v ústí 16 kroků a 4 kroky hluboký, a podle takového řádu a takových měr se obvykle dělají všechny příkopy. Protiminová chodba {contramina}[^6] se pak dělá 3 a půl stopy široká a 7 stop vysoká a má své průduchy {foratori}; dělají se v ní také dvoje dveře, aby jimi mohli vycházet pěšáci {fanti}. Tuto protiminovou chodbu dělají pod zemí, aby neoslabovali zeď. A podle takového řádu a takových měr se postupuje obecně téměř u všech moderních opevnění {fortificationi}.
- typ: odstavec
  de: |-
    N. Quanti pezzi di artegliaria si costuma à mettere per ogni baluardo.
  cs: |-
    **Nicolò.** Kolik děl {pezzi di artegliaria} se obvykle staví do každé bašty?
- typ: odstavec
  de: |-
    P. Nella prima piazza da basso ui se ne mette dui pezzi per banda, & questi tali ui se pongono solamente per guardia delle cortine, & del fosso. Et similmente nella piazza di sopra ui se assetta per quanto ho inteso nuouamente dui, & tal hora tre altri pezzi per banda in cadaun baluardo, & questi tali guardano pur anchora le cortine, e parte del fosso, & credo, che guardano anchora l'altro baluardo, & massime uno de detti pezzi.
  cs: |-
    **Převor.** Na první, dolní plošinu se jich staví po dvou na každou stranu a ta se tam dávají jen ke střežení kurtin a příkopu. A podobně se na horní plošinu, pokud jsem nedávno slyšel, staví v každé baště na každou stranu další dvě, někdy i tři děla, a ta střeží rovněž kurtiny a část příkopu, a myslím, že střeží i druhou baštu, zvláště jedno z těchto děl.
- typ: odstavec
  de: |-
    N. Et sopra li cauallieri quanti pezzi ui si costuma tenere.
  cs: |-
    **Nicolò.** A kolik děl se obvykle drží na kavalírech?
- typ: odstavec
  de: |-
    P. Cinque communamente, cioe dui per banda, li quali guardano li baluardi, & uno che per faccia guarda la campagna.
  cs: |-
    **Převor.** Obvykle pět, totiž dvě na každou stranu, která střeží bašty, a jedno, které střeží čelně předpolí {campagna}.
- typ: odstavec
  de: |-
    N. Di che qualita sono questi tai pezzi, si di baluardi, come di cauallieri.
  cs: |-
    **Nicolò.** Jakého druhu jsou tato děla, jak na baštách, tak na kavalírech?
- typ: odstavec
  de: |-
    P. Alcuni sono da .20. alcuni da .30. alcuni da .50. & alcuni da .100. lire di balla.
  cs: |-
    **Převor.** Některá střílejí kouli o 20 librách {lire}, některá o 30, některá o 50 a některá o 100 librách.
- typ: odstavec
  de: |-
    N. A me non pare, che nelli cauallieri, ne
  cs: |-
    **Nicolò.** Nezdá se mi, že by na kavalírech ani
poznamky:
- n: 1
  text: Závorka otevřená před „per il retirar della scarpa“ se v tisku nezavírá; v překladu je uzavřena za údajem o sklonu svahu (1 stopa na 5 stop výšky).
- n: 2
  text: Piazza da basso – dolní dělová plošina v boku bašty, odkud se střílí podél kurtiny a příkopu; piazza di sopra – horní plošina.
- n: 3
  text: Merlon – plný úsek předprsně mezi dvěma střílnami.
- n: 4
  text: Retirata della piazza – patrně hloubka dolní plošiny, o kterou je bok bašty zatažen dovnitř (krytý bok); přesný význam nejistý.
- n: 5
  text: V tisku dvakrát „di larghezza“ (16 kroků a 25 kroků 1 stopa); druhý údaj je patrně délka. Přepočet 25 kroků a 1 stopa = 126 stop odpovídá kroku o 5 stopách.
- n: 6
  text: Contramina – podzemní chodba podél hradby, z níž obránci odposlouchávají a ničí nepřátelské miny; foratori jsou patrně průduchy či odposlechové otvory.
