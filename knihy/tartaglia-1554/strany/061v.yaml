  popis: Dioptra s příčnými rameny (opakování druhého obrazce ze [[055v|strany 55v]]), pohled shora. Uprostřed prázdná obruč s nápisem VACVO („prázdné“) a písmeny A nahoře a B dole. Svislé hlavní rameno vede nahoru přes F k zaměřovací destičce E a dolů přes C k destičce D. Vodorovné příčné rameno vede vlevo přes K k bodu I a vpravo přes G k bodu H, kde je na něm v pravém úhlu připevněno krátké ramínko L–M (L nahoře, M dole), které se přikládá k hradbě.
