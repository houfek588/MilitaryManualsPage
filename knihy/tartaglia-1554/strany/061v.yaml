  de: |-
    anchora quella tal cortina, ouer muraglia (per esser la detta principal dioptra in tal positione equidistante à tal cortina, ouer muraglia, & dapoi far misurare tal cortina, ouer muraglia, & tal sua quantita de passa annotarli consequentemente drio à quel uento, & numero de gradi, gia annotati, & cosi andar facendo à cadauna dell'altre cortine (facendo memoria delli luochi delle sue porte, & baluardi (come di sopra fu detto) & fatto questo andarsene à casa, & quando se uora poi mettere in disegno la pianta di tal citta, se potra procedere precisamente, come fu fatto di quel paese nel .4. Quesito, uero è, che se potria tirar anchora le linee, secondo l'ordine di quel brazzo .l.m. cioe assettato, che se habbia tal nostro istromento su la carta da quella banda, doue pare piu conuegnirse alla prima cortina di tal citta, & agiustato la dioptra à quel uento, & numero de gradi, come parlara la prima partita della nostra policetta, & fatto questo, tirare una linea retta de indiffinita quantita, secondo l'ordine del detto brazzetto .l.m. & da tal linea cauarne, ouer misurarne fora con el compasso, tanti passa (secondo l'ordine della nostra scala) come parlara la detta prima partita della nostra policetta, & nel principio, & fine di tal linea farui un ponto fermo, come piu uolte è stato detto, & dapoi reconzar la dioptra al uento, & grado, come parlara la seconda partita della nostra policetta, & con tal positione assettarla quel brazzetto .l.m. à quel ponto fermo gia fatto nel fin della detta prima linea, con tal modo, & forma che se accorda quelle tre cose dette nel precedente Quesito, cioe, che la lancetta della calamita, stia secondo el suo ordine, & che la dioptra stia à quel uento, & nomero de gradi, come parla la detta seconda partita della policetta terzo, & ultimo, che el detto brazzetto .l.m. termini precisamente à quel ponto fermo, terminante la prima linea, & accordate queste tre cose, tirate un'altra linea de indeffinita quantita, secondo l'ordine del detto brazzetto .l.m. la qual passi per el detto ponto fermo, terminante la prima linea, & di questa seconda linea, con el compasso se ne debbe pur misurar fuora tanti passa (secondo l'ordine della nostra scala) quanti sara notati nella detta seconda partita della nostra policetta, comenzando pero à misurare al detto ponto fermo, termine della prima linea, & principio della seconda, & in fine farui pur un ponto fermo, & cosi con tal modo, & ordine se douera andar procedendo, per fin che se hauera compito da designare la pianta di cadauna cortina di tal citta, et chi uolesse sapere che uento
  cs: |-
    ta kurtina {cortina} čili hradba (protože hlavní dioptra {dioptra} je v této poloze s kurtinou čili hradbou rovnoběžná). Potom se dá kurtina čili hradba změřit a její délka v krocích {passa} se zapíše hned za vítr {uento} a počet stupňů, které už jsou zapsány; a tak se postupuje u každé z ostatních kurtin (přičemž se poznamená, kde jsou jejich brány a bašty {baluardi}, jak bylo řečeno výše). Když je to hotovo, jde se domů. A když budeme pak chtít zakreslit půdorys {pianta} toho města, lze postupovat přesně tak, jak se to dělalo s onou krajinou ve 4. dotazu. Pravda však je, že čáry lze vést také podle onoho ramene l m: totiž když jsme náš nástroj usadili na papíře na té straně, která se zdá nejvhodnější pro první kurtinu města, a nastavili dioptru na ten vítr a počet stupňů, které udává první položka {partita} našeho lístku {policetta}, vede se podle ramínka l m přímka neurčité délky a na ní se kružítkem {compasso} odměří tolik kroků (podle našeho měřítka {scala}), kolik udává první položka lístku, a na začátku a na konci té přímky se udělá pevný bod, jak bylo řečeno již mnohokrát. Potom se dioptra přestaví na vítr a stupeň, které udává druhá položka našeho lístku, a v této poloze se ramínko l m přiloží k onomu pevnému bodu, udělanému už na konci první přímky, a to tak, aby se shodovaly ony tři věci zmíněné v předchozím dotazu: totiž za prvé, aby magnetická střelka {lancetta della calamita} stála podle svého řádu, za druhé, aby dioptra stála na tom větru a počtu stupňů, které udává druhá položka lístku, a za třetí a naposled, aby ramínko l m končilo přesně v onom pevném bodě, který ukončuje první přímku. Když se tyto tři věci shodují, veďte podle ramínka l m další přímku neurčité délky, která prochází oním pevným bodem ukončujícím první přímku, a na této druhé přímce je třeba kružítkem opět odměřit tolik kroků (podle našeho měřítka), kolik jich bude zapsáno v druhé položce našeho lístku, přičemž se začíná měřit od onoho pevného bodu, který je koncem první přímky a začátkem druhé, a na konci se opět udělá pevný bod. A tímto způsobem a pořádkem se má postupovat, až se dokončí zakreslení půdorysu všech kurtin toho města. A kdo by chtěl vědět, který vítr
