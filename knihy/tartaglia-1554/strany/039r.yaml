poznamky:
- n: 1
  text: Fior de mirochea – neznámá bylina; Tartaglia sám přiznává, že ji nenašel v žádném herbáři. Receptura č. 10 v tabulkách.
- n: 2
  text: Uerzelle (uerghette) de nizola monde – oloupané pruty lísky (benátsky nizzola = nocciola, lat. avellana). Lehké uhlí z mladých lískových, vrbových nebo konopných stonků se pokládalo za nejlepší na jemný prach.
- n: 3
  text: Acqua de uitta (aqua vitae) – pálenka, destilát vína; sal armoniaco – salmiak (chlorid amonný); torsi de uerzi – košťály kapusty; gionchi – sítina; biaua – světle modrá.
