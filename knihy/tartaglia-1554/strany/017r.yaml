  de: |-
    ma puo occorrere in infiniti luochi, secondo li infiniti modi, che la mira dauanti puo esser di soperchio piu corta di quella de drio, ma el ponto del toccamento non puo occorrere, saluo che in un luoco solo, el qual luoco è il piu lontano della bocca del pezzo de qual si uoglia altro, doue concorrer possa la nostra linea uisuale con el transito, ouer uiaggio qual debbe far la balla, essendo adunque el piu lontano concorso de cadauno de li altri concorsi, che se intersecano, & el manco uariabile: per tale ragioni à mi me pare, che piu meritamente à quel si debbia atribuire tal dignita, che ad alcuno di ponti delle intersecationi.
  cs: |-
    nýbrž může nastat na nekonečně mnoha místech podle nekonečně mnoha způsobů, jak může být přední mířidlo {mira dauanti} nadmíru kratší než zadní {mira de drio}. Bod dotyku však může nastat jen na jediném místě, a toto místo je od ústí děla {pezzo} vzdálenější než kterékoli jiné, kde se naše zorná čára {linea uisuale} může setkat s dráhou {transito} čili cestou, kterou má koule {balla} vykonat. Protože je to tedy nejvzdálenější setkání ze všech ostatních setkání, při nichž se čáry protínají, a nejméně proměnlivé, zdá se mi z těchto důvodů spravedlivější přiznat tuto čest jemu než kterémukoli z bodů průsečíků.
- typ: odstavec
  de: |-
