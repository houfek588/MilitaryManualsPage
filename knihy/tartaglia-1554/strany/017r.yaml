  de: |-
    QVESITO DECIMO FATTO DAL MEDESIMO Signor Prior di Barletta.
  cs: |-
    Desátý dotaz, který položil týž pan převor z Barletty
- typ: odstavec
  de: |-
    PRIORE. Fin qua me haueti fatto chiaro, donde procede la causa, quando che uno tirando de mira à uno segno alle uolte da in brocca, alle uolte di sopra, et alle uolte di sotto del detto segno, hor uoria sapere da che procede, che alcune uolte da molto costero dal detto segno tolto de mira.
  cs: |-
    **Převor.** Až dosud jste mi objasnil, odkud pochází příčina, že když někdo střílí podle mířidel {de mira} na nějaký cíl {segno}, někdy zasáhne do středu {in brocca}, někdy nad cíl a někdy pod něj. Nyní bych rád věděl, odkud pochází, že někdy zasáhne daleko stranou {costero} od zamířeného cíle.
- typ: odstavec
  de: |-
    N. Questo puo procedere per due cause, l'una è per le mire, le quale alle uolte l'una, ouer ambe due non sara precisamente nella mezzara del pezzo, cioè nel mezzo della parte superiore del pezzo, per il che tal pezzo è sforzato à percuottere costero, perche se la mira de drio sara fora del detto ponto di mezzo: poniamo uerso la nostra man destra, etiam el detto pezzo dara costero alla medesima banda destra del segno, che se tol de mira, & se la detta mira de drio sara fora del ponto di mezzo, & uerso la man sinistra, etiam el detto pezzo percuotera costero, & uerso la medesima parte sinistra.
  cs: |-
    **Nicolò.** To může pocházet ze dvou příčin. První jsou mířidla {mire}: někdy jedno z nich nebo obě nejsou přesně ve středu {mezzara} děla, totiž uprostřed jeho horní strany, a proto dělo musí zasáhnout stranou. Bude-li totiž zadní mířidlo mimo onen střed, řekněme k naší pravé ruce, zasáhne dělo také stranou, a to na tutéž pravou stranu od cíle, na který se míří; a bude-li zadní mířidlo mimo střed k levé ruce, zasáhne dělo rovněž stranou, a to na tutéž levou stranu.
- typ: odstavec
  de: |-
    P. A me pare, che doueria esser al contrario di quello che haueti detto, cioè che se la mira de drio sia fora del ponto di mezzo, & uerso la banda destra, che il detto pezzo ueria tirar costero uerso la banda sinistra.
  cs: |-
    **Převor.** Mně se zdá, že by to mělo být naopak, než jste řekl, totiž že je-li zadní mířidlo mimo střed, a to na pravou stranu, mělo by dělo střílet stranou na levou stranu.
- typ: odstavec
  de: |-
