bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    che da quelli primi, che determinorono, che ui se douesse dare li detti quattro quinti di quello, che pesa la balla, ui la proportionarono forsi talmente con la isperientia, che la tirasse tanto, quanto fa el suo canone, & forsi piu, ma tal cosa non si potria affermare, ne negare senza qualche particolar isperientia, nondimeno sia come si uoglia se la detta colobrina, con la medesima poluere, che si da al canone non tira tanto, quanto fa el suo canone. Eglie un'error euidentissimo, & è una cosa rediculosa, à dir poi di uoler remediare à tal errore con dire: metteremo, ouer daremo alquanto piu quantita de poluere alla detta colobrina, accioche la tiri tanto, quanto fa detto suo canone, ouer piu di quello, la qual poluere, che ui si da di piu, che la desse medesimamente al detto canone forsi che tiraria molto piu della detta colobrina. Circa alla spesa, che ui ua de piu, quala uostra Signoria dice esser una miseria. Dico esser molto maggiore di quello, che uostra Signoria si pensa: perche, se non me inganno, facendosi le dette colobrine piu longhe delli canoni, la ragion uole, che si facciano anchor piu grosse di metallo. Il che essendo, ui intra molto piu metallo, che in uno canone, & consequentemente debbeno esser molto piu graue delli suoi canoni, et essendo piu graue, uogliono anchora (per condurle) piu numero de buoui, ouer caualli, di quello uoleno li canoni, & maggior moltitudine de huomini, che gouerni quelli, & maggior quantita di uettouaglia si per li animali, come per li huomini, che gouernan quelli oltra il stipendio, che à quelli ui si da per ordinario ò dal principe, ouer da quelli communi, che li manda per comandamento del principe, si uede adunque da un picciolo errore fatto nel principio quanti ne seguita nel fine, & se tali errori sono assai in una colobrina da lire.20.di balla, molto piu se trouara occorrere in quelle di.30.40.50.&.60.lire di balla, come ho inteso da bombardieri, che se costumano.
  cs: |-
    že ti první, kdo stanovili, že se jí mají dávat ony čtyři pětiny váhy koule {balla}, tento poměr snad na základě zkušenosti vyměřili tak, aby dostřelila stejně daleko jako její kanon {canone}, a snad i dál; to však nelze tvrdit ani popřít bez nějaké zvláštní zkoušky. Ať je tomu jakkoli: jestliže uvedená kolubrina {colobrina} se stejným prachem {poluere}, jaký se dává kanonu, nedostřelí tak daleko jako její kanon, je to zcela zjevná chyba; a je to věc směšná chtít pak tuto chybu napravovat řečmi: „Vložíme čili dáme uvedené kolubrině o něco větší množství prachu, aby dostřelila tak daleko jako její kanon nebo dál“ – vždyť kdyby se tentýž prach, který se jí dává navíc, dal kanonu, dostřelil by snad mnohem dál než kolubrina. Pokud jde o náklad navíc, o němž Vaše Milost {uostra Signoria} říká, že je to maličkost, pravím, že je mnohem větší, než si Vaše Milost myslí. Nemýlím-li se, když se totiž tyto kolubriny dělají delší než kanony, rozum žádá, aby se dělaly i se silnějšími stěnami z kovu. A je-li tomu tak, jde do nich mnohem víc kovu než do kanonu, a tudíž musí být mnohem těžší než jejich kanony; a jsou-li těžší, potřebují také (k převozu) větší počet volů nebo koní než kanony, a větší počet mužů, kteří je obsluhují, a větší množství potravin jak pro zvířata, tak pro muže, kteří je obsluhují, nadto ještě žold, který se jim obvykle dává buď od knížete, nebo od obcí, které je posílají na knížecí rozkaz. Je tedy vidět, kolik chyb plyne na konci z malé chyby učiněné na začátku. A jsou-li tyto chyby značné u kolubriny na 20 liber {lire} koule, tím víc jich bude u kolubrin na 30, 40, 50 a 60 liber koule, jaké se podle toho, co jsem slyšel od dělostřelců {bombardieri}, obvykle užívají.
- typ: odstavec
  de: |-
    P. Senza dubbio, che piu metallo intra in le colobrine, che nelli canoni, & consequentamente per condurle, ui ua piu animali, & di questo ne azzo una notta in un mio memoriale si del mettallo che ui intra, & della sua longhezza di cadauna sorte pezzo, come delli animali, che gli ua à condurle.
  cs: |-
    **Převor.** Bez pochyby jde do kolubrin víc kovu než do kanonů, a tudíž je k jejich převozu třeba víc zvířat. O tom mám poznámku[^2] ve svém zápisníku {memoriale}, jak o kovu, který jde do každého druhu děla, a o jeho délce, tak o zvířatech, jichž je třeba k jejich převozu.
- typ: odstavec
  de: |-
    N. Di gratia uostra signoria me ne dia la coppia, perche di queste particolarita ne potria forsi cauar con tempo qualche costrutto.
  cs: |-
    **Nicolò.** Prosím, ať mi Vaše Milost dá opis, neboť z těchto podrobností bych snad časem mohl vyvodit nějaký užitek.
- typ: odstavec
  de: |-
    P. Molto uolentieri, portame qua quel mio memoriale, che è in la mia cassa.
  cs: |-
    **Převor.** Velmi rád. Přines mi sem ten můj zápisník, co je v mé truhle.
- typ: odstavec
  de: |-
    SERVO. Eccolo Signore.
  cs: |-
    **Sluha.** Zde je, pane.
- typ: odstavec
  de: |-
    P. Hor scriueti cosi.
  cs: |-
    **Převor.** Pište tedy takto:
- typ: seznam
  de:
  - Vn falconetto da lire tre di balla di piombo ua longo piedi cinque e meggio, & di mettallo ui intra communamente lire quatrocento, & à condurlo ui uuol caualli para uno.
  - Vn falcon da lire.6.ua longo piedi.7.& uuol lire.890.di mettallo, & per condurlo caualli para.2.
  - Aspidi da lire.12.de longhezza de pie.5.e meggio, uuol di mettallo lire.1300.& per condurli caualli para.3.
  - Sacri da lire.12.de longhezza de pie.8.uuol di mettallo lire.1400.& per condurli caualli para.4.
  - Sacri la lire.12.de longhezza de pie.9.uuol di mettallo lire.2150.& per condurli caualli para.5.
  - Sacri da lire.10.de longhezza de pie.8.uuol di mettallo lire.1300.& per condurli caualli para.3.
  cs:
  - Falkonet {falconetto} na tři libry olověné koule je dlouhý pět a půl stopy {piedi}, kovu do něj jde obvykle čtyři sta liber a k jeho převozu je třeba jednoho páru koní.
  - Falkon {falcon} na 6 liber je dlouhý 7 stop a potřebuje 890 liber kovu, a k převozu 2 páry koní.
  - Aspidy {Aspidi}[^1] na 12 liber, dlouhé 5 a půl stopy, potřebují 1300 liber kovu a k převozu 3 páry koní.
  - Sakry {Sacri} na 12 liber, dlouhé 8 stop, potřebují 1400 liber kovu a k převozu 4 páry koní.
  - Sakry na 12 liber, dlouhé 9 stop, potřebují 2150 liber kovu a k převozu 5 párů koní.
  - Sakry na 10 liber, dlouhé 8 stop, potřebují 1300 liber kovu a k převozu 3 páry koní.
poznamky:
- n: 1
  text: Aspide (aspid, „zmije“) – lehké dělo menší ráže, příbuzné sakru; jména děl podle hadů a dravých ptáků (kolubrina, aspid, sakr, falkon) byla v italském dělostřelectvu běžná.
- n: 2
  text: V tisku „ne azzo una notta“ – nejasný, snad nářeční nebo porušený tvar (za „ne ho“?); smysl „mám o tom poznámku“ je zřejmý.
