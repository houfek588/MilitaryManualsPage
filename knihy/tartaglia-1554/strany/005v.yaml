  popis: |-
    Tartagliův dělostřelecký kvadrant: úhelník se dvěma rameny svírajícími pravý úhel s vrcholem nahoře (a); delší rameno vede šikmo dolů vlevo (b), kratší vpravo (c). Ve vnitřním úhlu h je střed čtvrtkruhu, jehož oblouk i g k a vnitřní oblouk e f vymezují pás rozdělený střídavě černými a bílými poli na dvanáct bodů. Z bodu h visí olovnice h g d se závažím d.
- typ: odstavec
  de: |-
    ANchora cadauna di queste tai parti, ouero ponti uuol esser anchora diuisa in'altre dodici parti equali, con il medesimo ordine, le qual diuisioni non ho uoluto tirare in questa figura piccola, perche generarebbeno confusione, ma in una squadra di commune grandezza, cosi, come ho detto, uuol esser diuisa, tal che tutto il detto quadrante .e.f.i.g.k. uenira à esser diuiso in .144. parti equali, le qual parti chiameremo minuti, & questi minuti se segnano con lineette alquanto piu corte di quelle delli ponti, perche sono poi piu facili da esser numerati per mezzo de i ponti (con maggior linee depinti) per saper gia che ogni ponto contiene .12. minuti. Fatto questo bisogna ficcare un pironcino di ferro, ouero di ottone precisamente in ponto .h. (centro del quadrante) & à quel tal pironcino attaccarui uno perpendicolo girabile, cioè uno fil di seta (ò d'altro) con uno piombino da capo alla similitudine del perpendicolo .h.g.d. & cosi con tal istrumento habbiamo considerato tutte le uarie positioni, ouero elleuationi, che occorrer possa in qual si uoglia pezzo di artiglieria. Et la prima positione di cadauno pezzo se intende quando, che quello è aliuello, cioè talmente assettato, che ponendoui la gamba piu longa della detta nostra squadra in bocca distesa rettamente per el fondo del uacuo della canna, el perpendicolo caschi precisamente sopra el lato .h.f.k. del quadrante, come di sotto appare nella prima figura, Et similmente uno pezzo se intende esser elleuato un ponto quando che quello sia talmente assettato, che ponendoui la detta gamba piu longa della detta nostra squadra in bocca distesa rettamente per el fondo del uacuo della canna (come prima) el perpendicolo caschi precisamente su la diuisione del primo ponto, come di sotto appar nella seconda figura: Et cosi un pezzo se intende essere elleuato due ponti, quando che el detto perpendicolo caschi precisamente sopra la diuisione del detto secondo ponto, & cosi al terzo quando cascara sopra la diuision del terzo, el medesimo se intende del quarto, quinto, & sesto. Et quando che uno pezzo è elleuato al sesto ponto (cioè
  cs: |-
    Dále má být každý z těchto dílů čili bodů {ponti} týmž způsobem rozdělen ještě na dalších dvanáct stejných dílů. Tato dělení jsem v tomto malém obrazci nechtěl vyznačit, protože by působila zmatek, ale na kvadrantu {squadra} obvyklé velikosti má být rozdělen tak, jak jsem řekl, takže celý zmíněný čtvrtkruh {quadrante} e f i g k bude rozdělen na 144 stejných dílů. Tyto díly budeme nazývat minutami {minuti}; minuty se vyznačují čárkami poněkud kratšími než čárky bodů, protože se pak snáze odpočítávají pomocí bodů (vyznačených delšími čarami), když už víme, že každý bod obsahuje 12 minut. Když je to hotovo, je třeba zarazit přesně do bodu h (středu čtvrtkruhu) železný nebo mosazný kolíček a k tomu kolíčku připevnit otočnou olovnici {perpendicolo}, tj. hedvábnou (nebo jinou) nit se závažíčkem na konci, podobně jako olovnice h g d. A tímto nástrojem jsme zkoumali všechna rozličná postavení čili elevace {elleuationi}, které mohou nastat u kteréhokoli děla {pezzo di artiglieria}. První postavení každého děla se rozumí tehdy, když je ve vodorovné poloze {aliuello}, tj. tak usazeno, že když se delší rameno našeho kvadrantu vloží do ústí a položí rovně po dně vývrtu hlavně {canna}, padne olovnice přesně na stranu h f k čtvrtkruhu, jak je vidět níže na prvním obrazci. A podobně se rozumí, že dělo je elevováno o jeden bod, když je tak usazeno, že když se do jeho ústí vloží zmíněné delší rameno našeho kvadrantu a položí rovně po dně vývrtu hlavně (jako předtím), padne olovnice přesně na dělicí čáru prvního bodu, jak je vidět níže na druhém obrazci. A tak se rozumí, že dělo je elevováno o dva body, když zmíněná olovnice padne přesně na dělicí čáru druhého bodu, a stejně tak o tři, když padne na dělicí čáru třetího, a totéž platí o čtvrtém, pátém a šestém. A když je dělo elevováno na šestý bod (tj.
