bloky:
- typ: nadpis
  uroven: 3
  de: |-
    QVESITO DECIM'OTTAVO FATTOMI dal Signor Iacomo de Achaia l'Anno. 1542. In Venetia qual ui uenne alla Sensa.
  cs: |-
    Osmnáctý dotaz, který mi položil pan Iacomo de Achaia roku 1542 v Benátkách, kam přijel na svátek Nanebevstoupení[^1]
- typ: odstavec
  de: |-
    SIGNOR IACOMO. Io ho uisto per isperientia che tirando con una Artegliaria in una muraglia standoui molto propinquo non ui fa cosi gagliardo effetto, ouer passata quanto fa à starui alquanto piu di lontano, et per le ragioni da uoi adutte nella uostra nuoua scientia, doueria seguir tutto al contrario, perche la balla tirata da ogni artegliaria quanto piu se allontana dalla bocca del pezzo tanto piu se allenta di uelocita, come uoi approuate, cioe che quella ua men ueloce, & doue ua men ueloce, iui fa menor effetto. Adunque quanto piu si sta propinquo al luoco doue se tira tanto maggior effetto doueria far tal balla nel luoco doue percuote, di quello faria standoui piu lontano, perche tal balla ferisse di moto piu ueloce, & tamen, come di sopra ho detto. Io trouo con la isperientia riuscir tutto al contrario, è per tanto ui adimando la causa di questo inconueniente.
  cs: |-
    **Pan Iacomo.** Ze zkušenosti jsem poznal, že když se střílí z děla {Artegliaria} do hradby {muraglia} z velmi malé vzdálenosti, nemá to tak mocný účinek neboli průraz {passata}, jako když se stojí poněkud dál. Podle důvodů, které jste uvedl ve své Nové vědě,[^2] by to však mělo být právě naopak, neboť koule {balla} vystřelená z jakéhokoli děla ztrácí rychlost tím víc, čím víc se vzdaluje od ústí děla {pezzo}, jak sám dokazujete; to jest letí pomaleji, a kde letí pomaleji, tam má menší účinek. Čím blíže se tedy stojí k místu, kam se střílí, tím větší účinek by koule měla mít v místě, kam udeří, než kdyby se stálo dál, protože taková koule zasahuje rychlejším pohybem. A přece, jak jsem řekl výše, zkušenost mi ukazuje, že to vychází úplně naopak, a proto se vás ptám po příčině tohoto rozporu.
- typ: odstavec
  de: |-
    N. Per ben risoluere questo dubbio bisogna notare qualmente ogni cosa mossa moue sempre qualche altra cosa. Et pero quando che la balla uien mouesta da quella uentosita causata dal salnitrio, la medesima balla insieme con la medesima uentosita, moue anchora in quel medesimo istante quel aere à se conterminale nella canna, & quel medesimo aere moue & spinge l'altro aere à se consequentemente conterminale, & cosi l'altro spinge l'altro talmente che la detta balla uien à spingere, & à mandare auanti di se una gran quantita di aere di forma molto longa, la qual forma, quantunque la sia de aere, per uigor del moto, tal aere summe grauita in se talmente, che per un certo poco di tempo ua penetrando l'altro aere che per il uiaggio suo ritroua, come se fusse quasi un trauo di legno, ma tal suo penetrar non procede molto lontano, perche tal figura aerea, per un poco di tempo, ouer spacio procede auanti della balla, ma perche la balla è di materia graue piu facilmente penetra lo aere, di quello fa la detta figura aerea, & pero la balla uien a esser di moto molto piu uelocissima della detta figura aerea, & per tanto in breuissimo tempo la detta balla uien à lasciarse de drio da se quella tal figura aerea (che prima andaua auanti di se) hor per tornare al nostro primo proposito, quando che con una artegliaria se tira in una cosa, che ui sia molto propinquissima, quella figura aerea, che è spinta auanti della balla (detta di sopra) percuotera prima in quella cosa doue se tira, della balla, & per non esser tal figura aerea atta à penetrar quella cosa, eglie necessario, che quella prima, & istrema parte di tal figura, che prima percuote, à refflettere, & ritornar in drio, in contra alla medesima figura, & alla balla, che seguita (massime quando tal tiro sia tirato con il pezzo aliuellato) la qual refflessione (continua) nell'aggiongere della balla con il residuo di tal figura aerea che è contigua alla balla fanno uno contrasto grandissimo, cioe il residuo della figura aerea uol proceder auanti, & non puo parte, per non esser atto (come di sopra è detto) à penetrar quella cosa doue se tira, & parte par causa di quell'altra parte che è sforzata à ritornar in drio, la qual combustione da un grande impedimento al moto della balla, talmente che la balla non puo far tutto quello effetto, che doueria fare. Ma quando che il luoco doue se tira è d'una mediocre distantia, la balla per la sua
  cs: |-
    **Nicolò.** Abychom tuto pochybnost dobře rozřešili, je třeba si uvědomit, že každá věc uvedená v pohyb vždy pohybuje i nějakou jinou věcí. Když je tedy koule hnána onou větrností {uentosita} vzniklou z ledku {salnitrio},[^3] táž koule spolu s touž větrností v tomtéž okamžiku pohne i vzduchem, který k ní v hlavni {canna} přiléhá; tento vzduch pohne a tlačí další vzduch, který zase přiléhá k němu, a tak jeden tlačí druhý, takže koule tlačí a žene před sebou velké množství vzduchu velmi protáhlého tvaru. Ačkoli je tento útvar ze vzduchu, nabývá onen vzduch silou pohybu takové tíže, že po nějaký krátký čas proniká jiným vzduchem, na který na své cestě narazí, skoro jako by to byl dřevěný trám. Toto pronikání však nesahá příliš daleko, protože ten vzdušný útvar postupuje před koulí jen po krátký čas neboli úsek. Koule je totiž z těžké hmoty, proniká vzduchem snáze než ten vzdušný útvar, a proto se pohybuje mnohem rychleji než on, takže za velmi krátký čas nechá vzdušný útvar (který předtím letěl před ní) za sebou. Abych se vrátil k naší původní otázce: když se z děla střílí na věc, která je velmi blízko, onen vzdušný útvar hnaný před koulí (o němž byla řeč výše) udeří do věci, na niž se střílí, dříve než koule. A protože tento vzdušný útvar není s to onu věc prorazit, musí se jeho první a krajní část, která udeří nejdříve, odrazit a vracet se zpět proti zbytku útvaru a proti kouli, která jde za ním (zvláště když se střílí z vodorovně namířeného {aliuellato} děla). Tento odraz (nepřetržitý) vytváří s přilétající koulí a se zbytkem vzdušného útvaru, který ke kouli přiléhá, velmi prudký střet: zbytek vzdušného útvaru se chce hnát vpřed a nemůže, jednak proto, že (jak bylo řečeno) není s to proniknout věcí, na niž se střílí, a jednak kvůli té druhé části, která je nucena vracet se zpět. Tento zmatek {combustione}[^4] klade pohybu koule velkou překážku, takže koule nemůže mít celý ten účinek, který by mít měla. Když je však místo, na které se střílí, ve střední vzdálenosti, koule svou
poznamky:
- n: 1
  text: Iacomo (Giacomo) de Achaia – tazatel blíže neznámý. Sensa – benátský svátek Nanebevstoupení Páně (Festa della Sensa) se slavností zasnoubení s mořem a velkým trhem, na který se sjížděli cizinci.
- n: 2
  text: Nova scientia – Tartagliův spis o balistice (Benátky 1537), na který se v rozhovorech často odvolává („la nostra noua scientia“).
- n: 3
  text: Uentosita – „větrnost“, tj. plyn (vítr) vznikající při hoření prachu; Tartaglia připisuje hnací sílu výbuchu ledku.
- n: 4
  text: Combustione – zde ve smyslu zmatek, víření, střet (benátsky „combustion“), nikoli hoření.
