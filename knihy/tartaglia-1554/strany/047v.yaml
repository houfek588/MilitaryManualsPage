- typ: nadpis
  uroven: 3
  de: QVESITO SESTO FATTO DAL medesimo Signor Prior di Barletta.
  cs: Šestý dotaz, který položil týž pan převor barlettský
- typ: odstavec
  de: |-
    PRIORE. Come se potria formar quella figura chiamata la forfice, la quale usauano gli antichi per opponere alla forma cunea.
  cs: |-
    **Převor.** Jak by se dal vytvořit onen obrazec zvaný nůžky {forfice}, který stavěli staří proti klínovému tvaru?
- typ: odstavec
  de: |-
    N. La forfice se costituisse con due forme cunee congionte per tuor la detta figura cunea in meggio.
  cs: |-
    **Nicolò.** Nůžky se skládají ze dvou spojených klínů, aby onen klínový obrazec sevřely mezi sebe.
- typ: odstavec
  de: |-
    P. Datime uno essempio figurale, & in piccol numero.
  cs: |-
    **Převor.** Dejte mi příklad v obrazci, a to na malém počtu.
- typ: odstavec
  de: |-
    N. Lo essempio di questa lo uoglio adure nel medesimo numero de fanti .100. con che fu fatto il cuneo, accio che quella possa far giudicio, se il fusse dui esserciti eguali de quantita de fanti, & che l'uno formasse il cuneo, & l'altro la forfice, qual de loro haueria auantaggio, dico adunque che essendo fanti .100. & uolendo de quelli formare la forfice, li se debbono diuidere in due parti eguali, che ne ueneria .50. per parte, & de cadauna de queste parti se ne debbe
  cs: |-
    **Nicolò.** Příklad k nim chci uvést na témž počtu 100 pěšáků, z nichž byl udělán klín, aby Vaše Důstojnost mohla posoudit, kdyby byla dvě vojska {esserciti} o stejném počtu pěšáků a jedno vytvořilo klín a druhé nůžky, které z nich by mělo výhodu. Pravím tedy, že máme-li 100 pěšáků a chceme-li z nich vytvořit nůžky, je třeba je rozdělit na dvě stejné části, takže na každou část vyjde 50, a z každé z těchto částí se má
- typ: obrazek
  soubor: drevorez-94.jpg
  popis: >-
    Nůžky proti klínu, sázené z teček. Nahoře dva klíny po 49 pěšácích vedle sebe, spojené základnami
    v jedné vodorovné linii; každý má 7 řad (13, 11, 9, 7, 5, 3 a 1 pěšák) s hrotem dolů, u hrotů
    nápisy „fronte“ (čelo). Nad místem spojení dvě samostatné tečky – dva pěšáci, kteří zbyli mimo šik.
    Mezi oběma hroty nápis „fronte“ a pod ním klín ze 100 pěšáků (10 řad o 1 až 19 pěšácích) s hrotem
    nahoru, vražený mezi ramena nůžek.
