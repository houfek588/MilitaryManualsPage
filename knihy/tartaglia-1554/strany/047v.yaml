bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    & cosi in ogni altro numero, che sia quadrato se formara il detto cuneo senza alcuno soprauanzamento de fanti, ma se il detto numero de fanti non sara numero quadrato sempre ui auanzara tanti fanti, quanto che il detto numero de fanti auanzara il maggior numero quadrato contenuto da quello, essempi gratia se gli proposti fanti da far il cuneo fusseno .120. dico che ui auanzara .20. fanti fuora della ordinanza del cuneo, cioe tanti quanto che .120. eccede el .100. (maggior numero quadrato contento da quello) che saria pur .20. ma se gli detti fanti fusseno .123. ui auanzaria solamente fanti .2. perche il maggior numero quadrato contenuto da .123. saria .121. e pero .123. auanza il detto .121. nel detto .2. & questo medesimo si debbe intendere in ogni gran numero.
  cs: |-
    a stejně tak se z každého jiného čtvercového čísla vytvoří ten klín {cuneo} bez jakéhokoli přebytku pěšáků {fanti}. Nebude-li však počet pěšáků čtvercovým číslem, vždy zbude tolik pěšáků, o kolik ten počet převyšuje největší čtvercové číslo v něm obsažené. Například kdyby pěšáků určených k vytvoření klínu bylo 120, pravím, že mimo klínový šik {ordinanza} zbude 20 pěšáků, totiž tolik, o kolik 120 převyšuje 100 (největší čtvercové číslo v něm obsažené), což by bylo právě 20. Kdyby však těch pěšáků bylo 123, zbyli by jen 2 pěšáci, protože největší čtvercové číslo obsažené ve 123 by bylo 121, a 123 tedy převyšuje 121 o ony 2. A totéž platí o každém velkém počtu.
- typ: odstavec
