  de: |-
    prima, & potria anchor esser cosi proportionalmente di la, che la detta seconda botta daria precisamente nel luocho della prima. & tutto questo, che ben considerara la figuratione del ottauo quæsito, sara manifesto. Ma quando che la mira dauanti hauesse per sorte la sua debita & conueniente bassezza respetto à quella de drio, laqual cosa accade rare uolte, cioe che la linea uisuale andasse precisamente à toccare, ma non segare, el transito, ouer uiaggio: qual debbe far la balla. Et che in un simel caso alcun scioppettero, ouer bombardiero tirasse de mira ad alcun segno, & che per uigore delle dette due mire & non per suo diffetto, lui desse di sotto dal segno, per le cose dette & dimostrate nel. 9. quesito, puo occorrer che tal segno sia di qua etiam di la dal toccamento delle dette due linee, perche cosi essendo di qua, come di la da tal toccamento sempre dara di sotto dal segno, come sopra alla figura del detto. 9. Quesito facilmente se apprende, uero è, che quando tal prima botta fusse molto bassa, saria da giudicare che tal segno fusse di la dal detto toccamento, perche essendo de qua tal botta, non puo esser molto bassa, per le ragioni adutte nel detto nono Quesito, se tal segno adunque sara de la dal detto toccamento, & trasportando poi tal segno anchor piu in la, cioe piu lontano dal detto toccamento, senza dubbio la seconda botta sara molto piu bassa della prima. Ma quando che tal segno fusse di qua dal detto toccamento, trasportandolo poi piu in la, puo occorrere che tal segno in tal seconda positione, sia anchor di qua dal detto toccamento, & puo accadere, che sia nel proprio toccamento, & puo esser anchor che sia di la da tal toccamento. S'el segno adunque in tal seconda positione sara de qua dal toccamento, la seconda botta sara de sopra della prima, uero è, che sara pur de sotto dal segno, cioe sara fra el segno, & la prima botta. Ma s'el detto segno in tal seconda positione sara per sorte nel ponto del detto toccamento, la detta seconda botta dara precisamente in brocca. Ma s'el detto segno in tal seconda positione sara de la dal detto toccamento, puo esser tanto de la, che la detta seconda botta sara piu bassa della prima, & puo esser anchora cosi poco di la da tal toccamento, che la detta seconda botta sara di sopra della prima, ma pur di sotto dal segno, cioe fra il segno e la prima botta, & puo essere anchora cosi proportionalmente di la, che la detta seconda botta dara precisamente nel luoco della prima.
  cs: |-
    první, a mohl by být také v takovém poměru za ním, že by druhá rána {botta} padla přesně na místo první. To vše bude zřejmé tomu, kdo dobře uváží obrazec osmého dotazu. Kdyby však přední mířidlo {mira dauanti} mělo náhodou svou náležitou a přiměřenou nízkost vůči zadnímu, což se stává zřídka, totiž tak, že by se zorná čára {linea uisuale} přesně dotýkala dráhy {transito} neboli cesty, kterou má koule {balla} vykonat, ale neprotínala ji, a kdyby v takovém případě některý ručničář nebo dělostřelec vystřelil mířenou ranou na nějaký cíl {segno} a vlivem obou mířidel, a nikoli vlastní vinou, trefil pod cíl, pak podle toho, co bylo řečeno a dokázáno v 9. dotazu, se může stát, že cíl bude před bodem dotyku {toccamento} obou čar, nebo i za ním. Ať je totiž před tímto bodem dotyku, či za ním, rána padne vždy pod cíl, jak se snadno pochopí z obrazce téhož 9. dotazu. Je ovšem pravda, že kdyby první rána byla hodně nízko, bylo by třeba usoudit, že cíl je za bodem dotyku, neboť je-li před ním, nemůže být rána příliš nízko, z důvodů uvedených v témže devátém dotazu. Bude-li tedy cíl za bodem dotyku a přenese-li se pak ještě dál, to jest dál od bodu dotyku, bude druhá rána bez pochyby mnohem níž než první. Kdyby však cíl byl před bodem dotyku a pak se přenesl dál, může se stát, že bude v této druhé poloze stále ještě před bodem dotyku, může se stát, že bude přímo v bodě dotyku, a může být i za ním. Bude-li tedy cíl v této druhé poloze před bodem dotyku, bude druhá rána výš než první, ale přece pod cílem, to jest mezi cílem a první ranou. Bude-li cíl v této druhé poloze náhodou přímo v bodě dotyku, padne druhá rána přesně do středu {brocca}. Bude-li však cíl v této druhé poloze za bodem dotyku, může být tak daleko za ním, že druhá rána bude níž než první; může být také tak málo za bodem dotyku, že druhá rána bude výš než první, ale přece pod cílem, to jest mezi cílem a první ranou; a může být také v takovém poměru za ním, že druhá rána padne přesně na místo první.
- typ: odstavec
  de: |-
    S. Queste uostre ragioni certamente me ingrassano, & questo procede, perche le comenzo à intendere, e per questo mio intendere, quando che mi credeua di por fine à mei Quesiti, le uostre argumentationi me inducono nuoue chimere nella mente mia, ouer nuoui dubbij de addimandarui, ma dubito de non farui fastidio.
  cs: |-
    **Ručničář.** Tyto vaše důvody mi věru lahodí, a to proto, že jim začínám rozumět; a právě tímto porozuměním, když jsem se už domníval, že svým dotazům učiním konec, mi vaše výklady vnukají do mysli nové chiméry neboli nové pochybnosti, na které bych se vás chtěl zeptat. Bojím se však, abych vás neobtěžoval.
- typ: odstavec
  de: |-
    N. Seguitati pur, che non mi fatti fastidio alcuno.
  cs: |-
    **Nicolò.** Jen pokračujte, nijak mě neobtěžujete.
- typ: nadpis
  uroven: 3
  de: |-
    QVESITO VIGESIMONONO FATTO DAL medesimo Schioppettero.
  cs: |-
    Dvacátý devátý dotaz, který položil týž ručničář
- typ: odstavec
  de: |-
    SCHIOPPETTERO. Per quanto posso considerare per le uostre argumentationi de sopra adutte, la openione uostra è, che se il segno doue se tira de mira non se imbatte per sorte à esser nel ponto doue concorre la linea uisuale con el transito, ouer uiaggio qual debbe far la balla, non si possa dare precisamente in brocca. La qual cosa, da una banda per ragion naturale considero, che eglie necessario cosi esser, ma da l'altra
  cs: |-
    **Ručničář.** Pokud mohu z vašich výše uvedených výkladů posoudit, je vaše mínění takové, že jestliže se cíl, na který se mířenou ranou střílí, náhodou neocitne v bodě, kde se zorná čára sbíhá s dráhou neboli cestou koule, nelze trefit přesně do středu. To na jednu stranu z přirozeného rozumu uznávám, že tak nutně musí být, ale na druhou
