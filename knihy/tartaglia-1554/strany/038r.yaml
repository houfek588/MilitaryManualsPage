  de: |-
    per le ragioni di sopra dette, cioe, che tal fuoco non continuera per fina che sia consumata, ouer abbrusata tutta la materia, ma solamente ne abbrusara un poco, & lo restante restara non offesa dal detto fuoco, onde per medicare questo difetto, ui se mescola con ambidui el carbone ottimamente poluerizato, perche el carbone è di tal natura, che tocco dalla fiamma del fuoco subito si accende, & si conuerte in fuoco senza fiamma, el qual fuoco senza fiamma, quanto piu è uessado dalcun uento, tanto piu si accende, & conserua per fina à tanto, che ogni sua sostantia sia conuersa in cenere, e per tanto, toccando tal compositione con el fuoco, immediate el solfere si apprende con fiamma (come detto) la qual fiamma non solamente introdusse immediate fuoco e fiamma nel salnitrio, ma etiam in quello istante introdusse fuoco senza fiamma nel carbone, el qual fuoco, per alcun uento non se estingue, anzi se augmenta, & pero quel uento causato dal salnitrio, non è atto à poter ammorzar quel fuoco senza fiamma, che è nel carbone anzi, come ho detto lo augmenta, & perche il solfer essendo contiguo con el fuoco, ò sia con fiamma, ouer senza fiamma, non puo star senza fiamma, la qual fiamma, come detto infiamma el salnitrio, e pero questi tre materiali pisti, & misti ottimamente insieme, & in tal mistura introdutoui el fuoco tal fuoco uien à essere inestinguibile, per fin che non sia consumata ogni sostantia (saluo se in alcuno de detti materiali non fusse qualche accidental difetto, ò de humidita, ouer che fusseno tolti molto differenti di la sua conueniente proportione) & pero se conclude, che lo officio del solfere in tal compositione è solamente per apprendere il fuoco con fiamma, & introdurlo nelli altri dui materiali, & quello del carbone è solamente de mantenere el detto fuoco senza fiamma, gia introdutoui dal solfere, & massime contra quel gran uento, che causa el salnitrio, ma lo officio poi del detto salnitrio è solamente per causar quella cosi grandissima essalatione di uento, perche in quel tal uento consiste tutta la uirtu, et proprieta di la poluere, perche quello è solamente quello, che spinge cosi uigorosamente ogni balla, & per tanto se conclude, che solamente dal salnitrio depende tutta la uirtu, e possanza della poluere, & li altri dui simplici, ouer materiali, cioe el solfere, & el carbone ui se pongono solamente per risoluere in fuoco, e uento el detto salnitrio, e non per altro, perche chi componesse poluere solamente de solfere, e carbone, & che di quella se ne cargasse una artegliaria à gran misura, dico che in tal sorte di poluere introducendoui el fuoco, la non saria atta à spingere fora di detta artegliaria un minimo legnetto, ouer una paglia, & questo procede, perche tutta quella uirtu espulsiua depende solamente dal puro salnitrio, & non da altro, e per tanto el se potria piu presto concludendo dire esser piu possibile à fare poluere de artegliaria, senza carbone, & solfere, che senza salnitrio, perche eglie da credere esser piu possibile à trouar altri materiali, che facesseno lo officio del solfere in apprendere el fuoco con fiamma, & simelmente del carbone in mantenerui el detto fuoco senza fiamma, che à ritrouarne uno altro, che fusse atto à causar tanto grande, & impetuoso uento, come fa el detto salnitrio.
  cs: |-
    z důvodů výše uvedených: oheň totiž nebude trvat, dokud se nestráví neboli neshoří všechna látka, nýbrž spálí jen trochu a zbytek zůstane ohněm nedotčen. K nápravě této vady se proto k oběma přimísí dokonale rozemleté uhlí {carbone}. Uhlí je totiž takové povahy, že když se ho dotkne plamen ohně, hned se vznítí a promění se v oheň bez plamene; a tento oheň bez plamene se tím víc rozhořívá, čím víc jej nějaký vítr dráždí, a udržuje se tak dlouho, dokud se všechna jeho hmota neobrátí v popel. Když se tedy této směsi dotkne oheň, síra {solfere} okamžitě chytí plamen (jak bylo řečeno), a ten plamen nejen okamžitě zanese oheň a plamen do ledku {salnitrio}, ale v témž okamžiku zanese i oheň bez plamene do uhlí; tento oheň žádným větrem nehasne, nýbrž sílí. Proto onen vítr, který působí ledek, nemůže uhasit oheň bez plamene, jenž je v uhlí, nýbrž jej, jak jsem řekl, rozdmýchává. A protože síra, dotýká-li se ohně, ať s plamenem, nebo bez plamene, nemůže zůstat bez plamene, a tento plamen, jak bylo řečeno, zapaluje ledek, stává se oheň zanesený do směsi těchto tří přísad, dokonale utlučených a smíšených, neuhasitelným, dokud se nestráví všechna hmota (ledaže by v některé z těch přísad byla nějaká nahodilá vada, například vlhkost, nebo že by byly vzaty v poměru velmi odlišném od náležitého). Z toho se usuzuje, že úlohou síry v tomto složení je jen chytit oheň s plamenem a zanést jej do ostatních dvou přísad; úlohou uhlí je jen udržovat oheň bez plamene, který do něj zanesla síra, a to zvláště proti onomu velkému větru, jejž působí ledek; úlohou ledku pak je jen způsobit onen převeliký výpar větru, neboť v tomto větru spočívá všechna síla a vlastnost prachu – on jediný je to, co tak prudce žene každou kouli. Usuzuje se tedy, že jen na ledku závisí všechna síla a moc prachu {poluere}, a ostatní dvě jednoduché látky neboli přísady, totiž síra a uhlí, se přidávají jen proto, aby ledek rozložily v oheň a vítr, a k ničemu jinému. Kdyby totiž někdo složil prach jen ze síry a uhlí a nabil jím dělo {artegliaria} ve velkém množství, říkám, že takový prach by po zapálení nedokázal z děla vyhnat ani nejmenší dřívko nebo stéblo slámy; a to proto, že všechna ta vymršťující síla závisí jen na čistém ledku, a na ničem jiném. Spíše by se tedy dalo nakonec říci, že je možnější udělat dělový prach bez uhlí a síry než bez ledku, neboť je třeba věřit, že je snazší najít jiné látky, které by plnily úlohu síry při chytání ohně s plamenem a podobně úlohu uhlí při jeho udržování bez plamene, než najít nějakou jinou, která by dokázala způsobit tak veliký a prudký vítr, jako činí ledek.
- typ: odstavec
  de: |-
    P. Eglie da credere che sia piu presto possibile à componere poluere buona senza carbone, e solfere, che senza salnitrio, perche tutta la uirtu e possanza della poluere (come di sopra haueti detto) depende dal puro salnitrio, & non da altro, ma per esser hora tarda, uoglio facciamo fine.
  cs: |-
    **Převor.** Je třeba věřit, že je spíše možné složit dobrý prach bez uhlí a síry než bez ledku, protože všechna síla a moc prachu (jak jste výše řekl) závisí na čistém ledku, a na ničem jiném. Ale protože už je pozdě, skončeme.
