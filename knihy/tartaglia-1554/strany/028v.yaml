  de: |-
    N. In questo caso puo far uarie mutationi, perche la mira dauanti puo essere egualmente alta alla mira de drio, & puo essere anchora piu alta, & anchora piu bassa di quella, se per caso adunque la mira dauanti sara eguale, ouer maggiore di quella de drio (per le ragioni adutte nel principio del. 7. quesito) quanto piu se trasportara tal segno di lontano, tanto piu bassa sara la botta. Ma se la mira dauanti sara piu bassa di quella de drio, & che per sorte la sia talmente piu bassa di quella, che la nostra linea uisuale uada realmente à segare il transito, ouer uiaggio qual debbe far la balla, come se dimostra in fine del. 7. quesito, in tal caso, la seconda botta necessariamente sara di sopra della prima, uero è che la puo esser anchor lei pur di sotto dal segno, cioe fra il segno, & la prima botta, & puol esser anchora precisamente nel proprio segno, cioe in brocca, & anchor puol esser di sopra dal segno, perche ogni uolta che la detta mira dauanti sia talmente piu bassa di quella de drio, che la nostra linea uisuale uada realmente à segare il detto transito, ouer uiaggio qual debbe far la balla, come di sopra è detto, & che in un simil caso alcuno schioppettero, ouer bombardiero tiri de mira à un segno, & che per uigore delle dette due mire (et non per suo difetto) lui dia di sotto del segno, eglie manifesto che la interseccatione, che fa la linea uisuale, con il transito, ouer uiaggio che debbe far la bella, per le ragioni adutte in fine del settimo quesito, sara de la dal segno, cioe che il segno sara fra la detta interseccatione, & colui che tira. Et per tanto, se il luoco doue sara trasportato il detto segno, sia anchora di qua da tal interseccatione, necessariamente la detta seconda botta sara di sotto dal segno, uero è che ui sara piu propinqua della prima, cioe sara fra il segno, & la prima botta, ma se la trasportatione del segno sara per sorte nel luoco della propria interseccatione, al detto secondo tiro si dara precisamente in brocca, cioe nel detto segno tolto de mira, ma se per sorte il detto segno sara trasportato oltra la detta interseccatione necessariamente la detta seconda botta dara di sopra dal segno, & tanto piu dara di sopra quanto che piu oltra la detta interseccatione sara trasportato detto segno, per fin à uno certo termine (come in fine del precedente quesito anchor fu detto) ma se la detta mira dauanti sara pur alquanto piu bassa di quella de drio, ma che tal sua bassezza sia tanto poca, che non sia atta di condure la nostra linea uisuale tanto bassa che si possa congiongere con il uiaggio, ouer transito, qual debbe far la balla, anchora in questo caso in ogni trasportatione del detto segno, la botta dara pur di sotto dal segno, uero è, che tal seconda botta potria dar di sopra, & anchor di sotto della prima, & anchora in quella medesima, perche se la prima position del segno sara per sorte nel luoco doue che la linea uisuale passa piu propinquo al transito, ouer uiaggio qual debbe far la balla (come se dimostra nel. 8. quesito) trasportando poi il detto segno oltra al detto luoco senza dubbio la seconda botta sara piu bassa della prima, il medesimo seguiria quando, che la positione del segno fusse oltra al detto luoco. Ma quando che la detta prima positione de segno fusse de qua da tal luoco (piu propinquo trasportando poi il detto segno piu appresso à tal luoco, la detta seconda botta sara di sopra della prima, ma pur sara di sotto dal segno, cioe sara fra la prima botta, & il segno. Ma quando tal segno fusse trasportado di la di tal luoco propinquo potria esser tanto poco di la che pur la detta seconda botta sara fra la prima, & il segno, & potria esser anchor tanto di la che la detta seconda botta dara di sotto della
  cs: |-
    **Nicolò.** V tomto případě může nastat řada obměn, neboť přední mířidlo {mira dauanti} může být stejně vysoké jako zadní mířidlo {mira de drio}, může být také vyšší a také nižší než ono. Bude-li tedy přední mířidlo stejné jako zadní nebo vyšší než ono, bude rána {botta} tím níž, čím dál se cíl {segno} přenese (z důvodů uvedených na začátku 7. dotazu). Bude-li však přední mířidlo nižší než zadní, a to náhodou natolik nižší, že naše zorná čára {linea uisuale} skutečně protne dráhu {transito} neboli cestu, kterou má koule {balla} vykonat, jak se dokazuje na konci 7. dotazu, pak v takovém případě bude druhá rána nutně výš než první. Může však být i ona ještě pod cílem, to jest mezi cílem a první ranou, může být také přesně v samém cíli, to jest ve středu {brocca}, a může být i nad cílem. Kdykoli je totiž přední mířidlo natolik nižší než zadní, že naše zorná čára skutečně protne dráhu neboli cestu koule, jak bylo řečeno výše, a kdykoli v takovém případě některý ručničář nebo dělostřelec vystřelí mířenou ranou na cíl a vlivem obou mířidel (a ne vlastní vinou) trefí pod cíl, je zřejmé, že průsečík {interseccatione} zorné čáry s dráhou neboli cestou koule[^1] bude z důvodů uvedených na konci sedmého dotazu za cílem, to jest že cíl bude mezi tímto průsečíkem a střelcem. Bude-li tedy místo, kam se cíl přenese, stále ještě před tímto průsečíkem, padne druhá rána nutně pod cíl, bude však blíž k němu než první, to jest bude mezi cílem a první ranou. Padne-li však přenesení cíle náhodou přesně na místo samotného průsečíku, trefí se druhou ranou přesně do středu, to jest do zamířeného cíle. A bude-li cíl náhodou přenesen za tento průsečík, padne druhá rána nutně nad cíl, a to tím víc nad něj, čím dál za průsečík bude cíl přenesen, až do jisté meze (jak bylo také řečeno na konci předešlého dotazu). Bude-li však přední mířidlo sice poněkud nižší než zadní, ale o tak málo, že nedokáže svést naši zornou čáru tak nízko, aby se mohla setkat s cestou neboli dráhou koule, pak i v tomto případě padne rána při každém přenesení cíle pod cíl. Je ovšem pravda, že tato druhá rána by mohla padnout výš i níž než první, a také na totéž místo. Bude-li totiž první poloha cíle náhodou v místě, kde zorná čára prochází nejblíže k dráze neboli cestě koule (jak se dokazuje v 8. dotazu), a cíl se pak přenese za toto místo, bude druhá rána bez pochyby níž než první; totéž by nastalo, kdyby poloha cíle byla za tímto místem. Když však první poloha cíle byla před tímto místem (nejbližším) a cíl se pak přenese blíž k němu, bude druhá rána výš než první, ale přece pod cílem, to jest mezi první ranou a cílem. Kdyby však byl cíl přenesen za toto nejbližší místo, mohl by být za ním o tak málo, že druhá rána bude stále mezi první ranou a cílem, a mohl by být také tak daleko za ním, že druhá rána padne níž než
