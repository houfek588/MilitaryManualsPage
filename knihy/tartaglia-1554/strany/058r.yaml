  de: |-
    perpendicolarmente sotto al loco doue procede la nostra linea uisuale per quelli dui busettini, ouer per quelle due ponte, & signato quel tal ponto, uoltar la detta dioptra, & giustarla alli .29. gradi di Greco uerso Leuante, come parla la polizetta, & signar el secondo ponto, & cosi andar procedendo alli .28. gradi di Tramontana uerso Greco, & alli .9. gradi di Maistro uerso Ponente, & ultimamente alli .5. gradi di Garbino uerso Ostro, come con lo intelletto facilmente si puo comprender sopra la figura sequente, & dapoi che se hauera signati li detti ponti, se potra leuar lo detto istrumento, & signar el luoco doue se ripossaua el centro di quello (come di sopra dissi esser nella mitta della sopradetta partial linea .c.d. in ponto .e.) & dal detto centro, con una rega, ouer una regola tirar .5. linee de indiffinita quantita, che passino per li detti .5. ponti, cioe la prima dal detto centro al primo ponto, cioe à quello signato alli .3. gradi de Sirocco uerso Ostro, & quella tirarla de longo senza farui termine, & cosi procedere alli altri quattro ponti, & dapoi che se haueran tirate le dette .5. linee, di cadauna di quelle bisognara cauarne com un compasso una parte de tante misurette, ouer apriture di compasso, quanto saranno li passi della sua relatiua nella nostra polizetta, comenzando pero sempre à misurare à quel loco, doue se ripossaua el centro del nostro istrumento, cioe à quel ponto .e. (di sopra detto) essempi gratia, da quella linea, che passara per li .3. gradi di Sirocco uerso Ostro, se ne douera misurar fora .54. apriture di compasso, per esser la sua relatiua nella polizetta passa .54. et in capo delle dette .54. apriture di compasso, ui se douera far un ponto fermo terminante detta linea, & cosi senza mouere il compasso, cioe con la medesima apritura, si debbe misurare fuora à cadauna delle altre quattro linee, tante apriture, quanto sara el numero di passa della sua relatiua nella nostra polizetta, cioe à quella che passa per li .29. gradi di Greco uerso Leuante, per essere la sua relatiua passa .63. se ne misurara fuora .63. apriture di compasso, et im fine di quella faruj un ponto fermo, & cosi per non abondar in parole, de l'altra consequente se ne douera misurar fuora .81 & far ponto, & de l'altra .72. & della ultima .62. e mezzo, & in fine di cadauna di quelle farui un ponto fermo (come di sopra fu detto) & fatto questo, el si de congiongere li detti .5. ponti fermi con .5. linee rette, le quale .5. linee tirate, che siano, representaranno li .5. lati del nostro sito, ouer paese proportionalmente, come di sotto appare in figura, cioe, che tal piccol disegno, ouer figura sara simile à quella figura del nostro paese, ouer sito, & langolo .a. della sottoscritta figura sara relatiuo, & equale a langolo .a. della figura del nostro paese, & langolo .b. a langolo .b. & cosi tutti li altri al suo relatiuo. Et bisogna notar, che quantunque io habbia tirate quelle .5. linee, che uien dal centro à ciascun angolo del nostro dissegno, tutte apparente (come nella figura appare) nondimeno uoleno esser tirate occulte, cioe senza inchiostro, perche guastano la figura, ma cosi le ho tirate, accio che uoi intendiate meglio la cosa. Anchor bisogna notar, che per misurar fora delle sopra scritte .5. linee quelle apriture di compasso che bisogna, con piu breuita, se puo signar dacanto una lineetta de .100. apriture di compasso, ouer de piu, secondo che tal paese sara grande, ouer piccolo, et quella tal lineetta diuiderla in parte a .10. apritura per parte, et questa tal linea se chiama schala della nostra misura, et quando poi occorresse de misurare fora da una data linea una qualche gran distantia, ouer longhezza, poniamo una longhezza de .795. passa,
  cs: |-
    kolmo pod místem, kudy prochází naše zorná čára {linea uisuale} skrze ty dvě dírky {busettini} nebo podél těch dvou hrotů. Když je ten bod vyznačen, otočí se dioptra {dioptra} a nastaví na 29 stupňů od severovýchodu {Greco} k východu {Leuante}, jak praví lístek {polizetta}, a vyznačí se druhý bod; a tak se postupuje dále k 28 stupňům od severu {Tramontana} k severovýchodu, k 9 stupňům od severozápadu {Maistro} k západu {Ponente} a nakonec k 5 stupňům od jihozápadu {Garbino} k jihu {Ostro}, jak lze rozumem snadno pochopit z následujícího obrazce. Když jsou ty body vyznačeny, lze nástroj sejmout a vyznačit místo, kde ležel jeho střed (které je, jak jsem řekl výše, uprostřed zmíněného úseku přímky c d, v bodě e), a z tohoto středu vést pomocí pravítka pět přímek neurčité délky, které procházejí oněmi pěti body: totiž první od středu k prvnímu bodu, to jest k tomu, který byl vyznačen u 3 stupňů od jihovýchodu {Sirocco} k jihu, a vést ji dál, aniž by se jí stanovil konec; a tak postupovat u ostatních čtyř bodů. Když jsou těch pět přímek narýsováno, bude třeba na každé z nich odměřit kružítkem {compasso} úsek o tolika měrkách čili rozevřeních kružítka {apriture di compasso}, kolik kroků {passi} má odpovídající záznam na našem lístku, přičemž se vždy začíná měřit od místa, kde ležel střed našeho nástroje, totiž od výše zmíněného bodu e. Například na přímce, která prochází 3 stupni od jihovýchodu k jihu, bude třeba odměřit 54 rozevření kružítka, protože odpovídající záznam na lístku zní 54 kroků, a na konci těch 54 rozevření kružítka se udělá pevný bod, který tu přímku ukončí. A stejně, bez pohnutí kružítka, totiž s týmž rozevřením, je třeba odměřit na každé z ostatních čtyř přímek tolik rozevření, kolik kroků činí odpovídající záznam na našem lístku: totiž na té, která prochází 29 stupni od severovýchodu k východu, se odměří 63 rozevření kružítka, protože odpovídající záznam zní 63 kroků, a na jejím konci se udělá pevný bod. A abych neplýtval slovy: na další přímce bude třeba odměřit 81 a udělat bod, na další 72 a na poslední 62 a půl[^1] a na konci každé z nich udělat pevný bod (jak bylo řečeno výše). Když je to hotovo, je třeba spojit těch pět pevných bodů pěti přímkami; a těch pět přímek, jakmile budou narýsovány, bude v poměru představovat pět stran našeho místa {sito} čili krajiny {paese}, jak je vidět níže na obrázku. To znamená, že tato malá kresba čili obrazec bude podobný onomu obrazci naší krajiny čili místa: úhel a níže nakresleného obrazce bude odpovídat a rovnat se úhlu a obrazce naší krajiny, úhel b úhlu b a tak všechny ostatní tomu svému odpovídajícímu. A je třeba si povšimnout, že ačkoli jsem těch pět přímek, které vedou ze středu ke každému úhlu naší kresby, narýsoval všechny viditelně (jak je vidět na obrázku), mají se přesto rýsovat skrytě, totiž bez inkoustu, neboť kazí obrazec; já jsem je však narýsoval takto, abyste věci lépe porozuměl. Dále je třeba si povšimnout, že k rychlejšímu odměřování potřebných rozevření kružítka na zmíněných pěti přímkách lze stranou vyznačit čárku o 100 rozevřeních kružítka nebo i více, podle toho, bude-li krajina velká nebo malá, a tu čárku rozdělit na díly po 10 rozevřeních; a taková čára se nazývá měřítko {schala} naší míry. A když se pak naskytne potřeba odměřit na dané přímce nějakou velkou vzdálenost čili délku, řekněme délku 795 kroků,
poznamky:
- n: 1
  text: V tabulce na předchozí straně je u páté vzdálenosti uvedeno jen „passa. 62.“, zde „62. e mezzo“ (62 a půl) – rozpor předlohy, ponecháno.
