  de: |-
    auanti annotati (si come nella precedente operatione fu anchor fatto) & dapoi cauar il detto istromento di quell'angolo, & andarlo à piantare in su quell'altro (doue è quella bacchetta, ouer signale, gia trasguardato) et con il medesimo modo trasguardar quella bacchetta, o altro signale che sara su l'altro terzo angolo, & annotar similmente nella pollicetta per qual uento, & numero de gradi passara la linea uisuale, & consequentemente à notarui drio il numero di passa, che sara dal piede del nostro istromento per fina al detto segno, & cosi con tal ordine si debbe andar procedendo per fin che si hauera totalmente circondato quel tal paese grande, ouer piccolo che sia, ilche se hauera totalmente circondato, quando se sara peruenuto à trasguardare quel segno posto in su quel angolo, ouer cantone, doue che nel principio fu piantato la prima uolta lo istromento, & fatto questo il si puo cauar lo suo istromento, & andarsene à casa, & quando se uorra mettere tal paese in dissegno, in carta, ouer in tela, il si debbe proceder quasi, come nell'altra descrittione, cioe distendere tal carta, ouer tela, sopra una tauola piana, & da quella banda, che parera piu conuenire al primo lato del nostro paese, & non nel meggio de tal carta come nell'altra fu fatto, se douera assettare il detto nostro istromento talmente che la lancetta del bossolo stia secondo l'ordine suo, & dapoi assettare anchora la dioptra à quel uento, & numero de gradi annotati nella prima partita della nostra pollicetta, & assettata che ui sia, il si debbe signar dui pontini su la carta piccolissimi (con un'ago, ouer altra cosa pontita) cioe l'uno da l'un capo della dioptra, & l'altro dall'altro per pendicolarmente sotto al luoco doue suol procedere rettamente la nostra linea uisuale, & questo facilmente se puo conoscere per meggio de quella poca parte della dioptra che uscisse fuora dell'istromento (come nell'altro quesito anchor fu detto) & dapoi che se hauera signati li detti dui ponti, il si debbe leuar uia l'istromento, & con una rega il si debbe tirare, ouer signare una linea retta de indiffinita quantita, la qual passi precisamente per li detti dui pontini, & di questa tal linea il si ne debbe misurar fuora con il compasso (con l'ordine della nostra scala) tanti passa quanti dira la nostra pollicetta, & principiare à misurare doue ne parera piu conueniente nella detta linea, & nel principio, & fine di tal parte misurata ui se debbe far un ponto fermo, fatto questo il si debbe giustar la dioptra, à quel uento, & numero de gradi, che si contiene nella seconda partita della nostra pollicetta (cioe nella seconda statione) & dapoi giustarlo al capo de drio di detta dioptra à quel ponto fermo, che fu signato in fine della nostra prima linea, & agiustato, che ui sia, il si debbe torcere tanto in qua, & in la il detto istromento insieme con la dioptra, che la lancetta del bossolo uada al suo segno senza che la dioptra si muoua dell'ordine, che fu prima assettata, ma solamente girare à torno à quel ponto fermo, come suo centro, talmente che queste tre cose si accordano, cioe che la lancetta stia giusta al suo segno, & che la dioptra stia al suo uento, & numero de gradi, & che anchora la detta dioptra con il capo da drio uenghi à terminare precisamente à quel ponto fermo della prima linea signata, & quando che queste tre cose siano ben accordate, il si debbe signare uno pontino dall'altro capo della dioptra con uno ago, ouer altra cosa appontita, cioe sotto al luoco doue passa, ouer suol passare la nostra linea uisuale, et signato tal pontino, il si debbe leuar uia lo istromento, & con una rega il si debbe tirare una linea retta, che passi per
  cs: |-
    zapsaný předtím (jak se to dělalo i při předchozím postupu). Potom se nástroj z toho úhlu vytáhne a zarazí se na onom druhém (kde je ta tyčka {bacchetta} nebo znamení, na něž se již zaměřilo), a týmž způsobem se zaměří tyčka nebo jiné znamení, které bude na dalším, třetím úhlu, a na lístek {pollicetta} se rovněž zapíše, kterým větrem {uento} a počtem stupňů prochází zorná čára {linea uisuale}, a hned za to se připíše počet kroků {passa} od paty našeho nástroje až k tomu znamení. A tímto pořádkem se má postupovat tak dlouho, až se celá ta krajina {paese}, ať velká, nebo malá, obejde dokola; a celá obejitá bude tehdy, když se dojde k zaměření onoho znamení postaveného na tom úhlu čili rohu, kde byl na začátku poprvé zaražen nástroj. Když je to hotovo, lze nástroj vytáhnout a jít domů. A když budeme chtít tu krajinu zakreslit na papír nebo plátno, je třeba postupovat skoro jako u předchozího zákresu: totiž rozprostřít papír nebo plátno na rovnou desku, a na té straně, která se bude zdát nejvhodnější pro první stranu naší krajiny – a ne uprostřed papíru, jak se to dělalo tam –, je třeba usadit náš nástroj tak, aby střelka {lancetta} buzoly stála podle svého řádu, a potom nastavit i dioptru {dioptra} na ten vítr a počet stupňů, které jsou zapsány v první položce {partita} našeho lístku. Když je nastavena, je třeba vyznačit na papíře dva velmi malé bodíky (jehlou nebo jinou špičatou věcí), totiž jeden u jednoho konce dioptry a druhý u druhého, kolmo pod místem, kudy obvykle přímo prochází naše zorná čára; to lze snadno poznat podle té malé části dioptry, která přečnívá ven z nástroje (jak bylo řečeno už v jiném dotazu). Když jsou ty dva body vyznačeny, je třeba nástroj odstranit a podle pravítka vést čili vyznačit přímku neurčité délky, která prochází přesně oběma bodíky; a na té přímce je třeba odměřit kružítkem {compasso} (podle našeho měřítka {scala}) tolik kroků, kolik udává náš lístek, a začít měřit tam, kde se nám na té přímce bude zdát nejvhodnější, a na začátku i na konci odměřeného úseku se udělá pevný bod. Když je to hotovo, je třeba nastavit dioptru na ten vítr a počet stupňů, které obsahuje druhá položka našeho lístku (totiž druhé stanoviště {statione}), a potom ji zadním koncem přiložit k onomu pevnému bodu, který byl vyznačen na konci naší první přímky. Když je přiložena, je třeba nástroj spolu s dioptrou otáčet tam a sem tak dlouho, až střelka buzoly dojde ke své značce, aniž by se dioptra pohnula z polohy, v níž byla nastavena, nýbrž jen otáčet kolem onoho pevného bodu jako kolem svého středu, tak aby se tyto tři věci shodovaly: aby střelka stála přesně na své značce, aby dioptra stála na svém větru a počtu stupňů a aby i zadní konec dioptry končil přesně v onom pevném bodě vyznačené první přímky. A když jsou tyto tři věci dobře v souladu, je třeba vyznačit jehlou nebo jinou špičatou věcí bodík u druhého konce dioptry, totiž pod místem, kudy prochází nebo obvykle prochází naše zorná čára; a když je ten bodík vyznačen, je třeba nástroj odstranit a podle pravítka vést přímku, která prochází
