id: tartaglia-1554
nazev: Rozličné otázky a vynálezy
nazev_orig: Quesiti et inventioni diverse
podtitul: di novo restampati con una gionta al sesto libro, nella quale si mostra duoi modi di redur una città inespugnabile
autor: Niccolò Tartaglia
autor_razeni: 'Tartaglia, Niccolò'   # klíč abecedního řazení v Knihovně (příjmení, jméno)
autor_zivot: 1499/1500–1557
vydani: Benátky, nákladem autora (tiskl Niccolò de Bascarini), 1554
rok: 1554
katalog: BV010857339
rozsah: '128 listů, 4°'
jazyk: it          # jazyk originálu: pole `de` ve stranách a glosáři obsahuje ITALSKÝ text a tvary
jazyk_orig: italština (benátská toskánština 16. století)
popis: >-
  Rozhovory matematika Niccola Tartaglii s vojáky, dělostřelci a šlechtici o střelbě z děl, kulích, střelném prachu
  a ledku, o sestavování šiků, zaměřování plánů buzolou a opevňování měst, včetně dodatku o pevnosti, kterou nelze
  dobýt. Druhé vydání 1554; přeloženy knihy I–VI s dodatkem, mechanika (VII–VIII) a algebra (IX) zatím ne.
prekladatel: Přepis z OCR a překlad s pomocí LLM, 2026.
strankovani: folio
strany_poznamka: >-
  Tisk je foliován arabskými čísly od listu 5 (první čtyři listy – titul, obsah a věnování – číslo nemají a edice je
  uvádí v hranatých závorkách). List N r = sken 2N − 1. Přeloženy jsou knihy I–VI a dodatek k šesté knize (listy
  1–77, skeny 1–154); knihy VII–IX (mechanika a algebra, skeny 155–256) jsou zatím jen jako strany bez textu.
