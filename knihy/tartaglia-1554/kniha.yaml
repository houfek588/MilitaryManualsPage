poznamky_k_prekladu: |
  JAZYK: originál je ITALSKY (benátská toskánština 1554). Pole `de` ve stranách obsahuje italský text, v glosáři
  italské tvary z tisku. Zachovej pravopis tisku (u/v: uarie, hauere; et, &; apostrofy l'artiglieria), dlouhé ſ
  převáděj na s a ligaturu ß (ſs: Serenißima, poßibile) na „ss“, rozepiš zkratky s vlnovkou (cõ → con, ā → an/am
  podle slova, q̃ → que), vynech záhlaví (PRIMO, LIBRO), číslo listu, kustody a signatury.
  Typické chyby OCR: ſ čtené jako f (fi → si, fono → sono, fopra → sopra, fua → sua, cofa → cosa), u/n, c/e.

  FORMA: kniha je řada „quesiti“ – rozhovorů autora (N. = Nicolò) s tazateli (Bombardiero, S. Duca, S. Priore, S.
  Gabriel Tadino…). Repliky začínají jménem mluvčího zkratkou či verzálkami (BOMBARDIERO., N., S. M.) – každá replika
  = jeden blok `odstavec`, jméno mluvčího přelož („Dělostřelec.“, „Nicolò.“, „Pan vévoda.“) a dej na začátek bloku
  tučně: **Dělostřelec.** … Nadpis quesita („Quesito primo fatto dal Signor Duca d’Urbino…“) = nadpis úrovně 3.

  STRUKTURA: titul [1] r; obsah díla [1] v; tabulka obsahu [2] r–[3] v; věnování Jindřichu VIII. [4] r–v. Úroveň 1 =
  titul, věnování, jednotlivé knihy (LIBRO PRIMO … SESTO) a Gionta k šesté knize; úroveň 2 = úvodní/dílčí oddíly knihy
  (věnování knihy, pokud je); úroveň 3 = jednotlivá quesita. Knihy: I sken 9 (střelba z děl), II sken 62 (koule
  z olova, železa, kamene), III sken 73 (ledek a prach), IV sken 85 (šiky), V sken 108 (zaměřování buzolou), VI sken
  127 (opevnění měst), Gionta sken 140–154.

  TERMINOLOGIE (výchozí, glosář ji upřesní): artiglieria / artegliaria = dělostřelectvo, pezzo d’artiglieria = dělo,
  bombardiero = dělostřelec (ne bombardér), colubrina = kolubrina (kulverina), sacro = sakr, falcone / falconetto =
  falkon / falkonet, mortaro = moždíř, bombarda = bombarda, archibuso = arkebuza, schioppo = ručnice, balla = koule,
  polvere = prach, salnitro = ledek, squadra (přístroj) = kvadrant (dělostřelecký úhloměr), squadra / squadrone
  (útvar) = šik, elevatione = elevace, tiro = výstřel / dostřel, bossolo = buzola, cortina = kurtina, baluardo /
  bastione = bašta, terrapieno = val, fossa = příkop, città = město, Signor = pan, Vostra Eccellenza = Vaše Excelence,
  Maestà = Veličenstvo, ducato = dukát, braccio = loket (míra), passo = krok (míra), libra = libra.
  Čísla, míry a výpočty (bracci, passi, libre, proporce) překládej přesně; geometrické figury popiš v `popis`.
