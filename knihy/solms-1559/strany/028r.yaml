bloky:
- typ: nadpis
  uroven: 2
  de: Von dem obersten Zeugmeister Ampt.
  cs: O úřadu nejvyššího zbrojmistra {Zeugmeister}.
- typ: odstavec
  de: |-
    DEr oberst Zeugmeister / soll ein Vnderzeugmeister oder Leutenant haben / wan mann das Geschütz theillen muß / als auß notturfft offt am zug in Schlachten / oder vor den belegerten Flecken / geschicht / daß bei jedem theil einer sei der die sachen regiere / sonst geht es etwan langsam von stat.
  cs: |-
    Nejvyšší zbrojmistr má mít podzbrojmistra {Vnderzeugmeister} neboli poručíka {Leutenant}. Je-li totiž třeba děla {Geschütz} rozdělit, jak se z nutnosti často stává na tažení {zug}, v bitvách nebo před obleženými městečky, má být u každého dílu někdo, kdo věci řídí; jinak to někdy jde pomalu.
- typ: odstavec
  de: |-
    Der oberst Zeugmeister / soll einn geschickten Zeugschreiber haben / dann es vil daran gelegen ist / hat er aber vil Geschütz / bedarff er mehr dann eins Schreibers.
  cs: |-
    Nejvyšší zbrojmistr má mít schopného zbrojního písaře {Zeugschreiber}, neboť na tom mnoho záleží; má-li však mnoho děl, potřebuje více než jednoho písaře {Schreibers}.
- typ: odstavec
  de: |-
    Der oberst Zeugmeister / soll einn geschickten Schantzmeister haben / wie vnd wo er jm zu schantzen beuilcht / daß er solchs mit ringster bescheidigung seiner Quastitor zuuerrichten wisse.
  cs: |-
    Nejvyšší zbrojmistr má mít schopného šancmistra {Schantzmeister}, který dovede šance vybudovat tak a tam, jak a kde mu přikáže, s co nejmenšími ztrátami svých šancířů {Quastitor}[^1].
- typ: odstavec
  de: |-
    Der Schantzmeister soll / wann er auß beuelch des Schantzmeisters schantzet / die Körb mit Rath der Büchsenmeister setzen / damit ein jeder sein Stück desto gefüglicher schiessen mög.
  cs: |-
    Když šancmistr staví šance na rozkaz šancmistra {Schantzmeisters}[^2], má šancovní koše {Körb} stavět po poradě s puškaři {Büchsenmeister}, aby každý mohl ze svého děla střílet co nejpohodlněji.
- typ: odstavec
  de: |-
    Der Zeugmeister / soll allweg seinem Geschütz gemeß Quastitor haben / dabei sollen auch zwen Regierer sein / wann mann die Quastitor theilet / das jeder theil einn bei jm hab / der ob jnen sei / damit sie die Prücken / Weg / vnd Schantzen raumen / alle notturfft / wie es sein sol fürderlich machen.
  cs: |-
    Zbrojmistr má mít vždy tolik šancířů, kolik odpovídá jeho dělům, a při nich také dva dozorce šancířů {Regierer}, aby při rozdělení šancířů měl každý díl u sebe jednoho, který by jim velel. Šancíři tak mají rychle upravovat mosty, cesty a šance {Schantzen} a obstarávat vše potřebné, jak se sluší.
- typ: odstavec
  de: |-
    Der Feldmarschalck braucht die Quastitor auch / wann er (wie seinem ampt gebürt) vor reit die weg zu raumen / vnd greben einziehen.
  cs: |-
    Šancíře potřebuje také polní maršálek {Feldmarschalck}, když (jak přísluší jeho úřadu) jede napřed, aby upravovali cesty a zasypávali příkopy.
- typ: odstavec
  de: |-
    Der oberst Zeugmeister hat seinn eigen Prouosen / vnd darff jm sonst niemand die / so zu seiner Artlerei gehörn / gefengklich annemen.
  cs: |-
    Nejvyšší zbrojmistr má svého vlastního profouse {Prouosen} a nikdo jiný mu nesmí zatýkat ty, kdo náležejí k jeho dělostřelectvu {Artlerei}.
- typ: odstavec
  de: |-
    Der Zeugmeister hat in seiner Artlerei freiheit / also / Wann einer im Leger etwas verwirckt / oder daß er preiß gemacht wirt / vnd derselbig darein enttrint / ist er sicher / es were dann vmb hochwichtig sachen / dann ist er schuldig den herauß zugeben.
  cs: |-
    Zbrojmistr má u svého dělostřelectva výsadu {freiheit}: když se někdo v ležení {Leger} něčím proviní nebo je dán v plen[^3] a uteče k dělům, je tam v bezpečí, ledaže by šlo o velmi závažné věci; pak je zbrojmistr povinen jej vydat.
- typ: odstavec
  de: |-
    Die Zeugmeister wöllen / wellichen Flecken sie beschiessen / vnnd mit dem sturm erobert werd / soll der Herr des Kriegs alles Geschütz so auff redern steht / von jnen lassen / dann das ander ist in disem fall / wer es gewindt.
  cs: |-
    Zbrojmistři žádají, aby u každého městečka, které ostřelují a které je dobyto útokem {sturm}, válečný pán od nich vykoupil[^4] všechna děla stojící na kolech; ostatní kořist totiž v takovém případě patří tomu, kdo ji získá.
- typ: odstavec
  de: |-
    Deßgleichen wöllen sie auch gerechtigkeit an dem Geschütz haben das in den Schlachten gewunnen wirt.
  cs: Stejně tak si zbrojmistři činí nárok i na děla, která se ukořistí v bitvách.
- typ: odstavec
  de: |-
    Wann der Zeugmeister einn Flecken bescheußt daß er sich auffgibt / wöllen sie auch der Kriegsherr soll das Geschütz / so darinn gefunden wirt / von dem obersten Zeugmeister lösen.
  cs: |-
    Když zbrojmistr ostřeluje městečko a to se vzdá, žádají také, aby válečný pán {Kriegsherr} děla, která se v něm najdou, od nejvyššího zbrojmistra vykoupil.
poznamky:
- n: 1
  text: |-
    *Quastitor* – z ital. *guastatori*.
- n: 2
  text: |-
    Zjevná chyba tisku: *des Schantzmeisters* místo *des Zeugmeisters* (tj. na rozkaz zbrojmistra).
- n: 3
  text: |-
    *preiß gemacht* – vydán v plen, tj. prohlášen za psance, kterého smí kdokoli zabít či zajmout.
- n: 4
  text: |-
    V tisku (ověřeno ve skenu) *von jnen lassen*; překládáme podle *von jnen lösen* („od nich vykoupit“), jak stojí v posledním odstavci této strany a na l. 28v. Možné je i čtení „jim ponechat“.
