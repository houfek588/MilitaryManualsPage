bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    wacht ansteht/ deßgleichen auch vier mann die ringßweiß vmb die Statt gingen/ die zwen auff der einen die andern zwen auff der andern seiten/ vnd zusehen daß kein verreterei geschehe/ biß die wacht besetzt ist/ wolt auch gleich darauff die Wacht besetzen/ nemlich auff der Mauren/ Thurn/ Polwercken vnnd anderen orten/ da es von nöten sein wirt/ so solches geschehen/ soll mann die porten zu schliessen/ euch die Schlissel vberantworten/ ferrer solt jr vor einem Thor oder Polwerck zwen haben die alda losen/ vnd hören ob sie nicht die Feind sehen oder hörn mögen/ dasselbig wirt warlich euch die best wacht sein/ vnd soll sie nicht zu weit von der Stat sein oder gehn/ damit sie nicht gefangen werden/ müst jnen aber ein ander weitzeichen oder kreiden geben dann denen in der Stat/ doch sollen die in der Stat jr Kreiden aber die vor der Statt nicht/ wissen/ sie sollen auch nicht schlaffen/ sonder allwegen losen/ vnd was jnen zu handen geht/ sollen sie denen so auff dem Polwerck wachen anzeigen/ dieselbigen sollens nachuolgents der wacht auff der Maur vnd Thürnen kundt thůn/ es soll auch auff einem jeglichen Thürn ein Glocken haben/ die mann inn der gantzen Stat kan hören/ deßgleichen auch in einem Hauß das vngefehrlich mitten in der Stat ist soll ein wacht sein/ vnnd ein Glocken darinn hangen die etwas grosser sei dann die auff den Thürnen/ damit mann sie kenne wann sie geleut wirt/ vnd wann mann dieselbigen Glocken leut/ sollen die auff den Thürn mit jren Glocken antwort geben/ damit mann wisse daß sie nicht schlaffen/ Wann aber etliche nicht antworten/ soll von stundan der Wachtmeister dahin schicken/ dieselbigen sollen jm widerumb anzeigen was sie befunden haben/ vnd soll die wacht nicht abtretten biß daß die so darnach wachen sollen/ antretten/ welche wacht jr auch auff den höchsten Thurn so jr habt/ legen solt/ nachuolgents die Glocken dreimal leutten/ Alß dan möcht jr wol abtretten/ solt auch darnach die Schlissel den so zu den Thoren wider schicken/ damit sie die Thor wider öffnen künden/ doch were mein rath daß allwegen wann jr esset/ die Thor widerumb beschliessen lassen.
  cs: |-
    nenastoupí stráž. Stejně tak bych ustanovil čtyři muže, kteří by obcházeli město dokola, dva po jedné a druzí dva po druhé straně, a dohlíželi, aby nedošlo k žádné zradě, dokud nebude stráž rozestavena. Hned nato bych rozestavil stráž {Wacht}, totiž na hradbách, věžích, bolverkách {Polwercken} a jiných místech, kde toho bude třeba. Až se tak stane, mají se zavřít brány a klíče se mají odevzdat vám. Dále máte mít před každou branou nebo bolverkem dva muže, kteří tam budou naslouchat, zda nepřítele neuvidí nebo neuslyší; to bude věru vaše nejlepší stráž. Nemají však stát ani chodit příliš daleko od města, aby nebyli zajati. Musíte jim ale dát jiné heslo[^1] či polní znamení {kreiden} než těm ve městě; ti ve městě mají jejich znamení znát, ale ti před městem znamení města znát nemají. Nesmějí také spát, nýbrž mají stále naslouchat, a co zjistí, mají ohlásit těm, kdo drží stráž na bolverku; ti to pak mají oznámit stráži na hradbě a na věžích. Na každé věži má také být zvon, který je slyšet po celém městě. Stejně tak má být stráž v domě, který stojí přibližně uprostřed města, a v něm má viset zvon o něco větší než zvony na věžích, aby se poznal, když se jím zvoní. Když se tímto zvonem zvoní, mají ti na věžích odpovědět svými zvony, aby se vědělo, že nespí. Pokud však někteří neodpovědí, má tam vachmistr {Wachtmeister} ihned poslat [lidi] a ti mu zase oznámí, co tam zjistili. Stráž nemá odstoupit, dokud nenastoupí ti, kdo mají držet stráž po ní; tuto stráž máte postavit i na nejvyšší věž, kterou máte. Potom se má třikrát zazvonit a teprve pak smíte odstoupit. Nato máte klíče zase poslat těm u bran, aby mohli brány opět otevřít. Radil bych však, abyste brány vždy, když jíte, dali opět zavřít.
- typ: odstavec
  de: |-
    Wann aber ein Schiffreich wasser durch die Stat oder nicht weit daruon hinfleußt/ vnd jr etlich Schiff gehn sehend/ solt jrs nit durchlassen biß jr sie wol besehen habt/ damit kein betrug der verräterei dardurch geschehe.
  cs: |-
    Teče-li však městem nebo nedaleko od něho splavná řeka a vidíte po ní plout nějaké lodě, nemáte je propustit, dokud je dobře neprohlédnete, aby skrze ně nedošlo k žádné zrádné lsti.
- typ: odstavec
  de: |-
    Auch alle die jenigen so tags oder nachts wachen/ sollen allwegen vor des Wachtmeisters Hauß zusamen kommen/ welchs allwegen mitten in der Stat sein soll/ auch kein wacht besetzen weder zun thürn/ polwercken noch maurn/ er hab dann alle namen auffgeschriben/
  cs: |-
    Také všichni, kdo drží stráž ve dne nebo v noci, se mají vždy scházet před domem vachmistra, který má vždy stát uprostřed města. Vachmistr také nemá rozestavit žádnou stráž ani na věže, ani na bolverky, ani na hradby, dokud si nezapíše všechna jména
poznamky:
- n: 1
  text: |-
    *weitzeichen* – tak v tisku, nejspíš tisková chyba za *wortzeichen* („heslo“), které se dávalo spolu s polním znamením (*Kreide*).
