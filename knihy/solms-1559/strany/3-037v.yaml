id: 3-037v
list: '37'
strana: verso
sken: 326
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Zum andern so mag mann auch solche bäumb auffrichtig stellen vnd alles nach gelegenheit wo mann vermeint/ das sie schaden oder etwas aufrichten mögen/ sölliche plöcher mag man klein oder groß/ wie es die notturfft erfordert/ machen vnd zurichten/ wie die gemacht sein sollen/ daß wirt alles Figursweiß zu einem bessern bericht in augenschein gerissen werden.
  cs: |-
    Za druhé lze takové klády postavit i nastojato a vše rozmístit podle příležitosti tam, kde se soudí, že mohou způsobit škodu nebo něco svést. Takové klády lze zhotovit a upravit malé i velké, jak to potřeba vyžaduje; jak mají být udělány, bude pro lepší poučení názorně vykresleno v nákresech.
- typ: nadpis
  uroven: 3
  de: |-
    Ein dampff feur.
  cs: |-
    Dýmavý oheň.
- typ: odstavec
  de: |-
    ITem zu einem Dampff feur soll mann nemen ein Tonnen/ vnd mit einem reinen/ dörren/ kleinen/ gestoßnen Kalch gefült/ vnd mitten in solcher tonnen soll ein kleines fäßlein in dem kalch stehn/ dasselbig soll mit einem Puluer außgefült werden/ vnd von solchem feßlein sol ein Ror durch den kalch zu der tonen hinauß gehn/ damit mann dasselbig anzinden mög/ so dasselbig angezindet wirt/ so zerschlecht es die tonnen mit sampt dem kalch/ vnd macht also ein staub vnd dampff/ zusampt dem springen vnd schlagen.
  cs: |-
    Dále: k dýmavému ohni se má vzít sud a naplnit čistým, suchým, najemno utlučeným vápnem. Uprostřed sudu má ve vápně stát malý soudek naplněný střelným prachem {Puluer} a od soudku má skrz vápno vést ven ze sudu trubička, aby se dal zapálit. Když se zapálí, roztrhne sud i s vápnem a kromě rozletu a třesku nadělá mnoho prachu a dýmu.
- typ: nadpis
  uroven: 3
  de: |-
    Ein anders.
  cs: |-
    Jiné.
- typ: odstavec
  de: |-
    ITem laß dir machen häfen einn Hafner/ also groß daß ein mann einen in einer handt erhöben/ vnd hinauß werffen mög/ in solchen hafen gehört auch ein leiner sack der langen zotten hat/ vnnd solcher sack soll mit Puluer außgefült sein/ aber die zotten sollen mit einem faulen Puluer/ oder gestossen feur zeug auff das Puluer/ auß gefült vnd gestossen sein/ vnd solcher Sack soll auch in den hafen in die mit gehangen werden/ vnd in den sack vnden eben mit eim kalch wie oben gemelt außgefült/ das also das Puluer inn der mit auff alle ort im Kalch sei/ gemelter Hafen soll geformiert sein wie ein faß/ vnnd ein deckel haben mit einem loch/ das die zotten von dem sack oben dardurch gehn/ vnd soll der deckel vnd hafen als dann mit einem schnürgebendt vberbunden werden/ vnd in einem pech gedäfft oder geschwembt sein/ wie des auch ein Figur wie das gemacht sein soll/ gerissen wirdt.
  cs: |-
    Dále: nech si od hrnčíře udělat hrnce tak velké, aby je člověk mohl jednou rukou zdvihnout a vyhodit ven. Do takového hrnce patří také plátěný pytlík s dlouhými třásněmi; pytlík má být naplněn střelným prachem, třásně však mají být nad prachem naplněny a nacpány pomalým prachem nebo utlučenou zápalnou hmotou. Pytlík se má zavěsit doprostřed hrnce a dole kolem pytlíku[^1] se má stejně jako výše nasypat vápno, aby byl prach uprostřed ze všech stran obklopen vápnem. Hrnec má mít tvar soudku a víko s otvorem, jímž nahoře procházejí třásně pytlíku; víko i hrnec se pak mají ovázat provazovým ovázáním {schnürgebendt} a namočit nebo vykoupat ve smůle {gedäfft}. I k tomu bude nakreslen obrázek, jak to má být uděláno.
- typ: nadpis
  uroven: 3
  de: |-
    Noch ein anders.
  cs: |-
    Ještě jiné.
- typ: odstavec
  de: |-
    ITem laß dir einen Hafner von gůter Erden ein Kugel so groß wie ein Kintskopff machen/ vnnd an Zeug die Erden so dick als vngefehrlich zwen zwerch finger sein mögen/ das darinn zwei pfundt Puluers gehn/ solche Kugel soll oben herauß einer halben span lang
  cs: |-
    Dále: nech si od hrnčíře z dobré hlíny udělat kouli {Kugel} velkou asi jako dětská hlava, se stěnou tlustou přibližně na dva prsty napříč, aby se do ní vešly dvě libry {pfundt} střelného prachu. Taková koule má nahoře vyčnívat v délce půl pídi a
poznamky:
- n: 1
  text: V tisku stojí *vnd in den sack vnden*, patrně zkráceně či chybně za *vnd vmb den sack vnden* („a dole kolem pytlíku“).
