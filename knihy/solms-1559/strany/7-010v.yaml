  de:
  - - Vier Notschlangen.
  - - Schiffbrücken.
  - - Acht Veldschlangen.
  - - Wagenburgwagen.
  - - Acht quartirschlangen.
  - - Gemeine Heerwagen.
  - - Zehen Falconetlin.
  - - Monition wagen.
  cs:
