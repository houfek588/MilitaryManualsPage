  - - Vozy vozové hradby {Wagenburgwagen}.
  - - Osm čtvrtečních kulverin {quartirschlangen}.
  - - Obyčejné válečné vozy {Heerwagen}.
  - - Deset falkonetů {Falconetlin}.
  - - Muniční vozy {Monition wagen}.
