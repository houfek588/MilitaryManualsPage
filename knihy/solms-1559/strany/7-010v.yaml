  popis: |-
    Posledních osm červeně tištěných karet římské strany ve dvou sloupcích: vlevo děla (těžké kulveriny, polní kulveriny, čtvrteční kulveriny, falkonety), vpravo vozy a zařízení vojska (lodní mosty, vozy vozové hradby, obyčejné válečné vozy, muniční vozy). Sestava je shodná s kartáginskými kartami na [[7-007r|listu 7]]. Přepis a překlad nápisů viz tabulka.
