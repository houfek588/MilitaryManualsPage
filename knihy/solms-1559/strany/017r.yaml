bloky:
- typ: odstavec
  pokracovani: true
  de: daß der Oberst die losung zwei oder drei mal muß endern.
  cs: |-
    že nejvyšší velitel {Oberst} musí heslo {losung} dvakrát nebo třikrát změnit.
- typ: odstavec
  de: |-
    Ein jeder Oberster soll grossen fleiß vnd ernst / das sich ein Kriegsuolck nit mit zuuil Troß vberlade / fürwenden / dann weil der Troß im anzug dahinden / vnd im abzug dauorn verwart ziehen muß / so ist der vberfluß des Trosses deßhalb auch von wegen prouiant vnd Füterung auff das höchst beschwerlich / vnd kömpt etwan ein Kriegsuolck durch zuuil Trosses in grosse angst vnd not.
  cs: |-
    Každý nejvyšší velitel má vynaložit velikou píli a přísnost, aby se válečný lid {Kriegsuolck} nepřetěžoval přílišným trénem {Troß}; neboť poněvadž trén musí táhnout při postupu vzadu a při ústupu chráněn vpředu, je nadbytek trénu nanejvýš obtížný i kvůli proviantu {prouiant} a píci, a nejedenkrát se válečný lid dostane kvůli příliš velkému trénu do velké úzkosti a nouze.
- typ: odstavec
  de: |-
    Ein jeder Oberster soll sich sampt seinen namhafften personen / gegen seinem widertheil als ein Feind declariern vnd ehrlich verwaren / ausserhalb des Türcken da ists nit notwendig.
  cs: |-
    Každý nejvyšší velitel se má spolu se svými předními osobami vůči svému protivníkovi prohlásit za nepřítele a čestně se ohradit [vypovědět nepřátelství],[^1] s výjimkou Turků {Türcken}, tam toho není zapotřebí.
- typ: odstavec
  de: |-
    Zu reden wie ein Oberster sich mit den Feinden schlahen soll / kan hierinn statlich nit geschehen / weil der platz / auch gelegenheit beider Kriegshauffen in augen nit vorhanden / noch gesehen werden kan / deßhalben wirs dem Obersten sampt seinen Kriegsuerstendigen / welche mit jrem Volck / auch eygenen leiben die Schlacht thůn müssen / beuelhen / Aber souil mag jetzt daruon geredt werden / das ein Oberster sein vortheil on grosse not vnd trefflich vrsach nit vbergebe / sein Geschütz als vil jm möglich / gegen den Feinden lassen arbeiten / vnd wol angehn / seinen geordneten hauffen zu roß vnd fůß / darneben den Hauptleuten / tapffer erfarne Kriegsleut / die sie zum treffen füren / helffen zu ordenen / das Kriegsuolck als vil es sein kan / für des gegentheils Geschütz biß ans treffen verware / doch daß die gewaltigen auch ander hauffen zu roß vnd fuß selbst einander dazů den Renfanen vnd lauffenden hauffen / welche das fürtreffen alweg haben / in der not zeitlich zuhilff kommen mögen.
  cs: |-
    Vypisovat, jak se má nejvyšší velitel s nepřáteli bít, nelze zde zevrubně, poněvadž bojiště ani rozložení obou válečných houfů není před očima a nelze je vidět; proto to svěřujeme nejvyššímu veliteli spolu s jeho války znalými muži, kteří se svým lidem a vlastními těly musejí bitvu svést. Tolik však lze o tom říci nyní, aby nejvyšší velitel neopouštěl svou výhodu bez velké nouze a závažného důvodu, aby nechal svá děla {Geschütz}, co jen může, působit proti nepřátelům a dobře je nasadil, a aby ke svým seřazeným houfům {hauffen} jízdy i pěchoty vedle hejtmanů {Hauptleuten} pomohl přidělit statečné a zkušené válečníky {Kriegsleut}, kteří je povedou do boje; rovněž aby válečný lid, pokud to jen jde, kryl před protivníkovou dělostřelbou až do srážky, avšak tak, aby si hlavní i ostatní houfy jízdy i pěchoty samy navzájem – a k tomu i předvojové korouhvi {Renfanen} a útočným předním houfům, které mají vždy první střet – mohly v nouzi včas přijít na pomoc.
- typ: odstavec
  de: |-
    Ein jeder Oberster / er komme mit vorwissen oder vngefehrlich an die Feind / daß er sich mit jnen schlagen wölle oder muß / soll nicht lang in seiner Feinde Geschütz halten / sonder treffen / odder auß dem Geschütz in sein vortheil rucken / es geschehe dann diser vrsach / erstlich daß er vermeinte er wölle die Feinde / ehe dann sie inn die flucht oder zum abzucht schiessen.
  cs: |-
    Každý nejvyšší velitel – ať narazí na nepřátele úmyslně nebo náhodou tak, že se s nimi chce nebo musí bít – nemá stát dlouho pod palbou nepřátelských děl, nýbrž má udeřit anebo se z dosahu děl přesunout do výhodného postavení, ledaže by tak činil z těchto příčin: za prvé, kdyby soudil, že nepřátele dříve rozstřílí na útěk či k ústupu.
- typ: odstavec
  de: |-
    Zum andern das er gar kein vortheil weit / darinn er ziehen möchte / vmb sich hett. Zum dritten wann die nacht vorhanden were. Zum vierdten / so jhm ein Volck zu hilff keme / das er auff dieselbigen mit dem angriff verzüge / oder durch andere gnůgsame bewegungen / deren sich etwan vil in feld zutragen / daran vorhin niemandt gedenckt / Sonst je lenger einer im Geschütz helt / je mehr schaden sein Volck empfacht. Darumb wil ich alle Kriegsherrn gewarnet haben / das sie keinen vnerfarnen oder vnuerstendigen Obersten / keinen Krieg im Feld zuregiern beuelhen.
  cs: |-
    Za druhé, kdyby kolem sebe široko daleko neměl žádné výhodné postavení, kam by se mohl stáhnout. Za třetí, kdyby se blížila noc. Za čtvrté, kdyby mu táhl na pomoc nějaký lid, takže by s útokem vyčkával na něj, anebo z jiných dostatečných pohnutek, jakých se v poli přihází mnoho, na něž nikdo předem nepomyslí. Jinak totiž platí, že čím déle kdo stojí pod palbou děl, tím větší škodu jeho lid utrpí. Proto chci varovat všechny válečné pány {Kriegsherrn}, aby nesvěřovali řízení války v poli žádnému nezkušenému nebo nerozumnému nejvyššímu veliteli.
poznamky:
- n: 1
  text: |-
    Tj. poslat řádné opovědní (vypovědní) psaní na zachování cti (Fehdebrief), aby válka neplatila za loupežnický přepad; proti Turkům jako nekřesťanským nepřátelům se tento rytířský obyčej neužíval.
