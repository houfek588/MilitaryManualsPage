bloky:
- typ: odstavec
  de: |-
    Würde sichs aber zutragen / daß ein schwerer fall vorkem / soll das Regiment / vnder welchem sich solcher fall begeben würd / zum Feldobersten gehn / jm solchen fall vnd bescherung anzeigen / darin wie billich sein rath vnd hilff nemen / hat dann der Oberst gůt geschickte räth bei jm / ists souil desto besser / es seien Doctorn oder wer sie wöllen / die zu der sachen dienlich sein mögen / Doch inn allweg soll solcher Feldoberst kein schwere Krigßsachen allein mit seinn Doctorn beschliessen / sonder er soll seine Kriegßreth vnd Kriegßuerstendigen darbei nemen / vnd in der bei sein die sachen beratschlagen vnd schliessen / so gehet es mit aller rath zu. Ja man sagt das ist ein gar wolgelerter vnd verstendiger Doctor in dem weltlichen Rechten / das ist gůt / aber im krige vnd Kriegßhandlung ist dem gesatzten Recht nit nach zugeleben / Dann es würd zu langsam zugehn solt man den Proces des Rechten fürn so würd kein sach der Justitien noch Krigs erforderung den Krieg zum end bringen / sonder ein Cammergericht darauß werden / So wolt ich gern sehn / wann gleich den Doctorn solchs zuhandeln zugelassen würd / vnd die gefangen vnd mißthetter nach dem Artickels brieff gestrafft werden solten / vnd im Krig nit allzeit stilligen / sonder man ziehen můß / wie solchs Doctor recht angestelt / damit die sachen mit den vbertrettern zum ende gebracht werden / wo man doch die gefangen die zeit alle verwart behalten / vnd welcher Oberster doch sein volck in straff vnd gehorsam regiern wolt / auch wie ein Krigßherr sein volck furtbringen / oder jm feld bei jnen bleiben kündt / Darumb ist dise handlung gar wol mit grundt abzunemen / damit solchs nit geschehen noch vorzunemen sein kan. Damit aber diser sach mag abzuhelffen sein / so neme ein Krigßherr Doctores gnůg / geb jnen jre Justitien nach jrem willen in die handt / laß sie ein Monat Reutter vnd Kencht regirn / vnd gůt Justitien halten / es soll jnen handlung gnůg vorkomen / so wunderbarlich vnd seltzam / als jnen in der Schůln inn keiner Lection nie gelesen worden ist / auch in jren Büchern nie gelesen haben / Solches můß aber zu einer zeit vnd gelegenheit geschehen daß der Krieg der gestalt geschaffen wer / daß ein Herr in solcher prob vnd erfarung nichts versaumen noch vbersehen möcht.
  cs: |-
    Přihodilo-li by se však, že by se vyskytl nějaký závažný případ, má pluk {Regiment}, u něhož by k takovému případu došlo, jít k nejvyššímu polnímu hejtmanovi {Feldobersten}, vyložit mu ten případ a stížnost[^1] a vzít si v tom, jak se sluší, jeho radu a pomoc; má-li pak nejvyšší velitel {Oberst} při sobě dobré a obratné rady, je to o to lepší – ať jsou to doktoři práv, nebo kdokoli jiný, kdo může být v té věci k užitku. Avšak v žádném případě nemá takový nejvyšší polní hejtman rozhodovat závažné válečné věci sám se svými doktory, nýbrž má k tomu přibrat své válečné rady {Kriegßreth} a znalce války a v jejich přítomnosti záležitosti projednat a uzavřít, aby se tak dělo s radou všech. Říká se sice: „To je velmi učený a rozumný doktor světských práv!“ – to je dobré, ale ve válce a při válečném jednání nelze žít podle psaného práva; neboť by to šlo příliš pomalu: kdyby se měl vést řádný právní proces, pak by žádná záležitost spravedlnosti {Justitien} ani potřeb války nedovedla válku ke konci, nýbrž stal by se z toho komorní soud.[^2] To bych rád viděl, kdyby se doktorům skutečně dovolilo takto jednat a kdyby se vězni a zločinci měli trestat podle artikulního listu {Artickels brieff}, přičemž ve válce nelze stále stát na místě, nýbrž se musí táhnout: jak by pak takové doktorské právo zařídili, aby se pře s přestupníky dovedly ke konci, kde by vůbec po celou tu dobu drželi pod stráží zajatce a vězně, jaký plukovník by dokázal ovládat svůj lid v trestu a poslušnosti a jak by vůbec válečný pán {Krigßherr} mohl vést svůj lid kupředu nebo s ním zůstat v poli! Proto je tuto věc třeba z gruntu prohlédnout, aby se nic takového nedělo ani nepodnikalo. Kdyby se však tomu přece mělo nějak odpomoci, nechť si válečný pán vezme doktorů dost, dá jim jejich justici podle jejich vůle do rukou a nechá je měsíc řídit jezdce {Reutter} a knechty {Kencht}[^3] a držet dobrou justici – naskytne se jim dost případů tak podivných a zvláštních, o jakých na žádné přednášce ve škole nikdy neslyšeli a ani ve svých knihách nikdy nečetli! Něco takového by se však muselo dít v takový čas a za takových okolností, kdy by válka byla v takovém stavu, aby pán při takové zkoušce a pokusu nic nezanedbal ani nepropásl.
- typ: odstavec
  de: |-
    Drumb soll ein vnderscheid in den handlungen gehalten werden / daß man zu einer jeden sachen Leut neme / die zu solchem handel dienen / gelernet vnnd gebraucht haben / darbei will ich es auff dißmal bleiben lassen.
  cs: |-
    Proto se má při jednáních činit rozdíl a ke každé věci brát lidi, kteří se k takovému dílu hodí, vyučili se mu a osvědčili se v něm – při tom to pro tentokrát ponechám.
- typ: odstavec
  de: |-
    Aber ein Krigßherr soll sich mit Leuten gefast machen / als mit gebrauchten Krigßuerständigen / deßgleichen ehrlich gelerten die verstendig seien / vnd also die bei einander haben / dann sie dienen
  cs: |-
    Válečný pán se však má opatřit lidmi, totiž zkušenými znalci války a stejně tak čestnými učenci, kteří jsou rozumní, a mít je takto pohromadě, neboť jsou k užitku
poznamky:
- n: 1
  text: |-
    Tisk má podobu *bescherung* (překlep za *beschwerung* – obtíž, stížnost).
- n: 2
  text: |-
    Narážka na Říšský komorní soud (*Reichskammergericht*), nejvyšší říšský soudní dvůr proslulý neobyčejně zdlouhavým písemným řízením.
- n: 3
  text: Tisk má přesmyčku *Kencht* místo *Knecht*.
