bloky:
- typ: nadpis
  uroven: 2
  de: Von der Reutter quartiermeister
  cs: O kvartýrmistrovi {quartiermeister} jízdy {Reutter}
- typ: odstavec
  de: |-
    WAnn ein Kriegsuolck in der Wagenburg ligt / bedarff mann keins Quartirmeisters / dann wo eins jeden wagenburg nach der reihe stehet / daselbst ist sein losament / allein der oberst Feldhauptman lest jm ein Platz etwan in der wagenburg ein geben / da er mit sein wägen leit / dann der Oberst soll mit seinem wagen / nicht am ort wie andere ligen / diß hat auch vil vrsachen / von kürtz wegen vngemelt.
  cs: |-
    Leží-li válečný lid {Kriegsuolck} ve vozové hradbě {Wagenburg}, není kvartýrmistra třeba: kde má kdo v řadě vozové hradby své vozy, tam je jeho ubytování {losament}. Pouze nejvyšší polní hejtman {oberst Feldhauptman} si dá ve vozové hradbě vykázat nějaké místo, kde leží se svými vozy, neboť plukovník {Oberst} nemá se svým vozem ležet na okraji jako ostatní. I to má mnoho důvodů, které pro stručnost pomíjím.
- typ: odstavec
  de: |-
    Ist kein wagenburg im feld / so bald dann der Feldmarschalck das Leger mit der Landsknecht Quartiermeister getheilet hat / wie in des Feldmarschalcks 12. Artickel gehört / sollen sie volgender gestalt zu quartiren anfahen.
  cs: |-
    Není-li v poli vozová hradba, mají kvartýrmistři, jakmile polní maršálek {Feldmarschalck} rozdělí ležení {Leger} s kvartýrmistrem lancknechtů {Landsknecht} (jak se uvádí ve 12. článku {Artickel} o polním maršálkovi), začít s ubytováním {quartiren} takto:
- typ: odstavec
  de: |-
    Erstlichen den Obersten Feldhauptman / auff einen bequemlichen platz in das Leger / daß das Kriegsuolck zurings vmb jn lige / Darnach sein Leutenant / volgends den Feldmarschack / an etlichen orten wirdt der Feldmarschalck vor dem Leutenant quartiert / Ist aber wenig hieran gelegen / dann wo jrrung deßhalb zwischen disen beiden hohen amptern erwachsen würd / bleibs billich bei des obersten Feldhauptmans bescheid / dann auff Burgundisch vnd Teutsch gehört der Feldmarschalck vor / aber vff Italianisch der leutenant.
  cs: |-
    Nejprve nejvyššího polního hejtmana, a to na příhodné místo v ležení, aby válečný lid ležel kolem něho dokola; potom jeho poručíka {Leutenant} a dále polního maršálka[^1]. Na některých místech se polní maršálek ubytovává před poručíkem. Na tom však málo záleží: vznikl-li by o to mezi těmito dvěma vysokými úřady spor, má po právu platit rozhodnutí nejvyššího polního hejtmana. Podle burgundského a německého zvyku má totiž přednost polní maršálek, podle italského poručík.
- typ: odstavec
  de: |-
    Der Feldmarschalck soll den Quartiermeistern in jren Zeteln / nit allein wieuil Reuter jeder Hauptman hat / sonder auch darinnen anzeigen / wie sie einen nach dem andern sollen quartiern / dieselbig ordnung sollen sie alßdan halten. Die Quartiermeister sollen gleichformig quartiern der gestalt / daß sie nit allweg etlichen gůt vnd den andern böse quartier eingeben / oder eim Hauptman mit wenig Reutern einn grossen platz zutheiln / Dise vnpartheisch ordnung / sollen die Quartiermeister nit allein im feld / sonder auch in Flecken halten / wann sichs zutregt / daß man im Flecken ligen můß. Die Quartiermeister sein auch schuldig den wachtmeistern / wann sie nit vndern Hauptleuten ligen / zu quartiern / dergleichen den Obersten Prouiantmeister vnd andern / welche jnen der Feldmarschalck jederzeit anzeigt. Den Renfanen sollen sie alweg in eim vnbeschloßnen Leger vndern Reutern / es sei im zug oder abzug / den nechsten gegen feinden quartiern.
  cs: |-
    Polní maršálek má kvartýrmistrům v jejich lístcích uvést nejen to, kolik jezdců má který hejtman {Hauptman}, ale také, v jakém pořadí je mají jednoho po druhém ubytovat; tohoto pořadí se pak mají držet. Kvartýrmistři mají ubytovávat rovnoměrně, aby nedávali stále jedněm dobré a druhým špatné kvartýry {quartier} ani hejtmanovi s malým počtem jezdců nepřidělovali velké místo. Tento nestranný pořádek mají kvartýrmistři zachovávat nejen v poli, ale i v městečkách, stane-li se, že se musí ležet v městečku. Kvartýrmistři jsou také povinni ubytovat vachmistry {wachtmeistern}, neleží-li u hejtmanů, a stejně tak nejvyššího proviantmistra {Prouiantmeister} a další, které jim polní maršálek kdykoli určí. Předvojovou korouhev {Renfanen} mají v neopevněném ležení vždy ubytovat mezi jezdci nejblíže k nepříteli, ať se táhne vpřed, nebo se ustupuje.
- typ: odstavec
  de: |-
    Wann aber das Reych ein zug thůt / so quartiert mann alweg die Chůr vnd andere Fürsten / auch die stend nach einander wie sie jren
  cs: |-
    Koná-li však tažení {zug} říše, ubytovávají se vždy kurfiřti a ostatní knížata i stavy v pořadí podle toho, jaké mají
poznamky:
- n: 1
  text: V tisku „Feldmarschack“ (tiskařská chyba místo *Feldmarschalck*).
