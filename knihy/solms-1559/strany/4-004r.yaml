id: 4-004r
list: 4 (4. kniha)
strana: recto
sken: 395
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    ZVm neunzehenden zeiget dise hieuorn figur an ein grossen haupt Mortier mit einem ligenden stul/ vnd ist der mortier darumb offen gemacht/ daß mann jnen inwendig sehen kan wie mann jhnen laden solle/ besonder mit Feuerwerck/ vnd wie er sich durch ein Rör anzündet in dem schiessen/ vnd nit das mann die kugel zuuor vnd ehe anzünde dann den Mortier/ sonder wann mann den mortier anzündt/ so zündet sich die kugel auch darmit an vnd ist ein anzünden/ bedarff kein Ploderwerck vor der Büchsen machen ehe mann sie zurecht anzündet/ dann soll mann die kugel ehe dann die büchs anzünden so sicht mann es daussen vnd warnet/ deßgleichen solt es dann einem fehlen wann er die kugel angezündet hett daß sie brennet/ vnnd er wolt den mortier auch anzünden/ vnd versagte jm das er nit angieng/ so würde die kugel für sich auß brennen/ vnd dann den mortier auch allererst wann sie außgebrent were/ anzünden/ was wolt aber darauß werden oder was wolt mann darmit auß richten.
  cs: |-
    Za devatenácté: tato předešlá figura[^1] ukazuje veliký hlavní moždíř {Mortier} s ležatou stolicí {stul}; a moždíř jest proto zobrazen v průřezu otevřený, aby jej bylo vidět zevnitř, jak se má nabíjet, zvláště ohňostrojným střelivem {Feuerwerck}, a jak se při výstřelu sám zapaluje skrze trubičku: totiž nemá se koule {kugel} zapalovat dříve a před moždířem, nýbrž když se zapálí moždíř, zapálí se tím zároveň i koule, takže jde o jediné zapálení. Není třeba dělat před hlavní žádný planý blikot (*Ploderwerck*), než se řádně zapálí; neboť kdyby se koule zapálila dříve než dělo, bylo by to zvenčí vidět a varovalo by to nepřítele; a stejně tak kdyby pak někomu selhal zápal, když už kouli zapálil, takže ta hoří, a on chtěl zapálit také moždíř, avšak selhal by a nechytl by, tehdy by koule vyhořela sama od sebe a teprve až by dohořela, odpálila by i moždíř – co by z toho však vzešlo a čeho by se tím docílilo?
poznamky:
- n: 1
  text: |-
    Popis v tisku zjevně odkazuje k vyobrazení moždíře v podélném řezu, jež je v tomto exempláři svázáno až níže na listu `4-008v` (sken `404`, označení `B MORSER IM GRVNT`), zatímco dřevořez na předchozí straně `4-003v` zobrazuje moždíř v celku se závorou a lany.
