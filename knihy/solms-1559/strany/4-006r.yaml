  popis: |-
    Pravá polovina dvoustránkového dřevořezu z protější strany `4-005v`, v horní části nadepsaná dřevořezovou majuskulí „DER WERF ZEVG“ („Vrhací stroj“). Zachycuje v hornaté krajině dlouhé vrhací ráhno s kovanou hlavicí, řetězem a nataženým ramenem západky; na konci ráhna visí na provazovém praku svázaná mršina uhynulého koně či soumara jako střela určená k vrhání přes hradby obleženého města.
