bloky:
- typ: odstavec
  de: |-
    Das ich aber dises also anzeig vnd thů / das geschicht auß beweglichen vrsachen / dem Kriegßherrn zu gůtem / vnd wie ich es verstehe vnd solches nicht geendert / daß nichts gůts darauß entstehen wirt / dann grosser vnwill vnder dem Kriegßuolck / meutterei vnd nachteil des Herren / welches gnůgsam vrsachen darzů sein mögen / wie hieuor in diser Beschreibung auch vil vnd wol daruon außgefürt vnd vermelt wirt.
  cs: |-
    Že to však takto ukazuji a činím, děje se z pádných důvodů a k dobru válečného pána {Kriegßherrn}. Jak tomu totiž rozumím, nezmění-li se to, nevzejde z toho nic dobrého, nýbrž jen veliká nevole mezi válečným lidem {Kriegßuolck}, vzpoura {meutterei} a škoda pánova; a příčin k tomu je dost, jak se o tom už dříve v tomto popisu hojně a důkladně pojednává.
- typ: odstavec
  de: |-
    Aber disen dingen vnd wegen ist wol zu begegnen / mit gůtem billichem fug vnnd glimpff / daß das Kriegßuolck zufrieden sein wirdt vnd můß / wann sie anders wie Kriegßleut billich handeln wöllen / wie sie dann gern thůn werden / wann mann gütlich vnnd recht mit jnen handelt vnd begegnet.
  cs: |-
    Těmto věcem a cestám lze však dobře čelit slušným a spravedlivým postupem a s rozvahou, takže válečný lid bude spokojen a musí být spokojen – chce-li ovšem jednat slušně, jak se na válečníky {Kriegßleut} sluší. To také rád učiní, bude-li se s ním jednat vlídně a po právu.
- typ: nadpis
  uroven: 2
  de: Antwort auff der Kriegsleut begern.
  cs: Odpověď na žádost válečníků.
- typ: odstavec
  de: |-
    ITem wann die Kriegßleut solliche rede auff die Bestallung auff der Musterug thůn würden / Dann sollen die Commissarien jnen mit diser antwort begegnen / vnnd sagen / Lieben Herrn / Junckern vnd Kriegßleut / wir haben ewren vorbehalt angehort / daß jr euch zu willigen inn die Kriegßordnung vnnd Justitien vnsers Kriegßherrn / sonder der zuuor wissens zu haben beschwert / Nun solt jhr inn dem kein gefahr noch einiger vnbillichkeit besorgen / dann vnser Herr wirdt die sachen mit seinen Kriegßleuten / Obersten vnd verstendigen / der gestalt (wann jr alle zusamen kompt) fürnemen / berathschlagen vnd ordnen / daß jr daran kein mißfallens haben werdet / sonder selber der gebür nach nicht verbessern noch zu endern begeren / Dann es wirt in gemeinem kriegsrath bedacht vnnd geordnet werden nach altem Kriegs gebrauch / vnd notturfft alles Kriegßuolcks.
  cs: |-
    Dále, kdyby válečníci při přehlídce {Musterung}[^1] pronesli takovou řeč o služebním listu {Bestallung}, mají jim komisaři {Commissarien} vyjít vstříc touto odpovědí a říci: „Milí páni, zemani a válečníci, vyslechli jsme vaši výhradu, že se zdráháte svolit k válečnému řádu a spravedlnosti {Justitien} našeho válečného pána, dokud o nich nebudete mít předem vědomost. Nemusíte se však v tom obávat žádného nebezpečí ani jakékoli křivdy. Náš pán totiž věc se svými válečníky, plukovníky {Obersten} a znalými lidmi (až se všichni sejdete) projedná, poradí se o ní a uspořádá ji tak, že s ní nebudete nijak nespokojeni a sami v ní nebudete chtít nic vylepšovat ani měnit, jak se sluší. Bude to totiž uváženo a uspořádáno ve společné válečné radě podle starého válečného zvyku a potřeby všeho válečného lidu.“
- typ: odstavec
  de: |-
    Vnd wan dann die Commissarien das Krigßuolck in das Leger bringen / dann soll der Oberster wann er alles Kriegßuolck bei einander / vnnd zusamen bracht hat / die Obersten von allen Regimenten zu roß vnd fuß nemen / vnd bei sich nider setzen / sich der Regirung vnd Justitien vergleichen / alßdann hat der Herr sie gefaßt / wie hieuor gnůg daruon angezeigt vnd außgefürt ist.
  cs: |-
    Když pak komisaři přivedou válečný lid do ležení {Leger}, má plukovník, jakmile bude mít všechen válečný lid pohromadě, vzít plukovníky všech pluků {Regimenten} jízdy i pěchoty, posadit si je k sobě a dohodnout se s nimi na správě a spravedlnosti. Tím si je pán zaváže, jak již bylo dříve dostatečně vyloženo.
poznamky:
- n: 1
  text: V tisku *Musterug* za *Musterung*.
