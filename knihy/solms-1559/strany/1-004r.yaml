id: 1-004r
list: '4'
strana: recto
sken: 17
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vnd besetzen/ vnd nit mit den vnuerstendigen oder eigen nützigen leuten
  cs: a obsazovat, a nikoli lidmi nerozumnými či zištnými.
- typ: odstavec
  de: |-
    Dieweil dann solliche alte Löbliche gůte Römische Kriegs regirung vnd Ordnung/ wie oben vermelt/ also zu eim Abfal vnd böse eigennützige Regirung vnd Pollicei geraten vnd komen wil/ so hab ich nit (wiewol des als ein vnuerstendiger/ darmit die Regirung wider in ein gůte Regirung komen/ vnd gebracht werden) vnterlassen wöllen/ alles was ich derhalben von den alten Regirungen habe vnd bekomen/ gemach/ zusamen gebracht/ vnd zu meinem besten in ein beschreibung gestelt/ darmit die alte gůte Regirung von den Römern nicht nidergehen möchte/ sonder wider erhebt/ vnnd in die alte Regirung gebracht/ vnd komen möchte/ zu lobe vnd nutz der Teutschen Nation vnd Kriegsuolck.
  cs: |-
    Poněvadž tedy takový starý, chvályhodný a dobrý římský válečný řád a správa, jak bylo řečeno výše, takto upadají a zvrhají se ve zlou, zištnou správu a veřejný řád {Pollicei}, nechtěl jsem (byť jsem v tom neznalý, avšak aby se správa opět navrátila a byla uvedena k dobrému stavu) opomenout postupně shromáždit vše, co jsem o starých správách měl a získal, a podle svých nejlepších sil to sepsat, aby stará dobrá správa od Římanů nezanikla, nýbrž byla opět pozdvižena a navrácena do starého stavu ke chvále a užitku německého národa a válečného lidu {Kriegsuolck}.
- typ: odstavec
  de: |-
    So wil ich vor das erst/ die eingefallen mischbreuch vermelden/ vnd was die für jrthumb gebracht/ vnd je lenger je mehr thůn wurden/ so dem kein einsehen vnd enderung geschehen wirt/ mit einer treulichen warnung vnd bericht.
  cs: |-
    Nejprve tedy chci oznámit nešvary[^1], které se vloudily, jaké bludy přinesly a čím dál víc by působily, kdyby se jim nevěnovala pozornost a nedošlo k nápravě – a to s věrným varováním a výkladem.
- typ: odstavec
  de: |-
    Vnd als dann alle Kriegs Ampter die die Römer in jhren Kriegen gehabt vnd gebraucht haben/ darmit sie jhre Kriege also gewaltiglich vnd ordentlich gefürt haben/ mit allen jhren massen zu dem fleissigsten beschrieben/ das darinnen soll gefunden werden/ auß was vrsachen die Römer/ jhre Ampter also getheilt vnd gebraucht haben/ vnd also biß noch von Keisern zu Keisern/ seit der Römer zeit gehalten/ vnd im gebrauch gewest seind/ vnd was gůts darauß entstanden auch was nachtheil darauß geschehen mag/ wo das mann die in abfal wurde komen lassen.
  cs: |-
    A potom co nejpečlivěji popsat se všemi jejich pravidly všechny válečné úřady, které Římané ve svých válkách měli a užívali a s nimiž vedli své války tak mocně a řádně. Má se v tom ukázat, z jakých příčin Římané své úřady takto rozdělili a užívali, jak byly od dob Římanů od císaře k císaři až dosud zachovávány a užívány, co dobrého z toho vzešlo a jaká škoda by mohla nastat, kdyby se jim dovolilo upadnout.
- typ: nadpis
  uroven: 2
  de: |-
    Volgt hernach ein kurtzer bericht von der Teutschen langen/ grossen/ vnd ehrlichen Kriegen/ da die Teutschen vnd das Römisch Reich/ noch lob/ forcht vnd ehr hatten/ vnd so die von Gott die gnad haben möchten/ das sie bei einander einig bleiben würden/ Trew/ Glauben/ Justicien vnd jhre alte Römische ordnung halten vnd geleben wolten/ dann seind sie aller Nation Meister vnd gewaltig.
  cs: |-
    Následuje krátká zpráva o dlouhých, velikých a čestných válkách Němců, kdy Němci a Římská říše {Römisch Reich} měli ještě chválu, bázeň i čest; a kdyby se jim od Boha dostalo milosti, aby spolu zůstali svorni a chtěli zachovávat a podle nich žít věrnost, víru, spravedlnost {Justicien} a svůj starý římský řád, pak jsou pány a vládci všech národů.
poznamky:
- n: 1
  text: |-
    Dobový pravopisný tvar *mischbreuch* odpovídá *mißbreuch* („nešvary, zlořády“).
