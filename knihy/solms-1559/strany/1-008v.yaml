stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    zu zůstellen/ die weil mir solches von derselbigen blut/ die gnaden vnd ehr zukomen vnd geschehen ist.
  cs: |-
    odevzdat, poněvadž se mi od téže krve dostalo a událo tolik milostí a cti.
- typ: odstavec
  de: |-
    So wil Ewer Königliche Maiestat solchen bericht vnd Ordnung/ ich also schrifftlich vnd Figur weiß zusteln vnd presentiren/ mit gantzer vnderthenigster bit/ sie wöllen solches gnedigst von mir annemen/ meinen Sönen vnd mir ein gnedigster König vnd Herr sein vnd bleiben.
  cs: |-
    Takto tedy chci Vašemu královskému Veličenstvu takovou zprávu a řád předložit a předat písemně i v obrazech s veškerou nejpokornější prosbou, aby to ode mne nejmilostivěji přijalo a mým synům i mně zůstalo nejmilostivějším králem a pánem.
- typ: odstavec
  de: |-
    DIeweil die Römische Keiserliche Maiestat mir vnd anderen/ so die hohen Empter tragen vnnd haben sollen/ vnnd jhre Römische Keiserliche Maiestat/ vns darmit begnadigt vnnd ehret/ vnd das gnedigst vertrauen in vns stelt/ das wir demselbigen getreulichen nachkomen sollen/ vnd zu dem besten Regiren/ damit jhr Römische Keiserliche Maiestat vor das erst getrewlichst gedient werden mag/ vnd das Kriegßuolck in gůter Regirung Pollicei erhalten werde.
  cs: |-
    Jelikož Římské císařské Veličenstvo mně i jiným, kteří máme nést a zastávat vysoké úřady, a Jeho Římské císařské Veličenstvo nás tím obdařilo a poctilo a vkládá v nás nejmilostivější důvěru, že to máme věrně plnit a co nejlépe řídit, aby bylo Jeho Římskému císařskému Veličenstvu především co nejvěrněji slouženo a válečný lid {Kriegßuolck} byl udržován v dobré správě a veřejném řádu {Pollicei};
- typ: odstavec
  de: |-
    Vnd dieweil dann bisher in etlichen zügen/ vil klage eingefallen/ als das böse Regirung geschehen sein solte/ wie am tage sein mag/ vnd die Römische Keiserliche Maiestat begert/ das wir nach seiner Ordnung aufferganene mengel/ vnser bedencken jhrer Römische Keiserliche Maiestat darauff stellen sollen/ wie dem möchte so jhre Römische Keiserliche Maiestat wider gen Feld ziehen würde/ das der zug/ belegerung/ vnd wie sich das in der kurtze/ eil oder in die lenge vnd harr zutragen möcht/ das als dann das Leger vnd Kriegßuolck/ mit gůter Regirung/ vnderhaltung/ vnnd aller notturfft versehen werden/ darmit solchen klagen vnnd mißbreuchen hinfurter vorkomen werde/ als vor das erst.
  cs: |-
    a jelikož dosud při některých taženích {zügen} vzešlo mnoho stížností, jako by se děla špatná správa, jak může být zjevno, a Římské císařské Veličenstvo žádá, abychom podle jeho řádu podali Jeho Římskému císařskému Veličenstvu své dobrozdání o vzniklých[^1] nedostatcích, jak by bylo možno, vytáhne-li Jeho Římské císařské Veličenstvo opět do pole, aby pak při tažení, obléhání – ať už se to seběhne v krátkosti a spěchu, nebo na dlouho a vytrvale – byly ležení {Leger} a válečný lid opatřeny dobrou správou, vydržováním a veškerou potřebou, aby se takovým stížnostem a nešvarům napříště předešlo – to za prvé;
- typ: odstavec
  de: |-
    Zum andern das ein gůte Justitia geordnet vnd gehalten/ darmit Meuterei verhütet vnnd gůte fridliche einigkeit vnder dem Kriegs Volck erhalten werde.
  cs: |-
    za druhé, aby byla zřízena a zachovávána dobrá spravedlnost {Justitia}, aby se tak předešlo vzpouře {Meuterei} a udržovala se mezi válečným lidem dobrá, pokojná svornost.
- typ: odstavec
  de: |-
    Dieweil dann die Römische Keiserliche Maiestat an vns solches bedencken vnd darauff maß vnd Ordnung zustellen/ allergnedigst begert/ so erkenne ich mich schuldig/ als derselbigen gehorsam vnderthan das ich das zuthun/ souil ich das verstehe/ vnd zu wegen bringen mag/ gehorsamlich mich halten soll/ welches ich zu dem besten thun wil/ als vor mich allein/ souil ich der jrthumb gesehen/ vnnd verstanden habe/ die billich zu endern/ vnnd in ander Ordnung
  cs: |-
    Jelikož tedy Římské císařské Veličenstvo od nás nejmilostivěji žádá takové uvážení a sepsání pravidel a řádu k tomu, uznávám se jakožto jeho poslušný poddaný za povinna chovat se poslušně, abych tak učinil, pokud tomu rozumím a dokáži to uskutečnit; což chci učinit co nejlépe za sebe samého, pokud jsem viděl a pochopil omyly, jež se sluší napravit a uvést v jiný řád
poznamky:
- n: 1
  text: |-
    Tisk má podobu *aufferganene* (sazečská odchylka za *auffergangene*, tj. vzniklé, vzešlé).
