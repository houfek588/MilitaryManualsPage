sken: 663
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    ziehen dann jrs mit gewalt behalt/ doch daß jr jnen zusagt/ wann jr die Stat behaltet/ vnd die Feinde daruor abziehen/ wölt jr jnen jhr Hauß vnd Hoff widerumb zustellen lassen/ doch daß sie jetzund der zeit nichts mit jnen herauß nemen/ das euch in der Stat nützlich sein möcht. Nach dem must jr schawen was jr für ein Artolorei habt/ vnd was für Zeug darzu vorhanden sei/ nemlich Puluer/ Stein/ Blei oder ander rüstung/ als Armbroster/ Pfeil/ Spieß/ Hellenbarten vnd andere wehr darzů gehörig/ die mann haben muß wann mann sich auß einer Stat die mann stürmpt wehrt.
  cs: |-
    odejít, než je držet násilím. Slibte jim však, že udržíte-li město a nepřítel od něho odtáhne, dáte jim jejich dům a dvůr zase vrátit; jen ať si teď s sebou nevynášejí nic, co by vám mohlo být ve městě užitečné. Potom musíte prohlédnout, jaké máte dělostřelectvo {Artolorei} a jaký materiál {Zeug} je k němu po ruce, totiž střelný prach {Puluer}, dělové kameny {Stein}, olovo nebo jinou výzbroj, jako jsou kuše[^1], šípy, píky {Spieß}, halapartny {Hellenbarten} a jiné zbraně, které k tomu patří a které je třeba mít, když se člověk brání ve městě, na které nepřítel útočí.
- typ: odstavec
  de: |-
    Ferner must jr haben Salpeter/ Schwefel vnd Kolen darauß jhr Fewer machen kündt/ auch andere notturfftige ding/ als Brücken/ Schiff vnd Plocheuser ewer Feinde damit zuuerbrennen/ Auch must jr gůt schmidt kolen/ Eysen/ Stahel vnd andere rüstung so zu einem Schmidt gehörig haben/ wann es in einem Schloß ist must jr gůt achtung haben/ daß jhr vil Kolen odder doch Holtz zu brennen habt/ die speiß damit zu kochen/ dann inn den Schlössern offt ein grosse not an Holtz ist/ aber in den Stätten kan mann es vil baß bekommen/ dann wann inn einer Stat holtz abgehn wolt künde mann die Heuser abbrechen/ vnnd das Holtz daruon verbrennen/ das villeicht in einem Schloß nit geschehen möcht.
  cs: |-
    Dále musíte mít ledek {Salpeter}, síru {Schwefel} a dřevěné uhlí {Kolen}, z nichž můžete dělat oheň, i jiné potřebné věci, abyste jimi mohli zapálit nepřátelské mosty, lodě a sruby {Plocheuser}. Také musíte mít dobré kovářské uhlí, železo, ocel a jiné vybavení, které ke kováři patří. Je-li to na zámku, musíte dobře dbát, abyste měli dost uhlí nebo aspoň dříví na topení, abyste na něm mohli vařit jídlo, neboť na zámcích bývá o dříví často velká nouze. Ve městech se dá sehnat mnohem snáze: kdyby ve městě docházelo dříví, mohly by se zbořit domy a jejich dřevo spálit, což by se na zámku snad stát nemohlo.
- typ: odstavec
  de: |-
    Weitter wann jr wist was jhr für ein Artolorei/ Prouiant vnnd Kriegßuolck habt/ solt jr einem jeglichen sein Quartir verordnen wo er sich wehren soll/ es sei auff Polwercken/ bei den Thoren/ auff den Mauren oder sonst/ Nachuolgents das Geschütz/ nach dem jhr vermeint da es von nöten sei/ mit grossem fleiß außtheilen/ vnnd wann es gesein mag/ solt jr das alles verordnen ehe dann die stat belegert wirt/ Dann wann die stat belegert ist/ vnd yr nachuolgents erst versehen wolt/ würd yr hart erschrecken wann euch etwas an dem Geschütz/ nemlich die Reder oder Karren darauff mann es füren soll/ oder sonst etwas gebrochen were/ vnd yr es gern brauchen wolt/ Darumb es von nöten/ daß yr vor solches alles besichtiget/ damit yr nachuolgents gerüst seiend.
  cs: |-
    Když dále víte, jaké máte dělostřelectvo, proviant {Prouiant} a válečný lid {Kriegßuolck}, máte každému určit jeho kvartýr {Quartir}, kde se má bránit, ať na bolverkách {Polwercken}, u bran, na hradbách, nebo jinde. Potom máte s velkou péčí rozdělit děla {Geschütz} podle toho, kde to pokládáte za nutné. Je-li to jen možné, máte to všechno nařídit dřív, než bude město obleženo. Kdybyste to totiž chtěli obstarávat teprve tehdy, až bude město obleženo, velmi byste se lekli, kdyby se vám na dělech něco polámalo – totiž kola nebo lafety[^2], na nichž se mají vozit, nebo něco jiného – a vy byste je chtěli použít. Proto je nutné, abyste to všechno předem prohlédli, abyste pak byli připraveni.
- typ: odstavec
  de: |-
    Wann yr ewer Volck außgetheilt habt nach ewerm gefallen/ wirt ein jeglicher in seinem Quartir fleiß ankeren daß yr es wol befestigt/ vnd was darzů von nöten ist/ wann solliches geschicht must yr gůt trew leut haben die es nachuolgents widder besichtigen/ vnnd sich auch etwas darauff verstehn/ dann wann einer inn der eil etwas fest machen soll/ macht er es erst daß gar kein nütz ist/ darzů werden die vorgemelten Leut die sich darauff verstehn/ gůt sein/ vnnd alles nach jrem willen heissen machen.
  cs: |-
    Když jste svůj lid rozdělili podle svého uvážení, vynaloží každý ve svém kvartýru péči, aby jej dobře opevnil[^3] a udělal, co je k tomu třeba. Až se tak stane, musíte mít dobré a věrné lidi, kteří to potom znovu prohlédnou a také se tomu trochu rozumějí. Když má totiž někdo něco ve spěchu opevnit, udělá to nakonec tak, že to není k ničemu. K tomu se hodí právě zmínění lidé, kteří se tomu rozumějí; ti ať dají všechno udělat podle svého.
poznamky:
- n: 1
  text: |-
    *Armbroster* – kuše (Armbrust); v době, kdy Filip Klévský řád sepisoval (počátek 16. století), se kuše při obraně měst ještě běžně užívaly vedle palných zbraní.
- n: 2
  text: |-
    *Karren* – zde dělové vozíky, tj. kolové lafety, na nichž se děla převážejí.
- n: 3
  text: |-
    V tisku *daß yr es wol befestigt* („abyste je dobře opevnili“); podle smyslu jde o tiskovou chybu za *er* – opevnit má každý svůj vlastní úsek.
