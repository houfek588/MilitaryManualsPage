bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    scheidt/ nemlich auff zweierlei art/ Erstlich sind Blochäuser die man für ein besatzung schlegt/ vnd sie darmit beschleust/ daß niemand auß oder ein kan/ vnd ligen in den Blochäusern haussen stercker dann sie darinn sind/ daß also die in den Blochäusern sich keins gewalts die leng auß der besatzung sie zunötigen besorgen dörffen/ vnd dieselben Blochäuser sind nit mehr dann ein wacht vnd hut/ daß sie nit künden vberfallen werden/ vnnd sich so lang auffhalten biß die andern Blochäuser auch kommen/ solche sind nit für ein grossen gewalt die leng zuhalten gemacht/ sonder wie gemelt.
  cs: |-
    totiž na dvojí způsob. Předně jsou sruby {Blochhaus}, které se budují před obleženou posádkou {Besatzung} a uzavírají se jimi, aby nikdo nemohl ven ani dovnitř; v těch srubech venku pak leží silnější oddíl než v pevnosti, takže ti ve srubech se nemusejí obávat žádné převahy z posádky, jež by je mohla dlouhodobě ohrozit. Takové sruby nejsou nic jiného než hlídka a stráž, aby nemohli být přepadeni a udrželi se tak dlouho, dokud nepřijdou posily z ostatních srubů; nejsou tedy stavěny k dlouhému odolávání veliké moci, nýbrž jak řečeno.
- typ: odstavec
  de: |-
    Aber die andern Blochäuser daruon ich meldung thůn/ ist ein ander gewaltigs werck/ das sich mit gewalt beschliessen lest/ auch die leng vnd zeit leiden mag/ gleich wie ein fest Stat/ dann allein daß sie kein häuser wie die stät haben/ das dann gůt ist daß sie nicht mit Häusern durch bawet sind/ so haben die Kriegßleut oder die so darin ligen/ desto besser platz vnd standt/ deßgleichen daß mann sich auch nicht für Feur werffen/ schiessen oder brant besorgen darff/ Aber wie ich vermein/ daß solche gemacht sein solten/ nach meinem bedüncken/ so hab ich die in Figurn gestalt/ daß mann sich darinn zubesehen hab/ vñ ob die schon in der Viserung klein seind/ so mag mañ sie doch so groß/ breit vnd lang machen wie mann will/ Vnd ob einer sagen wolt/ Ja sie sind stracks in die vierung gemacht/ soll mañ dañ die vierung so weit begreiffen/ als wol die notturfft erfordert/ dann es möcht sich zutragen/ daß mann ein groß volck darin legt/ so kommen die vier ort streich weit von einander/ daß sie inwendig nit alle zu der wehr kommen künden/ dieweil die löch so weit von ein ander/ vnd auch so wenig weren. Darauff ist zu antworten/ Daß die Blochäuser nit eben in die vierung/ sonder vberleng nach gelegenheit des platz vnd Volcks müssen gemacht sein/ Darumb mag man die Blochäuser so weit auffthůn vnd vornemen als mann wil/ dann so dasselbig groß in die weit oder leng gemacht wirt/ so mag mann noch mehr außgefürt wehren zwischen die machen/ als vil die notturfft an leuten vnd platz erfordert. Daß man aber von ein solcher grosser macht sagt/ ist sich nit sehr zuförchten/ dann sie kündens nicht der vnderhaltung halben mit bringen. Zum andern/ so mögen sie die Fütterung im veldt im ziehen nit haben/ dañ es ein groß Fütterung erfordert/ da wirt nit veldt noch landts gnůg darzů sein. Zum dritten so dann die befestungen vnnd Blochäuser auch gelegt vnd gebawet werden/ vnd das landt vergraben ist. Zum vierdten/ so ist nit zu glauben/ ob sie schon die weite haben/ daß sie mit solchen grossen summen heraußziehen künden/ vnd alles auß dem landt füren/ zu dem das nit möglich ist zuerhalten.
  cs: |-
    Avšak druhé sruby {Blochhaus}, o nichž se zmiňuji, jsou jiným mohutným dílem, jež se nechá obklíčit mocí a snese i dlouhé obléhání a čas stejně jako pevná {Stat}, jen s tím rozdílem, že nemají domy jako města – což je dobře, že nejsou zastavěny domy, neboť vojáci či posádka mají tím lepší prostranství a postavení a rovněž se nemusejí obávat házení ohňů, střelby či požáru. Jak se však domnívám, že by takové sruby měly být podle mého mínění zřízeny, postavil jsem je do vyobrazení, aby se v nich dalo porozhlédnout; a i když jsou v nákresu malé, může si je každý udělat tak veliké, široké a dlouhé, jak chce. Kdyby někdo namítal: „Nuže, jsou udělány zrovna do čtverce – má se tedy čtverec pojmout tak rozlehle, jak vyžaduje potřeba? Vždyť by se mohlo stát, že se do něj položí veliký lid, a čtyři nárožní boční obrany {Streichwehr} budou daleko od sebe, takže se uvnitř nebudou moci všechny dostat k obraně, protože mezery budou tak daleko od sebe a bude jich tak málo.“ Na to jest odpovědět, že sruby nemusí být nutně do čtverce, nýbrž podlouhlé podle polohy místa a počtu lidu. Proto lze sruby rozevřít a navrhnout tak široce, jak kdo chce; udělá-li se totiž dílo veliké na šířku či na délku, dají se mezi nárožní obrany vystavět ještě další vysunuté obrany, kolik jen vyžaduje počet lidu a prostor. Co se však říká o tak veliké nepřátelské moci, netřeba se jí příliš bát, neboť ji nemohou přivést pro nedostatek zásobování. Za druhé nemohou mít v poli při tažení dost píce, poněvadž to vyžaduje ohromné množství píce a nebude k tomu dostatek polí ani krajiny. Za třetí se přece také založí a vystaví opevnění a sruby a země se prokopá příkopy. Za čtvrté není k víře – i kdyby na to měli dostatečnou šířku –, že by mohli vytáhnout v tak ohromných počtech a vše vyvézt ze své země, neboť to není možné uživit.[^1]
poznamky:
- n: 1
  text: |-
    Na rubu prvního řádku tištěno v originále „scheidt/“ jako přechod rozděleného „onderscheidt/“ ze spodního řádku strany `5-016v`; dole tištěno „die löch“ místo *die löcher*.
