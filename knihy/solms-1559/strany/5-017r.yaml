bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vnderscheidt/ nemlich auff zweierlei art/ Erstlich sind Blochäuser die man für ein besatzung schlegt/ vnd sie darmit beschleust/ daß niemand auß oder ein kan/ vnd ligen in den Blochäusern haussen stercker dann sie darinn sind/ daß also die in den Blochäusern sich keins gewalts die leng auß der besatzung sie zunötigen besorgen dörffen/ vnd dieselben Blochäuser sind nit mehr dann ein wacht vnd hut/ daß sie nit künden vberfallen werden/ vnnd sich so lang auffhalten biß die andern Blochäuser auch kommen/ solche sind nit für ein grossen gewalt die leng zuhalten gemacht/ sonder wie gemelt.
  cs: |-
    rozdíl, totiž dvojího druhu. Předně jsou sruby {Blochäuser}, které se stavějí před obleženou posádkou {besatzung} a jimiž se ona uzavře, aby nikdo nemohl ven ani dovnitř; venku ve srubech přitom leží silnější houf, než jaký je uvnitř, takže ti ve srubech se nemusejí obávat, že by je posádka dlouhodobě tísnila nějakou převahou. Tyto sruby nejsou nic víc než hlídka a stráž, aby nemohli být přepadeni a udrželi se tak dlouho, dokud nepřijdou i ostatní sruby. Takové sruby nejsou stavěny k tomu, aby dlouho odolávaly veliké moci, nýbrž jen k tomu, co bylo řečeno.
- typ: odstavec
  de: |-
    Aber die andern Blochäuser daruon ich meldung thůn/ ist ein ander gewaltigs werck/ das sich mit gewalt beschliessen lest/ auch die leng vnd zeit leiden mag/ gleich wie ein fest Stat/ dann allein daß sie kein häuser wie die stät haben/ das dann gůt ist daß sie nicht mit Häusern durch bawet sind/ so haben die Kriegßleut oder die so darin ligen/ desto besser platz vnd standt/ deßgleichen daß mann sich auch nicht für Feur werffen/ schiessen oder brant besorgen darff/ Aber wie ich vermein/ daß solche gemacht sein solten/ nach meinem bedüncken/ so hab ich die in Figurn gestalt/ daß mann sich darinn zubesehen hab/ vnd ob die schon in der Viserung klein seind/ so mag mann sie doch so groß/ breit vnd lang machen wie mann will/ Vnd ob einer sagen wolt/ Ja sie sind stracks in die vierung gemacht/ soll mann dann die vierung so weit begreiffen/ als wol die notturfft erfordert/ dann es möcht sich zutragen/ daß mann ein groß volck darin legt/ so kommen die vier ort streich weit von einander/ daß sie inwendig nit alle zu der wehr kommen künden/ dieweil die löch so weit von ein ander/ vnd auch so wenig weren. Darauff ist zu antworten/ Daß die Blochäuser nit eben in die vierung/ sonder vberleng nach gelegenheit des platz vnd Volcks müssen gemacht sein/ Darumb mag man die Blochäuser so weit auffthůn vnd vornemen als mann wil/ dann so dasselbig groß in die weit oder leng gemacht wirt/ so mag mann noch mehr außgefürt wehren zwischen die machen/ als vil die notturfft an leuten vnd platz erfordert. Daß man aber von ein solcher grosser macht sagt/ ist sich nit sehr zuförchten/ dann sie kündens nicht der vnderhaltung halben mit bringen. Zum andern/ so mögen sie die Fütterung im veldt im ziehen nit haben/ dann es ein groß Fütterung erfordert/ da wirt nit veldt noch landts gnůg darzů sein. Zum dritten so dann die befestungen vnnd Blochäuser auch gelegt vnd gebawet werden/ vnd das landt vergraben ist. Zum vierdten/ so ist nit zu glauben/ ob sie schon die weite haben/ daß sie mit solchen grossen summen heraußziehen künden/ vnd alles auß dem landt füren/ zu dem das nit möglich ist zuerhalten.
  cs: |-
    Avšak ty druhé sruby, o nichž se zmiňuji, jsou jiné, mohutné dílo, které snese i obklíčení velkou mocí a vydrží delší dobu jako pevné město {Stat} – až na to, že v nich nejsou domy jako ve městech. To je dobře, že nejsou zastavěny domy: válečníci {Kriegßleut} čili ti, kdo v nich leží, mají tím víc místa a prostoru a také se nemusejí obávat házení ohně, střelby ani požáru. Jak by však podle mého mínění měly být takové sruby postaveny, to jsem vyobrazil v nákresech {Figurn}, aby se dalo na ně podívat; a i když jsou v nákresu {Viserung} malé, lze je přece udělat tak velké, široké a dlouhé, jak kdo chce. A kdyby někdo chtěl říci: „Ano, jsou ale udělány přesně do čtverce {vierung}; má se tedy čtverec pojmout tak rozlehle, jak by potřeba vyžadovala? Mohlo by se totiž stát, že by se do něj položil veliký lid, a pak by se čtyři nárožní boční obrany {streich} dostaly daleko od sebe, takže by se uvnitř nemohly všechny zapojit do obrany, protože střílny {löch} by byly tak daleko od sebe a bylo by jich tak málo.“ Na to je třeba odpovědět, že sruby se nemusejí stavět přesně do čtverce, nýbrž podlouhlé, podle povahy místa a počtu lidu. Proto lze sruby rozvrhnout a otevřít tak široce, jak kdo chce; když se srub udělá veliký do šířky nebo do délky, lze mezi [nárožními obranami] zřídit ještě další vysunuté obrany, kolik vyžaduje potřeba lidu a místa. Co se však říká o tak veliké moci [nepřítele], té se netřeba příliš bát, neboť ji nemohou přivést kvůli vydržování. Za druhé nemohou mít při tažení v poli dost píce, neboť je jí třeba velmi mnoho a nebude k tomu dost polí ani země. Za třetí, když se také postaví a zřídí opevnění a sruby a země se přetne příkopy. Za čtvrté nelze věřit, že by mohli vytáhnout v tak velikých počtech a všechno odvézt ze země, i kdyby na to měli dost prostoru – kromě toho to není možné uživit.[^1]
poznamky:
- n: 1
  text: |-
    Slovo *vnder-scheidt* je v tisku rozděleno přes hranici stran (`5-016v`/`5-017r`), proto stojí celé zde. V tisku „die löch“ (místo *löcher*), tj. střílny. Výraz *streich* = boční obrany (*Streichwehr*).
