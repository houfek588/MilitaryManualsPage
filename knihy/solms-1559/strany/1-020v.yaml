id: 1-020v
list: '20'
strana: verso
sken: 50
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Zum neuntzehenden so einer würde heimlicher weiß ein Meutterei dem Kriegßherrn zu nachtheil seinem Ritmeister oder Obrigkeit machen / derselbig soll gefenglich eingezogen / Gott vnnd dem Schwert beuolhen werden.
  cs: |-
    Za devatenácté: zosnoval-li by někdo tajně vzpouru {Meutterei} ke škodě válečného pána {Kriegßherrn} proti svému rytmistrovi {Ritmeister} nebo vrchnosti, má být vzat do vazby a poručen Bohu a meči.[^1]
- typ: odstavec
  de: |-
    Zum zwentzigsten welcher zu den Feinden vberfallen wirdt / on erhebliche vrsachen / derselbig soll zu einem Schelmen vnnd vnehrlichen Man durch das gantz Gericht erkennet / gemacht / außgerüffen vnd geblasen werden.
  cs: |-
    Za dvacáté: kdo přeběhne k nepřátelům bez závažné příčiny, ten má být celým soudem {Gericht} prohlášen a učiněn padouchem a nečestným mužem, veřejně vyvolán a vytrubován.
- typ: odstavec
  de: |-
    Zum einvndzwentzigsten so einer würde etwas heimlichs mit den Feinden reden / handeln oder schreiben / on vorwissen vnnd verwilligung der Obersten / derselbig soll für Recht gestellet werden / vnd darüber erkennen vnd gehen lassen / wie recht ist.
  cs: |-
    Za jednadvacáté: kdyby někdo tajně s nepřáteli rozmlouval, jednal nebo si dopisoval bez vědomí a svolení nejvyšších velitelů {Obersten}, má být postaven před soud {Recht} a má o něm být rozhodnuto a vykonáno, co jest po právu.
- typ: odstavec
  de: |-
    Zum zweivndzwentzigsten so einer im Feld von seinem Fendlein fliehen würde / derselbig soll wie ein Feldflüchtiger vnd vnehrlicher man erkennet werden.
  cs: |-
    Za dvaadvacáté: uprchl-li by někdo v poli od svého praporce {Fendlein}, má být prohlášen za polního zběha a nečestného muže.
- typ: odstavec
  de: |-
    Zum dreivndzwentzigsten wann ein Lermen würde / vnnd einer sich zu seinem Fendlin nicht verfüget / vnd daruon bleiben würde / on vorwissen oder erhebliche vrsachen / demselbigen soll sein monatliche Besoldung abgezogen werden.
  cs: |-
    Za třiadvacáté: nastal-li by poplach {Lermen} a někdo by se nedostavil ke svému praporci a zůstal by od něj vzdálen bez vědomí [velitele] nebo závažných příčin, má mu být sražen jeho měsíční žold {Besoldung}.
- typ: odstavec
  de: |-
    Zum viervndzwentzigsten / wann das Kriegßuolck gemustert vnd zusamen zeugt / dann soll jnen zum ersten hart auffgeleget vnd verbotten werden / wann einer zuuor etwas mit dem anderen zuthůn hett / daß er solches nicht inn dem zuge / biß daß sie vrlaub haben / gegen dem andern mit worten oder wercken eifern noch inn vngůtem gedencken wolt / sonder gegen vnd mit jhm / gegen den Feinden vnnd allen Kriegßhandlungen brüderlich vnnd geselliglich beistehen / vnnd wann einer darüber sich gegen dem anderen etwas thatlichs mit worten vnd Wercken vorneme vnnd handelt / solliches soll mit anderen vorgemelten Artickeln vnd puncken auch zurechtfertigen angestelt werden.
  cs: |-
    Za čtyřiadvacáté: když je válečný lid {Kriegßuolck} přehlédnut {gemustert} a táhne dohromady, má mu být nejprve přísně uloženo a zakázáno, aby – měl-li někdo dříve s druhým nějaký spor – nedával to během tažení, dokud nebudou propuštěni, proti druhému najevo slovy ani skutky ani na to ve zlém nevzpomínal, nýbrž aby s ním a při něm proti nepřátelům a při všech válečných podnicích bratrsky a družně stál. A kdyby si přesto někdo proti druhému počínal násilně slovy nebo skutky a jednal tak, má být i toto postaveno před soud podle jiných výše zmíněných článků a bodů[^2].
- typ: odstavec
  de: |-
    Auff die viervnd zwentzig Artickel seind die Teutschen mit jhrem Feldmarschalck mit ernst zuhalten vnnd zustraffen nachgangen / vnd darüber gehalten souil möglich gewesen / biß das sie der Römischen Keiserlichen Maiestat Landt verlassen haben / Derhalben ist bei disem abzunemen / wann andere Nationen dergleichen Justitien halten / vnd also ein gleicheit vornemen / das durchauß gůte regierung in den Legern sein würde.
  cs: |-
    Těmito dvaceti čtyřmi články se Němci se svým polním maršálkem {Feldmarschalck} přísně řídili při dodržování kázně i trestání a drželi nad nimi ruku, jak jen bylo možné, až dokud neopustili země Římského císařského Veličenstva. Proto lze z toho vyrozumět, že kdyby ostatní národy zachovávaly podobnou spravedlnost a zavedly takto stejné řády, panoval by v leženích {Legern} veskrze dobrý řád.
- typ: odstavec
  de: |-
    Aber das ein theil solche Justitien halten vnd straff leiden / vnnd das ander nit / wirt schwerlich zu erhalten sein / zu dem das es grossen haß / Lermen vnd auffruhr macht.
  cs: |-
    Avšak aby jedna část takovou spravedlnost dodržovala a podstupovala tresty, kdežto druhá nikoli, to se udrží jen stěží; nehledě k tomu, že to plodí velkou nenávist, poplachy a bouře {auffruhr}.
poznamky:
- n: 1
  text: Tj. odsouzen k trestu smrti stětím mečem.
- n: 2
  text: V tisku drobná sazečská odchylka *puncken* místo *punckten*.
