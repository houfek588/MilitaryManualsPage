bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    zutragen / so hett dasselbig Quartier solche Prouiant zu seinem besten zugebrauchen / doch nach gesetzter Ordnung in die liefferung wie andere Prouiant zunemen / zu bezalung vor andern / so mann also Ordnung helt oder halten will / so mag mann wol ein Kriegsuolck mit solcher vorbetrachtung zu der not erhalten.
  cs: |-
    přihodit nouze, měl by onen kvartýr {Quartier} právo použít takový proviant {Prouiant} k svému užitku, ovšem převzít jej podle stanoveného řádu do dodávky jako jiný proviant a zaplatit dříve než ostatní; drží-li se tedy nebo chce-li se držet takový řád, lze takovou prozíravostí v nouzi válečný lid {Kriegsuolck} dobře uživit.
- typ: odstavec
  de: |-
    Dise obgemelte Ordnung ist nicht allein auff ein Feldzug oder Leger im Feld geordnet / zugebrauchen / sonder allein so sichs zutragen würde / von wegen des Römischen Reichs / das sich ein Christlich Zug begeben / vnd das Kriegsuolck durch die Lande zu den musterplätzen vnd walstat / versamlung des gantzen hauffen zutragen würde / so ist von nöten das zuuor in sollichem Rathschlag vnnd beschließlicher Ordnung geordnet werde / vnnd mit einem jeden Fürsten / vnd alle die da schicken würden vnd můssen / sich mit jnen vergleichen vnd beuelhen / so ein jeder sein Kriegsuolck / so jhm auffgelegt ist / annemen vnd schicken würde / Daß derselbig so jm von dem Reych sein Monat angehen würde / sein Kriegsuolck inn ein Regiment mit der Besoldung des Monats / biß zu dem Obersten in ein Regiment vnd Ordnung annemen vnnd schweren ließ / dieweil sie jre Besoldung auff die Monat empfangen / daß sie auch alßdann wie die besolden in der Besoldung vnd Regiment ziehen / vnnd sich des hielten / doch soll zuuor so sollicher Zug geordnet / sich mit allem Kriegsuolck / so geschickt würde / der Landt vnd strassen vergliechen werden / durch welche Landtstrassen biß zu dem Musterplatz / dieselbigen jren Zug nemen můsten / so solten dieselbigen Fürsten / oder welches stands die weren / die sollich Kriegsuolck schicken / gewisse Ordnung halten / daß sie jhre Personen odder Forirer etlich tag zuuor auff solliche strassen vorhin schicketen / vnd denen so an der strassen gelegen / verkündigten vnnd anzeigten / auff die zeit würde jhr Kriegsuolck alda durchziehen / mit sollicher macht vnd sterck / wie dasselbig dann were / Darauff begern daß sollicher Herr / des ein jedes Landt were / solliche Prouiant vorgemelter Ordnung / bei die handt schaffen wölle / wo sie die Herberg oder Leger haben würden / solliches sol dem Herrn der das Kriegsuolck schickt oder fürt / in sein liefferung vnd bezalung geantwort werden / Vnd sollen dieselben solche Prouiant vnd liefferung in die Quartir vnd Roten geben / die bezalung von jnen empfahen vnd außrichten / So das also mit der Bezalung von jnen / auch mit der Ordnung vnnd gůtem Regiment / gehalten würde / so ist zu aller zeit das Kriegsuolck sonder schaden vnnd beschwerung der Armen / durch die Landt biß an die ende vnd ort / dahin sie gehören zubrengen / behelt ein gůtwillig Volck inn den
  cs: |-
    Tento výše uvedený řád není zřízen k užívání jen pro jedno polní tažení {Feldzug} nebo ležení {Leger} v poli, nýbrž vůbec kdyby nastalo, že by se z podnětu Římské říše {Römischen Reichs} konalo křesťanské tažení a válečný lid by táhl zeměmi k přehlídkovým místům {musterplätzen} a na shromaždiště celého houfu {hauffen}; tehdy je třeba, aby to bylo předem v takové radě a konečném nařízení ustanoveno, aby se s každým knížetem a se všemi, kteří mají a musejí posílat vojsko, dohodlo a přikázalo jim – až bude každý přijímat a posílat svůj válečný lid, který mu byl uložen –, aby ten, komu od říše začne běžet měsíc služby, dal svůj válečný lid přijmout do jednoho pluku {Regiment} s měsíčním žoldem {Besoldung} a nechal jej přísahat k nejvyššímu veliteli {Obersten} v jeden řád a poslušnost; neboť poněvadž dostávají svůj žold na měsíce, mají pak také táhnout jako placení vojáci v žoldu a pod správou a držet se toho. Předem však, jakmile bude takové tažení nařízeno, má se se vším posílaným válečným lidem ujednat ohledně zemí a cest, kterými zemskými silnicemi musejí táhnout až na místo přehlídky; a tato knížata nebo kdokoli jiného stavu, kdo takový válečný lid posílají, mají zachovávat pevný řád, aby vyslali své lidi nebo furýry {Forirer} několik dní napřed po těchto cestách a oznámili a ohlásili těm, kdo při cestě sídlí, že v tu a tu dobu tudy potáhne jejich válečný lid s takovou a takovou mocí a silou, jaká právě bude. Nato mají žádat, aby pán, jemuž každá země náleží, opatřil pohotově takový proviant podle výše uvedeného řádu tam, kde budou mít nocleh či ležení; toto má být předáno pánovi, který válečný lid posílá nebo vede, do jeho dodávky a k zaplacení. A ti mají takový proviant a dodávku rozdávat do kvartýrů a rot {Roten}, přijímat od nich platbu a vyřizovat ji. Bude-li se to takto dodržovat jak se zaplacením od nich, tak s pořádkem a dobrým řízením, lze kdykoli dopravit válečný lid bez škody a obtěžování chudých přes země až na místa a končiny, kam náleží, a udrží se povolný lid v těch
