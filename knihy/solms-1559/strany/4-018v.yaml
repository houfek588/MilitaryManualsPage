  popis: |-
    Celostránkový dřevořez se zvedacím nářadím a brzdou označenými čísly „8“ a „9“: vlevo kladkostroj ze dvou kladnic (každá se dvěma kladkami) se zavěšeným zvonovitým břemenem; uprostřed pod číslem „9“ brzdná bota pod kolo s řetězem; vpravo trojnohý dělový kladkostroj (označený „8“) s hřídelem, dvěma ozubenými západkovými koly a zavěšenými kladnicemi; vedle něj rýč.
