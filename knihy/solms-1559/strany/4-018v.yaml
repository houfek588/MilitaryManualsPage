  popis: |-
    Celostránkový dřevořez se zvedacím nářadím a brzdou označenými čísly „8“ a „9“: vlevo čtyřkladkový kladkostroj se dvěma páry kladnic nesoucí těžký zvonovitý náklad; uprostřed pod číslem „9“ zarážecí brzdicí bota pod kolo s řetězem; vpravo třínohý dělový zvedák (jeřáb označený „8“) s dvojitými ozubenými koly, navijákem a zavěšeným kladkostrojem a vedle něj rýč s dřevěnou rukojetí.
