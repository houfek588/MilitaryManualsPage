bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    lieber auß fußknechten dann zu roß haben wolt / wiewol es herrlicher vnd ehrlicher were Reutter darzů gebrauchen / wie gemelt / aber doch wie dem allem so soll bei der nehe ein Zelt auffgericht werden / so vil leicht vnwetter würde / das sie darunder ligen künden / vnd nit verursacht würden in das Leger zugehn / vnd sollen gůt acht haben / das allwegen der Wachtmeister bei jnen bliebe / auch wann die wacht erst besetzt möcht jr wol auff den abent zu jnen hinauß reitten jnen freundlich zusprechen das sie gůt sorg haben / nachuolgends wider in das leger reitten / vnd spilen oder schlaffen / aber etwan liederlich ein lermen in einem leger wirt / solt sie nicht von jrem platz verrücken / doch sollen jr von standen an zu jnen ein Hetschier oder Trummeter schicken / der jnen anzeige was das geschrei seie / nichts desto minder sollen jr euch zu rüsten als ob die Feinde schon da weren / dann vil besser ist zehenmal vergebens gerůst sein dann einmal durch verachtung versaumpt werden.
  cs: |-
    raději měl z pěších knechtů {fußknechten} než z jízdních, ačkoli by bylo vznešenější a čestnější použít k tomu jezdce {Reutter}, jak bylo řečeno. Ať je tomu jakkoli, má se poblíž postavit stan, aby pod ním mohli ležet, kdyby snad přišla nepohoda, a nebyli nuceni odcházet do ležení {Leger}. Mají také dobře dbát, aby u nich vždy zůstal vachmistr {Wachtmeister}. Když je stráž {wacht} právě rozestavena, můžete k nim navečer vyjet, vlídně je povzbudit, aby byli bdělí, potom se vrátit do ležení a hrát nebo spát. Strhne-li se však v ležení z lehkomyslnosti poplach {lermen}, nemáte je hnát z jejich místa, ale máte k nim ihned poslat hartšíře {Hetschier} nebo trubače {Trummeter}, který jim oznámí, co ten křik znamená. Přesto se máte připravit, jako by nepřítel už byl tady, neboť je mnohem lepší být desetkrát připraven nadarmo než jednou propást [nebezpečí] z lehkomyslnosti.
- typ: odstavec
  de: |-
    Auch hab ich gesehen wann mann besorgt hat / die feind würden zu nacht inn das leger fallen / daß mann fünff oder sechs fewer gemacht ausserhalb dem leger / eines vngefehrlich sechszig oder sibentzig schůch gleich gegen dem platz hinüber / da mann nachts zusamen kompt wann ein lermen wirt / solchs geschicht auß der vrsachen / wann euch die Feind angreiffen wöllen / so werden sie euch nicht künden sehen vor den fewern aber jhr möcht sie mit gůten růhen nach ewerm wolgefallen sehen / darumb jr sie desto baß mit ewerm Geschütz vnd Armbrosten schedigen mögen.
  cs: |-
    Viděl jsem také, že když se obávali, že nepřítel v noci vpadne do ležení, rozdělali mimo ležení pět nebo šest ohňů, každý asi šedesát nebo sedmdesát stop {schůch}[^1] přímo naproti místu, kde se v noci shromažďují, když nastane poplach. Děje se to proto, že když na vás nepřítel bude chtít zaútočit, nebude vás pro ohně vidět, kdežto vy ho můžete v klidu a dle libosti pozorovat, a tím lépe mu tak můžete škodit svými děly {Geschütz} a kušemi {Armbrosten}.
- typ: odstavec
  de: |-
    Jr sollen auch ein wacht verordnen auß ewern Edelleuten / Hetschier vnd Trabanten nach dem jr dann leut habt inn ewerm Zelt vor ewerm losament zu nacht ligen / vnd euch vor aller vnrůhe vnnd vnsicherheit bewaren / auch mit euch zu nacht ziehen in allen gefehrlicheiten die sich zutragen möchten.
  cs: |-
    Máte také ze svých šlechticů, hartšířů a drabantů {Trabanten} – podle toho, kolik máte lidí – určit stráž, která bude v noci ležet ve vašem stanu před vaším ubytováním {losament}, chránit vás před každým nepokojem a nebezpečím a v noci s vámi táhnout při všech nebezpečných příhodách, které by mohly nastat.
- typ: odstavec
  de: |-
    Jch hab zwo maniern gesehen / wie mann sich in einen lermen versamblen soll in dem ort da das feur der wacht ist / an dem einen ort haben sie sich versamblet alle Reutter / vnd stalten sich in ein Ordnung wie sich gebüret / Auff die ander manier hab ich gesehen / das alle kriegßleut / Hetschier vnd Reutter zu fuß auff den platz kommen mit jren wehrn / damit sie sich beschützen haben wöllen / vnnd seind zu den Fußknechten in die Ordnung getretten / Solch zwo maniern befinde ich gůt zu sein / der gestalt / wie ich euch anzeigen will / wenn jhr ein leger schlagen in einem Dorff / wirt der Reisig Zeucht gar oder ja der mehrer theil in den Heusern ligen / deßhalben ich wolt das sie alle zu roß auff den platz komen / wie oben gemelt / dann gewonlich die lermen
  cs: |-
    Viděl jsem dvojí způsob, jak se při poplachu shromáždit na místě, kde hoří oheň stráže. Podle prvního se tam shromáždili všichni jezdci a seřadili se do šiku {Ordnung}, jak se patří. Podle druhého způsobu, jak jsem viděl, přišli všichni válečníci {kriegßleut}, hartšíři i jezdci na místo pěšky se zbraněmi, jimiž se chtěli bránit, a postavili se k pěším knechtům do šiku. Oba tyto způsoby shledávám dobrými, a to tak, jak vám ukážu. Rozbijete-li ležení ve vsi, bude jízda {Reisig Zeucht} buď celá, nebo aspoň z větší části ležet v domech. Proto bych chtěl, aby všichni přišli na místo na koních, jak bylo řečeno výše, neboť poplachy
