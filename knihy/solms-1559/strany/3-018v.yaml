bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vnd besteht wol wiewol noch gar vil daruon zu fragen wer / es ist aber zuuil / wil sich in disem nit alles anzeigen lassen / ich wils dar bei lassen / vnd in eim andern Bůch von bäwen vnd der Regirung gründlichern bericht thůn.
  cs: |-
    a dobře obstojí, ačkoliv by se na to dalo ptát ještě mnohem více; ale je toho příliš, nedá se to v tomto spise všechno vyložit – nechám to při tom a v jiné knize podám důkladnější výklad o stavbách a správě.
- typ: odstavec
  de: |-
    Wann aber ein person von disem frag stück also befragt wirt / vnd er auff sie alle sein bescheidt wist / daß wer vil von eim / vnd wer vor eim andern zu halten / vnd jm zu befelhen / so er das nit aller / sonder der stück zum theil weiß der sein vil oder wenig / darnach er der kan / darnach soll er besoldet vnnd gehalten werden / wirdt aber einer sein der sich nicht vor ein grossen Meister auß gibt / bekennet sich / begert zu lernen / ist eines gůten wesens vnd wandels / so soll ein Zeugmeister wider jn sagen / nun wolan die weil du dich wol helst vnd begerst zu lernen / ist dann dein gemüt also / das du lernen wilt vnd hast lust darzů / so wille ich dich vor mich nemen / dir allerlei eins nach dem andern vnder die handt geben das du dich darmit vbest / vnd lernest / doch der gestalt / daß du dich des verpflichtes vnd mir gůt machst / bei mein Herrn dein lebenlang zu bleiben vnd on meins Herrn vnd mein wissen vnd willen zu keim andern kommen / vnd was heimlichs ich dich lernen vnd vertraw daß du das in geheimnuß bei dir behalten wöllest / niemant das lernen noch zu berichten / sonder mein wissen vnd willen / so du das thůn wilt wil ich dich mit allem fleiß lernen / wann du dich dann also gehorsam vnd wol halten wirst / wil ich dich auch mit der besoldung darnach halten / vnd wie du in der kunst dich vbest / befleisset vnd auff steigest / also wil ich dich mit der besoldung vnd besserung auch halten / so dann die person sich also bewilliget vnd annimpt / soll auch ein Zeugmeister allen fleiß bei jm haben / jn lernen vnd nit feiren lassen / sonder jmmer etwas für geben das er sich vbe daß steht eim Zeugmeister zu / darumb soll er kein kindt sein / vnd selbst nichts wissen / sonder selbst die sach verstehn vnd künden / so ein Zeugmeister also selbst ein verstandt vnd solchen fleiß bei seinen Gesellen hat / so macht vnd zeucht er meister vnd gůt leut / vnd sie gewinnen jn lieb sind jm gehorsam / vnd achten jn / vnd ist jm auch rümlich / wann aber ein Zeugmeister nichts kan / vnd sein gesellen geschickter dann er sind / so ist gůt zu gedecken wie sie jn achten dann er muß von jn lernen / darumb muß er sie mehr lieben vnd förchten dann sie jn / vnd so er sie vil heissen soll vnd er weiß vnd versteht nichts / ist gůt zu gedencken wie es gůt thůn kan / Deß hat mann zunemen ein Exempel bei eim Hantwercksman der knecht halten muß / ist der meister gůt vnd berümpt auff seim hantwerck / so begern die gesellen all zu jm die anders lust zu lernen haben / geben jm gelt darzů / dienen jm ein zeitlang vmb
  cs: |-
    Bude-li však nějaká osoba podle těchto zkušebních otázek takto zkoušena a bude umět odpovědět na všechny, bylo by to od jednoho člověka mnoho a bylo by si jej třeba vážit před jiným a svěřovat mu velení; neumí-li však všechno, nýbrž jen část těch věcí, ať hodně nebo málo, má být podle toho, kolik jich umí, vyplácen a držen. Najde-li se však někdo, kdo se nevydává za velkého mistra, přizná se, touží se učit a je dobrého chování a mravů, tu mu má zbrojmistr {Zeugmeister} odpovědět: „Nuže dobrá, poněvadž se chováš řádně a toužíš se učit, je-li tvá mysl taková, že se chceš učit a máš k tomu chuť, vezmu si tě k sobě, budu ti dávat do ruky rozličné věci jednu po druhé, aby ses v nich cvičil a učil – avšak s tou podmínkou, že se k tomu zavážeš a zaručíš se mi, že zůstaneš u mého pána po celý svůj život a bez vědomí a vůle mého pána i mé neodejdeš k nikomu jinému, a cokoli tajného tě naučím a svěřím ti, že to uchováš v tajnosti u sebe a nikoho tomu nenaučíš ani o tom nepodáš zprávu bez mého vědomí a vůle. Chceš-li tak činit, budu tě se vší pílí vyučovat; a budeš-li se pak chovat poslušně a řádně, budu tě podle toho odměňovat i žoldem {besoldung}, a jak se budeš v umění cvičit, přičiňovat[^1] a stoupat vzhůru, tak se k tobě zachovám i se žoldem a přilepšením.“ Když tedy ta osoba na to přistoupí a přijme to, má zbrojmistr vynaložit při ní veškerou píli, vyučovat ji a nenechávat zahálet, nýbrž stále jí něco zadávat, aby se cvičila – to náleží zbrojmistrovi. Proto nemá být žádné dítě a sám nic nevědět, nýbrž má sám věci rozumět a ovládat ji; má-li tedy zbrojmistr sám rozum a takovou píli u svých tovaryšů, vychová a vycvičí mistry a dobré lidi, oni si ho oblíbí, jsou mu poslušni a váží si jej, což mu je i ke cti. Neumí-li však zbrojmistr nic a jeho tovaryši jsou schopnější než on, lze si snadno domyslet,[^2] jak si ho váží, neboť se musí učit od nich; proto se jim musí více podbízet a bát se jich než oni jeho, a má-li jim mnoho poroučet, a sám neví a nerozumí ničemu, lze si snadno domyslet, jak to může dělat dobrotu. Příklad toho si lze vzít u řemeslníka, jenž musí držet dělníky: je-li mistr dobrý a proslulý ve svém řemesle, hrnou se k němu všichni tovaryši, kteří jen mají chuť se učit, ještě mu k tomu dávají peníze a slouží mu nějaký čas
poznamky:
- n: 1
  text: V tisku zkrácená podoba 2. osoby „befleisset“ místo *befleissest*.
- n: 2
  text: |-
    V tisku vypadlo *n* ve slově „gedecken“ (místo *gedencken*, jako o dva řádky níže).
