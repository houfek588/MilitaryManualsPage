stav: prelozeno
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    so bald sich erheben / das durch hinlessigkeit ein Fewer vnd brunst in heusern auffgehen möcht / oder villeicht ein Kundtschaffer der Feind oder sonst ein böser Verräter möcht Fewer einlegen / vnnd dieweil die Heuser nicht so gůt zu leschen seind als die Hütten inn dem Leger / auch die Roß nicht so bald zu den Ställen vnd Thürn herauß zogen werden mögen / ein jeglicher Reisiger besorgt / er möcht durch solche brunst sein Roß vnd was er hat / verlieren / laufft er vnd trit auß der Ordnung / darmit er das sein errette / Deßhalben ich für gůt achte / daß die Reutter auff den Lermen platz kommen / aber wann jhr in einem Veld ligt da kein Heuser seind / dorffet jhr kein solche grosse sorg haben / vnnd were auch mein meinung nachts zu fuß auff den lermen platz zu kommen.
  cs: |-
    vznikají tak snadno: nedbalostí může v domech vypuknout oheň a požár, nebo snad nepřátelský zvěd {Kundtschaffer} či jiný zlý zrádce může založit oheň. A protože domy nejdou hasit tak snadno jako chýše v ležení {Leger} a ani koně nelze tak rychle vyvést ze stájí a vrat, bojí se každý jezdec {Reisiger}, že by mohl při takovém požáru přijít o koně a o všechno, co má; běží proto a vystoupí ze šiku {Ordnung}, aby zachránil, co je jeho. Proto považuji za dobré, aby jezdci {Reutter} přicházeli na poplachové místo {Lermen platz} [na koních]. Ležíte-li však v poli, kde nejsou žádné domy, nemusíte mít tak velké starosti, a byl bych toho mínění, aby se v noci přicházelo na poplachové místo pěšky.
- typ: odstavec
  de: |-
    Jch hab auch offt gesehen / wann Heuser nahe bei den Legern waren / doch nicht im Zirckel des Legers begriffen / das ein jeglicher darinn ligen hat wöllen / die jnen der Quartirmeister nicht außtheilt / hab auch gesehen das grosser schad darauß eruolgt / dann ich weiß daß die Feind innen worden seind / vnd eingefallen / dieselbigen Heuser geplündert / wer darinn gewesen / gefangen / erstochen / odder verbrent / Darumb ich euch rath als bald ewer leger geschlagen / daß jhr ewerm Kriegßuolck vergündet souil holtz vnd anders zunemen / was jnen dann darzů dienstlich ist / biß sie gnůg haben jr hüten zumachen / vnd das vbrig verbrennen / damit keiner auß seinem losament verrücke / dann je neher jr das leger bei einander habt je besser es ist.
  cs: |-
    Často jsem také viděl, že když byly blízko ležení domy, jež však nebyly zahrnuty do okruhu {Zirckel} ležení a které jim kvartýrmistr {Quartirmeister} nepřidělil, chtěl v nich ležet každý. Viděl jsem také, že z toho vzešla velká škoda, neboť vím, že nepřítel to zpozoroval, vpadl tam, tyto domy vyplenil a ty, kdo v nich byli, zajal, ubodal nebo upálil. Proto vám radím, abyste hned po rozbití ležení dovolili svému válečnému lidu {Kriegßuolck} vzít [z domů] tolik dřeva a jiných věcí, které se jim k tomu hodí, kolik potřebují ke stavbě chýší, a zbytek spálit, aby se nikdo nevzdaloval ze svého ubytování {losament}. Čím těsněji totiž máte ležení pohromadě, tím lépe.
- typ: odstavec
  de: |-
    Wann die nacht vergangen / solt jr die so im tag wachen / bald die Sonn auffgeht starck gnůg / nach dem jhr in einer landschafft ligen / hinauß schicken an das ort da sie den tag daruor gewacht / auch gleicher gestalt wie daruor mit jren Wachtmeistern / doch solt jhr es jnen zu nacht vor anzeigen damit sie wissen vff welche stundt sie geschickt sein sollen / vnd kein mangel noch verhindernuß an jhnen sei / dann sonst würde die Scharwacht all zu lang wachen müssen / vnd geschehe jnen vnrecht / dann sie nicht verrücken dörffen biß das die andern antretten / darnach mögen sie in das leger ziehen vnd růhen / jhr must auch wann die tag lang seind / die erst Wacht biß auff den mittag wachen lassen / vnd ein ander frische Wacht mit jrem Wachtmeister verordnen / doch soll kein Wacht verrücken biß die ander wider besetzt.
  cs: |-
    Když noc pomine, máte ty, kdo drží denní stráž {Wacht}, poslat hned po východu slunce v dostatečné síle – podle toho, v jakém kraji ležíte – na místo, kde drželi stráž předchozího dne, a to stejným způsobem jako předtím, s jejich vachmistry {Wachtmeistern}. Máte jim to však oznámit už v noci předem, aby věděli, v kterou hodinu mají být připraveni, a aby u nich nebylo žádného nedostatku ani překážky. Jinak by totiž obchůzka {Scharwacht} musela bdít příliš dlouho a děla by se jí křivda, neboť se nesmí hnout, dokud nenastoupí ostatní; teprve potom smí odtáhnout do ležení a odpočinout si. Když jsou dny dlouhé, musíte také nechat první stráž bdít jen do poledne a určit jinou, čerstvou stráž s jejím vachmistrem; žádná stráž se však nemá hnout, dokud není druhá znovu obsazena.
- typ: odstavec
  de: |-
    Nachuolgends soll der Marschalck ein stundt bestimen es sei vor oder nach mittag die leut zuuerhören / vnnd wann jhm ein schwerer handel für kompt / soll er bei jm einen Hauptman odder sonst einen der darzů geschickt ist / auch etliche gelerte leut die jm inn Gerichts handlungen raten / haben / vnd bin der meinung daß er in allen weg bei jm
  cs: |-
    Potom má polní maršálek {Marschalck} určit hodinu, ať před polednem, nebo po něm, kdy bude lidi vyslýchat. Předloží-li se mu těžká věc, má mít u sebe hejtmana {Hauptman} nebo jiného, kdo je k tomu způsobilý, a také několik učených lidí, kteří mu v soudních věcech {Gerichts handlungen} poradí. A jsem toho mínění, že by měl mít u sebe v každém případě
