bloky:
- typ: nadpis
  uroven: 2
  de: |-
    Des Zeugmeisters ampt/ versehung/ vnd was auff seiner person steht/ was sein gemüt vnd wandel sein soll.
  cs: |-
    Úřad a správa zbrojmistra {Zeugmeisters}, co spočívá na jeho osobě a jaké mají být jeho smýšlení a mravy.
- typ: odstavec
  de: |-
    ES ist gůt zu dencken daß einem Herren/ Keyser/ König/ Fürsten/ was stants vnd vermögens er ist/ der Geschütz haben wil vnd muß/ vil an einem geschickten Zeugmeister gelegen ist/ wer schon Geschütz hat vnd haben wil/ ist nit des vermögens daß er das brauchen kan odder mag/ dem ist nit von nöten nach einem sollichen Man zu trachten/ wie das Geschütz zuuersehen erfordert/ demselbigen ist auch vil vnnd grosses Geschütz nit von nöten/ Aber diser nachuolgender Rathschlag ist gemacht vff Keyser/ König/ groß Fürsten vnd Herren/ die groß Landt vnnd Leut haben/ die mit gewalt das künden vnd mögen erhalten/ denselbigen ist von nöten ein groß wehrhafftig Geschütz zu haben/ darmit sie jhr Landt vnd Leut in schutz vnd schirm halten mögen. So dann also ein Herr durch gemelte vrsachen ein solliches grosses Geschütz haben würde/ so erfordert desselbigen hohe notturfft daß er mit allem das ein solches groß vnd klein Geschütz erfordert/ darzů geschickt sei/ dann das Geschütz ist on seine zugehörung nichts nütz/ so schon alle zugehörung da ist/ wöllen vnd müssen die Leut die das machen/ vnderhalten vnnd regiern auch zum ersten darbei sein/ Dann die leut können den vorrat machen/ ordnen/ vnd mit jnen alles das thůn was mann damit thůn soll/ ob schon die Büchsen/ vorrat vnd alles da ist/ so können sie die leut nicht darzů machen noch zurichten/ wie die leut sie gemachen können vnd gebrauchen. Darumb so müssen die leut zum ersten da sein/ die Büchsen giessen/ fassen/ alle rüstung darzů machen mit vortheil vnd nach erheischung der notturfft/ zu dem geschickten vnd besten vortheil gebrauchen/ Derhalben wil vor des erst nach den Personen gedacht sein/ vnd dieselben gehören in der zeit zu bestellen/ Dieweil dann einem Herrn also ein grosses auff seiner Arcolorei steht/ vnd alle sein Kriegs Ordnung auff das Geschütz vnd Arcololei machen muß/ so erfordert die notturfft/ daß er nach einem glaubhafftigen vertrawten Man sich vmb sehe/ der sich des Kriegs verstehe/ dann so einem HERREN wirdt zustehen/ daß er einen Krieg berathschlagen soll vnnd muß/ so kan er nicht wol berathschlagt vnnd gerodnet[^1] werden on die Arcolorei vnd das Geschütz/
  cs: |-
    Snadno si lze pomyslet, že pánovi – císaři, králi či knížeti, jakéhokoli je stavu a majetku –, který chce a musí mít děla {Geschütz}, velmi záleží na obratném zbrojmistrovi. Kdo sice děla má a chce mít, ale není tak zámožný, aby je mohl či dokázal používat, tomu není zapotřebí shánět takového muže, jakého vyžaduje správa děl, a takovému ani není zapotřebí mnoho velkých děl. Avšak tato následující rozvaha je sepsána pro císaře, krále, veliké knížata a pány, kteří mají velikou zemi a lid a dokážou a mohou si je mocí udržet: těm je zapotřebí mít veliké, bojeschopné dělostřelectvo, jímž mohou svou zemi a lid držet v ochraně a záštitě. Má-li tedy pán z uvedených příčin taková veliká děla, vyžaduje jeho nejvyšší potřeba, aby byl náležitě opatřen vším, co taková velká i malá děla vyžadují; neboť dělo bez svého příslušenství není k ničemu. A i když je již veškeré příslušenství pohromadě, chtějí a musejí být nejprve při tom lidé, kteří je zhotovují, udržují a spravují – neboť lidé dovedou pořídit zásoby, uspořádat je a konat s nimi vše, co se s nimi konat má; kdežto i kdyby tu již byla děla, zásoby i všechno ostatní, nemohou děla sama vytvořit ani připravit lidi tak, jako lidé mohou zhotovit a užívat děla. Proto musejí být nejprve lidé, kteří umějí děla odlévat, lafetovat, zhotovovat k nim veškerou výstroj {rüstung} s dovedností a podle potřeby a užívat je k co nejšikovnějšímu a nejlepšímu prospěchu. Z toho důvodu je třeba především pamatovat na osoby a ty náleží zavčas najmout. Poněvadž tedy pánovi tolik záleží na jeho dělostřelectvu {Arcolorei} a veškerý svůj válečný řád {Kriegs Ordnung} musí budovat na dělech a dělostřelectvu[^1], vyžaduje potřeba, aby se poohlédl po věrohodném, důvěryhodném muži, jenž se vyzná ve válce; neboť připadne-li pánovi, že má a musí radit o válce, nelze se o ní dobře poradit a uspořádat ji bez dělostřelectva a děl,
poznamky:
- n: 1
  text: |-
    V textu *de* je na téže straně tisková podoba *Arcololei* (záměna *-r-/-l-* za *Arcolorei*) a přesmyčka *gerodnet* (za *geordnet*).
