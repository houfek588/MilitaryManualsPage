bloky:
- typ: odstavec
  de: |-
    ZVm ein vnd zwentzigsten zeigen hie vorn vier haupt grosse stück an/ dieweil sie ledig ligen an jrer leng dicke vnd forn/ wie sie von art sein sollen/ alles nach jren kugeln zunemen/ vnnd die höhe der rechten kůgeln/ vnd grösse einer jeden Büchsen/ zeigen die lingen so allhie vber einer jeden büchsen verzeichet stehn/ vnd darüber geschriben die höhe der kugeln/ vnd die lingen seind der rechten kugeln größ vnd maß/ auch ist ein solche linge oder maß verkleinert vnd getheilt in zehen theil/ daß also dise kleine kugeln wie sie für den Büchsen stehen/ ein jede jrer höhe zehen so hoch als die rechten Kugeln sein sollen/ damit die Büchs dardurch ein rechte grosse maß so mann sie zenen mal vergröste hab.
  cs: |-
    Za jednadvacáté: výše se ukazují čtyři hlavní veliké kusy {stück}, jak samostatně leží podle své délky, tloušťky stěny i tvaru, jak mají být ze své povahy provedeny – vše odměřováno podle jejich koulí {kugeln}. Průměr skutečných koulí a velikost každého děla udávají úsečky vyznačené zde nad každým dělem, nad nimiž jest nadepsána „výška koulí“; tyto úsečky představují velikost a míru pravých koulí. Taková úsečka či míra jest však zmenšena a rozdělena na deset dílů, takže každá z těchto malých koulí, jak stojí před děly, má být ve skutečnosti desetkrát větší co do své výšky než její nakreslený průměr, aby tak dělo dostalo svou správnou velkou míru, když se zobrazení desetkrát zvětší.
- typ: odstavec
  de: |-
    Vnd solche vier stück sind die gröste hauptstück/ nemlich Mawerbrecherin vnd ist warlich wol die gröste gattung so mañ nottürfftig ist vnd brauchen kan/ dann was grösser ist das ist nit zugebrauchen im feld noch in den Schantzen anders dann für schawstück/ vnnd ein gebreng zu halten/ weiter ist nichts mit jnen außzurichten. Dann ein solchs schwer stück will starck gefeß vnd wagen haben/ vnd wöllen auch starck beschlagen sein/ das brengt auch ein schwere/ so ist nun zu dencken was zu solchen stücken gehören will mit solcher schwere/ an Wagen vnd pferden/ deßgleichen dann auch mit anderer jhrer zurüstung/ als kugeln/ puluer vnd anders mehr so darzů gehört.
  cs: |-
    A tyto čtyři kusy jsou největší hlavní kusy, totiž bořiče hradeb {Mawerbrecherin}, a vpravdě jest to největší ráž, jaké je zapotřebí a kterou lze ještě užívat; neboť vše, co jest většího, nedá se používat ani v poli, ani v šancích {Schantzen}, leda jen jako okázalý kus k parádění, a jinak se s tím nic nepořídí. Takto těžký kus totiž vyžaduje silnou lafetu {gefeß} a vozy, jež musejí být i silně okované, což samo o sobě přináší velkou tíhu; z toho lze tedy usoudit, co vše k takovým kusům při jejich tíze náleží na vozech a koních, jakož i na ostatní jejich výzbroji, totiž koulích {kugeln}, střelném prachu {puluer} a jiných věcech k tomu patřících.
