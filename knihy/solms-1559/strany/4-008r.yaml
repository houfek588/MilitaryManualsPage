bloky:
- typ: odstavec
  de: |-
    ZVm ein vnd zwentzigsten zeigen hie vorn vier haupt grosse stück an/ dieweil sie ledig ligen an jrer leng dicke vnd forn/ wie sie von art sein sollen/ alles nach jren kugeln zunemen/ vnnd die höhe der rechten kůgeln/ vnd grösse einer jeden Büchsen/ zeigen die lingen so allhie vber einer jeden büchsen verzeichet stehn/ vnd darüber geschriben die höhe der kugeln/ vnd die lingen seind der rechten kugeln größ vnd maß/ auch ist ein solche linge oder maß verkleinert vnd getheilt in zehen theil/ daß also dise kleine kugeln wie sie für den Büchsen stehen/ ein jede jrer höhe zehen so hoch als die rechten Kugeln sein sollen/ damit die Büchs dardurch ein rechte grosse maß so mann sie zenen mal vergröste hab.
  cs: |-
    Za jednadvacáté: výše jsou vyobrazeny čtyři velké hlavní kusy {stück}, jak leží volně [bez lafet], podle své délky, tloušťky a tvaru, jaké mají ze své povahy mít – vše odměřeno podle jejich koulí {kugeln}. Průměr skutečných koulí a velikost každého děla udávají čáry (*lingen*) vyznačené zde nad každým dělem, nad nimiž je napsáno „výška koulí“; tyto čáry představují velikost a míru skutečných koulí. Taková čára či míra je však zmenšená a rozdělená na deset dílů, takže skutečná koule má být desetkrát vyšší než každá z těchto malých koulí, jak stojí před děly; tak dostane i dělo svou správnou velkou míru, když se desetkrát zvětší.
- typ: odstavec
  de: |-
    Vnd solche vier stück sind die gröste hauptstück/ nemlich Mawerbrecherin vnd ist warlich wol die gröste gattung so mann nottürfftig ist vnd brauchen kan/ dann was grösser ist das ist nit zugebrauchen im feld noch in den Schantzen anders dann für schawstück/ vnnd ein gebreng zu halten/ weiter ist nichts mit jnen außzurichten. Dann ein solchs schwer stück will starck gefeß vnd wagen haben/ vnd wöllen auch starck beschlagen sein/ das brengt auch ein schwere/ so ist nun zu dencken was zu solchen stücken gehören will mit solcher schwere/ an Wagen vnd pferden/ deßgleichen dann auch mit anderer jhrer zurüstung/ als kugeln/ puluer vnd anders mehr so darzů gehört.
  cs: |-
    Tyto čtyři kusy jsou největší hlavní kusy, totiž bořiče hradeb {Mawerbrecherin}, a je to vpravdě největší ráž, jaké je třeba a jakou lze ještě používat. Co je větší, nedá se použít v poli ani v šancích {Schantzen}, leda jako kusy na podívanou (*schawstück*) a pro okázalost; jinak se s nimi nic nesvede. Tak těžký kus totiž potřebuje silnou lafetu {gefeß} a vozy, které musejí být také silně okované, a to přidává další tíhu. Lze si tedy domyslet, co všechno k takovým kusům při takové tíze patří na vozech a koních a stejně tak na ostatní jejich výbavě, jako jsou koule, střelný prach {puluer} a další věci, které k tomu patří.
