  de: Von des Oberster ampt vber das Fußuolck.
  cs: O úřadu plukovníka {Oberster} nad pěchotou {Fußuolck}.
- typ: odstavec
  de: |-
    WJewol der Oberst vber das Fußuolck vnder dem Obersten Feldhauptman ist/ hat er doch sein eigen Regiment/ wie nachuolgt/ vnnd wirt des Obersten/ sampt anderer hohen vnd nidern Amptern gewonliche Besoldung verzeichnet.
  cs: |-
    Ačkoli je plukovník nad pěchotou podřízen nejvyššímu polnímu hejtmanovi {Obersten Feldhauptman}, má přesto svůj vlastní pluk {Regiment}, jak následuje, a je zde vypsán obvyklý žold {Besoldung} plukovníka spolu s dalšími vyššími i nižšími úřady.
