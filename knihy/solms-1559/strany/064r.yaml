- typ: odstavec
  de: |-
    Dise ämpter all hat der Oberst vber die Knecht zusetzen vnd zuentsen/ doch mag sie der Kriegsherr oder der Oberst Feldhaupman ane des herrn stat/ nach dem der hauff groß oder klein ist/ toppel oder einfach besetzen/ auch möcht der Herr oder sein Oberster Feldhauptman etwan der hohen besoldung vmb ringerung gedencken/ wiewol die zeit jetzt nit ist/ angesehen/ daß die kriegsleut zu roß vnd fuß also tewr vnd hohem wert sein/ will auch der Kriegsherr den Hauptleuten jedem ein Leutenant halten/ mag ers thůn/ er ists aber nicht schuldig/
  cs: |-
    Všechny tyto úřady má plukovník u knechtů {Knecht} právo obsazovat i sesazovat[^1], avšak může je válečný pán {Kriegsherr} nebo nejvyšší polní hejtman namísto pána obsadit dvojitě či jednoduše podle toho, jak velký nebo malý je houf {hauff}; pán nebo jeho nejvyšší polní hejtman by také mohli případně pomýšlet na snížení vysokých žoldů, třebaže k tomu nyní není vhodná doba vzhledem k tomu, že válečníci {kriegsleut} na koni i pěšky jsou tak drazí a ve vysoké ceně; chce-li také válečný pán držet každému z hejtmanů jednoho poručíka, může tak učinit, není tím však povinen
poznamky:
- n: 1
  text: |-
    V tisku zkráceně „zuentsen“ místo „zuentsetzen“ (sesazovat) a níže „Feldhaupman“ místo „Feldhauptman“. Dvousloupcový rozpis žoldů z tisku je převeden po sloupcích za sebou (praporečníkovo pachole a hejtmanův kuchař patří k hejtmanově družině).
