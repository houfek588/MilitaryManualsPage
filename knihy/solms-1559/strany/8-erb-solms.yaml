id: 8-erb-solms
list: předsádka (8. kniha)
strana: recto
sken: 585
frontispis: true
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: Reinhart der Elter Graue zu Solms/ vnd Herr zu Müntzenberg/ etc.
  cs: Reinhard starší, hrabě ze Solmsu a pán z Münzenbergu[^1] atd.
- typ: obrazek
  soubor: drevorez-585.jpg
  popis: |-
    Celostránkový dřevořez s erbem hrabat ze Solmsu a pánů z Münzenbergu (z téhož štočku jako před předchozími knihami), zasazeným v koruně mohutného listnatého stromu a lemovaným věncem: čtvrcený štít se solmským lvem (1. a 4. pole) a děleným štítem münzenberským (2. a 3. pole), nad ním dvě turnajské přilby s klenoty, praporkem a bohatými přikryvadly. V pozadí krajina s hradem na skalnatém kopci vpravo, u kořenů stromu tři nápisové stuhy (vlevo „REINHA / VND HER[R]“, uprostřed „RT. GRAFF. ZV / ZV MINCZEN“, vpravo „SOLMS / BORGK“), tj. „Reinhart Graff zu Solms vnd Herr zu Minczenborgk“.
poznamky:
- n: 1
  text: |-
    Erbovní frontispis uvozuje Osmou knihu (*Das acht Bůch*) o obsazení města či městečka válečným lidem a o jeho zásobování proviantem. Rubová strana tohoto listu (sken 586) je prázdná, a proto se v edici vynechává.
