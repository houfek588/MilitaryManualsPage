bloky:
- typ: odstavec
  de: |-
    Auff solche hauffen alle soll der gewaltig hauff zu roß vnd fuß/ ziehen/ nemlich 3000. Teutscher Pferdt Spiesser/ vnd neben jnen auff der rechten seiten 500. Teutsche Schützen zu roß/ die sollen vor dem gewaltigen hauffen auff der rechten seiten vorziehen.
  cs: |-
    Za všemi těmito houfy {hauffen} má táhnout hlavní houf {gewaltig hauff} jízdy i pěchoty, totiž 3 000 německých jízdních kopiníků {Spiesser}, a vedle nich po pravé straně 500 německých jízdních střelců, kteří mají jet před hlavním houfem na pravé straně.
- typ: odstavec
  de: |-
    Vnd neben den 3000. Teutschen Pferden inn dem gewaltigen Hauffen sollen vff der rechten seiten 500. Teutscher Schützen/ vnd 5000. Pferdt Musca spiesser ziehen/ vnd auff der lincken handt neben die 3000. Pferdt 3. Regiment Teutscher Knecht/ vnnd bei dieselbigen 3. Regiment Büchssen/ vnd auff derselbigen seiten neben den Büchsen ein Geschwader Pferdt Musca/ das ist 1000. pferdt/ auff solche 3000. Teutsche pferdt soll wider 3. Regiment Knecht als 30. Fendlein ziehen vnd Büchsen bei jnen haben.
  cs: |-
    Vedle těch 3 000 německých koní v hlavním houfu má po pravé straně táhnout 500 německých střelců a 5 000 moskevských jízdních kopiníků; po levé ruce vedle 3 000 koní 3 pluky {Regiment} německých knechtů {Knecht} a u těchto 3 pluků děla {Büchssen}, a na téže straně vedle děl švadrona {Geschwader} moskevských koní, to jest 1 000 koní. Za těmi 3 000 německými koňmi mají opět táhnout 3 pluky knechtů, totiž 30 praporců {Fendlein}, a mít u sebe děla.
- typ: odstavec
  de: |-
    Vnd auff den gewaltigen hauffen soll der nachzug ziehen/ vnd bei sich 2000. pferdt spiesser vnd Schützen haben/ Vnd neben auff der lincken handt 3. Regiment/ nemlich 30. Fendlein/ vnnd bei dieselbigen Knecht Büchsen.
  cs: |-
    Za hlavním houfem má táhnout zadní voj {nachzug} a mít u sebe 2 000 koní kopiníků a střelců; vedle něj po levé ruce 3 pluky, totiž 30 praporců, a u těchto knechtů děla.
- typ: odstavec
  de: |-
    Vnd zwischen dem gewaltigen hauffen vnd nachzug/ sol der Troß ziehen/ vnd auff der lincken seiten des Troß/ sollen die Artolorei vnd Monition wagen bei einander/ mit so kurtzen reihen als sie künden vnd veld haben/ gehn vnd auff dieselbigen alle andere Heerwagen/ auch souil möglich velds halber mit kurtzen reihen zum nechsten bei einander gehen/ neben solchen auff der lincken Handt sollen zwei Geschwader Reutter der Musca als 2000. pferdt ziehen.
  cs: |-
    Mezi hlavním houfem a zadním vojem má táhnout trén {Troß}. Po levé straně trénu mají jet pospolu vozy dělostřelectva {Artolorei} a munice {Monition}, v tak krátkých řadách, jak jen mohou a jak jim pole dovolí, a za nimi všechny ostatní válečné vozy {Heerwagen}, rovněž v krátkých řadách a co nejtěsněji u sebe, nakolik to pole dovolí. Vedle nich po levé ruce mají táhnout dvě švadrony moskevských jezdců, totiž 2 000 koní.
- typ: odstavec
  de: |-
    Mann sagt der Muscabiter vermög ein groß Kriegßuolck in das Veldt auß seinem Landt/ vnd andern anstossenden Landten/ die vnder jnen gehören/ vnd doch andere namen haben. Erstlich das Hertzogthumb Moscau soll 300000. Man Edler vnd 60000 Bauren vermögen/ Darnach das Hertzogthumb Cweiscau soll 40000. streitbarer man vom Adell/ Vnd das Hertzogthumb Chelsce auch in das veld 7000. Man/ Vnd das Fürstenthumb Rzysen 15000. man Edler in das veld vermögen zuschicken.
  cs: |-
    Říká se, že Moskvan {Muscabiter} dokáže postavit do pole veliké vojsko ze své země i z jiných přilehlých zemí, které mu podléhají, ač mají jiná jména. Předně vévodství Moskevské prý zmůže 300 000 urozených mužů a 60 000 sedláků; dále vévodství Cweiscau 40 000 bojeschopných mužů ze šlechty, vévodství Chelsce rovněž 7 000 mužů do pole a knížectví Rzysen prý dokáže vyslat do pole 15 000 urozených mužů.[^1]
- typ: odstavec
  de: |-
    Vnd es ist ein Landt die Tartern Kozausca genant/ vnd dem Muscabiter vnderworffen/ das zeugt 30000. starck in das veld.
  cs: |-
    Je tu ještě země Tatarů zvaná Kozausca, podrobená Moskvanovi; ta táhne do pole v síle 30 000 mužů.
- typ: odstavec
  de: |-
    Vnd in summa dises Kriegßuolck alles/ welchs der Mosca vermag ist zusamen 452000. Vnd wann er solches Kriegßuolck mit gůter ordenlicher rüstung inn ordnung/ mit sampt eim gůten geschütz hett/ so were es ein trefflichs volck/ aber es ist zu achten daß solches Volck nicht aller mage auß dem Landt gefüret/ der vrsachen halben/ daß sie mit der Prouiant nit mögen erhalten werden/ deßgleichen die Pferdt mit der Fütterung/ Dann es ist zugedencken/ das
  cs: |-
    Úhrnem činí všechen tento válečný lid {Kriegßuolck}, který Moskvan {Mosca} zmůže, dohromady 452 000. Kdyby měl tento válečný lid v dobré, řádné výzbroji a v pořádku, spolu s dobrými děly {geschütz}, byl by to znamenitý lid. Avšak lze usoudit, že takový lid nevyvádí ze země celý, a to z té příčiny, že by se nedal uživit proviantem {Prouiant} a koně stejně tak pící {Fütterung}. Je totiž třeba uvážit, že
poznamky:
- n: 1
  text: |-
    Součet uvedených oddílů (300 000 + 60 000 + 40 000 + 7 000 + 15 000 + 30 000) dává přesně níže uvedených 452 000 mužů. Zeměpisná jména z dobových zpráv (snad podle Herbersteina či Münstera) jsou v tisku zkomolena a ponechána v původní podobě: *Cweiscau* je patrně Tverské, *Rzysen* Rjazaňské knížectví, *Kozausca* Kazaňští Tataři; *Chelsce* se nepodařilo určit. Solms rozlišuje *Hertzogthumb* (vévodství) a *Fürstenthumb* (knížectví).
