bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    daß er solliches wölle bedencken/ vnd in dem handlen/ vnd sich halten wie einem solchen Herrn/ oder was stands er ist/ zustehet/ vnnd die gnad/ bei jrer Römis. Keys. Maies. darumb gewarten/ auch ein gůt ehrlich gerucht bei einem gantzen hauffen dardurch erlangen würde/ das sei Ewer Römis. Keys. Mai. gegen jm mit seiner belonung/ mit allen gnaden zubedencken/ gnedigst geneigt/ vnd wöl E. Rö. Key. Mai. sich dessen also on zweifel gentzlich zu jm vertrösten vnd versehn.
  cs: |-
    ať to uváží, podle toho jedná a chová se, jak přísluší takovému pánovi nebo osobě jeho stavu. Za to ať očekává milost Jeho římského císařského Veličenstva a získá si tím i dobrou a čestnou pověst u celého vojska. Vaše římské císařské Veličenstvo je nejmilostivěji nakloněno pamatovat na něj odměnou se vší milostí a Vaše římské císařské Veličenstvo se na něj v tom bez pochyby plně spoléhá a očekává to od něho.
- typ: odstavec
  de: |-
    Würde er aber sich in disen stücken/ nit also seines vertrawten befelchs halten (welches dannoch E. Röm. Keys. Mai. sich zu jm gar nicht versehe) so würde er E. Römis. Keys. Maiestat dahin verursachen/ jnen nach seiner gethanen mißhandlung offentlich zu straffen/ daß jm dann so hoch bei dem gemeinen Kriegsuolck vil rümlicher gewesen were/ so er sich seines aufferlegten beuelchs/ ehrlich vnd auffrichtig gehalten hett/ So er sich aber seinem beuelch nit gemeß hielte/ würde es jm desto mehr zu vnehrn/ vnnd widerwertigem nachtheil gereichen/ Das habe Ewer Römis. Keys. Maiestat/ jm als eim vertrautten/ mit ernst also fürzuhalten zu vnderlassen nicht gewust/ Vnd E. Römis. Keys. Maiestat wöl jm sagen/ wo jm derhalben würde einige beschwerte zustehn/ es were was es wolt/ oder von wem es wer/ so solt er des kein schewens von niemand haben/ sonder jre Maiestat darumb besuchen/ darzů er einen freien zugang haben solt/ vnnd mit gnaden gehört werden/ vnnd gnedigen bescheidt vnnd vnderricht entpfangen.
  cs: |-
    Kdyby se však v těchto bodech nedržel svěřeného rozkazu (čehož se od něho Vaše římské císařské Veličenstvo vůbec nenaděje), přiměl by Vaše římské císařské Veličenstvo, aby ho za spáchaný přečin veřejně potrestalo. U obecného válečného lidu {Kriegsuolck} by mu přitom bylo mnohem větší ctí, kdyby se uloženého rozkazu držel čestně a poctivě; nebude-li však jednat podle svého rozkazu, bude mu to o to více k hanbě a ke zlé škodě. To mu Vaše římské císařské Veličenstvo jako důvěrníkovi nemohlo opomenout s vážností předložit. Vaše římské císařské Veličenstvo mu také ať řekne, že kdyby ho v této věci potkala nějaká obtíž, ať by šlo o cokoli a od kohokoli, nemá se nikoho bát, nýbrž má se kvůli tomu obrátit na Jeho Veličenstvo; k tomu má mít volný přístup, bude milostivě vyslechnut a obdrží milostivou odpověď a poučení.
- typ: odstavec
  de: |-
    Wolt er aber für jre Maiestat nicht selbst kommen/ das etwan die handelung nicht so wichtig were/ so soll er Ewer Römischen Keyserlichen Maiestat Kriegsräth darumb besuchen/ die sollen also den bescheidt haben/ daß sie jm in dem Rath behilfflich sein solten.
  cs: |-
    Nechtěl-li by však předstoupit před Jeho Veličenstvo osobně, protože by věc snad nebyla tak závažná, má se s tím obrátit na válečné rady {Kriegsräth} Vašeho římského císařského Veličenstva; ti mají mít pokyn, aby mu radou pomohli.
- typ: odstavec
  de: |-
    Weitter so sicht vnns für gůt an/ so die Prouiant daussen inn den Landen bestellet/ vnd in das Leger geschafft werden solle/ das durch etliche Personen/ wie ein jedes an denselbigen orten gekaufft/ vnnd in was wert das sein würde/ neben den Commissarien/ so solliches kauffen/ vnd inn das leger bestellen/ dem Prouiantherrn dauon inn das leger bericht zuschicken/ daß er seine Schatzung der Prouiant darauff vberschlagen vnd besetzen kan/ das zu beiden theiln geschehe/ vnnd die Commissarien darüber auch ein Hauptrechnung machten/ vnd zu ende des Zugs darumb jre Rechnung oder bericht jhres bestellens darzů thetten/ vnnd daß der Prouiantherr/ dann auff dasselbig/ auch jhr Schreiben/ so sie jhm zu aller zeit gethon/ auch darbei legen möcht/ vnnd also beide Rechnung bei einander zu vbersehen hetten.
  cs: |-
    Dále se nám zdá dobré, aby v případě, že se proviant {Prouiant} objednává venku v zemi a má se dopravovat do ležení {Leger}, posílaly proviantnímu pánovi {Prouiantherrn} do ležení zprávu některé osoby vedle komisařů {Commissarien}, kteří proviant nakupují a do ležení objednávají: jak se co v těch místech nakoupilo a jakou to bude mít cenu. Proviantní pán si pak podle toho může rozpočítat a stanovit ceny {Schatzung} proviantu. Ať se to děje z obou stran. Komisaři ať o tom vedou i hlavní účet a na konci tažení {Zugs} k němu připojí své vyúčtování či zprávu o tom, co objednali; proviantní pán ať k tomu pak přiloží jejich dopisy, které mu po celou dobu posílali, aby bylo možné oba účty prohlédnout vedle sebe.
