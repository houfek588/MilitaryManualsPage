poznamky:
- n: 1
  text: |-
    Menší mírou se tu rozumí měřice (*Metze*), jak ukazují následující výpočty (achtel = 8 měřic). Achtel o 163 librách odpovídá při libře kolem 0,47 kg zhruba 76 kg obilí; přesná hodnota se podle místa lišila, jak Solms sám připomíná na další straně.
- n: 2
  text: |-
    Tisková chyba: 500 osob spotřebuje za týden 3500 chlebů (500 × 7), jak odpovídá i uvedené váze 70 centů (3500 × 2 libry = 7000 liber) a množství žita (3500 : 90 = 38 achtelů a 7 měřic).
- n: 3
  text: |-
    Tisková chyba: 150000 chlebů dělá 1666 achtelů a 5 měřic (150000 : 90), nikoli 1066. Ostatní čísla výpočtu (váha i obilí) jsou správná; zbytky měřic tisk zaokrouhluje dolů.
