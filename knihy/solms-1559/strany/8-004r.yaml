bloky:
- typ: nadpis
  uroven: 3
  de: |-
    Commis Ordnung/ welcher gestalt ein anzal Kriegßuolck inn einer Besatzung möge erhalten werden/ volgt hernach.
  cs: |-
    Následuje komisní řád {Commis Ordnung}: jakým způsobem lze vydržovat určitý počet válečného lidu {Kriegßuolck} v posádce {Besatzung}.
- typ: odstavec
  de: |-
    Es soll ein ehrlich/ auffrichtig vnd glaubhafftig man zu einem Prouiantherrn geordnet werden/ auch on desselbigen rath/ wissen vnd willen nichts handeln noch endern/ on grosse eillende vnd zůfallende not/ das der Prouiantherr nit zu erlangen were.
  cs: |-
    Za proviantního pána {Prouiantherrn} má být ustanoven čestný, upřímný a důvěryhodný muž. Bez jeho rady, vědomí a vůle se nemá nic jednat ani měnit, leda ve velké, naléhavé a nenadálé nouzi, kdy by proviantní pán nebyl k zastižení.
- typ: odstavec
  de: |-
    Zum ersten wil ich theiln vnnd ordnen die maß vnd schwere des Brots vnd fleysch/ was einem Menschen zu seiner leibs notturfft einen tag zugeordnet soll werden/ deßgleichen die Fütterung auff die Pferdt mit seiner schwere zalle vnd maß.
  cs: |-
    Nejprve chci rozvrhnout a určit míru a váhu chleba a masa, které se mají jednomu člověku přidělit na den k tělesné potřebě, a rovněž píci {Fütterung} pro koně podle její váhy, počtu a míry.
- typ: odstavec
  de: |-
    Item ein maß von Korn oder Treidt wirt in disem Landt ein achtel genant/ ist vngefehrlich vff 163. pfundt angeschlagen/ auch helt diß achtel nach 8 kleiner maß inn sich/ deren eins vngefehrlich 20½. lib. schwer ist. Auß disem achtel werden 90 Brot gebachen/ vnd helt eins an teyg 2 lib. vnd 13 lot/ vnd wann es gebachen ist 2 lib. vnd auß dem kleinen maß bacht mann eilff vnd ein viertheil eins brots.
  cs: |-
    Dále: míra žita {Korn} či obilí se v této zemi nazývá achtel {achtel} a počítá se přibližně na 163 liber {pfundt}. Tento achtel obsahuje 8 menších měr, z nichž každá váží přibližně 20½ libry.[^1] Z tohoto achtelu se upeče 90 chlebů; každý má v těstě 2 libry a 13 lotů {lot} a upečený 2 libry. Z malé míry se upeče jedenáct a čtvrt chleba.
