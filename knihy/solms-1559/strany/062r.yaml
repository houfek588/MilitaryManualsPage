bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    wöllen / daß wir durch vnsere Feinde brechen / so sollen jr euch auff die rechten oder lincken seitten wenden / daselbst wöllen wir vns samlen / vnd wo es die notturfft erfordert / wider daran / Diß möcht noch geschehen / mann hat auch vor jaren spitzige Ordnung vnder den Reuttern gemacht ist aber diser zeit gar daruon kommen.
  cs: |-
    chceme, abychom prorazili skrze naše nepřátele, obraťte se pak na pravou nebo levou stranu. Tam se shromáždíme, a vyžaduje-li to potřeba, opět do nich udeříme.“ To by se mohlo dělat i dnes. Před lety se také u jezdců {Reuttern} stavěl klínovitý šik {Ordnung}, v nynější době se však od toho zcela upustilo.
- typ: odstavec
  de: |-
    Etlich Hauptleut haben auch kurtzlich angefangen / vnnd einen für den fanen geordnet / vnd dem Fendrich auff den fanen zu warten befolhen / das ist nicht recht / auch nimmer mehr gůt / angesehen / wann derselbig flüchtig würde / můst der Fendrich auch fliehen / vnd hett der gestalt / das gantz geschwader zufliehen fug / Zum andern / were der Fendrich mit seinen hauffen auff einen Man bescheiden / der kein zeichen hett / Zum dritten / soll ein Hauptman keinen Fendrich nemen / er wisse dann was einem Fendrich gebürt / vnd sein nit allein die geordneten Reutter / sonder auch der Hauptman selbst dermassen auff jn zu warten schuldig / wann der Hauptman vnd die vordersten nit zu rechter zeit treffen oder hindersich weichen wolten / alßdann soll der Fendrich durch sein eigen Ordnung brechen / vnd gegen Feinden darwider stehen / welcher dem Fendrich da nicht folget / er sei hauptman oder anderer der handelt wider sein ehr / Der jetzt erzelten vrsach / soll allweg ein hauptman dem jenigen der das zeichen fürt / mehr dann einem andern der kein zeichen fürt vertrawen / vnd das zeichen einem verstendigen beuelhen.
  cs: |-
    Někteří hejtmani {Hauptleut} také nedávno začali stavět někoho před korouhev {fanen} a praporečníkovi {Fendrich} přikázali, aby se jím řídil. To není správné a nikdy to nebude dobré: kdyby se totiž ten muž dal na útěk, musel by prchat i praporečník a celá švadrona {geschwader} by tak měla záminku utéci. Za druhé by byl praporečník se svým houfem {hauffen} odkázán na muže, který nenese žádné znamení. Za třetí nemá hejtman brát praporečníka, který neví, co praporečníkovi přísluší. Nejen zařazení jezdci, ale i sám hejtman jsou povinni řídit se jím natolik, že kdyby hejtman a ti vpředu neudeřili v pravý čas nebo chtěli couvnout, má praporečník prorazit vlastním šikem a postavit se nepřátelům; kdo pak praporečníka nenásleduje, ať hejtman, či kdokoli jiný, jedná proti své cti. Z právě uvedené příčiny má hejtman vždy důvěřovat tomu, kdo nese znamení {zeichen}, více než jinému, kdo je nenese, a svěřovat znamení muži rozumnému.
- typ: odstavec
  de: |-
    Die fendrich sollen gůt acht haben auff jhre fanen / vnd im Leger nit weit daruon sein / damit er im lermen der erst auff seie / so künden sich seine Reutter bei jme samlen / vnnd wann er jhr bedorfft ein zimbliche Summa hett / soll er gemach dem Lermen platz zurücken / als dann eilen jm die Reutter desto balder nach / vnd wann der Hauptman noch sein Leuttenant nit vorhanden weren / soll es der Fenderich dannoch also handeln / wann aber der Hauptman inn seinem Losament ist / soll er sein ein weil warten.
  cs: |-
    Praporečníci mají dobře dbát na své korouhve a v ležení {Leger} se od nich nevzdalovat, aby byl praporečník při poplachu {lermen} první na nohou; tak se u něho mohou shromáždit jeho jezdci. Jakmile jich bude mít, kolik potřebuje, v slušném počtu, má pozvolna postupovat k poplachovému místu; jezdci za ním pak tím rychleji přispěchají. A nebyl-li by přítomen hejtman ani jeho poručík {Leuttenant}, má praporečník {Fenderich} přesto jednat takto; je-li však hejtman ve svém ubytování {Losament}, má na něj chvíli počkat.
- typ: odstavec
  de: |-
    Ein jeder Fendrich soll alle mal wann sich ein leger verendert / wohin er in lermen rücken sol / bei dem Obersten oder Feldmarschelck erkündigen / wiewol der lermen Platz alweg bei dem Geschütz ist / werden doch etliche Reutter vnd Knecht / anderer enden im leger / dann auff dem lermenplatz zuhalten vnnd zustehen / geordnet / ob die Feinde hinden oder auff der seitten in das leger fallen wolten / solliches zuuerhüten.
  cs: |-
    Každý praporečník se má pokaždé, když se ležení přesune, zeptat plukovníka {Obersten} nebo polního maršálka {Feldmarschelck}[^1], kam má při poplachu vyrazit. Poplachové místo je sice vždy u děl {Geschütz}, přesto jsou však někteří jezdci a knechti {Knecht} určeni stát a držet se na jiných místech ležení než na poplachovém místě, aby se zamezilo vpádu nepřátel do ležení zezadu nebo z boku.
poznamky:
- n: 1
  text: |-
    V tisku „Feldmarschelck“ (ověřeno ve skenu) místo obvyklého *Feldmarschalck*.
