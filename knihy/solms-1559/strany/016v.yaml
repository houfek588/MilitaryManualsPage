bloky:
- typ: odstavec
  de: |-
    In einem sollichen angezeigten Leger bei den Feinden / soll gar ernstliche / starcke wacht gehalten werden / damit der vberfall nacht vnd tag / wo die Feinde denselbigen zuthůn / vnderstehn wolten / verhüttet / vnd sie desselben bei zeit innen würden / da soll der Feldmarschalck / vnd der Oberst vber das Fußuolck / ob den Wachtmeistern zu roß vnd fuß sein / daß sie die wacht allenthalben nottürfftig besetzen / damit niemand in der kein farlessigkeit gebrauche / sie sollen auch offt sampt den Wachtmeistern bei tag vnd nacht selbst darzů sehen / mancher Oberster sicht auch selbst dazů / wo jemand wer / der wehr an der wacht mangelhafftig odder schlaffend gefunden würde / auch ob jemand der wachen solt / in seinem Losament blieb / vor der abwechßlung von der Wacht züge / oder die Reyssigen von den Pferden abstünden / die Wächter mit einander palgten / oder sich in andere weg / wie sichs gebürt / auff der Wacht nicht recht hielten / weil dann solche mißhandlung nimmer mehr / oder doch selten one sorg odder nachtheil des Kriegsuolck im Leger geschehen / so soll der Oberst dieselbigen vrsächer / es seien Wachtmeister oder Wächter / nach gestalt der handlung / an leib / leben / ehr vnd gůt vngestraffet nicht lassen / angesehen / das alles Kriegsuolck im Leger an den Wächtern ligt. Vnd wann der ober Feldhauptman (wie er schuldig ist) die Wacht / so er nahe bei den Feinden leidt / selbst etwan besichtiget / damit macht er sorgfeltige Wachtmeister vnnd Wächter / zu dem wann der Oberst zu den Feinden kompt / es sei im Feld oder vor einer besatzung / so gehet sein arbeit an / vnd soll er alßdann alles das jhm gebürt / durch sich eigner person verrichten / daß er sonst / wann er weit von den Feinden zeucht oder leit durch seinen Leutenant / Feldmarschalck / vnnd andere hohen ämpter versehen mag.
  cs: |-
    V takovém výše popsaném ležení {Leger} u nepřátel se má držet nanejvýš přísná a silná stráž {wacht}, aby se předešlo přepadu ve dne i v noci, kdyby se o něj nepřátelé chtěli pokusit, a aby se o něm včas dozvěděli; tehdy mají polní maršálek {Feldmarschalck} a plukovník {Oberst} nad pěchotou {Fußuolck} dohlížet na vachmistry {Wachtmeistern} jízdy i pěchoty, aby všude dostatečně obsazovali stráže a nikdo v tom nejednal nedbale. Mají také často spolu s vachmistry ve dne i v noci sami na stráže dohlížet (nejeden plukovník tak činí i osobně) a zjišťovat, zda někdo není na stráži bez náležité zbraně nebo není přistižen ve spánku, či zda někdo, kdo má držet stráž, nezůstal ve svém ubytování {Losament}, neodešel ze stráže před vystřídáním, anebo zda jezdci {Reyssigen} nesesedli z koní, zda se strážní spolu nepoprali nebo se jinak na stráži nechovali tak, jak se sluší. Poněvadž se taková provinění nikdy – anebo jen zřídka – nestanou bez nebezpečí či újmy pro válečný lid {Kriegsuolck} v ležení, nemá plukovník ponechat jejich původce, ať jsou to vachmistři nebo strážní, podle povahy činu bez trestu na těle, na životě, na cti ani na statku, neboť na strážných spočívá bezpečnost veškerého válečného lidu v ležení. A když nejvyšší polní hejtman {ober Feldhauptman}, jak je jeho povinností, někdy sám prohlíží stráže, leží-li blízko nepřátel, činí tím vachmistry a strážné ostražitými. Nadto jakmile se plukovník přiblíží k nepřátelům, ať v poli nebo před nějakou posádkou {besatzung}, začíná jeho pravá práce: tehdy má vše, co mu náleží, vykonávat vlastní osobou, kdežto jinak, když táhne nebo leží daleko od nepřátel, to může obstarat skrze svého poručíka {Leutenant}, polního maršálka a ostatní vysoké úředníky.
- typ: odstavec
  de: |-
    Der Oberst gibt allein die Losung / auch soll er vnd die andern / so sie wissen müssen / gantz still vnd verschwigen mit vmb gehn / dann wann die Feind der Losung erfarung bekomen / mag bald vnd leichtlich ein gantz Leger dardurch geschlagen werden / wie auch vor langest darzů bei menschen gedencken geschehen ist / derwegen soll auch der Oberst denen / so die Losung billich wissen sollen / durch keine liederliche noch leichfertige person anzeigen lassen.
  cs: |-
    Plukovník udílí heslo {Losung} sám a jak on, tak i ostatní, kteří ho musejí znát, s ním mají nakládat zcela tiše a mlčenlivě; neboť jakmile se nepřátelé o heslu dozvědí, může být celé ležení snadno a rychle poraženo, jak se to stalo už dávno i za lidské paměti. Proto ho plukovník nemá dávat oznamovat těm, kdo ho mají po právu znát, skrze nějakou lehkomyslnou či nespolehlivou osobu.
- typ: odstavec
  de: |-
    Etliche Obersten lassen die Losung auff der Wacht niemands / dann den Hauptleuten / vnd denen die auff der Schiltwacht halten vnd stehn / anzeigen / oder etliche obersten die lassen die losung nur allein den Hauptleuten / die mit jhrem Kriegsuolck / zu roß vnd fuß wachen / wissen / vnd tragen sich die handlungen offt vff der wacht dermassen zů /
  cs: |-
    Někteří plukovníci nedávají oznamovat heslo na stráži nikomu jinému než hejtmanům {Hauptleuten} a těm, kdo stojí a drží stálou stráž {Schiltwacht}; jiní plukovníci zase dávají heslo znát pouze hejtmanům, kteří se svým válečným lidem na koních i pěšky drží stráž; a události na stráži se často vyvinou tak,
