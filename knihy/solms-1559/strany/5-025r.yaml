bloky:
- typ: nadpis
  uroven: 2
  de: Das acht Blochauß.
  cs: Osmý srub.
- typ: odstavec
  de: |-
    Diß ist ein Haupt groß geuierdtes Blochhauß mit vier außgefürten Pasteien vnd Stendten zum Geschütz/ solche Stendte bringen jhre Streichen vor dem Hauptblochauß auff alle vier orten mit sich/ vnd ist der auß vnd eingang/ derselbig ist ein durchbroch/ vnd auff zwen weg/ solches groß Blochauß verzeichnet die ein seite als wann sie im Wasser/ vnd die ander halb seit auff truckem Landt lege/ daß mann also zu beiden theiln brauchen mag.
  cs: |-
    Toto je hlavní veliký čtverhranný srub {Blochhauß} se čtyřmi vysunutými baštami {Pasteien} a stanovišti pro děla {Geschütz}; tato stanoviště mají s sebou své boční obrany {Streichen} před hlavním srubem na všech čtyřech stranách. Východ a vchod tvoří průchod skrz [srub], a to na dvě strany. Tento veliký srub je zakreslen tak, jako by jednou stranou ležel ve vodě a druhou polovinou na suché zemi, aby se dal použít obojím způsobem.[^1]
poznamky:
- n: 1
  text: |-
    Vyobrazení je na předchozím rozkládacím listu [[5-024v|5-024v]]; levá polovina srubu tam stojí na souši, pravá ve vodě.
