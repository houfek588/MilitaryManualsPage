bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Feldhauptman antworten / da wöllen wir dir sagen wie du gehandelt hast / Dise meinung mögen die Wachtmeister / nit allein den Hauptleuten / sonder einem jeden der nit wachen wolte / vnd an jhm wehre / anzeigen / dann einer sollichen rechtfertigung wartet keiner gern / angesehen / das einer dardurch vmb sein ehre keme / die wachtmeister sollen auch allweg den Reuttern den platz da sie jrer zu jeder zeit warten sollen / sagen.
  cs: |-
    polním hejtmanem {Feldhauptman} zodpovídat. Tam ti povíme, jak jsi jednal.“ Toto varování mohou vachmistři {Wachtmeister} oznámit nejen hejtmanům {Hauptleuten}, ale každému, kdo by nechtěl držet stráž, ačkoli je na něm řada. Takového pohnání k odpovědnosti se totiž nikdo nedočká rád, neboť by tím mohl přijít o svou čest. Vachmistři mají také jezdcům {Reuttern} vždy určit místo, kde na ně mají jezdci v kteroukoli dobu čekat.
- typ: odstavec
  de: |-
    Wann mann nit mit den fanen wacht / mag ein jeder vom Adel seinen Bůben mit einem hengst im leger lassen / aber kein knecht er sei dann kranck oder das Roß / sonst soll sich der wachtmeister an kein entschuldigung keren / sie sollen auch den Wächtern zu Roß / kein feur zumachen gestatten.
  cs: |-
    Když se nedrží stráž s korouhvemi {fanen}, smí každý šlechtic ponechat v ležení {leger} své pachole {Bůben} s jedním hřebcem, nikoli však čeledína {knecht}, ledaže by byl nemocný on nebo jeho kůň; jinak se vachmistr nemá ohlížet na žádnou výmluvu. Jízdním strážným také nemají vachmistři dovolit rozdělávat oheň.
- typ: odstavec
  de: |-
    Wann vil Kriegsuolck in einem Leger ist / hat mann etwan zu roß vier Wachmeister / ists wenig zwen / wann aber die Christenheit ein zug widern Türcken wolt thůn / da bedarff mann von wegen vilerlei Sprachen / die daselbst zusamen komen wurden / vil Wachtmeister / es versehen auch vnderweilen zwo oder vier personen beide Wachtmeister vnd Quartiermeister ampter.
  cs: |-
    Je-li v jednom ležení mnoho válečného lidu {Kriegsuolck}, mívá jízda někdy čtyři vachmistry, je-li ho málo, tedy dva. Kdyby však křesťanstvo chtělo podniknout tažení {zug} proti Turkům {Türcken}, bylo by kvůli mnoha jazykům, které by se tam sešly, zapotřebí mnoha vachmistrů. Někdy také dvě nebo čtyři osoby zastávají oba úřady, vachmistrovský i kvartýrmistrovský {Quartiermeister}.
- typ: odstavec
  de: |-
    Wann ein Kriegsuolck in der Wagenburg ligt / so hat es aber ein besondere meinung / mit der Wacht / wann die feinde Christen sind / als Teutsche / Spanier / Frantzosen / Italianer / Engellender / Dennmarcker / Schotten / Schweden vnd Norweden / die dann schwer Rüstung vnd vil fuß volck haben / als dann sollen die Wachtmeister die Wacht zimlich weit von der Wagenburg lassen halten / in ansehung / daß die wächter der schwere Rüstung vnnd fuß Volck wol entrinnen mögen / sonst were es sorglich / wann ein schwere Rüstung mit einem starcken Kriegsuolck zu fuß vngewarnet nahe zu der Wagenburg köme / dann das fuß volck wurff die Wägen vmb / vnd fiellen in das Leger / vnd möchten als dann jren willen schaffen.
  cs: |-
    Leží-li však válečný lid ve vozové hradbě {Wagenburg}, platí pro stráž {Wacht} opět zvláštní pořádek. Jsou-li nepřáteli křesťané – Němci, Španělé {Spanier}, Francouzi, Italové, Angličané, Dánové, Skotové, Švédové a Norové {Norweden} –, kteří mají těžkou zbroj {Rüstung} a mnoho pěchoty {fuß Volck}, mají vachmistři nechat stráž stát poměrně daleko od vozové hradby, aby strážní mohli těžkooděncům a pěchotě snadno ujet. Jinak by bylo nebezpečné, kdyby se těžkooděnci se silným pěším vojskem nepozorovaně přiblížili k vozové hradbě: pěchota by vozy převrhla, vpadla do ležení a mohla by si pak dělat, co by chtěla.
- typ: odstavec
  de: |-
    Sein aber die feinde wider die Wagenburg / Türcken / Tatern / Reuschen / Muscabiter / Poln / Retzen / Stradioten / Hungerischen / Wendische / Crabatischen / vnd Hussern / so sollen die Wachtmeister die wächter nit weit von der wagenburg halten lassen / sie mögen sonst nit entreiten / dann die obbestimpten Völcker haben eitel ring Roß vnd wenig fuß volck / vnd wann mann die wagenburg wider dise Völcker inwendig allenthalben mit wächtern zu fuß besetzt / die mögen allweg auffhalten / biß das Kriegsuolck zusamen kompt / dann sie verlassen jre pferde nit gern / daß sie von jnen fiellen / vnd die wagen vmbwurffen / oder auß dem weg schleifften.
  cs: |-
    Útočí-li však na vozovou hradbu Turci, Tataři, Rusové, Moskvané {Muscabiter}, Poláci, Rácové, stradioti, Uhři {Hungerischen}, Vendové, Chorvati a husaři[^1], mají vachmistři nechat strážné stát nedaleko vozové hradby, jinak by nemohli včas ujet. Uvedené národy totiž mají samé lehké koně {ring Roß} a málo pěchoty. Obsadí-li se proti nim vozová hradba zevnitř všude pěšími strážnými, dokážou útočníky vždy zdržet, dokud se válečný lid neshromáždí; tito nepřátelé totiž neradi opouštějí své koně, aby z nich sesedli a vozy převraceli nebo je odtahovali z cesty.
poznamky:
- n: 1
  text: |-
    Výčet východních a jihovýchodních národů a lehkých jezdců: *Reuschen* = Rusové (Rusíni), *Muscabiter* = Moskvané, *Retzen* = Rácové (Srbové), *Stradioten* = stradioti (lehcí balkánští či benátští jezdci), *Wendische* = Vendové (Slované z alpských či lužických krajů), *Crabatischen* = Chorvati, *Hussern* = husaři.
