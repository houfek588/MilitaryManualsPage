bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    sollen/ auch werden die Hauptleut das jenig helffen thůn/ so sie geraten/ dann wann es durch andere so nicht inn dem Krieg geraten worden were.
  cs: |-
    mají dobře mít na pozoru. Také hejtmani {Hauptleut} spíše pomohou vykonat to, co sami poradili, než kdyby to radili jiní, kteří se války neúčastní.
- typ: odstavec
  de: |-
    Auch Herr möcht jhr wol einen Krieg anfangen durch anderer Leuten bewegnuß vnnd klag dann ewer selbst/ nemlich wider die Vnglaubigen vnnd der Christenheit Feinde/ welliche vrsach des Kriegs jhr zu aller zeit inn ewerm Hertzen haben solt/ darmit jhr die vberwinden/ so der Christenheit vil Landt vnnd auch leut abgewunnen haben/ vnnd sich sollichs vbels gebrauchen/ auch dieselbigen widerumb zu dem Christlichen glauben bringen/ dann wann jhr wisset was für marter vnd pein die armen Christen so in frembden landen/ welliche den Vnglaubigen vnderworffen seind/ leiden müssen/ würden sie auch erbarmen welche täglich Gott vmb gnad vnd hilff anrůffen/ Gedenckt daß es nicht ein kleiner Gottes dienst ist/ solliche von jrer Gefengnuß erledigen/ dann ich weiß vnnd habe sie gesehen in jhrer gefengnuß/ vnnd wann ein Fürst were der jnen zu hilff wolt kommen/ würd er mehr dann fünfftausent Christlicher Mäner/ vnd den mehrer theil zu roß finden/ die jhm beistehen würden/ welche so wol gerüst seind als die Türcken/ Ich zeige euch solches mit fleiß an/ dann wann jhr willens weren einen Zug wider die Vnglaubigen anzunemen/ erbiet ich mich euch zu dienen/ dann ich von hertzen gern wolt das glück haben inn dem dienst Gottes zusterben/ so ferr jhr es aber in kurtzer zeit/ ewer anderen obligenden geschefften halben nicht thůn kündet/ solt jhr doch stettig den willen darzů haben/ vnd wann jhr vermeinet/ daß es euch gelegen sein wirdt/ solt jhr andere Christliche König/ Fürsten vnnd Herren darzů vermügen/ wann jhr anderst allein nicht mechtig gnůg seind/ daß sie euch hilff thůn.
  cs: |-
    Také, pane, můžete začít válku spíše z podnětu a na stížnost jiných lidí než kvůli sobě samému, totiž proti nevěřícím a nepřátelům křesťanstva. Tuto příčinu války máte mít v srdci po všechen čas, abyste přemohl ty, kdo křesťanstvu odňali mnoho zemí i lidí a dopouštějí se takového zla, a abyste ty [země a lidi] opět přivedl ke křesťanské víře. Kdybyste totiž věděl, jaká muka a trápení musejí snášet ubozí křesťané v cizích zemích, kteří jsou poddáni nevěřícím a denně vzývají Boha o milost a pomoc, pohnulo by vás to k soucitu. Pomyslete, že není malou službou Bohu vysvobodit je z jejich zajetí. Vím o nich a viděl jsem je v jejich zajetí; a kdyby se našel kníže, který by jim chtěl přijít na pomoc, našel by víc než pět tisíc křesťanských mužů, většinou jezdců, kteří by při něm stáli a jsou vyzbrojeni stejně dobře jako Turci {Türcken}.[^1] Upozorňuji vás na to schválně: kdybyste totiž měl v úmyslu podniknout tažení {Zug} proti nevěřícím, nabízím vám své služby, neboť bych si ze srdce přál mít to štěstí zemřít ve službě Boží. Nemůžete-li to však pro své jiné naléhavé záležitosti učinit v krátké době, máte k tomu přece stále mít vůli. A až usoudíte, že je k tomu vhodná chvíle, máte, nejste-li sám dost mocný, pohnout jiné křesťanské krále, knížata a pány, aby vám pomohli.
- typ: odstavec
  de: |-
    Zum andern/ wann jhr Freunde habt die einen Krieg füren/ vnd euch vmb hilff ansuchen/ wann jhr dann vermeint sie haben ein gůt billiche sach/ solt jhr jnen helffen nicht weniger dann jhr gern hett gethan/ wann jhr auch jhrer nottürfftig weret/ So sie aber ein böse sach füren/ seit jhr schuldig jnen solliches anzuzeigen/ vnnd fleiß haben sie mit jhrer widerparthei zuuergleichen/ dann mit Gott vnnd vernunfft kündet jhr jhnen nicht beistehen/ es sei dann sach daß jhr ein bündnuß habt einer dem andern zu helffen/ es sei in was sachen es wöl/ seit jr schuldig jnen hilff zuschicken.
  cs: |-
    Za druhé: máte-li přátele, kteří vedou válku a žádají vás o pomoc, a soudíte-li, že mají dobrou a spravedlivou věc, máte jim pomoci neméně, než byste si přál, aby pomohli oni vám, kdybyste je potřeboval. Vedou-li však špatnou věc, jste povinen jim to oznámit a snažit se je s jejich protivníkem smířit; s Bohem a rozumem byste jim totiž pomáhat nemohl. Leda byste s nimi měl spolek, že si budete navzájem pomáhat v jakékoli věci; pak jste povinen poslat jim pomoc.
- typ: odstavec
  de: |-
    Auch Herr wann einer ewern Eltern vnd Blůtßuerwanden gewalt vnd vnrecht thůt seit jhr schuldig jhnen zu helffen/ Dann vnser Herr Gott beuilcht/ Es soll ein jeder seinen Nechsten lieb haben wie
  cs: |-
    Také, pane, činí-li někdo násilí a bezpráví vašim rodičům a pokrevním příbuzným, jste povinen jim pomoci. Pán Bůh totiž přikazuje, že každý má milovat svého bližního jako
poznamky:
- n: 1
  text: |-
    Filip Klévský se roku 1501 účastnil francouzsko-benátské námořní výpravy proti Turkům na Lesbos (Mytilénu); odtud zřejmě jeho osobní zkušenost se zajatými křesťany ve východním Středomoří.
