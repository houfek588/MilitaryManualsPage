stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    liegen/ alzeit so mann ein stück darauff nageln wirdt verbichen/ vñ die Rörn also in das weich Bech eindurcken/ vñ oben wider vergiessen/ darnach oben mit einem Bret auff das warm Bech zunageln/ dañ kan kein Wasser darbei komen/ Wie dise Figur vnder dem K. gerissen/ weiset vnd bericht gibt/ vnnd also mag mann die Kasten so lang machen/ als mann bretter haben mag/ vnd als eins für das ander gelegt vnd verfast biß mann herauß kompt. Weitter mit der Figur so vnder diser verzeichnet/ sind gleich fals so lang ledern Rörn/ wie die hieuorn gewesen sind/ vnd darzwischen sind kurtz hölzern Rörlein einer elen lang gedrehet/ vnnd sind also die hölzern vnnd ledern gemacht daß man eine in die ander stecken kan/ doch sollen die ledern Rörn lang in einander/ vnd darzwischen vberlangs ein hölze rörn mit eingesteckt werden/ vnd dieselbig hölzene rör soll inn der mit ein loch haben eins daumen dick/ vnnd darinn ein Zeplein gedrehet wie an einem Weinfaß/ das mann darinn stecke/ zu mache vnnd auffthů wan man will/ Solche hölzen vnd ledern rörn sind darzu verordnet/ wann mann ein Festung vndergraben vnd sprengen will/ kompt es offt daß mann ferr grebt/ daß kein lufft oder windt darinn ist/ vnnd das die Gräber nit mehr lufft haben/ daß sie darinn bleiben künden/ auch kein liecht darinn mehr brennen will/ daß mann hinauß inn anfang der Grafft windfecht machen muß/ die die lufft vnd Windt hinein treiben/ damit die arbeiter vnd Liecht darinn bleiben mögen wie mann auff den Bergwercken den brauch hat/ vnd an statt derselbigen Windtfechten mag mann dise Rörn von ledern vnd holtz inn den stollen oder Grafft/ so ferr es die notturfft hinhinder erfordert hinein legen/ vnd forn einen doppeln Blaßbalg an die Rörn legen/ vnd den Windt mit solchem Blaßbalck durch die Rörn hindersich hinein in stollen treiben/ so mag mann in den hölzen Rörn nach gelegenheit ein zapffen vil oder wenig außziehen/ damit das es allenthalben in den stollen lufft gebe/ wie die Figur die Rörn in der grafft vnd den Blasßbalg hieauß in der schantzen oder form loch weist vnnd zeigt/ mit solchem windtreiben muß maß gehalten werden/ mit vil oder wenig hinein treiben/ wie die notturfft erfordert/ vnd die Bergknappen das verstehn vnd zu brauchen wissen.
  cs: |-
    leží, vždy při přibíjení každého dílu zasmolit, trubice do té měkké smůly {Bech} zatlačit, shora je znovu zalít a pak shora na tu teplou smůlu přitlouci prknem – pak se k nim nedostane žádná voda, jak ukazuje a vykládá tento obrázek narýsovaný pod `K`. Tak lze žlaby udělat tak dlouhé, jak dlouhá prkna máš, a přikládat a spojovat jeden za druhým, až se vyjde ven. Dále na vyobrazení nakresleném pod tímto jsou stejně tak dlouhé kožené trubice jako ty předešlé a mezi nimi jsou krátké dřevěné trubičky vysoustružené na délku jednoho lokte {Elen}; dřevěné i kožené jsou udělány tak, že se dají zastrčit jedna do druhé, avšak kožené trubice se mají zasouvat dlouze do sebe a mezi ně se po délce vsadí dřevěná trubka. Tato dřevěná trubka má mít uprostřed otvor na tloušťku palce a v něm vysoustružený čep jako u vinného sudu, který se tam zastrčí, aby se podle potřeby zavřel a otevřel. Takové dřevěné a kožené trubice jsou určeny k tomu, že když chce člověk podkopat a vyhodit {Festung}, často se stává, že se kope daleko, až uvnitř není žádný vzduch ani průvan, kopáči nemají dost vzduchu, aby tam vydrželi, a ani světlo už nechce hořet – takže se venku u ústí podkopu musejí zřizovat větrníky {windfecht}, jež vhánějí vzduch a vítr dovnitř, aby dělníci i světla mohli zůstat uvnitř, jak je zvykem v dolech {Bergwerck}. Místo takových větrníků lze tedy do štoly {Stollen} či podkopu položit tak daleko dozadu, jak vyžaduje potřeba, tyto kožené a dřevěné trubice a vpředu k trubici přiložit dvojitý měch {Blaßbalg}, kterým se vzduch vhání skrze trubice dozadu do štoly; v dřevěných trubkách pak lze podle potřeby čep povytáhnout hodně nebo málo, aby se vzduch rozváděl všude po štole, jak obrázek ukazuje trubice v chodbě a měch zde venku v zákopu či u ústí. Při takovém vhánění vzduchu jest třeba zachovávat míru a vhánět mnoho či málo podle toho, jak žádá potřeba a jak tomu rozumějí a umějí s tím zacházet horníci {Bergknappen}.
- typ: odstavec
  de: |-
    Solche rüstung soll allzeit in einem Zeughausß des geschütz bei anderm vorrat vnd Rüstung auff die notturfft/ vnd dem Artolorei oder Zeugmeister in seiner verwaltung beuolhen sein/ wie man das finden wirt in dem Bůch vnd in der Beschreibung/ von der Artolorei des zeugs verweltung vnd Regirung.
  cs: |-
    Takovéto vybavení {Rüstung} má být vždy ve zbrojnici {Zeughauß} dělostřelectva při ostatních zásobách a nářadí pro případ potřeby a má být svěřeno do správy mistra artilerie {Artolorei} či zbrojmistra {Zeugmeister}, jak se o tom dočteme v knize a popisu o správě a řízení výzbroje artilerie.
