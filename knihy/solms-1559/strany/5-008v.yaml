list: 8 (5. kniha)
strana: verso
sken: 452
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    liegen/ alzeit so mann ein stück darauff nageln wirdt verbichen/ vnd die Rörn also in das weich Bech eindurcken/ vnd oben wider vergiessen/ darnach oben mit einem Bret auff das warm Bech zunageln/ dann kan kein Wasser darbei komen/ Wie dise Figur vnder dem K. gerissen/ weiset vnd bericht gibt/ vnnd also mag mann die Kasten so lang machen/ als mann bretter haben mag/ vnd als eins für das ander gelegt vnd verfast biß mann herauß kompt. Weitter mit der Figur so vnder diser verzeichnet/ sind gleich fals so lang ledern Rörn/ wie die hieuorn gewesen sind/ vnd darzwischen sind kurtz höltzern Rörlein einer elen lang gedrehet/ vnnd sind also die höltzern vnnd ledern gemacht daß man eine in die ander stecken kan/ doch sollen die ledern Rörn lang in einander/ vnd darzwischen vberlangs ein höltze rörn mit eingesteckt werden/ vnd dieselbig höltzene rör soll inn der mit ein loch haben eins daumen dick/ vnnd darinn ein Zeplein gedrehet wie an einem Weinfaß/ das mann darinn stecke/ zu mache vnnd auffthů wan man will/ Solche höltzen vnd ledern rörn sind darzu verordnet/ wann mann ein Festung vndergraben vnd sprengen will/ kompt es offt daß mann ferr grebt/ daß kein lufft oder windt darinn ist/ vnnd das die Gräber nit mehr lufft haben/ daß sie darinn bleiben künden/ auch kein liecht darinn mehr brennen will/ daß mann hinauß inn anfang der Grafft windfecht machen muß/ die die lufft vnd Windt hinein treiben/ damit die arbeiter vnd Liecht darinn bleiben mögen wie mann auff den Bergwercken den brauch hat/ vnd an statt derselbigen Windtfechten mag mann dise Rörn von ledern vnd holtz inn den stollen oder Grafft/ so ferr es die notturfft hinhinder erfordert hinein legen/ vnd forn einen doppeln Blaßbalg an die Rörn legen/ vnd den Windt mit solchem Blaßbalck durch die Rörn hindersich hinein in stollen treiben/ so mag mann in den höltzen Rörn nach gelegenheit ein zapffen vil oder wenig außziehen/ damit das es allenthalben in den stollen lufft gebe/ wie die Figur die Rörn in der grafft vnd den Blaßbalg hieauß in der schantzen oder form loch weist vnnd zeigt/ mit solchem windtreiben muß maß gehalten werden/ mit vil oder wenig hinein treiben/ wie die notturfft erfordert/ vnd die Bergknappen das verstehn vnd zu brauchen wissen.
  cs: |-
    leží, při přibíjení každého dílu vždy zasmolit, trubice zatlačit do měkké smůly {Bech}, shora je znovu zalít a pak na teplou smůlu přitlouci prkno – pak se k nim nedostane žádná voda, jak ukazuje a vykládá obrázek narýsovaný pod `K`. Tak lze žlaby {Kasten} udělat tak dlouhé, kolik je prken, a přikládat a spojovat jeden za druhým, až se vyjde ven. Dále jsou na vyobrazení nakresleném pod tímto stejně dlouhé kožené trubice jako ty předešlé a mezi nimi krátké soustružené dřevěné trubičky, dlouhé jeden loket {elen}; dřevěné i kožené jsou udělány tak, že se dají zastrčit jedna do druhé. Kožené trubice se však mají zasouvat dlouze do sebe a mezi ně se po délce vsadí dřevěná trubka. Ta má mít uprostřed otvor na tloušťku palce a v něm vysoustružený čep {Zeplein} jako u vinného sudu, který se tam zastrčí, aby se dal podle libosti zavřít a otevřít. Takové dřevěné a kožené trubice jsou určeny k tomuto: když se má podkopat a vyhodit pevnost {Festung}, stává se často, že se kope daleko, až uvnitř není žádný vzduch ani průvan; kopáči pak nemají dost vzduchu, aby tam vydrželi, a ani světlo už nechce hořet. Proto se venku u ústí chodby {Grafft} musejí zřídit větrníky {windfecht}, které vhánějí vzduch a vítr dovnitř, aby dělníci i světla mohli zůstat uvnitř, jak je zvykem v dolech {Bergwercken}. Místo takových větrníků lze do štoly či chodby položit, tak daleko dozadu, jak potřeba žádá, tyto trubice z kůže a dřeva, vpředu k nim přiložit dvojitý měch {Blaßbalg} a jím vhánět vzduch trubicemi dozadu do štoly {stollen}. V dřevěných trubkách pak lze podle potřeby čep vytáhnout víc či méně, aby se vzduch dostal do celé štoly – jak obrázek ukazuje trubice v chodbě a měch tady venku v šanci {schantzen} či u ústí. Při takovém vhánění vzduchu je třeba zachovávat míru a vhánět víc či méně, jak žádá potřeba a jak tomu rozumějí a umějí s tím zacházet horníci {Bergknappen}.
- typ: odstavec
  de: |-
    Solche rüstung soll allzeit in einem Zeughauß des geschütz bei anderm vorrat vnd Rüstung auff die notturfft/ vnd dem Artolorei oder Zeugmeister in seiner verwaltung beuolhen sein/ wie man das finden wirt in dem Bůch vnd in der Beschreibung/ von der Artolorei des zeugs verweltung vnd Regirung.
  cs: |-
    Takové vybavení {rüstung} má být pro potřebu vždy ve zbrojnici {Zeughauß} dělostřelectva při ostatních zásobách a výbavě a má být svěřeno do správy mistra dělostřelectva {Artolorei} či zbrojmistra {Zeugmeister}, jak se o tom lze dočíst v knize a popisu o správě a řízení dělostřeleckého materiálu {zeugs}.
