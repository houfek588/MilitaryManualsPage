list: 12 (5. kniha)
strana: verso
sken: 460
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Kriegßgebrauch vnd gůter Röstung were/ Nemlich zum ersten auff ein reisigen Zeug von der Muscen Rüstung 100000. Pferdt.
  cs: |-
    válečných zvyklostech a v dobré zbroji: totiž předně na jízdu {reisigen Zeug} v moskevské výzbroji o 100 000 koních {Pferdt}.[^1]
- typ: odstavec
  de: |-
    Zum andern auff 6000. pferdt Teutsche Röstung/ schwere vnd geringen pferdt.
  cs: Za druhé na 6 000 koní v německé výzbroji, těžkých i lehkých.
- typ: odstavec
  de: |-
    Zum dritten auff 100. Fendlein Teutsches Fußuolck mit jren vnd anderer Landen Röstung.
  cs: |-
    Za třetí na 100 praporců {Fendlein} německé pěchoty {Fußuolck} s její vlastní výzbrojí i s výzbrojí jiných zemí.
- typ: odstavec
  de: |-
    Zum vierdten/ dann ein geordnet gewaltig Brechgeschütz mit namen der gattung oder sorten vnd aller jrer zůgehörigen Rüstung beschreiben/ vnd in ein ordenliche recht Rechnung stellen.
  cs: |-
    Za čtvrté pak popsat uspořádaná mohutná průlomová děla {Brechgeschütz} s názvy jejich druhů neboli ráží a se vší příslušnou výbavou {Rüstung} a sestavit z toho řádný a správný rozpočet.
- typ: odstavec
  de: |-
    Zum fünfften/ dergleichen ein geordnet Veldgeschütz/ so vil inn das Veld zuschlagen von nöten zu solchem Volck sein wil/ auch alles mit namen der stück oder Sorten benant/ vnnd mit aller jhrer zůgehörender Röstung/ alles auch beschreiben/ vnd gleich dem andern wie hieuorn gemelt/ in rechnung stellen.
  cs: |-
    Za páté stejně tak uspořádaná polní děla {Veldgeschütz}, kolik jich je pro takové vojsko třeba vyvézt do pole; i ta vše popsat s názvy kusů či ráží a se vší příslušnou výbavou a stejně jako předchozí, jak bylo výše řečeno, sestavit do rozpočtu.
- typ: odstavec
  de: |-
    Zum sechsten/ deßgleichen sol darzů geordnet werden ein besonder werck zu Feurwerck/ ob mann mit dem Geschütz mit schiessen einer besatzung nit abbrechen kündt/ daß dann mit dem Feurwerck zu handeln möcht sein/ solches will ich auch mit gůtem bericht in beschreibung bringen.
  cs: |-
    Za šesté se k tomu má rovněž zřídit zvláštní zařízení pro ohňostroje {Feurwerck}: kdyby se posádce {besatzung} nedalo střelbou z děl uškodit, aby bylo možné zasáhnout ohňostroji. I to chci s dobrým vysvětlením popsat.
- typ: odstavec
  de: |-
    Zum sibenden/ ob sichs begebe daß ein besatzung oder befestung der gestalt gelegen were/ daß die zugraben vnd zusprengen würde sein/ wie mann dann damit handeln soll/ auch alles berichtlich inn schrifften stellen vnd anzeigen.
  cs: |-
    Za sedmé: kdyby se stalo, že by nějaká posádka nebo pevnost {befestung} ležela tak, že by ji bylo třeba podkopat a vyhodit do povětří, jak se s tím má zacházet – i to vše srozumitelně sepsat a ukázat.
- typ: odstavec
  de: |-
    Zum achten/ ein Wagenburg zufüren vnd zuschlagen in die wehr zurichten/ mit aller darzů gehörigen Rüstung/ gleichfals in schrifften stellen.
  cs: |-
    Za osmé: jak vést vozovou hradbu {Wagenburg}, postavit ji a zřídit k obraně se vší náležitou výbavou – i to rovněž sepsat.
- typ: odstavec
  de: |-
    Zum neundten/ ein Schiffbrück mit aller jrer zůgehörender Rüstung vnd ordnung auch in schrifften stellen.
  cs: |-
    Za deváté: také lodní most {Schiffbrück} se vší příslušnou výbavou a řádem sepsat.
- typ: odstavec
  de: |-
    Zum zehenden/ auch der Teutschen reisigen gebürender Heerwagen in jre regierung vnd Ordnung nach Teutschem gebrauch stellen.
  cs: |-
    Za desáté: také válečné vozy {Heerwagen}, jaké německé jízdě náležejí, uvést do jejich správy a řádu podle německého obyčeje.
- typ: odstavec
  de: |-
    Nun wil ich vor mich nemen/ die 100000. pferdt des Musce/ vnd in daß veldt in ordnung zu roß vnd fuß/ mit sampt dem Teutschen Christlichen Kriegßuolck/ vnd ein veldgeschütz darzů bei den hauffen theilen. Erstlich wil ich auß den 100000. Muscen reisigen 100. Geschwader machen/ daß ist ein geschwader 1000. Pferdt/ darnach in vorzug 1000. pferdt ordnen/ die sollen das veld zubesichtigen einnemen/ alle wälde/ berg/ wasser/ fört/ strassen/ brücken vnd weg bereiten/ deßgleichen was zum ziehen des Kriegßuolcks/ wagen vnd geschütz zu machen sein wil/ weitter sollen 100. pferdt für den 1000. hinziehen/ vnd 10. pferdt von den 100 nemen/ auff jede seite neben jn das veld
  cs: |-
    Nyní si předsevezmu těch 100 000 moskevských koní a rozdělím je v poli do šiku, jízdu i pěchotu, spolu s německým křesťanským válečným lidem {Kriegßuolck}, a k houfům {hauffen} přidělím polní děla. Nejprve udělám ze 100 000 moskevských jezdců 100 švadron {Geschwader}, to jest švadronu po 1 000 koních. Potom určím do předvoje {vorzug} 1 000 koní; ti mají prohlédnout a obsadit pole, upravit všechny lesy, vrchy, vody, brody, silnice, mosty a cesty a také to, co je třeba připravit pro tažení válečného lidu, vozů a děl. Dále má před těmi 1 000 táhnout 100 koní; z té stovky se vezme 10 koní a na každé straně se nechají
poznamky:
- n: 1
  text: |-
    V tisku je zřetelně `100000.` (BSB OCR čte chybně `10.`); o několik řádků níže text stejné číslo opakuje (`die 100000. pferdt des Musce`).
