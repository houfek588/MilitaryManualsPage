overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Kriegßgebrauch vnd gůter Röstung were/ Nemlich zum ersten auff ein reisigen Zeug von der Muscen Rüstung 100000. Pferdt.
  cs: |-
    válečných zvyklostech a v dobré zbroji: totiž předně na jízdní sbor {reisig Zeug} o moskevské výzbroji 100 000 koní {Pferdt}.[^1]
- typ: odstavec
  de: |-
    Zum andern auff 6000. pferdt Teutsche Röstung/ schwere vnd geringen pferdt.
  cs: |-
    Za druhé na 6 000 koní německé výzbroje, těžkých i lehkých koní.
- typ: odstavec
  de: |-
    Zum dritten auff 100. Fendlein Teutsches Fußuolck mit jren vn anderer Landen Röstung.
  cs: |-
    Za třetí na 100 korouhví {Fendlin} německé pěchoty {Fußuolck} s její výzbrojí i výzbrojí jiných zemí.
- typ: odstavec
  de: |-
    Zum vierdten/ dann ein geordnet gewaltig Brechgeschütz mit namen der gattung oder sorten vnd aller jrer zůgehörigen Rüstung beschreiben/ vnd in ein ordenliche recht Rechnung stellen.
  cs: |-
    Za čtvrté potom popsat uspořádané mohutné obléhací dělostřelectvo {Brechgeschütz} se jmény jeho druhů neboli ráží a veškerou jeho příslušnou výbavou {Rüstung} a uvést je v řádný správný počet.
- typ: odstavec
  de: |-
    Zum fünfften/ dergleichen ein geordnet Veldgeschütz/ so vil inn das Veld zuschlagen von nöten zu solchem Volck sein wil/ auch alles mit namen der stück oder Sorten benant/ vnnd mit aller jhrer zůgehörender Röstung/ alles auch beschreiben/ vnd gleich dem andern wie hieuorn gemelt/ in rechnung stellen.
  cs: |-
    Za páté rovněž popsat uspořádané polní dělostřelectvo {Veldgeschütz}, kolik jej k takovému vojsku v poli třeba vypravit, vše rovněž pojmenovat názvy kusů či ráží i se vší příslušnou výbavou a stejně jako předchozí uvést v počet.
- typ: odstavec
  de: |-
    Zum sechsten/ deßgleichen sol darzů geordnet werden ein besonder werck zu Feurwerck/ ob mann mit dem Geschütz mit schiessen einer besatzung nit abbrechen kündt/ daß dann mit dem Feurwerck zu handeln möcht sein/ solches will ich auch mit gůtem bericht in beschreibung bringen.
  cs: |-
    Za šesté má se k tomu rovněž zřídit zvláštní oddíl pro ohňostrojné stroje {Fewerwerck}, aby kdyby se střelbou z děl nedalo posádce {Besatzung} uškodit, mohlo se jednat ohňostroji; i to chci uvést s dobrou zprávou do popisu.
- typ: odstavec
  de: |-
    Zum sibenden/ ob sichs begebe daß ein besatzung oder befestung der gestalt gelegen were/ daß die zugraben vnd zusprengen würde sein/ wie mann dann damit handeln soll/ auch alles berichtlich inn schrifften stellen vnd anzeigen.
  cs: |-
    Za sedmé, stalo-li by se, že by nějaká posádka nebo {Befestung} ležela tak, že by ji bylo třeba podkopat {vndergraben} a vyhodit {sprengen}, jak se s tím má jednat, i to vše zpravodajsky vyložit a ukázat v písmu.
- typ: odstavec
  de: |-
    Zum achten/ ein Wagenburg zufüren vnd zuschlagen in die wehr zurichten/ mit aller darzů gehörigen Rüstung/ gleichfals in schrifften stellen.
  cs: |-
    Za osmé, jak vést vozovou hradbu {Wagenburg}, zarazit ji a zřídit k obraně se vší k ní náležející výbavou – rovněž vyložit v písmu.
- typ: odstavec
  de: |-
    Zum neundten/ ein Schiffbrück mit aller jrer zůgehörender Rüstung vnd ordnung auch in schrifften stellen.
  cs: |-
    Za deváté, také lodní most {Schiffbrück} se vší k němu náležející výbavou a řádem vyložit v písmu.
- typ: odstavec
  de: |-
    Zum zehenden/ auch der Teutschen reisigen gebürender Heerwagen in jre regierung vñ Ordnung nach Teutschem gebrauch stellen.
  cs: |-
    Za desáté, také náležité válečné vozy {Heerwagen} německé jízdy uvést do jejich správy a řádu podle německého obyčeje.
- typ: odstavec
  de: |-
    Nun wil ich vor mich nemen/ die 100000. pferdt des Musce/ vnd in daß veldt in ordnung zu roß vnd fuß/ mit sampt dem Teutschen Christlichen Kriegßuolck/ vnd ein veldgeschütz darzů bei den hauffen theilen. Erstlich wil ich auß den 100000. Muscen reisigen 100. Geschwader machen/ daß ist ein geschwader 1000. Pferdt/ darnach in vorzug 1000. pferdt ordnen/ die sollen das veld zubesichtigen einnemen/ alle walde/ berg/ wasser/ fört/ strassen/ brücken vñ weg bereiten/ deßgleichen was zum ziehen des Kriegßuolcks/ wagen vnd geschütz zu machen sein wil/ weitter sollen 100. pferdt für den 1000. hinziehen/ vnd 10. pferdt von den 100 nemen/ auff jede seite neben jn das veld
  cs: |-
    Nyní si vezmu před sebe těch 100 000 koní Moskvanů a rozdělím je do pole v šik jízdních i pěších spolu s německým křesťanským válečným lidem a s polním dělostřelectvem {Veldgeschütz} u houfů {Hauffen}. Nejprve udělám ze 100 000 moskevských jezdců 100 švader {Geschwader}, to jest jedno švadro 1 000 koní; potom určím do předvoje {vorzug} 1 000 koní, jež mají obhlédnout a obsadit pole, projet všechny lesy, vrchy, vody, brody, silnice, mosty a cesty a zjistit, co bude třeba upravit pro tažení válečného lidu, vozů i děl. Dále má před těmi 1 000 táhnout 100 koní a z té stovky vzít po 10 koních, kteří se po každém boku rozjedou do pole
poznamky:
- n: 1
  text: |-
    Na skenu tisku je skutečně vytištěno `100000.` (v OCR rozmazané nuly vypadly jako `10.`); o několik řádků níže text stejnou cifru `100000. pferdt des Musce` výslovně opakuje. Prázdné řádky v BSB OCR na konci strany byly opraveny podle kustodu `lassen`.
