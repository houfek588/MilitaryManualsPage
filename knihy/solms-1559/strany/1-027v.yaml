bloky:
- typ: odstavec
  de: |-
    Zum andern kan mann solliche Wagen inn die Wagenburg einstecken / vnd lest die Schützen darneben ziehen / deßgleichen so mann ein Wagenburg in schleußt inn standt / dann hat man dieselbig vor zwerg einzuziehen zu dem streichen / wie das in augenschein gerissen werden soll.
  cs: |-
    Za druhé lze takové vozy vřadit do vozové hradby {Wagenburg} a nechat střelce {Schützen} táhnout vedle nich. A uzavírá-li se vozová hradba ve stálém postavení, zařazují se tyto vozy napříč, aby se z nich dalo bočně střílet[^1], jak to má být názorně zakresleno.[^2]
- typ: odstavec
  de: |-
    Aber damit mann zuuersehen hat / daß nicht allwegen von dem Herren auß der Artolorei haben můß / so hat es dise meinung / Wann mann ein rechte Wagenburg füren vnd schliessen soll / Dann gehören alle wagen inn dem gantzen Krieg / von allen Hauffen darzů die der Kriegßherr besold / die seind schuldig zu der zeit der Wagenburg zuuerfolgen / doch hat es sein maß / wie mann die gebrauchen soll zu dem ziehen / zum Leger vnd zum standt.
  cs: |-
    Aby však bylo zřejmé, že se [vozy] nemusí brát vždy jen z pánova dělostřelectva {Artolorei}, platí toto: má-li se vést a uzavírat řádná vozová hradba, náležejí k ní všechny vozy celého vojska ode všech houfů {Hauffen}, které válečný pán {Kriegßherr} platí žoldem. Ty jsou povinny v době potřeby sloužit vozové hradbě; má to však svou míru, jak se mají užívat na pochodu, v ležení {Leger} a v bojovém postavení.
- typ: odstavec
  de: |-
    Zum ersten / wann ein Kriegßuolck ziehen wirt / vnd mann ein zug Wagenburg neben einem hauffen zuziehen ordnen wolt / dann seind alle so jhr soltwagen haben schuldig / jhre besolte wagen inn die Wagenburg zu gehen lassen auff des Obersten beuelch / vnnd Wagenburgmeisters erforderung / Doch soll der wagenburgmeister die bescheidenheit halten / daß er nicht mehr wagen forder / dann er vermein daß er nottürfftig werd sein / vnnd darnach er ein wagenburg lang oder kurtz bedarff oder haben můß / darnach soll er wagen von dem hauffen nemen / daß er die zall erreiche / vnnd soll das gleich eintheilen / darnach ein jeder wagen hat / das soll er alles in seiner Rollen oder Register haben / dann weiß er was er von einem jeden zu der notturfft fordern soll / Darumb ligt nit wenig an einem geschickten wagenburgmeister / vnd anderen mehr die darzů tüglich sein mögen / danns ist nit wol möglich allein zuuersehen vnd zufürn / sonder zu schwer / darumb bedarff es gůter geschickter Leut die solches versehen vnnd verwalten sollen / Sollicher wagenburgmeister soll sich zů dem Artoloreimeister halten / dann sie gehören zusamen / vnnd die wagenburg wagen mit derselbigen Rüstung zu dem Geschütz / vnd was darzů gehöret / das gehöret in die Artolorei zuuerwaren vnnd zuzůrichten.
  cs: |-
    Za prvé: když táhne válečný lid {Kriegßuolck} a má se nařídit pochodová vozová hradba, která pojede vedle některého houfu, jsou všichni, kdo mají své žoldnéřské vozy[^3], povinni na rozkaz plukovníka {Obersten} a na výzvu mistra vozové hradby {Wagenburgmeisters} pustit své placené vozy do vozové hradby. Mistr vozové hradby však má zachovávat umírněnost a nežádat více vozů, než kolik podle svého soudu bude potřebovat. Podle toho, jak dlouhou či krátkou vozovou hradbu potřebuje nebo musí mít, má brát vozy od houfu, aby dosáhl potřebného počtu, a má je rozvrhnout rovnoměrně podle toho, kolik vozů kdo má. To vše má mít zapsáno ve svém seznamu či rejstříku {Register}; pak ví, co má od koho podle potřeby žádat. Proto nemálo záleží na obratném mistru vozové hradby a na dalších, kdo jsou k tomu způsobilí, neboť sám by to stěží dokázal obstarat a vést – bylo by to příliš těžké. Je k tomu tedy zapotřebí dobrých, obratných lidí, kteří to budou obstarávat a spravovat. Mistr vozové hradby se má držet zbrojmistra {Artoloreimeister}, neboť k sobě patří; vozy vozové hradby s výzbrojí {Rüstung} pro děla {Geschütz} a se vším, co k tomu náleží, patří k dělostřelectvu, které je má opatrovat a vystrojovat.
- typ: odstavec
  de: |-
    Doch so soll der wagenburgmeister solliche wagen inn seiner versehung oder Ordnung vnnd gewalt haben / mit den darzů gehörigen Pferden / daß er solliche Regirung vnnd versehung im Feld darmit laut seines Ampts verwalten könne / wie dieselbige Ampts verwaltung inn dem andern Bůch bei den Kriegßamptern klerlicher beschrieben ist / darbei ich es allhie weitter daruon zuschreiben / will bleiben lassen.
  cs: |-
    Přesto má mít mistr vozové hradby tyto vozy i s příslušnými koňmi pod svým dohledem, ve své správě a moci, aby s nimi mohl v poli vykonávat řízení a zajištění podle svého úřadu, jak je správa tohoto úřadu zřetelněji popsána v Druhé knize u válečných úřadů[^4]. Při tom to zde nechám a dále o tom psát nebudu.
poznamky:
- n: 1
  text: |-
    Něm. *vor zwerg einzuziehen zu dem streichen* – vysunout či natočit napříč, aby z nich střelci mohli bočně postřelovat (*flankovat*) prostor před vozovou hradbou.
- n: 2
  text: |-
    Něm. *wie das in augenschein gerissen werden soll* – odkaz na zamýšlený či plánovaný nákres (rytinu).
- n: 3
  text: |-
    Něm. *soltwagen* / *besolte wagen* – vozy najaté či vydržované v žoldu válečného pána.
- n: 4
  text: |-
    Viz kapitolu *Von des Wagenburgmeisters Ampt* ve Druhé knize na listech [[050r|50r]]–[[052v|52v]].
