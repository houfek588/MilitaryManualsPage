bloky:
- typ: odstavec
  de: |-
    Aber es sollen die Reutter weder mit jrem Fanen oder sonst Rottenweiß wie das gemelt werden mag on Keyserlicher Maiestat vnd derer Obersten Feldhauptman wissen vnd willen auff Beutten/ fütterung/ noch sonst in andere weg ausser der ordnung vnd Leger nit reitten/ sonder ein jeder bleiben wie er bescheiden wirt.
  cs: |-
    Avšak jezdci {Reutter} nemají ani se svou korouhví {Fanen}, ani jinak po rotách {Rottenweiß}, jakkoli by se to mohlo nazývat, vyjíždět bez vědomí a vůle císařského Veličenstva a jeho nejvyššího polního hejtmana {Obersten Feldhauptman} za kořistí, pící či jinak mimo šik {ordnung} a ležení {Leger}, nýbrž každý má zůstat tam, kam je vykázán.
- typ: odstavec
  de: |-
    Sie sollen auch in Keyserlicher Maiestat Keyserthumben/ Erblanden/ noch sonst da freundt oder gehuldigt weren niemants einigen schaden thůn/ sonder alles bezalen/ biß mann im feld gegen Feinden wirt ligen/ so mügen sie die fütterung im feld oder wo sie die darinnen finden/ suchen/ dieselbig gebrauchen.
  cs: |-
    V císařstvích a dědičných zemích císařského Veličenstva ani nikde jinde u přátel či tam, kde bylo složeno poddanství, nemají nikomu způsobit žádnou škodu, nýbrž za vše platit, dokud se nebude ležet v poli proti nepřátelům. Pak smějí píci vyhledávat v poli nebo kdekoli ji tam najdou a užívat ji.
- typ: odstavec
  de: |-
    Vnd wann mann in das feld an die Feinde kompt/ sollen sie sich auch des Obersten Hauptmans vnd Beuelchabers anschaffen vnd gepotten mit jren leib pferden/ vnd in all anderweg bei tag vnd nacht gehorsam halten.
  cs: |-
    A když se přitáhne do pole k nepřátelům, mají se také nařízením a rozkazům nejvyššího hejtmana {Obersten Hauptmans} a velitele {Beuelchabers} se svými osobními koňmi i ve všem ostatním dnem i nocí poslušně podřizovat.
- typ: odstavec
  de: |-
    Were auch das sich zwischen Keyserlicher Maies. den obgemelten Hauptleuten vnd jren Reuttern/ deßgleichen auch zwischen jnen selbst oder andern jhre Maiestat zugewanten spenn vnd jrung zutrüngen vnd begeben/ deren sie in der güt nit vergleicht werden möchten soll das stehn zu eins Feldmarschalcks spruch vnd entscheids.
  cs: |-
    Přihodilo-li by se také, že by mezi císařským Veličenstvem, výše zmíněnými hejtmany {Hauptleuten} a jejich jezdci, stejně jako mezi nimi samými navzájem nebo dalšími spojenci Jeho Veličenstva došlo ke sporům a rozepřím, v nichž by se nemohli dohodnout po dobrém, má o nich vynést výrok a rozhodnout polní maršálek {Feldmarschalcks}.
- typ: odstavec
  de: |-
    Ob auch Keyserliche Maies. andern bestelten Hauptleutten oder Reuttern/ auff disem Zug höhere besoldung geben würde/ sollen dise Hauptleut vnd Reutter denselben darin gleichmessig gehalten werden.
  cs: |-
    Kdyby také císařské Veličenstvo dalo na tomto tažení {Zug} jiným najatým hejtmanům nebo jezdcům vyšší žold {besoldung}, mají být tito hejtmani i jezdci s nimi v tomto ohledu postaveni na roveň.
- typ: odstavec
  de: |-
    Vnd vmb das alles sollen sie gnůgsamlich versichert sein/ durch der Stät eine N. oder N. die jnen auff gemelte bezallung versprechen dann die Reutter sonst nit wissen auff zubrengen.
  cs: |-
    Za to vše jim má dostatečně ručit některé z měst, N. nebo N., které se jim za zmíněnou výplatu zaručí, neboť jinak jezdce sehnat nelze.
- typ: nadpis
  uroven: 3
  de: Bestelbrieff der Lantskneckt Obersten.
  cs: Služební list {Bestelbrieff} plukovníka {Obersten} lancknechtů {Lantskneckt}.
- typ: odstavec
  de: |-
    WIr Karln von Gottes gnaden/ Römischer Keyser/ etc. Bekennen/ als wir vns entschlossen ein gůt ansehenliche anzal Teutsches Kriegsuolck zu fůß/ in vnsern dienst vnd besoldung anzunemen vnd zu vnderhalten/ Darauff dem Ersamen vnserm getrewen N. Commissarien beuolhen/ vns solliche anzal auffzubrengen vnd zu bestellen/ ferer von vnsert wegen mit vnserm Hauptman/ vnd des Reychs lieben getrewen Conraden von Bammelberg zu handeln/ daß er vns solch Kriegsuolck zufüren soll/ daß wir darauff den jetztgemelten von Bammelberg vber gemelt vnser Teutsch Kriegsuolck/ als nemlich 10. Fendlin darunder 5000. solde zu vnserm
  cs: |-
    My, Karel, z Boží milosti římský císař atd. prohlašujeme: Jelikož jsme se rozhodli přijmout do našich služeb a žoldu a vydržovat značný a úctyhodný počet německého válečného lidu {Kriegsuolck} pěšího, uložili jsme počestnému, našemu věrnému N., komisaři {Commissarien}, aby nám takový počet sehnal a najal, a dále aby naším jménem jednal s naším hejtmanem {Hauptman} a milým věrným říše, Konrádem z Bemelbergu[^1], aby nám takový válečný lid přivedl; a proto jsme právě zmíněného Bemelberga nad dotčeným naším německým válečným lidem – totiž 10 praporci {Fendlin}, pod nimiž je 5000 žoldů {solde} – k našemu
poznamky:
- n: 1
  text: |-
    Konrád z Bemelbergu (v tisku „Conrad von Bammelberg“, asi 1494–1567, zvaný „Malý Hess“) – proslulý císařský lancknechtský plukovník ve službách Karla V., zejména při dobytí Říma (1527), tažení do Itálie a proti Šmalkaldskému spolku.
