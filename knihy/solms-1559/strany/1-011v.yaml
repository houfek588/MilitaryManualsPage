bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vnd zu dem besten nach der Kriegs notturfft vnnd gebrauch mit handeln vnd volnziehung thůn / Deßgleichen so sollen alle andere / solliche des Kriegßherrn geordneten Kriegßordnung (wie auch inn der Bestallung meldung beschicht) gehorsam sein / vnnd bei derselbigen verwalter im fall der not tretten vnd bei stehen.
  cs: |-
    a co nejlépe podle válečné potřeby a obyčeje pomáhat je projednat a provést. Stejně tak mají být všichni ostatní poslušni válečného řádu, jejž nařídil válečný pán {Kriegßherrn} (jak o tom mluví i služební list {Bestallung}), a v případě potřeby se postavit k jeho správcům a stát při nich.
- typ: odstavec
  de: |-
    Wann dann den Reuttern solches vorgehalten worden ist / so soll der Commissarius oder Musterherr fragen / Ob einer were / der solchem zugeleben nit gedecht so mag derselbig herfürrücken / vnd seine vrsach anzeigen / so soll er angehört werden / vnd darauff seine gebürende antwort empfahen / welche aber dise billiche Kriegßordnung halten wöllen / die sollen sich darauff mustern lassen / so soll jnen alle gůte gebürliche fürderung geschehen / vnd nach Kriegs gebrauch in allem geschützt vnd gehandthapt werden / vnd jnen so bald die stunde der Musterung ernennen / vnnd als dann die Musterung fürt lassen gehen. Würde aber etwan einer oder mehr / sich diser vorgehaltner erinnerung der Justitien wegern / vnnd kein erhebliche vrsachen anzuzeigen weiß so soll jm gesagt werden / dieweil er sich diser billichkeit / vnd des Kriegßherrn Ordnung zugeleben nit gemeint / so mög er wider heimziehen / dann dieweil er sich der billichen geordneten Kriegßordnung nit halten wöl / so sei er dem Herrn nit annemlich / vnd mann achte das er nit lust zu dem Kriege vnd gůter Justitien habe / sonder Meuterei vnd vnordnung zumachen / darumb sei er nützer von dem hauffen dann darbei / soll also hinziehen on reichung des anrit gelts.
  cs: |-
    Když to bude jezdcům {Reuttern} předneseno, má se komisař {Commissarius} neboli přehlídkový komisař {Musterherr} zeptat, zda je tu někdo, kdo se tím nehodlá řídit. Takový ať vystoupí a uvede svůj důvod; má být vyslechnut a dostat na to náležitou odpověď. Kdo však chce tento spravedlivý válečný řád zachovávat, ať se na to dá přehlédnout {mustern}; dostane se mu veškeré dobré a náležité podpory a podle válečného obyčeje bude ve všem chráněn a zastáván. Komisař jim má hned stanovit hodinu přehlídky {Musterung} a přehlídku pak provést. Kdyby se však někdo – jeden či více – vzpíral tomuto přednesenému napomenutí k justici {Justitien} a nedokázal uvést žádný závažný důvod, má se mu říci: Poněvadž nehodlá žít podle této spravedlnosti a řádu válečného pána, může zase táhnout domů. Když se nechce držet spravedlivého, řádně nařízeného válečného řádu, není pánovi vhod; má se za to, že nemá chuť k válce a k dobré justici, nýbrž k tropení vzpoury {Meuterei} a nepořádku, a proto je užitečnější mimo houf {hauffen} než v něm. Ať tedy odtáhne bez vyplacení příjezdného {anrit gelts}.
- typ: odstavec
  de: |-
    Vnd so die Musterung beschehen / so soll der MusterHerr von den Reutern ein Rinck machen / die Ritmeister vnd alle vom Adel / auch die Pferdt fürn vnd vnter jhrem Sattel haben / bei einander fordern / die andern auch darumb halten lassen / dises vorhalten vnd sagen / liebe Ritmeister / Herrn / Junckern vnd andere / dieweil jhr nun euch in dises Kriegßherrn dienst vnd feldzuge / wie ehrliche ritterliche leut begeben vnd mustern lassen / so habt jr des Kriegßherrn meinung zuuor angehört daran kein zweifel zuhaben ist / jhr werdet euch in dem zuhalten wissen / vnd thůn wie Rittermessigen vnd Kriegßleuten zustehet vnd gebürt / so wil nun nach des Kriegßherrn verordnung vnd billichem gebrauch die notturfft Ordnung zuhalten erfordern / das jhr Ritmeister vnd alle vom Adel / auch welche Reuter füren / dem Herrn die pflicht darüber thůt / vnd nit darumb das der Herr in dem kein vertrawen wie in ritterliche leut stell / sonder allein vmb aller vnrichtigkeit willen / so wil ich euch solchen eidt vnd verpflichtung verlesen / darauff anstat des Kriegßherrn ewer handtrew an eidts stat von euch nemen.
  cs: |-
    A jakmile přehlídka proběhne, má přehlídkový komisař {MusterHerr} z jezdců utvořit kruh {Rinck}, povolat k sobě rytmistry {Ritmeister} a všechny šlechtice i ty, kdo přivádějí koně a mají je pod vlastním sedlem, ostatní nechat stát kolem a přednést jim tato slova: „Milí rytmistři, páni, junkři i ostatní, poněvadž jste se nyní jako čestní rytířští lidé dali do služby a polního tažení {feldzuge} tohoto válečného pána a nechali se přehlédnout, vyslechli jste již předtím vůli válečného pána, a není pochyb, že se podle ní budete umět zachovat a jednat, jak přísluší a náleží rytířským mužům a válečníkům {Kriegßleuten}. Nyní tedy podle nařízení válečného pána a spravedlivého obyčeje vyžaduje nutnost udržet pořádek, abyste vy, rytmistři i všichni ze šlechty, jakož i ti, kdo vedou jezdce, složili pánovi na to závazek {pflicht} – a to nikoli proto, že by k vám pán neměl důvěru jako k rytířským lidem, nýbrž jedině proto, aby se předešlo všelikým nesrovnalostem. Přečtu vám tedy tuto přísahu {eidt} a závazek a pak od vás namísto válečného pána přijmu podání ruky místo přísahy.“
