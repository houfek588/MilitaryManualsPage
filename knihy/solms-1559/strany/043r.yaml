bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Landen / in dem durchziehen / vnd geschicht einem Kriegsuolck vmb sein zimlich gelt auch sein vnderhaltung / vnd ist derhalben niemands beschwert / solliches alles soll zuuor wo die züge vnd Kriege der gestalt geordnet / das einem jeden Herren den solliche Züg jr Landt betreffen werden / sich geschickt machen / wo zuuor die Forirer / wie obgemelt kommen würden / das alßdann derselbig Herr mit seiner Prouiant oder Vitalien geordnet vnd gefast sei / damit er dieselben laut der Ordnung / lieffern vnd versehen künde / damit das Kriegsuolck nicht sagen dürfft / Wir haben kein Prouiant noch versehung gehabt / derhalben wir zu vnser notturfft nemen mussen / Vnnd also durch dieselbig jhr außrede vnnd glimpff vber den armen Leuten schepffen mögen / Dasselbig abzuschneiden soll ein jeglicher Herr solliche strassen im ziehen betreffen werden / sich selbst mit Viehe / Brot / vnd allem was die notturfft fordert / schicken / damit er sein Volck oder arme Leut vor schaden verhüte / vnnd obschon etwann die strassen der Züg durch ein ort ziehen / darinn solliche Prouiant nicht alle were / so soll mann von den anstossenden orten / solliche Prouiant mit viehe vnd anderem dahin verordnen / darmit ein landt oder art der züge vnd strassen halben / nicht allein leidet / sonder die anderen die die strassen vnd der Zug nicht betrifft / den anderen leuten zu hilff kommen / vmb jhre gebürlich gelt / des viehs / Korn / tranck / vnd was das ist / dasselbig soll der Herr des lands verschaffen / vnnd ob sein landt das nicht erreichen möcht / so sollen die anstossenden landt / die schon jhn nicht zugehörig / sonder anderen zustendig / dahin verpflicht sein / jhn in dem zuhilff zukommen / darmit gleich getragen werde / Dasselbig soll zu der zeit so mann Zůege ordnen würde / nicht gerechnet vnd geordnet werden.
  cs: |-
    zemích při průchodu; a válečnému lidu {Kriegsuolck} se také dostane výživy za jeho slušné peníze, takže tím není nikdo obtěžován. Toto všechno se má předem, kde se taková tažení {züge} a války pořádají, [zařídit], aby se každý pán, jehož země se taková tažení budou týkat, připravil – jakmile předem přijedou furýři {Forirer}, jak bylo zmíněno výše –, aby pak týž pán byl připraven a opatřen svým proviantem {Prouiant} čili potravinami (viktualií), tak aby je mohl podle řádu dodávat a zajišťovat. Tím nebude smět válečný lid říkat: „Neměli jsme žádný proviant ani zaopatření, proto jsme si museli vzít pro svou potřebu,“ a tak z té své výmluvy a záminky těžit na úkor chudých lidí. Aby se tomu zabránilo, má se každý pán, jehož cest se to při tažení týká, sám zařídit s dobytkem, chlebem a vším, co potřeba vyžaduje, aby uchránil svůj lid nebo chudé lidi před škodou; a i kdyby snad cesty tažení vedly místem, kde by veškerý takový proviant nebyl, má se takový proviant s dobytkem a ostatním nařídit tam ze sousedních míst, aby jedna země či končina kvůli tažením a silnicím netrpěla sama, nýbrž aby druzí, kterých se silnice a tažení netýkají, přišli ostatním lidem na pomoc za náležité peníze dobytkem, obilím, nápoji a čímkoli třeba – to má opatřit pán země. A kdyby na to jeho země nestačila, mají být sousední země, byť mu nepatřily, nýbrž náležely jiným, zavázány přijít mu v tom na pomoc, aby se břemeno neslo rovnoměrně; to nemá být v době, kdy se budou nařizovat tažení, přehlíženo[^1], nýbrž řádně uspořádáno.
- typ: odstavec
  de: |-
    Wo die Zůege durchgehen / wie oben gemelt / vnnd einer dem andern also sein ansuchen / fürzusetzen schuldig sein soll / darmit das Kriegsuolck also sonder beschwerung durch die landt fürderlich zubrengen sei / vnnd ob sich zutragen wurde / das vil Kriegsuolck eine strasse ziehen vnd brauchen můsten / so soll durch die / so das schicken werden / vergliechen sein / daß sich dasselbig nicht vber einen Hauffen zu gleich im Zuge begebe / sondern mit den Hauffen zimlich nach einander inn gůter Ordnung / so mögen sie alle tractiert / vnderhalten / vnnd wol versehen werden / one einige beschwerde meniglichs.
  cs: |-
    Kudy procházejí tažení, jak bylo zmíněno výše, má být jeden druhému na jeho žádost povinen vypomoci, aby se válečný lid dal takto bez obtíží rychle provést zeměmi; a kdyby nastalo, že by velké množství válečného lidu muselo táhnout a užívat jedné silnice, má být mezi těmi, kdo je vysílají, ujednáno, aby se nevydávali na pochod najednou v jednom houfu {Hauffen}, nýbrž po oddílech pěkně za sebou v dobrém pořádku; tak mohou být všichni pohoštěni, živeni a dobře zaopatřeni bez jakékoli újmy kohokoli.
- typ: odstavec
  de: |-
    Vnd so ein Herr ein Commiß haben will / vnd des vorbedenckens ist / daß er sein Volck mit der Prouiant gewiß versehen will / daß
  cs: |-
    A chce-li mít pán komis {Commiß} a má-li v úmyslu jistě zaopatřit svůj lid proviantem, což
poznamky:
- n: 1
  text: |-
    Tisk má „nicht gerechnet vnd geordnet werden“ (možná tiskařský omyl místo „mit gerechnet“, tj. společně započítáno a nařízeno, anebo ve smyslu „aby se na to při rozvrhu tažení nepočítalo jen s jednou zemí“).
