  popis: |-
    Celostránkový dřevořez označený číslem „10“ znázorňující dva druhy masivních nízkých dělových kotoučů (plných kol bez vysokých paprsků) s vytaženým jedním výsečovým dílem, aby bylo vidět čepování a svorníkování. Horní kotouč je sestaven z plných dřevěných výsečí stažených k sobě železnými pásy a silnými nýty (s detaily svorníku a příložky vlevo nahoře); dolní kotouč spojuje vnější složený dřevěný věnec s dvanácti krátkými paprsky zapuštěnými do širokého středového kotouče náboje.
