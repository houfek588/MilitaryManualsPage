bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    mann der einem ein stück Büchsen zwei oder vier beuelhen/ darnach die groß sind von einer Sorten vnd alle jre rüstung/ als Kogeln/ Puluer/ Zeug vnd was darzů gehört zur notturfft im feld zugebrauchen/ solche Furleut sollen alle auff einn bescheiden sein/ so warten dieselbigen im ziehen/ vnd im feld auff jn/ er behelt sie in der Ordnung wie der Zeugmeister das mit jn verordnet hat/ Deßgleichen so mann den abent das Leger schlecht/ soll derselbig besehen/ wo seine Roß vnnd leut losiert sein/ denselbigen jre notturfft schaffen/ auch so weiß er inn der eil vnd not/ wann sich etwas zutragen würde/ wo er seine Roß vnd leut finden soll/ die anschaffen zu jrem Geschütz vnd Wägen zu fürderst/ Deßgleichen ein anderer auch also dem solche versehung geben ist/ so wissen dann dieselbigen den bescheidt vom Zeugmeister wie sie sich halten solten/ das geht von stat. Wo es sich aber zutragen würde/ daß mann etwan von den hauffen etlich geschwader verschickt/ vnd denen Geschütz zůgeben wirt/ so hat mann derselbigen ein oder zwen mit jrem geschütz darzů zuuerordnen/ es wer gleich mit grossem oder kleinem/ oder beide groß vnd klein/ so hett mann darzů personen die damit geschickt weren/ Ob mann auch etwan im schlagen das Geschütz in etlich hauffen theilen wolt/ so tregt es sich auch fast zů/ wann man ein Flecken/ Schloß/ oder Stat beschiessen will/ daß mann mehr dann ein Schantz hat vnd haben muß/ alßdann mag mann dieselbigen auch also ordnen/ vnd einem jeden sein versehung beuelhen/ das vnd dergleichen tregt sich vil zů/ daruon nit alles zu schreiben ist.
  cs: |-
    svěřit jednomu z nich jedno dělo {stück Büchsen}, dvě nebo čtyři – podle toho, jak jsou veliká – jednoho druhu i s veškerou jejich výzbrojí {rüstung}, jako jsou koule {Kogeln}, střelný prach {Puluer}, nářadí {Zeug} a vše, co k nim patří k potřebě užití v poli. Takoví vozkové {Furleut} mají být všichni přiděleni k jednomu [veliteli], takže na pochodu i v poli poslouchají jeho a on je udržuje v pořádku, jak to s nimi zbrojmistr {Zeugmeister} zařídil. Stejně tak když se večer rozbíjí ležení {Leger}, má tento prohlédnout, kde jsou jeho koně a lidé ubytováni {losiert}, a opatřit jim jejich potřeby; a tak i ve spěchu a v nouzi, kdyby se něco přihodilo, ví, kde má své koně a lidi najít, a nejrychleji je přivolat k jejich dělům a vozům. A stejně tak i každý jiný, komu je taková správa svěřena – a tak tito lidé vědí od zbrojmistra pokyn, jak se mají chovat, a věc jde od ruky. Kdyby se pak přihodilo, že se z šiků {hauffen} vyšle několik švadron {geschwader} a přidělí se jim děla, má po ruce jednoho či dva takové muže, aby je tam s jejich děly vyslal – ať s velkými, či malými, anebo s velkými i malými dohromady –, a má k tomu lidi, kteří jsou v tom obratní. Stejně tak kdyby se v bitvě chtěla děla rozdělit do několika houfů – a velmi často se také stává, že při ostřelování městečka, hradu či města je a musí být více než jedna šance {Schantz} –, lze je takto rozdělit a každému svěřit jeho správu. Takové a podobné případy se stávají často a nelze je všechny vypsat.
- typ: odstavec
  de: |-
    Wollan wie mag dann ein Zeugmeister (wie gemelt durch die vrsachen) zu gleich an allen orten sein/ darumb ist es bedacht/ daß solches mög versehen werden/ vnd also vnder die personn geordnet/ auch auß diser vrsachen ist ein Zeugmeister nit mehr dann ein Mensch/ mag sterben/ mag erschossen werden/ oder anders vmbkomen/ wie er des gnůgsam gefahr bestehn muß/ wann es dann geschehe daß er vmb keme/ dann hett es mühe so bald in der eill ein andern zubekomen/ wo aber der personn etlich wern/ so macht mann dann bald einn newen/ welcher am geschickten wer/ alle gelegenheit wißt/ darmit wer es wider versehen/ Aber nit desto weniger soll ein Zeugmeister souil jm möglich ist zeitlich an allen orten sein/ alle sachen besichtigen/ befragen vnd anschaffen/ mit fleiß vnderrichten/ zu aller zeit mit den verordneten berathschlagen/ sie trewlich vnderweisen vnd anhalten/ sie zeitlich bei jm haben/ vnd er bei jn sein/ thůn gleich als wann er jn nit vertraut/ daß sie es hetten wol versehen/ sonder alles selbst souil möglich besehen/ ob sie seinem geschäfft werden nachkommen/ dann er muß dafür stehen/ redt vnd antworten geben/ was derhalben durch
  cs: |-
    Nuže, jak by tedy mohl zbrojmistr (jak bylo řečeno z uvedených příčin) být na všech místech zároveň? Proto je to vymyšleno tak, aby to mohlo být obstaráno a rozděleno mezi tyto osoby – a také z té příčiny, že zbrojmistr není nic víc než člověk: může zemřít, může být zastřelen nebo jinak zahynout, neboť je takovému nebezpečí vystaven víc než dost; kdyby se pak stalo, že by zahynul, bylo by těžké ve spěchu tak brzy sehnat jiného, kdežto je-li takových osob několik, ustanoví se brzy nový, který by byl nejobratnější a znal by všechny okolnosti, a tím by bylo opět postaráno. Nicméně však má být zbrojmistr, jak jen mu je možné, včas na všech místech, všechno prohlížet, vyptávat se a zařizovat, s pílí poučovat, v každém čase se s pověřenými osobami radit, věrně je vést a pohánět, mít je včas u sebe a sám být při nich, chovat se tak, jako by jim nedůvěřoval, že to dobře zařídili, nýbrž všechno sám, jak jen lze, prohlédnout, zda budou jednat podle jeho příkazu – neboť on za to musí ručit a skládat účty za vše, co by bylo skrze
