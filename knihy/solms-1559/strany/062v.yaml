bloky:
- typ: odstavec
  de: |-
    Ein jeder Fendrich soll allweg seinen Fanen an Feinden fliegen lassen / vnd jn selbst fůren / es hab dann treffliche / vnwidersprechliche vrsachen / der doch wenig sein.
  cs: |-
    Každý praporečník {Fendrich} má vždy nechat svou korouhev {Fanen} proti nepřátelům vlát a vést ji sám, ledaže by měl závažné a nezvratné důvody, jakých však bývá málo.
- typ: odstavec
  de: |-
    Wann mann mit den Feinden schlecht / weil die handlung wert / soll kein Fendrich seinen fanen sencken / sonder auffrichtig / so lang er kan oder mag / fůrn / Vnd sprechen die alten verstendigen Kriegsleut / wann ein Fendrich 100. Feinde eins stichs erstechen möchte / soll er dannoch den fanen auffrichtig behalten / angesehen / wann das zeichen fellt / weiß niemant auff wen er soll warten / Wann ein Fendrich durch das geschütz oder sonst zu grund geht / soll der nechst bei jm den fanen ergreiffen / vnd jn auffrichtig in aller höhe fůren.
  cs: |-
    Když se bojuje s nepřáteli, nemá žádný praporečník po celou dobu střetu svou korouhev sklánět, nýbrž ji má nést vztyčenou, jak dlouho jen může a dokáže. Staří zkušení válečníci {Kriegsleut} říkají, že i kdyby praporečník mohl jedním bodnutím probodnout sto nepřátel, má přesto udržet korouhev vztyčenou; padne-li totiž znamení, nikdo neví, koho má následovat. Padne-li praporečník zasažen dělem {geschütz} nebo jinak, má se korouhve chopit ten, kdo je mu nejblíže, a nést ji vztyčenou co nejvýše.
- typ: nadpis
  uroven: 3
  de: Von der Reuter Hauptleut Leutenant.
  cs: O poručíkovi {Leutenant} hejtmanů {Hauptleut} jízdy {Reuter}
- typ: odstavec
  de: |-
    WAs eins Reutter Hauptmans Leutenant schuldig ist / wirdt durch des Obersten Leutenants Ampt wol angezeigt. Was auch den andern Beuelchleuten / Toppelsoldnern vnd den Hauptleuten zugehört / als Caplan / Schreiber / Trometer / Forierer / Feld arzt / ist so offenbar / das es derhalben gar kans anzeigens bedarff. Noch ist ein Ampt zu roß im Krieg / heißt der Rhumormeister / es wirdt aber doch wenig oder selten gebraucht / vnd hat die gestalt / wann ein Kriegsuolck zu roß also vngezogen vnd vngehorsam wirt / daß nicht in der Ordnung bleiben / sonder für / neben / nach sudeln mausen vnnd kisten fegen / so macht der Feldmarschalck / doch auß beuelch des Obersten / ein Hauptman / dem gibt er von allen hauffen Reutter zů / die streiffen vornen / neben / hinden / vnd wo sie die Meußköpff finden oder ersehen / jagen sie dieselben in die ordnung / stechen sie herab / vnd soll derselbig / Hauptman allweg die Reutter an die heben / die vnder einem Hauptman ligen / so dürffen sie mit denselben nit zörnen / dann jr Hauptman hat sie deßhalben dahinn geordnet / doch soll ein jeder Hauptman seine Reutter trewlich neben seinem Gebott darfür warnen.
  cs: |-
    Čím je povinen poručík hejtmana jízdy, to dostatečně ukazuje [popis] úřadu nejvyššího poručíka {Obersten Leutenants}. A co náleží ostatním velitelům {Beuelchleuten}, dvojžoldnéřům {Toppelsoldnern} a lidem při hejtmanech – kaplanovi {Caplan}, písaři {Schreiber}, trubači {Trometer}, furýrovi {Forierer}, polnímu lékaři {Feld arzt} –, je tak zjevné, že to žádný výklad nepotřebuje. U jízdy je však ve válce ještě jeden úřad, nazývá se rumormistr {Rhumormeister}; užívá se ho však málo či zřídka. Má takovouto povahu: když jízdní válečný lid {Kriegsuolck} natolik zpustne a zneposlušní, že nezůstává v šiku {Ordnung}, nýbrž vpředu, po stranách i vzadu se toulá, krade a vymetá truhly {kisten fegen}, ustanoví polní maršálek {Feldmarschalck}, ovšem z rozkazu plukovníka {Obersten}, jednoho hejtmana a přidělí mu jezdce ze všech houfů {hauffen}. Ti pak objíždějí vpředu, po stranách i vzadu, a kde najdou nebo spatří záškodníky[^1], ženou je zpět do šiku a srážejí je z koní. Tento hejtman má na ně vždy posílat jezdce od téhož hejtmana, pod nímž provinilci leží; ti se pak na ně nemohou zlobit, neboť je tam k tomu určil jejich vlastní hejtman. Přesto má každý hejtman své jezdce vedle svého zákazu před tím také věrně varovat.
poznamky:
- n: 1
  text: |-
    V tisku „Meußköpff“ (doslova „myší hlavy“ – od slovesa *mausen*, myškovat, tajně krást a drancovat).
