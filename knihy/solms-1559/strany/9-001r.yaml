bloky:
- typ: nadpis
  uroven: 2
  de: Vorrede diser Borgundischen Kriegsordnung.
  cs: Předmluva k tomuto Burgundskému válečnému řádu {Kriegsordnung}
- typ: odstavec
  de: |-
    DIeweil ich in disen meinen Kriegs beschreibungen vermelden/ daß ich solches von den alten Kriegßleuten vnd verstendigen des bericht vnnd vnderweißt worden/ vnnd dasselbig also mit der zeit zusamen gesamelt vnd gebracht hab/ welches die warheit ist/ So hab ich ein Kriegs beschreibung vor langer zeit bekomen/ welche durch den Hochgebornen Herrn vnd Fürsten Hertzog Philipsen von Cleue gemacht vnnd geordnet ist/ vnnd hat das Hertzog Carelen von Borgundt zugeschriben/ auß welchem ich wol vil gůts dings vnd regirung wolt genommen/ in meine Beschreibung gebracht vnnd damit gebessert haben/ so hab ich daß nicht thůn wöllen/ sonder dem löblichen vnnd verstendigen Kriegs Fürsten sein ehr vnd arbeit selber lassen/ vnd demselbigen zu ehren vnd lob/ sein fleiß vnd arbeit in meine Beschreibung nit flicken wöllen/ sonder Iren Fürstlichen Gnaden jhre Beschreibung selber lassen/ vnd zu ehren in disen Truck bringen/ damit solches löblichen Fürsten fleiß/ arbeit vnd verstandt auch mit inn tag kommen mög/ darbei zusehn ist/ daß sich die hohen Stende als die Fürsten/ solcher ehrlicher/ manlicher sachen vnd Regirung angenomen vnd beflissen haben/ damit daß sich ein jeder ritterlicher man vom Adell denen nach auch befleissen soll/ solcher gestalt/ wann sie darbei odder mit im Feld sein werden/ auff solche sachen achtung zu haben/ vnnd befleissen sich darinn zu vben vnd zu beschreiben/ damit jnen auch (wie dises löblichen Fürsten) in ehrlichen vnnd ritterlichen sachen zu langer zeit gedacht werde/ zu ehren jren Kindern/ Freundschafften/ Geschlechten vnd nachkomenden.
  cs: |-
    Poněvadž v těchto svých válečných popisech uvádím, že jsem o tom byl zpraven a poučen od starých válečníků {Kriegßleuten} a znalců a že jsem to tak časem shromáždil a sestavil – což je pravda –, získal jsem už před dlouhou dobou i válečný popis, který sepsal a uspořádal vysoce urozený pán a kníže, vévoda Filip Klévský, a připsal jej vévodovi Karlovi Burgundskému.[^1] Mohl jsem z něho jistě převzít mnoho dobrých věcí a [zásad] správy, vnést je do svého popisu a tím jej zlepšit. To jsem však učinit nechtěl. Chtěl jsem naopak tomuto chvályhodnému a rozumnému válečnému knížeti {Kriegs Fürsten} ponechat jeho čest i práci a k jeho cti a chvále jsem nechtěl jeho píli a práci vplétat do svého popisu. Jeho knížecí Milosti jsem ponechal jeho vlastní popis a ke cti jej dávám do tohoto tisku, aby píle, práce a rozum tak chvályhodného knížete také vyšly na světlo. Je z toho vidět, že se i vysoké stavy, totiž knížata, takových čestných a mužných věcí a správy ujímala a usilovala o ně. Podle jejich příkladu se tedy má přičinit i každý rytířský muž ze šlechty: když bude při tom nebo s vojskem v poli, má si takových věcí všímat a snažit se v nich cvičit a sepisovat je, aby se i na něj (jako na tohoto chvályhodného knížete) v čestných a rytířských věcech dlouho vzpomínalo – ke cti jeho dětí, přátel, rodu a potomků.
- typ: odstavec
  de: |-
    Wiewol sich dise Borgundische Ordnung/ so durch den Fürsten von Cleue gemacht ist/ mit vnser Teutschen Kriegßordnung nit allerding vergleicht/ sonder ein Welsche Ordnung ist/ so ist sie doch nit zu verachten/ sonder eine bei der andern zuhaben/ vnd auß beiden zu nemen was gůt gefunden vnd geacht wirt/ vnd ein Ordnung mit der andern gebessert/ dann sie werden all beide gůten vnderricht mit sich bringen.
  cs: |-
    Ačkoli se tento burgundský řád, který sestavil kníže klévský, s naším německým válečným řádem {Kriegßordnung} ve všem neshoduje, nýbrž je to řád vlašský {Welsche},[^2] nelze jím přece pohrdat. Naopak je dobré mít jeden vedle druhého, z obou brát, co se shledá a uzná za dobré, a jedním řádem zlepšovat druhý; oba totiž poskytnou dobré poučení.
- typ: odstavec
  de: |-
    Dann so vil ich das verstehe/ so ist hochgemelter Fürst von Cleue
  cs: |-
    Pokud tomu totiž rozumím, byl výše jmenovaný kníže klévský
poznamky:
- n: 1
  text: |-
    Karel Burgundský (*Hertzog Carel von Borgundt*) je budoucí císař Karel V. (1500–1558), od roku 1506 vévoda burgundský a od roku 1516 král španělský, jemuž Filip Klévský (1456–1528) svůj spis *Instruction de toutes manières de guerroyer* kolem roku 1516 připsal. Nejde o Karla Smělého († 1477), o němž je řeč na [[9-006v|listu 6v]].
- n: 2
  text: |-
    *Welsch* – románský, cizí; zde francouzský, tj. burgundsko-nizozemský řád psaný původně francouzsky, na rozdíl od německých (lanckneštských) řádů v předchozích knihách.
