      Dále: vytáhl 18. května; do 5. června to činí 18 dní jízdy a stání, na každého koně na každý den po 6 bacenech, a to za 2 koně
    - 14 zl. 6 bac.
  - - 'součet strany: peníze'
    - 126 zl. 12 bac.
  - - 'součet strany: koně'
    - '17'
  - - 'součet strany: vozy'
    - '0'
poznamky:
- n: 1
  text: |-
    Tisková chyba *Sall* za *Stall*. Tento druhý rejstřík vyúčtovává příjezdné (*Anrittgeld*): 6 bacenů na koně a den a 12 bacenů na vůz a noc za dny cesty a čekání (*anreiten vnd stilligen*) až do začátku přehlídky 5. června 1544. Tisk jej sází po odstavcích s částkou na konci řádku; v edici je zapsán jako tabulka (text | částka). Zl. = zlatý (*gulden, flo.*), bac. = bacen (*batzen*); 15 bacenů = 1 zlatý.
- n: 2
  text: |-
    *Vocem jucunditatis* je 5. neděle po Velikonocích (Rogate); v roce 1544 připadla na 18. května, pondělí po ní je tedy skutečně 19. května. *Blassenberg* = hrad Plassenburg nad Kulmbachem, sídlo markraběte. Výpočet: 91 × 17 × 6 = 9282 bac. = 618 zl. 12 bac.
- n: 3
  text: |-
    Podle položek má mít skupina 8 + 3 = 11 vozů; tisk má 12. Rovněž některé dílčí částky nesedí: u Christoffela von Hennenberg dává 11 × 15 × 6 bac. přesně 66 zl. (tisk 66 zl. 5 bac.), u Alberta Berlina 3 × 16 × 6 bac. = 19 zl. 3 bac. (tisk 24 zl.). Úhrny strany však s tištěnými položkami souhlasí.
