bloky:
- typ: odstavec
  de: |-
    26 So wir aber jrer nit weiter bedürfftig vnd jnen vrlaub geben würden/ soll es zu vnserm gnedigen willen vnd gefallen stehn/ jnen ein gantzen Monat Solt oder das abrit gelt vom Platz des vrlaubs biß zu eines jeden ort/ da er angeritten entrichten vnd bezalen zulassen wie den anrit/ doch sollen sollicher Reuter Oberste Hauptleut oder Ritmeister ein jeder seinen abrit gelt/ ferre des wegs bei seiner pflicht zuübergeben schuldig sein/ die bezalung des abrits darauff zuempfahen haben/ vnd hierinn in alweg kein geuerde gebraucht werden.
  cs: |-
    26[^1] Kdybychom jich však už dále nepotřebovali a dali jim propuštění {vrlaub}, bude záležet na naší milostivé vůli a libosti, zda jim dáme vyplatit celý měsíční žold {Monat Solt}, nebo odjezdné {abrit gelt} z místa propuštění až tam, odkud kdo přijel, stejně jako příjezdné {anrit}. Plukovníci {Oberste}, hejtmani nebo rytmistři {Ritmeister} těchto jezdců {Reuter} jsou však povinni každý pod svým závazkem {pflicht} předložit své odjezdné podle vzdálenosti cesty a podle toho obdržet výplatu odjezdného; a nemá se při tom v žádném ohledu užívat lsti {geuerde}.
- typ: odstavec
  de: |-
    27 Item sie sollen vnsere vnderthonen vnd verwandten wer die sein niemants außgenomen/ im an vnnd abzug/ auch sonst in keinerlei weg beschedigen/ sonder jederman gütliche bezalung thůn/ biß das sie gegen den feinden zu Velt ligen/ alßdan mögen sie die Füterung suchen vnd gebrauchen/ doch sollen sie von den Wirthen vngebürlich nit beschwert werden.
  cs: |-
    27 Dále: naše poddané a spřízněné {verwandten}, ať jsou to kdokoli, nikoho nevyjímaje, nemají při příchodu ani odchodu ani jinak žádným způsobem poškozovat, nýbrž mají každému poctivě platit, dokud nebudou ležet v poli proti nepříteli. Teprve potom smějí shánět a brát píci {Füterung}; hostinští je však nemají nepřiměřeně zatěžovat.
- typ: odstavec
  de: |-
    28 Item so Oberste Velthauptleut von den feinden niderlegen/ vnd von jnen gefangen vnnd erobert würden/ sollen dieselbigen mit jren Personn zu vnsern vnd vnsers öbersten händen gestelt werden/ wo aber ausserhalb der gemelten öbersten Velthauptleut ander personen gefangen würden/ die mag jeder der sie niderwirfft schetzen vnd damit nach seinem gefallen handeln/ doch sollen dieselben gefangne von stundan dem öbersten Velthauptman angezeigt/ vnd on sein wissen vnd verwilligung nit ledig gegeben werden.
  cs: |-
    28 Dále: kdyby byli nějací nejvyšší polní hejtmani {Oberste Velthauptleut} nepřítele přemoženi, zajati a dobyti, mají být osobně vydáni do rukou našich a našeho plukovníka {öbersten}. Budou-li však kromě uvedených nejvyšších polních hejtmanů zajaty jiné osoby, smí jim každý, kdo je přemohl, uložit výkupné {schetzen} a naložit s nimi podle své vůle. Tito zajatci však mají být ihned ohlášeni nejvyššímu polnímu hejtmanovi a bez jeho vědomí a svolení nesmějí být propuštěni na svobodu.
- typ: odstavec
  de: |-
    29 Item Stet/ Schlösser/ Flecken/ Dorffer vnd leut/ auch was von grossem Geschütz vnnd desselbigen zugehörigen Munition darinn erobert würde/ soll vns zustehn volgen vnd bleiben/ vnd sollen dieselben eroberten vnd gehuldigten/ auch die auffgenomene Stet/ Schlösser/ Flecken/ Dörffer vnd leut/ nach dem sie auffgenomen sein souil sie der erobert/ weitter nit geschedigt noch geprantschatzt werden/ aber alle andere gewunnen hab so preiß sein/ sollen jnen bleiben vnd keiner den andern von seiner gewunnen hab verdringen.
  cs: |-
    29 Dále: města, zámky, městečka, vesnice a lidé, jakož i velká děla {grossem Geschütz} a k nim náležející munice {Munition}, které by v nich byly dobyty, mají náležet, připadnout a zůstat nám. Dobytá místa, která složila hold, ani města, zámky, městečka, vesnice a lidé přijatí na milost, kolik jich dobudou, nemají být po přijetí na milost dále poškozováni ani zatěžováni výpalným {geprantschatzt}. Všechen ostatní ukořistěný majetek, který je volnou kořistí {preiß}, jim však zůstane a nikdo nemá druhého z jeho kořisti vytlačovat.
- typ: odstavec
  de: |-
    30 Item ein jeder Rotmeister oder Beuelchhaber/ sollen sich nach des Obersten oder desselben beuelchhabers außschaffen vnd gebieten mit jren leiben/ pferden/ wagen vnd in alle andere weg gehorsamlich halten/ sich willig zu vnd von den feinden in allen sachen samptlich vnd sonderlich gebrauchen lassen/ vnd one des öbersten oder deßselben beuelchhabers zulassen vnd erlaubtnuß mit jren fanen noch Rotweiß oder sonst inn andere weg auß der ordnung vnd leger nicht reiten/ noch die wagen farn lassen/ sonder ein jeder bleib wie er geordnet vnd bescheiden ist/ vnd sich in allem dem wie ehrlichen getrewen kriegßleuten gegen jrem Herrn vnd öbersten zusteht vnd gebürt/ halten.
  cs: |-
    30 Dále: každý rotmistr {Rotmeister} nebo velitel {Beuelchhaber} se má podle příkazů a nařízení plukovníka nebo jeho velitele poslušně řídit svou osobou, koňmi, vozy i ve všech ostatních věcech. Mají se ve všech věcech ochotně dát použít při tažení proti nepříteli i při ústupu od něj, společně i jednotlivě. Bez svolení a dovolení plukovníka nebo jeho velitele nesmějí se svými korouhvemi {fanen} ani po rotách {Rotweiß} ani jinak vyjíždět ze šiku {ordnung} a z ležení {leger}, ani nechávat odjíždět vozy. Každý ať zůstane tam, kam byl zařazen a určen, a ve všem se chová tak, jak se sluší a patří na čestné a věrné válečníky {kriegßleuten} vůči jejich pánu a plukovníkovi.
poznamky:
- n: 1
  text: |-
    Články 26–37 pokračují ve služebním listu (*Verzeichnuß, Stat vnd Articul*) císaře Karla V. pro markraběte Albrechta Braniborského (Albrecht Alkibiades, 1522–1557) jako plukovníka nad tisícem zbrojných koní; listina začíná na [[6-017r|s. 6-017r]].
