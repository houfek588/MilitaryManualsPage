bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Sententz gefallen / den soll der Veldmarschalck den Personen oder Partheien sagen vnd verkünden.
  cs: |-
    rozsudek, ten má polní maršálek {Veldmarschalck} osobám či stranám oznámit a vyhlásit.
- typ: odstavec
  de: |-
    Würde es aber ein peinliche sach sein / die mit leib straff durch den Scharpffrichter volnzogen soll werden / so soll solliches Vrtheil oder Sententz durch den Prouosen vor dem Gericht vnnd gantzen hauffen den Verurtheilten verkündet werden / dasselbig also offentlich vorlesen / vnd wann er selber nicht lesen künde / durch seinen Schreiber / doch in seinem beisein / dem Scharpffrichter die straff zuthůn beuelhen.
  cs: |-
    Šlo-li by však o hrdelní věc {peinliche sach}, v níž má kat {Scharpffrichter} vykonat tělesný trest, má profous {Prouosen} takový ortel či rozsudek vyhlásit odsouzeným před soudem {Gericht} a celým houfem {hauffen}. Má jej veřejně přečíst – a neumí-li sám číst, ať to učiní jeho písař {Schreiber}, avšak v jeho přítomnosti – a pak katovi přikázat, aby trest vykonal.
- typ: odstavec
  de: |-
    Weitter zu dem Artickel / darinn vermelt / wann der Veldoberber selbst setzen / odder an stat seiner einen ordenen / dann hat der Veldmarschalck macht wo sich ein geschwinder / schwerer fall zutrüge / bei allen Regimenten Personen als Kriegßuerstengigen zufordern / dieselben zu Rath nider setzen / die sachen zu ende helffen handeln vnd richten / darbei soll der Oberst sie handhaben / vnnd Recht ergehen lassen.
  cs: |-
    K článku, v němž se uvádí, kdy má nejvyšší polní hejtman {Veldoberster}[^1] zasednout sám nebo za sebe někoho ustanovit, je dále třeba dodat: přihodí-li se naléhavý a těžký případ, má polní maršálek moc povolat ze všech pluků {Regimenten} muže znalé války, posadit je do rady a dát jim pomoci věc projednat až do konce a rozsoudit. Plukovník {Oberst} je má přitom chránit a nechat právu volný průchod.
- typ: odstavec
  de: |-
    Es hat der Veldmarschalck auch wol macht / wann er ein sach also gerechtfertigt vnd zu straffen geweist hat / vnnd doch der gestalt geschaffen daß sie milterung leiden möchte / dann mag er sie dem Obersten Veldhauptman zu weisen / der gestalt / ob er bei demselbigen gnad erlangen künde als bei dem Haupt daß er mit sampt den andern des wol zufrieden sei / also ist gnad bei Recht / vnd bleibt das Recht in seiner Ordnung dann der Oberst vil gewalt vnnd genaden hat / doch sol der Oberst dem Feldmarschalck vnd dem Gericht / nit mit gewalt eingreiffen / wann sie billich handeln / sonder sie sollen obeinander halten.
  cs: |-
    Polní maršálek má také plnou moc: když věc takto soudně projednal a odsoudil k trestu, a přece je takové povahy, že by snesla zmírnění, smí ji postoupit nejvyššímu polnímu hejtmanovi {Obersten Veldhauptman}, aby [odsouzený] mohl u něho jako u nejvyšší hlavy dosáhnout milosti, s čímž on [maršálek] i ostatní plně souhlasí. Tak stojí milost vedle práva a právo zůstává ve svém řádu, neboť plukovník má velkou moc a právo udílet milost. Nemá však polnímu maršálkovi ani soudu násilím zasahovat do pravomoci, jednají-li spravedlivě; mají spíše držet jeden při druhém.
- typ: odstavec
  de: |-
    Was sonst das Feldmarschalcks Ampt vnd beuelch weiter ist / das wirt im Bůch der Ampter beschrieben werden.
  cs: |-
    Co se jinak týče dalších povinností a pravomocí úřadu polního maršálka, to bude popsáno v Knize úřadů.[^2]
- typ: odstavec
  de: |-
    Dieweil nun so bald mann mit den hauffen in das Feld zusamen kompt / die Prouiant das hauptstück ist so volgt derselben Ordnung vnnd versehung auff die Justitien / dieweil aber gemelte Ordnung / nach lengst im Bůch der Empter erzelt wirt / so wil ich alhie mit kurtzen worten daruon schreiben / souil dienlich sein wil.
  cs: |-
    Jakmile se houfy sejdou v poli, je hlavní věcí proviant {Prouiant}; proto po spravedlnosti následuje jeho řád a zajištění. Poněvadž je však tento řád zevrubně vylíčen v Knize úřadů, napíši o něm zde jen krátce, nakolik to bude užitečné.
- typ: odstavec
  de: |-
    Der Prouiantherr nach dem er in der zeit sein Prouiant bestellet / das jhm dieselbig gleichs nachkommen möge / so soll er wo ein leger liegen wirdt / einen Prouiantplatz ausserhalb dem leger haben / darauff er alle bestelte Prouiant füren soll lassen / bei demselbigen sein losament sampt den seinen haben / dieselbig inn gůter verwarung vnnd schutz halten / darmit niemants deren so zufüren gewaltig werde / weder mit nemen noch arestiern / derwegen
  cs: |-
    Jakmile proviantní pán {Prouiantherr} včas objedná proviant tak, aby mu mohl průběžně docházet, má tam, kde se rozloží ležení {leger}, zřídit vně ležení proviantní tržiště {Prouiantplatz}, kam nechá svážet veškerý objednaný proviant. U něho má mít se svými lidmi své ubytování {losament} a držet tržiště v dobré ostraze a ochraně, aby se nikdo nemohl dopouštět násilí na těch, kdo zásoby přivážejí, ani braním, ani zabavováním, a tedy
poznamky:
- n: 1
  text: |-
    V tisku chybně *Veldober-ber* (místo *Veldoberster*) a o něco dále *Kriegßuerstengigen* (místo *Kriegßuerstendigen*).
- n: 2
  text: |-
    Odkaz na Druhou knihu tohoto svazku (*Von beschreibung der 24. Kriegßämpter*); o úřadu polního maršálka pojednávají listy [[025r|25r]]–[[027v|27v]] (srov. též o proviantním pánovi od listu [[032v|32v]]).
