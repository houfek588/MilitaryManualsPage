    Rozkládací dvojlistový dřevořez na rubu listu 24 (bez letopočtu a signatury): monumentální hlavní čtverhranný srub se čtyřmi mohutnými vysunutými baštami do všech čtyř stran a krytou průchozí cestou v levé i pravé baště; levá polovina pevnosti stojí na suché zemi za dřevěným mostem nad valovým průchodem, pravá polovina stojí přímo ve vodě zobrazené zvlněným šrafováním. Na středním nádvoří stojí řady stanů a ozbrojenci, na horní, dolní a pravé baště jsou dělové baterie a celý obvod lemují zalomené obvodové zákopy.
