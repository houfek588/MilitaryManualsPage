    Rozkládací dřevořez přes dvě strany (bez letopočtu a monogramu) k [[5-025r|osmému srubu]]: veliký čtverhranný hlavní srub se čtyřmi mohutnými vysunutými baštami se stanovišti pro děla. Levá polovina stojí na suché zemi, pravá ve vodě (zvlněné šrafování). Vchod vede zleva přes dřevěný most a levou baštu a pokračuje průchodem skrz celý srub až do pravé bašty. Uprostřed nádvoří stany a vojáci, na baštách děla; celek obíhá zalomená vnější šance.
