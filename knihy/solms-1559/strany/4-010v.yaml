id: 4-010v
list: 10 (4. kniha)
strana: verso
sken: 408
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    stefftlein gerat auff dem mittel riß stehn/ vnd geradt winckel recht vnd sie so hoch seien das sie vber die Büchsen gehn/ daß mann ein Schnor darüber ziehen mag/ wie die Figur anzeigt also zeigt die Schnor hinden an wo die mitten auff dem Kern ligt/ vnd wie krom der Kern in der Büchsen lige odder sein mag/ so gehet vnnd richt sich die Kugel vornen etwan vier Kugeln lang/ nach dem Ror odder Kern/ gott gebe wie vil krom der Kern oder die Büchse hinder sich hab.
  cs: |-
    kolíčky přímo na středové rysce, přesně v pravém úhlu, tak vysoké, aby přesahovaly nad hlaveň děla, aby přes ně bylo možno natáhnout šňůru, jak ukazuje figura. Šňůra pak vzadu ukáže, kde leží střed jádra {Kern}, a jakkoli křivě může jádro v děle ležet či probíhat, přesto se koule {Kugel} vpředu v délce asi čtyř koulí řídí a směruje podle hlavně či jádra, ať jest jádro nebo dělo za tím sebevíc křivé.
- typ: odstavec
  de: |-
    Der vierdt Riß oder stück hat gleich ein Richtscheidt vñ ist vornen winckel recht/ hat ein Combaß vornen der weist auch die seiten wo der Kern ligt/ doch soll mann vor die Büchsen oben auff dem kopff mit einem poncten mitten gerad vber das loch der Büchsen zeichen/ vnd das Richtscheidt als mit der seiten in die Büchsen wider anhalten/ vnd den Combaß zeichen/ wie das zünglin in dem Combaß steht/ vnd dann die seiten so an der Büchsen innen angelegn ist mitten auff den ponck auff die Büchsen halten/ vnd wann der Combaß wider insteht wie vor in der Büchsen/ so zeugt mann dann dem nach vor den puncten ein Schnor hinden vor die Büchs/ die zeigt die mitten hinden auff der Büchsen.
  cs: |-
    Čtvrtý nákres či kus má rovněž rovnací pravítko {Richtscheidt}, jež jest vpředu pravoúhlé a má vpředu kompas {Combaß}, který také ukazuje stranu, na níž leží jádro {Kern}. Nejprve se však má dělo nahoře na hlavě označit důlkem či bodem přímo uprostřed nad ústím hlavně, pak se pravítko přiloží boční hranou dovnitř do děla a označí se na kompasu, jak stojí střelka kompasu; potom se ta hrana, jež přiléhala uvnitř v děle, přiloží nahoře na dělo přímo na onen bod, a jakmile se kompas opět ustálí tak jako dříve uvnitř děla, natáhne se podle toho od předního bodu šňůra dozadu přes dělo – ta ukáže skutečný střed vzadu na hlavni.
