id: 4-010v
list: 10 (4. kniha)
strana: verso
sken: 408
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    stefftlein gerat auff dem mittel riß stehn/ vnd geradt winckel recht vnd sie so hoch seien das sie vber die Büchsen gehn/ daß mann ein Schnor darüber ziehen mag/ wie die Figur anzeigt also zeigt die Schnor hinden an wo die mitten auff dem Kern ligt/ vnd wie krom der Kern in der Büchsen lige odder sein mag/ so gehet vnnd richt sich die Kugel vornen etwan vier Kugeln lang/ nach dem Ror odder Kern/ gott gebe wie vil krom der Kern oder die Büchse hinder sich hab.
  cs: |-
    kolíčky přímo na středové rysce, přesně v pravém úhlu, a tak vysoké, aby přesahovaly nad dělo a dalo se přes ně natáhnout šňůru, jak ukazuje figura. Šňůra pak vzadu ukáže, kde leží střed jádra {Kern}; a ať jádro v děle leží jakkoli křivě, koule {Kugel} se vpředu na délce asi čtyř koulí řídí a směřuje podle hlavně {Ror} či jádra, ať je jádro nebo dělo vzadu sebevíc křivé.
- typ: odstavec
  de: |-
    Der vierdt Riß oder stück hat gleich ein Richtscheidt vnd ist vornen winckel recht/ hat ein Combaß vornen der weist auch die seiten wo der Kern ligt/ doch soll mann vor die Büchsen oben auff dem kopff mit einem poncten mitten gerad vber das loch der Büchsen zeichen/ vnd das Richtscheidt als mit der seiten in die Büchsen wider anhalten/ vnd den Combaß zeichen/ wie das zünglin in dem Combaß steht/ vnd dann die seiten so an der Büchsen innen angelegn ist mitten auff den ponck auff die Büchsen halten/ vnd wann der Combaß wider insteht wie vor in der Büchsen/ so zeugt mann dann dem nach vor den puncten ein Schnor hinden vor die Büchs/ die zeigt die mitten hinden auff der Büchsen.
  cs: |-
    Čtvrtý nákres či kus má rovněž rovnací pravítko {Richtscheidt}, vpředu pravoúhlé a opatřené kompasem {Combaß}, který také ukazuje, na kterou stranu jádro leží. Nejprve se však má dělo vpředu nahoře na hlavě označit bodem přesně uprostřed nad ústím. Pak se pravítko opět přiloží boční hranou zevnitř k dělu a poznamená se, jak stojí střelka (*zünglin*) kompasu. Potom se tatáž hrana, která uvnitř v děle přiléhala, přiloží nahoře na dělo přímo na onen bod; a když kompas ukazuje stejně jako předtím v děle, natáhne se podle toho od bodu šňůra dozadu přes dělo – ta ukáže střed děla vzadu.
