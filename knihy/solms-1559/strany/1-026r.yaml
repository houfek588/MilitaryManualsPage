bloky:
- typ: nadpis
  uroven: 2
  de: Warzu ein Wagenburg zugebrauchen sein mag.
  cs: K čemu lze užít vozovou hradbu {Wagenburg}.
- typ: odstavec
  de: |-
    VOr das erst / so ist ein Wagenburg zugebrauchen / wann mann zeugt vnnd nit gewaltig starck gnůg / das mann sich etwann der Feindt mehr als an einem ort zuerwarten vnd zuuersehen het / so kan mann die Wagenburg wol auff einer seiten / neben dem zug in Ordnung gehen lassen / vnd schützen darbei / die neben vnd in solche Wagenburg tretten vnd sicher stehen mögen / das sie nit mit einem Reisigen zeuge vberrent vnd auß jhrem standt vnd vortheil getrungen werden mögen / vnd wie starck vnd sicher sie hinter vnd in der Wagenburg stehn können / vnd wenig so gůt seind vnd sein mögen / als wann der zwei oder dreimal souil weren / ledig vnd frei stünden.
  cs: |-
    Za prvé lze vozovou hradbu použít tehdy, když se táhne a vojsko není přesilou dostatečně silné, takže se lze nadát a obávat nepřátel více než z jedné strany: pak lze vozovou hradbu nechat jet po jedné straně vedle pochodového šiku {zug} v pořádku a při ní střelce {schützen}, kteří mohou vstupovat vedle ní i do ní a stát bezpečně, aby nemohli být najeti zbrojnou jízdou {Reisigen zeuge} a vytlačeni ze svého postavení a výhody; a jak pevně a bezpečně mohou stát za vozovou hradbou i v ní, takže jich stačí málo, a přesto jsou tak dobří a mohou dokázat tolik, jako kdyby jich bylo dvakrát nebo třikrát tolik na volném a nekrytém prostranství.
- typ: odstavec
  de: |-
    Zum andern so mann etwan ein Scharmützel ordnet / oder ein besichtigung thůn wirt / so kan mann an ein ort Schützen legen oder stellen / vnd Wagen mit geschütz vor sie ziehen / das sie also ein sichern stand haben können / vnnd die daraussen wissen / das sie auff die schützen weichen mögen / vnd also bei jnen ein vorteil vnd Paß haben.
  cs: |-
    Za druhé: pořádá-li se někdy šarvátka nebo se koná obhlídka, lze na nějaké místo položit či postavit střelce a zatáhnout před ně vozy s děly {geschütz}, takže tak mohou mít bezpečné stanoviště a ti venku vědí, že mohou ustoupit ke střelcům a mít tak u nich výhodu a krytý průchod.
- typ: odstavec
  de: |-
    Zum dritten so mag mann auch wol mit solchen Schützen / ein paß vnd vorteil einnemen / den Feinden darmit ein vorziehens wehren vnd auff halten.
  cs: |-
    Za třetí lze také s takovými střelci obsadit průsmyk a výhodné místo a tím nepřátelům zabránit v dalším postupu a zadržet je.
- typ: odstavec
  de: |-
    Zum vierdten so kan mann auch wol ein hauffen fein an sich hencken vnnd vor jnen weichen / vnd sie füren / so sie dann also nach volgen wolten / so kündt mann hinter jnen oder nahe darbei / mit einem hauffen Schützen vnd Wagen / etwan an einem paß vorkomen / wann sie wider hinter sich wolten / das jn solche Wagenburg in weg gerückt werde / vnnd sie also darfür vber musten / vnd also verhindert / das sie sich dardurch seumen würden vnd schaden leiden / vnd künden die in der Wagenburg von den feinden nit vberrent werden / sonder stehen in sicher gewar.
  cs: |-
    Za čtvrté lze také obratně přilákat nějaký houf {hauffen} za sebou, ustupovat před ním a vodit jej za sebou; chtěli-li by pak takto pronásledovat, dalo by se za nimi nebo v blízkosti s houfem střelců a vozů nadjet k nějakému průsmyku, takže kdyby se chtěli vrátit zpět, přisunula by se jim taková vozová hradba do cesty, takže by se přes ni museli dostávat, a tak by jim bylo zabráněno v průchodu, čímž by se zdrželi a utrpěli škodu, kdežto ti ve vozové hradbě by nemohli být nepřáteli najeti, nýbrž stáli by v bezpečném krytu.
- typ: odstavec
  de: |-
    Zum fünfften so kan es sich auch zůtragen / das mann etwan ein sorglichen abzug thůn můß / so kan mann wol ein Wagenburg / mit Schützen vnnd Geschütz inn oder neben den nachzug ordnen / das mann darinn nicht eillend fallen / sonder allweg den nachzug also retten kan / wann der also im vortheil stehet / vnnd zeit leiden mag / biß das die vorziehende hauffen / zu jm komen / vnd in vorteil stehen mögen.
  cs: |-
    Za páté se také může přihodit, že je nutno vykonat nebezpečný ústup: pak lze dobře zařadit vozovou hradbu se střelci a děly do zadního voje {nachzug} nebo vedle něj, aby do něj nepřítel nemohl zhurta vpadnout, nýbrž aby se dal zadní voj vždy takto zachránit, když stojí ve výhodném postavení a může vydržet tak dlouho, dokud k němu nedorazí předcházející houfy a nezaujmou výhodné postavení.
