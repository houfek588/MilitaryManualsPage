bloky:
- typ: nadpis
  uroven: 2
  de: Das drit Blochaus.
  cs: Třetí srub.
- typ: odstavec
  de: |-
    Die drit Figur ist der gestalt an ein ort zulegen/ da mann auch einen Paß möcht haben/ vnd dieselbigen strassen etwan mit Gewalt müsten verlegt werden/ vnnd darinn gut Geschütz sein müst/ wie die Figur dasselbig außweist oder anzeigt/ dasselbig drit Blochaus mag mann also groß oder klein machen nach gelegenheit es die noturfft erfordert/ vil oder wenig leut darin zuhaben/ darnach mag mann es groß oder klein machen/ vnd solches drit Blochhaus hat auff den dreien seiten drei außgeuierdte stacker Streichen/ vnd auff der vierdten seiten einen verdeckten auß vnd eingang.
  cs: |-
    Třetí vyobrazení je takové, aby se položilo na místo, kde je také průsmyk {Paß} a kde by se snad silnice musely zahradit mocí, a proto v něm musí být dobrá děla {Geschütz}, jak vyobrazení ukazuje. Tento třetí srub {Blochaus} lze udělat velký či malý podle příležitosti, jak to potřeba vyžaduje, podle toho, zda v něm má být mnoho či málo lidu; podle toho jej lze udělat velký nebo malý. Tento třetí srub má na třech stranách tři vysunuté hranaté silné boční obrany {Streichen} a na čtvrté straně krytý východ a vchod.[^1]
poznamky:
- n: 1
  text: |-
    V tisku „stacker“ (přesmyčka za *starcke*). *Außgeuierdt* = vysunutý do čtverce, hranatý.
