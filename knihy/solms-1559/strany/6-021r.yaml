poznamky:
- n: 1
  text: |-
    Součet položek skupiny (½ + ½ + ½) dává 1½ trénového koně; tisk má ½. Úhrn celého oddílu (6½) počítá s 1½. Podobně u skupiny Heinricha Meiburga dávají vozy ½ + ½ + ½ = 1½, tisk má 1. U Wentzela von Grun a Reinharta Gaburta tisk počet vozů neuvádí.
- n: 2
  text: |-
    Jobst von Dalwigk z hesenského rytířského rodu Dalwigků; jeho oddíl pokračuje na další straně a uzavírá jej úhrn 147 zbrojných koní.
