  popis: |-
    Celostránkový dřevořez otočený o 90° (monogram „BF“ na podélné šanci, letopočet „1559.“ vpravo) k [[5-025b-r|devátému srubu]]: ležení kryté šancemi – dlouhá podélná šance s čísly „1“, „2“, „3“ u jednotlivých úseků a z ní vybíhající příčné šance, které ležení dělí na odstupňované oddíly se stany, děly a vojáky; každá šance kryje prostor za sebou.
