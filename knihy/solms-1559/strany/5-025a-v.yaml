  popis: |-
    Celostránkový vložený dřevořez (natočený o 90° na šířku, obrácený v rozevření knihy přímo proti straně `5-025b-r` s devátým srubem; líc tohoto vloženého listu je v originále prázdný a v digitalizaci BSB vynechaný). Signován monogramem „BF“ na čelním ochranném valu uprostřed vlevo a letopočtem „*1559*“ při pravém okraji: dva souběžné opevněné polní tábory chráněné vysokými podélnými náspy a trojicí stupňovitě odsazených příčných valů (*Zwerchschantzen*) očíslovaných „1“, „2“, „3“, uvnitř stany, dělová postavení a ozbrojení vojáci krytí před dělostřelbou z výše položené městské bašty.
