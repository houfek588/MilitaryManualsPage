poznamky:
- n: 1
  text: Zda jde o úřad (vachmistr dvorské družiny vévody Mořice), nebo o příjmení, nelze z tisku rozhodnout; počet 27 koní ukazuje spíše na vachmistra s vlastním oddílem. Položky 6–11 patří stále k příjezdnému dvorské družiny vévody Mořice; většina jezdců urazila k přehlídce 53 mil.
