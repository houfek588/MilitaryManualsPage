bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    dann gůt vnd billich / so soll er einen frommen vnd getrewen Man darzů ordnen / der ein Prouiantherr sei / vnd derselbig Prouiantherr der soll mit allem fleiß in den Stätten / Schlossen / vnd in den Landschafften / wo sich das zutragen würde / sich befragen nach personen die darin wonen vnd bekandt sein / auch die gelegenheit wissen / vnd dieselbigen zů sich nemen / von jhnen anhören / wo die frücht im Landt hin vnd wider liegen / vnnd sich dieselben weisen lassen / wo er die findt / an einem jeden ort vberschlagen / daß er wissen mag / wieuil er möge an allen orten in der gantzen summa haben / vnnd dasselbig maß / das an sollichen orten gebräuchlich ist / nemen / vnnd wigen wie schwere das wigt / vnd alßdann malen / vnd den abgang der daruon geht / abziehen / vnnd dann mit kundtschafft das Brot auff zwei vnd vier pfundt bachen lassen / dasselbig Brot ist gůt auff die Rotten zutheilen / vnd zu vberschlagen / dieweil es also im gewicht stehet / vnnd kan leichtlich gůte Ordnung darmit halten / Dann wann einer spricht: Ich habe souil Personen vnder meinem Regiment? So spricht der ander: So gib ich dir souil Brots / tragen souil pfundt / so kanst du deiner Personen einer souil geben / ein pfundt / ein halbs / vnd wann sichs zůtregt / daß manns gehaben kan. Vnd der Prouiantherr soll auch die Becker nemen an allen orten in der Landtschafft / vnd sich mit jhnen besprechen vnnd vergleichen / wieuil Brots ein jeder vermeinet allen tag zubachen vnnd zulieffern / auß sein selbst vermögen / vnnd nicht auß der Commiß vorrat / Dann es ist / das die Becker gemeinlich kundtschafft vnd anhenge mit den Baurn haben / die jhnen vber Jar getreyde vnnd Frucht brengen / Vnd wann solliche Becker sich würden einlassen mit dem versprechen / ein jeder nach seinem vermögen ein anzal zulieffern / so soll der Prouiantherr / derselbigen Becker Obrigkeit darzů erfordern / vnnd mit derselbigen wissen handeln vnd beschliessen / daß sie die Becker dahin halten / daß solches gewiß sei.
  cs: |-
    je pak dobré a slušné, aby k tomu ustanovil poctivého a věrného muže za proviantního pána {Prouiantherr}. Ten se má ve městech, zámcích a krajích, kudy by se táhlo, pilně vyptávat na osoby, které tam bydlí, jsou známé a znají místní poměry. Má si je vzít k sobě a vyslechnout od nich, kde v zemi tu i onde leží obilí, nechat si je ukázat a na každém místě, kde je najde, odhadnout, aby věděl, kolik ho může mít na všech místech v celkovém součtu. Má vzít míru, která je na těch místech obvyklá, zvážit, kolik váží, obilí pak semlít a odečíst úbytek, který při tom vznikne, a potom podle tohoto zjištění nechat péct chléb po dvou a čtyřech librách {pfundt}. Takový chléb se dobře rozděluje na roty {Rotten} a snadno propočítává, protože má pevnou váhu, a lze s ním snadno udržet dobrý pořádek. Když totiž někdo řekne: „Mám pod svým velením tolik a tolik osob,“ druhý odpoví: „Dám ti tolik a tolik chlebů, váží tolik a tolik liber, takže můžeš dát každé ze svých osob tolik – jednu libru nebo půl, podle toho, kolik je k mání.“ Proviantní pán má také na všech místech v kraji přibrat pekaře, domluvit se a dohodnout s nimi, kolik chleba si každý troufá denně napéct a dodat ze svých vlastních zásob, a ne ze zásob komisu {Commiß}; pekaři totiž mívají známosti a spojení se sedláky, kteří jim po celý rok vozí obilí a úrodu. Když se pak pekaři zavážou dodávat každý podle svých možností určitý počet, má proviantní pán přizvat jejich vrchnost a s jejím vědomím vyjednat a uzavřít, aby pekaře k tomu přidržela a dodávka byla jistá.
- typ: odstavec
  de: |-
    Vnd so der Prouiantherr dann also sein anzal mit den Beckern hat verglichen / so soll er dann mit den Amptleuten oder Obrigkeiten handeln / daß sie jnen was sie darzů vermögen / souil die summa des Brots erfordert / verhelffen / vnd derselbig soll sich der fůhre vnd des Brots mit der Obrigkeit gewiß machen / vnd der tag vnnd malstat mit jnen vergleichen / wo sie damit sollen hinfaren / daß sie zusamen / vnd zu dem Gleidt mit den andern kommen.
  cs: |-
    A jakmile se proviantní pán takto dohodl s pekaři o počtu, má jednat s úředníky {Amptleuten} nebo vrchnostmi, aby jim [pekařům] pomohli, čím mohou, kolik si celkové množství chleba žádá. Proviantní pán se má s vrchností ujistit ohledně povozů a chleba a ujednat s nimi dny a místa srazu, kam s tím mají jet, aby se shromáždili a připojili se k doprovodu s ostatními.
- typ: odstavec
  de: |-
    Vnd so er dann also hat verordnet / vnd seine summa weiß / vnd hat souil daß er vermeint / sein Volck darmit zuerhalten / so soll er seinen vorrath der Commiß nicht angreiffen / sonder sparen / Wolt
  cs: |-
    A když to takto zařídil, zná svůj celkový počet a má tolik, že soudí, že tím uživí svůj lid, nemá sahat na svou zásobu komisu, nýbrž šetřit; kdyby
