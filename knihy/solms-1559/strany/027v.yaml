  popis: |-
    Celostránkový dřevořez nejvyššího zbrojmistra v architektonickém obloukovém rámu s rozvilinami v horních cviklech (signováno monogramem HD – Hans Döring – a datováno 1545): vousatý velitel v tříčtvrteční plátové zbroji s kroužkovými rukávy a v železném klobouku s bohatým péřovým chocholem jede vpravo na statném koni chráněném čelním plátem a routovanou čabrakou se střapci. V pravé ruce drží šikmo vzhůru krátké kopí se střapci, u boku má kord a před přední rozsochou sedla válcovitou prachovnici či pouzdro s rukojetí pistole. V pozadí pod oblaky zvlněná krajina s lesem, vodní plochou a hradem či opevněným městem na pravém okraji.
