poznamky:
- n: 1
  text: |-
    Philipp von Kronberg (Cronberg) z porýnského rytířského rodu vedl vlastní oddíl jezdců, k němuž patřili i rýnský hrabě (*Reingraue*), Philipp von Fleckenstein, Wolf von Dalberg a další; Heinrich von Bernigßhausen (na další straně *Wernigßhausen*) vedl další oddíl. Úhrn na začátku strany (305 zbrojných koní) je souhrn předchozí skupiny „ze stáje markraběte“.
- n: 2
  text: Tisková chyba *Gerster* za *Gerüster*.
