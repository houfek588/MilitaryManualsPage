list: '35'
strana: verso
sken: 80
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vnd Rath bei gefunden hab / derhalben so kom ich wider zu euch / vnd will euch nichts bergen / wie die sachen stehn mit einem jungen Gesellen / besonder mit einem vom Adell der nichts gesehen hat / dann allein an einem ort / da er da heim oder erzogen ist worden als ich / jr wisset daß ich nirgent weitter gewesen bin / dann allein an meines Herren Hoff / da ich dann noch sein / so sehe vnd höre ich / wo frembde Gesellen her komen / die sagen von Kriegßhändeln vnd ehrlichen sachen da sie bei gewesen seind / so sehe ich auch daß mann dieselbigen herfür zeucht / helt sie vor augen / vnd thůt jn vor andern ehr an / dann sitze ich vnd meines gleichen da vnd hören zů / vnd ist vns ein frembder handel / Darauff bin ich bedacht / mich auch herauß zuthůn etwas zu sehen vnd zu lernen / darinn will ich ewren Rath bitten / dieweil ich weiß daß jr solcher sachen versucht / erfarn vnd gebraucht seind.
  cs: |-
    a radu. Proto k vám opět přicházím a nechci vám nic tajit, jak to vypadá s mladíkem, zvláště se šlechticem, který neviděl nic než jediné místo, kde byl doma či kde vyrůstal – tak jako já. Víte, že jsem nikde jinde nebyl než na dvoře svého pána, kde jsem dosud.[^1] Vídám a slýchám tam, jak přicházejí cizí mládenci a vyprávějí o válečných činech a čestných věcech, při nichž byli; vidím také, že se jim dává přednost, že jsou váženi a že se jim prokazuje čest před jinými. A já i mně podobní tam sedíme a posloucháme a je nám to cizí. Proto jsem se rozhodl, že se také vydám do světa, abych něco viděl a naučil se. Prosím vás v tom o radu, neboť vím, že jste v takových věcech zkušený, zběhlý a osvědčený.
- typ: nadpis
  uroven: 3
  de: Alter Vatter.
  cs: Starý otec.
- typ: odstavec
  de: |-
    Lieber Son / dieweil du dann also ein vertrawen zu mir hast / vnd dein trost auff mich setzest / so solt du dich des zu mir versehen / was ich dir in dem rathen vnnd helffen kan / wil ich gern thůn / besonder dieweil ich von dir verstehe vnd auch gehort hab / daß dein gemüt dahin gericht ist zu ehrlichen Ritterlichen sachen / vnd du selber verstehest / hörest vnd sichst / daß die so etwas gesehen / vnnd sich ehrlich gehalten haben / daß dieselbigen ehrlich gehalten vnd herfür gezogen werden / So hast du bei mir gůt rath zu nemen / dieweil du selber solches gesehen vnd gehört hast / vnd du bei dir bedacht / dergleichen auch zuthůn / versuchen / zusehen vnd zu lernen / dein gemüt dahin steht / so rath ich dir auch darzů / dann dein vornemen vnd gedencken ist gůt / vnd weiß dirs keins wegs zu wider rathen / vnd wann du dann solliches thůn wilt / so will ich dich bitten vnd warnen / daß du keinem Herrn dienst noch zu ziehest der ein Tyran ist / noch mit keiner liederlicher gesellschafft / da es deiner ehrn nachteil odder nachrede bringen möge / sonder wann du ziehen wilt / so zeug mit ehrlichen gůten leuten / da fert mann wol mit / dann ich hab es wol mehr gesehen / daß gůt gesellen lissen sich auffbringen vnd vbereden liederlich leut / daß sies darnach sehr gereuhet / vnd furen auch nit gar wol damit / vnd kamen in groß nachtheil dardurch.
  cs: |-
    Milý synu, když ke mně máš takovou důvěru a skládáš ve mne svou naději, můžeš se na mne spolehnout: v čem ti budu moci poradit a pomoci, to rád učiním. Tím spíš, že od tebe chápu a také jsem slyšel, že tvá mysl směřuje k čestným rytířským věcem a že sám vidíš, slyšíš a chápeš, jak jsou ti, kdo něco viděli a chovali se čestně, ctěni a vyzdvihováni. Můžeš si tedy u mne vzít dobrou radu: když jsi to sám viděl a slyšel, umínil sis činit totéž – zkoušet, poznávat a učit se – a tvá mysl k tomu směřuje, pak ti k tomu i radím, neboť tvé předsevzetí a úmysl jsou dobré a nijak ti je nemohu rozmlouvat. Chceš-li to tedy učinit, prosím tě a varuji, abys nesloužil ani netáhl k žádnému pánovi, který je tyran, ani s žádnou lehkovážnou společností, která by tvé cti mohla přinést újmu či pomluvu. Chceš-li táhnout, táhni s čestnými a dobrými lidmi; s těmi se dobře pochodí. Vždyť jsem už víckrát viděl, jak se dobří mládenci nechali lehkomyslnými lidmi zlákat a přemluvit, potom toho trpce litovali, nedopadli s tím dobře a utrpěli tím velkou škodu.
- typ: nadpis
  uroven: 3
  de: Son.
  cs: Syn.
- typ: odstavec
  de: |-
    Lieber alter Vatter ich bedanck mich ewers freundlichen getrewen vnderrichs vnd raths / vnd ich will dem (wills Gott) nachkommen vnd zu hertzen nemen / vnd verhoff zu Gott wann ich darzů keme / ich wöl mich halten / daß jr befinden solt / daß ich an ewern Rath vnd lere gedacht hab / vnd mich mit Gotts hilff halten daß ich etwas lern will.
  cs: |-
    Milý starý otče, děkuji vám za vaše přátelské a věrné poučení[^2] a radu. Chci se jimi (dá-li Bůh) řídit a vzít si je k srdci, a doufám v Boha, že až k tomu dojde, budu se chovat tak, abyste poznal, že jsem na vaši radu a nauku pamatoval, a s Boží pomocí se přičiním, abych se něčemu naučil.
poznamky:
- n: 1
  text: V tisku *sein* za *bin* („jsem“).
- n: 2
  text: V tisku *vnderrichs* za *vnderrichts*.
