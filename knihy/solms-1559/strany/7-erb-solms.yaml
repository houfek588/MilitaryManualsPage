bloky:
- typ: odstavec
  de: Reinhart der Elter/ Graue zu Solms vnd Herr zu Müntzenburg/ etc.
  cs: Reinhard starší, hrabě ze Solmsu a pán z Münzenbergu atd.[^1]
- typ: obrazek
  soubor: drevorez-546.jpg
  popis: |-
    Celostránkový dřevořez s erbem hrabat ze Solmsu a pánů z Münzenbergu (z téhož štočku jako před Druhou až Čtvrtou knihou), zasazeným v koruně mohutného listnatého stromu a lemovaným věncem: čtvrcený štít se solmským lvem (1. a 4. pole) a děleným štítem münzenberským (2. a 3. pole), nad ním dvě turnajské přilby s klenoty a bohatými přikryvadly. V pozadí krajina s hradem na skalnatém kopci vpravo, u kořenů stromu nápisová stuha s nápisem „REINHA[RT] VND HER[R] / RT. GRAFF. ZV ZV MINCZEN / SOLMS BORGK“ (Reinhart, hrabě ze Solmsu a pán z Münzenbergu).
poznamky:
- n: 1
  text: |-
    Erbovní frontispis na rubu posledního listu Šesté knihy (sken 546; přes papír prosvítá sazba přehlídkového rejstříku z protější strany) uvozuje Sedmou knihu (*Das sibend Bůch*) – „karetní hru“ s vojenskými úřady, oddíly, děly a vozy.
