poznamky:
- n: 1
  text: |-
    V přehlídkovém rejstříku na [[6-019v|s. 6-019v]] jsou tytéž osoby uvedeny jako *Hanß Burckhart von Heinhoffen* a *Braun von Würtzburg*.
- n: 2
  text: Tisková chyba *gudlen* za *gulden*.
- n: 3
  text: |-
    Součet dílčích úhrnů strany (60 zl. 12 bac. + 122 zl. 6 bac. + 136 zl.) dává 319 zl. 3 bac.; tisk má 329 zl. 3 bac. Celkový součet na [[6-027r|s. 6-027r]] počítá se správnou částkou.
