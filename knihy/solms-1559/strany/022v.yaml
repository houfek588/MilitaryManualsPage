bloky:
- typ: odstavec
  de: |-
    Der Oberst soll alle abent / auch etwann morgens frü / wann er an Feinden zeucht / oder für einer Besatzung leit / rath halten / vnnd nach gelegenheit jeder sach seiner Kriegsuerstendigen gůt bedüncken vornemen / er můß auch vnderweilen zu roß im feld rath halten oder pflegen / es sollen auch alle Räth / sonderlich wann er von Feinden im feld oder vor einem Flecken abziehen wil / in grosser stil vnd geheimnuß gehalten werden / sonst mag leichtlich grosser vnrath darauß entspringen. Der Oberst gibt allen hohen ämptern / Reutern vnnd Hauptleuten Paßporten.
  cs: |-
    Plukovník {Oberst} má každý večer, a někdy i časně zrána, když táhne proti nepřátelům nebo leží před nějakou posádkou {Besatzung}, konat poradu a podle povahy každé věci vyslechnout mínění svých války znalých mužů; někdy musí konat poradu či se radit i v poli na koni. Všechny porady, zvláště když chce odtáhnout od nepřátel v poli nebo od nějakého městečka, se mají konat ve velikém tichu a tajnosti, jinak z toho může snadno vzejít veliká pohroma. Plukovník vydává průvodní listy {Paßporten} všem vysokým úředníkům, jezdcům {Reutern} a hejtmanům {Hauptleuten}.
- typ: odstavec
  de: |-
    Dem Obersten sollen etliche Trommeter / ein Heerpaucker / vnnd wo möglich / ein Herolt gehalten werden.
  cs: |-
    Plukovníkovi mají být vydržováni někteří trubači {Trommeter}, jeden kotlář {Heerpaucker}, a pokud možno, jeden herold {Herolt}.
- typ: odstavec
  de: |-
    Ein jeder Oberster soll (als vil jhm jmmehr möglich) sein vndergeben Kriegsuolck / in willigen gehorsam brengen / vnd nit on trefflich vrsachen mit jnen Tyrannisiern / Dann mit eim willigen Volck wirt vil außgericht / doch sol man selten im krieg billiche straff vbersehen.
  cs: |-
    Každý plukovník má (jak jen je mu to možné) přivádět sobě podřízený válečný lid {Kriegsuolck} k ochotné poslušnosti a bez závažných příčin nad ním netyranizovat; neboť s ochotným lidem se pořídí mnoho, přesto se však ve válce jen zřídka má promíjet spravedlivý trest.
- typ: odstavec
  de: |-
    Der Oberst soll einen Brantmeister haben / die Brantschatzung ein zubrengen vnd zuuerechnen.
  cs: |-
    Plukovník má mít výpalného mistra {Brantmeister}, který vybírá a vyúčtovává výpalné {Brantschatzung}.
- typ: odstavec
  de: |-
    Der Oberst soll einen Brenfanen / vnd darüber einen Hauptman / auffrichten / der hat macht zu brennen wann es jhm der Oberst befilcht / vnnd soll sonst niemand bei leibstraff brennen / doch wann der Oberst Brantmeister ein Flecken gebrantschatzt hat / bedarff sich der Hauptman nicht mehr beladen.
  cs: |-
    Plukovník má zřídit paličský praporec {Brenfanen} a nad ním ustanovit hejtmana {Hauptman}. Ten má moc pálit, kdykoli mu to plukovník rozkáže, a nikdo jiný nesmí pod tělesným trestem pálit; jakmile však plukovníkův výpalný mistr[^1] vybere z městečka výpalné, nemá se jím hejtman již zabývat.
- typ: odstavec
  de: |-
    Vnder dem Brenfanen sein gewonlich nichts dann Schützen / vnd wo nit ringe pferd sein / besehen sie die feind / deßhalb wöllen sie an etlichem vieh auch vortheil haben / ist aber in keinem brauch.
  cs: |-
    Pod paličským praporcem bývají obvykle jen střelci {Schützen}, a kde není lehká jízda {ringe pferd}, obhlížejí nepřátele; proto si nárokují i podíl na části dobytka, to však není zvykem.
- typ: odstavec
  de: |-
    Ein jeder oberster Feldhauptman soll gar ernstlich darob sein / daß jm sein trew vnd glaub / den er freunden vnd feinden zusagt vnd verspricht / volkomlich gehalten werd / welcher jm denselben bricht vnd darwider handelt / soll er an leib / leben / ehr vnd gůt / nach ansehung der verhandlung / straffen / vnd darinn niemands verschonen / dann durch haltung trew vnd glauben / werden etwan vil Flecken / ja Land vnd leut gewunnen vnd behalten / die sonst nimmer mehr erobert würden.
  cs: |-
    Každý nejvyšší polní hejtman {oberster Feldhauptman} má nanejvýš přísně dbát na to, aby věrnost a slovo, které přátelům i nepřátelům přislíbí a zaručí, byly úplně dodržovány; kdo mu je zlomí a jedná proti nim, toho má potrestat na hrdle, na životě, na cti a na statku podle závažnosti provinění a nikoho v tom nešetřit; neboť dodržováním věrnosti a daného slova se nezřídka získá a udrží mnoho městeček, ba i zemí a lidí, jež by jinak nebyly nikdy dobyty.
- typ: odstavec
  de: |-
    Der Oberst soll mit nicht gestatten / daß ein hoch oder nider ampt dem andern in sein ampt greiffe / vnd jn daran verhindere / sonder jeden seinen beuelch lassen verrichten / welcher sein beuelch nit recht versicht / mag jn der Oberst darumb anreden / oder nach gelegenheit straffen / sonst hat er nimmer fried im leger. Der Oberst soll allen Kriegsleuten auffs ernstlichst im feld vnd vor den Besatzungen sprach zu halten verbieten / vnd welcher vbertrit / streng straffen / dann die Landsknecht müssen solches zu halten in jrem Artickels Brieff schweren.
  cs: |-
    Plukovník nemá v žádném případě trpět, aby jeden vysoký či nižší úřad zasahoval druhému do jeho úřadu a bránil mu v něm, nýbrž má každého nechat vykonávat jeho velení; kdo své velení nezastává správně, toho může plukovník pokárat nebo podle okolností potrestat, jinak nikdy nebude mít v ležení {leger} klid. Plukovník má také všem válečníkům {Kriegsleuten} v poli i před posádkami co nejpřísněji zakázat rozmlouvat [s nepřítelem], a kdo to přestoupí, přísně jej potrestat; neboť lancknechti {Landsknecht} musejí ve svém artikulním listu {Artickels Brieff} přísahat, že to budou zachovávat.
poznamky:
- n: 1
  text: |-
    V tisku „der Oberst Brantmeister“ – patrně výpalný mistr plukovníka (zmíněný v předchozím článku), případně „nejvyšší výpalný mistr“.
