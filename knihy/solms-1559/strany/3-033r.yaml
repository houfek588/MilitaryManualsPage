stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Puluer darein schüten würde/ das dieselbigen Stück vom sack die darinn bleiben werden/ noch Feur bei jn hetten/ vnd jm laden das Puluer wider anzindt.
  cs: |-
    dovnitř sypat střelný prach {Puluer}, aby ty zbytky váčku, které by tam zůstaly, neměly na sobě ještě oheň a při nabíjení střelný prach nezapálily.
- typ: odstavec
  de: |-
    Aber mit den lederen secklein/ ledt es sich in den Mörsern die auffgericht stehn gantz fürderlich/ dann es ist bald ein secklein außgeschüt vnd damit geladen/ besonder dieweil die Mörser nun mehr hinden am Puluersack biß an die seiten der Büchsen mit einer halben runden Kugel nach gemacht sein/ so rütscht das Puluer von derselbigen halben runden selbs inn den Puluer sack/ aber die alten Mörser sind hinden am Puluer sack strack oben gewesen mit einem absatz/ darauff ist das Puluer im hinein schütten ligen blieben/ daß mann das mit der handt hat müssen hinein streichen/ vnd so er die menge dasselbig wider gefült biß er die andern auch gebraucht hat.
  cs: |-
    S koženými váčky se však moždíře {Mörsern}, které stojí zpříma, nabíjejí velice rychle, neboť váček se snadno vysype a tím nabije, zvláště proto, že dnešní moždíře jsou vzadu od prachové komory až ke stěnám hlavně {Büchsen} tvarovány podle půlkoule, takže prach po té půlkouli sám sklouzne do prachové komory; naproti tomu staré moždíře bývaly vzadu u prachové komory nahoře rovné s osazením, na němž prach při sypání dovnitř zůstával ležet, takže se musel rukou shrnout dovnitř, a než jich bylo víc, znovu jej nasypal, zatímco použil i ostatní.[^1]
- typ: odstavec
  de: |-
    Es soll auch ein Büchsenmeister kein Puluer bei dem Mörser inn der Schantzen da er steht haben/ dann allein inn der neben gruben/ dann ein Mörser der in die höhe wirfft/ lest vil dings vnderweilen wider fallen/ besonder so etwan ein Kugel zerspringt/ Darumb soll er das Puluer im loch neben jm haben/ vnd auff solchem Puluer oder Tonnen soll er Ochsen oder ander grosse heut aufflegen/ daß das puluer mit gedeckt sei.
  cs: |-
    Puškař {Büchsenmeister} také nemá mít žádný střelný prach u moždíře v šanci {Schantzen}, kde stojí, nýbrž jedině v postranní jámě; neboť moždíř, který vrhá do výšky, nechává občas leccos padat zpět dolů, zvláště když se některá koule {Kugel} roztrhne. Proto má mít prach v jámě vedle sebe a na takový prach či sudy má položit volské nebo jiné velké kůže, aby jimi byl prach přikryt.
- typ: odstavec
  de: |-
    Auch soll mann/ wann mann nahe vor einer Stat ligt/ vnnd nicht ferr hinein zuwerffen hat/ die Mörser nicht zuhart laden/ dann es ist vnnot/ das mann die Feurkugeln zu hoch in die lufft jagt/ dann sie brennen sich in der Lufft ab/ besonder die schlagende Kugeln/ die mit rössem Puluer außgefüllt sein.
  cs: |-
    Rovněž když se leží blízko před městem a není třeba vrhat daleko dovnitř, nemají se moždíře nabíjet příliš silně, neboť je zbytečné hnát ohnivé koule {Feurkugeln} příliš vysoko do vzduchu, protože tam ve vzduchu shoří, zvláště třaskavé koule {schlagende Kugeln}, které jsou naplněny prudkým střelným prachem.
poznamky:
- n: 1
  text: Nejasný závěr věty (*vnd so er die menge dasselbig wider gefült biß er die andern auch gebraucht hat*) zřejmě popisuje, že u více moždířů obsluha mezitím znovu naplnila kožený váček, než vystřílela z ostatních kusů.
