  pokracovani: true
  de: |-
    ein Herr es nicht leicht achten/ sonder sehn auß gemelten vrsachen wem er sollichs schwers Ampt beuelhen thů darmit er versorgt sei/ deßgleichen soll auch die person die darzu erfordert wirt/ wol bedencken was er annem/ ob er das versehn vnnd außrichten kündt oder nit/ vnd soll jm ein klein ehr oder nutz nit zu lieb sein lassen/ damit er nicht dardurch zu spot vnd schanden kommen möcht/ aber doch soll einer der sonst ein verstandt vnd lieb darzů hat/ darumb nit verzagen ob er schon dise beschribene stück nit alle weiß noch versteht/ sonder soll sich fleissen das trew/ Glaub/ erbarkeit vnd arbeit bei jm sei/ sich vben lern vnd denck denen dingen nach/ nem die für die handt vnd lerne/ ob ein Herr wirdt mit jhm handeln sollichs Ampt zuuersehn vnd zuundernemen soll einer das nit also frei annemen/ sonder sagen/ das jm sollichs Ampt anzunemen zu schwer sei/ der massen mit sollichen stücken alle zuuersehn/ dieweil er die nit alle wol versteht/ in wöllichen stücken er verstandt hab vnnd in wöllichen nit/ soll er anzeigen/ vnd sagen/ wo er in den stücken/ die er nit versteht vnderricht werd wol er das auch mit dem aller fleissigsten warten vnd versehn/ er wöl aber in dem vngefahrt sein/ aber daß er sich der Oberkeit/ als trew/ glauben/ arbeit/ vnnd eins gůten wandels befleissen wöl/ das kön er wol thůn/ zum andern was sein verstandt sei wöll er sich zu dem fleysigsten halten/ begert des ein Instruction vnd bericht von seinem Herrn/ so dann ein Herr sollichs war gemüt bei der person erkent vnd befindt/ daß er auch ein lusten vnd willen darzů hat/ so soll ein Herr die Oberkeit der person ansehn daran am höchsten gelegen ist/ soll jm des ein beschreibung geben/ wes er sich halten soll/ Vnd es sollen die Herrn von sollicher kunst/ wie gemelt ist/ der Arcolorei gůt Beschreibung haben/ darauß ein Herr ein solliche person berichten kan vnd lernen lassen/ sollich beschreibung soll ein Herr in grosser geheimnuß wie ein schatz behalten/ sein Zeugmeister darmit vben vnd brauchen/ jn lassen alle ding probieren vnd zurichten so kompt er in gebrauch vnd lernt das werck/ doch soll allwegen ein Zeugmeister eim Herrn verloben sollichs in geheimnuß/ jhm zubehalten/ vnd niemandts sonder seins Herrn wissen vnnd willen geben odder abschreiben lassen/ sonder also bei sich zubehalten/ doch soll er die Edelleut oder andern die zu dem zeughauß verordnet sind vnd bei seim Herrn bleiben fleissig vnderrichten/ mit jn lernen/ dann so er sie mehr lernt vnd geschickter macht so sie seinem Herrn/ vnd dem landt tröstlicher vnnd nützer sind/ vnd der Zeugmeister im werck der not auch am besten mit besteht/ vnd sein beuelch desto ehrlicher/ besser vnd stadtlicher mag außgerich[^2] werden/ der halben sol ein Zeugmeister
  cs: |-
    pán tuto věc brát na lehkou váhu, nýbrž má z uvedených příčin hledět na to, komu tak těžký úřad svěří, aby byl dobře zaopatřen. Stejně tak i osoba, která je k tomu povolávána, má dobře uvážit, co přijímá, zda to dokáže zastat a vykonat, či nikoli, a nemá sobě malou čest či zisk natolik oblíbit, aby skrze to neupadla v posměch a hanbu. Avšak kdo jinak má rozum a zálibu v této věci, nemá proto zoufat, i kdyby všechny tyto popsané věci ještě neznal a neovládal, nýbrž má se snažit, aby při něm byla věrnost, víra, počestnost a pracovitost, má se cvičit, učit se a přemýšlet o těch věcech, brát si je do rukou a učit se. Bude-li s ním pán jednat, aby takový úřad zastával a přijal jej, nemá jej hned bez rozmyslu přijmout, nýbrž říci, že přijmout takový úřad a zastat jej se všemi těmito věcmi je pro něho příliš těžké, jelikož jim všem ještě dobře nerozumí; má uvést, v kterých věcech se vyzná a v kterých ne, a říci, že bude-li poučen v těch věcech, kterým nerozumí, chce se jim věnovat a zastávat je s tou největší pílí, chce však v tom zůstat bez úhony [nikoho neklamat], avšak co do počestnosti[^1] – totiž věrnosti, víry, pracovitosti a dobrých mravů –, v té že se chce snažit ze všech sil, a to že vykonat může; za druhé, čemu rozumí, toho že se chce držet co nejpilněji, a žádá si o tom od svého pána poučení a návod. Pozná-li a shledá-li pak pán u takové osoby tuto upřímnou mysl a že k tomu má i chuť a vůli, má pán pohlédnout na počestnost té osoby, na níž nejvíce záleží, a má jí dát spis o tom, jak se má chovat. A páni mají o takovém umění dělostřelectva {Arcolorei}, jak bylo řečeno, mít dobrý popis, z něhož může pán takovou osobu poučovat a dát ji vyučit; takový spis má pán uchovávat ve velikém tajemství jako poklad, svého zbrojmistra {Zeugmeister} jím cvičit a zaměstnávat, dávat mu všechny věci zkoušet a připravovat – tak přijde do praxe a naučí se dílu. Vždy však má zbrojmistr pánovi slíbit, že to zachová v tajnosti pro něj, nikomu to bez pánova vědomí a vůle nedá ani nedovolí opsat, nýbrž podrží si to pouze pro sebe; má však pilně poučovat šlechtice nebo jiné osoby, kteří jsou určeni ke zbrojnici {zeughauß} a zůstávají u jeho pána, a učit s nimi – neboť čím více je naučí a čím obratnějšími je učiní, tím jsou jeho pánovi i zemi prospěšnější a užitečnější, a i zbrojmistr v čase nouze s nimi nejlépe obstojí a jeho velení může být vykonáno[^2] o to čestněji, lépe a znamenitěji. Proto má zbrojmistr
poznamky:
- n: 1
  text: |-
    Tisk má na obou místech *Oberkeit* (pravděpodobně tisková záměna za *Erberkeit / Erbarkeit* – počestnost, čestnost, jak dokládá výčet o několik řádků výše *trew/ Glaub/ erbarkeit vnd arbeit*).
- n: 2
  text: |-
    Tisk má tvar *außgerich* (vypadlé koncové *-t* za *außgericht*).
