list: 10 (8. kniha)
strana: verso
sken: 608
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    erlangen dienen / sonder dardurch Gott hoch erzörnet wirt / wann wir dann Gott so hoch erzörnen / so dörffen wir vns keiner gnade / trost noch hilff versehen / Darumb soll die Gottßlesterung gar nicht zůgelassen / sonder hart gestrafft werden / dann Gott solt durch einen Gottßlesterer so der vnder einem hauffen were / vnd jhm gestat vnd zůgelassen würde / den gantzen Hauffen straffen / Derhalben soll solches der fürnemblichst vnd erst Artickel sein zu straffen.
  cs: |-
    milosti, nýbrž se jím Bůh těžce hněvá. A když Boha tak těžce rozhněváme, nemůžeme očekávat žádnou milost, útěchu ani pomoc. Proto se rouhání nemá vůbec trpět, nýbrž přísně trestat; neboť kdyby byl v houfu {hauffen} jediný rouhač a trpělo a dovolovalo se mu to, Bůh by pro něho mohl potrestat celý houf. Proto má být rouhání prvním a nejpřednějším článkem {Artickel}, který se trestá.
- typ: odstavec
  de: |-
    Der ander Artickel ist daß mann die Prouiant mit gleicher maß außtheil vnd wol ordne / einer jeden Personen zugeben / darnach mann mit dem vorrat gefast ist.
  cs: |-
    Druhý článek je, aby se proviant {Prouiant} rozděloval stejnou mírou a dobře rozvrhl, kolik se má dát každé osobě, podle toho, jakou zásobou je [posádka] opatřena.
- typ: odstavec
  de: |-
    Zum dritten soll das vberflüssig zůtrincken das einer vber not ein tag trincket da er wol zwen mit gnůg hett / vnd dardurch vngeschickt mit allen lastern wirt / vnd nichts darbei außrichten kan / verbotten sein / Dann mann sagt / daß einem truncken Man nichts zu beuelhen nach zuuertrawen / dann er seiner nit allezeit mechtig sei / welchs ein grosser mangel in zeit der not ist.
  cs: |-
    Za třetí má být zakázáno nadměrné připíjení {zůtrincken}, kdy někdo nad potřebu vypije za den tolik, že by mu to stačilo na dva, a tím se stává nezpůsobilým ke všemu a náchylným ke všem nepravostem a nic nesvede. Říká se totiž, že opilému člověku nelze nic svěřit ani se na něj spolehnout, protože není vždy pánem sám sebe; a to je v čase nouze velká vada.
- typ: odstavec
  de: |-
    Zum vierdten soll ein Oberster den Knechten nit gestatten / daß sie eigen Hůren haben / dann es ist hefftig wider Gott / vnnd bringt grossen vnwillen vnd balgen vnder den Knechten / vnd macht einen grossen Droß vnd vnkosten / vnd gehet vber die Prouiant da dann hoch angelegen ist / dann inn einer Besatzung aller vnkosten mit vnwehrhafftigen vnd vnnötigem Volck zuuerhůten / wo aber einer sein Eheweib hett / soll sie nit für sich allein sein / sonder ein versehung in der Besatzung haben / als mit weschen / kochen / der Krancken warten / daruon solle sie jhre gebürliche belonnung haben / Wo derhalben nit solche Weiber weren / sol der Oberst andere weiber zu solcher notturfft verschaffen vnd ordnen / dann die Knecht Wäscherin vmb jre gesatzte belonnung haben mussen / deßgleichen die Krancken Weiber die jnen warten vnd kochen.
  cs: |-
    Za čtvrté nemá plukovník {Oberster} dovolit knechtům {Knechten}, aby měli vlastní nevěstky, neboť je to těžce proti Bohu, působí mezi knechty velkou nevoli a rvačky a dělá velký trén {Droß} a náklady. Spotřebovává se tím proviant, na němž tolik záleží; v posádce {Besatzung} je totiž třeba vyvarovat se všech nákladů na nebojeschopný a nepotřebný lid. Má-li však někdo svou manželku, nemá být jen sama pro sebe, nýbrž má mít v posádce nějakou službu, jako praní, vaření a ošetřování nemocných, a má za to dostávat náležitou mzdu. Kdyby takové ženy nebyly, má plukovník k této potřebě opatřit a ustanovit jiné ženy; knechti totiž musejí mít pradleny za stanovenou mzdu a nemocní zase ženy, které je ošetřují a vaří jim.
- typ: odstavec
  de: |-
    Zum fünfften soll der Oberst ein Garkoch ordnen / der dem kriegßvolck / die nit eigen Köche halten künden / jre liefferung so mann jnen auß der Commis gibt / vmb ein gesatzts kochen / deßgleichen soll solchem Garkoch sein gebürentes vnnd zu der notturfft Holtz auß der Commis gelieffert werden / Doch sol mann (so derer von nöten) andere Garköch haben / die jre eigene Köche halten / vnd vmb den pfenning oder Malzeit geben / denen soll mann auch auß der Commis für jre bezallung lieffern / so das am vorrat vorhanden / das kompt dem Herrn der Besatzung wider zu gůtem / Wolt aber ein Koch seine Prouiant selber bestellen / das mag ein Oberster jm zulassen / doch daß er sich vnder seinem Regiment halt.
  cs: |-
    Za páté má plukovník ustanovit polního kuchaře {Garkoch}, který válečnému lidu {kriegßvolck}, jenž si nemůže držet vlastní kuchaře, uvaří za stanovenou platbu dávku, kterou mu vydávají z komisu {Commis}. Tomuto kuchaři se má z komisu dodávat také náležité a potřebné dříví. Bude-li toho zapotřebí, mají se mít i další polní kuchaři {Garköch}, kteří si drží vlastní kuchaře a prodávají jídlo za peníze nebo po jednotlivých jídlech; i těm se má z komisu dodávat za úplatu, je-li to v zásobě, a to pánovi posádky zase přijde k užitku. Kdyby si však některý kuchař chtěl proviant opatřovat sám, může mu to plukovník dovolit, avšak tak, aby se podřizoval jeho řízení.
