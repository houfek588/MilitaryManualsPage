bloky:
- typ: odstavec
  de: |-
    Weitter zu welcher stundt euch am morgens gefelt/ solt jr Gottes wort hören/ vnd da jr vnd andere andechtiglich betten/ Das ist die Kriegßornung auff Landt vnd Wasser/ so ich noch in gedechtnuß/ vnd euch jetzund beschriben hab/ will nun zum beschluß anzeigen die ehr vnd gerechtigkeit die ein Admiral auff dem Wasser haben soll.
  cs: |-
    Dále máte ráno, v kteroukoli hodinu se vám zlíbí, vyslechnout slovo Boží, a vy i ostatní se máte zbožně pomodlit. To je válečný řád {Kriegßornung}[^1] na souši i na vodě, jak jsem ho ještě měl v paměti a nyní vám ho sepsal. Na závěr vám chci ukázat čest a práva, která má mít admirál {Admiral} na vodě.
- typ: odstavec
  de: |-
    Erstlich was auff dem Wasser geschicht soll er ewer Person Representiern/ vnd ewer Leuttenant soll auch/ wann jr nicht personlich da seind/ das Fewer zu nachts auff sein Schiff füren/ Er soll auch alle gerichts händel in seim gewalt haben/ vnd vor jm alle zwitrachtungen vnd vneingkeiten verhört werden/ soll auch kein Schiff auß dem gantzen hauffen von jnen verrücken etwas zu gewinnen oder zu rauben/ on sein erlaubnuß/ vnd was gewunnen wirt/ soll mann jm anzeigen/ wann er dann vermeint es sei etwas vnbillicher weiß geraubt worden/ soll ers wider geben/ Deßgleichen soll auch keiner auff dem Meer geleit geben/ es geschehe dann durch jn oder seinen leuttenant/ er hat auch noch vil andere Priuilega vnd freiheiten/ welche ich euch nit erzelen will/ dann ein jeglichs landt seinn eigen brauch hat/ doch will ich euch in kürtz anzeigen/ daß er der ist/ wann jr nicht personlich da seind/ der allen gewalt auff dem Wasser hat/ Jch wolt euch wol sagen was jr für freiheiten vnd Priuilegia in ewern landen/ als Seelandt/ Hollandt/ Brabandt vnd Flandern habt/ dann ewer Anherr mir den beuelch eines Admirals geben hatt/ Jch bin auch in Neapolis einer gewesen/ vnd allwegen an einem jeglichen ort einn andern brauch dann am anderen funden/ Darumb ich ander leut weitter daruon will lassen reden/ vnd euch das nur zu einem kleinen gedechtnuß geschriben/ vnd mich dardurch in ewer gnaden beuelch geben haben/ etc.
  cs: |-
    Za prvé má ve všem, co se děje na vodě, zastupovat vaši osobu, a jako váš poručík {Leuttenant} má také, nejste-li osobně přítomni, nést v noci oheň na své lodi. Má mít také ve své moci všechny soudní věci a před ním se mají vyslýchat všechny spory a nesváry. Žádná loď se také nemá bez jeho svolení vzdálit od celého houfu, aby něco získala nebo uloupila; a co se získá, má se mu ohlásit. Domnívá-li se pak, že bylo něco uloupeno neprávem, má to dát vrátit. Stejně tak nemá nikdo na moři dávat glejt {geleit}, leda by se to stalo skrze něho nebo jeho poručíka. Má ještě mnoho jiných výsad a svobod, které vám nechci vypočítávat, neboť každá země má svůj vlastní obyčej. Krátce vám však chci ukázat, že on je ten, kdo má na vodě veškerou moc, nejste-li osobně přítomni. Rád bych vám řekl, jaké svobody a výsady máte ve svých zemích, totiž v Zélandu, Holandsku, Brabantsku a Flandrech, neboť váš děd[^2] mi svěřil úřad admirála. Byl jsem admirálem také v Neapoli[^3] a na každém místě jsem vždy našel jiný obyčej než na jiném. Proto o tom chci nechat dále mluvit jiné; sepsal jsem vám to jen na malou památku a tím se poroučím vaší milosti atd.
poznamky:
- n: 1
  text: |-
    *Kriegßornung* – tak v tisku, tisková chyba za *Kriegßordnung*. Pod textem je v tisku jen drobná koncová ozdoba (fleuron).
- n: 2
  text: |-
    *ewer Anherr* – váš děd, tj. císař Maxmilián I., děd Karla V., jemuž Filip Klévský (Philippe de Clèves, pán z Ravensteinu, 1456–1528) svůj spis o válečnictví určil; Filip zastával úřad admirála Nizozemí.
- n: 3
  text: |-
    Filip Klévský velel po roce 1501 ve službách francouzského krále Ludvíka XII. loďstvu při tažení do Neapolska a proti Turkům (výprava na Lesbos/Mytilénu 1501).
