- typ: odstavec
  de: |-
    Item hat mein gnediger Herr Graue Reinhart zů Solms/ etc. jnen wider verdingt am 29. tag Julij vmb mittag/ 40. werckschůhe fur ein lehen oder 7. Klafftern vnd gibt jnen von einem lehen des erstenmals 14. flo.
    Item für das ander lehen gibt jnen sein Gnad 15 flo.
    Item den Knechten von einem lehen zu seubern 8 flo. thůt zwei lehen 16 flo.
    Thůt in summa auff beide Gruben vnd von 4 lehen den Knechten zu seubern 90 flo.
  cs: |-
    Dále s nimi můj milostivý pán hrabě Reinhard ze Solmsu atd. znovu sjednal úkolovou mzdu {Geding} dne 29. července v poledne, 40 dílenských střevíců {werckschůhe} za jedno léno {Lehen} čili 7 sáhů {Klafftern}, a dává jim za první léno napoprvé 14 zlatých.
    Dále za druhé léno jim Jeho Milost dává 15 zlatých.
    Dále čeledínům za vyčištění jednoho léna 8 zlatých, to činí za dvě léna 16 zlatých.
    To činí úhrnem na obě jámy a za vyčištění 4 lén čeledínům 90 zlatých.[^2]
poznamky:
- n: 1
  text: |-
    Drobné početní nesrovnalosti sazby: peněžní součet `13 fl. 10 batzů` (= 205 batzů) odpovídá **41** směnám po 5 batzech (nikoli tištěnému počtu 51 směn = 17 fl.), zatímco sečtením 14 jmen vlevo (34 směn) a 3 jmen nahoře vpravo (7 směn) vychází právě 41 směn, a předchozí položky dole na `5-010r` dávají dalších 20 směn. Tisk u jména *Veit Weiner* vynechává součet řady jedenácti jmen (27 směn); pod jménem *Hanß Meter* vychází součet 17 × 2 = 34 směn přesně (u posledního čísla je rozmazaná číslice 2).
- n: 2
  text: |-
    Součet souhlasí přesně na obě šachty: za dvě štoly celkem 2 × (14 + 15) = 58 fl. rubačům a za 4 léna čištění 4 × 8 = 32 fl. čeledínům, tj. 58 + 32 = 90 zlatých.
