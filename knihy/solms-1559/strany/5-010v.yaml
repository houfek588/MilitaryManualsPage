- typ: odstavec
  de: |-
    Item hat mein gnediger Herr Graue Reinhart zů Solms/ etc. jnen wider verdingt am 29. tag Julij vmb mittag/ 40. werckschůhe für ein lehen oder 7. Klafftern vnd gibt jnen von einem lehen des erstenmals 14. flo.
    Item für das ander lehen gibt jnen sein Gnad 15 flo.
    Item den Knechten von einem lehen zu seubern 8 flo. thůt zwei lehen 16 flo.
    Thůt in summa auff beide Gruben vnd von 4 lehen den Knechten zu seubern 90 flo.
  cs: |-
    Dále s nimi můj milostivý pán hrabě Reinhard ze Solmsu atd. 29. července v poledne znovu uzavřel úkolové dílo {verdingt}: 40 dílenských střevíců {werckschůhe} za jedno léno {lehen} čili 7 sáhů {Klafftern}; za první léno jim dává napoprvé 14 zlatých.
    Dále za druhé léno jim Jeho Milost dává 15 zlatých.
    Dále čeledínům {Knechten} za vyčištění jednoho léna 8 zlatých, to činí za dvě léna 16 zlatých.
    Činí to úhrnem na obě jámy, včetně vyčištění 4 lén čeledíny, 90 zlatých.[^2]
poznamky:
- n: 1
  text: |-
    Tištěné součty směn se se jmény úplně nekryjí (ověřeno ve skenu 456, tisk má zřetelně „Summa 51.“): osm jmen dole na `5-010r` dává 20 směn, čtrnáct jmen levého sloupce zde 34 směn (dohromady 54); peněžní částka 13 fl. 10 b. (= 205 bacenů) přitom odpovídá 41 směnám po 5 bacenech, tj. právě 34 směnám levého sloupce a 7 směnám tří jmen vpravo nahoře. Následující „Summa 31“ (= 10 fl. 5 b.) je početně správně, jedenáct jmen pod ní (*Veit Weiner* až *Paul Fermer*) však dává 27 směn a vlastní součet nemají. Rubači z 28. července (17 × 2 = 34 směn po 6 bacenech = 13 fl. 9 b.) souhlasí přesně. Proti dřívějšímu čtení opraveno podle skenu: *Jörg Asthauer* (tisková chyba za *Aschawer*, srv. `5-009v`), *Jacob Fux* (= *Fuchs*), *Hanß Meier*, *Caspar Saltzburger*.
- n: 2
  text: |-
    Součet souhlasí: za dvě jámy 2 × (14 + 15) = 58 fl. rubačům a za čištění 4 lén 4 × 8 = 32 fl. čeledínům, tj. 58 + 32 = 90 zlatých.
