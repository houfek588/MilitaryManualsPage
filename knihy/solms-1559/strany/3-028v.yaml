list: '28'
strana: verso
sken: 308
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Dise stücklein sollen zu halber zal / nemlich die 25. dermassen / daß mann sie hinden einladen mag / zugericht sein.
  cs: |-
    Tyto menší kusy mají být z polovičního počtu, totiž 25 kusů,[^1] zařízeny tak, aby se daly nabíjet zezadu.
- typ: odstavec
  de: |-
    Gůter doppelhacken auch auff ein Kugel sampt jrer rüstung. Doppelhacken 500. einen in den andern.
  cs: |-
    Dobrých dvojitých hákovnic {doppelhacken} rovněž na stejnou kouli {Kugel} spolu s jejich výzbrojí – 500 dvojitých hákovnic, jedna jako druhá [po …].
- typ: odstavec
  de: |-
    Summa der Handtror / Falconet vnd Doppelhacken / thůt nach disem geringen anschlag.
  cs: |-
    Součet za ručnice {Handtror}, falkonety {Falconet} a dvojité hákovnice činí podle tohoto skromného rozpočtu […].
- typ: odstavec
  de: |-
    Vnd nach dem mann in einem Feldzug zu beschützung eines solchen trefflichen geschütz einer Wagenburg / vnd sonderlicher darzů verordneter vnd gemachter wagen bedörfftig.
  cs: |-
    A poněvadž je na polním tažení {Feldzug} k ochraně tak znamenitého dělostřelectva {geschütz} zapotřebí vozové hradby {Wagenburg} a zvláštních k tomu určených a zhotovených vozů,
- typ: odstavec
  de: |-
    So ist von nöten / das zu solcher verwarung dreierlei gattung / Schirmwagen / sambt jhrem verordneten geschütz / vorhanden sein.
  cs: |-
    je nutné, aby k takovému zabezpečení bylo k dispozici trojího druhu štítových vozů {Schirmwagen} spolu s jejich přidělenými děly.
- typ: odstavec
  de: |-
    Item erstlich 50. schirmwagen / die in dem schirmpret 4. schießlöcher / oder lücken haben / thůt Wagen 50.
  cs: |-
    Dále nejprve 50 štítových vozů, které mají v prkenném štítu 4 střílny čili otvory, což činí 50 vozů.
- typ: odstavec
  de: |-
    Vnd für der jeden 3. Roß / thůt Zupferdt 150.
  cs: |-
    A před každý z nich 3 koně, což činí 150 tažných koní {Zupferdt}.[^2]
- typ: odstavec
  de: |-
    Zu deren schirmwagen jedem gehörn 6. handtror / die von souil Mans personn darneben getragen / oder nach gestalt der sachen gefürt / vnd im fal der notturfft / von denselben abgewechselt gegen den feinden / durch die schirmwagen vnd derselben löcher abgeschossen mögen werden / also so die drei schiessen / die ander drei widerumb laden künden / vnd solche handtror sollen von den obangesetzten anzal der 2000. genomen werden / daß thůt zu denen 50. Wagen 300. hantror.
  cs: |-
    Ke každému z těchto štítových vozů náleží 6 ručnic, které nosí vedle něho tolikéž mužů anebo je podle povahy věci vezou a v případě potřeby z nich střídavě střílejí proti nepřátelům skrz štítové vozy a jejich otvory, takže zatímco tři střílejí, ostatní tři mohou znovu nabíjet; a tyto ručnice se mají vzít z výše stanoveného počtu 2000, což pro těch 50 vozů činí 300 ručnic.
- typ: odstavec
  de: |-
    Item mehr bedarff man 25. Sturmwagen / deren jeder hinden vnd vorn ein beschlossen Truhen / zu Puluer / Kugeln / mödel / etc. vnd anderer Rüstung haben soll.
  cs: |-
    Dále je zapotřebí ještě 25 útočných vozů {Sturmwagen},[^3] z nichž každý má mít vzadu i vpředu zavřenou truhlu na střelný prach {Puluer}, koule, licí formy {mödel} atd. a ostatní výzbroj.
- typ: odstavec
  de: |-
    Zu vnd auff der wagen jedem sollen obgedachter halb Falconetlein drei / vnd wercklich darein mit starcken Eisenkloben verzapfft sein / damit sie hin vnd wider / auch hoch vnd nider / alweg nach gelegenheit gewendt werden mögen / vnd solche Stücklein sollen auch von den obgemelten 100. halb Falconetlein genommen werden / das brengt auff die 25. Sturmwagen 75. halb Falconetlein.
  cs: |-
    K těmto vozům a na každém z nich mají být tři z výše zmíněných polovičních falkonetů {halb Falconetlein} dovedně upevněny a začepovány na silných železných čepových závěsech, aby se jimi dalo vždy podle potřeby otáčet sem a tam i nahoru a dolů; a tyto malé kusy se mají rovněž vzít z výše uvedených 100 polovičních falkonetů, což na těch 25 útočných vozů činí 75 polovičních falkonetů.
- typ: odstavec
  de: |-
    Für deren wagen jeden soll mann spannen vier Roß / thůt Zugpferdt 100.
  cs: |-
    Před každý z těchto vozů se mají zapřáhnout čtyři koně, což činí 100 tažných koní {Zugpferdt}.
- typ: odstavec
  de: |-
    Mehr bedarff mann noch 25. sturmwagen mit vier schießlücken / vnd auch jhre beschloßne truhen hinden vnd vornen / wie ob gemelt.
  cs: |-
    Dále je zapotřebí ještě dalších 25 útočných vozů se čtyřmi střílnami a rovněž s jejich zavřenými truhlami vzadu i vpředu, jak bylo řečeno výše.
- typ: odstavec
  de: |-
    Vnd für der jeden 3. Roß / thůt Zugpferdt 75.
  cs: |-
    A před každý z nich 3 koně, což činí 75 tažných koní.
- typ: odstavec
  de: |-
    Zu deren wagen jeden gehörn allweg 4 Doppelhacken / auch dermassen wie von den Handtrorn oben geredt abgewechselt zubrauchen / derhalben daß die hacken fürderlich darauff gelegt oder daruon
  cs: |-
    Ke každému z těchto vozů náleží vždy 4 dvojité hákovnice, které se rovněž mají užívat střídavě tak, jak bylo výše řečeno o ručnicích, protože se hákovnice mohou pohotově položit na vůz nebo z něho
poznamky:
- n: 1
  text: |-
    *Zu halber zal, nemlich die 25* – ve vztahu ke 100 polovičním falkonetům na l. 28r jde o čtvrtinu (snad míněna polovina z 50 nebo pozůstatek původně uvažovaného počtu 50 kusů). Zajímavá je zmínka o zadovkách (*daß mann sie hinden einladen mag*).
- n: 2
  text: |-
    V tisku vypadlo *-g-* (*Zupferdt* místo *Zugpferdt*).
- n: 3
  text: |-
    *Sturmwagen* – útočný vůz vozové hradby osazený třemi polovičními falkonety nebo čtyřmi dvojitými hákovnicemi se zásobními truhlami vpředu i vzadu.
