stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vorkommen/ vnd das den Knechten durch die Obersten vnd Hauptleut jr besoldung nicht also abgeschetzt werde.
  cs: |-
    a jak zabránit tomu, aby plukovníci {Obersten} a hejtmani {Hauptleut} takto nekrátili knechtům {Knechten} jejich žold {besoldung}.
- typ: odstavec
  de: |-
    Zu dem dritten/ wie ich doch die Knecht/ vnd das ander Kriegsuolck in gůtem gehorsam vnnd Regiment erhalten möge/ damit sie nicht also on notwendige vrsachen schreien.
  cs: |-
    Za třetí, jak bych mohl knechty i ostatní válečný lid {Kriegsuolck} udržet v dobré poslušnosti a kázni, aby takto bez nutné příčiny nekřičeli.
- typ: odstavec
  de: |-
    Zu dem vierdten/ wie wir die Leger inn gůter hůt vnd verwarung halten mögen.
  cs: Za čtvrté, jak můžeme udržet ležení {Leger} v dobré ochraně a bezpečí.
- typ: odstavec
  de: |-
    Zu dem fünfften/ wie ich doch den grossen Troß vnd wägen geringern möge.
  cs: Za páté, jak bych mohl zmenšit veliký trén {Troß} a vozy.
- typ: odstavec
  de: |-
    Zu dem sechsten vnd letsten/ wie ich doch die vnchristliche Gottes lesterung wehren vnd abbrengen/ vnd einen gemeinen Gottes dienst anrichten vnd erhalten möge/ damit das volck in Gottes forcht vnd ehr lebe möcht/ vnnd nit also wie das vnuernünfftig viehe/ ein leben vnd wandel fůre.
  cs: |-
    Za šesté a naposledy, jak bych mohl zabránit nekřesťanskému rouhání a vymýtit je a zavést a udržet společnou bohoslužbu, aby lid žil v bázni Boží a ve cti a nevedl život a mravy jako nerozumný dobytek.
- typ: nadpis
  uroven: 3
  de: |-
    Rathschlag auff des Kriegsherrn vbergebene Artickel/ an die Kriegs Räth.
  cs: |-
    Dobré zdání válečných radů {Kriegs Räth} k článkům předaným válečným pánem {Kriegsherrn}.
- typ: odstavec
  de: |-
    AVff die vbergebene Artickel/ so E. Röm. Key. May. vns zuberathschlagen zugestelt/ so haben wir gehorsamlich die für vns genommen/ vnd vnser gůt beduncken/ wie wir vermeinen die fürzunemen seien/ auff das kurtzest inn Schrifften verfast/ wie Ewer Röm. Keyserliche Maiestat dieselben zubesehen/ vnd doch nach jrem gefallen vnnd gůt beduncken zuthůn haben. Erstlich souil die Prouiant betrifft/ so haben Ewer Röm. Key. Maiestat ein ordenung fürgenomen/ wie die beschriben vnd verordenet ist/ So ist derhalben vnser gůt beduncken/ daß Ewer Röm. Keys. Maiestat darob gestreng gehalten hetten/ vnnd den Prouiant herrn auff solches für sich genommen/ vnd mit allem ernst/ jhm das zu dem hertesten beuolhen/ Dann Ewer Röm. Keys. Maiest. wissen/ wie auch bei meniglichen zugedencken ist/ Das an der Prouiant alle sachen des Kriegs stehn wil/ vnd Ewer Römis. Keys. Maiestat/ inn dem kein finantz/ noch einige hindernuß oder verseumnuß leiden können. Dann so die Prouiant in ein vnordnung oder vngleicheit kommen würde/ so hett alles Kriegsuolck des ein nachtheil vnd vrsach vnwillig zusein/ darauß dann aller vngehorsam vnd schreien dem Prouiantherrn entsteht. Derhalben so wölle E. Röm. Keys. Mat. jme das gesagt haben/ dieweil jr Maiestat also ein hohes vertrawen zu jm habe/ vnd das wichtig ampt vnd versehung jm zustelle vnd beuelhe/
  cs: |-
    Předané články, které nám Vaše římské císařské Veličenstvo postoupilo k poradě, jsme poslušně vzali před sebe a své dobré zdání, jak je podle našeho mínění třeba postupovat, jsme co nejstručněji sepsali, aby do něj Vaše římské císařské Veličenstvo mohlo nahlédnout a pak naložit podle své libosti a svého uvážení. Předně pokud jde o proviant {Prouiant}: Vaše římské císařské Veličenstvo vydalo řád, jak je sepsán a nařízen. Naším dobrým zdáním tedy je, aby na něm Vaše římské císařské Veličenstvo přísně trvalo, předvolalo si kvůli tomu proviantního pána {Prouiant herrn} a se vší vážností mu jej co nejpřísněji uložilo. Vaše římské císařské Veličenstvo přece ví, a každý si to může domyslet, že na proviantu stojí všechny věci války a že Vaše římské císařské Veličenstvo v něm nemůže strpět žádné finty {finantz} ani jakoukoli překážku či liknavost. Kdyby se totiž proviant dostal do nepořádku nebo nerovnosti, měl by z toho veškerý válečný lid škodu a důvod k nevoli, a z toho pak vzniká veškerá neposlušnost a křik proti proviantnímu pánovi. Proto nechť mu Vaše římské císařské Veličenstvo řekne, že protože k němu má Jeho Veličenstvo tak vysokou důvěru a svěřuje a ukládá mu tento důležitý úřad a správu,
