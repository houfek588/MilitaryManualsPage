bloky:
- typ: odstavec
  de: |-
    Damit ich nun wider kom auff mein gemelte rede / daß es mit geringem kosten vnd kurtzer zeit mög zugehn / Wil ich erstlich für mich nemen zuberichten / wie man den kosten der Artolorei erleichtern mög / vnd die zeit zu handeln erkürtzen / damit man nit an lange Leger erhalten bedarff. Vnd ist erstlich diß mein anschlag / daß ich Scharpffmetzen vnd dergleichen wil nicht gebrauchen / sonder dißmal in meinem vorhaben müssig gehn / vnd für ein Scharpffemetz oder dergleichen gattung nemen souil Mörser / die die schwere der Scharpffemetzen haben / vngefehrlichen ein von 10. Centner / vnd ein Scharpffmetz 100. so nem ich für ein Scharpffemetz 10. Mörser / wern der Scharpffmetzen nun vier / so hett ich 40 Mörser für das gewicht in der Scharpffenmetzen stat / Nun ist zu bedencken wie schwerlich ein Scharpffenmetz vberlandt / der schwere vnd weg halben / vnnd wie leichtlich ein Mörser von zehen Centner / dargegen zurechnen / zufürn ist / so leichtlich einer ist / seind die andern all / zufürn / dieweil das gewicht nit auff einem hauffen wie an einer Scharpffenmetzen / sonder in zehen theil getheilt.
  cs: |-
    Abych se tedy vrátil ke své zmíněné řeči, totiž že by to mohlo jít s malými náklady a v krátkém čase: chci nejprve vyložit, jak lze snížit náklady na dělostřelectvo {Artolorei} a zkrátit dobu celé akce, aby nebylo třeba dlouho udržovat ležení {Leger}.[^1] Můj návrh je předně tento: šarfmece {Scharpffmetzen} a podobná děla použít nechci, nýbrž je tentokrát ve svém záměru vynechat a místo jedné šarfmece či děla podobného druhu vzít tolik moždířů {Mörser}, kolik váží šarfmece. Váží-li moždíř přibližně 10 centů {Centner} a šarfmece 100, vezmu za jednu šarfmeci 10 moždířů; kdyby šarfmece byly čtyři, měl bych místo jejich váhy 40 moždířů. Nyní je třeba uvážit, jak obtížně se šarfmece pro svou tíhu a stav cest dopravuje po zemi a jak snadno se naproti tomu veze moždíř o deseti centech; a jak snadno se veze jeden, tak snadno se vezou i všechny ostatní, protože váha není v jednom kuse jako u šarfmece, nýbrž je rozdělena na deset dílů.
- typ: odstavec
  de: |-
    Weitter ist zurechnen wie schwere der Scharpffenmetzen Kugeln wigen / so mann der souil solt mit füren / als mann zu nötigen eins Flecken bedarff / deßgleichen das Puluer darzů. So mann nun die scharpffemetzen für einen Flecken brengt / da mann schiessen wil / was wöllen die für ein schantz haben sie zu legen vnd zuuerdecken / oder Leut sie zuhandeln vnd schiessen / wie ein jeder weiß der sichs versteht was darzugehört / etc.
  cs: |-
    Dále je třeba spočítat, kolik váží koule {Kugeln} do šarfmecí, má-li se jich vézt tolik, kolik je potřeba k dobytí městečka, a k tomu i střelný prach {Puluer}. A když se šarfmece přivezou před městečko, na něž se má střílet, jakou šanci {schantz} potřebují, aby se uložily a zakryly, a kolik lidí k obsluze a střelbě – jak ví každý, kdo rozumí tomu, co k tomu patří, atd.
- typ: odstavec
  de: |-
    Wann nun ein Festung dermassen gemacht / daß mann ein Monat daruber schiessen můß / was gehört einn Monat auff ein solches schwer stück / vnd ein gantz Leger die zeit. Solches alles zu leichtern vnd zukürtzen / hab ich für mich genommen die viertzig Mörser / vngefehrlich zu einem anschlag gemacht / da hab ich erstlich / wie gemelt / die geringerung der Fuer vnd schantzen zu machen / dann es ist gůt zu dencken daß ein Morser gůt zu legen ist / dann dem mag leichtlich ein gruben gemacht werden / das er sicher zum werffen ligt.
  cs: |-
    Je-li pak pevnost vybudována tak, že se na ni musí střílet celý měsíc, co všechno si za ten měsíc vyžádá takový těžký kus {stück} a po tu dobu celé ležení! Abych to všechno ulehčil a zkrátil, vzal jsem si k přibližnému rozpočtu oněch čtyřicet moždířů. Tu mám předně, jak bylo řečeno, menší nároky na dopravu a stavbu šancí, neboť lze snadno usoudit, že se moždíř dobře osazuje: snadno se mu vykope jáma, v níž leží bezpečně připraven k vrhání.
- typ: odstavec
  de: |-
    Das ander / wann ich mit einem Mörser geschickt bin / wie ich vermein / wil ich werffen tag vnd nacht / vnd was ich damit thůn will / můß geschehen in tag vnd nacht / soll es anders zu glück schlagen oder gerathen / dann was in solcher zeit nicht geret / ist darnach vmbsonst / Wie das zugericht sein soll / will ich weitter anzeigen.
  cs: |-
    Za druhé: jsem-li s moždířem připraven tak, jak zamýšlím, chci vrhat dnem i nocí; a co jím chci pořídit, musí se stát během jednoho dne a noci, má-li se to vůbec zdařit a podařit, neboť co se v té době nepovede, je potom marné. Jak to má být zařízeno, vyložím dále.
- typ: odstavec
  de: |-
    Ich will nun achten / ich hab viertzig Mörser sind gelegt / vnd zu einem jeden fünfftzig kugeln das weren 2000 Kugeln.
  cs: |-
    Budu tedy předpokládat, že mám čtyřicet moždířů osazených na stanovištích a ke každému padesát koulí, což by bylo 2000 koulí.
- typ: odstavec
  de: |-
    Es kompt offt das ein statt dermassen vermacht / daß jr mit
  cs: |-
    Často se stává, že je město tak opevněno, že mu nelze
poznamky:
- n: 1
  text: |-
    V originále *nit an lange Leger* – patrně tiskařská či nářeční podoba místo *ein lange Leger* („dlouhé ležení“).
