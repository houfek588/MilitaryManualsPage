bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    wenigsten leut hin wandern/ gestelt werden/ vnd es daselbs wol verwarn/ daß weder Fewer noch Wasser darzů komme/ solt auch dasselbig ort mit grünen Küheuten vnd Ochsenheuten vberhencken lassen/ vnnd das har herauß keren darmit das Fewer kein schaden bringe/ dann das Fewer die gröst gefehrlicheit ist die mann auff dem wasser haben mag.
  cs: |-
    chodí nejméně lidí, a tam to dobře zajistit, aby se k tomu nedostal ani oheň, ani voda. To místo máte také dát ověsit čerstvými kravskými a volskými kůžemi, srstí ven, aby oheň nemohl způsobit škodu; oheň je totiž největší nebezpečí, jaké může na vodě nastat.
- typ: odstavec
  de: |-
    Auch soll ewer Oberster Kämmerling im Schiff lugen/ daß mann euch ein Kammer oder zwo mach/ da es euch am gelegensten ist/ vnd nichts hindern mag das Schiff zu regieren/ vnd soll die kleinst zum aller höchsten hinden inn das Schiff machen lassen/ eine neben den grossen Mastbaum die ein Fenster habe/ darauß mann zum Segel sehen künde/ dieselbigen solt jr so groß machen/ daß ein Beth darinn stehen mag/ vnd platz zu vier oder fünff Personen die euch dienen/ in derselbigen Kammern solt jhr vmb dreierlei vrsachen schlaffen/ Die erst/ daß dieselbig Kammer an einem solchen ort gelegen/ darinn jhr alles das im gantzen schiff geschicht/ sehen künden/ das jr insonderheit begern solt/ dann je mehr achtung jhr auff die ewern gebt je fleissiger sie handeln werden/ Zum andern wann ein lermen oder gefehrlicheit in dem schiff ist/ kundt jr es zum besten daselbst hören/ Zum dritten kündt jr an keinem sichern ort im gantzen schiff ligen/ dann daselbst (ich wolt auch ein grössere Kammer darinn ich rath halten/ vnd was für frembd leut kommen darinn verhören) auff das köstlichest zurichten lassen.
  cs: |-
    Také váš nejvyšší komorník {Kämmerling} má na lodi dohlédnout, aby vám udělali jednu nebo dvě komory tam, kde je to pro vás nejpříhodnější a kde to nemůže překážet v řízení lodi. Tu menší má dát zřídit úplně nahoře na zádi lodi, druhou vedle hlavního stěžně, s oknem, z něhož je vidět na plachty. Komory máte dát udělat tak velké, aby se do nich vešlo lože a místo pro čtyři nebo pět osob, které vám slouží. V té komoře máte spát ze tří důvodů. Za prvé proto, že leží na takovém místě, odkud můžete vidět všechno, co se na celé lodi děje, o což máte zvlášť stát; čím více totiž dbáte na své lidi, tím pilněji budou jednat. Za druhé, nastane-li na lodi poplach {lermen} nebo nebezpečí, nejlépe to uslyšíte právě tam. Za třetí nemůžete na celé lodi ležet na bezpečnějším místě. Tam ji dejte co nejskvostněji vyzdobit (chtěl bych také mít větší komoru, v níž bych se radil a vyslýchal cizí lidi, kteří přijdou).
- typ: odstavec
  de: |-
    Weitter wann jr zu Wasser mit Galleen kriegen wolt/ müst jr ein Königliche Gallee haben/ die grösser sei dann die andern/ darinn jhr ein Kammer haben solt die wol gedepffet vnd gemalt sei/ dann mann einen vnseglichen bracht mit sollichen dingen auff dem Meer fürt/ vnd solt das hindertheil des schiffs mit eiteln gulden Tüchern oder Samat behencken/ vnd darnach nach der leng der Galleen herab hüpsch dapisterei scharlach oder sonst gůt seidene Tücher/ die biß in das wasser hangen/ nachuolgents soll dauorn im schiff auff ein jeglicher seiten ein gůt Falckenetlein oder zwei stehen/ vnnd die besten gerüsten leut die jr habt/ deßgleichen solt jr zum Obersten in der Galleen auch ein stück oder zwei haben/ die alle wol gerüst vnd geladen sein sollen.
  cs: |-
    Dále, chcete-li válčit na vodě s galérami {Galleen}, musíte mít královskou galéru, větší než ostatní, v níž máte mít komoru dobře obloženou dřevem[^1] a vymalovanou; na moři se totiž s takovými věcmi provozuje nevýslovná nádhera. Záď lodi máte dát ověsit samými zlatohlavy nebo sametem a potom po celé délce galéry dolů pěkné tapiserie, šarlat nebo jiné dobré hedvábné látky, které visí až do vody. Vpředu na lodi mají pak na každé straně stát jeden nebo dva dobré falkonety {Falckenetlein} a nejlépe vyzbrojení lidé, jaké máte. Stejně tak máte mít i nahoře na galéře jedno nebo dvě děla {stück}; všechna mají být dobře připravena a nabita.
- typ: odstavec
  de: |-
    Jch hab euch inn kürtze angezeigt wie ewer Königliche Gallee zugerüst sein soll/ Jetzt wil ich euch die ordnung so jr in ewern schiffen halten solt kürtzlich beschreiben/ Erstlich solt jr ewer Armada in vier theil theilen/ vnd in einem jeglichem Quartier einen Obersten machen vnd soll ein jeglicher auß demselbigen ein leutenant haben/ vnd wenn die sachen zu schlagen kompt/ sol ein jeglicher Knecht/ vnder
  cs: |-
    Krátce jsem vám ukázal, jak má být vaše královská galéra vystrojena. Nyní vám chci stručně popsat řád, který máte na svých lodích zachovávat. Za prvé máte své loďstvo {Armada} rozdělit na čtyři části a v každé části ustanovit plukovníka {Obersten}; každý z nich má mít ze svých lidí poručíka {leutenant}. A když dojde k bitvě, má každý knecht {Knecht} zůstat u
poznamky:
- n: 1
  text: |-
    *gedepffet* – snad *getäfelt*, tj. obložená dřevěným táfelováním.
