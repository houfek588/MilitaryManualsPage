bloky:
- typ: odstavec
  de: |-
    DIe grosse schwere Stück als Scharpffemetzen vnd der gleichen schwere Stück/ hat mann auff scheiben in den Schantzen odder auff den Legern abgeschoffen/ vnd nit auff den rechten Redern/ dann jhre rechte Reder die sind zu hoch/ vnd sind die Stück vnnd jhre gefeß auch hoch vnd breit/ sollen sie dann also mit jhren gefessen auff jhren Redern stehen/ so wirts wol acht oder zehen schůh hoch solches were nit zu laden/ abzusehen noch zu bedencken oder zu handeln/ darumb so macht mann jnen scheiben das sie nider ligen/ vnd damit vmbgehn künden.
  cs: |-
    Velké těžké kusy jako šarfmecy {Scharpffemetzen} a podobně těžká děla se v šancích {Schantzen} nebo v polních leženích {Legern} odpalovaly z plných kotoučů {scheiben}, a nikoli z řádných vysokých kol; neboť jejich vlastní kola jsou příliš vysoká a také kusy i jejich lafety {gefeß} jsou vysoké a široké. Kdyby tedy takto stály se svými lafetami na vysokých kolech, dosahovaly by do výše osmi nebo deseti stop {schůh}, takže by se nedaly nabíjet, zaměřovat, obhlédnout ani ovládat; proto se jim dělají nízké kotouče, aby ležely nízko u země a dalo se s nimi zacházet.
- typ: odstavec
  de: |-
    Derhalben hab ich die getheilt in zweierlei art oder gattung als die ein auff rederweiß die ander gantz auff Scheiben art/ vnd wie die sollen gemacht werden zeigen die Figurn an als nemlich so ist ein jede mit einer Scheiben wie die Naben sein sol/ doch so ist sie nicht abgezogen Spitz wie ein Naben forn außsen ist/ sonder hinden vnd forn gleich hoch vnd dick/ aber das Loch dardurch das ist Achsen recht messig/ das die Achsen so inn die Reder gerecht/ auch inn die scheiben gerecht sind/ aber solch grosse Stück gebürt sich nicht in jren gefessen zufürn sonder auff einem Bloch/ vnd so sie dann auff einem Plochwagen wie sich gebürt gefürt werden/ so soll das Loch in der Scheiben wol weit sein/ das die Achs an dem Gefeß starck bleiben mag/ vnd hinden ein wenig weitter dann fornen/ damit es gern auß vnd ein gehn möge/ vnd solche Achsen sollen wol wie hie forn mit einem vnderleg Eisen gefast vnd verbunden werden.
  cs: |-
    Proto jsem je rozdělil na dva druhy neboli způsoby: jedny na způsob kol s krátkými paprsky a druhé zcela na způsob plných kotoučů {Scheiben}; a jak mají být zhotoveny, ukazují tyto figury. Každý z nich má totiž středový kotouč namísto náboje, jenž však není vpředu zúžený do špice jako běžný náboj kola, nýbrž jest vzadu i vpředu stejně vysoký a tlustý; otvor skrz něj jest však přesně podle rozměrů nápravy, aby náprava, jež pasuje do kol, pasovala rovněž i do kotoučů. Takto veliké kusy však nepřísluší vozit v jejich lafetách {gefessen}, nýbrž na kládě; a když se tedy vozí na kládovém voze {Plochwagen}, jak se sluší, má být otvor v kotouči dostatečně široký, aby náprava na lafetě {Gefeß} mohla zůstat silná, a vzadu o málo širší než vpředu, aby se dala snadno nasazovat a snímat; a takové nápravy mají být dobře staženy a svázány spodním podkladovým železem, jak výše ukázáno.
- typ: odstavec
  de: |-
    Weiter so hab ich die Scheiben mit einen theil außgezogen das zusehn sein mag/ wie mann die scheiben von stücken machen soll/ vnd wie man die in ein ander zapffen vnd dengel kan.
  cs: |-
    Dále jsem jeden díl kotouče povytáhl ven, aby bylo vidět, jak se mají kotouče {scheiben} skládat z více dílů a jak je lze do sebe začepovat a pevně skovat (*dengel*).
- typ: odstavec
  de: |-
    Deßgleichen so sind die stücker mit Eisen Banden zusamen gebonden vnd mit starcken Eisen vorgenenden Nägeln angezogen vnd die Nägel sollen hinden verniet werden/ damit sie sich nicht außziehen künden/ dann mit solchen Nägeln windet oder treibet mann sie fürt/ also daß mann ein beschlagen stangen mit einem Ring hat/ dann thůt mann die stange mit dem Ring an der eisen Nägel ein/ vnnd legt sie mit dem ort vorn auff der inwendigen Nägel ein/ vnnd hebt hinden an der stangen fürt/ wie dise hernach volgende Figur außweisset.
  cs: |-
    Stejně tak jsou jednotlivé díly svázány železnými pásy a staženy silnými vyčnívajícími[^1] železnými čepy (hřeby), jež mají být vzadu roznýtovány, aby se nemohly vytáhnout. Právě za tyto čepy se totiž kotouče otáčejí a posouvají vpřed: vezme se okovaná páková tyč s kroužkem, kroužek se navlékne na jeden z vnějších železných čepů, špička tyče se opře vpředu o jeden z vnitřních čepů a zezadu se za tyč zvedá a posouvá vpřed, jak ukazuje tato následující figura.
poznamky:
- n: 1
  text: |-
    V tisku *vorgenenden* (od *vorgehen* / *fürgehn* ve významu „vyčnívající“ – jak ukazuje vyobrazení na následujícím listu `4-017v`, kde čepy vyčnívají z plochy kotouče pro oporu páky).
