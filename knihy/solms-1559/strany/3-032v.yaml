stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    stülen geschossen werden/ sonder auff jren gefässen/ die sollen an jren Achsen schleyffkeil haben/ damit die Mörser die achsen nit zerstossen.
  cs: |-
    stolic {stülen}, nýbrž ze svých lafet {gefässen}, mají mít na nápravách brzdné klíny, aby moždíře {Mörser} nápravy neroztloukly.
- typ: odstavec
  de: |-
    Dieweil dann die Mörser also vor einem Flecken geteilt sein sollen/ geschicht darumb/ das mann auff allen seiten hinein werffen mag/ dann so die Feur oder kugeln so hin vnd wider an vil orten inn ein Stat fallen würden/ so müssen die in der Stat sich auch theilen/ wann sie anders an allen orten retten vnd wehrn/ wolten/ sie sich aber nicht theilen/ vnd an einem ort etwan ein Feur wol angieng/ vnd sie das mit gewalt bestehn zu retten/ so müssen sie an andern orten die Fewer gewerden lassen. Derhalben hab ich vermeint vnd noch das gůt sein solt wann es anders sein möcht/ daß die Mörser nicht an einem ort/ sonder an vil orten gelegert werden möchten/ darmit die Feur also schrencklichweiß durch einander gehn möchten.
  cs: |-
    Moždíře mají být před městečkem takto rozděleny proto, aby se do něj mohlo vrhat ze všech stran. Budou-li totiž ohně či koule {kugeln} padat sem tam na mnoha místech do města, musí se rozdělit i obránci ve městě, chtějí-li všude hasit a bránit se. Kdyby se však nerozdělili a na jednom místě se oheň pořádně rozhořel a oni by ho vší silou hasili, museli by jinde nechat ohně rozhořet. Proto jsem měl a dosud mám za to, že by bylo dobré, kdyby to jen šlo, aby moždíře nebyly rozmístěny na jednom místě, nýbrž na mnoha, aby se tak ohně šířily křížem krážem.
- typ: odstavec
  de: |-
    Herwiderumb so ist es auch mühsam vnnd schwer/ daß mann solt also vil Schantzen von einander machen/ darinn die Mörser gebraucht werden vmb der nacht willen/ damit sie alle versehen möchten werden/ Darumb hab ich vor eben angezeigt/ daß die Mörser bei dem tag nicht in die Schantzen/ die jn gemacht sein/ gefürt werden/ damit die auß der Stat sie nicht vberfallen möchten/ darumb sollen sie bei der nacht vnbesehn zugericht in jre Schantzen gefürt werden/ vnnd so bald mit dem werffen angehaben/ wann die dann recht gemacht vnd darmit vmbgangen wurden/ soll es denen inn der Stat das außfallen wol wehren/ Mann möcht auch bei der nacht/ wann mann arbeiten wurde woll darob kündten halten/ dann es were alles vmb ein nacht vnd auffs lengst ein tag darzů gethan/ dann inn der zeit muß es geraten oder verderben.
  cs: |-
    Na druhé straně je také namáhavé a obtížné zřizovat tolik šancí {Schantzen} daleko od sebe, v nichž se moždíře užívají, a to kvůli noci, aby mohly být všechny včas připraveny. Proto jsem právě výše uvedl, že se moždíře nemají za dne zavážet do šancí, které jsou pro ně udělány, aby je obránci z města nemohli přepadnout. Mají se tedy připravené zavézt do svých šancí nepozorovaně v noci a hned se má začít vrhat. Bude-li vše uděláno správně a bude-li se s tím dobře zacházet, mělo by to obráncům ve městě výpady dobře zamezit. V noci, kdy se bude pracovat, by se nad nimi také dala dobře držet ochrana; šlo by totiž jen o jednu noc a nejvýše ještě jeden den, neboť v té době se to musí buď zdařit, nebo zkazit.
- typ: odstavec
  de: |-
    Damit aber in den Schantzen mit den Mörsern möcht fürderlich vmbgangen werden/ sol ein jeglicher Büchsenmeister zu seinen Mörsern vier ledern Seck haben/ da souil eingeht als er zu einer Ladung bedarff.
  cs: |-
    Aby se však v šancích s moždíři mohlo zacházet rychle, má mít každý puškař {Büchsenmeister} ke svým moždířům čtyři kožené pytlíky, do nichž se vejde tolik [prachu], kolik potřebuje na jednu nálož.
- typ: odstavec
  de: |-
    Aber soll von einem Tůch ein gůt summa Kardetschen gemacht haben/ das alweg in einem sack des Mörsers ladung eingefast wer/ vnd wider zugeneht/ solcher Kardetschen möcht er ein grosse summa/ souil er hett Kugeln bei einander haben.
  cs: |-
    Také má mít z plátna naděláno velké množství prachových patron {Kardetschen}, tak aby v každém váčku byla nálož do moždíře a váček byl opět zašit; takových patron může mít pohromadě velkou zásobu, tolik, kolik má koulí.
- typ: odstavec
  de: |-
    So mag mann auch wol die ladung an die Kugel machen/ das es also mit einander in den Mörser geht.
  cs: |-
    Nálož lze také připevnit ke kouli, takže obojí jde do moždíře najednou.
- typ: odstavec
  de: |-
    Wo als dann würde mit den kardetschen oder doch Kugel vnnd Puluer an einander hangt solt geladen vnd geschossen werden/ so soll der Büchsenmeister wol darauff sehen/ das von der kardetschen/ oder dem andern Sack nichts in der Büchsen bleib/ wann er wider
  cs: |-
    Kdyby se pak nabíjelo a střílelo těmito patronami, anebo s koulí a střelným prachem {Puluer} spojenými dohromady,[^1] má puškař bedlivě dbát, aby z patrony nebo z jiného váčku nic nezůstalo v děle {Büchsen}, až do něj bude znovu
poznamky:
- n: 1
  text: V tisku stojí zkrácené či neskloněné *hangt* (za *hangendt*, „spojených dohromady“).
