bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    verstendigen Leuten / die solches haben im feld vnd im Leger / mit aller versehung des Kriegs vnd gůter Justitien verwalt vnnd erhalten biß noch / Derhalben seien sie noch des gemůts vnd meinung / vnnd darumb außgeritten sich wie jhre Voraltern ehrlich / manlich vnnd alles rechten gebürlichen Kriegs grauch zuhalten / vnd in dem mit Gottes gnaden vnd hilff / thůn vnd gefunden werden / wie die ehrlichen / rittermessigen vnnd Kriegßleut mit darstreckung leibs vnd blůts / doch das solliche Kriegßordnung vnd Justitien mit den Obersten des Kriegs vnd Kriegßuerstenden gleich allen Nationen geordnet / auffgericht vnd gehalten werde / vnd daß sie wie allwegen / jhre Ampter selber haben vnd behalten mögen mit jrer Justitien / wie herkommen ist / so wöllen wir vns (wills Gott) dergestalt halten vnnd regiren / das zusehen sein soll / daß wir wie ehrliche Kriegßleut / der billichkeit vnd altem Kriegs gebrauch nach halten vnd geleben wöllen / vnserer Obrigkeit allen gehorsam leisten.
  cs: |-
    rozumnými lidmi, kteří to v poli i v ležení {Leger} se vším válečným opatřením a dobrou spravedlností {Justitien} spravovali a udržovali až dosud. Proto jsou i nadále téže mysli a úmyslu a právě proto vyjeli do pole, aby se jako jejich předkové chovali čestně, mužně a podle všeho pravého a náležitého válečného zvyku[^1] a aby v tom s Boží milostí a pomocí jednali a byli shledáni jako čestní rytířští válečníci {Kriegßleut}, kteří nasazují tělo i krev. Avšak s podmínkou, že takový válečný řád a spravedlnost budou s plukovníky {Obersten} války a se znalci válečnictví {Kriegßuerstenden}[^2] zřízeny, ustaveny a zachovávány stejně pro všechny národy a že si jako vždy budou moci sami ponechat a udržet své úřady se svou spravedlností, jak je odedávna zvykem. Pak se (dá-li Bůh) budeme chovat a řídit tak, že bude vidět, že chceme jako čestní válečníci jednat a žít podle slušnosti a starého válečného zvyku a prokazovat své vrchnosti veškerou poslušnost.
- typ: odstavec
  de: |-
    Daß sie aber noch nicht wissen was die Ordnung sein soll / deßgleichen die Justitien wie oder durch wen die geregirt soll werden / so sei jhnen beschwerlich solliches also frei on vorwissen einzugehen vnd bewilligen.
  cs: |-
    Protože však dosud nevědí, jaký má ten řád být, ani jak a kým má být spravována spravedlnost, je pro ně obtížné na to takto bezvýhradně a bez předchozí vědomosti přistoupit a svolit k tomu.
- typ: odstavec
  de: |-
    Das seind wir aber willig vnnd vrbittig / daß durch alle Obersten vnnd deren verstendigen verordneten verglichen werde / wie vor vermelt / auch zu geleben vnnd mit zu halten / wie Kriegßleut die der ehren nach ziehen / suchen vnd volgen wöllen / Doch so wöllen sie wann sie in das Leger bei die andern Kriegßleut kommen mit anhören / aller gebür vnd billicheit halten / vnnd alles das mit helffen suchen / fürnemen vnnd fürdern / das vnserem Kriegßherren vnnd allem Kriegßuolck zu gůten ehren gedeien vnnd aller wolfart kommen mag.
  cs: |-
    K tomu jsme však svolni a ochotni: ať se to, jak řečeno výše, dohodne skrze všechny plukovníky a jejich rozumné pověřence, a podle toho také žít a společně to dodržovat, jak to chtějí válečníci, kteří táhnou za ctí, hledají ji a následují. Přesto však chtějí, až přijdou do ležení k ostatním válečníkům, [vše] spolu vyslechnout, zachovávat veškerou náležitost a slušnost a pomáhat hledat, podnikat a podporovat všechno, co může našemu válečnému pánovi {Kriegßherren} a všemu válečnému lidu {Kriegßuolck} přispět k dobré cti a veškerému zdaru.
- typ: odstavec
  de: |-
    Vnd wann den Commissarien solliches von den Kriegßleuten auff dem Musterplatz begegnen wirt / dann ist jhnen von nöten / daß sie darzů geschicklich antworten / dann das Kriegßuolck hat des billich vrsachen / wie gesehen worden / wie ein zeitlang die Justitien mit aller Kriegßordnung regieret vnd gangen ist / vnd Personen sich dessen zu regieren vndernommen vnd vnderstanden haben / solliches hat dem Kriegßuolck den weg gewisen / daß sie der sachen gůt acht nemen / vnnd sich nicht lassen vnder den Finantz vnd Schreibfeder dringen / wie vnderstanden worden.
  cs: |-
    Když se komisaři {Commissarien} na přehlídkovém místě {Musterplatz} setkají s něčím takovým ze strany válečníků, musejí na to obratně odpovědět. Válečný lid k tomu totiž má oprávněné důvody: bylo vidět, jak byla po nějaký čas spravována a vedena spravedlnost se vším válečným řádem a jaké osoby se odvážily ji řídit. To ukázalo válečnému lidu cestu, aby si na věc dával dobrý pozor a nenechal se vehnat pod finty {Finantz} a písařské brky, jak se o to někteří pokoušeli.
poznamky:
- n: 1
  text: V tisku *grauch* za *gebrauch*.
- n: 2
  text: V tisku *Kriegßuerstenden* za *Kriegßuerstendigen* („znalci války“).
