stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    ZV disen hieuorigen Zögen gehören dise eingefaste scheiben oder Kloben/ wie hieuor bei den Zögen angezeigt ist/ nemlich die zwen gröste Kloben/ so bei vnd gegen ein ander vberstehen/ der ein theil 6. Scheiben hat/ vnd sein gegen theil auch 6. das die beide zusamen haben 12. scheiben/ vnd der eine vberzwerg ein klein wendscheiblein darinn sich das Seil gleich richt vnd auff den Haspel kömpt/ dann das seil wirt doppel als vff zwei ende eingezogen/ vnd die beide ende zu gleich auff den Welbaum komen.
  cs: |-
    K těmto výše uvedeným kladkostrojům {Zögen} patří tyto kladky v pouzdrech neboli kladnice {Kloben}, jak už bylo u kladkostrojů ukázáno: totiž dvě největší kladnice, které stojí vedle sebe a proti sobě. Jedna z nich má 6 kladek (*Scheiben*) a její protějšek také 6, takže obě mají dohromady 12 kladek; jedna z nich má navíc napříč malý otočný kotouček {wendscheiblein}, v němž se lano vyrovná a navede na naviják {Haspel}. Lano se totiž navléká dvojmo, tj. na dva konce, a oba konce přicházejí zároveň na hřídel {Welbaum}.
- typ: odstavec
  de: |-
    Die andern zwen nechst folgent dabei gehörn auch zusamen/ vnnd hat ein theil 4. scheiben/ vnd das ander theil auch 4. vnd ein zwerg wendscheiblein das sind zusamen 8. scheiben vnd ein klein wendscheib.
  cs: |-
    Další dvě hned vedle k sobě rovněž patří: jedna část má 4 kladky, druhá také 4 a k tomu příčný otočný kotouček, což je dohromady 8 kladek a jeden malý otočný kotouček (*wendscheib*).
- typ: odstavec
  de: |-
    Die drit hernach hat ein theil 2. scheiben vnd kein wendscheib/ vnd die beide haben 4. scheiben/ vnd werden einfach eingezogen.
  cs: |-
    Třetí pár za nimi má na každé části 2 kladky a žádný otočný kotouček; obě části mají dohromady 4 kladky a navlékají se jednoduše.
- typ: odstavec
  de: |-
    Die vierdt sind auch 2. theil/ das ein hat zwo scheiben vnd sein gegentheil eine das sind 3. scheiben/ vnd wirt auch einfach eingezogen.
  cs: |-
    Čtvrtý pár má také 2 části: jedna má dvě kladky a její protějšek jednu, to jsou 3 kladky, a navléká se rovněž jednoduše.
- typ: odstavec
  de: |-
    Die drei stül darnach gehörn zu dem vndersetzen/ wann mann die Reder in dem Felde schmirdt/ dann muß mann sie außthůn/ so stelt mann sie vnder die Büchs/ thůt die Reder auß vnd schmirdt sie/ deßgleichen in einem Zeughauß wann mann darinn arbeit.
  cs: |-
    Tři podstavce (*stül*), které následují, slouží k podkládání, když se v poli mažou kola: kola se musejí sundat, a tak se podstavce postaví pod dělo, kola se sejmou a namažou; stejně tak ve zbrojnici {Zeughauß}, když se v ní pracuje.
- typ: odstavec
  de: |-
    Der drit stul ist ein Hepzeug da steckt mann eisen dardurch hoch oder nider/ vnd wigt mit der stangen darüber/ die winde darbei hat vnden ein griff/ da hept mann mit vnden vnd oben.
  cs: |-
    Třetí podstavec je zvedák {Hepzeug}: prostrčí se jím železný čep výš nebo níž a přes něj se zvedá pákou; hever (*winde*) vedle něj má dole dráp, takže se jím zvedá zespodu i shora.
