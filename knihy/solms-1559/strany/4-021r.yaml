list: 21 (4. kniha)
strana: recto
sken: 429
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    ZV disen hieuorigen Zögen gehören dise eingefaste scheiben oder Kloben/ wie hieuor bei den Zögen angezeigt ist/ nemlich die zwen gröste Kloben/ so bei vnd gegen ein ander vberstehen/ der ein theil 6. Scheiben hat/ vnd sein gegen theil auch 6. das die beide zusamen haben 12. scheiben/ vnd der eine vberzwerg ein klein wendscheiblein darinn sich das Seil gleich richt vnd auff den Haspel kömpt/ dann das seil wirt doppel als vff zwei ende eingezogen/ vñ die beide ende zu gleich auff den Welbaum komen.
  cs: |-
    K těmto výše uvedeným kladkostrojům {Zögen} náležejí tyto zapouzdřené kotouče neboli kladnice {Kloben}, jak bylo dříve u kladkostrojů naznačeno: totiž dvě největší kladnice stojící vedle sebe a proti sobě, z nichž jedna část má 6 kotoučů a její protějšek rovněž 6, takže obě dohromady mají 12 kotoučů, a jedna z nich má napříč malý otočný kotouček {wendscheiblein}, v němž se lano vyrovnává a navádí na naviják {Haspel}; lano se totiž natahuje dvojmo, tj. na dva konce, a oba konce pak přicházejí zároveň na hřídel {Welbaum}.
- typ: odstavec
  de: |-
    Die andern zwen nechst folgent dabei gehörn auch zusamen/ vnnd hat ein theil 4. scheiben/ vnd das ander theil auch 4. vnd ein zwerg wendscheiblein das sind zusamen 8. scheiben vñ ein klein wendscheib.
  cs: |-
    Druhé dvě kladnice hned vedle rovněž patří k sobě: jedna část má 4 kotouče a druhá také 4 plus jeden příčný otočný kotouček {wendscheiblein}, což činí dohromady 8 kotoučů a jeden malý otočný kotouč {wendscheib}.
- typ: odstavec
  de: |-
    Die drit hernach hat ein theil 2. scheiben vnd kein wendscheib/ vñ die beide haben 4. scheiben/ vnd werden einfach eingezogen.
  cs: |-
    Třetí dvojice za ní má na každé části 2 kotouče a žádný otočný kotouč; obě mají dohromady 4 kotouče a navlékají se jednoduše.
- typ: odstavec
  de: |-
    Die vierdt sind auch 2. theil/ das ein hat zwo scheiben vnd sein gegentheil eine das sind 3. scheiben/ vnd wirt auch einfach eingezogen.
  cs: |-
    Čtvrtá dvojice sestává rovněž ze 2 částí: jedna má dva kotouče a její protějšek jeden, což jsou 3 kotouče, a rovněž se navléká jednoduše.
- typ: odstavec
  de: |-
    Die drei stül darnach gehörn zu dem vndersetzen/ wann mañ die Reder in dem Felde schmirdt/ dann muß mann sie außthůn/ so stelt mann sie vnder die Büchs/ thůt die Reder auß vnd schmirdt sie/ deßgleichen in einem Zeughauß wann mann darinn arbeit.
  cs: |-
    Tři stolice {stül} dále vyobrazené slouží k podkládání, když se v poli mažou kola: tehdy se musejí sejmout, pod dělo se tedy postaví podložky, kola se sundají a namažou – a stejně tak i ve zbrojnici {Zeughauß}, když se v ní pracuje.
- typ: odstavec
  de: |-
    Der drit stul ist ein Hepzeug da steckt mann eisen dardurch hoch oder nider/ vnd wigt mit der stangen darüber/ die winde darbei hat vnden ein griff/ da hept mann mit vnden vnd oben.
  cs: |-
    Třetí podstavec jest zvedák {Hepzeug}, do nějž se podle výšky prostrkuje železný čep výše nebo níže a přes něj se zvedá pákou; hever vedle něj má dole patku, takže jím lze zvedat jak zespoda, tak shora.
