bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    mittel / vnd were das mein bedencken eines mittels / Daß der Feldoberst mit andern seinen Beuelchßleuten / was stants die weren / hetten vnder jnen ein Ordnung vnd maß gesetzt / welcher bei Gottes lesterung schwere / daß derselbig solt ein anzal gelts geben / vnd setzen des die summa / darnach die schwör vnd flůch groß oder klein weren / vnd verpflichten sich bei handtrew / welcher darinn brüchtig würde / solch summ wie die gesetzt vnd geordnet wirt / gůtwillig on wegerung geben vnd solchs verwirckt oder gefallen gelt / inn einen gemeinen Spittal den krancken / armen Knechten oder Kriegßuolck zuerhalten geben würde / So künden die Hauptleut solchs vnder den Knechten es were zu roß oder fůß / auch auffrichten vnd halten / so würde es mit der zeit in ein gewonheit vnd gebrauch komen / dann es wills zum ersten mit der geschwindigkeit nicht thůn / aber einer der sich des trützlich fleissen wirt / stelle man vor Recht / vnd laß jm gedeien was das Recht darüber geben wirt.
  cs: |-
    prostředek a moje úvaha o něm by byla tato: Nejvyšší polní hejtman {Feldoberst} by se svými ostatními veliteli {Beuelchßleuten}, ať jsou jakéhokoli stavu, ustanovil mezi sebou řád a pravidlo, že kdo by přísahal s rouháním Bohu, musí zaplatit určitou částku peněz; výši sumy by stanovili podle toho, zda jsou přísahy a kletby veliké nebo malé. Zavázali by se podáním ruky, že kdo se v tom proviní, dá ochotně a bez zpěčování takovou sumu, jak bude ustanovena a nařízena; takto propadlé či uložené peníze by se odevzdávaly do obecného špitálu na vydržování nemocných a chudých knechtů {Knechten} či válečného lidu {Kriegßuolck}. Totéž by pak mohli hejtmani {Hauptleut} zavést a udržovat i mezi knechty na koni či pěšky, takže by to časem přešlo ve zvyk a obyčej. Zpočátku to totiž chvatem nepůjde; kdo by však v tom vzdorovitě pokračoval, toho ať postaví před soud {Recht} a nechají jej okusit, co mu soud za to vyměří.
- typ: odstavec
  de: |-
    Dann fürwar solches will von den Hauptern angefangen werden / so werden sie des bei dem gemeinen hauffen volg haben / vnd künden straffen / vnnd Gott seine gnad geben / daß sollicher böser gebrauch der Gottes lesterung abgehn würde / dann were zuuerhoffen Gott solt mehr glück vnd sieg geben / So haben wir Christen ein waren ewigen gewissen Gott / der vns mit seinem bitter leiden vnd blůt vergiessung schwerlich vnd schmerzlich erlöst hat / demselbigen thůn wir nit allein kein ehr an / noch bitten jn in vnsern Kriegßhandlungen / sonder wir schwechen / lestern vnd verschwern jn mit auffhebung vnd vbel gedencken seiner Göttlichen gnaden vnd leidens / welchs die Heiden nie gethan / sonder jre Teufflische Abgötter so hoch geehret vnd darüber gehalten.
  cs: |-
    Vskutku s tím totiž musí začít velitelé; pak je v tom bude následovat i prostý houf {hauffen}, budou moci trestat a Bůh dá svou milost, aby takový zlý zvyk rouhání Bohu vymizel – a pak by bylo lze doufat, že Bůh udělí více štěstí a vítězství. Vždyť my křesťané máme pravého, věčného a jistého Boha, který nás svým hořkým utrpením a prolitím krve těžce a bolestně vykoupil. A my mu nejenže neprokazujeme žádnou čest a nevzýváme jej ve svých válečných podnicích, nýbrž jej tupíme, rouháme se mu a zaklínáme se jím: jeho božskou milost a utrpení v klení vytahujeme a zle o nich mluvíme.[^1] To pohané nikdy nečinili; své ďábelské modly naopak vysoce ctili a pevně při nich stáli.
- typ: nadpis
  uroven: 3
  de: |-
    Hie volgen Zeugnus der heiligen Schrifft des alten vnd newen Testaments.
  cs: Zde následují svědectví Písma svatého Starého i Nového zákona.
- typ: odstavec
  de: |-
    WIewol wir Teutschen vnns des Euangelij vnd der heiligen Schrifft erfarung sonderlich rhůmen / vnnd alle mißbreuch durch vnsere Predicanten straffen vnnd abstellen / will doch keiner dahin gerathen / der das ander Gebot der ersten Tafeln beschirmen oder vertheidigen will / damit das grawsam laster als flůchen vnnd
  cs: |-
    Ačkoli se my Němci obzvláště chlubíme evangeliem a znalostí Písma svatého a skrze své kazatele káráme a odstraňujeme všechny nešvary, nikdo se přece nechce odhodlat, aby hájil a bránil druhé přikázání první desky[^2] a aby tak byla odstraněna a potlačena ta ukrutná neřest, totiž klení a
poznamky:
- n: 1
  text: |-
    V tisku *mit auffhebung vnd vbel gedencken seiner Göttlichen gnaden vnd leidens* – rouhavým dovoláváním se Kristových ran, umučení a svátostí v kletbách (srov. výčet kleteb na listu `1-018r`).
- n: 2
  text: |-
    V tradičním členění Desatera (které Solms zde i v citátech na listu `1-018v` sleduje) tvoří první desku přikázání o povinnostech k Bohu, přičemž druhé přikázání zní: „Nevezmeš jména Hospodina, Boha svého, nadarmo“ (Ex 20,7).
