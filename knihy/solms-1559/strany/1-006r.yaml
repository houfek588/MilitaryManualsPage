bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Kriegsrüstung nit entplöst werden/ solches Kriegßuolck so jetzund in anderen Landen ist/ oder sein möcht/ inn jhrem Vatterlandt als Teutschlandt daheim weren. Nun were zu fragen? Welcher Landts erfarner ein Nation/ da er solliches von gůtem Kriegsuolck/ zu roß vnd fuß mit solcher rüstung vnd geschütz zu finden wiste/ vnd auß einem Landt zu füren/ vnd daß solches Landt nit entplöst würde/ vnd alles Kriegßuolck were/ vnd die andern im Landt bleiben möchten/ vnd das Feld bawen als Teutschlandt thůn kan vnd vermag/ noch Kriegßuolck gnůg im Landt behelt.
  cs: |-
    válečné výzbroje {Kriegsrüstung}, kdyby všechen válečný lid {Kriegßuolck}, který je nyní v cizích zemích nebo by tam mohl být, zůstal doma ve své vlasti, v Německu. Nyní by se dalo ptát: který znalec zemí zná národ, u něhož by dovedl najít takové množství dobrého válečného lidu na koni i pěšky s takovou výzbrojí a děly {geschütz} a vyvést je z jedné země tak, aby ta země nezůstala obnažena, aby to všechno byl válečný lid a ostatní přitom mohli zůstat v zemi a obdělávat pole – jak to dokáže a zmůže Německo, které si přitom v zemi ještě ponechá dost válečného lidu?
- typ: odstavec
  de: |-
    Dieweil dann Julius Cesar der erst Römisch Keiser gewesen/ vnd von den Teutschen mit gewalt gemacht worden/ vnd die wahl einen Keiser zu wehln so lang in der Teutschen handt gestanden/ herbracht vnd noch ist/ Also daß die Teutschen den ersten Keiser mit gewalt gemacht/ vnd die wahl einn Keiser zu wehln/ auch die ersten so die Chůr gehalten vnd gethan haben. Vnd ist die erst wahl gewesen/ daß die Teutschen ein ordenlich wahl gehabt/ vnd ein Grauen gnant Conrat von Hessen/ erwehlet/ vnd ist erwehlet worden von den Landtsherrn nach Christi geburt 913. Jar/ vnd hat regiert das Reich im friden 7. Jar/ da ward er kranck/ vnnd befandt daß er sterben soll/ da beschickt er die Fürsten vnnd landtsherrn/ rieth jnen daß sie Hertzog Heinrichen von Sachsen zu einem Keiser machen wolten/ das geschach auch/ Daß also der erst Keiser bei den Teutschen gemacht/ vnd fürt die erst wahl bei jnen auch geschehen/ vnd noch zuthůn haben/ darbei zusehen/ daß die Teutschen allezeit Kriegsleut gewesen seind/ vnd jren Keiser nit mit spillen/ sonder mit dem schwert gewonnen/ vnd biß noch erhalten/ wils Gott lenger/ Darumb seind die Teutschen alte Kriegsleut/ vnd jre Ordnung nit zuuerwerffen/ noch abgehn zulassen/ sonder es were gůt vnd hoch von nöten/ daß wir Teutschen zu rück giengen/ vnnd an vnser löblich hergebracht manliche handlung vnd Kriegßordnung gedechten/ vns solcher wider gebrauchten/ vor vns nemen/ demselbigen nachgiengen/ vnd richten vnser sachen in gůte ernstliche/ wehrliche Rüstung/ als mit gůten Pferden/ Knechten vnd Harnisch/ wie vnsere vorfarn gethan haben/ vnd nicht also auff die vnnützliche/ ellende schandthoffart/ als vff den gar grossen weibischen bracht/ Als mit solcher gemelter zier/ mit den sammetten grossen gülden Setteln vnd Zeugen/ so jetzt auff ein Pferdt gewant wirt/ daß mann wol zwei güter mit rüstung daruon erhalten möchte/ Deßgleichen souil lackeyen mit jren köstlichen Kleidern/ die schmücken die gassen wol/ aber das Feld nicht/ were besser mann wendet es auff gůte pferdt/ Knecht vnd rüstung/ die auff den Pferden
  cs: |-
    Julius Caesar byl tedy prvním římským císařem a Němci ho mocí ustanovili; volba císaře pak po tak dlouhou dobu stála v německých rukou, zůstala zachována a trvá dosud. Němci tedy mocí ustanovili prvního císaře, zavedli volbu císaře a byli také první, kdo měli volební právo a volbu vykonali. První řádnou volbu Němci uskutečnili, když zemští páni zvolili hraběte jménem Konrád Hesenský[^1]; byl zvolen léta po narození Krista 913 a vládl říši v míru sedm let. Pak onemocněl, a když poznal, že má zemřít, obeslal knížata a zemské pány a poradil jim, aby učinili císařem vévodu Jindřicha Saského; to se také stalo. Tak byl první císař učiněn u Němců a u nich se konala i první volba, kterou dosud vykonávají. Z toho je patrno, že Němci byli vždycky válečníci {Kriegsleut} a svého císaře nezískali hrou, nýbrž mečem, a dosud jej udrželi – dá-li Bůh, i nadále. Proto jsou Němci staří válečníci a jejich řád se nemá zavrhovat ani nechat zaniknout. Naopak by bylo dobré a velice potřebné, abychom se my Němci vrátili zpět, rozpomněli se na své chvályhodné zděděné mužné činy a válečný řád, opět se jich chopili, vzali si je za své, řídili se jimi a obrátili své věci k dobré, vážné a branné výzbroji – totiž k dobrým koním, knechtům {Knechten} a zbroji {Harnisch}, jak to činili naši předkové –, a ne k té neužitečné, bídné, hanebné pýše a převeliké zženštilé nádheře, k takové okázalosti, jako jsou veliká sametová pozlacená sedla a postroje, jaké se dnes vynakládají na jediného koně, že by se z toho daly i s výzbrojí vydržovat dva statky[^2]. Stejně tak tolik lokajů v drahých šatech – ti sice zdobí ulice, ale nikoli pole. Bylo by lépe vynaložit to na dobré koně, knechty a výzbroj, kteří by na koních
poznamky:
- n: 1
  text: |-
    Východofranský král Konrád I. (asi 881–918), v kronikářské tradici ztotožňovaný s hrabětem z Hesenska či Frank, vládl v letech 911–918 (Solms uvádí rok volby 913 a správně sedm let vlády) a před smrtí doporučil zvolit saského vévodu Jindřicha I. Ptáčníka (876–936, vládl 919–936).
- n: 2
  text: |-
    Tisk má *zwei güter* s *ü* (oproti *gůt* „dobrý“ psanému s *ů*), tj. dva statky (*Güter*): náklad na přepych jediného koně by stačil k vydržování dvou statků i s jejich vojenskou výzbrojí.
