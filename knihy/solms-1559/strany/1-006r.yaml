bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Kriegsrüstung nit entplöst werden/ solches Kriegßuolck so jetzund in anderen Landen ist/ oder sein möcht/ inn jhrem Vatterlandt als Teutschlandt daheim weren. Nun were zu fragen? Welcher Landts erfarner ein Nation/ da er solliches von gůtem Kriegsuolck/ zu roß vnd fuß mit solcher rüstung vnd geschütz zu finden wiste/ vnd auß einem Landt zu füren/ vnd daß solches Landt nit entplöst würde/ vnd alles Kriegßuolck were/ vnd die andern im Landt bleiben möchten/ vnd das Feld bawen als Teutschlandt thůn kan vnd vermag/ noch Kriegßuolck gnůg im Landt behelt.
  cs: |-
    válečnou výzbroj {Kriegsrüstung}, kdyby všechen ten válečný lid {Kriegßuolck}, jenž je nyní v cizích zemích nebo by tam mohl být, byl doma ve své vlasti, v Německu. Nyní by se dalo ptát: který znalec zemí [zná] národ, u něhož by věděl, kde najít a z jedné země vyvést takové množství dobrého válečného lidu na koních i pěšky s takovou výzbrojí a děly {geschütz}, aniž by se taková země vylidnila a všechen lid byl jen válečný – kdežto ostatní mohou zůstat v zemi a vzdělávat pole, jak to dokáže a zmůže Německo, a přitom si v zemi ještě ponechá dostatek válečného lidu?
- typ: odstavec
  de: |-
    Dieweil dann Julius Cesar der erst Römisch Keiser gewesen/ vnd von den Teutschen mit gewalt gemacht worden/ vnd die wahl einen Keiser zu wehln so lang in der Teutschen handt gestanden/ herbracht vnd noch ist/ Also daß die Teutschen den ersten Keiser mit gewalt gemacht/ vnd die wahl einn Keiser zu wehln/ auch die ersten so die Chůr gehalten vnd gethan haben. Vnd ist die erst wahl gewesen/ daß die Teutschen ein ordenlich wahl gehabt/ vnd ein Grauen gnant Conrat von Hessen/ erwehlet/ vnd ist erwehlet worden von den Landtsherrn nach Christi geburt 913. Jar/ vnd hat regiert das Reich im friden 7. Jar/ da ward er kranck/ vnnd befandt daß er sterben soll/ da beschickt er die Fürsten vnnd landtsherrn/ rieth jnen daß sie Hertzog Heinrichen von Sachsen zu einem Keiser machen wolten/ das geschach auch/ Daß also der erst Keiser bei den Teutschen gemacht/ vnd fürt die erst wahl bei jnen auch geschehen/ vnd noch zuthůn haben/ darbei zusehen/ daß die Teutschen allezeit Kriegsleut gewesen seind/ vnd jren Keiser nit mit spillen/ sonder mit dem schwert gewonnen/ vnd biß noch erhalten/ wils Gott lenger/ Darumb seind die Teutschen alte Kriegsleut/ vnd jre Ordnung nit zuuerwerffen/ noch abgehn zulassen/ sonder es were gůt vnd hoch von nöten/ daß wir Teutschen zu rück giengen/ vnnd an vnser löblich hergebracht manliche handlung vnd Kriegßordnung gedechten/ vns solcher wider gebrauchten/ vor vns nemen/ demselbigen nachgiengen/ vnd richten vnser sachen in gůte ernstliche/ wehrliche Rüstung/ als mit gůten Pferden/ Knechten vnd Harnisch/ wie vnsere vorfarn gethan haben/ vnd nicht also auff die vnnützliche/ ellende schandthoffart/ als vff den gar grossen weibischen bracht/ Als mit solcher gemelter zier/ mit den sammetten grossen gülden Setteln vnd Zeugen/ so jetzt auff ein Pferdt gewant wirt/ daß mann wol zwei gůter mit rüstung daruon erhalten möchte/ Deßgleichen souil lackeyen mit jren köstlichen Kleidern/ die schmücken die gassen wol/ aber das Feld nicht/ were besser mann wendet es auff gůte pferdt/ Knecht vnd rüstung/ die auff den Pferden
  cs: |-
    Jelikož tedy Julius Caesar byl prvním římským císařem a byl učiněn mocí od Němců a volba císaře stála tak dlouho v rukou Němců, byla jimi zachovávána a dosud je – takže Němci mocí učinili prvního císaře a zavedli volbu císaře, jakož i byli první, kdo drželi a vykonali volbu: první volba pak byla, když Němci konali řádnou volbu a zvolili hraběte jménem Konráda Hesenského[^1], jenž byl zvolen zemskými pány léta po narození Krista 913 a vládl říši v pokoji sedm let; tu onemocněl, a když poznal, že má zemřít, obeslal knížata a zemské pány a poradil jim, aby učinili císařem vévodu Jindřicha Saského, což se také stalo. Tak tedy byl první císař učiněn u Němců a rovněž první volba se stala u nich a dosud jim náleží. Z toho je patrno, že Němci byli vždycky válečníky {Kriegsleut} a svého císaře nezískali hrami, nýbrž mečem, a dosud jej tak udrželi – dá-li Bůh, i nadále. Proto jsou Němci staří válečníci a jejich řád se nemá zavrhovat ani nechávat zajít, nýbrž bylo by dobré a velice potřebné, abychom se my Němci navrátili zpět a rozpomněli se na své chvályhodně zděděné mužné činy a válečný řád, abychom je opět užívali, vzali si je k srdci, řídili se jimi a obrátili své věci k dobré, vážné, branné výzbroji, totiž s dobrými koňmi, knechty {Knechten} a zbrojí {Harnisch}, jak činili naši předkové – a nikoli k takové neužitečné, ubohé, hanebné pýše a k té převeliké zženštilé nádheře, k takové okázalosti se sametovými, velikými, pozlacenými sedly a postroji, jaké se dnes vynakládá na jediného koně, že by se z toho dali vydržovat snad dva dobří [koně] s výzbrojí[^2]; a stejně tak tolik lokajů s jejich skvostnými šaty, jež sice zdobí ulice, ale nikoli pole. Bylo by lépe vynakládat to na dobré koně, knechty a výzbroj, kteří by na koních
poznamky:
- n: 1
  text: |-
    Východofranský král Konrád I. (asi 881–918), v kronikářské tradici ztotožňovaný s hrabětem z Hesenska či Frank, vládl v letech 911–918 (Solms uvádí rok volby 913 a správně sedm let vlády) a před smrtí doporučil zvolit saského vévodu Jindřicha I. Ptáčníka (876–936, vládl 919–936).
- n: 2
  text: |-
    *zwei gůter mit rüstung* – tj. dva dobré [zbrojné koně] s výzbrojí (oproti jednomu přepychově vyzdobenému koni).
