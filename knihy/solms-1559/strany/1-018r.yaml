bloky:
- typ: odstavec
  de: |-
    VNd damit aber neben diser Schrifft ein jeder in augenschein sich zuersehen / vnd die grausame Gotßlesterung so freuellich vnd leichtfertig Gott zu schmach geschehen / wol zu erinern hab / Ist dise Figur darin die Allmechtig Göttlich Dreiheit sampt allen Elementen / vnd vnsers Herren Jesu Christi wunden / Leichnam / hertz / Sacrament / Creutz / Marter / vnd bitter leiden angezeigt / dardurch der Herr vnser verdorben vnd verdampt menschlich geschlecht von dem ewigen todt on vnsers einigen zuthůn / durch lauter gnad erlöst / vnd seines Himlischen Vatters zorn hingelegt vnnd versönet hat / daruor wir dann seiner Göttlichen gnaden billich allezeit nit allein danckbar / sonder vmb bestetigung vnsers glaubens / vnd die hertzliche lieb gegen Gott vnd vnserm nechsten eingiessen / bestatten vnnd erhalten wöl / fleissig bitten sollen. Wir sehn auch wie hoch / dieff vnd schwer wir sein Götlichen zorn erwecken / wenn wir seinen heiligen Namen / Leib / Blůt / Fleysch / Wunden / Omacht auch Sacrament / Tauff / Lufft / Dufft / Gegenwindt vnd dergleichen / wie mann das erdencken kan / so lesterlich / vnd mehr auß angenommenem fleiß dann leichtfertigkeit schweren / vnd so vnnützlich in vnser lestermeuler nemen / Vnd wo einer solches am grausambsten vnd schrecklichsten erdencken vnnd außspeien kan / der ist ein versucht vnd wolerfarner man / wöllen auch desselben halben vorgezogen vnd wol geacht sein / Vnd wann ein gůthertziger jm ein freuntlich wort zusprechen will / ist das erst / Gottsmarter / Gottsmacht / Gotts sacrament odder dergleichen / also daß ein einfeltiger Christ sich wol darob entsetzen mög. Vnser Eltern vnd Vorfarn haben jre Kinder die mütterlich Spraach mit dem Vatter vnser / Glauben vnd dergleichen gelert / aber jetzund lernen sie mit flůchen / schweren alle spraach so wol / daß sie auch biß in die zwölff jar alt kein Vatter vnser noch Glauben wissen oder künden / vnd zu besorgen daß die Eltern zum theil auch nit künden / zeucht also darauß ein vngehorsam / vngezogen / Gotlose welt / es kan aber Gott nit lenger zusehn. Derhalben mag ein jeglicher frommer Christ bei sich wol bedencken / dise Figur behertzigen / des Leidens Christi / seinen verdienst vnd gnad so er erworben / damit wir Miterben Christi inn seinem Reich sein sollen / wol warnemen vnd jm seiner gůtthat nit vndanckbar sein / wo aber nit wirt er vns vor seine verheissene gůtthat mittheiln die ewige straff / dafür vns bewar der Messias Jesus Christus / Amen.
  cs: |-
    Aby si však vedle tohoto spisu mohl každý názorně prohlédnout a dobře uvědomit ukrutné rouhání, jež se tak opovážlivě a lehkomyslně děje k potupě Boží, je zde tento obraz.[^1] Je na něm ukázána všemohoucí božská Trojice se všemi živly a rány, tělo, srdce, svátost, kříž, umučení a hořké utrpení našeho Pána Ježíše Krista, jimiž Pán naše zkažené a zatracené lidské pokolení bez jakéhokoli našeho přičinění z pouhé milosti vykoupil z věčné smrti a odvrátil i usmířil hněv svého nebeského Otce. Za to máme jeho božské milosti po právu nejen vždy děkovat, nýbrž také pilně prosit o upevnění naší víry a o to, aby do nás vlil, utvrdil a zachoval srdečnou lásku k Bohu a k bližnímu. Vidíme také, jak vysoko, hluboko a těžce vzbuzujeme jeho božský hněv, když při jeho svatém jménu, těle, krvi, mase, ranách, mdlobě[^2] i svátosti, křtu, vzduchu, oparu, protivětru a podobných věcech, jaké si jen lze vymyslet, tak rouhavě přísaháme – spíše schválně a z navyklé horlivosti než z lehkomyslnosti – a tak daremně si je bereme do svých rouhačských úst. A kdo si takovou věc dovede nejukrutněji a nejstrašněji vymyslet a vychrlit, ten je pokládán za ostříleného a zkušeného muže, a právě proto chtějí mít přednost a vážnost! A když mu chce dobrosrdečný člověk říci přívětivé slovo, první je „Boží umučení“, „Boží moc“, „Boží svátost“ nebo něco podobného, takže prostý křesťan se nad tím může až zděsit. Naši rodiče a předkové učili své děti mateřské řeči spolu s Otčenášem, Vyznáním víry a podobnými věcmi; dnes se však učí řeči s klením a přísaháním tak důkladně, že ještě ve dvanácti letech neznají ani Otčenáš, ani Vyznání víry – a je obava, že je zčásti neumějí ani rodiče sami. Tak z toho vyrůstá neposlušný, nevychovaný a bezbožný svět; Bůh tomu však nemůže déle přihlížet. Proto ať každý zbožný křesťan sám u sebe dobře rozváží a vezme si tento obraz k srdci, ať dobře pamatuje na utrpení Kristovo, na jeho zásluhu a milost, kterou nám získal, abychom byli spoludědici Kristovými v jeho království, a ať mu za jeho dobrodiní není nevděčný. Jinak nám namísto zaslíbeného dobrodiní udělí věčný trest – před tím nás chraň Mesiáš Ježíš Kristus, amen.
- typ: odstavec
  de: |-
    WIr lesen in den alten Heydnischen Geschichtschreibern / wo etwan ein Herr / König oder Fürst einigen Kriegßzug fürgenommen hat / allweg erst an seinen Abgott mit grosser ehrerbietung /
  cs: |-
    Čteme u starých pohanských dějepisců, že kdykoli si nějaký pán, král nebo kníže předsevzal nějaké válečné tažení {Kriegßzug}, vždy nejprve s velikou úctou zaslíbil své modle
poznamky:
- n: 1
  text: |-
    Odkazuje na celostránkový [[1-017v|dřevořez na protější straně]].
- n: 2
  text: |-
    V originále *Omacht* (tj. *Ohnmacht* – mdloba, bezmoc; dobová kletba mířící na Kristovu mdlobu pod křížem, srov. o několik řádků níže kletbu *Gottsmacht* – „Boží moc“).
