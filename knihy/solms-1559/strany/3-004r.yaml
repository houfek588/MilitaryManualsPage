bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    soll dann der Krieg geordnet werden/ so erfordert die notturfft/ daß die Arcolorei oder Geschütz mit geordnet werde/ dieweil es zu dem Krieg vnd Kriegsuolck gehört/ soll es nun mit geordnet vnd darauff zu gericht werden/ ist von nöten vnd will sein/ daß mann die darzů neme die das vnderhanden haben/ so mann es brauchen vnd damit vmbgehn muß/ Dieweil es dann durch die gemelte person mit beratschlagt soll werden/ ist von nöten daß der Zeugmeister ein vertrautte vnd geheime person sei/ daruff sich ein Herr verlassen vnd vertrawen darff/ dann so ein Zeugmeister ein Rathschlag weiß/ kan er sein sachen wol bei sich in geheim achten/ verordnen vnd zurichten lassen/ vnd darff niemants daruon sagen/ vnd geht also vnuermercklich zů/ Will mann aber gantz heimlich vnd vnuermercklich damit vmbgehen/ soll ein Zeugmeister seine sachen in zeit des friedens vnderhand nemen/ also ordnen das alle sachen zugericht seind vnd in jrer Ordnung stehen/ als wann mann allen tag anziehen solt/ zu allem darumb mann es hat zu gebrauchen/ seine personen im Zeughauß von Büchsenmeistern/ die soll er allezeit in jrer vbung vnd arbeit halten/ dann weiß er was er an einem jeden hat/ jm vertrawen vnnd befelhen darff/ So kommen auch dann die Personn in den gebrauch vnd vbung/ vnd ist alles in seiner Ordnung vnd geschicklicheit/ so dann das also in seiner zurüstung vnd ordnung/ mit den personen vnd allem ist/ so kan ein Zeugmeister den Rathschlag wol heimlich gehalten biß es offenbar sein/ vnd angreiffen muß/ Alßdann hat ein Zeugmeister die sachen seinen personen zu eröffnen/ vnd befelhen einem jeden was sein versehung soll sein/ wie er das vor bei jhm verordnet hat/ das ist die beste geheimnuß vnd zu rüstung die mann haben mag/ wann alle ding schon in seiner Ordnung vnd wesen steht. Disen bericht hab ich darumb gethan/ damit zuuerstehn ist/ was der Zeugmeister für ein Person sein soll/ Derhalben ein Herr nach einem ehrlichen Zeugmeister trachten vnd haben soll/ vnd nit ansehen was er steht.
  cs: |-
    má-li se tedy válka uspořádat, vyžaduje potřeba, aby s ní bylo uspořádáno i dělostřelectvo {Arcolorei} neboli děla {Geschütz}, poněvadž náleží k válce a válečnému lidu {Kriegsuolck}. Má-li tedy být spolu s tím uspořádáno a k tomu připraveno, je zapotřebí a nutno vzít k tomu ty, kdo je mají v rukou, když se jich má užívat a zacházet s nimi. Jelikož tedy má být prostřednictvím zmíněné osoby spoluporaděno, je zapotřebí, aby zbrojmistr {Zeugmeister} byl důvěryhodnou a mlčenlivou osobou, na niž se pán smí spolehnout a důvěřovat jí; neboť když zbrojmistr zná válečnou radu, může své věci dobře zachovat v tajnosti u sebe, uspořádat je a dát připravit, aniž by komukoli musel něco říkat, a vše tak jde nepozorovaně. Chce-li se však při tom postupovat zcela tajně a nepozorovaně, má zbrojmistr vzít své věci do rukou již v době míru a zařídit je tak, aby vše bylo připraveno a stálo ve svém pořádku ke všemu, k čemu se toho má užít, jako by se mělo vytáhnout každého dne; své lidi z řad puškařů {Büchsenmeistern} ve zbrojnici {Zeughauß} má vždy udržovat ve cviku a práci, pak ví, co v každém z nich má a komu smí důvěřovat a velet. Tak se také jeho lidé zacvičí a zvyknou si, a vše je v pořádku a pohotovosti; když je tedy vše takto připraveno a uspořádáno s lidmi i vším ostatním, může zbrojmistr radu snadno udržet v tajnosti, dokud to nemá být zjevné a není třeba udeřit. Teprve pak má zbrojmistr věc svým lidem odhalit a přikázat každému, jaký bude jeho úkol, jak si to již dříve u sebe rozvrhl – to je to nejlepší utajení a příprava, jaké lze mít, když už jsou všechny věci ve svém řádu a stavu. Toto poučení jsem podal proto, aby bylo zřejmé, jakou osobou má zbrojmistr být; proto má pán usilovat o čestného zbrojmistra a mít jej, a nehledět na to, co stojí.
- typ: nadpis
  uroven: 3
  de: Was eins Zeugmeisters beuelch/ versehung/ thůn vnd wissen sei.
  cs: Jaké je velení, správa, konání a vědění zbrojmistra.
- typ: odstavec
  de: |-
    Ein Zeugmeister sol zum ersten gotsförchtig sein/ drumb daß sein ampt ein sorgfeltig ampt ist/ dann er sein feind in der handt hat wann er mit dem Geschütz vmbgeht/ zů andern steht er in gefahr allezeit vor den feinden in den schantzen/ mit allem damit mann das Geschütz braucht/ deßgleichen ist er in grosser gefahr daß er sein ampt wol auß richt/ dann es steht jm ein grosses daruff/ Drumb soll er Gott vil mehr vor augen haben vnd sein gefahr bedencken/ Deßgleichen soll er seinn Büchsenmeistern das vorsagen/ vnd sie darzů halten daß sie der Gotts lesterung müssig gehn/ deßgleichen der Trunckenheit sich enthalten/
  cs: |-
    Zbrojmistr má být především bohabojný, neboť jeho úřad je úřadem plným starostí: jednak má svého nepřítele v ruce, kdykoli zachází s děly, jednak stojí ustavičně v nebezpečí před nepřáteli v šancích {schantzen} se vším, čím se děla obsluhují; stejně tak je ve velkém nebezpečí, aby svůj úřad dobře zastal, neboť mu na tom záleží mnoho. Proto má mít Boha tím více před očima a pomýšlet na své nebezpečí; rovněž to má vštěpovat svým puškařům a vést je k tomu, aby se zdržovali rouhání Bohu a stejně tak se vystříhali opilství,
