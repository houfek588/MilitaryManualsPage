bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    dann es sein nit gemeine Regiment/ die zeit vnd weil leiden mögen/ sonder tag vnd nacht in sorg vnd gefahr stehn/ vnd kein zeit gewiß ist/ darumb wöllen die ämpter mit verstendigen/ sorgfeltigen vnd erfarnen personen versehen sein vnd werden/ Derhalben so wirt hie folgents ein Kriegsordnung vnd deren regierung/ mit verwaltnug vnd versehung der ämpter vnd regiment beschriben/ was eins jeden verwaltung ampts versehung sein sol/ wiewol nit zuthůn ist/ daß sich einer der geschicklicheit achten/ daß er ein Krieg oder Kriegsorgnung beschreiben wolt/ die also in dem buchstaben regiert vnnd gehandelt werden solt/ vnd nit anders dann das/ kan aber nit geschehen/ dann ein jeder newer Krieg ist ein andere meynung/ vnd tregt sich anders zu dann vor geschehen ist/ darumb ist dise verzeichnuß oder beschreibung nichts anders dann ein Memorial/ sich darinn zubesehen/ was sich mit disem wölle zutragen/ das darnach möcht geordenet werden/ vnnd dise Beschreibung ein erinnert/ weiter nachdencken zuhaben/ vnnd was die ämpter des Kriegs seind vnd wöllen/ mit sampt dem bericht eines jeden verwaltung oder versehung/ wirt hernach ein jedes besonder angezeigt vnd beschrieben werden.
  cs: |-
    neboť to nejsou obyčejné správy, které by snesly čas a odklad; stojí ve dne i v noci ve starosti a nebezpečí a žádná chvíle není jistá. Proto musejí být úřady obsazeny a opatřeny rozumnými, pečlivými a zkušenými osobami. Proto je zde dále popsán válečný řád {Kriegsordnung} a jeho správa, s vedením a obstaráváním úřadů a velitelství, a co má každý úřad spravovat a obstarávat.[^1] Nikdo se ovšem nemůže pokládat za tak zběhlého, aby chtěl popsat válku či válečný řád tak, aby se podle něho vládlo a jednalo doslova do písmene, a nijak jinak. To není možné, neboť každá nová válka má jinou povahu a vše se v ní odehrává jinak než dříve. Proto není tento soupis či popis ničím jiným než pamětní knihou, do níž lze nahlédnout, co se může v té které válce přihodit, aby se to podle toho dalo uspořádat; a tento popis připomíná, že je třeba dále přemýšlet. Jaké jsou válečné úřady {ämpter des Kriegs} a co vyžadují, spolu se zprávou o tom, co každý z nich spravuje a obstarává, bude dále ukázáno a popsáno u každého zvlášť.
- typ: odstavec
  de: |-
    Erstlich gehören alle Schloß/ Stät/ flecken/ Land vnd Leut/ sie seien des widertheils/ Kriegsherrn oder seiner verwendten/ allein dem Kriegsherrn zů/ sie werden mit stürmen oder sonst erobert.
  cs: |-
    Předně všechny hrady, města, městečka, země i lidé, ať patří nepřátelskému válečnému pánovi {Kriegsherrn}, nebo jeho spojencům, náležejí jedině válečnému pánovi, ať jsou dobyty útokem {stürmen}, nebo jinak.
- typ: odstavec
  de: |-
    Alle Prandt vnd andere Landschatzung/ wie mann die an eim jeden ort nennet/ gehören niemand dann allein dem Kriegsherrn zů.
  cs: |-
    Veškeré výpalné {Prandt} a jiné zemské berně, jakkoli se jim na kterém místě říká, nenáleží nikomu jinému než jedině válečnému pánovi.
- typ: odstavec
  de: |-
    Alles groß Geschütz sampt der Municion darzů gehörig/ es were in schlachten/ Stürmen oder sonst inn eroberten Flecken gewonnen/ gehörn dem Kriegsherrn/ wann das die Zeugmeister etwas forderung darzů haben/ dauon folgents meldung geschehen soll.
  cs: |-
    Všechna velká děla {Geschütz} spolu s municí {Municion} k nim náležející, ať byla ukořistěna v bitvách, při útocích či jinde v dobytých městech, náleží válečnému pánovi, ledaže by k nim zbrojmistři {Zeugmeister} měli nějaký nárok, o čemž bude zmínka dále.
- typ: odstavec
  de: |-
    Ein jeder Kriegsherr/ der ein krieg fůren muß oder wil/ gedencke anfangs vmb volck oder gelt/ seins widertheils macht gemeß/ vnnd wann er dasselbig zuwegen bracht hat/ soll er dannoch drei ding ernstlich versehen das darinn (souil jm jmmer möglich) kein mangel erschein/ nemlich an Poruiant/ ein gůt Geschütz mit nottürfftiger Munition/ vnd gůte kundtschafft auch/ wanns geschehen möcht/ auß des gegentheils Rath/ daran soll kein gelt gespart werden.
  cs: |-
    Každý válečný pán, který musí nebo chce vést válku, ať se nejprve postará o lid nebo peníze úměrně k moci svého protivníka. Když je opatří, má ještě pečlivě zajistit tři věci, aby v nich (jak nejvíce mu bude možné) nebyl žádný nedostatek: totiž proviant {Poruiant},[^2] dobrá děla s potřebnou municí a dobré zpravodajství {kundtschafft}, bude-li to možné, i přímo z rady protivníka. Na tom se nemají šetřit žádné peníze.
- typ: odstavec
  de: |-
    Ein jeglicher gegentheil/ Kriegsherr odder oberster Feldhauptman/ so sie gefangen werden/ gehörn dem Kriegsherrn/ doch soll er sich mit denen die sie gefangen hetten zimlich vertragen. Mit allen andern gefangen/ sonderlich was die Reisigen betrifft/ wirt nach inhalt der bestellbrieff gehalten.
  cs: |-
    Každý nepřátelský válečný pán nebo nejvyšší polní hejtman {oberster Feldhauptman}, jsou-li zajati, náleží válečnému pánovi, ten se však má s těmi, kdo je zajali, slušně vyrovnat. Se všemi ostatními zajatci, zvláště pokud jde o jízdu {Reisigen}, se nakládá podle znění služebních listů {bestellbrieff}.
- typ: odstavec
  de: Wann ein Kriegsherr selbs ins feld zeucht/ er verwalte die oberste
  cs: Táhne-li válečný pán sám do pole, ať už sám spravuje nejvyšší
poznamky:
- n: 1
  text: |-
    Tisk má v tomto odstavci drobné sazečské odchylky *verwaltnug* (za *Verwaltung*), *Kriegsorgnung* (za *Kriegsordnung*) a *ein erinnert* (za *erinnert*).
- n: 2
  text: Tisková přesmyčka *Poruiant* za *Prouiant*.
