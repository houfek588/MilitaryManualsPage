- n: 1
  text: Tisková chyba – opakuje se suma poslední položky. Součet položek 20–25 činí 669 zl. 9 bac.; s touto hodnotou souhlasí i celkový součet 2262 zl. 3 bac. na konci rejstříku. Rejstřík pokrývá 30 položek; poslední dvě (Miltitz, Kitlitz) nejsou v tisku očíslovány.
