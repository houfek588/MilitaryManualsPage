  popis: |-
    Celostránkový dřevořez nejvyššího polního hejtmana v architektonickém obloukovém rámu s rozvilinami (signováno monogramem HD – Hans Döring – a datováno 1545): vousatý vojevůdce v plátové zbroji a širokém klobouku s bohatým péřovým chocholem jede vlevo na obrněném válečném koni s hlavovou a šíjovou zbrojí i zdobeným kropířem; v pravé ruce drží krátkou velitelskou hůl opřenou o sedlo, u boku má dlouhý meč. V pozadí kopcovitá krajina s hradem a vodní plochou s plachetnicí.
