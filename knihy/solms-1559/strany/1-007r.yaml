bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    gůtem/ darmit dasselbig nit dardurch mit jhrer gůten Rüstung Ordnung vnd Kriegßleuten in ein abfal komen möchte/ wie zubesorgen/ da es sich durch solchen bracht vnd manier mit jren alten gůten wolhergebrachten Rüstung in abfal komen/ die Rüstung vnd gůte Knecht/ zu ruck musten/ vnd die Kauffleut mit jhrem Sammet vnd seiden/ herfür laß/ wie mann wol sicht was jtzt dardurch herfür kompt/ vnd gehalten wirt.
  cs: |-
    dobru Německa, aby se svou dobrou výzbrojí {Rüstung}, řádem a válečníky {Kriegßleuten} neupadlo. Toho je totiž třeba se obávat, neboť takovou nádherou a manýry by upadlo i se svou starou, dobrou a osvědčenou výzbrojí: výzbroj a dobří knechti {Knecht} by museli ustoupit a kupce s jejich sametem a hedvábím by pouštělo dopředu – jak je ostatně dobře vidět, co se tím dnes dere nahoru a čeho se lidé drží.
- typ: odstavec
  de: |-
    Ich habe es gesehen/ das vnsere Teutsche Fürsten jhren Adel an jhren höfen hoch gehalten/ vnd der vil gehabt mit gůten Pferden vnd Knechten wolgerüst vnd beriten/ zusehen ist jetzund an vilen höfen/ was Regirt vnd wie die höfe mit Adel gehalten/ vnd geziert seind.
  cs: |-
    Sám jsem viděl, že naše německá knížata chovala svou šlechtu u svých dvorů ve velké vážnosti a měla jí mnoho, s dobrými koňmi a knechty, dobře vyzbrojenou a na koních; dnes je u mnoha dvorů vidět, co tam vládne a jak jsou dvory šlechtou obsazeny a ozdobeny.
- typ: odstavec
  de: |-
    Weiter wil ich nit mehr daruon vermelden/ dann wol ist zusehen vnd zubefinden/ ob vns die alte Rüstung/ Knecht/ Pferdt vnd Harnisch zuhalten verderbt/ so wir die halten wie vor alters/ ob vns Sammet Seiden vnd solcher bracht verderbe/ vnd die Kauffleut reich machen.
  cs: |-
    Dále se o tom již nechci více rozepisovat, neboť lze snadno vidět a poznat, zda nás zničí držení staré výzbroje, knechtů, koní a zbroje {Harnisch}, budeme-li je držet jako za stara, anebo zda nás zničí samet, hedvábí a taková nádhera a obohatí kupce.
- typ: odstavec
  de: |-
    So hat es sich ein zeitlang zugetragen/ das mann hat Kriege gefürt/ die kein Ordnung noch Regiment haben leiden mögen/ das seind nicht rechte Kriege sonder entpörung vnnd auffruhr/ welche alle in der eil auffgebracht/ vnd so mann sie hat wöllen haben/ wie mann hat thůn mussen/ so hat mann jhnen allen jhren willen lassen müssen/ vnd thůn dardurch kein Kriegßordnung/ noch Regiment hat bei jnen gehalten werden mögen.
  cs: |-
    Po nějakou dobu se pak stávalo, že se vedly války, které nesnesly žádný řád ani kázeň {Regiment}. To nejsou pravé války, nýbrž pozdvižení a vzpoura {auffruhr}: všechen ten lid byl sebrán ve spěchu, a kdo ho chtěl mít – a musel ho mít –, musel mu ponechat všechnu jeho vůli a jednání, takže se u něj nemohl udržet ani válečný řád, ani kázeň.
- typ: odstavec
  de: |-
    Deßgleichen so hat mann gesehen jhre Rüstung/ wie sich so ein vngerüst mutwillig Volck/ mit vnter geschlagen hat/ das nur ein auffgeraufft Volck gewesen/ das keinem Herrn noch vom Adel vor Knecht haben dienen/ sonder jhre eigene Junckern sein wöllen/ daruon alle vnordnung komen/ aller gehorsam vnd Ordnung bei jnen nit gehalten werden mögen/ vnd dardurch alle gůte Kriegßordnung Regirung vnd Pollicei muß nidergehen/ vnd in ein schwermerei vnd Tirannei geraten/ vnd der Teutschen gůtes biß hergebrachts gerücht sich verlieren muste.
  cs: |-
    Stejně tak bylo vidět jejich výzbroj – jak se mezi ně vmísil takový nevyzbrojený, svévolný lid, pouhá sebranka, která nechtěla sloužit žádnému pánu ani šlechtici jako knecht, nýbrž chtěla být sama sobě pánem {Junckern}. Z toho vzešel všechen nepořádek, nemohla se u nich udržet žádná poslušnost ani řád, a tím musí upadnout všechen dobrý válečný řád, správa i veřejný řád {Pollicei} a zvrhnout se v třeštění a tyranii; a dobrá, dosud zachovávaná pověst Němců by se musela ztratit.
- typ: odstavec
  de: |-
    Darumb so ist der Teutschen Nation solches zu dem höchsten vor augen zunemen/ vnnd zubedencken/ das sie also jhr ehr/ wolhergebracht gerücht/ mit sampt der gůten Ordnung Kriegßampter vnd Regirung nit von jnen abkomen lassen wöllen/ sonder behalten/ vnd was sich also in vnordnung gestalt hat wider zu ruck stellen/ vnd die erste gůte Regirung vnd Ordnung wider herfür bringen vnd erheben/ so werden die Teutschen wider wie zuuor bei allen Nationen den vorzug haben vnd behalten/ wie allewegen gewest ist.
  cs: |-
    Proto si to má německý národ co nejvíce vzít k srdci a uvážit, aby nenechal od sebe odejít svou čest a dobrou zděděnou pověst spolu s dobrým řádem, válečnými úřady a správou, nýbrž si je zachoval; a co se zvrhlo v nepořádek, aby napravil a onu první dobrou správu a řád opět obnovil a pozdvihl. Pak budou Němci opět jako dříve mít a držet přednost před všemi národy, jak tomu bývalo vždy.
- typ: odstavec
  de: Derhalben so weiß Ewer Königliche Maiestat ich nicht anderst
  cs: Proto Vašemu královskému Veličenstvu neumím jinak
