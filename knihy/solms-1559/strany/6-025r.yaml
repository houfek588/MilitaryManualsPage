poznamky:
- n: 1
  text: |-
    Tisková chyba za 119 zl. (102 + 17); s touto částkou počítá i úhrn 299 zl. 13 bac. níže. Sama položka za vůz (17 zl.) je vyšší, než by dávalo 17 nocí po 12 bacenech (13 zl. 9 bac.).
- n: 2
  text: |-
    Přesmyčka číslic: oddíl má 15 + 11 + 11 = 37 koní (srov. přehlídkový rejstřík na [[6-020v|s. 6-020v]]).
- n: 3
  text: |-
