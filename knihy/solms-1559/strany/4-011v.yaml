  popis: |-
    Trojitá rozkládací dřevořezová tabule zobrazující vpravo čtyři hlavně v podélném řezu (označené „S“, „T“, „V“, „X“) s dlouhými záměrnými čarami vybíhajícími daleko doleva, zmenšeným desetistopým měřítkem a dole vlevo dělem na čtyřkolém podvozku taženým třemi muži za příčkové lano. Ryté německé nápisy znějí:
    – vlevo nahoře u měřítka: „Disse moßtab ist zehen schůe lanck“ / „Schůch vnd zol“ („Toto měřítko jest deset stop dlouhé“ / „stopy a palce“);
    – uprostřed vlevo: „Mit dissem veringten maßtab ist zů finden vnd zů messen wy dy linige vber vnd von einander jn die weite lauffen, vnd dye schoße voneinander kommen“ („Tímto zmenšeným měřítkem lze nalézt a změřit, jak se čáry do dálky kříží a rozbíhají a jak se od sebe odchylují výstřely“);
    – u hlavně S: „Gerade zů richten wann der kern vff einer seiten leydt“ („Jak zamířit rovně, leží-li jádro na jedné straně“);
    – u hlavně T: „Zů finden dye gerade der seyten“ („Jak nalézt střed boku“);
    – u hlavně V: „Bogen schůß zů finden“ („Jak stanovit obloukový výstřel“);
    – u hlavně X: „Diß ist verglichen hynden vnd forne von dem rechten kern zů schyessen“ („Toto jest vyrovnáno vzadu i vpředu ke střelbě z pravého jádra“).
