  de: |-
    ein spitzen haben/ durch solchen spitz sol ein loch biß in die Kugel gehn/ dasselbig soll eines Fingers weit sein/ doch alles inwendig gegen der Kugel je lenger je enger/ sölche Kugel soll mit gůtem Puluer biß an den halß/ vnd der halß mit einem gestossen feur zeug außgefült sein/ vnd mit einem holtz auff das aller hertest hinein geschlagen biß die Rörn gar vol wirdt/ derselbig zeug soll mit denen mitteln gemacht vnd probiert werden/ das einer die Kugel mög inn der handt anzinden/ vnnd also gemach brenne/ das sie nicht zu schwindt inwendig in das Puluer kom/ ehe dann einer sie von jm gewirfft/ vnd sie zu ligen kompt/ dann wann das feur kompt in die Kugel/ inn das röß Puluer/ so ist zůdencken/ das die zwei pfund Puluers die also verschlossen sind/ mit gewalt die Kugeln zersprengen/ mussen die stück von solcher Kugeln/ dieweil sie zweier finger dick sein/ vnder den leuten/ darunder sie fallen im schlagen grossen schaden thůn/ die Kugel wirt auch wie sie gemacht sein soll/ in ein figur auffgerissen werden.
  cs: |-
    vybíhat ve špičku; skrz tuto špičku má vést otvor až dovnitř do koule {Kugel}, široký na jeden prst, avšak směrem dovnitř do koule stále užší. Taková koule má být až po hrdlo naplněna dobrým střelným prachem {Puluer} a hrdlo utlučenou zápalnou hmotou, kterou je třeba dřevem co nejpevněji natlouct, dokud není trubička zcela plná. Tato hmota má být zhotovena a vyzkoušena tak, aby bylo možno kouli zapálit v ruce a hořela tak zvolna, aby oheň nepronikl příliš rychle dovnitř ke střelnému prachu dříve, než ji člověk odhodí a než koule dopadne; neboť když oheň vnikne do koule k prudkému prachu, lze si představit, že ty dvě libry {pfund} prachu takto uzavřené kouli prudce roztrhnou, a úlomky takové koule, poněvadž jsou tlusté na dva prsty, způsobí při dopadu a výbuchu mezi lidmi velikou škodu. Jak má být koule zhotovena, bude rovněž vyobrazeno na nákresu.
- typ: nadpis
  uroven: 3
  de: Ein Bechring zumachen.
  cs: Jak zhotovit smolný věnec {Bechring}.
- typ: odstavec
  de: |-
    ITem Bechring die mann im stürmen auß wirfft/ sollen diser gestalt gemacht werden/ Mann soll nemen ein Eisern oder Kupfern drat/ vnnd den zwifach zůsamen drähen/ das er also zůsamen gedrät eines kleinen strohlams dick sei damit er sich biegen kön/ vnd als dann so soll mann machen ein leines secklein/ wie ein würstlein/ das eines fingers dick vnd lang sei/ soll dasselbig also ringßrum vmb den drat winden/ so lang der drat ist/ vnd so ein secklein nit reicht/ vnd sein ende hat/ soll mann mit einem andern widerumb anheben/ biß so lang das es gar rumb reicht/ vnd soll im winden alweg ein schnürlin zwischen die secklin von hanff/ das vier strohalmen dick ist/ mit gewunden werden/ damit die Secklin nicht wider einander rörn/ vnd als dann soll mann flax oder hanff nemen/ den auß einander ziehen/ also zwischen die secklin wider ringßrumb ein gelegt vnnd gebunden/ daß garnahe den secklin gleich hoch sei/ alßdan soll solcher Ring halb inn Schwefel vnd halb inn Hartz oder Bech gedäfft werden/ vnd nach solcher däff soll er widerumb mit einem Flax oder Hanff vber vnd vber bezogen vnd gebunden/ darnach mit einem starcken fadem zweimal widerumb vber den Flax vnnd Hanff bunden oder gewunden werden/ vnd dann widerumb in der vorigen däff oder schwemb gedäfft vnd verglichen/ Wann mann disen Ring werffen will/ soll mann an einem ort drei oder vier löcher hindurch stechen/ das es die secklin mit dem zeug erreicht/ dieselbigen anzünden/ wann sie brennen/ als dann werffen.
  cs: |-
    Dále: smolné věnce, které se vrhají při útoku {stürmen}, mají být zhotoveny tímto způsobem: má se vzít železný nebo měděný drát a dvojitě jej skroutit dohromady, aby takto zkroucený byl silný jako tenké stéblo slámy,[^1] tak aby se dal ohýbat. Potom se má udělat plátěný váček jako jitrnička, silný a dlouhý na jeden prst, a ten se má omotat dokola kolem drátu po celé jeho délce; a nestačí-li jeden váček a dojde ke konci, má se navázat dalším, dokud to neobejde celý kruh. Při omotávání se má vždy mezi váčky vplétat konopná šňůrka o tloušťce čtyř stébel slámy, aby se váčky navzájem nedotýkaly. Potom se má vzít len nebo konopí, rozčechrat je, vložit je opět dokola mezi váčky a svázat tak, aby sahalo téměř do výše váčků; potom se má takový věnec namočit do zápalné lázně {gedäfft} z poloviny ze síry a z poloviny z pryskyřice či smůly. Po takovém namočení má být znovu všude dokola potažen a svázán lnem či konopím, načež se má dvakrát ovinout či ovázat silnou nití přes ten len a konopí a poté znovu v předešlé lázni či máčení namočit a srovnat. Když se má věnec vrhnout, má se na jednom místě propíchnout třemi či čtyřmi otvory až k váčkům se směsí, ty zapálit, a když hoří, tehdy vrhnout.
