overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Es sind auch Befestung die ein grosse weitte haben/ vnd gar zu keinem vortheil/ sonder zu vilen Wehren gemacht/ vnd nit darauff gericht daß mann etwan Volck dardurch ersparn oder ringern kündte/ dann allein auff die menge vnd gewalt des Volcks/ das sind schwere vnd sorgliche Besatzung/ vnd geht ein grosser vnkosten vnd sorg darauff solches volck zu regieren vnd zu vnderhalten. Aber wie dem so sind solche Befestung nicht gůt zu belegern/ dann ob sie schon zu dem Sturm geschossen werden/ so ist doch ein grosse menge schwerlich zu stürmen/ dann mann stürmen vnd schlagen muß/ wann dann souil Volck in einer solchen Besatzung ligt/ die künden vil vnnd grosse arbeit mit bawen thůn/ vnd sich inn stende vergraben daß sie für dem schiessen einen sichern standt haben/ vnd in jrem vortheil stehen vnd sich wehren künden.
  cs: |-
    Jsou také pevnosti {Befestung}, které mají velký obvod a nejsou postaveny nijak výhodně, nýbrž s mnoha obrannými místy {Wehren}. Nejsou zařízeny tak, aby se díky nim dalo ušetřit nebo snížit počet lidu, nýbrž spoléhají jen na množství a sílu lidu. To jsou těžké a starostné posádky {Besatzung}; spravovat a vydržovat takový lid stojí velký náklad a mnoho starostí. Ať je tomu však jakkoli, takové pevnosti se špatně obléhají. I když se do nich prostřílí průlom k útoku {Sturm}, na velké množství [obránců] se útočí těžko, protože se musí útočit a bojovat. Leží-li totiž v takové posádce tolik lidu, mohou vykonat mnoho rozsáhlých stavebních prací a zakopat se v postaveních {stende} tak, aby měli před střelbou bezpečné stanoviště, drželi se ve výhodném postavení a mohli se bránit.
- typ: odstavec
  de: |-
    Weitter ist auff ein solche grosse Befestung allzeit hieauß vor außfelle sorg zuhaben/ vnd sich auch zubesorgen daß ein Kriegßuolck sich versamel vnd die im Leger vnderstehe anzugreiffen/ vnd die inn der Besatzung dann herauß fallen/ vnd die im Leger vnd Schantzen auch angreiffen/ wie wol geschehen ist. Deßgleichen wann mann sie speisen wolt/ so künden sie auch einn außfal thůn die Prouiant zu erlangen/ vnd dergleichen sind die grosse Besatzung gůt/ were sie mit gelt vnd Prouiant erhalten kan/ aber es geht schwerlich zů.
  cs: |-
    Dále se u tak velké pevnosti musí [obléhatel] zde venku vždy mít na pozoru před výpady a obávat se také toho, že se shromáždí [nějaký] válečný lid {Kriegßuolck} a pokusí se napadnout ty, kdo leží v ležení {Leger}, a že ti z posádky pak vyrazí ven a napadnou rovněž ležení a šance {Schantzen}, jak se už stalo. Stejně tak, když by je chtěl někdo zásobit, mohou rovněž učinit výpad, aby proviant {Prouiant} získali. Takové velké posádky jsou dobré pro toho, kdo je dokáže udržet penězi a proviantem; jde to však těžko.
- typ: odstavec
  de: |-
    Aber wie dem allem/ es sei ein Besatzung groß oder klein/ so wils ein grosse sorg vnd fürsichtigkeit mit gůter Ordnung vnd Regierung haben. Es sagen die Alten daruon/ wann ein Herr seine Befestung besetzen wil/ soll er nit einer Nation volck nemen/ haben darauff dise meinung/ daß mann ein Besatzung die ein Jar in stettiger besatzung soll gehalten werden/ mit zwei/ drei oder vierlei Nation besetze/ oder auffs wenigst mit zweien Nationen/ Auß disen vrsachen/ wann mann ein Besatzung mit einer Nation volck besetzt/ so künden sie sich einer meutterei mit einander vergleichen/ das zwo oder mehr Nationen nit thůn/ dann sie sind nit so einig/ vnd vertrawet keine der andern/ sonder es wil ein jede der best vnd fürnembst sein/ vnd leben gemeiglich parteysch/ vnd wann ein theil vom andern etwas innen würde/ so were es jnen ein freude/ daß sie den andern vngnad vnnd vnglück machen künden/ vnd sich vnd jre sachen damit erheben möchten/ daß also allezeit ein Part von der andern in sorgen ligt/ vnd jegliche jre sachen vor der andern am besten versehen wolt.
  cs: |-
    Ať je však posádka velká nebo malá, vyžaduje velkou péči a prozíravost spolu s dobrým pořádkem a správou. Staří o tom říkají, že když chce pán obsadit svou pevnost, nemá brát lid jednoho národa. Jsou totiž toho mínění, že posádku, která má být po celý rok trvale držena, je třeba obsadit lidem dvou, tří nebo čtyř národů, anebo přinejmenším dvou národů. A to z těchto důvodů: obsadí-li se posádka lidem jednoho národa, mohou se mezi sebou domluvit ke vzpouře {meutterei}. To dva nebo více národů neudělají, protože nejsou tak svorní a jeden druhému nedůvěřuje; každý chce být nejlepší a nejpřednější a obvykle žijí ve straníctví. Kdyby se jedna strana o druhé něco dozvěděla, měla by radost, že může té druhé způsobit nemilost a neštěstí a sebe i své věci tím povznést. Tak se vždy jedna strana obává druhé a každá chce své věci obstarat lépe než ta druhá.
- typ: odstavec
  de: |-
    Zum andern sagen vnd raten die Alten auch/ daß kein Herr sein Befestung mit seinem Landtuolck besetzen sol/ vnd geben dem dise
  cs: |-
    Za druhé říkají a radí staří také, že žádný pán nemá obsazovat svou pevnost svým zemským lidem {Landtuolck}, a uvádějí pro to tyto
