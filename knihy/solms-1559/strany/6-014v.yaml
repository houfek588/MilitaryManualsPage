poznamky:
- n: 1
  text: Má být 11 koní (11 × 6 dní × 6 bacenů = 26 zl. 6 bac.); s tím souhlasí i součet strany 26 koní.
- n: 2
  text: U položek 12 a 13 tištěné částky s výpočtem nesouhlasí (7 × 4 × 6 bacenů = 11 zl. 3 bac.; 5 × 8 × 6 bacenů = 16 zl.) a suma položky 13 (18 zl.) neodpovídá ani tištěným 19 + 6 zl. Leo (Leonhart) von Löwenstein a Rubrecht von Mörlen sdílejí jeden vůz.
