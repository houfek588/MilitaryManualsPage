poznamky:
- n: 1
  text: |-
    Pokračování rejstříku Andrese Pflůga, v pořadí čtení (levý sloupec, pak pravý). Tento součet strany shrnuje oddíly 9–14 (z [[6-008r|předchozí strany]] a oddíl 14 zde). Podle jednotlivých položek, jak je čteme ze skenu, by vycházelo 51 zbrojných a 4½ trénního koně místo vytištěných 52 a 3½; celkové součty na [[6-009r|listu 9r]] však počítají s vytištěnými hodnotami, takže chyba je nejspíš v některé položce. Další součty strany (51, 54, 46) s položkami souhlasí. Jména osob jsou ponechána v podobě tisku.
