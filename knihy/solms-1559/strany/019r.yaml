bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    lermen schlahen / sonder sein Kriegsuolck still auffwecken / vnd alle feur im Leger gar außlöschen / auch die Wacht zu rings vmbs leger wol versehen lassen / vnd er gantz stil mit allen seinen geordneten hauffen beim Geschütz stehn vnd haben / so mag er vil desto baß hören / auch gegen hohem liecht sehn / an welchen enden die Feind erstlich in das Leger fallen wöllen / wo es dann die notturfft erfordert / daselbst muß er sich wehren / vnnd ist hierinn aber kein weitter Regel fürzugeben / Das ist aber die warheit / finden die jenigen / so vberfallen wöllen / jre Feind / wie jetzund daruon geredt / so müssen sie mit vnordnung dise inn jhrer Ordnung vnnd grossem vortheil angreiffen / odder mit grosser gefehrligkeit abziehen / oder gar flüchtig werden.
  cs: |-
    bít na poplach {lermen}, nýbrž má svůj válečný lid {Kriegsuolck} tiše probudit, dát v ležení {Leger} úplně uhasit všechny ohně, nechat také dobře obsadit stráž {Wacht} kolem dokola celého ležení a sám zůstat zcela tiše stát a držet se se všemi svými seřazenými houfy {hauffen} při dělech {Geschütz}. Tak bude moci mnohem lépe naslouchat a proti jasnému obzoru vidět, na kterých místech chtějí nepřátelé nejdříve vpadnout do ležení; a kde to bude potřeba, tam se musí bránit – víc pravidel k tomu dát nelze. Je však pravda, že najdou-li ti, kdo chtějí přepadnout, své nepřátele tak připravené, jak právě řečeno, musejí v nepořádku útočit na ty, kteří stojí ve svém šiku a ve velké výhodě, anebo s velikým nebezpečím odtáhnout či se rovnou obrátit na útěk.
- typ: odstavec
  de: |-
    Welcher Oberster ein Schloß / Stat odder Flecken belegern wil wann er dargegen zeucht / soll inn gůter Ordnung vnd gewarsam / vnd eines tags nicht weit ziehen / er hett dann kundtschafft daß der Fleck nicht wol besetzt were / vnd ein Kriegsuolck in die Besatzung ziehen / darzů ob mann Prouiant in den Flecken füren wolt / wo er das innen wirt / vnd es on gefehrligkeit seines Kriegsuolck wehren kan / soll er tag vnd nacht ziehen / damit er die Leut / Geschütz / vnd Prouiant erlege / vnd hindersich treibe / solliche Handlungen geberen inn den Besatzungen schedlichen nachtheil / auch etwan grossen schrecken / dardurch dann die Flecken vil desto fürderlicher erobert werden.
  cs: |-
    Který plukovník {Oberster} chce obléhat hrad, město nebo městečko, má při tažení proti nim táhnout v dobrém pořádku a ostražitě a nekonat v jednom dni dlouhé pochody, ledaže by měl zprávu, že městečko není dobře obsazeno a že do posádky {Besatzung} táhne nějaký válečný lid, anebo že chtějí do městečka dovézt proviant {Prouiant}: jakmile se to dozví a může-li tomu bez nebezpečí pro svůj válečný lid zabránit, má táhnout dnem i nocí, aby lidi, děla i proviant přemohl a zahnal zpět. Takové činy přinášejí posádkám škodlivou újmu a nezřídka i veliké zděšení, čímž pak bývají městečka dobyta mnohem rychleji.
- typ: odstavec
  de: |-
    Den tag wann sich ein Oberster für einen Flecken schlahen wil / soll er das nechst Leger nicht weit von demselben Flecken haben / vnd am morgen frü auff sein / alle hauffen zu roß vnd fuß geschicklich in zug ordnen / vnnd alßdann einen Herolt mit einem Trommeter / oder wenn er keinen Herolt hat / einen Trommeter allein den Flecken auffzufordern / schicken / vnnd den Flecken seines gefallens in gemeyn / oder in Gnad vnd vngnad auff fordern lassen.
  cs: |-
    V den, kdy se plukovník chce položit před městečko, má mít nejbližší ležení nedaleko od téhož městečka a časně zrána vstát, obratně seřadit všechny houfy jízdy i pěchoty k pochodu a poté poslat herolda {Herolt} s trubačem {Trommeter}, nebo nemá-li herolda, samotného trubače, aby městečko vyzval ke vzdání, a dát je podle své vůle vyzvat buď na obecné podmínky, anebo na milost a nemilost.
- typ: odstavec
  de: |-
    Vnd wann die beide / odder Trommeter allein / zimlich nahe für den Flecken kommen / soll der Trommeter (wie sich gebürt) blasen / damit sie inn der Besatzung nicht schiessen / vnnd den obersten Hauptman in der Besatzung mit jhm sprach zuhalten / begeren / so dann der Hauptman bei jhm erscheinet / odder einen ander an seine statt schickt / soll er anzeigen / sein Oberster den er mit namen soll nennen / hab jn (Trommeter odder Herolt) zu jhm dem Hauptman gesendet / das er dem Obersten / im namen seines Königs oder Kriegsfürsten den Flecken (wie er dann beuelch hat) ein vnd vber geben wölle / wo nicht / sei der Oberst dannoch den zubekommen willens.
  cs: |-
    A když oba – anebo trubač sám – dojedou dosti blízko před městečko, má trubač (jak se sluší) zatroubit, aby v posádce nestříleli, a žádat vrchního hejtmana {Hauptman} v posádce o rozhovor. Když se pak hejtman u něj objeví nebo místo sebe pošle někoho jiného, má mu oznámit, že jeho plukovník, jehož má jmenovat jménem, jej (trubače či herolda) k němu, hejtmanovi, poslal, aby plukovníkovi jménem jeho krále nebo válečného knížete {Kriegsfürsten} městečko (jak má rozkaz) postoupil a vydal; pakli ne, je plukovník přesto odhodlán je získat.
- typ: odstavec
  de: Weil dann der Hauptman im Flecken / denselbigen dem
  cs: Poněvadž tedy hejtman v městečku je nehodlá
