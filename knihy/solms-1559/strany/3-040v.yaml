bloky:
- typ: nadpis
  uroven: 3
  de: Ein ander Feur.
  cs: Jiný oheň.
- typ: odstavec
  de: |-
    NIm lebendigen Schwefel/ Tartarem/ Socytatella Albi Sarta/ Ollam Collofemiam/ Salutter vnd gemein öle mit Petroleo/ das alles gleich zusamen geknischt vnd gewermet/ darnach zindt dasselbig an/ erlescht nit ob schon ein Platzregen keme/ wann du aber die Materien von dem werck wider scheiden wilt/ muß das durch ein Distillier ofen oder glaß genommen werden.
  cs: |-
    Vezmi živou síru, vinný kámen (*Tartarem*),[^1] bílou sůl či pryskyřici (*Socytatella Albi Sarta*), kalafunu {Ollam Collofemiam}, ledek {Salutter} a obyčejný olej s petrolejem (*Petroleo*); to vše stejně roztluč dohromady a zahřej, potom to zapal – nezhasne to, ani kdyby přišel liják. Chceš-li však jednotlivé látky ze směsi opět oddělit, musí se to provést přes destilační pec nebo nádobu.
- typ: nadpis
  uroven: 3
  de: Ein ander Feur.
  cs: Jiný oheň.
- typ: odstavec
  de: |-
    NIm Schwefel vnd Griechisch Bech/ Aspaltum vnd Terpentin/ auch Napam Citrinam/ daruon distillier ein öle gantz heiß/ darnach behalt das in einem glesern geschirr.
  cs: |-
    Vezmi síru a řeckou smůlu, asfalt (*Aspaltum*) a terpentýn, a také žlutou naftu (*Napam Citrinam*);[^2] z toho vydestiluj zprudka horký olej a pak jej uchovej ve skleněné nádobě.
- typ: nadpis
  uroven: 3
  de: |-
    Feur zumachen das sich anzindet von Regen/ vnd wann es schon regnet erleschts nit.
  cs: Jak udělat oheň, který se vznítí od deště, a i když prší, nezhasne.
- typ: odstavec
  de: |-
    NIm ein stein vngeleschtes Kalchs einer zimlicher grösse/ darinn mach ein loch/ thů dann Terpentin mit lebendigem Schwefel zugericht darinn/ mach darnach das loch zů mit einem anderen vngeleschten Kalch/ vnd setz jn in ein hafen oder ander geschirr in regen/ so wirst du erfarn daß das Feur vom Regen nit außgelescht/ sonder erzindt wirt.
  cs: |-
    Vezmi kus nehašeného vápna slušné velikosti, udělej do něj důlek, vlož do něj terpentýn připravený s živou sírou, potom otvor uzavři dalším nehašeným vápnem a postav jej v hrnci či jiné nádobě na déšť – tak poznáš, že se oheň deštěm neuhasí, nýbrž rozhoří.
- typ: nadpis
  uroven: 3
  de: |-
    Hie merck wie du ein höflichs vnd köstlichs Liecht machen solt/ das zu werffen ist für ein Festung/ daß mann in keinen weg leschen kan.
  cs: |-
    Zde si všimni, jak máš udělat znamenité a vzácné světlo, jež se vrhá před pevnost {Festung}, které nelze nijak uhasit.
- typ: odstavec
  de: |-
    SO man vor dir ligt/ es sei vor einer Festung oder Stat/ vnd deine feind zu nahe an die maur rüsten oder giengen/ so nim ein wenig spißglaß/ 2. pfundt hartz/ 3. Schwefel/ 1. Salpeter/ vnd 2. koln/ mach darauß 60. oder 70. kugeln/ vnd knet das wol mit werck zusamen/ wann du sein bedarffts so zindt ein kugel an vnd werff sie hinauß/ die brennt gar klar vnd lang/ gibt gůt liecht/ wann du dann merckest das deine Feind herzů komen oder gehn so werff wol verwart.
  cs: |-
    Leží-li někdo před tebou, ať před pevností nebo před městem, a tvoji nepřátelé se chystají nebo přibližují příliš blízko ke hradbě, vezmi trochu antimonu (*spißglaß*),[^3] 2 libry {pfundt} pryskyřice, 3 síry, 1 ledku {Salpeter} a 2 uhlí, nadělej z toho 60 nebo 70 koulí {kugeln} a dobře to uhněť dohromady s koudelí. Až to budeš potřebovat,[^4] zapal jednu kouli a hoď ji ven – hoří velmi jasně a dlouho a vydává dobré světlo; když pak zpozoruješ, že tvoji nepřátelé přicházejí nebo jdou blíž, vrhej z dobrého krytu.
- typ: nadpis
  uroven: 3
  de: |-
    Wie mann ein Feur machen sol/ das mann ein halben oder gantzen tag vnd nacht tragen vnd füren/ daß er ein Liecht mit einem Schwefel kertzlin anzinden kan/ wann er kompt an die statt da er Feur haben muß.
  cs: |-
    Jak udělat oheň, jejž lze nosit a vézt půl nebo celý den i noc, aby si člověk mohl zapálit světlo sirnou svíčkou, až přijde na místo, kde potřebuje mít oheň.
poznamky:
- n: 1
  text: |-
    Zkomolené názvy středolatinské předlohy – *Tartarem* (vinný kámen), *Socytatella Albi Sarta* (patrně z *sarcocolla alba* či *sal*), *Ollam Collofemiam* (kalafuna v nádobě / olej z kalafuny, v tisku s nosovkou *Ollā*), *Salutter* (ledek, *sal nitri*).
- n: 2
  text: '*Napam Citrinam* – žlutá nafta (*naphtha citrina*).'
- n: 3
  text: |-
    *Spißglaß* – dobové označení pro leštěnec antimonový (antimonit, staročesky špižglas).
- n: 4
  text: V tisku přesmyčka *bedarffts* místo *bedarffst* („potřebuješ“).
