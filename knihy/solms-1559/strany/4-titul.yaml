id: 4-titul
list: titulní list (4. kniha)
strana: recto
sken: 387
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: nadpis
  uroven: 1
  de: |-
    Das vierdte Bůch/
    Zeigt an die Sorten/ Gattungen oder arten etlicher stück Büchsen groß vnd klein/ mit sampt jren arten vnd Maniern der gefeß.
  cs: |-
    Čtvrtá kniha.
    Ukazuje druhy, ráže neboli způsoby některých kusů děl {Büchsen}, velkých i malých, spolu s jejich druhy a způsoby lafet {gefeß}.
- typ: odstavec
  de: |-
    Deßgleichen von allerlei Figurn vnd Instrumenten so zu dem Geschütz vnd Artolorei gehört/ wie hieuorn im dritten Bůch der Artolorei vil meldung daruon geschicht.
  cs: |-
    Rovněž o všelijakých vyobrazeních a nástrojích, které patří k dělům {Geschütz} a dělostřelectvu {Artolorei}, jak se o nich již dříve mnoho zmiňuje Třetí kniha o dělostřelectvu.[^1]
- typ: obrazek
  soubor: drevorez-387.jpg
  popis: |-
    Dřevořez císařského znaku Karla V. (z téhož štočku jako na titulních listech předchozích knih): uprostřed korunovaný štít s dvouhlavým říšským orlem a habsbursko-španělským srdečním štítkem, obklopený řetězem řádu Zlatého rouna. Po stranách stojí dva korunované Herkulovy sloupy přidržované dvěma okřídlenými putti a ovinuté nápisovou stuhou s císařským heslem „PLVS. – VLTRE“.
- typ: odstavec
  de: Anno Domini/ 1559.
  cs: Léta Páně 1559.
poznamky:
- n: 1
  text: |-
    V dochovaném mnichovském exempláři BSB (`Rar. 986`, `bsb00085168`) scházejí úvodní složky `A` a `B` (položky 1–11); bezprostředně za nepotištěným rubem titulního listu (sken 388) následuje složka `C` začínající dvanáctým kusem (list `4-001r`, sken 389).
