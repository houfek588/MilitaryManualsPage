bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    hauffen bei einander ordenen will/ vnnd die hauffen nach seinem gefallen/ vnd wie sie sollen/ machen/ Also mag ein Herr den Reyssigen auch thůn/ vnd wann dann die hauffen alle also inn der rechten grossen Schlachtordenung stehn vnnd halten/ so sollen dann dieselbigen hauffen/ alle vnd ein jeder besonder/ wider gliedsweiß abgezelt vnnd auffgezeychnet werden wie vor/ So kan mann dann sehen/ wie sichs mit einander zutregt/ vnd zu allerzeit mercken/ wann Ordenung gemacht werden/ was abgehet vnnd weniger wirt.
  cs: |-
    houfu {hauffen} pohromadě, a tak utvořit houfy podle své libosti a tak, jak mají být. Totéž může pán učinit i u jízdy {Reyssigen}. A když pak všechny houfy takto stojí a drží v řádném velkém bitevním šiku {Schlachtordenung}, mají být všechny ty houfy, každý zvlášť, znovu spočítány po řadách {gliedsweiß} a zapsány jako předtím. Tak lze vidět, jak to spolu vychází, a kdykoli se staví šik, vždy zjistit, co ubylo a o kolik je mužů méně.
- typ: odstavec
  de: |-
    Es solle auch der Oberst die Knecht alle zusamen nemen/ vnd in gemeyn anzeigen/ wie jhr Artickelsbrieff außweyßt/ daß kein Knecht auß dem Feld odder Leger one seines Obersten Paßporten ziehen soll/ vnd würde einer darüber one seines Obersten Paßporten auß dem Feld oder Leger ziehen/ so soll er auffgeschrieben/ vnd fort wie ein dreuloser/ feldflüchtiger gehalten/ vnnd vnder kein auffrichtiges Fendlin nicht mehr genommen werden/ vnnd der ehrlichen mannlichen Knecht so bleiben/ vnd sich jhres eyds halten/ müssig gehen/ vnnd nicht weitter sich mit jn gesellen noch gemeinschafft haben/ in alle weg.
  cs: |-
    Plukovník {Oberst} má také svolat všechny knechty {Knecht} dohromady a veřejně jim oznámit, jak praví jejich artikulní list {Artickelsbrieff}, že žádný knecht nesmí odejít z pole ani z ležení {Leger} bez průvodního listu {Paßporten} svého plukovníka. Kdyby přesto někdo bez průvodního listu svého plukovníka z pole nebo z ležení odešel, má být zapsán a nadále pokládán za věrolomného zběha. Nesmí už být přijat pod žádný počestný praporec {Fendlin} a čestní a stateční knechti, kteří zůstávají a drží se své přísahy {eyds}, se mu mají vyhýbat a v žádném případě se s ním už nedružit ani nestýkat.
- typ: odstavec
  de: |-
    Auch so wölle er jhn nicht bergen/ daß die Römische Keyserliche Maiestat/ oder der Kriegsherr/ bestallung auff allen Passen vnd vmb das Leger gethan habe/ Wo derhalben ein Knecht vor dem Leger/ odder auff den Passen begrieffen wirdt/ derselbig soll preyß sein/ vnnd erstochen werden. Derhalben so wölle er sie alle trewlich gewarnet haben/ daß sie jhr ehr bedencken wöllen/ vnd sich vor sollicher straff vnnd schand verhůten/ wie ehrlichen Kriegsleuten zusteht vnd gebürt.
  cs: |-
    Také jim nemá zatajit, že Jeho římské císařské Veličenstvo či válečný pán {Kriegsherr} dal rozestavit stráže na všech průchodech {Passen} a kolem ležení. Bude-li tedy některý knecht zastižen před ležením nebo na průchodech, bude vydán v plen[^1] a proboden. Proto je všechny věrně varuje, aby pamatovali na svou čest a varovali se takového trestu a hanby, jak poctivým válečníkům {Kriegsleuten} přísluší a sluší.
- typ: odstavec
  de: |-
    Damit dann der Oberst des abgangs zu allerzeit wissens haben möge/ soll er mit seinen Hauptleuten dise Ordenung fürnemen vnnd halten/ der gestalt/ das ein jeder Hauptman seine Rotmeister neme/ vnnd lasse jhm seine Rotgesellen auffschreiben mit jhren namen/ vnd woher ein jeder seie/ Vnnd das ein jeder Rotmeister bei seinem eyde vnnd pflichten/ zu allerzeit wann jhm ein Knecht auß seiner Rot abgienge/ er werde erstochen/ odder ob er selbst sterbe/ gefangen/ verloren/ odder wie das zugehen möge/ dem hauptman anzeigen/ vnd so dann der Rotmeister selbst abgehn würde/ so sollen seine gesellen das anzeigen/ oder jrer newer Rotmeister/ den sie an die stat machen werden/ So das dann also geschicht/ sol der Oberst alle wochen von eim jeden Hauptman dessen gůten bericht
  cs: |-
    Aby pak plukovník věděl o úbytku [mužstva] v každou dobu, má se svými hejtmany {Hauptleuten} zavést a zachovávat tento pořádek: každý hejtman si vezme své rotmistry {Rotmeister} a dá si sepsat jejich rotní druhy {Rotgesellen} se jmény a s tím, odkud kdo pochází. Každý rotmistr pak má při své přísaze a povinnostech {pflichten} hejtmanovi oznámit, kdykoli mu z jeho roty {Rot} ubude nějaký knecht, ať je proboden, sám zemře, je zajat, ztratí se či ubude jakkoli jinak. Kdyby ubyl sám rotmistr, mají to oznámit jeho druhové nebo jejich nový rotmistr, kterého si ustanoví na jeho místo. Děje-li se to tak, má plukovník každý týden od každého hejtmana dostat o tom dobrou zprávu
poznamky:
- n: 1
  text: |-
    Dobové *preyß sein* znamená být prohlášen za psance mimo ochranu práva, volně k zabití či oloupení.
