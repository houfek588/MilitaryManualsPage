bloky:
- typ: odstavec
  de: |-
    Zu probiern allen gestossenen zeug oder füllung/ wie mann daß nent/ der in die seck gehöret/ vnd zu dem feurwerck daran zusehen ist/ ob er zu bald oder langsam brennet/ es sei inn secken oder in den langen secklein/ wie die wurst/ oder inn der Rörn/ so laß dir machen ein Eisene Rörn einer spannen lang/ vnnd inwendig eines Fingers weit/ in dieselbige fül den gemachten zeug/ zindt jhn an/ vnd laß brennen/ daran hastu zusehen sein art ob er zuschwindt oder zulangsam brenn/ vnnd ob er auch darein außgehe/ darnach kanstu dich richten in alweg auff alle proben vnd werck/ dann gestossener zeug der in groß vnd kleine seck gehört/ die nit im wasser brennen sollen/ bedörffen nit so starck gesetzt sein/ dieweil sie in secken nit auff einander geschlagen sind/ denselbigen zeug magstu in die eisen Rörn füllen/ gleicher gestalt wie er in die seck gefült ist/ vnd des wie obgeschriben/ sein prob nemen/ das er dir gerecht ist/ vnd nit in der Rörn außgeht.
  cs: |-
    Ke zkoušení veškeré utlučené směsi neboli náplně, jak se jí říká, která patří do pytlů a k ohňostroji {feurwerck}, aby se na ní poznalo, zda hoří příliš rychle nebo pomalu – ať už v pytlích, nebo v dlouhých váčcích jako jitrnička, nebo v trubičce – nech si zhotovit železnou trubici dlouhou jednu píď a uvnitř širokou na jeden prst. Do ní nasyp připravenou směs, zapal ji a nech hořet; na tom uvidíš její povahu, zda hoří příliš prudce nebo příliš pomalu a zda v ní také nezhasíná. Podle toho se můžeš v každém ohledu řídit při všech zkouškách i pracích; neboť utlučená směs určená do velkých i malých pytlů, které nemají hořet ve vodě, nemusí být sestavena tak silně, poněvadž v pytlích není do sebe udusána – takovou směs můžeš nasypat do železné trubice stejně, jako je nasypána do pytlů, a provést s ní zkoušku, jak výše popsáno, aby ti byla vyhovující a v trubici nezhasla.
- typ: nadpis
  uroven: 3
  de: |-
    Aber ein ander zeug.
  cs: |-
    Jiná směs.
- typ: odstavec
  de: |-
    DEr im wasser brennen soll muß geschwindt gesetzt sein/ denselbigen soltu also versuchen/ füll die Rör damit vol/ trückts fein hart auff einander mit einem holtz/ zindt dann die Rör an/ vnd werff sie in ein schaff mit wasser/ brent sie dann in dem wasser auß so ist der zeug gerecht/ geht er aber im wasser auß so ist er schwach/ so mach jn stärcker vnd stopffs alweg mit dem holtz fest in die Rör auff einander/ zündts wider an/ vnd werffs in das wasser gleicher gestalt wie vor/ brent er dann auß so ist er gerecht.
  cs: |-
    Ta, která má hořet ve vodě, musí být sestavena prudce; tu máš zkoušet takto: naplň jí trubici do plna, pěkně ji pevně dřevem udusávej na sebe, pak trubici zapal a hoď ji do díže s vodou. Vyhoří-li ve vodě až do konce, je směs správná; zhasne-li však ve vodě, je slabá – tedy ji učiň silnější, opět ji dřevem pevně nacpi do trubice, znovu zapal a hoď do vody stejným způsobem jako prve; vyhoří-li pak, je správná.
- typ: nadpis
  uroven: 3
  de: |-
    Ein anders.
  cs: |-
    Jiné.
- typ: odstavec
  de: |-
    NIm zeug der zu den hollen Kugeln gehört/ die mit rössem Puluer außgefült sein/ der langsam in der rörn brennen vnd doch nicht auß gehn/ derselbig zeug soll etwan eines daumen hoch auff einmal in die Rörn gethan/ vnd mit einem runden holtz/ das geradt in die Rörn geht/ mit einem hamer fest auff einander geschlagen werden/ vnd dann wider eines daumen hoch gefült/ vnd geschlagen wie vor/ vnd also für vnd für biß die rörn vol wirt/ dann zindt sie an/ laß brennen/ so wirstu sehen ob der zeug außbrenn/ vnd wie lang/ so hastu dann an dem maß der rörn leng nach zurechnen/ wie lang du ein Rörn machen solt in ein feurkugel/ damit sie nit hindersich außbrenn in der zeit/ dieweil sie in der lufft ist/ vnd noch nit ligt/ darnach so ordne vnd mach deine rörn kurtz oder lang/ wie sich daß erfordert/ deßgleichen den
  cs: |-
    Vezmi směs, která patří k dutým koulím {Kugeln} naplněným prudkým střelným prachem {Puluer}, aby hořela v trubičce pomalu, a přece nezhasla; této směsi se má vždy vložit do trubičky najednou na výšku jednoho palce a kulatým dřevem, jež přesně pasuje do trubičky, se má kladivem pevně sbít k sobě, a pak zase naplnit na výšku palce a sbít jako prve, a tak stále dál, dokud není trubice plná. Pak ji zapal a nech hořet; tak uvidíš, zda směs vyhoří a jak dlouho, a podle míry délky trubice si pak můžeš spočítat, jak dlouhou máš udělat trubičku do ohnivé koule {feurkugel}, aby neprohořela dozadu v čase, dokud je ve vzduchu a ještě nedopadla. Podle toho si pak zařiď a udělej trubičky krátké či dlouhé, jak toho bude třeba, a stejně tak
