    Celostránkový alegoricko-teologický dřevořez proti rouhání Bohu (dole vlevo signováno „SEBASTIAN . H.“), ilustrující výklad na předchozím i [[1-018r|následujícím listu]]: v nebeské sféře uprostřed oblaků se vznáší Trojice v ikonografickém typu Trůnu milosti (Gnadenstuhl) – nahoře holubice Ducha svatého v paprsčité svatozáři, pod ní Bůh Otec v papežské tiáře a plášti držící kříž s ukřižovaným Kristem. Po stranách v mracích poletují okřídlení andílci a pod nebesy dvě hlavy větrů (živly); vlevo od Trojice se vznášejí Kristovy uťaté ruce, probodené srdce a probodené nohy, vpravo kalich s hostií nesoucí křížek. V dolní pozemské krajině s hořícím městem, šarvátkou vojáků u řeky a plachetnicí na moři sedí vpravo na břehu žoldnéř se svisle opřenou ručnicí, z jehož otevřených úst šlehají desítky ostrých paprsků kleteb, probodávajících Trojici, Kristovy rány i údy, kalich, větry i pozemský svět.
