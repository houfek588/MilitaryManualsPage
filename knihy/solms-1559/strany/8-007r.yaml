poznamky:
- n: 1
  text: |-
    Chyba tisku (převzatá z obdobného výpočtu Druhé knihy, [[040r|list 40]]): pro 5000 osob na týden je správně 350 centů (7 × 50); oba sloupce dobytka také odpovídají 350 centům.
- n: 2
  text: |-
    Chyba tisku: sedminásobek denní dávky (5 skopců) je 35 skopců, nikoli 130; pravý sloupec dává přesně 350 centů (35 000 liber). Váhy kusů viz předchozí stranu (vůl 3 centy, kráva 1½ centu, tele 36, skopec 30, ovce 20 liber).
- n: 3
  text: |-
    Chyba tisku – přesmyk číslic: Druhá kniha ([[040v|list 40v]]) má 306 ovcí a teprve s nimi dává levý sloupec přesně 1500 centů (150 000 liber).
- n: 4
  text: |-
    Chyba tisku shodná s Druhou knihou: pravý sloupec dává jen 1300 centů; pro 1500 centů by bylo třeba 1020 ovcí.
- n: 5
  text: |-
    Chyba tisku shodná s Druhou knihou: pro 700 centů má být vlevo 140 ovcí (sedminásobek denních 20); pravý sloupec dává přesně 700 centů.
