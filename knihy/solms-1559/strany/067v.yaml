list: '67'
strana: verso
sken: 212
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Der Prouoß hat von einem jeden den er in die eisen schlecht/ vnd sein verwaltung gehört/ ein gulden wann er jn ledig lesset/ die jm der Oberst darinn zuschlahen beuilcht/ es sie dann vmb ringe sachen daß jm sein Oberster etwas zunemen verbeut.
  cs: |-
    Profous {Prouoß} má od každého, kdo náleží pod jeho správu a koho dá vsadit do želez, jeden zlatý {gulden}, když jej propustí na svobodu, pokud mu jej plukovník {Oberst} přikázal do nich vsadit; ledaže by šlo o nepatrné věci, u nichž by mu jeho plukovník zakázal cokoli brát.
- typ: odstavec
  de: |-
    Ein jeder Prouoß hat gewönlich von allen denen die er auß beuelch des Obersten Feldhauptmans/ seins Obersten oder mit recht lest richten/ sein sondere Prouit/ nach dem jm sein Oberster gündt oder gibt in einer jeden handlung.
  cs: |-
    Každý profous má obvykle od všech těch, které dá popravit z rozkazu nejvyššího polního hejtmana {Obersten Feldhauptmans}, svého plukovníka nebo po právu {recht}, svůj zvláštní příjem[^1], jak mu jeho plukovník v každém jednotlivém případě dopřeje nebo udělí.
- typ: odstavec
  de: |-
    Welcher nit vnder dem Regiment ligt/ vnd einen in die eisen zu schlahen begert/ gibt dem Prouosen zwen gulden/ welcher aber vnder seinem Regiment ligt/ vnd einen in die eisen lest schlahen/ der gibt nur ein gulden.
  cs: |-
    Kdo nenáleží k tomuto pluku {Regiment} a žádá někoho vsadit do želez, dá profousovi dva zlaté; kdo však náleží pod jeho pluk a nechá někoho vsadit do želez, ten dá jen jeden zlatý.
- typ: odstavec
  de: |-
    Welcher sich vnder disem Regiment wider den Artickelsbrieff/ oder sonst gegen der Obergkeit an sein ehrn/ leib vnd leben verwirckt/ den oder dieselbigen ist der Prouoß auff beuelch seins Obersten vor gericht durch sich selbs/ sei Leutenant oder Gerichtsman anzuklagen schuldig.
  cs: |-
    Kdokoli se pod tímto plukem proviní proti artikulnímu listu {Artickelsbrieff} nebo jinak proti vrchnosti na své cti, hrdle a životě, toho nebo ty je profous povinen na rozkaz svého plukovníka před soudem {gericht} obžalovat sám, nebo skrze svého poručíka {Leutenant} či soudního muže[^2].
- typ: odstavec
  de: |-
    Der Prouoß soll gantz fleissig zusehen/ daß inn der Knecht Leger kein falsche maß/ meß/ ellen/ oder gewicht gebraucht werden/ gleich wie der vnder Marschalck in der Reutter Leger auch schuldig ist.
  cs: |-
    Profous má velmi bedlivě dohlížet na to, aby se v ležení {Leger} knechtů {Knecht} neužívaly žádné falešné míry, duté míry, lokte ani závaží, stejně jako je tím povinen podmaršálek v ležení jezdců {Reutter}.
- typ: odstavec
  de: |-
    In allen ringen spennen zwischen den Hauptleuten/ Fendrichen/ Toppelsoldnern/ vnd andern ehrlichen Kriegsleuten/ soll der Prouoß on nachtheil des Oberst zuuertragen fleissig handeln/ damit er in kleinen sachen den Obersten nicht bemühe.
  cs: |-
    Ve všech drobných sporech mezi hejtmany {Hauptleuten}, praporečníky {Fendrichen}, dvojžoldnéři {Toppelsoldnern} a jinými čestnými válečníky {Kriegsleuten} má profous bez újmy plukovníka pilně usilovat o smír, aby plukovníka neobtěžoval v malicherných věcech.
- typ: odstavec
  de: |-
    Was sich aber wichtiger sachen zwischen dem Kriegsuolck zutragen/ die soll der Prouoß dem Obersten nicht verschweigen/ vnd auff sein anzeigen/ des Obersten beuelch gewarten/ auch denselben vnpartheisch verrichten.
  cs: |-
    Přihodí-li se však mezi válečným lidem {Kriegsuolck} závažnější věci, ty nemá profous plukovníkovi zamlčet; po svém oznámení má vyčkat plukovníkova rozkazu a týž nestranně vykonat.
- typ: odstavec
  de: |-
    Welcher oder welche dem Leger auff dem Rucken oder kopff zutragen/ die sein weder dem Prouosen noch sonst jemants nichts daruon schuldig/ doch dieselben sollen auch kein geuerde der gestalt darinn treiben/ Wann einer etwas im Leger verkauffen wolt/ vnd dasselbig in die nehe zum Leger/ auff Wagen/ Karren/ Rossen oder Eseln fürn lassen/
  cs: |-
    Kdo do ležení přinášejí zásoby na zádech nebo na hlavě, nejsou z toho povinni profousovi ani nikomu jinému nic odvádět; přesto však v tom nemají provádět žádnou lest tím způsobem, že by někdo chtěl v ležení něco prodávat a nechal to do blízkosti ležení dovézt na vozech, kárách, koních nebo oslech,[^3]
poznamky:
- n: 1
  text: |-
    „Prouit“ – zisk, poplatek či úřední obrok z poprav.
- n: 2
  text: |-
    „Gerichtsman“ – soudní přísedící; v tisku též zkrácený tvar „sei“ místo „sein“ („svého“).
- n: 3
  text: |-
    V tisku následuje přeskočené číslo listu 68 a věta na konci rubu 67v zde bez dokončení přechází k nové kapitole na listu 69r.
