id: 3-022v
list: '22'
strana: verso
sken: 296
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vil senffter gefürt werden mög / auffgeladen vnd beuolhen sein / Derhalben sie auff jren eigenen gefässen / angezeigter vrsachen / nit gefürt werden mögen / bedörffen also beide Scharpffemetzen zu jhrer selbst schwere Wagen 2.
  cs: |-
    o to šetrněji vézt. Z uvedených příčin se tedy nemohou vézt na svých vlastních lafetách {gefässen}; obě šarfmece {Scharpffemetzen} proto pro svou vlastní váhu potřebují 2 vozy.
- typ: odstavec
  de: |-
    Dieweil in denen schweren stücken einem Zugpferdt nicht mehr dann 2. Centner zuziehen auffgeladen werden sollen / so gebürt für der Büchsen eine zusetzen 57. Pferdt / brengt auff sie beid Zugpferdt 114.
  cs: |-
    Jelikož u těchto těžkých kusů nemá být jednomu tažnému koni {Zugpferdt} naloženo k tažení více než 2 centy {Centner}, přísluší zapřáhnout před jedno dělo {Büchsen} 57 koní, což pro obě činí 114 tažných koní.[^1]
- typ: odstavec
  de: |-
    Die vrsach aber warumb an den schweren stucken die inn die 60. Centner vnd darüber an jnen selbst wegen / nit mehr dann 2. Centner einem Gaul zuziehen auffgeladen werden / ist die / daß man in gůtem vnd bösem Wetter vnd weg / desto baß von statt komen / vnd dieselbigen an die ende vnd ort / da mann sie haben will vnd muß / souil senffter vnd fürderlicher brengen mög. Zu jedem stück sein sondere laden mit vorteil zugericht / damit die Räder / achs vnd scheiben / diser sort zugehörig / in gleichem form vnd maß gemacht sind / also das ein gattung die ander im fall der notturfft fürderlich erstatten vnd entsetzen mög / wie hernach vnderschiedlich angezeigt wirt. So bedörffen benanten stuck 200. kugeln die allenthalben 170. Cen. eisens wigen / vnd in fässer geschlagen werden / je auff ein wagen vngefehrlich 24. Centner zu laden gerechnet Wagen 7.
  cs: |-
    Příčina, proč se u těžkých kusů, které samy o sobě váží na 60 centů i více, nenakládá jednomu koni k tažení více než 2 centy, je ta, aby se v dobrém i zlém počasí a na dobré i špatné cestě dalo tím lépe postupovat vpřed a aby se děla dala tím šetrněji a rychleji dopravit na ta místa a stanoviště, kde je člověk chce a musí mít. Ke každému kusu patří zvláštní, účelně zhotovená lafeta {laden}, přičemž kola, nápravy i kotouče {scheiben} tohoto druhu jsou vyrobeny podle stejného vzoru a míry, takže jeden díl může v případě potřeby pohotově nahradit a zastoupit druhý, jak bude níže jednotlivě vyloženo. Tyto jmenované kusy tedy potřebují 200 koulí {kugeln}, které váží celkem 170 centů {Cen.} železa a zabedňují se do sudů; počítá-li se na jeden vůz přibližně 24 centů nákladu, je to 7 vozů.
- typ: odstavec
  de: |-
    Das brengt den 4. wagen jedem 29. vnd den 3. jeden 28. kugeln vffzuladen / darinn sol man die bescheidenheit mit den stärcksten Ziehpferden die anzall vffzuladen gebrauchen. Deßgleichen für der wagen einen 4. starck Zugpferdt / thůt Zugpferdt 28.
  cs: |-
    To vychází naložit na 4 vozy po 29 koulích a na 3 vozy po 28 koulích; přitom je třeba s rozvahou přidělit větší náklady nejsilnějším tažným koním {Ziehpferden}. Rovněž před každý z vozů [patří] 4 silní tažní koně, což činí 28 tažných koní.
- typ: odstavec
  de: |-
    Vnder denen 7. wagen sollen 2. beschlossen truhen oder kasten geordnet sein / darin man eisen kugeln legt / dann die fässer im feld nit allweg mit gelegenheit geöffnet werden. Dieweil nach gemeiner Regel die drei teil der Kugeln schwer puluers zu eim schoß oder ladung gnůg sein / ist anders das Puluer krefftig / so mann doch nachuolgender vrsachen / der Kugeln schwer puluers mit füret? Darumb daß zu zeiten das puluer / durch vnfleiß der Büchsenmeister / mit feur / verschüt / verbraucht / oder sonst schwecher wirt / Solt man dann den vorrat des puluers nit höher anschlagen / dann man das der Ordnung nach zur ladung bedörfftig / vnd der mangel auß gehörten vrsachen fürfallen würde / wo wolt man sich dann solchs abgangs wider erholen / dannoch bedörffen die 2. stück auch 170. Centner puluers / darzů gehören obgemeltem anschlag nach / auch Wagen 7.
  cs: |-
    Mezi těmito 7 vozy mají být upraveny 2 zavřené truhly nebo bedny, do nichž se kladou železné koule, neboť sudy nelze v poli vždy snadno otevírat. Poněvadž podle obecného pravidla stačí k jednomu výstřelu či náloži prach o třech dílech váhy koule {puluers}[^2] – je-li ovšem prach silný –, proč se tedy s sebou veze prachu tolik, kolik váží koule? Z následujících příčin: občas prach nedbalostí puškařů {Büchsenmeister} podlehne ohni, rozsype se, vypotřebuje anebo jinak zeslábne; kdyby se tedy zásoba prachu nepočítala výše, než kolik je podle řádu zapotřebí k nabíjení, a ze zmíněných příčin by nastal nedostatek, kde by se pak takový úbytek nahradil? Tyto 2 kusy tedy potřebují také 170 centů prachu, k čemuž podle výše uvedeného rozpočtu náleží také 7 vozů.
- typ: odstavec
  de: |-
    Für jeden wagen 4. pferdt / thůt aber Zugpferdt 28.
  cs: |-
    Před každý vůz 4 koně, což opět činí 28 tažných koní.
- typ: odstavec
  de: |-
    Deren Büchsen jede soll jren eigen Zug / damit sie auff vnd ab jren wagen / Gefäß odder Lade / gehebt oder gelegt möge werden / haben /
  cs: |-
    Každé z těchto děl má mít svůj vlastní kladkostroj,[^3] aby se jím dalo zvedat na vůz, lafetu {Gefäß} nebo lože {Lade} a zase z nich skládat,
poznamky:
- n: 1
  text: |-
    115 centů děleno 2 centy na koně dává 57,5, tedy zaokrouhleno dolů na 57 koní na jednu šarfmece (2 × 57 = 114). Dále u koulí činí 4 × 29 + 3 × 28 = 200 koulí (po 85 librách = 170 centů).
- n: 2
  text: |-
    „Tři díly váhy koule“ (*die drei teil der Kugeln schwer*) v dobové dělostřelecké praxi znamenají zpravidla tři čtvrtiny váhy koule jako běžnou nálož (naproti plné váze koule vezené do zásoby).
- n: 3
  text: |-
    Něm. *Zug* zde (a v následujících kapitolách o zbrojnici) označuje zvedací stroj / kladkostroj s dřevěnou kozou (*Bock*) a kladnicemi (*Kloben*).
