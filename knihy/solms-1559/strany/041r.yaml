bloky:
- typ: odstavec
  de: |-
    Item / für ein Kůe mag genommen werden fünff Hämel / odder drei Hämel vnd drei Schaaff / oder ein Hamel sechs Schaaff.
  cs: |-
    Dále: za jednu krávu lze vzít pět skopců, nebo tři skopce a tři ovce, nebo jednoho skopce a šest ovcí.
- typ: odstavec
  de: |-
    Item / für fünff Kälber mag genommen werden / ein Kůe / ein Hamal oder sechs Hämel / oder neun Schaaff / oder zwen Hämel / sechs Schaaff / oder vier Hämel drei Schaaff.
  cs: |-
    Dále: za pět telat lze vzít jednu krávu a jednoho skopce[^1], nebo šest skopců, nebo devět ovcí, nebo dva skopce a šest ovcí, anebo čtyři skopce a tři ovce.
- typ: odstavec
  de: |-
    Item / für zwen Hämel mag genommen werden drei Schaaff / vnd vor vier Hämel sechs Schaaff. Also dergleichen mag man sich darnach richten / wann ein abgang were an etlichem viehe.
  cs: |-
    Dále: za dva skopce lze vzít tři ovce a za čtyři skopce šest ovcí. Stejným způsobem se lze podle toho řídit, kdyby nastal úbytek u některého dobytka.
- typ: odstavec
  de: |-
    Wann es sich nun zutrüge / das mangel vnnd abgang were / an allem fleysch oder viehe / vnd der anschlag nicht möcht ertragen / auff ein Person einn tag ein pfundt fleysch / vnd wirt der anschlag geringert vnd zweien person einn tag ein pfundt fleysch verordnet / so mag man sich auch halten nach jetzt beschribener Ordnung / Einen tag zweien Personen ein pfundt fleysch / das ist inn vorgesetzter Ordnung / odder halb theil einen tag oder die wochen / vnnd auch des Monats / darnach sich ein jeder verstendiger wol wirt wissen zurichten / Deßgleichen auch wann drei personen verordnet würden / einn tag ein pfundt fleysch / so ist das drittheil zunemen in bemelter ordnung / wie dann ein anschlag mag beschehen.
  cs: |-
    Kdyby se pak stalo, že by byl nedostatek a úbytek všeho masa či dobytka a rozpočet by nemohl snést jednu libru {pfundt} masa na osobu a den, takže by se dávka snížila a určila se jedna libra masa na den pro dvě osoby, lze se také držet podle právě popsaného řádu: jedna libra masa na dvě osoby na den je totiž v předchozím řádu poloviční díl na den, na týden i na měsíc, podle čehož se každý rozumný člověk bude umět zařídit. Stejně tak i kdyby byla určena jedna libra masa na den pro tři osoby, vezme se třetina z uvedeného řádu, jak pak může být rozpočet stanoven.
- typ: odstavec
  de: |-
    Wo nun weitter Bestellung nötig / hat sich ein jeder verstendiger angefangner rechnung nach / zum besten vnd nach notturfft zurichten.
  cs: |-
    Kde bude třeba dalšího zaopatření, nechť se každý rozumný člověk zařídí podle započatého výpočtu co nejlépe a podle potřeby.
- typ: odstavec
  de: |-
    Es sehe mich auch für gůt an / wo mann des viehs ein grosse anzal hett / daß alßdann dasselbig nicht vber einen hauffen geschlacht / sonder wo weide vorhanden / darinn geschlagen / vnnd nach notturfft geschlacht würden.
  cs: |-
    Také by se mi zdálo dobré, má-li se veliké množství dobytka, aby se pak neporážel najednou na jedné hromadě, nýbrž aby se tam, kde je pastva, vyhnal na ni a porážel se podle potřeby.
- typ: odstavec
  de: |-
    Vnd was von viehe auff den feinden erobert / solt mann dem Prouiantmeister / so mann das zuuerkauffen gemeint / zuuor anzeigen / damit solches von jm / was billich vnd wert ist / geschetzt würde.
  cs: |-
    A co se z dobytka ukořistí na nepřátelích, má se, hodlá-li se to prodat, nejprve ohlásit proviantmistrovi {Prouiantmeister}, aby to od něj bylo podle slušnosti a ceny ohodnoceno.
- typ: odstavec
  de: |-
    Wo auch einer für sich selbst / ein stück zehen oder zwölff erobert hett / vnd wolt solches für sich selbst oder seinen Herren behalten / were nicht hoch an zufechten / dieweil es nicht tapffer hauffen weren.
  cs: |-
    Kdyby také někdo pro sebe ukořistil nějakých deset nebo dvanáct kusů a chtěl by si je ponechat pro sebe nebo pro svého pána, nemělo by se to příliš stíhat, poněvadž by to nebyla velká stáda.
- typ: odstavec
  de: |-
    Nun volgt Füterung auff Pferde / vnnd ist einem jeden Pferdt / einen tag vnd nacht / ein Metzen Hafers mit der es sich zimlicher notturfft leiden mag / vnd sonderlich in sollicher tapffern anzal zugerechnet.
  cs: |-
    Nyní následuje píce pro koně; a každému koni se na jeden den a noc počítá jedna měřice {Metzen} ovsa, s níž podle skromné potřeby vystačí, a zvláště při tak velikém počtu.
poznamky:
- n: 1
  text: |-
    Tisk má „ein Kůe / ein Hamal“ (150 + 30 = 180 liber, což přesně odpovídá váze pěti telat).
