bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    massen starck / daß sie dem gantzen Heer schaden thůn möchten / alßdan soll der gantz hauff still stehen / vnnd die Schlachtordnung gemachet werden / mit jnen schlagen wie ich euch nachuolgends sagen will / doch nicht desto weniger wann die Ordnung gemacht / wider für ziehen / vnd die im nachzug auch die in der streiffenden Rot / inn gůter Ordnung naher ziehen / vnd sich hůten daß sie die Feinde zum ersten wann sie anderst nicht von jnen nit angriffen werden / sonder sich geschicklich halten.
  cs: |-
    silní, že by mohli celému vojsku {Heer} uškodit, pak se má celé vojsko zastavit a sešikovat k bitvě {Schlachtordnung}, aby se s nimi utkalo, jak vám povím dále. Nicméně jakmile je šik postaven, má se znovu táhnout vpřed. Zadní voj {nachzug} i hlídková rota {streiffenden Rot} ať se v dobrém pořádku přitáhnou blíže a dají si pozor, aby nepřítele nenapadli jako první, nebudou-li sami napadeni,[^1] nýbrž ať si počínají obratně.
- typ: odstavec
  de: |-
    Mich bedünckt ich hab euch alles das mir noch wissent ist / wie ein Heer in einer Ordnung ziehen soll / angezeigt / es sei in engen odder weitten Landen / auch welcher gestalt jhr sicher vber Brücken vnnd päß ziehen künden / Jetzund will ich euch sagen / wie jr euch meinem bedüncken nach halten solt / wann jr nicht weit von dem ort seit / da jr das Leger schlagen wolt.
  cs: |-
    Mám za to, že jsem vám ukázal všechno, co je mi ještě známo o tom, jak má vojsko táhnout v pořádku, ať v úzkých, nebo v otevřených krajích, a také jakým způsobem můžete bezpečně přejít přes mosty a průsmyky {päß}. Nyní vám povím, jak se podle mého mínění máte zachovat, když už nejste daleko od místa, kde chcete rozbít ležení {Leger}.
- typ: odstavec
  de: |-
    Wann ewer Quartirmeister sich richtet zu dem ort da er das leger will schlagen / soll er erstlich sehen daß er einen bequemlichen platz darzů neme / der nicht weit vom holtz vnnd einem Wasser sei / wann es anderst möglich ist / vnd es sein mag / dann das zwei ding seind die einem Leger wol thůn es seien Reutter odder fußknecht / Soll auch acht haben daß es ein vortheilliger platz sei / gegen den Feinden sie greiffen tags vnd nachts an / vnd lugen das kein ort oder berg darbei sei / da die Feind ein vortheil sie anzugreiffen haben möchten / Auch soll der Marschalck dem Quartirmeister sagen den platz da das leger sein muß / vnd wie er es beschliessen vnd befestigen wölle / solchs soll der Quartirmeister dem Büchsenmeister vnnd des Marschalcks Prouosen berichten / darmit sie sich mit dem Geschütz vnnd anderm darnach wissen zurichten / mich dünckt auch jr solt fünff oder sechs Hetschier / vnd souil junger Edelleut zu euch nemen / die jr hin vnd wider schicken kundt / vnnd solt jhr auff ein ring pferdtlin odder Zelterlin sitzen / vnd einen Bůben auff einem mitelmessigen roß der ein Fendlin füre / vnd solliches laß fliehen / auff das so mann ewer notturfftig were / mann euch auch finden künde / gemelts Fendlin soll nicht gemalet odder geferbet sein wie die anderen / damit es ein jeglicher kenne / vnd nimmer nicht auffgethan werden jhr seind dann darbei / jhr solt auch ein Trommeten haben die mann vor den anderen wol kenne / der vrsachen halben / wann jhr sie blasen lassent / mann wöl auffbrechen odder still ligen / daß sich die anderen Trommeter darnach wissen zuhalten / ewer andere Pferde vnd Bůben mögen jhr wol bei ewerem Leuttenant lassen / odder bei den jenigen so das oberst Fendlin füren / damit wann sich
  cs: |-
    Když se váš kvartýrmistr {Quartirmeister} vydá k místu, kde chce rozbít ležení, má nejprve hledět, aby k tomu zvolil vhodné místo nedaleko lesa a vody, je-li to jen možné. Tyto dvě věci totiž ležení prospívají, ať jde o jezdce {Reutter}, nebo o pěší knechty {fußknecht}. Má také dbát, aby to bylo místo výhodné proti nepříteli, ať útočí ve dne, nebo v noci, a hledět, aby poblíž nebylo žádné místo ani vrch, odkud by měl nepřítel k útoku výhodu. Polní maršálek {Marschalck} má kvartýrmistrovi také říci, kde má ležení stát a jak je chce uzavřít a opevnit. To má kvartýrmistr oznámit puškaři {Büchsenmeister} a maršálkovu profousovi {Prouosen}, aby se podle toho uměli zařídit s děly {Geschütz} i s ostatním. Zdá se mi také, že byste si měli vzít k sobě pět nebo šest hartšířů {Hetschier} a stejně tolik mladých šlechticů, které můžete posílat sem a tam. Sami máte sedět na lehkém koníku nebo na mimochodníku {Zelterlin} a mít u sebe pachole {Bůben} na středně velkém koni, které povede korouhev {Fendlin} a nechá ji vlát,[^2] aby vás našli, kdyby vás někdo potřeboval. Tato korouhev nemá být pomalovaná ani obarvená jako ostatní, aby ji každý poznal, a nikdy se nemá rozvinout, nejste-li sami přítomni. Máte mít také trubku {Trommeten}, kterou lze dobře rozeznat od ostatních, a to proto, aby se ostatní trubači {Trommeter} uměli zařídit podle toho, zda ji dáte troubit k odchodu, nebo k setrvání na místě. Ostatní koně a pacholata můžete klidně nechat u svého poručíka {Leuttenant} nebo u těch, kdo nesou hlavní korouhev, abyste, kdyby se
poznamky:
- n: 1
  text: Věta je v tisku neúplná („daß sie die Feinde zum ersten … nit angriffen werden“) – zjevně vypadlo sloveso „nicht angreiffen“; přeloženo podle smyslu.
- n: 2
  text: Tisk má „laß fliehen“, patrně místo „laß fliegen“ (nech vlát).
