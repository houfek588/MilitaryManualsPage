  popis: |-
    Celostránkový dřevořez označený uprostřed písmenem „Z“ s příslušenstvím ke kladkostrojům a ke zvedání děl: vlevo osm kladnic ve čtyřech párech (horní a dolní kladnice, podle textu na `4-021r` s 6 + 6, 4 + 4, 2 + 2 a 2 + 1 kladkami, u dvou největších párů s malými příčnými otočnými kotoučky na boku); vpravo nahoře dva podstavné kozlíky pod dělo (jeden lichoběžníkový, druhý se šikmo rozkročenými nohami); dole zubový zvedák (hever) s klikou a drápem a vedle něj zvedací stojan s řadou otvorů pro železný čep a s dlouhou pákou.
