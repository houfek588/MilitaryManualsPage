  popis: |-
    Celostránkový dřevořez označený uprostřed písmenem „Z“ zobrazující příslušenství ke zvedání děl: vlevo osm sad kladnic (čtyři horní a čtyři dolní s různým počtem kotoučů – po 6, 4, 2 a 2/1 kladkách včetně bočních vodicích otočných koleček); vpravo nahoře dva podstavné kozlíky (třírohý a čtyřrohý) pod nápravy děl; dole ozubený zvedák (hever) s klikou a hákem vedle kolíkového rámu s dlouhou železnou či dřevěnou pákou.
