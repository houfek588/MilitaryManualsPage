id: 9-025v
list: 25 (9. kniha)
strana: verso
sken: 670
stav: prelozeno
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    dasselbig der ersten Rot zu tragen geben/ die ander Rot soll tragen die Rüstung damit mann die Brücken schlecht/ die erst Rot wirt die Schifflin in das Wasser stossen vnd hinüber faren/ da die streng vnd strick der Brücken anknepffen/ dieweil soll die drit Rot die leitern tragen/ vnd vber die Brücke gehn die leitern auffrichten/ vnd solchs alles auff das stillest außrichten/ die vierdt Rot soll gleich also hinauff steigen/ wann es aber sach were/ daß kein graben noch wasser hett/ daß jr keiner Brücken bedorfft/ soll die erst Rot die leitern tragen/ die ander hinauff steigen auff das stillest als es geschehen mag/ vnd wann sie auff die Maur kommen/ sollen sie zu der nechsten Porten lauffen/ alda hebtremel vnnd andere Jnstrument haben/ damit sie die Thor auffbrechen/ doch sollen die andern nichts desto weniger die leitern auffsteigen/ vnd dem Schloß zulauffen wann anders eins da ist/ wo aber nit/ dem nechsten dem platz zů/ vnd wann jr sehet daß jr der inn der Stat meister seind/ alßdan möcht jr wol die Knecht lassen lauffen zu plündern.
  cs: |-
    dát to nést první rotě {Rot}. Druhá rota má nést vybavení, jímž se staví most. První rota spustí čluny na vodu, přepluje na druhou stranu a tam uváže lana a provazy mostu. Mezitím má třetí rota nést žebříky, přejít po mostě a žebříky postavit, a to všechno co nejtišeji. Čtvrtá rota má hned nato vystoupit nahoru. Kdyby však nebyl žádný příkop ani voda, takže byste most nepotřebovali, má první rota nést žebříky a druhá co nejtišeji vystoupit nahoru. Když se dostanou na hradbu, mají běžet k nejbližší bráně a mít tam páčidla[^1] a jiné nástroje, jimiž bránu vylomí. Ostatní však mají přesto dál stoupat po žebřících a běžet k zámku, je-li tam nějaký, a není-li, k nejbližšímu náměstí. Když pak vidíte, že jste pány města, můžete knechtům {Knecht} dovolit, aby se rozběhli plenit.
- typ: odstavec
  de: |-
    Das seind die stück dardurch ich vermein daß jhr ein Stat on verreterei gewinnen kündt/ dann der verreterei souil seind daß ich euch warlich nichts raten kan/ duncket mich auch kein gůt ding sein mit verreterei vmbgehen/ dann welcher seinen Herren dem er gelobt vnd geschworn hat/ verret/ darff warlich einn andern auch verraten/ Nun hab ich euch die Manier ein Stat zu besetzen angezeigt/ vnnd nichts desto weniger darauß zu kriegen doch ehe daß sie belegert wirt.
  cs: |-
    To jsou způsoby, jimiž podle mého mínění můžete dobýt město bez zrady. Zrad je totiž tolik druhů, že vám o nich věru nemohu nic radit; ani se mi nezdá dobré zabývat se zradou, neboť kdo zradí svého pána, jemuž slíbil a přísahal [věrnost], ten se věru odváží zradit i jiného. Nyní jsem vám ukázal, jak obsadit město, a přesto z něho vést válku, ovšem dříve, než je obleženo.
- typ: odstavec
  de: |-
    Wann nun die gemelten sachen alle geschehen/ will ich es setzen als ob jr dardurch gleich belegert würd/ sollen die ewern das groß geschütz an ein ort verordnet haben/ da sie die vnd dannoch kein Thor eröffnen/ mögen auch etlich gering hortig fußknecht vnder sie hinauß fallen/ vnd gůt achtung haben daß sie nicht jren vortheil vbergeben/ doch were es das aller sicherst daß jr in der stat bliebt/ dann wann jr einn man verliert/ ist euch in der stat souil als ob die vor der stat hundert verlorn hetten/ dann sie souil wider bekommen künden als sie wöllen/ das jr in der stat nicht kündt/ auch wann Vorstät nahe bei der stat seind/ sollen die in der stat/ es seien Kirchen oder sonst Mauren verbrennen/ damit sich die Feind nicht hinein legen künden.
  cs: |-
    Když se nyní všechny zmíněné věci staly, chci předpokládat, že byste přesto byli obleženi. Vaši lidé mají mít velká děla {groß geschütz} rozestavena na takovém místě, odkud [mohou nepřítele ostřelovat][^2], a přitom neotevírat žádnou bránu. Mohou také nechat několik hbitých[^3] pěšáků {fußknecht} vyrazit proti nepříteli, ti však mají dobře dbát, aby se nevzdali své výhody. Nejbezpečnější by ovšem bylo, abyste zůstali ve městě. Ztratíte-li totiž ve městě jednoho muže, je to pro vás tolik, jako kdyby ti před městem ztratili sto, neboť oni mohou získat znovu tolik lidí, kolik chtějí, což vy ve městě nemůžete. Jsou-li také blízko u města předměstí, mají je obránci vypálit, ať jsou to kostely, nebo jiné zdi, aby se v nich nepřítel nemohl usadit.
- typ: odstavec
  de: |-
    Wann ewer Feinde ankommen sich schon belegert/ vnd anheben zu schantzen/ alßdan ist mein rath/ daß jr die grossen stück wider hinweg an ein ander ort stellet/ dann es den tag daruor gestanden ist/ dann vngezweiffelt sich ewere Feind sonst darnach richten würden/ vnd jr Geschütz auch an dasselbig ort gegen euch richten/ wann dann jr jnen solches gebrochen/ mögen die in der Stat an dem ort da das
  cs: |-
    Když váš nepřítel přitáhl, už se položil k obléhání a začíná budovat šance {schantzen}, radím vám, abyste velká děla {stück} přemístili jinam, než kde stála den předtím. Nepřítel by se totiž jinak nepochybně podle toho řídil a namířil by svá děla {Geschütz} proti vám na totéž místo. Když jste mu to tedy zmařili, mohou ti ve městě na místě, kde
poznamky:
- n: 1
  text: |-
    *hebtremel* – páky, páčidla (*Hebetrámel*, „zvedací trám“), jimiž se vylamovaly brány.
- n: 2
  text: |-
    V tisku *da sie die vnd dannoch kein Thor eröffnen* – věta je porušená (zřejmě vypadlo sloveso, např. *beschiessen mögen*); doplněno podle smyslu.
- n: 3
  text: |-
    *gering hortig* – tisková chyba nebo zkomolenina za *geringfertig* / *ringfertig* („hbitý, lehce ozbrojený“).
