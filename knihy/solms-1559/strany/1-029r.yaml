bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Practicken vnd Finantzen im Krieg vnder den Regierungen / vnnd es ist zubesorgen daß wol etliche sein mögen / die jre sachen zusamen schlagen / einander helffen / vnnd jhren handel mit einander treiben / dann die Kriegßregirung will je lenger je mehr in einen Kauffhandel geraten / dann mann sicht daß etliche Commissarien gar vil gůts auß den Zügen bringen / Wie zuuermutten das es zugehe / wirt hernach im andern Bůch von den Amptern meltung geschehen.
  cs: |-
    úklady {Practicken} a finty {Finantzen} ve válce mezi úřady. Je třeba se obávat, že se najdou i někteří, kdo dávají své věci dohromady, pomáhají si navzájem a společně provozují své obchody; válečná správa se totiž čím dál víc mění v kupecký obchod. Je přece vidět, že někteří komisaři {Commissarien} si z tažení {Zügen} odnášejí velmi mnoho jmění. Jak se to asi děje, o tom bude zmínka níže v Druhé knize o úřadech.
- typ: odstavec
  de: |-
    Darumb wirdt von nöten sein fürter ein einsehens zuhaben / darmit mann wider gemeine Kriegs nötliche Pollicei erhebe vnnd halten kündt / darmit ein Herr das gemein Kriegßuolck desto statlicher erhalten möge.
  cs: |-
    Proto bude napříště třeba na to dohlížet, aby bylo možno opět pozvednout a udržet obecný válečný veřejný řád {Pollicei}, jakého je třeba, a aby pán mohl prostý válečný lid {Kriegßuolck} tím lépe vydržovat.
- typ: odstavec
  de: |-
    Ja mann will wol sagen / soll ein Herr mit sollichen sachen selber vmbgehen / hören vnd bemühet sein / er hat souil Räth vnd Commissarien darüber / es ist dem Herren ein verhinderung? Nein es ist verdechtig geredt / vnd zuuermuten daß dieselbigen mit inn der Practicken ligen / vnd jnen leidt wer daß er etwas darumb wissen solt / dann wann der Herr das wissen würde / so möcht er jnen das nit gestatten. Das ist aber recht / das mann es einen Herren bericht vnnd helff beratschlagen / daß es in ein recht werck gebracht werde / Da sollen dann die Commissarien die arbeit thůn vnnd fleissig darauff sehen / daß es geschehe / vnd in rechtem gang bleibe.
  cs: |-
    Ovšem někdo by snad řekl: „Má se pán takovými věcmi zabývat sám, vyslýchat a namáhat se? Vždyť na to má tolik radů {Räth} a komisařů – pána to jen zdržuje!“ Nikoli, to je podezřelá řeč a lze tušit, že ti, kdo tak mluví, jsou sami zapleteni do těch úkladů a bylo by jim líto, kdyby o tom pán něco věděl; kdyby se to totiž pán dozvěděl, nedovolil by jim to. Správné však je podat o tom pánovi zprávu a pomoci mu poradit se, aby se věc řádně uskutečnila; komisaři pak mají vykonat práci a pilně dohlížet, aby se tak stalo a zůstalo to ve správném chodu.
- typ: odstavec
  de: |-
    Besonder sol mann einen solchen getrewen fleiß bei einem jungen Kriegßherrn oder Obersten haben / der des Kriegs nit vil geübet ist. Wann ein Herr dann mit allen räthlich vnd behilfflich handeln wirt / das ist jm ein trost / vnd auch mit solchem Rath vnd beistandt ehr vnd lob erhalten / vnd nit allein dem Kriegßuolck / sonder auch dem Krigßherrn damit gedient wirt / vnd allen Kriegs vornemen mit sampt solchen darzů Raths personen vnd Ampts verwaltern / darumb soll ein Herr sich mit gůten geschickten Personen die Ampter zuuerwalten oder zu regiren wol versehen / dann alle sachen die stehen einem Kriegßherrn auff gůtem Rath / Regirung vnd versehung der Ampter / Dann wann die Ampter wol regiret vnnd versehen werden / durch Personen die solliches im feld zu handeln verstehen / besonder wann es an die not gehet / vnnd der Feinde mit ernst zu entgegen ist / vnnd der Rath mit der handt angegrieffen vnd beweret sein will.
  cs: |-
    Zvláště je třeba vynaložit takovou věrnou péči u mladého válečného pána {Kriegßherrn} či plukovníka {Obersten}, který ještě nemá ve válčení mnoho zkušeností. Bude-li tedy pán se všemi jednat s radou a pomocí, je mu to útěchou a s takovou radou a oporou získá čest i chválu. Neposlouží se tím jen válečnému lidu, nýbrž i válečnému pánovi a všem válečným podnikům spolu s osobami rady a správci úřadů, kteří k tomu patří. Proto se má pán dobře opatřit schopnými osobami ke správě či řízení úřadů, neboť všechny záležitosti válečného pána spočívají na dobré radě, správě a obsazení úřadů. Když totiž úřady dobře řídí a zastávají osoby, které rozumějí tomu, jak takové věci v poli vykonávat – zvláště když jde do tuhého, nepřítel se vážně staví na odpor a radu je třeba vzít do rukou a osvědčit skutkem[^1].
- typ: odstavec
  de: |-
    Darumb soll ein Herr / wie offt gemelt / sein hohe Ampter wol besetzen / vnd versehen mit den verstendigen Personen / die rath vnd that im Feld mit einander thůn / vnd nicht mit stuben Räthen bestellen / die dem Krieg maß geben wöllen / sonder zeitlich mit seinen
  cs: |-
    Proto má pán, jak již bylo často řečeno, dobře obsadit své vysoké úřady a opatřit je rozumnými osobami, které v poli spojují radu i čin, a neobsazovat je světničními rady[^2], kteří chtějí válce určovat míru; nýbrž se má včas se svými
poznamky:
- n: 1
  text: |-
    Souvětí zůstává i v tisku nedokončené (chybí hlavní věta „…pak se válce daří“); překlad tuto nedokončenost zachovává.
- n: 2
  text: |-
    Něm. *stuben Räthen* – dosl. „radové ze světnic“, tj. úředníci a rádcové z kanceláří bez polní zkušenosti.
