    Rozkládací dvojlistový dřevořez znázorňující čtyři veliká obléhací děla (bořiče hradeb – *Mauerbrecherinnen*) s kulovitými střelami vlevo a zmenšenou měřítkovou úsečkou (1 : 10) nad každou hlavní. Ryté německé nápisy uvádějí odshora dolů:
    1) nad měřítkem „Dy hoe der Kugeln“ („Výška koulí“), nad koulí „Wiegt dy Kugel 85 lb“ („Koule váží 85 liber“), nad zádí hlavně „wiegt disse büchs 115 cent.“ („toto dělo váží 115 centů“);
    2) „Dye hoe der Kugeln“, nad koulí „Wiegt 70 lb“ („Váží 70 liber“), nad zádí hlavně „wiegt 80 cent“ („váží 80 centů“);
    3) „Dye hoe der Kugeln“, nad koulí „Wiegt 45 lb“ („Váží 45 liber“), nad zádí hlavně „wiegt 50 cent“ („váží 50 centů“);
    4) „Dye hoe der Kugeln“, nad koulí „Wiegt 35 lb“ („Váží 35 liber“), nad zádí hlavně „wiegt 36 cent“ („váží 36 centů“).
