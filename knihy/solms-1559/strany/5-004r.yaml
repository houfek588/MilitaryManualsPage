bloky:
- typ: odstavec
  de: |-
    Ich hab auch in diser Figurn im grundt etlich Seck zwischen den Donnen angezeigt/ damit zusehen ist/ daß mann das auch mit secken thůn kan/ vnd sich mit der Beschreibung vergleicht/ es kan sich wol ein solcher fal zutragen/ wie da geschehen/ daß mann einem das eintragen mit Fewer vnd dergleichen wehren wolt/ wie daruon gemelt ist/ deßgleichen mag auch wol ein Broch so eng sein/ daß mann mit keiner Donnen darinn kan/ dann sind die seck zu brauchen.
  cs: |-
    Na tomto vyobrazení jsem rovněž v půdorysu vyznačil několik pytlů mezi soudky, aby bylo patrno, že to lze provést i s pytli a že se to shoduje s popisem. Může zajisté nastat takový případ, jak se tam stalo, že by nepřítel bránil vnášení ohněm a podobnými prostředky, jak o tom bylo řečeno; rovněž může být průlom tak úzký, že se do něj s žádným soudkem nedostaneš – tehdy jest třeba použít pytlů.
