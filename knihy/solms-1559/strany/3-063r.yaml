bloky:
- typ: odstavec
  de: |-
    ES ist ein besonder kunst auff Salpeter zukauffen / wann er erst von Venedig kompt das merck wenn du kompst vber ein Geschir mit Salpeter so greiff hinein / bleibt die handt trucken so ist er gůt / wirt sie aber naß dann ist nicht gůt.
  cs: |-
    Jest to zvláštní umění při koupi ledku {Salpeter}, když právě přijde z Benátek:[^1] pamatuj, přijdeš-li k nádobě s ledkem, sáhni do něj – zůstane-li ruka suchá, pak jest dobrý; zvlhne-li však, pak není dobrý.
- typ: nadpis
  uroven: 3
  de: Ein ander Lere auff Salpeter kauffen.
  cs: Jiné poučení ke koupi ledku
- typ: odstavec
  de: |-
    ITem versůch jhn mit dem mundt / ist er denn rösch / bitter vnnd Gesaltzen / so ist er nicht gůt / ist er aber bitterlich / vnd süßlich in dem mundt / so ist er gerecht.
  cs: |-
    Dále jej ochutnej ústy: jest-li pak štiplavý, hořký a slaný, pak není dobrý; jest-li však nahořklý a nasládlý v ústech, pak jest pravý.[^2]
- typ: nadpis
  uroven: 3
  de: Aber ein Lere auff Salpeter zukauffen.
  cs: Opět jiné poučení ke koupi ledku
- typ: odstavec
  de: |-
    WIsse welcher Salpeter glat zepffet ist / das der selbig gůt ist / vnd den magstu wol kauffen / aber der roch zepffet ist nicht gůt / vnd raucher gemulter Salpeter ist auch nicht gůt / Item das ist das die Kauffleutch fast gewonlichen in allen sachen / damit sie vmbgehen vortheil suchen wo sie können oder mögen daß da durch jre Kauffmanschatz dick geringert vnnd geschwecht wirt / also das die Leut wenen die vmb sie kauffen sie haben gůten kauff gethan / so werden sie offt betrogen von jn / vnd sonderlich an dem Salpeter / dauon hernach vnd dauorn klerlich steht geschriben / wie man erkennen soll / rechten vnd gůten Salpeter / oder wie man wissen soll / welcher mit Saltz oder Alaun gemischt sei so findt man auch dauorn / wie man saltz vnd Alaun dauon brengt.
  cs: |-
    Věz, že který ledek má hladké krystaly (*glat zepffet*), ten jest dobrý a můžeš jej směle koupit; avšak ten, jenž má hrubé surové krystaly (*roch zepffet*), není dobrý, a hrubý drolivý (*raucher gemulter*) ledek také není dobrý. Dále bývá tak, že kupci takřka obyčejně ve všech věcech, s nimiž obchodují, hledají prospěch, kde jen mohou a umějí, takže tím bývá jejich kupecké zboží často znehodnocováno a oslabováno – tak že lidé, kteří od nich kupují, se domnívají, že učinili dobrou koupi, a přitom bývají jimi často oklamáni, a zvláště u ledku, o němž níže i výše stojí zřetelně psáno, jak má člověk poznat pravý a dobrý ledek nebo jak má vědět, který jest smíchán se solí nebo kamencem; a výše se též najde, jak se od něj sůl a kamenec oddělí.
- typ: nadpis
  uroven: 3
  de: Ein besonder kunst auf salpeter zukauffen der doch nicht auff sein stat geleutert vnd abgescheiden ist.
  cs: Zvláštní umění ke koupi ledku, jenž přece není na patřičný stav přečištěn a oddělen
- typ: odstavec
  de: |-
    ITem merck wol daß mann findt gůten bessern vnnd allerbesten / mann findt auch salpeter der auch gemengt ist / in dem mundt nicht zu süsse noch zu bitter kanstu den Alaun dauon scheiden / so magstu jn wol kauffen oder sein wirt wenig / vnd du jn jedoch můst tewer kauffen / vnd der Alaun ist dir nichs nütz / doch mag er sein den Kremern nutz / die den salpeter verkauffen / denn sein wirt wenig am gewicht oder wag / nach dem leutern / mann findt salpeter der nicht gemein gut ist dann das er ein wenig gröblet gesaubert vnd geleuter ist / gleich als wenn er erst von dem Berg oder stein kem / vnnd derselbig zu erkennen ist im mundt / wann du emtpfindest weder süß noch sawer / darinn / vnd doch fast bitter vnd lautter ist / denselben solt du kauffen / je leutterer je besser / dann er leuttert vnd scheidt sich gern / vnd wirt gůt Essig darauß / mann findt salpeter / vnd mag jn suchen bei Brüchen / oder holen steinen bei feuchten Maurn.
  cs: |-
    Dále dobře pamatuj, že se nachází dobrý, lepší i ze všech nejlepší ledek; nachází se též ledek smíšený, v ústech ani příliš sladký, ani příliš hořký – dokážeš-li z něj oddělit kamenec, pak jej můžeš koupit, jinak ho zůstane málo a ty jej přesto musíš draze zaplatit, a kamenec ti není k ničemu, byť kramářům, kteří ledek prodávají, může být užitečný, neboť jej po vyčištění ubude na váze. Nachází se i ledek, který není obyčejně dobrý, leč je jen nahrubo očištěn a přečištěn, jako by právě přišel z hory nebo ze skály; a ten se pozná v ústech tak, že v něm necítíš ani sladkost, ani kyselost, a přece jest velmi hořký a čirý – ten máš koupit, čím čirší, tím lepší, neboť se ochotně čistí a odděluje a bývá z něj dobrý výsledek.[^3] Ledek se nachází a lze jej hledat u lomů nebo u dutých skal při vlhkých zdech.
poznamky:
- n: 1
  text: |-
    BSB OCR na konci tohoto odstavce přidalo z prosvítajícího rubu neexistující řádek */ ift er det* a čárový kód `00085166`.
- n: 2
  text: |-
    BSB OCR zde vynechalo téměř celý řádek (*FTem verfach ihn mit dem munder and / Gefalken* místo *ITem versůch jhn mit dem mundt / ist er denn rösch / bitter vnnd Gesaltzen*) a přečetlo *süßlich* („nasládlý“) jako *faßlich*.
- n: 3
  text: |-
    V tisku stojí doslova *wirt gůt Essig darauß* („stane se z něj dobrý ocet“) – zřejmě sazečská zkomolenina za *wirt gůt zeug darauß* („bude z něj dobrá látka / prach“).
