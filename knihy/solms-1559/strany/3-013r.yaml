bloky:
- typ: nadpis
  uroven: 3
  de: Der Wagenmeister.
  cs: Vozmistr {Wagenmeister}.
- typ: odstavec
  de: |-
    EIn Wagenmeister soll haben einn Leutenant der auff jn wart / der soll alle wagen souil jhr sind im zug on die Arcolorei wagen beschreiben / von dem Obersten an biß zu dem geringsten / wieuil ein jeder wagen / darauffer besoldung hat / ob einer wagen het vnd darauff kein besoldung / wolt die auch inn der Ordnung vnnd versehung haben / sol er die auch darunder beschreiben / wann er dann alle wagen hat beschriben / soll er die dem Feldmarschalck brengen / vnd jn vnderrichten / wie er die nach einander gehn lassen soll / doch wirt des Obersten wagen fürgehn / darauff des Feldmarschalcks vnnd Fürsten Wagen / darnach der Ampter vnd Regiments Obersten / wie man die dann ordnen wirt / wie die Regiment vor vnd nach / also sollen die wagen auch ziehen vnd abwechseln / darauff soll er acht haben / vnd den abent fragen wie die Regiment ziehen / also soll er die wagen auch gehn lassen / so man den morgen an zeucht / soll der Wagenmeister mit sampt seinem Leutenant vnd dienern zuuor darauß an der strassen sein / da der zeug hinauß gehn wirt / soll besehen daß sie nach der ordnung fahren / vnd so sich wölten wagen hinfür machen die nit für gehörten / sol er halten lassen biß die her für komen die herfür gehörn / Also soll er das in die ordnung brengen / dann seinen Leutenant bei den wagen lassen / damit sie inn Ordnung bleiben / vnd soll er vor ziehen / sie im weg behalten / wie das durch den Obersten verordnet ist / der Leutenant soll gůt achtung haben / ob etwan wagen die nit wol gespandt weren / wolten nit von stat fahren vnnd andern die auff sie geordnet auch auff halten / so er das sicht soll er denselbigen zu der seiten auß farn / vnd die andern für lassen / wirt er aber dann nach vnnd sein platz erfaren / so soll er wider einrücken / Also sol auch geschehen so Wagen die vor geordnet seind / wolten den morgen langsam auff sein / vnd vermeinten die andern müssen auff sie warten / gar nit / sonder die andern sollen im zug hinweg ziehen / so das Leger zeucht / komen sie aber nach vnd faren herfür sollen sie in jren platz einziehen wie sie geordnet sind / vnd soll der Wagenmeister von dem Feldmarschalck allen abent bescheidt holen / wie er den morgen mit den wagen ziehen soll neben oder hinder der ordnung / wirt aber der Feldmarschalck kein beuelch von dem Obersten haben / soll er den bescheit selbst von dem Obersten holen / damit er wisse die wagen zu fürn / dann so er feld haben mag / so ist der gebrauch das mann die
  cs: |-
    Vozmistr má mít poručíka {Leutenant}, který mu bude k ruce, a má zapsat všechny vozy, kolik jich na tažení {zug} je – kromě vozů dělostřelectva {Arcolorei} –, od nejvyššího velitele {Obersten} až po nejnižšího, kolik má každý vozů, na něž pobírá žold {besoldung}; a kdyby někdo měl vozy, na něž žold nepobírá, a chtěl je také mít v šiku {Ordnung} a pod ochranou, má je rovněž zapsat mezi ně. Když pak všechny vozy zapíše, má soupis přinést polnímu maršálkovi {Feldmarschalck} a poučit jej, jak je má nechat jet za sebou: přece však pojede napřed vůz nejvyššího velitele, za ním vůz polního maršálka a knížat, nato vozy úřadů a plukovníků pluků {Regiments Obersten}, jak se právě seřadí; a jak táhnou vpředu či vzadu pluky {Regiment}, tak mají i vozy táhnout a střídat se. Na to má dávat pozor a večer se ptát, v jakém pořadí táhnou pluky, a stejně tak má nechat jet i vozy. Když se ráno vyrazí, má být vozmistr spolu se svým poručíkem a služebníky předem venku na silnici, kudy vojsko vyrazí, a dohlížet, aby jeli podle pořádku. A kdyby se chtěly dopředu protlačit vozy, které dopředu nepatří, má je nechat zastavit, dokud neprojedou ty, které dopředu patří. Takto to má uvést do pořádku, pak u vozů ponechat svého poručíka, aby zůstaly v šiku, a sám jet napřed, aby je udržel na cestě tak, jak to nařídil nejvyšší velitel. Poručík má dávat dobrý pozor, zda některé vozy nejsou špatně zapřaženy, nechtějí jet z místa a zdržují i ostatní, kteří jsou zařazeni za nimi; spatří-li to, má s takovým vozem vyjet stranou a ostatní pustit před něj, a když pak vůz opět dojede a najde své místo, má se zase zařadit. Totéž se má stát, kdyby vozy určené dopředu chtěly ráno vstávat pozdě a domnívaly se, že ostatní musejí na ně čekat – vůbec ne, nýbrž ostatní mají v tažení táhnout pryč, když se ležení {Leger} zvedá; přijedou-li však později a dojedou dopředu, mají se zařadit na své místo tak, jak jsou určeny. A vozmistr má od polního maršálka každý večer vyzvednout rozkaz, jak má ráno s vozy táhnout – vedle šiku, či za šikem. Nebude-li však mít polní maršálek žádný rozkaz od nejvyššího velitele, má si pokyn vyzvednout sám od nejvyššího velitele, aby věděl, jak vozy vést. Má-li totiž volný prostor v poli, bývá zvykem, že se nechají
