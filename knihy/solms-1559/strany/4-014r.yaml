bloky:
- typ: odstavec
  de: |-
    SO will ich anfahen an diser Figuren eines Büchsen rats/ dieweil ich vil befinde das etwan Reder gemacht werden zu dem Geschütz besonder zu den grossen schweren stücken Plochwagen darauff mann die grosse stück vnd last füren muß/ Dann ich hab es wol gesehen vnd vnder handen gehabt das an den schweren stücken die speichen sich in die felgen auß vñ ein druckten wie die Reder gingen/ als nemlich vnden an dem Radt da es auff geht da druckt die Last die speichen in die felgen/ vnd oben da es ledig geht zohen sich die Speychen in die felgen auß vnd ein/ Solchs kompt von den vnuerstendigen Wagnern vnnd denen so die Reder machen lassen/ vnnd nit verstehn noch künden/ wann aber die die Reder machen lassen es verstünden dann künden sie die Redermacher vnderrichten vnd ein Patron vorstellen/ vnd jnen darauff sehen daß sie die recht machen/ vnd verwarn/ dañ es ligt nit wenig an einem gůten Rat zu machen.
  cs: |-
    Tak tedy začnu touto figurou dělového kola, poněvadž se často setkávám s tím, že se ke dělům {Geschütz}, a zvláště ke kládovým vozům {Plochwagen} pro velké těžké kusy, na nichž se musejí veliká děla a náklady vozit, zhotovují špatná kola. Sám jsem to totiž viděl a měl v rukou, že se u těžkých kusů loukoťové paprsky (špice) při otáčení kol vtlačovaly do loukotí a zase z nich vysunovaly: totiž dole u kola, kde spočívá na zemi, tlačila tíha paprsky dovnitř do loukotí, a nahoře, kde jde kolo naprázdno, se paprsky z loukotí vytahovaly tam a zpět. To pochází od nerozumných kolářů a těch, kdo dávají kola dělat a sami tomu nerozumějí ani to neumějí; kdyby tomu však rozuměli ti, kdo kola objednávají, dokázali by kolaře poučit, předložit jim vzor a dohlédnout na ně, aby je vyrobili řádně a opatřili proti poškození – neboť na zhotovení dobrého kola nemálo záleží.
- typ: odstavec
  de: |-
    Nun ist diß hieuorn stehnendes Rat frei vnder augen anzusehn auff der breiden seiten/ da mann sehen kan die breide des holtz/ fellung vnd das beschlechts/ vnnd inwendig im Rat auff den Felgen gleich wie außwendig ist/ wie die auffgeschlagen schien außwendig sehen/ vnnd wie die kurtzen schien inwendig zwischen den Speychen auch gleich den eussern Hauptschien ligen/ vnnd wie solche eussern vnd indern eisen schien mit durchgehenden negeln zu gleich gefast/ zusamen angezogen vnd verniet/ daß also beide eisene schien auß vnd inwendig die holtzfelgung begreiffen/ dieweil solch obersten vnd vndersten schien also die felgung zwischen gefast haben/ vnd hart mit durchgehenden Nietnägeln zusamen gezogen/ verniet vnnd verfast werden/ das nicht wol möglich sein kan das solches holtz am Rat künde schaden nemen/ es brechen dann die schien vnd durchgehenden Nägel vorhin/ diß ist in diser vor augen stehnender Figurn zusehen/ Deßgleichen ist auch zu sehen wie die Speychen in die felgen gesenckt oder gesetzt sind so ist die Nab zum Rat auff vnd von einander gespalden daß mann sehen kan wie die inwendig ist/ vnd wie die Speychen eingesetzt vnd abgestempt sind.
  cs: |-
    Nyní jest toto výše stojící kolo zobrazeno přímo před očima ze široké strany, takže lze vidět šířku dřeva, obvod loukotí i kování, a rovněž zevnitř na kole po loukotích tak jako zvenčí: jak vypadají přibité šíny zvenku, jak krátké šíny leží uvnitř mezi paprsky stejně jako vnější hlavní šíny, a jak jsou tyto vnější a vnitřní železné šíny zároveň sevřeny, staženy k sobě a roznýtovány průchozími hřeby, takže obě železné šíny svírají dřevěné loukotí zvenčí i zevnitř. Protože takové vrchní i spodní šíny obepínají loukotí mezi sebou a jsou pevně staženy, snýtovány a upevněny průchozími nýtovacími hřeby, jest stěží možné, aby takové dřevo na kole utrpělo škodu, ledaže by se nejprve zlomily samy šíny a průchozí hřeby; to vše jest patrné na této před očima stojící figuře. Stejně tak jest vidět, jak jsou paprsky zapuštěny a vsazeny do loukotí, a náboj kola jest podélně rozštípnut a rozložen od sebe, aby bylo vidět, jak vypadá uvnitř a jak jsou paprsky vsazeny a osazeny.
- typ: odstavec
  de: |-
    Deßgleichen zeigt die Achs an wie mann eine binden soll/ nemlich mann soll ein eisen schmiden das eines gůten Zols dick/ vnnd so breit vnnd lang wie die Achs ist/ vnd vorn da sich die Achs anhebet zurönden/ da soll das vnderlegt eisen gebrest/ nach der Achsen gebogen/ je lenger je dünner vnd geschmeidiger getrieben werden/ vnnd vornen gleich an dem lohn oder schließnagel vor das rat.
  cs: |-
    Podobně ukazuje i náprava, jak se má okovat a svázat: totiž má se vykovat železný pás dobrý palec silný a tak široký i dlouhý jako náprava; vpředu tam, kde se náprava začíná zaoblovat, má být toto podložené železo vytepáno a ohnuto podle nápravy, vykováno stále tenčeji a poddajněji, až dopředu přímo k zákolníku neboli závlačce před kolem.
