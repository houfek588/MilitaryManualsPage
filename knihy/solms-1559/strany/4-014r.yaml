bloky:
- typ: odstavec
  de: |-
    SO will ich anfahen an diser Figuren eines Büchsen rats/ dieweil ich vil befinde das etwan Reder gemacht werden zu dem Geschütz besonder zu den grossen schweren stücken Plochwagen darauff mann die grosse stück vnd last füren muß/ Dann ich hab es wol gesehen vnd vnder handen gehabt das an den schweren stücken die speichen sich in die felgen auß vnd ein druckten wie die Reder gingen/ als nemlich vnden an dem Radt da es auff geht da druckt die Last die speichen in die felgen/ vnd oben da es ledig geht zohen sich die Speychen in die felgen auß vnd ein/ Solchs kompt von den vnuerstendigen Wagnern vnnd denen so die Reder machen lassen/ vnnd nit verstehn noch künden/ wann aber die die Reder machen lassen es verstünden dann künden sie die Redermacher vnderrichten vnd ein Patron vorstellen/ vnd jnen darauff sehen daß sie die recht machen/ vnd verwarn/ dann es ligt nit wenig an einem gůten Rat zu machen.
  cs: |-
    Začnu tedy touto figurou dělového kola (*Büchsen rats*), neboť často shledávám, že se kola k dělům {Geschütz} – zvláště k velkým těžkým kusům a ke kládovým vozům {Plochwagen}, na nichž se musejí vozit velké kusy a náklady – dělají [nevhodně]. Sám jsem totiž viděl a měl v rukou, že se u těžkých kusů za jízdy paprsky (špice) vtlačovaly do loukotí a zase se z nich vysouvaly: dole u kola, kde jede po zemi, tlačila tíha paprsky do loukotí, a nahoře, kde jde kolo naprázdno, se paprsky v loukotích povytahovaly sem a tam. To pochází od nerozumných kolářů a od těch, kdo kola dávají dělat a sami tomu nerozumějí ani to neumějí. Kdyby tomu však rozuměli ti, kdo kola objednávají, mohli by koláře poučit, předložit jim vzor, dohlédnout, aby je zhotovili správně, a dobře je zajistit; na zhotovení dobrého kola totiž nemálo záleží.
- typ: odstavec
  de: |-
    Nun ist diß hieuorn stehnendes Rat frei vnder augen anzusehn auff der breiden seiten/ da mann sehen kan die breide des holtz/ fellung vnd das beschlechts/ vnnd inwendig im Rat auff den Felgen gleich wie außwendig ist/ wie die auffgeschlagen schien außwendig sehen/ vnnd wie die kurtzen schien inwendig zwischen den Speychen auch gleich den eussern Hauptschien ligen/ vnnd wie solche eussern vnd indern eisen schien mit durchgehenden negeln zu gleich gefast/ zusamen angezogen vnd verniet/ daß also beide eisene schien auß vnd inwendig die holtzfelgung begreiffen/ dieweil solch obersten vnd vndersten schien also die felgung zwischen gefast haben/ vnd hart mit durchgehenden Nietnägeln zusamen gezogen/ verniet vnnd verfast werden/ das nicht wol möglich sein kan das solches holtz am Rat künde schaden nemen/ es brechen dann die schien vnd durchgehenden Nägel vorhin/ diß ist in diser vor augen stehnender Figurn zusehen/ Deßgleichen ist auch zu sehen wie die Speychen in die felgen gesenckt oder gesetzt sind so ist die Nab zum Rat auff vnd von einander gespalden daß mann sehen kan wie die inwendig ist/ vnd wie die Speychen eingesetzt vnd abgestempt sind.
  cs: |-
    Toto výše stojící kolo je zobrazeno přímo před očima ze široké strany, takže je vidět šířka dřeva, loukotě i kování, a uvnitř kola na loukotích stejně jako zvenku: jak vypadají zvenku přibité šíny, jak uvnitř mezi paprsky leží krátké šíny podobně jako vnější hlavní šíny a jak jsou tyto vnější a vnitřní železné šíny zároveň sevřeny, staženy k sobě a snýtovány průchozími hřeby, takže obě železné šíny, vnější i vnitřní, svírají dřevěné loukotě. Protože takové horní a dolní šíny sevřou loukotě mezi sebe a jsou pevně staženy, snýtovány a spojeny průchozími nýtovacími hřeby, sotva je možné, aby dřevo kola utrpělo škodu, leda by se předtím zlomily šíny a průchozí hřeby; to vše je vidět na této figuře před očima. Stejně tak je vidět, jak jsou paprsky zapuštěny či vsazeny do loukotí; a náboj kola je rozštípnut a rozevřen, aby bylo vidět, jaký je uvnitř a jak jsou paprsky vsazeny a osazeny.
- typ: odstavec
  de: |-
    Deßgleichen zeigt die Achs an wie mann eine binden soll/ nemlich mann soll ein eisen schmiden das eines gůten Zols dick/ vnnd so breit vnnd lang wie die Achs ist/ vnd vorn da sich die Achs anhebet zurönden/ da soll das vnderlegt eisen gebrest/ nach der Achsen gebogen/ je lenger je dünner vnd geschmeidiger getrieben werden/ vnnd vornen gleich an dem lohn oder schließnagel vor das rat.
  cs: |-
    Stejně tak náprava ukazuje, jak se má okovat: má se vykovat železo dobrý palec silné a tak široké a dlouhé jako náprava; vpředu, kde se náprava začíná zaoblovat, má být toto podložené železo vyhnuto (*gebrest*), ohnuto podle nápravy a vykováno čím dál tenčí a poddajnější, až vpředu přímo k zákolníku neboli závlačce (*lohn oder schließnagel*) před kolem.
