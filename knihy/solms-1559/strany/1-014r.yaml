bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    ehrliche Kriegßgebraucht Leut / die die Kriegs sachen verstehen vnd gebraucht haben / vnd darüber gelobt vnd geschworn seind.
  cs: |-
    čestní, válkou protřelí lidé, kteří válečným věcem rozumějí, prošli jimi a jsou na ně zavázáni slibem a přísahou.
- typ: odstavec
  de: |-
    SOlches vornemen wil bei mir gar kein stat haben / auch nit anderst dann für ein finantz vnd schinderei verstanden werden / auß volgenden vrsachen. Es haben von der Römer zeit her alle Keiser vnd König / ein Kriegsordnung in dem gehalten vnd geordnet / biß auff disen Keiser Carln den fünfften / welcher auch solches biß noch erhalten / vnd gůt gefunden / daß also die Röm. Keiserlich Maiestat allen Teutschen Regimenten / einem jeden sein eigene Justitien geben / vnd für ein Regiment zu nemen geordnet / mit maß vnd Artickeln wie darüber geregiert / vnd Justitien gehalten werden soll / darüber sie dann gelobt vnd geschworn seind.
  cs: |-
    Takový záměr nemůže u mne vůbec najít místa a nelze jej chápat jinak než jako fintu {finantz} a vyděračství z těchto důvodů: Od dob Římanů zachovávali a nařizovali v této věci válečný řád všichni císaři a králové až po nynějšího císaře Karla V., který to také dosud udržel a uznal za dobré, že totiž Římské císařské Veličenstvo dalo všem německým plukům {Regimenten}, každému z nich, jeho vlastní justici {Justitien} a nařídilo jej pokládat za pluk s pravidly a články, jak se má podle nich vládnout a držet soudní správa, na což jsou také zavázáni slibem a přísahou.
- typ: odstavec
  de: |-
    Auch weiter wirt einem jeden Regiment darauff sein eigen Prouosen / Steckenknecht / Stockmeister / vnd Nachrichter geordnet vnd gehalten / vnd wirt solches besatzt mit ehrlichen Personen als Schultheisen vnd Schepffen wie sich das gebürt / vnd zu dem statlichsten / welche richten mit Ordnung nach laut jhres klaren Artickelbrieffs darüber sie alle gelobt vnd geschworn seind / vnd alle Artickel jhre geordnete vnd gemessigte straff schon haben / das es derhalben langer grosser rechtuertigung nit bedarff / sonder sie sprechen nach laut jres Artickelbrieffs / so die Keiser jnen gegeben / gůt gemacht vnd beuolhen haben. Weiter so ist zugedencken / so das solt zugelassen werden / was dise Regiment geacht sein wurden / so einem an einem solchen Gericht etwas zu erkent wirt / es wer nun was daß wöl / hoch odder schlecht handelung vnd er solt daruon zu Appelliren oder sich vor das general Gericht zuberuffen haben / wie ein Regiment regirn kündt / noch gehorsam erhalten / vnd wie verachtlich jnen das bei jhrem Kriegßuolck / vnd meniglich geachtet werden wolte / als wann sie am Gericht etwas vor recht erkenten / vnd solt ein anders gericht jn nach erkennen / als ob sie nit recht oder wol erkent hetten / vnd solten souil ehrlicher vom Adel / vnd andere dergleichen Kriegßuerstendigen gesessen sein auff jhre eidt erkent haben / vnd solt vor eim par Doctorn zu weiterem rechten erkant werden vnd dises gericht mit sampt den ehrlichen Personen also in schmach gestelt / so wirt ein jeder ehrlicher verstendiger wol bei sich selber befinden / was Meuterei / vngehorsam vnd vnwillen darauß entstehen / vnd wie die Auditores selber mit faren wurden vnd zu achten sein / was sie darmit haben wolten / das sie ein solche vntregliche last auff sich zu nemen begeren.
  cs: |-
    Dále se také každému pluku na základě toho zřizuje a vydržuje jeho vlastní profous {Prouosen}, profousův pacholek {Steckenknecht}, žalářník {Stockmeister} a kat {Nachrichter} a soud se obsazuje čestnými osobami, totiž rychtářem {Schultheisen} a přísežnými přísedícími {Schepffen}, jak se sluší a co nejdůstojněji, kteří soudí řádně podle znění svého jasného artikulního listu {Artickelbrieffs}, na nějž jsou všichni zavázáni slibem a přísahou; a všechny články už mají svůj stanovený a vyměřený trest, takže proto není zapotřebí dlouhých a obšírných právních rozprav, nýbrž soudí podle znění svého artikulního listu, jak jim jej císaři dali, schválili a přikázali. Dále je třeba uvážit, kdyby se tohle mělo připustit, zač by pak takové pluky stály: kdyby byl někomu u takového soudu {Gericht} vynesen rozsudek – ať už v jakékoli věci, závažné či drobné – a on se mohl od něho odvolat ke generálnímu soudu, jak by pak pluk mohl vládnout a udržovat poslušnost? A jak opovrženíhodnými by se zdáli před svým válečným lidem {Kriegßuolck} i před každým jiným, kdyby u soudu něco vynesli po právu a pak by je jiný soud přezkoumával, jako by nesoudili správně a dobře! A tolika čestným šlechticům i jiným podobným znalcům války, kteří zasedli a rozhodli na svou přísahu {eidt}, by měl rozsudek přehodnocovat pár doktorů a tento soud i s těmi čestnými osobami tak uvést v pohanění! Každý čestný a rozumný člověk sám u sebe snadno pozná, jaká vzpoura {Meuterei}, neposlušnost a nevole by z toho vzešly, jak by s tím sami auditoři {Auditores} pochodili a co by si o tom lidé pomysleli, proč se vlastně domáhají vzít na sebe tak nesnesitelné břímě.
- typ: odstavec
  de: |-
    Ist auch weiter zubedencken / so den Auditorn solches schon zugelassen / das jn alle last auff geladen werden wirt / was durch ein gantz
  cs: |-
    Je třeba uvážit i dále: kdyby bylo auditorům něco takového přece jen povoleno, že by jim byla naložena veškerá tíha všeho, co se v celém
