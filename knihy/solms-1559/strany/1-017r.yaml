  de: |-
    schweren durch den heiligen namen Gottes / vor dem sich alle knie im Himel / auff Erden vnnd in der Helle biegen mussen / hingelegt vnd gedempfft möcht werden. Es hat doch die Weltliche Obrigkeit die vbertretung der andern Tafeln / die doch den Menschen belangt / Als tödten / stelen / etc. zu straffen macht / vil mehr solt die Obrigkeit Gottes ehr auß Göttlichem eiffer mit ernst vertheidigen / vnnd die grausamen Gotts lestermeuler vngnediglich stopffen. Es ist auch (Gott erbarms) solch flůchen vnder das weiblich geschlecht geraten / daß durch jre Kinder / so bei jhnen am meisten erzogen werden / jhrer Mutter sprach zu lernen / mit flůchen anheben / vnd also inn der gewonheit aufferwachsen / alles gebet / gůtthat / zucht vnd ehr nit allein vergessen / sonder auch nit lernen / vnd im vngehorsam darinn sie erzogen / den Eltern mit flůchen auch begegnen. Es ist wunder wo einer der sich des Christlichen glaubens annimpt / můß ja vff das wenigst dz Vatter vnser können / darinn die erste bit / Geheiligt werde dein Name / thůn můß / ist er anders ein Christ oder ein Christin / an seinem leib / so můß er dannoch bedencken / wann sein lestermaul auffgehet / daß er Gott dem Allmechtigen seiner höchsten ehr vnd Glorien schand vnd laster anhenckt / vnd jm den Ewigen zorn vnd verdamnuß erlangt. Es wil aber disem vnrath nit wol zuhelffen sein / es heb dann die Oberkeit zum theil an jhr selbst / vnd jrem eigen Gesind an / darnach biß auff den vndersten Vndersassen mit straff zu züchtigen / ob die Gottes forcht vnd gehorsam widerumb in das gemein Volck wachsen wölle / were zu hoffen Gott der Allmechtig würde seine gnad vnd barmhertzigkeit an stat der straff gnediglich mit theilen.
  cs: |-
    přísahání skrze svaté jméno Boží, před nímž se musí sklonit každé koleno na nebi, na zemi i v pekle.[^1] Vždyť světská vrchnost má moc trestat přestoupení druhé desky, která se týká člověka, jako je zabíjení, krádež atd.; tím spíše by měla ze zbožné horlivosti vážně hájit Boží čest a nemilosrdně zacpat ústa krutým rouhačům. Takové klení se však (Bůh se smiluj!) rozšířilo i mezi ženské pohlaví, takže jejich děti, které vyrůstají většinou u nich, se mateřskou řeč začínají učit klením. Vyrůstají v tom zvyku, a tak nejenže zapomínají na každou modlitbu, dobrý skutek, kázeň a čest, ale ani se jim nenaučí, a v neposlušnosti, v níž byly vychovány, odpovídají klením i svým rodičům. Je to s podivem: kdo se hlásí ke křesťanské víře, musí přece umět přinejmenším Otčenáš,[^2] v němž pronáší první prosbu „Posvěť se jméno tvé“; je-li tedy vskutku křesťanem či křesťankou, musí přece povážit, že kdykoli se otevřou jeho rouhačská ústa, věší všemohoucímu Bohu na jeho nejvyšší čest a slávu hanu a potupu a přivolává na sebe věčný hněv a zatracení. Tomuto zlu však nepůjde dobře odpomoci, nezačne-li vrchnost zčásti sama u sebe a u své vlastní čeledi a nebude-li pak trestat a káznit až po posledního poddaného. Kdyby se bázeň Boží a poslušnost opět vzmohly mezi prostým lidem, bylo by lze doufat, že všemohoucí Bůh namísto trestu milostivě udělí svou milost a milosrdenství.
