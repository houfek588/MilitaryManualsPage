id: 6-006v
list: 6 (6. kniha)
strana: verso
sken: 504
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    würde / soll vns zustehn / volgen vnd bleiben / vnd sollen dieselben eroberten vnd behuldigten / auch die auffgenomen Stät / Schlösser / Flecken / dörffer vnd leut / nach dem sie auffgenomen sein / souil sie deren erobert weiter nit beschedigt noch gebrantschatzt werden / aber all ander gewün hab so preiß ist / sol jnn bleiben vnd keiner den andern vō seiner vertringen. Ein jeder Rotmeister oder Beuelhaber sollen sich nach des Obersten Beuelhabers anschaffen vnd gebot / mit jren leiben / pferden / wagen vnd in all andere weg gehorsamlich halten / sich willig zu vnd vō den feinden in allen sachen samentlich vnnd sonderlich gebrauchen lassen / vnd on des Obersten oder deßselben Beuelhabers zulassen vnd erlaubtnuß mit jren fanen noch Rottenweiß oder sonst in ander weg auß der Ordnung vnd leger nit reiten / noch die Wagen farn lassen / sonder ein jeder bleiben wie er verordnet ist / vnd sich in allem wie ehrlichen Kriegßleuten gegen jrem Herrn vnd Oberstern gebürt / halten.
  cs: |-
    mají připadnout, být vydány a zůstat nám. Dobytá města, zámky, městečka, vsi a lidé, kteří složili hold, jakož i ti, kdo byli [na milost] přijati, nemají být po přijetí dále poškozováni ani zatěžováni výpalným {gebrantschatzt}, pokud jich [jezdci] dobudou. Všechen ostatní zisk a majetek, který je kořistí {preiß}, má však zůstat jim, a nikdo nemá druhého z jeho [podílu] vytlačovat. Každý rotmistr {Rotmeister} nebo velitel {Beuelhaber} se má řídit nařízením a příkazem nejvyššího velitele a poslušně se mu podřizovat se svými lidmi, koňmi, vozy i ve všem ostatním; má se ochotně dát použít proti nepříteli i k ústupu od něho ve všech věcech, společně i jednotlivě. Bez svolení a dovolení plukovníka {Obersten} nebo jeho velitele nesmějí se svými korouhvemi {fanen}, po rotách {Rottenweiß} ani jinak vyjíždět ze šiku {Ordnung} a z ležení {leger}, ani odtud nechat odjíždět vozy, nýbrž každý má zůstat, kam je ustanoven, a ve všem se chovat, jak sluší čestným válečníkům {Kriegßleuten} vůči jejich pánovi a plukovníkovi.
- typ: odstavec
  de: |-
    Dieweil vilerlei Nation zu roß vnd fuß zusamen komen werden / derhalben vmb souil mehr auß geringen vrsachen sich vnwil vnd zwitracht zutragen mag / solchs zuuerhüten / soll kein Nation die ander einigerlei sachen halb / mit worten / wercken noch geberden schmehen oder stumpffiern / noch sich mit denselben von wegen des glaubens in disputation einlassen / sonder wo ein Nation gegen der ander auch beschwerde / spruch vnd forderung zuhaben vermeinde / soll daßselbig bei jrer Oberkeit gesucht vnd nach Kriegßrecht erördert vnd außgetragen werden / auch einer den andern sein gefanngne oder gewunne beut mit gwalt oder sonst nit empfrembden / sonder sollen sich jrer jrtung vnd vneinigkeit so sich derhalben zutragen möcht / durch den obersten Velthauptman jre Obersten vnd deren Ritmeister entscheiden lassen.
  cs: |-
    Protože se sejde mnoho národů na koni i pěšky a z malicherných příčin tak může tím spíše vzniknout nevole a svár, je třeba tomu předejít: žádný národ nemá druhý z jakéhokoli důvodu slovy, činy ani posunky hanět nebo tupit {stumpffiern}, ani se s ním pouštět do sporů o víru. Domnívá-li se však některý národ, že má vůči jinému stížnost, nárok či pohledávku, má to hledat u své vrchnosti {Oberkeit} a nechat to projednat a rozhodnout podle válečného práva {Kriegßrecht}. Také nikdo nemá druhému odcizovat jeho zajatce nebo získanou kořist {beut}, ať násilím, nebo jinak; spory a nesvornosti, které by z toho mohly vzniknout, mají nechat rozhodnout nejvyšším polním hejtmanem {obersten Velthauptman}, svými plukovníky a jejich rytmistry {Ritmeister}.
- typ: odstavec
  de: |-
    Item sie sollen auch in keinerlei weg ichts das wider die alte Religion oder sonst Geistliche oder Weltliche personen sei fürnemen noch einer dem andern gestaten / vnd nach dem sich hieuor zu mehrmallen in bezalungen des Krigßuolcks jrrung zutragen vō wegen der mintz / solches zuuorkomen / wöllen wir daran sein vnd beuelch thůn das hinfürt für ein jeden gulden Reinisch mintz 15 batz. oder 25 stüber in allerlei gelt oder mintz / wie an den orten da die bezalung beschehen soll / ganghafft im wert sein / bezalt werden.
  cs: |-
    Dále nemají žádným způsobem podnikat nic, co by bylo proti staré víře {alte Religion}[^1] nebo jinak proti duchovním či světským osobám, ani to jeden druhému dovolovat. A protože dříve při výplatách válečného lidu {Krigßuolcks} několikrát vznikly nesnáze kvůli minci, chceme tomu předejít, budeme na to dbát a nařizujeme, aby se napříště za každý zlatý rýnské mince {gulden Reinisch} platilo 15 bacenů {batz.} nebo 25 stüverů {stüber} v jakýchkoli penězích či minci, podle hodnoty, v jaké jsou běžné v místě, kde se má výplata konat.[^2]
- typ: odstavec
  de: |-
    Ob wir andern vnsern reisigen in jrn bestallungen oder oberlendischen Reutern Teutscher Nation etwas mehr machen würden / sol solchs gedagchten vnsers Oheims vnd Fürsten Reisigen auch gebürn / gereicht vnd bezalt werden. Vnd es soll der Musterplatz am Rein / vngefehrlich 10 oder 15 meil vnder oder oberhalb Speir / vnd der tag der musterung auffs lengst vff den 25 tag Mai / schierst künfftig sein vnd beschehen.
  cs: |-
    Kdybychom jiným svým jezdcům {reisigen} v jejich služebních listech {bestallungen} nebo hornoněmeckým {oberlendischen} jezdcům německého národa přidali něco víc, má to náležet také jezdcům našeho jmenovaného strýce {Oheims} a knížete a má jim to být vydáno a zaplaceno. Přehlídkové místo {Musterplatz} má být na Rýně, asi 10 nebo 15 mil pod Špýrem nebo nad ním, a den přehlídky nejpozději 25. května nejblíže příštího.[^3]
poznamky:
- n: 1
  text: |-
    „Stará víra“ – katolické náboženství; ustanovení mělo zabránit, aby protestantští jezdci Mořice Saského ve francouzském tažení poškozovali kostely a duchovní.
- n: 2
  text: |-
    Rýnský zlatý měl 15 bacenů (po 4 krejcarech, tedy 60 krejcarů); 25 stüverů je jeho hodnota v nizozemské minci.
- n: 3
  text: |-
    Ve skutečnosti se přehlídka konala u Frankfurtu 28.–29. května 1544 (viz [[6-titul|titulní list]] a [[6-007r|přehlídkový rejstřík]]). „Gedagchten“ je tisková chyba za „gedachten“.
