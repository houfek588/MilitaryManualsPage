bloky:
- typ: odstavec
  de: |-
    Alle befriedung / Potentaten / gewalt vnnd beuelch die Feinde betreffend / gehn allein von dem Obersten Feldhauptman auß / er gebs dann einem anderen als Leutenant / Feldmarschalck / oder andern deßhalben sonder beuelch odder gewalt / sonst soll sich des niemand anmassen.
  cs: |-
    Veškeré uzavírání míru, jednání s mocnostmi,[^1] plné moci a rozkazy týkající se nepřátel vycházejí pouze od nejvyššího polního hejtmana {Obersten Feldhauptman}, ledaže by k tomu udělil zvláštní rozkaz či plnou moc někomu jinému, jako poručíkovi {Leutenant}, polnímu maršálkovi {Feldmarschalck} či jiným; jinak si to nesmí nikdo osobovat.
- typ: odstavec
  de: |-
    Alle Kriegsleut sein schuldig / wann der feind Oberster einen Herolt / Trommeter oder Trommenschlager in das Leger schickt / zu welchem derselbigen einer am ersten kompt / daß er jn den nechsten zum Obersten füre / auch jn sonst niemand fragen / rede oder antwort geben lassen / auch keiner im Leger Brieff anneme noch auffbreche / on des Obersten wissen vnd bewilligung.
  cs: |-
    Všichni válečníci {Kriegsleut} jsou povinni, když nepřátelský nejvyšší velitel {Oberster} pošle do ležení {Leger} herolda {Herolt}, trubače {Trommeter} nebo bubeníka {Trommenschlager}, aby ten, ke komu někdo z nich přijde nejdříve, jej bez prodlení dovedl k nejvyššímu veliteli a aby se ho nikdo jiný nevyptával, nemluvil s ním ani mu nedával odpověď; rovněž nikdo v ležení nesmí přijmout ani otevřít žádný list bez vědomí a svolení nejvyššího velitele.
- typ: odstavec
  de: |-
    Es soll auch keiner / ausserhalb wissen vnd bewilligung des Obersten weder Brieff noch mündtlich botschafft / in der feinde Leger oder Besatzung schicken / welcher sich aber inn disen beiden Artickeln verwirckt / den soll der Oberst ernstlich nach gelegenheit der verhandelung straffen / angesehen / daß dem gantzen Leger so hochwichtig daran gelegen ist.
  cs: |-
    Nikdo také nesmí bez vědomí a souhlasu nejvyššího velitele posílat do nepřátelského ležení nebo posádky {Besatzung} ani dopisy, ani ústní vzkazy; kdo se však v těchto dvou článcích proviní, toho má nejvyšší velitel přísně potrestat podle závažnosti provinění, poněvadž na tom celému ležení tak velice záleží.
- typ: odstavec
  de: |-
    Der Oberst solls selbst sampt andern seinen hohen ämptern beim Kriegsuolck / wo es von nöten / anzeigen / damit ein jeder Kriegsman seiner fürgesetzten Obrigkeit gebürlichen gehorsam zu leisten wisse.
  cs: |-
    Nejvyšší velitel to má sám spolu se svými ostatními vysokými úředníky oznámit válečnému lidu {Kriegsuolck}, kde je toho zapotřebí, aby každý válečník {Kriegsman} věděl, že má své představené vrchnosti prokazovat náležitou poslušnost.
- typ: odstavec
  de: |-
    Der Kriegsherr ist dem Obersten einen geschickten Mustermeister / Zalmeister / Musterschreiber / Secretarium / Caplan / Feld vnd leib Artzt zuhalten schuldig / mit Trabanten / Tolmetschen in frembden Landen reissigen pferden / auch Kleppern / auff sein person / wirts inhalt seiner bestallung gehalten.
  cs: |-
    Válečný pán {Kriegsherr} je povinen nejvyššímu veliteli vydržovat schopného přehlídkového mistra {Mustermeister}, platebníka {Zalmeister}, přehlídkového písaře {Musterschreiber}, tajemníka, kaplana {Caplan}, polního a osobního lékaře, s drabanty {Trabanten}, tlumočníky {Tolmetschen} v cizích zemích, jezdeckými koňmi i lehčími jízdními koníky; co se týče jeho osoby, postupuje se podle znění jeho služebního listu {bestallung}.
- typ: odstavec
  de: |-
    Der Oberst soll jeder zeit seinen Herrn aller beschwerlicheit / so sich der Feinde im feld vnd vor den Besatzungen / auch seines eigen kriegsuolcks halben zutragen / fürderlich berichten / vnd darinnen ist jm anderst möglich bescheids vnd beuelchs erwarten / alßdann mag er alle handlung desto baß verantworten.
  cs: |-
    Nejvyšší velitel má vždy svému pánovi neprodleně podávat zprávu o všech nesnázích, které se přihodí ze strany nepřátel v poli i před posádkami, jakož i ze strany jeho vlastního válečného lidu, a je-li mu to jinak možné, vyčkat v tom jeho rozhodnutí a rozkazu; pak může za každé jednání tím lépe ručit.
- typ: odstavec
  de: |-
    Alles daß hieuor einem Obersten jederzeit nach gelegenheit / gegen seinen Feinden zu handeln gelegen ist / dafür soll er auch als vil jm jmmehr menschlich vnd möglich / sich selbst vnd sein Kriegsuolck verhüten / vnd es mit höchstem fleiß fürkommen / daß jm nit solches von seinem widertheil begegne / vnd daß nimmer mehr vergessen / aller gefahr die seine feind vor jm bestehn / daß er derselben widerumb von jnen gewarten müsse.
  cs: |-
    Před vším tím, co bylo výše kdykoli uvedeno, že může nejvyšší velitel podle okolností podniknout proti svým nepřátelům, před tím má také, jak jen je to v lidských silách a možné, chránit sebe i svůj válečný lid a s nejvyšší pilností předcházet tomu, aby se mu něco takového nepřihodilo od jeho protivníka; a nikdy nemá zapomínat, že veškerá nebezpečí, která hrozí jeho nepřátelům od něj, může on sám zase očekávat od nich.
- typ: odstavec
  de: |-
    Wann ein Oberster nahe bei den Feinden ligt / wie oben daruon geredt / vnd von jnen abziehen sol / wil / oder muß / bedarff er wol sampt allen seinen Kriegserfarnen vnnd verstendigen / so vil vernunfft
  cs: |-
    Leží-li nejvyšší velitel blízko nepřátel, jak bylo výše řečeno, a má, chce nebo musí od nich odtáhnout, potřebuje zajisté spolu se všemi svými války zkušenými a rozumnými muži tolik rozvahy,
poznamky:
- n: 1
  text: |-
    V originále „Potentaten“ (snad ve smyslu mocnářů a jednání s nimi, případně tisková záměna za „Patenten“ – ochranné či zplnomocňovací listiny).
