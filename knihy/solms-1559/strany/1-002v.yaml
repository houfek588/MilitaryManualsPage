- typ: odstavec
  pokracovani: true
  de: |-
    Hauptman Lucio Lucullo/ von welchem Cicero schreibt/ als er von wegen seines hohen verstands vnd fürtrefflichen redlicheit/ zu einem Obersten gegen dem großmechtigsten König Mitthridate (welchem zweivndzwentzig Königreich vnd Fürstenthumb vnderthänig warn) vom Senat zu Rom erwelet war worden/ wiewol er der zeit der Krigshändel nit sonders geübt/ vnd bei nahe gar vnerfarn gewesen/ daß er doch die zeit vber/ als er inn Asiam gegen den Feinden schiffet/ mit dem daß er die alten erfarnen Kriegsleut vnd Hauptleut/ so er stettigs bei sich gehabt/ vnd mit seinem befragen außgelernet/ vnd dann mit fleissiger lesung der Historien von den Kriegen/ vnd geschichten der Alten/ von Römern vnd andern Königen vnd Völckern/ ein solliche hohe geschicklicheit in geringer zeit bekommen vnd erlangt hab/ daß er sich in allerlei Kriegssachen/ darin es jm gar glücklich ergangen/ mit wunderwarlichen geschicklicheiten erzeigt hab/ dermassen/ daß auch sein feind/ obgenanter König Mitthridates selber (welcher doch der Kriegs händel auß stettiger vbung/ wie er dann viertzig Jar lang mit den Römern/ ehe er von jnen vberwunden worden/ gar ritterlich vnd löblich gestritten/ für andern ein sondern verstandt gehabt) jme Lucullo die ehr zugelegt vnnd gegeben/ das jhm kein geschickter noch trefflicher Hauptman noch Oberster je fürkommen/ auch jme keinen auß denen so jemals vnder allen Völckern gewesen/ wuste fürzusetzen. Dem nach Allergnedigster König thů E. König. May. ich dises mein gering werck (darauff mir gleich wol nicht wenig mühe vnd arbeit gangen) vnderthenig offeriern/ vnd daneben bitten/ E. Kön. Maiest. wöl dasselbig mehr in ansehung meines getrewen/ wolmeinenden hertzens/ so ich zu allem Osterreichischem geblüt hab/ dann des jenigen so ich hierein mag bewisen haben/ allergenedigst von mir als derselben vnderthenigsten vnd willigsten Deiner/ auff vnd annemen mir ein gnediger König vnd Herr sein vnd bleiben/ vnd mich hinfür wie biß her in genedigstem beuelch haben. Das wil vmb dieselbig E. Kön. Maiest. ich hinfüran die tag meines lebens/ vnd biß in mein ende mit verleihung Götlicher gnaden) sampt meinn Sönen/ geflissen sein vnderthenigst zuuerdienen. Datum Lich/ etc. Anno/ 1559.
  cs: |-
    hejtmanovi {Hauptman} Luciu Lucullovi. Cicero[^1] o něm píše, že když jej římský senát pro jeho vysoký rozum a znamenitou počestnost zvolil za plukovníka {Obersten} proti nejmocnějšímu králi Mithridatovi (jemuž bylo poddáno dvaadvacet království a knížectví), nebyl tehdy ve válečných věcech nijak zvlášť zběhlý a byl téměř nezkušený. Přesto za plavby do Asie proti nepřátelům získal v krátkém čase tak vysokou obratnost – tím, že se vyptáváním vyučil u starých zkušených válečníků {Kriegsleut} a hejtmanů, které měl stále při sobě, a dále pilným čtením dějin o válkách a skutcích starých, Římanů i jiných králů a národů –, že se ve všelikých válečných záležitostech, v nichž se mu vedlo velmi šťastně, osvědčil s podivuhodnou obratností. A to tak, že i jeho nepřítel, výše jmenovaný král Mithridatés sám (který přece ze stálého cviku rozuměl válečným věcem lépe než jiní, neboť po čtyřicet let velmi rytířsky a chvályhodně válčil s Římany, než jimi byl přemožen), přiznal Lucullovi tu čest, že se mu nikdy nenaskytl obratnější ani znamenitější hejtman či plukovník a že by nad něj nedovedl postavit nikoho z těch, kdo kdy byli mezi všemi národy. Proto tedy, nejmilostivější králi, Vašemu královskému Veličenstvu pokorně předkládám toto své skromné dílo (jež mě ostatně stálo nemalou námahu a práci) a zároveň prosím, aby je Vaše královské Veličenstvo ode mne jakožto svého nejpokornějšího a nejochotnějšího služebníka nejmilostivěji přijalo, a to spíše s ohledem na mé věrné a dobře míněné srdce, které chovám k veškeré rakouské krvi, než pro to, co jsem v něm snad dokázal, a aby mi bylo a zůstalo milostivým králem a pánem a i nadále jako dosud mě chovalo ve své nejmilostivější přízni. Za to se budu Vašemu královskému Veličenstvu po všechny dny svého života až do svého konce (s pomocí Boží milosti[^2]) spolu se svými syny horlivě snažit co nejpokorněji odsloužit. Dáno v Lichi atd. léta 1559.
