poznamky:
- n: 1
  text: |-
    Marcus Tullius Cicero (106–43 př. n. l.) vypráví ve spise *Lucullus* (*Academica priora*, II, 1–2), jak se Lucius Licinius Lucullus (118–56 př. n. l.) během plavby do Malé Asie roku 74 př. n. l. soustavným dotazováním zkušených vojáků a studiem dějin připravil na vrchní velení v třetí válce proti pontskému králi Mithridatovi VI. Eupatorovi (135–63 př. n. l., v tisku *Mitthridates*).
- n: 2
  text: |-
    V originále stojí osamocená pravá závorka za *gnaden)* bez levé závorky před *mit*; ponechány jsou rovněž dobové tiskové tvary *wunderwarlichen* (za *wunderbarlichen*) a *meinn Sönen* (*meinen Söhnen*).
