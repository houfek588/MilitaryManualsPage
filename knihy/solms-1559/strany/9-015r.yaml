bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    fleiß haben / das Leger eben als wol beuestiget seie an dem ort / so inn das weit Feld geht als das gegen der Stat mit gräben / Wagenburgen / Wehrn vnd andern sachen die darzů dienstlich seind.
  cs: |-
    dbát, aby ležení {Leger} bylo na straně obrácené do otevřeného pole opevněno stejně dobře jako na straně k městu, a to příkopy {gräben}, vozovými hradbami {Wagenburgen}, obrannými stavbami {Wehrn} a jinými věcmi, které k tomu slouží.
- typ: odstavec
  de: |-
    Jr solt auch leut vmb ewer Zelt ligen haben / welche helffen sollen / wann die in den Schantzen not anstieß / auch daruor sein / wann ein vneinigkeit vnder ewerm Volck wolt werden / vnnd euch beschirmen wann mann in das leger wolt fallen.
  cs: |-
    Kolem svého stanu máte mít také ležet lidi, kteří mají pomoci, kdyby se ti v šancích {Schantzen} dostali do nouze, zakročit, kdyby mezi vaším lidem chtěla vzniknout nesvornost, a chránit vás, kdyby chtěl někdo vpadnout do ležení.
- typ: odstavec
  de: |-
    Auch wann die Feind auß der Statt fallen / sollen die in den schantzen so starck sein daß sie sie allein wider hinein schlagen / vnd sollen jnen die bei euch ligen nit zu hilff kommen / es sei dann sach das es grosse not thů / vnd die ewern auß den Schantzen geschlagen würden / alßdan möcht jr jnen wol zuhilff kommen / vnnd die Feind mit gantzem gewalt mit nachrücken tapffer wann jrs kündet wider hinein jagen / doch hab ich wol gesehen / daß mann ein statt belegeret hat / das sie starck in der Stat seind gewesen / das on hilff vnd rettung / die vor der Stat die Schantzen kaum auffenthalten haben mögen / Darumb in gleichem fall soll mann fleissig sein vnnd jnen zu hilff kommen / vnd dardurch denen in der Statt brechen / daß sie nicht herauß fallen on jren mercklichen schaden / wann jr ein solliche Statt belegert / müst jr zwei oder drei Leger daruor schlagen / vnd in ein jeglichs einen Obersten verordnen / vnd das leger auff das kleinst oder engst als es möglich ist schlagen / vnd ein jeglichs wol mit Gräben vnd Wagenburgen versorgen / daß sie sich wehren künden als wann sie in einer Statt weren / vnd ein jeglicher sein Quartir / dardurch bringt jr ewer Volck in ein Ordnung als ob jr ein Veldschlacht thůn wolt / Dann wann die Feind herauß fallen / vnd schon jhren vortheil vbergeben / kündet jrs nicht wol schlagen / dieweil jr inn souil leger getheilt seind / dann ein jeglicher sein beschirmen muß / deßhalben von nöten sein wirt / die leger gantz wol befestigen wie obstehet.
  cs: |-
    Když nepřítel vyrazí z města, mají být ti v šancích tak silní, aby ho sami zahnali zpět; ti, kdo leží u vás, jim nemají jít na pomoc, leda by byla veliká nouze a vaši byli ze šancí vytlačeni. Pak jim můžete přijít na pomoc a nepřítele, dokážete-li to, celou silou a statečným pronásledováním zahnat zpět. Viděl jsem ovšem také, že při obléhání jednoho města byli obránci tak silní, že ti před městem by bez pomoci a záchrany šance sotva udrželi. V takovém případě je proto třeba pečlivě dbát a jít jim na pomoc, a tak městu zlomit sílu, aby nemohlo vyrážet bez znatelné škody. Obléháte-li takové město, musíte před ním rozbít dvě nebo tři ležení, do každého ustanovit plukovníka {Obersten} a ležení rozbít co nejmenší a nejtěsnější. Každé ležení je třeba dobře opatřit příkopy a vozovými hradbami, aby se mohli bránit, jako by byli ve městě, a každý [má mít] svůj kvartýr {Quartir}. Tím uvedete svůj lid do pořádku {Ordnung}, jako byste chtěli svést polní bitvu. Když totiž nepřítel vyrazí ven, a to i když se vzdá své výhody, nemůžete ho snadno porazit, protože jste rozděleni do tolika ležení a každý musí chránit své. Proto bude nutné ležení velmi dobře opevnit, jak stojí výše.
