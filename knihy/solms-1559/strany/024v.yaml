    Celostránkový dřevořez polního maršálka v architektonickém obloukovém rámu s rozvilinami (signováno monogramem HD – Hans Döring – a datováno 1545): vousatý jízdní velitel v plátové zbroji s rozetami na ramenou a loktech a v širokém přilbovitém klobouku se dvěma vztyčenými pštrosími pery jede doleva na silném válečném koni; v pravé ruce opírá o sedlo krátkou velitelskou hůl, u boku má dlouhý meč. Kůň má okovaný poprsník s šupinovitým chráničem, zdobenou uzdu a ozdobné řemeny na zádi s rolničkou. V pozadí zvlněná krajina se stromy, hradem a jezerem či řekou s opevněným městečkem, nad jezdcem mračna.
