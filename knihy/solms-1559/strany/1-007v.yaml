bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    zurathen/ so die Kriegßuolck haben wil vnd můß/ das die gůte Kriegs Ordnung halte/ vnd die Kriegßampter wie von alters von Teutschen hergebracht nit laß abgehen/ sonder die alle wol mit gůten verstendigen Kriegßleuten besetze/ vnnd jhren Beuelchßleuten den außtrucklichen beuelch gebe vnd auff lege/ darüber vest halte/ vnd nit einem zwei oder drei allein auffhencke/ oder verwalten laß/ sonder geb einem jeden Ampt sein sonder Person/ vnd sehe des keinen vnkosten an/ es kompt alles vierfeltig wider hierein dann die Ampter des Kriegs seind nit vergeblich geordnet vnd eingesetzt/ welche Ampter Ewer Königlich Maiestat ich hie mit geben/ wie die Regirt von den alten worden seind/ mit allem außtrucklichen bericht darinn zubefinden/ das wol die notturfft erfordern wirt/ das solche Ampter ein jedes sein eigene Person hab.
  cs: |-
    poradit, chce-li a musí-li mít válečný lid {Kriegßuolck}, než aby zachovávalo dobrý válečný řád a nenechalo zaniknout válečné úřady, jak je odedávna zavedli Němci, nýbrž je všechny dobře obsadilo dobrými a zkušenými válečníky {Kriegßleuten}. Svým velitelům {Beuelchßleuten} ať dá a uloží výslovný rozkaz a pevně na něm trvá; ať nevěší a nesvěřuje úřady jen jednomu, dvěma nebo třem, nýbrž ať dá každému úřadu jeho vlastní osobu a nehledí přitom na náklady – všechno se to čtyřnásobně vrátí, neboť válečné úřady nebyly zřízeny a ustanoveny nadarmo. Tyto úřady zde Vašemu královskému Veličenstvu předkládám tak, jak je spravovali staří, se vším výslovným výkladem, z něhož lze poznat, že potřeba jistě bude vyžadovat, aby každý takový úřad měl svou vlastní osobu.
- typ: odstavec
  de: |-
    Vnd es stehet in dem Feld dem Kriegßherrn statlich vnd wol an/ das der Kriegßherr souil Ampts person hat/ es ist auch das Kriegsvolck desto baß inn Regiment zuhalten/ dann wann nur zwen oder drei seind die es allein regiren wöllen/ den ist mann zuwider/ vnd wirt alle Meuterei vnder dem Kriegßuolck wider sie gemacht/ vnnd gehet die Regirung auch nit mit jnen furt/ sölcher haß vnd Meuterei kompt dem Herrn aller zunachtheil vnd schaden.
  cs: |-
    Válečnému pánu {Kriegßherrn} v poli velmi sluší a svědčí, má-li tolik úředních osob; také se válečný lid lépe udrží v kázni {Regiment}. Jsou-li jen dva nebo tři, kteří chtějí vládnout sami, lidé je nesnášejí, válečný lid proti nim strojí všelijakou vzpouru {Meuterei} a ani správa jim nejde od ruky; taková zášť a vzpoura přináší pánovi jen samou újmu a škodu.
- typ: odstavec
  de: |-
    Derhalben so Ewer Königlich Maiestat wurde Teutsch Kriegsvolck haben/ so tringe sie die nur wider in jhre alte Kriegs Regiment vnd Ordnung/ so seind sie gefast.
  cs: |-
    Bude-li tedy Vaše královské Veličenstvo mít německý válečný lid, ať jej jen přivede zpět k jeho staré válečné kázni a řádu – pak budou připraveni.
- typ: odstavec
  de: |-
    So dann die Teutschen also Regiment halten/ so hat mann dann die andern Nationen auch desto baß in Regiment zuhalten/ vnd zutringen/ dann mann soll durch auß gleich Regiment halten/ so ist gehorsam zuhalten/ dann wann einer soll Regiment vnd Justitien halten/ vnd leiden vnd das ander nit/ der macht vngehorsam Meuterei vnd allen vnwillen.
  cs: |-
    Budou-li tedy Němci takto držet kázeň, lze o to lépe udržet v kázni a přimět k ní i ostatní národy. Kázeň se totiž má držet veskrze stejná, pak se udrží poslušnost; má-li však jeden zachovávat a snášet kázeň a spravedlnost {Justitien} a druhý ne, vyvolává to neposlušnost, vzpouru a veškerou nevoli.
- typ: odstavec
  de: |-
    DVrchleuchtigster/ Großmechtigster Fürst vnd Herr/ Herr Philips/ König zu Engellandt/ Franckrich/ Neapolis vnd Jerusalem/ etc. Printzen in Hispanien/ Ertzhertzog zu Osterreich/ Hertzog zu Meylandt/ zu Burgundi/ etc. Allergnedigster König vnd Herr/ Es hat die Römische Keiserliche Maiestat/ Ewer Königliche Maiestat geliebter Herr vnd Vatter/ mein Allergnedigster Keiser/
  cs: |-
    Nejjasnější, nejmocnější kníže a pane, pane Filipe, králi Anglie, Francie, Neapole a Jeruzaléma atd., princi španělský, arcivévodo rakouský, vévodo milánský, burgundský atd., nejmilostivější králi a pane! Římské císařské Veličenstvo, milovaný pan otec Vašeho královského Veličenstva, můj nejmilostivější císař[^1]
poznamky:
- n: 1
  text: |-
    Císař Karel V. (1500–1558), otec krále Filipa II. Španělského, v jehož službách Reinhard ze Solmsu dlouhá léta působil jako císařský válečný rada a polní maršálek.
