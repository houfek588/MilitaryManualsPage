id: 4-008v
list: 8 (4. kniha)
strana: verso
sken: 404
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: obrazek
  soubor: drevorez-404.jpg
  popis: |-
    Zarámovaný dřevořez podél levého okraje strany (otočený o 90° vlevo) ukazující tři hlavně v podélném řezu pro názorné vysvětlení síly stěn: nahoře široký moždíř s rytým nápisem „B · MORSER · IM · GRVNT“, monogramem a letopočtem „1556“, dole dvě úzká dlouhá děla na železné a kamenné koule – jedno opatřené na zdi nápisem „A STEIN BVXEN GRVNT.“.
- typ: odstavec
  de: |-
    ZVm zwei vnd zwentzigsten/ diser offene Mortier ist mit einem stul offen gerissen/ daß daran zu sehen/ wie mann ein Büchs oder Mortier außtheilen/ vnnd wie der mit Fewerwerck geladen sein sol mit sampt einem auffstehenden stul vnd seiner beschlagener anzeigung.
  cs: |-
    Za dvaadvacáté: tento otevřený moždíř {Mortier} je i se stolicí {stul} narýsován v řezu, aby na něm bylo vidět, jak se má dělo či moždíř rozvrhnout a jak má být nabit ohňostrojem {Fewerwerck}, spolu se stojatou stolicí a vyznačením jejího kování.
- typ: odstavec
  de: |-
    Deßgleichen zwei steinbüchßlein die auch offen gerissen sein/ damit mann die dicke so sie hinden vnd vorn haben/ auch dz maß so zwischen zweien Büchssen ist/ sehen kan/ wann eine eisen vnnd die ander stein scheust/ was eine für sterck vnd dickung haben muß/ vnd solche Büchsen die offen seind/ heist inn grundt vnd maß gelegt.
  cs: |-
    Stejně tak jsou v řezu otevřena dvě kamenná dělka {steinbüchßlein}, aby byla vidět tloušťka, kterou mají vzadu i vpředu, i rozdíl míry mezi oběma děly – když jedno střílí železo a druhé kámen –, jakou pevnost a tloušťku musí každé mít. O takových dělech nakreslených v řezu se říká, že jsou „položena do základu a míry“.
- typ: odstavec
  de: |-
    Aber ein büchs die mann in die rönde vnd außwendig in das gesicht reißt/ ist auch wol inn jhrer rechten theilung vnd maß gerissen/ aber da sicht mann nit wie sie inwendig vnd dicke am zeug an allen orten ist/ aber es soll einer allzeit der ein Büchse reisset/ die zwo kern lenge darein reissen/ vnnd mag sie doch wol vber solliche zwo kern lengen rondiern mit jren abzögen odder absetzen/ wie mann das nennen will/ so behalten sie doch jre rönde vnd art/ mit sampt jren massen in dem augeschein wie vorn/ vnd ist auff beiden seiten zu sehen vnd zuuerstehen.
  cs: |-
    Naproti tomu dělo, které se kreslí oblé, v pohledu zvenčí, je sice také narýsováno ve správném rozvrhu a míře, ale není na něm vidět, jaké je uvnitř a jak silný má kov na všech místech. Kdo kreslí dělo, má však vždy dovnitř zakreslit obě podélné čáry jádra {kern}[^1]; přes tyto dvě čáry jádra pak může dělo zaoblit i s jeho odsazeními či stupni (*abzögen odder absetzen*), ať se tomu říká jakkoli. Dělo si tak v pohledu zachová svůj oblý tvar a ráz i své míry jako předtím a je to vidět a srozumitelné z obou stran.
poznamky:
- n: 1
  text: |-
    *kern lenge* – podle smyslu obě podélné čáry, jimiž se v nákresu vyznačují stěny vývrtu (*kern*, „jádro“; srov. *lingen* „čáry“ na `4-008r`). Míněn je tu vývrt hlavně, nikoli dráha střely.
