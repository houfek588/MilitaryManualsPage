bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    gestalt ist/ so kan er ein gewissen an oder vberschlag bringen/ vñ mich bedünckt daß kein ordenlicher maß auff ein person zu ordnen sein mag/ dann wann ein brot auff zwei pfundt gebachen würde/ das ist eines menschen last/ würde mann aber Brot die menge haben/ so mag einer kauffen souil er will vnd bedarff/ wo aber mangel were vnd einer person nicht mehr dann ein pfundt geben würde/ so mag mann auff zwo personen ein Brot von zweien pfunden bachen/ vnd zwo personen ein Brot geben/ das sie das theiln/ darmit sie aber gleich theilen so soll einer das brot in zwei stück schneiden/ vnnd der ander die wahl haben ein stück welches jm gefelt zunemen.
  cs: |-
    vyloženo. Tak může dojít ke spolehlivému odhadu či rozpočtu. A zdá se mi, že na jednu osobu nelze stanovit řádnější míru, než když se chléb peče na dvě libry – to je dávka pro jednoho člověka; kdyby však chleba bylo hojně, může si každý koupit, kolik chce a potřebuje. Kde by však byl nedostatek a jedné osobě by se dávala nejvýše jedna libra, lze péci na dvě osoby jeden dvoulibrový chléb a dávat dvěma osobám jeden chléb, aby se o něj rozdělily; aby pak dělily rovně, má jeden chléb rozkrojit na dva kusy a druhý má mít volbu vzít si kus, který se mu zlíbí.
- typ: odstavec
  de: |-
    Daß ich diß so gnaug vnnd inn vil maß gebracht hab/ das thů ich vmb gůts berichts willen/ vnd zu einer erinnerung denen die damit vmbgehn/ besonder der in besatzungen da mann nit zufürn kan. Mit dem fleysch vnd Fisch ist forn gnůgsamer bericht geschehen/ on not dasselbig wider zuerholen. Dise summa ist auff ein grosse summe/ wie gehört/ gemacht/ aber auff ein geringen hauffen ist es gleicher gestalt auch zutheilen/ wie hie volgt/ auff 10000. man/ oder so mann hat 100000. man/ so mag mann die halb nemen als 50000. darnach wider halb nemlich 25000. vnd also fürt.
  cs: |-
    Že jsem toto uvedl tak zevrubně a do tolika měr, činím pro dobrou zprávu a k připomínce těm, kdo s tím zacházejí, zvláště v posádkách {Besatzung}, kam nelze dovážet. O mase a rybách byla podána dostatečná zpráva vpředu, není tedy třeba to opakovat. Tento výpočet byl učiněn na veliké množství lidu, jak slyšeno; na menší houf {Hauffen} se však dělí stejným způsobem, jak níže následuje – na 10 000 mužů, anebo má-li se 100 000 mužů, lze vzít polovinu, totiž 50 000, potom opět polovinu, totiž 25 000, a tak dále.
- typ: odstavec
  de: |-
    Nun will ich ein kortze rechnung vornemen als von 100000. an biß auff 1000. vnd in 6. theil theiln/ mit zal vñ schwere der Brot maß vñ Korn/ wie hernach volgt/ Erstlich 100000. Brot wigen 1000. Centner/ bedarff mann Korn 555½. Achtel/ vnd wigt das korn 905½. centner vnd 6½. pfundt.
    Item 50000. brot wigen 500. Centner/ bedarff mañ korn 278. achtel/ vnd wigt daß korn 452½. Centner vnd 28¼. pfundt.
    Item 25000. brot wigen 250 Centner/ bedarff mann an Korn 139. achtel/ vnd wigt das korn 226¼. Centner.
    Item 10000. brot wigen 100. Centner/ bedarff mann an Korn 69½. Achtel/ vnd wigt das Korn 113. Centner vnd 12½. pfundt.
    Item 5000. Brot wigen 50 Centner/ vnd an Korn bedarff mann 34¾. Achtel/ vnd wigt das Korn 56½. Centner.
    Item 1000. Brot wigen 10. Centner/ machen an Korn 17. Achtel/ wigt das korn 28¼. Centner.
  cs: |-
    Nyní předložím krátký počet od 100 000 až do 1 000 a rozdělím jej na 6 dílů s počtem a váhou chleba, míry a žita, jak následuje:
    Předně 100 000 chlebů váží 1 000 centů {Centner}, je k tomu potřeba 555½ achtelu žita a to žito váží 905½ centu a 6½ libry {Pfundt}.
    Dále 50 000 chlebů váží 500 centů, je potřeba 278 achtelů žita a žito váží 452½ centu a 28¼ libry.
    Dále 25 000 chlebů váží 250 centů, je potřeba 139 achtelů žita a žito váží 226¼ centu.
    Dále 10 000 chlebů váží 100 centů, je potřeba 69½ achtelu žita a žito váží 113 centů a 12½ libry.
    Dále 5 000 chlebů váží 50 centů, je potřeba 34¾ achtelu žita a žito váží 56½ centu.
    Dále 1 000 chlebů váží 10 centů, což činí 17 achtelů žita a žito váží 28¼ centu.[^1]
- typ: odstavec
  de: |-
    Dieweil dannn die summa brots vff 100000. Man geordnet ist/ nemlich auff ein person den tag ein pfundt brot/ so wil ich auch daruff einer person ein halb pfundt Fleysch ordnen/ das macht 50000. pfundt auff 100000. man/ vñ wigen 500. Cent.
    Item 50000. Personen müssen haben 25000. pfundt/ wigen 250 Centner.
    Item 25000. Personen mussen 12500. pfundt haben/ die wigen 125. Centner.
  cs: |-
    Poněvadž jest tedy množství chleba vyměřeno na 100 000 mužů, totiž po jedné libře chleba na osobu na den, chci k tomu na jednu osobu určit také půl libry masa, což činí 50 000 liber na 100 000 mužů a váží 500 centů.
    Dále 50 000 osob musí mít 25 000 liber, váží 250 centů.
    Dále 25 000 osob musí mít 12 500 liber, jež váží 125 centů.
poznamky:
- n: 1
  text: |-
    Všechny zlomky (`½`, `¼`, `¾`) jsou opraveny z OCR podle skenu `465` (`C iiij`). Výpočet souhlasí u `100 000`, `50 000` a `25 000` osob při 1 centu = 100 liber (`555½ × 163 ≈ 905½` centu `6½` libry a polovina na `50 000` = `452½` centu `28¼` libry); u `10 000`, `5 000` a `1 000` však autor omylem pokračoval v půlení předešlého řádku (položky tedy fakticky odpovídají dávkám pro `12 500`, `6 250` a `3 125` osob).
