sken: 671
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Geschütz stehet/ oder villeicht an einem andern ort (dann ich euch nichts gründtlichs in dem fall rathen kan/ ich hett dann den platz gesehen) vnder die Feind herauß fallen/ darumb solt jr mit wol bedachtem mut vnder sie herauß fallen/ vnd eweren vortheil keines wegs vbergeben/ dann dardurch etwan vil Stät/ Schlösser vnd leut verloren sein worden/ darumb mein rath were daß mann gar nicht vnder die Feinde herauß fiele.
  cs: |-
    stojí děla {Geschütz}, nebo snad na jiném místě (neboť v takovém případě vám nemohu nic důkladného poradit, dokud bych to místo neviděl), vyrazit proti nepříteli. Proto máte výpady proti němu podnikat s dobrým rozmyslem a své výhody se v žádném případě nevzdávat, neboť tím už bylo ztraceno mnoho měst, zámků i lidí. Proto bych radil vůbec proti nepříteli nevyrážet.
- typ: odstavec
  de: |-
    Als vil die Wacht berört muß sie gehalten werden/ nach dem der platz fest oder nit ist/ an einem festen ort darff es nicht vil wachens/ aber an einem schwachen ort solt jr gůten fleiß darinn haben/ were auch mein meinung daß jr/ als bald die Feinde jr leger geschlagen/ ewer Volck ringweiß vmb die Maur/ auch in die Polwerck vnd Thürn losiertet/ damit sie desto ehe bereidt würden/ wolt auch keinen in die stat losiern/ dann die verordnet seind auff den platz zulauffen/ Wann jr das thůt seind jr nicht so hart beschwert/ als wann jr sie in die stat gelosiert hett/ dann sie vil ehe gerüst/ auch alle ding baß hören künden dann sonst/ dann sie von demselbigen ort nit verrücken sollen/ weder vmb essens noch trinckens willen/ dann mann jnen solchs alles dahin vberliffern soll.
  cs: |-
    Co se týče stráže {Wacht}, je třeba ji držet podle toho, zda je místo pevné, nebo ne. Na pevném místě není třeba mnoho hlídat, ale na slabém místě na to máte vynaložit velkou péči. Také jsem toho mínění, abyste svůj lid, jakmile nepřítel postaví své ležení {leger}, ubytovali dokola podél hradby a také v bolverkách {Polwerck} a věžích, aby byl tím dříve připraven. Ve městě bych neubytoval nikoho kromě těch, kdo jsou určeni k tomu, aby se [při poplachu] sběhli na prostranství. Když to uděláte, nebudete tak těžce zatíženi, jako kdybyste je ubytovali ve městě, neboť budou mnohem dříve připraveni a také všechno uslyší lépe než jinak. Nemají se totiž z toho místa hnout ani kvůli jídlu, ani kvůli pití, protože jim to všechno má být doneseno až tam.
- typ: odstavec
  de: |-
    Jr solt auch den ewern verbieten daß sie kein vngeschickte wort den feinden geben/ vnd sonst auch gentzlich kein gesprech mit jnen haben/ auch wann euch die Feinde vbelreden kein achtung darauff geben/ sonder wann sie singen vnd seiden spil vor der stat haben/ solt jr gleicher weiß in der stat auch singen/ vnd wann jrs habt/ seiden spil brauchen/ wann aber etwan ein Knecht vor der stat ein frölichs wort zu euch hinein schreiet/ möcht jr jm wol wider frölich vnd nicht anderst antworten lassen/ Vnnd vorab solt jhr achtung darauff haben/ dann offt durch böß gesprech ein murmeln vnderm Volck wirt/ vnd insonderheit wann vnuerstendigen gesellen antworten.
  cs: |-
    Máte také svým lidem zakázat, aby nepříteli neodpovídali nevhodnými slovy a vůbec s ním nevedli žádné rozhovory. Ani když vás nepřítel tupí, nemáte tomu věnovat pozornost. Když však před městem zpívají a hrají na strunné nástroje {seiden spil}, máte i ve městě stejně tak zpívat a, máte-li je, hrát na strunné nástroje. Zavolá-li na vás nějaký knecht {Knecht} před městem veselé slovo, můžete mu dát odpovědět zase vesele, a ne jinak. Na to máte především dbát, neboť zlými řečmi často vzniká mezi lidem reptání, a zvláště když odpovídají nerozumní chlapíci.
- typ: odstavec
  de: |-
    Welcher gestalt vnd massen jhr ewern Feinden wann sie schantzen/ schaden zufügen kündt/ kan ich euch nichts daruon sagen/ dann solchs geschehen muß nach gelegenheit der stat vnd der Feinde leger/ auch des Volcks vnd der Nation/ dann etlich Völcker bald gerüst vnd bereit seind/ etlich gehn gantz langsam mit der sach vmb/ etlich lassen sich bald abwenden/ etlich thůn einen grossen widerstandt/ etlich halten gůt Ordnung/ etlich halten gar kein.
  cs: |-
    Jakým způsobem a jakou měrou můžete škodit nepříteli, když buduje šance {schantzen}, vám říci nemohu, neboť se to musí řídit polohou města a nepřátelského ležení i povahou lidu a národa. Některé národy jsou totiž rychle vyzbrojené a připravené, jiné jednají velmi zvolna; některé se dají brzy odvrátit, jiné kladou velký odpor; některé zachovávají dobrý řád {Ordnung}, jiné vůbec žádný.
- typ: odstavec
  de: |-
    Jn dem fall möcht jr wol etlich verstendig knecht hinauß schicken/ die sich an nichts keren/ sonder sehen daß sie einen gůten vortheil haben/ doch wie oben gemelt/ allwegen gefehrlich ists denen in der stat herauß zufallen/ der vrsachen halben die oben erzelt seind/
  cs: |-
    V takovém případě můžete vyslat ven několik rozumných knechtů, kteří se nedají ničím svést a budou jen hledět, aby měli dobrou výhodu. Jak však bylo výše řečeno, je pro ty ve městě vždy nebezpečné podnikat výpady, a to z důvodů, které byly vyloženy výše;
