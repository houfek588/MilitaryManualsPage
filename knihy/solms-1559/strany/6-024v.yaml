poznamky:
- n: 1
  text: |-
    Údaj je v tisku zmatený (*biß auff den 5 Junij 12 tag … 17 tag*); od 24. května do 5. června je 12 dní a částka 28 zl. 12 bac. (6 × 12 × 6 bac.) počítá s 12 dny.
- n: 2
  text: |-
    Zřejmě tisková chyba za 21. května: od 21. května do 5. června je 15 dní, s nimiž počítá i částka (12 × 15 × 6 bac. = 72 zl.). Podobně u Philipse von Brendel odpovídá 15 dní spíše odjezdu 21. května než 15. května.
