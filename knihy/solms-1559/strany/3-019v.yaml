bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    eilend ab / vnd so sich die kugel in der Büchsen lenger zu seumen hat / so sie vom puluer lenger not leiden muß / ehe den sie auß kompt / das brengt ein harten schoß. Zum vierdten so kan mann alweg auffs wenigst 4. schoß thůn mit dem gůten das mann mit dem bösen puluer nit drei thůt / Warumb ? sobald als mann das gůt Puluer anzünt ist das feur von stundan hindurch biß an die kugel / vnd ein jedes körnlein von dem puluer hat sein sondere zerprestung oder zersprengung / herter denn wen es meel wer / das brengt auch ein not vnd ein gewalt zu treiben. Zum fünfften / dieweil der zeug am puluer also gůt ist / so brent er aller rein auff / vnd lest kein kat hinder jm / darumb beschleimbt er die Büchsen nit / bedarff nit vil wüschens auch groß sorg das etwo noch feur so es vnrein puluer wer / sich drinn het mögen erhalten / das an reinem zeug nit geschehen mag / Warumb ? Ein reiner zeug brent rein auff / wirt als zu einem rauch vnd geht drucken auff. Zum sechsten / dieweil ich wie gemelt mit einem wenigen puluer souil mag außrichten als mit vil bösem puluer / ist gůt zurechnen daß ich auch nit souil fürens bedarff / spart durch auß vnkosten vnd lang zeit.
  cs: |-
    prudce vznítí a shoří; a čím déle se koule {kugel} v děle {Büchsen} zdrží, tím déle musí od prachu {puluer} snášet tlak, než vyrazí ven – to přináší prudký výstřel. Za čtvrté lze dobrým prachem vždy vypálit nejméně 4 výstřely za dobu, kdy se špatným prachem nevypálí ani tři. Proč? Jakmile se dobrý prach zapálí, oheň ihned pronikne až ke kouli a každé zrníčko prachu má své vlastní roztržení a rozprasknutí, silnější než kdyby to byla prachová moučka, což také dodává prudkost a sílu k pohonu. Za páté, poněvadž je složení prachu tak dobré, vyhoří beze zbytku a nezanechá po sobě žádnou usazeninu; proto nezanáší děla, není třeba tolik vytírání ani velké obavy, že by v nich zůstal ještě nějaký žhavý zbytek, jak by se mohlo stát u nečistého prachu – u čistého prachu se to stát nemůže. Proč? Čistá směs shoří beze zbytku, promění se všechna v dým a vyletí dosucha. Za šesté, poněvadž mohu, jak bylo řečeno, s malým množstvím prachu pořídit tolik jako s velkým množstvím špatného prachu, lze snadno spočítat, že také nepotřebuji tolik povozů k dopravě, což veskrze šetří náklady i dlouhý čas.
- typ: nadpis
  uroven: 2
  de: Nachteil des bösen Puluers.
  cs: Nevýhody špatného střelného prachu.
- typ: odstavec
  de: |-
    ZVm ersten wil gesagt werden von etlichen Büchsenmeistern es soll ein vnderscheidt im Puluer gehalten werden / als nemlich vor eins Cartaunen Puluer / Schlangen puluer / hacken puluer / ist aber nichts / es sol alles ein puluer sein vnd gleich gůt / dann so der Salpeter nit kern rein geleuter / so die vnreinigkeit die noch darinn ist / dem Salpeter kein vorteil noch hilff thůt / sonder verhelt dem gůten salpeter sein krafft die er wol wircken möcht / so die vnreinigkeit nit bei jm wer vnd so der Salpeter zů kern rein geleutert ist so schwitzt er nit schlecht auch nit auß nach dem wetter / sonder bleibt trucken / so aber die vnreinigkeit als der Schalck / Saltz vnd die laugen bei jm bleibt / so ister wetterleunisch / stehts feucht / wechst zusamen / wirdt dann böß / mit seiner vnreinigkeit zu puluer gemacht mit schweffel koln vbersetzt so ist er noch einmal gedempfft zu sampt seiner vorigen vnreinigkeit / Warumb ? der salpeter hat die krafft zu wüten vnd zu treiben. Aber der schweffel helt dem salpeter das feur vnd die hitz / hilfft jm nicht mehr / dann allein gegen kelt / thůt der Salpeters anders nichts dann widerstrebt der hitz / die koln fahen vnd halten das fewer / so der Salpeter reiner vnd trückner bleiben kan / so er das feur am liebsten fecht / wie zu gedencken ist / vnd so die drei materien / wie gehört / wider ein ander seind / vnd die hitz gleich von dem fewer empfahen / so sie geschwinder von einander wöllen / daß sie das fewer alle drei bald mit
  cs: |-
    Předně chtějí někteří puškaři {Büchsenmeistern} tvrdit, že se má v prachu udržovat rozdíl, totiž prach pro kartouny {Cartaunen}, prach pro kulveriny {Schlangen} a prach pro hákovnice {hacken}; to však nestojí za nic, všechno má být jeden a týž prach stejně dobrý. Neboť není-li ledek {Salpeter} dokonale vyčištěn,[^1] nečiní nečistota, jež v něm ještě zůstává, ledku žádnou výhodu ani pomoc, nýbrž zadržuje dobrému ledku jeho sílu, kterou by jinak mohl vyvinout, kdyby v něm ta nečistota nebyla. A když je ledek dokonale vyčištěn, nerosí se ani nevykvétá podle počasí, nýbrž zůstává suchý; zůstane-li v něm však nečistota jako zemitý kal, sůl a louh, je závislý na počasí,[^2] ustavičně vlhne, speče se dohromady a zkazí se. A když je s touto svou nečistotou zpracován na prach a smíchán se sírou a uhlím, je utlumen podruhé vedle své dřívější nečistoty. Proč? Ledek má sílu běsnit a hnát, síra však ledku udržuje oheň a žár a nepomáhá mu nijak jinak než proti chladu – sám ledek pak nečiní nic jiného, než že vzdoruje žáru[^3] –, uhlí chytá a drží oheň; čím čistší a sušší může ledek zůstat, tím ochotněji přijímá oheň, jak si lze domyslet. A poněvadž tyto tři látky, jak bylo řečeno, stojí proti sobě a stejně přijmou žár z ohně, čím rychleji se od sebe chtějí rozletět, tím prudčeji všechny tři rázem s
poznamky:
- n: 1
  text: |-
    V tisku „geleuter“ (vypadlé koncové *-t* nebo *ist* místo *geleutert ist*, jako níže).
- n: 2
  text: |-
    Něm. *wetterleunisch* (*wetterlaunisch*) – proměnlivý podle počasí, tj. navlhající podle vlhkosti vzduchu.
- n: 3
  text: |-
    V tisku „der Salpeters“ (přebytečné *-s*). Výklad vychází ze soudobé teorie protikladu prvků: chladný ledek vzdoruje žáru, síra jej živí a uhlí jiskru zachytí – jejich prudké vzájemné odpuzování v žáru vyvolává výbušnou sílu.
