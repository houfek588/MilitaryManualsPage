bloky:
- typ: odstavec
  de: |-
    WIder vier stück die auch halb offen gerissen sind/ daß mañ sie auß vnd inwendig sehen kan/ sind mit langen lingen mitten im ror vber die Kugeln durchzogen deßgleichen oben vff der Büchsen gleich/ wie mann ein Büchs zum schiessen absicht deßgleichen wann mañ einer Büchsen etwas hinden oder forn auffsetzt/ zu vergleichen vom kern oder bogenschoß zu thůn/ dann mancher sich des nicht versteht/ vnd sicht hinden vnd vorn vber die Büchs hinauß/ vermeint er richt gerad darinn/ so hat er weit darüber gericht/ wie das die lingen anzeigen vnd weisen/ Dann in disen Figurn hat sich einer wol zu besehn biß er die recht versteht vnd sein Instrument darauff richten lehret/ dañ es fehlet vilen Büchsenmeistern die sich Büchsenmeister nennen/ vnd daruor außgeben/ drumb ist wol auff dise Figurn acht zu geben/ dann sie vil in sich haben/ das will ich die erkennen lassen die dise Figurn verzichten/ dann ein vngerechter kernschoß je weiter er geht je mehr er auß dem maß vngerade geht/ wie die lingen das außweisen/ da sie vber einander gehn/ besonder ist das zusehen an der kernlingen da die andern vbergehn/ das ist die kernling die gerad mitten vber beide Kugeln hinden vnd vorn geht.
  cs: |-
    Opět čtyři kusy, jež jsou také napůl otevřeně narýsovány, aby je bylo vidět zvenčí i zevnitř: jsou protaženy dlouhými přímkami uprostřed v hlavni přes obě koule {Kugeln} a stejně tak nahoře na hlavni děla – totiž jak se dělo ke střelbě zaměřuje, jakož i když se na dělo vzadu nebo vpředu něco nasadí k vyrovnání, aby se střílelo jádrovým {kern} nebo obloukovým výstřelem {bogenschoß}. Mnohý tomu totiž nerozumí, hledí vzadu i vpředu přes hlaveň ven a domnívá se, že míří rovně do cíle, a zatím namířil daleko nad něj, jak to ty čáry ukazují a prokazují. V těchto figurách si tedy každý musí vše dobře prohlédnout, dokud jim správně neporozumí a nenaučí se podle nich seřizovat svůj zaměřovací nástroj; neboť to schází mnohým puškařům {Büchsenmeistern}, kteří se puškaři nazývají a za ně se vydávají. Proto jest třeba dávat na tyto figury dobrý pozor, neboť mnoho v sobě obsahují – to ponechávám posouzení těch, kteří tato vyobrazení přehlížejí[^1] – neboť chybný jaderný výstřel {kernschoß}, čím dále letí, tím více se odchyluje z míry mimo směr, jak to dokazují přímky v místě, kde se kříží; zvláště jest to vidět na jaderné přímce (*kernlingen*), přes niž přecházejí ostatní – to jest ta jaderná čára (*kernling*), jež vede přímo středem přes obě koule vzadu i vpředu.
poznamky:
- n: 1
  text: |-
    V tisku *die dise Figurn verzichten* (zřejmě sazečská záměna za *verrichten* či *verzichten* ve smyslu „připraví / zhotoví / vypustí“ či „opomíjejí“).
