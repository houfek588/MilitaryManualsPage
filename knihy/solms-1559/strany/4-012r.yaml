list: 12 (4. kniha)
strana: recto
sken: 411
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    WIder vier stück die auch halb offen gerissen sind/ daß mann sie auß vnd inwendig sehen kan/ sind mit langen lingen mitten im ror vber die Kugeln durchzogen deßgleichen oben vff der Büchsen gleich/ wie mann ein Büchs zum schiessen absicht deßgleichen wann mann einer Büchsen etwas hinden oder forn auffsetzt/ zu vergleichen vom kern oder bogenschoß zu thůn/ dann mancher sich des nicht versteht/ vnd sicht hinden vnd vorn vber die Büchs hinauß/ vermeint er richt gerad darinn/ so hat er weit darüber gericht/ wie das die lingen anzeigen vnd weisen/ Dann in disen Figurn hat sich einer wol zu besehn biß er die recht versteht vnd sein Instrument darauff richten lehret/ dann es fehlet vilen Büchsenmeistern die sich Büchsenmeister nennen/ vnd daruor außgeben/ drumb ist wol auff dise Figurn acht zu geben/ dann sie vil in sich haben/ das will ich die erkennen lassen die dise Figurn verzichten/ dann ein vngerechter kernschoß je weiter er geht je mehr er auß dem maß vngerade geht/ wie die lingen das außweisen/ da sie vber einander gehn/ besonder ist das zusehen an der kernlingen da die andern vbergehn/ das ist die kernling die gerad mitten vber beide Kugeln hinden vnd vorn geht.
  cs: |-
    Opět čtyři kusy, které jsou také napůl otevřené v řezu, aby je bylo vidět zvenčí i zevnitř. Jsou protaženy dlouhými čarami uprostřed hlavně přes obě koule {Kugeln} a stejně tak nahoře po děle – tak, jak se dělo ke střelbě zaměřuje, i když se na dělo vzadu nebo vpředu něco nasadí, aby se vyrovnalo pro střelbu jádrovým {kern} nebo obloukovým výstřelem {bogenschoß}. Mnohý tomu totiž nerozumí: hledí vzadu i vpředu přes dělo ven a domnívá se, že míří přímo, a zatím namířil daleko nad cíl, jak to čáry ukazují a dokládají. Na těchto figurách si proto má každý vše dobře prohlédnout, dokud jim správně neporozumí a nenaučí se podle nich seřizovat svůj nástroj. To totiž chybí mnohým puškařům {Büchsenmeistern}, kteří se puškaři nazývají a za ně se vydávají. Proto je třeba na tyto figury dávat dobrý pozor, neboť mnoho v sobě skrývají – to ať posoudí ti, kdo je pomíjejí[^1]. Chybný jaderný výstřel {kernschoß} se totiž čím dál letí, tím víc se odchyluje z míry, jak to ukazují čáry tam, kde se kříží; zvlášť je to vidět na jaderné čáře (*kernlingen*), přes kterou ostatní přecházejí – to je ta jaderná čára (*kernling*), která vede přímo středem přes obě koule, vzadu i vpředu.
poznamky:
- n: 1
  text: |-
    V tisku *die dise Figurn verzichten* (zřejmě sazečská záměna za *verrichten* či *verzichten* ve smyslu „připraví / zhotoví / vypustí“ či „opomíjejí“).
