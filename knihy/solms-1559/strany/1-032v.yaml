bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vngehorsamer vnnd leichfertiger / das kompt daß die Regirung kein geordnet Regiment hat / so weiß keiner war vor er sich hüten sol / drumb kan auch keiner wol mit fugen straffen / derwegen seind geordnete Regiment vnd straffen gůt / dem Herren vnd Regiment on verdechtig / dann on Ordnung geschwindt straffen das thůt die leng kein gůt / darumb ligt vil an einem gůten Regenten.
  cs: |-
    neposlušnější a lehkomyslnější.[^1] Pochází to z toho, že vláda nemá stanovený řád,[^2] takže nikdo neví, čeho se má vystříhat, a proto také nikdo nemůže po právu trestat. Stanovený řád a tresty jsou tedy dobré a nevzbuzují podezření vůči pánovi ani vládě; neboť trestat zbrkle a bez řádu nepřinese nadlouho nic dobrého. Proto mnoho záleží na dobrém vladaři.
- typ: odstavec
  de: |-
    Ein gůter Regent soll seine Regirung dahin richten / das mann jn förcht vnd lieb / so regirt er wol / gewint ein gehorsam Volck / aber die Regirung so ein zeitlang gewesen ist / die ist fast vngleich vnd partheisch gewesen / was die auch gůt einigkeit gebracht hat ist gesehen worden / darumb so ist ein gleicheit gůt / Gott gebe was Nation es seien / so soll mann gleiche Regirung vnd Justitien durch auß haben / so wirt gehorsam durch auß gleich / darumb so kan ein Oberster nit baß / dann daß er seine Beuelchßleut der Ampter zu gleicher regirung vnd Justitien anhalt / vnd wol daruff sehe / dann warlich das Kriegsuolck ist gar vnwillig worden vber die vngleiche regirung / Darumb ist sich wol zuuermuten / wann mann wider Teutsch Kriegßleut haben wirt besonder von Reuttern / sie werden nicht so frei wie die bestallung mit sich bringt / in die Justitien / sonder derselbigen zuuor bewust / einlassen vnnd bewilligen / dann es hat wol vrsach / Darumb so hab ich solliches jrer derhalben wegerung / der mann sich versehen můß / in einen Artickel mit seiner antwort die jnen wider darauff zugeben sein wirt oder möcht / gesetzt / auff daß sie damit möchten gestilt / biß sie zum hauffen gebracht / werden / Wie dann darnach mit jhnen weitter zu handeln sein möcht / darmit sie billich zu frieden sein můsten vnd auch thůn werden / ist hieuorn in diser Kriegs beschreibung gnůg daruon angezeiget / vnd bericht gegeben worden.
  cs: |-
    Dobrý vladař má svou vládu vést tak, aby se ho lidé báli a zároveň ho milovali; pak vládne dobře a získá poslušný lid. Správa, jaká tu nějaký čas byla, však byla velmi nerovná a stranická, a jakou svornost přinesla, bylo vidět. Proto je dobrá rovnost: ať jde o kterýkoli národ, má se všude zachovávat stejná správa a spravedlnost {Justitien}, a pak bude i poslušnost všude stejná. Plukovník {Oberster} proto nemůže udělat nic lepšího, než přidržovat velitele {Beuelchßleut} v jejich úřadech ke stejné správě a spravedlnosti a dobře na to dohlížet; válečný lid {Kriegsuolck} je totiž nad nerovnou správou věru velice rozhořčen. Lze proto očekávat, že až se zase budou najímat němečtí válečníci {Kriegßleut}, zvláště jezdci {Reuttern}, nepodvolí se spravedlnosti tak bezvýhradně, jak to přináší služební list {bestallung}, ani k ní nesvolí, dokud ji předem nepoznají – a mají k tomu jistě důvod. Proto jsem toto jejich zdráhání, s nímž je třeba počítat, zahrnul do článku i s odpovědí, kterou jim na to bude nebo by bylo možné dát, aby se tím uklidnili, dokud nebudou přivedeni k vojsku. Jak s nimi pak jednat dále, aby s tím po právu museli být spokojeni a také byli, o tom bylo už dříve v tomto válečném popisu dostatečně pojednáno.
- typ: odstavec
  de: |-
    Vnd so wolt oder würde die Bestallung also gestalt vnd mit eingeleibt werden / daß die Reutter solten des Kriegßherrn Ordnung wann er die machen wirdt / gehorsam sein / geleben vnnd nach kommen / deßgleichen derselbigen gesatzten Obrigkeit vnnd Verwaltern der Justitien.
  cs: |-
    Dejme tomu, že by služební list byl sestaven tak a bylo do něj vloženo, že jezdci mají být poslušni řádu válečného pána {Kriegßherrn}, až jej vydá, žít podle něj a plnit jej, a stejně tak jím ustanovené vrchnosti a správcům spravedlnosti.
- typ: odstavec
  de: |-
    Darauff mögen die Kriegßleut wol sagen vnnd antworten / Daß sie anders nicht gesinnet seien / dann zuthůn was ehrlichen Kriegsleuten zustehe / vnd jhre Vorfaren gethan haben / dann es sei war daß die Teutschen seit der Römer zeit her / jhre Krieg allezeit nach der Römer gebrauch vnd Ordnung gefürt vnd gehalten / jre Kriegsampter besetzt vnd geregiert nach aller gůter Pollicei / mit gůten
  cs: |-
    Na to mohou válečníci právem říci a odpovědět, že nemají jiný úmysl než činit to, co přísluší čestným válečníkům a co činili jejich předkové. Je přece pravda, že Němci od dob Římanů vedli a řídili své války vždy podle římského zvyku a řádu a své válečné úřady obsazovali a spravovali podle všech pravidel dobrého veřejného řádu {Pollicei}, s dobrými a
poznamky:
- n: 1
  text: V tisku *leichfertiger* za *leichtfertiger*.
- n: 2
  text: |-
    *Regiment* zde neznamená pluk, nýbrž řád, předpis či zřízení vlády (*geordnet Regiment*).
