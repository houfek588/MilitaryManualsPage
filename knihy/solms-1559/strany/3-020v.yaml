bloky:
- typ: odstavec
  de: |-
    Zum achten was ich an bösem Puluer mehr fürn muß denn am gůten ist zu vberschlagen / denn ich achts bei mir das allein der vnkosten des fürns on andere obgemelte vrsachen / das drit theil sei / vnd geht auff das böß Puluer zu machen / on leuterung / souil arbeit als auff das gůt. Dises sind nun beiderlei tugent des gůten vnd bösen Puluers / ich wil nun mehr den verstendigen zuerkennen geben / ob die erst vrsach der Büchsenmeister / die da sagen / man soll haben Cartaunen / Schlangen / Hacken Puluer / jedes einer besonder sterck / geben dem kein ander vrsach / denn das sie sagen / mann zerbrech die stück mit dem gůten Puluer / ist nit Meisterlich daruon geredt / denn wil einer ein Büchsenmeister genent / soll er wissen was die Meisterstück darauff sind / sein Puluer kennen vnd wissen / wie er das einem jeden stück nach seiner gebör laden soll / wo er sich des nit versteht / kan ich jn bei mir kein Büchsenmeister sein lassen. Wöllen auch sagen sie können es gering von zeug setzen vnd desto baß arbeiten / so werdt es doch gůt / das ist war so mann das gůt Puluer auch wol arbeit wie sich gebürt so wirt es noch schwerer / mann sol kein arbeit am Puluer sparn / dann so mann die arbeit daran spart / muß mann es desto mehr vnd höher schetzen mit dem gůten zeug / daruon ist jr fürgeben alles nichts / dann mit dem gůten zeug ist am besten vnd fürderlichsten zuhandeln / darumb befleisse sich ein jeder der puluer machen wil / daß ers zum aller reinsten vnd besten mach / alle vnreinigkeit darauß thů / souil jm das möglich ist / vnd von der vnreinigkeit zuberichten / warumb die nicht gůt im puluer sonder besser hauß ist / dz hat disen verstandt vnd bericht.
  cs: |-
    Za osmé je třeba spočítat, oč více špatného prachu {Puluer} musím vozit než dobrého; sám soudím, že samotný náklad na dopravu – bez ostatních uvedených příčin – činí třetinu, a na výrobu špatného prachu bez čištění se vynaloží tolik práce jako na dobrý. Toto jsou tedy vlastnosti dobrého i špatného prachu; nyní chci dát rozumným lidem na uváženou první důvod puškařů {Büchsenmeister}, kteří říkají, že je třeba mít prach pro kartouny {Cartaunen}, kulveriny {Schlangen} a hákovnice {Hacken}, každý o zvláštní síle, a neuvádějí pro to jinou příčinu, než že prý se dobrým prachem kusy {stück} roztrhnou. To není mluveno mistrovsky; neboť chce-li být někdo nazýván puškařem, má vědět, jaké mistrovské kusy {Meisterstück} k tomu náležejí, znát svůj prach a vědět, jak jím má každý kus nabíjet, jak se mu patří; nerozumí-li tomu, nemohu ho u sebe ponechat jako puškaře. Chtějí také říkat, že prach mohou složit ze slabší látky a o to lépe jej zpracovat, a přece prý bude dobrý. To je pravda – ale když se i dobrý prach dobře zpracuje, jak se sluší, bude ještě silnější; na prachu se nemá šetřit prací, neboť šetří-li se na něm prací, musí se o to více a výše přidávat dobré látky. Proto jejich výmluvy nestojí za nic, neboť s dobrou látkou se pracuje nejlépe a nejprospěšněji. Ať se tedy každý, kdo chce dělat prach, snaží, aby jej udělal co nejčistší a nejlepší a odstranil z něj všechnu nečistotu, jak jen je mu to možné. A výklad o nečistotě, proč není v prachu dobrá, nýbrž je lepší venku,[^1] má tento smysl a důvod:
- typ: nadpis
  uroven: 2
  de: Von Salpeter / Schwefel vnd Koln / einem jeden insonderheit.
  cs: O ledku {Salpeter}, síře a uhlí, o každém zvlášť.
- typ: odstavec
  de: |-
    ZVndt das an / so brennt ein jedes für sich selbst allein / dieweil dann jedes vor sich selbst allein brennt / so seind sie recht / stecke dise stück Saltz / Alaun / Schalck vnd die vbrigen Laugen ein jedes allein an / wirstu sehen das keins brennen will / dieweil sie dann allein vor sich selbst nit brennen / was thůn sie dann bei dem gůten Zeug / so können sie jm auch nit helffen / sonder müssen jn auffhalten vnd verhindern / Darauß ist gůt zuuerstehn / was die vnreinigkeit im puluer bei der gůten materien verhindert vnd auffhelt / dieweil sie dann schadt / warzu lest man sie darin. Darumb weiß ich keinem Herrn zu rathen / daß er sein puluer wie vor zeiten / sonder zum aller besten / laß machen / so besteht er vnd alle die damit vmbgehn / Aber wan vngeschickt Büchsenmeister darüber komen dieß nit verstehn / wöllen die büchsen füllen wie
  cs: |-
    Zapal to[^2] – každé hoří samo o sobě; a poněvadž každé hoří samo o sobě, jsou správné. Zapal však tyto věci – sůl, kamenec, zemitou nečistotu a zbylé louhy – každou zvlášť, a uvidíš, že žádná nechce hořet. Poněvadž tedy samy o sobě nehoří, co pak dělají u dobré látky? Vždyť jí nemohou nijak pomoci, nýbrž musejí ji jen zdržovat a mařit. Z toho lze snadno pochopit, jak nečistota v prachu dobré látce překáží a zdržuje ji; poněvadž tedy škodí, k čemu ji v něm nechávat? Proto neumím žádnému pánovi radit, aby nechával dělat svůj prach po staru, nýbrž co nejlépe – tak obstojí on i všichni, kdo s ním zacházejí. Přijdou-li však k němu nešikovní puškaři, kteří tomu nerozumějí, chtějí děla {büchsen} plnit jako
poznamky:
- n: 1
  text: |-
    Něm. *hauß* – nářečně zkráceno z *herauß* (venku, pryč z prachu).
- n: 2
  text: |-
    Tj. ledek, síru a uhlí. V tisku „ZVndt“ s ozdobnou iniciálou *Z* a velkým *V*.
