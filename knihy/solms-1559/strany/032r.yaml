bloky:
- typ: odstavec
  de: |-
    FUr das erst / soll er fleissig die leger vmbreiten / oder die sein vmbreiten lassen / vnd gůt acht haben / daß niemands Prouiant vnd dergleichen für dem Leger auffkauff / sonder so dieselbigen komen würden / die vor den Legern hetten auffkaufft oder genommen / soll in sein straff verfallen sein.
  cs: |-
    Předně má pilně objíždět ležení {leger} nebo je nechávat objíždět svými lidmi a dobře dbát, aby nikdo před ležením neskupoval proviant {Prouiant} a podobné věci. Objeví-li se takoví, kdo před leženími skupovali nebo brali [zásoby], propadají jeho trestu.
- typ: odstavec
  de: |-
    Zum andern / so soll er alle Prouiant vor dem Leger annemen / vnd denen zuordnen / die beuelch haben vber die Prouiant außzutheiln / würde aber jm solcher beuelch auffgelegt / daß er die Prouiant außtheilen solt / so soll er dieselbig mit gůter Ordnung / wie die Obersten jm daß beuelhen werden / außtheilen.
  cs: |-
    Za druhé má přebírat veškerý proviant před ležením a předávat jej těm, kdo mají rozkaz proviant rozdělovat. Bude-li však rozdělování proviantu uloženo jemu, má jej rozdělovat v dobrém pořádku, jak mu plukovníci {Obersten} přikážou.
- typ: odstavec
  de: |-
    Zum dritten / so soll er grossen fleiß haben zuerfarn vnd zubesehen / was straffbar im Leger sein wirt / daß er dasselbig einem jeden Regiment darunder dieselbigen gehörn / anzeige / vnd nach jhrer gebür zustraffen beuelhen.
  cs: |-
    Za třetí má s velkou pílí zjišťovat a sledovat, co se v ležení děje trestuhodného, oznamovat to vždy tomu pluku {Regiment}, pod nějž provinilci patří, a nařídit, aby byli náležitě potrestáni.
- typ: odstavec
  de: |-
    Zum vierdten / soll er allen Prouosen fleissig darauff sehen / daß sie die Marcatanten nicht höher oder weitter schetzen noch beschweren / dann geordnet ist / solcher Schatzung soll von der Obrigkeit jhr maß gegeben werden / darob soll er hart halten / damit dasselbig nicht vberschritten werde.
  cs: |-
    Za čtvrté má pilně dohlížet na všechny profousy {Prouosen}, aby markytánům {Marcatanten} nestanovovali vyšší ceny ani je nezatěžovali víc, než je nařízeno. Míru tohoto oceňování má určit vrchnost a on má přísně dbát, aby nebyla překračována.
- typ: odstavec
  de: |-
    Zum fünfften / soll er auch mit allem ernst darob halten / ob ein Stat Fleck oder Dorff würde eingenommen / vnd begnadet / daß dieselbigen weitter nicht beschwerdt werden / dann jn darinn zugegeben wirt.
  cs: |-
    Za páté má s veškerou vážností dbát, aby město, městečko nebo ves, které byly obsazeny a vzaty na milost, nebyly zatěžovány nad to, co jim bylo přislíbeno.
- typ: odstavec
  de: |-
    Zum sechsten / soll er versehen vnnd verschaffen / daß die Leger mit dem verstorbenen viehe rein / darzů auch den Henckern besonder Leut / gehalten werden / die sollichen verstorbenen vnlust auß dem Leger füren vnd vergraben / damit die Leger durch solchen bösen geruch / nicht vergifft werden / besonder so ein Leger etwan lang an einem ort liegen můß.
  cs: |-
    Za šesté má zařídit, aby ležení byla čištěna od uhynulého dobytka a aby se k tomu katům {Henckern} vydržovali zvláštní lidé, kteří budou mršiny z ležení vyvážet a zakopávat, aby ležení nebyla takovým zápachem zamořena, zvláště když ležení musí stát delší dobu na jednom místě.
- typ: odstavec
  de: |-
    Zum siebenden / soll er die Metzler dahin halten / daß besonder plätz neben das Leger / darauff sie metzeln / vnd nicht in das leger verordnet werden / damit solcher vnlust vnd vbeller geruch auch auß dem leger komme.
  cs: |-
    Za sedmé má řezníky {Metzler} přidržet k tomu, aby porážku prováděli na zvláštních místech, která jim budou vykázána vedle ležení, a ne v ležení, aby i tato nečistota a zápach zůstaly mimo ležení.
