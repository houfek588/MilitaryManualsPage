bloky:
- typ: odstavec
  de: |-
    9 Item denen so gemelte drei Fendlein als Fenderichen beuolhen werden/ sollen zu der jrer in der Musterung gůt gemachter besoldung diß Fenderich ampts halber/ einem jeden Monatlich vier vnd zwentzig gulden bezalt werden.
  cs: |-
    9 Dále mají být těm, jimž budou jmenované tři korouhve {Fendlein} svěřeny jako korouhevníkům {Fenderichen}, vedle jejich žoldu {besoldung} uznaného při přehlídce {Musterung} vyplaceny z titulu tohoto praporečnického úřadu každému měsíčně čtyři a dvacet zlatých {gulden}.
- typ: odstavec
  de: |-
    10 Item es soll gedachtem vnserm Oheim vnd Fürsten/ auff den Hauptman dem die zwei hundert schützen beuolhen werden/ neben seiner bestümder gemusterder Besoldung dises schützen Hauptmans beuelchs halben Monatlich fünfftzig gulden entricht werden.
  cs: |-
    10 Dále má být jmenovanému našemu strýci {Oheim} a knížeti na hejtmana {Hauptman}, jemuž bude svěřeno dvě stě střelců {schützen}, vedle jeho stanoveného žoldu uznaného při přehlídce odvedeno měsíčně padesát zlatých z titulu tohoto velení hejtmana střelců.
- typ: odstavec
  de: |-
    11 Item je auff fünfftzig gemusterte gereisige Pferd ein Rotmeister gehalten/ vnnd denselben Monatlich zu seiner in der Musterung gůt gemachter besoldung des Rotmeisters ampts halben fünff vnnd zwentzig gulden bezalt werden.
  cs: |-
    11 Dále má být na každých padesát přehlédnutých jezdeckých koní vydržován jeden rotmistr {Rotmeister} a tomu má být měsíčně vedle jeho žoldu uznaného při přehlídce vyplaceno z titulu rotmistrovského úřadu pět a dvacet zlatých.
- typ: odstavec
  de: |-
    12 Item auff ein jedes hundert/ in der musterung gůt gemachten gereisigen ein Hufschmidt gehalten/ dem Monatlich zu seiner in der musterung gůt gemachter Besoldung bezalt werden sollen zwölff gulden.
  cs: |-
    12 Dále má být na každých sto jezdců uznaných při přehlídce vydržován jeden podkovář {Hufschmidt}, jemuž má být měsíčně vedle jeho žoldu uznaného při přehlídce vyplaceno dvanáct zlatých.
- typ: odstavec
  de: |-
    13 Item auff ein jeden Kürisser der wie vorsteht gerüst/ in der musterung gůt worden ist/ sollen Monatlich vier vnd zwentzig gulden vergnügt werden.
  cs: |-
    13 Dále má být na každého kyrysníka {Kürisser}, který je vyzbrojen, jak stojí výše, a byl při přehlídce uznán, měsíčně vyplaceno čtyři a dvacet zlatých.
- typ: odstavec
  de: |-
    14 Item auff ein jedes Gerüst Pferd vnd Reissigen der in der musterung passiert gůt worden/ er sei ein spiesser oder schütz sollen monatlich bezalt werden zwölff gulden.
  cs: |-
    14 Dále má být na každého zbrojného koně {Gerüst Pferd} a jezdce {Reissigen}, který při přehlídce prošel a byl uznán, ať je to kopiník {spiesser}, nebo střelec, měsíčně vyplaceno dvanáct zlatých.
- typ: odstavec
  de: |-
    15 Item alwegen vff zwölff gemusterte Pferd wie vorsteht ein Droß oder Potenpferd/ Monatlich vnderhalten vnnd zu sechs gulden bezalt werden.
  cs: |-
    15 Dále má být vždy na dvanáct přehlédnutých koní, jak stojí výše, měsíčně vydržován jeden trénní {Droß} nebo poselský kůň {Potenpferd} a placen šesti zlatými.
- typ: odstavec
  de: |-
    16 Item auff zwölff in der Musterung gůt gemachte gereissige ein Wagen der mit vier gůten Wagenpferden/ vnd aller seiner zůgehörd gůt wol gerüst/ bestelt versehen also in der musterung befunden vnnd daruff gůt gemacht vnnd passiert ist/ sollen vier vnnd zwentzig gulden Monatlich bezalt/ vnnd ob sichs begebe das einer oder mehr erlege der oder die sollen zum fürderlichsten nach andern pferden trachten vnd hierumb kein geuerde gebraucht oder gesucht/ vnd sollen auch Monatlich gemustert vnd derselben musterung gemeß bezalt werden.
  cs: |-
    16 Dále: na dvanáct jezdců uznaných při přehlídce [připadá] jeden vůz {Wagen}; je-li se čtyřmi dobrými vozovými koni {Wagenpferden} a se vším příslušenstvím dobře vystrojen, opatřen a zaopatřen, takto při přehlídce shledán, a proto uznán a propuštěn, má se za něj měsíčně platit čtyři a dvacet zlatých. A stane-li se, že jeden nebo více [koní] padne, má se ten či oni co nejrychleji postarat o jiné koně a nemá se přitom užívat ani hledat žádné lsti {geuerde}. [Vozy] mají být také každý měsíc přehlédnuty a placeny podle této přehlídky.
- typ: odstavec
  de: |-
    17 Item es soll kein Reisiges oder Droßpferd so durch die musterung geriten/ mit nichten in die Wagen gespant werden/ wo aber solchs vberfarn vnd ein oder mehr pferd hierüber in wagen betreten soll derselbig dem solchs pferd zustendig/ seine gantze besoldung dardurch verwirckt haben vnd jn die in der bezalung abgezogen werden.
  cs: |-
    17 Dále nesmí být žádný jezdecký ani trénní kůň {Droßpferd}, který prošel přehlídkou, nikterak zapřažen do vozu. Bude-li to však přestoupeno a jeden či více koní bude přesto přistiženo ve voze, propadne ten, komu takový kůň patří, tím celý svůj žold a ten mu má být při výplatě sražen.
- typ: odstavec
  de: |-
    18 Item ob einer mehr denn fünff Reisige vnd gerüst Pferde hett/ dem sollen darauff vnd darunder nit mehr als ein Bub gemustert gůt gemacht vnd bestalt werden.
  cs: |-
    18 Dále: má-li někdo více než pět jezdeckých a zbrojných koní, nemá mu být na ně a mezi nimi přehlédnut, uznán a přijat víc než jedno pachole {Bub}.
