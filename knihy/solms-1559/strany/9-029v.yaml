bloky:
- typ: odstavec
  de: |-
    Item wann ein Schiff in gefehrlichkeit ist/ daß es villeicht von einander gehet/ oder sonst sich hart an einem Felsen zerstosset oder was gefehrlicheit sein mag/ sollen sie drei schöß nach einander thůn/ vnnd einen auff den höchsten korb des Mastbaums sitzen lassen/ der die Fendlin hin vnd wider trehe/ solchs zeichen sollen sie nit geben/ sie seien dann in gefehrlichkeit.
  cs: |-
    Dále: je-li některá loď v nebezpečí, že se snad rozpadá, nebo se těžce rozbíjí o skálu, nebo je v jakémkoli jiném nebezpečí, mají třikrát po sobě vystřelit a posadit jednoho muže do nejvyššího koše stěžně, který bude praporky {Fendlin} mávat sem a tam. Toto znamení nemají dávat, leda by byli v nebezpečí.
- typ: odstavec
  de: |-
    Auch wann die nacht herbricht wann es anders gůt ist/ sollen alle ewere schiff zu euch komen/ vnd an ewren schiffen hinfarn/ euch Reuerentz thůn/ vnd dreimal nach einander schreien/ wieuil im schiff seind/ vnd wann sie trometen oder sonst seidenspil haben/ sollen sie dieselbigen blosen vnd brauchen lassen/ vnd wann sie der massen dreimal schreien/ sol ewer schiff patron jn wider antworten vnd glück wündschen/ deßgleichen auch alle die in ewerm schiff seind/ vnd ewer Trometen auffblasen vnd Heer baucken schlagen lassen/ nachuolgents sollen sie euch fragen was jr für ein wacht haben wölt/ auff solchs soll jnen der Patron den bescheit sagen/ wann solches alles geschehen solt jr die andern schiff alle/ auch die zwei ringe schifflein so voran gefarn/ keins bei grosser straff hinder euch faren lassen.
  cs: |-
    Také když se snáší noc, je-li jinak dobré počasí, mají všechny vaše lodě připlout k vám, proplout kolem vaší lodi, vzdát vám poctu {Reuerentz} a všichni, kdo jsou na lodi, mají třikrát po sobě provolat. Mají-li trubky nebo jiné hudební nástroje, mají na ně dát troubit a hrát. Když takto třikrát provolají, má jim kapitán {patron} vaší lodi odpovědět a popřát štěstí, a stejně tak všichni, kdo jsou na vaší lodi; a vy dejte troubit na své trubky a bít na válečné bubny {Heer baucken}. Potom se vás mají zeptat, jakou stráž {wacht} chcete mít, a kapitán jim na to dá odpověď. Když se to všechno stalo, máte všechny ostatní lodě, i obě lehké loďky, které pluly napřed, nechat plout za sebou; pod velkým trestem nesmí žádná z nich plout jinak.
- typ: odstavec
  de: |-
    Wann solchs alles geschehen solt jr in ewerm schiff das Vatter vnser sprechen oder singen lassen/ vnnd alle die fewer vnd Liechter so im schiff sind heissen leschen/ außgenomen etlich fürnembste leut die inn eim kemerlein wol ein brennende Ampel behalten mögen/ nachuolgents alle von euch heissen gehen/ biß an ettlich so jr bei euch behalt/ daß sie euch die zeit vertreiben/ vnd ein grosse Ampel mit fewer auff ewer schiff hencken/ damit euch die andern nachfaren künden/ vnnd sonst kein schiff fewer füren/ soll auch keiner kein fewer noch liecht auff dem schiff mehr sehen lassen.
  cs: |-
    Když se to všechno stalo, máte na své lodi dát odříkat nebo zazpívat Otčenáš a poručit zhasit všechny ohně a světla, která jsou na lodi, kromě několika nejpřednějších lidí, kteří si smějí v komůrce ponechat hořící lampu. Potom všem poručte, aby od vás odešli, kromě několika, které si necháte u sebe, aby vám krátili čas. Na svou loď dejte pověsit velkou lampu s ohněm, aby za vámi ostatní mohli plout; žádná jiná loď nemá nést oheň a nikdo už nesmí na lodi ukazovat žádný oheň ani světlo.
- typ: odstavec
  de: |-
    Doch hab ich wol gehört wann jr einen Admiral habt/ das er auch fewer der gestalt füren soll/ aber in dem fal soll er keins haben/ Jch bin auch warlich nicht mit gezogen da ein Admiral gewesen ist/ darumb ich euch nichts daruon kan sagen/ aber doch wann jr nit personlich da werd möcht er wol Fewer füren.
  cs: |-
    Slyšel jsem sice, že máte-li admirála {Admiral}, má i on takto nést oheň; v tomto případě však nemá mít žádný. Věru jsem se také nikdy neúčastnil tažení, kde by byl admirál, proto vám o tom nemohu nic říci. Nebudete-li však osobně přítomni, může oheň nést on.
- typ: odstavec
  de: |-
    Auch ist es von nöten daß jr in ewerm schiff ein grosse Ampel habet/ darinn drei oder vier liechter/ damit sie in ewerm schiff einen grossen hellen schein geben.
  cs: |-
    Je také třeba, abyste na své lodi měli velkou lampu se třemi nebo čtyřmi světly, aby na vaší lodi vydávala velkou jasnou záři.
- typ: odstavec
  de: |-
    Das ist die manier wie jr zu nachts auff dem wasser farn solt/ jetzt will ich euch sagen was die ewern für zeichen zu nachts geben sollen.
  cs: |-
    To je způsob, jak máte v noci plout po vodě. Nyní vám chci říci, jaká znamení mají vaši lidé dávat v noci.
- typ: odstavec
  de: |-
    Erstlich wann ein schiff ehe dann sonst eins das Landt befindt/ sollen sie ein brennende Latern vff ein mastbaum hencken/ vnd zwen schöß thůn. Auch wann ein schiff anfert oder sonst in einer gefehrlicheit ist/
  cs: |-
    Za prvé: objeví-li některá loď zemi dříve než ostatní, mají na stěžeň pověsit hořící lucernu a dvakrát vystřelit. Také když loď najede na mělčinu nebo je jinak v nebezpečí,
