stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    sonst wann ers alles miteinander abscheußt / biß wider geladen wirt zu schiessen / dieweil künden die in der Besatzung bawen / wie kürtzlich in einer trefflichen Besatzung geschehen / deßhalben sol dise Ordnung billich gehalten werden.
  cs: |-
    neboť vypálí-li ze všech najednou, mohou obránci {Besatzung}, než se znovu nabije, mezitím opravovat hradby, jak se nedávno stalo v jedné významné pevnosti. Proto se má tento řád po právu zachovávat.
- typ: odstavec
  de: |-
    Wann es auch zu der handlung kompt / wie inn des Feldhauptmans 54. Artickel meldung geschicht / soll der Zeugmeister / als vil möglich / in eil schiessen / doch das dardurch das geschütz nit zerspring.
  cs: |-
    Dojde-li k boji, jak se zmiňuje 54. článek o polním hejtmanovi {Feldhauptmans}, má zbrojmistr {Zeugmeister} střílet co nejrychleji, avšak tak, aby se tím děla {geschütz} neroztrhla.
- typ: odstavec
  de: |-
    Im stürmen gebürt dem Zeugmeister grossen fleiß zu brauchen / damit er die Feind von jren wehren / da sie die so stürmen sollen / mög abtreiben / er soll aber darneben auch acht haben / daß die Büchsenmeister die Freunde am sturm nit beschedigen / wie offt geschicht.
  cs: |-
    Při útoku {stürmen} má zbrojmistr vynaložit velkou píli, aby nepřátele odehnal z jejich obranných postavení, odkud by se mohli bránit útočníkům. Zároveň má dbát, aby puškaři {Büchsenmeister} při útoku nezasáhli vlastní lidi, jak se často stává.
- typ: odstavec
  de: |-
    Die Ordnung soll der Zeugmeister auch an den Schlachten halten / damit die Büchsenmeister die Freund mit jrem schiessen nit treffen.
  cs: |-
    Stejný pořádek má zbrojmistr zachovávat i v bitvách, aby puškaři svou střelbou nezasáhli vlastní lidi.
- typ: odstavec
  de: |-
    Der Zeugmeister soll auch gůt acht haben / daß die Kugeln zu jeder Büchsen gerecht nicht zu groß oder klein seien / dann sein sie zu groß so brechen die Büchsen am puluersack / oder zereissen die Stück innror daß sie vneben werden / sollichs gibt ein vngewissen schuß / so müssen die Stück mit der zeit zerspringen / sein aber die Kugeln zu klein / so zerschlahen sie die Stück vmb die meuller / vnd wann ein Zeugmeister nicht hierinn zusicht / so schiessen etlich Büchsenmeister für vnd für / achten nicht ob die Stück brechen oder gantz bleiben.
  cs: |-
    Zbrojmistr má také dobře dbát, aby koule {Kugeln} ke každému dělu měly správnou ráži a nebyly příliš velké ani malé. Jsou-li příliš velké, praskají děla v prachové komoře nebo se jim vývrt uvnitř rozdírá, až je nerovný; to dává nejistou ránu a děla musejí časem prasknout. Jsou-li naopak koule příliš malé, roztloukají děla kolem ústí. A nedohlíží-li na to zbrojmistr, pálí někteří puškaři stále dál a nedbají, zda děla prasknou, nebo zůstanou celá.
- typ: odstavec
  de: |-
    Die geschmitten Kugeln sein die aller besten / glat / vnd haben die butzen vnd ring nicht wie die gegossen.
  cs: |-
    Kované koule jsou ze všech nejlepší, hladké a nemají vtokové nálitky {butzen} ani licí švy {ring}[^1] jako koule lité.
- typ: odstavec
  de: |-
    Der Zeugmeister sol ein oder zwen Geschirrmeister haben / die vber den Wagenleuten sein die das Geschütz vnd Munition füren / denselbigen sein auch die vberigen Schauffeln / Hawen / Bickel vnd Axsen beuolhen / so die Quastitor nicht tragen / die ordnen die Wägen / welche das Geschütz vnd Munition füren.
  cs: |-
    Zbrojmistr má mít jednoho nebo dva vozmistry {Geschirrmeister}, kteří velí vozkům {Wagenleuten} vezoucím děla a munici {Munition}. Vozmistrům jsou svěřeny i zbývající lopaty, motyky, krumpáče a sekery, které nenesou šancíři {Quastitor}, a řadí vozy, které vezou děla a munici.
- typ: odstavec
  de: |-
    Der Zeugmeister soll seinem Geschütz gemeß / mit streimaß vnnd Schiffbrücken notturfftiglich verfast sein / dises soll der Oberst Feldhauptman ordnen / der weyß sein fürgenommen Zug / deßhalben kan er als der verstendig erachten / was er zuuersichtiglich bedörffen wirt.
  cs: |-
    Zbrojmistr má být podle počtu svých děl dostatečně vybaven vyměřovacím náčiním {streimaß}[^2] a lodními mosty {Schiffbrücken}. To má nařídit nejvyšší polní hejtman {Oberst Feldhauptman}, který zná zamýšlené tažení {Zug}, a může proto jako znalec uvážit, čeho bude pravděpodobně potřebovat.
- typ: odstavec
  de: |-
    Alle schurtzer / langspieß / Hellenbarten vnd handror / so der oberst Feldhauptman (dem Kriegsuolck zu roß vnd fuß gemeß) mit leßt füren / gehn bei der Munition / vnd gehörn zu der Artlerei auch harnisch.
  cs: |-
    Všechny zbrojní šorce {schurtzer}[^3], dlouhé píky {langspieß}, halapartny {Hellenbarten} a ručnice {handror}, které nejvyšší polní hejtman nechá vézt s sebou (podle počtu válečného lidu {Kriegsuolck} na koni i pěšího), jedou s municí; k dělostřelectvu {Artlerei} patří i zbroje {harnisch}.
- typ: odstavec
  de: |-
    Wann der Zeugmeister beuelch hat / was er für Geschütz nemen vnd füren soll / alßdann soll er ein verzeichnuß machen / was er für Leut / Roß / Wägen vnd Munition darzu bedarff / auch alle besoldung Particular anzeigen / damit der Kriegsherr wisse / wieuil gelts er ein Monat dem Zeugmeister vnd Artlerei zu der bezalung verordnen můß.
  cs: |-
    Jakmile zbrojmistr dostane rozkaz, jaká děla má vzít a vézt, má sestavit soupis, kolik k tomu potřebuje lidí, koní, vozů a munice, a podrobně uvést i veškerý žold {besoldung}, aby válečný pán {Kriegsherr} věděl, kolik peněz musí na měsíc vyčlenit na výplatu zbrojmistrovi a dělostřelectvu.
poznamky:
- n: 1
  text: |-
    *Ring* – licí šev (otřep) v dělicí rovině dvoudílné formy; spolu s nálitky zhoršoval přesnost střelby a poškozoval vývrt hlavně.
- n: 2
  text: |-
    V tisku (ověřeno ve skenu) *streimaß*; význam nejistý, snad *Streichmaß* (měrka, kalibr) – výklad podle glosáře.
- n: 3
  text: |-
    V tisku (ověřeno ve skenu) *schurtzer*; výklad jako zbrojní šorce je pravděpodobný, ne jistý.
