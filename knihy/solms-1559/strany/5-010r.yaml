poznamky:
- n: 1
  text: |-
    Osm dozorců (*Hutleut*) po 4 zlatých dává 32 zlatých a vypsané výdaje za svíce, papír a okov (1 zlatý = 15 bacenů) dávají 13 fl. 2 baceny, tedy dohromady 45 fl. 2 baceny (proti tištěným 45 fl. 5 bacenů); při přičtení předchozích položek (33 fl. 5 b. + 40 fl. 6 b. + 26 fl. 6 b. + 5 fl. 3 b. + 45 fl. 5 b.) však výsledné *erst geding* přesně souhlasí na `150 fl. 10 batzen`.
