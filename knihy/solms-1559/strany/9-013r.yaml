sken: 645
stav: prelozeno
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Jch hab euch auch jetzund angezeigt / was ich vermeine daß ewer Beuelchßleut inn einem Krieg thůn sollen / vnd wann ein jeglicher das jenig so er schuldig ist geflissen thůt / seind jr einer grossen arbeit entlediget / Doch hab ich zum offtermal gesehen / das durch die verechtlicheit des Herren / gůt Beuelchßleut böß seind worden / Darumb mein Rath ist jhr besichtiget selbs was euch vnd ewern Hauffen antrifft / vnnd grosse sorg haben in allem so ewer merckliche geschefft berüren / dann wann jhr ein gewonheit habt dermassen zu handeln / werden sie euch förchten vnd besorgen / daß jhr sie nicht auff einem falschen weg findet / vnd solliches jhnen inn gůten fugen auffgeben mögen / des sie sich denn hart schemen würden / So ferr jhr aber nimmermehr besichtigt / würden sie sagen / es were alles wol versehen / vnd möcht etwan nicht also sein / wann aber jhr es nicht selbst besichtigen kündet / solt jhr doch vertrawet leut schicken die es besichtigen / vnnd euch warhafftig widerumb anzeigen.
  cs: |-
    Ukázal jsem vám nyní také, co by podle mého mínění měli vaši velitelé {Beuelchßleut} ve válce dělat. Když každý pilně koná, co je povinen, jste zbaveni velké práce. Častokrát jsem však viděl, že dobří velitelé zlenivěli,[^1] protože jimi pán pohrdal. Proto vám radím, abyste sami prohlíželi všechno, co se týká vás a vašeho vojska {Hauffen}, a velmi pečovali o vše, co se dotýká vašich důležitých záležitostí. Budete-li mít ve zvyku takto jednat, budou se vás bát a starat se, abyste je nepřistihli na scestí a nemohli jim to právem vytknout, za což by se velmi styděli. Jestliže však nebudete prohlížet nikdy, budou říkat, že je o všechno dobře postaráno, a přitom tomu tak třeba nebude. Nemůžete-li to prohlédnout sami, máte aspoň poslat důvěryhodné lidi, kteří to prohlédnou a pravdivě vám to oznámí.
- typ: odstavec
  de: |-
    Dieweil auch etwan vil junger gesellen inn ewer gegenwertigkeit oder hinderrücks euch (so ferr jr das thet) sagen jhr weret forchtsam / Bit ich euch daß jhr euch solliches nicht jrren lasset / besonder das so euch zu schandt vnd laster reichen möcht / bit euch auch daß jhr nimmermehr on forcht in den gleichförmigen sachen sein wolt / aber wann jhr mit ewerm Feind schlagen wolt / alda will ich daß jhr drutzig vnd keck seind / doch der gestalt daß jhr in allweg nicht verfürt werd / vnnd so ferr jhr also handelt / werd jr ehr erlangen / da jr sonst schand vnd schmach daruon brechten wann jhr es veracht hett.
  cs: |-
    Protože vám také leckdy mnoho mladých tovaryšů ve vaší přítomnosti nebo za vašimi zády (budete-li tak jednat) bude říkat, že jste bojácní, prosím vás, abyste se tím nedali zmást, zvláště k něčemu, co by vám mohlo přinést hanbu a potupu. Prosím vás také, abyste v podobných věcech nikdy nebyli bez obezřetné bázně. Když však budete chtít svést bitvu s nepřítelem, tehdy chci, abyste byli neohrožení a smělí, ovšem tak, abyste se v ničem nedali svést. Budete-li takto jednat, získáte čest tam, kde byste si jinak odnesli hanbu a potupu, kdybyste to zanedbali.
- typ: odstavec
  de: |-
    Jch hab euch angezeigt welcher gestalt ein Heer ziehen soll / es sei in engen oder weiten landen / deßgleichen auch wie jr euch legern / vnd wie jhr euch mit der Wacht vnd ewern Beuelchßleuten halten solt / Jetzund will ich euch beschreiben wie jhr ein Statt solt belegern vnd stürmen / doch daß alles Geschütz vor gerüst sei / das kein mangel in demselbigen erfunden werde / auch Volck daß darzů dienstlich sei.
  cs: |-
    Ukázal jsem vám, jak má vojsko {Heer} táhnout, ať v úzkých, nebo v otevřených krajích, a rovněž jak se máte utábořit a jak si máte počínat se stráží {Wacht} a se svými veliteli. Nyní vám popíšu, jak máte město obléhat a útočit na ně. Předtím však musí být všechna děla {Geschütz} připravena, aby se na nich nenašel žádný nedostatek, a také lidé, kteří se k tomu hodí.
- typ: odstavec
  de: |-
    Wann jr euch für ein Stat legert / solt jhr Leut haben die die Stat jrer gelegenheit vnd die wie fest sie sei kennen / wann jhr es alles wol bedacht vnd betrachtet / vnnd jhr befündet das sie alle zusamen stimmen / solt jhr ewer oberste Hauptleut beruffen / vnnd jhnen nach der leng anzeigen / was die von der Statt gesagt / daß sie es jhnen noch einmal anzeigen / alda solt jr berathschlagen wie jr die Stat angreiffen / was jr für ein Leger schlagen wolt / eins oder mehr / doch ist mein gůt bedüncken / daß jhr zum ersten nur ein Leger schlacht nicht weit vom Thor / vmb zweier vrsachen willen / Die erst / daß jhr dardurch die in der Statt erschrecken / die ander / werdet jhr erfaren was darinn
  cs: |-
    Když se položíte před město, máte mít lidi, kteří znají jeho polohu a vědí, jak je pevné. Když jste to všechno dobře uvážili a zvážili a shledali, že se všichni shodují, máte svolat své nejvyšší hejtmany {oberste Hauptleut} a obšírně jim oznámit, co oni lidé o městě řekli, nebo ať jim to sami ještě jednou zopakují. Tam máte rokovat, jak na město zaútočíte a jaké ležení {Leger} chcete rozbít, zda jedno, nebo více. Podle mého mínění je však dobré rozbít nejprve jen jedno ležení nedaleko brány, a to ze dvou důvodů: zaprvé tím ty ve městě postrašíte, zadruhé se dozvíte, co je uvnitř
poznamky:
- n: 1
  text: Doslova „zlými se stali“ (böß seind worden), tj. zpustli, začali svou službu zanedbávat.
