bloky:
- typ: odstavec
  de: |-
    WIltu den Salpeter ziehen der der aller beste ist / so nim 20. oder 30. Häfen die aller dünsten so du sie gehaben magst / fül die mit Kalch vnd mit Saltz / geuß eins alten mans harm darinn / das es wirt als ein dünes můß / vnd vermach die Hafen eben mit einem Hafen / vnd mit gůtem Leime / den mann nennet Lutum Sapiencie / das kein pradem noch dunst mag darauß gehn / vnd setz die Hafen in einen Keller so schlecht der salpeter durch den topff auß als an einer Mauern / so schab es dann ab / vnd seudt es als vorgeschriben steht.
  cs: |-
    Chceš-li dobývat ledek {Salpeter}, který je vůbec nejlepší, vezmi 20 nebo 30 hrnců, nejtenčích, jaké můžeš sehnat, naplň je vápnem a solí a nalij do nich moč starého muže, aby z toho byla řídká kaše; hrnce nahoře přiklop druhým hrncem a utěsni dobrou hlínou, které se říká *lutum sapientiae* („hlína moudrosti“),[^1] aby z nich nemohla unikat žádná pára ani výpar. Postav hrnce do sklepa a ledek vykvete skrz stěnu hrnce ven jako na zdi; pak jej seškrab a vař, jak je předepsáno výše.
- typ: nadpis
  uroven: 3
  de: Ein ander Lere / wie du salpeter ziehen solt.
  cs: Jiné poučení, jak máš dobývat ledek
- typ: odstavec
  de: |-
    NIm sandt vnd vngeleschten Kalch gleich / vnd geuß daran mans harm / rür es vndereinander / vnnd wenn es so dick ist / als ein kinds můß so ist er gerecht / vnd vermach es denn als vorgeschriben steht / Aber also merck wenn du den salpeter seudst / so geuß das wasser in einen topff / du solt des wassers nemen / da der salpeter innen ist gesoten / geuß in einen newen dünen Hafen / daß der Hafen wol halb mit wasser sei vnd vermach jn oben wol mit einer Hafen deck / das der dampff nit auß gehn mag / vnd geuß das wasser alweg wider in den topff / vnd vermach jn gar wol / vnd wenn er wechst so schab jn ab / seud vnd leuter jhn / das ist der aller best salpeter / als er mag gesein Auch merck wenn mann salpeter leutert oder seudt / so soll mann das wasser an ein alte Mauer giessen / da der regen nit hin mag / so wechst er da alweg / aber begeuß die Mauer in einem feuchten Keller / vnd je mehr du die Mauer begeust je mehr vnd je besser der salpeter wirt.
  cs: |-
    Vezmi rovným dílem písek a nehašené vápno, přilej k tomu mužskou moč a zamíchej to dohromady; a když je to tak husté jako dětská kaše, je to správné – a uzavři to pak, jak je předepsáno výše. Pamatuj si však toto: když ledek vaříš, nalij vodu do hrnce. Máš totiž vzít vodu, v níž se ledek vařil, a nalít ji do nového tenkého hrnce, aby byl dobře do poloviny plný, a nahoře jej dobře zakrýt poklicí, aby pára nemohla unikat; tu vodu do hrnce vždy znovu dolévej a hrnec velmi dobře utěsni. Když ledek vykvete, seškrab jej, vyvař a vyčisti – to je ten nejlepší ledek, jaký může být. Také si pamatuj: když se ledek čistí nebo vaří, má se ta voda lít na starou zeď, kam nezaprší, a ledek tam bude stále růst; anebo polévej zeď ve vlhkém sklepě – čím víc zeď poléváš, tím víc a tím lepšího ledku naroste.
- typ: nadpis
  uroven: 3
  de: wiltu Salpeter machen.
  cs: Chceš-li připravit ledek
- typ: odstavec
  de: |-
    SO nim salpeter vnd leuter jhn / das saluiter drei stund geleuttert wirt / so thů es in ein Kessel / vnd schüt gebranten Wein darzů / das der Wein drei finger vber den saluiter auff gehe / vnd thů je zu eim pfundt saluiter drei lot salarmoniac / vnd ein lot Kampfer / seudt das vnd wann das ein in geseudt / thůs dann ein kleins ab dem Feur / vnd schüt den Wein in ein newen Hafen der erden sei / vnd henck den an ein seil in ein Keller der kalt ist / vnd laß vier wochen darinn also hangen / oder sechs wochen / so wirt er graw vnd wächset fast durch den Hafen das zart ist / vnnd darnach so du jhn dar gehenckst / so gang je an dem neunden tag dar vnd wesch den Hafen außwendig mit eim hasen fuß in schön Becken / vnd behalt es wol in dem schön Becken / dann es ist das best sterckest stück das jemandt erdencken mag / oder kan / vnd thů mann sein vnder 30. pfundt 1. lot doch je mehr mann sein darzů thůt / je besser es wirdt / vnd gibt mann 1. pfundt vmb 30. Gulden.
  cs: |-
    Vezmi ledek a vyčisti jej, aby byl sanýtr (*saluiter*) třikrát přečištěn; pak jej dej do kotle a přilej k němu pálené víno, aby víno sahalo tři prsty nad sanýtr, a na každou libru {pfundt} sanýtru přidej tři loty {lot} salmiaku (*salarmoniac*) a jeden lot kafru (*Kampfer*). Vař to, a když se to zčásti vyvaří,[^2] odstav to na chvilku z ohně, slij víno do nového hrnce, jenž je hliněný, a zavěs jej na provaze do studeného sklepa. Nech jej tam takto viset čtyři týdny nebo šest týdnů; ledek zešediví a skrze hrnec silně proroste jemný výkvět. A když jsi jej tam zavěsil, choď k němu vždy devátého dne, smeť zaječí packou [výkvět z] hrnce zvenčí do čisté mísy a v té míse to dobře uchovej, neboť to je nejlepší a nejsilnější přísada, jakou si kdo může či dokáže vymyslet. Přidává se jí 1 lot na 30 liber [prachu], avšak čím více se jí přidá, tím lepší bude; a prodává se 1 libra za 30 zlatých {Gulden}.[^3]
poznamky:
- n: 1
  text: |-
    *Lutum sapientiae* („hlína moudrosti“) – alchymistický tmel z jílu, plev či střihové vlny, koňského trusu, popela a vaječného bílku či slané vody k neprodyšnému utěsňování nádob.
- n: 2
  text: |-
    V tisku *wañ das ein in geseudt* – obměna pasáže ze strany `3-063v` (*wenn das den vierdtentheil ein geseudt*, „když se vyvaří čtvrtina“).
- n: 3
  text: |-
    Tento odstavec je mírně obměněnou variantou receptu ze strany `3-063v` (zde se uvádějí 3 loty salmiaku a 1 lot kafru na libru sanýtru a doba zavěšení 4–6 týdnů oproti 3 librám salmiaku, 2 lotům kafru a 3 týdnům na `3-063v`).
