  de: letsten Artickel / welche meinung jn darinnen am aller besten gefellt.
  cs: |-
    posledního článku {Artickel}, podle toho, které mínění se mu v něm nejvíce zamlouvá.
- typ: odstavec
  de: |-
    Welcher Hauptman ein Schlachtordnung mit seinen Reuttern will machen / der soll den Fendrich heissen auff ein ort rücken / vnd die jenigen alle die er auff beide seitten beneben einordnen will / zu jm lassen halten / dann der Hauptman soll auch vorhin seine Reutter vberschlahen haben / daß er grundtlich wisse wie vil er in ein glied ordnen soll / damit die ordnung schier vnd doch nit gar gefiert sondern ein wenig lenger werde dann sie breidt ist / vnd also anfahen / Er soll einn erfarnen geschickten Kriegsman der wol gerüst vnd beritten seie / nemen / denselben im namen Gott des Vatters auff den platz heissen rücken / vnd jme den spitz zufüren beuelhen / darnach jm auff beide seitten vier / fünff / sechs oder siben / als vil er an sein Reuttern gehaben mag ordnen / das dannoch die ordnung / wie erst gemelt / ein wenig lenger wann sie breidt ist werde / das spitz beuelhen geschicht darumb / wann mann in der breiden ordnung reit / vnd sich in einer enge theilen můß / vnd wider auff ein weitte kommen / wil etwan ein jeder die vordersten sollen jme nach reitten / wo dann der / der spitz ist reit / sollen sich seine neben geordneden auff beide seiten wider an jhn schmücken / darmit rückt ein jeder wie es gehört / hinder den andern / vnd wirt die ordnung wider gantz. Zum andern ob der Hauptman die sach in der handlung nit als wol / wie die notturfft erfordert / verstünde / das der spitz wist / wie er treffen / retten wehren / halten oder wenden solt / volgents sol der Hauptman wider einn gerüsten vnd beritten nemen / jn im namen Gott des Sons heissen zu nechst hindern spitz rücken / vnd demselben auff jede seitten souil als dem spitz ordnen / den dritten in dem namen Gott des Heiligen Geists heissen hinder den rücken / der gleich hinder dem spitz helt / zum vierdten im namen der heiligen Drifeltigkeit / vnd alles himelischen Heers / heissen gleich hinder die vordersten drei in der mit rücken / Vnd dergestalt die gantz Schlachtordnung biß zu ende / machen. Etlich Hauptleut wöllen die Ordnung mit Edelleuten beschliessen / so sein etlich darwider / vermeinen / mann soll die vom Adell nur zu vorderst ordnen / wann mann souil Edelleut hett / das es gesein möcht / wo nicht / nimpt mann wolberiten vnd gerüste knecht / wann dann ein Hauptman die Ordnung beschlossen hat / sol er fleissig auffmercken / wo sich der Fendrich mit seinem gliede am aller besten in die Ordnung wölle fügen / da soll er jhn zwischen einfüren / doch nicht vber das fünffte gliede hinhinder / Hat der Hauptman Grauen vnd Herren vnder jhm / die soll er neben den Fendrich ordnen / vnd das von der ehrlichen Stant wegen / wann aber der
  cs: |-
    Který hejtman {Hauptman} chce se svými jezdci {Reuttern} sestavit bitevní šik {Schlachtordnung}, má kázat praporečníkovi {Fendrich}, aby vyjel stranou, a všechny ty, které chce po obou stranách vedle něho zařadit, ať nechá stát u něj. Hejtman si totiž má své jezdce už předem spočítat, aby bezpečně věděl, kolik jich má zařadit do jedné řady {glied}, aby šik byl téměř, avšak ne zcela čtvercový, nýbrž o něco delší než širší; a začít má takto: má vzít zkušeného, schopného válečníka {Kriegsman}, jenž je dobře vyzbrojen a má dobrého koně, ve jménu Boha Otce mu rozkázat vyjet na místo a pověřit jej vedením špice {spitz}. Nato mu má po obou stranách zařadit čtyři, pět, šest nebo sedm mužů, kolik jich jen ze svých jezdců může mít, tak aby šik, jak právě řečeno, byl přece jen o něco delší než širší. Pověření špice se děje proto, že když se jede v širokém šiku a je třeba se v úžině rozdělit a pak se opět vyjede na prostranství, chce někdy každý, aby ti v čele jeli za ním; kam však jede ten, kdo tvoří špici, tam se k němu mají ti, kteří jsou zařazeni vedle něho na obou stranách, opět přimknout, čímž se každý zařadí, jak náleží, za druhého a šik je opět celý. Za druhé, kdyby hejtman v boji situaci nerozuměl tak dobře, jak vyžaduje potřeba, aby špice věděla, jak má udeřit, vyprostit, bránit se, zastavit nebo se obrátit. Dále má hejtman vzít opět jednoho vyzbrojeného jezdce na dobrém koni, ve jménu Boha Syna mu rozkázat postoupit těsně za špici a přidělit mu na každou stranu tolik mužů jako špici; třetímu má ve jménu Boha Ducha svatého rozkázat postoupit za toho, kdo stojí přímo za špicí; čtvrtému má ve jménu svaté Trojice a všeho nebeského vojska rozkázat postoupit uprostřed přímo za ty přední tři – a tímto způsobem sestavit celý bitevní šik až do konce. Někteří hejtmani chtějí šik uzavřít vzadu šlechtici, jiní jsou však proti tomu a míní, že se šlechtici mají řadit jen dopředu, pokud jich je tolik, aby to šlo; kde ne, berou se dobře vsedlí a vyzbrojení jízdní čeledíni {knecht}. Když pak hejtman šik uzavře, má bedlivě dbát na to, kde se praporečník se svou řadou do šiku nejlépe hodí; tam jej má vsunout dovnitř, avšak ne hlouběji než za pátou řadu. Má-li hejtman pod sebou hrabata a pány, má je zařadit vedle praporečníka, a to kvůli jejich čestnému stavu; kdyby však
