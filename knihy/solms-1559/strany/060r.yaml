bloky:
- typ: odstavec
  pokracovani: true
  de: letsten Artickel / welche meinung jn darinnen am aller besten gefellt.
  cs: |-
    v posledním článku {Artickel} – podle toho, který způsob se mu tam zamlouvá nejvíce.
- typ: odstavec
  de: |-
    Welcher Hauptman ein Schlachtordnung mit seinen Reutern will machen / der soll den Fendrich heissen auff ein ort rücken / vnd die jenigen alle die er auff beide seitten beneben einordnen will / zu jm lassen halten / dann der Hauptman soll auch vorhin seine Reutter vberschlahen haben / daß er gründtlich wisse wie vil er in ein glied ordnen soll / damit die ordnung schier vnd doch nit gar gefiert sondern ein wenig lenger werde dann sie bereidt ist / vnd also anfahen / Er soll einn erfarnen geschickten Kriegsman der wol gerüst vnd beritten seie / neben denselben im namen Gott des Vatters auff den platz heissen rücken / vnd jme den spitz zufüren beuelhen / darnach jm auff beide seitten vier / fünff / sechs oder siben / als vil er an sein Reuttern gehaben mag ordnen / das dannoch die ordnung / wie erst gemelt / ein wenig lenger wann sie breidt ist werde / das spitz beuelhen geschicht darumb / wann mann in der breiden ordnung reit / vnd sich in einer enge theilen můß / vnd wider auff ein weitte kommen / wil etwan ein jeder die vordersten sollen jme nach reitten / wo dann der / der spitz ist reit / sollen sich seine neben geordneden auff beide seiten wider an jhn schmücken / darmit rückt ein jeder wie es gehört / hinder den andern / vnd wirt die ordnung wider gantz. Zum andern ob der Hauptman die sach in der handlung nit als wol / wie die notturfft erfordert / verstünde / das der spitz wist / wie er treffen / retten wehren / halten oder wenden solt / volgents sol der Hauptman wider einn gerüsten vnd beritten nemen / jn im namen Gott des Sons heissen zu nechst hindern spitz rücken / vnd demselben auff jede seitten souil als dem spitz ordnen / den dritten in dem namen Gott des Heiligen Geists heissen hinder den rücken / der gleich hinder dem spitz helt / zum vierdten im namen der heiligen Drifeltigkeit / vnd alles himelischen Heers / heissen gleich hinder die vordersten drei in der mit rücken / Vnd dergestalt die gantz Schlachtordnung biß zu ende / machen. Etlich Hauptleut wöllen die Ordnung mit Edelleuten beschliessen / so sein etlich darwider / vermeinen / mann soll die vom Adell nur zu vorderst ordnen / wann mann souil Edelleut hett / das es gesein möcht / wo nicht / nimpt mann wolberiten vnd gerüste knecht / wann dann ein Hauptman die Ordnung beschlossen hat / sol er fleissig auffmercken / wo sich der Fendrich mit seinem gliede am aller besten in die Ordnung wölle fügen / da soll er jhn zwischen einfüren / doch nicht vber das fünffte gliede hinhinder / Hat der Hauptman Grauen vnd Herren vnder jhm / die soll er neben den Fendrich ordnen / vnd das von der ehrlichen Stant wegen / wann aber der
  cs: |-
    Který hejtman {Hauptman} chce se svými jezdci {Reutern} sestavit bitevní šik {Schlachtordnung}, má praporečníkovi {Fendrich} rozkázat, aby vyjel na určité místo, a všechny, které chce zařadit po obou stranách vedle něho, nechat zastavit u něj. Hejtman si totiž má předem spočítat své jezdce, aby přesně věděl, kolik jich má zařadit do jedné řady {glied}, tak aby šik byl téměř, avšak ne zcela čtvercový, nýbrž o něco delší než širší[^1]. Začít má takto: vezme[^2] zkušeného, schopného válečníka {Kriegsman}, který je dobře vyzbrojen a má dobrého koně, ve jménu Boha Otce mu rozkáže vyjet na místo a pověří jej vedením špice {spitz}. Potom k němu po obou stranách zařadí čtyři, pět, šest nebo sedm mužů, kolik jich jen ze svých jezdců může mít, tak aby šik, jak právě řečeno, byl přece jen o něco delší než širší. Pověření špice se děje proto, že když se jede v širokém šiku a v úžině je třeba se rozdělit a pak se opět vyjede na prostranství, chce někdy každý, aby ti přední jeli za ním. Kam však jede ten, kdo tvoří špici, tam se k němu mají opět přimknout ti, kdo jsou zařazeni vedle něho po obou stranách; tak se každý zařadí, jak náleží, za druhého a šik je opět celý. Za druhé proto, aby špice věděla, jak má udeřit, vyprostit [své], bránit se, zastavit nebo se obrátit, kdyby hejtman v boji situaci nerozuměl tak dobře, jak je zapotřebí. Dále má hejtman opět vzít jednoho vyzbrojeného jezdce na dobrém koni, ve jménu Boha Syna mu rozkázat postoupit těsně za špici a přidělit mu na každou stranu tolik mužů jako špici. Třetímu má ve jménu Boha Ducha svatého rozkázat postoupit za toho, kdo stojí přímo za špicí, čtvrtému ve jménu svaté Trojice a všeho nebeského vojska postoupit uprostřed přímo za ty tři přední – a tímto způsobem sestavit celý bitevní šik až do konce. Někteří hejtmani chtějí šik vzadu uzavřít šlechtici, jiní jsou však proti tomu a míní, že se šlechtici mají řadit jen dopředu, je-li jich tolik, aby to šlo; kde ne, berou se vyzbrojení čeledíni {knecht} na dobrých koních. Když pak hejtman šik uzavře, má bedlivě dbát na to, kde se praporečník se svou řadou do šiku nejlépe hodí; tam jej má vsunout dovnitř, avšak ne hlouběji než za pátou řadu. Má-li hejtman pod sebou hrabata a pány, má je zařadit vedle praporečníka, a to kvůli jejich čestnému stavu; kdyby však
poznamky:
- n: 1
  text: |-
    V tisku poprvé „bereidt“, dále „breidt“ (široký); ponecháno podle tisku.
- n: 2
  text: |-
    V tisku „beritten seie / neben denselben“ (ověřeno ve skenu) – patrně tisková chyba místo *nemen* (vzít); překládáme podle smyslu.
