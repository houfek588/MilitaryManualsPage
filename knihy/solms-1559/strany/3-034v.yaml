strana: verso
sken: 320
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    darunder/ vnd rör es vber dem feur gar wol vndereinander/ biß daß es starck vnd trucken wirt/ das ist auch ein fülle.
  cs: |-
    nasyp a nad ohněm to velmi dobře promíchej, až to zhoustne a vyschne; i to je náplň.
- typ: odstavec
  de: |-
    Zum ersten mach dir einn leynen Sack also/ leg zwei Tücher auff einander fornen auff die Büchs oder loch des Mörsers/ da du die kugel oder Feurwerck ein machen wilt/ vnnd zeichen an wie weit die Büchs oder loch an der Büchsen ist/ vnd wie sich der Circkel zutregt/ also auff das doppel Tůch zeichen/ nehe rundt rumb einn rinck durch die beide Tücher/ vnd laß jhm an einem ort ein loch mit einem teil/ wie die Figur mit dem A. anzeigt/ das ist ein hälßlin hat da manns hinein füllet/ vnd wann es so voll ist daß mann nichts mehr hinein brengen kan/ so bindt es oben zu an dem hälßlin/ vnnd schlag mit einem breitem holtz den sack fein rundt/ vnnd wann er wirt rundt/ so bindt jhn einmal mit schnürgebendt wie sich das gebüret/ vnnd im binden schlag jhn mit rundt wo er bigen vnd ecken kriegt/ vnd wann er einmal rundt gebunden wirdt/ so däffe die Kugel/ dann bleibt er rundt/ vnd geb jm dann sein gebendt fürthinauß/ wie sich das nach eines jeden art vnnd notturfft erfordert/ Wie das die Figurn alles vnd jedes nach seiner art vnnd notturfft anzeigen werden.
  cs: |-
    Nejprve si takto zhotov plátěný pytel: polož na sebe dvě plátna, přilož je zepředu na ústí děla {Büchs} čili moždíře {Mörsers}, pro který chceš kouli {kugel} či ohňostroj {Feurwerck} zhotovit, a vyznač si, jak široké je ústí děla. Jak vychází kružnice, tak ji obkresli na dvojité plátno; obě plátna sešij dokola po kruhu a na jednom místě nech otvor s hrdélkem, jak ukazuje obrázek s písmenem A, tedy aby měl krček, kterým se plní. Když je pytel tak plný, že se do něj už nic nevejde, zavaž jej nahoře u krčku a širokým dřevem jej pěkně dokulata sklepej. Když je kulatý, ovaž jej jednou provazovým ovázáním {schnürgebendt}, jak se sluší, a při ovazování jej sklepávej dokulata tam, kde dostává boule a hrany. Jakmile je jednou dokulata ovázán, namoč kouli do zápalné lázně {däffe}; pak už zůstane kulatá. Potom jí dávej další ovázání, jak to vyžaduje povaha a potřeba každé koule – jak to všechno jednotlivě ukážou nákresy podle druhu a potřeby.
- typ: nadpis
  uroven: 3
  de: |-
    Aber ein gebendt zumachen/ das sich auß Cartaunen schiessen leßt.
  cs: |-
    Jak udělat ovázání, s nímž se dá střílet z kartoun {Cartaunen}.
- typ: odstavec
  de: |-
    DAs Gebendt soll gar starck gebunden sein/ vnnd soll jede Kugel dreimal gebunden werden/ vnd alle mal auff ein gebendt gedäfft vnd auff die däff wider gebunden/ vnd machs also das es drei gebent vnd drei däff hat.
  cs: |-
    Ovázání má být uvázáno velmi pevně; každá koule se má ovázat třikrát, po každém ovázání namočit do zápalné lázně a na tento potah znovu ovázat. Udělej to tak, aby měla trojí ovázání a trojí zápalný potah.
- typ: odstavec
  de: |-
    Aber die däff geschwindt brennen zumachen dem solt du also thůn/ Nim ein leynen Tůch/ mach darauß leinen Säcklin wie ein wurst/ vnd so weit wie ein finger/ dieselbig soll mann mit einem trucken puluer oder rössen zeug außfüllen/ Vnnd so die kugel einmal ist mit den stricken oder schnürn einn weg/ vnd doch nicht die zwerch vberstrickt oder vberzogen/ so nim dieselbigen Würstlin vnnd schneidt sie eines halben fingers lang/ leg sie zwischen die strick ein/ vnnd strick es dann vberzwerch/ wie die Figur mit dem B. anzeigt/ vnd däff es oben zů/ schlag dann ein Hanff oder Flachs vmb die Kugel/ vnnd vberzich es wider einfach mit den schnürn einmal/ vnd leg dann wider Secklin darzwischen vnd vberstricks/ ist dann aber wider darüber/ so däff es zů/ vnd thu das so lang biß die Kugel jre größ hat.
  cs: |-
    Aby však zápalný potah rychle hořel, máš postupovat takto: vezmi lněné plátno a nadělej z něj plátěné váčky jako jitrničky, silné jako prst; ty se mají naplnit suchým střelným prachem {puluer} nebo prudkou zápalnou hmotou. Jakmile je koule jedním směrem ovinuta provazy či šňůrami, ale ještě ne napříč opletena či potažena, vezmi tyto jitrničky, nakrájej je na délku půl prstu a vlož je mezi provazy; potom to opleť napříč, jak ukazuje obrázek s písmenem B, a svrchu to zalij zápalným potahem. Pak kolem koule oviň konopí nebo len, znovu ji jednou jednoduše převaž šňůrami, opět mezi ně vlož váčky a opleť je. Je-li to zase hotovo, zalij to zápalným potahem a dělej to tak dlouho, až má koule požadovanou velikost.
- typ: odstavec
  de: |-
    Ein halb Kugel zu machen thu jm also/ fül ein sack wie vor
  cs: |-
    Chceš-li udělat dutou kouli,[^1] postupuj takto: naplň pytel, jak výše
poznamky:
- n: 1
  text: V tisku stojí *Ein halb Kugel* („poloviční koule“), patrně tisková chyba či přeslech za *ein hol Kugel* („dutá koule“), jak potvrzuje závěr věty na l. 35r (*so ist die kugel hol*).
