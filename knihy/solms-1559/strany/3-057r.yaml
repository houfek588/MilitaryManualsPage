id: 3-057r
list: '57'
strana: recto
sken: 365
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vnd der Kole zu feucht / wirt / oder das der Salpeter nit wol geleutert ist / vnd das Puluer verdirbt / dem soltu also wider helffen / nim gůten gebranten Wein / seud darin Salpratica / vnd Salpeter zu gleich / vnd beschüt das Puluer mit heissem siedendem Wein / stoß darnach gar wol / vnd nim dann erden Häfen / fül die wolgestossen / vnd vermach die hafen wol / setze sie in ein Bachofen der nit zu heiß sei / wann das wol getrucknet / so nim dann es herauß / stoß ein wenig / vnd nit zuuil so kompt das Puluer aller dingen wider / vnd wirt besser dann vor.
  cs: |-
    a dřevěné uhlí {Kole} příliš zvlhne, nebo že ledek {Salpeter} není dobře přečištěný, a střelný prach {Puluer} se zkazí; tomu máš zase pomoci takto: vezmi dobré pálené víno, povař v něm stejným dílem *Salpratica*[^1] a ledek a polij prach tím horkým vroucím vínem. Poté jej velmi dobře utluč, vezmi hliněné hrnce, naplň je dobře utlučeným prachem, dobře je utěsni a vlož je do pekařské pece, jež není příliš horká. Když to dobře uschne, pak to vyjmi a trochu – ne příliš – utluč; tak se prach docela zotaví a bude lepší než dříve.
- typ: nadpis
  uroven: 3
  de: Ein gut Puluer von meister Rüdiger von Heidelberg.
  cs: Dobrý střelný prach od mistra Rüdigera z Heidelbergu
- typ: odstavec
  de: |-
    NIm ℥. iiij. Salpeter / lebendigen schwefel ℥. j. vnd misch es wol in einem Mörser / vnd den 12. ij. theil Kols vnd den 30. theil salarmoniac / vnder dise stück 1. quintlin Kampfer / vnnd stoß das alles zu Puluer / vnd nim ein wenig salpeter wasser / stoß damit ab / so hastu ein gůt Puluer.
  cs: |-
    Vezmi 4 unce (*℥*) ledku a 1 unci živé síry {schwefel}[^2] a dobře to smíchej v hmoždíři; dále 12. [či 2.] díl[^3] uhlí a 30. díl salmiaku (*salarmoniac*) a k těmto přísadám 1 kvintlík {quintlin} kafru. Vše utluč na prach, vezmi trochu ledkové vody a utluč to s ní – tak budeš mít dobrý prach.
- typ: nadpis
  uroven: 3
  de: Wiltu ein gut Puluer machen.
  cs: Chceš-li dělat dobrý střelný prach
- typ: odstavec
  de: |-
    DAs ist gar wunderbarlich / so leg es 6. oder 10. wochen auff ein tach / oder wo du wilt / wenn es daruff regnet / so brennt es fast / vnd grimentlich / machs also / nim salis Nitri ℥. v. sulfuris ℥. j. Carbonis ℥. ß. vnnd pulueriser das vntereinander / vnnd nim dann ein weissen Kißlingstein / bren den zu Kalch / stoß den vngeleschten Kalch wol / thů ℥. j. des Kalchs / vnd 3. pfenning schwer Kampfer darzů / temperier das wol vntereinander gar trucken.
  cs: |-
    Ten je velmi podivuhodný: polož jej na 6 nebo 10 týdnů na střechu nebo kam chceš, a když na něj zaprší, hoří prudce a zuřivě.[^4] Dělej jej takto: vezmi 5 uncí ledku (*salis Nitri*), 1 unci síry (*sulfuris*) a půl unce dřevěného uhlí (*Carbonis*) a rozdrť to na prach dohromady; pak vezmi bílý křemen, vypal jej na vápno, dobře utluč nehašené vápno, přidej 1 unci toho vápna a 3 feniky váhy kafru a dobře to spolu za sucha promíchej.
- typ: nadpis
  uroven: 3
  de: wiltu das aller best Puluer machen zu einem weiten schoß.
  cs: Chceš-li dělat ten nejlepší střelný prach pro dalekou ránu
- typ: odstavec
  de: |-
    SO nim 3. pfundt salpeters / vnd 1. pfundt grabes schwefels / 2. vierling Linden Koln / 1. halb Quintlin Arsenicum Album / vnd stoß das klein zusamen / nim ein quertlin gůts gebrants Weins / vnd 1. Quintlin Kampfer laß es vntereinander sieden / vnd dann kalt werden / schüt es darnach vnter das Puluer / stoß ab vnd laß es wol trucken so hastu das weit schiessende Puluer / das jemant gehaben mag.
  cs: |-
    Vezmi tedy 3 libry {pfundt} ledku, 1 libru surové síry (*grabes schwefels*),[^5] 2 čtvrtky {vierling} lipového uhlí a půl kvintlíku bílého arzeniku (*Arsenicum Album*) a utluč to najemno dohromady; vezmi čtvrtku {quertlin} [mázu] dobrého páleného vína a 1 kvintlík kafru, nech to spolu povařit a pak vychladnout. Poté to vlij do prachu, utluč a nech dobře uschnout; tak budeš mít ten nejdále střílející prach, jaký kdo může mít.
- typ: nadpis
  uroven: 3
  de: Ein Puluer zumachen das zu der Büchsen gehöret.
  cs: Jak dělat střelný prach, jenž náleží k dělu {Büchsen}
poznamky:
- n: 1
  text: |-
    *Salpratica* (na l. 53v *Salpartica*, na l. 58v *salpentica*) – nejasná solná přísada, snad zkomolené *sal petrae* nebo jiný druh soli; ponecháno bez překladu.
- n: 2
  text: |-
    *Lebendiger Schwefel* (*sulfur vivum*) – přírodní, nerafinovaná (panenská) síra. Lékárnickou značku unce tiskne sazba podobně jako drachmu (ʒ); že jde o unci, potvrzuje obdobný recept na l. 55v (*1. vntz Kalchs*).
- n: 3
  text: |-
    V tisku stojí chybně *den 12. ij. theil Kols* – zřejmě zkomolená sazečská oprava mezi 12. a 2. dílem dřevěného uhlí.
- n: 4
  text: |-
    *grimentlich* – dobová nářeční podoba za *grimmiglich* / *grimmendlich* („zuřivě, prudce“).
- n: 5
  text: |-
    *grabes schwefels* – zřejmě „kopané“ (tj. surové zemní) síry, případně tisková obměna za *grobes Schwefels* („hrubé síry“).
