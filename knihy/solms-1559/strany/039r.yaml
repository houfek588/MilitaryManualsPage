bloky:
- typ: odstavec
  de: |-
    Item / der Prouiantherr soll auch von einem Prouiantmeister / so er jn lieffert / oder gelieffert hat / sein Handschrifft geben lassen / damit der Prouiantherr sein Rechnung allen tag ordenlich schliessen mög / darzů ein gantze Wochen seine Rechnung enden mag / seinem Herren solliches zuüberantworten haben / Vnnd so das der gestalt geschicht / so mag allwegen ein Hauptman sich desto baß mit aller Bestallung darnach richten / so er weitter ziehen / oder lenger bleiben wolt / Dann solt er sich in einen weittern zug begeben / vnd wüste / daß der solliche Prouiant nicht nach schaffen möcht / were besser vnderlassen. Deßgleichen ob er schon ligen bleibt / so mag er denen zu rück allen tag vnnd allezeit schreiben / die auff solliche Prouiant nach zuschaffen verordnet feind / was jhm noch daran mangel / vnd wieuil er jhm darnach schaffen soll / Also hat mann sich biß auff das ende darnach zurichten / vnd alle ding seind mit rath vnd Ordnung darnach zubestellen.
  cs: |-
    Dále: proviantní pán {Prouiantherr} si má od každého proviantmistra {Prouiantmeister}, když mu [zásoby] dodává nebo dodal, nechat dát vlastnoruční potvrzení, aby mohl každý den řádně uzavřít svůj účet, za celý týden pak vyúčtování dokončit a předložit je svému pánovi. Děje-li se to takto, může se každý hejtman {Hauptman} se vším zaopatřením tím lépe zařídit, chce-li táhnout dále nebo zůstat déle. Kdyby se totiž vydal na další tažení {zug} a věděl, že takový proviant {Prouiant} nelze za ním dopravit, bylo by lépe od toho upustit. Stejně tak, i když zůstane ležet na místě, může každý den a kdykoli psát těm v týlu, kdo jsou určeni k dodávání proviantu, co mu ještě schází a kolik mu ho mají podle toho opatřit. Tak se lze podle toho řídit až do konce a všechno s rozvahou a v pořádku zařídit.
- typ: odstavec
  de: |-
    Item / dem Prouiantherrn sollen Diener gehalten werden / die auff jn warten / vnd das Brot von denen die es brengen / mit der zal gelieffert nemen / vnd denen / den es gebürt wider mit der zal lieffern / die sollen jhre Besoldung daruon haben / wieuil der sein sollen / wirt sich nach dem zuschaffen selbst weisen.
  cs: |-
    Dále: proviantnímu pánovi se mají vydržovat služebníci, kteří mu jsou k ruce, přebírají chléb podle počtu od těch, kdo jej přivážejí, a podle počtu jej zase vydávají těm, kterým náleží; ti za to mají mít svůj žold {Besoldung}, a kolik jich má být, ukáže se samo podle množství práce.
- typ: odstavec
  de: |-
    Item / mit dem fleysch soll auch ein freyer kauff auff einem platz gehalten werden / vnd ein gleiche freie Schatzung geschehen.
  cs: |-
    Dále: i s masem se má konat volný trh na jednom prostranství a má být stanovena spravedlivá úřední cena.
- typ: odstavec
  de: |-
    Item / wann einem Menschen wirt ein tag verordnet ein pfundt fleysch / wo mann das anders bekommen mag / vnd nicht mangel an vieh / vnd zimlicher notturfft vorhanden ist / das ein zal Volcks mag erhalten werden / wirt hie vngefehrlich das vieh angeschlagen / es halt an dem gewicht minder oder mehr / wie hernach steht.
  cs: |-
    Dále: určí-li se jednomu člověku na den jedna libra {pfundt} masa – pokud je vůbec k dostání, není nouze o dobytek a je ho přiměřená zásoba, aby se určitý počet lidu mohl uživit –, odhaduje se zde dobytek přibližně takto, ať má na váhu o něco méně či více:
- typ: tabulka
  de:
  - - Ein Ochs
    - ''
    - 3. Centner
  - - Ein Kůe
    - ''
    - 1½ Centner
  - - Ein Kalb
    - wirt angeschlagen / auff
    - 36. pfundt
  - - Ein Hamel
    - ''
    - 30. pfundt
  - - Ein Schaaff.
    - ''
    - 20. pfundt.
  cs:
  - - jeden vůl
    - ''
    - 3 centy {Centner}
  - - jedna kráva
    - ''
    - 1½ centu[^1]
  - - jedno tele
    - počítá se na
    - 36 liber
  - - jeden skopec
    - ''
    - 30 liber
  - - jedna ovce
    - ''
    - 20 liber
- typ: odstavec
  de: |-
    Nach sollichem gewicht hat mann sich nach anzal des Viehs / nach notturfft vngefehrlich zurichten / wie von dem Brot auch gemelt ist / ordenlich zutheiln / also daß ein theil nit allein kauffe / wo es gleich zugeht / da ist eintrechtigkeit vnd gehorsam / dann durch ein gleich ordenlich Regiment / mag mann gehorsam erhalten / vnd mit einem gehorsamen Hauffen / ist auch etwas für einem vngehorsamen außzurichten.
  cs: |-
    Podle této váhy se lze přibližně řídit počtem dobytka a potřebou a – jak bylo řečeno i o chlebu – řádně jej rozdělovat, aby jedna strana nenakupovala sama. Kde se jedná rovným dílem, tam je svornost a poslušnost; stejným a řádným řízením lze totiž udržet poslušnost a s poslušným houfem {Hauffen} se dá také více pořídit než s neposlušným.
- typ: odstavec
  de: Item / auff hundert Personen geht einen tag hundert Pfundt /
  cs: 'Dále: na sto osob připadá za jeden den sto liber,'
poznamky:
- n: 1
  text: |-
    Zlomek „½“ u krávy („1½ Centner“, tj. 150 liber) je v BSB OCR vynechán a doplněn podle skenu tisku i následných součtů na fol. 39v.
