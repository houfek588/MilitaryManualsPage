id: 1-019r
list: '19'
strana: recto
sken: 47
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vberladen die geissel der straff wirt nimermehr von seinem hauß weichen. Vnser Herr Christus sagt / jr habt gehört das zu den alten gesagt ist / Du solt kein meineid thůn / vnd solt Gott deinn Eid halten / ich aber sag euch / das jr allerding nicht schweren solt / weder bei dem Himel / dann er ist Gottes stůl / noch bei der erden denn sie ist sein fůßschemel / etc. Der Apostel Jacobus spricht / Vor allen dingen aber meine brüder schweret nicht / weder bei dem Himel / noch bei der erden / noch bei keinem andern eid / Es sei aber ewer Wort ja das ist ja / nein das ist nein / Es ist die Schrifft allenthalben vol / wie der Götlich nam in hohen ehren vor den Engeln vnd allen Gottseligen gehalten wirdt. Auch ist die erste bit in vnserm gebet / so wir täglich betten zu dem Allmechtigen Gott / Geheiligt werd dein nam / Der so heilig vnd hoch berümpt / das alle knie im Himel / auff erden vnd in der Hell daruor sich biegen müssen / Sollen nun wir Teutschen / so wir allezeit die fürnembsten Christen wöllen geheissen sein / vns selbst nit zwingen / die böse gewonheit schewen vnd Gott förchten / der vns on zweifel der vberschwenglichen freuelliche Gottslesterung halben Krig / Pestilentz / tewrung vnd alles vngluck billich zuschickt / es ist kein entschuldigung / du habst es nit böß gemeint / es sei dein gewonheit / vnd wilt es also leicht darschlagen / es wil aber Gott mit seinem heiligen namen nit gehönt sein / vnd du solt allemal in deinem hertzen dich entsetzen / wenn du den heiligen namen hörest / ich geschweige / daß du jn so freuellich on vrsach nennest.
  cs: |-
    a metla trestu nikdy neustoupí z jeho domu. Náš Pán Kristus praví:[^1] „Slyšeli jste, že bylo řečeno předkům: Nebudeš křivě přísahat, nýbrž splníš Bohu svou přísahu; já však vám pravím, abyste vůbec nepřísahali – ani při nebi, neboť je to trůn Boží, ani při zemi, neboť je to podnož jeho nohou atd.“ Apoštol Jakub praví:[^2] „Především pak, bratří moji, nepřísahejte ani při nebi, ani při zemi, ani žádnou jinou přísahou, nýbrž vaše slovo ať je ano, je-li to ano, a ne, je-li to ne.“ Písmo je všude plné toho, v jaké vysoké cti je Boží jméno chováno před anděly i všemi bohabojnými lidmi. Také první prosba v naší modlitbě, již se denně modlíme k všemohoucímu Bohu, zní: „Posvěť se jméno tvé“ – to jméno tak svaté a vysoce slavné, že se před ním musí sklonit každé koleno na nebi, na zemi i v pekle. Nemáme se tedy my Němci, když chceme být vždy nazýváni nejpřednějšími křesťany, sami přemoci, vystříhat se zlého zvyku a bát se Boha, který na nás bezpochyby pro toto nesmírné a opovážlivé rouhání Bohu právem sesílá válku, mor, drahotu a veškeré neštěstí? Neobstojí výmluva, že jsi to nemyslel zle, že je to tvůj zvyk, a chceš to tak lehkovážně odbýt – Bůh si totiž nedá své svaté jméno potupovat a ty se máš pokaždé v srdci zachvět, kdykoli to svaté jméno uslyšíš, natož abys je tak opovážlivě a bez příčiny bral do úst.
- typ: nadpis
  uroven: 2
  de: |-
    Nun volgent die vierundzwentzig straff Artickel sampt der erklerung jrer verordneten Straffen.
  cs: |-
    Nyní následuje dvacet čtyři trestních článků spolu s výkladem jim stanovených trestů.
- typ: odstavec
  de: |-
    ERstlich welcher sich mit worten setzet wider sein Oberkeit derselbig sol an seinem leib nach zugetragener handelung gestrafft werden.
  cs: |-
    Předně, kdo se slovy postaví proti své vrchnosti, ten má být potrestán na svém těle podle závažnosti činu.
- typ: odstavec
  de: |-
    Zum andern welcher sich dagegen setzen wirt Meuterei zumachen / derselbig soll an seinem leibe mit dem schwert gestraff werden.
  cs: |-
    Za druhé, kdo se postaví na odpor, aby vyvolal vzpouru {Meuterei}, ten má být na svém těle potrestán[^3] mečem.
- typ: odstavec
  de: |-
    Zum dritten welcher sich mit wehrhaffter handt dargegen legen wirt / derselbig soll mit dem schwert gestrafft werden.
  cs: |-
    Za třetí, kdo se postaví na odpor se zbraní v ruce, ten má být potrestán mečem.
- typ: odstavec
  de: |-
    Zum vierdten welcher auff den Prouiantpletzen wolt gewalt treiben / derselbig soll gefenglich eingezogen / vnd vor Recht gestelt / nach seiner verwürcklichen handelung vnd erkentnuß gestrafft werden / dann der Prouiant Platz ist ein hoch gefreiter Platz.
  cs: |-
    Za čtvrté, kdo by chtěl páchat násilí na proviantních {Prouiantpletzen} místech, ten má být uvězněn, postaven před soud {Recht} a potrestán podle svého provinění a soudního nálezu; neboť proviantní místo je vysoce výsadní a chráněné místo.
poznamky:
- n: 1
  text: Na pravém okraji tisku je uveden odkaz *Matth. 5.* (Mt 5,33–37).
- n: 2
  text: Na pravém okraji tisku je uveden odkaz *Jacob. 5.* (Jak 5,12).
- n: 3
  text: V tisku vypadlo koncové *-t* (*gestraff* místo *gestrafft*).
