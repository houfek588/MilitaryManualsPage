bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    doch wann jr gůt Geschütz habt/ wolt ich durch ein heimlichs Thor ein drei oder vier hinauß lassen/ die biß an der Feinde Schantzen giengen/ vnud sie der gestalt herauß lockten/ vnd dann ewer Geschütz vnder sie gehn lassen/ vnd jnen dardurch schaden zu fügten/ vnd daß euch doch nicht vil schaden kündt/ sonder möcht jnen dardurch einen grossen schaden thůn/ Dann wann die Feind einen hauffen sehen/ sind sie alle begirig jhn widerumb hinauß zu jagen/ wann dann die Büchsenmeister gůt seind/ künden sie den Feinden vil erschiessen vnd letzen/ möcht auch jhnen ein sollicher erschossen oder verletzt werden/ daß jnen ein grossen nachtheil brecht.
  cs: |-
    máte-li však dobrá děla {Geschütz}, nechal bych tajnou branou vyjít asi tři nebo čtyři muže, kteří by došli až k nepřátelským šancím {Schantzen} a tak nepřítele vylákali ven; potom bych na něj spustil palbu z vašich děl a způsobil mu tím škodu. Vám by to přitom nemohlo mnoho uškodit, jemu však by to mohlo způsobit velkou škodu. Když totiž nepřítel spatří hlouček lidí, všichni dychtí zahnat ho zase pryč. Jsou-li pak puškaři {Büchsenmeister} dobří, mohou mnoho nepřátel zastřelit a zranit; také by u nich mohl být zastřelen nebo zraněn někdo takový, že by jim to přineslo velkou újmu.
- typ: odstavec
  de: |-
    Wann aber die gelegenheit der Stat der massen ist/ daß mann sie graben kan/ solt jr gůt achtung darauff haben/ dann wann jhr nicht wist wo mann grebt möchten die Feind mitten inn die Stat komen/ daß jr nichts darumb wist/ darmit jhr aber wist woher das graben geht/ so nemet zehen oder zwölff Nadeln/ vnd faßt an einen faden/ vnd stelt vnder jeglich ein Becken darnach spandt ein Nadel mit dem fadem darüber/ daß sie den bodem nit anrier/ vnd stelts auff die Maur so wirt sich vngezweiffelt die nadel an dem bodem im Becken sencken/ wann jr wisset wo mann grebt/ kündt jr jnen wol wider entgegen graben/ dieweil aber solches der zeit gar selten gebraucht wirdt/ will ich euch nichts mehr daruon schreiben.
  cs: |-
    Je-li však poloha města taková, že je lze podkopat, máte na to dobře dbát. Kdybyste totiž nevěděli, kde se kope, mohl by se nepřítel dostat doprostřed města, aniž byste o tom věděli. Abyste však věděli, odkud podkop vede, vezměte deset nebo dvanáct jehel, navlékněte je na nit a pod každou postavte mísu; potom napněte jehlu s nití nad mísou tak, aby se nedotýkala dna, a postavte to na hradbu. [Tam, kde se kope,] se jehla nepochybně skloní ke dnu mísy[^1]. Když víte, kde se kope, můžete nepříteli kopat naproti. Protože se to však v dnešní době užívá jen zřídka, nechci vám o tom psát víc.
- typ: odstavec
  de: |-
    Wann aber ewer Stat an einem Wasser/ es sei am Meer oder sonst an einem fliessenden Wasser/ leidt/ daß mann sie zu Landt vnnd Wasser belegern kan/ Da seind vil Maniern der Fewer die mann nicht mit wasser leschen kan/ welches wann sie recht geworffen werden/ die schiff verbrennen künden/ vnd grossen schaden thůn/ deßgleichen auch die Brücken/ wann sie von einem schiff zu dem anderen gemacht seind/ wie mann die Fewer machen soll/ findt mann Puluermacher vnd schützenmeister gnůg.
  cs: |-
    Leží-li však vaše město u vody, ať u moře, nebo jinak u tekoucí vody, takže je lze obléhat po zemi i po vodě, je mnoho druhů ohňů {Fewer}, které nelze hasit vodou; jsou-li správně vrženy, mohou spálit lodě a způsobit velkou škodu, a stejně tak i mosty, jsou-li postaveny z lodi na loď. Jak se takové ohně mají dělat, to ví dost prachařů {Puluermacher} a střeleckých mistrů {schützenmeister}[^2].
- typ: odstavec
  de: |-
    Jch hab alles das ich weiß geschriben/ daß die in der stat thůn sollen ehe daß mann stürmpt/ vnnd von einer Befestigung gesagt/ solt jr dardurch verstehen/ daß die andern auch der gestalt sollen gemacht werden/ vnd wann jr sehet daß ein Polwerck so gar zerschossen/ daß zu besorgen were es möcht nicht lenger stehen/ oder die Feinde würdens einnemen/ vnnd villeicht dardurch der platz vnnd die stat verloren möcht werden/ Jst mein Rath daß yr daselbst hin ein Blochhauß machet/ doch so nider daß mann jm keinen schaden mit dem schiessen zu fügen künde/ vnd es wol mit leuten besetzen/ dann wann die Feinde dasselbig stürmen wolten/ möchtet yhr wol etliche an einem heimlichen ort vnder sie hinauß fallen lassen/ alßdan wann die
  cs: |-
    Napsal jsem všechno, co vím o tom, co mají dělat ti ve městě, než se začne útočit. A co jsem řekl o jednom opevnění {Befestigung}, z toho máte rozumět, že i ostatní se mají dělat stejným způsobem. Když vidíte, že je některý bolverk {Polwerck} tak rozstřílen, že je třeba se obávat, že už nevydrží nebo že ho nepřítel dobude a že by tím snad mohlo být ztraceno místo i město, radím vám, abyste na tom místě postavili srub {Blochhauß}, avšak tak nízký, aby mu nebylo možné střelbou uškodit, a dobře ho obsadili lidmi. Kdyby totiž nepřítel chtěl na srub zaútočit, můžete nechat několik mužů vyrazit proti němu z nějakého skrytého místa; když pak nepřítel
poznamky:
- n: 1
  text: |-
    Dobová pomůcka k odhalení podkopu: otřesy půdy od kopání se přenášejí do hradby a jehla napjatá nad mísou se začne chvět a klesat; podobně se užívalo i misek s vodou nebo bubnů s hrachem.
- n: 2
  text: |-
    *schützenmeister* – zde zkušení střelci a ohňostrůjci (srov. puškař, *Büchsenmeister*), kteří znali přípravu zápalných směsí.
