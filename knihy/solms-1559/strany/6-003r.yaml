list: 3 (6. kniha)
strana: recto
sken: 497
stav: prelozeno
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Regiment vnd Justicien / wie ich die mit meinen Kriegßräten vnd Kriegßuerstendigen beratschlagen vnd ordnen werde / gehorsam vnd vnderthan sein.
  cs: |-
    správě a justici {Justicien}, jak je se svými válečnými rady {Kriegßräten} a znalci válečnictví {Kriegßuerstendigen} uvážím a ustanovím.
- typ: odstavec
  de: |-
    Deßgleichen dem Feldmarschalck den ich euch geben werde / in allem gehorchen vnd volgen / es sei im feld oder im leger / vnnd was er mit euch schafft / nit allein gehorsam sonder jm auch in seinem ampt beratsam vnd beistendig sein / ob jm vnd den seinen halten helffen vnd handthaben / Dann es ist ewer eigen Justitien ewer Volck euch helffen zu regiern / bei der billicheit vnd gebrauch zu halten / derhalben wöllet ewern Reuttern vnd gesindt so vnder euch sind / dahin halten / daß sie sich nit wider den Feldmarschalck setzen / damit ich nit verursacht werde selber Justitien zu halten / dann er ist in meiner statt alda.
  cs: |-
    Rovněž máte polního maršálka {Feldmarschalck}, kterého vám dám, ve všem poslouchat a následovat, ať v poli, nebo v ležení {leger}. V tom, co vám nařídí, mu máte být nejen poslušni, ale také v jeho úřadu {ampt} nápomocni radou i skutkem a pomáhat jemu i jeho lidem [pořádek] držet a prosazovat. Je to totiž vaše vlastní justice: pomáhá vám řídit váš lid a udržovat ho ve slušnosti a dobrém obyčeji. Proto veďte své jezdce {Reuttern} a čeleď, kteří jsou pod vámi, k tomu, aby se polnímu maršálkovi nestavěli na odpor, abych nebyl nucen vykonávat justici sám; vždyť on je tam na mém místě.
- typ: odstavec
  de: |-
    Deiweil jr Ritmeister mein gemůt in dem gehört / vnd ich euch ein statlichen vnd ehrlichen beuelch / mitsampt einer statlichen ehrlichen vnderhaltung gebe / so wil ich von euch auch haben / daß jr solcher bestallung nachsetzt vnd gelebt / wie ich daß euch beuelhen vnd vertrawen wil / als einem ehrlichen vom Adel vnnd Kriegßman / der nach ehren vnd nit nach finantz seine sachen außrichte / von ewern Reutern nichts anders annemen noch auff den Musterplatz brengen / dann was tüglich / vnd nach der maß wie oben gemelt / gerüst vnd beritten sei / vnd euch wie jrem Ritmeister inn allem / laut der gantzen bestallung / meiner Kriegßordnung vnd Justitien vnderworffen vnnd gehorsam sein wöllen.
  cs: |-
    Poněvadž jste, rytmistře {Ritmeister}, v tom slyšel mé smýšlení a já vám dávám vznešené a čestné velení {beuelch} spolu s vydatným a čestným zaopatřením, chci také od vás, abyste se tímto služebním listem {bestallung} řídil a podle něho žil, jak vám to chci přikázat a svěřit jako čestnému šlechtici a válečníkovi {Kriegßman}, který své věci vyřizuje podle cti, a ne podle fint {finantz}. Nemáte od svých jezdců přijímat ani na přehlídkové místo {Musterplatz} přivádět nic jiného než to, co je způsobilé, podle výše uvedené míry vyzbrojené a na koni a co je ochotno se vám jako svému rytmistrovi ve všem podřídit a poslouchat podle celého služebního listu, mého válečného řádu {Kriegßordnung} a justice.
- typ: odstavec
  de: |-
    Item wirt der Ritmeister die bestallung also annemen vnd zu friden sein / denn neme mann seinen Refers von jm / vnd zur zeit der Musterung / mustert mann jn darauff.
  cs: |-
    Dále: přijme-li rytmistr služební list takto a bude s ním spokojen, vezme se od něho jeho revers {Refers} a v době přehlídky {Musterung} se podle něho přehlíží.
- typ: odstavec
  de: |-
    Dann wil mann solche Reutterei wider inn gůte Rüstung / Regiment vnd gehorsam brengen / so muß mann nach ehrlichen / verstendigen Gesellen zu Ritmeistern sehen / mit denselbigen die gelegenheit vnd sachen berathschlahen vnd wol bereden / sie auch wol halten / dann werden sie die sachen wol bedencken vnd wider helffen auffrichten.
  cs: |-
    Chce-li se totiž taková jízda {Reutterei} znovu přivést k dobré výzbroji {Rüstung}, kázni a poslušnosti, je třeba hledat za rytmistry čestné a rozumné druhy, s nimi okolnosti a záležitosti probírat a dobře je prodiskutovat a také s nimi dobře zacházet; pak budou o věcech dobře přemýšlet a pomohou je znovu napravit.
- typ: odstavec
  de: |-
    Item mit dem Anritgelt vnnd abzog hat es sein Ordnung / das soll mann klar in die bestallung setzen / besonder wie es mit dem abzog soll gehalten werden mit denen so nahe / vnd denen so weit heim haben / dasselbig ist ein vngleicheit / das mag mann in dem abdancken mit den so ferr heim haben / handeln / jhnen ein abrietgelt nach den meilen geben / wie mit dem anriet geschehen.
  cs: |-
    Dále: příjezdné {Anritgelt} a odchodné {abzog} mají svůj řád a ten se má jasně zapsat do služebního listu, zvláště jak se má naložit s odchodným u těch, kdo to mají domů blízko, a u těch, kdo to mají daleko. V tom je totiž nerovnost; s těmi, kdo to mají domů daleko, lze při propouštění {abdancken} jednat a dát jim odjezdné {abrietgelt} podle mil {meilen}, jako se to stalo s příjezdným.
- typ: odstavec
  de: |-
    Was nun weitter bestallung vnd stat auff die Fürsten sein will / ist hie on not zu schreiben / sonder dise Bestallung ist vff einen gemeinen Ritmeister als drei hundert pferdt gemacht.
  cs: |-
    Jaký další služební list a stav {stat} má platit pro knížata, to zde není třeba psát; tento služební list je sestaven pro obyčejného rytmistra, totiž na tři sta koní.
