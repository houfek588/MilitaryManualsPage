stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    also fleissig geworffen wirt mit solcher gattung vnd der menge kugeln / wie es nit anders sein kan dann daß es brennen můß / wo es also brennen wirt / daß die Hauptleut die darüber gesetzt sein bedeucht / daß der massen brent das nit zu wehrn wer / sollen sie das abschaffen / damit der Zeug nit vnnützlich verbrent werd. Wer aber etwan ein Baw in eim Flecken der schwerlich mit dem werffen zutreffen wer / vnd lege daß mann in doch sehen kündt / vnd thürn die doch mit dem geschütz zuereichen sind das von holtz were / ob die sollen mit schiessen auß Cartaunen / steinen Büchsen vnd gebrant werden / dann es ist wol zuthůn / Wie dieselbigen kugeln gemacht sollen sein / wil ich ( wils Gott ) bei den andern zu den Mörsern zumachen anzeigen.
  cs: |-
    takto pilně vrhá takovým druhem a množstvím koulí {kugeln}, že jinak ani nemůže být, než že to musí hořet. Bude-li to hořet tak, že se hejtmanům {Hauptleut}, kteří nad tím stojí, bude zdát, že se tomu nedá ubránit, mají vrhání zastavit, aby se střelivo {Zeug} zbytečně nepromrhalo. Kdyby však byla v městečku nějaká stavba, kterou by bylo těžké zasáhnout vrháním [z moždířů], a ležela tak, že je na ni přece vidět, a také dřevěné věže, na něž děla {geschütz} dostřelí, ty se mají ostřelovat z kartoun {Cartaunen} a kamenných děl {steinen Büchsen} a zapálit,[^1] neboť to lze dobře učinit. Jak mají být takové koule zhotoveny, ukážu (dá-li Bůh) spolu s ostatními koulemi do moždířů {Mörsern}.
- typ: nadpis
  uroven: 3
  de: |-
    Vnderricht der mörser / wie mann damit handeln soll.
  cs: |-
    Poučení o moždířích, jak se s nimi má zacházet.
- typ: odstavec
  de: |-
    DIeweil dann diß hieuor gemelt geschütz groß vnd klein / als Maurbrecher / Feldgeschütz / Wagenbürg geschütz / also aller vorgemelter Sorten beschriben / verordnet vnnd angezeigt / vnd in jrem Regiment stehen / so wöllen doch die Mörser mit jhrer arbeit / darzů sie geordnet sein / vnd in die Artolorei bei das ander Geschütz gehören / darumb auch mit jhrer kunst / thůn vnd arbeit beschrieben werden / Warumb sie aber vnder das vorgeordnet geschütz nit mit eingezogen sein / hat dise vrsach / Daß jr thůn ein besondere anstellung erfortert mit den personen vnd anderer rüstung dann alle andere Büchsen haben Meister / die man Büchsenmeister nent / vnd ist recht / kan wol sein das ein Büchs von einem Büchsenmeister abgericht wirt / wann er jr thůn alle maß vnd vermögen lernt / ist er wol jr Meister / Warumb ? Einer Büchsen maß geht auß der vergleichung vnd richtung des kerns / vnd so ein Büchs ist hinden vnd forn verglichen / vnd der kern recht abgericht / scheußt sie 100. 200. 300. schrit / darnach die Büchs ist eines in das ander in gleicher maß sie hab vil oder wenig gůt oder böß puluer so ferr daß das böß souil sterck hab / daß es die summa der schrit vnnd kern on ein bogen das zil erreichen mög / so scheußt das gůt puluer in dem zil auch nit höher oder niderer dann das böß / Dieweil das gesicht oder absehn vnd der kern in zweien gleichen Linien stehn / aber das gůt puluer scheußt weiter vnd härter in der stracken Linien dann das böß aber das böß puluer kompt ehe in bogen zu fallen dann das gůt /
  cs: |-
    Poněvadž tedy byla tato výše uvedená děla velká i malá – bořiče hradeb {Maurbrecher}, polní děla {Feldgeschütz} a děla vozové hradby {Wagenbürg geschütz}, všech výše uvedených druhů – popsána, uspořádána a vyložena a mají své vlastní uspořádání, sluší se popsat i moždíře s prací, k níž jsou určeny, s jejich uměním, účinkem a obsluhou, protože k dělostřelectvu {Artolorei} patří vedle ostatních děl. Proč však nebyly zahrnuty mezi výše uspořádaná děla, má tu příčinu, že jejich obsluha vyžaduje zvláštní zřízení s lidmi i jinou výstrojí. Všechna ostatní děla {Büchsen} totiž mají mistry, jimž se říká puškaři {Büchsenmeister}, a právem: může se dobře stát, že puškař dělo zastřílí, a když pozná jeho chování, veškerou míru a sílu, je skutečně jeho mistrem. Proč? Míra děla vychází z vyrovnání mířidel a zaměření jádrové dráhy {kerns};[^2] je-li dělo vzadu i vpředu vyrovnáno a jádrová dráha správně zaměřena, střílí 100, 200 či 300 kroků podle toho, jaké dělo je, stále v téže míře, ať má mnoho nebo málo, dobrého nebo špatného střelného prachu {puluer} – jen když má špatný prach tolik síly, aby jádrovou dráhou dosáhl na daný počet kroků cíle bez oblouku. Pak dobrý prach nestřílí v cíli ani výš, ani níž než špatný, protože průzor neboli záměrná a jádrová dráha leží ve dvou rovnoběžných přímkách. Dobrý prach ovšem střílí v přímé dráze dál a prudčeji než špatný, kdežto špatný prach začne v oblouku klesat dříve než dobrý;
poznamky:
- n: 1
  text: |-
    V originále stojí *ob die sollen mit schiessen auß Cartaunen / steinen Büchsen vnd gebrant werden* – věta je neúplná (patrně vypadlo sloveso, např. *beschossen*); smysl je, že se takové cíle mají ostřelovat zápalnými koulemi z kartoun a kamenných děl a zapálit.
- n: 2
  text: |-
    *Vergleichung* označuje vyrovnání vnějšího rozdílu tloušťky hlavně u dna a ústí pomocí mířidel, *Kern* osu vývrtu a na ni navazující přímou (jádrovou) dráhu střely (*Kernschuss*) ještě před jejím klesáním v oblouku (*Bogen*).
