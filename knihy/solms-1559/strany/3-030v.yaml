list: '30'
strana: verso
sken: 312
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    also fleissig geworffen wirt mit solcher gattung vnd der menge kugeln / wie es nit anders sein kan dann daß es brennen můß / wo es also brennen wirt / daß die Hauptleut die darüber gesetzt sein bedeucht / daß der massen brent das nit zu wehrn wer / sollen sie das abschaffen / damit der Zeug nit vnnützlich verbrent werd. Wer aber etwan ein Baw in eim Flecken der schwerlich mit dem werffen zutreffen wer / vnd lege daß mann in doch sehen kündt / vnd thürn die doch mit dem geschütz zuereichen sind das von holtz were / ob die sollen mit schiessen auß Cartaunen / steinen Büchsen vnd gebrant werden / dann es ist wol zuthůn / Wie dieselbigen kugeln gemacht sollen sein / wil ich ( wils Gott ) bei den andern zu den Mörsern zumachen anzeigen.
  cs: |-
    takto pilně vrhá takovým druhem a množstvím koulí {kugeln}, jak jinak ani nemůže být, než že to musí hořet; a kde se tedy vznítí tak, že se hejtmanům {Hauptleut} nad tím ustanoveným bude zdát, že to hoří natolik, že se tomu nedá ubránit, mají střelbu zastavit, aby se střelivo {Zeug} zbytečně nepromrhalo. Byl-li by však v městečku nějaký objekt, který by se dal jen těžko zasáhnout vrháním [z moždířů], a ležel by tak, že by na něj přece bylo vidět, anebo dřevěné věže, jež jsou na dostřel děl {geschütz}, ty mají být ostřelovány z kartoun {Cartaunen} a kamenných děl {steinen Büchsen} a zapáleny,[^1] neboť to lze snadno učinit; jak mají být takové koule zhotoveny, vyložím (dá-li Bůh) při popisu výroby ostatních koulí do moždířů {Mörsern}.
- typ: nadpis
  uroven: 3
  de: |-
    Vnderricht der mörser / wie mann damit handeln soll.
  cs: |-
    Poučení o moždířích, jak se s nimi má zacházet.
- typ: odstavec
  de: |-
    DIeweil dann diß hieuor gemelt geschütz groß vnd klein / als Maurbrecher / Feldgeschütz / Wagenbürg geschütz / also aller vorgemelter Sorten beschriben / verordnet vnnd angezeigt / vnd in jrem Regiment stehen / so wöllen doch die Mörser mit jhrer arbeit / darzů sie geordnet sein / vnd in die Artolorei bei das ander Geschütz gehören / darumb auch mit jhrer kunst / thůn vnd arbeit beschrieben werden / Warumb sie aber vnder das vorgeordnet geschütz nit mit eingezogen sein / hat dise vrsach / Daß jr thůn ein besondere anstellung erfordert mit den personen vnd anderer rüstung dann alle andere Büchsen haben Meister / die man Büchsenmeister nent / vnd ist recht / kan wol sein das ein Büchs von einem Büchsenmeister abgericht wirt / wann er jr thůn alle maß vnd vermögen lernt / ist er wol jr Meister / Warumb ? Einer Büchsen maß geht auß der vergleichung vnd richtung des kerns / vnd so ein Büchs ist hinden vnd forn verglichen / vnd der kern recht abgericht / scheußt sie 100. 200. 300. schrit / darnach die Büchs ist eines in das ander in gleicher maß sie hab vil oder wenig gůt oder böß puluer so ferr daß das böß souil sterck hab / daß es die summa der schrit vnnd kern on ein bogen das zil erreichen mög / so scheußt das gůt puluer in dem zil auch nit höher oder niderer dann das böß / Dieweil das gesicht oder absehn vnd der kern in zweien gleichen Linien stehn / aber das gůt puluer scheußt weiter vnd härter in der stracken Linien dann das böß aber das böß puluer kompt ehe in bogen zu fallen dann das gůt /
  cs: |-
    Poněvadž tedy tato výše uvedená děla velká i malá, totiž bořiče hradeb {Maurbrecher}, polní děla {Feldgeschütz} a děla vozové hradby {Wagenbürg geschütz}, všech výše uvedených druhů byla popsána, uspořádána a vyložena a mají své vlastní zařazení {Regiment}, přece se sluší popsat s jejich uměním, účinkem a prací i moždíře s jejich službou, k níž jsou určeny, poněvadž náležejí k dělostřelectvu {Artolorei} vedle ostatních děl. Proč však nebyly zahrnuty přímo pod výše uspořádaná děla, má tu příčinu, že jejich obsluha vyžaduje zvláštní zřízení s lidmi i jinou výstrojí. Neboť všechna ostatní děla {Büchsen} mají mistry, jimž se říká puškaři {Büchsenmeister}, a je to tak správně: snadno může být dělo puškařem zastříleno, a když pozná jeho chování, veškerou míru i sílu, je skutečně jeho mistrem. Proč? Míra děla vychází ze srovnání mířidel a zaměření jádrové dráhy {kerns};[^2] a je-li dělo vzadu i vpředu vyrovnáno a jádro správně zaměřeno, střílí 100, 200 či 300 kroků podle toho, jaké dělo je, v téže míře rovnoměrně, ať má mnoho nebo málo, dobrého nebo špatného střelného prachu {puluer} – pokud jen má špatný prach tolik síly, aby daný počet kroků a jádrová přímka dosáhly cíle bez oblouku; pak dobrý prach nestřílí v tom cíli ani výše ani níže než špatný, protože záměrná linie neboli průzor a osa vývrtu stojí ve dvou rovnoběžných liniích. Dobrý prach ovšem střílí dále a prudčeji v přímé linii než špatný, kdežto špatný prach začíná klesat v oblouku dříve než dobrý;
poznamky:
- n: 1
  text: |-
    V originále stojí *mit schiessen auß Cartaunen / steinen Büchsen vnd gebrant werden* (patrně s vypadlým slovem či elipsou před *vnd gebrant*, tj. ostřelováním zápalnými koulemi z kartoun a kamenných děl zapáleny). *Steinen Büchsen* = kamennice, děla na kamenné koule.
- n: 2
  text: |-
    *Vergleichung* označuje vyrovnání vnějšího rozdílu tloušťky hlavně u dna a ústí pomocí mířidel, *Kern* osu vývrtu a na ni navazující přímou (jádrovou) dráhu střely (*Kernschuss*) ještě před jejím klesáním v oblouku (*Bogen*).
