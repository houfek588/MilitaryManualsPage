bloky:
- typ: odstavec
  de: |-
    Was des kleinen Geschütz ist / als doppel / einfach / halb hacken vnd Handror das wöllen die Zeugmeister es gehör dem Obersten Zeugmeister allein on alle mittel zů / vnnd dasselbig seines gefallens verhandeln.
  cs: |-
    Pokud jde o malé palné zbraně {kleinen Geschütz}, jako jsou dvojité, jednoduché a poloviční hákovnice {hacken} a ručnice {Handror}, tvrdí zbrojmistři {Zeugmeister}, že patří přímo a jedině nejvyššímu zbrojmistrovi a ten s nimi může naložit podle své vůle.
- typ: odstavec
  de: |-
    Etlich Zeugmeister wöllen / wenn ein Flecken erobert werde / es sei mit stürmen oder durch vbergeben / so seien alle Glocken des obersten Zeugmeisters / vnd mann sei schuldig sie von jm zulösen.
  cs: |-
    Někteří zbrojmistři tvrdí, že když je městečko dobyto, ať útokem {stürmen}, nebo vzdáním, patří všechny zvony[^1] nejvyššímu zbrojmistrovi a je povinností je od něj vykoupit.
- typ: odstavec
  de: |-
    So wöllen etliche es sei allein die sturm glock oder die damit mann anschlecht des obersten Zeugmeisters.
  cs: |-
    Jiní zase tvrdí, že nejvyššímu zbrojmistrovi patří jen poplachový zvon {sturm glock}, tedy ten, kterým se zvoní na poplach.
- typ: odstavec
  de: |-
    Weil nun dise Disputationen im Krieg vil widerwertigkeit geberen / so were es das best / der Kriegsherr / verglich sich in der Bestallung mit dem Zeugmeister / daß er wuste was sein gerechtigkeit were / vnd ließ jhm dannoch etwas an den gemelten stücken / damit er vrsach hett / desto fleissiger darob vnd daran zusein / daß die Flecken auch in Schlachten desto ernstlicher beschossen / vnd dardurch desto ehe erobert würden.
  cs: |-
    Protože tyto spory plodí ve válce mnoho nesvárů, bylo by nejlepší, kdyby se válečný pán {Kriegsherr} se zbrojmistrem dohodl už ve služebním listu {Bestallung}, aby zbrojmistr věděl, na co má právo. Přesto by mu měl ze zmíněných kusů něco ponechat, aby měl důvod tím pilněji dbát a usilovat, aby městečka, a stejně tak i v bitvách, byla ostřelována tím usilovněji, a tak tím dříve dobyta.
- typ: odstavec
  de: |-
    Der jetztgemelten vrsachen halben / soll ein jeder Kriegsherr nach eroberung der Schlacht vnd Flecken / den Büchsenmeistern ein verehrung thůn / vnd denen in sonderheit / die für andern in der Handlung wol geschossen haben / also wirt es auch zu ende des Kriegs gebraucht.
  cs: |-
    Z právě uvedených důvodů má každý válečný pán po vyhrané bitvě a po dobytí městečka udělit puškařům {Büchsenmeistern} čestný dar {verehrung}, a zvláště těm, kdo v boji stříleli lépe než ostatní; tak se to dělá i na konci války.
- typ: odstavec
  de: |-
    Des obersten Zeugmeisters ist alles zerbrochen Geschütz / was in Schlachten oder Flecken gewunnen wirt.
  cs: |-
    Nejvyššímu zbrojmistrovi patří všechna rozbitá děla {Geschütz}, která se ukořistí v bitvách nebo městečkách.
- typ: odstavec
  de: |-
    Der Zeugmeister ist schuldig vmb gůt Büchsenmeister zubesehen / vnd ob dem Kriegsherrn gleichwol ein wenig mehr darauff geht / ist er dannoch wolfeil / angesehen / das gůt Schützen die eroberung der Flecken vnd Schlachten fast fürdern.
  cs: |-
    Zbrojmistr je povinen opatřit si dobré puškaře. I když to válečného pána stojí o něco víc, je to přesto laciné, neboť dobří střelci {Schützen} dobytí městeček i vítězství v bitvách velmi napomáhají.
- typ: odstavec
  de: |-
    Der Zeugmeister soll auch sampt seim Leutenant fleissig auffmercken / wann ein Fleck an einem ort durch den obersten Feldhauptman dem Zeugmeister vnd andern Kriegsuerstendigen zubeschiessen / beschlossen wirt / daß solches gantz ordenlich geschehe / vnnd nicht allein die Maurn / Thürn / oder Polwerck / so sie beschiessen sollen / wol treffen / sonder daß sie auch das Geschütz mit dem Puluer nicht zu vil odder wenig / auch recht Kugeln laden / dann laden sie zu wenig so wircket es nichts / laden sie zuuil / oder die Kugeln nit recht seind / so bricht das Geschütz / darauß eruolget dann dem Herren vnwiderbrenglicher schad vnd nachtheil.
  cs: |-
    Když nejvyšší polní hejtman {obersten Feldhauptman} se zbrojmistrem a jinými znalci válečnictví {Kriegsuerstendigen} usnese ostřelovat městečko na určitém místě, má zbrojmistr se svým poručíkem {Leutenant} pilně dohlížet, aby se to dělo zcela řádně. Puškaři mají nejen dobře zasahovat hradby, věže nebo bolverky {Polwerck}, které mají ostřelovat, ale také nabíjet děla ani příliš velkou, ani příliš malou dávkou střelného prachu {Puluer} a správnými koulemi {Kugeln}. Nabijí-li totiž málo, nic to nezmůže; nabijí-li příliš mnoho nebo nejsou-li koule správné, dělo praskne, a z toho pak pánovi vzejde nenahraditelná škoda a újma.
- typ: odstavec
  de: |-
    Der Zeugmeister soll fleissig auffsehen / wann er einen Flecken bescheußt / daß er den in der Besatzung das bawen wehr / solchs kan nit füglicher geschehn / dan daß er sein Geschütz allweg halb laß abgehn /
  cs: |-
    Když zbrojmistr ostřeluje městečko, má pilně dbát, aby posádce {Besatzung} zabránil v opravách hradeb. To nelze provést lépe, než že nechá svá děla pálit vždy jen z poloviny,
poznamky:
- n: 1
  text: |-
    Podle tzv. zvonového práva (*Glockenrecht*) připadaly zvony dobytého města jako kořist dělostřelectvu a zbrojmistrovi, takže si je město nebo válečný pán musel vykoupit.
