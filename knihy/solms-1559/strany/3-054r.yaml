bloky:
- typ: odstavec
  de: |-
    WIltu Büchenpuluer von einander scheiden / also daß du den Salpeters als weissen hast wie vor / vnd den Schwefel den andern weg / die Kolen den dritten weg / daß dennoch ein jeglich stück so frisch sei wie vor / so nim des Puluers souil du wilt / thů darinn heissen Essig / der siedend sei / also das der Essig das dritteil vber den Salpeter auff gehe / vnd rür das Puluer mit einem stecken in dem Essig durch einander / vnd laß das darnach ein weil stehn / so gehn die Kolen vber sich auff / schaum dann die Kolen ab mit einem Tůchlin / das zwischen ein gäblin gespant sei / schüt darnach den Essig inn einen zwillichen sack so geht der Salpeter der zergangen ist durch den sack / vnd bleibt der Schwefel darinn / denn der Schwefel mag im Wasser nit zergehn / noch von keiner feuchtigkeit / als der salpeter thůt / der schwefel mag auch nit erger werden / Darnach wann der sack erseigt / so erwele den Essig / vnd siede jn in der massen wie mann Fisch seudet / laß den Essig darnach kalt werden / vnd den salpeter darinn gestehn / vnd seig den kalten Essig ab / so findst du den salpeter zu zopfen / den schwefel soltu wol auß wasser waschen / so wirt er also lauter wie vor / Aber wilt du das best scheidwasser in dem essig / so du am aller besten erwelest / machen / so thů darinn Isponicum vnd Galitzenstein.
  cs: |-
    Chceš-li oddělit od sebe puškový prach {Büchenpuluer},[^1] abys získal ledek {Salpeters} tak bílý jako předtím, síru {Schwefel} na druhou stranu a dřevěné uhlí {Kolen} na třetí stranu, a přitom každá složka zůstala tak čerstvá jako dříve, vezmi toho prachu, kolik chceš, a přilij k němu horký vroucí ocet, aby ocet vystoupil o třetinu nad ledek.[^2] Promíchej prach dřívkem v octě a nech jej potom chvíli stát; tak uhlí vystoupí nahoru. Pak uhlí seber jako pěnu plátýnkem napnutým mezi vidlicí, a poté vlij ocet do cvilichového pytle – tak rozpuštěný ledek projde pytlem a síra v něm zůstane, neboť síra se nemůže ve vodě ani v žádné tekutině rozpustit, jak to činí ledek, a ani se nemůže zkazit. Potom, když pytel okape, uveď ocet do varu a vař jej takovým způsobem, jak se vaří ryby; pak nech ocet vychladnout, aby v něm ledek ztuhl, a studený ocet slij – tak najdeš ledek v krystalech jako rampouchy. Síru máš dobře proprat vodou, a tak bude opět tak čistá jako dříve. Chceš-li však udělat v tom octě nejlepší rozdělovací vodu, jakou si jen můžeš přát, přidej do něj španělskou sůl (*Isponicum*) a bílou skalici (*Galitzenstein*).[^3]
- typ: odstavec
  de: |-
    Es ist geschriben vil vnd dick daß das Puluer vnnütz wirt / vnnd doch von alters wegen nicht verdorben / sonder der gebrech ist / der dreien stück / salpeter / schwefel vnd kolen / wo eins zuuil bei dem andern ist / vnd wie mann wissen mag welches stücks zuuil ist / das wirst du in disem hernach geschriben Capitel gar eigentlich vnderweist / so stehet auch daruon geschriben / wie mann solchs Puluer wider bringt / vnd gůt machen soll.
  cs: |-
    Často a mnohokráte bylo psáno, že se střelný prach {Puluer} stane neužitečným, ačkoliv se nezkazil stářím, nýbrž chyba vězí v oněch třech složkách – v ledku, síře a uhlí –, když je jedné při druhé příliš mnoho; a jak lze poznat, které složky je příliš mnoho, o tom budeš v této následující kapitole důkladně poučen, a rovněž je tam psáno, jak se má takový prach napravit a učinit dobrým.
- typ: odstavec
  de: |-
    Wann dir ein Puluer vnder deine hendt kompt / das zuuil salpeter schwefel vnd koln hat / welches stück vnder den dreien zuuil darinn were / so brenne des Puluers souil als ein Welschnuß auff einem gladen stein / ist dann des salpeters zuuil / so bleiben weiß körnlin auff dem stein / wer dann des schwefels zuuil / so brennt er langsam allweg darnach / wann das Puluer verbrent / es sei dann daß der schwefel nit wol gestossen were / seind aber der Koln zuuil / so bleiben sie so rauch wie ein Rußrauch mit grosser vnsauberkeit / Vnd bei den Vnderscheiden verstehest du wol welchs stuck zuuil ist / oder sein kan.
  cs: |-
    Dostane-li se ti do ruky prach, který má příliš mnoho ledku, síry či uhlí – kterákoli ze tří složek by v něm byla v nadbytku –, spal toho prachu tolik jako vlašský ořech na hladkém kameni: je-li v něm příliš mnoho ledku, zůstanou na kameni bílá zrníčka; bylo-li by příliš mnoho síry, hoří potom ještě dlouho poté, co prach shořel, ledaže by síra nebyla dobře utlučena; je-li však příliš mnoho uhlí, zůstane hrubé jako sazový čmoud s velkou nečistotou. Podle těchto rozdílů dobře poznáš, která složka přebývá nebo může přebývat.
- typ: nadpis
  uroven: 3
  de: Wie mann verdorben Puluer wider bringen vnd ernewern soll.
  cs: Jak se má zkažený prach napravit a obnovit
poznamky:
- n: 1
  text: |-
    V záhlaví tisku je na tomto listu chybně vytištěno číslo listu *74* namísto správného *54* (BSB OCR četlo *94*). V prvním slově tisku stojí překlep *Büchenpuluer* místo *Büchsenpuluer*.
- n: 2
  text: |-
    „Aby ocet vystoupil o třetinu nad ledek“ – tj. aby tekutina převyšovala vrstvu prachu asi o třetinu své výšky.
- n: 3
  text: |-
    *Isponicum* (patrně zkomoleně *Alumen hispanicum* či *Sal hispanicum*) a *Galitzenstein* (bílá či modrá skalice, síran zinečnatý/měďnatý; v češtině též „kalicštejn“).
