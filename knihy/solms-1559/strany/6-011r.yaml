poznamky:
- n: 1
  text: Tisková chyba – 18 dní × 13 koní × 6 bacenů dává 93 zl. 9 bac.; s touto částkou souhlasí suma 111 zl. 9 bac. i součet strany 282 zl. 9 bac.
- n: 2
  text: Tisk uvádí 14 koní, ale částka 43 zl. 3 bac. odpovídá 6 koním (18 × 6 × 6 bacenů), stejně jako součet strany 33 koní. Půl trénního koně má činit 1 zl. 12 bac. (polovina z 3 zl. 9 bac.); s touto hodnotou vychází i suma 52 zl. 3 bac. Jmenovaní jezdci (Pflug, Schleinitz, Ebeleben, Vitzthum) patří k míšeňské a durynské šlechtě ze dvora vévody Mořice.
- n: 3
  text: Tisková chyba – správně 57 zl. 9 bac. (50 zl. 6 bac. + 7 zl. 3 bac.); s touto hodnotou souhlasí součet strany 282 zl. 9 bac.
