id: 052v
list: '52'
strana: verso
sken: 188
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    wagen zu der Fůterung oder sonst etwas zu hollen / so solle er den Wagenmeister darumb ansprechen / der solle jm das veruolgen / es were dann das es in der not were / oder sich der not würde versehen / vnd so er den dann gebrauchen wirt mit verwilligung / so soll er den so bald er wider kompt / in die Wagenburg da er jn genommen hat / widerstellen / Also seind alle Wagen die besoldung haben / dem Wagenburgmeister beuolhen / außgenommen die / die zu der Artlerei gehören / Dises ist nun das meinst vnnd die fürnembsten stück / daß einem Wagenburgmeister zuuersehen gebürt / vnd seines ampts ist. Darumb so soll ein sollicher Wagenmeister ein ansehenlich person sein / der verstandt vnd arbeit bei jm hat / vnd nicht ein geringer / dan es ist an jm etwas gelegen.
  cs: |-
    vůz pro píci nebo pro dovezení něčeho jiného, má o to požádat vozmistra {Wagenmeister}, který mu jej vydá – ledaže by byla nouze nebo by se nouze očekávala. A použije-li jej pak se svolením, má jej, jakmile se vrátí, postavit zpět do vozové hradby {Wagenburg}, odkud jej vzal. Takto jsou všechny vozy, jež mají žold {besoldung}, svěřeny mistru vozové hradby {Wagenburgmeister}, kromě těch, které náležejí k dělostřelectvu {Artlerei}. Toto jsou nyní nejhlavnější a nejpřednější body, které přísluší obstarávat mistru vozové hradby a náležejí k jeho úřadu. Proto má být takový vozmistr[^1] váženou osobou, která má rozum a přičinlivost, a nikoli člověkem nízkým, neboť na něm velmi záleží.
poznamky:
- n: 1
  text: |-
    Závěr kapitoly o mistru vozové hradby jej na tomto místě označuje obecně jako *Wagenmeister* (vozmistr); vlastní kapitola o úřadu vozmistra následuje až na následujícím listu.
