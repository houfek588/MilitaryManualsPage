id: 002r
list: '2'
strana: recto
sken: 95
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    dergleichen ämpter nach gunst mit personen besetzt/ die es zuthůn nie gebraucht noch gesehen haben/ vnd stehet mancher gewaltiger Knecht dabei/ der solches erfaren vnd verstendig ist/ der můß daruon bleiben/ vnd sehn das einer ein befelch hat vnd nichts außrichten kan/ sonder nach gunst darzů genommen worden/ vnd wol ein gantzer hauff auch keinn gefallen darzů hat/ wissen daß sie nicht mit jhm versorgt seind/ ob wol dieselbig person schon hertzhafftig ist/ vnd gern thet was sie solt/ wann sie den verstandt daruon hett/ dardurch wirt aber vil verseumpt/ dieweil sie der sachen nit bericht ist.
  cs: |-
    podobné úřady obsazují podle přízně osobami, které nikdy nic takového nedělaly ani neviděly; a přihlíží tomu nejeden zdatný knecht {Knecht}, který je v tom zkušený a znalý, ale musí zůstat stranou a dívat se, jak má velení někdo, kdo nic nedokáže a byl k tomu vzat jen z přízně – a ani celý houf {hauff} s tím není spokojen, neboť vědí, že pod ním nejsou v bezpečí. I kdyby taková osoba byla sebevíc statečná a ráda by konala, co má, kdyby tomu jen rozuměla, přesto se tím mnoho zamešká, protože věci není znalá.
- typ: odstavec
  de: |-
    Derhalben so ist nicht gůt das mann vil Obersten habe/ sonder der Kriegsherr sei der recht Oberster vber alles/ vnd dann einn obersten Leutenant/ auch ein Obersten vber die Reysigen/ vnd einn Obersten vber die Knecht. Nun möcht einer sagen/ Ja wann ich nur einen Obersten vber die Reutter/ vnd einen vber die Knecht haben soll/ so muß ich der Rechten erfarnen grossen Kriegsleut entrathen/ dann wann dieselbigen nicht eygen Regiment haben sollen/ so wöllen sie vnder dem andern/ dem das Regiment befolhen wirt/ nicht sein? Ist war/ dem ist wol zuthůn/ Wann ein Herr solche verstendige Kriegsleut hat/ von der Herrschafft vnd vom Adel/ dieselbigen soll er bei sich nemen als sein Kriegsräth/ daß sie auff jn warten/ helffen vnnd rathen den Krieg regiern/ das ist jnen ansehenlicher/ vnd dem Herren auch nützer/ auß disen vrsachen.
  cs: |-
    Proto tedy není dobré mít mnoho plukovníků {Obersten}; naopak válečný pán {Kriegsherr} ať je pravým nejvyšším velitelem nade vším, a pak ať má jednoho nejvyššího poručíka {obersten Leutenant}, jednoho plukovníka nad jízdou {Reysigen} a jednoho plukovníka nad knechty. Někdo by mohl namítnout: „Ano, když mám mít jen jednoho plukovníka nad jezdci a jednoho nad knechty, pak se budu muset obejít bez pravých, zkušených velkých válečníků {Kriegsleut}, neboť nemají-li mít vlastní pluk {Regiment}, nebudou chtít sloužit pod jiným, jemuž byl pluk svěřen.“ Je to pravda, ale dá se to snadno zařídit: má-li pán takové rozumné válečníky z panstva a ze šlechty, má si je vzít k sobě jako své válečné rady {Kriegsräth}, aby mu byli k ruce a pomáhali a radili při vedení války – to je pro ně čestnější a pro pána také užitečnější, a to z těchto příčin:
- typ: odstavec
  de: |-
    Wann ein Herr hat bei sich solche gewaltige Kriegsuerstendigen/ dieselbigen kündten in allen sachen helffen vnd rathen/ besser dañ wan sie vnder dem Kriegsuolck weren/ vnd jre Regiment versehen/ Dann seind sie im Regiment vnd Obersten/ so warten sie jrer sachen/ vnnd wöllen jren standt haben/ tragent einem Herrn vil auff/ ist dann derselbigen einer/ dem finantzen etwan geneigt vnd anhengig ist/ so kan er solchs desto besser treiben/ Ist er aber bei seim Kriegsherrn/ wie ein rath/ vnd wart auff sein leib/ so kan er das nit gebrauchen/ sonder daß selbig helffen versehen vnd verhůten/ den anderen so im Regiment seind/ die sich solcher Practica vnd finantz gebrauchen wolten/ Dann es were seines ampts mit solchem allem/ was dem Herren zu nachtheil komen mag anzuzeigen/ vnd helffen zufürkomen/ wie ein kriegs rath vom Herrn alle ordenung vnd Policei weyß daß der Krieg erfordert helffen bedencken/ versehen vnd ordenen/ deßgleichen mit mosterung vnd andern mehr. Auch so hat ein Herr sie im feld wan mann zeucht zugebrauchen/ daß sie jm helffen die ordenung machen/ zu ziehen mit dem Kriegsuolck/ Geschütz/ wagen vnd roß/ Vnd dabei fornen/ neben/ hinden reyten vnd in ordenung behalten vnnd regieren
  cs: |-
    Když má pán při sobě takové zdatné znalce války, mohou mu pomáhat a radit ve všech věcech lépe, než kdyby byli mezi válečným lidem {Kriegsuolck} a spravovali své pluky. Neboť jsou-li v pluku a jako plukovníci, hledí si svých záležitostí, chtějí mít svůj stav {standt} a pánovi způsobují mnoho nákladů; a je-li některý z nich navíc nakloněn a oddán fintám {finantzen}, může je provozovat o to snadněji. Je-li však u svého válečného pána jako rada a slouží při jeho osobě, nemůže takto jednat, nýbrž naopak pomáhá tomu předcházet a bránit těm ostatním, kteří jsou v pluku a chtěli by se uchylovat k takovým úkladům {Practica} a fintám. Neboť je povinností jeho úřadu, aby všechno, co by mohlo být pánovi na škodu, oznamoval a pomáhal tomu zabránit, a aby jako válečný rada spolu s pánem promýšlel, zařizoval a nařizoval veškerý řád a dobrou kázeň, jež válka vyžaduje, stejně jako při přehlídkách {mosterung}[^1] a jiných věcech. Pán je také může využít v poli při tažení, aby mu pomáhali tvořit šik {ordenung} při pochodu s válečným lidem, děly {Geschütz}, vozy a koňmi, a přitom jeli vepředu, po stranách i vzadu, udržovali pořádek a řídili [vojsko],
poznamky:
- n: 1
  text: Tisk má nářeční podobu *mosterung* místo *Musterung* (přehlídka).
