poznamky:
- n: 1
  text: Součet strany za položky 3–6 (Christoffel von Bortzfelt až Rudolff von Bortzfelt). Tištěná částka 139 zl. 6 bac. je totožná se součtem položek 7–10 níže a s položkami 3–6 (dohromady 237 zl. 9 bac.) nesouhlasí; počty koní, trénních koní a vozů sedí. Číselné nesrovnalosti tohoto rejstříku nelze z tisku plně rozřešit.
- n: 2
  text: Tisk „Jost von Altar Mandelsa“ se slovesem v množném čísle („haben … sind“); jde patrně o Josta von Alten a [Gieße] von Mandelsen z přehlídkového lístku Henickena von Bortzfelt [[6-009r|na listu 9]]. Položka neuvádí počet koní.
- n: 3
  text: Číslování položek přeskakuje z 10 na 13 – Vick a Jost von Velten jsou dvě osoby (v přehlídkovém lístku položky 8 a 10).
