bloky:
- typ: obrazek
  soubor: drevorez-390.jpg
  popis: |-
    Dřevořez v rámečku (tištěný na šířku strany, otočený o 90° vlevo) znázorňující těžký moždíř v masivní dřevěné stolici při pohledu z boku. Na bočnici je vidět ozubené kolo čepového věnce, kované pásy se hřeby, zajišťovací řetěz a dole při okraji kamene destička s rytým monogramem a letopočtem „1556“.
- typ: odstavec
  de: |-
    ZVm vierdtzehenden ein grosser Mortier inn seim stul vber die seiten an zusehen vnd wie derselbige stul gemacht vnd beschlagen sein sol/ vnd wie der mit einem Welbaum auff vnd nider gewunden wirdt/ vnd der strick so mann den Mortier mit auff vnd nider windt/ der geht vber den Welbaum durch den eingelegten gerönden bodem des stulß biß an des Mortiers bodem/ also wirt der Mortier mit dem Welbaum vnd durch gehenden strick auff vnd nider gelassen vnd gericht.
  cs: |-
    Za čtrnácté: velký moždíř {Mortier} ve své stolici {stul} při pohledu z boku – jak má být stolice sestrojena a okována a jak se moždíř hřídelem {Welbaum} zvedá a spouští. Provaz, jímž se moždíř vytahuje a spouští, vede přes hřídel skrz vložené zaoblené dno stolice až ke dnu moždíře; takto se moždíř pomocí hřídele a procházejícího provazu zvedá, spouští a zaměřuje.
