list: 7 (4. kniha)
strana: recto
sken: 401
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    ZVm zwentzigsten ein Werffzeug oder Schlencker/ wie mann die vor zeiten gehabt vnd gebraucht hat/ die sind wider in ein ernstlichs Werck zurichten vnd zubringen/ daruon ich (wils Gott) ein eigen Bůch machen wil/ von disem Werffzeug/ Steinbüchsen vñ Mortiern/ das ich verhoff ein ernstliche vnd eilende handelung auß zurichten/ vñ halt mich dises gewiß/ Ich wil es aber zu diser zeit nach bei mir behalten biß etwan zu einer notwendigen handelung/ aber doch mitler zeit (wils Gott) wil ichs in rechte gewisse proben bringen vñ zurichten/ mit aller seiner zurichtung vnd röstung/ vnnd (wils Gott) neben dem auch in visierung vnd schrifftlichen brauch füren/ das hinfurt solches verstanden werde/ das solches gewiß vnd gerecht sein muß/ vnd gůt auß meinem bericht zu machen sein mag/ dann ich verhoffe zu Gott es soll noch etwas treffliches darmit außgericht werden/ darbei ich es jetzund nach zur zeit bleiben lassen will.
  cs: |-
    Za dvacáté: vrhací stroj {Werffzeug} neboli prak {Schlencker}, jak jej mívali a užívali za starých časů; ty lze opět uvést a přivést k vážnému bojovému užitku, o čemž (dá-li Bůh) chci sepsat zvláštní knihu – o tomto vrhacím stroji, kamenných dělech {Steinbüchsen} a moždířích {Mortiern} – neb doufám, že jím lze vykonat ráznou a pohotovou akci, a považuji to za jisté. Chci si však toto tajemství pro nynější čas ještě podržet u sebe až do nějaké naléhavé potřeby; mezitím však (dá-li Bůh) uvedu tento stroj se vší jeho úpravou a výbavou (*röstung*) do řádných spolehlivých zkoušek a vedle toho (dá-li Bůh) jej též převedu do nákresů a písemného návodu, aby tomu od nynějška bylo dobře rozuměno, že jest to jisté a spolehlivé a že to lze podle mého popisu dobře vyrobit; neboť doufám v Boha, že se tím ještě podaří vykonat něco znamenitého – při čemž to nyní pro tuto chvíli zanechám.
