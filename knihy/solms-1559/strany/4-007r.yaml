list: 7 (4. kniha)
strana: recto
sken: 401
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    ZVm zwentzigsten ein Werffzeug oder Schlencker/ wie mann die vor zeiten gehabt vnd gebraucht hat/ die sind wider in ein ernstlichs Werck zurichten vnd zubringen/ daruon ich (wils Gott) ein eigen Bůch machen wil/ von disem Werffzeug/ Steinbüchsen vnd Mortiern/ das ich verhoff ein ernstliche vnd eilende handelung auß zurichten/ vnd halt mich dises gewiß/ Ich wil es aber zu diser zeit nach bei mir behalten biß etwan zu einer notwendigen handelung/ aber doch mitler zeit (wils Gott) wil ichs in rechte gewisse proben bringen vnd zurichten/ mit aller seiner zurichtung vnd röstung/ vnnd (wils Gott) neben dem auch in visierung vnd schrifftlichen brauch füren/ das hinfurt solches verstanden werde/ das solches gewiß vnd gerecht sein muß/ vnd gůt auß meinem bericht zu machen sein mag/ dann ich verhoffe zu Gott es soll noch etwas treffliches darmit außgericht werden/ darbei ich es jetzund nach zur zeit bleiben lassen will.
  cs: |-
    Za dvacáté: vrhací stroj {Werffzeug} neboli prak {Schlencker}, jaký se za starých časů míval a užíval. Takové stroje lze znovu připravit a uvést do vážného válečného užití. Chci o tom (dá-li Bůh) sepsat zvláštní knihu – o tomto vrhacím stroji, kamenných dělech {Steinbüchsen} a moždířích {Mortiern} –, neboť doufám, že jimi lze provést vážnou a rychlou akci, a jsem si tím jist. Pro tuto chvíli si to však chci ještě ponechat u sebe až pro nějakou naléhavou potřebu. Mezitím však (dá-li Bůh) stroj se vší jeho úpravou a výbavou (*röstung*) řádně a spolehlivě vyzkouším a připravím a vedle toho jej (dá-li Bůh) zpracuji i v nákresech a písemném návodu, aby se napříště rozumělo, že je to jisté a správné a že jej lze podle mého popisu dobře zhotovit. Doufám totiž v Boha, že se jím ještě vykoná něco znamenitého; a při tom to nyní pro tuto chvíli nechám.
