bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    als in allen andern Kriegsübungen / es sei schlagen / belegern / schantzen / schiessen / oder stürmen / dann zeucht er bei nacht ab / ist zubesorgen sein Kriegsuolck stele sich heimlich oder fliehe in der nacht von jm daß er mit den vbrigen / den Feinden wann sie an jn komen / vil zu schwach sei / vnd dannoch das Geschütz / Wägen vnd Troß verlassen / vnnd mit spot daruon weichen / oder fliehen müssen.
  cs: |-
    jako při všech ostatních válečných podnicích, ať je to bitva, obléhání, budování šancí, ostřelování nebo útok. Neboť odtáhne-li v noci, je třeba se obávat, že se jeho válečný lid {Kriegsuolck} v noci potají vytratí nebo od něj uprchne, takže se zbytkem bude pro nepřátele, až na něj narazí, příliš slabý a přece bude muset zanechat děla {Geschütz}, vozy i trén {Troß} a s ostudou ustoupit nebo utéct.
- typ: odstavec
  de: |-
    Thůt er dann den abzug beim hellen tag / vnd sicht die Feind ernstlich zu roß vnd fuß / mit handrorn vnd ringem feld geschütz an jm hangen / muß er abermals einer flucht mit grossen sorgen gewarten / angesehen / wie oben zum theil daruon geredt / die jenigen so abziehen / das Feld vnd hertz mehr dann halb verloren / vnd dargegen die feind dasselbig gewunnen vnd entpfangen haben.
  cs: |-
    Koná-li pak ústup za bílého dne a vidí nepřátele na koni i pěšky s ručnicemi {handrorn} a lehkými polními děly dorážející na něj s plnou vážností, musí se opět s velikými obavami nadít útěku, vzhledem k tomu, jak bylo výše zčásti řečeno, že ti, kdo odtahují, již více než z poloviny ztratili pole i srdnatost, kdežto nepřátelé je naopak získali a nabyli.
- typ: odstavec
  de: |-
    Deßhalben ist das mehrertheil der Kriegserfarnen vnd verstendigen meynung daß ein jeder Oberster im Rath / oder sonst gantz still mit vmbgehe / wann es nacht wirt / heimlich laß ansagen / das groß vnd schwer Geschütz sampt dem Troß / vmb mitnacht auffs aller stillest laß hinziehen / vnd er darnach ein stund oder anderthalb vor tag mit allem andern Kriegsuolck / daß er nit nach notturfft zum geschütz vnd Troß geordnet hat / vffs aller stillest vff sei / vnd ehe es die Feind jnnen werden / ein zimlichen vorteil des wegs habe erlangt / wöllen dann die Feind mit vil Volcks vnd ordnung nacheilen / so mags nicht gesein / komen sie dann mit wenig volcks / oder vnordenlicher vnordnung nach zu jagen / daß sie der Oberst zuschlagen vnderstünd / wie etwan geschehen / vnd vorhin auch daruon angezeigt. Darumb soll der Oberst am anzug zum Renfanen vnd lauffenden hauffen / alleweg den mehrer theil zu roß vnd fuß / sampt andern ehrlichen Kriegsleuten / zu hinderst ordnen / ob man schon nit schlecht / daß dieselbigen dannoch die Feind auffhalten / biß der Oberst mit dem Kriegsuolck in ein vortheil / oder gar an sein gewarsame kompt.
  cs: |-
    Proto má většina zkušených a rozumných válečníků za to, že každý nejvyšší velitel {Oberster} má v radě či jinak zachovávat v této věci naprostou mlčenlivost: jakmile nastane noc, nechá potají vydat rozkaz, o půlnoci nechá co nejtišeji odtáhnout velká a těžká děla spolu s trénem, a sám pak o hodinu či půldruhé před svítáním vyrazí co nejtišeji se vším ostatním válečným lidem, jejž podle potřeby nepřidělil k dělům a trénu; a dříve než to nepřátelé zpozorují, získá značný náskok v cestě. Budou-li pak chtít nepřátelé spěchat za ním s velkým vojskem a v šiku {ordnung}, nebude to možné; a pustí-li se za ním v pronásledování s malým počtem lidu nebo v nepořádném zmatku, mohl by se nejvyšší velitel pokusit je porazit, jak se někdy stalo a jak bylo již dříve uvedeno. Proto má nejvyšší velitel při odtahu[^1] postavit k předvojové korouhvi {Renfanen} a útočným pohyblivým houfům vždy největší díl jízdy i pěchoty spolu s jinými čestnými válečníky {Kriegsleuten} úplně dozadu, aby tito – i když se nebojuje – přece nepřátele zdrželi, dokud se nejvyšší velitel s válečným lidem nedostane do výhodného postavení nebo docela do bezpečí.
- typ: odstavec
  de: |-
    Es mag auch ein abzug bei einem Obersten vnd seinen Kriegsuerstendigen / also sorglich angesehen werden / daß er das groß oder alles geschütz versencken / heimlich vergraben / oder gar zu stücken sprengen / die wägen verbrent oder stehn bleiben / dann gilt es / pfuch der hinderst.
  cs: |-
    Ústup však může být nejvyšším velitelem a jeho války znalými muži shledán i tak nebezpečným, že velká nebo všechna děla nechá potopit, tajně zakopat či docela roztrhat na kusy, a vozy se spálí nebo zanechají stát – tehdy platí: hanba poslednímu!
- typ: odstavec
  de: |-
    Von Türcken ziehen wir Teutschen nicht ab dann mit gewalt / sie seind vns mit eilen vil zugeschwindt / weil nun alle abzüg gantz spitzig vnd beschwerlich sind / vnd anderst (wie gehört) gründtlicher nit daruon geredt werden kan / wirt es billich / wie vorhin in etlichen puncten / dem Obersten vnd seinen verstendigen / wie sie jeden abzug füglich thůn mögen / befolhen. Noch sein zwen Artickel die ein jeder Oberster in gůter gedechtnuß behalten soll / Erstlich wann er ein Flecken hat
  cs: |-
    Od Turků {Türcken} my Němci neustupujeme jinak než násilím, jsou na nás v rychlosti příliš hbití. Poněvadž jsou tedy všechny ústupy velmi ošidné a obtížné a jinak (jak řečeno) o nich nelze důkladněji pojednávat, ponechává se to právem, tak jako dříve v některých bodech, na nejvyšším veliteli a jeho zkušených mužích, jak každý ústup vhodně provedou. Jsou tu však ještě dva články, které má mít každý nejvyšší velitel v dobré paměti: za prvé, oblehl-li městečko
poznamky:
- n: 1
  text: |-
    V předloze „am anzug“ (dosl. při nástupu k pochodu), z kontextu zřetelně ve významu odtahu či ústupu.
