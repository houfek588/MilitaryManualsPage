  popis: |-
    Celostránkový dřevořez o dvou polích:
    • Horní pole („I .1558.“ nahoře, monogram „BF“ na spodní desce pažení nádrže): „vodní měch“ (*Wasserplaßbalch*) k tichému odčerpávání spodní vody z podkopových štol. Velký měch zavěšený na svislé sací trubici nad čtvercovou roubenou jímkou s vodou vytlačuje při stlačení vojákem vpravo silný proud vody přední hubicí do odtokového potůčku; v pozadí hrad na kopci.
    • Dolní pole („.K.“): nahoře dvě spojené kožené roury (*ledern Rörn*) a pod nimi dlouhé smolou vymazané prkenné bednění (žlab) chránící koženou zápalnou trubici naplněnou prachem; dole průřez hornickou štolou s dvojitým větrným měchem v ústí napravo, vhánějícím čerstvý vzduch dřevěnými a koženými rourami s otočnými čepy (*Zeplein*) hluboko do chodby.
