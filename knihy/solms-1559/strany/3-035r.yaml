stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    geschriben stet/ fül den mit einem Sandt auß/ thů ein schnürgebendt darüber/ vnd schlag den Sack also in dem schnürgebendt schon rundt/ däffe es daruber/ bindt vnd däffe es wider biß es groß gnůg wirdt/ darnach laß den sandt wider herauß lauffen/ so ist die kugel hol/ darinn mag mann dann thůn ein Zeug was man für ein wil/ ein rössen oder faullen.
  cs: |-
    psáno stojí, naplň jej pískem, dej na něj provazové ovázání {schnürgebendt} a sklepávej pytel v tom ovázání pěkně dokulata; zalij to zápalným potahem {däffe}, znovu ovaž a zalij, dokud nebude dost velký. Potom nech písek zase vysypat ven; tak bude koule {kugel} dutá a lze do ní dát jakoukoli hmotu, prudkou či pomalou.
- typ: odstavec
  de: |-
    Ein Kugel die schöß oder schläg in jr hat darzů mach plechenrörn/ lad die mit schießpuluer vnd daruor ein kugel/ oder zu eim Probfeur/ schlag höltzen pflöcklin für die schnallen gleich hart/ die Rörn sollen hinden ein zintlöchlin haben/ dieselbig Rör soll mit wie die secklin eingebunden oder gesteckt werden/ Die schnür oder strick da man die kugeln mit bindt/ dem kan ich hie bei kein maß geben/ dann darnach die Kugeln groß sind/ darnach nimpt man die strick groß oder klein/ deßgleichen die Secklin die gefült sind/ vnd die Rörlin mit den schlegen.
  cs: |-
    Pro kouli, která má v sobě střely či výbušné nálože {schläg}, zhotov plechové trubičky, nabij je střelným prachem {schießpuluer} a před něj dej kuličku; anebo pro zkušební oheň zatluč na rány[^1] stejně pevně dřevěné kolíčky. Trubičky mají mít vzadu zátravku {zintlöchlin} a mají se vázat či zasouvat [do koule] spolu s váčky. Pokud jde o šňůry či provazy, jimiž se koule ovazují, nemohu tu udat žádnou míru, neboť podle velikosti koulí se berou provazy silné nebo slabé; a stejně tak naplněné váčky a trubičky s výbušnými náložemi.
- typ: odstavec
  de: |-
    Diß sind nů die hauptstück des gezeugs zu dem Feurwerck/ die etwas außrichten/ vnd der zeug vmb ein zimlich gelt zubekommen ist.
  cs: |-
    To jsou tedy hlavní složky hmoty k ohňostroji {Feurwerck}, které něco zmohou a které lze pořídit za přiměřenou cenu.
- typ: odstavec
  de: |-
    Von disen dingen vil zu schrieben wie mann mit vmbgehn soll/ lest sich nit also schreiben/ wann einer das list daß ers darumb künden soll ist betrug/ welcher sich aber daruff verleßt vnd wil mit Feurwerck vmbgehn/ der soll es lesen vnd was er lißt von stundan versuchen/ damit er den zeug lerne erkennen vnd machen/ dann zum ersten sol einer lernen den fülzeug machen/ daran er sicht was ein zeug vor dem andern ist/ vnd einer sehr oder langsam brent vor dem andern/ Also sind die stück beschriben wie sie zu samen gehörn/ doch soll er auch sehen ob jm der zeug zu starck sei/ thů er der schwachen materien desto mehr darinn biß so lang daß er gerecht brent/ brent er aber schwach so geb er jm starcken zeug als Salpeter zů/ so wirt er stärcker vnd rösser/ wann er den also gemacht hat daß er gerecht vnd starck gnůg ist/ dann beschreib er jn/ Das ist die vbung/ der recht Meister/ die beschreibung/ der erst anfang vnd anweissung.
  cs: |-
    Psát o těchto věcech mnoho,[^2] jak s nimi zacházet, se takto nedá; a myslí-li si někdo, že to bude umět, protože to přečte, je to klam. Kdo se však na to chce spolehnout a pracovat s ohňostrojem, má to číst a co přečte, hned vyzkoušet, aby se naučil hmotu poznávat a vyrábět. Nejprve se má naučit dělat plnicí hmotu; na ní uvidí, čím se jedna směs liší od druhé a jak jedna hoří prudčeji nebo pomaleji než jiná. Tak jsou zde popsány jednotlivé složky, jak k sobě patří. Musí však také sledovat, zda pro něj není hmota příliš silná; pak do ní přidá tím víc slabé látky, dokud nebude hořet správně. Hoří-li slabě, ať přidá silné látky, jako je ledek {Salpeter}, a bude silnější a prudší. Až ji takto vyrobí, že je správná a dost silná, ať si ji zapíše. Praxe je pravý mistr, popis jen první začátek a návod.
- typ: odstavec
  de: |-
    Darnach soll einer acht haben auff das binden/ daß er das gebend lern recht machen/ das wil auch der gebrauch vnnd die erfarung thůn/ aber besser ist ein Kugel offt gebunden mit zimlichen schnürn/ dann einmal gebunden mit gar grossen/ besonder die auß Cartaunen sollen geschossen werden/ welchs die Figurn anzeigen/ doch will es versucht sein/ Darumb welcher mit disem ding wil vmbgehn/ der gedenck daß er dem schreiben nicht vertraw/ sonder mach schöß vnnd werff.
  cs: |-
    Potom má dbát na ovazování, aby se naučil ovázání dělat správně, k čemuž rovněž přispěje praxe a zkušenost. Lepší je ovšem kouli ovázat víckrát přiměřenými šňůrami než jednou příliš silnými, zvláště ty, které se mají střílet z kartoun {Cartaunen}, jak ukážou nákresy; přesto je třeba to vyzkoušet. Kdo tedy chce s touto věcí zacházet, ať pamatuje, že nemá spoléhat na psaní, nýbrž sám střílet a vrhat.
- typ: odstavec
  de: |-
    Item es ist der gebrauch bei den Meistern wann sie Feurkugeln machen/ so zinden sie die zuuor im Mörser ehe dann die Büchen
  cs: |-
    Dále: u mistrů je zvykem, že když dělají ohnivé koule {Feurkugeln}, zapalují je v moždíři {Mörser} dříve, než dělo {Büchen}[^3]
poznamky:
- n: 1
  text: Výraz *für die schnallen* znamená „pro rány / třesky“ (od *Schnall* – prudká rána, prásknutí).
- n: 2
  text: V tisku přehozená koncovka *schrieben* za *schreiben*.
- n: 3
  text: V tisku vypadlé *-s-* v slově *Büchen* místo *Büchsen* („dělo“).
