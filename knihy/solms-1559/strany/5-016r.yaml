bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    leichter/ dann an ein ort/ doch so will das noch der gelegenheit vnd haltung des Feinds gethan werden.
  cs: |-
    snazší než na jednom místě; přesto se to však musí řídit příležitostí a počínáním nepřítele.
- typ: odstavec
  de: |-
    Vnd wann mann also will oder muß ein Kriegßuolck haben/ soll solche Rüstung zuuor wol vnd fleissig gemacht werden/ vnd wann mann die also wol vberschlagen vnd geordnet hat/ soll mann sich dann nach gůten gewissen Kauffleuten oder Marcatanten vmbthůn/ vnd mit denselbigen die Rechnung wider vorsich nemen vnd vbersehn/ vnd daruff mit einem vmb Korn/ mit dem andern vmb fleisch/ mit dem dritten vmb Dranck/ mit dem vierdten vmb Buttern/ Saltz/ Keß/ dörr Fisch vnd dergleichen handeln/ was die notturfft erfordert/ vnd in ein Leger dem Kriegßuolck zusteht/ vnd wan die Marcatanten wissen mit was summen sie allen tag das Leger speissen vnd vnderhalten müssen/ so soll man solliches mit jnen gewiß machen/ vnd für abscheiden vnd war das sie es füren sollen/ es sei zu wasser oder zu Landt/ nach einer jeden gelegenheit die Leger ligen oder ziehen/ vnnd das mann die leger auff ein mal mit dem Brott nicht vberfüre noch bache/ dann das Brott verdirbt bald/ so soll mann es auch in die leng richten/ so man aber lang im Felt sein will/ darnach soll sich der Prouiantherr mit seinen Marcatanten schicken vnd vergleichen.
  cs: |-
    Chce-li nebo musí-li tedy někdo mít válečný lid, má se taková příprava {Rüstung} předem dobře a pečlivě provést. Když se to takto dobře propočítá a uspořádá, má se poohlédnout po dobrých, spolehlivých kupcích či markytánech {Marcatanten}, s nimi znovu probrat a přehlédnout rozpočet a potom s jedním vyjednat o žito, s druhým o maso, se třetím o nápoje, se čtvrtým o máslo, sůl, sýr, sušené ryby a podobně – co potřeba vyžaduje a co v ležení {Leger} válečnému lidu náleží. A když markytáni vědí, jakým množstvím musejí ležení každý den živit a zásobovat, má se to s nimi pevně ujednat a předem domluvit, kam to mají dovážet, ať po vodě či po souši, podle toho, kde ležení leží nebo kudy táhnou. Ležení se také nemá najednou zavalit chlebem ani se ho nemá napéct příliš, neboť chléb se brzy kazí; má se to proto rozvrhnout na delší dobu. Hodlá-li se však zůstat v poli dlouho, podle toho se má proviantní pán {Prouiantherr} se svými markytány zařídit a dohodnout.
- typ: odstavec
  de: |-
    Mann sagt daß der Türck ein Zug durch Poln/ Ifflandt vnd daselbst durch herauß/ vnd fort auff die Marck/ Meissen/ Döringen vnd in dise Lande nemen kündt/ dann er habe ein eben weit vnnd frucktreich landt. Dargegen sagen andere/ daß es auch zum theil ein wüst vnfrucktbar landt sei/ vnd grosse gemöß vnd gůt wassersträm hab/ vnd wann mann in der zeit derselbigen acht neme/ so würde er sie on grossen schaden nicht ziehen künden.
  cs: |-
    Říká se, že Turek by mohl táhnout přes Polsko a Livonsko, odtud ven a dále na Marku [Braniborskou], Míšeňsko, Durynsko a do těchto zemí, neboť má prý před sebou rovnou, širou a úrodnou zemi. Jiní naproti tomu říkají, že je to zčásti také pustá a neúrodná země s velikými močály a vydatnými vodními toky; a kdyby se na ně včas dbalo, nemohl by jimi projít bez veliké škody.
- typ: odstavec
  de: |-
    So dem dann also/ daß solche grosse gemöß vnd wasser weren/ bedeucht mich/ daß mann sie zu hilff neme/ die wasser groß und klein zu sampt dem Landt vergraben hett/ vnd die wasser welche mössig sind/ durch die gräben die Möß zusamen graben/ daß sie also zusamen beschlossen seien/ vnnd wo die peß darzwischen sind/ daß mann daruff starcke gewaltige Blochäuser mit jren Schleusen legt/ damit mann das wasser in die landt heben vnd treiben kan/ vnd daß solche Blochäuser nach gelegenheit der landt gewaltig grosz vnd klein gemacht werden/ damit im fall der not ein groß landtuolck man darin legen kündt/ wie die peß das erfordern/ deßgleichen wo stät legen die ein grösse vnd gelegenheit hetten/ vnd zu befestigen weren/ daß man sie zum besten vermecht.
  cs: |-
    Je-li tomu tak, že jsou tam takové veliké močály a vody, zdá se mi, že by se měly vzít ku pomoci: vody velké i malé spolu se zemí přetnout příkopy a bažinaté vody spojit příkopy s močály tak, aby byly navzájem uzavřené. A kde jsou mezi nimi průsmyky {peß}, aby se na ně postavily silné, mohutné sruby {Blochäuser} se stavidly {Schleusen}, jimiž lze vodu v zemi vzdouvat a hnát. Takové sruby se mají podle povahy země stavět velké i malé, aby se do nich v případě nouze dal položit početný zemský lid {landtuolck}, jak to průsmyky vyžadují. A rovněž tam, kde leží města, která mají potřebnou velikost a polohu a dala by se opevnit, aby se co nejlépe zajistila.
- typ: odstavec
  de: Wann dann also etliche Stät befestiget würden/ die den strassen
  cs: Kdyby se takto opevnilo několik měst, která by ležela u silnic
