bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    leichter/ dann an ein ort/ doch so will das noch der gelegenheit vnd haltung des Feinds gethan werden.
  cs: |-
    snáze než na jednom místě; přesto se to však musí činit podle příležitosti a chování nepřítele.
- typ: odstavec
  de: |-
    Vnd wann mann also will oder muß ein Kriegßuolck haben/ soll solche Rüstung zuuor wol vnd fleissig gemacht werden/ vnd wann mann die also wol vberschlagen vnd geordnet hat/ soll mann sich dañ nach gůten gewissen Kauffleuten oder Marcatanten vmbthůn/ vnd mit denselbigen die Rechnung wider vorsich nemen vnd vbersehn/ vnd daruff mit einem vmb Korn/ mit dem andern vmb fleisch/ mit dem dritten vmb Dranck/ mit dem vierdten vmb Buttern/ Saltz/ Keß/ dörr Fisch vnd dergleichen handeln/ was die notturfft erfordert/ vñ in ein Leger dem Kriegßuolck zusteht/ vñ wan die Marcatanten wissen mit was summen sie allen tag das Leger speissen vñ vnderhalten müssen/ so soll man solliches mit jnen gewiß machen/ vñ für abscheiden vñ war das sie es füren sollen/ es sei zu wasser oder zu Landt/ nach einer jeden gelegenheit die Leger ligen oder ziehen/ vnnd das mann die leger auff ein mal mit dem Brott nicht vberfüre noch bache/ dann das Brott verdirbt bald/ so soll mann es auch in die leng richten/ so man aber lang im Felt sein will/ darnach soll sich der Prouiantherr mit seinen Marcatanten schicken vnd vergleichen.
  cs: |-
    Chce-li či musí-li člověk tedy mít válečný lid, má se taková příprava učinit předem dobře a pilně; a jakmile se vše dobře propočítá a uspořádá, má se poohlédnout po dobrých, spolehlivých kupcích či markytánech {Marcatanten}, znovu s nimi vzít a přehlédnout výpočet a potom s jedním sjednat žito, s druhým maso, se třetím nápoje, se čtvrtým máslo, sůl, sýr, sušené ryby a podobně, co jen potřeba vyžaduje a náleží do ležení {Leger} pro válečný lid. A když markytáni vědí, jakým množstvím musejí každý den tábor živit a zásobovat, má se to s nimi pevně uzavřít a předem vyjednat, kam to mají dovážet – ať po vodě či po souši, podle toho, kde tábory leží či táhnou; a aby se tábory najednou nepřeplnily chlebem ani se jej nenapeklo příliš, neboť chléb se rychle kazí, nýbrž aby se to zařídilo na delší dobu. Chce-li se být dlouho v poli, podle toho se má proviantní pán {Prouiantherr} se svými markytány zařídit a dohodnout.
- typ: odstavec
  de: |-
    Mann sagt daß der Türck ein Zug durch Poln/ Ifflandt vnd daselbst durch herauß/ vnd fort auff die Marck/ Meissen/ Döringen vñ in dise Lande nemen kündt/ dann er habe ein eben weit vnnd frucktreich landt. Dargegen sagen andere/ daß es auch zum theil ein wüst vnfrucktbar landt sei/ vnd grosse gemöß vnd gůt wassersträm hab/ vnd wann mann in der zeit derselbigen acht neme/ so würde er sie on grossen schaden nicht ziehen künden.
  cs: |-
    Říká se, že by Turek mohl podniknout tažení skrze Polsko, Livonsko {Ifflandt} a odtud dále na Braniborsko {Marck}, Míšeňsko, Durynsko a do těchto zemí, neboť prý má před sebou rovnou, širou a úrodnou krajinu. Proti tomu říkají jiní, že to jest zčásti také pustá a neúrodná země s velikými močály a vydatnými vodními toky, a kdyby si jich člověk včas všiml, nemohl by jimi projít bez veliké škody.
- typ: odstavec
  de: |-
    So dem dann also/ daß solche grosse gemöß vnd wasser weren/ bedeucht mich/ daß mann sie zu hilff neme/ die wasser groß und klein zu sampt dem Landt vergraben hett/ vnd die wasser welche mössig sind/ durch die gräben die Möß zusamen graben/ daß sie also zusamen beschlossen seien/ vnnd wo die peß darzwischen sind/ daß mann daruff starcke gewaltige Blochäuser mit jren Schleusen legt/ damit mañ das wasser in die landt heben vnd treiben kan/ vnd daß solche Blochäuser nach gelegenheit der landt gewaltig grosz vnd klein gemacht werden/ damit im fall der not ein groß landtuolck man darin legen kündt/ wie die peß das erfordern/ deßgleichen wo stät legen die ein grösse vnd gelegenheit hetten/ vnd zu befestigen weren/ daß man sie zum besten vermecht.
  cs: |-
    Jestliže tomu tak tedy jest, že tam jsou takové veliké močály a vody, zdálo by se mi vhodné vzít si je ku pomoci, vody veliké i malé spolu se zemí prokopat a močálovité vody příkopy propojit s bažinami tak, aby byly souvisle uzavřeny; a kde mezi nimi jsou průsmyky {Paß}, na ty položit silné mohutné sruby {Blochhaus} s jejich stavidly, aby se dala voda v krajině vzdouvat a zaplavovat ji. Takové sruby ať se stavějí podle povahy krajiny veliké i malé, aby se do nich v případě nouze dal položit četný zemský lid, jak průsmyky vyžadují; rovněž kde leží města mající vhodnou velikost a polohu a hodící se k opevnění, aby se co nejlépe zabezpečila.
- typ: odstavec
  de: |-
    Wann dann also etliche Stät befestiget würden/ die den strassen
  cs: |-
    Kdyby se takto opevnilo několik měst, která by u silnic
