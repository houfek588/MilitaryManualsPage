  popis: |-
    Celostránkový dřevořez velkého císařského znaku Karla V. v obdélném rámečku: korunovaný štít s dvouhlavým říšským orlem a habsbursko-španělským srdečním štítkem, obklopený řetězem řádu Zlatého rouna se zavěšeným rounem a stuhou s třapci nad stylizovanou zvlněnou půdou. Po stranách stojí dva korunované Herkulovy sloupy; v horní části vlají nápisové pásky s nápisem „CAROLVS – PLVS. VLTRA – QVINTI – 15 – 44“ (Karel V., 1544).
