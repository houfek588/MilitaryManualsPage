bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Zuuerordneten die in gůter ordnung behalten / vnd so er dann soll vnd muß in der ordnung mit der Wagenburgk ziehen / soll er jm lassen Schützen mit rorn geben die zwischen dem Kriegsuolck vnd den wägen gehn / die soll er zu den wagen eintheiln in ordnung wie daß die notturfft erfordern wirt / vnnd soll die wagen so offt mann stil halten wirt in ein ander faren lassen / gleich als wann die feindt darauff rennen vnd fallen wölten / also wann der fürderst wagen stil helt daß der ander dann furt fare so weit das seine pferdt neben den andern wagen komen der vor jm helt / das dieselbige pferdt neben dem andern stehn vnd der fürderst wagen dieselbige pferdt gegen den feinden verdeckt / Also sollen alle wagen hinder einander mit den pferden hinder oder neben die wagen rücken / so werden alle pferdt mit den wagen verdeckt vnd deckt ein wagen dem andern seine pferdt / sonder der aller fürderst wagen der muß seine pferdt allein ploß halten vnd stehn lassen so man dann wider soll anziehen / laß mann sie auß einander ziechen / wie sie in vnd bei einander zogen sind / also komen sie in ein gebrauch / Würd es sich aber zutragen das ernst sein wirt / daß die feindt werden auff die Wagenburgk rennen / so sollen die wagen wider neben einander rücken / das die pferdt neben die wagen komen / vnd so mann es an dem geschütz gehaben mag / sollen vber zwentzig wagen ein büchsen eingetheilt sein / vnd die wagen nach den zwentzigsten wagen auff die seiten gegen den feinden außrücken so weit das zwischen jn ein büchsen stehn mag in der lücken da die zwen wagen neben einander stehn im wechsel / vnnd die Büchse soll also die leng an den ersten zwentzigsten wagen auß hin streichen / vnd an dem wagen der neben der Büchsen steht / sollen wider zwentzig wagen hinder sie stehen / die pferdt verdeckt wie vorhin / zu end der zwentzig wagen soll wider ein wagen außrücken gegen den feinden / vnd darzwischen ein büchsen wie vor / Also sol es hinder einander geordnet werden so lang die Wagenburg wert / wirt es sich aber begeben daß der angriff hindenher vnd doch auff die wagen kompt / so muß das geschütz hindersich zu streichen gericht sein vnd als dann so mussen die wagen jhre außrückung vnnd wechsel hinein gegen den freunden thůn / es kompt anders das geschütz in wendig der Wagenburgk gegen den freunden zu streichen / vnd so offt ein wechsel sein wirt da ein büchse steht / wo mann dann hett die wagen mit dem geschütz als nemlich jhre halb Falconetlin auff ein wagen / soll derselbigen wagen einer neben der büchsen stehn als der wagen der am ersten ist außgerückt kan die Büchsen dücken vnnd retten / derselbige wagen soll gemacht werden das die pferdt gar nit neben einander sonder vor einander gehn / das hinder gestel soll
  cs: |-
    přidělenými lidmi a udržovat je v dobrém pořádku. A má-li a musí-li tedy táhnout v šiku {ordnung} s vozovou hradbou {Wagenburgk}, ať si dá přidělit střelce {Schützen} s ručnicemi, kteří půjdou mezi válečným lidem {Kriegsuolck} a vozy; ty má rozdělit k vozům do šiku tak, jak to bude vyžadovat potřeba. Pokaždé, když se zastaví, má nechat vozy zajet do sebe, jako by na ně nepřátelé chtěli najet a vpadnout – totiž jakmile přední vůz zastaví, ať další popojede tak daleko, až se jeho koně dostanou vedle druhého vozu, jenž stojí před ním, takže tito koně stojí vedle druhého vozu a přední vůz tyto koně před nepřítelem kryje. Takto se mají všechny vozy za sebou s koňmi zasunout za vozy nebo vedle nich; pak jsou všichni koně vozy kryti a jeden vůz kryje koně druhému – kromě docela prvního vozu, který jediný musí své koně nechat stát nekryté. Když se pak má znovu vyrazit, nechají se vozy zase roztáhnout od sebe tak, jak do sebe a k sobě vjely; tím si na to navyknou. Kdyby však došlo k tomu, že půjde do tuhého a nepřátelé by na vozovou hradbu útočili, mají se vozy zase srazit vedle sebe, aby se koně dostali vedle vozů; a pokud bude dostatek děl {geschütz}, má být na každých dvacet vozů přiděleno jedno dělo {büchsen}, přičemž vozy po dvacátém voze mají vybočit do strany proti nepřátelům tak daleko, aby mezi nimi v mezeře, kde oba vozy stojí vedle sebe v přesazení, mohlo stát dělo; a toto dělo má takto zvenčí postřelovat podél prvních dvaceti vozů. U vozu, jenž stojí vedle děla, má stát dalších dvacet vozů za sebou s koňmi krytými jako předtím, a na konci těch dvaceti vozů se má opět jeden vůz vysunout proti nepřátelům a mezi ně dát dělo jako dříve. Takto to má být uspořádáno za sebou po celé délce vozové hradby. Stalo-li by se však, že by útok přišel zezadu, a přece na vozy, musí být děla namířena k postřelování dozadu, a tehdy musejí vozy provést své vysunutí a přesazení dovnitř směrem k vlastním, jinak by dělo uvnitř vozové hradby střílelo směrem k vlastním lidem. A pokaždé, když bude přesazení tam, kde stojí dělo, jsou-li k dispozici vozy s děly, totiž jejich poloviční falkonety {halb Falconetlin} na jednom voze,[^1] má jeden takový vůz stát vedle děla jako vůz, jenž vybočil jako první, a může dělo krýt[^2] a bránit. Tento vůz má být sestrojen tak, aby v něm koně vůbec nešli vedle sebe, nýbrž za sebou, a zadní podvozek má být
poznamky:
- n: 1
  text: |-
    V tisku „jhre halb Falconetlin“ (jejich/svá poloviční falkoneta); v obdobné pasáži Druhé knihy (list [[052r|52r]]) stojí „drei halb Falckanetlein“ (tři poloviční falkonety).
- n: 2
  text: |-
    Něm. *dücken* – dobový/nářeční tvar za *decken* (krýt).
