bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    an vnd lassen es also lang brennen/ vnd zinden darnach die Büchsen an/ ist nit gůt/ auch nit meisterlich/ dann man soll die Kugeln machen wan die Büchsen anzindt wirt daß die Kugeln damit an geht/ dann wann mann die Kugeln erst anzindt vnd also lang brent/ so künden die in eim Flecken mit gůter zeit besehen/ wo die Büchsen steht/ vnd was man darbei macht/ vnd jhre sachen darnach richten/ dann ein solliches anzinden leucht ein gantze schantz auß das nit geschicht wan man die Büchsen nit mehr anzindt/ die Kugel soll hinden mit einer eysen rörn gemacht werden/ also lang daß sie wol halben weg in die Kugeln geht in den rechten zeug/ vnd die Rörn soll hinden vnd in den seitten offen stehn/ so fer sie in der Kugeln steckt auch löcher haben/ vnd hinden ein handt breit lenger oder kurtzer vor gehn/ demnach die Kugel groß ist/ darnach soll sie lang vnnd weit gemacht sein/ vnd so das hinder theil soll in das Puluer gestossen werden/ so zindt die rör sich in dem Puluer an/ vnd laufft inn die Kugel/ die rör soll mit einem rössen zeug außgestossen sein/ vnd mit eim holtz hart darinn auff einander geschlagen/ biß auff ein finger breit an das ende/ dann soll es nit zu hart geschlagen sein/ so zindt es sich gern an/ dann wann es ein mal angeht/ so gehts nit wider auß/ wann es schon in ein wasser fil/ darumb so soll derselbige zeug/ der in der rörn ist nit schwach gemacht sein/ oder hart geschlagen/ das soll sich einer vor wol vben vnd lernen machen/ damit er des gewiß sei.
  cs: |-
    zapálí, nechají ji tak dlouho hořet a teprve potom zapálí dělo {Büchsen}; to není dobré ani mistrné. Koule {Kugeln} se totiž mají dělat tak, aby když se dělo zapálí, koule se chytila zároveň s ním; neboť když se nejprve zapálí koule a tak dlouho hoří, mohou ti v hrazeném městečku v poklidu obhlédnout, kde dělo stojí a co se u něj dělá, a podle toho se zařídit – takové zapalování totiž osvětlí celou šanci {schantz}, což se nestane, když se nezapaluje dříve než dělo samotné.[^1] Koule má být vzadu zhotovena se železnou trubičkou tak dlouhou, aby sahala dobrý půlcesty dovnitř do koule až do pravé zápalné hmoty; a trubička má být vzadu i po stranách otevřená a pokud vězí v kouli, má mít také otvory a vzadu má vyčnívat na šířku dlaně, více či méně podle toho, jak je koule velká – podle toho má být udělána dlouhá a široká. A když se zadní část zasune do střelného prachu {Puluer}, vznítí se trubička od prachu a oheň vběhne do koule. Trubička má být nacpána prudkou hmotou a dřevem v ní tvrdě udusána až na šířku prstu ke konci; tam to nemá být udusáno příliš tvrdě, aby se to snadno chytilo, neboť jakmile to jednou vzplane, už to nezhasne, ani kdyby to spadlo do vody. Proto ta hmota v trubičce nemá být udělána slabá ani [na konci] tvrdě ubitá; v tom se má každý předem dobře cvičit a naučit se to dělat, aby si tím byl jist.
- typ: odstavec
  de: |-
    Aber so mann Kugeln wil machen/ die inwendig sind mit gůtem Puluer auß gefült/ die zů springen sollen/ vnd schlagen wann sie zu ligen kommen/ dieselbige Rör soll lang sein/ das sie gehet biß an das ander ort der Kugeln/ vnd hinden hinauß soll sie lang sein/ damit sie in der lufft nit durch brenn/ vnd in den rössen zeug kome/ ehe dann die Kugel zu ligen kompt/ vnnd dieselbig soll auff der seiten kein loch haben/ biß hinden gar an dem ende/ solliches will gar wol probiert sein/ vnd die rör gar wol abgeeicht/ wirt es sich aber zutragen daß die Rör so lang sein muß/ das sie zulang in das Puluer gieng oder dardurch/ vnd die Kugeln hin dann trüg daß die nit auff das Puluer kommen wirdt/ so soll mann ein vorschlag von holtz machen vilfeltig oder dick daß die Kugel nit an dem Puluer ligt/ vnd solcher vorschlag soll ein loch haben/ das durch die Rör geht von der Kugeln/ vnd also soltu die Kugeln mit dem vorschlag inn die Büchsen schiben biß auff das Puluer/ so kompt die Rör inn das Puluer/ vnd zint sich darmit an/ darumb so wil ein vnderscheit sein in den Kugeln vnd Rörn/ das werden von aller hieuor beschribenen Kugeln ein jede nach jhre geberden gerissen werden/ vnd die Rörn so in dise
  cs: |-
    Když však chtějí dělat koule, které jsou uvnitř naplněny dobrým střelným prachem a mají se roztrhnout a vybuchnout, až dopadnou a zůstanou ležet, má být taková trubička dlouhá, aby sahala až na druhý konec koule, a také ven dozadu má být dlouhá, aby ve vzduchu neprohořela a nedostala se do prudké nálože dříve, než koule dopadne; a taková trubička nemá mít na boku žádný otvor až docela na samém konci. To vyžaduje velmi dobré vyzkoušení a pečlivé odměření trubičky. Kdyby se však stalo, že trubička musí být tak dlouhá, že by zasahovala příliš hluboko do prachu nebo skrz něj a držela by kouli zpět tak, že by nedolehla na prach, má se zhotovit dřevěná zátka {vorschlag} vícevrstvá či silná, aby koule neležela přímo na prachu, a tato zátka má mít otvor, jímž projde trubička od koule; a tak máš kouli se zátkou zasunout do děla až na prach, čímž se trubička dostane do prachu a jím se zapálí. Proto je třeba rozlišovat mezi koulemi a trubičkami; z každé z výše popsaných koulí bude vyobrazena každá podle své podoby,[^2] a trubičky, které do těchto
poznamky:
- n: 1
  text: V tisku stojí doslova *wan man die Büchsen nit mehr anzindt* („když se dělo už nezapaluje [znovu/zvlášť po kouli]“), tj. smyslem je současné zažehnutí koule výstřelem děla namísto předčasného zapalování koule před výstřelem.
- n: 2
  text: V tisku stojí *nach jhre geberden* („podle svých tvarů/podob“).
