bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    nemen / vnderweilen leßt mann die ansehenlichen personen / nur auff kleinen Klepperlin daruon reiten / vnd wirt sonst aber in andern fällen / wie erst gemelt / gehandelt.
  cs: |-
    vzít; někdy se urozeným osobám dovolí odjet jen na malých koníčcích {Klepperlin}, a jinak se v ostatních případech postupuje tak, jak bylo právě řečeno.
- typ: odstavec
  de: |-
    Zum vierdten / wirt ein Fleck vbergeben / daß die Kriegsleut mit Roß / Harnisch / Wehr / sampt aller jrer Hab vnd gůt abziehen / alßdann helt mann es aber wie erst angezeigt.
  cs: |-
    Za čtvrté bývá městečko vydáno tak, že válečníci {Kriegsleut} odtáhnou s koňmi, zbrojí {Harnisch}, zbraněmi i veškerým svým jměním a statkem; jinak se však postupuje tak, jak bylo právě uvedeno.
- typ: odstavec
  de: |-
    Zum fünfften / geschicht ein vbergab daß die Kriegsleut vnd etlich einwoner im Flecken / nicht allein mit jrer Hab abziehen / sonder auch etwas jhrem Herrn / oder andern zugehörig / mit tragen oder füren / Wiewol nun der auff vnd vbergaben mehr sein / wirt doch solches zu jeder zeit auch abgeschafft / oder wie man die eroberten Flecken speisen / besetzen / oder schleiffen soll / dem Obersten vnd Kriegsuerstendigen / so den Krieg fürn / heimgestelt.
  cs: |-
    Za páté dochází k vydání tak, že válečníci a někteří obyvatelé v městečku odtáhnou nejen se svým jměním, nýbrž odnesou či odvezou s sebou i něco, co náleží jejich pánovi nebo jiným. Ačkoli je způsobů vzdání a vydání ještě více, rozhoduje se o nich vždy podle okolností;[^1] a jak mají být dobytá městečka zásobena, obsazena či srovnána se zemí, to se ponechává na plukovníkovi a války znalých mužích, kteří válku vedou.
- typ: odstavec
  de: |-
    Der Oberst hat die gerechtigkeit / welcher vnder den hohen ämptern oder Reutern durch morden / verrathen / feldflucht / fried / sicherheit / geleit brechen / meuterei machen / notzwang / Prouiant in oder vor dem Leger mit gewalt nemen / Mercatanten oder andere berauben / dardurch einer sein ehr / leib vnd leben verwircket / desselben Hab rüstung sampt alles so er jm leger hat / ist dem Obersten Feldhauptman heimgefallen.
  cs: |-
    Plukovník má toto právo: kdo z vysokých úředníků nebo jezdců {Reutern} spáchá vraždu, zradu, útěk z pole, poruší mír, bezpečnost či glejt, vyvolá vzpouru {meuterei}, dopustí se znásilnění, násilím zabere proviant {Prouiant} v ležení {Leger} či před ním nebo oloupí markytány {Mercatanten} či jiné – čímž člověk propadá ctí, hrdlem i životem –, toho jmění a zbroj {rüstung} i vše, co má v ležení, připadá nejvyššímu polnímu hejtmanovi {Obersten Feldhauptman}.
- typ: odstavec
  de: |-
    Etliche Obersten wöllen / wann ein Reutter einn vngefehrlichen Todtschlag thů / der hab alle seine güter im feld gegen jnen verwirckt / solches ist aber wider gemeine Kriegsbreuch.
  cs: |-
    Někteří plukovníci chtějí, aby jezdec, který se dopustí neúmyslného zabití, propadl ve prospěch plukovníka veškerý svůj statek v poli; to však je proti obecným válečným zvyklostem.
- typ: odstavec
  de: |-
    Es soll kein Kriegsuolck / so einen Flecken auffgibt / vnnd herauß zeucht / es sei dann mit sondern außgetrucken worten bethediget / jre fanen zu Roß / oder fendlin zu fůß lassen fliegen / wann es aber geschicht / hat jnen der Oberst heraussen zunemen recht fug vnd macht / Gleichergestalt sollen die Trommeter zu růß / vnd die spil zu fuß im abzug schweigen.
  cs: |-
    Žádný válečný lid {Kriegsuolck}, který vydá městečko a táhne z něj ven – ledaže by to bylo výslovnými slovy vyjednáno –, nesmí nechat vlát své jízdní korouhve {fanen} ani pěší praporce {fendlin}; stane-li se tak přece, má plukovník právo a moc jim je venku odebrat. Stejně tak mají při odchodu mlčet jízdní trubači {Trommeter} a pěší hudba {spil}.
- typ: odstavec
  de: |-
    Ein jeder Kriegsherr sol / wann das kriegsuolck etwan nit gar richtig bezalt wirt / mit dem Feldhauptman vmb ein zimliche grosse summa die er in Rechnung einlegt / der vrsach nit disputiern / daß ein Oberster in mangel oder bezalung dem Kriegsuolck zu roß vnd fuß / offt nicht allein vbersehen vnnd nachlassen / sonder auch vil mal etwas schencken / oder solliches zuthůn verheissen můß.
  cs: |-
    Žádný válečný pán {Kriegsherr} se nemá, není-li válečný lid vždy zcela řádně vyplácen, přít s polním hejtmanem o dosti velikou sumu, kterou předloží k vyúčtování. Plukovník totiž musí při nedostatku či zpoždění platu válečnému lidu na koni i pěšky často nejen leccos prominout a slevit, nýbrž mnohokrát i něco darovat nebo to aspoň slíbit.
- typ: odstavec
  de: |-
    Die obersten feldhauptleut wöllen den 10. pfening von allen beuten / so die reuter gewunnen haben / wiewol solchs recht vnd billich / ists doch nit in eim ganghafftigen brauch / wie bei der landsknecht obersten / darumb sollen sich die reissigen dannoch mit dem Obersten das er zufriden ist vertragen mit den gefangen wirts wie angezeigt inhalt der bestellbrieff gehalten.
  cs: |-
    Nejvyšší polní hejtmani požadují desátý peníz ze všech kořistí, které jezdci získali; ačkoli je to po právu a spravedlivé, není to tak běžným obyčejem jako u plukovníka {obersten} lancknechtů {landsknecht}; proto se mají jezdci přesto s plukovníkem dohodnout tak, aby byl spokojen. Se zajatci se pak nakládá, jak uvedeno, podle znění služebních listů {bestellbrieff}.
poznamky:
- n: 1
  text: |-
    „wirt doch solches zu jeder zeit auch abgeschafft“ – sloveso abschaffen zde patrně ve smyslu „zařídit, rozhodnout“ (podle okolností dané chvíle), nikoli „zrušit“.
