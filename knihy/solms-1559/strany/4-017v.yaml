bloky:
- typ: obrazek
  soubor: drevorez-422.jpg
  popis: |-
    Dřevořez znázorňující dělostřelce v dobovém oděvu s kloboukem s chocholem, jak dlouhou pákou (sochorem) opřenou o vyčnívající železné hřeby posouvá mohutný skládaný kotouč těžkého obléhacího děla vpřed.
- typ: odstavec
  de: |-
    Die ander scheib ist gantz aber auch von stücken zusamen gesagt/ vnd beschlagen wie die andere/ darumb ist auch ein stück daruon außgezogen/ damit zu sehen ist wie mann die scheiben mit stücken in einander verdägeln vnd machen soll.
  cs: |-
    Druhý kotouč {scheib} je plný (*gantz*), avšak také složený z kusů a okovaný jako ten první; proto je i z něj jeden díl vytažen, aby bylo vidět, jak se mají kotouče z kusů do sebe zakolíkovat a zhotovit.
