bloky:
- typ: obrazek
  soubor: drevorez-422.jpg
  popis: |-
    Dřevořez znázorňující dělostřelce v dobovém oděvu s kloboukem s chocholem, jak pomocí dlouhé páky (sochoru) opřené mezi vnější a vnitřní vyčnívající železné čepy posouvá mohutný skládaný kotouč těžkého obléhacího děla vpřed.
- typ: odstavec
  de: |-
    Die ander scheib ist gantz aber auch von stücken zusamen gesagt/ vnd beschlagen wie die andere/ darumb ist auch ein stück daruon außgezogen/ damit zu sehen ist wie mann die scheiben mit stücken in einander verdägeln vnd machen soll.
  cs: |-
    Druhý kotouč {scheib} jest v celku, ale také složen z kusů a okován jako onen předchozí; proto jest i z něj jeden díl povytáhnut, aby bylo vidět, jak se mají kotouče z jednotlivých kusů do sebe zakolíkovat a zhotovovat.
