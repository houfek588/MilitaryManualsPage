bloky:
- typ: odstavec
  de: |-
    DAs aber zusehen sein mag/ das die Teutschen alte Kriegs Leut seind/ vnd der Römer Kriegs regierung gehalten vnnd gebraucht haben/ so findet mann in der Cronica das Julius Cesar/ was vor Christo geburt 58. Jar Hauptman vnd Meister zu Rom/ vnd die Römer verordneten jn zu ziehen inn Teutsch Landt/ Lamparta vnnd Franckreich die zu zwingen/ vnd in jhren gehorsam zubringen/ das er also fürnam vnd vollendet/ bezwang das Teutsch Landt/ vnnd Lamparten/ bracht das vnter der Römer gewalt vnd gehorsam.
  cs: |-
    Aby však bylo vidět, že Němci jsou staří válečníci {Kriegs Leut} a že zachovávali a užívali římskou válečnou správu: v kronice se píše, že Julius Caesar byl 58 let před narozením Kristovým hejtmanem {Hauptman} a mistrem v Římě[^1]. Římané jej vyslali do Německa, Lombardie a Francie, aby si je podrobil a přivedl k poslušnosti. To také předsevzal a dokonal: podrobil si Německo i Lombardii a přivedl je pod moc a poslušnost Římanů.
- typ: odstavec
  de: |-
    Vnd da er sie also in ein gehorsam bracht hatte/ da ordnet er den Teutschen ein regirung nach der Römer ordnung/ vnd satzt sie darin/ vnd zog wider gen Rom/ vermeint er hette den Römern wol gedient gehabt er wol grossen danck vnd ehr erlangt haben/ vnd wider in sein platz Hauptman vnd Meister zu sein/ tretten/ wie vor/ aber die Römer wolten jn nit wider darzů lassen/ gaben jm vrsachen er wer lenger dann die zeit/ so sie jm gesetzt hatten aussen blieben/ vnd machten ein Meutterei in der Stat Rom vber jnen/ das er also seines vorigen Ampts/ vnd gewalts entsetzt wart.
  cs: |-
    Když je takto přivedl k poslušnosti, zřídil Němcům správu podle římského řádu, uvedl je do ní a táhl zpět do Říma v domnění, že Římanům dobře posloužil, že si získal velký dík a čest a že opět nastoupí na své místo jako hejtman a mistr jako dříve. Římané ho však k tomu znovu připustit nechtěli; jako důvod mu uváděli, že zůstal venku déle, než mu stanovili, a zosnovali proti němu v Římě vzpouru {Meutterei}, takže byl zbaven svého dřívějšího úřadu i moci.
- typ: odstavec
  de: |-
    Solche vndanckbarkeit vnnd schmach von den Römern/ thet jm wehe/ dieweil er dann die Teutschen/ vor andern am manlichsten/ vnd zu dem Kriegs gebrauch/ am besten befunden/ zoge er wider hinder sich in das Teutsch Landt/ das fandt er noch in seiner Ordnung vnd regirung wie ers gesetzt vnd verlassen hatt/ da er nu solchen bestandt bei den Teutschen befandt/ hat er ein lieb vnd gefallens an jhrer bestendigkeit gehabt/ vnd klagt jnen die schmach vnnd vndanckbarkeit der Römer/ die sie an jm gethan hatten.
  cs: |-
    Taková nevděčnost a potupa od Římanů ho bolela. Protože shledal Němce nad jiné nejmužnějšími a k válčení nejschopnějšími, táhl zpět do Německa a nalezl je stále v tom řádu a správě, jak je ustanovil a zanechal. Když u Němců shledal takovou stálost, zalíbila se mu jejich vytrvalost a postěžoval si jim na potupu a nevděk, jichž se na něm Římané dopustili.
- typ: odstavec
  de: |-
    Dieweil er dann die Teutschen im Krieg so manlich erkennt/ vnd sie so bestendig wider gefunden hatte/ vereiniget er sich mit jnen/ vnd bat sie mit jhm gen Rom zuziehen/ welchs sie also gethan haben/ vnd jm die Römer dahin helffen zwingen/ das sie jm die Stat Rom geöffnet/ vnd vnter augen gezogen/ gnad vnd verzeihung begerten/ Also ist Julius wider durch die Teutschen/ gen Roma gebracht/ vnd zu einem Keiser gemacht/ dann zuuor ist kein Römischer Keiser mehr gewest/ vnd ist Julius der erst Römisch Keiser gewest/ vnd sich ein merer des römischen Reichs geschrieben/ wie noch seider zeit alle Keiser gethan vnnd noch/ darumb haben die Teutschen den ersten römischen Keiser mit gewalt gemacht.
  cs: |-
    Protože tedy poznal, jak mužní jsou Němci ve válce, a nalezl je opět tak stálé, spojil se s nimi a požádal je, aby s ním táhli do Říma. To také učinili a pomohli mu Římany přinutit k tomu, že mu otevřeli město Řím, vyšli mu vstříc a prosili o milost a odpuštění. Tak byl Julius skrze Němce opět přiveden do Říma a učiněn císařem; předtím totiž žádný římský císař nebyl. Julius byl prvním římským císařem a psal se rozmnožitelem Římské říše {römischen Reichs}, jak to od té doby činili všichni císaři a činí dosud. Němci tedy mocí ustanovili prvního římského císaře.
- typ: odstavec
  de: Das habe ich allein darumb also erholt/ das zuhören ist/ daß die
  cs: |-
    To jsem zde zopakoval jen proto, aby bylo slyšet, že
poznamky:
- n: 1
  text: |-
    Gaius Julius Caesar (100–44 př. n. l.) zahájil galská tažení roku 58 př. n. l.; označení „hejtman a mistr“ (*Hauptman vnd Meister*) přejímá soudobou německou kronikářskou tradici (srov. římské tituly *imperator* či *dictator*), podle níž se Caesar s pomocí germánských spojenců stal prvním římským císařem (*Mehrer des Reichs*, dobový překlad latinského titulu *Augustus*).
