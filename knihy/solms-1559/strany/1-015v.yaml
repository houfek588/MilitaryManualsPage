strana: verso
sken: 40
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    wol bei einander in Rathschlegen / aber doch einem jeden beuelhen / dazu er dienstlich ist vnd versehen kan.
  cs: |-
    spolu užiteční při poradách; každému se však má svěřit to, k čemu se hodí a co dokáže zastat.
- typ: odstavec
  de: |-
    Dann ein Schmidt wirt kein Schůhmacher / ein Schůhmacher kein Tisch noch Truhenmacher künden werden / vnd also fürtan / darumb soll ein jeder gebraucht werden / in dem daß er gelernet hat vnd kan / vnd nit einem aufflegen das er nicht gelernet noch zuuerrichten weiß sonder ein jeden sein gelernet Handtwerck treiben lassen.
  cs: |-
    Kovář se totiž nestane ševcem a švec nebude umět být stolařem ani truhlářem a tak dále. Proto má být každý užit v tom, čemu se vyučil a co umí; nikomu se nemá ukládat to, čemu se nenaučil a co neumí vykonat, nýbrž každý má provozovat své vyučené řemeslo.
- typ: odstavec
  de: |-
    Dieweil dann die Justitien sein will vnd můß / dann es die notturfft erfordert / so anderst das Kriegßuolck in einigkeit geregiert / so soll dieselbig gleich vorgenomen vnd gehalten werden / vnd ein jede Nation sein regirung selbst lassen haben vnd versehen / doch daß dise Ordnung gleich durch auß sei.
  cs: |-
    Poněvadž tedy justice {Justitien} být chce a musí – vyžaduje to nutnost, má-li být válečný lid {Kriegßuolck} vůbec spravován ve svornosti –, má se zavést a zachovávat stejně pro všechny. Každému národu se má ponechat, aby svou správu měl a vykonával sám, avšak tak, aby tento řád byl všude stejný.
- typ: odstavec
  de: |-
    Damit aber zusehn sein mag / daß die Teutschen zu gůtem Kriegs Regiment geneigt vnd gern halten wolten / so haben sie dessen in dem 54. Jar mit mir als zu der zeit Feldmarschalck gewesen / jre Justitien nach derselbigen alten Teutschen gebrauch zu regiern / vorgenomen / vnd 24. straff Artickel gestelt / welche sie an dem höchsten regirung zu halten von nöten gedaucht zu sein / vnd seind dise volgende Artickel.
  cs: |-
    Aby však bylo patrné, že Němci byli nakloněni dobrému válečnému řádu {Kriegs Regiment} a rádi jej chtěli zachovávat, předsevzali si roku 54.[^1] se mnou, tehdejším polním maršálkem {Feldmarschalck}, že budou svou justici spravovat podle starého německého obyčeje, a sepsali 24 trestních článků, které se jim zdály k udržení správy nejvýš potřebné. Jsou to tyto články.
- typ: nadpis
  uroven: 2
  de: |-
    Volgt erstlich von der grausamen Gottslesterung / flůchens vnd schwerens.
  cs: Nejprve následuje o ukrutném rouhání Bohu, klení a přísahání.
- typ: odstavec
  de: |-
    DIeweil dann noch ein schwerer Gottloser Punct vnnd Artickel ist / der billich wol bedacht vnd gehandelt werden soll / vnd ich 24. Artickel zustraffen gestelt hab / Dieweil denn diser volgent Artickel mit den andern sich nicht vergleicht / sonder vil mehr vnd grösser ist / dan alle 24. Artickel seind / so hab ich disen allein vnd zum ersten gestelt / mit seiner außfürung vnd erklerung / vnnd weiß dem kein maß der straff zugeben / dann es mir zu hoch sein will / sonder derhalben ist mein gůt bedüncken / daß solcher Artickel / wann alles Kriegßuolck vnd Kriegßräth bei einander weren / dieweil er also hochwichtig ist statlich vnd wolbedacht würd / Dann meins erachtens / so ist er hoch zubedencken vnd zu straffen / dann Gott also on not vnd einige billiche vrsachen / also můtwilliglich zu lestern vnnd zu erzörnen / vnd niemants einige vrsach mit gůtem grundt darthůn / daß es zu etwes gůt oder nützlich sein kan / dann es kan keiner nichts
  cs: |-
    Je tu ještě jeden těžký bod a článek o bezbožnosti, který je třeba dobře uvážit a projednat. Sepsal jsem sice 24 trestních článků, ale protože se tento následující článek s ostatními nedá srovnávat a je mnohem závažnější a větší než všech 24 článků dohromady, postavil jsem jej samostatně a na první místo i s jeho výkladem a vysvětlením. Neumím mu stanovit míru trestu, neboť je to na mne příliš vysoko. Proto soudím, že by tento článek, poněvadž je tak svrchovaně důležitý, měl být důstojně a důkladně uvážen, až bude pohromadě veškerý válečný lid a váleční radové {Kriegßräth}. Podle mého soudu je totiž třeba jej vážně uvážit a trestat: takto bez nouze a bez jakékoli spravedlivé příčiny se svévolně rouhat Bohu a hněvat jej – a nikdo přece nedokáže s dobrým důvodem doložit, že by to k něčemu bylo dobré či užitečné, neboť nikdo nemůže nic
poznamky:
- n: 1
  text: |-
    Tj. roku 1554, během tažení císaře Karla V. proti Francii (srov. `1-011r`).
