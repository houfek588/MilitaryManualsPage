bloky:
- typ: odstavec
  de: |-
    DIse Figur mit 9. verzeichnet zeigt an ein eisen oder steinen Kugel da ein eisen stral durchgeht/ der fest darein vergossen vnd gemacht/ daß er darinn nit ledig werden mag oder rötzen kan/ vnd an solchem stral sollen hangen zwo oder vier klein starcke eisene Ketten/ daß sie in dem schiessen nicht auffgehn noch brechen/ vnnd an solche Ketten sollen gemacht werden anhangendes Fewer/ vnd die Kugel soll vier tieffer kerben die eins fingers tieff seien haben/ daß die ketten darin ligen künden/ die kett sol auch nit für die dicke der kugeln gehn/ damit die Kugel in vnd auß der Büchsen vnuerhindert gehn mag/ vnd das Fewerwerck an den Ketten soll hinder der Kugeln inn der Büchsen ligen/ wann mann die Büchssen anzünd/ so zünd sich das Fewerwerck in der Büchsen auch an/ vnd so die kugel auß der Büchsen kumpt vnd drefft/ so fallen die Fewer an der ketten heraber vnnd hangen heruor/ solche Kugeln sind gemacht an den schiffen zuschiessen/ so bleiben sie mit dem stral an den schiffen hangen/ dan der stral scheust sich in die schiff ins holtz vnd pleibt stecken vnd hangen die Fewer am schiff zünden die an/ wie zugedencken dieweil die schiff gebicht sind.
  cs: |-
    Toto vyobrazení označené číslem 9 ukazuje železnou nebo kamennou kouli {Kugel}, skrz niž prochází železný hrot s ostny (*stral*), jenž jest do ní pevně zalit a upevněn, aby se nemohl uvolnit ani viklat (*rötzen*); na tomto hrotu mají viset dva nebo čtyři malé silné železné řetězy, aby se při výstřelu nerozpojily ani nepřetrhly, a na těchto řetězech mají být připevněny závěsné ohňové nálože. Koule má mít čtyři hluboké drážky na prst hluboké, aby v nich řetězy mohly spočívat; řetěz také nesmí vyčnívat nad obvod koule, aby koule mohla do děla i z děla bez překážky projít, přičemž ohňostrojná nálož {Fewerwerck} na řetězech má v děle ležet za koulí. Když se dělo zapálí, vznítí se v něm zároveň i ohňostroj, a jakmile koule vyletí z hlavně a zasáhne cíl, spadnou ohně na řetězech dolů a visí ven. Takové koule jsou zhotoveny ke střelbě na lodě: hrot se zabodne do lodního dřeva a zůstane v něm vězet a hořící nálože visící na lodi ji zapálí – jak si lze snadno představit, neboť lodě jsou natřené smolou.
- typ: odstavec
  de: |-
    Die ander Figur mit 10. verzeiget ist ein fewer pfeil vnd auch gemacht auff die schiff inn die segel zuschiessen/ wann die schiff an ein ander komen vnd hencken wie mann sagt das wol geschehe.
  cs: |-
    Druhá figura označená číslem 10 jest zápalný šíp {fewer pfeil}, rovněž zhotovený ke střelbě na lodě do plachet, když k sobě lodě přirazí a zaklesnou se do sebe, jak se říká, že k tomu nezřídka dochází.
- typ: odstavec
  de: |-
    Die dritte Figur darbei ist ein Stormbloch das ist inwendig auß gehawen/ vnd mit Puluer gefölt/ vnd ist mit durch gehenden starcken keilen wider zusamen gekeilt/ zu dem stercksten mit zweien oder mehr keiln darnach mann das lang macht/ darzu lauffende Fewer ist zu gedencken so ein solches ploch angehet/ was für ein graussams schlagens bringen vnd machen wirt/ besonder so es hart zusamen gekeilt würde.
  cs: |-
    Třetí figura vedle jest útočný špalek neboli petarda {Stormbloch}, jenž jest zevnitř vydlabán, naplněn střelným prachem {Puluer} a opět pevně zaklínován skrz procházejícími silnými klíny – co nejpevněji dvěma či více klíny podle toho, jak se udělá dlouhý; k tomu zápalná stopina (*lauffende Fewer*). Lze si pomyslet, jak strašlivý výbuch a ránu takový špalek způsobí, když vybuchne, zvláště jest-li pevně zaklínován.
- typ: odstavec
  de: |-
    Die vierde Figur so an den leit/ ist gleicher gestalt ein schlagen bloch/ vnd ist auff gethon das mann sehn kan wie solche spring blöcher gemacht sind.
  cs: |-
    Čtvrtá figura ležící pod nimi jest obdobný výbušný špalek {schlagen bloch} a jest rozevřena, aby bylo vidět, jak jsou takovéto trhací špalky {spring blöcher} sestrojeny.
