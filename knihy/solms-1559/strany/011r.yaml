bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    tag/ oder zu vilen tagen hett mit den Obersten von den hohen ämptern rath gehalten oder halten lassen/ oder hett zweien Regimenten Teutschen vnd Welschen/ etwas zu berathschlagen fürgehalten vnd vbergeben/ daß ein jede Nation dasselbig für sich selbst mit seinn Befelhabern berathschlagt het/ vnd solchen Rathschlag von beiden theiln dem Kriegsherrn wider vberantworten/ vnd so der Kriegsherr nicht beider Nation sprachen verstünd/ so soll die ein Nation jhren Rathschlag in des Kriegsherrn Sprach transferieren lassen/ darzů soll der Kriegsherr derselbigen Nation ein vertrawte person/ die mit dem transferieren gůt vnd gewiß were/ halten/ Es sollen auch die gemelten personen/ nicht allein berathschlagen was jnen von dem Kriegsherrn fürgeben wirt/ sonder auch was sie selbst bedünckt/ daß dem Leger vnd Krieg von nöten/ nütz vnnd gůt sein möcht/ nichts außgenommen/ sonder ist hoch von nöten/ wol zuberathschlagen vnnd zubedencken/ wie mann inn dem Leger/ mag gůte Policei vnnd Justicien halten.
  cs: |-
    den nebo jednou za několik dní konal či dával konat radu s plukovníky {Obersten} z vysokých úřadů. Nebo aby dvěma plukům {Regimenten}, německému a vlašskému {Welschen}, předložil a předal něco k poradě, aby se o tom každý národ poradil zvlášť se svými veliteli {Befelhabern} a obě strany pak své dobré zdání odevzdaly válečnému pánovi {Kriegsherrn}. Nerozumí-li válečný pán jazykům obou národů, má ten národ, jehož řeči nerozumí, dát své dobré zdání přeložit do jazyka válečného pána. K tomu si má válečný pán z toho národa držet důvěryhodnou osobu, která je v překládání zběhlá a spolehlivá. Zmínění muži se přitom nemají radit jen o tom, co jim předloží válečný pán, nýbrž i o tom, co sami uznají za potřebné, užitečné a dobré pro ležení {Leger} a válku, nic nevyjímaje. Především je velmi zapotřebí dobře uvážit a promyslet, jak v ležení udržovat dobrý veřejný pořádek {Policei} a spravedlnost {Justicien}.
- typ: odstavec
  de: |-
    Es mag auch wol gesagt werden/ es sei nicht gůt daß ein Herr mit so vil personen rath halte/ dann der Rath soll eng vnnd geheim sein/ ist zum theil wol geredt/ Es hat aber inn dem ein vnderscheidt/ dann was solche geheyme/ schwere sachen weren/ kan der Kriegsherr bei sich behalten/ vnd darzů erfordern etliche personen/ die jhm geheym vertrawet vnnd gefallen/ Aber in andern sachen die nicht also geheym/ vnd doch notwendig seind/ mag mann in einn gemeinen Rath kommen lassen.
  cs: |-
    Dalo by se sice namítnout, že není dobré, aby se pán radil s tolika osobami, neboť rada má být úzká a tajná. To je zčásti pravda, je tu však rozdíl. Tajné a závažné věci si válečný pán může ponechat pro sebe a povolat k nim jen několik osob, kterým důvěrně věří a které jsou mu milé. Jiné věci, které nejsou tak tajné, a přesto jsou nutné, lze předložit společné radě.
- typ: odstavec
  de: |-
    Aber der gemein Rath ist dem Kriegsherrn nicht böß/ als für das erst/ so lernt ein Kriegsherr die Beuelhaber eines jeden person durch die Rathschläg erkennen/ vnd darnach er ein person im rathschlagen geschickt befindt/ weyß er die darnach zuhalten/ würte er dann ein oder etlich allzeit vngeschickt befinden/ so weyß er dieselbig auch darnach zuhalten/ Also wirt ein Herr jnnen/ was er für Personen hat/ vnd jnen beuelhen kan.
  cs: |-
    Společná rada však není pro válečného pána na škodu. Předně tak válečný pán z porad pozná každého velitele osobně: podle toho, jak obratného ho při radě shledá, ví, jak s ním nakládat; a shledá-li někoho nebo některé vždy neschopnými, ví také, jak s nimi naložit. Tak pán pozná, jaké osoby má a co jim může svěřit.
- typ: odstavec
  de: |-
    Zum andern/ so kan nicht wol felen/ wann solche personen sehen/ das mann sie allzeit zu rath erfordert/ so můß dannoch ein jeder bei sich sorg tragen vnd darnach halten/ wann mann jn erfordern würd/ daß er nit der vngeschickts im rath erfunden werde/ vnd also durch solche fürsorg/ trincken vnd anderer liederlicher ding sich enthalten/ vnd den sachen nachgedencken/ so der in Rath kom/ daß er auch wiß das sein geschicklich darzů zusagen.
  cs: |-
    Za druhé to nemůže selhat: když takové osoby vidí, že je vždy zvou do rady, musí si každý dát pozor a hledět, aby při povolání nebyl v radě shledán nejneschopnějším. Z takové opatrnosti se zdrží pití a jiných lehkovážných věcí a bude o věcech přemýšlet, aby, až přijde do rady, uměl také obratně říci své.
- typ: odstavec
  de: |-
    Zum dritten so kan nit felen/ wann die personen also fleissig in solchen schweren sachen gebraucht würden/ sie můsten geschickt werden.
  cs: |-
    Za třetí to také nemůže selhat: jsou-li takové osoby pilně užívány v tak závažných věcech, musejí se stát schopnými.
