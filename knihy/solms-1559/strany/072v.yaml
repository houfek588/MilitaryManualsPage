  popis: |-
    Celostránkový dřevořez vachmistra pěchoty s ozbrojeným doprovodem v obloukovém rámu s vázami a akantovými rozvilinami v cviklech (datováno dole vlevo 1546, bez monogramu): vousatý vachmistr v drátěném límci a baretu s pštrosím peřím jede doprava, obklopen pěšími strážnými a ozbrojenci v drátěných límcích, kabátcích a baretech či přilbicích s peřím; v popředí kráčí střelec s ručnicí na rameni, za nimi nesou strážní halapartny a dlouhou rovnou zbraň či píku.
