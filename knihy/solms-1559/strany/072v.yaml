  popis: |-
    Celostránkový dřevořez vachmistra pěchoty s ozbrojeným doprovodem v obloukovém rámu s vázami a akantovými rozvilinami v cviklech (datováno dole vlevo 1546, bez monogramu): vousatý vachmistr v drátěném límci, s plátovou ochranou paží a v klobouku s pštrosím peřím jede na koni doprava, obklopen pěšími strážnými a ozbrojenci v drátěných límcích, kabátcích a baretech či přilbicích s peřím; v popředí kráčí střelec s ručnicí na rameni, vlevo za nimi strážní nesou halapartny, za vachmistrem jede jezdec se vztyčeným obouručním mečem a vpravo další jezdec v klobouku s peřím.
