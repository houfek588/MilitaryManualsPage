bloky:
- typ: nadpis
  uroven: 2
  de: |-
    Das fünfft Bůch vom vndergraben vnd sprengen/ ein kurtzer bericht.
  cs: |-
    Pátá kniha o podkopávání a odstřelování: krátká zpráva.
- typ: odstavec
  de: |-
    DIeweil ich dann von der Artolorei ein beschreibung vnd vnderricht gebe/ vnd inn Figurn bringe/ so ist noch eines daß demselbigen anhenckt vnd fast behülfflich ist/ vnd gehören zusamen in ein versehung vnnd verwaltung/ nemlich vnder den Artholorei oder Zeugmeister/ vnnd ist das vndergraben der befestung vnnd derselbigen zersprengung/ nemlich maurwerck vnd erdene wel vnd zu anderem mehr vnd weitterm werck zu gebrauchen/ welches ich so vil mir möglich zu einem bessern verstant in Beschreibung vnd Figurn stelle/ wie mann darmit handeln sol/ vnder vnd vber Erden mit sampt der Rüstung zu arbetten/ wie vnd was maß vnd Form die sein sollen/ wie ich die vnder handen gehabt vnd gebraucht hab/ auß welchem sich ein jeglicher wol richten kan/ der etwas darumb weiß/ oder das für Augen nemen/ nachdencken vnd befleissen wil/ ein guten bericht geben sol.
  cs: |-
    Poněvadž tedy podávám popis a poučení o dělostřelectvu {Artolorei} a uvádím je v obrazech, zbývá ještě jedna věc, která k němu přináleží a je mu velmi nápomocná, takže obojí patří do jedné péče a správy, totiž pod mistra dělostřelectva {Artholorei} neboli zbrojmistra {Zeugmeister}. Je to podkopávání {vndergraben} opevnění {befestung} a jeho rozmetání, totiž zdiva i hliněných valů {wel}, a užití [podkopů] k dalším a rozsáhlejším pracím. To zde, nakolik je mi možno, kladu pro lepší porozumění do popisu a vyobrazení: jak se má při tom postupovat a pracovat pod zemí i nad zemí, i s nářadím {Rüstung}, jakou míru a podobu má mít – tak, jak jsem je sám měl v rukou a užíval. Podle toho se může dobře řídit každý, kdo se v tom trochu vyzná; a kdo si to vezme před oči, promyslí a vynaloží úsilí, tomu to poskytne dobré poučení.
- typ: odstavec
  de: |-
    Wann dann ein grosser Herr oder Potentat der Krieg füren muß vnd nit wol absein kan/ auch mit Geschütz vnd dergleichen gefast sein muß/ vnd alle weg gesucht werden wöllen/ damit man die Befestung die zugewinnen vnderstanden werden/ nötigen vnd in kurtzer zeit mit wenigem vnkosten erobern künde/ ist bei mir zu erachten das solches vndergraben vnd Sprengen auch ein stück darzu sein werde/ so wil ich dasselbig bei die Artolorei verordnen/ das es durch den Artolorei Meister auch versehen vnd angestalt soll werden/ vnd alle Rüstung was darzu gehört zugericht vnd im vorrath sei in dem Zeughauß gleich anderm geschütz/ Rüstung vnd vorrath.
  cs: |-
    Musí-li tedy veliký pán či mocnář vést válku a nemůže se bez ní dobře obejít, musí být vybaven i děly {Geschütz} a podobnými věcmi a hledat všechny cesty, jak pevnost, které se chce zmocnit, přinutit [ke vzdání] a v krátkém čase s malým nákladem dobýt. Mám za to, že i takové podkopávání a odstřelování k tomu bude jedním z prostředků. Proto je chci přiřadit k dělostřelectvu, aby se o ně staral a zařizoval je také mistr dělostřelectva {Artolorei Meister} a aby veškeré nářadí, které k tomu patří, bylo připraveno a drženo v zásobě ve zbrojnici {Zeughauß} stejně jako ostatní děla, výbava a zásoby.
- typ: odstavec
  de: |-
    Deßgleichen sol ein sollicher grosser Herr vnd Potentat der ein solches groß geschütz hat/ Kreig füren vud brauchen muß auch etlich Bergknappen haben/ die sich deß grabens wol verstehen vnnd gebraucht haben/ dieselbigen sollen bei dem Geschütz vnd Zeughauß sein/ vnd vnder dem General Artolorei oder Zeugmeister/ wie andere Büchsenmeister vnnd Artolorei oder Zeugdiener vnd wartter gebürt.
  cs: |-
    Rovněž má takový veliký pán a mocnář, který má tak velká děla a musí vést válku a užívat jich, mít i několik horníků {Bergknappen}, kteří se dobře vyznají v kopání a mají v něm praxi. Ti mají být při dělech a ve zbrojnici a podléhat generálovi dělostřelectva {General Artolorei} či zbrojmistrovi, jak náleží i ostatním puškařům {Büchsenmeister} a dělostřeleckým či zbrojním služebníkům {Zeugdiener} a správcům {wartter}.[^1]
- typ: odstavec
  de: |-
    Ja es wollen etlich sagen solcher vnkusten der auff die Person geht sei wol vnnot dann mann braucht die langsam/ vnnd wann mann solche Arbeit für nemen wöl/ fünde mann allezeit vnder den
  cs: |-
    Někteří ovšem říkají, že takový náklad na ty osoby je zbytečný, neboť se jich užívá zřídka, a kdyby se měla taková práce podniknout, našlo by se prý vždy mezi
poznamky:
- n: 1
  text: |-
    Složený list 1 nese v originále pouze signaturu `A ij` bez tištěného čísla listu (foliace v 5. knize je tištěna až od listu 7 na skenu 449). V tisku je slovo „Kreig“ (místo *Krieg*) a „vud“ (*vnd*) zřejmou sazečskou přesmyčkou.
