  popis: |-
    Celostránkový dřevořez o dvou polích (natočený o 90° na šířku), signovaný vlevo nahoře nad horním rámem „1558. BF.“:
    • Horní pole („C“): pohled na vysokou kvádrovou hradební zeď se střílnami vpravo, jejíž průlom u paty kryje šikmá stříška z pěti silných klád; vlevo v podélném řezu podzemní trhací komora („broch“) uvnitř zdi se šesti sudy střelného prachu prokládanými pytli prachu a ústí chodby zapažené dřevěným závalem klád a klínů.
    • Dolní pole („D“): půdorys i nadzemní pohled okrouhlé hradební věže se dvěma průřezy. V kruhovém zdivu věže je horní nápis „Der maurn dicke.“ („Tloušťka zdi.“), uvnitř šrafovaného jádra rytý třířádkový nápis „Also ist der / thurn inwendig / hol.“ („Takto jest věž uvnitř dutá.“); dole u čelní vstupní chodby drobné písmeno „A“ se závalem z klínů a trámů, po obou stranách půlkruhové boční průlomy označené „Broch.“ vlevo a „Broch.“ vpravo, vyplněné dvanácti sudy se střelným prachem. (Na protější straně `5-003r` se text výslovně odvolává na čelní vstup `A` u paty půdorysu `D` a na vedlejší hradbu `B` na tabuli `444`.)
