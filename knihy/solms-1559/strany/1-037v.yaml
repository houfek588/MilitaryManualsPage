bloky:
- typ: odstavec
  de: |-
    Nun mein Son / dieweil die sachen auff sollichen wegen stehen / daß ich von hertzen gern gehöret hab / so denck nun selber wann du etwan dich hettest ein liederlich gesind auffsprechen lassen / vnnd werest mit denselbigen dahin gezogen / wie vilen geschicht / vnd hettest also mit dem gemeinen hauffen dich leiden vnd züchtigen müssen / so hettest du auch gehandelt wie das ander schlecht gemein gesind / so hett niemant anders von dir gewust / vnnd werest also vnder dem gemeinen hauffen blieben / mit gezogen vnd nichts gelernet / vnnd die zeit vergeblich herbracht / Dieweil es aber (Gott lob) dahin geraten ist / vnd dein Herr sich in dem dein annemen will / mit sollichem gnedigen erbieten / vnd die sachen darauff stehen daß du Jren Gnaden solt anzeigen / vnd Personen ernennen an welche von Jren Gnaden wilt verschriben sein / das ist gar gnedig vnnd vil / Dieweil es dann nun mehr darauff stehet / vnd du an mich begerest dir zu rathen / was Ampts personen du Jren Gnaden benennen vnd vorschlagen solltest / so ist dasselbig wol eines bedenckens vnnd vnderredens von nöten / so will ich dir inn dem mein bedencken sagen / was eines jeden Ampts versehung ist / alßdan magst du bei dir selber bedencken / was dir gelegen sein will / vnd warzů du dein meisten willen vnnd hoffen habst / das wart bei disem.
  cs: |-
    Nuže, můj synu, poněvadž jsou věci na takové cestě, což jsem ze srdce rád slyšel, pomysli si nyní sám: kdyby ses byl nechal zlákat nějakou lehkovážnou chátrou a táhl s ní pryč, jak se mnohým stává, a musel tak s obecným houfem {hauffen} trpět a snášet kázeň, vedl by sis také jako ta ostatní prostá obecná čeládka; nikdo by o tobě nevěděl, zůstal bys tak mezi obecným houfem, táhl s nimi, ničemu se nenaučil a čas strávil marně. Poněvadž to však (chvála Bohu) dospělo až sem a tvůj pán se tě v tom chce ujmout takovou milostivou nabídkou a věci stojí tak, že máš Jeho Milosti ukázat a jmenovat osoby, ke kterým chceš být od Jeho Milosti doporučen, to je věru velmi milostivé a mnoho to znamená. A poněvadž na tom nyní záleží a ty mne žádáš, abych ti poradil, které úředníky bys měl Jeho Milosti jmenovat a navrhnout, vyžaduje to zajisté důkladného rozvážení a rozmluvy; povím ti tedy k tomu svůj náhled, co je pověřením každého úřadu, a potom si můžeš sám u sebe rozvážit, co se ti bude nejlépe zamlouvat a k čemu máš největší chuť a naději – toho se pak u něj drž.
- typ: odstavec
  de: |-
    Darmit du aber verstehen magst was die Ampter seind / so will ich dir sagen von etlichen Amptern / da einer etwas ernstlichs vnnd ehrlichs bei lernen vnd sehen kan / vnd vor das erst vnd höchst ampt ist der Kriegs Oberster / vor das ander ist der Feldmarschalck / vnnd vor das drit ist der Artoloreimeister / diß seind die haupt Ampter die den gantzen Krieg regiren / vnd alles durch sie geschehen můß / vnnd in dem feld regirt werden.
  cs: |-
    Abys však porozuměl, co jsou to za úřady, povím ti o některých úřadech, při nichž se člověk může naučit a vidět něco vážného a čestného: prvním a nejvyšším úřadem je nejvyšší polní hejtman {Kriegs Oberster}, druhým je polní maršálek {Feldmarschalck} a třetím je zbrojmistr {Artoloreimeister}. To jsou hlavní úřady, které řídí celou válku, skrze ně se musí dít všechno a jimi se v poli vládne.
- typ: odstavec
  de: |-
    Vnd souil des Kriegßobersten Ampt belangt / so ist er die höchste Person des Kriegs / vnd alle Ampter vnd Beuelchsleut mussen jhr auffsehens auff jhn haben / jhm gehorsam vnnd vnderthenig sein / mit allen Amptern vnnd Beuelchßleuten berathschlecht er die Regirung vnnd fürnemens des Kriegs / Ob dein Herr dich schon bei denselbigen verschreiben vnd bringen wolt / so kanst du wol selber abnemen / dieweil du nichts gesehen vnd gebraucht hast / daß du noch ein schlechter Diener wie andern gemeine Diener sein můst / vnnd auff den dienst warten / vor der Thür sitzen / dann mann kan dir noch nichs sonderlichs befelhen / als wann du vor mehr werest dabei gewesen / Darumb weiß ich dir noch nicht zu rathen das du dahin begerest / dann es warlich nicht vor dich ist / aber ein Ampt da du gebraucht vnd gearbeit würdest / das ist vor dich vnd junge gesellen.
  cs: |-
    A pokud jde o úřad nejvyššího polního hejtmana, ten je nejvyšší osobou války a všechny úřady a velitelé {Beuelchsleut} k němu musejí vzhlížet, být mu poslušni a podřízeni; se všemi úřady a veliteli se radí o správě a záměrech války. I kdyby tě tam tvůj pán chtěl doporučit a přivést, můžeš si sám dobře domyslet, že poněvadž jsi ještě nic neviděl a nevykonal, musel bys být jen prostým sluhou jako ostatní obyčejní služebníci, čekat na službu a sedět přede dveřmi; neboť ti ještě nelze nic[^1] zvláštního svěřit tak, jako kdybys už dříve u toho býval. Proto ti zatím nemohu radit, abys o toto místo usiloval, neboť vpravdě není pro tebe; ale úřad, v němž budeš zaměstnán a budeš pracovat, ten je pro tebe a pro mladé hochy.
poznamky:
- n: 1
  text: V tisku *nichs* bez *t* (*nichts*).
