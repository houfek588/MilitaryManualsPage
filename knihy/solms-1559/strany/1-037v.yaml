bloky:
- typ: odstavec
  de: |-
    Nun mein Son / dieweil die sachen auff sollichen wegen stehen / daß ich von hertzen gern gehöret hab / so denck nun selber wann du etwan dich hettest ein liederlich gesind auffsprechen lassen / vnnd werest mit denselbigen dahin gezogen / wie vilen geschicht / vnd hettest also mit dem gemeinen hauffen dich leiden vnd züchtigen müssen / so hettest du auch gehandelt wie das ander schlecht gemein gesind / so hett niemant anders von dir gewust / vnnd werest also vnder dem gemeinen hauffen blieben / mit gezogen vnd nichts gelernet / vnnd die zeit vergeblich herbracht / Dieweil es aber (Gott lob) dahin geraten ist / vnd dein Herr sich in dem dein annemen will / mit sollichem gnedigen erbieten / vnd die sachen darauff stehen daß du Jren Gnaden solt anzeigen / vnd Personen ernennen an welche von Jren Gnaden wilt verschriben sein / das ist gar gnedig vnnd vil / Dieweil es dann nun mehr darauff stehet / vnd du an mich begerest dir zu rathen / was Ampts personen du Jren Gnaden benennen vnd vorschlagen soltest / so ist dasselbig wol eines bedenckens vnnd vnderredens von nöten / so will ich dir inn dem mein bedencken sagen / was eines jeden Ampts versehung ist / alßdan magst du bei dir selber bedencken / was dir gelegen sein will / vnd warzů du dein meisten willen vnnd hoffen habst / das wart bei disem.
  cs: |-
    Nuže, můj synu, když věci takto stojí, což jsem ze srdce rád slyšel, pomysli si teď sám: kdyby ses byl nechal zlákat nějakou lehkovážnou chátrou a táhl s ní, jak se mnohým stává, musel bys spolu s obecným houfem snášet strádání i tresty. Vedl by sis jako ostatní prostá chátra, nikdo by o tobě nevěděl, zůstal bys mezi obecným houfem, táhl s ním, ničemu se nenaučil a čas promarnil. Protože to však (chvála Bohu) dospělo tak daleko, že se tě tvůj pán chce ujmout s tak milostivou nabídkou, a věc stojí tak, že máš Jeho Milosti oznámit a jmenovat osoby, k nimž chceš být od Jeho Milosti doporučen, je to věru velmi milostivé a znamená to mnoho. A když to tedy nyní takto stojí a ty mne žádáš o radu, které úředníky bys měl Jeho Milosti jmenovat a navrhnout, je třeba to dobře uvážit a probrat. Povím ti tedy svůj názor na to, jaké je poslání každého úřadu; potom si můžeš sám rozvážit, co se ti bude hodit a k čemu máš největší chuť a naději – a toho se pak drž.
- typ: odstavec
  de: |-
    Darmit du aber verstehen magst was die Ampter seind / so will ich dir sagen von etlichen Amptern / da einer etwas ernstlichs vnnd ehrlichs bei lernen vnd sehen kan / vnd vor das erst vnd höchst ampt ist der Kriegs Oberster / vor das ander ist der Feldmarschalck / vnnd vor das drit ist der Artoloreimeister / diß seind die haupt Ampter die den gantzen Krieg regiren / vnd alles durch sie geschehen můß / vnnd in dem feld regirt werden.
  cs: |-
    Abys však porozuměl, jaké to jsou úřady, povím ti o některých z nich, u kterých se člověk může naučit a uvidět něco vážného a čestného. Prvním a nejvyšším úřadem je nejvyšší polní hejtman {Kriegs Oberster}, druhým polní maršálek {Feldmarschalck} a třetím zbrojmistr {Artoloreimeister}. To jsou hlavní úřady, které řídí celou válku; skrze ně se musí všechno dít a jimi se v poli vládne.
- typ: odstavec
  de: |-
    Vnd souil des Kriegßobersten Ampt belangt / so ist er die höchste Person des Kriegs / vnd alle Ampter vnd Beuelchßleut mussen jhr auffsehens auff jhn haben / jhm gehorsam vnnd vnderthenig sein / mit allen Amptern vnnd Beuelchßleuten berathschlecht er die Regirung vnnd fürnemens des Kriegs / Ob dein Herr dich schon bei denselbigen verschreiben vnd bringen wolt / so kanst du wol selber abnemen / dieweil du nichts gesehen vnd gebraucht hast / daß du noch ein schlechter Diener wie andern gemeine Diener sein můst / vnnd auff den dienst warten / vor der Thür sitzen / dann mann kan dir noch nichs sonderlichs befelhen / als wann du vor mehr werest dabei gewesen / Darumb weiß ich dir noch nicht zu rathen das du dahin begerest / dann es warlich nicht vor dich ist / aber ein Ampt da du gebraucht vnd gearbeit würdest / das ist vor dich vnd junge gesellen.
  cs: |-
    Pokud jde o úřad nejvyššího polního hejtmana, ten je nejvyšší osobou války. Všechny úřady a velitelé {Beuelchßleut} k němu musejí vzhlížet a být mu poslušni a podřízeni; se všemi úřady a veliteli se radí o správě a záměrech války. I kdyby tě k němu tvůj pán chtěl doporučit a přivést, můžeš si sám domyslet, že protože jsi ještě nic neviděl a nezkusil, musel bys být jen prostým sluhou jako ostatní obyčejní služebníci, čekat na službu a sedět přede dveřmi. Nelze ti totiž ještě svěřit nic[^1] zvláštního, jako kdybys už dříve u něčeho byl. Proto ti zatím nemohu radit, abys tam usiloval, neboť to věru není pro tebe. Úřad, kde by tě zaměstnali a kde bys pracoval, ten je pro tebe a pro mladé muže.
poznamky:
- n: 1
  text: V tisku *nichs* za *nichts*.
