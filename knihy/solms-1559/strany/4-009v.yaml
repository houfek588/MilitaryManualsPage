  popis: |-
    Celostránkový dřevořez (tištěný na šířku, otočený o 90° vlevo) se čtyřmi hlavněmi děl v podélném řezu znázorňujícími měřické a nabíjecí postupy, opatřenými rytými kurzívními nápisy (odshora dolů):
    1) u první hlavně (s příčným křížem v ústí, klínem před koulí a zúženým dnem vývrtu): „Disse figure zeige an wie man ein Büchsen zů sprēgen soll, vnd die vngerade einwend zů finden, der kerns vnd wy dy Büchsen am bodem am ror ein gezogen ist“ („Toto vyobrazení ukazuje, jak se má dělo roztrhnout, jak nalézt vnitřní odchylku jádra a jak je dělo vzadu u dna hlavně zúženo“);
    2) u druhé hlavně (nabité pytlovou prachovou patronou): „Disse figure zeige an wy man ein Büchsen mit kardetschen laden sol, vnd wy der sack aler kardetschen hinden soll off geschnitten sein“ („Toto vyobrazení ukazuje, jak se má dělo nabíjet prachovými patronami a jak má být sáček každé patrony vzadu rozříznut“);
    3) u třetí hlavně (s vsunutým prknem se středovou ryskou a dvěma kolíky): „Dis ist dy vngerade zů finden mit eim bredt vnd mittel ryß“ („Zde je ukázáno, jak nalézt odchylku pomocí prkna se středovou ryskou“);
    4) u čtvrté hlavně (s rovnacím pravítkem opatřeným na konci kompasem): „Dis ist dy vngerade des kerns zů finden wo er stet durch ein richtscheidt mit einem compas“ („Zde je ukázáno, jak nalézt odchylku jádra, kam směřuje, pomocí rovnacího pravítka s kompasem“).
