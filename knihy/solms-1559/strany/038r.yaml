bloky:
- typ: odstavec
  de: |-
    Item / weitter ist zumercken / das maß mit dem Treide / ist an allen orten vngleich / an einem ort grösser / vnd an dem andern kleiner / vnd ist auch mit dem namen verwandelt / daran nicht gelegen / mann mag nicht desto minder sich brauchen nach diser ordnung / vnd nicht vnderschiedtlich / dann es mag inn allen Landen oder Stätten dasselbig maß gebraucht werden / in seiner schwere / vnnd nach dem vorgemelten Achtel gerechnet / das nicht felhet / vnd disem anschlag vnnd Ordnung gleich ist / wie mann jm thůn soll / folgt hernach.
  cs: |-
    Dále je třeba pamatovat na to, že míra na obilí je na všech místech nestejná – na jednom místě větší a na druhém menší – a mění se také jejím jménem; na tom však nezáleží, lze se přesto řídit podle tohoto řádu a nikoli odlišně, neboť ve všech zemích či městech lze užít téže míry podle její váhy a přepočítat ji podle výše zmíněného achtelu {Achtel}; to neselže a odpovídá to tomuto rozpočtu a řádu. Jak se to má provést, následuje níže.
- typ: odstavec
  de: |-
    Es ist zumercken / das ein jeglich maß an allen orten / haben kleine maß / die selben seind gleich abgetheilt gegen dem grossen / doch an einem ort mehr / dann an dem andern / darnach ein Maß ist / wirdt inn 6. oder 12. theil / auch in 24. oder 36. vnd in 84. abgetheilt / wie es dann mag geschehen / vnd solliche genante theil / wie das nach lands Ordnung genennet / gleich gemessen werden / der grossern eines / thůn solche kleine abgetheilte maß / mag eins bald vberschlagen vnd gewigen werden / wieuil es pfundt hat / doch will nicht vil daran gelegen sein / daß das gewicht auch vngleich ist / vnd an einem ort schwerer dann an dem andern / doch nicht also vngleich wie das maß / dann es hat allenthalben Centner vnd pfundt / wann schon etlich pfundt mit dem namen verkleret werden / mag mann sich an allen orten wol darnach richten.
  cs: |-
    Je třeba vědět, že každá míra na všech místech má menší míry, které jsou stejně rozděleny vůči velké míře, avšak na jednom místě na více dílů než na jiném: podle toho, jaká je míra, dělí se na 6 nebo 12 dílů, také na 24 nebo 36 či na 84, jak se kde stává. Takovéto díly, jak se podle zemského řádu nazývají, se odměřují rovně a tolik těchto malých dělených měr dává jednu velkou; lze snadno jednu takovou [malou míru] odhadnout a zvážit, kolik má liber {pfundt}. Nezáleží přitom příliš ani na tom, že také váha je nestejná a na jednom místě těžší než na druhém – není totiž tak nestejná jako dutá míra, neboť všude mají centy {Centner} a libry, a i když se některé libry nazývají odlišně, lze se podle toho na všech místech snadno zařídit.
- typ: odstavec
  de: |-
    Item wann mann an einem ort ein maß hat / welches der kleinen maß 16. in sich helt / so soll der kleinen maß eins mit Treide gemessen / vnd dieselbig gemessen Treide darnach mit fleiß gewigen werden / so wirt gefunden / daß sollich maß in sich helt 15. pfundt / so thůt das gantz maß 15. mal 16. ist 240. pfundt / so schwer wirdt das gantz maß mit dem Treyde / Nun wieuil soll mann jetzt brot bachen auß disem maß / dieweil auß einem Achtel gebachen werden 90. brot / vnd helt an dem gewicht 163. pfundt / wie vor angezeigt / So soll also gesetzt werden in die Regel de Tri 163. geben mir gebachen Brot 90. wieuil werden auß 240. pfundt gebachen / so werden auß disem Maß gebachen 132½. Brot / on die vbrigen pfundt die mögen eingetheilet werden / Also mag es auch mit disem gehalten werden / wie dann vor geschehen in der Ordnung mit den Achteln / vnnd soll das Brot auch halten zwei pfundt / also kan es auch mit andern massen gehalten werden / in andern gegent vnd Landen.
  cs: |-
    Dále: má-li se na některém místě míra, která v sobě obsahuje 16 malých měr, má se jedna z těchto malých měr naplnit obilím a toto naměřené obilí pak pečlivě zvážit; zjistí se kupříkladu, že taková míra obsahuje 15 liber, takže celá míra činí 15 krát 16, to jest 240 liber – tak těžká bude celá míra s obilím. Kolik chlebů se má nyní upéci z této míry, když se z jednoho achtelu peče 90 chlebů a ten má na váhu 163 liber, jak bylo uvedeno výše? Do trojčlenky se tedy postaví takto: 163 mi dává 90 upečených chlebů, kolik se jich upeče z 240 liber? Upeče se z této míry 132 a půl chleba[^1], kromě zbývajících liber, které lze rozdělit. Takto se tedy může postupovat i s touto mírou, jak se dříve stalo v řádu s achtely, a chléb má rovněž vážit dvě libry; stejně tak se může postupovat i s jinými mírami v jiných končinách a zemích.
- typ: odstavec
  de: |-
    Item / so nun wirt bestelt an allen orten / daß mann Brot bächt / vnd zu zůfüren verordnet / soll mann an allen enden bestellen / das auff zwei Pfundt gebachen werde / so mag mann redtlich in der Ordnung bleiben / vnd ist allen denen leicht / die darmit vmbgehen / vnnd
  cs: |-
    Dále: zařídí-li se nyní na všech místech, aby se pekl chléb a přikáže se jej dovážet, má se všude objednat, aby se pekl na dvě libry; tak bude možno zůstat řádně v pořádku a bude to snadné pro všechny, kdo s tím zacházejí, a
poznamky:
- n: 1
  text: |-
    Zlomek „½“ v „132½.“ je v BSB OCR vynechán a byl doplněn podle skenu tisku (240 × 90 : 163 ≈ 132,52).
