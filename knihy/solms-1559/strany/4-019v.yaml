  popis: |-
    Celostránkový dřevořez označený číslem „9“ (vpravo nahoře): dvojitý dělový kladkostroj na trojnožce (čtyři nohy nesoucí dva navijáky s ozubenými koly a společným lanovím) spolu se samostatnou pátou (odnímatelnou třetí) nohou vpravo. Kolem stroje je vyobrazeno zákopnické a dělostřelecké nářadí: špičák, vidlicové páčidlo (sochor), široká motyka a rýč.
