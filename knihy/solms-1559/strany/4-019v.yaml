  popis: |-
    Celostránkový dřevořez s číslem „9“ nahoře: dvojitý dělový kladkostroj ze dvou párů spojených noh, z nichž každý nese hřídel s ozubeným západkovým kolem; mezi nimi visí kladnice s hákem. Vpravo stojí samostatná noha, jíž lze po odejmutí jednoho páru doplnit zbylý pár na trojnohý kladkostroj s jedním hřídelem (viz `4-020r`). Kolem stroje je vyobrazeno nářadí: krumpáč, sochor s rozeklaným koncem, sekera a rýč.
