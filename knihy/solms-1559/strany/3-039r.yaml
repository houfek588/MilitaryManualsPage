bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    zeug röß oder schwach auch nach seiner notturfft/ Also magstu durch dise Rörn allen zeug/ vnd sein leng der zeit gewiß vnd eigentlich probiern/ dise Rörn soll in der mit einer handbreit ein stachel haben der geschraubt sei/ damit mann ein höltzene handthab daran schrauben mög/ oder etwan ein langs holtz/ so mann proben im wasser machen wolt/ wie die Rör gemacht solt sein/ wirt wie die andern figurn auch auffgerissen werden.
  cs: |-
    směs prudkou či slabou rovněž podle potřeby. Takto můžeš skrze tuto trubici spolehlivě a přesně vyzkoušet každou směs i délku času jejího hoření. Tato trubice má mít uprostřed v šířce dlaně zašroubovaný trn, aby se na ni dala přišroubovat dřevěná rukojeť anebo případně dlouhá tyč, kdyby se chtěly dělat zkoušky ve vodě; jak má být trubice udělána, bude rovněž jako ostatní nákresy zobrazeno.
- typ: nadpis
  uroven: 2
  de: Volgen die Apoteckischen Feur/ wie mann die machen vnd brauchen soll.
  cs: Následují lékárenské ohně, jak se mají dělat a používat.
- typ: odstavec
  de: |-
    DIeweil ich dann hieuor gemelt hab/ daß ich die Apoteckischen Feur mit den schweren Materialen/ für Schůler künst halt/ vnnd zum grossen werck nichts acht/ so will ich sie doch in jrem werdt gůt sein lassen/ vnd so vil ich der zu diser zeit hab ankommen mögen/ beschreiben/ Vnnd erstlich sollen dise hernach volgende Feurwerck von Marco Greco geschriben sein/ welcher krafft vnd tugent/ wie er schreibt/ gegen dem Feind zugebrauchen seien auff Wasser vnnd Landt/ fast gůt vnd krefftig befunden.
  cs: |-
    Ačkoliv jsem již výše poznamenal, že lékárenské ohně s těmi obtížně dostupnými surovinami považuji za žákovské hříčky a pro velké válečné dílo si jich mnoho nevážím, chci je přece jen ponechat v jejich vážnosti a popsat jich tolik, kolik jsem jich v této době mohl získat. Nejprve tedy následují ohňostroje {Feurwerck}, které prý sepsal Marek Řek;[^1] jejich síla a účinek proti nepříteli na vodě i na souši byly, jak píše, shledány velmi dobrými a mocnými.
- typ: odstavec
  de: |-
    Erstlich nim ein pfund Sandarial Purapur/ lauter Bergrot Metal in Ertzgruben gefunden vnd Armonati liquidi ein pfundt/ zusamen gestossen vnd inn ein glesere geschirr gethan/ von der Sonnen oder glühenden koln zergehen lassen biß es einer butter oder schmaltz mit der düne gleich wirt/ daß mann sehen oder empfinden kan/ wann mann ein holtz oben zu dem geschirr hinein thůt/ zu dem soll Architram Greci 4. pfundt oben auff vor benente Species gethan/ soll als dann verhüt werden/ damit das Feur kein hauß oder dach erreich.
  cs: |-
    Nejprve vezmi jednu libru {pfund} čistého červeného realgaru (*Sandarial Purapur*),[^2] čistého rudného kovu nacházeného v rudných dolech, a jednu libru tekutého salmiaku (*Armonati liquidi*).[^3] Roztluč to spolu, dej do skleněné nádoby a nech rozpustit na slunci nebo nad žhavým uhlím, až to bude řídké jako máslo nebo sádlo; to lze poznat či ucítit, když se shora do nádoby ponoří dřívko. K tomu se mají shora na výše jmenované přísady přidat 4 libry řeckého dehtu (*Architram Greci*),[^4] a pak je třeba dávat pozor, aby se oheň nedostal na nějaký dům nebo střechu.
- typ: odstavec
  de: |-
    Wan du aber auff wasser das Feurwerck wircken woltest/ so mach einn schlauch oder ledern sack von Geyßhäuten/ thů obgemelts saffts 2. pfundt darinn/ ob anders die Feind so nahe/ wann sie aber ferr sein/ magst du mehr dann 2. pfundt nemen/ darnach solt du zu dem obbeschriben schlauch oder ledern sack einen eysenen Spiß binden/ dann solt du wider den Spiß ein holtz darzů tüglich offtermals bestreichen/ vnd dann das holtz an dem gestat angezindt/ vnd vnder den sack gelegt/ das der safft auff dem holtz distuliert vnd erzindt werde/ so wirt das Feur auff dem wasser lauffen/ vnd vmbsich was da zuuerheern ist/ verbrennen.
  cs: |-
    Chceš-li však tímto ohňostrojem působit na vodě, zhotov měch či kožený vak z kozích kůží a vlij do něj 2 libry výše zmíněné šťávy – jsou-li ovšem nepřátelé tak blízko; jsou-li však daleko, můžeš vzít více než 2 libry. Potom k výše popsanému měchu či koženému vaku přivaž železný bodec.[^5] Pak podél toho bodce několikrát potři k tomu vhodné dřevo, dřevo na břehu zapal a polož je pod vak, aby šťáva po dřevě stékala a vznítila se – tak oheň poběží po vodě a spálí kolem sebe vše, co lze zpustošit.
poznamky:
- n: 1
  text: |-
    Marcus Graecus (Marek Řek), legendární autor středověké sbírky pyrotechnických receptů *Liber ignium ad comburendos hostes* (*Kniha o ohních k hubení nepřátel*), z níž Solms čerpá tuto i následující část receptů.
- n: 2
  text: |-
    *Sandarial Purapur* – sazečská či překladatelská zkomolenina latinského *sandaraca pura* („čistý sandarak / realgar“, červený minerál z rudných dolů, zde vysvětlený německy jako *lauter Bergrot Metal*).
- n: 3
  text: |-
    *Armonati liquidi* – v předloze Marka Řeka *sal armoniacum liquidum* nebo *gummi ammoniacum liquidum* (rozpuštěný salmiak či čpavková pryskyřice).
- n: 4
  text: |-
    *Architram Greci* – z arabsko-latinského *alchitram / alquitran graecum* (řídký asfalt, nafta či řecká smůla).
- n: 5
  text: |-
    Výraz *Spiß* zde označuje železný hrot či bodec k zatížení a upevnění koženého měchu na vodě, nikoli pěchotní píku.
