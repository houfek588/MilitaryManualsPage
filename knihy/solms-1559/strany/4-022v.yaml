    Celostránkový dřevořez (otočený na šířku) s pěti obrannými a zápalnými prostředky proti útoku, označenými čísly „20“–„24“: „20“ španělský jezdec (břevno křížem prostrčené oboustranně zašpičatělými kůly); „21“ provazem prošívaná tlumicí matrace pod těžký moždíř; „22“ sud s nehašeným vápnem, uvnitř se soudkem prachu a trubkou; „23“ stočený smolný věnec ze zápalných pytlů; „24“ pálená hliněná koule (granát) s hrdlem a dvěma oušky pro šňůru k vrhání.
