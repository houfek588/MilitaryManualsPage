    Celostránkový dřevořez s pěti obrannými a zápalnými prostředky při zteči, označenými čísly „20“–„24“ (otočeno na šířku): „20“ španělský jezdec (břevno křížem pobité oboustranně zašpičatělými kůly); „21“ provazem prošívaná tlumicí matrace pod těžký moždíř; „22“ oslepovací soudek nehašeného vápna s prachovým jádrem a rourkou; „23“ pletený smolný věnec ze zápalných pytlů; „24“ vypálená hliněná ruční granátová koule s dlouhým hrdlem a šňůrkou k vrhání.
