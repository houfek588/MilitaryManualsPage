bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    deßgleichen was gegen den Feinden im feld zuhandeln ist/ zubesehen oder zu berathschlagen/ darzu seind sie zugebrauchen/ auff das best wie sie es verstehn vnd wissen. Als wann man schlagen wolt/ so mag ein Herr wider derselbigen einn sagen: Nim du das Regiment/ oder so vil Knecht/ so wil ich die Hauptleut auff dich bescheiden/ thůt den angriff mit den feinden/ der gestalt/ so weyß ein Herr das derselbig die sach außricht/ vnd mit jm versehen ist/ Deßgleichen eim andern ein anders. Also werden dieselbigen gůten leut wider gebraucht/ vnd die Hauptsachen jnen befolhen/ vnd in die hand gegeben/ gleich so wol als wan sie noch jre Regiment vnder dem Kriegsuolck hetten/ also mag man beiden theilen thůn zu roß vnd fůß/ vnd der namen Oberster nit zuuil sein lassen/ sonder Ritmeister vnd Leutenant genennt/ Dann gewißlich ist es nit gůt vil Obersten/ auß obgemelten vrsachen/ vnd noch vil mehr/ das nit wol daruon zu schreiben/ dann es noch in kurtzer erfarung ist/ daß sich durch vil obersten im feld nit wol zutragen hat wöllen/ ist aber durch herr Jörgen von Fronsperg/ vnd Herr Mercken/ vnd andere mehr/ geendert vnd abgethan worden/ damit gehorsam vnnd einigkeit möcht erhalten werden. Es were dann sach/ das etwan von zweien Nationn oder Sprachen so vil bei einander seien/ daß sie von beiden theiln gleich wern/ vnd sich mit eim Regiment nit vergleichen künden/ so mag ein jedes theil einen eigen Obersten haben/ doch daß dieselbigen vnder des Kriegsherrn (der sie bezalt) Regiment seind/ vnd sich desselbigen herrn/ vnd des Leutenants befelch halten.
  cs: |-
    stejně jako je lze použít k tomu, aby obhlíželi nebo rozvažovali, co je třeba podniknout v poli proti nepřátelům, tak nejlépe, jak tomu rozumějí a znají. Tak například, když se má svést bitva, může pán jednomu z nich říci: „Vezmi tento pluk {Regiment} nebo tolik a tolik knechtů {Knecht} a já ti přidělím hejtmany {Hauptleut}; zaútočte na nepřátele!“ Tak pán ví, že ten člověk věc vykoná a že je o ni s ním dobře postaráno; a podobně jinému uloží něco jiného. Tímto způsobem jsou ti dobří lidé opět využiti, svěřují se jim a dávají do rukou hlavní úkoly stejně dobře, jako kdyby ještě měli své vlastní pluky mezi válečným lidem {Kriegsuolck}. Tak lze postupovat u obou složek, na koni i pěšky, a nenechávat příliš mnoho titulů plukovníka {Oberster}, nýbrž jmenovat je rytmistry {Ritmeister} a poručíky {Leutenant}. Neboť mnoho plukovníků skutečně není dobré z výše uvedených příčin i z mnoha dalších, o nichž se ani nedá psát – vždyť nedávná zkušenost ukázala, že přemíra plukovníků v poli nedopadala dobře, a proto to páni Jörg z Frundsbergu, pan Marx[^1] a další změnili a zrušili, aby mohla být udržena poslušnost a svornost. Jedině snad v případě, kdy by bylo pohromadě tolik mužů ze dvou národů či jazyků, že by si obě strany byly rovny a nemohly by se sjednotit v jednom pluku, tehdy může mít každá strana vlastního plukovníka, avšak tak, aby podléhali velení válečného pána {Kriegsherrn} (jenž je platí) a drželi se rozkazů tohoto pána i jeho poručíka.
- typ: odstavec
  de: |-
    Darumb soll der Kriegsherr/ so der im feld ist/ allein den namen haben/ oberster Feldherr vnd Hauptman/ vnd keiner neben jm/ dann wo einer neben oder vnder jm den namen hett/ were es dem Herrn ein verringerung/ vnd macht vil partheien vnd meutereien/ würde aber ein Herr nit selbs im feld sein künden/ so můß er einen obersten in seine stat haben/ der sol als dann geacht vnd gehalten werden (der gestalt) wie der herr selbs/ doch so soll jm sein gebürent theil gegeben werden/ wann ein Schloß/ Stat oder Flecken gewonnen würde/ deßgleichen auch mit den hohen hauptern die gefangen werden/ das ander dem rechten Kriegsherrn zustendig ist vnd gebürt. Es sol auch der Kriegsherr sein Obersten/ vber die Knecht vnd Regiment/ alle sein ämpter selbst besetzen lassen/ vnd jm auff das aller hefftigst in sein pflicht einbinden vnd befelhen/ daß er seine ämpter/ souil jm möglich/ mit verstendigen vnd tüglichen personn besetzen vnd versehen wöl/ vnd nit noch freundschafft oder gunst/ sonder nach dem er meint daß es zum besten versehn werd/ So ist dem herrn wol gedient/ vnd das Volck versehen.
  cs: |-
    Proto má mít válečný pán, je-li v poli, jedině sám titul nejvyššího polního pána a hejtmana {Hauptman}, a nikdo jiný vedle něho; kdyby totiž někdo vedle něho nebo pod ním takový titul měl, bylo by to pánovi na újmu a plodilo by to mnoho rozkolů a vzpour {meutereien}. Kdyby však pán nemohl být v poli osobně, musí mít na svém místě jednoho nejvyššího velitele, který má být pak vážen a ctěn tak jako sám pán; přitom se mu má dát jeho náležitý díl, dobude-li se nějaký hrad, město nebo městys, a stejně tak u zajatých vysokých velitelů – ostatní pak náleží a přísluší pravému válečnému pánovi. Válečný pán má také nechat svého plukovníka nad knechty a plukem, aby si všechny své úřady obsadil sám, a co nejdůrazněji mu uložit do jeho závazku {pflicht} a přikázat, aby své úřady, jak jen může, obsadil a opatřil rozumnými a způsobilými osobami, a nikoli podle přátelství nebo přízně, nýbrž podle toho, jak soudí, že bude věc nejlépe obstarána; tak je pánovi dobře slouženo a o lid postaráno.
- typ: odstavec
  de: Wo aber ein Herr die ämpter selbs besetzen wil/ oder durch sein
  cs: Chce-li však pán úřady obsazovat sám nebo skrze své
poznamky:
- n: 1
  text: |-
    Georg von Frundsberg a Marx Sittich von Ems (zmínění již na titulním listu Druhé knihy).
