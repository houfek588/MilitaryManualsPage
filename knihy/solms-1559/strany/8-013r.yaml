bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Helfft / vnd setze dann den Haffen mit dem Puluer in die mit darein / vnnd fölle den Haffen mit Kalck neben vmb auß / mann soll zuuor die eisen Rörn mit Fewerwerck / wie mann die Trachteten macht / außföllen / vnd zum hertesten schlagen wie mann die Trachteten schlecht / vnd wann die Rör gefölt / geschlagen vnd zůgericht ist / am kleinsten ort in ein warm Bech stossen / doch daß das loch an der Rören nit mit zugemacht werd / sonder nur neben herumb / vnd also weich in den Haffen gesteckt / vnd neben herumb verbicht vnnd vermacht / alßdan mit Kalck gar biß an den andern Bodem außgefölt / durch solchen Bodem sollen drei Rören gehn / darnach die Ton oder Faß hart zugeschlagen / vnnd die Rörn mit einem Leder fest zugebunden / daß nichts herauß fallen kan / wann solchs geschehen / soll mann die Ton verwart biß zur zeit der not hinstellen / vnnd wann mann störmen will in die blinden oder verborgen Gräben legen / verborgene verdeckte vnd lauffende Feur darzů machen / So soll der lufft also gemacht werden / erstlich soll mann ein Holtz (wie es die notturfft erfordert) nemen / das auff einer seiten wie einn Kendel oder Rinde außhawen / vnd darauff einn brettern Deckel machen / darinn löcher boren daß die Rörn darinn gehen / darnach den Kendel vol gar faulles puluer thůn / den deckel darauff legen vnd zu nageln / dann inn einen blinden Graben oder Zwinger / da mann störmen soll / legen / vnd die Kalcktonnen dann auff des Kendels deckel / vnd die Rörn an den Tonnen in die Löcher so inn dem deckel sind / setzen / daß die Tonnen auff dem deckel stehn. Also mag mann souil Faß neben einander / als die notturfft erfordert oder souil derer sind / stellen / wann das volbracht ist / so mag einer die mit Erden / Stro oder was mann hat / verdecken / wann mit dem Storm ein einfal geschehe / soll mann nit anzünden es were dann die menge darinn / wann dann also der hauff vnnd gedreng da ist / soll einer das das darzů zugericht ist an einem ort anzünden / so laufft das Fewer in dem Kendel fürt zu allen fassen / vnnd zündt eins nach dem andern an / dann kompt das Fewer in daß puluer inn den Tonnen / schlecht die von einander / treibt den Kalck zu staub vnd Dampff / das mann weder sehen noch stehn kan / Es mag einer auch Kisselstein zu dem Kalck in die Tonnen thůn / die schlagen auch vmb sich / oder mag ein Ton gar vol Stein on Kalck vnnd desto mehr puluer darzů thůn / so schlecht es desto stercker / wann das recht gemacht wirt / so machs ein wüsten dampff / blenden vnd schlagen / Darnach ist zů dencken vnd zusehen das sie recht zugericht werden / wie dise zwo Figurn eine mit 22. die ander mit 25. verzeichnet /
  cs: |-
    poloviny, pak do něj doprostřed postav hrnec {Haffen} s prachem {Puluer} a hrnec kolem dokola obsyp vápnem {Kalck}. Železné trubky {Rörn} se předtím mají naplnit zápalnou složí {Fewerwerck}, jako se dělají rakety {Trachteten}[^1], a co nejtvrději upěchovat, jako se pěchují rakety. Když je trubka naplněná, upěchovaná a připravená, má se užším koncem namočit do teplé smůly {Bech}, avšak tak, aby se otvor trubky nezalepil, nýbrž jen okolí; tak se má ještě měkká zastrčit do hrnce a kolem dokola zasmolit a utěsnit. Pak se soudek zcela vyplní vápnem až po druhé dno; tímto dnem mají procházet tři trubky. Potom se soudek neboli sud {Faß} pevně zatluče a trubky se pevně převážou kůží, aby nic nemohlo vypadnout. Když se to stane, má se soudek uložit pod dohledem až do času nouze. A když chce nepřítel útočit {störmen}, mají se soudky položit do slepých neboli skrytých příkopů a k tomu se mají udělat skryté, zakryté a běžící ohně. Průchod [ohně][^2] se má udělat takto: předně se vezme dřevo (podle potřeby), na jedné straně se vyduje jako žlab {Kendel} neboli koryto a udělá se na ně prkenné víko, do něhož se vyvrtají otvory, aby do nich vešly trubky. Pak se žlab naplní velmi pomalým prachem[^3], přiloží se víko a přibije se. Pak se žlab položí do slepého příkopu nebo parkánu {Zwinger}, kudy má nepřítel útočit, a vápenné soudky se postaví na víko žlabu tak, aby trubky soudků vešly do otvorů ve víku a soudky stály na víku. Takto lze postavit vedle sebe tolik sudů, kolik vyžaduje potřeba nebo kolik jich je. Když je to hotovo, lze je přikrýt hlínou, slámou nebo čímkoli, co je po ruce. Vtrhne-li nepřítel útokem {Storm} dovnitř, nemá se zapalovat, dokud v tom místě není celá jeho masa. Když je tam pak houf a tlačenice, má někdo to, co je k tomu připraveno, na jednom místě zapálit; oheň pak běží žlabem dál ke všem sudům a zapaluje jeden po druhém. Potom se oheň dostane do prachu v soudcích, roztrhá je a rozpráší vápno v prach a dým, takže nelze ani vidět, ani stát. Do soudků lze k vápnu přidat i oblázky {Kisselstein}, které také rozmetají kolem sebe; nebo lze soudek naplnit samým kamením bez vápna a přidat víc prachu, pak bije tím silněji. Je-li to správně uděláno, dělá to ošklivý dým, oslepuje a bije. Proto je třeba pamatovat a dbát, aby byly správně připraveny, jak
poznamky:
- n: 1
  text: |-
    „Trachteten“ – tak čte tisk; zjevně jde o rakety (Racketen, Ragetten), jejichž trubice se rovněž plnily zápalnou složí a tvrdě pěchovaly.
- n: 2
  text: |-
    „lufft“ – zde nejspíše „Lauft“, tj. dráha, jíž oheň běží ke všem soudkům (srov. výše „lauffende Feur“, běžící ohně).
- n: 3
  text: |-
    „faulles puluer“ – pomalu hořící (slabý) prach, který nevybuchne, ale vede oheň po celé délce žlabu jako stopina.
