bloky:
- typ: nadpis
  uroven: 3
  de: Alhie soll ein Statt vnd drei Leger darumb gemalt werden.
  cs: Zde má být namalováno město a kolem něho tři ležení.[^1]
- typ: odstavec
  de: |-
    AVch so ein fliessend Wasser bei der Stat hinlaufft daß jr ein Brück darüber schlagen must / solt jr acht haben daß die Brück an ein ort geschlagen werd da den Feinden Prouiant oder hilff zůkommen möcht / solches ist euch zu zweigen dingen gůt / Erstlich ists euch dienstlich zuuolbringen das jenig so jr zuthůn im sinn habt / zum andern daß jr verhindern kündet die Prouiant vnnd redung so den Feinden daselbst zukommen möcht / vnd wann euch ein ort eben als gůt vnd nützlich als das ander den Feinden Prouiant zunemen sein würde / wolt ich es doch lieber vber dann vnder der Statt verlegen / dann die in der Statt vil bequemlicher ein brück so vnder der Stat dem fluß des Wassers nach ligt verbrennen oder zerreissen künden mit hilff des Wassers / daß solches zu der Brücken hinab treiben kan / welches nicht sein mag wenn sie ob der statt ist / doch solt jhrs so sicher machen daß beide theil der Brücken mit ewerm Leger vnd Polwercken bewart werden / wann jhr die Brücken vnder der Statt schlaget / must jhr klein Schifflein machen lassen / vnd dieselbigen mit Ketten zusamen binden / darmit eines an dem anderen sei / dieselbigen künden wol verwachen daß die in der statt kein Fewer das Wasser herab der Brücken zů werffen künden. Auch habe ich wol gesehen das ein Statt mit graben gewunnen ist worden / doch muß ein statt auch darnach ein gelegenheit hat / dann sie nicht alle gůt zugraben seind / doch muß mann gůt fleiß mit dem graben vnd gůt groß balcken vnnd Höltzer haben / darmit mann es vnderbawe / vnnd so still mit der sach vmbgehen / daß die inn der Statt nicht innen werden wo jhr graben wolt / dann sie würden sonst gegen euch graben / vnd euch dardurch grossen schaden zůfügen / wann jhr nun tieff vnd wol zu der Stat graben habt / müst jr tag vnd nacht ein gůt Wacht darbei haben / damit die in der Stat nicht gegen euch graben / vnd euch dardurch hinauß jagen mit grossem mercklichem schaden / dann wann nit ein gůte sorgsame wacht darinn ist / mögen sie liederlich ewer graben gewinnen vnd nit wol möglich das jrs wider gewinnet / vnd ist alle zeit / weil vnd arbeit verlorn / wann jr nun so weit hinein kompt daß mann sich mit jnen schlagen muß / so stelt die freudigsten voran / dann es gantz ein gefehrlich ding ist
  cs: |-
    Teče-li u města řeka, přes kterou musíte postavit most {Brück}, máte dbát, aby byl postaven na místě, kudy by nepříteli mohl přicházet proviant {Prouiant} nebo pomoc. To vám dobře poslouží ke dvěma věcem: zaprvé vám pomůže vykonat to, co máte v úmyslu, zadruhé můžete zabránit tomu, aby tam nepříteli přicházel proviant a pomoc {redung}.[^2] A bylo-li by vám jedno místo k odříznutí nepřítele od proviantu stejně dobré a užitečné jako druhé, raději bych most položil nad městem než pod ním. Ti ve městě totiž mohou most, který leží pod městem po proudu, mnohem snáze spálit nebo rozbít s pomocí vody, která to k mostu snese dolů; to nejde, leží-li most nad městem. Máte to však zajistit tak bezpečně, aby oba konce mostu chránilo vaše ležení {Leger} a bolverky {Polwercken}. Stavíte-li most pod městem, musíte dát udělat malé loďky a svázat je řetězy, aby byla jedna u druhé; ty mohou dobře hlídat, aby ti ve městě nemohli pouštět oheň po vodě dolů na most. Viděl jsem také, že bylo město dobyto podkopem, ale město k tomu musí mít také vhodnou polohu, neboť ne všechna se dají dobře podkopat. Při podkopávání je však třeba velké píle a dobrých velkých trámů a dřev, aby se podkop podepřel, a s celou věcí je třeba zacházet tak tiše, aby ti ve městě nezpozorovali, kde chcete kopat; jinak by kopali proti vám a způsobili vám tím velkou škodu. Když už jste se podkopali hluboko a dobře až k městu, musíte tam mít ve dne i v noci dobrou stráž {Wacht}, aby ti ve městě nekopali proti vám a nevyhnali vás tím ven s velikou a citelnou škodou. Není-li tam totiž dobrá a bedlivá stráž, mohou váš podkop snadno dobýt a sotva se vám podaří jej znovu získat; a pak je všechen čas i práce ztracena. Když se dostanete tak daleko dovnitř, že je nutné se s nimi bít, postavte dopředu ty nejsmělejší, neboť je to velice nebezpečná věc,
poznamky:
- n: 1
  text: Nadpis je pokynem k vyobrazení (obléhané město se třemi leženími); v tisku však na tomto místě žádný obraz není, text pokračuje přímo pod nadpisem.
- n: 2
  text: „redung“ – zde zřejmě ve smyslu „Rettung“ (pomoc, posila).
