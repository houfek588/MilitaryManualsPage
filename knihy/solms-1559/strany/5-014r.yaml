list: 14 (5. kniha)
strana: recto
sken: 463
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    jre pferd das sie also nicht weiter ziehen dann in jrem Landt bleiben/ bei jrer Fütterung aber zu den weitsten auff jren nachbaurn da sie jre Prouiant vnd Füterung erlangen mögen/ vnd auß dem Landt nach bringen künden.
  cs: |-
    se svými koňmi netáhnou dál, než že zůstávají ve své zemi u své píce, nanejvýš k nejbližším sousedům, kde mohou získat proviant a píci a odkud si je mohou dovážet za sebou.
- typ: odstavec
  de: |-
    Weiter so ist zu glauben/ das sie solliches Kriegßuolck nit alles mit nemen auff andere Landt zuziehen/ sonder wann das ein Zug in jre landt gehen/ oder auß dem Landt inn einander Landt ziehen würde/ das mag nit sein dann kein Landt kündt sie erleiden noch ertragen/ an der Prouiant/ Füterung vnd der weid.
  cs: |-
    Dále je třeba věřit, že takový válečný lid {Kriegßuolck} neberou všechen s sebou, když táhnou do jiných zemí. Kdyby totiž mělo nějaké tažení {Zug} vést do jejich země nebo z jejich země do jiné, není to možné, neboť žádná země by je nesnesla ani neuživila, pokud jde o proviant {Prouiant}, píci {Füterung} a pastvu.
- typ: odstavec
  de: |-
    Dann solte solliche 452000. menschen mit Brot allein erhalten werden einen tag/ so wölt auff solliche 452000. Person ein tag gehn an Zall der Brott so es nit mehr schwer sein solte/ dann ein pfundt würde es tragen an Zal der Brott 452000 stcük/ das will ich in ein Rechnung stellen/ damit zusehen sein solte/ was es an Zal/ gewicht vnd maß tragen solt/ vnd wurde doch ein mensch mit eim pfundt nit zuerhalten sein.
  cs: |-
    Kdyby totiž mělo být těch 452 000 lidí živeno po jeden den jen samým chlebem, připadlo by na 452 000 osob za jeden den – pokud by chléb nevážil víc než jednu libru {pfundt} – 452 000 chlebů. To chci sestavit do počtu, aby bylo vidět, co by to činilo co do počtu, váhy a míry; a přitom by se člověk jednou librou ani neuživil.
- typ: odstavec
  de: |-
    Item 180. Brot werden gebachen auß einem achtel Korn/ welches vngefehrlich 163. pfundt wigt/ vnd ist ein Brot eins pfundts schwere.
  cs: |-
    Dále: 180 chlebů se upeče z jednoho achtelu {achtel} žita, který váží přibližně 163 liber; jeden chléb váží jednu libru.
- typ: odstavec
  de: |-
    Item so dann die 452000. Brot solten alle gebachen werden/ eins von einem pfundt/ so würden solche 452000 Brot schwer an gewicht sein 4520. Centner.
  cs: |-
    Dále: mělo-li by se tedy upéci všech 452 000 chlebů, každý po jedné libře, vážilo by těch 452 000 chlebů 4 520 centů {Centner}.
- typ: odstavec
  de: |-
    Item zu disem obgemeltem Brot/ als 452000. stück gehörn 1461. Achtel Korns.
    Item die Summa der Achtel Korns wigen 415260. pfundt.
    Item an Centnern wigt das Korn 4152. Centner.
    Item dises Brot in das leger zufüren/ muß mann haben 226. wagen/ den wagen 20. Centner schwere geladen.
    Item in einen Wagen 4. pferdt gespandt/ macht in summa 904.
    Item solt dann ein Person mit 2. pfundt Brots einn tag gespeist werden/ das wirt mit Brot/ Korn vnd gewicht zweimal doppel souil tragen.
  cs: |-
    Dále: k tomuto výše zmíněnému chlebu, totiž 452 000 kusům, je třeba 1 461 achtelů žita.[^1]
    Dále: tyto achtely žita váží úhrnem 415 260 liber.
    Dále: v centech váží to žito 4 152 centů.
    Dále: k dovozu tohoto chleba do ležení {leger} je třeba mít 226 vozů, každý vůz naložený 20 centy.
    Dále: zapřáhnou-li se do jednoho vozu 4 koně, činí to úhrnem 904 [koní].
    Dále: kdyby měla jedna osoba dostávat na den 2 libry chleba, vyneslo by to na chlebu, žitu i váze dvojnásob.
- typ: odstavec
  de: |-
    Item bei disem ist zudencken/ was auff ein Kriegßuolck geht/ allein an Korn vnd Brot/ vnd das sein wil vnd muß/ Darumb will zuuor wol bedacht sein/ wann ein Herr ein Heer oder veldzug thůn will/ daß zum ersten die Prouiant geordnet werde/ wo mann sie finden oder bekommen mög/ vnd in die leger gebracht würde/ durch die zufür zu wasser vnd landt/ besonder wann ein Herr in ein frembd landt ziehen will/ vnd ein zeit darinn zu bleiben vermeint/ daß er der Prouiant gewiß sei/ vnd jhm dieselbige nicht abgestreckt werden/ dann
  cs: |-
    Dále je při tom třeba uvážit, co padne na válečný lid jen na žito a chléb – a to být musí. Proto je třeba předem dobře rozvážit, chce-li pán vytáhnout s vojskem či podniknout polní tažení, aby se předně opatřil proviant {Prouiant}, kde se dá najít nebo sehnat, a aby se dovážel do ležení vodou i po souši. Zvláště když chce pán táhnout do cizí země a hodlá v ní nějaký čas zůstat, musí mít proviant zajištěn, aby mu nebyl odříznut. Neboť
poznamky:
- n: 1
  text: |-
    V tisku `1461. Achtel`. Při 180 chlebech z achtelu by 452 000 chlebů potřebovalo asi 2 511 achtelů a uvedená váha 415 260 liber odpovídá asi 2 548 achtelům po 163 librách; číslo 1 461 je tedy chybné (tisková chyba nebo chyba výpočtu). Ostatní údaje souhlasí: 415 260 liber ≈ 4 152 centů, 4 520 centů : 20 = 226 vozů, 226 × 4 = 904 koní. Tisk má u „452000 stcük“ přesmyčku za *stück*.
