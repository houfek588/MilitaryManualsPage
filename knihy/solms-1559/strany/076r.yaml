bloky:
- typ: nadpis
  uroven: 3
  de: Von den Hurnweibeln.
  cs: O šikovatelích trénu {Hurnweibeln}.
- typ: odstavec
  de: |-
    DIe Hurnweibell sollen den Troß/ Hurn vnd Bůben in ordnung behalten/ daß sie nit verlauffen/ sonder bleiben vnd ziehen wie sie jeder zeit geordnet werden.
  cs: |-
    Šikovatelé trénu mají udržovat v pořádku trén {Troß}, nevěstky a pacholky {Hurn vnd Bůben}, aby se nerozbíhali, nýbrž zůstávali pohromadě a táhli tak, jak jim bude pokaždé nařízeno.
- typ: odstavec
  de: |-
    Die Hurnweibel sollen des geschickt sein/ daß sie den Troß in den an vnd abzügen/ auch in den handlungen mit den feinden der massen fürhen/ damit das Kriegsvolck jrentwegen in kein nachtheil oder vnordnung kome.
  cs: |-
    Šikovatelé trénu mají být natolik obratní, aby při příchodech i odchodech a také při střetech s nepřáteli vedli trén takovým způsobem, aby válečný lid {Kriegsvolck} jejich vinou neupadl v žádnou újmu či nepořádek.
- typ: odstavec
  de: |-
    Wann die Hurnweibel mit den Hurn vnd Trossern auff beuelch des Prouosen gräben auß zufüllen ziehen/ wie ins Prouosen 16. Artickel endeckt/ sollen sie auch grossen fleiß ankeren.
  cs: |-
    Když šikovatelé trénu táhnou na rozkaz profouse {Prouosen} s nevěstkami a lidmi z trénu {Trossern} zasypávat příkopy, jak je vyloženo v 16. článku o profousovi, mají rovněž vynaložit velikou píli.
- typ: odstavec
  de: |-
    Gleicher gestalt wirt vom Stockmeister ins Prouosen 21. Artickel begriffen.
  cs: |-
    Stejně tak je o žalářníkovi {Stockmeister} pojednáno v 21. článku o profousovi.
- typ: odstavec
  de: |-
    Was auch weiter des Stockmeisters vnd Nachrichters ampt im Leger ist/ werden die vngehorsamen vnd mißhendler wol auch billich innen vnd gewar werden.
  cs: |-
    Jaký je dále úřad žalářníka a kata {Nachrichters} v ležení {Leger}, to neposlušní a provinilci sami po právu dobře poznají na vlastní kůži.
- typ: odstavec
  de: |-
    Von gemeinen Knechten zum beschluß vnd inn summa zu schreiben/ weiß ich nichts bessers/ dann das ein jeder Herr sich vor jn als vil jm jmmer möglich hůt/ wann er aber sie auß vnuermeidlicher notturfft haben můß/ alß dann bezall er sie wol/ gebrauch sie nach der haut/ vnd straff die verbrochen vbell.
  cs: |-
    O řadových knechtech {Knechten} bych na závěr a v souhrnu nevěděl napsat nic lepšího, než aby se jich každý pán vystříhal, jak jen může. Musí-li je však z nevyhnutelné potřeby mít, ať je dobře platí, plně je využije[^1] a provinilce přísně trestá.
poznamky:
- n: 1
  text: |-
    „Gebrauch sie nach der haut“ – doslova „ať je užívá podle kůže“; dobové rčení ve smyslu „důkladně, naplno“ (ať je nešetří), případně „podle jejich povahy“.
