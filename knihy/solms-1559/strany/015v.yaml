bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    gemelten jhre ämpter nicht recht verrichten / mag vnd soll jnen auch der oberst Feldhauptman einreden / vnd jn kein vnbillich fürnemen gestatten. Wiewol dise gemelte verwaltung der oberst Feldhauptman hat / soll er dannoch angezeigter ämpter keines endern / oder die Personen fahen lassen / er hett es dann lautter in seiner Instruction außgetruckt / oder geschehe von meuterei / verrätherei vnd Feldflucht / so sollen die beuelch der enderung oder gefengnuß / vom Kriegsherrn allein außgehn.
  cs: |-
    nezastávají své úřady řádně, může a má do toho nejvyšší polní hejtman {oberst Feldhauptman} zasáhnout a nesmí jim trpět žádné nesprávné počínání. Ačkoli má nejvyšší polní hejtman tuto zmíněnou správu, nemá přesto žádný z uvedených úřadů měnit ani dotyčné osoby dávat zatknout, ledaže by to měl výslovně stanoveno ve své instrukci anebo by se tak dělo pro vzpouru {meuterei}, zradu či útěk z pole; jinak mají rozkazy ke změně úřadu nebo k uvěznění vycházet pouze od válečného pána {Kriegsherrn}.
- typ: odstavec
  de: |-
    Der Oberst soll die geordneten hauffen zu roß vnd fuß am zug / ausserhalb der Renfanen / ordenlich lassen vmbgehn / dann dise vngleicheit geberet sonst grossen vnwillen.
  cs: |-
    Plukovník {Oberst} má na pochodu nechat seřazené houfy {hauffen} jízdy i pěchoty, mimo předvojovou korouhev {Renfanen}, řádně se střídat, neboť tato nerovnost jinak plodí velikou nevoli.
- typ: odstavec
  de: |-
    Das geschütz soll er im zug nach gelegenheit der sach ordnen / doch wo dz geschütz gefürt wirt / sols mit fußuolck besetzt vnd verwart werden.
  cs: |-
    Děla {geschütz} má na tažení {zug} seřadit podle povahy věci; kdekoli se však děla vezou, mají být obsazena a střežena pěchotou {fußuolck}.
- typ: odstavec
  de: |-
    Ein jeder Oberster soll im anzug / ehe er mit den Feinden zuhandlen kompt / auff das wenigst einen oder zwen vergeblich Lermen bei der nacht vnd tage / machen lassen / ob er an seinem Kriegsuolck zu roß vnd fuß mangel befünde / daß er solchs / ehe die feind zu jm kommen / wenden möcht.
  cs: |-
    Každý plukovník má při nástupu, dříve než dojde k boji s nepřáteli, dát vyhlásit alespoň jeden nebo dva cvičné poplachy {Lermen} v noci i ve dne, aby mohl napravit případný nedostatek u svého jízdního či pěšího válečného lidu {Kriegsuolck}, dříve než k němu přitáhnou nepřátelé.
- typ: odstavec
  de: |-
    Weil auch die züg im Krieg / darzů die Leger zweierlei gestalt / erstlich jnner / zum andern ausserhalb der Wagenburg geschehen / so ist vnderschiedlich daruon zumelden / hoch von nöten angesehen / wil ein Oberster mit seinem Kriegsuolck in der Wagenburg ziehen vnd liegen / muß er vffs wenigst zwen trefflich / verstendig Wagenburg meister haben / so die Wagenburg am zuge / vff beiden seiten füren / damit keiner dem andern zu bald oder langsam fare / sonst möcht der zug gar in keiner ordnung bleiben / auch die wagenburg vff anzeigen des Feldmarschalcks / nach gelegenheit des platz / vnd notturfft des Kriegsuolcks vnd geschützes vortheilich schliessen künden.
  cs: |-
    Poněvadž se také válečná tažení {züg} a k tomu i ležení {Leger} dějí dvojím způsobem – za prvé uvnitř a za druhé vně vozové hradby {Wagenburg} –, považuje se za velmi nutné se o tom zmínit rozdílně. Chce-li plukovník se svým válečným lidem táhnout a tábořit ve vozové hradbě, musí mít alespoň dva zdatné a zkušené mistry vozové hradby {Wagenburg meister}, kteří povedou vozovou hradbu za pochodu po obou stranách, aby jeden nejel oproti druhému příliš rychle ani pomalu, jinak by pochod nezůstal v žádném pořádku; a kteří by také na pokyn polního maršálka {Feldmarschalcks} uměli výhodně uzavřít vozovou hradbu podle povahy místa a potřeby válečného lidu i děl.
- typ: odstavec
  de: |-
    Die berürten zwen Wagenburgmeister bedorffen noch etliche geschickte personen / welche die wagen im zug (wie sie geordnet) behalten / wann aber ein wagen bricht / sollen sie jn eilents auß dem weg legen / vnd jn allweg den zug fürdern / vnd sonst kein Wagenman auß seiner zeil faren lassen. Wann aber ein Oberster nit in der Wagenburg ziehen noch ligen wil / oder jr bedarff / muß er dannoch einen geschickten wagenmeister / welcher ein ansehn hat / mit etlichen geschickten personen haben / so die wagen vff beuelch der obersten ordnen / vnd sie auch im zug darinn behalten.
  cs: |-
    Zmínění dva mistři vozové hradby potřebují ještě několik schopných lidí, kteří udrží vozy v pochodu tak, jak byly seřazeny; zlomí-li se však nějaký vůz, mají jej rychle odklidit z cesty a všemožně pochod urychlovat, a jinak žádnému vozkovi {Wagenman} nedovolí vyjet z jeho řady. Nechce-li však plukovník táhnout ani tábořit ve vozové hradbě, anebo jí ani nepotřebuje,[^1] musí mít přesto schopného vozmistra {wagenmeister}, jenž má vážnost, spolu s několika obratnými lidmi, kteří vozy na rozkaz plukovníků {obersten} seřadí a také je v tomto pořadí udrží za pochodu.
- typ: odstavec
  de: |-
    Der Oberst soll allweg das leger / darinn er ziehen wil / es sei jm dann nit möglich / oder hab sonst von seinen kreigsleuten / gůt vertraute kundschafft / vorhin durch den Feldmarschalck / oder andere kriegsuerstendigen / lassen besichtigen.
  cs: |-
    Plukovník má dát ležení, do něhož chce vtáhnout – ledaže by mu to nebylo možné anebo by jinak měl od svých válečníků dobré a spolehlivé zprávy {kundschafft} –, předem prohlédnout polním maršálkem nebo jinými války znalými muži.
poznamky:
- n: 1
  text: |-
    V předloze „oder jr bedarff“ (s přenesením záporu z předchozího „nit … noch“), tj. „anebo ji nepotřebuje“.
