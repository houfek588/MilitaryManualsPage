bloky:
- typ: nadpis
  uroven: 2
  de: Der Wagenmeister.
  cs: Vozmistr {Wagenmeister}
- typ: odstavec
  de: |-
    EIn Wagenmeister der solle haben ein Leutenant der auff jhn wart / vnd er soll alle Wagen / souil der jm zug sind / sonder die Artlerei wagen beschreiben von dem obersten an biß zu dem geringsten / wie vil ein jeder Wagen daruff er besoldung hat / vnd ob einer Wagen hette / vnnd darauff kein besoldung vnd wolt die auch in der ordnung vnd versehung haben / so solle er die auch darunder beschreiben / so er dann also alle wagen hat beschrieben / so soll er die dem Feldmarschalck brengen / vnnd jhn vnderichten / wie er die nach einander gehen soll lassen / doch so wirt des Obersten wagen vorgehen / darauff des Feldmarschalcks / vnd dann der Fürsten wagen / darnach die Ampter vnd der Regiment Obersten / wie mann dann die ordenen wirt / vnd wie die Regiment vor vnd nach ziehen / Also sollen die wagen auch nach vnd vorziehen vnd abwechseln / darauff soll er acht haben / vnd den abent fragen / wie die Regiment ziehen / also soll er die Wagen auch lassen ziehen / Vnd so mann den morgen anzeucht / so soll der Wagenmeister mit sampt seinem Leutenant vnd dienern zuuor daraussen an der strassen sein / da der zug hinauß gehn wirt / vnd besehen / daß sie nach der ordnung faren / Vnd so sich wolten wagen hinfür machen / die nicht hinfür gehörten / so soll er die halten lassen / biß sie herfür kommen die herfür gehörn. Vnd also soll er das in Ordnung brengen / vnd dann sein Leutenant bei den Wagen / darmit sie in der ordnung bleiben / lassen / vnd soll er vorziehen / sie im weg zubehalten / wie das durch den Obersten verordnet ist. Der Leutenant soll gůt achtung haben / ob etwan wagen / die nicht wol gespant / weren / vnd wolten nicht von stat faren / vnnd die anderen so auff jn geordnet weren / auch auff halten / so er das sicht / soll er denselben zu der seiten lassen außfaren / vnd die andern fürlassen / wirt er aber dann wider nach / vnd sein platz / erfaren / so soll er wider einrucken. Also soll auch geschehen / so die wagen die herfür geordnet seind / wolten den morgen langsam auff sein / vnnd vermeinen / die andern wägen můsten auff sie warten / gar nicht / sonder die andern sollen im zug hinweg ziehen / wann das Leger zeucht / kommen sie aber nach / vnd faren herfür / sollen sie in jren platz einziehen / wie sie geordnet sind / Es soll der Wagenmeister von dem Feldmarschalck allen abent
  cs: |-
    Vozmistr má mít poručíka {Leutenant}, který mu bude k ruce, a má zapsat všechny vozy, kolik jich na tažení {zug} je – kromě vozů dělostřelectva {Artlerei} –, od nejvyššího až po nejnižší, kolik má každý vozů, na něž pobírá žold {besoldung}; a kdyby někdo měl vozy, na něž žold nepobírá, a chtěl je také mít v šiku {ordnung} a pod ochranou, má je rovněž zapsat mezi ně. Když pak takto všechny vozy zapíše, má soupis přinést polnímu maršálkovi {Feldmarschalck} a poučit jej, jak je má nechat jet za sebou: přece však pojede napřed vůz nejvyššího velitele {Obersten}, za ním vůz polního maršálka, potom vozy knížat, nato úřady a plukovníci pluků {Regiment}, jak se právě seřadí; a jak pluky táhnou vpředu či vzadu, tak mají i vozy táhnout za nimi a před nimi a střídat se. Na to má dávat pozor a večer se ptát, v jakém pořadí táhnou pluky, a stejně tak má nechat táhnout i vozy. A když se ráno vyrazí, má být vozmistr spolu se svým poručíkem a služebníky předem venku na silnici, kudy tažení vyrazí, a dohlížet, aby jeli v pořádku. A kdyby se chtěly dopředu protlačit vozy, které dopředu nepatří, má je nechat zastavit, dokud neprojedou ty, které dopředu patří. Takto to má uvést do pořádku, pak u vozů ponechat svého poručíka, aby zůstaly v šiku, a sám jet napřed, aby je udržel na cestě tak, jak to nařídil nejvyšší velitel. Poručík má dávat dobrý pozor, zda některé vozy nejsou špatně zapřaženy, nechtějí jet z místa a zdržují i ostatní, kteří jsou zařazeni za nimi; spatří-li to, má nechat takový vůz vyjet stranou a ostatní pustit před něj, a když pak vůz opět dojede a najde své místo, má se zase zařadit. Totéž se má stát, kdyby vozy určené dopředu chtěly ráno vstávat pozdě a domnívaly se, že ostatní vozy na ně musejí čekat – vůbec ne, nýbrž ostatní mají v tažení táhnout pryč, když se ležení {Leger} zvedá; přijedou-li však později a dojedou dopředu, mají se zařadit na své místo tak, jak jsou určeny. Vozmistr má od polního maršálka každý večer
