  de: |-
    schweiben gebraucht werden / so ist man doch derselben zu disem Feldgeschütz nit bedörfftig / dan solchs an jm selbst nit so schwer / darzů wirts nit in den schantzen / gegen den Mauern oder beuestigungen / sonder allein in freiem Feld / gegen dem Kriegßuolck gebraucht vnd abgeschossen.
  cs: |-
    užívá dřevěných kotoučů {schweiben},[^1] k těmto polním dělům {Feldgeschütz} jich přesto není zapotřebí. Tato děla totiž nejsou sama o sobě tak těžká, a navíc se jich neužívá ani se z nich nestřílí v šancích {schantzen} proti hradbám či opevněním, nýbrž jen v širém poli proti válečnému lidu {Kriegßuolck}.
- typ: odstavec
  de: |-
    Summa alles Gezeugs so auff die fünfferlei Sort oder gattung / die da thůn 54. Stück Feldgeschütz gehörig / thůt an jm selbst 1800. Centner.
  cs: |-
    Veškerý kov pěti druhů čili tříd polních děl, celkem 54 kusů {Stück}, váží sám o sobě 1800 centů {Centner}.[^2]
- typ: odstavec
