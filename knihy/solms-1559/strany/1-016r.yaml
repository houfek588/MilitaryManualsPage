bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    darmit erschweren / das zu etwas fürderung vnd gůtem sein kan / so ist keiner nit desto freidiger / schlecht nicht desto härter / ist nicht desto weiser / anschlegiger oder geschickter / vnd daug zu nichts dann Gott zuerzörnen / vnd sich selber leichtfertig zumachen / so ist sich nit zuuersehen das glück nach heil daruon kome nach darbei sei / Dann wo mann Gott also gering acht / so leichtlich vnd vergeblich erzörnet / ist sich nit trost oder hilff zuuerhoffen / sonder straff vnd vnglück zubesorgen. Warumb sehen dann die Haupter nit darinn maß vnnd wege zusuchen / daß solchs groß vergeblich / můtwillig / vnd zu nichts nütziges laster vnd vbel abkomen möcht / dieweil es doch zu nichts dann zum vbel nütz ist / so were vnd ist dem billich nach zudencken hoch von nöten. Dieweil es dann also weit vil vnd hart eingebrochen / vnd in ein gewonheit komen ist / so ist zubesorgen / daß es schwerlich auff einen stutz vnd eil abkomen möchte bei so vil volcks.
  cs: |-
    přísahou vymoci,[^1] co by mu bylo k nějakému prospěchu a dobru. Nikdo z toho není smělejší, nebije tím tvrději, není moudřejší, vynalézavější ani obratnější; k ničemu to není, než aby se rozhněval Bůh a člověk sám ze sebe udělal lehkomyslníka. Proto nelze očekávat, že by z toho vzešlo či při tom bylo štěstí anebo spása.[^2] Kde se totiž Bohem takto pohrdá a tak lehce a nadarmo se popouzí k hněvu, tam nelze doufat v útěchu ani pomoc, nýbrž je třeba se obávat trestu a neštěstí. Proč tedy přední muži nehledají v tom míru a cesty, aby tato veliká, marná, svévolná a k ničemu neužitečná neřest a zlo vymizely, když to k ničemu jinému než ke zlu neslouží? O tom by bylo a je nejvýš zapotřebí po právu přemýšlet. Poněvadž se to však vzmohlo tak daleko, tak silně a hluboce a přešlo ve zvyk, je obava, že u tolika lidí se to sotva podaří odstranit rázem a narychlo.
- typ: odstavec
  de: |-
    Aber wie dem so soll mann nicht daruon lassen / vnd dem schendtlichen vbel platz geben / sonder dem ein anfang vnd eingang machen / damit man solchs wider in abgang vnd forcht mit der straff bringen möcht. Vnd der anfang můß durch hohe Haupter / als die Fürsten komen / aber nicht allein in dem Krieg / sonder in jren Landen gleich fals / Aber wann die Fürsten Obersten vnd Beuelchßleut des Kriegs wolten denen dingen begegnen / vnd zu einem anfang in das werck bringen oder richten / So will ich zum ersten mein geringes bedencken sagen : So bedeucht mich daß ein Feldoberster / so er Fürsten / Grauen vnd Herrn / vnder seinem Kriegßuolck haben würde / dieselbigen mit allen Obersten vnd beuelchßleuten erfordert hett / vnd jnen fürgehalten / daß sie selber sehen vnd hörten / was grausame Gottes lesterung vnd schweren vnder dem Kriegßuolck were / vnd allen tag sich meret vnd einfiel / so wißt er das vor Gott vnd der Welt nicht zuuerantworten / so er demselbigen also solt zusehen vnnd stat geben / er künde aber nicht bei jm geachten vnnd verhoffen / daß sie glück odder wolfart darbei haben künden / wann sie solliches frei on straff gehen lassen würden / dann baß vnd von nöten were jnen / daß sie die weg suchten vnd fürnemen / damit sie gnad / glück vnd sig erlangen vnd bitten möchten dann Gott also hoch vnd vergeblich erzörnen / daß sie jm dazu wolten behilfflich sein / so hett ich kein zweifel sie würden selber bedencken / daß solchs ein lesterlich vnd Gotloß werck were / vnd Gott dardurch erzörnet würd / nicht vil glück dabei sein kündt / vnd nach mitteln dencken damit solchen lastern begegnet vnd zum wenigsten ein anfürung vnd eingang bestehn zumachen.
  cs: |-
    Ať je tomu jakkoli, nesmí se od toho upustit a dávat tomuto hanebnému zlu průchod, nýbrž je třeba udělat počátek a začít, aby se to tresty opět podařilo potlačit a zahnat do bázně. A ten počátek musí vyjít od vysokých hlav, totiž od knížat – a to nejen ve válce, ale stejně tak v jejich zemích. Kdyby však knížata, plukovníci {Obersten} a velitelé {Beuelchßleut} války chtěli těmto věcem čelit a pro začátek je uvést ve skutek a v pořádek, povím nejprve své skromné mínění. Zdálo by se mi dobré, kdyby nejvyšší polní hejtman {Feldoberster}, má-li pod svým válečným lidem {Kriegßuolck} knížata, hrabata a pány, je svolal se všemi plukovníky a veliteli a předložil jim: Sami vidí a slyší, jaké ukrutné rouhání Bohu a klení panuje mezi válečným lidem a každým dnem se množí a vzmáhá. Před Bohem ani před světem by to nedokázal obhájit, kdyby tomu takto přihlížel a dával průchod; a nemůže u sebe soudit ani doufat, že by při tom mohli mít štěstí nebo zdar, nechají-li to volně a bez trestu běžet. Bylo by pro ně lepší a potřebnější hledat a volit cesty, jak dosáhnout milosti, štěstí a vítězství a vyprosit si je, než tak těžce a nadarmo hněvat Boha; ať mu v tom tedy chtějí být nápomocni. Pak bych neměl pochyb, že sami uváží, že jde o rouhačské a bezbožné dílo, jímž se Bůh popouzí k hněvu a při němž nemůže být mnoho štěstí, a budou hledat prostředky, jak takovým neřestem čelit a alespoň položit začátek a základ, který by obstál.
- typ: odstavec
  de: Zu einem anfang vnd eingang der handlung hett ich bei mir ein
  cs: Pro začátek a zahájení této věci bych měl na mysli jeden
poznamky:
- n: 1
  text: |-
    Tisk má *erschweren*, zde patrně ve smyslu *erschwören* – přísahou (klením) něco získat, vymoci.
- n: 2
  text: Tisk má dvakrát podobu *nach* místo *noch* („ani … ani“).
