bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    darmit erschweren / das zu etwas fürderung vnd gůtem sein kan / so ist keiner nit desto freidiger / schlecht nicht desto härter / ist nicht desto weiser / anschlegiger oder geschickter / vnd daug zu nichts dann Gott zuerzörnen / vnd sich selber leichtfertig zumachen / so ist sich nit zuuersehen das gluck nach heil daruon kome nach darbei sei / Dann wo mann Gott also gering acht / so leichtlich vnd vergeblich erzörnet / ist sich nit trost oder hilff zuuerhoffen / sonder straff vnd vngluck zubesorgen. Warumb sehen dann die Haupter nit darinn maß vnnd wege zusuchen / daß solchs groß vergeblich / můtwillig / vnd zu nichts nütziges laster vnd vbel abkomen möcht / dieweil es doch zu nichts dann zum vbel nütz ist / so were vnd ist dem billich nach zudencken hoch von nöten. Dieweil es dann also weit vil vnd hart eingebrochen / vnd in ein gewonheit komen ist / so ist zubesorgen / daß es schwerlich auff ein stuk vnd eil abkomen möchte bei so vil volcks.
  cs: |-
    přísahou dosvědčit,[^1] co by bylo k nějakému prospěchu a dobru; nikdo z toho není smělejší, nebije tím tvrději, není moudřejší, vynalézavější ani obratnější, a k ničemu jinému to není, než k rozhněvání Boha a ke zlehkomyslnění sebe sama; proto nelze očekávat, že by z toho vzešlo či při tom bylo štěstí anebo spása.[^2] Neboť kde se Bohem takto pohrdá a tak lehce a nadarmo se rozhněvává, tam nelze doufat v útěchu ani pomoc, nýbrž se obávat trestu a neštěstí. Proč tedy velitelé nehledí najít v tom míru a cesty, aby taková veliká, marná, svévolná a k ničemu neužitečná neřest a zlo vymizely, když to k ničemu jinému než ke zlu neslouží? O tom by tedy bylo a je nejvýše zapotřebí po právu přemýšlet. Poněvadž se to však vzmohlo tak daleko, silně a hluboce a přešlo to ve zvyk, je obava, že u takového množství lidí se to jen těžko podaří odstranit rázem[^3] a narychlo.
- typ: odstavec
  de: |-
    Aber wie dem so soll mann nicht daruon lassen / vnd dem schendtlichen vbel platz geben / sonder dem ein anfang vnd eingang machen / damit man solchs wider in abgang vnd forcht mit der straff bringen möcht. Vnd der anfang můß durch hohe Haupter / als die Fürsten komen / aber nicht allein in dem Krieg / sonder in jren Landen gleich fals / Aber wann die Fürsten Obersten vnd Beuelchßleut des Kriegs wolten denen dingen begegnen / vnd zu einem anfang in das werck bringen oder richten / So will ich zum ersten mein geringes bedencken sagen : So bedeucht mich daß ein Feldoberster / so er Fürsten / Grauen vnd Herrn / vnder seinem Kriegßuolck haben würde / dieselbigen mit allen Obersten vnd beuelchßleuten erfordert hett / vnd jnen fürgehalten / daß sie selber sehen vnd hörten / was grausame Gottes lesterung vnd schweren vnder dem Kriegßuolck were / vnd allen tag sich meret vnd einfiel / so wißt er das vor Gott vnd der Welt nicht zuuerantworten / so er demselbigen also solt zusehen vnnd stat geben / er künde aber nicht bei jm geachten vnnd verhoffen / daß sie gluck odder wolfart darbei haben künden / wann sie solliches frei on straff gehen lassen würden / dann baß vnd von nöten were jnen / daß sie die weg suchten vnd fürnemen / damit sie gnad / glück vnd sig erlangen vnd bitten möchten dann Gott also hoch vnd vergeblich erzörnen / daß sie jm dazu wolten behilfflich sein / so hett ich kein zweifel sie würden selber bedencken / daß solchs ein lesterlich vnd Gotloß werck were / vnd Gott dardurch erzörnet würd / nicht vil gluck dabei sein kündt / vnd nach mitteln dencken damit solchen lastern begegnet vnd zum wenigsten ein anfürung vnd eingang bestehn zumachen.
  cs: |-
    Nicméně přes to všechno se od toho nesmí upustit a dávat průchod tomuto hanebnému zlu, nýbrž je třeba udělat počátek a nástup, aby se to tresty opět podařilo potlačit a zahnat v bázeň. A ten počátek musí přijít od vysokých hlav, totiž knížat – a to nejen ve válce, ale stejně tak v jejich zemích. Kdyby však knížata, plukovníci {Obersten} a velitelé {Beuelchßleut} války chtěli těmto věcem čelit a pro začátek je uvést v skutek a pořádek, povím nejprve své skromné mínění: Zdálo by se mi dobré, kdyby nejvyšší polní hejtman {Feldoberster}, má-li pod svým válečným lidem {Kriegßuolck} knížata, hrabata a pány, povolal je se všemi plukovníky a veliteli a předložil jim, že sami vidí a slyší, jaké ukrutné rouhání Bohu a klení panuje mezi válečným lidem a každým dnem se množí a vzmáhá; že by to před Bohem ani před světem nedokázal zodpovídat, kdyby tomu takto přihlížel a dával průchod, a že u sebe nemůže soudit ani doufat, že by při tom mohli mít štěstí nebo zdar, nechají-li to volně bez trestu běžet. Neboť pro ně by bylo lépe a potřebněji hledat a volit cesty, jak dosáhnout milosti, štěstí a vítězství a vyprosit si je, než tak těžce a nadarmo rozhněvávat Boha; kdyby mu k tomu chtěli být nápomocni, neměl bych pochyb, že sami uváží, že jde o rouhačské a bezbožné dílo, jímž se Bůh rozhněvává a při němž nemůže být mnoho štěstí, a budou hledat prostředky, jak takovým neřestem čelit a alespoň položit základ a začátek, jenž by obstál.
- typ: odstavec
  de: Zu einem anfang vnd eingang der handlung hett ich bei mir ein
  cs: Pro počátek a uvedení tohoto díla měl bych u sebe jeden
poznamky:
- n: 1
  text: |-
    Sloveso *erschweren* zde stojí ve smyslu *erwähren / beschwören* – přísahou dosvědčit či získat.
- n: 2
  text: Tisk má dvakrát podobu *nach* místo *noch* („ani … ani“).
- n: 3
  text: |-
    V tisku stojí *auff ein stuk* (tisková varianta či chyba za *auf einen Stutz* – „rázem, najednou“).
