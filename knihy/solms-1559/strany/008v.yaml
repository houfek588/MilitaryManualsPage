bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    hohe besoldung haben/ daß er besehe was das für personen seien/ ob sie bekennt/ vnd des ansehens oder wert seind/ vnnd dieselbig person auff den eydt befrage/ ob der sold jm allein zustehe/ odder ob er jemands etwas daruon gebe/ deßgleichen sollen die Musterherrn auch thůn/ vnd mann soll nicht allzeit ein einen hauffen mustern lassen/ es sei dann ein verwarte person.
  cs: |-
    berou vysoký žold {besoldung}, aby prohlédl, co jsou to za osoby, zda jsou známé a mají takovou vážnost či cenu, a aby se té osoby pod přísahou {eydt} dotázal, zda jí ten žold {sold} náleží celý, anebo zda z něho někomu něco dává; totéž mají činit i přehlídkoví komisaři {Musterherrn}, a nemá se vždy nechat přehlížet[^1] jeden houf za druhým, ledaže jde o spolehlivou osobu.
- typ: odstavec
  de: |-
    Mann soll auch in den Artickels Brieff setzen/ daß kein Knecht keinem kein Sold auff sich soll lassen beschreiben/ dann allein was sein selbst ist/ vnd behelt/ vnd soll auch daruff schweren/ das er nicht mehr dann auff sein leib besoldung habe. Es sollen auch die Hauptleut darauff schweren/ vnd in jre Bestallung gesetzt werden/ daß sie für sich selbst/ auch keinem andern gestatten wöllen/ Es sei Musterherr oder einem andern einigen sold oder namen/ sonder denen die vnder jrem Fendlin seind/ vnd zu aller zeit darunder bleiben/ vnd die sach wie einem Landsknecht zusteht mit helffen zuuersehen.
  cs: |-
    Do artikulního listu {Artickels Brieff} se má také dát, že žádný knecht {Knecht} si nemá na sebe nechat připsat cizí žold, nýbrž jen to, co je jeho vlastní a co si ponechá, a má také přísahat, že nemá žold na víc než jen na svou vlastní osobu. Stejně tak mají přísahat hejtmani {Hauptleut} a má to být vloženo do jejich služebních listů {Bestallung}, že ani pro sebe, ani nikomu jinému – ať už je to přehlídkový komisař nebo kdokoli jiný – nedovolí žádný žold ani jméno kromě těch, kdo jsou pod jejich praporcem {Fendlin} a po celý čas pod ním zůstávají a pomáhají konat službu, jak lancknechtovi {Landsknecht} přísluší.
- typ: odstavec
  de: |-
    Der Oberst soll auch alle muster Register der Knecht/ ein jedes Fendlin besonder außziehen/ wie vil Personen darunder seind/ die er in die Ordnung zustellen hat/ vnd darzů tůglich seind/ vnd jhm also ein Register vnnd außzug von allen Hauptleuten odder Fendlin machen/ vnnd ein jedes Fendlein besonder nach einander beschrieben haben/ vnnd dem Kriegsherrn auch eins daruon vberantworten.
  cs: |-
    Plukovník {Oberst} má také vypsat všechny přehlídkové rejstříky {muster Register} knechtů, každý praporec zvlášť, kolik je pod ním osob, které má postavit do šiku {Ordnung} a které jsou k tomu způsobilé; a tak si má pořídit rejstřík a výtah ze všech hejtmanů či praporců, mít každý praporec zapsaný zvlášť jeden po druhém a jeden exemplář odevzdat i válečnému pánovi {Kriegsherrn}.
- typ: odstavec
  de: |-
    Vnd wann der Kriegsherr dann in das feld kompt/ vnd alles sein Kriegsuolck bei einander hat/ dann ein jedes Fendlin seine Knecht allein inn eine geuierdte Ordnung auff einen platz stellen lassen/ vnnd also eines jeden Fendlin hauffen/ allein vnnd neben einander stellen/ doch nicht mehr zusamen/ dann das ein gereume Gassen allwegen zwischen zweien Fendlin bleibe/ daß mann wol darzwischen hin mit raum mag reytten/ vnnd allwegen inn sollichen Gassen einer oder zwen reytten lassen/ die darauff sehen/ daß sie nicht zusamen lauffen/ vnnd wann die Fendlin also alle geordenet seind/ vnd stehn bei einander.
  cs: |-
    A když pak válečný pán vytáhne do pole a má pohromadě veškerý svůj válečný lid {Kriegsuolck}, [má] tehdy nechat postavit knechty každého praporce zvlášť do čtvercového šiku {geuierdte Ordnung} na jedno prostranství, a tak postavit houf každého praporce samostatně vedle sebe, avšak ne blíže k sobě, než aby mezi dvěma praporci vždy zůstala široká ulička, kudy lze volně projíždět na koni; a v takových uličkách má vždy nechat jezdit jednoho či dva muže, kteří budou dohlížet na to, aby se houfy nesbíhaly dohromady – a tak budou všechny praporce seřazeny a budou stát pospolu.
- typ: odstavec
  de: |-
    So soll der Kriegsherr mit dem Obersten vnnd seinen Kriegsräthen/ alle hauffen odder Fendlein besehen/ vnnd die glieder abzellen/ vnnd wieuil inn einem glied/ vnd das auffschreiben ein jedes besonder/ vnnd also alle hauffen/ vnnd wann er dann alle hauffen also beschehen gezelet vnd verzeichnet hat/ so mag er dann seine Hauffen ordenen wie er wil/ vnnd also ein Fendlin nach dem andern abzeichen/ vnd zusamen ordenen/ welche er inn einen
  cs: |-
    Poté má válečný pán s plukovníkem a svými válečnými rady {Kriegsräthen} prohlédnout všechny houfy či praporce, spočítat řady {glieder} a kolik mužů je v jedné řadě, a zapsat každý houf zvlášť, a tak všechny houfy. A když takto všechny houfy prohlédne,[^2] spočítá a zaznamená, může pak své houfy seřadit, jak chce, a tak jeden praporec po druhém odvádět a řadit dohromady ty, které chce mít v jednom
poznamky:
- n: 1
  text: |-
    Tisk má zdvojené *ein einen hauffen* (zřejmě sazečská nedopatřením vzniklá chyba místo *in einen hauffen*, tj. „do jednoho houfu“, nebo „jeden houf po druhém“).
- n: 2
  text: Tisk má formu *beschehen* místo *besehen* („prohlédnout“).
