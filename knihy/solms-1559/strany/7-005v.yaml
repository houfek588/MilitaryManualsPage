bloky:
- typ: obrazek
  soubor: drevorez-558.jpg
  popis: |-
    Čtyři obrazové karty pěchoty strany Hannibalovy (černý tisk), bez nápisů (pořadí po řádcích zleva doprava): 1. sevřený čtverhranný šik lancknechtů s lesem vztyčených pík a praporcem uprostřed, v jeho čele jezdec; 2. hustý houf pěších knechtů s velkým praporcem a halapartnami, vpravo dva vztyčené kyje či zahnuté hole; 3. pochodující pikenýři se sklopenými píkami a praporcem uprostřed; 4. pěší houf se zbraněmi na rameni, v jehož čele jede velitel na koni.
- typ: odstavec
  de: |-
    Dise hernachuolgende vnd geschriebene Verzeichnussen sollen wie die hieuorn getruckten Figurn verstanden vnd gebraucht werden/ der vrsachen/ Damit die vnuerstendigen vnd die Jugent daß desto baß verstehn künden/ Auch wann einer die Figurn nicht hett/ so kan ers auff Karten wie volgt verzeichnen/ dann es eben so wol in schriefften als Figurn mag gestelt werden/ Aber zu vnsern zeiten schwerlich in derer Obersten namen so jetzund leben zu bringen/ dann es wil ein jeder vber den andern sein/ wie vorn gemelt. Darumb ich der von Cartago wider die Römer Veldöbersten hieher nach gesetzt/ vnd jedem ein Ampt/ wie wir sie jetzund zu vnsern zeiten brauchen/ zu geordnet/ deßgleichen der Römer Veldöbersten/ als ein gegen theil/ wie dann ein jeglicher solchs augenscheinlich hernach sehen wirt/ dann meniglich bewust daß sie solch ampter nit haben/ etc.
  cs: |-
    Tyto následující psané soupisy {Verzeichnussen} se mají chápat a užívat stejně jako předtím vytištěná vyobrazení, a to proto, aby tomu nezkušení a mládež mohli tím lépe porozumět. Kdyby také někdo vyobrazení neměl, může si to zapsat na karty, jak následuje, neboť to lze sestavit stejně dobře písmem jako vyobrazeními. V naší době je však obtížné provést to se jmény plukovníků {Obersten}, kteří nyní žijí, protože každý chce být nad druhým, jak bylo řečeno výše. Proto jsem sem dále uvedl polní plukovníky {Veldöbersten} Kartága proti Římanům a každému jsem přidělil úřad {Ampt}, jak je dnes v naší době užíváme; stejně tak polní plukovníky Římanů jako protistranu, jak to každý dále názorně uvidí. Všem je totiž známo, že takové úřady neměli atd.[^1]
poznamky:
- n: 1
  text: |-
    Celý textový odstavec je v exempláři BSB vytištěn na samostatném lístku a vlepen pod karty (patrné okraje). Kustoda pod ním (*Hanni-*) ohlašuje první textovou kartu na [[7-006r|následující straně]] („Hannibal Oberster Kriegsherr…“).
