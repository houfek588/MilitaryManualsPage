poznamky:
- n: 1
  text: |-
    Dutá míra (korec ztotožněný s achtelem) o váze 144 liber ovsa, dělená na 12 měřic po 12 librách. „gennt“ je zkrácená tisková podoba slova „genennt“ (nazýván).
- n: 2
  text: |-
    Chyba tisku shodná s Druhou knihou ([[041v|list 41v]]): 1000 měřic je 83 korců a 4 měřice, nikoli 33.
- n: 3
  text: |-
    Chyba tisku: 30 000 měřic je 2500 korců (Druhá kniha, [[041v|list 41v]], má správně „fünff vnd zwentzig hundert“).
- n: 4
  text: |-
    Chyba tisku: za 30 dní je to 150 000 měřic; následné údaje 18 000 centů, což je 12 500 korců odpovídají správné hodnotě.
