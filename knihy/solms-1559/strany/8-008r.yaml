bloky:
- typ: nadpis
  uroven: 3
  de: |-
    Nůn volgt die Füterung auff die Pferde / vnd ist einem jeden Pferdt einn tag vnd nacht ein Metzen Hafers / mit der es sich zimlicher notturfft leiden mag / vnd sonderlich in solcher tapffern anzal zůgerechnet.
  cs: |-
    Nyní následuje píce {Füterung} pro koně. Každému koni se na den a noc počítá jedna měřice {Metzen} ovsa, s níž v rozumné míře vystačí, a to zvláště při tak velkém počtu.
- typ: odstavec
  de: |-
    ES ist zu mercken (wie vorn gemelt) mit dem maß das im Brot bachen an allen orten vngleich ist / So hab ich ein Schäffel / das vor ein Achtel ist gennt worden / für mich genomen / vnd am gewicht geeicht / vnd ist 144 pfundt schwere / vnd helt noch 12 klein Metzen inn sich / der eine ist 12 pfundt schwere / deren ein Pferdt einn tag zimlich gnůg hat / Darauff ist dise nachuolgende Rechnung gestalt.
  cs: |-
    Je třeba poznamenat, jak již bylo řečeno, že míra, podle níž se peče chléb, je na všech místech nestejná. Vzal jsem si proto za základ jeden korec {Schäffel}, který byl dříve nazýván achtelem {Achtel}[^1], a ocejchoval jsem ho podle váhy. Váží 144 liber {pfundt} a obsahuje 12 malých měřic, z nichž každá váží 12 liber; té má kůň na den zhruba dost. Na tom je postaven následující výpočet.
- typ: odstavec
  de: |-
    Erstlich auff 100 pferde gehn ein tag 100 Metzen hafern / die thůn 1200 pfundt / vnd machen 8 Schäffel vnd 4 Metzen.
  cs: |-
    Předně na 100 koní připadá za den 100 měřic ovsa; to činí 1200 liber a dělá 8 korců a 4 měřice.
- typ: odstavec
  de: |-
    Ein woche gehn auff 100 pferde 700 metzen / thůn an gewicht 84 Centner / vnd 58 schäffel 4 metzen.
  cs: |-
    Za týden připadá na 100 koní 700 měřic; to činí na váhu 84 centů {Centner}, což je 58 korců a 4 měřice.
- typ: odstavec
  de: |-
    Ein Monat gehen auff 100 pferdt 3000 metzen / thůn an gewicht 360 Centner / vnd 250 schäffel.
  cs: |-
    Za měsíc připadá na 100 koní 3000 měřic; to činí na váhu 360 centů, což je 250 korců.
- typ: odstavec
  de: |-
    Item auff 500 Pferdt gehen ein tag 500 metzen / thůn an gewicht 60 Centner / vnd 41 schäffel 8 metzen.
  cs: |-
    Dále na 500 koní připadá za den 500 měřic; to činí na váhu 60 centů, což je 41 korců a 8 měřic.
- typ: odstavec
  de: |-
    Ein Woch gehn auff 500 pferdt 3500 metzen / thůn an gewicht 420 Centner / vnd 291 schäffel 8 metzen.
  cs: |-
    Za týden připadá na 500 koní 3500 měřic; to činí na váhu 420 centů, což je 291 korců a 8 měřic.
- typ: odstavec
  de: |-
    Ein Monat gehen auff 500 pferdt 15000 metzen / thůn an gewicht 1800 Centner / vnd 1250 Achtel.
  cs: |-
    Za měsíc připadá na 500 koní 15 000 měřic; to činí na váhu 1800 centů, což je 1250 achtelů.
- typ: odstavec
  de: |-
    Item ein tag gehn auff 1000 pferdt 1000 metzen / thůn an gewicht 120 Centner / vnd 33 schäffel 4 metzen hafern.
  cs: |-
    Dále za den připadá na 1000 koní 1000 měřic; to činí na váhu 120 centů, což je 33 korců[^2] a 4 měřice ovsa.
- typ: odstavec
  de: |-
    Ein Woch gehn auff 1000 pferdt 7000 metzen / thůn an gewicht 840 Centner / vnd 583 schäffel 4 metzen hafern.
  cs: |-
    Za týden připadá na 1000 koní 7000 měřic; to činí na váhu 840 centů, což je 583 korců a 4 měřice ovsa.
- typ: odstavec
  de: |-
    Ein Monat lang gehen auff 1000 pferdt 30000 metzen / thůn an gewicht 3600 Centner / vnd 1500 schäffel hafern.
  cs: |-
    Za celý měsíc připadá na 1000 koní 30 000 měřic; to činí na váhu 3600 centů, což je 1500 korců[^3] ovsa.
- typ: odstavec
  de: |-
    Item ein tag gehn auff 5000 pferdt 5000 metzen hafern / thůn an gewicht 600 Centner / vnd 416 schäffel vnd 8 metzen hafern.
  cs: |-
    Dále za den připadá na 5000 koní 5000 měřic ovsa; to činí na váhu 600 centů, což je 416 korců a 8 měřic ovsa.
- typ: odstavec
  de: |-
