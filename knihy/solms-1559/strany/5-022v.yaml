    Celostránkový dřevořez na výšku k [[5-023r|šestému srubu]]: malý půlkruhový rondel mezi dvěma dlouhými přímými šancemi, které vedou k sousedním srubům; ze svahu valu trčí husté šikmé kůly (palisáda, *Stocket*). Uvnitř dvě děla s puškaři. U vstupu rytá délková míra s nápisem „Maßstab 20 schůe“ (měřítko 20 střevíců), vpravo nahoře drobná značka (snad číslice).
