  popis: |-
    Celostránkový dřevořez natočený o 90° na šířku, s rytým měřítkem podél vstupního průchodu vlevo nadepsaným „Maßstab 20 schůe“ („Měřítko 20 střevíců“) a drobnou zrcadlovou značkou číslice („23“ / „32“?) vpravo nahoře: polokruhová bašta (rondel) s hrubými dřevěnými kůly (*Stocket*) šikmo trčícími ze svahu valů před střílnami, se dvěma lomenými krytými křídly vlevo a dvěma děly na vnitřním dvoře s obsluhujícími puškaři.
