  popis: |-
    Celostránkový dřevořez jezdce (vrchního velitele) v plné plátové zbroji na kráčejícím koni v pravostranném profilu, vsazený do obdélného rámečku s půlkruhovým obloukem a bohatými rostlinnými arabeskami v horních cviklech; vlevo dole signatura s letopočtem „1545 HD“ (Hans Döring). Vousatý jezdec má na hlavě přilbu se širokou krempou a vysokým chocholem z pštrosích per, kroužkové rukávy pod plátovou zbrojí s kruhovými náramenními terčíky a šorcem, u levého boku meč v ozdobné pochvě, u přední rozsochy sedla poboční zbraň s hlavicí a v pravé ruce drží šikmo vzhůru dlouhý jezdecký dřevec s kopinatým hrotem a střapcem. Kůň nese plátový čelník s rozetou, zdobně vyšívaný poprsník se střapci a tmavou routovanou čabraku na zádi. V pozadí hornatá krajina s řekou či jezerem, opevněným městem, hradem na vrchu a kupovitými mraky.
