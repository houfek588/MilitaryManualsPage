list: 16 (4. kniha)
strana: recto
sken: 419
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    DIe ander Figur zeigt an ein Rat das gewandt ist daß mann auff einer seiten oben auff die Schien sicht wie es beschlagen ist/ auff der andern seiten sicht mann inwendig in das Rat wie die fellung inwendig mit kurtzen schien beschlagen sind/ wie die Nietnägel durch gehn/ die aussen vnd einwendigen schien zu gleich begreiffen/ vnnd zusamen mit dem niet gezogen sind/ deßgleichen sicht mann die Speychen auch inwendig auff der seiten/ vnd wie sie eingesatzt seind in die Felligen. So sicht mann auch wie die Naben mit eisen Ringen gebunden sind.
  cs: |-
    Druhá figura ukazuje kolo pootočené tak, že na jedné straně shora jest vidět na šínu, jak jest kolo okováno; na druhé straně pak jest vidět dovnitř kola, jak jsou loukotě uvnitř pobity krátkými šínami a jak skrz ně procházejí nýtovací hřeby, jež zároveň svírají vnější i vnitřní šíny a jsou nýtováním staženy k sobě. Stejně tak jsou vidět i paprsky z vnitřní strany a jak jsou zasazeny do loukotí; rovněž jest patrno, jak jest náboj stáhnut železnými kruhy.
- typ: odstavec
  de: |-
    Weiter ist noch ein Rat daß mann gar gerad seitlingen ansicht/ wie sehr das gestürtzet oder auffgesatzt ist/ deßgleichen wie die Speychen oben durch die Felgen gehn/ geuierdt vnd nit rondt sind/ solchs geuierdt einsetzen ist starck/ vnd ist die vierung vberlengt dem holtz der Felgen nach/ das die Felgen vber zwerg starck bleiben/ vnnd sich nit winden kan.
  cs: |-
    Dále jest zde ještě jedno kolo zobrazené zcela zpříma z boku, aby bylo vidět, nakolik jest podseknuto (vyklenuto) a nasazeno, jakož i jak paprsky nahoře procházejí skrz loukotě – totiž čtyřhranně, a nikoli kulatě. Takové čtyřhranné zapuštění jest pevné a čtyřhran jest prodloužen podél dřeva loukotě, takže loukotě zůstávají napříč pevné a nemohou se kroutit.
- typ: odstavec
  de: |-
    Deßgleichen ist ein ledige Speyche da verzeichnet/ daran mann sehen kan wie die abgestempt ist/ daß mann sie darnach machen soll.
  cs: |-
    Stejně tak jest tam vyobrazen samostatný paprsek, na němž lze vidět, jak jest osazen, aby se podle něj paprsky zhotovovaly.
- typ: odstavec
  de: |-
    Zum andern ist ein lang schien verzeichnet die an beiden orten auffgeworffen sein soll.
  cs: |-
    Zadruhé jest vyobrazena dlouhá šína, jež má být na obou koncích vyhnutá.
- typ: odstavec
  de: |-
    Zum dritten ist ein kurtze schien verzeichnet die inwendig inn das Rat gehört zwischen die speychen.
  cs: |-
    Zatřetí jest vyobrazena krátká šína, jež náleží dovnitř kola mezi paprsky.
- typ: odstavec
  de: |-
    Zum vierdten sind die negel auch angezeigt/ daß sie rondt vnd nit dick sein sollen/ sonder ein dicke haben biß vorn auff eines Daumen brett/ damit sie gern fassen mögen/ souil durch die beide schien auß vnd inwendig zu gleich gehn vnd geniet sollen werden/ die andern macht mann spitzig wie sonst Ratnägel/ aber doch gleich köpffig.
  cs: |-
    Začtvrté jsou ukázány též hřeby: ty mají být kulaté a nepříliš silné, nýbrž stejné tloušťky až do šířky palce od špičky, aby se dobře uchytily, pokud procházejí oběma šínami zvenčí i zevnitř zároveň a mají se snýtovat; ostatní se dělají špičaté jako běžné kolové hřeby, avšak se stejně tvarovanými hlavičkami.
