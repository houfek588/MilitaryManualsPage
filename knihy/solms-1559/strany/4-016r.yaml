stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    DIe ander Figur zeigt an ein Rat das gewandt ist daß mann auff einer seiten oben auff die Schien sicht wie es beschlagen ist/ auff der andern seiten sicht mann inwendig in das Rat wie die fellung inwendig mit kurtzen schien beschlagen sind/ wie die Nietnägel durch gehn/ die aussen vnd einwendigen schien zu gleich begreiffen/ vnnd zusamen mit dem niet gezogen sind/ deßgleichen sicht mann die Speychen auch inwendig auff der seiten/ vnd wie sie eingesatzt seind in die Felligen. So sicht mann auch wie die Naben mit eisen Ringen gebunden sind.
  cs: |-
    Druhá figura ukazuje kolo natočené tak, že na jedné straně je shora vidět na šínu, jak je kolo okované; na druhé straně je vidět dovnitř kola, jak jsou loukotě zevnitř pobity krátkými šínami a jak skrz ně procházejí nýtovací hřeby, které zároveň svírají vnější i vnitřní šíny a jsou nýtem staženy k sobě. Stejně tak jsou vidět paprsky z vnitřní strany a jak jsou zasazeny do loukotí. Je také vidět, jak je náboj stažen železnými kruhy.
- typ: odstavec
  de: |-
    Weiter ist noch ein Rat daß mann gar gerad seitlingen ansicht/ wie sehr das gestürtzet oder auffgesatzt ist/ deßgleichen wie die Speychen oben durch die Felgen gehn/ geuierdt vnd nit rondt sind/ solchs geuierdt einsetzen ist starck/ vnd ist die vierung vberlengt dem holtz der Felgen nach/ das die Felgen vber zwerg starck bleiben/ vnnd sich nit winden kan.
  cs: |-
    Dále je tu ještě jedno kolo, na které se hledí přímo z boku, aby bylo vidět, nakolik je podseknuté (vyklenuté) neboli nasazené, a také jak paprsky nahoře procházejí loukotěmi – čtyřhranné, a ne kulaté. Takové čtyřhranné zapuštění je pevné; čtyřhran je přitom protažen podél dřeva loukotě, takže loukotě zůstávají napříč pevné a nemohou se kroutit.
- typ: odstavec
  de: |-
    Deßgleichen ist ein ledige Speyche da verzeichnet/ daran mann sehen kan wie die abgestempt ist/ daß mann sie darnach machen soll.
  cs: |-
    Stejně tak je tam vyobrazen samostatný paprsek, na němž je vidět, jak je osazen, aby se podle něj paprsky dělaly.
- typ: odstavec
  de: |-
    Zum andern ist ein lang schien verzeichnet die an beiden orten auffgeworffen sein soll.
  cs: |-
    Zadruhé je vyobrazena dlouhá šína, která má mít oba konce vyhnuté.
- typ: odstavec
  de: |-
    Zum dritten ist ein kurtze schien verzeichnet die inwendig inn das Rat gehört zwischen die speychen.
  cs: |-
    Zatřetí je vyobrazena krátká šína, která patří dovnitř kola mezi paprsky.
- typ: odstavec
  de: |-
    Zum vierdten sind die negel auch angezeigt/ daß sie rondt vnd nit dick sein sollen/ sonder ein dicke haben biß vorn auff eines Daumen brett/ damit sie gern fassen mögen/ souil durch die beide schien auß vnd inwendig zu gleich gehn vnd geniet sollen werden/ die andern macht mann spitzig wie sonst Ratnägel/ aber doch gleich köpffig.
  cs: |-
    Začtvrté jsou ukázány také hřeby: mají být kulaté a ne silné, nýbrž mají mít [stejnou] tloušťku až po šířku palce od špičky, aby dobře držely – ty, které procházejí oběma šínami zvenku i zevnitř a mají se snýtovat. Ostatní se dělají špičaté jako obyčejné kolové hřeby, avšak se stejnými hlavičkami.
