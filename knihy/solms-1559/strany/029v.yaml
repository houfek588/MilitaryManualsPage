bloky:
- typ: odstavec
  de: |-
    Wann dann der Zeugmeister die gemelt verzeichnuß / dem Kriegs Herren oder obersten Feldhaupman vbergibt / solle darüber der Herr oder Feldhauptman der Kriegsuerstendigen Rath pflegen / wann die verstendigen dann durch sich selbst oder andere deßhalben verzeichnuß befinden / daß jm der Zeugmeister mit leuten / Rossen / Wagen / Besoldung / oder in andere weg zuuil gethan hett / solle jhm der Herr oder Oberst einreden / die hohe beschwerlich Besoldung / vnd andere vberflüß / abbrechen vnd ringern / doch soll der abbruch der Besoldung halben / mehr dann von wegen der Leut / Roß oder Wägen geschehen / angesehen / das alle tag etwas daran abgeht.
  cs: |-
    Když pak zbrojmistr {Zeugmeister} předá zmíněný soupis válečnému pánu {Kriegs Herren} nebo nejvyššímu polnímu hejtmanovi {obersten Feldhaupman}, má se o něm pán nebo polní hejtman poradit se znalci válečnictví {Kriegsuerstendigen}. Zjistí-li pak znalci sami nebo prostřednictvím jiných ze soupisu, že zbrojmistr přehnal počet lidí, koní a vozů, žold {Besoldung} nebo něco jiného, má mu to pán nebo plukovník {Oberst} vytknout a vysoký, tíživý žold i jiné přebytky zkrátit a snížit. Krátit se však má spíše na žoldu než na lidech, koních či vozech, protože z nich každý den něco ubývá.
- typ: odstavec
  de: |-
    Der Zeugmeister soll die Artlerei tag vnnd nacht gar fleissig verwaren vnd verschantzen / auch am zuge das Puluer wol verwaren lassen / damit jm dasselbig nicht angezündet / vnnd die Artlerei dardurch beschediget oder gar zerissen werde.
  cs: |-
    Zbrojmistr má dělostřelectvo {Artlerei} dnem i nocí velmi pečlivě střežit a opevňovat šancemi {verschantzen} a na pochodu {zuge} nechat dobře opatrovat střelný prach {Puluer}, aby mu ho nikdo nezapálil a dělostřelectvo tím nepoškodil nebo docela nerozmetal.
- typ: odstavec
  de: |-
    Der Oberst Feldhauptman soll dem Zeugmeister alle seiner Artlerei es seien Leut / Roß oder Wägen selbst mustern / oder solches gar einem hierinn verstendig zuthůn beuelhen / vnd wiewol etlich Zeugmeister vermeinen / mann soll jnen die bezalung vngemustert zustellen / vnd soll es doch kein herr mit nichte nachgeben / die grosse gefehrlichkeit zuuerhüten.
  cs: |-
    Nejvyšší polní hejtman má u zbrojmistra celé jeho dělostřelectvo – lidi, koně i vozy – sám přehlédnout {mustern}, anebo to svěřit někomu, kdo tomu rozumí. Ačkoli se někteří zbrojmistři domnívají, že se jim má výplata vydat bez přehlídky {vngemustert}, žádný pán to nemá v žádném případě připustit, aby se předešlo velkému nebezpečí [podvodu].
- typ: odstavec
  de: |-
    Wann dann der Zeugmeister mit seinem Volck / als nemlich leutenant / Schreiber / Büchsenmeistern / Prouosen / Steckenknecht / Geschirrmeister / Trabanten / Wagen leut / Quasitorn derselben verwalter allen Rossen vnd Wagen gemustert ist / sol jm der Zallmeister / das gelt auff sein verwaltung antworten / der soll dann sein Volck selbst bezalen.
  cs: |-
    Když je zbrojmistr se svým lidem {Volck}, totiž s poručíkem {leutenant}, písařem {Schreiber}, puškaři {Büchsenmeistern}, profousem {Prouosen}, profousovými pacholky {Steckenknecht}, vozmistry {Geschirrmeister}, drabanty {Trabanten}, vozky {Wagen leut}, šancíři {Quasitorn} a jejich správci a se všemi koňmi a vozy, přehlédnut, má mu platebník {Zallmeister} odevzdat peníze do jeho správy; zbrojmistr pak má svůj lid vyplatit sám.
- typ: odstavec
  de: |-
    Der Zeugmeister soll sein eigen Schmidten / Schmidt / Zimmerleut / Wägen / vnd was weitter notwendig ist / haben.
  cs: |-
    Zbrojmistr má mít své vlastní kovárny, kováře, tesaře, vozy a vše ostatní, čeho je zapotřebí.
- typ: odstavec
  de: |-
    Der Zeugmeister hat mit allen seinen verwanden gar kein bestimpte besoldung / dann wie mann mit jm vnd allen seinen zugehörenden jeder zeit vberkompt / deßgleichen hat er auch kein anzall Trabanten dann wie mann sich mit jm vergleicht.
  cs: |-
    Zbrojmistr ani nikdo z jeho lidí nemá pevně stanovený žold, nýbrž takový, na jakém se s ním a se všemi jeho lidmi pokaždé dohodnou; stejně tak nemá ani pevný počet drabantů, nýbrž tolik, kolik se s ním ujedná.
