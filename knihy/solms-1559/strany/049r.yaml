bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    thůn lassen / damit er verursacht wert / dem also zuthůn vnd nachzukommen / das hat er dann den Hauptleuten zuweisen / vnd desto baß fug darauff mit ernst zusehen / vnd weiß er was er für personen hat seinen Herrn das zu berichten / alßdann so weiß der Herr sein feld darauff zubestellen / vnd in der Musterung sich desto baß zuhalten / dann solt einer inn der Musterung kommen / vnnd mehr anzeigen dann er vor hat darthůn künden / so ist er darumb zubereden vnd zu rechtfertigen.
  cs: |-
    dát složit, aby byl veden k tomu, takto jednat a tím se řídit; pak to může ukázat hejtmanům {Hauptleuten} a má tím lepší důvod na to přísně dohlížet. Také ví, jaké má pod sebou lidi, aby to mohl hlásit svému pánovi; podle toho pak pán ví, jak má uspořádat své pole, a při přehlídce {Musterung} si tím lépe počínat. Neboť kdyby se někdo dostavil k přehlídce a vykázal více [jezdců], než kolik jich mohl doložit dříve, má být za to pokárán a pohnán k odpovědnosti.
- typ: odstavec
  de: |-
    Darumb so bedunckt mich / es sei einem Kriegßherren an einem sollichen Reutter Obersten vil gelegen / der geschickt vnnd trew ist / so der Reutter vil sein wirdt / vnd es soll einem Herrn fast zutragen / berichtlich vnd nützlich sein / mann gebe jm was mann wöll / ist alles behalten / wann er es trewlich versicht.
  cs: |-
    Proto se domnívám, že válečnému pánovi {Kriegßherren} na takovém nejvyšším veliteli jízdy {Reutter Obersten}, který je schopný a věrný, velice záleží, bude-li jezdců {Reutter} mnoho; a pánovi to přinese velký užitek, dobrý přehled a prospěch. Ať se mu dá cokoli, vše se vyplatí, pokud svůj úřad zastává věrně.
