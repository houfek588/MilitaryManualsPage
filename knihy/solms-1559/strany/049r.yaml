stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    thůn lassen / damit er verursacht wert / dem also zuthůn vnd nachzukommen / das hat er dann den Hauptleuten zuweisen / vnd desto baß fug darauff mit ernst zusehen / vnd weiß er was er für personen hat seinen Herrn das zu berichten / alßdann so weiß der Herr sein feld darauff zubestellen / vnd in der Musterung sich desto baß zuhalten / dann solt einer inn der Musterung kommen / vnnd mehr anzeigen dann er vor hat darthůn künden / so ist er darumb zubereden vnd zu rechtfertigen.
  cs: |-
    složit přísežný závazek {pflicht}, aby byl veden k tomu, že tak bude jednat a tím se řídit. To pak může ukázat hejtmanům {Hauptleuten} a má tím pádnější důvod na to přísně dohlížet. Ví také, jaké lidi má, a může o tom podat zprávu svému pánovi; pán pak ví, jak podle toho zařídit své tažení a jak si tím lépe počínat při přehlídce {Musterung}. Kdyby totiž někdo přišel k přehlídce a vykázal víc [jezdců], než kolik jich dříve dokázal doložit, má být za to pokárán a pohnán k odpovědnosti.
- typ: odstavec
  de: |-
    Darumb so bedunckt mich / es sei einem Kriegßherren an einem sollichen Reutter Obersten vil gelegen / der geschickt vnnd trew ist / so der Reutter vil sein wirdt / vnd es soll einem Herrn fast zutragen / berichtlich vnd nützlich sein / mann gebe jm was mann wöll / ist alles behalten / wann er es trewlich versicht.
  cs: |-
    Proto se domnívám, že válečnému pánovi {Kriegßherren} na takovém schopném a věrném plukovníkovi {Obersten} jízdy {Reutter} velice záleží, bude-li jezdců mnoho. Pánovi to přinese velký užitek, dobrý přehled a prospěch; ať se mu dá cokoli, vše se vyplatí, pokud svůj úřad zastává věrně.
