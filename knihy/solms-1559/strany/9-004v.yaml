bloky:
- typ: odstavec
  de: |-
    Nachuolgents wann jr ewer Armat vnd Rüstung zugerüst vnd besetzt mit Amptern/ Hauptleuten/ Kriegßuolck/ Geschütz vnd ander dingen darzů gehörig/ solt jr in ewern Rath samblen/ nemlich ewer Amptleut/ Hauptleut vnd andere/ mit jnen berathschlagen/ was jhr für Edict/ bot vnd Artickelßbriff wolt außgehn lassen/ nit allein daß jr ewer heer in einer Ordnung behalt/ sonder auch von des gemeinen nutz wegen/ vnd wann jr euch derselbigen Artickelßbriff vnd botten vergleicht/ solt jr solche ewerm Marschalck geben/ darmit er es vnder ewrem gantzen Heer verkünden laß/ auff souil Spraachen als viler Nation Leut jr habt/ damit keiner sich entschuldigen mög/ er hab es nit verstanden/ vnd wann sie verlesen/ dann laßt es verbieten bei verlierung leib vnd gůts das keiner dieselbige vbergehe/ so sie aber verechtlich veracht vnnd vbertretten würden/ solt jhr strenge Justitiam halten/ weder gab noch zeit ansehen/ wann jr solchs nit thůt/ kündt jr kein gehorsam Heer haben/ vnd wann jr einem nachließt/ würde es ein anderer auch an euch begeren/ wann jhr dann von eins wegen mehr dann des andern thůt/ hetten sie vrsach euch feindt zu werden/ vnd wann jr nit gleichförmig richtet/ wirt euch Gott voran vnd die Welt straffen/ dann jr gesatz vnd bott vber das leben wol möcht machen von des gantzen Heers vnd gemeins nutzen wegen/ Vnd wann jr nit personlich in dem Feld seit/ bedünckt mich gůt sein/ daß jhr ewerm Leutenant beuelch gebt/ daß er ewern Hauptleuten bei dem eydt einbinde/ daß sie solchen beuelch in allen seinen puncten vnd Artickeln halten/ welchem beuelch zuuolgen mich gantz gůt bedünckt/ dann so sie es verheissen vnd nicht halten/ hat ein Oberster desto besser fug sie zu straffen/ künden sie auch desto weniger mißfallen daran haben.
  cs: |-
    Potom, když jste své vojsko {Armat} a výzbroj připravil a obsadil úřady {Amptern}, hejtmany, válečným lidem {Kriegßuolck}, děly a jinými věcmi, které k tomu patří, máte svolat svou radu, totiž své úředníky {Amptleut}, hejtmany {Hauptleut} a jiné, a poradit se s nimi, jaké edikty, příkazy a artikulní listy {Artickelßbriff} chcete vydat – nejen abyste své vojsko udržel v pořádku, ale také pro obecný prospěch. A když se na těchto artikulních listech a příkazech shodnete, máte je dát svému polnímu maršálkovi {Marschalck}, aby je dal vyhlásit v celém vašem vojsku v tolika jazycích, z kolika národů máte lid, aby se nikdo nemohl vymlouvat, že tomu nerozuměl. A když budou přečteny, dejte pod ztrátou hrdla a statku zakázat, aby je kdokoli přestoupil. Kdyby jimi však někdo opovržlivě pohrdl a přestoupil je, máte zachovávat přísnou spravedlnost {Justitiam} a nehledět ani na dary, ani na čas.[^1] Neučiníte-li to, nebudete mít poslušné vojsko. Prominete-li jednomu, bude to od vás žádat i jiný; a učiníte-li pro jednoho víc než pro druhého, měli by příčinu stát se vašimi nepřáteli. A nebudete-li soudit všem stejně, potrestá vás především Bůh, a potom svět; vždyť pro prospěch celého vojska a pro obecné dobro můžete vydávat zákony a příkazy i nad životem. Nebudete-li osobně v poli, zdá se mi dobré, abyste svému poručíkovi {Leutenant} dal rozkaz, aby vaše hejtmany zavázal přísahou {eydt}, že budou tento rozkaz dodržovat ve všech jeho bodech a článcích {Artickeln}. Řídit se takovým rozkazem se mi zdá velmi dobré: pokud to totiž slíbí a nedodrží, má vrchní velitel {Oberster} o to lepší důvod je potrestat a oni s tím mohou být o to méně nespokojeni.
- typ: odstavec
  de: |-
    Ich schreib das nicht daß ich wiste wie sich ein Oberster Feldauptman halten soll/ dann ich nicht vil darbei gewesen/ da sie jre Ampter gebraucht/ wann ich aber euch etwas daruon schreiben solt/ müst ich erst vil Bücher lesen/ das ich nicht thůn hab wöllen/ dann ich solchs Bůch on alle hilff anderer Bücher allein auß meinem kopff gemacht hab/ Darumb wann etwas darinn vergessen/ solt jr es mir desto ehe verzeihen/ doch hab ich souil ein oberster Feldhauptman gewalt soll haben/ vber alles in dem gantzen Heer/ eben so wol vber des Marschalcks als vber die andern Ampter/ deßgleichen auch vber alle Stet vnd Festungen/ vber alle Hauffen/ vnnd wo es von nöten were da man Hauptleut solt verordnen/ vnd desselbigen beuelch soll mann fleissig nachkommen/ als ewer person selbst/ vnd wann jr nicht im Feld seit soll er an ewer stat sein/ wann jr aber personlich im feld seit vnnd einen obersten Feldhauptman hett/ soll er nicht desto weniger allen
  cs: |-
    Nepíšu to proto, že bych věděl, jak se má chovat nejvyšší polní hejtman {Oberster Feldauptman},[^2] neboť jsem nebýval často při tom, když [nejvyšší polní hejtmani] vykonávali své úřady. Kdybych vám o tom měl něco napsat, musel bych nejprve přečíst mnoho knih, a to jsem nechtěl, neboť jsem tuto knihu sestavil bez jakékoli pomoci jiných knih, jen ze své hlavy. Bude-li v ní tedy něco opomenuto, máte mi to tím spíše prominout. Tolik však [vím], že nejvyšší polní hejtman má mít moc nade vším v celém vojsku, právě tak nad úřadem polního maršálka jako nad ostatními úřady, stejně tak nade všemi městy a pevnostmi {Festungen}, nade všemi houfy {Hauffen} a [všude], kde by bylo třeba ustanovit hejtmany. Jeho rozkazům se má pilně vyhovět, jako by šlo o vás samého; a když nejste v poli, má být na vašem místě. Jste-li však v poli osobně a máte nejvyššího polního hejtmana, má přesto mít veškerou
poznamky:
- n: 1
  text: |-
    *weder gab noch zeit ansehen* – „nehledět na dary ani na čas“; *zeit* je zde nejasné (snad tisková chyba), překládáno doslova.
- n: 2
  text: |-
    Tisk *Feldauptman* (bez *h*); o několik řádků níže správně *Feldhauptman*.
