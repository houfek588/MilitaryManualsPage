bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Feldhauptmanschafft oder nicht/ soll er mit gůten leuten/ für sein person/ ein Ordnung im Leger anschlagen/ stürmen tag vnd nacht/ wol verwart/ besetzen/ versehe vnd verwacht werden.
  cs: |-
    polní hejtmanství {Feldhauptmanschafft}, nebo ne, má pro svou osobu s dobrými lidmi zavést v ležení {Leger} pořádek, aby bylo ve dne i v noci a i při útocích dobře zajištěno, obsazeno, opatřeno a střeženo.
- typ: odstavec
  de: |-
    Wann ein Stat/ Schloß oder befestigung auffgegeben wirt/ es geschehe daß die Kriegsleut/ so in der Besatzung legen/ mit jrer hab abziehen/ oder sich in ritterlich gefengnuß in gnad vnd vngnad ergeben/ so ist Prouiant/ vnd alle farene Habe/ die der Feinde gewesen/ sampt allen Gefangnen so sich/ wie gemelt/ in Gefengnuß ergeben hetten/ des Kriegsherrn/ allein außgenommen etliche Gerechtigkeiten/ so dem obersten Feldhauptman/ Feldmargschalck/ vnd anderen hohen ämptern zugehört/ daruon hernach anzeigung soll geschehen.
  cs: |-
    Vzdá-li se město, hrad nebo opevnění, ať už tak, že válečníci {Kriegsleut}, kteří v něm leželi jako posádka {Besatzung}, odtáhnou se svým majetkem, nebo že se vydají do rytířského zajetí na milost a nemilost, připadá proviant {Prouiant} a veškerý movitý majetek, který patřil nepřátelům, spolu se všemi zajatci, kteří se takto vydali do zajetí, válečnému pánovi {Kriegsherrn}. Vyjmuta jsou jen některá práva, jež náležejí nejvyššímu polnímu hejtmanovi {obersten Feldhauptman}, polnímu maršálkovi {Feldmargschalck} a dalším vysokým úřadům; o nich bude řeč dále.
- typ: odstavec
  de: |-
    So aber ein Kriegsherr/ die oberst Feldhauptmanschafft selbst verwaltet/ dann hat er ein obersten Leutenant/ derselb soll billicher zum Krieg geschickter sein/ dann eines andern obersten Feldhauptmans Leutenant/ ob gleich der Fürst des Kriegs auch erfarn/ geschickt vnd geübt ist/ angesehen daß mann eines Fürsten person/ sonderlich des Kriegsherrn hochrichten/ vnd mit nicht leidlich mit besichtigung der Feind vnnd Flecken die belegert werden sollen/ mit besehung der Schantzen/ vnd in alle andere weg/ on bewegliche vrsach inn gefehrlicheit setzen noch stellen soll/ dann wan ein Kriegsherr oder oberster Feldhauptman im feld nider ligt/ oder am leib schaden empfecht/ ist es beschwerlich/ vnd allem Kriegsuolck erschrecklich/ als die Kriegs erfarnen wol wissen/ auch andere leichtlich ermessen mögen.
  cs: |-
    Spravuje-li však válečný pán nejvyšší polní hejtmanství sám, má nejvyššího poručíka {obersten Leutenant}. Ten má být po právu ve válce zběhlejší než poručík jiného nejvyššího polního hejtmana, i kdyby byl sám kníže, který vede válku, zkušený, obratný a vycvičený. Osoby knížete, a zvláště válečného pána, je si totiž třeba vysoce vážit a bez závažného důvodu ji nikterak lehkomyslně[^1] nevystavovat nebezpečí při obhlížení nepřátel a měst, jež se mají obléhat, při prohlídce šancí {Schantzen} ani jakkoli jinak. Padne-li totiž v poli válečný pán nebo nejvyšší polní hejtman či utrpí-li zranění, je to těžká rána a pro veškerý válečný lid {Kriegsuolck} věc děsivá, jak dobře vědí ti, kdo mají válečné zkušenosti, a jak si i jiní mohou snadno domyslet.
- typ: odstavec
  de: |-
    Ein jeder Fürst sei gewarnet/ der einem anderen mit macht inn sein Land ziehen wil/ daß er sich mit demselben nit schlag/ ob er schon wol mit Kriegsuolck zu roß vnd fuß gefast ist/ er soll sich dem Feind für in einen vortheil legen/ es sei im feld oder bei einem Flecken/ daß er dem gegentheil den gewaltigen auch die strauffzüge in seinem lande weren möge/ auch wo er die Prouiant vnd fütterung/ dem Feind nit entfüren oder flöhen mag/ soll ers verderben oder verbrennen/ angesehen daß es vil besser ist verderbt/ dann daß sich die Feind darmit speisen/ fůtern vnd vnderhalten/ vnd welcher seinen Feinden/ wie gehört/ den eingang in sein land verhielt/ der zwingt sie zum abzug/ oder daß sie jhn in seinem vortheil angreiffen/ vnd darinnen stürmen vnd schlagen müssen/ sonst wann ein Herr leichtlich schlüge/ vnd die schlacht verlüre/ so were das Land auch verloren/ etc.
  cs: |-
    Každý kníže, do jehož země chce jiný vtrhnout s vojskem, buď varován, aby se s ním nepouštěl do bitvy, i kdyby byl dobře vybaven válečným lidem na koni i pěšky. Má se před nepřítelem usadit na výhodném místě, ať v poli, nebo u nějakého města, aby mohl protivníkovi ve své zemi bránit v tažení hlavní síly i v nájezdech. Kde by nepříteli nemohl proviant a píci odvézt nebo je ukrýt, má je zničit nebo spálit, neboť je mnohem lépe je zničit, než aby se jimi nepřátelé živili, krmili koně a vydržovali. Kdo takto, jak bylo řečeno, zabrání nepřátelům ve vstupu do své země, donutí je buď k odtažení, nebo k tomu, aby na něj zaútočili v jeho výhodném postavení a museli ho tam ztéci a bít se s ním. Kdyby se naopak pán lehkovážně pustil do bitvy a prohrál ji, byla by ztracena i země atd.
- typ: odstavec
  de: |-
    Es möchte sich aber ein Kriegsuolck/ so ins land ziehen wolt/ eim zug oder in jrem Leger also vnordenlich vnd verächtlich halten/ ein Herr versüchte billich etwas/ doch soll der Herr die sach mit seinen Kriegs verstendigen wol vnd nottürfftig erwegen.
  cs: |-
    Mohlo by se ovšem stát, že by se válečný lid, který chce vtrhnout do země, choval na pochodu nebo ve svém ležení tak nepořádně a lehkovážně, že by pán právem mohl něco podniknout. Přesto má pán věc dobře a důkladně uvážit se svými znalci válečnictví {Kriegs verstendigen}.
poznamky:
- n: 1
  text: |-
    Tisk má spojení *mit nicht leidlich* (případně ve smyslu *nicht leichtlich*, „nikterak lehkomyslně / neúměrně“).
