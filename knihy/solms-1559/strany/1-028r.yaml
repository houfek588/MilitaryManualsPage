bloky:
- typ: odstavec
  de: |-
    Dieweil dann vnder den Commissarien auch mengel sein mögen / hab ich hie nach kürtz einen Artickel verzeichnet / vnd etliche notwendige mengel angezeigt.
  cs: |-
    Protože se i mezi komisaři {Commissarien} mohou vyskytnout nedostatky, sepsal jsem zde stručně jeden článek a poukázal na několik podstatných nedostatků.
- typ: odstavec
  de: |-
    Es hat sich inn kurtzer zeit ein new Regirung angefangen / als nemlich vnder den Kriegs Commissarien / daß ein grosses Ampt vnd versehung auff sich hat vnd ist / welches Ampts beuelch ich nicht alles verstehen kan / dann ich sehe daß dieselbigen ein theil sich aller kriegßsachen vndernemen / deßgleichen alle hohe Ampter des Krigs zu regieren vnderstehen / vnd wann dieselbigen Ampter schon mit ehrlichen Leuten / die solliches gebraucht / verstehen vnnd gern getrewlich handeln wöllen / versehen seind / so wöllen die obgemelten Kriegs Commissarien jnen maß darinn geben vnnd schaffen / gleich mit vngedult / als wann sie die obersten Feldherrn weren / Bedeucht mich es sei nicht gůt daß Commissarien solche Regirung haben sollen / es ist einem obersten Feldherrn ein verkleinerung / als wann er es nicht verstünde / vnd wil von dem obersten Feldherrn auch dahin verstanden werden / als wolt er den Kriegßampts verwaltungen die ehr nit anthůn / daß er selber mit jhnen daruon redet odder handelt / oder daß er jnen vertrawet vnd vngnad bei dem Obersten hetten / Solches soll nit sein / dann ein Feldoberster macht jhm darmit die Ampts personen vnwillig vnd zu wider / vnd handeln nichts mit gůtem willen noch fleissig / lassen die Commissarien handeln mit jhren vorschlegen vnd geschefften / sie machens gůt oder böß / vnd obs schon vbel geraten wirt / dann sagen die ampts Verwalter / Es ist des Commissarien verordnung / dem hab ich volgen müssen / hett mann mir vertraut vnd gewalten lassen / ich wolt jhm anders gethan haben / wanns schon nicht geschehen wer / so můß doch also sein / das die last des Commissarien ist.
  cs: |-
    Před nedávnem se ujala nová správa, totiž skrze válečné komisaře – úřad, který je velký a bere na sebe velkou správu. Jeho pravomoci však nedokážu zcela porozumět, neboť vidím, že se někteří z komisařů ujímají všech válečných záležitostí a rovněž se odvažují řídit všechny vysoké válečné úřady. A i když jsou tyto úřady obsazeny čestnými muži, kteří jsou v nich zběhlí, rozumějí jim a rádi by jednali věrně, chtějí jim tito váleční komisaři v tom předpisovat míru a poroučet, a to dokonce netrpělivě, jako by sami byli nejvyššími válečnými pány {obersten Feldherrn}. Nezdá se mi dobré, aby komisaři měli takovou moc. Pro nejvyššího válečného pána je to ponížení, jako by tomu sám nerozuměl; a lidé si to u nejvyššího válečného pána vykládají také tak, jako by správcům válečných úřadů nechtěl prokázat tu čest, aby s nimi sám promluvil či jednal, anebo jako by jim nedůvěřoval a oni byli u plukovníka {Obersten} v nemilosti. Tak tomu být nemá. Nejvyšší polní hejtman {Feldoberster} si tím totiž činí úřední osoby neochotnými a nepřátelskými: nedělají nic s dobrou vůlí ani pilně a nechávají komisaře jednat podle jejich návrhů a příkazů, ať to udělají dobře, či zle. A dopadne-li to špatně, řeknou správcové úřadů: „Je to nařízení komisařovo, musel jsem ho uposlechnout; kdyby mi byli důvěřovali a nechali mi volnou ruku, byl bych to udělal jinak.“ A i kdyby tomu tak nebylo, musí to přesto dopadnout tak, že vina padne na komisaře.
- typ: odstavec
  de: |-
    Ist aber der amptsuerwalter ein rechter verstendiger mann / vnd befindt daß ers baß / dann der Commissarius jm beuilcht / außzurichten weiß / so wirt er dem Commissario nicht gehorchen noch volgen / sonder sagen / Ich sehs nit für gůt an / mein Feldoberster ist im feld / wirt mich wol selber bescheiden / wann er etwas mit mir zuschaffen in willens / wirt er mein bericht auch hörn / dann hat der Commissarius den spot / vnd geschicht wol recht / wann sie vor sich selbst also geschefftig sein wöllen / vnd so eines gewalts sich anmassen mit solchem standt.
  cs: |-
    Je-li však správce úřadu řádný, rozumný muž a shledá, že to dokáže zařídit lépe, než jak mu komisař přikazuje, nebude komisaře poslouchat ani následovat, nýbrž řekne: „Nepokládám to za dobré. Můj nejvyšší polní hejtman je v poli, ten mi jistě sám dá pokyn; bude-li se mnou chtít něco vyřídit, vyslechne i mou zprávu.“ Pak má komisař posměch, a děje se mu zcela po právu, když chtějí být komisaři sami od sebe tak horliví a v takovém postavení si osobují takovou moc.
- typ: odstavec
  de: |-
    Wann aber ein Commissarius zu einer Ampts person keme / vnd sagt / Mein Oberster hat mir das beuolhen euch zu sagen / daran hat er nicht vnrecht sonder wol gethan / dann der Oberster hat das macht vnnd zuthůn vnd mann soll jhm darinn gehorsam sein /
  cs: |-
    Přijde-li však komisař k nějaké úřední osobě a řekne: „Můj plukovník mi přikázal, abych vám to vyřídil,“ nejedná neprávem, nýbrž dobře; plukovník k tomu totiž má moc i pravomoc a je třeba jej v tom poslouchat;
