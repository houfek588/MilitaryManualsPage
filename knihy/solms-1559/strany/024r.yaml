bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    belegert / vnd denselben gar nit oder doch langsam traut zugewinnen / so soll er bald abziehen / vnd seinem Herrn in andere weg nutz zuschaffen vnderstehn / sonst leit er da / vnd verthůt dem Herrn sein gelt vergebens / mit verlierung der zeit / vnd richt auch weitters nichts auß / er were dann allein von desselben Flecken wegen / wie offt geschicht / außgezogen oder hett kundtschafft / daß er sie Prouiant halben / in einer kurtzen zeit außhüngert / oder kündt sonst dem Feind weiter in sein Land nit ziehen / wann er aber fürziehen kan / soll er dannoch den Flecken so er hinder jm leßt / mit einem gegen Leger verwarn / damit sie jm an volck vnd Prouiant so jm nachzeucht / keinen schaden oder verhinderung zufügen mögen.
  cs: |-
    a netroufá si je dobýt vůbec nebo jen velmi zdlouha, má brzy odtáhnout a pokusit se prospět svému pánovi jinými způsoby; jinak tam jen leží, marně pánovi utrácí peníze se ztrátou času a dále nic nepořídí – ledaže by vytáhl do pole výhradně kvůli tomuto městečku, jak se často stává, anebo by měl zprávu, že je nedostatkem proviantu {Prouiant} v krátkém čase vyhladoví, či by jinak nemohl táhnout dále do nepřátelské země. Může-li však táhnout dále, má přesto městečko, které nechává za sebou, zajistit protiležením {Leger}, aby mu nemohli na lidech a proviantu, které táhnou za ním, způsobit žádnou škodu ani překážku.
- typ: odstavec
  de: |-
    Zum andern / wann ein Oberster mit den Feinden zuschlahen / von seinem Herrn beuelch / oder es selbst zuthůn im willen hat / soll er abermals erst angezeigter bewegung halben / nicht lang verziehen / er hett dann warhafftigs wissen / daß er dem gegen theil in einer zeit / meuterei vnder seinem hauffen vnd dardurch abfall seines Kriegsuolcks möchte machen / oder daß er andere vrsach durch kundtschafft glaubwirdigen bericht empfinge / wie im Memorial wol daruon bestimpt ist / dardurch ein Oberster bald seiner Feinde kundthafftigen nachtheil vermuten mag / vnd ist die vnwidersprechlich warheit / es kan ein Oberster seinem obersten Herrn in disen beiden letsten Artickeln bald grossen vnkosten ersparn / deßhalben wirt billich dahin beschlossen / das ein herr keinem obersten Hauptman ins feld zuziehen verordne / er sei dann hertzhafftig / des Kriegs geübt / langwirig erfahrn / vnd hoch verstendig
  cs: |-
    Za druhé, má-li nejvyšší velitel {Oberster} rozkaz od svého pána svést s nepřáteli bitvu anebo má sám v úmyslu tak učinit, nemá opět z výše uvedených pohnutek dlouho otálet – ledaže by měl jistou vědomost, že by mohl u protivníka zakrátko vyvolat vzpouru {meuterei} v jeho houfu {hauffen} a tím i odpadnutí jeho válečného lidu {Kriegsuolcks}, anebo že by z výzvěd obdržel jiný důvod a věrohodnou zprávu, jak je o tom dobře vyloženo v pamětním spisu,[^1] podle níž by nejvyšší velitel mohl brzy očekávat zřejmou újmu svých nepřátel. A je nezvratná pravda, že nejvyšší velitel může svému nejvyššímu pánovi v těchto obou posledních článcích snadno ušetřit veliké náklady; proto se právem dochází k závěru, že žádný pán nemá ustanovovat k tažení do pole žádného vrchního hejtmana {Hauptman}, ledaže by byl srdnatý, ve válce vycvičený, dlouholetými zkušenostmi ostřílený a vysoce rozumný.
- typ: odstavec
  de: |-
    Der oberst Feldhauptman beuilcht sanct Jörgen fanen dem Fendrich der gestalt / daß ers jm befolhen laß sein / wie Christus der Herr sanct Johann Mariam am stam des heiligen Creutzs befolhen hatt / vnd wöl bei dem Fanen sterben / genesen / todt oder lebendig bleiben / Etliche vermeinen es sei formlicher / mann beuelhe die Fanen mit denen worten: Ich gib dir den Fanen / vnd beuelhe daß du darbei thůts wie ein ehrlicher biderman / vnd deine vorältern auch gethan haben / Diser formen eine / mag ein jeder Hauptman seinem Fendrich den Fanen beuelhen.
  cs: |-
    Nejvyšší polní hejtman {oberst Feldhauptman} svěřuje korouhev {fanen} svatého Jiří praporečníkovi {Fendrich} těmito slovy: aby si ji vzal na starost tak, jak Kristus Pán svěřil svatému Janovi Marii pod kmenem svatého kříže, a aby chtěl u korouhve zemřít či přežít, zůstat mrtev nebo živ. Někteří soudí, že je obřadnější svěřit korouhev těmito slovy: „Dávám ti tuto korouhev a přikazuji, abys při ní jednal jako čestný poctivý muž a jak jednali i tvoji předkové.“ Jedním z těchto způsobů může každý hejtman svěřit praporečníkovi korouhev.
- typ: odstavec
  de: |-
    Der oberst Feldhauptman soll / als vil jm jmmer möglich die feinde vnd Flecken / er wöl schlahen / stürmen / oder sonst handeln / selbst besichtigen / kan es aber je durch jhn nicht geschehen / soll er andere verstendige vnd tapffere Kriegsleut solches zuthůn verordnen / sonst sagt etwan einer / er habs besehen vnd ist nie darzů kommen / etc.
  cs: |-
    Nejvyšší polní hejtman si má, jak jen mu to bude možné, nepřátele i městečka – ať chce svést bitvu, podniknout útok nebo činit cokoli jiného – prohlédnout sám; nemůže-li však to učinit osobně, má k tomu určit jiné rozumné a statečné válečníky {Kriegsleut}, jinak totiž leckdo říká, že to prohlédl, a přitom se tam nikdy ani nedostal atd.
poznamky:
- n: 1
  text: |-
    V předloze „wie im Memorial wol daruon bestimpt ist“ – odkaz na pamětní spis či předchozí válečnické pojednání (patrně první knihu díla či autorův vojenský memoriál).
