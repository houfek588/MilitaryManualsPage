bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    belegert / vnd denselben gar nit oder doch langsam traut zugewinnen / so soll er bald abziehen / vnd seinem Herrn in andere weg nutz zuschaffen vnderstehn / sonst leit er da / vnd verthůt dem Herrn sein gelt vergebens / mit verlierung der zeit / vnd richt auch weitters nichts auß / er were dann allein von desselben Flecken wegen / wie offt geschicht / außgezogen oder hett kundtschafft / daß er sie Prouiant halben / in einer kurtzen zeit außhüngert / oder kündt sonst dem Feind weiter in sein Land nit ziehen / wann er aber fürziehen kan / soll er dannoch den Flecken so er hinder jm leßt / mit einem gegen Leger verwarn / damit sie jm an volck vnd Prouiant so jm nachzeucht / keinen schaden oder verhinderung zufügen mögen.
  cs: |-
    a netroufá si je dobýt vůbec, nebo jen zdlouha, má brzy odtáhnout a snažit se prospět svému pánovi jiným způsobem. Jinak tam jen leží, marně pánovi utrácí peníze, ztrácí čas a ničeho dalšího nedosáhne – ledaže by vytáhl do pole jedině kvůli tomuto městečku, jak se často stává, nebo by měl zprávu, že obránce pro nedostatek proviantu {Prouiant} v krátké době vyhladoví, anebo by jinak nemohl táhnout dál do nepřátelské země. Může-li však táhnout dál, má městečko, které nechává za sebou, přesto zajistit protiležením {gegen Leger}, aby jeho posádka nemohla lidem a proviantu, které táhnou za ním, způsobit žádnou škodu ani překážku.
- typ: odstavec
  de: |-
    Zum andern / wann ein Oberster mit den Feinden zuschlahen / von seinem Herrn beuelch / oder es selbst zuthůn im willen hat / soll er abermals erst angezeigter bewegung halben / nicht lang verziehen / er hett dann warhafftigs wissen / daß er dem gegen theil in einer zeit / meuterei vnder seinem hauffen vnd dardurch abfall seines Kriegsuolcks möchte machen / oder daß er andere vrsach durch kundtschafft glaubwirdigen bericht empfinge / wie im Memorial wol daruon bestimpt ist / dardurch ein Oberster bald seiner Feinde kundthafftigen nachtheil vermuten mag / vnd ist die vnwidersprechlich warheit / es kan ein Oberster seinem obersten Herrn in disen beiden letsten Artickeln bald grossen vnkosten ersparn / deßhalben wirt billich dahin beschlossen / das ein herr keinem obersten Hauptman ins feld zuziehen verordne / er sei dann hertzhafftig / des Kriegs geübt / langwirig erfahrn / vnd hoch verstendig
  cs: |-
    Za druhé: má-li plukovník {Oberster} od svého pána rozkaz svést s nepřáteli bitvu, nebo to sám zamýšlí, nemá ze stejných, právě uvedených důvodů dlouho otálet. Výjimkou je, kdyby s jistotou věděl, že by mohl u protivníka v dohledné době vyvolat vzpouru {meuterei} v jeho houfu {hauffen} a tím i odpadnutí jeho válečného lidu {Kriegsuolcks}, nebo kdyby z výzvědných zpráv dostal jiný důvod a věrohodné zprávy – jak je o tom dobře pojednáno v pamětním spisu[^1] –, podle nichž by plukovník mohl brzy očekávat zjevnou újmu svých nepřátel. A je nezvratná pravda, že v těchto dvou posledních článcích může plukovník svému nejvyššímu pánovi snadno ušetřit velké náklady. Proto se právem uzavírá, že žádný pán nemá posílat do pole žádného nejvyššího hejtmana {obersten Hauptman}, ledaže je srdnatý, ve válce zběhlý, dlouholetou zkušeností ostřílený a velmi rozumný.
- typ: odstavec
  de: |-
    Der oberst Feldhauptman beuilcht sanct Jörgen fanen dem Fendrich der gestalt / daß ers jm befolhen laß sein / wie Christus der Herr sanct Johann Mariam am stam des heiligen Creutzs befolhen hatt / vnd wöl bei dem Fanen sterben / genesen / todt oder lebendig bleiben / Etliche vermeinen es sei formlicher / mann beuelhe die Fanen mit denen worten: Ich gib dir den Fanen / vnd beuelhe daß du darbei thůts wie ein ehrlicher biderman / vnd deine vorältern auch gethan haben / Diser formen eine / mag ein jeder Hauptman seinem Fendrich den Fanen beuelhen.
  cs: |-
    Nejvyšší polní hejtman {oberst Feldhauptman} svěřuje korouhev {fanen} svatého Jiří praporečníkovi {Fendrich} tak, aby si ji vzal na starost, jako Kristus Pán svěřil svatému Janovi Marii pod svatým křížem, a aby byl ochoten u korouhve zemřít i přežít, zůstat mrtev nebo živ. Někteří mají za to, že je obřadnější svěřit korouhev slovy: „Dávám ti tuto korouhev a přikazuji ti, abys při ní jednal jako čestný a poctivý muž, jak jednali i tvoji předkové.“ Jedním z těchto způsobů může každý hejtman svěřit korouhev svému praporečníkovi.
- typ: odstavec
  de: |-
    Der oberst Feldhauptman soll / als vil jm jmmer möglich die feinde vnd Flecken / er wöl schlahen / stürmen / oder sonst handeln / selbst besichtigen / kan es aber je durch jhn nicht geschehen / soll er andere verstendige vnd tapffere Kriegsleut solches zuthůn verordnen / sonst sagt etwan einer / er habs besehen vnd ist nie darzů kommen / etc.
  cs: |-
    Nejvyšší polní hejtman si má nepřátele i městečka, s nimiž chce svést bitvu, na něž chce útočit nebo proti nimž chce jinak zakročit, prohlédnout pokud možno sám. Nemůže-li to učinit osobně, má tím pověřit jiné rozumné a statečné válečníky {Kriegsleut}; jinak leckdo řekne, že to prohlédl, a přitom se tam vůbec nedostal atd.
poznamky:
- n: 1
  text: |-
    *Memorial* – pamětní spis; patrně odkaz na autorův vojenský memoriál nebo na První knihu díla.
