bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vnd wege zustellen sein mögen/ vnd die notturfft erfordern wil/ doch nit der gestalt/ daß ich mich des verstendig halte/ vnd vor andern solches anzufechten/ sonder allein auß gehorsam.
  cs: |-
    a na jiné cesty, jak si to vyžaduje nutnost – nikoli však tak, že bych se sám pokládal za dostatečně rozumného a před jinými se toho domáhal, nýbrž toliko z poslušnosti.
- typ: odstavec
  de: |-
    Vnd dieweil dann etlich Artickel/ wie ich es bei mir achte/ wol erheblich seind/ vnnd die notturfft erfordern will/ etwas scharpff dauon zureden oder zuschreiben/ damit mög verstanden werden warauff der jrthumb steht vnnd herkömpt/ So will ich das doch nit anderst/ noch niemants zu nachtheil noch schmach thůn/ oder damit vermeint haben/ sonder allein vmb gůter ordnung willen/ darmit dem Kriegßuolck vnd einem gantzem Leger/ auch dem Kriegßherrn gedienet werden möge/ vnd die Krieg desto lenger vnd statlicher mögen erhalten werden.
  cs: |-
    A poněvadž jsou některé články {Artickel}, jak sám soudím, velmi závažné a nutnost si bude žádat mluvit či psát o nich poněkud ostře, aby bylo pochopeno, na čem spočívá a odkud pochází omyl, nechci tak přece činit jinak ani nikomu k újmě či pohaně nebo s takovým úmyslem, nýbrž jedině kvůli dobrému řádu, aby se mohlo posloužit válečnému lidu {Kriegßuolck}, celému ležení {Leger} i válečnému pánovi {Kriegßherrn} a aby se války mohly udržet o to déle a řádněji.
- typ: odstavec
  de: |-
    Vnd dieweil dann ich hie in diser beschreibung volgents vermelt/ ratlich vnd vor gůt ansehe/ wann ein Kriegßherr sein Kriegßuolck bei einander bringen wirt/ daß er alle seine Kriegßuerstendigen bei einander neme/ vnd alle Artickel so zu bedencken/ zu beratschlagen vnd zu ordnen vorgebe/ vnd wann er allbereit derhalben etwas hett gemacht oder machen lassen/ daß er jnen dasselbig vorlege auch zuberathschlagen/ vnnd was gůt sein mag/ behalten/ vnnd was nicht dienstlich sein wolt/ mit vrsachen abthůn/ vnnd inn ein besserung stellen.
  cs: |-
    A jelikož dále v tomto popisu uvádím, že pokládám za radno a dobré, aby válečný pán, jakmile shromáždí svůj válečný lid, povolal k sobě všechny své války znalé lidi a předložil jim k uvážení, poradě a uspořádání všechny články, jež je třeba promyslet – a pokud by již v té věci dal něco sepsat nebo sepsal, aby jim to rovněž předložil k poradě, a co by bylo dobré, zachoval, a co by nebylo prospěšné, s důvody zrušil a obrátil k lepšímu;
- typ: odstavec
  de: |-
    Dieweil dann die sachen also durch vil verstendigen geordnet vnd bedacht werden sollen/ vnd die Regirung nit auff eines bedencken vnd ordnung allein stehn wirt vnd soll/ So habe ich auch solch mein bedencken vnd Ordnung desto freier vnd tröstlicher gestelt vnd vbergeben.
  cs: |-
    poněvadž tedy věci mají být takto uváženy a uspořádány mnoha rozumnými muži a správa nemá a nebude spočívat jen na úsudku a nařízení jediného člověka, sepsal jsem i já toto své dobrozdání a řád o to svobodněji a směleji a předložil je.
- typ: odstavec
  de: |-
    Dann einmal ist es die warheit daß die Römische Keiserliche Maiestat solches hoch erfarnen verstandes vnnd langem gebrauch ist/ daß Ir Römisch Keiserliche Maiestat meines oder eines andern höhers verstants/ bedenckens/ Raths noch Ordnung zugeben nit bedarff/ aber dahin ich es verstehe vnnd achte/ daß Ihr Römische Keiserliche Maiestat mich mit anderen dahin weisen vnnd halten will/ dieweil Ihr Römische Keiserliche Maiestet vns also mit den hohen Emptern statlich vnnd ehrlich vnderhelt/ daß wir vnns auch in sollichen Kriegßsachen vben vnd gebrauchen sollen/ darmit die Empter die wir auff vnns laden/ vnnd die ehr daruon nemen/ desto statlicher außrichten vnd versehen mögen/ vnd Ihr Römische Keiserlich Maiestat auff vnser inn dem bedencken weitter zu vnderrichten vnd zubeuelhen hab/ darmit wir lernen vnd in sorgen desto fleissiger handeln/ vnd regieren mögen.
  cs: |-
    Neboť jednou provždy je pravda, že Římské císařské Veličenstvo má tak vysoce zkušený rozum a dlouhou praxi, že Jeho Římské císařské Veličenstvo nepotřebuje udílení úsudku, rady ani nařízení ode mne či někoho vyššího rozumu; nýbrž já tomu rozumím a soudím tak, že Jeho Římské císařské Veličenstvo nás spolu s jinými chce vést a přimět k tomu – když nás takto důstojně a čestně vydržuje ve vysokých úřadech –, abychom se také v takových válečných věcech cvičili a osvědčovali, abychom mohli úřady, které na sebe bereme a z nichž máme čest, o to řádněji vykonávat a zastávat, a aby nás Jeho Římské císařské Veličenstvo mohlo na základě našeho dobrozdání v tom dále poučovat a nám rozkazovat, abychom se učili a s péčí o to pilněji jednali a vládli.
