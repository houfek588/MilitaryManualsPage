bloky:
- typ: nadpis
  uroven: 3
  de: Ein vnterweissung welcher Salpeter ambesten oder krefftigsten ist.
  cs: Poučení, který ledek {Salpeter} jest nejlepší či nejsilnější
- typ: odstavec
  de: |-
    DV solt wissen daß der Salpeter nicht so groß Krafft hat / als der wechst an Heussern / Mauern / Kellern oder inn feuchtigkeit / denn sie vnderweilen trucken / vnnd wider naß werden / vnnd wo du heimschen Salpeter wol vnd recht leuterst / so muß er alweg naß werden / vnd thůt ein pfundt so vil mit seiner Krafft als des Salpeters 3. pfundt gethůn möchten.
  cs: |-
    Věz, že [jiný] ledek nemá tak velikou sílu jako ten, jenž roste na domech, zdech, ve sklepích nebo ve vlhkosti, neboť ty občas vysychají a zase vlhnou; a když domácí ledek dobře a řádně vyčistíš, tak vždy přitahuje vlhkost,[^1] a přece jedna libra {pfundt} vykoná svou silou tolik, co by jinak dokázaly 3 libry ledku.
- typ: nadpis
  uroven: 3
  de: Wiemann einn guten Salpeter machen soll.
  cs: Jak se má dělat dobrý ledek
- typ: odstavec
  de: |-
    SO nim Salpeter vnd leuter jn das Saluiter darauß werde / vnd wenn du den Salpeter drei stundt geleuter hast / so thů jn in ein Kessel / vnd schüt gebranten Wein darzů / also daß der Wein dreier finger hoch vber den salpeter auffgehe / vnd thů zu eim pfundt Salpeter / drei pfundt Salarmoniac / zwei lot Campfer / vnd seud das / wenn das den vierdtentheil ein geseudt / so thu es ein klein weil harab von dem Feur / schüt denn den Wein ab in einen newen erden Hafen so ist ein Salpeter worden / henck denn denselben Salpeter an ein seil in einen kalten Keller / vnd laß jn drei wochen darin hangen / so wirt er graw vnd lang knutzig / wechst das beste da durch / vnd wenn du jn darein henckst / so gehe an dem neunden tag darzů / wesch den Hafen sen mit eim hassenfuß in ein schön Becken / vnd behalt das wol / dann das ist das beste vnd das sterckst stuck das jemant gehaben mag / vnd thůt man sein 1. lot vnter 30. pfundt zeugs / so ist sein gar gnug / doch je mehr man darein thůt je besser es wirt / vnd ist so gůt das mann ein pfundt gibt vmb 30. Gulden.
  cs: |-
    Vezmi tedy ledek a vyčisti jej, aby se z něj stal čistý sanýtr (*Saluiter*); a když jsi ledek třikrát[^2] vyčistil, dej jej do kotle a přilej k němu pálené víno tak, aby víno sahalo na tři prsty vysoko nad ledek, a k jedné libře ledku přidej tři libry salmiaku (*Salarmoniac*) a dva loty {lot} kafru a vař to. Až se vyvaří čtvrtina, sejmi to na malou chvíli z ohně a slij víno do nového hliněného hrnce – tak se utvořil [čistý] ledek. Pak ten ledek zavěs na provaze[^3] do studeného sklepa a nech jej tam tři týdny viset; tak zešediví a vytvoří dlouhé uzlovité krystaly (*lang knutzig*),[^4] čímž z něj vyroste to nejlepší. A když jej tam zavěsíš, jdi k němu devátého dne, ometej[^5] hrnec zaječí packou (*hassenfuß*) do čisté mísy a dobře to uschovej, neboť to jest nejlepší a nejsilnější přísada, jakou jen kdo může mít; a přidá-li se jí 1 lot do 30 liber látky, bohatě to stačí, avšak čím více se jí přidá, tím bude lepší, a jest tak dobrá, že se jedna libra prodává za 30 zlatých {Gulden}.
- typ: nadpis
  uroven: 3
  de: Wie mann salpeter hert machen soll.
  cs: Jak se má ledek učinit tvrdým
- typ: odstavec
  de: |-
    NIm Salpeter seudt den in eins Goltschmidts Digel oder newen Hafen der in dem Feur besteht / als lang du empfindest das er von jhm selber gestehen wöl / so werff als groß wie ein hanffkorn schwefels darein / so laufft es vmb vnd bleibt es darin ligen / so hat es gnug zu 4. loten zusetz / Merck es eben / wenn er also bereit vnnd gemacht ist so lest er sich giessen wie mann wil / vnd ist den gepurgiert / heist in Alchimei Salutter preparatum / vnd thůt 1. pfundt mehr / warzu mann jn nützet / dann sonst wolgeleuterts 2. pfundt.
  cs: |-
    Vezmi ledek a vař jej ve zlatnickém kelímku nebo v novém hrnci, který v ohni obstojí, tak dlouho, až pocítíš, že chce sám od sebe ztuhnout; pak do něj vhoď kousek síry {schwefels} velký jako konopné semínko – tak se rozlije a zůstane tam ležet, což stačí jako přísada ke 4 lotům. Dobře si to pamatuj: když jest takto připraven a hotov, dá se odlévat,[^6] jak člověk chce, a jest tedy očištěn; v alchymii se nazývá připravený ledek (*Salutter preparatum*), a 1 libra vykoná více, k čemukoli se užije, než jinak 2 libry dobře přečištěného.
- typ: nadpis
  uroven: 3
  de: Wiltu salpeter ziehen.
  cs: Chceš-li dobývat ledek
poznamky:
- n: 1
  text: |-
    V tisku *so muß er alweg naß werden* („musí vždy zvlhnout / být vlhký“ – ve smyslu náchylnosti k pohlcování vzdušné vlhkosti, popř. *maiß*/*müßig*/*reiß* podle souvislosti).
- n: 2
  text: |-
    *drei stundt* – zde ve smyslu „třikrát“ (dobové *drei stund* = *dreimal*, nikoli „tři hodiny“).
- n: 3
  text: |-
    BSB OCR zde chybně četlo *seid* místo *seil* („provaz“), dále *knugig* místo *knutzig* a *that most* místo *thůt man*.
- n: 4
  text: |-
    *lang knutzig* – s dlouhými sukovitými (uzlovitými) krystaly či výkvětem.
- n: 5
  text: |-
    V tisku stojí *wesch den Hafen sen mit eim hassenfuß* – zřejmě sazečské zdvojení koncovky slova *Ha-fen* (*Hafen sen* místo prostého *Hafen*, nebo zkomolenina za *fein* „jemně“); zaječí packa (*Hasenfuß*) sloužila jako jemný smetáček ke stírání vykrystalovaného výkvětu.
- n: 6
  text: |-
    BSB OCR zde četlo *greffen* místo *giessen* („odlévat“); *Salutter preparatum* = tavený (přečištěný) ledek (*sal prunellae*).
