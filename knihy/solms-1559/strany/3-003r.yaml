bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    wölten wir dann thůn vndereinander/ wo der feindt gegen vns die handlung wirt gebrauchen mit der Prouiant/ wie wölten wir dargegen thůn/ wann der feindt sein ordnung also gegen vns gebrauchen wirt im schlagen/ wie wöllen wir vnser ordnung zum angriff fürnemen vnd ordnen/ deßgleichen vnser geschütz groß vnd klein/ vnd also so soll mann alle zeit ein sachen auff zůkünfftige fell zu bedencken fürnemen/ damit das Kriegsuolck von den Regenten zuschaffen hab/ vnnd sie alle zeit erfordern zu rathschlagen/ schafft mann schon nit allezeit im Rath/ so verhüt es doch vil andere zu nichtige fürnemen/ das sie thetten wann sie sicher weren/ vnd nit erfordert würden zu rathschlagen/ Dann es ist gewiß/ daß ein Herr sein volck durch solliche vbung vnd rath haltung/ geschickt vnd sorgfeltig macht/ sie dardurch lernet erkennen/ was für vernunfft/ geschlicklicheit[^1] vnd fleiß hinder einem jeden ist/ was er einem jeden befelhen vnnd zu vertrawen darff/ Ob mann schon auch sagen wirt: Es werden die Rathschläg den Feinden offenbar das ist nit gůt/ so halt ich darfür das es nit böß sein solt/ daß er die gemein Rathschläg wisse/ dann sie machen jnen jre auch nit wissen so der souil sind vnd fleissig geschicht/ welches die rechten sein werden/ dann das fürnemen welchs dem Herren gefellt/ hat er zuthůn nach seiner gelegenheit.
  cs: |-
    bychom pak spolu jednali, kdyby nepřítel proti nám podnikl něco s proviantem {Prouiant}? Jak bychom si počínali proti tomu, kdyby nepřítel v bitvě nasadil proti nám svůj šik {ordnung} takto? Jak uspořádáme a zřídíme náš šik k útoku a rovněž naše děla {geschütz}, velká i malá?“ A takto si člověk má vždy brát k rozvaze nějaké případy do budoucna, aby válečný lid {Kriegsuolck} měl od svých představených co dělat, a vždy je povolávat k poradě. I když se v radě pokaždé nic nepořídí, přece to zabrání mnoha jiným ničemným podnikům, které by činili, kdyby si byli jisti a nebyli by povoláváni k radě. Neboť je jisto, že pán takovým cvičením a držením rady činí svůj lid obratným a pečlivým, a poznává tím, jaký rozum, obratnost[^1] a píle vězí v každém z nich a co může kterému přikázat a svěřit. A i kdyby někdo řekl: „Ty rady se prozradí nepřátelům, a to není dobré,“ já mám za to, že by nebylo zlé, kdyby nepřítel o obecných radách věděl – neboť když je jich tolik a konají se pilně, ani oni stejně nepoznají, které z nich budou ty pravé; neboť pán pak vykoná ten záměr, který se mu líbí, podle své příležitosti.
- typ: odstavec
  de: |-
    Drumb sol ein Herr sich nit lassen jrr machen/ sonder sein volck also im brauch der Schuln halten/ so ist es löblich vnnd ehrlich nach zu sagen/ ist auch den personen ein ehr vnd pracht/ zu dem daß sie dardurch geschickt werden/ gewinnen einn Herrn lieb/ vnd bleiben gehorsam/ halten gůte Justitien/ darumb ist es ein grosses vortheil einem Herren/ der souil mit seinem Volck selbst handelt vnd vmbgeht/ jnen gůtlich ist mit reden/ vnd doch zu seiner zeit vnd forderung der notturfft auch ernsthafftig/ so wirt er gelobt/ geförcht/ vnd behelt sein Volck in einem gehorsam/ ist jm alles zuthůn willig/ dann was ein williger man thůt das ist zwifach gethan/ es must je ein böser mensch sein/ wann er einen Herren hett/ der jn also ehrlich hielt/ vnderricht/ lernt/ vertraut vnd also gůtig gegen jm were/ daß er nicht alles mit fleiß/ ernst vnd trewen thůn wirt/ Aber ein Tyrannischer Herr der stoltz ist/ dem gemein Man auch nit gůtlich/ sonder wilt vnd mit seim kopff hin durch/ dem ist niemant willig/ muß das volck mit gelt vberhalten vnnd zalen/ thůt doch nichts auß gůtem willen/ was dann nicht auß gůtem willen geschicht/ das geschicht nimmer mehr recht oder wol.
  cs: |-
    Proto se pán nemá dát zmást, nýbrž má svůj lid takto držet ve [válečné] škole. To se o něm pak vypráví ke chvále a cti a je to i těm lidem ke cti a ozdobě; kromě toho se tím stávají obratnými, zamilují si pána, zůstávají poslušní a dbají dobré spravedlnosti {Justitien}. Proto je to veliká výhoda pro pána, jenž se svým lidem tak hojně sám jedná a stýká se s ním, mluví s nimi vlídně, avšak v pravý čas a podle potřeby věci i vážně – pak je chválen, vážen s bázní a udrží svůj lid v poslušnosti, takže je mu každý ochoten učinit cokoli, neboť co činí ochotný člověk, to je vykonáno dvojnásob. Musel by to věru být zlý člověk, kdyby měl pána, jenž ho takto čestně ctí, poučuje, učí, důvěřuje mu a je k němu tak laskavý, aby nečinil vše s pílí, vážností a věrností. Naproti tomu tyranský pán, který je pyšný a ani k prostému muži {gemein Man} není vlídný, nýbrž zpupný a jde si jen za svou hlavou – tomu není nikdo nakloněn; musí lid držet jen penězi a platit mu, a přece nic nekoná z dobré vůle; a co se neděje z dobré vůle, to se nikdy neděje správně ani dobře.
poznamky:
- n: 1
  text: |-
    Tisk má podobu *geschlicklicheit* (sazečská odchylka za *geschicklicheit* – obratnost, dovednost). V odstavci `de` je poznámka zapsána přímo za tímto tvarem (poznámková značka v českém textu odkazuje tamtéž).
