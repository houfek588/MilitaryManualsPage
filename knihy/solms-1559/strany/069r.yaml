bloky:
- typ: nadpis
  uroven: 3
  de: Von der Lantskneckt Hauptleut.
  cs: O hejtmanech {Hauptleut} lancknechtů {Lantskneckt}.
- typ: odstavec
  de: |-
    DIe Hauptleut vber die Knecht/ wann sie Knecht auffbrengen sollen/ gibt jhnen der Kriegsherr darzů gelt/ nach dem der weg weit/ oder nahe auff den Musterplatz ist.
  cs: |-
    Když mají hejtmani nad knechty {Knecht} najmout knechty, dává jim válečný pán {Kriegsherr} k tomu peníze podle toho, jak daleká nebo blízká je cesta na přehlídkové místo {Musterplatz}.
- typ: odstavec
  de: |-
    Etlich Hauptleut haben kürtzlich ein Newerung erdacht/ wann sie Knecht auffbrengen sollen/ so leyhen sie denselben der Kriegsherrn gelt/ vnd solchs gelt volgents an jre bezalung abziehen/ vor angeregtem leyhen sei ein jeder gewarnet/ angesehen/ es ist eins Kriegsherrn grosser nachtheil.
  cs: |-
    Někteří hejtmani si nedávno vymysleli novotu: když mají najímat knechty, půjčují jim peníze válečného pána a tyto peníze jim pak strhávají z jejich žoldu. Před takovým půjčováním budiž každý varován, neboť je to k veliké škodě válečného pána.
- typ: odstavec
  de: |-
    Aber wann der Oberst erkennen kan/ das ein Hauptman durch sein gůten fleiß im schaden lege/ gegen demselben soll der herr billich mitleiden tragen vnd etwas ergetzlicheit thůn.
  cs: |-
    Pozná-li však plukovník {Oberst}, že se hejtman při své dobré horlivosti ocitl ve škodě, má s ním pán po právu mít soucit a poskytnout mu nějakou náhradu.
- typ: odstavec
  de: |-
    Die Hauptleut wöllen Leutenant gehalten haben/ ist auch ein newerung/ vnd wirt etwan dardurch wann mann jhn die hellt/ vil verwarloßt/ dann wann sie selbs auff zügen vnd wachten/ wie sie schuldig sein/ versehen sollen/ beuelhen sie es den leutenanten/ der vrsach soll es ein herr nit nachgeben.
  cs: |-
    Hejtmani chtějí, aby se jim vydržovali poručíci {Leutenant}. I to je novota, a vydržují-li se jim, leckdy se tím mnoho zanedbá: když mají sami, jak jsou povinni, dohlížet na pochody {zügen} a stráže {wachten}, přenechávají to poručíkům. Proto jim to pán nemá povolovat.
- typ: odstavec
  de: |-
    Die Hauptleut wöllen auch/ wie in jhres Obersten stat verzeichnet/ der herr soll jedem ein Reissigen Knecht/ sein koch vnd ein Tholmetschen versolden/ der Tholmetsch wirt in einem frembden Landt billich vnderhalten/ aber der Reissig vnd koch ist der herr zuuersolden nit schuldig/ er soll es auch nit bewilligen/ es sei jme dann wol gelegen.
  cs: |-
    Hejtmani také chtějí – jak je zapsáno ve stavu {stat} jejich plukovníka –, aby pán každému z nich dával žold na jízdního pacholka {Reissigen Knecht}, jeho kuchaře a tlumočníka {Tholmetschen}. Tlumočník se v cizí zemi po právu vydržuje, avšak jízdního pacholka a kuchaře není pán povinen platit a nemá k tomu ani svolovat, ledaže by mu to dobře vyhovovalo.
- typ: odstavec
  de: |-
    Ein jeder Hauptman soll mit seinen Knechten ernstlich darob vnd daran sein/ daß sie den Artickels Brieff in allen Artickeln getrewlich halten/ damit der Oberst deßhalben nicht vil bemühet/ auch das Regiment desto statlicher vnderhalten werde.
  cs: |-
    Každý hejtman má u svých knechtů přísně dbát na to, aby věrně dodržovali artikulní list {Artickels Brieff} ve všech článcích, aby tím plukovník nebyl příliš obtěžován a pluk {Regiment} se udržoval v o to lepším pořádku.
- typ: odstavec
  de: |-
    Die Hauptleut werden in jrer Besoldung nach der verzeichung in des Obersten stat/ doch auch nach gelegenheit der Lande gehalten.
  cs: |-
    Hejtmani jsou ve svém žoldu {Besoldung} vydržováni podle zápisu v plukovníkově stavu, avšak také podle poměrů dané země.
- typ: odstavec
  de: |-
    Die Hauptleut sein am stürmen vnd Schlachten schuldig mit jren Fendrichen wie sie geordnet sollen werden/ mit einander zuloffen
  cs: |-
    Hejtmani jsou při útocích {stürmen} a bitvách povinni postupovat společně se svými praporečníky {Fendrichen}, tak jak budou zařazeni
