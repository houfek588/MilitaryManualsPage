bloky:
- typ: odstavec
  de: |-
    Damit aber nit zuuerstehen sein mag/ daß ich solches auß einem draum oder schlechter reden vnuersucht vñ vnerfarn schreibe/ so wirt hieuorn vermelt/ wo ich solchs vnderhanden vñ im werck gehabt hab/ Damit solchs zusehen das war ist/ so volget hernach ein Knappen Register/ wie ich solchs im werck vnd Regirung gehabt habe.
  cs: |-
    Aby se však nemohlo rozumět, že píši takové věci ze sna nebo z pouhých řečí, nezkoušeně a bez zkušenosti, bylo výše uvedeno, kde jsem to měl v rukou a v díle; aby bylo patrno, že je to pravda, následuje dále hornický rejstřík {Knappen Register}, jak jsem jej sám v díle a správě vedl.
- typ: nadpis
  uroven: 2
  de: |-
    Knappen Register/ da mann vor Sanctesier gegraben vnd die Stat wöllen sprengen/ Anno 1544. ist Ostwald Niderofft Schreiber darüber gewesen.
  cs: |-
    Hornický rejstřík z dob, kdy se kopalo před Saint-Dizier a město mělo být vyhozeno do povětří léta 1544; písařem nad ním byl Ostwald Niderofft.[^1]
- typ: odstavec
  de: |-
    ABer damit weitter ein bericht mag geschehen/ vnd mein beschreibung mit angezeigten Figurn des vndergrabens nit erdacht vnd vnuersucht fürgenomen sei/ sondern im werck vnd handlung gewesen/ hab ich des ein Rechnung vnd Ordnung/ so ich vor Sanctesier gegraben/ vnd mit den Knappen gedingt vnd regirung gehalten hab/ Deßgleichen hab ich auch vor Perona vnd Metz dise Ordnung vnnd regirung gehalten/ darumb hab ich dise Rechnung mit angezeigt/ damit wann man solchs werck brauchen wolt/ auch desto besser in ein gůt Ordnung vñ rechnung bringen/ vñ mit den Knappen desto besser handeln kündt/ vnd zu stellen wüste/ etc.
  cs: |-
    Avšak aby bylo podáno ještě další svědectví a aby můj popis s uvedenými vyobrazeními podkopávání nebyl vymyšleným a nevyzkoušeným podnikem, nýbrž opřeným o skutečné dílo a čin, kladu sem vyúčtování a řád, podle kterého jsem kopal před Saint-Dizier {Sanctesier}, najímal horníky {Knappen} a držel správu. Stejný řád a správu jsem zachovával i před Péronne {Perona} a Métami {Metz}; proto jsem toto vyúčtování uvedl, aby se – kdyby se takového díla mělo použít – mohlo vše tím lépe uvést v dobrý řád a počet a aby se s horníky dalo tím lépe jednat a zřizovat je atd.
- typ: nadpis
  uroven: 3
  de: |-
    Ordnung der Knappen zum graben.
  cs: |-
    Řád horníků ke kopání.
- typ: odstavec
  de: |-
    Auff heut Sontag haben die Bergknappen den ersten stollen getrieben 13. růden tieff/ ist die růdt lang 5. werckschůhe.
  cs: |-
    Dnes v neděli vyrazili horníci {Bergknappen} první štolu {Stollen} hluboko 13 prutů {Růden}, přičemž prut jest dlouhý 5 dílenských střevíců {werckschůhe}.
- typ: odstavec
  de: |-
    Der ander stoln ist getrieben tieff 13. růden vnd 3. schůhe.
  cs: |-
    Druhá štola je vyražena do hloubky 13 prutů a 3 střevíců {schůh}.
- typ: odstavec
  de: |-
    Volgents von disem Sontag an sol dise Orduung wie volgt mit der arbeit/ bezallung vnd allem der gestalt gehalten werden.
  cs: |-
    Nadále od této neděle se má s prací, placením i se vším zachovávat tento řád, jak následuje:
- typ: odstavec
  de: |-
    Zum ersten soll der Schreiber abents vnd morgens zu aller zeit so es von nöten/ bei den Arbeitern in der Schantzen sein/ allen abendt auffschreiben wieuil er personen in einem jeden stoln tag vnnd nacht die 24. stundt gehabt hat/ nemlich zum ersten die Hawer/ denselbigen soll er die schichten besonder beschreiben/ vnd jre besoldung die die 24. stundt auff sie gangen seind.
  cs: |-
    Předně má být písař {Schreiber} večer i ráno, kdykoli je třeba, u dělníků v zákopu {Schantz} a každý večer zapsat, kolik osob měl v každé štole dnem i nocí po celých 24 hodin: totiž nejprve rubače {Hawer}, těm má zapsat směny {Schicht} zvlášť a také jejich žold {Besoldung}, který na ně za těch 24 hodin vyšel.
- typ: odstavec
  de: |-
    Zum andern soll er die Truchenlauffer souil der die 24. stundt gearbeit haben/ jre schichten vnd summen der Persoñ mit jrer besoldung besonder beschreiben/ vnd solches Register allen abendt odder wann die 24. stund auß seind/ zu welcher zeit er die ordnen wirt/ besonder beschreiben/ das also allen tag ein Register/ vnd einn Zettel darauß gemacht werde/ was die 24. stundt oder den tag auffgangen sei.
  cs: |-
    Za druhé má zvlášť zapsat kolečkáře {Truchenlauffer}, kolik jich pracovalo po 24 hodin, jejich směny a součet osob s jejich žoldem; a takový rejstřík má psát každý večer anebo kdykoli 24 hodin uplyne, v kterou hodinu to určí, zvlášť, aby se tak každý den vyhotovil rejstřík a lístek, kolik se za 24 hodin či za ten den vydalo.
poznamky:
- n: 1
  text: |-
    Na titulním listu (`5-titul`, sken 435) je jméno písaře psáno *Ostwald Nideroff*; zde na listu 9 (se signaturou `B iiij`) jako *Ostwald Niderofft* a ve třetím odstavci je sazečská přesmyčka „Orduung“ (za *Ordnung*). Obléhání francouzského města Saint-Dizier (*Sanctesier*) vojskem Karla V. proběhlo v červenci–srpnu 1544.
