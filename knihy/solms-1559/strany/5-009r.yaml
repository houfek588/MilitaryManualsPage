bloky:
- typ: odstavec
  de: |-
    Damit aber nit zuuerstehen sein mag/ daß ich solches auß einem draum oder schlechter reden vnuersucht vnd vnerfarn schreibe/ so wirt hieuorn vermelt/ wo ich solchs vnderhanden vnd im werck gehabt hab/ Damit solchs zusehen das war ist/ so volget hernach ein Knappen Register/ wie ich solchs im werck vnd Regirung gehabt habe.
  cs: |-
    Aby však nikdo nemohl soudit, že to píšu ze snu nebo z pouhých řečí, bez zkoušky a zkušenosti, uvedl jsem výše, kde jsem to měl v rukou a v díle; a aby bylo vidět, že je to pravda, následuje dále hornický rejstřík {Knappen Register}, jak jsem jej měl v díle a ve správě.
- typ: nadpis
  uroven: 2
  de: |-
    Knappen Register/ da mann vor Sanctesier gegraben vnd die Stat wöllen sprengen/ Anno 1544. ist Ostwald Niderofft Schreiber darüber gewesen.
  cs: |-
    Hornický rejstřík z doby, kdy se před Saint-Dizier kopalo a město se mělo vyhodit do povětří, léta 1544; písařem {Schreiber} nad ním byl Ostwald Niderofft.[^1]
- typ: odstavec
  de: |-
    ABer damit weitter ein bericht mag geschehen/ vnd mein beschreibung mit angezeigten Figurn des vndergrabens nit erdacht vnd vnuersucht fürgenomen sei/ sondern im werck vnd handlung gewesen/ hab ich des ein Rechnung vnd Ordnung/ so ich vor Sanctesier gegraben/ vnd mit den Knappen gedingt vnd regirung gehalten hab/ Deßgleichen hab ich auch vor Perona vnd Metz dise Ordnung vnnd regirung gehalten/ darumb hab ich dise Rechnung mit angezeigt/ damit wann man solchs werck brauchen wolt/ auch desto besser in ein gůt Ordnung vnd rechnung bringen/ vnd mit den Knappen desto besser handeln kündt/ vnd zu stellen wüste/ etc.
  cs: |-
    Aby však bylo podáno ještě další svědectví a aby můj popis s uvedenými vyobrazeními podkopávání nebyl vymyšlený a nevyzkoušený, nýbrž vzešel ze skutečného díla a jednání, uvádím vyúčtování a řád, podle něhož jsem před Saint-Dizier {Sanctesier} kopal, s horníky {Knappen} úkolově smlouval {gedingt} a vedl správu. Stejný řád a správu jsem držel i před Péronne {Perona} a před Métami {Metz}; proto toto vyúčtování přikládám, aby se – kdyby se mělo takového díla užít – dalo tím lépe uvést v dobrý řád a počet a aby se s horníky dalo lépe jednat a vědělo se, jak to zařídit atd.
- typ: nadpis
  uroven: 3
  de: |-
    Ordnung der Knappen zum graben.
  cs: |-
    Řád horníků ke kopání.
- typ: odstavec
  de: |-
    Auff heut Sontag haben die Bergknappen den ersten stollen getrieben 13. růden tieff/ ist die růdt lang 5. werckschůhe.
  cs: |-
    Dnes v neděli vyrazili horníci {Bergknappen} první štolu {stollen} do hloubky 13 prutů {růden}; prut je dlouhý 5 dílenských střevíců {werckschůhe}.
- typ: odstavec
  de: |-
    Der ander stoln ist getrieben tieff 13. růden vnd 3. schůhe.
  cs: |-
    Druhá štola je vyražena do hloubky 13 prutů a 3 stop {schůhe}.
- typ: odstavec
  de: |-
    Volgents von disem Sontag an sol dise Orduung wie volgt mit der arbeit/ bezallung vnd allem der gestalt gehalten werden.
  cs: |-
    Od této neděle se má dále zachovávat tento řád při práci, placení i ve všem ostatním, jak následuje:
- typ: odstavec
  de: |-
    Zum ersten soll der Schreiber abents vnd morgens zu aller zeit so es von nöten/ bei den Arbeitern in der Schantzen sein/ allen abendt auffschreiben wieuil er personen in einem jeden stoln tag vnnd nacht die 24. stundt gehabt hat/ nemlich zum ersten die Hawer/ denselbigen soll er die schichten besonder beschreiben/ vnd jre besoldung die die 24. stundt auff sie gangen seind.
  cs: |-
    Předně má být písař večer i ráno a kdykoli je třeba u dělníků v šanci {Schantzen} a každý večer zapsat, kolik osob měl v každé štole ve dne i v noci za celých 24 hodin: nejprve rubače {Hawer}, jimž má zvlášť zapsat směny {schichten} a jejich žold {besoldung}, který na ně za těch 24 hodin připadl.
- typ: odstavec
  de: |-
    Zum andern soll er die Truchenlauffer souil der die 24. stundt gearbeit haben/ jre schichten vnd summen der Person mit jrer besoldung besonder beschreiben/ vnd solches Register allen abendt odder wann die 24. stund auß seind/ zu welcher zeit er die ordnen wirt/ besonder beschreiben/ das also allen tag ein Register/ vnd einn Zettel darauß gemacht werde/ was die 24. stundt oder den tag auffgangen sei.
  cs: |-
    Za druhé má zvlášť zapsat kolečkáře {Truchenlauffer}, kolik jich za 24 hodin pracovalo, jejich směny a počet osob s jejich žoldem. Takový rejstřík má zvlášť sepsat každý večer nebo kdykoli uplyne 24 hodin, v kterou hodinu to stanoví, aby se tak každý den vyhotovil rejstřík a z něho lístek {Zettel}, kolik se za 24 hodin čili za den vydalo.
poznamky:
- n: 1
  text: |-
    Na titulním listu (`5-titul`) je jméno písaře tištěno *Ostwald Nideroff*, zde *Ostwald Niderofft*; v odstavci „Volgents von disem Sontag…“ je tisková přesmyčka „Orduung“ (za *Ordnung*). Obléhání Saint-Dizier vojskem Karla V. trvalo od července do srpna 1544.
