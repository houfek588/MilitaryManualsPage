id: 5-025b-r
list: '[25b] (5. kniha)'
strana: recto
sken: 488
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: nadpis
  uroven: 2
  de: Das neundte Blochauß.
  cs: Devátý srub.
- typ: odstavec
  de: |-
    DIß Blochauß ist also zuuerstehen/ als wann es an einer Stat vder Befestung lege/ vnd die höhe innhett/ vnd daß mann mit einem kleinem Legerlein darfür ligen wolt/ wie ein Blochauß/ vnd daß die weite haben müst/ vnd nicht die zeit hett/ oder haben möcht/ daß mann ein recht Blochauß daruor machen kündt/ vnnd der platz zu weit were/ das nit ein Blochauß anzufangen sein möcht/ vnnd daß doch das volck für schiessen sicher darinn liegen kündte/ so wil dasselbig mit schantzen auffgeworffen vnd verdeckt sein.
  cs: |-
    Tento srub {Blochauß} je třeba chápat tak, jako by ležel u města nebo pevnosti {Befestung}, která drží výšinu, a člověk by chtěl před ní ležet s malým ležením {Legerlein} na způsob srubu; to by muselo mít velkou šíři, a přitom by nebyl čas nebo by nebylo možné postavit před ní řádný srub a místo by bylo příliš rozlehlé, než aby se dal začít srub – a přesto by v něm měl lid ležet bezpečně před střelbou. Pak je třeba ležení navršit a krýt šancemi {schantzen}.[^1]
- typ: odstavec
  de: |-
    Dieweil dann ein Schantz nit wol so hoch gemacht mag werden/ daß sie weit hinder sich deckt/ so muß mann darauff achtung haben/ wo sie nit mehr decken wil/ daß mann an demselbigen ort da sie nit deckt/ widerumb so bald eine anfahe/ wie die erst ist/ vnd so hoch mach wie mann kan/ vnd darnach besehe wo dieselbig auch nit decken wil/ dergleichen widerumb eine anfahe wie die ander/ vnd so lang fürt fare biß jhn bedünckt daß das Leger so groß sei als ers haben will/ oder zu decken von nöten ist/ dann so weitter er hindersich kompt/ so die Schantzen weitter decken/ vnd von einander komen mögen/ daß zeigen dise zwo Figurn an/ nemlich die 9. vnd 10.
  cs: |-
    Poněvadž šanci {Schantz} nelze dost dobře udělat tak vysokou, aby kryla daleko za sebou, je třeba dávat pozor, kde už krýt přestává, a hned na tom místě, kde nekryje, začít další, jako je první, a udělat ji tak vysokou, jak jen lze. Potom se podívat, kde ani ta už nekryje, a zase začít další jako tu druhou, a tak pokračovat dál, dokud se mu nebude zdát, že ležení je tak velké, jak je chce mít nebo jak je třeba je krýt. Čím dál totiž postupuje dozadu, tím dál šance kryjí a tím dál od sebe mohou být. To ukazují tato dvě vyobrazení, totiž 9. a 10.[^2]
- typ: odstavec
  de: |-
    Das zuuerstehen/ so ist auff der Pastei der befestung ein Büchs gestalt/ von derselbigen an soll mann einen Fadem ziehen/ vnd darüber legen/ das daruor mit schantzen vergraben vnd verdeckt ist/ so wirdt der Fadem weisen wie die Schantzen decken/ vnd das Volck darzwischen sicher ligen mög/ Aber damit daßselbig wol zuuerstehen sei/ habe ich die Schantzen vff der eine seiten/ die lengst durch das leger oben geht/ die ander zwerg Schantz durch dieselbig lang Schantzen gehn lassen/ damit mann witter die Gytter der zwerg sehe/ vnd mit dem Fadem von der Statwehr auff derselbigen zwerg Schantzen oben vber gehn mag/ so weit der Fadem so vber die zwerg Schantz geht anzeigt/ bei der andern nachkommenden Schantzen/ wie mann mag sicher stehen/ vnd die erst Schantz deckt/ so mag er hinder vnnd hinder thůn so ferr es von nöten ist/ Also lernen dise zwo Figurn/ wie man hinfürter so mann mit Schantzen ein leger decken wil/ thůn soll.
  cs: |-
    Rozumí se to tak: na baště {Pastei} pevnosti je postaveno dělo {Büchs}; od něho se má natáhnout provázek {Fadem} a vést přes prostor před ní, který je prokopán a krytý šancemi. Provázek pak ukáže, jak šance kryjí a kde mezi nimi může lid bezpečně ležet. Aby se tomu však dobře rozumělo, vedl jsem na jedné straně šanci, která jde podélně horem přes ležení, a druhou, příčnou šanci {zwerg Schantz} jsem nechal procházet touto podélnou šancí, aby byla lépe vidět mřížka {Gytter} příčných šancí a aby se dalo provázkem od městské hradby {Statwehr} přejít horem přes tuto příčnou šanci. Kam až provázek vedený přes příčnou šanci ukáže u další, následující šance, tam lze stát bezpečně a první šance kryje; a tak lze postupovat dál a dál dozadu, jak daleko je třeba. Tak tato dvě vyobrazení učí, jak se má napříště postupovat, chce-li kdo krýt ležení šancemi.
- typ: odstavec
  de: |-
    Weitter von den Blochäusern zu reden/ so mag wol gesagt werden/ soll mann souil Blochäuser haben/ vnd so erfordert die notturfft/ daß dieselbigen ein grosse vnd weite haben mussen/ würde es vil Volcks erfordern/ Deßgleichen auff so vil volcks ein groß vnderhaltung/ solt dann dasselbig für vnd für der gestalt gelegt vnd versehen werden/ so
  cs: |-
    Mluvíme-li dále o srubech, mohlo by se namítnout: má-li být tolik srubů a vyžaduje-li potřeba, aby byly velké a rozlehlé, vyžadovalo by to mnoho lidu a na tolik lidu i veliké vydržování. Kdyby se to pak mělo neustále takto obsazovat a zásobovat, tu
poznamky:
- n: 1
  text: |-
    Nečíslovaný líc vloženého listu [25b]; líc [25a] je prázdný a v edici vynechaný. V tisku „vder“ (za *oder*; první písmeno je nezřetelné). *Legerlein* = malé ležení.
- n: 2
  text: |-
    Devátému srubu odpovídá dřevořez na protější straně [[5-025a-v|5-025a-v]] (příčné šance očíslované 1–3). Které vyobrazení tisk míní jako desáté, není jasné – snad vodní baštu na [[5-025v|5-025v]], ke které jinak text chybí.
