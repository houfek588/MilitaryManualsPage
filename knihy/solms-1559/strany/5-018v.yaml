    Celostránkový dřevořez otočený o 90° (letopočet „1559“ vpravo nahoře, monogram „BF“ vlevo dole) k [[5-019r|druhému srubu]]: mohutný obdélný srub se silnými valy a děly ve střílnách. Uvnitř tři vyvýšená stanoviště pro děla, mezi nimi protéká klikatý potok, přes který vede krytý dřevěný most (stavidlo); dále stany, vozy, děla a vojáci.
