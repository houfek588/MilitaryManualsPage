  popis: |-
    Celostránkový dřevořez natočený o 90° na šířku, datovaný „1559“ vpravo nahoře a signovaný monogramem „BF“ na skalce vlevo dole: čtvercový zemní a proutím obložený srub se čtyřmi čtvercovými nárožními baštami (dvě s děly na levém okraji a dvě zubaté či zalomené vpravo), uvnitř široký dřevěný most přes příkop mezi tábory se stany, dalšími děly na středním valu a na baštách.
