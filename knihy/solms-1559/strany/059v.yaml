bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    gehen / wann aber ein volck sicht / daß ein herr jrer nit mangeln kan / můß er jm etwas schedtlichs gefallen lassen.
  cs: |-
    chodit; když však lid vidí, že se bez nich pán nemůže obejít, musí si dát líbit i něco, co mu je na škodu.
- typ: odstavec
  de: |-
    Das ist aber einem jeden Kriegßherrn zurathen / daß er sich einem Kürisser mit einem gůten verdeckten hengst / toppelsold zugeben keines wegs beschwere / angesehen / das ein Kürisser mit einem gůten verdeckten Hengst / solliche besoldung auff einen tag inn der handlung / wider ein jegklich Kriegsuolck in der gantzen welt / keins außgenommen / trefflich wol verdienen kan.
  cs: |-
    Každému válečnému pánu {Kriegßherrn} však lze radit, aby se nijak nezdráhal dát kyrysníkovi {Kürisser} s dobrým krytým hřebcem[^1] dvojitý žold {toppelsold}, vzhledem k tomu, že kyrysník s dobrým krytým hřebcem si takový žold {besoldung} dokáže za jediný den v boji proti jakémukoli válečnému lidu {Kriegsuolck} na celém světě – žádný nevyjímaje – znamenitě zasloužit.
- typ: odstavec
  de: |-
    Ein jeder Kriegßherr sei gewarnet / daß er keinen hauptman mit seinen Reutern für pferdt schaden in der bestallung stehe / er kompt sonst vnnützlich vmb vil gelts / vnd wirdt darzů betrogen.
  cs: |-
    Každý válečný pán buď varován, aby žádnému hejtmanovi {hauptman} s jeho jezdci {Reutern} neručil ve služebním listu {bestallung} za škody na koních, jinak přijde zbytečně o mnoho peněz a ještě bude ošizen.
- typ: odstavec
  de: |-
    Kan ein Kriegßherr gegen Reuttern in jrem bestelbrieff erhalten / daß jme die gefangen vom Adell zugestellt werden / damit er die jenigen so von seinem volck nider ligen lösen / vnnd abwechseln můge / soll es thůn / wann sich aber die Reuter sollich zu gar hoch beschweren oder dargegen wolten / wann jr einer gefangen würde / solte sie der herr / one jren schaden wider von feinden zu lösen schuldig sein / so were dem Herrn besser / er stünde daruon / dann wann ein soldat weiß / daß jhn der Herr wann er gefangen würde wider one sein schaden vom feinde lösen můß / wehret er sich kaum halbe so sehr als sonst / der Herr hüt sich auch daß er den Reuttern für der feinde schaden / so sie den Reuttern an jren Pferden zufügen nit stande / es ist sonst aller schade den Rossen von feinden geschehen.
  cs: |-
    Dokáže-li válečný pán vůči jezdcům v jejich služebním listu dosáhnout toho, aby mu byli vydáváni zajatci ze šlechty, tak aby mohl vykoupit a vyměnit ty ze svého lidu, kteří padnou do zajetí, má tak učinit. Kdyby si však na to jezdci příliš stěžovali nebo by na oplátku chtěli, aby pán – bude-li někdo z nich zajat – byl povinen je bez jejich škody od nepřátel opět vykoupit, pak by pro pána bylo lépe od toho upustit; neboť když voják ví, že ho pán, bude-li zajat, musí bez jeho škody od nepřítele opět vykoupit, brání se sotva zpola tolik jako jindy. Pán ať se také varuje toho, aby jezdcům ručil za škody od nepřátel, které nepřátelé jezdcům způsobí na jejich koních, jinak by všechny škody na koních pocházely od nepřátel.
- typ: odstavec
  de: |-
    Noch ist ein Artickel den wöllen die Hauptleut in jren bestelbrieff haben / den Kriegßherrn beschwerlich / nemlich ob ein anderer Herr / seinen Reuttern mehr besoldung gebe / soll es der Herr jnen auch zugeben schuldig sein / es were dann ein Kriegßherr auß not zu disem Artickel getrungen / sol er sich sonst gar nicht darzů lassen bewegen / diß ist auch nit lang gewesen / aber weittere Artickel in bestelbrieffen / als an vnd abzug / freien marck halten / Prouiant vmb leidlich gelt geben / so ferrn sie anderst der massen mage zu wegen gebracht werden / sampt andern Artickeln die sein anzunemen / doch werden sie auch einem Kriegßherrn mit seinen darzů verstendigen / in zeit der notturff nach seiner gelegenheit heimgestelt.
  cs: |-
    Ještě je jeden článek, který chtějí mít hejtmani ve svém služebním listu, pro válečné pány obtížný: totiž že kdyby jiný pán dával svým jezdcům větší žold, má jim jej být povinen dávat i tento pán; ledaže by byl válečný pán k takovému článku donucen nouzí, jinak se k tomu nemá vůbec nechat pohnout – ani tento zvyk netrvá dlouho. Avšak další články ve služebních listech, jako o příjezdu a odjezdu, držení svobodného trhu a vydávání proviantu {Prouiant} za snesitelnou cenu – pokud je lze takto opatřit –, spolu s dalšími články lze přijmout; přesto se však i ty v době potřeby ponechávají na uvážení válečného pána a jeho k tomu znalých lidí podle jeho okolností.
- typ: odstavec
  de: |-
    Wann ein Hauptman / wie ein jeder soll seinem Fendrich den fanen beuelhen wil / soll ers thůn inhalt des Obersten Feldhaumans
  cs: |-
    Chce-li hejtman svěřit svému praporečníkovi {Fendrich} korouhev {fanen}, jak to má každý učinit, má tak učinit podle obsahu nejvyššího polního hejtmana[^2]
poznamky:
- n: 1
  text: |-
    *Verdeckter Hengst* – válečný kůň krytý koňskou zbrojí či ochrannou pokrývkou (bardou).
- n: 2
  text: V tisku „Feldhaumans“ (tiskařská chyba místo *Feldhauptmans*).
