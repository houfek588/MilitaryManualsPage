bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    gehen / wann aber ein volck sicht / daß ein herr jrer nit mangeln kan / můß er jm etwas schedtlichs gefallen lassen.
  cs: |-
    chodit. Když však lid vidí, že se bez něho pán nemůže obejít, musí si pán dát líbit i něco, co je mu ke škodě.
- typ: odstavec
  de: |-
    Das ist aber einem jeden Kriegsherren zurathen / daß er sich einem Kürisser mit einem gůten verdeckten hengst / toppelsold zugeben keines wegs beschwere / angesehen / das ein Kürisser mit einem gůten verdeckten Hengst / solliche besoldung auff einen tag inn der handlung / wider ein jegklich Kriegsuolck in der gantzen welt / keins außgenommen / trefflich wol verdienen kan.
  cs: |-
    Každému válečnému pánu {Kriegsherren} však lze doporučit, aby se nijak nezdráhal dát kyrysníkovi {Kürisser} s dobrým krytým hřebcem[^1] dvojitý žold {toppelsold}. Kyrysník s dobrým krytým hřebcem si totiž takový žold {besoldung} dokáže za jediný den v boji proti jakémukoli válečnému lidu {Kriegsuolck} na celém světě, žádný nevyjímaje, znamenitě zasloužit.
- typ: odstavec
  de: |-
    Ein jeder Kriegsherr sei gewarnet / daß er keinen hauptman mit seinen Reutern für pferdt schaden in der bestallung stehe / er kompt sonst vnnützlich vmb vil gelts / vnd wirdt darzů betrogen.
  cs: |-
    Každý válečný pán buď varován, aby žádnému hejtmanovi {hauptman} s jeho jezdci {Reutern} neručil ve služebním listu {bestallung} za škody na koních, jinak přijde zbytečně o mnoho peněz a ještě bude ošizen.
- typ: odstavec
  de: |-
    Kan ein Kriegsherr gegen Reuttern in jrem bestelbreiff erhalten / daß jme die gefangen vom Adell zugestellt werden / damit er die jenigen so von seinem volck nider ligen lassen / vnnd abwechseln můge / soll es thůn / wann sich aber die Reuter sollich zu gar hoch beschweren oder dargegen wolten / wann jr einer gefangen würde / solte sie der herr / one jren schaden wider von feinden zu lösen schuldig sein / so were dem Herren besser / er stünde daruon / dann wann ein soldat weiß / daß jhn der Herr wann er gefangen würde wider one sein schaden vom feinde lösen můß / wehret er sich kaum halbe so sehr als sonst / der Herr hüt sich auch daß er den Reuttern für der feinde schaden / so sie den Reuttern an jren Pferden zufügen nit stande / es ist sonst aller schade den Rossen von feinden geschehen.
  cs: |-
    Dokáže-li válečný pán ve služebním listu {bestelbreiff} jezdců prosadit, aby mu byli vydáváni zajatí šlechtici, a mohl tak vykoupit[^2] a vyměnit ty ze svého lidu, kteří padnou do zajetí, má tak učinit. Kdyby se však jezdci proti tomu příliš ohrazovali nebo na oplátku žádali, aby pán byl povinen každého z nich, kdo bude zajat, bez jeho škody od nepřátel opět vykoupit, bylo by pro pána lépe od toho upustit. Ví-li totiž voják, že ho pán v případě zajetí musí bez jeho škody od nepřítele vykoupit, brání se sotva zpola tolik jako jindy. Pán ať se také varuje toho, aby jezdcům ručil za škody, které jim nepřátelé způsobí na koních; jinak by se každá škoda na koních vydávala za škodu způsobenou nepřítelem.
- typ: odstavec
  de: |-
    Noch ist ein Artickel den wöllen die Hauptleut in jren bestelbrieff haben / den Kriegsherren beschwerlich / nemlich ob ein anderer Herr / seinen Reuttern mehr besoldung gebe / soll es der Herr jnen auch zugeben schuldig sein / es were dann ein Kriegsherr auß not zu disem Artickel getrungen / sol er sich sonst gar nicht darzů lassen bewegen / diß ist auch nit lang gewesen / aber weittere Artickel in bestelbrieffen / als an vnd abzug / freien marck halten / Prouiant vmb leidlich gelt geben / so ferrn sie anderst der massen mage zu wegen gebracht werden / sampt andern Artickeln die sein anzunemen / doch werden sie auch einem Kriegsherren mit seinen darzů verstendigen / in zeit der notturff nach seiner gelegenheit heimgestelt.
  cs: |-
    Je tu ještě jeden článek, který chtějí mít hejtmani ve služebním listu a který je pro válečné pány obtížný: totiž že dává-li jiný pán svým jezdcům větší žold, má jim jej být povinen dávat i jejich pán. Ledaže by byl válečný pán k takovému článku donucen nouzí, nemá se k němu vůbec nechat pohnout; i tento článek se objevil teprve nedávno. Další články ve služebních listech, jako o příjezdu a odjezdu, o svobodném trhu a o vydávání proviantu {Prouiant} za snesitelnou cenu (pokud jej lze takto opatřit), spolu s jinými články lze přijmout. V čas potřeby se však i ty ponechávají na uvážení válečného pána a jeho znalých rádců podle jeho okolností.
- typ: odstavec
  de: |-
    Wann ein Hauptman / wie ein jeder soll seinem Fendrich den fanen beuelhen wil / soll ers thůn inhalt des Obersten Feldhaumans
  cs: |-
    Chce-li hejtman svěřit svému praporečníkovi {Fendrich} korouhev {fanen}, jak to má každý učinit, má tak učinit podle toho, co stojí u nejvyššího polního hejtmana[^3]
poznamky:
- n: 1
  text: |-
    *Verdeckter Hengst* – válečný kůň krytý koňskou zbrojí či ochrannou pokrývkou (bardou).
- n: 2
  text: |-
    V tisku „nider ligen lassen“ (ověřeno ve skenu); smysl i následující „lösen“ ukazují na tiskovou chybu místo *lösen* (vykoupit).
- n: 3
  text: V tisku „Feldhaumans“ (tiskařská chyba místo *Feldhauptmans*).
