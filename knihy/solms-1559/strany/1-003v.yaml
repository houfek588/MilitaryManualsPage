bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Beuelch/ das dardurch die Theutschen/ also im Kriegs gebrauch gewest sindt/ vnd sich der Kriegs Rüstung gehalten/ auch alle andere Lande jhre Kriegs Rüstung vnd ordunng/ von den Teutschen genomen/ vnd noch.
  cs: |-
    veleních, takže Němci byli takto zkušení ve válečném užívání a drželi se válečné výzbroje {Rüstung}; také všechny ostatní země přejaly svou válečnou výzbroj a řád[^1] od Němců a drží se jich dodnes.
- typ: odstavec
  de: |-
    Derhalben die Teutsch Nation biß noch das ordenlichst Kriegßuolck geacht ist/ mit allen Kriegsamptern vnd Regirungen/ wie noch im gebrauch seind/ von den Römern her/ von Keisern zu Keisern/ vnd in allen Kriegen die sie gefürt haben/ vnd noch/ der halben sie jhre ordentliche Regirung alwegen im gebrauch behalten/ vnd Regirt haben/ wiewol ein zeitlangk die Teutschen vil von jhren alten Regirungen gelassen/ vnd sich in vngehorsam vnd böses Regiment begeben/ das kompt anderst nirgent von/ dann das mann in der Kriegs versamlung von allen Nationen/ nicht gleiche Justitien/ Regirung helt/ vnd ordnet/ vnd vnbilliche Krieg ein zeitlang/ fürgenomen vnd gefürt hat/ durch die Haupter die solche Kriege gefürt haben/ dardurch alle Adelliche vnd Ehrliche Kriegs Regirung in abfal komen/ vnd in vngehorsam erwachsen.
  cs: |-
    Proto je německý národ až dosud pokládán za nejřádnější válečný lid {Kriegßuolck} se všemi válečnými úřady a správou, jaké jsou dosud v užívání od dob Římanů, od císařů k císařům a ve všech válkách, které vedli a vedou; proto vždy zachovávali ve zvyku svou řádnou správu a podle ní vládli. Ačkoli Němci po nějakou dobu od mnoha svých starých správ upustili a oddali se neposlušnosti a špatnému pořádku, nepochází to odnikud jinud než odtamtud, že se v shromáždění vojsk všech národů neudržuje a nenařizuje stejná spravedlnost {Justitien} a správa a že náčelníci, kteří takové války vedli, po určitou dobu předsevzali a vedli nespravedlivé války; tím veškerá ušlechtilá a čestná válečná správa upadla a vyrostla v neposlušnost.
- typ: odstavec
  de: |-
    Darumb wer gůt vnnd hoch zubedencken/ das wir Teutschen wider zu rück gedechten/ vnd giengen wider mit ernst/ in vnser alte Adelliche/ vnd gůte Regirung/ wie mann die lange zeit so rumlich vor allen Nacionen herbracht hat/ so wöllen wir wider manlich vnd Ehrlich vnser Kriege füren/ gůten gehorsam vnnd Justicien mit gůter Pollicei erhalten/ dann nichts ist Löblichers in einem Kriege dann gůt Justicien vnd Pollicei/ die behelt gůten gehorsam/ wo dann gehorsam ist/ da ist gůt Regirung/ zeugt gůt Kriegsleut/ vnd in allem gůt gedeien/ dann wo gůt gehorsam vnter dem Kriegsuolck/ mit gůter Regirung ist/ da kan mann mit einem geringen hauffen souil außrichten als mit einem Kriegsuolck/ das vngehorsam/ vnnd in böser Regirung ist/ zwei mal thůn kan.
  cs: |-
    Proto by bylo dobré a velmi hodné uvážení, abychom se my Němci rozpomněli nazpět a s vážností se navrátili do své staré ušlechtilé a dobré správy, jak se po dlouhou dobu tak slavně zachovávala před všemi národy – pak povedeme své války opět mužně a čestně a zachováme dobrou poslušnost a spravedlnost spolu s dobrým veřejným řádem {Pollicei}. Neboť ve válce není nic chvályhodnějšího než dobrá spravedlnost a veřejný řád: ty udržují dobrou poslušnost, a kde je poslušnost, tam je dobrá správa, jež vychovává dobré válečníky {Kriegsleut} a vede ke všemu dobrému zdaru; neboť kde je mezi válečným lidem dobrá poslušnost s dobrou správou, tam lze s nepatrným houfem {hauffen} vykonat tolik, co dokáže válečný lid v neposlušnosti a špatné správě stěží dvakrát.
- typ: odstavec
  de: |-
    Darumb so soll ein jeder Kriegs Herr/ sein Krieg mit bedach vnd gůtem verstendigen Rath anfahen/ ordnen vnd versehen.
  cs: |-
    Proto má každý válečný pán {Kriegs Herr} svou válku začínat, uspořádávat a zařizovat s rozmyslem[^1] a s dobrou, rozumnou radou.
- typ: odstavec
  de: |-
    Darzů die Ampter des Kriegs/ mit verstendigen vnd Ehrlichen leuten vnd Personen besetzen/ die jhre ehr/ des Hern vnd des gantzen legers nutz bedencken vnd suchen.
  cs: |-
    K tomu má válečné úřady obsadit rozumnými a čestnými lidmi a osobami, které dbají na svou čest a hledají prospěch pána i celého ležení {legers}.
- typ: odstavec
  de: |-
    Vnd nicht mit eigen nützigen geitzigen leuten/ die wie jetzt vnnd bei villen befunden/ das durch sie der Krieg in ein Kauffhandel gericht/ des Hern vnd des gemeinen Kriegsuolck nutz/ vnd gute Pollicei nit bedacht noch fürgenomen wirt.
  cs: |-
    A nikoli lidmi zištnými a chamtivými, o nichž se dnes u mnohých shledává, že jimi byla válka obrácena v kramářství a na prospěch pána a obecného válečného lidu ani na dobrý veřejný řád se nedbá a nebere zřetel.
- typ: odstavec
  de: |-
    Darumb so soll ein kriegs Herr/ der Kriege füren wil oder můß/ mit alten vnd redlichen kriegsuerstendigen/ die kriegs Ampter ordnen
  cs: |-
    Proto má válečný pán, jenž chce nebo musí vést válku, spolu se starými a poctivými znalci války válečné úřady zřizovat
poznamky:
- n: 1
  text: |-
    V originále stojí tiskařská přesmyčka *ordunng* (za *ordnung*) a dále v následujícím odstavci *bedach* (za *bedacht*).
