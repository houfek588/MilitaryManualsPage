stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vrsachen vnd sagen/ Wann ein Landtuolck in einer Besatzung ligt/ vnd es geht ein Zug durch dasselbig Landt vnd leidet dauon schaden/ vnd ein Herr schetzt sie nach darzů/ dann werden sie vnwillig/ der schaden thůt jnen wee/ gedencken vnd reden allzeit daruon/ werden des Kriegs můt/ sehen daß sie von den Feinden vnnd Freunden schaden leiden müssen/ das ein frembd volck nit thůt/ das laufft dem Krieg nach/ acht nit wie es im Landt zugehet/ dann sie leiden oder haben keinen schaden daruon/ sind des Kriegs wol zufrieden/ wolten daß er lang weret/ vnd besonder wann der Feind an das Landt grentzet oder benachbaurt ist/ Darumb soll ein Herr gůt achtung vnd versehens haben mit wem er das besetzt/ besonder mit den Haupts personen der Besatzung.
  cs: |-
    důvody a říkají: Když v posádce {Besatzung} leží zemský lid {Landtuolck} a tou zemí prochází vojenské tažení {Zug}, takže země z toho trpí škodu, a pán je k tomu ještě zdaní, stanou se nevolnými. Škoda je bolí, myslí a mluví stále jen o ní a válka je omrzí, protože vidí, že musejí snášet škodu od nepřátel i od přátel. Cizí lid to nedělá: ten jde za válkou a nedbá, jak se v zemi vede, neboť z toho žádnou škodu nemá ani netrpí. S válkou je docela spokojen a přál by si, aby trvala dlouho – zvláště když nepřítel se zemí hraničí nebo sousedí. Proto má pán dobře dbát a rozmyslet, kým [pevnost] obsadí, zvláště pokud jde o přední osoby posádky.
- typ: odstavec
  de: |-
    Vnd ein Oberster der ein Besatzung innhat/ soll erstlich besehen/ daß er ein gůt gleiche Ordnung/ Policei vnd Justitie halt/ besonder wann er mehr dann einerlei Nation hat/ vnd keiner für der andern zufal noch vortheil thů/ es geschehe dann auß billichen vrsachen/ sonder eine gleich wie die ander halte/ vnd ob sie schon alle einer Nation weren/ soll er sich in dem nichts mercken noch parteysch finden lassen/ so macht er kein Partei vnder jnen/ vnd hat gehorsam von allen theilen/ wann er allein eine Nation vor der andern halten wolt/ dann macht er sie parteysch vnder einander/ vnd bekomen ein widerwillen gegen jm/ sind vngehorsam/ thůn nichts mit willen/ wann aber ein Nation sich vor der andern wol oder vbel hilt/ dann soll der Oberst ein jede nach jrer haltung widerumb halten/ doch nit mit der Justitien oder Policei/ kan in dem wol andere weg der vergleichung oder mittel finden/ vnd die Policei vnd vorgenomene Ordnung/ so die gůt ist/ in jrem wesen vnd gang bleiben lassen.
  cs: |-
    Plukovník {Oberster}, který má posádku pod sebou, má nejprve dbát, aby zachovával dobrý a rovný pořádek, veřejný řád {Policei} a justici {Justitie}, zvláště má-li více než jeden národ. Žádnému z nich nemá prokazovat přízeň ani výhodu před druhým, leda ze spravedlivých důvodů, nýbrž má s jedním zacházet stejně jako s druhým. A i kdyby byli všichni jednoho národa, nemá v tom na sobě nic dát znát ani se ukázat straníkem. Tak mezi nimi nevytvoří strany a bude mít poslušnost ode všech. Kdyby chtěl jeden národ upřednostňovat před druhým, rozdělí je ve vzájemně znesvářené strany; pojmou proti němu nevoli, budou neposlušní a nic neudělají ochotně. Chová-li se však jeden národ lépe nebo hůře než druhý, má plukovník s každým zase zacházet podle jeho chování – ne však v justici ani ve veřejném řádu. Může k tomu nalézt jiné cesty vyrovnání nebo prostředky, a veřejný řád i zavedený pořádek, je-li dobrý, ponechat v jeho platnosti a chodu.
- typ: odstavec
  de: |-
    Die Wachten sol ein Oberster in grosser sorg vnd gůter Ordnung halten/ vnd ein Nation die wachten nit allein versehen lassen/ sonder von allen Nationen auß den Rotten darzů nemen/ Hett er aber nur einer Nation volck/ soll er keiner Roten ein stedtige wacht an einem ort geben/ sonder alle nacht abwechseln was zůwachten sind.
  cs: |-
    Stráže {Wachten} má plukovník držet s velkou péčí a v dobrém pořádku. Nemá nechat stráže obstarávat jen jeden národ, nýbrž k nim brát [muže] z rot {Rotten} všech národů. Kdyby však měl lid jen jednoho národa, nemá žádné rotě dávat stálou stráž na jednom místě, nýbrž každou noc střídat ty, kdo mají držet stráž.
- typ: odstavec
  de: |-
    Dieweil dann die Prouiant das Principal stück ist/ vnd das leben dardurch erhalten wirt/ wil ich dasselbig vornemen/ vnd wie damit sol gehandelt werden/ von stück zu stück beschreiben. Erstlich wil ein Rechnung gemacht sein/ wieuil Personn in ein Besatzung groß oder klein gehören/ wann das geschehen/ darnach wieuil korn oder brot einen Monat auff sie gehet/ vnd was maß einem jeden allen tag soll geben werden/ rechnen/ daß dasselbig gewiß sein mög.
  cs: |-
    A protože proviant {Prouiant} je hlavní věc a udržuje se jím život, chci se ho ujmout a popsat kus po kuse, jak se s ním má zacházet. Nejprve je třeba spočítat, kolik osob do posádky, velké či malé, patří. Když se to stane, je třeba spočítat, kolik obilí nebo chleba na ně jde za měsíc a jakou míru má každý dostávat na každý den, aby to bylo jisté.
