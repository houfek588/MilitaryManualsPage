bloky:
- typ: nadpis
  uroven: 2
  de: Das drit Buch von der Arcolorei.
  cs: Třetí kniha o dělostřelectvu {Arcolorei}.
- typ: odstavec
  de: |-
    DIeweil ein grosser Fürst vnd Herr/ der groß Landt vnd Leut hat/ schuldig vor Gott vnd der Welt ist/ die in schutz/ schirm vnd friden souil jm das möglich/ zůhalten/ vnd so das mit gůte geschehen mag/ thůn soll/ Wo aber das durch sein Feind vnd widerwertigen/ er der gestalt nit erhalten mag/ vnd die mit gewalt mit dem Schwert vnd gegenwehr schützen vnd erhalten muß/ so soll ein Herr sich in zeit des friedens dahin geschickt gemacht haben/ mit dem das zů dem Krieg vnd gegenwehr gehöret/ daß er sich seins Feinds mit gewalt erwehren mög/ sein Landt vnd Leut im schutz/ souil jm möglich ist/ erhalten/ dasselbig wil vnd muß durch gůt geschickte personen geschehen/ zum ersten die den Krieg mit der gegenwehr zu berathschlagen wissen/ vnnd fort nach geordnetem Rathschlag mit dem werck zu volfůren können/ vnd alle zurichtung vnd notturfft darzů wissen zurichten vnd zugebrauchen.
  cs: |-
    Veliký kníže a pán, který má rozsáhlou zemi a mnoho lidu, je před Bohem i světem povinen udržovat je v ochraně, záštitě a míru, jak jen je to v jeho moci, a činit tak po dobrém, pokud to jde. Nemůže-li je však pro své nepřátele a protivníky takto zachovat a musí-li je chránit a udržovat mocí, mečem a obranou, má se pán už v době míru opatřit vším, co náleží k válce a obraně, aby se mohl svému nepříteli mocí ubránit a udržet svou zemi i lid v ochraně, jak jen je to možné. To se musí a má dít skrze dobré, obratné osoby: předně takové, které umějí radit o válce i obraně, pak dokážou podle usnesené rady věc skutkem provést a umějí k tomu připravit a užívat veškeré zařízení a potřeby.
- typ: odstavec
  de: |-
    Zum andern/ will bei solchem Krieg vnd handlung ein groß Geschütz sein/ zů aller hand zu brauchen/ im Landt auff den Flecken vnd befestungen sich zu wehren/ vnd ausserhalb dem Landt/ Schloß vnd Stat mit gewalt zu beschiessen/ vnd in dem feld zu dem schlagen gebrauchen/ Derhalben ist hienach folgent ein Geschütz groß vnd klein mit seinen masen verordnet/ mit allen jren zůgehörungen Zug vnd rüstungen beschriben/ benennt/ vnd in ein Rechnung gebracht/ darzů alle personen die solliches regieren vnnd verwalten sollen mit bericht eines jeden Ampts vnd beuelch/ was sein thůn vnd lassen sein soll/ angezeigt/ Zum ersten darzů ein person/ die höchst vnd fürnembst zu dem Geschütz/ den Zeugmeister wie volgt.
  cs: |-
    Za druhé je k takové válce a podniku zapotřebí velké dělostřelectvo {Geschütz} k všelikému užití: doma v zemi k obraně městeček a opevnění, mimo zemi k mocnému ostřelování hradů a měst a v poli k bitvě. Proto jsou níže sestavena děla velká i malá s jejich mírami a se vším příslušenstvím, potahy a výzbrojí {rüstungen} popsána, pojmenována a zahrnuta do rozpočtu. K tomu jsou uvedeny všechny osoby, které je mají řídit a spravovat, i s výkladem o úřadu a povinnostech každé z nich, co má činit a čeho se vystříhat – a předně ta osoba, která je u děl nejvyšší a nejpřednější, totiž zbrojmistr {Zeugmeister}, jak následuje.
- typ: odstavec
  de: |-
    Item/ darnach alle andere Ampter die jm zugehören/ in gleichem fall auch eines jeden Beuelch vnd außrichtung.
  cs: |-
    Dále všechny ostatní úřady, které mu podléhají, a rovněž povinnosti a úkoly každého z nich.
- typ: odstavec
  de: |-
    Darnach alles Geschütz mit sampt aller Monition/ darzů im Zeughauß/ im feld zum schlagen/ beschiessen vnd zu stürmen.
  cs: |-
    Poté veškerá děla se vší municí {Monition}, která k nim patří, ve zbrojnici {Zeughauß} i v poli k bitvě, k ostřelování a k útokům {stürmen}.
- typ: odstavec
  de: |-
    Mit den Mörsern vnd Fewerwerck zu handlen vnd zu machen.
  cs: |-
    Jak zacházet s moždíři {Mörsern} a ohňostroji {Fewerwerck} a jak je zhotovovat.
- typ: odstavec
  de: |-
    Item mit puluer/ Salpetter/ Schwefel/ Kolen vnd dergleichen zůrichten vnd zuhandeln/ wirdt alles hernach berichtlich mit gerißnen Figurn angezeigt.
  cs: |-
    Dále jak upravovat střelný prach {puluer}, ledek {Salpetter}, síru, uhlí a podobné věci a jak s nimi zacházet – to vše bude níže zevrubně vyloženo a doloženo nakreslenými obrazy.
- typ: odstavec
  de: |-
    Vnd so ein Herr nun soll vnnd muß ein feldzug haben oder thůn so soll er sich befleissen souil jm möglich ist/ das er nach alten/
  cs: |-
    A když už tedy pán má a musí podniknout či konat polní tažení {feldzug}, má se snažit, jak jen mu je možné, aby pamatoval na staré,
