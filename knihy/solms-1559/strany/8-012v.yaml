bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    pfel darinn schlecht / komen / wie die Figur anzeigt / darzů soll mann ein grossen eysen Börer machen lassen / vnd solche Pfel sollen bei der mit ein dicke haben / damit sie nit zu weit oder zu wenig durchgehen / vnd in solche dicke soll ein absatz gemacht werden / wie die Zimmerleut jre Zugnägel machen / darumb wann einer sie wil in den Baum schlagen / soll er sie mit einem auffsatz oder Handtstemppel darinn schlagen / damit die spitzen nit zerschlagen werden / vnd wann mann sie wider herauß schlagen wil / soll mann ein Holtz wie die Nageleisen / da mann die negel mit wider zuröck schlecht / machen / vnd damit herauß thůn / damit die spitzen auff beiden seiten gantz vnd gůt bleiben / vnd sollen die spitzen vornen gebrennt werden / so bleiben sie lang hart vnd gůt / Diser Creutzhäspel oder pfalbäum / wie mann sie nennen wil / sollen kurtz vnd lang vnd der gnůg gemacht werden / vnd in zeit des friedens soll mann solche Röstung auß einander schlagen / vnd verwahrlich in ein Zeughauß / biß zur zeit der not hinlegen / die dann in vil weg zu brauchen ist.
  cs: |-
    kolíky {pfel} zatlučou, vyšly křížem na obě strany, jak ukazuje vyobrazení. K tomu se má dát zhotovit velký železný nebozez {Börer}. Kolíky mají mít uprostřed ztluštění, aby neprošly příliš daleko ani příliš málo, a na tomto ztluštění se má udělat osazení, jako dělají tesaři své kolíky {Zugnägel}. Kdo je tedy chce zatlouci do trámu, má je zarážet nástavcem či ručním průbojníkem {Handtstemppel}, aby se hroty neroztloukly. A když je chce zase vytlouci, má si udělat dřevo podobné páčidlu na hřebíky {Nageleisen}, jímž se hřebíky vyrážejí zpět, a vyrazit je jím, aby hroty na obou stranách zůstaly celé a dobré. Hroty se mají vpředu opálit, pak zůstanou dlouho tvrdé a dobré. Těchto křížových ježků {Creutzhäspel} neboli kolových trámů, jak je kdo chce nazývat, se má udělat dost, krátkých i dlouhých. V době míru se má toto zařízení rozebrat a uložit pod zámek do zbrojnice {Zeughauß} až do času nouze; lze je totiž použít mnoha způsoby.
- typ: odstavec
  de: |-
    Die 21. Figur ist ein Wolnsack den mann vor das schiessen für henckt / vnd solche fölt mann mit Woln / Hawe oder Grommet auß / was zu bekomen ist / vnd vberbindt die mit schnören oder seylen / wie die Figur anzeigt / vnd solche Seck henckt mann an ein ort oder maur die mann nicht gern zerschossen hat / das helt vnd bricht dem schiessen sein krafft / daß es nit hart angehen kan / besonder wann die Seck nit hart an der maurn hangen sonder schweben / dann es helt dem schoß nit wider / sonder es weicht für der Kugeln / vnd bricht jhm die krafft.
  cs: |-
    Vyobrazení č. 21 je vlněný pytel {Wolnsack}, který se zavěšuje před [zeď] proti střelbě. Takové pytle se vycpávají vlnou, senem nebo otavou, čím je k dostání, a převazují se šňůrami či provazy, jak ukazuje vyobrazení. Zavěšují se na místo nebo zeď, kterou nechce mít člověk rozstřílenou. To zadrží a zlomí sílu střelby, takže nemůže tvrdě dopadnout, zvláště když pytle nevisí natěsno u zdi, nýbrž volně se houpou: nekladou totiž výstřelu odpor, nýbrž před koulí {Kugeln} uhnou a zlomí její sílu.
- typ: odstavec
  de: |-
    Deßgleichen mag einer solche Seck / wie sie gefölt sind / auch für löcher oder löcken so die geschossen würden / vor zuwaltzen vnd zuhinder setzen / dann es mag leicht daß einen Storm verhindert / Vnd die weil mann sagt / einer soll Wolseck fürhencken / soll es nit dahin verstanden werden / daß sie mit Woln müsten außgefült sein / sonder einer mag Haw / Stro oder was mann hat / darinn thůn / sie heissen nur Wolsteck.
  cs: |-
    Stejně tak lze takové pytle, jak jsou vycpané, přivalit před otvory či průlomy {löcken}, kdyby byly vystříleny, a postavit je za ně; to totiž snadno může zmařit útok {Storm}. A když se říká, že se mají zavěsit vlněné pytle, nemá se tomu rozumět tak, že by musely být vycpány vlnou; lze do nich dát seno, slámu nebo cokoli, co je po ruce – jen se jim tak říká.
- typ: odstavec
  de: |-
    Die 22. Figur oder Ton soll mann mit einem zerfallenen vnd mülligen Kalck föllen / vnd inn derselbigen Ton in der mit im Kalck soll ein Erdener Dopff oder Haffen stehn / vnd oben ein loch haben / daß mann ein eysen Rör darinn stecken kan / vnd die Rör soll eins Daumen weit sein / vnd den Haffen sol mann in die mitte der Ton setzen / das mach also / Fölle die Ton mit gestossenem Kalck nit gar in die
  cs: |-
    Vyobrazení č. 22 neboli soudek {Ton} se má naplnit rozpadlým, práškovým vápnem {Kalck}. V tomto soudku má uprostřed ve vápně stát hliněný hrnec neboli hrnek {Haffen} a nahoře mít otvor, aby se do něj dala zastrčit železná trubka {Rör}; trubka má být na palec široká. Hrnec se má postavit doprostřed soudku. Udělej to takto. Naplň soudek drceným vápnem ne zcela do
