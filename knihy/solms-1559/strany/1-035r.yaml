bloky:
- typ: nadpis
  uroven: 3
  de: Son.
  cs: Syn.
- typ: odstavec
  de: |-
    LIeber alter Vatter vnd freund / jr habt euch allwegen gegen mir freundtlich erzeiget / dieweil ich am Hoff gewesen bin / mich allezeit gestrafft / gůtlich vnderwisen vnnd vndersagt / wann ich mich nicht recht gehalten hab / vnd euch also gegen mir erzeigt / daß ichs nicht anders hab verstehn künden / dann daß jr es gegen mir freundtlich vnd trewlich gemeint habt / vnnd kan ich dasselbig wider vmb euch verdienen / so will ich das mit gantzem willen vnd gůtem hertzen thůn.
  cs: |-
    Milý starý otče a příteli, po celý čas, co jsem byl u dvora, jste se ke mně choval přívětivě: vždy jste mne napomínal, laskavě poučoval a domlouval mi, když jsem se nechoval správně. Choval jste se ke mně tak, že jsem to nemohl chápat jinak, než že to se mnou myslíte přátelsky a věrně. Mohu-li vám to nějak oplatit, učiním tak z celé vůle a z dobrého srdce.
- typ: nadpis
  uroven: 3
  de: Alter Vatter.
  cs: Starý otec.
- typ: odstavec
  de: |-
    Lieber Son es ist war wie du sagt / daß ich dich allezeit / wann ich etwas gesehen hab / das dir nicht wol angestanden hat / vnnd dir zu nachteil hett künden reichen / vndersagt / vnd dich anders geweist vnd vnderricht / das hab ich warlich auß gůtem hertzen gethan / dann ich hab allwegen ein gůt gemüt zu dir gehabt vnnd noch / so seind deine Freund mir also bekant / daß ich mich allezeit vnd noch gůts zu jnen versehe / derhalben ich das gern gethan hab / in ansehen / daß du von ehrlicher gůter freundschafft bist / so hab ich jetzund fast gern gehort / daß du solches erkennest / daß ich solliches gegen dir trewlich vnd gůt gemeint hab / vnd du dasselbig gegen mir danckbar bist.
  cs: |-
    Milý synu, je pravda, jak říkáš,[^1] že jsem ti vždy domlouval, kdykoli jsem viděl něco, co ti nepřístálo a mohlo ti být ke škodě, a jinak tě vedl a poučoval. To jsem věru činil z dobrého srdce, neboť jsem k tobě vždy choval dobrou náklonnost a chovám ji dosud. Také tvé příbuzné[^2] znám tak dobře, že jsem od nich vždy čekal jen dobré a čekám dosud; proto jsem to rád dělal s ohledem na to, že pocházíš ze ctihodného a dobrého rodu. Velmi rád jsem tedy nyní slyšel, že uznáváš, že jsem to s tebou myslel věrně a dobře, a že jsi mi za to vděčný.
- typ: nadpis
  uroven: 3
  de: Son.
  cs: Syn.
- typ: odstavec
  de: |-
    Ja lieber alter Vatter ich bedanck michs billich / dann ich hab sitter der zeit wol daran gedacht / vnd verstanden daß jres trewlich mit mir gemeint habt / es ist mit leit daß ich es zu der zeit nicht verstanden hab / vnd euch mehr gefolgt hett.
  cs: |-
    Ano, milý starý otče, právem vám za to děkuji, neboť jsem na to od té doby často myslel a pochopil, že jste to se mnou myslel věrně. Je mi líto,[^3] že jsem tomu tehdy nerozuměl a víc vás neposlouchal.
- typ: nadpis
  uroven: 3
  de: Alter Vatter.
  cs: Starý otec.
- typ: odstavec
  de: |-
    Ja lieber Son es ist noch nichts verseumpt / vnnd ist wol daß ein junger gesell volgt / dann die jugent versteht es nit / sonder leßt jnen die freiheit gefallen / vnd fert etwan nicht wol darmit daruon / dann muß mann denselbigen wehrn vnd einreden.
  cs: |-
    Ano, milý synu, ještě není nic zameškáno, a je dobře, když mladík poslechne. Mládí tomu totiž nerozumí, líbí se mu volnost a leckdy s ní nepochodí dobře; proto je třeba mladé lidi krotit a domlouvat jim.
- typ: nadpis
  uroven: 3
  de: Son.
  cs: Syn.
- typ: odstavec
  de: |-
    Ja lieber alter Vatter es ist die jugent dessen nit verstendig gnůg / darumb muß dieselbig vnderricht werden / vnd leiden daß mann sie vnderweißt / Vnd dieweil ich dann in meiner jugent befunden / daß jr solches darinn bewisen vnd anmuttung gethan habt / so werd ich verursacht euch weitter mein vorhaben anzuzeigen / vnnd ewren Rath darinn bitten / als zu dem da ich zu forderen vnnd gůt vnderweisung
  cs: |-
    Ano, milý starý otče, mládí v tom nemá dost rozumu, proto musí být poučováno a strpět, aby je druzí vedli. A protože jsem ve svém mládí poznal, že jste mi tuto péči prokazoval a povzbuzoval mne, cítím se povinen svěřit vám dále svůj záměr a poprosit vás v něm o radu – vás, u něhož jsem už dříve nacházel[^4] podporu, dobré poučení
poznamky:
- n: 1
  text: V tisku *sagt* za *sagst*.
- n: 2
  text: |-
    Dobový výraz *Freund* / *Freundschaft* zde označuje příbuzné a rod.
- n: 3
  text: V tisku *mit leit* – tisková chyba za *mir leit* („je mi líto“).
- n: 4
  text: |-
    V tisku *zu forderen*, zřejmě ve smyslu *Förderung* („podpora, přímluva“); možné je i čtení *zuvorderst* („především“).
