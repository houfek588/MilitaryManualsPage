  popis: |-
    Celostránkový dřevořez řadového praporečníka pěchoty v obloukovém rámu s rostlinným dekorem v cviklech (signováno monogramem HD – Hans Döring – dole vpravo na pařezu): vousatý praporečník v baretu s bohatým péřovým chocholem, v drátěném límci, prostřiženém kabátci a nabíraných lancknechtských nohavicích, s kordem u boku stojí v otevřené říční krajině s městem, mostem a hradem na kopci a pravou rukou pozvedá rozvinutý praporec s říšským dvouhlavým orlem, korunou, erbem a řetězem Řádu zlatého rouna.
