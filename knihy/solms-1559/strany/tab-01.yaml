  popis: |-
    Rozkládací dvoustránkový dřevořez (monogram HD – Hans Döring, datováno 1546) znázorňující poradu válečného pána s válečnými rady pod rozložitým stromem; v pozadí za řekou dvě města s kostelem a hradbami. Vlevo sedí na lavici starší vousatý muž ve vysokém klobouku s pery a se zlatým řetězem (zřejmě válečný pán), který rozpřaženou rukou promlouvá, za ním a vedle něho tři radové v baretech a v prošívaných či kroužkových kabátcích. Vpravo naproti sedí další tři radové v bohatém renesančním šatu s prostřihovanými rukávy a s meči; jeden z nich v širokém klobouku s chocholem ukazuje na popsaný list. V popředí klečí u šikmého psacího pultu na okované truhle písař a zapisuje perem.
