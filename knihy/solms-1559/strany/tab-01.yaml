  popis: |-
    Rozkládací dvojlistový dřevořez (monogram HD – Hans Döring, datován 1546) znázorňující poradu válečného pána s jeho válečnými rady před následujícím textem: pod rozložitým stromem v krajině před dvojicí opevněných měst sedí šest mužů v bohatých renesančních šatech a kloboucích s chocholy; jeden z radů vpravo drží popsaný list s články, zatímco v popředí před nimi sedí na okované truhle písař u psacího pultu s perem a úhelníkem.
