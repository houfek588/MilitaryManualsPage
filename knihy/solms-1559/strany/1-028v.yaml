bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    würde aber ein Ampts person odder verwalter ein ander meinung vorhaben die er vermeint besser zusein / soll er dieselbig dem Commissarien anzeigen / dem Obersten zusagen odder selber zu dem Obersten komen mit jm daruon reden / vnd was sie sich dann vergleichen / nachkommen / vnd zum fleissigsten außrichten / vnnd wann es gleich kein Commissarius were / vnd der oberst Feldherr schickt einn geringern / dann soll die Amps person handeln wie vermelt / gehorsam vnnd willig sein.
  cs: |-
    měla-li by však úřední osoba či správce jiné mínění, které pokládá za lepší, má je oznámit komisaři {Commissarien}, aby je vyřídil plukovníkovi {Obersten}, anebo sám přijít k plukovníkovi a promluvit si s ním o tom; na čem se pak shodnou, podle toho má postupovat a co nejpilněji to vykonat. A i kdyby to nebyl komisař a nejvyšší válečný pán {oberst Feldherr} poslal někoho nižšího postavení, má úřední osoba jednat, jak bylo řečeno, a být poslušná a ochotná.
- typ: odstavec
  de: |-
    Darumb will ich nit / daß es dahin soll verstanden werden / als daß man mit keinem Commissarien handeln soll / sonder allein wirt vermelt von den Commissarien die alle Regirung vermeinen zuwissen vnd maß geben wöllen / mit sollichem erbieten / als wann sie der Feldoberst selbst weren / wie wol gesehen ist worden / Das soll nicht sein / besonder mit den hohen Amptern / dann mit denselbigen sollen die Commissarien mit vernunfft handeln vnnd faren / so bleiben sie desto vertrewlicher bei einander / vnnd künden einander mit rath vnd hilff beistehen / des Herren vnnd Legers oder gantzen Kriegs besten nutzen suchen vnd handeln / das wert vnd bestehet bei einander / vnd wirt wol vnd eintrechtig dardurch regirt.
  cs: |-
    Nechci proto, aby se tomu rozumělo tak, že by se s žádným komisařem nemělo jednat; mluví se tu jen o těch komisařích, kteří se domnívají, že rozumějí veškeré správě, a chtějí předpisovat míru s takovým vystupováním, jako by sami byli nejvyšším polním hejtmanem {Feldoberst}, jak se už vídalo. To se dít nemá, zvláště ne u vysokých úřadů: s těmi mají komisaři jednat a zacházet rozumně. Tak spolu zůstanou v tím větší důvěře, mohou si navzájem pomáhat radou i skutkem a hledat a prosazovat co největší prospěch pána, ležení {Legers} i celé války. To pak vydrží a obstojí pospolu a vládne se tím dobře a svorně.
- typ: odstavec
  de: |-
    Derwegen soll ein Feldoberster sich befleissen / daß er mit seinen Ampts personen odder verwaltern selber handel / das macht sie forchtsam / dann wann ein Herr befindt / daß ein Ampt nicht wol geregirt wirt oder geht / soll der Herr sie selber erfordern / vnd sagen : Ich werde bericht / daß in deiner verwaltung die mengel seien / was die vrsachen seind / kan er bestendigen bericht darauff geben / ist gůt / so soll ein Herr sich mit denen die darzů dienlich berathen / wie das zuwenden sein mag / vnd auff bessere wege richten / alßdan die Ampts person wider beuelch darin gebe vnd behilfflich sei.
  cs: |-
    Proto se má nejvyšší polní hejtman snažit jednat se svými úředními osobami nebo správci sám; to v nich budí bázeň. Shledá-li totiž pán, že některý úřad není dobře řízen nebo nefunguje, má si je sám povolat a říci: „Dostávám zprávu, že ve tvé správě jsou tyto nedostatky. Jaké jsou jejich příčiny?“ Dokáže-li [správce] na to podat spolehlivou zprávu, dobře; pak se má pán poradit s těmi, kdo se k tomu hodí, jak to lze napravit a uvést na lepší cestu, a úřední osoba má pak v té věci opět vydávat rozkazy[^1] a být nápomocna.
- typ: odstavec
  de: |-
    Wann ein Herr das fleissig thůt wirt er gehorsam Ampts personen ziehen / vnd erfehrt auch die gelegenheit wie es zugeht / daruon zubesorgen ist / es gehe vnderweilen seltzam zů / daß mann nicht wolt daß der Herr alle gelegenheit wiste.
  cs: |-
    Činí-li to pán pilně, vychová si poslušné úřední osoby a pozná i, jak to doopravdy chodí; je se totiž třeba obávat, že se občas dějí podivné věci, o jejichž okolnostech by někdo nechtěl, aby pán věděl.
- typ: odstavec
  de: |-
    Darumb ist einem Herren zu rathen daß er vil mit seinn Kriegs Ampts personen selber handel / vnd hör wie es mit den Regirungen gehet / weiß dann der Herr oder sein Commissarius etwas / das nit recht geht / dann seind sie das zusagen schuldig / so hat ein Herr sich dann mit jnen zu vnderreden / vnd mit rath jn selber auff bessere weg vnd ordnung richten / so möchts wol komen daß die Ampts person auch etwas wissen würden / vnd sagen das ander Leut auch betreffen möcht / so kompt der Feldherr hinder alle sachen / dann es seind seltzam
  cs: |-
    Proto lze pánovi radit, aby se svými osobami válečných úřadů hodně jednal sám a vyslechl, jak se daří správě. Ví-li pak pán nebo jeho komisař o něčem, co nejde, jak má – a jsou povinni mu to oznámit –, má si s nimi pán promluvit a sám to s radou uvést na lepší cestu a do pořádku. Snadno se také může stát, že úřední osoby budou vědět i o něčem dalším a řeknou, co by se mohlo týkat i jiných lidí; tak se válečný pán {Feldherr} dostane na kloub všem věcem. Vyskytují se totiž podivné
poznamky:
- n: 1
  text: |-
    V tisku slovesný tvar *gebe* (patrně konjunktiv či sazečská odchylka místo *geben* v závislosti na *soll*, případně změna podmětu na úřední osobu).
