  de: |-
    Hertzog Moritzen zu sachssen / etc. Reuter welche durch Andres Pflůgen beworben / vnd seind gemustert worden durch Reinharten Grauen zu solms / etc. vnd Christoffeln von schawenburg / etc. Donerstags des 29 tag May / Anno / etc. 44.
  cs: |-
    Jezdci {Reuter} vévody Mořice Saského atd., které naverboval Andres Pflůg a které přehlédli Reinhart, hrabě ze Solmsu atd., a Christoffel von Schawenburg atd. ve čtvrtek 29. května léta [15]44.[^2]
poznamky:
- n: 1
  text: |-
    Pokračování rejstříku ze [[6-007r|strany 7r]]; první „součet strany“ (Summa lateris) shrnuje předchozí stranu. Tištěná čísla oddílu 5 (Hans von Dieskau: kyrysníci 11, trénní koně 9) a oddílu 8 (trénní koně 6) se neshodují se součtem strany (kyrysníci 3, trénní koně 5); součty i celkové sumy odpovídají spíše hodnotám 1, 1 a 1, takže jde patrně o chyby sazby. Také součet vozů levého sloupce je vytištěn jen jako „½“, ačkoli z položek i z celkového počtu 15 vozů vychází 4½. Polovina vozu znamená podíl na společném voze dvou oddílů.
- n: 2
  text: |-
    Andres Pflůg (Pflug) – patrně příslušník saského šlechtického rodu Pflugků. Jména osob v rejstříku jsou ponechána v podobě tisku (Hanß von Dyßkaw = Hans von Dieskau, Velrich von Maltitz = Ulrich von Maltitz). Rejstřík jeho jezdců pokračuje na [[6-008r|další straně]]. Celková suma se shoduje: 1992 + 96 + 84 + 360 + 16 = 2548 zl.; kyrysníci dostávají 12 zl. navíc k žoldu zbrojného koně.
