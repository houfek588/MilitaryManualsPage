  popis: |-
    Osm obrazových karet římské strany, tištěných červeně (i živé záhlaví strany je červené), protějšek černých karet Hannibalovy strany na [[7-004r|listu 4]]; pořadí po řádcích zleva doprava: 1. polní plukovník – jízdní průvod s korouhvičkou na žerdi; 2. šlechtic dělostřelectva – jezdec s vysokým chocholem mezi pěšími dělostřelci s holemi s rozeklanými konci; 3. polní maršálek – jezdec v klobouku uprostřed jízdy se dvěma žerděmi; 4. mistr vozové hradby – jezdec vpředu a skupina jezdců za ním; 5. kapitán justice – pěší s obnaženým mečem a halapartníci, jezdec s žerdí a další jezdci; 6. vozmistr – jezdec vpředu a skupina jezdců s chocholy; 7. kapitán dělostřelectva – jezdec před skupinou jezdců; 8. bez nápisu – pět jezdců, z toho trubači s troubami. Oproti černé straně jsou karty 5–7 seřazeny v jiném pořadí a některé jsou z jiných štočků.
