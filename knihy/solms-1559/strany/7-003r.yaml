id: 7-003r
list: 3 (7. kniha)
strana: recto
sken: 553
stav: prelozeno
overeno_clovekem: false
bloky:
- typ: nadpis
  uroven: 3
  de: Volgt noch ein weitterer Bericht/ wie das Kartenspiel gebraucht soll werden.
  cs: Následuje ještě další zpráva, jak se má karetní hra {Kartenspiel} užívat.
- typ: odstavec
  de: |-
    WAnn ein junger Kriegßman zu lernen außzeugt/ soll er gůt erfarung vnd auffsehens haben/ wer alle Obersten die das Regiment haben seien/ auch wie ein jeder mit namen heist/ fleissig beschreiben/ deßgleichen die so Reutter füren/ als Ritmeister/ hoch vnd niderst Stants/ sie füren vil oder wenig/ vnd was für Rüstung vnnd zall ein jeder hat/ auch alle Obersten vber das füßuolck/ er sei ein General vber alles Kriegßuolck oder Regiment/ groß oder klein/ wie dem ist/ deßgleichen was von Adel vnder einem jeden Fendlin liget/ auch das Geschütz groß vnd klein von aller gattung/ wieuil der ist vnnd namen hat/ wer das verwalt vnd wer sie seien/ vnd weitter wann er dann solchs alles auff sein Karten fleissig vnd vnderschiedlich beschrieben hat/ soll er fleissig achtung haben/ wann mann zeugt wie die zugordnung helt vnd gemacht ist/ was vor vnd nach zeugt/ auch wie das geschütz/ Wagen vnd Droß im zug hinden vnnd vorn geordnet ist/ Vnd wann er dann in sein Losament kompt/ so lege er die Karten nach einander wie er den zug mit allem Kriegßuolck vnd Rüstungen/ behalten hat/ wann solches geschehen/ soll er es beschreiben/ dann es vil besser vorm gesicht dann auß dem sinn zu schreiben ist. Ja mag einer auch sagen/ was ist mehr das legen nütz oder von nöten/ dieweil ichs auß dem sinn legen soll/ dann ichs eben so wol vnd bald auß dem sinn schreiben wolt.
  cs: |-
    Když mladý válečník {Kriegßman} vytáhne do pole, aby se učil, má mít dobrou zkušenost a bedlivě sledovat, kdo jsou všichni plukovníci {Obersten}, kteří mají velení, a jak se každý jmenuje, a pečlivě si to zapsat; rovněž ty, kdo vedou jezdce {Reutter}, jako rytmistry {Ritmeister} vysokého i nejnižšího stavu {Stants}, ať jich vedou mnoho, nebo málo, a jakou výzbroj {Rüstung} a jaký počet kdo má; také všechny plukovníky nad pěchotou {füßuolck}, ať je to generál {General} nad veškerým válečným lidem {Kriegßuolck}, nebo nad plukem {Regiment}, velkým či malým, jak už to je; rovněž kdo ze šlechty slouží pod kterým praporcem {Fendlin}; také děla {Geschütz} velká i malá všech druhů, kolik jich je a jak se jmenují, kdo je spravuje a kdo jsou. A když si to všechno pečlivě a rozlišeně zapsal na své karty, má dále bedlivě dávat pozor, když se táhne, jak je pochodový řád {zugordnung} sestaven a uspořádán, co táhne vpředu a co vzadu a také jak jsou na pochodu vzadu a vpředu seřazena děla, vozy a trén {Droß}. Když pak přijde do svého ubytování {Losament}, ať rozloží karty za sebou tak, jak si zapamatoval pochod se vším válečným lidem a výzbrojí; když se to stane, má to zapsat, neboť je mnohem lepší psát podle toho, co má člověk před očima, než zpaměti. Může ovšem někdo také namítnout: K čemu je to rozkládání dobré nebo potřebné, když to mám skládat zpaměti? To bych to přece stejně dobře a rychle mohl zpaměti napsat.
- typ: odstavec
  de: |-
    Das hat aber nicht die meinung/ dann tägliche erfarung bringt mit/ daß ein ding nimmermehr so wol auß dem sinn als auß dem augenschein so mann vor jm hat/ schreiben kan/ dann wann einer vermeint in seinem sinn/ er hab sein ding wol versehn vnd außgericht/ so fehlet es jm doch noch weit/ welches dann auß dem augenschein oder schrifftlichen bericht vil besser zu legen vnnd zu ordnen ist/ auch nicht so leichtlich jrr darinn wirt/ Derhalben soll keiner sich die mühe verdriessen lassen/ daß ers fein ordentlich vnd fleissig beschreib/ dann es gůt vnd behendt darnach mag gelegt werden/ wie dann ein jeglicher bei jm das zu besserem verstandt üben vnd brauchen kan.
  cs: |-
    Tak tomu však není, neboť každodenní zkušenost ukazuje, že věc nikdy nelze napsat zpaměti tak dobře jako podle toho, co má člověk před očima. Když si totiž někdo v duchu myslí, že svou věc dobře opatřil a vyřídil, přece mu ještě mnoho chybí. To se pak dá podle toho, co člověk vidí, nebo podle písemné zprávy mnohem lépe rozložit a uspořádat a člověk se v tom tak snadno nesplete. Proto ať nikoho nemrzí ta námaha, aby si to pěkně pořádně a pečlivě zapsal; potom se to dá dobře a obratně rozložit, jak to každý může u sebe pro lepší porozumění cvičit a užívat.
