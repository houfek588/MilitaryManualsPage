stav: prelozeno
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    auch kein lermen im veld machen / es sei dann ein grosse vrsach / deßhalben nach dem er euch für mäher entbeut / solt jhr oder ewer Marschalck euch fürsehen / wann die Feind auff jn stossen / soll er sich nicht mit jnen schlagen / es sei dann sach daß er stercker were dann sie / sonder soll sich mit scharmützeln auffenthalten / vnnd euch stets wissen lassen wie es jhm gehet / wann aber jhm die redt nicht so bald kompt als er notturfftig were / soll er sich hübschlich abziehen / vnnd mit dem scharmützeln auffhalten / wann er anders nicht gezwungen wirt anders zu handeln / ein solch Leger zu beschirmen wirt nicht ein wacht thůn mögen sonder vil / vnd dieselbig offt abwechseln / doch nach gůt bedüncken des Marschalcks / wann mann die wacht besetzt hat morgens frů / mag mann sie vmb mittag wider besetzen / biß die andern gessen haben. Nun wann ein theil ewer wegen in das Leger gefüret / hab ich vormals gesagt / möcht jr mit der schlachtordnung hinein ziehen vnd legern / dieweil sollen die in dem nachzug in der ordnung bleiben stehen biß daß das veld beschlossen wirt / auch wann die wacht schon besetzt / dann sol der nachzug erst in das leger ziehen / vnd alle sorg der wacht beuolhen werden / vnd ehe mann in das leger kompt je besser es ist / dann ein jeglicher legert sich baß / haben auch baß der weil das leger zubefestigen / wann jr in der feind landt / vnd besorgt die so auff der fütterung seind werden sich verseumen / solt jr auß jeglicher Rot einen zu roß der hin vnd wider in derselbigen gegen schicken / welcher die auff der Fütterung warne / vnd jnen anzeige das Feind vorhanden seien / so ferr daß jhr in einer art seind da jhr besorgt die auff der Fütterung werden euch nider geworffen / solt jhr einen mit etlichen Kriegßleuten verordnen die ob jnen halten / sonst werdet jhr einen grossen schaden empfahen.
  cs: |-
    také v poli dělat poplach {lermen}, leda by k tomu byl velký důvod. Proto když vám pošle zprávu, máte se vy nebo váš polní maršálek {Marschalck} připravit. Narazí-li na něj nepřítel, nemá se s ním bít, leda by byl silnější než on; má ho jen zdržovat šarvátkami {scharmützeln} a stále vám dávat vědět, jak se mu vede. Nepřijde-li mu však pomoc[^1] tak brzy, jak by potřeboval, má se pěkně v pořádku stáhnout a nepřítele šarvátkami zdržovat, pokud není donucen jednat jinak. K ochraně takového ležení {Leger} nestačí jedna stráž {wacht}, nýbrž je jich třeba mnoho a mají se často střídat, ovšem podle uvážení polního maršálka. Obsadí-li se stráž časně ráno, lze ji kolem poledne obsadit znovu, dokud se ostatní nenajedí. Když je tedy část vašich vozů zavezena do ležení, jak jsem řekl již dříve, můžete do něj se šikem {schlachtordnung} vtáhnout a utábořit se. Mezitím má zadní voj {nachzug} zůstat stát v šiku, dokud se pole neuzavře a dokud není obsazena i stráž; teprve potom má zadní voj vtáhnout do ležení a veškerá péče se má svěřit stráži. Čím dříve se do ležení přijde, tím lépe, neboť každý se lépe uloží a má také víc času ležení opevnit. Jste-li v nepřátelské zemi a obáváte-li se, že ti, kdo jsou na píci {fütterung}, se opozdí, máte z každé roty {Rot} poslat jednoho jezdce, aby tam projížděl sem a tam, varoval pícovníky a oznámil jim, že se blíží nepřítel. A jste-li v kraji, kde se obáváte, že vám pícovníky porazí, máte určit někoho s několika válečníky {Kriegßleuten}, kteří je budou krýt, jinak utrpíte velkou škodu.
- typ: odstavec
  de: |-
    Dieweil sich der nachzug legert soll der Marschalck sein Harnisch außthůn / erkülen / trincken oder essen wann es jhm gefelt / nachuolgends ein ring Harnisch anlegen / zu jm nemen den Quartir vnnd Wachtmeister / oder so ferr es jm gelegen etlich Hauptleut / die er vermeint sich am besten darauff verstehen / vnd auff ein ring pferdt sitzen / das leger besichtigen / vnd den platz dahin er die jenigen so zu nacht lassen stellen hinligen wöl / oder ob er noch mehr befestigung machen soll / er soll auch dem Obersten vber die scharwacht anzeigen den platz da alweg zwen vnd zwen stehn sollen / vnd eim jeglichen sein ort zeigen / Dann die dermassen wachen sollen sich nit von jrem ort verwencken / vnd stil sein / auch so nahe bei einander das sie einander mögen hörn reden / wann nu sochs alles gethan / mag er wider in sein losament reiten / vnd zu nacht essen / dann es besser ist bald dann spat essen / nach dem
  cs: |-
    Zatímco se zadní voj ukládá, má polní maršálek sejmout zbroj {Harnisch}, ochladit se, napít se nebo najíst, bude-li chtít. Potom si má obléci lehkou zbroj, vzít s sebou kvartýrmistra a vachmistra {Quartir vnnd Wachtmeister}, případně, uzná-li za vhodné, několik hejtmanů {Hauptleut}, o nichž soudí, že se v tom vyznají nejlépe, vsednout na lehkého koně a prohlédnout ležení. Má určit místo, kam chce postavit ty, kdo v noci drží stráž, a posoudit, zda má ještě zřídit další opevnění. Plukovníkovi obchůzky {Obersten vber die scharwacht}[^2] má také ukázat místa, kde mají vždy stát po dvou, a každému ukázat jeho stanoviště. Kdo takto drží stráž, nemá se od svého místa hnout, má být zticha a stát tak blízko druhých, aby se navzájem slyšeli mluvit. Když je to vše hotovo, může odjet zpět do svého ubytování {losament} a povečeřet, neboť je lepší jíst brzy než pozdě. Po
poznamky:
- n: 1
  text: Tisk má „die redt“; čteno jako zkrácené „Rettung“ (pomoc, posila). Možné je i „Rede“ – odpověď, rozkaz.
- n: 2
  text: Scharwacht je v burgundském řádu noční stráž rozestavená po dvojicích kolem ležení, kterou vachmistři obcházejí a kontrolují; překládáno podle glosáře „obchůzka“.
