stav: prelozeno
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    kein eigens zeichen geben lassen/ das geschicht drumb wann die Feind etlich Kundtschaffter vor der Stat hetten/ vnd solchs zeichen oder vngewonlich vffblosen hörten/ würden sie gleich mercken das etwas vorhanden were/ wann sie nu jr volck als stil es geschehen mocht/ gesamlet haben/ solt jr leut haben die in derselben art steg vnd weg wol wissen denselbigen anzeigen wo sie hin wöllen/ vnd auff das ernstlichst beuelhen/ daß sie wo es anderst geschehen mag/ durch kein Dörffer noch Flecken auch keiner gemeiner landstraß furn/ wann sie sich entschlossen was wegs sie ziehen wöllen/ sollen sie einen geschickten Gesellen auß jnen erwelen/ demselbigen einen wegfurer zugeben/ vnnd ein Knecht oder zehen darzů/ vnd sie ein klein wenig voran heissen ziehen nachulogents sollen sie abermals einn daffern gesellen verordnen/ welchem sie auch der weg füren ein zugeben der jn alwegen bei jm behalte/ darmit er mit jm reden künde was die sach erfordern wölte/ Ferrner solllen sie wider ein verordnen der mit einem Kenchtzehen oder zwentzig hinden nach ziehen/ vnd wann sie jr Ordnung der massen gemacht/ wolt ich die Porten gantz still vnnd sitlich auffthůn/ die ersten eins Armbrost schoß weit hinauß ziehen lassen/ ehe das der gantz hauff hinauß zuge/ vnd da wann es bei tags zeiten ist/ warten/ ob keiner sich heimlich zu den Thorn hinauß stehle/ der den Feinden die newe zeittung anzeigte/ vnd wann es zu nachts ist zu losen ob sie nichts hören möchten/ wann sie der gestalt hinauß seind gezogen/ solt jr die Porten wider zuschliessen/ vnnd gůt achtung geben/ das keiner weder zu roß oder fuß hinauß ziehe/ er gehöre dann zu gemeltem hauffen/ Dann ich wol gesehen hab/ daß es in den Stätten da ich gelegen bin geschehen ist/ daß etlich Kundtschaffter zu Roß vnd fuß/ mit denen so auß der Stat vnder die Feind fallen haben wöllen/ herauß kommen seind/ nachuolgents sie durch allweg von jnen abgezogen/ vnd solchs den feinden angezeigt/ alßdan haben die feind ein paß oder vortheil eingenommen/ da sie für haben sollen ziehen/ vnnd jn dardurch grossen schaden zugefügt/ darumb jr gůt sorg haben solt/ vnd jnen beuelhen daß sie in solcher ordnung souil möglich ist ziehen/ in welcher sie außzogen sein/ dann gůter fleiß vnd sorg ist allwegen gůt/ vnnd wann mann zu langsam mit solchen sachen vmbgeht/ verhindert auch vil/ wann sie dermassen im zug seind/ sollen allwegen auß jnen zwen verordnet sein die einigßweiß vmb den hauffen reiten/ vnd besehen daß keiner nit entlauff/ vnd dardurch dahinden bleibe/ sonder sollen den Knechten zusprechen/ daß sie munder seien/ Jch hab wol gesehen/ daß etwan ein grosser schad hernach geuolgt ist/ wann sie der massen auff dem weg entlauffen/ wann es sich begibt das sie durch
  cs: |-
    nedávat jim žádné zvláštní znamení. To proto, že kdyby měl nepřítel před městem nějaké zvědy {Kundtschaffter} a ti uslyšeli takové znamení nebo neobvyklé troubení, hned by poznali, že se něco chystá. Když pak svůj lid co nejtišeji shromáždili, máte mít lidi, kteří v té krajině dobře znají stezky a cesty, ukázat jim, kam chtějí jít, a co nejpřísněji jim nařídit, aby je, je-li to jen trochu možné, nevedli žádnými vesnicemi ani městečky ani po obecní silnici. Když se rozhodli, kterou cestou chtějí jít, mají ze svého středu vybrat schopného chlapíka, přidat mu průvodce a k tomu asi deset knechtů {Knecht}[^1] a poručit mu, aby táhl kousek napřed. Potom mají opět určit statečného chlapíka a přidat i jemu někoho, kdo zná cestu[^2], aby ho měl stále u sebe a mohl se s ním poradit, čeho by si věc žádala. Dále mají opět určit jednoho, který potáhne vzadu s deseti nebo dvaceti knechty[^3]. Když takto uspořádali svůj šik {Ordnung}, otevřel bych brány zcela tiše a pomalu a nechal bych první vytáhnout na dostřel kuše dřív, než vytáhne celý houf. Je-li den, čekal bych tam, zda se nikdo tajně nevykrade branami ven, aby nepříteli donesl novou zprávu; je-li noc, ať naslouchají, zda nic neuslyší. Když takto vytáhli ven, máte brány opět zavřít a dobře dbát, aby nikdo, ani jízdní, ani pěší, nevyšel ven, leda by patřil k uvedenému houfu. Viděl jsem totiž, že se v městech, kde jsem ležel, stávalo, že někteří zvědové na koni i pěšky vyšli s těmi, kdo chtěli z města vpadnout na nepřítele, potom se od nich bočními cestami odpojili a oznámili to nepříteli. Nepřítel pak obsadil průsmyk nebo výhodné místo, kudy měli táhnout, a tím jim způsobil velkou škodu. Proto na to máte dobře dbát a nařídit jim, aby táhli pokud možno v tomtéž šiku, v jakém vytáhli; dobrá píle a péče je totiž vždy na místě, a když se s takovými věcmi zachází příliš zvolna, mnoho se tím také zmaří. Když jsou takto na pochodu, mají být vždy z jejich středu určeni dva, kteří budou objíždět houf dokola[^4] a dohlížet, aby nikdo neutekl a nezůstal tak pozadu, a mají knechty povzbuzovat, aby byli čilí. Viděl jsem totiž, že z toho, když cestou takto zběhli, někdy vzešla velká škoda. Stane-li se, že musí
poznamky:
- n: 1
  text: |-
    *ein Knecht oder zehen* – doslova „knechta nebo deset“, tj. zhruba deset knechtů.
- n: 2
  text: |-
    *der weg füren ein zugeben* – místo je v tisku porušené; smysl: přidat mu někoho, kdo umí vést cestu (průvodce, *wegfurer*).
- n: 3
  text: |-
    *Kenchtzehen* – tisková chyba za *Knecht zehen*; podobně v téže větě *solllen* za *sollen* a dříve *nachulogents* za *nachuolgents*.
- n: 4
  text: |-
    *einigßweiß* – tisková chyba za *ringßweiß* („dokola“), jak stojí na straně [[9-023r|9-023r]].
