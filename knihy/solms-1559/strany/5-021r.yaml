id: 5-021r
list: 21 (5. kniha)
strana: recto
sken: 477
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: nadpis
  uroven: 2
  de: Das vierdt Blochaus.
  cs: Čtvrtý srub.
- typ: odstavec
  de: |-
    Das vierdt Blochaus stehet in seiner virung vnd hat auff dreien seiten in der mit ront außgeuerdte Streichen/ vnd auff der vierdten seiten einen verdeckten auß vnd eingang.
  cs: |-
    Čtvrtý srub {Blochaus} stojí ve svém čtverci a má na třech stranách uprostřed okrouhlé vysunuté boční obrany {Streichen} a na čtvrté straně krytý východ a vchod.[^1]
poznamky:
- n: 1
  text: |-
    V tisku „außgeuerdte“ (bez *i*, jinde *außgeuierdt*); spojení *in der mit ront* = „uprostřed okrouhlé“. Vyobrazení na protější straně [[5-020v|5-020v]] tomu odpovídá (půlkruhové boční obrany uprostřed tří stran).
