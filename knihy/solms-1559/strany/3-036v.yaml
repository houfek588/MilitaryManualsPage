bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    laden will/ auffgeschniten werden/ damit sie sich im schiessen vom Puluer anzinden mög/ aber doch wöllen sie hinden starck vnd wol gebunden sein damit sie das puluer nit von einander stoß. Deßgleichen mag man thůn mit einer steinen/ auch in den Schlangen mit pleien Kugeln/ mag das Feurwerck nach der Kugeln größ hinden auß mit der stangen lang machen/ darnach die Kugel groß oder klein ist/ aber meins bedunckens/ wann das Feurwerck hinden auß an einer Eysen oder pleien Kugeln 3. lang sei/ on die recht Kugel/ dann die recht wil jr gewigt behalten/ Warumb? Die schwer geht an allem geschoß vor/ solt dann die schwer des Feurwercks schwerer sein dann die recht Kugel so wolt dasselbig vorgehn/ wer falsch vnnd betrüglich. Aber ein stein Kugel soll vber zweier Kugeln lang nit Feurwerck an jr haben/ damit sie nit vberladen werde/ dann der stein ist an jhm selber leichter dann Plei vnd Eysen/ darumb kan er die maß des Pleiß vnd Eysens nicht ertragen/ derhalben soll einem jeden nach seinem gewicht sein maß nach der schwere die prob gemacht werden/ Wie das die Figuren hernach/ wie sie sollen gemacht sein/ anzeigen werden.
  cs: |-
    nabíjet, rozříznout, aby se při výstřelu mohly od střelného prachu {Puluer} vznítit; vzadu však musí být pevně a dobře přivázány, aby je prach nerozmetal. Totéž lze udělat s kamennou koulí {Kugeln}; také u kulverin {Schlangen} s olověnými koulemi lze ohňostroj {Feurwerck} na tyči prodloužit dozadu podle toho, je-li koule velká či malá. Podle mého soudu však má být ohňostroj vzadu na železné či olověné kouli dlouhý na tři koule,[^1] nepočítaje samotnou kouli, neboť vlastní koule si má podržet převahu váhy. Proč? U každé střely letí napřed těžší část; kdyby tedy byl ohňostroj těžší než vlastní koule, letěl by napřed on, a to by bylo chybné a klamné. Kamenná koule však nemá mít na sobě ohňostroj delší než na dvě koule, aby nebyla přetížena, neboť kámen je sám o sobě lehčí než olovo a železo, a proto nesnese míru olova a železa. Pro každou kouli se tedy má podle její váhy udělat zkouška míry podle tíhy, jak ukážou nákresy, které budou následovat.
- typ: odstavec
  de: |-
    Von Feurpfeiln ist nit besonders vil zuschreiben/ wie die gemacht sein sollen/ von der form werden die gerissen figurn auch anzeigen/ aber den zeug darzů zumachen/ das seind dise hernach geschriben stück.
  cs: |-
    O zápalných šípech {Feurpfeiln} není třeba zvlášť mnoho psát, jak mají být zhotoveny; jejich tvar ukážou rovněž nakreslené obrázky. Pokud jde o přípravu zápalné hmoty k nim, platí následující předpisy.
- typ: odstavec
  de: |-
    Erstlich nim ein gemein gůt Schießpuluer vnnd ein Leinöl/ knet das wol starck vnder einander wie ein deyg/ mach darauß ballen oder fülle einn Sack damit/ vnd laß es trucken werden.
  cs: |-
    Nejprve vezmi obyčejný dobrý střelný prach a lněný olej, silně to spolu uhněť jako těsto, nadělej z toho koule nebo tím naplň pytel a nech to vyschnout.
- typ: odstavec
  de: |-
    Zum andern/ nim gůt Schießpuluer vnnd Terpentin/ mach darauß auch ein deyg/ vnd thů damit wie oben gemelt.
  cs: |-
    Za druhé: vezmi dobrý střelný prach a terpentýn, udělej z toho rovněž těsto a nalož s tím, jak bylo řečeno výše.
- typ: odstavec
  de: |-
    Zum dritten/ ein puluer angekneten mit einem Leymwasser der starck sei/ mach darauß Ballen.
  cs: |-
    Za třetí: střelný prach uhnětený silnou klihovou vodou; nadělej z toho koule.
- typ: odstavec
  de: Zum vierdten/ ein puluer angekneten mit einem Gloriet.
  cs: 'Za čtvrté: střelný prach uhnětený benátským terpentýnem {Gloriet}.'
- typ: odstavec
  de: |-
    Zum fünfften/ ein puluer angekneten mit einem gebranten Wein darinn Kampffer ist/ vnd ein geschlagen Eyer klar mit einem Gummi Tragentum darunder gemengt.
  cs: |-
    Za páté: střelný prach uhnětený pálenkou, v níž je kafr (*Kampffer*), s přimíchaným rozšlehaným vaječným bílkem a tragantovou klovatinou (*Gummi Tragentum*).
- typ: odstavec
  de: |-
    Zum sechsten/ nim gůt schießpuluer/ vnd darunder das drit theil Colofamia/ das ist Griechisch Bech.
  cs: |-
    Za šesté: vezmi dobrý střelný prach a do něho třetí díl kalafuny {Colofamia},[^2] to jest řecké smůly.
- typ: odstavec
  de: |-
    Dise stück sollen alle klein vnd wol durcheinander gestossen werden/ mit einem gebranten wein darinn Kampffer ist zerlassen/ angekneten/ oder ein gebranten wein da Salpeter in zerlassen/ ist in gleichem fal gůt/ vnd wann du ein Feurpfeil zurichten wilt/ so mach Barchen secklin nach form des Feurpfeils/ fül dieselbigen mit disem gekneten Feurzeug wol auß/ steck dann den Feurpfeil mit dem Eysen oder schafft wie er ist/ hindurch/ bindt jn hart drumb/ nim dann ein wenig flachs
  cs: |-
    Všechny tyto přísady se mají nadrobno a dobře spolu roztlouci a uhníst s pálenkou, v níž je rozpuštěn kafr; stejně dobrá je i pálenka s rozpuštěným ledkem {Salpeter}. Chceš-li připravit zápalný šíp, zhotov podle tvaru šípu barchetový váček, dobře jej naplň touto uhnětenou zápalnou hmotou, prostrč jím zápalný šíp i s hrotem či dříkem, jak je, pevně jej kolem něj přivaž a potom vezmi trochu lnu
poznamky:
- n: 1
  text: |-
    V tisku stojí zkrácené *3. lang*, tj. délka tří průměrů koule (*drei Kugeln lang*).
- n: 2
  text: V tisku *Colofamia* místo *Colophonia* (kalafuna, řecká pryskyřice).
