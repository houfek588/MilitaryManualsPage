  popis: |-
    Celostránkový dřevořez natočený o 90° na šířku, datovaný „1559“ na vnitřní zdi pravé náspy a signovaný „BF“ na skále vlevo nahoře: rozlehlý obdélný srub se třemi vysunutými baštami a jedním půlkruhovým zaobleným křídlem vlevo dole. Uvnitř nádvoří stojí dřevěný most přes vodní strouhu, vozy s municí a šik devíti polních děl v řadě; po hradbách a na bočních plošinách jsou rozestavěna další děla a dělníci.
