    Celostránkový dřevořez otočený o 90° (letopočet „1559“, monogram „BF“ vlevo nahoře) k [[5-020r|třetímu srubu]]: obdélný srub se třemi hranatými vysunutými bočními obranami (nahoře, vpravo a dole), v každé dvě až tři děla; na čtvrté straně (vlevo) vede dovnitř zahnutý krytý vchod. Uvnitř nádvoří stojí dřevěný most přes potok, vozy a řada polních děl.
