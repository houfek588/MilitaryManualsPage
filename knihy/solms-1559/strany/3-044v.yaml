bloky:
- typ: nadpis
  uroven: 3
  de: Ein ander Lere auff Feurpfeil zumachen / vnd ist auch ein wildes Feur.
  cs: Jiný návod na zhotovení ohnivých šípů {Feurpfeil}, a jest to rovněž divoký oheň {wildes Feur}
- typ: odstavec
  de: |-
    NIm 1. lot Arsenicum rubeum / 1. lot Realgar / 1. lot Rebarbaram / 1. lot Auripigmentum / 1. lot Alsponicum / 1. lot Minimum / 1. lot Mercurij Crudi / vnd thů jm recht / etc.
  cs: |-
    Vezmi 1 lot {lot} červeného arzeniku (*Arsenicum rubeum*),[^1] 1 lot realgaru (*Realgar*), 1 lot rebarbory (*Rebarbaram*),[^2] 1 lot auripigmentu (*Auripigmentum*), 1 lot asfaltu (*Alsponicum*),[^3] 1 lot suříku (*Minimum*)[^4] a 1 lot surové rtuti (*Mercurij Crudi*) a nalož s tím náležitě atd.
- typ: nadpis
  uroven: 3
  de: Also macht mann gut Feurpfeil.
  cs: Takto se dělají dobré ohnivé šípy
- typ: odstavec
  de: |-
    NIm 1. lot Arsenicum rubeum / 1. lot Reguligar / 1. lot Rebarbara / 1. lot Auripigmentum / 1. lot Aspalcum / 1. lot Minimum / 1. lot Mercurij sublimati / vnd puluer jeglichs sonderlich wol / temperir sie alle miteinander vnd mach darauß die gůten Feurpfeil / damit scheuß.
  cs: |-
    Vezmi 1 lot červeného arzeniku (*Arsenicum rubeum*), 1 lot realgaru (*Reguligar*), 1 lot rebarbory (*Rebarbara*), 1 lot auripigmentu (*Auripigmentum*), 1 lot asfaltu (*Aspalcum*), 1 lot suříku (*Minimum*) a 1 lot sublimované rtuti (*Mercurij sublimati*),[^5] každou přísadu zvlášť dobře utluč na prach, smíchej je všechny dohromady a zhotov z toho dobré ohnivé šípy, jimiž střílej.
- typ: nadpis
  uroven: 3
  de: Wilt du ein guten gerechen Feurpfeil machen.
  cs: Chceš-li zhotovit dobrý spolehlivý ohnivý šíp[^6]
- typ: odstavec
  de: |-
    SO nim 5. pfundt Salpeter / ein halb pfundt Koln / zwei pfundt Schwefel / vnd stoß das in einem Mörser gar wol vnder einander / thů Oleum benedictum vnd gebranten wein darunder / also vil das gnůg ist / mach ein deyg darauß / vnd thů des darnach souil an die Pfeil wie du wilt / steck sie dann mit einem stecken in ein warmen stuben Ofen / daß sie wol ertrucken vnnd dörren / darnach nim den stecken mit den Feurpfeiln herauß / schab vnd formir sie wie du wilt / darnach vermach sie in Barchen / verbint sie hinden vnd vorn gar mit gůtem hanff / vnd schwemb sie in Schwefel mit gůtem hartz / so hast du herzlich gůt Feurpfeil.
  cs: |-
    Vezmi tedy 5 liber {pfundt} ledku {Salpeter}, půl libry dřevěného uhlí {Koln} a dvě libry síry {Schwefel}, utluč to velmi dobře v hmoždíři dohromady a přidej k tomu požehnaný olej (*Oleum benedictum*)[^7] a pálené víno, kolik bude stačit. Udělej z toho těsto a nanes jej na šípy, kolik chceš; potom je na tyčce strč do teplých světnicových kamen, aby dobře vyschly a uschly. Poté vyjmi tyčku s ohnivými šípy, oškrábej je a vytvaruj, jak chceš; následně je zašij do barchetu, pevně je vzadu i vpředu obvaž dobrým konopím a namoč je v síře s dobrou pryskyřicí – tak budeš mít znamenitě dobré ohnivé šípy.
- typ: nadpis
  uroven: 3
  de: Ander gut Feurpfeil zumachen.
  cs: Jak udělat jiné dobré ohnivé šípy
- typ: odstavec
  de: |-
    NIm secklin auß Barchen gemacht / vnd gemacht Puluer / thů es in die secklin / fülle sie wol vnd stoß aber den Pfeil dardurch / der darzů gehört / bindt es vnden vnd oben mit einem zwifachen fadem / vnd merck daß das Puluer mit gebrantem wein vnd öle zusamen gekneten sei / wie vor geschriben steht.
  cs: |-
    Vezmi pytlíčky ušité z barchetu a připravený prach {Puluer}, nasyp jej do pytlíčků, dobře je naplň a opět jimi prostrč šíp, který k tomu náleží; svaž je dole i nahoře dvojitou nití a pamatuj, že prach má být uhněten s páleným vínem a olejem, jak je psáno výše.
- typ: nadpis
  uroven: 3
  de: Ein guten Feurpfeil der nicht verdirbt / wie langer ligt / vnd auch nicht rostig wirt / zu machen.
  cs: Jak zhotovit dobrý ohnivý šíp, který se nezkazí, ať leží jakkoli dlouho, a ani nezrezaví
poznamky:
- n: 1
  text: |-
    Červený sulfid arsenitý (realgar) a žlutý sulfid arsenitý (*Auripigmentum*) se užívaly v dobových ohněstrůjných recepturách k zesílení žáru a jedovatosti dýmu; recept duplicitně uvádí *Arsenicum rubeum* i *Realgar* (v dalším odstavci zkomoleně *Reguligar*).
- n: 2
  text: |-
    V tisku zkomoleně *Rebarbaram* / *Rebarbara* (snad kořen reveně či zkomolený alchymický název).
- n: 3
  text: |-
    *Alsponicum* (níže *Aspalcum*) – zkomoleniny pro *Asphaltum* (židovskou smůlu / přírodní asfalt).
- n: 4
  text: |-
    Tisk má v obou receptech *Minimum*, zjevnou zkomoleninu za *Minium* (suřík, červený oxid olovnatý).
- n: 5
  text: |-
    *Mercurius crudus* = surová rtuť (živé stříbro); *Mercurius sublimatus* = chlorid rtuťnatý (sublimát).
- n: 6
  text: |-
    Tisk má tvar *gerechen* místo správného *gerechten* („řádný, pravý, spolehlivý“).
- n: 7
  text: |-
    *Oleum benedictum* („požehnaný olej“, tzv. cihlový olej neboli destilovaný olej s rozžhavenými cihlami / terpentýnový olej) byl hojně užívanou hořlavou přísadou dobové pyrotechniky.
