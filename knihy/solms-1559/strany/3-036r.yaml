bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    springete kugeln gehörn/ sollen zuuor ehe mann sie inn die Kugel thůt mit einem warmen wachs wol vberzohen/ darumb ob die Rör wolt von dem innern Zeug heiß werden/ daß sie möcht das puluer in der kugeln anzünden/ ehe dann es hinden an das ende kem/ vnd die Kugel leg/ das wer nicht gůt dann gieng die Kugel in der lufft an/ vnnd were vergeblich/ darumb ist die Rör mit dem wachs bezohen/ daß schmeltzt vnd leßt das puluer nit bald angehn/ biß die Rör zu dem ende gebrennt vnd die kugel ligt/ diß wil aber zuuor wol geeicht vnnd probiert sein/ damit der Rörn jre leng gegeben werde/ daß sie so lang brennt biß die Kugel ligt/ dergleichen muß der Zeug inn der Rörn auch gemacht werden/ daß er nit zu geschwindt brennt/ vnd doch auch nit außgeht.
  cs: |-
    tříštivých koulí {kugeln} patří, se mají před vložením do koule dobře potáhnout teplým voskem. Kdyby se totiž trubička od vnitřní hmoty rozpálila, mohla by zapálit střelný prach {puluer} v kouli dříve, než dohoří až na zadní konec a koule dopadne; to by nebylo dobré, neboť koule by vybuchla ve vzduchu a byla by k ničemu. Proto se trubička potahuje voskem: ten taje a nedovolí prachu předčasně vzplanout, dokud trubička nedohoří až na konec a koule neleží. To však vyžaduje předem dobré odměření a vyzkoušení, aby trubička dostala správnou délku a hořela tak dlouho, až koule dopadne. Stejně tak musí být připravena i hmota v trubičce, aby nehořela příliš rychle, a přece nezhasla.
- typ: nadpis
  uroven: 3
  de: |-
    Nun volgt ein anhangendes Feur/ an Eisen/ Plei vnd steinen Kugeln.
  cs: |-
    Nyní následuje oheň připevněný na železné, olověné a kamenné koule.
- typ: odstavec
  de: |-
    ITem die eysen/ steinen vnd pleien Kugeln die die größ der Büchsen haben/ darmit dasselbig in schiessen durchbrechen mög mehr dann die Feurkugeln/ welche allein von brenzeug gemacht seind/ thůn mögen/ so laß mann giessen Eysenkugeln/ die in der mit ein geuierts loch durchauß gehn haben/ in dasselbig soll mann ein Eysenstangen giessen mit einem plei darein verniet/ dieselbig mag ein span zwo oder drei hindersich lang sein/ darnach die Kugel groß/ vnnd die Büchs lang ist/ an solche stangen mag man die Kugeln vnd Feurwerck machen/ mit langen secklin vmb die stang gebunden/ strack oder gerat gedregt/ vnd gemelte secklin sollen mit einem gůten rössen Feurzeug außgefült sein/ wann sie also vmb die stangen gelegt werden/ darnach mit eim schnürgebent daruber strack bewunden/ doch soll das schnürgebent/ besonder das erst bei einem halben zwerch finger nicht an einander gehn/ auß der vrsach/ damit die däff zwischen ein mög/ vnnd was hol zwischen den gebenden vnd secklin were/ möge außlauffen/ so dann das also mit der däff oder schmem verglichen ist/ mag mann wider wie vor der gefülten secklin mit dem Feurzeug darauff legen/ wider binden mit einem schnürgebent auß däffen oder schmemen/ wie vor/ biß so lang das es der kugeln gleich ist/ doch soll durch die eysen stangen/ vorn bei der kugeln creutzweiß löcher hindurch gehen/ deßgleichen hinden am ende durch solliche löcher starcke eysene stefft durch wie ein creutz/ Geschicht auß der vrsach/ das mann das Feurwerck/ daran binden mag/ damit sich im schiessen die stangen mit der Kugeln nit von Feurwerck außstrauffen/ vnd die secklin da das Feurwerck in ist/ soll hinden am hindersten creutz/ so man die Büchsen
  cs: |-
    Dále: aby železné, kamenné a olověné koule, které mají velikost [vývrtu] děla {Büchsen}, mohly při výstřelu prorazit víc, než dokážou ohnivé koule {Feurkugeln} zhotovené jen ze zápalné hmoty, nechají se odlít železné koule, jimiž uprostřed prochází skrz naskrz čtverhranný otvor. Do něj se zalije železná tyč a zanýtuje se olovem; může být dozadu dlouhá jednu, dvě nebo tři pídě podle velikosti koule a délky děla. Na takové tyči lze kouli opatřit ohňostrojem {Feurwerck}: kolem tyče se přivážou dlouhé váčky, položené rovně a přímo [podél ní], a tyto váčky mají být naplněny dobrou prudkou zápalnou hmotou. Když se takto položí kolem tyče, ovinou se pevně provazovým ovázáním {schnürgebent}; toto ovázání, zvláště první, však nemá k sobě doléhat, nýbrž mezi závity má zůstat mezera na půl prstu napříč, aby mezi ně mohla vniknout zápalná lázeň {däff}[^1] a zatéct do dutin mezi ovázáním a váčky. Když se to takto zápalnou lázní čili máčením vyrovná, může se na to znovu jako prve položit vrstva váčků naplněných zápalnou hmotou, opět ovázat provazovým ovázáním a ponořit do zápalné lázně či namáčet jako předtím, dokud to nebude stejně silné jako koule. Železnou tyčí však mají vpředu u koule křížem procházet otvory, a stejně tak vzadu na konci; těmito otvory se prostrčí silné železné kolíky do kříže. To se děje proto, aby se k nim ohňostroj mohl přivázat a aby se tyč s koulí při výstřelu z ohňostroje nevysmekla. Váčky, v nichž je zápalná hmota, se mají vzadu u zadního kříže, až se bude dělo
poznamky:
- n: 1
  text: V tisku stojí *däff oder schmem* (níže *auß däffen oder schmemen*), tj. patrně *däffen oder schwemmen* („zalít zápalnou lázní čili namáčet“); *schmem* je sazečská obměna či chyba za *schwem*.
