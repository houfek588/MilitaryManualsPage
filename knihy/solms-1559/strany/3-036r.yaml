bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    springete kugeln gehörn/ sollen zuuor ehe mann sie inn die Kugel thůt mit einem warmen wachs wol vberzohen/ darumb ob die Rör wolt von dem innern Zeug heiß werden/ daß sie möcht das puluer in der kugeln anzünden/ ehe dann es hinden an das ende kem/ vnd die Kugel leg/ das wer nicht gůt dann gieng die Kugel in der lufft an/ vnnd were vergeblich/ darumb ist die Rör mit dem wachs bezohen/ daß schmeltzt vnd leßt das puluer nit bald angehn/ biß die Rör zu dem ende gebrennt vnd die kugel ligt/ diß wil aber zuuor wol geeicht vnnd probiert sein/ damit der Rörn jre leng gegeben werde/ daß sie so lang brennt biß die Kugel ligt/ dergleichen muß der Zeug inn der Rörn auch gemacht werden/ daß er nit zu geschwindt brennt/ vnd doch auch nit außgeht.
  cs: |-
    tříštivých koulí {kugeln} náleží, se mají dříve, než se do koule vloží, dobře potáhnout teplým voskem – proto, kdyby se trubička chtěla od vnitřní směsi rozpálit, aby nezapálila střelný prach {puluer} v kouli dříve, než dohoří až na zadní konec a než koule dopadne; to by nebylo dobré, neboť by koule vybuchla ve vzduchu a byla by zmařena. Proto je trubička potažena voskem, ten taje a nedovolí prachu předčasně vzplanout, dokud trubička nedohoří až na konec a koule neleží. To však vyžaduje předem dobré vyzkoušení a odměření, aby byla trubičce dána pravá délka, tak aby hořela tak dlouho, než koule dopadne; stejně tak musí být připravena i hmota v trubičce, aby nehořela příliš rychle, a přece ani nezhasla.
- typ: nadpis
  uroven: 3
  de: |-
    Nun volgt ein anhangendes Feur/ an Eisen/ Plei vnd steinen Kugeln.
  cs: |-
    Nyní následuje připevněný oheň na železných, olověných a kamenných koulích.
- typ: odstavec
  de: |-
    ITem die eysen/ steinen vnd pleien Kugeln die die größ der Büchsen haben/ darmit dasselbig in schiessen durchbrechen mög mehr dann die Feurkugeln/ welche allein von brenzeug gemacht seind/ thůn mögen/ so laß mann giessen Eysenkugeln/ die in der mit ein geuierts loch durchauß gehn haben/ in dasselbig soll mann ein Eysenstangen giessen mit einem plei darein verniet/ dieselbig mag ein span zwo oder drei hindersich lang sein/ darnach die Kugel groß/ vnnd die Büchs lang ist/ an solche stangen mag man die Kugeln vnd Feurwerck machen/ mit langen secklin vmb die stang gebunden/ strack oder gerat gedregt/ vnd gemelte secklin sollen mit einem gůten rössen Feurzeug außgefült sein/ wann sie also vmb die stangen gelegt werden/ darnach mit eim schnürgebent daruber strack bewunden/ doch soll das schnürgebent/ besonder das erst bei einem halben zwerch finger nicht an einander gehn/ auß der vrsach/ damit die däff zwischen ein mög/ vnnd was hol zwischen den gebenden vnd secklin were/ möge außlauffen/ so dann das also mit der däff oder schmem verglichen ist/ mag mann wider wie vor der gefülten secklin mit dem Feurzeug darauff legen/ wider binden mit einem schnürgebent auff däffen oder schmemen/ wie vor/ biß so lang das es der kugeln gleich ist/ doch soll durch die eysen stangen/ vorn bei der kugeln creutzweiß löcher hindurch gehen/ deßgleichen hinden am ende durch solliche löcher starcke eysene stefft durch wie ein creutz/ Geschicht auß der vrsach/ das mann das Feurwerck/ daran binden mag/ damit sich im schiessen die stangen mit der Kugeln nit von Feurwerck außstrauffen/ vnd die secklin da das Feurwerck in ist/ soll hinden am hindersten creutz/ so man die Büchsen
  cs: |-
    Dále: pro železné, kamenné a olověné koule, které mají velikost vývrtu děla {Büchsen}, aby při výstřelu mohly prorážet lépe než ohnivé koule {Feurkugeln}, které jsou zhotoveny jen ze zápalné hmoty, nechají se odlít železné koule, které mají uprostřed skrz naskrz čtverhranný otvor; do něj se vleje železná tyč a zanýtuje se tam olovem, a tato tyč může být dozadu dlouhá jednu, dvě nebo tři pídě podle toho, jak velká je koule a jak dlouhé je dělo. Na takovou tyč lze připevnit koule a ohňostroj {Feurwerck} pomocí dlouhých váčků přivázaných kolem tyče, položených rovně či přímo podél ní; a tyto váčky mají být naplněny dobrou prudkou zápalnou hmotou. Když se takto položí kolem tyče, ovážou se potom pevně provazovým ovázáním {schnürgebent}, avšak toto ovázání – zvláště to první – nemá k sobě doléhat na půl šířky prstu z toho důvodu, aby se mezi ně mohla dostat zápalná lázeň {däff}[^1] a aby to, co by bylo duté mezi ovázáním a váčky, mohlo téct ven. A když se to takto zápalnou lázní či máčením srovná, může se na to opět jako prve položit vrstva váčků naplněných zápalnou hmotou a znovu ovázat provazovým ovázáním na zápalnou lázeň či máčení jako dříve, dokud to nebude stejně silné jako koule. Železnou tyčí však mají vpředu u koule procházet otvory křížem a rovněž vzadu na konci skrz takové otvory silné železné kolíky jako kříž – to se děje z toho důvodu, aby se na ně dal ohňostroj přivázat, aby se při výstřelu tyč s koulí z ohňostroje nevyvlékla; a váčky, v nichž je zápalná hmota, mají se vzadu u zadního kříže, až se bude dělo
poznamky:
- n: 1
  text: V tisku stojí *däff oder schmem* (níže *däffen oder schmemen*), tj. *däffen oder schwemmen* („zápalný potah / namáčení do roztavené smůly a síry“; *schmem* je sazečská obměna či překlep za *schwem* / *Schwemme*).
