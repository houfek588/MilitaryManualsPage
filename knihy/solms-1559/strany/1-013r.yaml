bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Rittermessigen Leuten beuelhen / die Regirung vnnd Justitien vertrauen / vnd auff gelegt haben.
  cs: |-
    rytířským, a svěřit a uložit jim správu i justici {Justitien}.
- typ: odstavec
  de: |-
    Als dann so soll der Kriegßherr / vor solcher versamlung vnd jhrem bei sein alle Ämpter außgeben / denen so tüglich darzů geacht werden / vnd ob schon solche Beuelch vnd Ämpter zuuor außgeben vnd darmit begnadigt worden / so sol doch ein Herr denselben Personen vor solcher samlung / was eins jeglichen verwaltung sein wirt beuelhen / bei der pflicht aufflegen / so solchs also statlich vnd mit ernst geschehen / so wirt ein jeder bedencken / was jm zuuerwalten vnd zuuersehen gebüren wil / vnnd baß bedencken / Dieweil es jm also vor einer statlichen versamlungen geschicht / mit vnderschidlichem bericht / als wenn jm schlecht mit dem Namen solches Ampt gegeben wirt.
  cs: |-
    Poté má válečný pán {Kriegßherr} před tímto shromážděním a v jeho přítomnosti rozdat všechny úřady těm, kdo jsou k nim uznáni za způsobilé. I kdyby taková velení a úřady byly rozdány a uděleny už dříve, má pán těmto osobám před shromážděním přesto přikázat a pod závazkem {pflicht} uložit, co bude kdo z nich spravovat. Stane-li se to takto slavnostně a s vážností, každý si rozmyslí, co mu přísluší spravovat a obstarávat, a vezme si to více k srdci, protože se mu to děje před tak vznešeným shromážděním a s podrobným poučením, než kdyby mu byl úřad udělen pouhým jménem.
- typ: odstavec
  de: |-
    Würde nun einer dem sein Ampt also statlich / vnnd mit ernst erklert vnd beuolen wirt / vnd solches zuuersehen nit weiß / sich desselben nit vndernemen wöllen / so mag der Herr solches Ampt / einem andern der es zuuerwalten weiß geben / vnd wie vor zu dem ernstlichsten beuelhen / dann es einer mehr bedenckt vnd beuolhen lest sein / dieweil ein solche statliche versamlung seinen Beuelch weiß / vnd wie hoch er jm beuolhen vnd auffgelegt ist.
  cs: |-
    Kdyby pak někdo, komu byl úřad takto slavnostně a s vážností vyložen a svěřen, jej neuměl zastávat a nechtěl se ho ujmout, může jej pán dát jinému, kdo jej spravovat umí, a přikázat mu jej jako předtím co nejvážněji. Každý totiž o svém úřadu více přemýšlí a více si jej bere k srdci, když tak vznešené shromáždění zná jeho velení a ví, jak důrazně mu bylo svěřeno a uloženo.
- typ: odstavec
  de: |-
    Vnd dieweil dann von allen Nationen / zu Roß vnd fůß / so Regiment haben vnd darbei genomen / mit jrer allen rath vnd gůtbedencken dise Krigßregirnng vnd Ordnung beschlossen / vnd also ein gleiche eintrechtige Regirung gemacht / so mag kein Meuterei noch vnwillen vnder den Nationen entstehen / als wann solches ein Nation allein geordnet vnd gemacht hette.
  cs: |-
    A poněvadž tuto válečnou správu[^1] a řád usnesly s radou a dobrým uvážením všech národy na koni i pěšky, které mají své pluky {Regiment} a byly k tomu přibrány, a zřídila se tak stejná a svorná vláda, nemůže mezi národy vzniknout žádná vzpoura {Meuterei} ani nevole, jako kdyby to nařídil a zavedl jen jeden národ sám.
- typ: odstavec
  de: |-
    Darmit aber weiter einigkeit gehalten / vnd die Regirung ein gentzliche vnd starck würckung bekomen mag / so soll ein jede Nation / vnder jnen eigene Gerichtspersonen vnd Reth ordnen / was jnen also zu rathschlagen vnnd zu rechtfertigen fürfallen würde / das die sich nach der Kriegßordnung zuhalten künden vnd wüsten.
  cs: |-
    Aby se však dále udržela svornost a správa nabyla plné a silné účinnosti, má každý národ ustanovit ze svého středu vlastní soudní osoby a rady, kteří by v tom, co se jim naskytne k poradě a k souzení, uměli a věděli, jak se řídit válečným řádem.
- typ: odstavec
  de: |-
    Vnnd darmit solche Ordnung nit wider in abgang kome / sonder bleiben / vnd kein Practic darinn verstanden noch vorgewent werden möge / so ist dise volgende Ordnung darinen fürzunemen.
  cs: |-
    A aby takový řád opět neupadl, nýbrž přetrval a nemohly se v něm skrývat ani předstírat žádné úklady {Practic}, má se v tom zavést následující postup.
- typ: odstavec
  de: |-
    Die Partheien so gegen einander zuthůn haben vnd von zweien Nationen sein werden / vnd wirt ein Teutscher ein Welschen anzuklagen haben / so soll der kleger den beklagten vor seiner ordentlichen Oberkeit vornemen / denselben alda beklagen.
  cs: |-
    Mají-li spolu co činit strany ze dvou národů – má-li například Němec žalovat Vlacha {Welschen} –, má žalobce pohnat žalovaného před jeho řádnou vrchnost a tam jej zažalovat.
- typ: odstavec
  de: |-
    So soll dieselbige gesagte Oberkeit / die Partheien zu einer benanten stund oder tag vor sich bescheiden / die sachen anhören / ist kundt oder anders von nöten / darüber zuhören / so soll solches nach
  cs: |-
    Tato vrchnost má pak obeslat strany k sobě na stanovenou hodinu nebo den a věc vyslechnout. Je-li třeba vyslechnout svědectví {kundt} nebo něco jiného, má se to dít
poznamky:
- n: 1
  text: |-
    Tisk má u písmene *u* převrácenou literu (*Krigßregirnng* místo *Krigßregirung*).
