  popis: |-
    Celostránkový dřevořez v klenutém rámu s rozvilinami v rozích, signovaný dole monogramem HD 1546: jezdecký velitel (vachmistr jízdy) s dlouhým rozdvojeným plnovousem, v klobouku se dvěma chocholy a zahnutým perem, v zapínacím kabátci s nabíranými rukávy a měšcem u pasu, sedí na koni kráčejícím doprava. V pravé ruce drží velitelskou hůl, levou rukou drží otěže nad pouzdrem zavěšeným u sedla, za levým bokem má meč a na botě ostruhu. V pozadí pod břichem koně krajina s hradem u vody, stromy a kopci, na obloze oblaka.
