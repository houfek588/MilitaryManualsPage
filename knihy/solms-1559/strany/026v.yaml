bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    den Renfanen füren / so ein Römischer Keyser von Reichs wegen zeucht / vnnd sanct Jörgen Fanen haben / Aber bei diser Römischer Keyserlicher Maiestat Carols der fünffte / wann er nit von Reichs wegen gezogen ist / hat er S. Jörgen nit in dem Renfanen gehabt / sonder ein groß rot Borgundisch Creutz in einem weissen Fanen gefürt / damit sich die Nationen vmb den Renfanen nit zancken dörffen / aber doch nichts desto weniger so hat Jr Röm. Keys. Mai. dem Renfanen sein stat / ampt vnd Regiment gelassen / vnd darüber gehalten / vnd den Renfanen allezeit starck besatzt / als wann mann starck im Feld gewesen ist / ein dausent pferd vnnd ein Regiment Knecht / Auch hat er mir gehalten / wann ich daß verwaltet hab / zwen Leutenant / auch dem vnder Marschalck ein Leutenant / vnd dem Prouosen ein Leutenant / Trabanten / Steckenknecht / Stockmeister / vnd Nachrichter / also hat Jr Römis. Keys. Mai. das Ampt vnd Justitie statlich besatzt das habe Jr Römis. Keys. Mai. ich drei Züge verwaltet vnd regiert / sonst (wie hie vermelt ist) hat allweg der Feldmarschalck mit seinem Renfanen den fürzug / vnd das vortreffen an die Feinde gehabt / deßgleichen zeucht der Feldmarschalck / Artlereimeister / Wagenburgmeister / Capettan der Justitie mit einander fort / das Leger zu besehen / einzunemen / vnd zuschlagen / deßgleichen Quartiermeister / Wachtmeister / vnd von den Knechten auß einer jeden Rot ein Person / die den Knechten jre lastierung thůn / dieselbigen sollen bei einander bleiben / ein Fendlin haben / vnnd ist der verloren Hauffen genant.
  cs: |-
    vedou předvojovou korouhev {Renfanen}, když římský císař táhne jménem Říše a mají korouhev {Fanen} svatého Jiří. Za nynějšího Římského císařského Veličenstva Karla V. však, kdykoli netáhl jménem Říše, neměl v předvojové korouhvi svatého Jiří, nýbrž vedl velký červený burgundský kříž na bílé korouhvi, aby se národy nemusely o předvojovou korouhev přít. Přesto Jeho Římské císařské Veličenstvo ponechalo předvojové korouhvi její postavení, úřad i velení, chránilo je a vždy ji silně obsazovalo: když bylo vojsko v poli silné, tisícem koní a plukem {Regiment} knechtů {Knecht}. Také mi, když jsem ten úřad spravoval, vydržovalo dva poručíky {Leutenant}, dále jednoho poručíka podmaršálkovi {vnder Marschalck} a jednoho profousovi {Prouosen}, drabanty {Trabanten}, profousovy pacholky {Steckenknecht}, žalářníka {Stockmeister} a kata {Nachrichter}. Tak Jeho Římské císařské Veličenstvo tento úřad i justici {Justitie} důstojně obsadilo a tak jsem jej Jeho Římskému císařskému Veličenstvu spravoval a řídil po tři tažení {Züge}. Jinak (jak je zde uvedeno) měl polní maršálek {Feldmarschalck} se svou předvojovou korouhví vždy čelo pochodu a první střetnutí s nepřáteli. Rovněž polní maršálek, zbrojmistr {Artlereimeister}, mistr vozové hradby {Wagenburgmeister} a kapitán justice {Capettan der Justitie}[^1] táhnou společně napřed, aby ležení {Leger} prohlédli, zabrali a rozbili; a stejně tak kvartýrmistr {Quartiermeister}, vachmistr {Wachtmeister} a z knechtů po jednom muži z každé roty {Rot}, kteří knechtům zařizují ubytování {lastierung}[^2]. Ti mají zůstat pohromadě a mít jeden praporec {Fendlin}; nazývají se ztracený houf {verloren Hauffen}.
- typ: odstavec
  de: |-
    Wann ein groß Volck im Leger ist / so soll der Kriegsherr dem Feldmarschalck ein vnder Marschalck halten / der hat acht auff die Reisigen / daß sie sich nirgent vngeschickt halten / auch sicht er zu / daß die Marcatanten das Kriegsuolck nicht vbersetzen oder betriegen / wie im 78. Artickel des Feldmarschalcks daruon geredt ist
  cs: |-
    Je-li v ležení mnoho lidu, má válečný pán {Kriegsherr} vydržovat polnímu maršálkovi podmaršálka. Ten dohlíží na jízdu {Reisigen}, aby se nikde nechovala nepatřičně, a dbá také, aby markytáni {Marcatanten} válečný lid {Kriegsuolck} nepředražovali ani nešidili, jak se o tom mluví v 78. článku o polním maršálkovi.
- typ: odstavec
  de: |-
    Diser vnder Marschalck schetz die Prouiant im reutter leger an stat des Feldmarschalcks / vnd soll sich allweg mit dem Prouosen in der Knecht leger vergleichen / damit die Prouiant im Reuter vnnd Knecht leger gleich gesetzt werde / sonst volget etwann grosser vnrath zwischen dem Kriegsuolck darauß.
  cs: |-
    Tento podmaršálek oceňuje místo polního maršálka proviant {Prouiant} v ležení jízdy a má se vždy dohodnout s profousem v ležení knechtů, aby ceny proviantu byly v ležení jízdy i knechtů stejné; jinak z toho mezi válečným lidem vzniká někdy velká nesvornost.
- typ: odstavec
  de: |-
    Diser vnder Marschalck brengt dem Feldmarschalck das Bestandt gelt wochlich ein bei den Marcatanten / deßgleichen die verwirckte Prouiant / auch andere straff / vnd vberantworts dem Feldmarschalck / oder thut jm desselben rechnung.
  cs: |-
    Tento podmaršálek vybírá pro polního maršálka od markytánů každý týden nájemné za stanoviště {Bestandt gelt}, stejně jako propadlý proviant a jiné pokuty, a odevzdává je polnímu maršálkovi, nebo mu z nich skládá účet.
- typ: odstavec
  de: |-
    Der vnder Marschalck lest jm etwan an stat des Feldmarschalcks die reutter / sie seien vom Adell oder nicht / so vneins sein worden /
  cs: |-
    Podmaršálek si někdy místo polního maršálka nechává od jezdců, kteří se dostali do rozepře, ať jsou šlechtici, nebo ne,
poznamky:
- n: 1
  text: |-
    *Capettan der Justitie* (ze špan. *capitán de justicia* / it. *capitano di giustizia*) – nejvyšší polní profous a velitel vojenské policie v císařských armádách Karla V.
- n: 2
  text: |-
    *Lastierung* – dobová obměna výrazu *Lostierung* / *Losierung* (ubytování, zajištění kvartýrů).
