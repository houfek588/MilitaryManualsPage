sken: 611
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    thůn haben / vnd was nit auff den Letzen ist mit vmbfürn alle ding zubesichtigen / wo etwas zu bawen vnd zu darressen oder sonst etwas anders von nöten were / oder wo etwas mit schiessen zerbrochen / daß demselbigen mit darressen wider begegnet würde / als mit blinden gräben die mit Fewer / Puluer / Sprengwerck / Pfellen / die mit eisen spitzen beschlagen seind / Creutzhespeln / Sprengfaß / Sprengkugeln / Sprengton mit Kalch zum dampff vnd was weiter darzů gehöret / wie das hernach mit weiterm bericht vnd augenscheinlichen Figuren angezeigt wirt.
  cs: |-
    dělat. Ty, kdo nejsou na stanovištích {Letzen}, má brát s sebou na obchůzku a všechno prohlížet: kde je třeba něco stavět a tarasit {darressen} nebo je potřeba něco jiného, anebo kde bylo něco rozbito střelbou, aby se tomu zase čelilo tarasením – například slepými příkopy[^1] s ohněm, prachem {Puluer}, trhacími náložemi {Sprengwerck}, kůly okovanými železnými hroty, křížovými ježky {Creutzhespeln}, trhacími sudy {Sprengfaß}, trhacími koulemi {Sprengkugeln}, trhacími soudky {Sprengton} s vápnem na dým a čím dalším ještě, jak to bude dále ukázáno s podrobnějším výkladem a názornými vyobrazeními.
- typ: odstavec
  de: |-
    Erstlich ist dise Figur so mit ziffer 20. verzeichnet ist ein Darreß / wann ein löcken an einer Befestung geschossen oder geoffnet wirdt / daß mann sich störmens besorget / so kan mann mit solchen Creutzhäspeln vnd Pfalbaumen ein loch behend vnd in der eil zulegen vnd verdarressen / vnd so eins in das ander / oder creutzweiß vber einander geworffen wirt / dann kan keiner die von einander ziehen / wie zůgedencken ist / auch ist es gůt / wann etwan an einer Befestung die Gräben geöffnet würden / daß einer dardurch hinein komen möcht / soll mann solche Creutzhespel vberzwerg etlich mal darinn legen / besonder vor die streichwehrn / wann dann ein Kriegßuolck schon inn die Gräben fielle / alßdan künden sie für den Creutzhespeln nit fört oder zusamen / sonder sie werden dardurch gedrennt / welches auch nit ein kleiner nachteil einem Kriegßuolck ist das gedrent steht / vnd keiner dem andern zu hilff kan komen / sonder sicht daß er von seinem Gesellen gescheiden ist vnd keiner hilff von jm zu hoffen noch zutrösten hat / Dann ich hab gesehen vnd mit gewesen / daß mann einen Storm zuthůn verordnet hatt / vnd sind Zwergmauren durch einen drocken graben herüber gangen / haben die Obersten vnd Hauptleut nit störmen wöllen / dieselbigen Zwergmaurn seien dann zuuor geschossen / gebrochen vnd geöffnet / vnd ich als die zeit Artoloreimeister hab die zuuor schiessen vnd brechen müssen / So hab ich das an andern Störmen auch mehr gesehen was für verhindernuß vnd schaden die Zertrennung brach hat.
  cs: |-
    Předně vyobrazení označené číslicí 20 je zátaras {Darreß}. Když je v pevnosti {Befestung} vystřelen nebo otevřen průlom {löcken} a obávají se útoku {störmens}, lze takovými křížovými ježky a kolovými trámy {Pfalbaumen}[^2] otvor rychle a v kvapu zahradit a zatarasit. A když se házejí jeden do druhého nebo křížem přes sebe, nikdo je od sebe neodtáhne, jak si lze snadno představit. Je také dobré, když by se v pevnosti někde otevřely příkopy tak, že by se jimi dalo proniknout dovnitř, položit do nich takové křížové ježky několikrát napříč, zvláště před boční obranné stavby {streichwehrn}. Když pak válečný lid {Kriegßuolck} vpadne do příkopů, nemůže se pro křížové ježky dostat dál ani se semknout, nýbrž je jimi roztržen. A to není pro válečný lid malá nevýhoda, když stojí roztržen a nikdo nemůže druhému přijít na pomoc, nýbrž každý vidí, že je od svého druha odloučen a nemá od něho co čekat pomoci ani útěchy. Viděl jsem totiž a byl jsem u toho, když byl nařízen útok {Storm} a přes suchý příkop vedly příčné zdi {Zwergmauren}: plukovníci {Obersten} a hejtmani {Hauptleut} nechtěli útočit, dokud nebudou tyto příčné zdi předem rozstříleny, proraženy a otevřeny, a já jsem je tehdy jako mistr dělostřelectva {Artoloreimeister}[^3] musel předem rozstřílet a prorazit. Také při jiných útocích jsem vícekrát viděl, jakou překážku a škodu takové roztržení způsobilo.
- typ: odstavec
  de: |-
    Vnd wann einer solche Creutzhespel oder Pfel machen wil / soll er einen baum so lang als jn einer haben wil / vnd tragen vnd handeln kan / nemen / vnd denselbigen in die vierung machen / vnd auff beiden seiten mit einem grossen Börer löcher dardurch boren / doch die löcher verwechseln daß sie geschrenckt zu beiden seiten / wann mann die
  cs: |-
    Kdo chce takové křížové ježky neboli kůly {Pfel} zhotovit, má vzít kmen tak dlouhý, jak jej chce mít a jak jej lze unést a s ním zacházet, otesat jej do čtverhranu a skrz něj z obou stran provrtat velkým nebozezem {Börer} otvory. Otvory však má střídat, aby kolíky, až se do nich
poznamky:
- n: 1
  text: |-
    „blinde gräben“ – skryté, zakryté příkopy nebo jámy za průlomem či v příkopu, do nichž se kladou nástrahy a zápalné a trhací prostředky proti útočníkům (srov. dále soudky s vápnem na [[8-013r|listu 13]]).
- n: 2
  text: |-
    „Creutzhaspel“ – trám s křížem prostrčenými zahrocenými kolíky, překážka proti útoku (předchůdce pozdějšího „španělského jezdce“), viz vyobrazení č. 20 na [[8-011v|předchozí straně]]. Nezaměňovat s navijákem (*creutz Hespel*) v dělostřeleckých částech díla.
- n: 3
  text: |-
    Autor, Reinhard hrabě ze Solmsu, zde vzpomíná na vlastní službu velitele dělostřelectva (patrně ve vojsku Karla V.); konkrétní obléhání neuvádí.
