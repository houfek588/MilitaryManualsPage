bloky:
- typ: odstavec
  de: |-
    Der 22. Artickel spricht er / er wisse es wol zu ordnen soll er ein stück drei oder vier selbst ordnen / vnd ein jedes besonder mit aller zu gehörde beschreiben vor das erst stück seine pferdt / darnach Puluer / Kugeln vnd züg zu einer jeden gattung dasselbig besonder in rechte rechnung vnd theilung schirfflich stellen.
  cs: |-
    22. článek: řekne-li, že to umí dobře uspořádat, má sám zařídit tři nebo čtyři kusy {stück} a každý zvlášť se vším příslušenstvím popsat – pro první kus jeho koně, potom střelný prach {Puluer}, koule {Kugeln} a kladkostroje {züg} ke každému druhu, a to vše zvlášť uvést písemně[^1] ve správném výpočtu a rozdělení.
- typ: odstavec
  de: |-
    Der 23. Artickel versteht er das / so bedarff er keines berichts zu schreiben vnd zu reissen / das soll mann jn also reissen vnd beschreiben lassen / trifft er dasselbige so ists ein gůt werck stück / vnd gehört in ein Zeughauß / in vilen dingen zu gebrauchen / im schantzen / im feld mit dem faren / vnd in besatzung / wie das die gerissen figurn anzeigen werden.
  cs: |-
    23. článek: rozumí-li tomu, nepotřebuje žádný výklad k psaní ani k rýsování – má se tedy nechat jej takto narýsovat a popsat; trefí-li to, je to dobré mistrovské dílo a patří do zbrojnice {Zeughauß}, k použití v mnohých věcech – při šancování {schantzen}, v poli při jízdě i v posádce {besatzung}, jak to ukážou narýsované obrázky.
- typ: odstavec
  de: |-
    Der 24. Artickel sagt er / daß er das verstehe / vnd wer war / das wer ein gůt gewaltigs stück / dasselbige von jm zu erfarn den grundt lest sich nit also schlecht anzeigen / sonder die erfarung des der das thůt / demselbigen sol man also thůn / mann sol jn füren an ein ort / es sei ein Schloß / oder Stadt die nicht gantz wol Leudt ist / dieselbige sollen jn sehen lassen vnd hören sein anschlag darüber / spricht er dann / er wisse das zu befestigen soll mann sein anschlag darüber hören vnd zeigen lassen / wirt er dann sagen er wölle dahin ein grosse mauer machen / dahin ein grosse Pastei oder Polwerck dahin ein grossen Wal vnd dergleichen / vnd sagt nit / da an dem ort ist ein Leger / da muß mann ein pasteien machen / damit mann daß Leger einneme / also das mann sie mag herauß schiessen / oder da ist ein Leger das mag mann nit weren / also wann er nit zum ersten nach den Legern sicht / vnnd die pasteien darauff ordnet ob die auch gemacht werden / daß mann das groß geschütz darauff gebrauchen kan / vnd so mann das darauff gebrauchen mag ob es auch vor wehrhafftig steh / das mann ein nit mag bald daruon schiessen / ob die pasteien auch auff einander stehn / das eine die andern mag eretten / ob sie auch wehrhafftig sein mit den streichwern / ob die in den pasteien in der not auch zu samen kommen / ein ander zu reten / das sie nit getrendt stehn / vnd vor den feinden im storm nit zu samen mögen / vnd so es im storm sein wirt ob mann auch das geschütz jhn ablauffen kön / ob er auch auff ein grosse oder klein / besatzung gemacht werdt / das er zu graben vnnd zu sprengen sei / wie er jm wasser geben vnnd nemen wolt / ob er auch könne oder wölle gůte außfäl machen / dises seind vngefehrlich die Hauptstück darauff er zufragen ist ob er dieselben finde vnd bedenck vnd anzeigt ob die zu machen sein oder nit / vnd so er das dan also alles geordnet vnd bedacht hat / soll mann jn das in ein rechte maß ein jedes reissen vnd ordnen lassen / trifft er das so ist es wol etwas vnd nit ein gerings
  cs: |-
    24. článek: řekne-li, že tomu rozumí, a byla-li by to pravda, byl by to dobrý a mocný kus. Poznat však u něj základ toho umění nelze jen tak lehce na pohled, nýbrž ze zkušenosti toho, kdo to provádí; s takovým se má naložit takto: má se zavést na nějaké místo – ať je to zámek či město, které není docela dobře opevněno[^2] –, ti místní mu je mají dát prohlédnout a vyslechnout jeho návrh k tomu. Řekne-li pak, že to umí opevnit, má se jeho návrh k tomu vyslechnout a nechat jej ukázat. Bude-li pak říkat, že tamto chce postavit velikou zeď, onde velikou baštu {Pastei} nebo bolverk {Polwerck}, támhle veliký val a podobně, a neřekne: „Tam na tom místě je vhodné postavení pro ležení {Leger}, tam je třeba postavit baštu, aby ovládlo ležení tak, aby je odtud bylo možno ostřelovat,“ anebo: „Tam je ležení, jemuž nelze zabránit“ – tedy nehledí-li nejprve na možná ležení a neřadí-li podle nich bašty: zda se i postaví tak, aby se na nich dala používat těžká děla {geschütz}; a lze-li je na nich používat, zda také stojí dostatečně obranyschopně, aby odtud člověka nemohli hned odstřelit; zda bašty také kryjí jedna druhou, takže jedna může druhou zachránit; zda jsou také dobře bráněné bočními obrannými stavbami {streichwern}; zda se obránci v baštách mohou v nouzi také sejít a navzájem si pomoci, aby nestáli odděleně a nemohli se před nepřáteli při útoku {storm} spojit; a dojde-li k útoku, zda jim lze také odsunout děla;[^3] zda je dílo stavěno pro velkou či malou posádku; zda je náchylné k podkopání a vyhození do povětří; jak by mu přivedl a odvedl vodu; zda také umí a chce dělat dobré výpady. Toto jsou zhruba hlavní body, na něž se jej třeba ptát, zda na ně přijde, promyslí je a ukáže, zda jsou proveditelné či nikoli. A když to pak všechno takto uspořádá a promyslí, má se jej nechat to všechno ve správném měřítku narýsovat a rozvrhnout; trefí-li to, je to věru něco a nikoli maličkost
poznamky:
- n: 1
  text: |-
    V tisku přesmyčka „schirfflich“ místo *schrifftlich* (písemně).
- n: 2
  text: |-
    V tisku „die nicht gantz wol Leudt ist“ – nejasná tisková podoba, snad ve významu *beleut* (osazené lidmi, lidnaté), nářeční *leit* (leží – příhodně položené), či tiskařský omyl místo *bewart / gebauwt* (zajištěné / vystavěné).
- n: 3
  text: |-
    Něm. *ob mann auch das geschütz jhn ablauffen kön* – tj. zda lze v tísni při útoku děla odtáhnout z valů před nepřítelem (příp. zda lze děly postřelovat stěny pod úhlem dolů).
