id: 1-020r
list: '20'
strana: recto
sken: 49
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Zum vierdtzehenden so einer von der Wacht ehe dann gebürliche zeit / oder on vrsach abziehen würde / den soll der Feldmarschalck vor die Ritmeister zu reden vorstellen / seine vrsach anhören / hat seine verantwortung stat / wol vnd gůt / wo aber nicht / so soll er nach erkantnuß des Feldmarschalcks vnd ritmeister gestrafft werden
  cs: |-
    Za čtrnácté, odejde-li někdo ze stráže {Wacht} před náležitým časem nebo bez příčiny, má jej polní maršálek {Feldmarschalck} postavit před rytmistry {Ritmeister}, aby se zodpovídal, a vyslechnout jeho důvod. Obstojí-li jeho obhajoba, je to v pořádku; pakliže ne, má být potrestán podle nálezu polního maršálka a rytmistrů.
- typ: odstavec
  de: |-
    Zum fünfftzehenden wann einer von seinem Ritmeister on erlaubnuß von der Wacht ehe dann sie alle / abziehen würde / derselbig soll gleichfals vor den Feldmarschalck vnnd Ritmeister fürgestelt werden / hat er dann entschuldigung die grundt hat / so hat es seinen weg / wo aber nit so soll erkennt werden / das er daran nit redlich gethan / vnd seine weitere straff gehen lassen.
  cs: |-
    Za patnácté, odejde-li někdo bez dovolení svého rytmistra ze stráže dříve než ostatní, má být rovněž předveden před polního maršálka a rytmistry. Má-li pak omluvu, která má dobrý základ, je to v pořádku; pakliže ne, má být uznáno, že se v tom nezachoval čestně, a má jej postihnout další trest.
- typ: odstavec
  de: |-
    Zum sechszehenden wo einer ein balgen oder vnlusten auff der Wacht anfahen würde / so soll derselbig von den andern / die auff der Wacht halten / gefenglich angenomen werden / vnd in des Feldmarschalcks handt verstrickt / so soll der Feldmarschalck denselbigen gleich wie oben vermeldt für Recht fürstellen / darüber lassen erkennen / vnd was zu Recht erkennt wirt / ferrner mit der straff fürgehen lassen.
  cs: |-
    Za šestnácté, začal-li by někdo na stráži rvačku nebo výtržnost, mají jej ostatní, kteří drží stráž, vzít do vazby a odevzdat do rukou polního maršálka; polní maršálek jej pak má, jak výše řečeno, postavit před soud {Recht}, nechat o tom vynést nález, a jak bude po právu uznáno, dále vykonat trest.
- typ: odstavec
  de: |-
    Zum siebenzehenden so einer auß dem Feld mit seinem Fendlein vnd Reuttern / so mann vor den feinden wer / abziehen würd / on erlaubnuß / vnnd verwilligung / darüber soll der Feldmarschalck ein statlich Gericht vnder vier vnd zwentzig Personen nit / vnd den Feldobersten oder sein Leutenant darbei setzen / zu Roß vnd zu fuß / vnnd jnen vnredlich erkennen / als ein flüchtiger von feinden im Feld / doch mit dem vorbehalt / das jm soll geschriben werden / vnd ein ander Kriegßrecht ernennt / darzů jnen auch erfordern darumb rede vnd antwort zugeben / würd er als dann darzů erscheinen vnd seine verantwortung / dergestalt darthůn / das mag erkennt werden durch den sitzenden Rath / das er solchs mit fuge vnd ehren hat thůn mögen / so soll jm die hieuorig erkentnuß vber jnen / durch das sitzend Gericht auff gehaben werden / vnd dessen vom Obersten vnd gantzen Gericht gnugsam schein brieff vnd Sigel seiner entschuldigung gegeben werden / aber im fal daß er sich dessen nit entschuldigen künd noch möchte / so soll er in der vorigen verdambnuß bleiben / vnnd weiter von jm außgeruffen werden / daß er das ander Gericht / so vbel bestanden als das erst / vnd alwegen vor ein solchen mann gehalten werden.
  cs: |-
    Za sedmnácté, odtáhl-li by někdo bez dovolení a svolení z pole se svou korouhví {Fendlein}[^1] a jezdci {Reuttern}, když se stojí proti nepříteli, má nad ním polní maršálek ustanovit řádný soud {Gericht} nejméně o dvaceti čtyřech osobách z jízdy i pěchoty, přibrat k němu nejvyššího polního hejtmana {Feldobersten} nebo jeho poručíka {Leutenant} a prohlásit provinilce za nečestného jakožto zběha před nepřítelem v poli – avšak s tou výhradou, že mu to má být písemně oznámeno a má být stanoven druhý válečný soud {Kriegßrecht}, k němuž má být rovněž předvolán, aby o tom podal vysvětlení a odpověď. Dostaví-li se pak k němu a přednese svou obhajobu tak, že zasedající rada {Rath} uzná, že tak mohl učinit právem a se ctí, má být předchozí nález nad ním zasedajícím soudem zrušen a má mu být od plukovníka {Obersten} i celého soudu vydána dostatečná listina s pečetí na jeho ospravedlnění. V případě však, že by se z toho nemohl ani nedokázal omluvit, má zůstat v předešlém odsouzení a má se o něm dále veřejně rozhlásit, že v druhém soudu obstál stejně špatně jako v prvním, a navždy má být pokládán za takového člověka.
- typ: odstavec
  de: |-
    Zum achtzehenden wann einer oder mehr / mit seinen Reuttern auß dem Feld on bewilligung abziehen würd / derselbig oder dieselbigen sollen gleichs fals / wie oben vermelt / gehalten werden.
  cs: |-
    Za osmnácté, odtáhl-li by jeden nebo více [velitelů] se svými jezdci z pole bez svolení, s tím či s těmi se má naložit stejně, jak bylo výše řečeno.
poznamky:
- n: 1
  text: |-
    Solms užívá v První knize výraz *Fendlein* (praporec) místy i pro jízdní oddíl; u jízdy jej překládáme „korouhev“, stejně jako *Fahne* / *Fanen* v Druhé knize.
