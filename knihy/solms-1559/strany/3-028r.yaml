bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    lassen vberhaupt / als das verschinen 42. jars Keyserliche Maiestat zu Augspurg / Meister Gregor Löfflern etlich stuck Büchsen zu giessen verdingt / nemlich von dem Wienischen Centner thůt Augspurgisch gewichts 115. pfundt beschossner arbeit / das ist alweg auß einer Büchsen 3. schoß mit gantzer kugel schwer Puluers zu thůn 13. gulden / das brecht von denen 2222. Centner Augspurgisch gewichts / welche nach Wienischen Centnern gerechnet 1888. centner 70. pfundt machen in Summa. 24553. Gulden 21. pfenning.
  cs: |-
    vcelku úkolem, jak to minulého 42. roku[^1] zadalo v Augšpurku Císařské Veličenstvo {Keyserliche Maiestat} mistru Řehoři Löfflerovi na odlití několika kusů děl {Büchsen}, totiž za jeden vídeňský cent {Centner} – což činí 115 liber {pfundt} augšpurské váhy – odstřílené práce (to znamená vždy z jednoho děla učinit 3 výstřely se střelným prachem {Puluers} o váze celé koule {kugel}) po 13 zlatých {gulden}; to by z oněch 2222 centů augšpurské váhy, jež přepočteny na vídeňské centy dávají 1888 centů a 70 liber, činilo v součtu 24 553 zlatých a 21 feniků {pfenning}.
- typ: odstavec
  de: |-
    Zum andern so mag der Herr den Zeug selbs ( welchs ich für den nützlichsten weg acht ) im vorat haben oder bestellen / vnd mit dem Meister allein für sein mühe vnd arbeit abbrechen / oder dingen / so solchs wie dann gewonlich beschicht / so werden darzů dem Meister auff hundert centner 10. centner abgezogen / also wo jhm 100. centner zeug zugestelt / ist er darfür nit mehr dan 90. centner zůlieffern schuldig / vnd dennoch vngeschmelert seines verdingten lonß.
  cs: |-
    Za druhé si pán může sám mít v zásobě nebo opatřit kov – což pokládám za nejprospěšnější cestu – a s mistrem se dohodnout či najmout ho jen za jeho námahu a práci; děje-li se tak, jak bývá obvyklé, sráží se při tom mistrovi ze sta centů 10 centů na propal, takže dodá-li se mu 100 centů kovu, není za to povinen odvést více než 90 centů, a přesto bez krácení své smluvené mzdy.
- typ: odstavec
  de: |-
    Darumb soll sich ein Herr oder desselben Zeugmeister befleissen / das dise metal auch aller anderer hernachfolgender / vnd an seinem bequemlichen ort / beschribener voradt zu gelegner weil vnd zeit / also das dieselben im geringen vnd wolfeilem kauff sein / verordnet / bestellt vnd fürgebracht werden.
  cs: |-
    Proto se má pán nebo jeho zbrojmistr {Zeugmeister} snažit, aby tento kov i všechny ostatní níže uvedené a na svém příhodném místě popsané zásoby byly nařízeny, objednány a pořízeny v pravý čas a v příhodnou dobu, tedy když jsou v nízké a laciné ceně.
- typ: odstavec
  de: |-
    So wil ich nun die 18. Büchsen / Wagen / einen in den andern anschlagen vor / thůt.
  cs: |-
    Nyní tedy chci ocenit oněch 18 dělových vozů jeden jako druhý po […], což činí […].[^2]
- typ: odstavec
  de: |-
    Der Puluer / Kugel / züg vnd wagen einn vor / thůn die 133 Wagen.
  cs: |-
    Vozy na prach, koule a kladkostroje každý po […], činí za oněch 133 vozů […].
- typ: odstavec
  de: |-
    Item der gefäß eins in der ander gerechnet vor / thůn die 72. gefäß.
  cs: |-
    Dále lafety {gefäß}, jedna jako druhá počítána po […], činí za oněch 72 lafet […].
- typ: odstavec
  de: |-
    Der züg einen in den andern angeschlagen vor / thůn die 26. Züg.
  cs: |-
    Kladkostroje, jeden jako druhý oceněn po […], činí za oněch 26 kladkostrojů […].[^3]
- typ: odstavec
  de: |-
    Item der Ladschauffeln ein in die ander vor / thůn die 72 an gelt.
  cs: |-
    Dále nabíjecí lopatky {Ladschauffeln}, jedna jako druhá po […], činí za oněch 72 na penězích […].
- typ: odstavec
  de: |-
    Item ein Plechbüchsen in die ander vor / thůn die 216 in summa.
  cs: |-
    Dále jedna plechová nádoba {Plechbüchsen} jako druhá po […], činí za oněch 216 celkem […].[^4]
- typ: odstavec
  de: |-
    Item der höltzen scheiben eine in die ander vor / thůn die 36 Scheiben in Summa.
  cs: |-
    Dále dřevěné kotouče, jeden jako druhý po […], činí za oněch 36 kotoučů celkem […].
- typ: odstavec
  de: |-
    Item der Kugel / mödel einer vor / thůn die 72 Mödel.
  cs: |-
    Dále licí formy {mödel} na koule, jedna po […], činí za oněch 72 licích forem […].
- typ: odstavec
  de: |-
    Summa alles gelts vmb wägen / gefäß / züg / Ladschauffeln / plechbüchsen / scheiben / kugeln vnd mödel / thůt nach beileufftigem anschlag.
  cs: |-
    Součet všech peněz za vozy, lafety, kladkostroje, nabíjecí lopatky, plechové nádoby, kotouče, koule a licí formy činí podle přibližného rozpočtu […].
- typ: nadpis
  uroven: 3
  de: |-
    Hernach volgen halbe Falconetlein / auch Hacken vnd handtgeschütz so man zu den sturmwagen bedörfftig.
  cs: |-
    Níže následují poloviční falkonety {halbe Falconetlein}, také hákovnice {Hacken} a ruční palné zbraně {handtgeschütz}, jichž je zapotřebí k útočným vozům {sturmwagen}.
- typ: odstavec
  de: |-
    GVter langer Handtror mit schweren schlossen / vnd all auff ein kugel gemacht / handror 2000 eins ins ander angeschlagen vor / thůt.
  cs: |-
    Dobrých dlouhých ručnic {Handtror} s těžkými zámky a všech zhotovených na stejnou kouli – 2000 ručnic, jedna jako druhá oceněna po […], činí […].
- typ: odstavec
  de: |-
    Guter halb Falconetlin deren eins vngefehrlich 2 centner schwere auch auff ein kugel gemacht sampt jren ladungen vnd aller rüstung / Halb Falconetlin 100 eins ins ander.
  cs: |-
    Dobrých polovičních falkonetů {Falconetlin}, z nichž jeden váží přibližně 2 centy a jsou rovněž zhotoveny na stejnou kouli, spolu s jejich lafetami a veškerou výzbrojí – 100 polovičních falkonetů, jeden jako druhý po […].
poznamky:
- n: 1
  text: |-
    Narážka na zakázku z roku 1542 u slavného innsbruckého a augšpurského kovolitce Řehoře (Gregora) Löfflera (asi 1490–1565) pro římského krále Ferdinanda I. / císaře Karla V. Výpočet v textu počítá 2222 augšpurských centů prostou srážkou 15 % na 1888,70 vídeňského centu (2222 × 0,85 = 1888,70; při dělení 1,15 by vyšlo 1932,17) × 13 zl. = 24 553,10 zl., přičemž 0,10 zl. při měnovém poměru 1 zlatý = 210 feniků dává přesně 21 feniků.
- n: 2
  text: |-
    V následujícím soupisu (l. 28r–29r) tisk ponechává prázdná místa pro doplnění jednotkových cen a součtů podle místní ceny; v českém překladu jsou pro srozumitelnost naznačena značkou […].
- n: 3
  text: |-
    V BSB OCR bylo *26. Züg.* chybně přečteno jako *72. Züg.* (a na začátku řádku přimíšeno zbloudilé *1.*); podle skenu stojí jednoznačně *26. Züg.*, což souhlasí se součtem na l. 27r.
- n: 4
  text: |-
    Zde je počet plechových nádob spočítán paušálně na 72 × 3 = 216 kusů (na rozdíl od l. 26r–27r, kde lehčí polní děla měla jen po jedné nádobě).
