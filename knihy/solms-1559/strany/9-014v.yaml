stav: prelozeno
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    solcher gůten ordnung schiessen / daß keiner schieß biß die andern stück alle wider geladen seien / darmit das Geschütz mit einander abgehe / darnach soll mann mit den Falckenetlein nicht auffhören schiessen / biß die andern Stück wider geladen werden / vnd also lang Gott tag gibt sollen sie on vnderlaß schiessen / nachuolgents wider laden vnnd zu rüsten daß sie nichts mehr bedörffen dann allein anzinden / die kleinen Stück eben als wol als die grossen / vnd in der nacht jetzund da jetzund dort ein stück ablassen / mit Falckenen schiessen damit sie nicht herauß fallen / Vnd dünckt mich gůt sein daß jhr zwo oder drei schantzen also gerüst (wie ich gesagt hab) machet vor einer Statt / oder mehr wann jr darzů gerüst seind.
  cs: |-
    v tak dobrém pořádku {ordnung} střílet, aby žádné dělo nevystřelilo, dokud nejsou všechna ostatní znovu nabita, a děla {Geschütz} tak vypálila společně. Potom se nemá přestat střílet z falkonetů {Falckenetlein}, dokud nejsou ostatní děla {Stück} znovu nabita. Dokud Bůh dává den, mají střílet bez ustání a potom znovu nabíjet a připravovat tak, aby je zbývalo jen zapálit, malá děla stejně jako velká. V noci se má vypálit z děla jednou tu, jednou tam a střílet z falkon {Falckenen}, aby [obránci] nevyrazili ven. A zdá se mi dobré, abyste před městem postavili dvě nebo tři takto vyzbrojené šance {schantzen} (jak jsem řekl), nebo i více, máte-li na to výzbroj.
- typ: odstavec
  de: |-
    Auch wann jhr dermassen Schantzen machen wolt / dünckt mich es were gůt / daß jrs ein wenig weit von einander machten / doch kan ich es euch nicht sagen / ich were dann auff dem platz daß ich es absehen kündt / doch ist mein rath daß jr groß vnd tieff Schantzen machet / vnd wo jr Leut bei dem Fewer haben wolt / ist es von nöten daß jr es vil sorgsamer macht dann anderst wo / damit das Puluer nit dareinn komme / dann es ist von nöten daß zum offtermal vil gůter Leut darzů gehn / deßhalben jr vil Leut verlieren möcht wann es nit wol gemacht were / jhr möcht auch wol etwan darzů gehn / doch nicht zu offt / damit euch nichts widerfare.
  cs: |-
    Chcete-li takto stavět šance, zdá se mi také dobré, abyste je postavili poněkud daleko od sebe. Nemohu vám to však přesně říci, leda bych byl na místě a mohl to odhadnout. Přesto vám radím, abyste dělali velké a hluboké šance. Kde chcete mít lidi u palby, je nutné stavět mnohem pečlivěji než jinde, aby tam nevnikl [nepřátelský] prach {Puluer},[^1] neboť je nutné, aby tam často chodilo mnoho dobrých lidí; kdyby to nebylo dobře udělané, mohli byste přijít o mnoho lidí. Sami tam také můžete občas zajít, ale ne příliš často, aby se vám nic nestalo.
- typ: odstavec
  de: |-
    Wann jr dermassen ewer schantz gemacht / möcht jr wol ein Polwerck odder Polchhauß auff die schantze / so biß zu einem Thor der statt gehen soll oder daruor hinauß machen / als hoch als jr kündt / daß jr damit deren in der statt Pasteien vberhöhet / dardurch kündt jr ewern Feinden vil abbrechen / Vnd sehe mich für gůt an / jr hetts vor ein jedes Thor gemacht / damit sie desto weniger vnder euch herauß fallen künden / vnd gůte Wacht darbei lassen haben.
  cs: |-
    Když jste takto postavili svou šanci, můžete na šanci, která má vést až k některé městské bráně, nebo před ní, zřídit bolverk {Polwerck} nebo srub {Polchhauß}, tak vysoký, jak jen dokážete, abyste jím převýšili bašty {Pasteien} těch ve městě. Tím můžete nepříteli velmi uškodit. A zdá se mi dobré, abyste takový postavili před každou branou, aby mezi vás mohli tím méně vyrážet, a abyste u nich nechali dobrou stráž {Wacht}.
- typ: odstavec
  de: |-
    Auch wann jr ewer schantzen der gestalt gemacht / als nahe zu der stat als es gesein mag / vnd ewer Geschütz steht wie jrs haben wolt / alßdann wann es gesein mag solt jr es mit einander abgehen lassen / vnd nicht einen schuß nach dem andern / sonder als offt es möglich ist / Dann ich wolt jr inn einem tag souil schiessen als sonst in dreien / were auch euch ein grosse ehr vnd nutz / deßgleichen ein grosser schreck ewern Feinden / jhr möcht sie auch dardurch desto ehe vberwinden / solt auch zum offtermal das Geschütz durch etlich vertraut Personen besichtigen lassen / darmit desto baß fleiß fürgewendt werde / vnd soll einem jeglichen schützenmeister der oberst Zeugmeister ein besonders theil an der statt eingeben zubeschiessen / vnd daran sein daß es recht zůgehe / wann ewer Leger geschlagen ist / soll der Marschalck
  cs: |-
    Když jste také takto postavili své šance tak blízko k městu, jak to jen jde, a vaše děla stojí, jak je chcete mít, máte je, je-li to možné, nechat vypálit společně, a ne jednu ránu po druhé, a to tak často, jak to jen jde. Chtěl bych totiž, abyste za jeden den vystříleli tolik jako jindy za tři. Bylo by to pro vás velkou ctí i užitkem a stejně tak velkým postrachem pro vaše nepřátele; tím byste je také mohli dříve přemoci. Máte také často dát děla prohlédnout několika důvěryhodným osobám, aby se tím pilněji pracovalo. Nejvyšší zbrojmistr {oberst Zeugmeister} má každému mistru střelby {schützenmeister} přidělit zvláštní úsek města k ostřelování a dbát, aby se dělo, co se má. Když je vaše ležení {Leger} rozbito, má polní maršálek {Marschalck}
poznamky:
- n: 1
  text: Místo („damit das Puluer nit dareinn komme“) je nejasné; buď jde o nepřátelskou střelbu do šance, nebo o to, aby se oheň nedostal k vlastnímu prachu.
