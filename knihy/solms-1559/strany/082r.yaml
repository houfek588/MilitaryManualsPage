bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    geschetzt wirdt/ wie ob stehet/ bei leib straff/ vnd nach erkantnuß des Obersten.
  cs: |-
    bude oceněn, jak stojí výše – pod trestem na těle a podle uvážení plukovníka {Obersten}.
- typ: odstavec
  de: |-
    Wo der Prouoß oder seine Knecht einen oder mehr so vngehorsam weren vnd mißhandelten/ annemen wolten/ so soll sie niemant daran hindern oder sich wider sie rotten/ vnd derselben annemen/ sonder dabei hanthaben/ vnd ob einer oder mehr dem Prouosen oder seinen Knechten einen gefangen verhinderten/ der mißhandler dadurch hinweg keme/ sol der in aller maß wie der thätter selbst gestrafft werden.
  cs: |-
    Chtěl-li by profous {Prouoß} nebo jeho pacholci zadržet jednoho či více těch, kteří byli neposlušní a provinili se, nikdo jim v tom nesmí bránit, ani se proti nim srocovat a takových se ujímat, nýbrž jim při tom mají pomáhat; a kdyby jeden či více lidí profousovi nebo jeho pacholkům bránili v zadržení zajatce, takže by viník unikl, má být takový potrestán stejnou měrou jako sám pachatel.
- typ: odstavec
  de: |-
    Es soll sich auch keiner vnder zwen Hauptmänner schreiben oder zweimal mustern lassen/ vnd keiner auff des andern namen durchgehen/ auch keiner den andern vnwarhafftiglich versprechen/ welcher das thůt soll an leib vnd leben gestrafft werden.
  cs: |-
    Nikdo se také nesmí nechat zapsat pod dva hejtmany {Hauptmänner} ani se nechat dvakrát přehlédnout {mustern}, a nikdo nesmí projít pod cizím jménem, ani za druhého nepravdivě ručit; kdo tak učiní, má být potrestán na těle i na životě.
- typ: odstavec
  de: |-
    Es soll in der Musterung keiner auff des andern Namen durchgehen/ vnd ein jeder bei seinem rechten Tauff vnd Zůnamen/ auch die Stat darinn oder darbei er am nechsten geborn ist/ nennen vnd einschreiben lassen/ vnd keinn andern vortheil gebrauchen noch niemants darzů helffen raten oder fordern/ damit Keyserliche Maiestat von deren wegen jre bestellung mit vnbillichen vnd vnzulessigen solden nit betrogen oder beschwert werde/ wie das beschehen kündt odder möcht/ welcher das vberfert/ soll nit allein trewloß oder meineydig sein/ vnnd für einn Schelmen gehalten/ sonder darzů auch mit dem Hencker an seinem leib peinlich gestrafft werden.
  cs: |-
    Při přehlídce {Musterung} nesmí nikdo projít pod cizím jménem a každý má uvést a nechat zapsat své pravé křestní jméno i příjmení, rovněž město, v němž nebo nejblíže něhož se narodil, a neužívat žádnou jinou výhodu, ani k tomu nikomu nepomáhat, neradit a nenapomáhat, aby císařské Veličenstvo nebylo při tomto svém najímání {bestellung} podvedeno a obtíženo nespravedlivými a nepřípustnými žoldy {solden}, jakkoli by se to mohlo stát; kdo to přestoupí, má být nejen pokládán za věrolomného, křivopřísežníka a ničemu, nýbrž má být navíc hrdelně {peinlich} potrestán na svém těle katem {Hencker}.
- typ: odstavec
  de: |-
    Es soll auch keiner dem ander weder wehr noch Harnisch vff dem Musterplatz darleihen/ bei verlierung des leibs.
  cs: |-
    Nikdo také nesmí druhému na přehlídkovém místě {Musterplatz} půjčovat zbraň ani zbroj {Harnisch} – pod ztrátou hrdla.
- typ: odstavec
  de: |-
    Wo reissige vnd fůßknecht bei einander in einem Leger ligen würden/ sollen die Knecht zimlicher massen weichen/ darmit die Reissigen jre pferde vnder brengen mögen/ vnd sich mit einander leiden.
  cs: |-
    Kde by jezdci {reissige} a pěší knechti {fůßknecht} leželi pospolu v jednom ležení {Leger}, mají knechti v přiměřené míře ustoupit, aby jezdci mohli ustájit své koně, a mají se navzájem snášet.
- typ: odstavec
  de: |-
    Es soll sich auch ein jeder/ wie er von dem Quartiermeister/ Forirer oder Rotmeister losiert wirt/ desselben orts benügen lassen/ vnnd sich des friedtlich vnd gütlich betragen.
  cs: |-
    Každý se má rovněž spokojit s tím místem, kam jej ubytuje {losiert} kvartýrmistr {Quartiermeister}, furýr {Forirer} nebo rotmistr {Rotmeister}, a chovat se tam pokojně a snášenlivě.
- typ: odstavec
  de: |-
    Es soll auch keiner on sondern beuelch des Obersten brantschatzen/ brennen/ oder die Leger anzünden/ bei leib straff/ sonderlich soll mann das nicht thůn/ wo das volck vor oder durch zeucht/ daß die nach hůt oder Prouiant dardurch nicht verhindert werde.
  cs: |-
    Nikdo také nesmí bez zvláštního rozkazu plukovníka vybírat výpalné {brantschatzen}, pálit či zapalovat ležení – pod trestem na těle; zvláště se tak nesmí činit tam, kudy vojsko táhne napřed nebo prochází, aby tím nebyl zdržen zadní voj {nach hůt} nebo proviant {Prouiant}.
- typ: odstavec
  de: |-
    Es soll sich auch ein jeder des zůtrinckens massen/ dann wo inn der vollen weise einer von den Feinden gefangen würde/ oder in der vollen weise schlüg/ vnd sonst etwas handelt/ soll eben so wol als ob er nüchtern were/ gestrafft werden.
  cs: |-
    Každý se má také mírnit v připíjení {zůtrinckens}; neboť kdyby byl někdo v opilosti zajat nepřáteli nebo se v opilosti pral a dopustil se něčeho jiného, má být potrestán zrovna tak, jako by byl střízlivý.
- typ: odstavec
  de: Es soll auch keiner keinen lermen on den Hauptman vnd sein
  cs: Nikdo také nesmí vyvolat poplach {lermen} bez hejtmana {Hauptman} a jeho
