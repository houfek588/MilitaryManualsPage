bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Ritmeister mit seinen Reuttern besonder vnnd nit vnder einander / in einer geuierdten gleichen zal neben vnd hinder sich halten / dann kan er bald sehen was mangelt / aber darmit einer solliche Ordnung recht mit der zal geuierdt mach / das eines jeden Ritmeisters zal gerad mit der Ordnung treffe so soll mann des Ritmeisters Register nemen / darinn die zal vnd sum seiner Reutter suchen / vnd auff solche maß stellen wie hernach verzeichnet.
  cs: |-
    rytmistra {Ritmeister} stát s jeho jezdci {Reuttern} zvlášť, a ne pomíchané, ve čtverci {geuierdten} o stejném počtu [mužů] vedle sebe i za sebou; pak hned uvidí, co chybí. Aby však někdo takový šik {Ordnung} správně sestavil do čtverce podle počtu, tak aby počet každého rytmistra přesně odpovídal šiku, má se vzít rytmistrův rejstřík {Register}, vyhledat v něm počet a úhrn jeho jezdců a postavit je podle míry, jak je zapsáno dále.
- typ: odstavec
  de: |-
    Durch dise nachuolgende Ziffer mag nit allein die Mutiplication der zal / sonder auch alle Glieder in Ordnung des Kriegßuolcks zu roß vnd fůß in ein geuierdte Ordnung vnd platz gestellt werden / vnd fahen die ziffer mit 1. an vnd gehn biß auff 1024.
  cs: |-
    Podle následujících čísel lze nejen násobit {Mutiplication} počty, ale také postavit všechny řady {Glieder} v šiku válečného lidu {Kriegßuolcks} na koni i pěšky do čtvercového šiku {geuierdte Ordnung} a na místo. Čísla začínají od 1 a jdou až do 1024.[^1]
