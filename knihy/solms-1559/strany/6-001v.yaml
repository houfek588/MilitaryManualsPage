poznamky:
- n: 1
  text: |-
    Tabulka druhých mocnin 1–32 slouží k sestavení čtvercového šiku: kolik mužů má být v řadě, aby jich bylo stejně v řadě i do hloubky (např. 100 jezdců = 10 × 10). „Mutiplication“ je tisková chyba za Multiplication.
- n: 2
  text: |-
    Ve zkoumaném exempláři je u tohoto řádku na okraji rukou připsáno „1000“, zřejmě jako oprava čísla 100: teprve u tisíce jezdců dává smysl, že autor tabulku zastavuje u 1024 (= 32 × 32).
