- typ: odstavec
  de: |-
    Dise Ziffern vnd Rechnung mag mann machen so ferr wie einer will / aber dieweil ein Ritmeister selten mehr dann 100. pferdt fürt / wil ichs diß mal bei 1024. lassen / was einer weiter hat mag mann besonder ein hauffen von derselbigen zal stellen. Wann mann dann den oder die hauffen also in einer geuierdten zal hat / vnd die summen in Glieder rechnet / soll mann durch die Glieder reitten / was vntüglich ist auß mustern vnd auff ein ort reitten lassen / dann rechnen wie sich das gebürt / vnd wem der oder dieselbigen zustehn / hat der Musterherr mit zu reden vnd zu vergleichen / Deßgleichen soll ein jeglicher Ritmeister seinen Wagen / Drosser oder was er derhalben hat das zu mustern gehört / bei seinem hauffen mit im feld haben / etc.
  cs: |-
    Tato čísla a výpočet lze vést, jak daleko kdo chce. Protože však rytmistr zřídka vede víc než 100 koní, nechám to tentokrát při 1024;[^2] co má kdo navíc, z toho lze postavit zvláštní houf {hauffen} o témž počtu. Když se pak houf či houfy takto postaví do čtverce a úhrn se spočítá po řadách, má se projet řadami, co je nezpůsobilé, vyřadit z přehlídky {auß mustern} a nechat odjet stranou, a potom řádně spočítat; s tím, komu takový jezdec či jezdci náležejí, má promluvit a vyrovnat se přehlídkový komisař {Musterherr}. Rovněž má každý rytmistr mít při svém houfu v poli své vozy, trénní koně {Drosser} nebo cokoli dalšího, co k přehlídce patří, atd.
- typ: odstavec
  de: |-
    Aber erstlich so ein Herr sein Ritmeister annemen wirt / dann soll er
  cs: |-
