bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vnd Herr/ mich etlich Jar allergedigst inn Kriegen gebraucht/ vnd also im Feld gehabt/ vnd mit Statlichen hohen ehrlichen Emptern/ zuuerwalten allergnedigst begabt/ vertrauet vnd beuolhen/ wiewol ich derselbigen nit gnugsam verstendig wie noch gewest/ so hat jhre Keiserlich Maiestat mich des vndericht vnd geweiset/ vnd also ein gnedigstes mitleiden/ vnd gedult getragen/ des ich mich erkenne/ vnd schuldig bin/ nach meinem höchsten/ vermügen zuuerdienen/ das ich auch (wils Gott) die tage meines lebens thun wil/ mit allem was ich vermag.
  cs: |-
    a pán, mě po několik let nejmilostivěji[^1] užíval ve válkách, měl mě u sebe v poli a nejmilostivěji mi udělil, svěřil a přikázal ke správě znamenité, vysoké a čestné úřady. Ačkoli jsem jim nerozuměl dostatečně, jako jim nerozumím ani dosud, Jeho císařské Veličenstvo mě v tom poučovalo a vedlo a mělo se mnou nejmilostivější shovívavost a trpělivost. Toho jsem si vědom a jsem povinen to podle svých nejvyšších sil odsloužit, což také (dá-li Bůh) budu činit po všechny dny svého života vším, co zmohu.
- typ: odstavec
  de: |-
    Dieweil dann die zeit/ so bei jhrer Keiserlich Maiestat ich also im Feld gewest/ so habe von derselbigen jhrer Keiserlich Maiestat ich wol vil geschickter vnd ernstlicher Kriegßstück gesehen/ welche ich zu bedencken genomen/ verzeichnet vnd zusamen gebracht/ auch von den alten erfarnen Kriegßhern vnd Kriegßuerwaltern/ darmit ich in gůter freundtschafft gestanden/ vil bericht vnd erfarung/ schrifftlich/ müntlich vnd verzeichnuß bekomen/ welchs ich alles also behalten vnd zusamen gebracht/ mit sampt meinem selber mitbedencken/ wie wol der wenig ist/ doch so habe ich darinen mein fleiß gehabt/ zu dem besten ich kundt vnd verstehn habe mögen.
  cs: |-
    Když jsem tedy onen čas takto pobýval v poli u Jeho císařského Veličenstva, viděl jsem u Jeho císařského Veličenstva mnoho obratných a vážných válečných akcí, které jsem si vzal k uvážení, zaznamenal a shromáždil. Také jsem od starých zkušených válečných pánů {Kriegßhern} a válečných správců, s nimiž jsem byl v dobrém přátelství, získal mnoho zpráv a zkušeností písemně, ústně i v zápisech. To vše jsem uchoval a shromáždil spolu s vlastním uvažováním – byť ho je málo, vynaložil jsem na to píli, jak nejlépe jsem uměl a dokázal pochopit.
- typ: odstavec
  de: |-
    Nach dem dann ich nun mehr in mein alter durch Gottes gnaden komen/ leibs vnnd vnuermögen halben nicht mehr inn das Feld/ zu Kriegen vermage/ noch solche beuelch vnd Ampter/ wie ich gehabt nit mehr (wie sich gebürt/ Arbeit halben) versehen mag/ gleich als ich gern vnd getreulich thun wolte/ so habe ich doch nit vnterlassen wöllen/ auß vnderthenigstem gemüt/ so zu dem Osterreichischen blut ich habe/ vnd auch gern danckbarlich der gnaden vnnd ehren/ so die Römische Keiserliche Maiestat mir in dem gethan hat/ sein wöl/ mit allem das ich vermöchte.
  cs: |-
    Protože jsem však z Boží milosti již dospěl do stáří a pro tělesnou nemohoucnost již nemohu do pole válčit, ani již nemohu taková velení a úřady, jaké jsem míval (jak se sluší, pro námahu), zastávat, jakkoli bych to rád a věrně činil, nechtěl jsem přece opomenout z nejpokornější oddanosti, kterou chovám k rakouské krvi, projevit podle všech svých sil vděčnost za milosti a pocty, jež mi v tom Římské císařské Veličenstvo prokázalo.
- typ: odstavec
  de: |-
    Dieweil mein vermögen dann gering/ vnd ich auch wie vor gethan/ nit mehr dienens vermage/ so hab ich vor mich genomen/ solche Kriegßhandelung zusamen zutragen/ vnd in ein Ordentlich beschreibung zubringen/ vnd Ewer Königlich Maiestat als die sonder zweiffel/ inn die stapffen derselbigen hochlöblichster gedechtnuß/ voraltern als der hochgebrauchten vnd Kriegßuerstendigen Fürsten tretten vnd nach setzen werden/ als der von Gott mit so vilen Königreichen vnd Landen begabt ist/ dieselbige zubeschirmen vnd vertheidigen/ vnd mit mehrer dieselbigen zu erweitern/ mit gůt thun werden.
  cs: |-
    Protože jsou tedy mé síly nepatrné a nemohu již sloužit jako dříve, předsevzal jsem si taková válečná jednání shromáždit a uvést v řádný popis [a předložit je] Vašemu královskému Veličenstvu. To bezpochyby vstoupí do šlépějí svých předků nejchvályhodnější paměti, vysoce osvědčených a války znalých knížat, a bude je následovat, jsouc od Boha obdařeno tolika královstvími a zeměmi, aby je chránilo a hájilo a navíc rozšiřovalo; to vše s dobrým výsledkem vykoná[^2].
- typ: odstavec
  de: |-
    Derhalben so hab ich/ wie vorgemelt/ sölchs alles zusamen getragen/ vnd Ewer Königliche Maiestat dasselbige als dem nechsten blut/
  cs: |-
    Proto jsem tedy, jak bylo řečeno, toto vše shromáždil a Vašemu královskému Veličenstvu jakožto nejbližší krvi
poznamky:
- n: 1
  text: |-
    Tisk má podobu *allergedigst* (sazečská odchylka za *allergnedigst*).
- n: 2
  text: |-
    Tisk má *mit gůt thun werden* (OCR čte chybně *nit*); rozumí se patrně „vykoná dobře, s dobrým výsledkem“, případně „vlastními statky“ (*Gut*). Věta je anakolutická – sloveso k *Ewer Königlich Maiestat* (*zu zůstellen*, „odevzdat“) přináší až následující odstavec.
