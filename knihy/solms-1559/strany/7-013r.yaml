sken: 573
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Erstlich der Veldmarschalck den vorzug tausent pferdt / mehr oder weniger / die nimpt mann auß allen Hauffen / darmit sich niemandt zubeschweren hab / vmb den vorzug deßgleichen vmb der Losamenter willen.
  cs: |-
    Nejprve polní maršálek {Veldmarschalck} s předvojem {vorzug} o tisíci koních, více či méně. Ty se berou ze všech houfů {Hauffen}, aby si nikdo nemohl stěžovat kvůli předvoji ani kvůli ubytování {Losamenter}.
- typ: odstavec
  de: |-
    Zu disem Renhauffen hat mann allwegen etlich Reutter angehenckt / souil mann gewölt hat / die mann die flügel nennt / auff beiden seiten / die haben alle ding auff beiden seiten besichtigt / etc.
  cs: |-
    K tomuto předvojovému houfu {Renhauffen} se vždy na obou stranách připojovalo několik jezdců {Reutter}, kolik jich chtěli mít; říká se jim křídla {flügel}. Ti prohlíželi všechno po obou stranách atd.
- typ: odstavec
  de: |-
    Auff den Renhauffen gehöret der Oberst Veldherr mit seinem Hoffgesind / vnd andere Herrn vnd gůt gesellen / die auff jhn zuwarten bescheiden sind / doch mag er bleiben zu seiner gelegenheit / wo es jm gefelt.
  cs: |-
    Za předvojový houf patří nejvyšší válečný pán {Oberst Veldherr} se svými dvořany {Hoffgesind} a další páni a dobří tovaryši, kteří jsou mu určeni k službám. Může však podle své potřeby zůstat, kde se mu líbí.
- typ: odstavec
  de: |-
    Auff solche zwen reisigen Hauffen gehöret das best Veldgeschütz / wieuil mann des hat / mit sampt Kugeln vnd Puluer / als vil die notturfft erfordert / das gibt sich gleichwol an jm selbst.
  cs: |-
    Za tyto dva jízdní houfy {reisigen Hauffen} patří nejlepší polní děla {Veldgeschütz}, kolik jich kdo má, spolu s koulemi {Kugeln} a prachem {Puluer}, kolik vyžaduje potřeba; to se ostatně rozumí samo sebou.
- typ: odstavec
  de: |-
    Auff solchs Geschütz gehört ein hauff Fußuolck / darnach auff daßselbig das gewaltig Geschütz / mit sampt der Monition so darzů gehört.
  cs: |-
    Za tato děla patří houf pěchoty {Fußuolck}, za ním těžká děla {gewaltig Geschütz} spolu s municí {Monition}, která k nim patří.
- typ: odstavec
  de: |-
    Darnach wider ein geschwader Reutter / wie mann dasselbig außtheilt / das ist allwegen der gewaltig Hauff vnder den Reisigen gewesen / vnd wechseln die Reisigen vnd Fußuolck mit jrem vor vnd nachzug vmb / außgenommen den Renfanen / der hat zu den Feinden den vorzug / von den Feinden den nachzug.
  cs: |-
    Potom zase švadrona {geschwader} jezdců podle toho, jak se jízda rozdělí; ta byla vždy hlavním houfem {gewaltig Hauff} jízdy {Reisigen}. Jízda a pěchota se střídají v předvoji a zadním voji {nachzug}, kromě předvojové korouhve {Renfanen}: ta má předvoj, když se táhne k nepříteli, a zadní voj, když se od nepřítele odtahuje.
- typ: odstavec
  de: |-
    Auff solchen reisigen Hauffen gehöret wider ein hauff Fußuolck / will mann den ein Veldgeschütz zugeben / das mag mann thůn oder lassen.
  cs: |-
    Za tento jízdní houf patří opět houf pěchoty; chce-li se k němu přidat polní dělo, lze to udělat, nebo nechat být.
- typ: odstavec
  de: |-
    Auff sollichen hauffen Fußuolck gehöret wider ein Geschwader Reisigen.
  cs: |-
    Za tento houf pěchoty patří opět švadrona jízdy.
- typ: odstavec
  de: |-
    Auff solche Geschwader Reisigen wider ein hauff Fußuolck / das ist als vil als der Nachzug / darzů hat wann allweg das geringst vnd schlechts Veldgeschütz als vil die notturfft erfordert / mit sampt Puluer vnd Kugeln verordnet.
  cs: |-
    Za tuto švadronu jízdy opět houf pěchoty; ten tvoří zadní voj. K němu se vždy přidělovala nejmenší a nejprostší polní děla,[^1] kolik vyžadovala potřeba, spolu s prachem a koulemi.
- typ: odstavec
  de: |-
    Auff solchen Nachzug wider ein Geschwader Reutter.
  cs: |-
    Za tímto zadním vojem opět švadrona jezdců.
- typ: odstavec
  de: |-
    Disem Geschwader hat mann alwegen von Reuttern ein Nachhut / als vil mann deren / hundert mehr oder weniger / haben wöllen zugeben.
  cs: |-
    Této švadroně se vždy přidávala zadní stráž {Nachhut} z jezdců, kolik jich kdo chtěl mít, sto, více či méně.
- typ: odstavec
  de: |-
    Diser Zug ist in drei theil getheilt / den mag mann aber inn vier /
  cs: |-
    Toto tažení {Zug} je rozděleno na tři části; lze je však rozdělit i na čtyři,
poznamky:
- n: 1
  text: |-
    Tisk má „darzů hat wann allweg“, zřejmě tiskovou chybu za „hat mann“. Na okraji skenu jsou ruční poznámky čtenáře (číslice „1)“–„3)“ a nečitelná slova), které nejsou součástí tisku.
