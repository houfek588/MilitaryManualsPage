poznamky:
- n: 1
  text: |-
    Obrazové karty jsou v exempláři BSB zřejmě tištěny na samostatných proužcích papíru a do knihy vlepeny (patrné okraje lístků). Karty strany Hannibalovy jsou tištěny černě, karty Římanů červeně (od [[7-007v|listu 7v]]). Jména osob, které těmto úřadům odpovídají, uvádějí textové karty na [[7-006r|listu 6]].
