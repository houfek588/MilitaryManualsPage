poznamky:
- n: 1
  text: |-
    Půl vozu za 17 nocí po 12 bacenech dává 102 bac. = 6 zl. 12 bac.; tisk má 6 zl. 13 bac., úhrn 34 zl. však počítá s 12 bacenech.
- n: 2
  text: |-
    Zlomek je v tisku špatně čitelný; podle položky Endrese Haberkorna (*Zwei drittheil eins wagens*) jde o ⅔ vozu.
