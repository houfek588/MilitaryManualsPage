bloky:
- typ: odstavec
  de: |-
    Dann es kan wol geschehen/ daß die jenige so die Prouiant auff dem Landt bestellen/ wol ein zimlichen billichen kauff oder bestellung thůn/ vnd so die in das Leger kompt vnder die Prouosen zuschetzen/ so nemen sie gelt von den Marcatanten/ vnd schetzen die so hoch nach jrem gefallen/ damit sie jre verehrung auch daruon kriegen mögen. Auch so die Obersten die Prouiant zu sich nemen/ ein eygen platz bei jren Losamentern haben/ darauff mann die stuckweiß holen můß/ ist zu besorgen/ sie haben jre maß auch im faß/ so das mit massen gezapfft werden soll/ mann kan die maß kleinern/ er kan ein pfenning auff die maß schlagen/ der ist sein/ er kan bei der nacht den wein mit wasser mengen/ das tregt inn an der maß/ vnd wirt das Wasser zu wein gemacht/ vnd verkaufft/ so dann die maß etwas verkleinert ist/ das tregt im hauffen alles zusamen vil. Darumb verordnen Ewer Römis. Keyser. Maiestat den Prouiantherrn darzů/ daß der den Wein/ so bald er den geschetzt hat/ inn die Leger vnd Regiment verordene/ vnnd also hinfüren/ einen jeden Prouiantmeister das sein vberantworten lasse.
  cs: |-
    Může se totiž snadno stát, že ti, kdo proviant {Prouiant} na venkově objednávají, nakoupí či objednají sice za slušnou a přiměřenou cenu, ale když proviant dorazí do ležení {Leger} a mají jej ocenit profousové {Prouosen}, vezmou si tito peníze od markytánů {Marcatanten} a ocení jej podle své libosti tak vysoko, aby z toho dostali i svůj dar. Také když si plukovníci {Obersten} berou proviant k sobě a mají u svých ubytování {Losamentern} vlastní místo, kam si pro něj lidé musejí chodit po kusech, lze se obávat, že mají i v sudu svou míru. Má-li se víno čepovat po mázech {maß}, může se máz zmenšit; [prodavač] může na každý máz přirazit fenik a ten je jeho; může v noci míchat víno s vodou, což mu na mázu vynáší, a voda se tak udělá vínem a prodá. A je-li k tomu máz trochu zmenšený, vynese to všechno dohromady mnoho. Proto ať Vaše římské císařské Veličenstvo nařídí proviantnímu pánovi {Prouiantherrn}, aby víno, jakmile je ocení, přidělil do ležení a k plukům {Regiment}, dal je tam dopravit a nechal každému proviantmistrovi {Prouiantmeister} odevzdat jeho díl.
- typ: odstavec
  de: |-
    Deßgleichen mit dem Brot so inn die Commiß gehört/ auch ein trewliche handlung vnd ordenung zuhalten/ dann mit dem Brot ist in vilweg wol zu verschlagen/ vnd parttierung zutheilen vnd zu gewinnen/ vnnd soll sonderlich ein Prouiantherr/ oder wer die Commiß versicht/ nicht seine Leut haben/ die daussen auff dem landt einkauffen odder bestellen/ sonder dieselbigen sollen Ewer Römischen Keyserlichen Maiestat leut vnd diener sein/ vnnd sich halten/ wie oben gemelt. So soll Ewer Römische Keyserliche Maiestat/ keinem nicht vergünnen/ er sei wer er wöl/ daß er für sich allein mit der Prouiant handlen wöl/ Dann wann dasselbig geschicht/ so können sie keinen andern darbei leiden/ mögen dem armen Landtuolck nicht vergünnen/ daß sie auch hinein Brot tragen odder fůren/ schicken jnen zů/ daß sie nidergeworffen/ gefangen vnnd erstochen werden/ vnd alles genommen wirt was sie haben. Darumb sollen Ewer Römische Keyserliche Maiestat/ dem Prouiantherrn zu dem hefftigsten beuelhen/ daß er das Geleyt fleissig vnd wol halte/ darzů soll mann jhm statlich helffen/ dann wo ein gůt geleit gehalten wirdt/ das ein jeder mag mit seiner Wahr an vnd abkommen/ da fůrt mann zů/ vnd da ist der arm Man willig/ Wir besorgen das bei der Commiß/ etwan das volck/ so Prouiant ausserhalb der Commiß brengt/ mit fleiß nicht wol geleyt werde/ auff daß sie schaden nemen sollen/ darumb laß Ewer Römische Keyserliche Maiestat gůt Geleyt halten.
  cs: |-
    Stejně tak je třeba zachovávat poctivé jednání a řád u chleba, který patří do komisu {Commiß}. S chlebem se totiž dá mnoha způsoby šidit, pokoutně jím kšeftovat a vydělávat. Zvláště proviantní pán, nebo kdokoli komis obstarává, nemá mít vlastní lidi, kteří venku na venkově nakupují nebo objednávají; ti mají být lidmi a služebníky Vašeho římského císařského Veličenstva a chovat se, jak bylo řečeno výše. Vaše římské císařské Veličenstvo také nemá nikomu, ať je to kdokoli, dovolit, aby s proviantem obchodoval sám. Kde se to stane, nesnesou vedle sebe nikoho jiného a nepřejí ani chudému zemskému lidu {Landtuolck}, aby také nosil či vozil do ležení chléb; posílají na ně lidi, aby je přepadli, zajali a ubodali a vzali jim všechno, co mají. Proto má Vaše římské císařské Veličenstvo proviantnímu pánovi co nejpřísněji přikázat, aby pečlivě a dobře zajišťoval glejt {Geleyt}, tedy bezpečný průvod, a má se mu v tom vydatně pomáhat. Kde se totiž udržuje dobrý glejt, takže každý může se svým zbožím přijet i odjet, tam se proviant dováží a chudý člověk to dělá ochotně. Obáváme se, že u komisu někdy úmyslně špatně doprovázejí lid, který přiváží proviant mimo komis, aby přišel ke škodě. Proto ať Vaše římské císařské Veličenstvo dá udržovat dobrý glejt.
