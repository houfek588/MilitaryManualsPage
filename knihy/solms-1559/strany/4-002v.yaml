  popis: |-
    Celostránkový dřevořez se dvěma technickými pohledy na konstrukci moždířové stolice označenými písmeny „B“ a „C“. Nahoře („B“) boční pohled na prořezanou obloukovou bočnici stolice s ozubeným kolem, západkou a klikou náměrového mechanismu; dole („C“) půdorysný pohled shora na týž moždíř stojící uvnitř trámového rámu s navíjecím hřídelem a dvojicí napínacích lan.
