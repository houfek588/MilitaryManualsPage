bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    opffer / vnd zusag nach erlangtem sig verheissen / vnd seinen Abgöttischen namen in grossen ehren gehalten / Also das er so offt sein Königliche Kron zu ehren dem abgöttischen namen verzuckt. Wir lesen auch vnd finden das des Machomets namen (der doch der höchste Ketzer vnd mehr dann die halbe Welt vom Christlichen glauben abgewandt vnd in sein Ketzerei verfürt in höchsten ehren gehalten / vnd von den seinen herlich angebet ward / da von nun vil Exempel zuschreiben weren / ist aber bei den Heiden jhres Gotts namen / die doch Teuffel waren vnd noch seind / von denen die den rechten Gott nit erkandt / solcher massen inn ehren gehalten / solten wir Christen vns billich schemen / die wir vnns Christen heissen / des Euangelij vnnd wort Gottes zum vberfluß vnd on maß rhůmen / ja wöllen auch alle habe / Weib / Kind / gůt / leib / leben vnd was wir haben bei den heiligen namen Gottes setzen vnd zu ehren vorstrecken / Wir nemen aber nicht acht wie wir (Gott erbarms) den gebenedeiten namen Gottes nit allein / sonder auch seinen heiligen Leib / Blůt / Marter / Leiden / Wunden / Macht / Krafft / Item Sacramment / Tauff / Crisam / vnnd was mehr zur schmach / schandt vnd Gottßlesterung erfinden vnd erdacht mag werden / teglich in vnsern vnuerschempten lestermeulern füren / als obs ein grosser rhum vnd ehr solt sein / vnsers berümpten glaubens. Wiewol wir vns des alten vnd newen Testaments hoch rhůmen / auch in allen Zechen vnd winckeln daruon disputiern / so sehen wir nicht auff das ander Gebott der ersten Tafeln / im anderen Bůch Moyse: Du solt den namen Gottes deines Herren nicht vergeblich füren / dann der Herr wirt den nicht vnschuldig halten der seinen Namen vnnützlich fürt. Item im dritten Bůch Moyse / sagt der Herr zu Moysen / Füre den Gottßlesterer auß dem Leger der geflůcht hat / vnd laß jnen die gantz Gemein steinigen vnd sag den Kindern Jsrael / Welcher seinem Gott flůcht / der soll seine sünd tragen / wer des Herren namen vnnütz nennet der soll des todts sterben / die gantze Gemein soll jnen steinigen / er sei gleich frembd oder heimisch / wenn er den namen des Herren vnnützlich nennet so soll er sterben. Im andern Bůch Machabeorum haben wir ein erschrecklich Exempel von dem Antiocho / einem verfolger des namen Gottes vnnd der Kinder Israel / die zu derselben zeit Gott Volck geheissen waren / von Gott also grausamlich / seines Gottßlesterns halben / gestrafft / daß sein leib voller würm vnd gestanck ward / daß ers selbst nicht riechen kundt / das also der Mörder vnd Gottßlesterer auff einem Berg eines elenden vnd schendtlichen todts sterben můst.
  cs: |-
    oběť a dary po dosaženém vítězství a jeho modlářské jméno choval ve veliké cti – a to tak, že kdykoli [je zaslechl], smekal na počest toho modlářského jména svou královskou korunu. Čteme také a shledáváme, že jméno Mohamedovo – který je přece největším kacířem a odvrátil od křesťanské víry a svedl do svého kacířství více než polovinu světa – bylo chováno v nejvyšší cti a jeho stoupenci je slavnostně vzývali, o čemž by se dalo napsat mnoho příkladů. Jestliže tedy pohané, kteří nepoznali pravého Boha, takto ctili jméno svých bohů – kteří přece byli a jsou ďáblové –, měli bychom se právem stydět my, kdo si říkáme křesťané, kdo se nadmíru a bez míry chlubíme evangeliem a slovem Božím, ba chceme pro svaté jméno Boží a k jeho cti nasadit a vydat všechen majetek, ženu, dítě, statek, tělo i život a vše, co máme. Přitom si však nevšímáme, jak (Bůh se smiluj!) nejen požehnané jméno Boží, ale i jeho svaté tělo, krev, umučení, strasti, rány, moc a sílu, dále svátost, křest, křižmo[^1] a vše, co jen lze k potupě, haně a rouhání Bohu vymyslet a vynalézt, denně nosíme ve svých nestydatých rouhačských ústech, jako by to měla být veliká sláva a čest naší proslulé víry! Ačkoli se velice chlubíme Starým i Novým zákonem a při každé pitce i v každém koutě o nich vedeme učené spory, nehledíme na druhé přikázání první desky ve druhé knize Mojžíšově:[^2] „Nevezmeš jména Boha, Pána svého, nadarmo, neboť Pán nenechá bez viny toho, kdo jeho jméno užívá nadarmo.“ Dále ve třetí knize Mojžíšově[^3] praví Pán Mojžíšovi: „Vyveď rouhače, který klel, z ležení {Leger} ven a nech jej ukamenovat celou obcí {Gemein} a řekni synům Izraele: Kdo zlořečí svému Bohu, ponese svůj hřích; kdo nadarmo vysloví jméno Páně, zemře smrtí, celá obec jej ukamenuje, ať je cizinec nebo domácí; užije-li jméno Páně nadarmo, zemře.“ Ve druhé knize Makabejské[^4] máme strašný příklad Antiocha,[^5] pronásledovatele jména Božího a synů Izraele, kteří se tehdy nazývali Božím lidem. Bůh jej za jeho rouhání tak krutě potrestal, že jeho tělo bylo plné červů a takového zápachu, že jej sám nemohl snést, a tento vrah a rouhač musel zemřít na hoře bídnou a hanebnou smrtí.
- typ: odstavec
  de: Jesus Sirach sagt / wer vil schwert der wirdt mit missethat
  cs: 'Ježíš Sirachovec praví:[^6] „Kdo mnoho přísahá, bude naplněn nepravostí'
poznamky:
- n: 1
  text: |-
    V originále *Crisam* (křižmo, svěcený olej užívaný při křtu a biřmování).
- n: 2
  text: Na levém okraji tisku je uveden odkaz *Exodi. 20.* (Ex 20,7).
- n: 3
  text: Na levém okraji tisku je uveden odkaz *Leuiti. 24.* (Lv 24,11–16).
- n: 4
  text: Na levém okraji tisku je uveden odkaz *Machab. 9.* (2 Mak 9,5–28).
- n: 5
  text: |-
    Seleukovský král Antiochos IV. Epifanés (zemř. 164 př. n. l.). Tisk zde má zkrácené spojení *Gott Volck* místo *Gotts Volck*.
- n: 6
  text: |-
    Na levém okraji tisku je uveden odkaz *Ecclesi. 23.* (Sir 23,11). Slovo *vberladen* je rozděleno přes konec strany (`vber-` + kustod `laden`) a převedeno celé na následující list `1-019r`.
