- typ: nadpis
  uroven: 3
  de: Marggraff Albrechts etc. Stat.
  cs: Stav {Stat} markraběte Albrechta atd.[^4]
- typ: tabulka
  de:
  - - |-
      Auff 648 Gerüste pferd gebürn jren F. G. auff jedes pferd 1 gulden/ thůt
    - 648 flo.
  - - |-
      Auff jedes hundert pferd einen Trabanten dem trabanten monatlich 8 gulden/ thůt 6 trabanten/ vnd einen sold auff ein halben trabanten/ macht zu gelt
    - 52 flo.
  - - |-
      Auff je fünfftzig pferd ein Rotmeister jedem gebürt auff sein ampt 25 gulden/ thůt 13 Rotmeister/ macht zu gelt
    - 325 flo.
  cs:
  - - |-
      Na 648 zbrojných koní náleží Jeho knížecí Milosti {F. G.} na každého koně 1 zlatý {gulden}; to činí
    - 648 zl.
  - - |-
      Na každých sto koní jeden drabant {Trabanten}, drabantovi měsíčně 8 zlatých; to činí 6 drabantů a žold na půl drabanta, v penězích
    - 52 zl.
  - - |-
      Na každých padesát koní jeden rotmistr {Rotmeister}, každému náleží za jeho úřad 25 zlatých; to činí 13 rotmistrů, v penězích
    - 325 zl.
poznamky:
- n: 1
  text: Tisková chyba *gerüsteer* za *gerüster*.
- n: 2
  text: |-
    Úhrn 8 přespočetných koní skupiny Johanna von Bruch, Reinharta Gaburta a Jeronima Stackela neodpovídá položkám na předchozí straně, kde je uvedeno jen 6 (u Gaburta); úhrn celého oddílu (68) však s 8 počítá.
- n: 3
  text: |-
    Jméno je v tisku poškozené (*Scha?t*); na [[6-026v|s. 6-026v]] stojí *Jobst Schat*.
- n: 4
  text: |-
    *Stat* (Staat) – rozpočet na osobu velitele, jeho dvůr a úředníky, který se platil vedle žoldu jízdy; srov. služební list na [[6-017r|s. 6-017r]]. Úhrn zbrojných koní 648 = 305 + 88 + 108 + 147.
