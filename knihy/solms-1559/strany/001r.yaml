bloky:
- typ: nadpis
  uroven: 2
  de: Oberster Kriegsherr.
  cs: Nejvyšší válečný pán {Oberster Kriegsherr}.
- typ: odstavec
  de: |-
    EIn Oberster Kriegsherr/ der einen gewaltigen Heerzug thůn muß vnd wil/ der soll für das erst/ mit seinem geheymen vnnd vertrautten freunden vnd Räthen/ den Krieg berathschlagen vnd bedencken/ vnnd so er dann also den Krieg zufüren/ beschlossen hat/ so soll er jn vberschlagen/ wieuil er wil Reysigen haben/ vnnd wieuil einer jeden rüstung/ schwere vnd geringe/ das muß er rechnen vnnd wissen/ was sein widertheil/ von Reutern/ Knechten vnnd rüstung vermag/ vnnd ob des Land/ darinn er soll oder wil/ ein Land sei/ das mit Reuttern darinn zu handlen ist oder nicht/ Deßgleichen mit den Knechten auch also darnach. So wil gerechnet sein/ was er für Geschütz bedürfftig ist/ von was gattung/ vnd wieuil/ deßgleichen jre notröstung vnd Municion/ auch was mann von Schiffbrucken von nöten ist/ vnd mit nemen wil. Also soll dasselbig für das erst gerechnet vnd geordenet werden/ Vnd wan dan das Krigsuolck zu roß vnd fuß/ also geordenet ist mit sampt dem Geschütz vnd seinem zugehörde/ Alßdann so soll ein Herr auff alle Person zu roß vnd fuß/ ein jedes nach seiner gebür/ die Söld rechnen vnd summiern auff ein Monat lang/ auch den anzug oder reitgelt vnd den abzug/ wann ein Herr dann das geordnet vnd gerechnet hat/ so hat er dann den Krieg zu vberschlagen/ dann er wert kurtz oder lang/ so wil der anzug/ deßgleichen der abzug da sein/ so hat der Herr dann den Monat besonder gerechnet/ den an vnnd abzug auch ein jedes besonder/ so neme er dan den einigen Monat mit seiner summa gelts/ vnd acht wieuil Monat er vermeint zu kriegen/ oder sein Kriegsuolck bei einander zubehalten/ darnach so multiplicir er die summen gelts auff die summa seiner vorgenommener Monat/ vnd besehe daß er des gewiß sei/ vnd schlag noch ein Monat vbrig darauff/ dann es ist besser zuuil dann daß es mangeln würde/ auß viller erfaren vrsachen/ sonder not zu beschreiben.
  cs: |-
    Nejvyšší válečný pán, který musí a chce podniknout mocné polní tažení {Heerzug}, se má nejprve o válce poradit a uvážit ji se svými důvěrnými a spolehlivými přáteli a rady. Jakmile se rozhodne válku vést, má si rozvrhnout, kolik chce mít jízdy {Reysigen} a kolik z ní v jaké zbroji {rüstung}, těžké i lehké. Musí spočítat a vědět, jakou sílu má jeho protivník v jezdcích, knechtech {Knechten} i zbroji a zda země, do níž má či chce táhnout, je taková, že se v ní dá s jízdou působit, či nikoli; a stejně tak to pak zvážit u knechtů. Dále je třeba spočítat, jaká děla {Geschütz} bude potřebovat, jakého druhu a kolik, k nim potřebné vybavení[^1] a munici {Municion} a také kolik lodních mostů {Schiffbrucken} bude zapotřebí a chce vzít s sebou. To vše má být nejprve spočítáno a uspořádáno. Když je pak válečný lid {Krigsuolck} na koni i pěšky takto uspořádán spolu s děly a jejich příslušenstvím, má pán na všechny osoby na koni i pěšky, na každou podle toho, co jí náleží, spočítat a sečíst žold {Söld} na jeden měsíc, k tomu nástupné neboli příjezdné {reitgelt} a odchodné {abzug}. Když to pán uspořádá a spočítá, má rozvrhnout celou válku, neboť ať potrvá krátce, nebo dlouho, nástupné i odchodné bude třeba vyplatit. Pán tedy spočítal jeden měsíc zvlášť a stejně tak zvlášť nástupné i odchodné. Nyní ať vezme ten jeden měsíc s jeho peněžní sumou a uváží, kolik měsíců hodlá válčit, neboli jak dlouho chce svůj válečný lid udržet pohromadě. Pak tu peněžní sumu vynásobí počtem zamýšlených měsíců, postará se, aby ji měl jistou, a připočte k tomu ještě jeden měsíc navíc. Je totiž lépe mít nadbytek než nedostatek, a to z mnoha příčin poznaných zkušeností, jež netřeba vypisovat.
- typ: odstavec
  de: |-
    Zum andern/ soll ein Herr sein Prouiant fleissig vnd zu dem gewisten ordnen/ so jm möglich ist/ dann so die Prouiant ligt/ so leit es alles. Vnd so dann ein Herr sein Kriegsuolck annemen wil/ vnd bestellen leßt/ so soll ers die Personen thůn lassen/ die mit dem Kriegsuolck bekent seind/ vnd besonder vnder den Knechten/ dan die
  cs: |-
    Za druhé má pán co nejpečlivěji a nejspolehlivěji, jak jen může, zajistit svůj proviant {Prouiant}, neboť když vázne proviant, vázne všechno. Chce-li pak pán přijímat a najímat svůj válečný lid, má to svěřit osobám, které se s válečným lidem znají, zvláště pokud jde o knechty, neboť
poznamky:
- n: 1
  text: |-
    Tisk má podobu *notröstung* (tiskařská odchylka za *Notrüstung*, tj. potřebné nářadí, zásoby a výstroj k dělům).
