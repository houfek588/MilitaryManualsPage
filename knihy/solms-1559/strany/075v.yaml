  popis: |-
    Celostránkový dřevořez šikovatele trénu se ženou od trénu v obloukovém rámu s rozvilinami a volutami v cviklech (bez monogramu a letopočtu): bezvousý šikovatel trénu v prostřiženém lancknechtském oděvu, s baretem s peřím na zádech a dlouhým kordem u boku kráčí vlevo a nese přes pravé rameno krátké kopí se střapci; vedle něj vpravo jde táborová žena (markytánka) v baretu s peřím přes čepec, s velkým rancem na zádech, pleteným košem na levé paži, hranatou konví a sukovitou holí v ruce, s malým chundelatým psem mezi nimi.
