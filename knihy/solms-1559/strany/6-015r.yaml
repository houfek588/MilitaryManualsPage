  text: Součet strany za položky 12–15 (Löwenstein, Mörlen, Volckerßhausen, Hunt); s tištěnými sumami (18 zl. 3 bac. + 18 zl. + 48 zl. + 33 zl. 9 bac. = 117 zl. 12 bac.) přesně nesouhlasí, srov. tiskové chyby u položek 12 a 13 na předchozí straně.
