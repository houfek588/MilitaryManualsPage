id: 1-038v
list: '38'
strana: verso
sken: 86
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    so hab ich auff ewren bericht des Obersten versehung vnnd Regirung verstanden / vnd bedenck bei mir daß es also ist / das es noch nicht vor mich sein will / vnd nicht sehen kan was ich bei den andern zweien Amptern sehen mag / vnd hab wol lust zu den andern zweien Amptern eins / dieweil jr mir so einen getrewlichen rath vnnd bericht gethan habt / so will ich euch freundtlich bitten / wölt mir nun das best rathen welches vnder den zweien ich nemen soll / dann sie gefallen mir beide wol.
  cs: |-
    pochopil jsem z vaší zprávy, jaké je poslání a správa plukovníka {Obersten}, a sám uznávám, že je to tak: ještě to není pro mne a nemohl bych tam vidět to, co mohu vidět u druhých dvou úřadů. K jednomu z nich mám věru chuť. Protože jste mi dal tak věrnou radu a zprávu, chci vás přátelsky poprosit, abyste mi nyní poradil to nejlepší – který z těch dvou si mám vybrat, neboť se mi líbí oba.
- typ: nadpis
  uroven: 3
  de: Alter Vatter.
  cs: Starý otec.
- typ: odstavec
  de: |-
    Nun wolan mein Son / dieweil du dann weitter rath an mich begerest vnd ich dir so weit gerathen hab / so will ich dir mein rath nit versagen sonder weitter mittheiln / vnd sag in der kürtz / daß das Artolorei ampt schwere / sörgliche versehung vnd werck hat / dann es noch gar vil anheng hat die darzů gehören vnnd nicht gering seind / Darumb will ich dir rathen / dieweil diß dein erster Zug ist / daß du es dißmal mit der Artolorei laßt bleiben / biß daß du erst sehest was es ist.
  cs: |-
    Nuže dobrá, můj synu, když ode mne žádáš další radu a já jsem ti už až potud radil, nechci ti ji odepřít, nýbrž ti ji dále sdělím. Krátce řečeno: úřad dělostřelectva {Artolorei} obnáší těžkou a nebezpečnou správu i práci, neboť k němu patří ještě velmi mnoho dalších věcí, a nijak malých. Proto ti radím, abys to tentokrát, když je to tvé první tažení {Zug}, s dělostřelectvem nechal být, dokud nejprve neuvidíš, co to obnáší.
- typ: odstavec
  de: |-
    Nun will ich dir zum ersten rathen zu dem Feldmarschalck / daß du auff den warten mögest / dann der Zeugmeister vnnd Feldmarschalck haben vil in dem Feld miteinander zuthůn / daß sie bei einander sein vnnd handeln müssen / so sichts du bei dem Feldmarschalck solches auch / vnd wann mann etwas inn den Schantzen mit dem Geschütz handeln wirt / dann kanst du allezeit souil der weil haben / daß du darzů kömpts vnd besichts was mann damit handelt / Aber der Feldmarschalck hat für vnd für auß vilen vrsachen im Feld vnd im Leger zuthůn vnd zu handeln / da vnder weilen die Artolorei still steht vnd nicht zuhandeln hat / Darumb rath ich dir zum ersten zu dem Feldmarschalck / da mancherlei zuthůn vnd nimmehr růhe ist / dann magst du wol etwas sehen.
  cs: |-
    Radím ti tedy především k polnímu maršálkovi {Feldmarschalck}, abys mu sloužil. Zbrojmistr {Zeugmeister} a polní maršálek mají totiž v poli mnoho společného, takže musejí být spolu a společně jednat; u polního maršálka tedy uvidíš i to. A když se bude v šancích {Schantzen} něco dít s děly {Geschütz}, budeš mít vždycky dost času, abys tam zašel a prohlédl si,[^1] co se s nimi dělá. Polní maršálek má však z mnoha příčin ustavičně co dělat a vyřizovat v poli i v ležení {Leger}, kdežto dělostřelectvo občas stojí a nemá co dělat. Proto ti radím především k polnímu maršálkovi, kde je rozmanitá práce a nikdy není klid; tam můžeš leccos vidět.
- typ: nadpis
  uroven: 3
  de: Son.
  cs: Syn.
- typ: odstavec
  de: |-
    Nun wolan so will ich euch volgen lieber alter Vatter / vnnd meinen Herren bitten daß er mir dahin zum Feldmarschalck helffen wöl / Lieber alter Vatter ich begern den gůten getrewen rath bei euch / vnd wann mich not angehen wirdt / dann komme ich wider zu euch vnd hab rath / dann ich den getrewlich bei euch befinde.
  cs: |-
    Nuže dobrá, poslechnu vás tedy, milý starý otče, a poprosím svého pána, aby mi pomohl k polnímu maršálkovi. Milý starý otče, u vás hledám dobrou a věrnou radu, a kdykoli mne dolehne nouze, přijdu zase k vám pro radu, neboť ji u vás nacházím věrnou.
- typ: nadpis
  uroven: 2
  de: |-
    Instruction vnd vnderricht eines jungen Gesellen / der Krieg suchen vnd gebrauchen will.
  cs: |-
    Instrukce a poučení pro mladíka, který chce vyhledávat válku a sloužit v ní.
poznamky:
- n: 1
  text: |-
    V tisku přesmyčky *sichts*, *kömpts* a *besichts* za *sichst*, *kömpst* a *besichst*.
