bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Lantzknechten vnnd Fendlin derselbigen Gesellen gnůg/ das ist nit wol daruon geredt/ dann ich weiß das vnd habs versucht/ weiß auch was zeit vnd versaumnuß darauff gangen ist biß mann solches gesind zu wegen bracht hat/ besonder knappen die sich das zuregirn vnnd zu verwalten vndernemen wöllen/ da ich die schon bekam vnd beredt das sie sich des annemen wolten/ hatten wir kein Rüstung vnnd Werckzeug/ kunden auch langsam darzu komen/ damit verlorn wir die zeit/ vnd wurden vnser widerparthei des innen/ sterckten sich auch darzu/ vnd machten vns vnser vorhaben auch zu schanden/ hetten wir aber die Person so darzu dienstlich/ vnd den Werckzeug vnd Rüstung die darzu von nötten warn gehabt/ wölten wir wol etwas mehr außgericht/ auch die zeit vnd vnkusten gekürtzt haben/ Darumb hab ich die verseumnuß vnd Proben in gutem gewissen/ vnd warne mit warhafftigem schreiben vnnd augenscheinlichem Bericht/ dieweil ich solches vnderhanden vnd in meiner verwaltung gehabt.
  cs: |-
    lancknechty {Lantzknechten} a v praporcích {Fendlin} takových chlapíků dost. To však není dobře řečeno, neboť já to znám a sám jsem to zakusil. Vím také, kolik času a průtahů padlo na to, než se taková čeládka sehnala, zvláště horníci {knappen}, kteří by se chtěli ujmout řízení a správy díla. Když jsem je pak konečně získal a přemluvil, aby se toho ujali, neměli jsme žádné nářadí ani výbavu {Rüstung} a jen zdlouha jsme se k nim dostávali. Tím jsme ztratili čas, protivníci se o tom dozvěděli, posílili se proti tomu a náš záměr nám zmařili. Kdybychom však měli způsobilé lidi a k tomu potřebné nářadí a výbavu, byli bychom jistě pořídili víc a zkrátili čas i náklady. Proto mám ona zdržení i zkoušky dobře v paměti a varuji pravdivým písmem a názornou zprávou, neboť jsem to sám měl v rukou a ve své správě.
- typ: odstavec
  de: |-
    Darumb rathe ich daß mann allwegen auffs wenigst zwen Bergknappen hab die sich des grabens verstehn/ vnd halt die ordinarie bei der Artolorei in einem Zeughauß/ vnd ordene zů oder ab in das Zeughauß ein sollichen platz für solliche Knappen/ wie ich geordnet hab im Bůch der Artolorei/ ein ordenliche maß die allzeit bei eim Zeughauß sein soll/ wie darin gefunden wirt/ Damit aber nit gesagt mag werden (wie gemelt) daß man solchs vndergraben langsam braucht/ vnd die person die zeit vergeblich halten muß/ so kan mann sie inn einem Zeughauß zu anderm werck vnd arbeit gebrauchen/ nemlich zu Büchsenmeistern/ auff bawen/ Steinbrecher/ Anschaffer/ Zůseher odder vberseher/ wie mann die nennen will/ vnd zu solchen dingen daß sie darumb nit spaciern gehn dörffen/ wann mann ein rechten Artolorei oder Zeugmeister hat/ der sich solcher ding versteht wie sich das gebürt/ der kan einen solchen Knappen wol zu einem Büchsenmeister machen/ vnd auch zu andern dingen (wie gemelt) vnderweisen vnd berichten/ darmit nit gesagt werde/ es sei vergebens sie zu halten/ Darumb will das vnd anders an eim verstendigen General Zeugmeister oder des Leutenants versehung ligen.
  cs: |-
    Proto radím, aby se vždy drželi aspoň dva horníci {Bergknappen}, kteří se vyznají v kopání, a to stále {ordinarie} při dělostřelectvu {Artolorei} ve zbrojnici {Zeughauß}, a aby se jim ve zbrojnici vyhradilo takové místo [ve stavu], přidáním či ubráním jiných, jak jsem to stanovil v knize o dělostřelectvu jako řádnou míru, která má být při zbrojnici vždy – jak se tam lze dočíst. Aby se však nedalo říkat (jak zmíněno), že se takového podkopávání užívá zřídka a že se ti lidé musejí mezitím vydržovat nadarmo, lze je ve zbrojnici užít k jiné práci a dílu: jako puškaře {Büchsenmeister}, při stavbách, jako lamače kamene, předáky {Anschaffer}, dozorce či přehlížitele – ať se jim říká jakkoli – a k podobným věcem, takže nemusejí chodit zahálet. Je-li po ruce pravý mistr dělostřelectva či zbrojmistr {Zeugmeister}, který se v takových věcech náležitě vyzná, může takového horníka snadno vyučit puškařem a zaučit i v jiných věcech (jak řečeno), aby se neříkalo, že je marné je vydržovat. Proto to i jiné věci záleží na péči rozumného generálního zbrojmistra {General Zeugmeister} či jeho poručíka {Leutenant}.
- typ: odstavec
  de: |-
    Damit mann aber zu dem rechten werck vnd bericht kom/ wil ich zum ersten ein Figur eins Thurs vnd Maur für mich nemen/ welch ich alle beide gesprengt vnd geworffen hab zu Perona in Franckrich/ vnd außwendig an der Statmaurn in eim Graben gestanden sind/ vnd darfür ein starcken Wall/ vnd darnach ein gůten Wassergraben gehabt.
  cs: |-
    Abychom se však dostali k vlastnímu dílu a výkladu, vezmu si nejprve vyobrazení věže a hradby, které jsem obě podkopal a vyhodil do povětří u Péronne {Perona} ve Francii.[^1] Stály zvenčí u městské zdi v příkopu {Graben}, před sebou měly silný val {Wall} a za ním dobrý vodní příkop {Wassergraben}.
poznamky:
- n: 1
  text: |-
    Narážka na obléhání pikardského města Péronne císařským vojskem roku 1536, jehož se Solms účastnil; následný líc 2. listu (sken 439) je prázdný (pouze s knihovním razítkem `00085168`) a v edici se vynechává – na jeho rubu následuje dřevořez na skenu 440.
