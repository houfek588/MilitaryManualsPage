bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Lantzknechten vnnd Fendlin derselbigen Gesellen gnůg/ das ist nit wol daruon geredt/ dann ich weiß das vnd habs versucht/ weiß auch was zeit vnd versaumnuß darauff gangen ist biß mann solches gesind zu wegen bracht hat/ besonder knappen die sich das zuregirn vnnd zu verwalten vndernemen wöllen/ da ich die schon bekam vnd beredt das sie sich des annemen wolten/ hatten wir kein Rüstung vnnd Werckzeug/ kunden auch langsam darzu komen/ damit verlorn wir die zeit/ vnd wurden vnser widerparthei des innen/ sterckten sich auch darzu/ vnd machten vns vnser vorhaben auch zu schanden/ hetten wir aber die Person so darzu dienstlich/ vnd den Werckzeug vnd Rüstung die darzu von nötten warn gehabt/ wölten wir wol etwas mehr außgericht/ auch die zeit vnd vnkusten gekürtzt haben/ Darumb hab ich die verseumnuß vnd Proben in gutem gewissen/ vnd warne mit warhafftigem schreiben vnnd augenscheinlichem Bericht/ dieweil ich solches vnderhanden vnd in meiner verwaltung gehabt.
  cs: |-
    landsknechty {Lantzknechten} a pod korouhvemi {Fendlin} takových chlapíků dost. To však není rozumně řečeno, neboť já to znám a sám jsem to zakusil; vím také, kolik času a zmeškání padlo na to, než se taková čeleď dala sehnat, zvláště horníci {Knappen}, kteří by se ujali řízení a správy díla. A když jsem je už sehnal a přemluvil, aby se toho ujali, neměli jsme žádné nářadí ani výzbroj a mohli jsme se k nim jen zdlouha dostat; tím jsme ztratili čas, naši protivníci se o tom dozvěděli, posílili se proti tomu a zmařili nám náš záměr. Kdybychom však měli potřebné lidi a k tomu nářadí a výbavu, jež k tomu byly zapotřebí, byli bychom pořídili daleko více a také zkrátili čas i náklady. Proto mám ona zmeškání i zkoušky na svědomí a varuji pravdivým písmem a názornou zprávou, poněvadž jsem to měl v rukou a ve své správě.
- typ: odstavec
  de: |-
    Darumb rathe ich daß mann allwegen auffs wenigst zwen Bergknappen hab die sich des grabens verstehn/ vnd halt die ordinarie bei der Artolorei in einem Zeughauß/ vñ ordene zů oder ab in das Zeughauß ein sollichen platz für solliche Knappen/ wie ich geordnet hab im Bůch der Artolorei/ ein ordenliche maß die allzeit bei eim Zeughauß sein soll/ wie darin gefunden wirt/ Damit aber nit gesagt mag werden (wie gemelt) daß man solchs vndergraben langsam braucht/ vnd die person die zeit vergeblich halten muß/ so kan mann sie inn einem Zeughauß zu anderm werck vnd arbeit gebrauchen/ nemlich zu Büchsenmeistern/ auff bawen/ Steinbrecher/ Anschaffer/ Zůseher odder vberseher/ wie mann die nennen will/ vnd zu solchen dingen daß sie darumb nit spaciern gehn dörffen/ wañ mann ein rechten Artolorei oder Zeugmeister hat/ der sich solcher ding versteht wie sich das gebürt/ der kan einen solchen Knappen wol zu einem Büchsenmeister machen/ vnd auch zu andern dingen (wie gemelt) vnderweisen vnd berichten/ darmit nit gesagt werde/ es sei vergebens sie zu halten/ Darumb will das vnd anders an eim verstendigen General Zeugmeister oder des Leutenants versehung ligen.
  cs: |-
    Proto radím, aby se vždy drželi alespoň dva horníci {Bergknappen}, kteří se vyznají v kopání, a chovali se řádně u artilerie {Artolorei} ve zbrojnici {Zeughauß}, a aby se jim u zbrojnice či v ní určilo takové místo pro takové horníky, jak jsem stanovil v knize o artilerii podle řádného vyměření, jež má u zbrojnice vždy být, jak se tam najde. Aby se však nemohlo říkat (jak zmíněno), že se takového podkopávání užívá jen zřídka a že by ty osoby musely trávit čas nadarmo, lze je ve zbrojnici použít k jiné práci a dílu, totiž za puškaře {Büchsenmeister}, na stavbách, jako lamače kamene, opatřovatele, dozorce či přehlížitele – ať už se jim říká jakkoli – a k podobným věcem, takže nemusejí chodit zahálčivě. Má-li člověk pravého mistra artilerie nebo zbrojmistra {Zeugmeister}, který se v takových věcech náležitě vyzná, dokáže takového horníka snadno vyučit puškařem a také jej poučit a zavést k jiným věcem (jak řečeno), aby se neříkalo, že je marné je vydržovat. Proto to i jiné věci závisejí na prozíravosti rozumného generálního zbrojmistra {General Zeugmeister} či jeho poručíka {Leutenant}.
- typ: odstavec
  de: |-
    Damit mann aber zu dem rechten werck vnd bericht kom/ wil ich zum ersten ein Figur eins Thurs vnd Maur für mich nemen/ welch ich alle beide gesprengt vnd geworffen hab zu Perona in Franckrich/ vnd außwendig an der Statmaurn in eim Graben gestanden sind/ vnd darfür ein starcken Wall/ vnd darnach ein gůten Wassergraben gehabt.
  cs: |-
    Abychom však dospěli ke skutečnému dílu a zprávě, vezmu si nejprve před sebe vyobrazení věže a hradby, které jsem obě podminoval a vyhodil do povětří u Péronne {Perona} ve Francii;[^1] stály zvenčí u městské zdi v příkopu a před sebou měly silný {Wall} a za ním dobrý vodní příkop {Wassergraben}.
poznamky:
- n: 1
  text: |-
    Narážka na obléhání pikardského města Péronne císařským vojskem roku 1536, jehož se Solms účastnil; následný líc 2. listu (sken 439) je prázdný (pouze s knihovním razítkem `00085168`) a v edici se vynechává – na jeho rubu následuje dřevořez na skenu 440.
