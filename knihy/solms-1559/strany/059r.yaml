bloky:
- typ: nadpis
  uroven: 2
  de: Von der Reuter Hauptleuten oder Ritmeister in gemein.
  cs: |-
    O hejtmanech {Hauptleuten} jízdy {Reuter} neboli rytmistrech {Ritmeister} obecně
- typ: odstavec
  de: |-
    VOn der Reuter Hauptleuten besoldung zů reden / mag der vrsch statlich nicht geschehen / dann vnder weilen gibt mann einem nach dem er vil oder wenig pferde hat / etwann gibt mann einem nach dem er des kriegs erfaren vnnd geschickt ist / etwann nach eines hohen Standt / als Fürsten / Grauen oder Herrn / etc. deßhalb wirts eim jeden Kriegs Herrn beuolhen / Deßgleichen auch vff ein Pferdt monatlich / vnd wie sich der Herr mit einem jeden Hauptman / seiner leibs besoldung oder auff ein Pferdt vergleicht / wirt im bestelbrieff begriffen.
  cs: |-
    Hovořit o žoldu {besoldung} hejtmanů jízdy nelze z toho důvodu[^1] s určitostí, neboť někdy se někomu dává podle toho, má-li mnoho nebo málo koní, jindy podle toho, jak je ve válce zkušený a schopný, jindy zase podle vysokého stavu, jako u knížat, hrabat nebo pánů atd. Proto se to svěřuje každému válečnému pánu {Kriegs Herrn}. Stejně tak i [žold] měsíčně na jednoho koně; a jak se pán s každým hejtmanem dohodne na žoldu na jeho osobu nebo na jednoho koně, to se pojme do služebního listu {bestelbrieff}.
- typ: odstavec
  de: |-
    Eim jeden Hauptman helt mann einn Leutenant / ein Fendrich / ein Caplan / ein Trometter / ein Forier / ein feldt Artzt / ein Schreiber ein Wagen / ein oder zwen trosser / zwen oder auffs meist vier Trabanten / wie dann andere Reutter vff jre Pferdt / mit den wagen gehalten werden / also wirt der Hauptman mit seinen Pferden auch gehalten / was des Leutenants vnnd Fendrichs sondere besoldung seie / ist auch in keinem brauch / vnd bleibt auch biß zu der Bestallung.
  cs: |-
    Každému hejtmanovi {Hauptman} se vydržuje jeden poručík {Leutenant}, jeden praporečník {Fendrich}, jeden kaplan {Caplan}, jeden trubač {Trometter}, jeden furýr {Forier}, jeden polní lékař {feldt Artzt}, jeden písař {Schreiber}, jeden vůz, jeden nebo dva sloužící u trénu {trosser}, dva nebo nejvýše čtyři drabanti {Trabanten}; jak se pak ostatním jezdcům na jejich koně vydržují vozy, tak se vydržují i hejtmanovi na jeho koně. Jaký má být zvláštní žold poručíka a praporečníka, to rovněž není ustáleno a ponechává se to až na služební list.
- typ: odstavec
  de: |-
    Der Caplan / Trometer vnd Forier haben Topel sold / die Trabanten werden vnder einem Hauptman zu fůß gemustert vnd bezalt / vnd gibt mann auch einem etwan mehr vff seinen Trabanten als dem andern.
  cs: |-
    Kaplan, trubač a furýr mají dvojitý žold {Topel sold}; drabanti se přehlížejí {gemustert} a vyplácejí pod některým hejtmanem pěchoty, přičemž se také někomu dává na jeho drabanty více než jinému.
- typ: odstavec
  de: |-
    Es ist in kurtzen jarn vff komen / daß die Hauptleut haben wöllen / die Herrn sollen jnen auff fünff vnd zwentzig / dreissig / oder auffs meist viertzig Pferde ein Rotmeister halten / wann sie etwan rotten weise Reuter schicken mussen / so ist der Rotmeister vnder demselben Hauptman / dem soll der Herr dann auch topel sold geben / diß ist ein newerung / vnd vor wenig jarn nit gewesen / dann wann ein Hauptman auß beuelch des Obersten rotten weise Reutter schicken můst / gab der Hauptman denselben ein vom Adell / oder geschickten Knecht zů / vff denselben můsten sie / als jetzt vff den Rotmeister warten / auch wöllen sie Schmide mit Topelsold vnderhalten haben / ist wie der Rotmeister ernewerung / die Herrn sollen billich den Hauptleuten / auff ein sollich begeren antworten : wolten sie jre Roß lassen beschlahen / das sie jnen schmide bestelten / oder liessen jre Roß barfuß
  cs: |-
    V posledních letech přišlo do zvyku, že hejtmani chtějí, aby jim páni na každých pětadvacet, třicet nebo nejvýše čtyřicet koní vydržovali jednoho rotmistra {Rotmeister}; když pak musejí vysílat jezdce po rotách {rotten}, je ten rotmistr podřízen témuž hejtmanovi a pán mu pak má rovněž dávat dvojitý žold. To je novota a před málo lety to nebývalo, neboť když musel hejtman z rozkazu nejvyššího velitele {Obersten} vyslat jezdce po rotách, přidělil jim hejtman jednoho šlechtice nebo schopného čeledína {Knecht}, a toho pak museli poslouchat tak jako nyní rotmistra. Také chtějí mít s dvojitým žoldem vydržované kováře, což je stejná novota jako s rotmistry. Páni by měli hejtmanům na takový požadavek po právu odpovědět: chtějí-li nechat své koně okovat, ať si kováře zjednají sami, anebo ať nechají své koně bosé
poznamky:
- n: 1
  text: |-
    V tisku „vrsch“ (patrně tiskařská chyba místo *vrsach* – příčina, důvod).
