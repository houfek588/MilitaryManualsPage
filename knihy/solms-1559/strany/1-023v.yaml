strana: verso
sken: 56
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Reutern kösten machen lassen / vnd das die Rotmeister also ein jeder sein Rot versehe vnd dessen Register hielten / vnd ein jeder Rotmeister sein Register vnderschribe / auch dasselbig mit den Marcatanten regirt vnd handelt / vnd wann die bezallung geschehen wurd / so hetten die Rotmeister die Register sampt allem bericht / dem Ritmeister zu vbergeben / so nem der Ritmeister solche Register zu sich / trüge die zu der bezallung / bezalt als dann vor das erst die Marcatanten darauff ab / deßgleichen soll mit der Commiß auch geschehen.
  cs: |-
    jezdci {Reutern} o útratách[^1]. Každý rotmistr {Rotmeister} má takto obstarávat svou rotu {Rot} a vést o ní rejstřík {Register}, svůj rejstřík má podepsat a podle něho s markytány {Marcatanten} jednat a obchodovat. Když pak dojde k výplatě, předají rotmistři rejstříky spolu s veškerými údaji rytmistrovi {Ritmeister}. Rytmistr si rejstříky vezme, donese je k výplatě a podle nich nejprve vyplatí markytány. Stejně se má postupovat i s komisem {Commiß}.
- typ: odstavec
  de: |-
    Vnd wann dann der Rotmeister von seinen Reutern sehen würd das sie vngeschickt / vnd mehr dann die notturfft auffnemen / so soll er darein reden / vnd allein bei der notturfft erhalten / vnd nit gestatten jnen mehr auffzunemen / dann jhr besoldung ertragen möchte.
  cs: |-
    Uvidí-li rotmistr u svých jezdců, že si počínají nemírně a berou si na dluh víc, než potřebují, má do toho zasáhnout, udržet je jen při tom nejnutnějším a nedovolit jim vzít si víc, než kolik snese jejich žold {besoldung}.
- typ: odstavec
  de: |-
    Deßgleichen sollen die Ritmeister verhütten / daß die Marcatanten darüber nit getrungen noch beschwert werden.
  cs: |-
    Rovněž mají rytmistři dbát, aby markytáni nebyli k ničemu nad to nuceni ani utiskováni.
- typ: odstavec
  de: |-
    So mann dann also Ordnung vnd maß fürnemen vnd halten wirt / so ist das Kriegßuolck desto baß in Regiment zu behalten / es soll auch ein Herr den Marcatanten ein vorstreckung thůn so es zu solcher beschwerden kompt / einem jeden nach seiner handtierung biß zu der bezallung / darmit sich die Marcatanten auch erhalten mögen / vnd bei der zůfürung bleiben können / dann die Marcatanten seind leichter also mit leihen vnd fürstreckung zu erhalten / dann das Kriegßuolck / Darumb bedeucht mich gůt sein / das mann solch Ordnung mit dem ersten fürneme / vnnd in das werck richtet / darmit das Kriegßuolck also gefast / vnd in gebrauch komen möcht / so ist mit jnen gehorsam vnd Regiment zuhalten / doch soll mit der Commiß auch gůte Ordnung gehalten / vnd das Kriegßuolck nit darmit vberschetzen / wiewol geschehen mag vnd vor gesehen worden / demselbigen soll sein maß vnd bericht nach aller notturfft in einem eigenen oder besondern verzeichnuß geben vnd beschrieben werden / da alle andere Ampter auch ein jedes besonder beschrieben wirt.
  cs: |-
    Bude-li se tedy takto zavádět a dodržovat řád a míra, udrží se válečný lid {Kriegßuolck} v kázni tím snáze. Pán má také markytánům poskytnout zálohu, dojde-li k takové tísni, a to každému podle jeho živnosti až do výplaty, aby se i markytáni uživili a mohli dál zásobovat; markytány je totiž snazší takto udržet půjčkami a zálohami než válečný lid. Proto se mi zdá dobré zavést takový řád hned zpočátku a uvést jej ve skutek, aby si na něj válečný lid zvykl a přijal ho – pak lze u něho udržet poslušnost i kázeň. Také s komisem je však třeba zachovávat dobrý řád a nepřetěžovat jím válečný lid na cenách, jak se to může stát a jak se už dříve vídalo. Komisu má být dána náležitá míra a poučení podle veškeré potřeby ve vlastním, zvláštním spise, kde je i každý z ostatních úřadů popsán zvlášť.
- typ: nadpis
  uroven: 2
  de: Wie mann ein Leger schlagen soll.
  cs: Jak se má rozbíjet ležení {Leger}.
- typ: odstavec
  de: |-
    DIeweil dann an einem Leger zuschlagen vil gelegen ist / vnd dem Feldobersten zuuersehen gebüret / deßgleichen dem Feldmarschalck / Artoloreimeister vnd Wagenburgmeister / disen vier Herrn gehöret ein Leger zuschlagen / dann sie haben alle daran zuuersehen vnd zumachen / wie von alters gewest ist aber jetzt so wirts vil anderst gebraucht.
  cs: |-
    Na rozbití ležení velmi záleží a dohled nad ním přísluší nejvyššímu polnímu hejtmanovi {Feldobersten}, stejně jako polnímu maršálkovi {Feldmarschalck}, zbrojmistrovi {Artoloreimeister}[^2] a mistru vozové hradby {Wagenburgmeister}. Těmto čtyřem pánům náleží rozbíjet ležení, neboť všichni na něm mají co obstarávat a dělat. Tak tomu bylo odedávna, nyní se to však provádí mnohem jinak.
poznamky:
- n: 1
  text: |-
    Něm. *der Register mit jhren Reutern kösten machen lassen* – dát vést rejstříky útrat, které jezdci nadělali za stravu a potřeby (*kösten*, od *Kost*, strava, útrata).
- n: 2
  text: |-
    V První knize užívá Solms pro zbrojmistra (*Zeugmeister*) i starší označení *Artoloreimeister* (dosl. mistr dělostřelectva).
