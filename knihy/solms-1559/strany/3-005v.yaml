bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    in der warheit auff einer solchen Person nit ein kleins/ daß sie tregt ein schwere mühe/ darumb ist jhm arbeit/ sorg vnd mühe befolhen/ Derhalben hett er grosse vrsachen/ daß er dem volck das vnder jm ist/ fleissig drauff sehe/ vnd sich nit laß bekömern wann seine Leut sagen werden/ Er vertraut jnen nichts/ darauff hat er jnen zu sagen/ daß sie in dem kein mißfallen sollen haben/ sonder sie sollen bedencken was last vnd sorg er trag/ daß sie jm billich dancken sollen daß er ein sollichen fleiß bei jnen hab dann sie sollen das von jm lernen vnd behalten/ wann es jnen auch der gestalt beuolhen wirt/ daß sie solchen fleiß vnd sorg auch haben solten/ Auß erzelten vnd vil mehr vrsachen dann zu melten ist wie hieuor zum theil gemelt/ auch bedencken vnnd sorg tragen sollen. Welcher dann verstandt vnd ein gůt gemüt hat/ der wirt es wol zu hertzen nemen/ vnd jm mit danck gefallen lassen/ welcher aber das nicht bedenckt vnd für gůt haben will/ ist alle mühe vnd vnderweisung verlorn/ welcher aber es zu danck jm gefallen leßt/ bei demselbigen soll ein Zeugmeister besondern fleiß haben/ jn lernen vnd wol halten.
  cs: |-
    po pravdě na takové osobě nemalé břemeno a nese těžkou námahu, proto jsou mu svěřeny práce, starost a námaha. Z toho důvodu má velkou příčinu pilně dohlížet na lid, který je pod ním, a nedat se rmoutit, budou-li jeho lidé říkat: „On nám nic nedůvěřuje.“ Na to jim má odpovědět, aby se nad tím nepohoršovali, nýbrž aby uvážili, jaké břemeno a starost nese, takže mu právem mají děkovat, že na ně tak pilně dohlíží. Mají se to totiž od něho naučit a zapamatovat si to pro případ, že i jim bude takto uloženo, aby měli stejnou píli a starost; i oni mají z uvedených a mnoha dalších příčin, než lze vypočíst (jak už bylo zčásti řečeno), o věcech uvažovat a starat se o ně. Kdo tedy má rozum a dobrou povahu, ten si to vezme k srdci a s vděkem to přijme; kdo o tom však nepřemýšlí a nechce to přijímat v dobrém, u toho je veškerá námaha i poučování ztraceno; avšak na toho, kdo to s vděkem přijímá, má zbrojmistr {Zeugmeister} vynaložit zvláštní píli, učit ho a dobře s ním nakládat.
- typ: odstavec
  de: |-
    Zum einvndzwentzigsten/ soll ein Zeugmeister sein Zeughauß mit allem vorrat wol versehen vnnd staffiert haben/ als mit Brettern zu den fessen der Büchsen/ holtz zu den Rädern/ Achsen vnd einem jeden nach seiner notturfft/ deßgleichen allen Zeug zu den Pferden einzuspannen/ Seyle groß vnnd klein/ Zeug vnnd rüstung/ wie das noch wirt in dem vorrat des Zeughauß beschriben werden.
  cs: |-
    Za jednadvacáté má zbrojmistr svou zbrojnici {Zeughauß} dobře opatřit a vybavit všemi zásobami, jako prkny na lafety {fessen}[^1] děl {Büchsen}, dřevem na kola, nápravy a na vše podle potřeby, rovněž veškerým postrojem k zapřahání koní, lany velkými i malými, nářadím a výzbrojí {rüstung}, jak to ještě bude popsáno v soupisu zásob zbrojnice.
- typ: odstavec
  de: |-
    Zum zweivndzwentzigsten/ soll ein zeugmeister inn seines Herrn Landt vnd Fontieren durch auß/ alles Geschütz mit seinen zugehörungen auff allen Amptern inn seiner verwaltung haben/ dasselbig alles gar bereiten besehen/ beschreiben/ vnnd in ein Rechnung brengen/ damit er alle Jar wisse/ was er im gantzen Lande für zeug vnnd vorrat habe/ Deßgleichen soll er alles Geschütz mit seiner zugehörung in das feld wie das einem jeden verordnet ist/ auch verzeichnet vnd beschriben haben/ daß er von einem jeden stück wissens hab/ wie vil pferdt darinn gehören/ auch zu einer jeden Büchsen oder Stück jre zugehörung/ dasselbig soll er auch also mit allen stücken vnd jrer rüstung in gůter verzeichnuß haben/ daß er wiß wieuil Pferdt/ wie gemelt/ er zu einem jeden stück notturfftig/ wo er dieselbigen Pferdt nemen soll zur zeit der notturfft/ nemlich auß der Aptei souil pferdt zu dem stück/ auß einer andern Aptei deßgleichen zu einem andern stück souil/ vnd also von einem Closter biß auff das ander/ deßgleichen auff dem Landt bei den andern Höffen die Pferdt haben/ Also soll es alle zeit geordnet/ beschriben vnd eingetheilt werden/ so ist jm dann leichtlich zuthůn/ darzů ist gemelte ordnung gůt.
  cs: |-
    Za dvaadvacáté má mít zbrojmistr po celé zemi a pohraničí[^2] svého pána veškerá děla s jejich příslušenstvím ve všech úřadech[^3] ve své správě; má to vše na koni objet, prohlédnout, zapsat a zanést do účtů, aby každého roku věděl, jaký materiál a zásoby má v celé zemi. Stejně tak má mít poznamenána a zapsána všechna děla s jejich příslušenstvím určená do pole, jak jsou ke každému přidělena, aby o každém kusu věděl, kolik koní do něj patří, a také příslušenství ke každému dělu či kusu; totéž má mít se všemi kusy a jejich výzbrojí v dobrém seznamu, aby věděl, kolik koní, jak řečeno, potřebuje ke každému kusu a kde má tyto koně v době nouze vzít – totiž z toho a toho opatství tolik koní k tomuto kusu, z jiného opatství zase tolik k jinému kusu, a tak od jednoho kláštera k druhému, stejně jako na venkově u ostatních dvorů, jež mají koně. Takto to má být vždy uspořádáno, zapsáno a rozděleno, pak se mu to snadno vykoná a k tomu je zmíněný řád dobrý.
poznamky:
- n: 1
  text: |-
    Tisk má tvar *fessen* (afereze bez předpony *ge-* za *gefessen* / *Gefäßen*, tj. lafety děl).
- n: 2
  text: |-
    *Fontieren* – dobová podoba z franc. *frontière* (hranice, pohraniční pevnosti).
- n: 3
  text: |-
    *Ampt* (*Ampter*) zde označuje územní správní okrsek zeměpanské správy (úřad, amt se sídlem úředníka), nikoli služební funkci.
