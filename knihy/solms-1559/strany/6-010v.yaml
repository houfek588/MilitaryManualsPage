poznamky:
- n: 1
  text: |-
    Jedním z přehlídkových komisařů byl sám autor, Reinhard hrabě ze Solmsu. Rejstřík vyúčtovává příjezdné (peníze na cestu k přehlídce) podle dní, kdy jezdci „cestovali a stáli“ (gereist vnd stilgelegen); sazba činí 6 bacenů na zbrojného koně, 3 bacenů na trénního koně a 12 bacenů na vůz denně (15 bacenů = 1 zlatý).
- n: 2
  text: |-
    Při 18 dnech a 12 koních by mělo vyjít 86 zl. 6 bac. (jako u položky 2) a u vozu 14 zl. 6 bac.; tisk uvádí 85 zl. 6 bac. a 14 zl. 9 bac., suma 103 zl. 9 bac. však s tištěnými čísly souhlasí.
