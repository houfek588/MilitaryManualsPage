  de: |-
    Register des Anreitens/ auch wieuil solches an gelt derer Reutter tregt so vnder dem durchleuchtigen/ hochgebornen Fürsten vnd Herrn/ Herrn Moritzen zu Sachssen/ etc. ziehen/ Durch die wolgebornen/ Edlen/ Vesten Herrn Reinharten Grauen zu Solms/ etc. vnd Christoffeln von Schawenburg/ etc. als verordnete Commissarien/ des 28 tag Mai/ Anno/ etc. gemustert/ biß auff obgemelten tag der Bestallung nach/ Inhalt des Registers abgezalt vnd verglichen.
  cs: |-
    Rejstřík příjezdu {Anreitens} a také kolik to činí na penězích u jezdců {Reutter}, kteří táhnou pod osvíceným, vysoce urozeným knížetem a pánem, panem Mořicem Saským atd. Urození, vznešení a stateční páni Reinhart hrabě ze Solmsu atd. a Christoffel von Schawenburg atd. je jako ustanovení komisaři {Commissarien} 28. dne května léta atd. přehlédli a až do výše uvedeného dne jim podle služebního listu {Bestallung} a podle obsahu rejstříku vyplatili a vyúčtovali [příjezdné].[^1]
