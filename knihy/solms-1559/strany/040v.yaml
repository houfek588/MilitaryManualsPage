- typ: odstavec
  de: |-
    Wann aber nicht eben also vorhanden / wie hie oben gemelt / sonder an etlichem viehe ein abgang oder mangel were / so mag mann ein auffwechsel machen / mit Ochsen / Kůen / Kälbern / Hämeln / vnd Schaaffen / deßgleichen mit anderm Vieh / Wie der auffwechsel sein soll / volgt:
  cs: |-
    Není-li však všechno přesně tak, jak bylo výše uvedeno, nýbrž je-li u některého dobytka úbytek či nedostatek, lze provést záměnu mezi voly, krávami, telaty, skopci a ovcemi, stejně jako jiným dobytkem. Jak se má tato záměna provádět, následuje:
- typ: odstavec
  de: Erstlich für einen Ochsen mag genommen werden /
  cs: 'Nejprve za jednoho vola lze vzít:'
- typ: seznam
  de:
  - Zwo Kůe / oder
  - Fünff Kälber / oder
  - Zehen Hämel / oder
  - Fünff Schaaff / oder
  - Vier Hämel / neun Schaaff.
  cs:
  - dvě krávy, nebo
  - pět telat, nebo[^4]
  - deset skopců, nebo
  - pět ovcí, nebo[^5]
  - čtyři skopce a devět ovcí.
- typ: odstavec
  de: |-
    Item / mag auch genommen werden / für zwo Kůe ein Ochs / oder fünff Kälber sechs Schaaff.
  cs: |-
    Dále: za dvě krávy lze také vzít jednoho vola, anebo pět telat a šest ovcí.
poznamky:
- n: 1
  text: |-
    Chyba tisku: pro dosažení 1500 centů (150 000 liber) v pravém sloupci chybí 20 000 liber, tedy 1000 ovcí – má být 1020 ovcí (v levém sloupci součet činí přesně 150 000 liber).
- n: 2
  text: |-
    Chyba tisku: pro 700 centů má být vlevo 140 ovcí (tisk má „130 Shaaff.“).
- n: 3
  text: |-
    Chyba tisku v pravém sloupci: sazeč omylem přenesl čísla skopců a ovcí z týdenní tabulky (280 a 413) a u telat vytiskl 1315 místo 1350 (pro 3000 centů by odpovídalo 1350 telat, 1200 skopců a 1770 ovcí).
- n: 4
  text: |-
    Pět telat váží 180 liber (jeden vůl = 300 liber); přepočet v této položce není přesný (odpovídalo by 8⅓ telete, zatímco dole 5 telat + 6 ovcí = 300 liber).
- n: 5
  text: |-
    Tisk má „Fünff Schaaff“ (100 liber) místo „Fünfftzehen Schaaff“ (15 ovcí = 300 liber).
