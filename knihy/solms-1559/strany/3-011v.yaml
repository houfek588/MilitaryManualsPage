bloky:
- typ: nadpis
  uroven: 3
  de: Der Schiffbrückenmeister.
  cs: Mistr lodního mostu {Schiffbrückenmeister}.
- typ: odstavec
  de: |-
    DEr Schiffbrücken meister gehört auch vnder den Zeugmeister mit aller seiner rüstung / gehört mit seinen Wagen vnd pferden zu losiern bei die Arcolorei / wo die Munition steht neben dem Leger / soll er sein Wagen mit den Schiffen sie seien darbei oder nicht / vmb vnnd vor die Munition Wagen ziehen vnd stellen / mit seinen Leuten darbei ligen / vnd mit helffen verwaren.
  cs: |-
    Mistr lodního mostu podléhá rovněž se vší svou výzbrojí {rüstung} pod zbrojmistra {Zeugmeister} a přísluší mu se svými vozy a koňmi tábořit {losiern} u dělostřelectva {Arcolorei}; tam, kde vedle ležení {Leger} stojí munice {Munition}, má své vozy se čluny – ať jsou u nich, či nikoli – přitáhnout a postavit kolem muničních vozů i před ně, ležet u nich se svými lidmi a pomáhat je střežit.
- typ: nadpis
  uroven: 3
  de: Der Wagenburgmeister.
  cs: Mistr vozové hradby {Wagenburgmeister}.
- typ: odstavec
  de: |-
    DEr Wagenburg meister hat sein besonder Ampt vnd beuelch / steht dem Zeugmeister nicht zu er hat sein eygen Regiment vnnd versehung. Der Artickel des Wagenburg meisters / Er soll alle wägen zu der Wagenburg nach der Ordnung beschriben haben / also / zum ersten aller Obersten vnd hohen Ampter wagen / wie den nach vnd auff eins ander zu faren gebürt / Deßgleichen soll er haben seinen Leutenant / vnd andere mehr personen die auff jhn warten vnd helffen / der Wagenmeister gehört auch vnder jhn / so in der Arcolorei würden wägen sein / die mit Geschütz weren zugericht / sollen dem Wagenmeister mit jrer zugehörung vnd rüstung vndergeben werden / die soll er versorgen vnd bei sich behalten.
  cs: |-
    Mistr vozové hradby má svůj zvláštní úřad a pravomoc; nepodléhá zbrojmistrovi, nýbrž má své vlastní velení a správu. Článek mistra vozové hradby: má mít zapsány všechny vozy k vozové hradbě {Wagenburg} podle pořadí, tedy nejprve vozy všech nejvyšších velitelů {Obersten} a vysokých úřadů, jak jim náleží jet po sobě a za sebou; stejně tak má mít svého poručíka {Leutenant} a další osoby, které mu jsou k ruce a pomáhají. Pod něj patří také vozmistr {Wagenmeister}. Budou-li u dělostřelectva vozy upravené s děly {Geschütz}, mají být i s příslušenstvím a výzbrojí odevzdány vozmistrovi;[^1] ten je má opatrovat a mít u sebe.
- typ: odstavec
  de: |-
    Der Wagenburg meister soll die wägen ordnen bei einander nach den Regimenten / daß sich eines jeden Regiments wagen bei einander bleiben / Daß soll der Wagenmeister inn seiner verzeichnuß haben / den Wagenburg meister berichten vnd anzeigen / darauff soll der Wagenburgmeister dem Wagenmeister sagen / weisen / oder helffen ordnen / wie er eines jeden Regiments wägen bei einander halten soll / also soll der Wagenmeister mit andern darzů verordneten daßselbig halten / vnd einem jeden Regiment wo das ligt oder ligen wirt / seinen wagen lassen zufüren / würde aber die notturfft erfordern / daß die in der Wagenburg ziehen müsten / soll der Wagenburgmeister die Wagenburg ordnen nach seinem vnd der Kriegsuerstendigen besten verstandt / so dann wägen verordnet weren mit Geschütz / die soll er darzwischen eintheilen darnach jr vil seind / vnd also darbei mit seinen
  cs: |-
    Mistr vozové hradby má vozy seřadit pohromadě podle pluků {Regimenten}, aby vozy každého pluku zůstaly pohromadě; to má mít vozmistr ve svém soupisu, oznamovat to mistru vozové hradby a ukazovat mu to. Nato má mistr vozové hradby vozmistrovi říci, ukázat nebo pomoci uspořádat, jak má držet vozy každého pluku pohromadě; takto to má vozmistr s ostatními k tomu určenými udržovat a ke každému pluku, kde leží nebo bude ležet, nechat jeho vůz dovézt. Vyžadovala-li by však potřeba, aby táhli ve vozové hradbě, má mistr vozové hradby vozovou hradbu seřadit podle nejlepšího rozumu svého i mužů znalých války; a jsou-li určeny vozy s děly, má je rozdělit mezi ně podle toho, kolik jich je, a zůstat u toho se svými
poznamky:
- n: 1
  text: |-
    V Druhé knize (list [[050r|50r]]) stojí v obdobném textu naopak, že tato dělová vozba má být svěřena mistru vozové hradby a že mistr vozové hradby podléhá zbrojmistrovi; Třetí kniha zde podává odchylné znění.
