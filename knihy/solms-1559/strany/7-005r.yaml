  popis: |-
    Osm obrazových karet pěchoty, dělostřelectva a vozů strany Hannibalovy (černý tisk), bez nápisů (pořadí po řádcích zleva doprava): 1. pochodující pěší střelci s ručnicemi na rameni; 2. dva těžce naložené válečné vozy s náklady pod plachtami, tažené koňmi s vozkami, v pozadí stany s praporky a štítky (na střeše jednoho sedí pták); 3. dvě lehká polní děla na kolových lafetách tažená koňmi, se sedícími a jedoucími dělostřelci; 4. několik těžkých děl na lafetách tažených dlouhými spřeženími; 5. vozy naložené dělovými koulemi a pytli, s vozkami práskajícími biči; 6. další skupina těžkých děl s velkými koly tažená koňmi; 7. dva vozy s převrácenými loďmi (pontony) pro lodní most, každý se čtyřspřežím a vozkou; 8. bez rámečku – těžký moždíř na šikmém dřevěném loži postaveném na pahorku.
