bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    geordnet / sampt seinen Patronen vnd visierungen / darbei laß ich es allhei berühen.
  cs: |-
    sestavil i s jejími šablonami a nákresy[^1]; tím to zde nechávám být.[^2]
- typ: odstavec
  de: |-
    Dieweil nun auch im 1552. vnd 53. Jar / mit der Müntz der bezallung ein grosse vnordnung gewesen / so hat mich nicht von vnnöten gedeucht / allhie dieselbig mit disem kurtzen bericht anzuregen.
  cs: |-
    Protože v letech 1552 a 1553 panoval velký nepořádek také v minci, jíž se vyplácel žold, nepokládal jsem za zbytečné zmínit se o ní zde touto krátkou zprávou.
- typ: odstavec
  de: |-
    Vnd souil dann die Müntz der bezallung belangt / so můß der Kriegßherr auff sein gelt / mit welchem er bezallen will odder wirdt / seine satzung was es gelten soll / machen vnd ordnen / vnnd durch das gantz Leger Marcatanten vnd allen anderen publicieren vnnd verkünden lassen / daß es in einem sollichen wert / wie gesetzt / genommen werden soll / vnnd niemants gestatten / es sei von der regirung oder sonst / als Commißherrn / Prouiantherrn vnnd dergleichen / so mit sollichen sachen handeln vnnd inn das Leger verkauffen / vmbgehen / nicht anders dann wie geordnet / geben vnnd nemen sollen / bei verordneter straff / vnd soll darüber gehalten werden / dann sonst wirt das Kriegßuolck hart darüber geschetzt vnnd vnwillig gemacht / vnd ist zu besorgen es kome dem Kriegßherrn nicht / sonder ander leuten zu gůtem.
  cs: |-
    Co se tedy týče mince, jíž se platí, musí válečný pán {Kriegßherr} pro své peníze, jimiž chce nebo bude platit, stanovit a nařídit kurz, tedy jakou hodnotu mají mít. Po celém ležení {Leger}, markytánům {Marcatanten} i všem ostatním to má dát vyhlásit a oznámit, aby se peníze přijímaly v takto stanovené hodnotě. Nikomu – ať ze správy, nebo jinému, jako jsou komisní páni {Commißherrn}, proviantní páni {Prouiantherrn} a podobní, kdo s takovým zbožím obchodují a prodávají do ležení – nemá dovolit, aby peníze dávali nebo brali jinak, než bylo nařízeno, a to pod stanoveným trestem; a nad tím se má přísně držet ruka. Jinak je totiž válečný lid {Kriegßuolck} tvrdě odírán a roztrpčován a je se třeba obávat, že z toho nebude mít prospěch válečný pán, nýbrž jiní lidé.
- typ: odstavec
  de: |-
    Dieweil dann alles gesucht vnnd fürgenommen werden will / daß ein Kriegßherr sein Kriegßuolck in Regiment halten kan / vnnd alles abschneiden / das sie zu vngehorsam bewegen mage / so ist noch ein Artickel der vil vnwillen vnnd vngehorsam machet odder bringt.
  cs: |-
    Je tedy třeba hledat a podnikat vše, aby válečný pán dokázal udržet svůj válečný lid v kázni, a odstranit vše, co by jej mohlo svést k neposlušnosti. Je tu však ještě jeden článek, který působí a přináší mnoho nevole a neposlušnosti.
- typ: odstavec
  de: |-
    Vnd ist nemlich / wie dann vil kompt / daß ein Herr dem Kriegßuolck nicht zu rechter zeit gelt geben kan / so dann also vber die zeit / das Kriegßuolck mit der Bezallung auffgehalten / so wirdt es vngeduldig / vnnd will keinen gehorsam leisten / so soll als dann der Herr mit der Commis gefast sein / das Kriegßuolck mit der Prouiant erhalten vnd liefferung geben.
  cs: |-
    Jde totiž o to, co se často stává: pán nemůže válečnému lidu vyplatit peníze včas. Je-li pak válečný lid s výplatou zdržován přes stanovenou lhůtu, stává se netrpělivým a nechce zachovávat poslušnost. Tehdy má být pán připraven s komisem {Commis}, aby válečný lid živil proviantem {Prouiant} a vydával mu příděly.
- typ: odstavec
  de: |-
    Desselben gleichen so ein noth für fallen würde / soll mit den Marcatanten gehandelt werden / daß sie dem Kriegßuolck borgen / vnd für strecken der notturfft nach / biß zu der bezallung / als dann sollen die Marcatanten zuuor bezalt werden / laut derselbigen Rechnung oder Holtzkerben / vnd was jeder darüber haben wirdt / doch so soll die maß vnd Ordenung darmit gehalten werden / daß durch die Obrigkeit als Obersten vnnd Ritmeister würde ein Ordnung fürgenommen vnd gehalten / daß das Kriegßuolck nicht mehr auffneme dann sein notturfft vnd so weit die bezallung reichen möchte / das können die Ritmeister wol thůn / daß sie der Register mit jhren
  cs: |-
    Stejně tak, kdyby nastala nouze, má se vyjednat s markytány, aby válečnému lidu půjčovali na dluh a podle potřeby mu zálohovali až do výplaty. Při výplatě pak mají být markytáni vyplaceni nejdříve, a to podle svých účtů nebo vrubovek {Holtzkerben} a podle toho, co o tom kdo z nich bude mít [v záznamech]. Přitom se však má zachovávat míra a řád: vrchnost, totiž plukovníci {Obersten} a rytmistři {Ritmeister}, má zavést a udržovat pořádek, aby si válečný lid nebral víc, než nutně potřebuje a kam až může stačit jeho výplata. To mohou rytmistři snadno zařídit tak, že dají vést rejstříky {Register} se svými
poznamky:
- n: 1
  text: |-
    Něm. *Patronen vnd visierungen* – výkresy, šablony a nárysy obléhacích prací, podkopů a min. Podkopávání pojednává [[5-titul|Pátá kniha]] (*Das fünfft Bůch vom Vndergraben*).
- n: 2
  text: V tisku drobná sazečská přesmyčka *allhei* místo *allhie*.
