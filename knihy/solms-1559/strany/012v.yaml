bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    adellichen stück hielt / so würde Gott auch sie widerumb erhalten. Dann ist Gott der tugent ein handthaber / vnd würde der Adell wider zunemen / dann wir sehen vor augen / das Gott den Adell fallen leßt / ist nur des schuld / daß wir vns nicht adellicher tugent halten / vnd vns doch desselbigen titels vnd freiheiten gebrauchen wöllen.
  cs: |-
    šlechtických kousků, zachoval by ji zase i Bůh. Bůh je totiž ochráncem ctnosti a šlechta by opět vzrůstala. Vidíme přece na vlastní oči, že Bůh nechává šlechtu upadat, a je to jen naše vina: nedržíme se šlechtické ctnosti, a přesto chceme užívat jejího titulu a svobod.
- typ: odstavec
  de: |-
    Vnd das mann zu aller musterung vnder einem jeden Fendlein / den Troß mustern / vnd halt hart darüber / mann wirt es doch nicht alles weren mögen.
  cs: |-
    A při každé přehlídce {musterung} ať se u každého praporce {Fendlein} přehlíží i trén {Troß} a ať se na to přísně dbá; všemu se stejně nezabrání.
- typ: odstavec
  de: |-
    Zum sechsten vnd letsten / die Gottes lesterung betreffend / bedünckt vns / das Ewer Römische Keyserliche Maiestat hett alle Obersten / Haupt vnd beuelchs Leute fürgenommen / vnd jnen zum ersten angesagt / daß Ewer Römische Keyserliche Maiestat / nun mehr vil gesehen habe / die grosse vnmessige Gottslesterung / so vnder dem Kriegsuolck sei / daß sich je lenger je mehr einreißt / dasselbig kan vnnd wöll / Ewer Römische Keyserliche Maiestat nicht gedulden / dann es seie höchlich wider Gott / vnnd den erzörnen wir sonder not / mit einem vergeblichen / mutwilligen / vnnötigen fürnemen / durch das groß vbel schweren / dann es kan keiner nichts herauß schweren / daß jm zu gůtem kommen mög / so ist keiner nicht desto freidiger noch geschickter / schlecht auch nicht desto härter / darumb sei es nichts dann daß mann Gott damit erzörne. So seie es vor augen / daß wir in gefahr des todts alle stundt seind / vnnd darinn all vnser handlung steht / daß wir Gottes gnad vnd hilff dörffen vnd bitten / So ist gůt zu dencken / wie wir solche gnad vnd hilff von Gott erlangen mögen / Dieweil wir jhn so hart erzörn / wann wir jn so hoch verschweren / vnnd was wir für sieg haben künnen in vnsern nöten. Derhalben so wil ich daß nicht dulden noch leiden / er sei hoch oder niders stands / sonder wil darauff ein ernstliche straff setzen / vnnd darob halten / Dann wir wöllen handlen wie Christen / Rittern vnd Kriegsleuten zusteht / vnd nicht wie das viehe / daß sein Gott vnd Herren nicht erkennet.
  cs: |-
    Za šesté a naposled, pokud jde o rouhání: zdá se nám, že by Vaše římské císařské Veličenstvo mělo předvolat všechny plukovníky {Obersten}, hejtmany a velitele {beuelchs Leute} a nejprve jim oznámit toto: Vaše římské císařské Veličenstvo už mnohokrát vidělo veliké a nemírné rouhání, které panuje mezi válečným lidem {Kriegsuolck} a čím dál víc se rozmáhá. To Vaše římské císařské Veličenstvo nemůže a nechce trpět, neboť je to nanejvýš proti Bohu; a toho bez potřeby hněváme marným, svévolným a zbytečným počínáním, totiž tím hrozným, zlým klením. Nikdo si přece klením nevymůže nic, co by mu bylo k dobru; nikdo proto není smělejší ani obratnější a ani neudeří silněji. Není to tedy k ničemu jinému, než že se tím hněvá Bůh. Je přece zjevné, že jsme každou hodinu v nebezpečí smrti a že ve všem, co konáme, potřebujeme Boží milost a pomoc a prosíme o ni. Lze si tedy snadno domyslet, jak bychom takové milosti a pomoci od Boha mohli dosáhnout, když ho tak těžce hněváme a tak hrozně se při něm zaklínáme, a jaké vítězství bychom pak mohli mít ve svých nouzích. Proto to nechci trpět ani snášet u nikoho, ať je vysokého, nebo nízkého stavu; chci na to stanovit přísný trest a trvat na něm. Chceme totiž jednat, jak přísluší křesťanům, rytířům a válečníkům {Kriegsleuten}, a ne jako dobytek, který nezná svého Boha a Pána.
- typ: odstavec
  de: |-
    Darumb so wil ich mich das mit euch berathen / wie das fürzunemen sei mit der straff / vnd hör Ewer Römische Keyserliche Maiestat jre Räth auch darinnen / beschliessen sie dann mit Ewer Römische Keyserliche Maiestat / des zu jrer Maiestat gefallen / so laß Ewer Römische Keyserliche Maiestat / das also mit ernst fürgehn / vnd darob halten / wolten sie aber nicht gern daran / vnd sagen es sei nicht zuweren / es seien Kriegsleut / darzů sag Ewer Römische Keyserliche Maiestat / es seien nicht eines Kriegsmans stück / ein Kriegsman solle sich mannlich vnd ehrlicher sachen fleissigen / besonder was Ritterschafft seie / vnd nicht der vbel leichtfertigkeit.
  cs: |-
    Proto se chci s vámi poradit, jak s tím trestem naložit. Vaše římské císařské Veličenstvo ať v tom vyslechne i jejich rady {Räth}. Usnesou-li se s Vaším římským císařským Veličenstvem tak, jak se Jeho Veličenstvu líbí, ať to Vaše římské císařské Veličenstvo s vážností provede a trvá na tom. Kdyby se jim však do toho nechtělo a říkali by, že tomu nelze zabránit, protože jsou to válečníci, ať jim Vaše římské císařské Veličenstvo odpoví, že to nejsou kousky válečníka: válečník se má snažit o věci mužné a čestné, zvláště ten, kdo patří k rytířstvu, a ne o zlou lehkovážnost.
