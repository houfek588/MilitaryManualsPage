  popis: |-
    Celostránkový dřevořez s čísly „9“, „10“ a „11“ se zápalnými a trhacími prostředky: vlevo („9“) koule se čtyřmi drážkami, kterou prochází železný šíp s ostnatým hrotem, a z něj visí na řetízcích zápalné cáry (závěsné ohně); uprostřed („10“) zápalný šíp s ovinutou náloží; vpravo („11“) útočný trhací špalek (petarda) – nahoře celý válcový špalek stažený příčnými klíny, dole rozevřený špalek s vydlabanou dutinou na prach, mezi nimi volné klíny.
