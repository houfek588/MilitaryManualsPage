  popis: |-
    Celostránkový dřevořez označený čísly „9“, „10“ a „11“ se zápalnými a trhacími prostředky: vlevo („9“) dělová koule se čtyřmi rýhami, proraženým ostnatým železným oštěpem a čtyřmi řetězy nesoucími zápalné pytle; uprostřed („10“) zápalný šíp s ovinutou náloží a opěrným příčníkem k vystřelení do lodních plachet; vpravo a dole („11“) útočný trhací špalek (petarda) s vysekanou dutinou na prach a dřevěnými klíny – nahoře složený a dole rozložený v řezu.
