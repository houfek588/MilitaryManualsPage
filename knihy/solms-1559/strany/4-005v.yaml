  popis: |-
    Levá polovina dvoustránkového dřevořezu (navazuje přímo na protější straně `4-006r`) znázorňující středověký vrhací stroj s protizávažím (trebuchet). Uprostřed těžká dřevěná stolice podepírající v ložiscích šikmo nakloněnou závažíovou skříň naplněnou třemi vrstvami kamenných či olověných bloků s kroužky a rytými údaji vah na horních plochách (mimo jiné např. „440 / 373 / 632 / 480“, „442 / 620 / 533“, „669 / 790 / 700 / 804“). Vlevo dole u trámu základny rytý monogram a letopočet „1556“.
