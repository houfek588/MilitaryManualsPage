bloky:
- typ: odstavec
  de: |-
    Zum zwölfften das die bestallunge auch mit sich bringe / das mann des Kriegßherrn geordnete Kriegßordnung so der machen wirt / vnd derselbigen verwaltung / wölle gehorsam sein vnnd beistehen / wie sie im 54. jar / selbst bedacht vnd gůtwilliglich eingangen seind.
  cs: |-
    Za dvanácté, aby služební list {bestallunge} obsahoval také závazek, že budou poslušni válečného řádu, který válečný pán {Kriegßherrn} nařídí a vydá, i jeho správy a budou jim nápomocni, jak to sami roku 54.[^1] uvážili a dobrovolně přijali.
- typ: odstavec
  de: |-
    Dise obgemelte zwölff Artickel sollen in den bestallungen verfast / vnd klar herauß gestrichen sein / das die Reuter wissen mögen / warauff sie reiten sollen.
  cs: |-
    Těchto dvanáct výše uvedených článků má být pojato do služebních listů a jasně vyloženo, aby jezdci {Reuter} věděli, za jakých podmínek mají vyjet do pole.
- typ: odstavec
  de: |-
    So dann die Reuter also die bestallung angenomen haben / vnd sich auß jhren heusern / auff den Musterplatz zuziehen versamlen / so seind sie in des Kriegßherrn besoldung / als in dem anrit geld biß auff den Musterplatz / vnd so lange sie ligen / biß das sie gemustert werden / vnd jhr gantze Ordentliche besoldung mit allen Emptern / darinnen beschlossen / angehet.
  cs: |-
    Když pak jezdci takto přijmou služební list a shromažďují se ze svých domovů k tažení na přehlídkové místo {Musterplatz}, jsou již v žoldu {besoldung} válečného pána: dostávají příjezdné {anrit geld} až na přehlídkové místo a po celou dobu, co tam leží, dokud nejsou přehlédnuti {gemustert} a nezačne jim běžet celý řádný žold se všemi úřady, které jsou v něm zahrnuty.
- typ: odstavec
  de: |-
    Vnd so dann das Kriegßuolck auff den Musterplatz kompt / vnd aller beieinander ist / sol der Commissarius oder Musterherr die Ritmeister / Leutenant / Fendrich vnd alle andere / was vom Adel vnd nit vom Adel ist als deren Knecht / beieinander auff ein Platz erfordern / vnd jnen dise volgende meinung vorhalten.
  cs: |-
    A když pak válečný lid {Kriegßuolck} dorazí na přehlídkové místo a je celý pohromadě, má komisař {Commissarius} neboli přehlídkový komisař {Musterherr} svolat rytmistry {Ritmeister}, poručíky {Leutenant}, praporečníky {Fendrich} i všechny ostatní ze šlechty i nešlechtice, totiž jejich čeledíny {Knecht}, dohromady na jedno místo a přednést jim toto sdělení:
- typ: odstavec
  de: |-
    Zum ersten die Ordentliche bestallung vnd nach der bestallung / das sie wöllen den Commissarien / welche sie biß bei den hauffen / in vnd durch der Freundtlandt füren werden / in alle wege verfolgen vnd gehorsam sein / dann sie den Beuelch jhres Herrn thůn werden / mit verhütung der vnderthan / das die von niemants vnbillicher weiß beleidiget noch bescheidigt werden / sonder in dem friedlichen ziehen / vnd meniglich nach der gebür vnd satzung bezalen sollen / des söllen vnd wöllen die Commissarien voranziehen / die notturfft zubestellen vnd zuuerordnen / das sie die bekomen mögen / vmb ein zimliche gebürliche bezallung.
  cs: |-
    Předně řádný služební list a po něm [připomenutí], že budou ve všem následovat a poslouchat komisaře, kteří je povedou do země přátel a skrze ni až k houfu {hauffen}. Komisaři totiž budou plnit rozkaz jejich pána a chránit poddané, aby jim nikdo nespravedlivě neubližoval ani neškodil; jezdci mají naopak táhnout pokojně a každému platit podle náležitosti a stanovené taxy. Za tím účelem pojedou komisaři napřed a objednají a zařídí, co je potřeba, aby to jezdci mohli dostat za přiměřenou a slušnou úplatu.
- typ: odstavec
  de: |-
    So aber einem vnderthan darüber vnbilliche bezallung / oder vberlast beschehen wurd / so sol derselbig so er vor die Regirung der Justitien in das Leger komen wirt / vorgestelt werden / vnd sein erkentliche straff darumb empfahen.
  cs: |-
    Kdyby však přesto byl některý poddaný nespravedlivě zaplacen nebo utiskován, má být viník, jakmile přijde do ležení {Leger}, postaven před správu justice {Justitien} a přijmout za to trest, jaký mu bude vyměřen.
- typ: odstavec
  de: |-
    Wurde aber einer eim armen mann sein zerung so er bei jm gethan / nit bezallen vnd daruon ziehen / so sol der arm mann durch die Commissarien zufrieden gestelt werden / vnd jm dasselbig volgents an seiner Besoldung abgezogen werden. Deßgleichen sollen die Ritmeister / Leutenant / Fendrich / vnnd andere ehrliche Leute so vnder dem hauffen seind von des Kriegßherrn Feldöbersten oder Feldmarschalck erfordert werden / gehorsamlich erscheinen / denselbigen was für sachen fürfallen werden / getrewlichen helffen berathschlagen /
  cs: |-
    Kdyby však někdo chudému člověku nezaplatil útratu, kterou u něj nadělal, a odtáhl pryč, mají komisaři toho chudého člověka odškodnit a provinilci to pak má být sraženo z jeho žoldu. Rovněž tak mají rytmistři, poručíci, praporečníci a ostatní čestní lidé, kteří jsou u houfu, kdykoli je povolá nejvyšší polní hejtman {Feldöbersten} válečného pána nebo polní maršálek {Feldmarschalck}, poslušně přijít, věrně jim pomáhat radit o všech věcech, jež se vyskytnou,
poznamky:
- n: 1
  text: |-
    Míněno tažení roku 1554 v Pikardii a Artois proti Francii, v němž Reinhard ze Solmsu sloužil císaři Karlu V. jako polní maršálek (srov. list `1-015v`).
