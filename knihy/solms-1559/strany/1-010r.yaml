bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vnderschlecht / daß sich nit rüsten noch berietten machen will / vnd bei keim hauffen im Feld noch jren Fendlin bleibt / sonder sich nur auff das plündern vnd maussen gibt / mit den Freunden vnd Feinden / es ist jnen alles gleich. Deßgleichen ist gnůgsam gesehn / daß sie nicht vil mehr sich gůter rüstung vnd harnisch zufürn befleissen / sonder allein auff das plündern sich rüsten vnd schicken / wie sie dann in den vnbillichen Kriegen (wie oben vermelt) gebraucht haben. So aber ein Herr will grosse vnd beharliche Krieg fürn / so besehe derselbig zum ersten nach gůten adellichen leuten / die der tugent gemeß sind / vmb ehrn vnd nit plünders willen mit außziehen / sonder jre ehr verwarn wöllen im Feld bei jhren Fendlin bleiben / vnd des feindts warten.
  cs: |-
    přimíchává[^1]: nechce se ani vyzbrojit, ani se připravit k jízdě[^2], nezůstává v poli u žádného houfu {hauffen} ani u svých korouhví {Fendlin}, nýbrž oddává se jen plenění a loupení, ať u přátel, či u nepřátel – všechno je jí jedno. Stejně tak je dost vidět, že už se příliš nesnaží nosit dobrou zbroj {rüstung} a brnění, nýbrž se strojí a chystají jen k plenění, jak si zvykli v těch nespravedlivých válkách (o nichž byla řeč výše). Chce-li však pán vést veliké a vytrvalé války, ať se nejprve poohlédne po dobrých šlechticích, kteří žijí podle ctnosti a netáhnou do pole kvůli kořisti, nýbrž kvůli cti, chtějí svou čest střežit, zůstávat v poli u svých praporců a vyčkávat nepřítele.
- typ: odstavec
  de: |-
    Mit solchen gůten Leuten ist ein Herr versorgt / kan mit jnen gůte Ordnung machen / vnd Regiment halten / darumb so soll ein Kriegs Herr nach denselbigen sich bewerben / oder vmbthůn / vnd sie vor andern darnach halten / was als dann der Kriegßherr an die wendet / das ist behalten / vnd fehrt ein Herr wol darmit.
  cs: |-
    S takovými dobrými lidmi je pán zaopatřen, může s nimi zavést dobrý pořádek a udržovat kázeň. Proto se má válečný pán {Kriegs Herr} o takové lidi ucházet a shánět se po nich a podle toho si jich vážit více než jiných; cokoli na ně pak válečný pán vynaloží, nepřijde nazmar a pán s tím dobře pochodí.
- typ: odstavec
  de: |-
    Dieweil dann die Vnordnung im gantzen Krieg ist eingebrochen / derhalben vil weg wöllen gesucht werden / damit solchs wider in ein ordenlich regierung gebracht werden mög / wie es die hohe notturfft erfordert / damit ein Herr die Krieg erhalten vnd beharren könte.
  cs: |-
    Poněvadž se tedy nepořádek vzmohl v celém válečnictví, je třeba hledat mnohé cesty, jak by se to opět dalo uvést v řádnou správu, jak to vyžaduje svrchovaná potřeba, aby pán mohl válku udržet a vytrvat v ní.
- typ: odstavec
  de: |-
    So ist einem Herrn zubedencken / was vnordnung vnd beschwerlicher handlung vnter dem Kriegßuolck / zu diser zeit ist / vnnd wie schwerlich ein Herr darmit vmbzugehen hat / der ein Krieg füren soll vnd můß / derhalben sol er vor anfang seins Kriegs mit seinen Kriegßuerstendigen / so er in seinem Landt / vnd andere da er ein vertrawen zu hat / vnd weiß das dieselben den Krieg auch wol verstehen vnnd gebraucht seind / beieinandern fordern vnd nemen / vnd jnen alle beschwerliche sachen / derhalben vorhalten / vnd an sie begeren / das sie die vbergeben fel / wölten vor sich nemen die mit allem fleiß bewegen / vnd eins nach dem andern jhres verstandts nach bestes bedencken / wie die in besser maß vnd Ordnung gebracht vnd gestelt / darmit das Kriegßuolck in gůte Regirung gebracht / vnd zu dem besten mit der Pollicei vnderhalten werden möge / verzeichen / vnd was also bei denen bedacht wirt / das hat ein Herr bei sich zubehalten biß zu weiter handelung wie das hie hernach weiter zu einem andern Artickel erhört werden wirt. Dieweil dann die bestallung zur gůten Regirung hochlich dienet so wil ich sie den ersten Artickel sein lassen / vnd in dem wie die gestalt / vnd warauff das Kriegßuolck mit dem ersten in ordnung vnd Regiment zufassen sein wil / mein bedencken anzeigen / wie hernach volgt.
  cs: |-
    Pán má tedy uvážit, jaký nepořádek a jak obtížné poměry nyní panují mezi válečným lidem {Kriegßuolck} a jak těžko si s tím musí poradit pán, který má a musí vést válku. Proto má před začátkem své války povolat a shromáždit své znalce válečnictví {Kriegßuerstendigen}, které má ve své zemi, i jiné, k nimž má důvěru a o nichž ví, že válce rovněž dobře rozumějí a mají v ní zkušenost. Má jim předestřít všechny obtížné záležitosti a požádat je, aby se ujali předložených případů, s veškerou pečlivostí je zvážili, jeden po druhém podle svého rozumu co nejlépe promysleli a sepsali, jak je uvést v lepší míru a řád, aby byl válečný lid přiveden k dobré správě a co nejlépe udržován ve veřejném řádu {Pollicei}. Co takto vymyslí, to si má pán ponechat u sebe až do dalšího jednání, jak o tom bude ještě řeč níže v jiném článku. Protože pak služební list {bestallung} velice prospívá dobré správě, učiním jej prvním článkem a vyložím své mínění o tom, jak má vypadat a na čem má být válečný lid hned zpočátku sevřen do řádu a kázně, jak následuje.
poznamky:
- n: 1
  text: |-
    *vnderschlecht* (*sich unterschlagen* – vmísit se, přimíchat se) je v tisku rozděleno přes konec předchozí strany (*vnder-* | *schlecht/*).
- n: 2
  text: |-
    V tisku stojí *berietten machen* (buď za *bereit machen* – „připravit se“, nebo za *beritten machen* – „opatřit si koně a výstroj“).
