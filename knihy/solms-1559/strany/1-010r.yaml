bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vnderschlecht / daß sich nit rüsten noch berietten machen will / vnd bei keim hauffen im Feld noch jren Fendlin bleibt / sonder sich nur auff das plündern vnd maussen gibt / mit den Freunden vnd Feinden / es ist jnen alles gleich. Deßgleichen ist gnůgsam gesehn / daß sie nicht vil mehr sich gůter rüstung vnd harnisch zufürn befleissen / sonder allein auff das plündern sich rüsten vnd schicken / wie sie dann in den vnbillichen Kriegen (wie oben vermelt) gebraucht haben. So aber ein Herr will grosse vnd beharliche Krieg fürn / so besehe derselbig zum ersten nach gůten adellichen leuten / die der tugent gemeß sind / vmb ehrn vnd nit plünders willen mit außziehen / sonder jre ehr verwarn wöllen im Feld bei jhren Fendlin bleiben / vnd des feindts warten.
  cs: |-
    přimíchává,[^1] že se nechce ani vyzbrojit, ani pohotově připravit k jízdě[^2] a nezůstává v poli u žádného houfu {hauffen} ani u svých praporců {Fendlin}, nýbrž oddává se toliko drancování a loupení – ať u přátel či u nepřátel, všechno je jí jedno. Stejně tak je dostatečně patrné, že se už příliš neusilují vozit si dobrou zbroj {rüstung} a brnění, ale strojí a chystají se jen k plenění, jak to pak prováděli v těch nespravedlivých válkách, o nichž byla řeč výše. Chce-li však pán vést veliké a vytrvalé války, nechť se nejprve poohlédne po dobrých šlechtických lidech, kteří žijí podle ctnosti a netáhnou do pole kvůli kořisti, nýbrž kvůli cti, chtějí svou čest střežit, zůstat v poli u svých praporců a vyčkat nepřítele.
- typ: odstavec
  de: |-
    Mit solchen gůten Leuten ist ein Herr versorgt / kan mit jnen gůte Ordnung machen / vnd Regiment halten / darumb so soll ein Kriegs Herr nach denselbigen sich bewerben / oder vmbthůn / vnd sie vor andern darnach halten / was als dann der Kriegßherr an die wendet / das ist behalten / vnd fehrt ein Herr wol darmit.
  cs: |-
    Takovými dobrými lidmi je pán zaopatřen, může s nimi zavést dobrý pořádek a udržovat kázeň; proto se má válečný pán {Kriegs Herr} po takových lidech ucházet a shánět se po nich a ctít je před ostatními – cokoli pak na ně válečný pán vynaloží, to nepřijde nazmar a pán s tím dobře pochodí.
- typ: odstavec
  de: |-
    Dieweil dann die Vnordnung im gantzen Krieg ist eingebrochen / derhalben vil weg wöllen gesucht werden / damit solchs wider in ein ordenlich regierung gebracht werden mög / wie es die hohe notturfft erfordert / damit ein Herr die Krieg erhalten vnd beharren könte.
  cs: |-
    Poněvadž se tedy nepořádek vzmohl po celé válce, je třeba hledat mnohé cesty, jak by se to opět dalo uvést v řádnou správu, jak vyžaduje svrchovaná nutnost, aby pán mohl válku udržet a vytrvat v ní.
- typ: odstavec
  de: |-
    So ist einem Herrn zubedencken / was vnordnung vnd beschwerlicher handlung vnter dem Kriegßuolck / zu diser zeit ist / vnnd wie schwerlich ein Herr darmit vmbzugehen hat / der ein Krieg füren soll vnd můß / derhalben sol er vor anfang seins Kriegs mit seinen Kriegßuerstendigen / so er in seinem Landt / vnd andere da er ein vertrawen zu hat / vnd weiß das dieselben den Krieg auch wol verstehen vnnd gebraucht seind / beieinandern fordern vnd nemen / vnd jnen alle beschwerliche sachen / derhalben vorhalten / vnd an sie begeren / das sie die vbergeben fel / wölten vor sich nemen die mit allem fleiß bewegen / vnd eins nach dem andern jhres verstandts nach bestes bedencken / wie die in besser maß vnd Ordnung gebracht vnd gestelt / darmit das Kriegßuolck in gůte Regirung gebracht / vnd zu dem besten mit der Pollicei vnderhalten werden möge / verzeichen / vnd was also bei denen bedacht wirt / das hat ein Herr bei sich zubehalten biß zu weiter handelung wie das hie hernach weiter zu einem andern Artickel erhört werden wirt. Dieweil dann die bestallung zur gůten Regirung hochlich dienet so wil ich sie den ersten Artickel sein lassen / vnd in dem wie die gestalt / vnd warauff das Kriegßuolck mit dem ersten in ordnung vnd Regiment zufassen sein wil / mein bedencken anzeigen / wie hernach volgt.
  cs: |-
    Pán má tedy uvážit, jaký nepořádek a obtížné počínání v dnešní době panuje mezi válečným lidem {Kriegßuolck} a jak těžce si s tím musí počínat pán, jenž má a musí vést válku. Proto má před počátkem své války povolat a shromáždit své znalce války, které má ve své zemi, i jiné, k nimž chová důvěru a o nichž ví, že válce také dobře rozumějí a mají v ní zkušenost; má jim předestřít všechny obtížné záležitosti a požádat je, aby vzali předložené případy, s veškerou pečlivostí je zvážili, jeden po druhém podle svého rozumu co nejlépe promysleli a sepsali, jak je uvést v lepší míru a řád, aby válečný lid byl uveden do dobré správy a co nejlépe udržován ve veřejném řádu {Pollicei}. A co oni takto promyslí, to si má pán ponechat u sebe až do dalšího jednání, jak o tom bude ještě slyšet dále v jiném článku. Protože pak služební list {bestallung} velice slouží k dobré správě, učiním jej prvním článkem a vyložím své mínění o tom, jak má vypadat a na čem má být válečný lid nejprve sevřen do řádu a kázně, jak následuje níže.
poznamky:
- n: 1
  text: |-
    Sloveso *vnderschlecht* (*sich unterschlagen* – vkrádat se, přimíchávat se) je v tisku rozděleno přes konec předchozí strany `1-009v` (`vnder-`, s kustodem `schlecht/`); podle pravidel edice je zde uvedeno celé.
- n: 2
  text: |-
    V tisku stojí *berietten machen* (buď přesmyčka za *bereit machen* – „připravit se“, nebo splynutí s *beritten* – „opatřit si dobré koně a výstroj“).
