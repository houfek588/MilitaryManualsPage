    Celostránkový vložený dřevořez označený číslem „30“ (tištěný na šířku, otočený o 90° vlevo) znázorňující obléhací baterii: v popředí klikaté přístupové zákopy chráněné zemními náspy, za nimi opevněné palebné postavení děla na nízké lafetě s prachovými sudy, zemním valem a řadou pletených šancovních košů při předním okraji baterie.
