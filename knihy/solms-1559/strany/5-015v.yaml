bloky:
- typ: odstavec
  de: |-
    Item 10000. Personen mussen 5000. pfundt haben/ die wigen 50. Centner.
    Item 5000 personen mussen 2500 pfundt haben/ macht 25. Cent.
    Item 1000. personen mussen 500. pfundt haben/ machen 5. Cent.
  cs: |-
    Dále 10 000 osob musí mít 5 000 liber {pfundt}, jež váží 50 centů {Centner}.
    Dále 5 000 osob musí mít 2 500 liber, činí 25 centů.
    Dále 1 000 osob musí mít 500 liber, činí 5 centů.
- typ: odstavec
  de: |-
    Item mann sagt (vnd ist war) von grossen summen pferden/ so der Türck in das veld vermögen soll/ deßgleichen der Muscabiter/ es ist aber wol zu rechnen/ demnach wie hieuorn in rechnung vnd vberschlag ist gebracht/ was allein an Brot vnnd frucht darzu gehören will on andere speissung vnd vnderhaltung so darzů gehört vnd auch sein muß/ vnd ob mann schon mehr gelt hat dann man haben muß/ so kan mann doch nicht daruon leben/ sonder darumb zu kauffen sindt was mann bedarff.
  cs: |-
    Dále se říká (a je to pravda) o velikém počtu koní, jaký prý Turek dokáže postavit do pole, a stejně tak Moskvan {Muscabiter}. Lze však dobře spočítat – podle toho, jak to bylo výše sestaveno v počtu a rozpočtu –, co k tomu připadne jen na chléb a obilí, bez ostatní stravy a výživy, která k tomu rovněž patří a být musí. A i kdyby měl člověk více peněz, než potřebuje, nemůže přece žít z nich; musí být také co za ně koupit, čeho je třeba.
- typ: odstavec
  de: |-
    Item wann einer des Türcken macht will rechnen/ der neme der Christenheit macht auch für sich/ so wirt mann ein ander macht vnd rüstung finden/ dann der Türck vnnd Muscabiter haben/ dann wann einer die Christlichen Völcker zu wasser vnd landt/ mit eins jeden lands rüstung vnd Volck das ein jedes hat/ rechnen will/ so wirt mann ein grosse summe eins glaubens finden/ Darumb wann alle Christliche Ländter vnd Völcker eintrechtig weren/ wie die Türcken sind/ so wolten wir ein ander landtuolck dann der Türck haben/ vnd daß wir vns zu wasser vnd landt jhn anzugreiffen theilten/ so wurde es ein leichte handlung gegen jm sein/ Gott wolt vns dann sonderlich straffen.
  cs: |-
    Dále: chce-li někdo počítat moc Turka, ať si vezme na přetřes i moc křesťanstva, a shledá jinou moc a výzbroj, než mají Turek a Moskvan. Neboť chce-li kdo sečíst křesťanské národy na vodě i na souši se zbrojí a lidem, jaké má každá země, shledá veliký počet lidí jedné víry. Proto kdyby všechny křesťanské země a národy byly svorné jako Turci, měli bychom jiný zemský lid {landtuolck} než Turek; a kdybychom se rozdělili a napadli ho po vodě i po souši, bylo by to proti němu snadné dílo – ledaže by nás Bůh chtěl zvláště potrestat.
- typ: odstavec
  de: |-
    Man rechne allein was Teutschlandt für ein Volck zu roß vnd fuß/ mit schwerer vnd leichter rüstung vnd mit geschütz groß vnd klein vermöchte wann alles auff müst was wehrhafftig were/ gleich wie der Türck mit seinem Volck thůt.
  cs: |-
    Ať se jen spočítá, jaký lid na koni i pěšky, v těžké i lehké zbroji a s děly {geschütz} velkými i malými by zmohlo samo Německo, kdyby muselo vytáhnout vše, co je schopno zbraně, tak jako to činí Turek se svým lidem.
- typ: odstavec
  de: |-
    Darumb thů ich es also von grossem Volck vermelten/ daß zusehen was auff einem grossen Volck zu vnderhalten steht/ vnd daß es nit allezeit an einem gar grossen hauffen gelegen/ sonder mit zimlicher macht auch zu handeln ist/ vnd baß dann mit der grossen macht vnd hauffen bei einander/ wann mann mit gůter ordnung vnd geschicklicheit vmbgehn/ vnd die sachen in die leng richten wirt.
  cs: |-
    Proto se takto zmiňuji o velikém vojsku, aby bylo vidět, co obnáší vydržování velikého vojska a že nezáleží vždy na příliš velikém houfu {hauffen}; lze jednat i s přiměřenou mocí, a to lépe než s velikou mocí a houfem pohromadě, postupuje-li se s dobrým řádem a obratně a zařídí-li se věci na delší dobu.
- typ: odstavec
  de: |-
    Darumb zimliche hauffen mit gůtem geröstem volck vnd gůt Regirung vnd Ordnung kan mann erhalten/ vnd ob die schon mehr dann ein haben/ die mann zusamen bringt/ wann das die notturfft erfordert/ dann wann sie nit also bei einander ligen/ vnd doch in der not zusamen komen künden/ so sind sie mit der Prouiant vnd fütterung desto baß zu erhalten/ zu malen vnd zu bachen auff die ferr.
  cs: |-
    Přiměřené houfy s dobře vyzbrojeným lidem a s dobrou správou {Regirung} a řádem lze proto uživit, i kdyby jich bylo více než jeden a spojovaly se, když to potřeba vyžaduje. Neleží-li totiž pohromadě, a přesto se v nouzi mohou spojit, snáze se uživí proviantem a pící, i co do mletí a pečení na dálku.
- typ: odstavec
  de: Mit den Wagen vnd zu schaffung das vnd anders allezeit
  cs: S vozy a s obstaráváním toho i jiného je to vždy
