bloky:
- typ: odstavec
  de: |-
    Item 10000. Personen mussen 5000. pfundt haben/ die wigen 50. Centner.
    Item 5000 personen mussen 2500 pfundt haben/ macht 25. Cent.
    Item 1000. personen mussen 500. pfundt haben/ machen 5. Cent.
  cs: |-
    Dále 10 000 osob musí mít 5 000 liber {Pfundt}, jež váží 50 centů {Centner}.
    Dále 5 000 osob musí mít 2 500 liber, činí 25 centů.
    Dále 1 000 osob musí mít 500 liber, činí 5 centů.
- typ: odstavec
  de: |-
    Item mann sagt (vnd ist war) von grossen summen pferden/ so der Türck in das veld vermögen soll/ deßgleichen der Muscabiter/ es ist aber wol zu rechnen/ demnach wie hieuorn in rechnung vnd vberschlag ist gebracht/ was allein an Brot vnnd frucht darzu gehören will on andere speissung vnd vnderhaltung so darzů gehört vñ auch sein muß/ vnd ob mann schon mehr gelt hat dañ man haben muß/ so kan mann doch nicht daruon leben/ sonder darumb zu kauffen sindt was mann bedarff.
  cs: |-
    Dále se říká (a jest pravda) o velikých počtech koní, jaké prý Turek i Moskvan {Muscabiter} dokážou postavit do pole; avšak lze snadno spočítat podle toho, jak bylo výše v počtu a rozpočtu vyloženo, co jen na samý chléb a obilí k tomu náleží – bez ostatní stravy a výživy, která k tomu rovněž patří a musí být. A i kdyby člověk měl více peněz, než potřebuje, nemůže přece žít z peněz, nýbrž se za ně musí dát koupit to, čeho je zapotřebí.
- typ: odstavec
  de: |-
    Item wann einer des Türcken macht will rechnen/ der neme der Christenheit macht auch für sich/ so wirt mann ein ander macht vnd rüstung finden/ dann der Türck vnnd Muscabiter haben/ dann wann einer die Christlichen Völcker zu wasser vnd landt/ mit eins jeden lands rüstung vnd Volck das ein jedes hat/ rechnen will/ so wirt mann ein grosse summe eins glaubens finden/ Darumb wann alle Christliche Ländter vnd Völcker eintrechtig weren/ wie die Türcken sind/ so wolten wir ein ander landtuolck dañ der Türck haben/ vnd daß wir vns zu wasser vnd landt jhn anzugreiffen theilten/ so wurde es ein leichte handlung gegen jm sein/ Gott wolt vns dann sonderlich straffen.
  cs: |-
    Dále: chce-li někdo počítat moc Turka, ať si také vezme před sebe moc křesťanstva – pak shledá jinou sílu a zbroj, než jakou mají Turek a Moskvan. Neboť chce-li kdo sečíst křesťanské národy na vodě i na souši se zbrojí a lidem, který každá země má, shledá veliký počet jedné víry. Proto kdyby všechny křesťanské země a národy byly svorné, jako jsou Turci, měli bychom jiný zemský lid než Turek; a kdybychom se rozdělili k útoku na něj po vodě i po souši, bylo by to proti němu snadné jednání – ledaže by nás Bůh chtěl zvláštně potrestat.
- typ: odstavec
  de: |-
    Man rechne allein was Teutschlandt für ein Volck zu roß vnd fuß/ mit schwerer vnd leichter rüstung vñ mit geschütz groß vñ klein vermöchte wann alles auff müst was wehrhafftig were/ gleich wie der Türck mit seinem Volck thůt.
  cs: |-
    Jen ať se spočítá, jaké vojsko na koních i pěšky, v těžké i lehké zbroji a s děly {Geschütz} velkými i malými by zmohlo samotné Německo, kdyby muselo nastoupit vše, co jest schopno zbraně, právě tak, jak to činí Turek se svým lidem.
- typ: odstavec
  de: |-
    Darumb thů ich es also von grossem Volck vermelten/ daß zusehen was auff einem grossen Volck zu vnderhalten steht/ vnd daß es nit allezeit an einem gar grossen hauffen gelegen/ sonder mit zimlicher macht auch zu handeln ist/ vnd baß dañ mit der grossen macht vnd hauffen bei einander/ wann mann mit gůter ordnung vnd geschicklicheit vmbgehn/ vnd die sachen in die leng richten wirt.
  cs: |-
    Proto se takto zmiňuji o velikém vojsku, aby bylo patrno, co stojí vydržování velikého vojska a že nezáleží vždy na příliš velikém houfu, nýbrž lze jednat i s přiměřenou mocí – a to lépe než s velikou silou a houfem pohromadě, postupuje-li se s dobrým řádem a obratností a zařizují-li se věci pro delší trvání.
- typ: odstavec
  de: |-
    Darumb zimliche hauffen mit gůtem geröstem volck vñ gůt Regirung vnd Ordnung kan mann erhalten/ vñ ob die schon mehr dañ ein haben/ die mann zusamen bringt/ wann das die notturfft erfordert/ dann wann sie nit also bei einander ligen/ vnd doch in der not zusamen komen künden/ so sind sie mit der Prouiant vnd fütterung desto baß zu erhalten/ zu malen vnd zu bachen auff die ferr. Mit den Wagen vnd zu schaffung das vnd anders allezeit
  cs: |-
    Přiměřené houfy {Hauffen} s dobrým vyzbrojeným lidem, dobrou správou a řádem lze tudíž uživit, i kdyby jich bylo více než jeden a spojovaly se dohromady, když to potřeba vyžaduje. Neboť neleží-li takto pohromadě a přesto se v nouzi dokážou spojit, snáze se uživí proviantem i pící, se mletím i pečením na dálku, s vozy i s dopravou toho i jiného vždy
