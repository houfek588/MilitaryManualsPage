id: 6-025v
list: 25 (6. kniha)
strana: verso
sken: 542
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: tabulka
  de:
  - - Haben beide ein wagen/ thůt zu 12 batzen
    - 13 gulden 9 batzen.
  - - Heinrich Werde.
    - ''
  - - Item ist den 19 Maij mit 6 pferden angezogen/ hat biß auff den Musterplatz reitens vnd stilligens 46 meiln/ thůt 17 tag/ macht das pferd ein tag zu 6 batzen /
    - 40 gulden 12 batz.
  - - Ein halben Wagen /
    - 6 gulden 12 batzen.
  - - Summa 47 gulden 9 batzen.
    - ''
  - - Johann von Eßleben.
    - ''
  - - Item hat auff den Musterplatz 46 Meiln/ ist 17 tag geriten vnnd stilgelegen/ thůn 5 pferd/ das pferd ein tag zu 6 batzen
    - 34 flo.
  - - Die anzal des Wagens ein nacht 5 batzen/ thůt
    - 5 gulden 10 batzen.
  - - Summa 39 gulden 10 batzen.
    - ''
  - - Lorentz Schungel.
    - ''
  - - Item ist angezogen/ wie obgemelt/ thůt 17 tag/ auff jedes pferde jeden tag 6 batzen/ thůn 5 pferde
    - 34 gulden.
  - - Die anzal des wagens/ thůt
    - 5 gulden 10 batzen.
  - - Summa 39 gulden 10 batzen.
    - ''
  - - Summa Gelt
    - 140 flo. 8 batz.
  - - Summa Pferde
    - '16'
  - - Summa Wagen.
    - '2'
  - - Wilhelm von Meiburg.
    - ''
  - - Item ist angezogen/ wie obgemelt/ thůt 17 tag/ hat 8 pferd/ macht auff jedes pferd jeden tag zu 6 batzen /
    - 54 gulden 6 batz.
  - - Die anzal des Wagens ein nacht 8 batzen/ thůt
    - 9 gulden 1 batzen.
  - - Summa 63 gulden 7 batzen.
    - ''
  - - Heinrich Meiburg.
    - ''
  - - Item ist angezogen mit 5 pferden/ wie obgemelt/ thůt 17 tag/ machet auff jedes pferd allen tag zu 6 batzen
    - 34 gulden.
  - - Die anzal des Wagens/ thůt
    - 5 gulden 10 batzen.
  - - Summa 39 gulden 10 batzen.
    - ''
  - - Gothart Pfeiff.
    - ''
  - - Item ist angezogen mit 7 pferden/ wie obgemelt/ thůt 17 tag/ auff jedes pferd ein tag zu 6 batzen/ macht an gelt
    - 47 gulden 9 batz.
  - - Die anzal des Karns ein nacht 7 batzen auffs pferd/ thůt
    - 7 fl. 14 batz.
  - - Summa 60 flo. 8 batzen.
    - ''
  - - Weiter ein pferd/ ist angezogen wie oblaut/ thůt
    - 6 gulden 12 batzen.
  - - Die anzal des wagens/ thůt
    - 1 gulden 2 batzen.
  - - Summa Gelt
    - 165 flo. 14 batz.
  - - Summa Pferde
    - '20'
  - - Summa Wagen.
    - 1½
  cs:
  - - Oba mají společně jeden vůz; to činí po 12 bacenech {batzen}
    - 13 zl. 9 bac.
  - - Heinrich Werde
    - ''
  - - 'Dále: vytáhl 19. května se 6 koňmi a měl až na přehlídkové místo {Musterplatz} 46 mil; jízdy a stání to činí 17 dní, koně na den po 6 bacenech'
    - 40 zl. 12 bac.
  - - Půl vozu
    - 6 zl. 12 bac.
  - - Úhrnem 47 zl. {gulden} 9 bac.
    - ''
  - - Johann von Eßleben
    - ''
  - - 'Dále: měl na přehlídkové místo 46 mil, jel a stál 17 dní; to činí za 5 koní, koně na den po 6 bacenech'
    - 34 zl.
  - - Podíl {anzal} na voze, na noc 5 bacenů; to činí
    - 5 zl. 10 bac.
  - - Úhrnem 39 zl. 10 bac.
    - ''
  - - Lorentz Schungel[^1]
    - ''
  - - 'Dále: vytáhl jako výše uvedený; to činí 17 dní, na každého koně každý den 6 bacenů, a to za 5 koní'
    - 34 zl.
  - - Podíl na voze; to činí
    - 5 zl. 10 bac.
  - - Úhrnem 39 zl. 10 bac.
    - ''
  - - 'úhrnem: peníze[^2]'
    - 140 zl. 8 bac.
  - - 'úhrnem: koně'
    - '16'
  - - 'úhrnem: vozy'
    - '2'
  - - Wilhelm von Meiburg
    - ''
  - - 'Dále: vytáhl jako výše uvedený; to činí 17 dní, má 8 koní, dělá na každého koně každý den po 6 bacenech'
    - 54 zl. 6 bac.
  - - Podíl na voze, na noc 8 bacenů; to činí
    - 9 zl. 1 bac.
  - - Úhrnem 63 zl. 7 bac.
    - ''
  - - Heinrich Meiburg
    - ''
  - - 'Dále: vytáhl s 5 koňmi jako výše uvedený; to činí 17 dní, dělá na každého koně na každý den po 6 bacenech'
    - 34 zl.
  - - Podíl na voze; to činí
    - 5 zl. 10 bac.
  - - Úhrnem 39 zl. 10 bac.
    - ''
  - - Gothart Pfeiff
    - ''
  - - 'Dále: vytáhl se 7 koňmi jako výše uvedený; to činí 17 dní, na každého koně na den po 6 bacenech, v penězích'
    - 47 zl. 9 bac.
  - - Podíl na káře {Karns}, na noc 7 bacenů na koně; to činí
    - 7 zl. 14 bac.
  - - Úhrnem 60 zl. 8 bac.[^3]
    - ''
  - - Dále jeden kůň, vytáhl jako výše; to činí
    - 6 zl. 12 bac.
  - - Podíl na voze; to činí
    - 1 zl. 2 bac.
  - - 'úhrnem: peníze'
    - 165 zl. 14 bac.
  - - 'úhrnem: koně'
    - '20'
  - - 'úhrnem: vozy'
    - 1½
poznamky:
- n: 1
  text: |-
    V přehlídkovém rejstříku na [[6-021r|s. 6-021r]] *Lorentz Stungel*.
- n: 2
  text: |-
    Úhrn 140 zl. 8 bac. zahrnuje i společný vůz Thobiase von Bidenfeldt a Guntermana Wintera z prvního řádku strany (13 zl. 9 bac.) a tři skupiny Werde, Eßleben a Schungel.
- n: 3
  text: |-
    Součet 47 zl. 9 bac. + 7 zl. 14 bac. dává 55 zl. 8 bac.; tisk má 60 zl. 8 bac. Také úhrn koní (8 + 5 + 7 + 1 = 21) se liší od tištěných 20. Tištěný úhrn peněz 165 zl. 14 bac. nesedí ani s tištěnými položkami (171 zl. 9 bac.), ani s opraveným úhrnem Gotharta Pfeiffa (166 zl. 9 bac.); celkový součet na [[6-027r|s. 6-027r]] však počítá právě se 166 zl. 9 bac., chyba je tedy jen v sazbě.
