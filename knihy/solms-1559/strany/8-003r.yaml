sken: 593
stav: prelozeno
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Deßgleichen Meel ein vorrat souil mann des haben/ schůten oder behalten kan/ dann es ein gůter tröstlicher vorrat ist/ darauff sol mann sich allwegen schicken/ vnd die Befestung darnach machen/ daß solcher vorrat verwart vnd behalten kündt werden.
  cs: |-
    Rovněž [je třeba mít] zásobu mouky, kolik jí lze sehnat, nasypat a uchovat, neboť je to dobrá a útěšná zásoba. Na to se má [pán] vždy připravit a pevnost {Befestung} podle toho zařídit, aby se taková zásoba dala uložit a uchovat.
- typ: odstavec
  de: |-
    Vnd wann an den orten vnd Landen der Speck zubekomen were/ soll derselbig allezeit im vorrat sein/ vnd wo sichs zutrüge/ daß solcher Speck lang hangen/ vnd zu besorgen were/ daß er zu alt vnd verderben würde/ so soll derselbig mit der zeit vnder das Kriegßuolck verspeißt vnd verkaufft/ vnd alle jar mit frischem witter ersetzt werden/ alßdann hat mann allezeit einn gůten vorrat/ doch wil derhalben gůt versehung geschehen/ daß der Speck an solche ort gehenckt/ vnd mit reichen vnd der lufft wie sich gebürt verwart vnd erhalten werde/ wo er damit nit versehen wirt so verdirbt er/ darumb sol solche versehung geschehen. Der gestalt soll mann mit anderm Feysch thůn als von Küen/ Ochsen vnd dergleichen/ wann sich einer Besatzung zubesorgen were/ dieselbigen schlachten vnd fein reyn in daß Saltz legen/ vnd verwart hinstellen/ wann solches fleysch reyn gehalten wirdt/ so helt es sich ein gantz jar/ vnd wann manns schlacht soll es zu stöcken gehauen/ vnd das blůt daruon geweschen werden/ vnd erkalten lassen/ vnd mit Saltz in die Faß oder Kuffen legen vnd wol saltzen/ vnd wann manns speisen wil/ soll es zuuor einn tag oder mehr in Rauch gehenckt/ vnd dann gekocht werden/ dieweil es im saltz gelegen/ hats vil Saltz an sich genomen/ derwegen darff mann im kochen nit souil Saltz brauchen als wanns frisch gekocht wirt.
  cs: |-
    Dá-li se v těch místech a zemích sehnat slanina, má jí být vždy zásoba. A kdyby se stalo, že by taková slanina visela dlouho a bylo by se třeba obávat, že zestárne a zkazí se, má se časem rozdat válečnému lidu {Kriegßuolck} k jídlu a prodat a každý rok znovu nahradit čerstvou. Tak bude mít člověk vždy dobrou zásobu. Proto je však třeba dobře zařídit, aby se slanina pověsila na taková místa a uchovávala a udržovala kouřem a vzduchem, jak náleží; není-li tak opatřena, zkazí se. Proto se má takové opatření učinit. Stejně se má zacházet s jiným masem,[^1] jako z krav, volů a podobně: hrozí-li [obléhání] posádky {Besatzung}, mají se [kusy dobytka] porazit, maso pěkně čisté naložit do soli a uložit v bezpečí. Je-li takové maso drženo v čistotě, vydrží celý rok. Když se porazí, má se rozsekat na kusy, krev z něj omýt a nechat vychladnout, potom naložit se solí do sudů nebo kádí a dobře prosolit. Kdo je chce jíst, má je napřed na den nebo déle pověsit do kouře a teprve pak uvařit. Protože leželo v soli, nasálo mnoho soli, a proto se při vaření nemusí použít tolik soli jako při vaření čerstvého masa.
- typ: odstavec
  de: |-
    Vnd wer solches fleysch vber jar behalten wil/ daß es gůt bleibe/ der solls wanns ein par Monat oder drei im Saltz gelegen/ wider in einem reynen Wasser außweschen/ auff ein sauber Stro legen/ vnnd trocken lassen/ dann hat das Saltz das blůt außgezogen dauon das Feysch verdirbt/ vnd darnach mit Saltz wider wie vor einlegen/ vnd die Lack oder Soltz so vorhin darüber gewesen/ ist rot vnd vnsauber/ darumb soll mann sie wider wol siden vnd scheumen biß sie lautter vnd reyn wirt/ darnach erkalten lassen/ dann wider inns faß vbers fleysch gethan/ vnd zeitlich darzů gesehen daß die Lack vber dem fleysch sei/ vnd wanns vertrocknet soll mann wider ein frisch Lack von Saltz vnd reynem Wasser siden vnd wol scheumen/ vnd erkalten lassen/ vnd wider darüber giessen/ auch allzeit vol halten/ so bleibt es so lang als mann will. Dieweil vil vnderhaltungen in ein Besatzung gehörn/ vnd zum ersten darinn sein wöllen/ so will ich dieselbigen stück anzeigen/ auch wie mann sie brauchen vnd damit handeln soll.
  cs: |-
    Kdo chce takové maso uchovat déle než rok, aby zůstalo dobré, má je poté, co dva nebo tři měsíce leželo v soli, znovu vyprat v čisté vodě, položit na čistou slámu a nechat oschnout. Sůl totiž mezitím vytáhla krev, od níž se maso kazí. Potom je má znovu naložit se solí jako předtím. Lák {Lack} neboli slaný nálev {Soltz}, který byl předtím nad masem, je červený a nečistý; proto se má znovu dobře provařit a sbírat z něj pěna, dokud není čirý a čistý. Pak se nechá vychladnout a znovu nalije do sudu přes maso a je třeba včas dohlížet, aby lák stál nad masem. Když vyschne, má se znovu uvařit čerstvý lák ze soli a čisté vody, dobře sebrat pěnu, nechat vychladnout a opět nalít na maso; [sud] se má vždy držet plný. Tak maso vydrží, jak dlouho chceme. Protože do posádky patří mnoho [druhů] zásob, které v ní mají být především, chci tyto věci uvést a také [popsat], jak se jich má užívat a jak s nimi zacházet.
poznamky:
- n: 1
  text: |-
    Tisk zde dvakrát sází *Feysch* místo *Fleysch* (maso); jinde na téže straně stojí správně *fleysch*. Tvar tisku je v originále ponechán. Rovněž *witter* v obratu „mit frischem witter ersetzt“ je patrně tvar slova *wider* (znovu).
