poznamky:
- n: 1
  text: Částky u koní (49 zl. 6 bac.) i u vozu (7 zl. 9 bac.) odpovídají 9½ dne, nikoli 10½ dne uvedeným v tisku; suma i součet strany 229 zl. 13 bac. s tištěnými částkami souhlasí. Také u položek 11, 13 a 14 se částky za koně s počtem dní přesně nekryjí (zaokrouhlení nebo tiskové chyby).
- n: 2
  text: Suma 95 zl. 7 bac. nesouhlasí s tištěnými položkami (42 zl. + 3 zl. 7 bac. + 14 zl. = 59 zl. 7 bac.); správná suma je 59 zl. 7 bac. – s ní souhlasí součet strany 362 zl. 13 bac. na následující straně. Jméno Hanß von Dotleben stojí v tisku nad sumou předchozí položky, patří však k položce 18. „Meile“ je německá míle, asi 7,5 km.
