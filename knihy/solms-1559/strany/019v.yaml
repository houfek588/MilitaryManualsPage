bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Obersten seines begerens nicht vbergeben / soll der Oberst mit allen seinen hauffen in gůter Ordnung / auch auff das zeitlichst so jhm am tag möglich hinzu rücken / doch daß sein Volck mit dem Geschütz herauß nicht bescheidiget werde / vnnd den Flecken mit den Schützen / auch wo von nöten / mit den Renfanen berennen lassen / vnd er selbst / oder andere Kriegsuerstendigen darneben / als Feldmarschalck / Oberster Leutenant / Oberster der Knecht / vnnd Zeugmeister / den Flecken wol nach aller notturfft lassen besichtigen / wo er am füglichsten mit geringster gefahr zu belegern / zuschantzen / vnd zu schiessen / auch deßhalben / so ferr er sie vorhin nicht hat / gůte kundtschafft machen / an wellichem ort der Flecken am schwechsten sei / durch Leut die kürtzlich darinnen gewesen sein / es seien Freund / Feind / oder gefangne.
  cs: |-
    nejvyššímu veliteli na jeho žádost vydat, má nejvyšší velitel přirazit se všemi svými houfy {hauffen} v dobrém pořádku a také co nejčasněji ve dne, jak mu je jen možné – avšak tak, aby jeho lid nebyl poškozen střelbou z děl {Geschütz} zevnitř – a má nechat městečko obklíčit střelci {Schützen}, a kde je třeba, i předvojovou korouhví {Renfanen}; sám pak nebo s ním další války znalí muži, jako polní maršálek {Feldmarschalck}, nejvyšší poručík {Leutenant}, plukovník {Oberster der Knecht} pěchoty a zbrojmistr {Zeugmeister}, má dát městečko řádně podle veškeré potřeby prohlédnout, kde je lze nejpříhodněji a s nejmenším nebezpečím oblehnout, přikopat se šancemi a ostřelovat, a také si k tomu, nemá-li je již předem, opatřit dobré zprávy {kundtschafft}, na kterém místě je městečko nejslabší, skrze lidi, kteří v něm nedávno byli, ať už přátele, nepřátele nebo zajatce.
- typ: odstavec
  de: |-
    Wiewol von brennen meldung geschicht / acht ich doch / so ferr es nit durch etliche treffliche vrsachen geschehen muß / für besser / es blieb vnderwegen / vnd werde der Fleck einzügig bei tag / vnnd mit schleichen in der nacht besichtiget / angesehen / daß im brennen nur schadt empfangen / vnd wenig fruchtbars darauß geschafft wirt.
  cs: |-
    Ačkoliv se mluvívá o zapalování, považuji přece – pokud se tak nemusí stát z nějakých závažných příčin – za lepší, aby se od toho upustilo a městečko bylo obhlíženo jednotlivě za dne a plížením v noci, vzhledem k tomu, že při zapalování vzniká jen škoda a málo užitečného se tím pořídí.
- typ: odstavec
  de: |-
    Es werden auch billich alle Scharmützel vor den Flecken widerrathen / der vrsachen halben / wie inn dem nechsten Artickel von dem brennen angezeigt ist / es wolte dann der Oberst / was für ein Kriegsuolck in der Besatzung were / erkennen lernen / vnd wo jhr Geschütz stünde / erfaren.
  cs: |-
    Po právu se také zrazuje ode všech šarvátek před městečky z týchž příčin, jak bylo uvedeno v předchozím článku o zapalování, ledaže by chtěl nejvyšší velitel poznat, jaký válečný lid {Kriegsuolck} je v posádce {Besatzung}, a zjistit, kde stojí jejich děla.
- typ: odstavec
  de: |-
    Als bald dann ein Fleck berent vnd besichtiget ist / oder der Oberst sonst kundtschafft hat / soll er als bald des schantzens vnnd schiessens halben / mit allen seinen Kriegsuerstendigen Rath halten / ahn welchen enden er sich mit jhnen / oder durch sich selbst / den Flecken zubeschiessen entschleußt / soll er an andern orten mit Feldgeschütz zu den obern wehrn zuschiessen beuelhen / Damit die inn der Besatzung nicht mercken / wo er sie mit dem grossen Geschütz zunötigen / fürhabens sei / er keme dann in erfarung / daß sie den Flecken da er schwach were / bewten / dasselb soll er von stunden an / zu wehren vnderstehn.
  cs: |-
    Jakmile je tedy městečko obklíčeno a prohlédnuto, anebo má nejvyšší velitel zprávy jinak, má ihned o kopání šancí a o střelbě uspořádat poradu se všemi svými války znalými muži; na kterých místech se s nimi či sám rozhodne městečko ostřelovat, jinde má rozkázat střílet polními děly na horní obranná postavení, aby ti v posádce nepoznali, kde na ně zamýšlí udeřit těžkými děly – ledaže by se dozvěděl, že městečko tam, kde je slabé, opevňují, čemuž se má ihned pokusit zabránit.
- typ: odstavec
  de: |-
    Ein jeder der zum schantzen oder schiessen rathen soll odder will / muß gůt auffmerckens haben / wann er es durch kundtschafft nicht erfarn hat / wo die Häuser auff der Maurn oder nahe darbei ligen / daselbst sollen die flecken beschossen werden / es habe dann sonderliche verhinderung / als feste Gräben / Schütten / oder starcke Bolwerck / dann an anderen orten des Fleckens / angesehen / wo die Häuser auff der Maurn oder nahe darbei stehen / künden die in der Besatzung
  cs: |-
    Každý, kdo má nebo chce radit k budování šancí či ke střelbě, musí dávat dobrý pozor – nedozvěděl-li se to ze zpráv –, kde stojí domy přímo na hradbě nebo těsně u ní: právě tam se mají městečka ostřelovat (ledaže by tomu bránila zvláštní překážka, jako hluboké příkopy, valy či silné bolverky {Bolwerck}, větší než na jiných místech městečka), poněvadž kde domy stojí na hradbě nebo těsně u ní, nemohou ti v posádce
