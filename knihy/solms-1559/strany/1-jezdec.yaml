  popis: |-
    Celostránkový dřevořez v obdélném rámečku s jezdeckým portrétem vousatého velitele jedoucího vlevo na kráčejícím koni: jezdec má na hlavě vysoký klobouk s bohatým péřovým chocholem, zbroj na pažích i nohou s ostruhami pod zapnutým koletem, v pravé ruce drží tenkou velitelskou hůlku a v levé otěže, u boku má kord a u přední rozsochy sedla podlouhlé pouzdro s třapcem. Kůň má na plecích a zádi ozdobné tmavé pokrývky zakončené střapci. Výjev pod mračným nebem rámují po obou stranách kmeny stromů s propletenými holými větvemi tvořícími klenbu.
