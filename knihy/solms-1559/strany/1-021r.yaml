strana: recto
sken: 51
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Darmit aber zusehen sein mag / das die Teutschen / mit ernst mit der Justitien furth gefaren seind / vnnd in das werck gebracht / soll solche handelung mit jhren gestehenden straffen / besonder in ein Bůch geschrieben werden / das ich dises mit demselbigen nit zu lang mache / dann es ist vil vnnd gebüret sich auch solches in ein eigen Bůch zuschreiben / dann als offt vnd dick / so ein Feldzug oder Leger sein wirt / soll dises Bůch bei handen sein / vnd allemal ein neues gemacht werden / vnnd wider allemal zu ende des zugs auffgehaben vnnd behalten werden als ein Gerichßbůch / so hat mann sich alwegen in zügen darnach zůrichten.
  cs: |-
    Aby však bylo patrné, že Němci se spravedlností zacházeli vážně a uváděli ji ve skutek, má být toto jednání i s udělenými tresty[^1] zapsáno do zvláštní knihy, abych tento spis nečinil příliš dlouhým – je toho totiž mnoho a sluší se zapsat to do vlastní knihy. Kdykoli totiž bude nějaké polní tažení {Feldzug} či ležení {Leger}, má být tato kniha po ruce; pokaždé se má založit nová a na konci tažení ji je třeba opět uložit a uschovat jako soudní knihu[^2]. Podle ní se pak má při taženích vždy postupovat.
- typ: odstavec
  de: |-
    Vnd so dann die Justitien also den Nationen zu Regiren in die Handt gegeben / beuolhen vnnd zuuerwalten auffgelegt wirt / so ist die ehr jhrer selber / vnnd haben fleiß die zuhalten vnnd zuhandthaben / vnnd wirt gůte Regirung geschehen / vnnd willige Leut machen.
  cs: |-
    Když se tedy spravedlnost takto vloží národům do rukou, svěří a uloží se jim, aby ji samy řídily a spravovaly, jde o jejich vlastní čest: budou se snažit ji zachovávat a uplatňovat, nastane dobrá správa a lidé budou ochotní.
- typ: odstavec
  de: |-
    Solten aber die Nationen besonder die Teutschen / die die Justitien her gebracht haben / sich vnder ein ander Justitien begeben / vnnd vnderwürffig machen / vnd die ehr so sie in dem haben / vbergeben müssen / da wirt nichts gůts auß werden / vnnd wirt schwerlichen geschehen / vnnd so sie sich schon also wolten vntergeben / so wirt zwischen den Nationen kein einigkeit noch gehorsam / kein Nation wirdt der anderen wöllen gehorsamen sein / dardurch jmmer mehr Lermen vnd auffruhr vnder jnen entstehn würde / darumb mag es nicht friedlicher angestellet werden / dann mann laß einer jeden Nation eigene Rechtuertigung / doch von einem gleichen beuelch der Ordnung.
  cs: |-
    Kdyby se však národy – zvláště Němci, kteří svou spravedlnost odedávna zachovávají – měly poddat a podřídit cizí spravedlnosti a vzdát se cti, kterou v ní mají, nic dobrého z toho nevzejde a stěží se to podaří. A i kdyby se už takto poddat chtěly, nebude mezi národy svornost ani poslušnost: žádný národ nebude chtít poslouchat jiný, a tak by mezi nimi stále vznikaly další poplachy {Lermen} a vzpoury {auffruhr}. Pokojněji to proto zařídit nelze, než že se každému národu ponechá vlastní soudnictví, avšak podle jednoho stejného nařízení a řádu.
- typ: odstavec
  de: |-
    Vnd das ich also hart wider dises / wie gehört / strebe / ist die vrsach das mich bedünckt die notturfft zusein / dieweil ich gesehen habe / das vil beschwerlichs darauß entstanden ist / vnnd dem Herren in vil wege / darmit nit wol gedienet wirt / aber durch ein gleiche ordentliche Justitien vnnd einigkeit / wirt dem Herrn baß gedient werden sampt anderer gůten Ordnung der Pollicei vnnd vnderhaltund des Legers vnd Kriegßuolck / wie das nun fürter derhalben eins nach dem andern / besonder beschrieben vnnd angezeigt werden wirt.
  cs: |-
    Že proti tomu, jak bylo řečeno, tak důrazně vystupuji, má svou příčinu: pokládám to za nezbytné, neboť jsem viděl, že z toho vzešlo mnoho obtíží a pánovi se tím v mnoha ohledech dobře neslouží. Stejnou řádnou spravedlností a svorností se mu naproti tomu poslouží lépe, spolu s dalším dobrým veřejným řádem {Pollicei} a zaopatřením[^3] ležení i válečného lidu {Kriegßuolck}, jak to bude nyní dále jedno po druhém zvlášť popsáno a vyloženo.
- typ: odstavec
  de: |-
    Aber das ist recht vnnd billich / wann zwo Nationen sich mit einander jrren mit den hauffen / vnd nit Personen allein / so sollen derselbigen Obersten oder Hauptleut zu dem Feldobersten gehen / demselbigen die sachen anzeigen vnd mit seinem Rath vnd willen furter handeln.
  cs: |-
    Je však spravedlivé a slušné, aby se v případě, že se dva národy dostanou do sporu celými houfy {hauffen}, a nikoli jen jednotlivé osoby, jejich plukovníci {Obersten} nebo hejtmani {Hauptleut} odebrali k nejvyššímu polnímu hejtmanovi {Feldobersten}, předložili mu věc a dále jednali s jeho radou a podle jeho vůle.
poznamky:
- n: 1
  text: |-
    V tisku *gestehenden* (sken zřetelně *geſtehenden*), patrně ve smyslu „uložené, stanovené“, případně tisková chyba za *geschehenden*.
- n: 2
  text: V tisku *Gerichßbůch* místo *Gerichtßbůch*.
- n: 3
  text: V tisku *vnderhaltund* místo *vnderhaltung*.
