bloky:
- typ: odstavec
  de: |-
    Zum sechsten so kan mann ein zimliche Wagenburg allezeit ordnen so mann etwan auff ein Fütterung ziehen / das mann fort oder wasser brauchen můst Brücken zuschlagen vnd dergleichen / so kan mann darbei ein Wagenburg schlagen groß oder klein / wie die notturfft vnd gelegenheit das erfordern wirt.
  cs: |-
    Za šesté lze vždy uspořádat přiměřenou vozovou hradbu {Wagenburg}, táhne-li se pro píci {Fütterung} a je-li nutné použít brod nebo vodní cestu, stavět mosty a podobně; tu lze vozovou hradbu rozbít velikou či malou, jak si to vyžádá potřeba a okolnosti.
- typ: odstavec
  de: |-
    Zum sibenden so kan mann auch ein nacht Wacht / mit einer Wagenburg versichern / so mann sich besorgen würde / das mann möcht in die wacht fallen / vnd also kan mann allezeit ein frembde Wacht / ein nacht geordnen / der mann sich nit versicht / darmit mann also ein zug verwachen vnd verhüten kan vnd dem gegentheil etwas darmit brechen vnd wehren.
  cs: |-
    Za sedmé lze vozovou hradbou zajistit také noční stráž {Wacht}, hrozí-li, že by nepřítel mohl do stráže vpadnout. Tak lze kdykoli postavit na jednu noc zvláštní, neobvyklou stráž, s níž nepřítel nepočítá, a tím ohlídat a ochránit tažení {zug} a protivníkovi něco zmařit a překazit.
- typ: odstavec
  de: |-
    Zum achten wann mann ziehen wirt / vnd in der Feind Landt ist / vnd inn grossen Dörffern lege / dann soll mann die Wagen hieauß vor den Dörffern lassen / vnd ein Wagenburg schliessen / vnd die darfür mit den wachten besetzen / dann mann kan wol Meutterei zurichten / wann mann inn den Dörffern ligt / daß die heimlich können angestecket werden / Wann aber dann die Dörffer mit den wagen verspert seind / so kan mann nicht außkomen / vnd kan grosser vnrat darauß entstehen / daß mann nit vor den wagen außmag / Darumb sollen die wagen hauß bleiben / geschlossen vnnd verwart werden / wie sich das einer Wagenburg gebürt.
  cs: |-
    Za osmé: když se táhne nepřátelskou zemí a leží se ve velkých vesnicích, mají se vozy nechat venku před vesnicemi, uzavřít do vozové hradby a vpředu obsadit strážemi. Když se totiž leží ve vesnicích, snadno se může zosnovat vzpoura či spiknutí {Meutterei}[^1] a vesnice mohou být tajně zapáleny. Jsou-li pak vesnice zataraseny vozy, nelze se dostat ven, a může z toho vzejít veliká pohroma, protože se přes vozy nedá vyjet. Proto mají vozy zůstat venku, uzavřené a střežené, jak se na vozovou hradbu sluší.
- typ: odstavec
  de: |-
    Zum neunden wann mann also in grossen Dörffern ligen würd / so sollen die strassen rein / ledig vnd vnuerspert gehalten werden / wann ein Dorff so groß were daß vil Volcks darinn ligen kündt / besonder Reutter / so sol mann an etlichen orten die Gärten vnd Zeun auffbrechen / vnd außwendig darfür mit wagen wider zuschliessen / vnd wachten darinn legen / damit mann in Fewers nöten mit Pferden vnnd Leuten herauß kommen möchte.
  cs: |-
    Za deváté: leží-li se takto ve velkých vesnicích, mají se ulice udržovat čisté, volné a nezatarasené. Je-li vesnice tak veliká, že v ní může ležet mnoho lidu {Volcks}, zvláště jízdy {Reutter}, mají se na několika místech prolomit zahrady a ploty, zvenčí se mají opět uzavřít vozy a do nich postavit stráže, aby se v případě požáru dalo s koňmi i lidmi vyjet ven.
- typ: odstavec
  de: |-
    Zum zehenden so kan sichs wol zutragen / daß mann etwas eilend vnd gefehrlich abziehen můß / dann kan mann sich allwegen inn ein Wagenburg in einen vortheil legen / daß mann sich nicht also alle nacht verschantzen kan im ziehen / als wann mann still lege.
  cs: |-
    Za desáté: může se také přihodit, že je nutno poněkud kvapně a nebezpečně ustupovat. Pak se lze vždy uložit ve vozové hradbě na výhodném místě, neboť na pochodu se nelze každou noc opevnit šancemi {verschantzen} tak jako při stání na místě.
- typ: odstavec
  de: |-
    Zum eilfften kan sichs wol zutragen / wann mann etwan schlagen odder einen harten Scharmützel thůn / vnnd ordnen daß mann das Geschütz von etlichen stücken auff ein seiten stellen würde / die also ein seiten einnemen künden / vnd neben den hauffen vor dem angrieff erreitten / Dieselbigen stück kündt mann auch wol mit einer kleinen summa wagen verziehen vnd bedecken / daß sie nicht etwan durch ein Geschwader vberrent möchten werden / sonder frei stehen vnnd schiessen künden / vnnd solche wagenburg soll auch mit Rorschützen
  cs: |-
    Za jedenácté: snadno se může přihodit, že se má svést bitva nebo tvrdá šarvátka {Scharmützel} a nařídí se postavit děla {Geschütz} o několika kusech {stücken} na jedno křídlo, aby tak mohla zaujmout bok a vyjet vedle houfů {hauffen} před útokem. Takové kusy lze rovněž obehnat a krýt malým počtem vozů, aby je nemohla najet nějaká švadrona {Geschwader} a mohly stát volně a střílet. A taková vozová hradba má být také střelci z ručnic {Rorschützen}
poznamky:
- n: 1
  text: |-
    Výraz *Meutterei* zde vedle vzpoury označuje i tajné spiknutí a záškodné žhářství (*daß die heimlich können angestecket werden*).
