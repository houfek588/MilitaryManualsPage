list: 14 (8. kniha)
strana: verso
sken: 616
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    gantzen vorrat gehn lassen on bei sein des Obersten / wann mann aber Puluer haben můst / soll der Oberst auff einmal so vil herauß geben / das alle Letzen etlich tag mit notturfft versehen seien / alßdan ist daßselbig Puluer getheilt / vnd kan auff einmal nit aller schaden nemen / wann ein vnrat darein keme / als wann es aller bei ein ander auff einer Letzen were / Der Oberst soll auch das Puluer so in dem rechten vorrat ligt / in kleine Fäßlin thůn lassen wann es von nöten / daß es bald auff die Letzen kündt getragen werden / vnd nit erst lang in dem Hauffen oder vorrat vmbgehn.
  cs: |-
    celé zásoby bez přítomnosti plukovníka {Obersten}. Když je však prachu {Puluer} třeba, má plukovník vydat najednou tolik, aby byla všechna stanoviště {Letzen} na několik dní zaopatřena podle potřeby. Pak je ten prach rozdělen, a kdyby se s ním stalo neštěstí, nemůže být zničen všechen najednou, jako kdyby byl všechen pohromadě na jednom stanovišti. Plukovník má také dát prach, který leží v hlavní zásobě, nasypat do malých soudků, aby se v případě potřeby dal rychle donést na stanoviště a nemuselo se teprve dlouho přehrabovat v hromadě či zásobě.
- typ: odstavec
  de: |-
    Ende des achten Bůchs.
  cs: |-
    Konec osmé knihy.
