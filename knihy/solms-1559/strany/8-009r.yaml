bloky:
- typ: odstavec
  de: |-
    Die Regierung des Kriegßuolcks sol erstlich nach jrem Artickels Brieff wie von alters bleiben / vnd ein besonder Bund vorm eingang vnd verflichtung geschehen / ein Besatzung soll weitter dann ein ander Kriegßordnung versehen vnd verbunden werden / vnd sind diß die Artickel so in ein Besatzung gehören.
  cs: |-
    Správa válečného lidu {Kriegßuolcks} má předně zůstat podle jeho artikulního listu {Artickels Brieff}, jak je to od starodávna; před nástupem a zavázáním se však má uzavřít zvláštní úmluva. Posádka {Besatzung} totiž musí být opatřena a zavázána dále než jiný válečný řád {Kriegßordnung}. Toto jsou články, které k posádce patří.
- typ: odstavec
  de: |-
    Wann einem Obersten ein Besatzung vbergeben vnnd zůgestalt wirt / soll er sein Kriegßuolck so er hat zusamen berüffen / vnnd sagen / Lieben Brüder vnd Gesellen / N. vnser Herr hat mir dise Befestung in gůtem vertrawen zugestalt / vnd dieselbig zuuerwarn vnd zubehalten befolhen mit solcher pflicht wie jr hören wert.
  cs: 'Když se plukovníkovi {Obersten} posádka odevzdá a svěří, má svolat válečný lid, který má, a říci: „Milí bratři a druhové {Gesellen}, N., náš pán, mi v dobré důvěře svěřil tuto pevnost {Befestung} a přikázal mi ji opatrovat a udržet, a to s takovým závazkem, jak uslyšíte.'
- typ: odstavec
  de: |-
    Erstlich stelt er mir die Befestung zů / daß ich sie in mein verwarung nemen / vnd mit allem wie sichs gebüret mir laß beuolhen sein / gleich wie Christus sein liebe Mütter seinem vertrauten Jünger am stam des Creutzes befalhe / Vnd die befastung in keins andern Herrn Händen durch gifft / forcht / lieb / gunst oder haß / nichts außgenomen wie das mag genennt werden / komen lassen / sonder darinn bleiben / vnd in meiner verwarung vnd hůt behalten / wie S. Johannes auff Christus beuelch vnd vertrawen sein liebe Mütter name / vnd bei jr blieb vnd verwart biß in todt / Also soll ich in diser Befestung auff beuelch meins Herrn bleiben / mich beschiessen vnd störmen lassen / vnd was mir derhalben von dem Feind zusteht / alles vnangesehen / mich biß ich mit gewalt vnd mit den Harn herauß gezogen / vnd mir mein leben genomen wirt / wie einem ehrlichen Kriegßman gebürt vnd zůsteht / wehren vnd halten / Darauff hab ich solchs angenomen / vnnd meinem Herrn darüber mein handtrew geben / vnd mein Seel daruor versatzt / vnd einen leiblichen eydt zu Gott vnnd seinem heiligen wort geschworn. Dieweil ich solchs angenomen / mein seel / leib / ehr vnd gůt wie gehört / daruor versatzt / So will ich (wils Gott) demselbigen also nachsetzen so lang mein leib vnd leben wert / vnd mich inn dem mit Gottes hilff halten / wie mir mein Herr vertrawet / vnd in dem thůn wie ich verpflicht / vnd einem ehrlichen Kriegßman gebürt vnd wol ansteht.
  cs: |-
    Předně mi pevnost svěřuje, abych ji vzal do své ochrany a nechal si ji ve všem, jak se sluší, svěřenu – tak jako Kristus na kmeni kříže svěřil svou milou matku svému věrnému učedníkovi. Nemám ji dopustit do rukou žádného jiného pána, ať jedem, strachem, láskou, přízní či nenávistí, nic nevyjímaje, ať se to jmenuje jakkoli; mám v ní zůstat a uchovat ji ve své ochraně a stráži, jako svatý Jan na Kristův příkaz a z jeho důvěry přijal jeho milou matku, zůstal u ní a opatroval ji až do smrti. Tak mám i já v této pevnosti na příkaz svého pána zůstat, nechat se ostřelovat a dobývat útokem {störmen} a bez ohledu na vše, co mi z toho od nepřítele hrozí, se bránit a držet, dokud mě násilím a za vlasy nevyvlečou ven a nevezmou mi život, jak se na poctivého válečníka {Kriegßman} sluší a patří. Na to jsem tento úkol přijal, dal jsem za něj svému pánovi slib podáním ruky {handtrew}, zastavil jsem za to svou duši a přísahal jsem tělesnou přísahu {eydt} Bohu a jeho svatému slovu. Protože jsem to přijal a, jak jste slyšeli, zastavil za to svou duši, tělo, čest i statek, chci tomu (dá-li Bůh) dostát, dokud mi potrvá tělo i život, a s Boží pomocí se v tom chovat tak, jak mi můj pán důvěřuje, a činit, k čemu jsem zavázán a co poctivému válečníkovi náleží a dobře sluší.
- typ: odstavec
  de: |-
    Darrumb / dieweil ich mich dahin begeben / vnnd mir so ein hoch pfandt darauff steht / so wil mein groß notturfft erfordern / mich mit ehrlichen vnnd manlichen personen zuuersehen / die gleicher gestalt mir in solchen ehrlichen vnd sörglichen händeln beistehn / dieweil ich euch als ehrlich Kriegßleut / die vmb ehrlicher vnd ritterlicher thatten auß sind / die zu suchen vnd halten erkenne / so hab ich euch derhalben vor andern erwelt / vnd zu mir genomen / vnd bei euch zu bleiben / leben vnd
  cs: |-
    Protože jsem se k tomu zavázal a je v tom zastavena tak vysoká zástava, vyžaduje má velká potřeba, abych se opatřil poctivými a mužnými osobami, které mi stejně tak budou stát po boku v těchto čestných a nebezpečných věcech. A protože vás znám jako poctivé válečníky {Kriegßleut}, kteří vyhledávají čestné a rytířské činy a drží se jich, vyvolil jsem si vás proto před jinými a vzal k sobě, abych u vás zůstal, s vámi žil a
