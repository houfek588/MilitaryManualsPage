bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    oder zu spilen/ es sei zu vorderst/ in der mit/ oder zu hinderst/ daselbst sollen sie dann in aller handlung/ wie Kriegsleuten gebürt/ bleiben.
  cs: |-
    nebo se bít[^1], ať zcela vpředu, uprostřed, nebo zcela vzadu; tam pak mají při veškerém dění vytrvat, jak se na válečníky {Kriegsleuten} sluší.
- typ: odstavec
  de: |-
    Wann das Leger auff sein vnd verzucken will/ sollen die Hauptleut/ Quartiermeister/ Feldweibel halb/ vnd der Forierer alle sampt zum Obersten kommen/ vnd seines beuelchs warten/ darzů sollen sie/ das Leger ziehe oder lige still/ die Hauptleut abents vnd morgens vmb bescheidt/ durch sich selbst oder jr eigen Diener fragen.
  cs: |-
    Chce-li se ležení {Leger} zvednout a táhnout dál, mají se hejtmani {Hauptleut}, kvartýrmistři {Quartiermeister}, polovina polních šikovatelů {Feldweibel} a všichni furýři {Forierer} dostavit k plukovníkovi {Obersten} a čekat na jeho rozkazy. Nadto se mají hejtmani, ať ležení táhne, nebo stojí, večer i ráno sami nebo skrze své služebníky ptát na rozkazy.
- typ: odstavec
  de: |-
    Als bald das Leger geschlagen ist/ sollen die Hauptleut alle zum Obersten gehn/ vnd nach dem lermenplatz fragen/ als auch die Fendrich/ wie volgents bei jnen gemelt soll werden.
  cs: |-
    Jakmile je ležení rozbito, mají všichni hejtmani jít k plukovníkovi a zeptat se na poplachové místo {lermenplatz}, stejně jako praporečníci {Fendrich}, jak o nich bude řečeno dále.
- typ: odstavec
  de: |-
    Die Hauptleut wöllen etwan/ der Herr soll jedem einen Feldweibel halten/ das ist der Herr nicht schuldig/ auch nit not/ sonder vil vergebens kostens geht einem Herren darauff.
  cs: |-
    Hejtmani někdy chtějí, aby jim pán vydržoval každému jednoho polního šikovatele. K tomu pán není povinen a není to ani nutné; pán by tím jen zbytečně vydal mnoho peněz.
- typ: odstavec
  de: |-
    Aber der Herr oder oberst Feldhauptman soll jren Obersten souil/ als er vermeint nach dem vil Knecht notturfftig sein/ annemen lassen.
  cs: |-
    Avšak pán nebo nejvyšší polní hejtman {oberst Feldhauptman} má jejich plukovníkovi dovolit přijmout tolik [polních šikovatelů], kolik jich podle počtu knechtů {Knecht} uzná za potřebné.
poznamky:
- n: 1
  text: |-
    „Oder zu spilen“ – dobově „hrát [válečnou hru]“, tj. utkávat se v boji.
