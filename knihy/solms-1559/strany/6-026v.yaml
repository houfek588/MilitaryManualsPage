poznamky:
- n: 1
  text: |-
    Úhrn skupiny Goburt, Stöckel, Schacht a Harstal (75 zl. 9 bac. + 81 zl. 10 bac. + 84 + 126 = 367 zl. 4 bac.); koní je podle položek 9 + 7 + 9 + 15 = 40, tisk má 39.
- n: 2
  text: |-
    Zřejmě přesmyčka za 147 zl. – úhrn Hanse Harstala (126 zl. za koně a 21 zl. za 1¼ vozu). Následující úhrn 347 zl. 10 bac. zahrnuje oněch 21 zl. za vůz a tři další skupiny (100 zl. 12 bac. + 107 zl. 12 bac. + 118 zl. 1 bac.).
