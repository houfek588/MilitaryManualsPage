poznamky:
- n: 1
  text: Rotenhausen – snad francký rod von Rotenhan; jejich podíl se započítal, přestože se k přehlídce nedostavili. Součty položek 9–12 (41 koní) i celkových 152 koní tuto rotu zahrnují.
