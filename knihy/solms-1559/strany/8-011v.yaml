  popis: 'Celostránkový dřevořez s obrannými prostředky posádky, očíslovanými 20–25 (čísla jsou vytištěna obráceně či na bok); výklad k nim podává text na [[8-012r|následujících stranách]]. 20 – křížový ježek {Creutzhaspel} neboli kolový trám: hranatý trám, jímž jsou střídavě křížem prostrčeny dlouhé zahrocené kolíky, takže trčí na obě strany. 21 – vlněný pytel {Wolnsack}: kvádrovitý vak vycpaný vlnou, senem či slámou, hustě převázaný provazy do mřížky, zavěšuje se před zeď proti dělostřelbě. 22 – vápenný soudek {Ton}: řez soudkem, v jehož středu je zapuštěn hliněný hrnec s prachem a do něj vede železná trubka se zápalnou složí. 23 – smolný věnec {Bechring}: kruh ze dvou spletených, smolou napuštěných pytlíků. 24 – pálená hliněná koule s dlouhým hrdlem, uchy pro šňůru a zápalnou trubicí uvnitř. 25 – tři soudky postavené svými trubkami do otvorů v prkenném víku žlabu {Kendel}, jímž běží oheň od jednoho soudku k druhému.'
