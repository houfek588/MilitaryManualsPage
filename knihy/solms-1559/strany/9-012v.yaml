id: 9-012v
list: 12 (9. kniha)
strana: verso
sken: 644
stav: prelozeno
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    hab / das Bůch so Arbor melicie genant wirdt / dann es ein Bůch ist darauß er alle billicheit in Gerichts handlungen erleren kan / dann wann er dem Bůch nachgeht / mag keiner nicht darwider sein / vnnd er sein gewissen nicht dardurch beschwert.
  cs: |-
    knihu, která se nazývá Arbor melicie,[^1] neboť je to kniha, z níž se může naučit veškeré spravedlnosti v soudních věcech {Gerichts handlungen}. Řídí-li se touto knihou, nemůže nikdo nic namítat a on si tím nezatíží svědomí.
- typ: odstavec
  de: |-
    Souil den Prouosen berüret soll er vil Steckenknecht haben / die jn geleiden / damit er das jenig so jhm beuolhen außrichten möge / so ferr aber er vergewaltiget wolt werden / solt jhr jm mit gantzer macht beistehn vnd gentzlich nicht leiden daß er geschwecht werde / auch so jm ein schmach zu gefüget / nicht anders achten dann als obs euch beschehen were / es soll auch der Prouos die Prouiantwagen wann sie jm leger ankommen ordnen / vnd jnen auff dem Marck platz geben wie obstehet.
  cs: |-
    Pokud jde o profouse {Prouosen}, má mít mnoho profousových pacholků {Steckenknecht}, kteří ho doprovázejí, aby mohl vykonat, co je mu uloženo. Kdyby však na něho někdo chtěl vztáhnout ruku, máte mu vší mocí pomoci a nijak nestrpět, aby byla jeho moc oslabena. Bude-li mu způsobena potupa, máte ji pokládat za nic jiného, než jako by se stala vám samým. Profous má také proviantní vozy {Prouiantwagen}, když přijedou do ležení, uspořádat a vykázat jim místo na tržišti {Marck platz}, jak stojí výše.
- typ: odstavec
  de: |-
    Auch soll der Prouos alle Kauffleut inn den nechsten Stätten auch die jenigen so Prouiant zu füren / lernen kennen / damit er vor gerüst sei Prouiant zu bekommen / daß das Heer nicht hunger leide / wo her die Prouiant komme / vnnd wann darinn ein fehl sein wolt / solchs dem Marschalck bei zeit anzeigen / damit ers fürkomme / es sei durch Mandaten oder sonst / oder in den nechsten Stätten / daß er die Kauffleut zwinge Prouiant zu bringen / vnnd wann er an einem gefehrlichen ort ist / soll er jhnen Leut zugeben zu roß vnnd zu fuß / nach dem es die sach erfordert / solliches alles soll der Prouos versehen.
  cs: |-
    Profous má také poznat všechny kupce v nejbližších městech i ty, kdo vozí proviant {Prouiant}, aby byl předem připraven proviant obstarat a vojsko {Heer} netrpělo hladem, a aby věděl, odkud proviant přichází. Kdyby v tom nastal nějaký nedostatek, má to včas oznámit polnímu maršálkovi {Marschalck}, aby tomu předešel, ať mandáty {Mandaten}, nebo jinak, případně v nejbližších městech, a donutil kupce proviant přivážet. Je-li [maršálek] na nebezpečném místě, má jim dát [jako doprovod] lidi na koních i pěší, podle toho, co si věc žádá. To vše má profous obstarat.
- typ: odstavec
  de: |-
    Nachuolgends ist es von nöten / daß jhr einen gůten Büchsenmeister habt / der fleissig vnd keck sei / dann die zwei stück soll er an jm haben / daß er im Leger hin vnd wider zu seinem Geschütz gehe / vnd es in ein Ordnung stelle / wie ich euch dann nachuolgends sagen will / Vnd wann mann in das Leger kompt / vnd der Marschalck verordnet hat / wo mann das leger beschliessen soll / es der Büchsenmeister beschliessen / vnd dem Hauptman der Fußknecht beuelhen / daß er die Gräben vnd die wäll laß machen nach dem das geschütz erfordert / vnd die Falcken Schlangen vnd anders Geschütz auff dieselbigen nach gůt bedüncken des Marschalcks ordnen / vnnd sein losament zu aller nechst zu seinen Wagen machen lassen / auch gůt acht haben / daß kein vnrath in das Puluer komme / dann die Feind gern fewer in das Puluer durch verräter / böse Bůben oder Aussetzigen Weiber werffen lassen / wann es nicht wol bewart / auch die so Puluer bewären sollen keinen er sei freund oder Feind hinzu lassen / sie kennen dann wol / Es soll auch der Fußknecht Hauptman mit seinem gesind inn des Büchsenmeisters Quartir ligen / daß er gleich gerüst sei wann mann sein nottürfftig were / Jetzund hab ich erzelt was mir einfellt das einem Büchsenmeister so zu Feld ligt / zu steht.
  cs: |-
    Dále je nutné, abyste měli dobrého puškaře {Büchsenmeister}, který bude pilný a smělý. Tyto dvě vlastnosti má mít proto, aby v ležení {Leger} obcházel svá děla {Geschütz} a stavěl je do pořádku, jak vám povím dále. Když se přijde do ležení a polní maršálek určí, kde se má ležení uzavřít, má je puškař uzavřít a uložit hejtmanovi pěších knechtů {Hauptman der Fußknecht}, aby dal vykopat příkopy {Gräben} a navršit valy {wäll}, jak to děla vyžadují. Falkony a kulveriny {Falcken Schlangen} i další děla má na ně rozestavit podle uvážení polního maršálka a své ubytování {losament} si dát zřídit co nejblíže ke svým vozům. Má také dobře dbát, aby se do prachu {Puluer} nedostalo nic zlého, neboť nepřítel rád dává zrádci, zlými pacholky nebo malomocnými ženami házet do prachu oheň, není-li dobře střežen. Ti, kdo prach střeží, nemají k němu nikoho pouštět, ať přítele, nebo nepřítele, leda by ho dobře znali. Hejtman pěších knechtů má se svou čeládkou ležet v puškařově kvartýru {Quartir}, aby byl hned připraven, kdyby ho bylo třeba. Tím jsem vylíčil, co mě napadá o tom, co přísluší puškaři, který leží v poli.
poznamky:
- n: 1
  text: Tisk má „Arbor melicie“, patrně zkomolené „Arbor militiae“ – míněn je spis Honoré Boneta (Bouveta) „L'Arbre des batailles“ (asi 1387), v pozdním středověku nejrozšířenější příručka válečného práva.
