poznamky:
- n: 1
  text: |-
    Tisk uvádí „jednu libru chleba“, avšak počet 28 000 mužů odpovídá jednomu dvouliberovému chlebu denně jako v předchozím výpočtu (2100 : 30 × 400 = 28 000).
- n: 2
  text: |-
    Mechausen – pravděpodobně zkomolené dunajské přístavní místo mezi Pasovem a Lincem (snad Neuhaus an der Donau či Aschach, případně Mauthausen pod Lincem).
- n: 3
  text: |-
    Podunajské názvy v předloze: Breßburg (Prešpurk / Bratislava), Gamern (Komárno), Gran (Ostřihom / Esztergom), Blintenburg (Vyšehrad / Visegrád), Ofen (Budín).
