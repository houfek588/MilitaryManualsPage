bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    einander annemen das macht die gewalt vnd sterck / ist er aber vnrein / so verhindert die vnreinigkeit die schwindigkeit des fewers anzunemen / vnd es nimpt der gewalt jhr Krafft. Dieweil dann die vnreinigkeit im Salpeter wie obgemelt jn an seiner wirckung vnd feuchtigkeit verhindert / ist gůt zubedencken das er dem Schwefel / der die hitz vnd das feur halten soll auch widerwerdig ist / dann fewer vnd hitz können kein feuchtigkeit leiden. Der koln kan eben so wenig feuchtigkeit leiden / dann soll er / darumb er da ist / das feur behent fahen / so er denn druckner vnd reiner ist so er ehe fecht / Nů ist gůt zuerachten was die vnreinigkeit vnd feuchtigkeit des salpeters in disen dreien stücken wann die zusamen komen gůts wircken. Die erst wirckung ist / das es durch die feuchtigkeit das Puluer zusamen wechst vnd verfault. Die ander ist das es die Büchsen beschleimpt. Die drit / ist zu besorgen das der kat durch sein vnreinigkeit nicht zu rauch worden sei / sonder noch etwan in der Büchsen ligt / vnd sich verhalten hab in den ecken vnd schiffern als wol die Büchsen haben daß der wüsch nit ergreiffen mag / so mann eilent wider laden wolt / das dasselbig fewer das Puluer so man hinein stößt wider anzünt / als vil geschicht. Die vierdt so das Puluer nit gůt / vnd der Salpeter mit Schwefel vnd koln darzů vber setzt ist / soll er denn in der Büchsen etwas wircken / muß mann die vber maß hinein laden / darauß volgt das die büchs mit Puluer weit gefult ist / vnd auß sollicher vilen Puluers die Kogel weit dauorn ligt / derhalben die ein kurtzen lauff hat / vnnd das Puluer dieweil es von vnreinem zeug auch gering gesetzt / nicht vil gekernt ist / dann wanns in der Büchsen wirt hinden angezünt / so ligts auff einem hauffen zusamen getruckt wie ein kuchen / vnd kan das fewer eilent nit hindurch zu der kugeln / scheubt also das halb angegangen Puluer das ander vnangangen mit sampt der Kugeln furt / daß sie schier am ende oder hinauß / ehe denn das puluer aller gangen / vnd zu wirckung komen ist / daß solchs ein gewaltigen oder gewissen schoß brengen kündt / ist wol zu rechnen. Die fünfft ist / wan das puluer so lang mit dem hauffen sich in der Büchsen saumpt / daß sie sich erhitzen muß / daß nit gescheh wans ein röß Puluer were / das bald auß der Büchsen raumpt / damit die lufft fluckts wider hinein käm. Die sechst / so ich mit bösem Puluer / wie gemelt / schiessen muß / kan ich wuschens vnd anderer obgemelten vrsachen halben nit zwen schöß thůn / da ich sonst mit gůtem puluer drei thůn möcht. Die sibend / wan ich dann böß puluer hab / vnd im feld schiessen muß wans ein wenig regnet / vnd das puluer nit kernt ist / wirts einem vndern händen ehe ers in die Büchsen brengt zu lautterm kat das gekernt puluer nit thůt / was das fur gewisser schöß brengt / ist wol zu achten.
  cs: |-
    ohněm vzplanou, a to dává prudkost a sílu; je-li však nečistý, brání nečistota rychlému přijetí ohně a ubírá té síle její mohutnost. Poněvadž tedy nečistota v ledku {Salpeter}, jak řečeno výše, brání jeho účinku a způsobuje vlhkost, lze si snadno domyslet, že odporuje i síře, která má udržovat žár a oheň, neboť oheň a žár nesnesou žádnou vlhkost. Uhlí nesnese vlhkost právě tak málo, neboť má-li rychle chytat oheň, k čemuž tu je, čím sušší a čistší je, tím dříve vzplane. Lze tedy dobře posoudit, co dobrého způsobí nečistota a vlhkost ledku v těchto třech látkách, když se spojí dohromady. První účinek je, že se prach {Puluer} vlhkostí speče dohromady a zkazí se. Druhý je, že zanáší děla {Büchsen}. Třetí: je třeba se obávat, že se spálený zbytek[^1] kvůli své nečistotě neproměnil v dým, nýbrž zůstal někde v děle ležet a udržel se v koutech a trhlinkách,[^2] jaké děla mívají, kam vytěrák {wüsch} nemůže dosáhnout, takže kdyby se chtělo spěšně znovu nabít, tento žhavý zbytek znovu zapálí prach, který se dovnitř vkládá, jak se často stává. Čtvrtý: není-li prach dobrý a ledek je k tomu ještě smíchán se sírou a uhlím, musí se ho do děla nabít nad míru, má-li v něm vůbec něco zmoci. Z toho plyne, že dělo je prachem zaplněno daleko dopředu a koule {Kogel} při takovém množství prachu leží daleko vpředu, takže má krátký rozběh. A protože je prach ze špatné hmoty, slabě složen a málo zrněn, leží po zapálení vzadu v děle na hromadě, stlačený jako koláč, a oheň jím nemůže rychle proniknout ke kouli. Napůl chycený prach tak tlačí zbylý nezapálený prach i s koulí kupředu, takže koule je téměř u ústí nebo už venku dříve, než všechen prach vyhoří a začne působit. Že by to mohlo přinést prudkou nebo přesnou ránu, si lze snadno spočítat. Pátý je, že když se prach v takové hromadě v děle dlouho zdrží, musí se dělo rozpálit, což by se nestalo, kdyby to byl sypký prach, který dělo rychle vyklidí, aby do něj rázem opět vnikl vzduch. Šestý: musím-li střílet se špatným prachem, jak řečeno, nemohu kvůli vytírání a ostatním zmíněným příčinám vypálit ani dvě rány za dobu, kdy bych jinak s dobrým prachem vypálil tři. Sedmý: mám-li špatný prach a musím střílet v poli, když trochu prší a prach není zrněn, promění se člověku pod rukama v samou břečku dříve, než jej vpraví do děla – což zrněný prach nedělá; jak přesné rány to přináší, lze si snadno domyslet.
poznamky:
- n: 1
  text: |-
    Něm. *kat* (*Kot*) – nečistá usazenina (povlaky a žhavé zbytky po výstřelu, níže též mokrá prachová kaše).
- n: 2
  text: |-
    Něm. *schiffern* (*Schiefern*) – šupinky, odštěpky a praskliny v dutině lité hlavně.
