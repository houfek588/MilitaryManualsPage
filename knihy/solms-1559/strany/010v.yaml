strana: verso
sken: 112
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    zu blasen oder schlagen/ vnd halten bleiben/ vnnd so die Wacht das sehen oder hören würd/ soll einer oder zwen von der Wacht eillents zu jm reitten oder gehn/ jne also still halten lassen/ vnd bei jm bleiben vnd verhůten/ daß niemands/ er sei wer er wöl/ zu jm kome/ vnd mit jm rede/ vnd es soll das einer von der Wacht eillents dem Obersten anzeigen.
  cs: |-
    zatroubit nebo zabubnovat a zůstat stát. Jakmile to stráž {Wacht} spatří nebo uslyší, má k němu jeden nebo dva ze stráže rychle dojet či dojít, nechat ho tak v klidu stát, zůstat u něho a dbát, aby k němu nikdo, ať je to kdokoli, nepřistoupil a nemluvil s ním. Jeden ze stráže to má ihned oznámit plukovníkovi {Obersten}.
- typ: odstavec
  de: |-
    Alßdann soll der Oberst denselben durch seine Leut/ mit verbundenen augen in das Leger zu jm fürn/ aber doch nit in sein Losament/ sonder inn ein anders etwas daruon/ damit er des Obersten Losament nicht wissens habe/ vnnd anzeygen mög wo das sei/ so soll der Oberst denselbigen also an einem ort daß er nicht weitter komme/ verwaren/ auch niemands dann wer dazů verordenet ist/ zu jm/ noch mit jm reden lassen/ vnnd so der Oberst jn dann abgefertigt hett/ darumb er da gewesen ist/ so soll er denselbigen Trummeter oder Trummenschlager durch sein leut/ widerumb verwart wie vor/ durchs Leger hinauß fůren lassen.
  cs: |-
    Plukovník ho pak má dát svými lidmi přivést se zavázanýma očima do ležení {Leger} k sobě, avšak ne do svého ubytování {Losament}, nýbrž do jiného, kus od něho, aby o plukovníkově ubytování nevěděl a nemohl prozradit, kde je. Tam ho má plukovník držet na jednom místě, aby se nedostal dál, a nikoho kromě těch, kdo jsou k tomu určeni, k němu nepouštět ani ho s ním nenechat mluvit. Když plukovník vyřídí to, kvůli čemu přišel, má toho trubače {Trummeter} nebo bubeníka {Trummenschlager} dát svými lidmi opět pod stejným dozorem jako předtím vyvést ležením ven.
- typ: odstavec
  de: |-
    Es soll der Oberst hoch oder hart verbieten/ daß niemands/ er sei Teutsch oder Welschs/ ein Losament oder leger in eim Dorff/ Hoffe/ oder Kirche vor dem leger ausserhalb der wacht/ haben oder liegen soll/ sonder alle nacht jm leger bleiben/ Dann solt mann gestatten/ oder zulassen/ daß das Kriegsuolck vor dem leger vnd vor der wacht/ jre Losamenter haben solten/ ist wol zu erachten/ was für Rotterei vnd nachtheil im Leger zu zurichten vnd zuentstehn weren/ darumb soll mann solchs auff das höchst vnd fleissigst verhůten.
  cs: |-
    Plukovník má také přísně a ostře zakázat, aby kdokoli, ať Němec, nebo Vlach {Welschs}, měl ubytování či nocležiště nebo nocoval ve vsi, ve dvoře nebo v kostele před ležením, mimo stráž; každý má zůstávat na noc v ležení. Kdyby se totiž dovolilo či trpělo, aby válečný lid {Kriegsuolck} měl svá ubytování před ležením a před stráží, lze si snadno domyslet, jaké srocování a jaká škoda by mohly v ležení vzniknout. Proto je třeba tomu co nejpřísněji a nejpečlivěji bránit.
- typ: odstavec
  de: |-
    Mann soll auch so bald die Wacht auffgezogen ist/ keinen Schuß mit keiner Büchsen im leger mehr thůn/ es sei im leger oder auff dem lermen platz ausserhalb beuelch der obersten/ Aber in schantzen/ da hat es sein weg. Vns bedünckt auch das gůt sein solt/ das ein verstendiger vom Adell/ daß derselbig alles was zum feldgeschütz gehört/ mit sampt den Büchsenmeistern/ vnd wagen/ Rossen/ vnder seinem gewalt haben solt/ Doch nicht desto weniger/ so solt er bei der Artholerei bei dem Zeugmeister sein wonung haben. Dann es tregt sich offt vnd vil zů daß ein lermen wirt/ daß mann etwan mit Kriegsuolck hinweg zeucht/ daß niemand weyß wo Roß oder anders ist/ aber solliche Person/ so er die verwaltung also hett/ kündte er (wie eillents es sich zutrüge) seine Leut vnnd Pferdt finden/ Es würde auch jm feld richtig sein/ daß er das Geschütz vnder die hauffen der Knecht/ oder wo mann sie bedürffen würde/ zuordenen wüste.
  cs: |-
    Jakmile stráž nastoupí, nemá se v ležení už vystřelit z žádné palné zbraně, ať v ležení, nebo na poplachovém prostranství {lermen platz}, leda na rozkaz plukovníků; v šancích {schantzen} je to ovšem jiná věc. Zdá se nám také dobré, aby nějaký rozumný muž ze šlechty měl pod svou pravomocí vše, co patří k polním dělům {feldgeschütz}, spolu s puškaři {Büchsenmeistern}, vozy a koňmi. Bydlet má nicméně u dělostřelectva {Artholerei} při zbrojmistrovi {Zeugmeister}. Často se totiž stává, že nastane poplach a s válečným lidem se kamsi vytáhne, takže nikdo neví, kde jsou koně a jiné věci. Taková osoba, kdyby měla správu v rukou, by však dokázala (ať by k tomu došlo jakkoli narychlo) své lidi i koně najít. I v poli by bylo v pořádku, že by věděla, jak děla {Geschütz} rozmístit mezi houfy knechtů {Knecht} nebo tam, kde by jich bylo třeba.
- typ: odstavec
  de: Wir sehen auch inn vil weg für gůt an/ daß der Kriegsherr allen
  cs: |-
    Z mnoha důvodů pokládáme také za dobré, aby válečný pán {Kriegsherr} každý
