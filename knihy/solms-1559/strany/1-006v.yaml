- typ: odstavec
  pokracovani: true
  de: |-
    gewapnet sessen/ vnd bei jhren Hern vnd Junckern hielten/ vnd mit darein setzten/ ob die schon nit sehr gemalt weren/ lege nit daran/ sonder gůte feust hetten/ das ziert ein Feld vnd bekömpt wol/ es ist auch manlich vnd tröstlich/ aber auff der gassen sicht es schön/ wann einer hat vil diener Lackeien vnd des volcks/ vnd so mann außreittet/ hat er etwan zwei Pferdt/ vnd wie die gerüst seind das sicht mann wol/ die andern lauffen zu fuß/ das ist bei vns alten Teutschen nit gewesen/ sonder sie haben jhre sach vnd vnkosten auff gůte Pferdt/ Knecht vnd Rüstung gelegt/ vnd die gůt gehabt/ vnd allezeit in Rüstung geritten/ sich vnd das gesind im gebrauch gehalten vnnd geübt/ es hab einer vil Pferdt oder wenig gehabt/ so ist er allezeit in Rüstung vnd in gewehr geritten/ vnd im Feld sich fürsichtig gehalten/ da solches noch also im gebrauch gewesen ist/ da hat mann gůte Knecht gezogen vnd gehabt/ Aber es ist nun mehr alles auff die weiten Settel/ Klepper vnd Watsecke/ mit zufüren geraten/ aber zu den zeiten/ da mann also ist allezeit in Rüstung geritten/ haben die Buben Roßkeme raumeisen/ an jhren gürteln hangen/ vnd jhre Reuter röcke angehabt vnd hinter jhren Hern vnd Junckern darmit hergangen/ vnd sich wie Kriegßleut vnd Reuter gestelt/ da hat es gar wol gestanden vnd gangen/ aber jetzund so mussen die buben hinter jhren Hern vnnd Junckern hergehen/ tragen ein par Panttoffel/ Kerbörsten vnd ein Sammeten kössen/ welches wie mich bedünckt/ nit manlich Krigisch stehet sonder weibisch/ vnd besonder von dem geringen Volck/ aber mit den grossen Hern die mit Keisern vnd König vmb gehn mussen/ das hat sein weg/ doch so were gůt das mann einer jeden zeit jhre gerechtigkeit thet/ vnd das nöttigst als das Hauptstück der Rüstung beuor hielte/ vnd durch die hoffart vnd geschmuck nit abgehen liese/ sonder im wesen vnnd gebrauch erhielte/ dann der sammet/ seiden vnd das gulden geschmeidig das gehört nit in das Feld zu dem ernst sonder gen hoff zu dem tantz.
  cs: |-
    seděli ve zbroji, drželi se svých pánů a zemanů[^1] a spolu s nimi udeřili; i kdyby nebyli nijak vyparádění, nezáleželo by na tom, jen kdyby měli dobré pěsti – to zdobí pole a dobře se osvědčí, a je to i mužné a povzbudivé. Zato na ulici vypadá pěkně, když má někdo mnoho sluhů, lokajů a takového lidu; a když vyjede do pole, má sotva dva koně – a jak jsou vystrojeni, to je dobře vidět –, ostatní běží pěšky. Tak tomu u nás starých Němců nebývalo, nýbrž ukládali své jmění a náklady do dobrých koní, knechtů {Knecht} a výzbroje {Rüstung}, drželi je v dobrém stavu, jezdili vždy ve zbroji a sebe i čeleď udržovali v cviku a praxi; ať měl kdo koní mnoho nebo málo, vždy jel ve zbroji a se zbraní a v poli si počínal obezřetně. Dokud to ještě bývalo v takovém užívání, tehdy se vychovávali a mívali dobří knechti. Nyní však vše došlo k širokým sedlům, klusákům a sedlovým vakům, jež se vozí s sebou. V dobách, kdy se takto vždy jezdilo ve zbroji, nosívali pacholci {Buben} hřebílka a škrabáky na kopyta[^2] zavěšené u svých opasků, měli oblečené jezdecké kabátce, kráčeli takto za svými pány a zemany a chovali se jako válečníci {Kriegßleut} a jezdci {Reuter}; tehdy to vypadalo a dařilo se velmi dobře. Avšak nyní musejí pacholci kráčet za svými pány a zemany a nosí pár pantoflů, kartáč na šaty a sametový polštářek – což, jak se mi zdá, nevypadá mužně ani válečnicky, nýbrž zženštile, a zvláště u prostšího lidu. Jinak je tomu u velkých pánů, kteří se musejí stýkat s císaři a králi, to má své oprávnění; přesto však by bylo dobré zachovávat každé době to, co jí náleží, a to nejpotřebnější, totiž hlavní součást výzbroje, držet na prvním místě a nenechat je zajít pýchou a okázalostí, nýbrž udržovat je v platnosti a užívání – neboť samet, hedvábí a zlaté šperky nepatří do pole k vážnému boji, nýbrž ke dvoru na tanec.
- typ: odstavec
  de: |-
    Darumb wölle Gott das wir Teutschen/ als das Reich hinter vns gedechten/ vnd blieben bei vnserm alten gebrauch vnd Ordnung manliche vnd gemein nützlich Regirung vnd werck fürnemen/ vbeten vnd hielten/ wie vnsere voraltern gethan haben/ vnd liessen andern Landen vnd Nationen jhre zier vnnd hoffart/ da doch kein gedeien bei ist/ Gott in dem Himel mißfallen hat/ vnnd die hoffart von anfang seiner schepffung gehasset vnd gestürtzt hat/ vnd noch nit zu glück komen lest.
  cs: |-
    Proto kéž dá Bůh, abychom my Němci jakožto Říše za sebou rozjímali a zůstali při svém starém zvyku a řádu, předsevzali si, pěstovali a zachovávali mužnou a obecně prospěšnou správu a díla, jak činili naši předkové, a jiným zemím a národům ponechali jejich ozdobnost a pýchu, při níž přece není žádného požehnání; Bohu na nebi se hnusí a pýchu od počátku svého stvoření nenáviděl a srážel a ani dnes jí nedá dospět ke štěstí.
- typ: odstavec
  de: |-
    Das ich aber solches also hart anfechte/ das wil ich keiner Nation noch niemants zu nachtheil thůn/ dann allein dem Teutschlandt zu
  cs: |-
    Že však proti tomu tak ostře brojím, nechci tím učinit újmu žádnému národu ani nikomu jinému, nýbrž pouze k
poznamky:
- n: 1
  text: |-
    *Junckern* (*Junker*) označuje mladé šlechtice a nižší šlechtu (zemany), pod nimiž sloužili pacholci a jízdní knechti.
- n: 2
  text: |-
    Tisk staví bez spojky vedle sebe *Roßkeme raumeisen* – hřebílka (*Roßkämme*) a škrabáky či kopytní nože (*Räumeisen*) na čištění koňských kopyt; v protikladu k tomu uvádí zhýčkanou výbavu: pantofle (*Panttoffel*), kartáč na šaty (*Kerbörsten*) a sametový polštářek (*Sammeten kössen*).
