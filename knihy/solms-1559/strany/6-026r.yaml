poznamky:
- n: 1
  text: |-
    V přehlídkovém rejstříku na [[6-021r|s. 6-021r]] *Wentzel von Grun*, podobně *Johann von Bruch* (zde *Brudt*), *Reinhart Gaburt* (zde *Goburt*) a *Jeronimus Stackel* (zde *Stöckel*).
- n: 2
  text: |-
    Zjevná tisková chyba: 44 zl. 12 bac. + 7 zl. 12 bac. = 52 zl. 9 bac. Úhrn strany 389 zl. 7 bac. odpovídá zhruba součtu s touto správnou částkou (201 zl. 9 bac. + 93 zl. 9 bac. + 52 zl. 9 bac. + 42 zl. = 389 zl. 12 bac.).
