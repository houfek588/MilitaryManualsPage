bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    damit sie zu fuß als bald oder ehe jrer anrennen vffenthalten mögen. Jr solt auch mercken wann es in einem festen Landt ist / müssen warlich die Fußknecht das best thůn / dann die Reutter euch gar nichts oder doch wenig behülfflich sein künden / es sei dann wann die Feind geschlagen / mit nachjagen / aber nach dem denn das Landt ist / darnach must jr euch mit Kriegßuolck schicken / darmit will ich nichts mehr daruon sagen. Wann es aber in eim weiten landt vnd ebenem Veld ist / da jr in einer ordnung nach ewerm wolgefallen ziehen kündt / alßdan must jr handeln nach dem die Feinde starck seind / vnd in einer ordnung ziehen. Erstlich wann jr gewißlich sicht vnd wist daß jr euch schlagen must / solt jr euch tapffer gegen ewerm hauffen stellen / sie ermanen vnd bitten / daß sie auff die stundt die ehr betrachten wöllen / sich mit dem schlagen tapffer halten / damit sie ehr vnd kein schand dardurch erlangen / Solt auch jnen sagen / daß jr gewißlich wist wann sie sich anderst redlich halten wöllen / euch Gott den sig verleihen werde / auch jnen anzeigen daß jr ein gůt billich vrsach des Kriegs habt / deßhalben sie sich nichts förchten / sonder gewißlich achten Gott werde bei jnen sein / vnd sie ermanen daß sie auff den tag handeln wie jr im sinn habt / so werd es jnen wol ergehn / Nach dem solt jr voran ziehen / sie den weg weisen / die Schlachtordnung machen / wann ewer wenig / vnd die feind stercker dann jr seind / solt jr nit vnderlassen zuschlagen / wann jr sehet daß ewer volck gehertz ist / wann yr aber das widerspil befindt / ists on zweifel ein böß zeichen / dann solt jr euch wol bedencken / wann yr es anders mit ehrn vnd on schaden thůn kündt / daß yr auff denselbigen tag nit schlagt / wers wol gethan / wann yr aber also vberfallen seind daß yr schlagen must / so stelt euch vil manhaffter dann yr im hertzen habt / wann euch aber solchs alles nichts hilfft / vnd doch ein gůt hoffnung zů Gott vnd ewer gerechte vrsach des Kriegs habt / vnd nit zweifeln das euch Gott den sig verziehe / vnd ziecht so mit trutzigem gemůt in die ordnung / daß yr die andern auch desto hertzhafftiger macht / vnd euch fürnemen daß besser sei ehrlich sterben dann vnehrlich leben / vnd setzt alles in die hand Gottes / Wann yr nun alles das euch möglich volbracht habt / so beuelcht euch Got dem Almechtigen / vnd hawet mit den Feinden drein / so wirts euch nimmer vbel gehn.
  cs: |-
    aby pěší mohli jejich nájezd zadržet stejně rychle nebo ještě dřív. Máte si také povšimnout, že v pevném [nerovném] kraji musí nejvíce vykonat pěší knechti {Fußknecht}, neboť jezdci {Reutter} vám tam nemohou být k ničemu, nebo jen málo, leda při pronásledování, když je nepřítel poražen. Podle toho, jaký kraj je, se musíte zařídit s válečným lidem {Kriegßuolck}; víc o tom říkat nechci. Je-li to však v otevřeném kraji a na rovném poli, kde můžete táhnout v šiku {ordnung} podle své libosti, musíte jednat podle toho, jak silný je nepřítel, a táhnout v šiku. Nejprve, když jistě vidíte a víte, že se musíte bít, máte se před svým vojskem {hauffen} postavit statečně, napomenout je a prosit, aby v tu hodinu pamatovali na čest a v boji se drželi statečně, aby tím získali čest, a ne hanbu. Máte jim také říci, že jistě víte, že budou-li se jen držet poctivě, Bůh vám dá vítězství, a ukázat jim, že máte k válce dobrou a spravedlivou příčinu, a proto ať se ničeho nebojí, nýbrž ať jsou jisti, že Bůh bude s nimi. Napomeňte je, aby toho dne jednali tak, jak máte v úmyslu, a dobře se jim povede. Potom máte jít v čele, ukázat jim cestu a postavit šik {Schlachtordnung}. Je-li vás málo a nepřítel je silnější než vy, nemáte bitvu odkládat, vidíte-li, že váš lid má odvahu. Shledáte-li však opak, je to bezpochyby zlé znamení. Pak se máte dobře rozmyslet; můžete-li to udělat se ctí a bez škody, udělali byste dobře, kdybyste se toho dne nebili. Jste-li však přepadeni tak, že se bít musíte, stavte se mnohem mužněji, než je vám u srdce. Nepomůže-li vám nic z toho, a přesto máte dobrou naději v Boha a spravedlivou příčinu války, nepochybujte, že vám Bůh dá vítězství,[^1] a vstupte do šiku s tak vzdorným duchem, abyste i ostatním dodali odvahy. Umiňte si, že je lepší čestně zemřít než nečestně žít, a vše vložte do rukou Božích. Když jste vykonali vše, co je ve vašich silách, poručte se Bohu Všemohoucímu a vražte s nepřítelem do sebe; tak se vám nikdy nepovede zle.
- typ: odstavec
  de: |-
    Wann yr wenig Volck habt / solt yr ewer Geschütz für die ordnung in stellen / vnd etlich Fußknecht verordnen die vor dem Geschütz gehn / vnd jnen den weg zeigen / damit das Geschütz nit in ein vnordnung komme / sonder eins als bald gehe als das ander / solliches steht dem Büchsenmeister zů zuuerordnen.
  cs: |-
    Máte-li málo lidu, máte svá děla {Geschütz} postavit před šik a určit několik pěších knechtů, kteří půjdou před děly a budou jim ukazovat cestu, aby děla nepřišla do nepořádku, nýbrž jedno šlo stejně rychle jako druhé. To přísluší zařídit puškaři {Büchsenmeister}.
- typ: odstavec
  de: |-
    Erstlich solt yr ewer Fußknecht in die Ordnung stellen / nemlich
  cs: |-
    Nejprve máte své pěší knechty postavit do šiku, totiž
poznamky:
- n: 1
  text: Tisk má „das euch Gott den sig verziehe“; podle smyslu zřejmě místo „verleihe“ (udělí), srov. totéž rčení výše v odstavci.
