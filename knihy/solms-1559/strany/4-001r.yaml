list: 1 (4. kniha)
strana: recto
sken: 389
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    ZVm zwölfften ein Falkon die soll schwer sein vnd wigen 15. centner/ vnd jrer kugeln 40. lang sein/ vnd an kugelschwer schiessen 2. pfundt eisen/ solches klein geschütz gehört auch bei die Knecht neben vnd für die hauffen zufellen vnd zufüren wann es zu einem schlagen kömpt/ das vor der knecht dreffen geschossen werde/ besonder wann Reisigen mit den Knechten dreffen sollen.
  cs: |-
    Za dvanácté:[^1] falkona {Falkon}, ta má být těžká a vážit 15 centů {centner}, být dlouhá 40 průměrů svých koulí {kugeln} a hmotností koule střílet 2 libry {pfundt} železa. Takovéto malé dělostřelectvo {geschütz} náleží též ke knechtům {Knecht}, aby bylo rozestavováno[^2] a vedeno vedle šiků {hauffen} a před nimi, když dojde ke srážce, tak aby se vystřelilo před střetem knechtů, zvláště mají-li se jízdní {Reisigen} utkat s knechty.
- typ: odstavec
  de: |-
    ZVm dreizehenden ein klein Feltschlenglein das mann ein Falconetlein nent/ das soll schwer sein vnd wigen 6. centner/ vnd jre kugeln 44. lang/ sol jrer kugeln an eisen 1. pfundt schwer sein/ solche stück braucht mann vnder die knecht zu stecken vnd wan sie gleich dreffen sollen/ daß sich die knecht vorn auff thůn/ vñ in die ander Ordnung gehen lassen/ vnd so bald mit dreffen.
  cs: |-
    Za třinácté: malá polní kulverinka {Feltschlenglein}, jež se nazývá falkonet {Falconetlein}; ta má být těžká a vážit 6 centů {centner} a být dlouhá 44 průměrů svých koulí {kugeln}, přičemž její železná koule má vážit 1 libru {pfundt}. Takovéto kusy se používají k zařazení mezi knechty {knecht}, a když se již mají srazit, aby se přední řady knechtů rozestoupily, vypálily v druhý šik {Ordnung} nepřítele a vzápětí s ním svedly boj.
poznamky:
- n: 1
  text: |-
    V mnichovském výtisku chybějí složky `A`–`B` s prvními jedenácti druhy děl (položky 1–11); text zde bezprostředně začíná dvanáctou položkou (složka `C`).
- n: 2
  text: |-
    V tisku *zufellen* (pravděpodobně sazečská záměna *f/ſt* za *zustellen*, tj. „postavit, rozestavit“, či významově „přirazit“).
