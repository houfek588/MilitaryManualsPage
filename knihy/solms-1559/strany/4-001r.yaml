id: 4-001r
list: 1 (4. kniha)
strana: recto
sken: 389
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    ZVm zwölfften ein Falkon die soll schwer sein vnd wigen 15. centner/ vnd jrer kugeln 40. lang sein/ vnd an kugelschwer schiessen 2. pfundt eisen/ solches klein geschütz gehört auch bei die Knecht neben vnd für die hauffen zufellen vnd zufüren wann es zu einem schlagen kömpt/ das vor der knecht dreffen geschossen werde/ besonder wann Reisigen mit den Knechten dreffen sollen.
  cs: |-
    Za dvanácté:[^1] falkona {Falkon}, která má vážit 15 centů {centner}, být dlouhá 40 průměrů svých koulí {kugeln} a střílet železnou kouli o váze 2 liber {pfundt}. Taková malá děla {geschütz} patří také ke knechtům {Knecht}: když dojde k bitvě, rozestavují se[^2] a vezou vedle šiků {hauffen} a před nimi, aby se vystřelilo dřív, než se knechti srazí – zvláště má-li se jízda {Reisigen} střetnout s knechty.
- typ: odstavec
  de: |-
    ZVm dreizehenden ein klein Feltschlenglein das mann ein Falconetlein nent/ das soll schwer sein vnd wigen 6. centner/ vnd jre kugeln 44. lang/ sol jrer kugeln an eisen 1. pfundt schwer sein/ solche stück braucht mann vnder die knecht zu stecken vnd wan sie gleich dreffen sollen/ daß sich die knecht vorn auff thůn/ vnd in die ander Ordnung gehen lassen/ vnd so bald mit dreffen.
  cs: |-
    Za třinácté: malá polní kulverinka {Feltschlenglein}, které se říká falkonet {Falconetlein}; má vážit 6 centů, být dlouhá 44 průměrů svých koulí a její železná koule má vážit 1 libru. Takové kusy se rozmísťují mezi knechty, a když se již mají střetnout, knechti se vpředu rozestoupí, nechají [kusy] vypálit do druhého [tj. nepřátelského] šiku {Ordnung} a hned nato se s ním střetnou.
poznamky:
- n: 1
  text: |-
    V mnichovském výtisku chybějí složky `A`–`B` s prvními jedenácti druhy děl (položky 1–11); text zde bezprostředně začíná dvanáctou položkou (složka `C`).
- n: 2
  text: |-
    V tisku *zufellen* (pravděpodobně sazečská záměna *f/ſt* za *zustellen*, tj. „postavit, rozestavit“, či významově „přirazit“).
