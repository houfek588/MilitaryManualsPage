bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    ist das Kriegsuolck zimliche Prouiant nach gelegenheit im Flecken zulassen schuldig / es sei ein gemeine beut oder nicht / dargegen soll der Oberst auch gedulden / wann kein gemeine Beut ist / vnd etlich Kriegsuolck etwas gewunnen hetten / vnd solliches nicht in eil mit jnen tragen oder füren möchten / auch beschwerlich not nit vorhanden / daß dieselbigen einen oder zwen darbei lassen bleiben / biß sie solchs verkauffen.
  cs: |-
    je válečný lid {Kriegsuolck} povinen zanechat v městečku přiměřený proviant {Prouiant} podle okolností, ať jde o společnou kořist nebo ne; naproti tomu má plukovník také strpět, když není společná kořist a někteří z válečného lidu něco získali, ale nemohou to v rychlosti odnést ani odvézt s sebou a nehrozí tísnivá nouze, aby u toho nechali zůstat jednoho či dva muže, dokud to neprodají.
- typ: odstavec
  de: |-
    Die gemeinen Beuten / werden von vil trefflichen Kriegsuerstendigen auff das höchst widerrathen / angesehen / das in Schlachten vnnd Stürmen vor volkomner eroberung der handlung / das plündern verbotten ist / bei verlierung leibs vnnd lebens / ehrn vnnd gůts / Darzů stürmet vnd schlecht mancher kecklich von gewins wegen / der sonst vil desto gemecher thet / auch geberen gemeine Beuten zwischen Kriegsleuten vil vnwillens / vnnd hat niemand mehr gewinß daruon / dann die Beutmeister / doch steht es zum Kriegsherrn oder dem Obersten Feldhauptman.
  cs: |-
    Od společné kořisti mnozí znamenití války znalí muži nanejvýš zrazují, poněvadž v bitvách a při útocích {Stürmen} je plenění před úplným završením boje zakázáno pod ztrátou hrdla a života, cti a statku; nadto mnohý útočí a bije se směle kvůli zisku, kdežto jinak by si počínal mnohem vlažněji. Společná kořist také plodí mezi válečníky {Kriegsleuten} mnoho nevole a nikdo z ní nemá větší zisk než mistři kořisti {Beutmeister}; přesto však záleží na válečném pánovi {Kriegsherrn} nebo na nejvyšším polním hejtmanovi {Obersten Feldhauptman}.
- typ: odstavec
  de: |-
    Die Flecken werden auch ausserhalb des stürmens durch etlich andere weg / als auff oder vbergeben / erobert / vnder denselben ist diser der aller strengst / das sich ein Kriegsuolck sampt den einwohnern in einer Besatzung / dem obersten Feldhaupt im namen seines Herrn mit leib / leben / hab vnd gůt / inn gnad vnnd vngnad ergebe / wann ein solliche vbergab geschicht / so ist alles was im Flecken gefunden wirt / des Kriegsherrn / der mag mit allem Kriegsuolck vnd einwonern seines gefallens handeln / außgenommen / Reisigen vnd ringe Pferde / Harnisch / vnnd was den Kriegsleuten zu jhren personlichen Wehrn gehöret / das ist des obersten Feldhauptmans / der soll es darnach miltiglich außtheilen vnder seine Hauptleut / vnd andere nach ansehen der Personen / Wiewol der Feldmarschalck etwas gerechtigkeit hat / daruon bei seinem ampt anzeigung soll geschehen / Der Oberst mag auch vngefehrlich etwas an Kleidern / silbergeschirr / bargelt / prouiant / oder gefangnen nemen / behalten oder verschencken / doch nichts fürtrefflichs ausserhalb des Kriegsherrn vorwissen vnd bewilligung.
  cs: |-
    Městečka bývají dobývána i mimo útok několika jinými způsoby, totiž vzdáním se či vydáním. Z nich je nejpřísnější ten, když se válečný lid spolu s obyvateli v posádce {Besatzung} vzdá nejvyššímu polnímu hejtmanovi[^1] jménem jeho pána hrdlem, životem, jměním i statkem na milost a nemilost. Při takovém vydání připadne vše, co se v městečku najde, válečnému pánovi, jenž smí se vším válečným lidem i obyvateli naložit podle své vůle, s výjimkou jezdeckých i lehkých koní {ringe Pferde}, zbroje {Harnisch} a všeho, co náleží válečníkům k jejich osobní výzbroji – to připadne nejvyššímu polnímu hejtmanovi, který to pak má štědře rozdělit mezi své hejtmany {Hauptleut} a jiné podle vážnosti osob. Jistá práva má ovšem i polní maršálek {Feldmarschalck}; o nichž se podá zpráva při jeho úřadu. Plukovník si také může v dobré víře vzít, ponechat nebo rozdat něco z šatstva, stříbrného nádobí, hotových peněz, proviantu nebo zajatců, avšak nic obzvláště cenného bez vědomí a souhlasu válečného pána.
- typ: odstavec
  de: |-
    Die ander vbergab der Flecken / geschicht / daß sich die Kriegsleut zu roß vnd fuß / auch etwan die zu roß allein / in ritterliche Gefengknuß ergeben / alsdann sein die Gefangnen des Herrn / vnd wirdt in andern Artickeln ausserhalb gnad vnd vngnad / vermüg des nechsten Artickels gehalten.
  cs: |-
    Druhý způsob vydání městeček se děje tak, že se válečníci na koni i pěšky – anebo někdy jen ti na koni – vzdají do rytířského zajetí; tehdy jsou zajatci pánovi, a v ostatních bodech kromě vydání na milost a nemilost se postupuje podle předchozího článku.
- typ: odstavec
  de: |-
    Zum dritten geschicht ein vbergab / daß die Kriegsleut zu roß vnd fuß / mit weissen steblin abziehen / roß vnd harnisch gar dahinden lassen / etwan gibt mann ein maß den rossen / welches nider ist / mögen sie mit
  cs: |-
    Za třetí se děje vydání tak, že válečníci na koni i pěšky odtáhnou s bílými hůlkami,[^2] koně i zbroj nechají úplně za sebou; někdy se pro koně stanoví určitá výška, a který kůň je nižší, toho si smějí s sebou
poznamky:
- n: 1
  text: V tisku zkráceně či chybně „Feldhaupt“ namísto „Feldhauptman“.
- n: 2
  text: |-
    Odchod s bílými proutěnými hůlkami (weiße Stäblein) bez zbraní a praporů byl v 16. století obvyklou formou potupného, avšak život zachraňujícího vyklizení kapitulované pevnosti.
