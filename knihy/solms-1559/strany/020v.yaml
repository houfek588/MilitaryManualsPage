bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    gemelt) volmechtigen gewalt hett / wann dann der Sturm berathschlagt wirt / oder jn der Oberst auß krafft seines beuelchs thůn wil / soll er von allen hauffen zu dem Sturm geordnet sein / sprengen / vnnd im selben schrecken lassen ablauffen / dann weil bei disen zeiten gemeinlich das Fußuolck stürmet / soll der Oberst vber die Knecht / die Hauffen zum sturm ordnen / Aber wie ein jeder Fleck gestürmet soll werden / kan in Schrifften niemand gründlich anzeigen / sonder solches muß auß ansehen / vnd der Kriegsuerstendigen rath / auch nach gelegenheit der Besatzung im Flecken / vnd des Kriegsuolcks hieaussen geschehen.
  cs: |-
    zmíněno) plnou moc. Když je pak útok {Sturm} projednán, anebo jej chce nejvyšší velitel podniknout z moci svého velení, má ze všech houfů {hauffen}, které jsou určeny k útoku, nechat provést odstřel a v témže zděšení dát vyrazit k útoku; poněvadž však v těchto dobách útočí zpravidla pěchota {Fußuolck}, má houfy k útoku seřadit plukovník {Oberst} nad knechty {Knecht}. Jak však má být každé městečko dobýváno útokem, to nemůže nikdo v písmu zevrubně vyložit, nýbrž to se musí dít podle osobního ohledání, rady války znalých mužů a také podle stavu posádky {Besatzung} v městečku i válečného lidu {Kriegsuolcks} zde venku.
- typ: odstavec
  de: |-
    Aber souil mag daruon geredt werden / daß mann nach stercke der Besatzung im Flecken / wann mann das am Kriegsuolck hieaussen demselben gemeß / hat / den ersten / anderen / dritten / oder folgents mit allen hauffen anlauffen / ordne / vnd ein gewichter hauff jmmehr nottürfftig auff den andern lauffen lassen / dieselben sollen (sonderlich die ersten) mit sturmleydtern / der höhe darüber sie stürmen müssen gemeß / versehen sein / der Oberst soll auch als vil jm möglich / die streychwehren / darauß sein Volck am Sturm bescheidiget werden mag / mit dem grossen vnd kleinen Geschütz verhindern / oder sie mit blenden / daß sie das Volck am Sturm nicht sehen noch verhindern künden / wie etwan geschicht / Auch soll der Oberst vber das Fußuolck erfarne Kriegsleut ordnen / welche die mit den Handroren füren vnd anstellen / damit dieselbigen die am Sturm / für denen die sich auß der Besatzung wehren wöllen / beschirmen / vnd sie von den Wehrn abtreiben / darzů wann es die notturfft erfordert / selbst die Schützen auch stürmen / vnd die Feinde von den plätzen hinder den Maurn / Schütten oder Polwercken hinweg in die flucht schiessen / Hie soll der Zeugmeister auch fleissig achtung haben / daß er die Feinde von allen Wehren abtreibe / doch daß er auch die Freunde / wann sie auff die Mauren / Thürn vnd Schütten kommen nit bescheidige / wie offt geschehen / angesehen / mann findt Büchsenmeister die schiessen hinein / achten wenig ob sie Freunde oder Feinde treffen.
  cs: |-
    Tolik však lze o tom říci, aby se podle síly posádky v městečku – má-li se zde venku přiměřeně silný válečný lid – určilo k nástupu první, druhé, třetí či postupně všechny houfy a vždy podle potřeby se nechal hnát jeden zdatný houf za druhým; tytéž houfy (zvláště ty první) mají být opatřeny útočnými žebříky přiměřenými výšce, přes niž musejí útočit. Nejvyšší velitel má také, jak jen může, zneškodňovat velkými i malými děly {Geschütz} boční obranné stavby {streychwehren}, z nichž by mohl být jeho lid při útoku poškozován, anebo je oslepit clonami, aby neviděli útočící lid ani mu nemohli bránit, jak se někdy stává. Rovněž má plukovník nad pěchotou určit zkušené válečníky {Kriegsleut}, kteří povedou a rozestaví muže s ručnicemi {Handroren}, aby ti chránili útočící před obránci z posádky a zaháněli je z obranných stanovišť; a vyžaduje-li to potřeba, aby i sami střelci {Schützen} útočili a odstřelovali nepřátele z prostranství za hradbami, valy či bolverky {Polwercken} na útěk. Zde má také zbrojmistr {Zeugmeister} pilně dávat pozor, aby nepřátele zaháněl ze všech obranných stanovišť, avšak aby přitom nezasáhl přátele, jakmile vylezou na hradby, věže a valy, jak se často stalo – neboť se najdou puškaři {Büchsenmeister}, kteří střílejí do průlomu a málo dbají, zasáhnou-li přátele nebo nepřátele.
- typ: odstavec
  de: |-
    Es stürmen auch vnder weilen die Reisigen / aber doch selten / aber wenn die Reisigen / oder welche nicht stürmen / die sollen doch all in jhrer Rüstung auff sein / vnd vber dem sturm halten / solliches hat villerlei vrsachen / das billich ein jeder Kriegsman soll wissen / dann alles Volck in einem jeglichen Leger / was zum Krieg tauglich / soll wann mann stürmet / auff sein / sonst alle andere bequemlicheit dardurch die Flecken mit stürmen erobert werden mögen / seien den kriegsuerstendigen so darbei sein / beuolhen.
  cs: |-
    Někdy útočí i jezdci {Reisigen}, avšak jen zřídka; ale i když neútočí jezdci nebo ti, kdo nejdou do útoku, mají být přece všichni ve své zbroji {Rüstung} na nohou a držet pohotovost nad útokem. To má rozličné příčiny, jež by měl každý válečník {Kriegsman} po právu znát, neboť všechen lid v každém ležení {Leger}, který je způsobilý k boji, má být během útoku v pohotovosti; všechny ostatní vhodné prostředky, jimiž lze městečka útokem dobýt, buďtež ponechány války znalým mužům, kteří jsou u toho.
