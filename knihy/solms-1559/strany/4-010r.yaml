bloky:
- typ: odstavec
  de: |-
    ZVm drei vnd zwentzigsten/ sind hieuorn wider vier offener stück/ das erst so das creutz vornen in dem maul stecken hat/ dasselbig hat drei anzeigung/ erstlich das creutz das in jr steckt ist auff beiden seitten winckel recht/ so soll mann solches Richtscheidt mit dem winckel rechten creutz in die Büchsen scheiben/ vnd an einem ort das Richtscheidt hart inwendig an der ein seiten der Büchsen anhalten/ vnnd also das creutz vorn am maul oder kopff lassen anstehn/ steht es dan an beiden seitten zu gleich vorn an/ dann ist es gerecht/ steht aber das creutz an einem ort vorn an dem maul an/ vnd am anderen nit/ wie es inn diser Figurn thůt/ dann scheust die Büchs auff die seite/ da das creutz nit ansteht. Zum andern hat sie ein keil in der mit vor der Kugeln ligen/ der hat die bedeutung/ daß solcher Keil soll eisen sein/ vnd wann mann ein Büchs zersprengen will/ soll mann solchen eisen Keil (wann die Büchs geladen ist) für die Kugel hinein scheiben/ wann mann dann die Büchs anzündt/ so laufft die Kugel auff den Keil/ vnd kan nicht herüber/ dann bricht die Büchs/ das ist gůt wann mann ein Büchs den feinden lassen muß/ vnd nit kan hinweg bringen/ dann scheib mann ein keil darinn/ wann dann die Feinde sie abschiessen/ dann zerspringt sie vnd thůn jn selber schaden. Zum dritten ist zusehen an dem abriß oder Figurn/ wie hinden bei dem bodem etwan zweier oder dreier Kugeln lang ist/ vnd je lenger je neher bei dem bodem ein vnnd zu gezogen/ daß sie gegen dem bodem enger vñ rundt wirt/ das ist gůt/ es scheibt das Puluer wañ es angezündt wirt/ behendt vnd mit gewalt herfür auff die Kugel/ vnd helt sich nit lang hinden in der Büchsen/ als wann sie hinden weit vnnd an dem bodem geuierdt were/ oder ein scharpffe ecke hett.
  cs: |-
    Za třiadvacáté: výše jsou opět čtyři otevřené kusy v řezu. První z nich, jež má vpředu v ústí vsazený kříž, podává trojí poučení. Zaprvé: kříž v ní zasazený jest na obě strany pravoúhlý; toto rovnací pravítko {Richtscheidt} s pravoúhlým křížem se tedy vsune do děla a na jedné straně se pevně přitiskne zevnitř k jedné stěně hlavně, přičemž se kříž nechá vpředu dolehnout na ústí či hlavu hlavně. Dolehne-li vpředu na obou stranách zároveň, pak jest hlaveň v pořádku; doléhá-li však kříž na ústí jen na jedné straně a na druhé nikoli, jak to činí v tomto vyobrazení, tehdy dělo střílí na tu stranu, kde kříž nedoléhá. Za druhé: uprostřed před koulí {Kugeln} leží klín, jenž znamená, že tento klín má být železný; a chce-li někdo dělo roztrhnout, má takový železný klín (když jest dělo nabito) zasunout před kouli; když se pak dělo zapálí, narazí koule na klín a nemůže přes něj ven, takže se dělo roztrhne. To jest dobré, musí-li se dělo zanechat nepřátelům a nelze jej odvézt; tehdy se do něj zasune klín, a když pak nepřátelé z děla vystřelí, rozletí se a sami sobě tím uškodí. Za třetí jest na tomto nákresu či figuře vidět, jak se hlaveň vzadu u dna v délce dvou nebo tří koulí čím dál blíže ke dnu stahuje a zužuje do oblého tvaru; to jest dobré proto, že po zapálení střelného prachu {Puluer} žene plyn střelu prudce a s velikou silou vpřed a nezdržuje se dlouho vzadu v hlavni, jako když jest dělo vzadu široké a u dna hranaté nebo s ostrým koutem.
- typ: odstavec
  de: |-
    Das ander stück ist mit einem sack geladen/ also/ mann macht ein Sack der in die Büchs gerecht/ vnd souil puluer helt als der Büchsen ladung groß ist/ den thůt mann vol Puluer/ vnnd bindt jhn vorn fest zů/ solcher gefülte säck hat mann vil vnd fürt sie mit/ wann mann die Büchs laden will/ nimpt mañ eī sack schneidt hinden ein creutz darinn/ vnd scheibt den in die Büchse/ dann felt das Puluer hinden durch den schnidt herauß/ vnnd scheubt sich mit dem sack hinden an den bodem/ darnach die kugel darauff/ solches laden ist behend/ vnnd wann es regnet/ ists auch fast gůt vnd behelt das Puluer drucken.
  cs: |-
    Druhý kus jest nabit pytlíkem, a to takto: zhotoví se pytlík neboli prachová patrona (*sack*), která se hodí do děla a pojme právě tolik střelného prachu {puluer}, jak velká jest nálož toho děla; ten se naplní prachem a vpředu pevně zaváže. Takových naplněných sáčků se připraví mnoho a vozí se s sebou; když pak chce někdo dělo nabít, vezme jeden sáček, vzadu do něj nařízne kříž a zasune jej do děla. Prach se pak vzadu řezem vysype a přitlačí i se sáčkem dozadu ke dnu, načež se na něj vloží koule {kugel}. Takové nabíjení jest hbité, a když prší, jest rovněž velmi dobré a uchovává prach v suchu.
- typ: odstavec
  de: |-
    Das drit stück ist darumb offen gerissen/ daß mann sehen soll wañ ein kern vff der seiten ligt/ als mañ ein Richtscheidt oder bret macht/ das etwan vier kugeln lang ist/ gerat vñ gedrang in die Büchs geht/ vnd in der mit einn geraten riß durch die leng auß hat/ das die helfft hauß vor der Büchsen bleibt/ daß auff solchem bret zwei höltzlein oder
  cs: |-
    Třetí kus jest v řezu otevřen proto, aby bylo vidět, zda jádro vývrtu {kern} leží stranou: zhotoví se rovnací pravítko {Richtscheidt} neboli prkno dlouhé asi čtyři průměry koule {kugeln}, jež jde rovně a těsně do děla a uprostřed po délce má rovnou rysku, přičemž polovina prkna zůstává vně před dělem, aby na tomto prkně stála dvě dřívka neboli
