bloky:
- typ: odstavec
  de: |-
    ZVm drei vnd zwentzigsten/ sind hieuorn wider vier offener stück/ das erst so das creutz vornen in dem maul stecken hat/ dasselbig hat drei anzeigung/ erstlich das creutz das in jr steckt ist auff beiden seitten winckel recht/ so soll mann solches Richtscheidt mit dem winckel rechten creutz in die Büchsen scheiben/ vnd an einem ort das Richtscheidt hart inwendig an der ein seiten der Büchsen anhalten/ vnnd also das creutz vorn am maul oder kopff lassen anstehn/ steht es dan an beiden seitten zu gleich vorn an/ dann ist es gerecht/ steht aber das creutz an einem ort vorn an dem maul an/ vnd am anderen nit/ wie es inn diser Figurn thůt/ dann scheust die Büchs auff die seite/ da das creutz nit ansteht. Zum andern hat sie ein keil in der mit vor der Kugeln ligen/ der hat die bedeutung/ daß solcher Keil soll eisen sein/ vnd wann mann ein Büchs zersprengen will/ soll mann solchen eisen Keil (wann die Büchs geladen ist) für die Kugel hinein scheiben/ wann mann dann die Büchs anzündt/ so laufft die Kugel auff den Keil/ vnd kan nicht herüber/ dann bricht die Büchs/ das ist gůt wann mann ein Büchs den feinden lassen muß/ vnd nit kan hinweg bringen/ dann scheib mann ein keil darinn/ wann dann die Feinde sie abschiessen/ dann zerspringt sie vnd thůn jn selber schaden. Zum dritten ist zusehen an dem abriß oder Figurn/ wie hinden bei dem bodem etwan zweier oder dreier Kugeln lang ist/ vnd je lenger je neher bei dem bodem ein vnnd zu gezogen/ daß sie gegen dem bodem enger vnd rundt wirt/ das ist gůt/ es scheibt das Puluer wann es angezündt wirt/ behendt vnd mit gewalt herfür auff die Kugel/ vnd helt sich nit lang hinden in der Büchsen/ als wann sie hinden weit vnnd an dem bodem geuierdt were/ oder ein scharpffe ecke hett.
  cs: |-
    Za třiadvacáté: výše jsou opět čtyři kusy otevřené v řezu. První z nich, který má vpředu v ústí zastrčený kříž, ukazuje troje. Zaprvé: kříž, který v něm vězí, je na obě strany pravoúhlý. Toto rovnací pravítko {Richtscheidt} s pravoúhlým křížem se tedy zasune do děla, na jednom místě se pevně přitiskne zevnitř k jedné stěně děla a kříž se nechá vpředu dolehnout na ústí či hlavu děla. Dolehne-li vpředu na obou stranách zároveň, je dělo v pořádku; dolehne-li však kříž na ústí jen na jedné straně a na druhé ne, jako na této figuře, střílí dělo na tu stranu, kde kříž nedoléhá. Zadruhé: uprostřed před koulí {Kugeln} leží klín, a to znamená, že takový klín má být železný. Chce-li někdo dělo roztrhnout, má tento železný klín (když je dělo nabité) zasunout před kouli; když se pak dělo zapálí, narazí koule na klín a nemůže přes něj, takže se dělo roztrhne. To se hodí, musí-li se dělo nechat nepříteli a nelze je odvézt: zasune se do něj klín, a když z něj pak nepřátelé vystřelí, roztrhne se a uškodí jim samým. Zatřetí je na tomto nákresu či figuře vidět, jak je dělo vzadu u dna v délce asi dvou nebo tří koulí čím dál víc stažené a zúžené, takže je ke dnu užší a oblé. To je dobré, neboť zapálený střelný prach {Puluer} se prudce a mocně žene vpřed na kouli a nezdržuje se dlouho vzadu v děle, jako když je dělo vzadu široké a u dna hranaté nebo má ostrý kout.
- typ: odstavec
  de: |-
    Das ander stück ist mit einem sack geladen/ also/ mann macht ein Sack der in die Büchs gerecht/ vnd souil puluer helt als der Büchsen ladung groß ist/ den thůt mann vol Puluer/ vnnd bindt jhn vorn fest zů/ solcher gefülte säck hat mann vil vnd fürt sie mit/ wann mann die Büchs laden will/ nimpt mann ein sack schneidt hinden ein creutz darinn/ vnd scheibt den in die Büchse/ dann felt das Puluer hinden durch den schnidt herauß/ vnnd scheubt sich mit dem sack hinden an den bodem/ darnach die kugel darauff/ solches laden ist behend/ vnnd wann es regnet/ ists auch fast gůt vnd behelt das Puluer drucken.
  cs: |-
    Druhý kus je nabit pytlíkem, a to takto: zhotoví se pytlík neboli prachová patrona (*sack*), který se přesně hodí do děla a pojme tolik prachu, kolik činí nálož děla; naplní se prachem a vpředu se pevně zaváže. Takových naplněných pytlíků se má mnoho a vozí se s sebou. Když chce někdo dělo nabít, vezme pytlík, vzadu do něj nařízne kříž a zasune jej do děla; prach pak řezem vzadu vypadne a i s pytlíkem se dotlačí dozadu ke dnu, načež se na něj vloží koule. Takové nabíjení je rychlé, a když prší, je také velmi dobré a uchová prach suchý.
- typ: odstavec
  de: |-
    Das drit stück ist darumb offen gerissen/ daß mann sehen soll wann ein kern vff der seiten ligt/ als mann ein Richtscheidt oder bret macht/ das etwan vier kugeln lang ist/ gerat vnd gedrang in die Büchs geht/ vnd in der mit einn geraten riß durch die leng auß hat/ das die helfft hauß vor der Büchsen bleibt/ daß auff solchem bret zwei höltzlein oder
  cs: |-
    Třetí kus je otevřen v řezu proto, aby bylo vidět, když jádro vývrtu {kern} leží stranou: zhotoví se rovnací pravítko neboli prkno dlouhé asi čtyři koule, které jde rovně a těsně do děla a uprostřed má po celé délce rovnou rysku; polovina prkna přitom zůstává venku před dělem, aby na tomto prkně stála dvě dřívka neboli
