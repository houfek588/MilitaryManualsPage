bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    aber die bogenschoß seind auch falsch / vnd steht einem Mörser zů der zum bogenschiessen vnd werffen gemacht ist / inn demselbigen ist der Büchsenmeister seiner Büchsen auch nit Meister gnůg / Warumb ? Seine Instrument zum bogen sind am ersten falsch / biß so lang daß er dasselbig mit proben schiessen am Instrument erlernt vnd verzeichnet / Also ist es in einem Mörser gar nicht auszulernen / dieweil er nichts anders dann einn Bogen vnd klein puluer hat / das einmal mehr geladen wirt dann das anders / deßgleichen ein gůts vnnd böß eins härter vnd weitter scheußt dann das ander. Darumb mag es den Bogen oder Circkel einmal nit haben wie das ander / auch ist ein Kugel am Stein / vnd ein Feurwerck schwerer dann das ander / deßgleichen brent ein Feurwerck in der lufft mehr dann das ander / das macht alles die vngleicheit vnd verenderung / darmit kein Bogen im werffen seinen Circkel halten mag wie der ander / Deßgleichen darnach der Windt vnd das Wetter starck oder lindt ist / geht es auch nach / darumb seind alle Instrument des Mörsers nit gewaltig / sonder gewissen proben einer jeglichen gattung / Derhalben wil ein Mörser mit seiner zurichtung zu seinem werck gar ein ander rüstung / versehung / Ordnung vnd Leut haben. Darumb welcher sich rümpt / er sei des Mörsers meister / bedunckt mich er thů jm zuuil / dieweil er / wie vorgemelt / wann die enderung geschehen / alle mal new proben mit seinem Instrument zeichen vnd machen můß / vnnd also daran für vnd für mit den proben machen leren / darumb der lernt weiß keinn gewissen verstandt / ist des nit meister.
  cs: |-
    avšak obloukové výstřely bývají rovněž klamné[^1] a náležejí k moždíři {Mörser}, který je zhotoven k obloukovému střílení a vrhání; u něho však puškař {Büchsenmeister} nad svým dělem {Büchsen} také není dostatečným mistrem. Proč? Jeho přístroje[^2] pro střelbu obloukem jsou zprvu klamné, dokud to zkušební střelbou na přístroji neověří a nezaznamená. Takto se u moždíře nedá vůbec nikdy doučit, poněvadž nemá nic jiného než oblouk a drobný střelný prach {puluer}, jehož se jednou nabije více než podruhé; stejně tak dobrý a špatný prach střílí jeden prudčeji a dále než druhý. Proto nemůže mít oblouk či kruhový výsek jednou týž tvar jako podruhé; také jedna kamenná koule {Kugel} a jeden ohňostroj {Feurwerck} jsou těžší než druhý, stejně tak jeden ohňostroj hoří ve vzduchu více než druhý – to všechno způsobuje nerovnost a proměnlivost, takže žádný oblouk při vrhání nedokáže udržet stejnou dráhu jako druhý. Stejně tak podle toho, zda je vítr a počasí silné nebo mírné, odchyluje se i dráha; proto nad moždířem nevládnou žádné přístroje, nýbrž spolehlivé zkoušky každého jednotlivého druhu. Z toho důvodu vyžaduje moždíř se svým vybavením ke své práci zcela jinou výzbroj, zaopatření, řád a lidi. Proto kdo se chlubí, že je mistrem nad moždířem, zdá se mi, že si troufá příliš, jelikož – jak řečeno výše – při každé změně musí vždy znovu značit a konat nové zkoušky na svém přístroji, a tak se na tom neustále učí děláním zkoušek; a kdo se teprve učí, nezná jistého poznání a není toho mistrem.
- typ: odstavec
  de: |-
    Wie aber ich vermein das mit einem Mörser vmbgangen vnd gebraucht werden soll / volgt. Zum ersten soll ein Mörser nach seiner größ oder schwer deßgleichen seiner gefäß oder stůl / wie er ist zugericht mit seinen notturfftigen Wagen darzů verordnet sein / inn aller maß wie hieuorn das ander geschütz verordnet / nemlich die grossen Mörser so im stůllen ligen / wöllen jre besondere doppel Wagen zu jren stůln haben / gespant mit Rossen nach zall jres gewichts.
  cs: |-
    Jak se však podle mého mínění má s moždířem zacházet a jak se ho má užívat, následuje: předně má být moždíř podle své velikosti či váhy, jakož i podle své lafety {gefäß} nebo stolice {stůl}, jak je upraven, opatřen potřebnými vozy k tomu určenými, zcela stejným způsobem, jak byla výše uspořádána ostatní děla {geschütz}; totiž velké moždíře, jež spočívají ve stolicích {stůllen},[^3] vyžadují ke svým stolicím své zvláštní zdvojené vozy, zapřažené koňmi podle počtu odpovídajícího jejich váze.
- typ: odstavec
  de: |-
    Die andern geringen die kein stůl haben welche mann in jren gefässen fürt vnd scheußt / bedörffen keiner wagen anders dann jrer gefäß darinn sie ligen / sollen sie gefürt werden wie ander gering Geschütz / dasselbig alles groß vnd klein darnach mann vermeint zugebrauchen / oder zu haben aller gattung / sollen auff das gewicht wie das vorig Geschütz gerechnet / getheilt vnd geordnet werden / nach summa der zal / stück / steinen vnd Feurkugeln / vnd des Puluers.
  cs: |-
    Ostatní lehčí moždíře, které nemají stolici a které se vozí a střílejí přímo ve svých lafetách, nepotřebují žádné jiné vozy kromě svých lafet, v nichž leží, a mají se vézt jako jiná lehká děla. A toto všechno, velké i malé, podle toho, jakých a kolika druhů zamýšlí člověk užít nebo mít, má se přepočítat na váhu, rozdělit a uspořádat stejně jako předešlá děla podle celkového počtu kusů {stück}, kamenných i ohnivých koulí {Feurkugeln} a prachu.
poznamky:
- n: 1
  text: |-
    V záhlaví tisku je na tomto listu chybně vytištěno číslo listu *32* namísto *31* (totéž číslo *32* pak nese i následující l. 32r).
- n: 2
  text: |-
    Tj. střelecké kvadranty a měřické přístroje k nastavení náměru moždíře.
- n: 3
  text: |-
    Těžké moždíře neměly kolovou lafetu, nýbrž ležely v mohutných dřevěných stolicích (*Stuhl*), převážených na zvláštních těžkých vozech (BSB OCR na ř. 32 četlo *stillen* místo *stůllen* a na konci ř. 25 *mitmeister* místo *nit meister*).
