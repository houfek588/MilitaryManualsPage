bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    aber die bogenschoß seind auch falsch / vnd steht einem Mörser zů der zum bogenschiessen vnd werffen gemacht ist / inn demselbigen ist der Büchsenmeister seiner Büchsen auch nit Meister gnůg / Warumb ? Seine Instrument zum bogen sind am ersten falschs / biß so lang daß er dasselbig mit proben schiessen am Instrument erlernt vnd verzeichnet / Also ist es in einem Mörser gar nicht außzulernen / dieweil er nichts anders dann einn Bogen vnd klein puluer hat / das einmal mehr geladen wirt dann das anders / deßgleichen ein gůts vnnd böß eins härter vnd weitter scheußt dann das ander. Darumb mag es den Bogen oder Circkel einmal nit haben wie das ander / auch ist ein Kugel am Stein / vnd ein Feurwerck schwerer dann das ander / deßgleichen brent ein Feurwerck in der lufft mehr dann das ander / das macht alles die vngleicheit vnd verenderung / darmit kein Bogen im werffen seinen Circkel halten mag wie der ander / Deßgleichen darnach der Windt vnd das Wetter starck oder lindt ist / geht es auch nach / darumb seind alle Instrument des Mörsers nit gewaltig / sonder gewissen proben einer jeglichen gattung / Derhalben wil ein Mörser mit seiner zurichtung zu seinem werck gar ein ander rüstung / versehung / Ordnung vnd Leut haben. Darumb welcher sich rümpt / er sei des Mörsers meister / bedunckt mich er thů jm zuuil / dieweil er / wie vorgemelt / wann die enderung geschehen / alle mal new proben mit seinem Instrument zeichen vnd machen můß / vnnd also daran für vnd für mit den proben machen leren / darumb der lernt weiß keinn gewissen verstandt / ist des nit meister.
  cs: |-
    avšak i obloukové výstřely jsou nespolehlivé.[^1] Tak je tomu u moždíře {Mörser}, který je zhotoven ke střelbě obloukem a k vrhání: ani u něho není puškař {Büchsenmeister} dost dobře mistrem svého děla {Büchsen}. Proč? Jeho přístroje[^2] pro střelbu obloukem jsou zprvu nespolehlivé, dokud je zkušební střelbou neověří a nezaznamená si výsledky. U moždíře se to však nedá doučit nikdy, protože nemá nic jiného než oblouk a malou nálož prachu {puluer}, jíž se jednou nabije víc a podruhé méně; a také dobrý a špatný prach střílí jeden prudčeji a dál než druhý. Proto nemůže mít oblouk čili kruhová dráha jednou týž průběh jako podruhé. Také jedna kamenná koule {Kugel} či jeden ohňostroj {Feurwerck} je těžší než druhý a jeden ohňostroj hoří ve vzduchu víc než druhý – to vše způsobuje nestejnost a proměnlivost, takže žádný oblouk při vrhání neudrží stejnou dráhu jako jiný. Stejně tak se dráha řídí tím, zda je vítr a počasí silné, či mírné. Proto přístroje u moždíře nic nezmohou, rozhodují jen spolehlivé zkoušky s každým jednotlivým druhem [střeliva]. Z toho důvodu vyžaduje moždíř se svým vybavením ke své práci zcela jinou výzbroj, zaopatření, řád i lidi. Kdo se tedy chlubí, že je mistrem moždíře, ten si podle mne troufá příliš: jak bylo řečeno, musí po každé změně vždy znovu dělat a zaznamenávat nové zkoušky na svém přístroji, a tak se na tom pořád učí zkoušením; a kdo se teprve učí, nemá jisté znalosti a není mistrem.
- typ: odstavec
  de: |-
    Wie aber ich vermein das mit einem Mörser vmbgangen vnd gebraucht werden soll / volgt. Zum ersten soll ein Mörser nach seiner größ oder schwer deßgleichen seiner gefäß oder stůl / wie er ist zugericht mit seinen notturfftigen Wagen darzů verordnet sein / inn aller maß wie hieuorn das ander geschütz verordnet / nemlich die grossen Mörser so im stillen ligen / wöllen jre besondere doppel Wagen zu jren stůln haben / gespant mit Rossen nach zall jres gewichts.
  cs: |-
    Jak se však podle mého mínění má s moždířem zacházet a jak se ho má užívat, následuje. Předně má být moždíř podle své velikosti či váhy a podle své lafety {gefäß} nebo stolice {stůl}, jak je upraven, opatřen potřebnými vozy, které jsou k němu určeny, zcela stejně, jak byla výše uspořádána ostatní děla {geschütz}. Velké moždíře, které leží ve stolicích,[^3] potřebují ke svým stolicím zvláštní dvojité vozy, zapřažené koňmi podle své váhy.
- typ: odstavec
  de: |-
    Die andern geringen die kein stůl haben welche mann in jren gefässen fürt vnd scheußt / bedörffen keiner wagen anders dann jrer gefäß darinn sie ligen / sollen sie gefürt werden wie ander gering Geschütz / dasselbig alles groß vnd klein darnach mann vermeint zugebrauchen / oder zu haben aller gattung / sollen auff das gewicht wie das vorig Geschütz gerechnet / getheilt vnd geordnet werden / nach summa der zal / stück / steinen vnd Feurkugeln / vnd des Puluers.
  cs: |-
    Ostatní, lehčí moždíře, které nemají stolici a vezou se i střílejí přímo ve svých lafetách, nepotřebují žádné jiné vozy než lafety, v nichž leží; mají se vézt jako ostatní lehká děla. A to všechno, velké i malé, jakéhokoli druhu kdo zamýšlí užívat či mít, má se přepočítat na váhu, rozdělit a uspořádat stejně jako předešlá děla podle celkového počtu kusů {stück}, kamenných a ohnivých koulí {Feurkugeln} a prachu.
poznamky:
- n: 1
  text: |-
    V záhlaví tisku je na tomto listu chybně vytištěno číslo listu *32* namísto *31* (totéž číslo *32* pak nese i následující l. 32r).
- n: 2
  text: |-
    Tj. střelecké kvadranty a měřické přístroje k nastavení náměru moždíře.
- n: 3
  text: |-
    Těžké moždíře neměly kolovou lafetu, nýbrž ležely v mohutných dřevěných stolicích (*Stuhl*), převážených na zvláštních vozech. Tisk má zde *im stillen ligen*, zřejmě tiskovou chybu za *im stülen* („ve stolicích“; srov. *zu jren stüln* v téže větě); ověřeno ve skenu.
