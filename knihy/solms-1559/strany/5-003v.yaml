id: 5-003v
list: 3 (5. kniha)
strana: verso
sken: 442
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Aber die Mauer so auch in diser Figurn hieuor bei dem Thurn verzeignet ist mit dem Bůchstaben B. im einbroch der Mauern/ ist die zeit auch vor Perona darein gebrochen vnnd gesprengt/ vnd ist gleichs falsz auch zu beiden Seiten gleich dem Thurn eingebrochen/ gesetzt vnnd gesprengt/ oder wie wir in die Mauern gebrochen/ haben sie vns hinden herauß entgegen gebrochen/ das wir zusamen kamen/ sind sie vber vns mit jrem brechen komen/ vnd ein Sack mit puluer durch jren Broch in den vnsern gesteckt vnd anzünden wollen/ so haben die vnsern das gesehen/ denselbigen Sack jnen eilents auß dem Loch gerissen/ ehe dañ sie den angezündt haben/ vnd zu demselbigen Loch vbersich mit den kurtzen vier Büchsen geschossen/ vnnd mit Puluer dardurch allezeit ein Rauch oder dampff gemacht/ vnd also auß jhrem broch vertrieben/ vnnd mit vnserm brechen noch etlich tag fürt gefarn/ vnnd anfahen zu setzen/ da sie das vermerckten/ haben sie Stro zusamen gebunden/ vñ in schwefel vnd Bech dasselbig gebunden Stro an beiden orten oder enden getaufft/ angezündt/ vnnd zu vns herüber geworffen/ daß wir das Puluer dardurch mit den Donnen oder Fassen nicht kunden hinein tragen/ vnd vns einen tag daß eintragen des Puluers gewehrt/ vnd hatten hinder der Maurn ein graben gerat gegen vnserm einbroch/ vnd trugen fast Wasser zů/ vnd als eingegossen dass es zu vnserm einbroch durch gegen vns lieff/ daß ich die nacht leinen Seck must machen/ darinn ich das Puluer thet/ daß einer ein solchen Sack vnder seinen Rock name/ vnd zu dem loch hinein lieff/ daß wir also das Puluer mit Secken hinein tragen musten. Weiter hab ich lassen drem hinein legen vnd Bretter darauff/ darnach das Puluer darauff gesatzt/ daß das Wasser ist vnder dem Puluer hindurch gelauffen/ vnd das Puluer haben wir von Ochsen/ Küe vnd Schaaff heudten/ wie wir die in dem Leger bekommen kunden/ oben bedeckt/ das solches wasser must ablauffen/ vnd nit zu dem puluer komen kundt/ also glückts vns das wir die maur sprengten/ vnd jnen jr fürhaben nit halff.
  cs: |-
    Pokud jde o zeď, která je na předchozím vyobrazení u věže označena písmenem `B` při průlomu hradby, do té se tehdy před Péronne {Perona} rovněž prorazilo a odstřelilo se ji – a stejně jako u věže se vylámala na obě strany, nabila a odpálila. Jakmile jsme však do zdi lámali, prokopávali se nám obránci zezadu vstříc, až jsme se setkali; svým kopáním se dostali nad nás a strčili svým otvorem pytel s prachem do našeho průlomu a chtěli jej zapálit. Naši to však zpozorovali, rychle jim ten pytel z díry vytrhli dříve, než jej zapálili, stříleli do toho otvoru vzhůru z krátkých ohnivých ručnic {vier Büchsen}[^1] a dělali tak prachem pořád dým a kouř, až je z jejich průlomu vyhnali. Pak jsme s naším lámáním ještě několik dní pokračovali a začali ukládat nálož. Když to obránci zpozorovali, svázali slámu, namočili oba konce takové svázané slámy do síry {schwefel} a smůly {Bech}, zapálili je a házeli k nám, takže jsme nemohli prach v soudcích či sudech donášet dovnitř, a na jeden den nám tak vnášení prachu znemožnili. Také si za zdí přímo proti našemu průlomu vykopali strouhu, pilně nosili vodu a stále ji tam lili, takže tekla naším průlomem proti nám. Tu jsem přes noc musel nechat ušít plátěné pytle, do nichž jsem dal prach, a každý si vzal takový pytel pod kabát a běžel s ním do díry – takže jsme prach museli vnášet v pytlích. Dále jsem dovnitř nechal položit trámy a na ně prkna a na ně teprve uložit prach, takže voda pod prachem protékala; a shora jsme prach přikryli volskými, kravskými a ovčími kůžemi, jaké jsme jen v ležení {Leger} sehnali, aby taková voda musela stéci a nemohla se k prachu dostat. Tak se nám podařilo zeď vyhodit do povětří a jejich úmysl jim nepomohl.
- typ: odstavec
  de: |-
    Solchs thůn ich darumb mit solchem bericht zu schreiben/ das zuuernemen daß also gehandelt ist worden/ vnd nit auß einem draum oder gůt düncken geschehen/ vnd nit in dem werck gewesen/ aber ich mags frei schreiben daß also ergangen ist wie gemelt. Zum andern Zeige ich das auch in meiner beschreibung an/ daß solchs zugedencken genomen werde denen so damit vmbgehn sollen/ wann jnen ein solche sach fürkeme/ daß sie dem der gestalt zu begegnen wüsten/ dañ ich hapts vnderhanden gehabt/ vnd befunden was eim der solchs handeln vnd brauchen soll/ zusteht/ darumb ich trewlich warne vñ zum besten vnderweisen vnd richten will.
  cs: |-
    Píši to s takovou podrobností proto, aby bylo zřejmé, že se tak skutečně jednalo a nevzniklo to ze snu nebo pouhého domnění bez skutečné zkušenosti; směle však mohu napsat, že se to stalo právě tak, jak popsáno. Za druhé to ve svém popisu uvádím proto, aby si to vzali k srdci ti, kdo s tím mají zacházet – kdyby je potkala taková příhoda, aby věděli, jak jí čelit. Neboť jsem to měl sám v rukou a poznal jsem, co přísluší tomu, kdo má takové věci konat a užívat; proto věrně varuji a chci co nejlépe poučit a navést.
poznamky:
- n: 1
  text: |-
    V tisku „mit den kurtzen vier Büchsen“, zřejmě sazečský omyl za *Feuerbüchsen* (krátké ohnivé ručnice / krátké pušky do podzemních štol); o písmenu `B` srv. dolní polovinu následující tabule na skenu 444 (`5-004v`).
