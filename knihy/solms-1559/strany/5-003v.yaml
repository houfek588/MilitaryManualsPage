id: 5-003v
list: 3 (5. kniha)
strana: verso
sken: 442
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Aber die Mauer so auch in diser Figurn hieuor bei dem Thurn verzeignet ist mit dem Bůchstaben B. im einbroch der Mauern/ ist die zeit auch vor Perona darein gebrochen vnnd gesprengt/ vnd ist gleichs falß auch zu beiden Seiten gleich dem Thurn eingebrochen/ gesetzt vnnd gesprengt/ oder wie wir in die Mauern gebrochen/ haben sie vns hinden herauß entgegen gebrochen/ das wir zusamen kamen/ sind sie vber vns mit jrem brechen komen/ vnd ein Sack mit puluer durch jren Broch in den vnsern gesteckt vnd anzünden wollen/ so haben die vnsern das gesehen/ denselbigen Sack jnen eilents auß dem Loch gerissen/ ehe dann sie den angezündt haben/ vnd zu demselbigen Loch vbersich mit den kurtzen vier Büchsen geschossen/ vnnd mit Puluer dardurch allezeit ein Rauch oder dampff gemacht/ vnd also auß jhrem broch vertrieben/ vnnd mit vnserm brechen noch etlich tag fürt gefarn/ vnnd anfahen zu setzen/ da sie das vermerckten/ haben sie Stro zusamen gebunden/ vnd in schwefel vnd Bech dasselbig gebunden Stro an beiden orten oder enden getaufft/ angezündt/ vnnd zu vns herüber geworffen/ daß wir das Puluer dardurch mit den Donnen oder Fassen nicht kunden hinein tragen/ vnd vns einen tag daß eintragen des Puluers gewehrt/ vnd hatten hinder der Maurn ein graben gerat gegen vnserm einbroch/ vnd trugen fast Wasser zů/ vnd als eingegossen dass es zu vnserm einbroch durch gegen vns lieff/ daß ich die nacht leinen Seck must machen/ darinn ich das Puluer thet/ daß einer ein solchen Sack vnder seinen Rock name/ vnd zu dem loch hinein lieff/ daß wir also das Puluer mit Secken hinein tragen musten. Weiter hab ich lassen drem hinein legen vnd Bretter darauff/ darnach das Puluer darauff gesatzt/ daß das Wasser ist vnder dem Puluer hindurch gelauffen/ vnd das Puluer haben wir von Ochsen/ Küe vnd Schaaff heudten/ wie wir die in dem Leger bekommen kunden/ oben bedeckt/ das solches wasser must ablauffen/ vnd nit zu dem puluer komen kundt/ also glückts vns das wir die maur sprengten/ vnd jnen jr fürhaben nit halff.
  cs: |-
    Pokud jde o zeď, která je na předchozím vyobrazení u věže označena písmenem `B` v průlomu hradby, i do ní se tehdy u Péronne {Perona} prolomilo a byla odstřelena: stejně jako u věže se vylámala do obou stran, nabila a odpálila. Jakmile jsme však do zdi lámali, prolamovali se nám obránci zezadu vstříc, až jsme se setkali. Svým lámáním se dostali nad nás, prostrčili svým průlomem do našeho pytel s prachem a chtěli jej zapálit. Naši to však zpozorovali a pytel jim rychle z díry vytrhli dříve, než jej stačili zapálit; pak do toho otvoru stříleli vzhůru ze čtyř krátkých pušek {Büchsen}[^1] a prachem tam stále dělali kouř a dým, až je z jejich průlomu vyhnali. S naším lámáním jsme pak ještě několik dní pokračovali a začali ukládat nálož. Když to obránci zpozorovali, svázali slámu, namočili oba konce svazků do síry {schwefel} a smůly {Bech}, zapálili je a házeli k nám, takže jsme nemohli prach v soudcích {Donnen} či sudech donášet dovnitř; tak nám na jeden den vnášení prachu zabránili. Za zdí měli také strouhu přímo proti našemu průlomu, nosili do ní hojně vodu a stále ji vlévali, takže tekla naším průlomem proti nám. Musel jsem proto přes noc dát ušít plátěné pytle a nasypat do nich prach; každý si vzal takový pytel pod kabát a vběhl s ním do díry, a tak jsme prach museli vnášet v pytlích. Dále jsem dal dovnitř položit trámy {drem}, na ně prkna a teprve na ně uložit prach, takže voda protékala pod prachem. Shora jsme prach přikryli volskými, kravskými a ovčími kůžemi, jaké jsme jen v ležení {Leger} sehnali, aby voda stékala a nemohla se k prachu dostat. Tak se nám podařilo zeď vyhodit do povětří a obráncům jejich úmysl nepomohl.
- typ: odstavec
  de: |-
    Solchs thůn ich darumb mit solchem bericht zu schreiben/ das zuuernemen daß also gehandelt ist worden/ vnd nit auß einem draum oder gůt düncken geschehen/ vnd nit in dem werck gewesen/ aber ich mags frei schreiben daß also ergangen ist wie gemelt. Zum andern Zeige ich das auch in meiner beschreibung an/ daß solchs zugedencken genomen werde denen so damit vmbgehn sollen/ wann jnen ein solche sach fürkeme/ daß sie dem der gestalt zu begegnen wüsten/ dann ich hapts vnderhanden gehabt/ vnd befunden was eim der solchs handeln vnd brauchen soll/ zusteht/ darumb ich trewlich warne vnd zum besten vnderweisen vnd richten will.
  cs: |-
    Píši to s takovou podrobností proto, aby bylo zřejmé, že se tak skutečně jednalo a nevzniklo to ze snu nebo pouhého domnění bez skutečné zkušenosti; směle však mohu napsat, že se to stalo právě tak, jak popsáno. Za druhé to ve svém popisu uvádím proto, aby si to vzali k srdci ti, kdo s tím mají zacházet – kdyby je potkala taková příhoda, aby věděli, jak jí čelit. Neboť jsem to měl sám v rukou a poznal jsem, co přísluší tomu, kdo má takové věci konat a užívat; proto věrně varuji a chci co nejlépe poučit a navést.
poznamky:
- n: 1
  text: |-
    Tisk má podle skenu (442) skutečně „mit den kurtzen vier Büchsen“ – nejspíš jen přesmyknutý slovosled za *mit den vier kurtzen Büchsen*, tedy „ze čtyř krátkých pušek (ručnic)“, jaké se hodily do stísněných chodeb; dřívější výklad jako tiskové chyby za *Feuerbüchsen* je nejistý. Ke značce `B` srv. dolní pole dřevořezu na [[5-004v|následující tabuli]].
