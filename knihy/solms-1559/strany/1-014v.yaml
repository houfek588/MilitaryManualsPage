bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Leger zuthůn vnd vorfallen / alles auff sie geweist darbei zuuerstehen ist / was rhu sie haben zu tag vnd nacht / vnd ob es jnen auch möglich sein würd solches zuuerrichten / dann mann hat jetzund wol gesehen / da sie gar wenig zuthůn gehabt / wie sie die sachen verricht haben.
  cs: |-
    ležení {Leger} přihodí a vyskytne, všechno by bylo odkazováno na ně – z čehož lze pochopit, jaký by měli klid ve dne v noci a zda by pro ně vůbec bylo možné to vyřídit; vždyť se už nyní dobře ukázalo, jak vyřizovali věci, i když měli na práci jen velmi málo.
- typ: odstavec
  de: |-
    Das sie aber vermeinen wolten es solten die Regiments Gericht bleiben / vnd alle sachen vnd vnlust biß zu dem endt abhandeln / vnd als dann jnen in die hendt geben / sie die hocheit sein lassen / vnd sie solten jhre Knecht vnnd vnderthanen in dem sein / das wirt gar nit beschehen sonder alle Gericht wurden nider ligen / vnd alle sachen für sie geweist / es wirt jn wol in Beutel tragen aber wie das Kriegßuolck vnnd die Leger regirt würden ist auß erzelten vrsachen wol abzunemen. Deßgleichen so wirt es mit den Reutern / vnd besonder mit den Teutschen / auch in kein weg geschehen / dann sie werden sich dahin nit dringen lassen / das sie vnder ein solches Regiment / vnd Doctorn zu regiren begeben werden. Dann so die Teutschen Reuter jhr Reuter recht nach jhrem alten hergebrachten gebrauch besetzen / so wirt es mit Grauen / Herrn / vnd vom Adel besetzt / als von denen so die Krieg gebraucht vnd verstehen / vnd haben zuuor jhre gesatzte Artickel / mit jhren geordneten straffen vor sich / vnd solten solche ehrliche Leut / der biß in die vier vnd zwentzig oder dreissig sitzen / nit so hoch vnd ehrlich gehalten werden / vnd die Kriegs sachen so wol vnd baß verstehn / vnd so ehrlich vnd recht handeln wolten / als die Auditorn das ist hoch zubedencken / vnd was eim Kriegßherrn daran gelegen sein wirt / auch wer zu solchem General gericht dienlich sein möcht. Darumb ist zu rathen / das man die Justitica laß bleiben wie die von alters geordnet vnd herkomen seind / vnd sehe ein Oberster wol zu / das die recht wol geregirt werden / dann fürwar es ist zu achten das bei den alten Keisern / Königen vnd Kriegßleuten / so solch regirung geordnet vnd gehalten haben / das sie alle fel vnd vrsachen / durch erfarung also gesatzt vnd geordnet haben. Vnd hetten sie es nit vor notwendig vnd gůt angesehen vnd gefunden / sie hetten es nit gemacht / vnd wer so lang / biß noch / nit darbei bliben. Vnd ob man gleich sagen möcht / ja der Feldoberst ist die höchst Person / warumb wöl die nit auch so wol ein Justitien haben / als ein ander Regiment / das hat wol also ein klein ansehen / wer es nit baß versteht. Darauff aber hat es die meinung das der Feldoberster kein eigen Justitien haben sol / dann alle Justitien die seind sein vnd werden im Namen des Krigßherrn so man die nider setzt / außgeruffen / geht gebandt oder gespant / wie man das nennt / darumb so bedarff er kein weiter Gericht / dann die zuuor geordnet seind / die soll der Oberst handhaben / vnd in einer gůten regirung halten / so hat er Gericht gnug
  cs: |-
    Chtěli-li by však tvrdit, že plukovní soudy {Regiments Gericht} mají zůstat, vyřizovat všechny věci a spory až do konce a pak jim je odevzdávat do rukou, ponechat jim svrchovanou moc a sami že by v tom byli jen jejich čeledíni {Knecht} a poddaní – to se naprosto nestane, nýbrž všechny soudy by ustrnuly a všechny věci by se postupovaly jim; jim by to sice neslo do měšce, ale jak by pak byl spravován válečný lid {Kriegßuolck} a ležení, to lze z vyložených důvodů snadno domyslet. Stejně tak se to v žádném případě nestane ani s jezdci {Reutern}, a zvláště s Němci, neboť ti se nedají donutit k tomu, aby se vydali pod takovou správu {Regiment} a pod vládu doktorů. Neboť když němečtí jezdci obsazují své jezdecké právo podle svého starého zděděného obyčeje, obsazují je hrabaty, pány a šlechtici, tedy těmi, kdo prošli válkami a rozumějí jim, a před sebou mají své předem stanovené články {Artickel} s jejich nařízenými tresty; a že by takoví čestní lidé, kterých tam zasedá na dvacet čtyři nebo třicet, neměli být pokládáni za tak vznešené a čestné a neměli rozumět válečným věcem stejně dobře či lépe a jednat tak čestně a správně jako auditoři {Auditorn}, nad tím se je třeba velmi zamyslet – i nad tím, jak na tom bude válečnému pánovi {Kriegßherrn} záležet a kdo by se k takovému generálnímu soudu hodil. Proto je radno ponechat justici {Justitica}[^1] tak, jak byla odedávna zřízena a předávána, a nejvyšší velitel {Oberster} nechť dobře dbá na to, aby byla řádně spravována; neboť vskutku lze soudit, že staří císaři, králové a válečníci {Kriegßleuten}, kteří takovou správu zřídili a zachovávali, všechny případy a příčiny takto ustanovili a nařídili na základě zkušenosti. A kdyby to nebyli shledali nutným a dobrým, nebyli by to zřizovali a nezůstalo by se při tom tak dlouho až dodnes. A i kdyby někdo mohl namítnout: „Vždyť nejvyšší polní hejtman {Feldoberst} je nejvyšší osoba, proč by tedy i on neměl mít svou vlastní justici právě tak jako jiný pluk?“ – to má zajisté na první pohled jakési zdání pravdy pro toho, kdo tomu lépe nerozumí. Na to však platí, že nejvyšší polní hejtman žádnou vlastní justici mít nemá, neboť všechny justice jsou jeho a vyhlašují se, zahajují, zapovídají či soudní šňůrou vymezují[^2] – jak se tomu říká – ve jménu válečného pána, když se soud zasedá; proto nepotřebuje žádný další soud než ty, které jsou již zřízeny – ty má nejvyšší velitel chránit a udržovat v dobré správě, a tak má soudů dost.
poznamky:
- n: 1
  text: Tisk má překlep *Justitica* místo *Justitia*.
- n: 2
  text: |-
    V tisku zkráceně *geht* místo *gehegt* (soudní formule *hegen, bannen und spannen* – soud řádně zahájit, vyhlásit soudní mír pod pokutou a vymezit soudní kruh či lavice).
