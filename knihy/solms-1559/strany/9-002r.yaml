bloky:
- typ: odstavec
  de: |-
    ALler gnedigster Herr/ Ich Philippus Hertzog zů Cleue/ Graue von Marcle/ Herr von Rauenstein/ ewer vnderthenigster williger Diener/ befinde/ daß ich jetzund der zeit mit einem gůten alter beladen/ deßhalben ich besorg/ es sei meines vermögens nicht mehr euch/ nach dem ich dann in meinem hertzen vnnd willen hab zu dienen/ vnd euch an die ort vnd ende nach zuziehen/ da jhr dann zu kriegen vnd zu Krieg willens habt zu Wasser vnd Landt in vilerlei Landen/ der vrsachen/ daß ewer Königreich/ Landt vnd Leut inn vilerlei orten außgebreit seind/ derhalben euch mehr geschefft vnd handlungen zustehen mögen/ dann sonst keinem Herren/ Auch daß ich meines theils das Handtwerck des Kriegs inn meiner jugent/ biß auff den heuttigen tag gebraucht/ darinn ich vil geschickter vnnd tapfferer Leut gesehen hab/ vnd grosse arbeit darauff geleget/ solliche Leut zuerkennen/ auch jhre ehrlichen thaten/ die ich sie hab gesehn volnbringen/ nicht das ich den zehenden theil hab behalten/ sonder so wenig das ich es schier nicht mehr gedencke/ wil ich souil arbeit darauff legen/ vnd in Schrifft bringen zu einer kleinen vnderrichtung/ aller manier des Kriegs zu landt vnd wasser/ auch was darzů gehörig sein wirt/ Dann ich gedenck mein leben werd so lang nit weren euch in solchen hendeln zu dienen/ vorab in allem/ dann fürwar wenig leut wie jung sie seien/ vorhanden/ die das alles sehen werden was in disem Bůch begriffen ist/ aber ich will mich der geschicklicheit nit achten/ daß ichs alles dermassen beschreiben kündt/ wie es dann die sach wol erfordert/ Doch weiß ich gewißlich/ daß es euch nichts schaden kan/ sonder vil helffen biß jr andere leut bekompt/ die in dem fall mehr gesehn/ gelert haben dann ich/ welcher on zweifel vil seind/ weiß auch daß kein Herr in der Christenheit ist/ der solcher geschickter leut mehr vberkomen kan dann jr/ euch vnderthenig bittende wölt solchs in gůtem annemen. Auch aller gnedigster Herr/ dieweil ich von ewerm aller edelsten Geschlecht vilfeltiglich herkom/ dann meines Vatters Můtter ist gewesen ein Schwester Hertzog Philips ewers Anherrn/ von dem edeln Geschlecht Borgund/ deßgleichen ist meiner Můtter Vatter gewesen ein Brůder der Keyserin ewers Anherrn Můtter/ darumb kein wunder ist so ich schon euch zu dienen vnnd wilfarn geneigt bin/ Dieweil nun das groß alter so ich auff mir hab/ macht/ daß ich in solchem meinem fürnemen so ich hab/ eillen muß/ nicht
  cs: |-
    Nejmilostivější pane, já, Filip, vévoda klévský, hrabě z Marky,[^1] pán z Ravensteinu, váš nejponíženější a ochotný služebník, shledávám, že jsem již obtížen pokročilým věkem. Obávám se proto, že už nebudu mít sil vám sloužit, jak to mám v srdci i ve vůli, a následovat vás do míst a končin, kde hodláte válčit a vést válku na vodě i na souši v mnoha zemích – neboť vaše království, země a lid jsou rozprostřeny na mnoha místech, a proto na vás může připadnout více záležitostí a jednání než na kteréhokoli jiného pána. Také jsem sám provozoval válečné řemeslo od mládí až do dnešního dne a viděl jsem v něm mnoho zkušených a statečných lidí; vynaložil jsem velké úsilí, abych takové lidi poznal, i jejich čestné činy, které jsem je viděl vykonat. Nezapamatoval jsem si z toho ani desetinu, nýbrž tak málo, že si na to sotva ještě vzpomenu; přesto chci vynaložit tolik práce, abych to sepsal jako malé poučení o všech způsobech války na souši i na vodě a o tom, co k ní patří. Myslím totiž, že můj život nepotrvá tak dlouho, abych vám mohl v takových věcech sloužit, natož ve všech; vždyť je jistě málo lidí, jakkoli mladých, kteří uvidí všechno, co je obsaženo v této knize. Nechci se ovšem vydávat za tak zručného, že bych to vše dokázal popsat tak, jak by věc žádala. Vím však jistě, že vám to nemůže nijak uškodit, nýbrž vám to bude velmi nápomocné, dokud nezískáte jiné lidi, kteří v té věci viděli a naučili se víc než já – a těch je bezpochyby mnoho. Vím také, že v křesťanstvu není pána, který by takových zkušených lidí mohl získat více než vy. Poníženě vás prosím, abyste to přijal v dobrém. Také, nejmilostivější pane, pocházím mnohonásobně z vašeho přeurozeného rodu: matka mého otce byla sestrou vévody Filipa, vašeho předka, z urozeného rodu burgundského, a otec mé matky byl bratrem císařovny, matky vašeho děda.[^2] Proto není divu, že jsem vám ochoten sloužit a vyhovět. Poněvadž mě však můj vysoký věk nutí, abych s tímto svým záměrem spěchal – nikoli
poznamky:
- n: 1
  text: |-
    *Marcle* – tisková chyba za *Marck* (hrabství Marka), srov. [[9-titul|titulní list]] (*Graue zůr Marck*).
- n: 2
  text: |-
    Matkou Filipova otce Adolfa Klévského, pána z Ravensteinu (1425–1492), byla Marie Burgundská (1393–1463), sestra vévody Filipa Dobrého, prapraděda Karla V. Filipova matka Beatrix z Coimbry byla dcerou Petra, vévody z Coimbry, bratra portugalského krále Eduarda; Eduardova dcera Eleonora, manželka císaře Fridricha III., byla matkou Maxmiliána I., děda Karla V. Petr z Coimbry byl tedy strýcem, nikoli bratrem císařovny – text příbuzenství zjednodušuje.
