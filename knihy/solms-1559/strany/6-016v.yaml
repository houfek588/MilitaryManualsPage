poznamky:
- n: 1
  text: Tisková chyba – 96 zl. 12 bac. + 4 zl. 6 bac. + 17 zl. 9 bac. = 118 zl. 12 bac.; s touto hodnotou souhlasí i součet strany 230 zl. 6 bac.
- n: 2
  text: Tisková chyba – 1434 zl. 6 bac. − 50 zl. = 1384 zl. 6 bac. Jde o čistou částku příjezdného dvorské družiny vévody Mořice.
- n: 3
  text: 2194 zl. 13 bac. + 602 zl. 12 bac. + 423 zl. 14 bac. + 1384 zl. 6 bac. = 4606 zl. přesně (15 bacenů = 1 zlatý); součet tedy potvrzuje opravu z poznámky 2. Saské vyúčtování příjezdného tím končí, následuje braniborský rejstřík.
