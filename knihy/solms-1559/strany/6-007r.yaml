bloky:
- typ: odstavec
  de: |-
    Des alles zu vrkundt haben wir dise verzeichnuß Stat vnd Articul mit vnser eigen handt vnderschriben / vnd mit vnserm auffgetruckten Insigel besigeln lassen / Geben in vnser vnnd des Reichs Statt Speir / am neunden tag Aprilis / Anno / etc. im vierundviertzigsten / vnsers Keiserthumbs im vierundzwentzigsten / vnd vnserer Reich im neunvndzwentzigsten.
  cs: |-
    Na doklad toho všeho jsme tento soupis, stav {Stat} a články {Articul} podepsali vlastní rukou a dali zpečetit svou přitištěnou pečetí {Insigel}. Dáno v našem a říšském městě Špýru devátého dne měsíce dubna léta atd. čtyřicátého čtvrtého, našeho císařství ve dvacátém čtvrtém a našich království v dvacátém devátém [roce].[^1]
- typ: odstavec
  de: |-
    Verung mündtlicher abrede vnd vereinigung / gibt die Keis. Mai. jr Fürs. Gna. auff jr Dafel monatlich dreihundert gulden zu fünfftzehen batzen / oder zu fünffvndzwentzig Stübern gerechnet / zu allem obgemeltem.
  cs: |-
    Podle ústní úmluvy a dohody dává Jeho císařské Veličenstvo Jeho knížecí Milosti na její tabuli {Dafel} měsíčně tři sta zlatých {gulden}, počítaných po patnácti bacenech {batzen} nebo po pětadvaceti stüverech {Stübern}, nad všechno výše uvedené.[^2]
- typ: odstavec
  de: |-
    Item auff zwölff Trabanten so auff seiner Fürstlichen Gnaden leib warten jedem monatlich acht gulden / thůt neuntzig sechs guld.
  cs: |-
    Dále na dvanáct drabantů {Trabanten}, kteří slouží při osobě Jeho knížecí Milosti, každému měsíčně osm zlatých, což činí devadesát šest zlatých.
- typ: nadpis
  uroven: 3
  de: |-
    Muster Register solcher Reutter vnd Reisigen / so der durchleuchtig / hochgeborn Fürst vnd Herr / Herr Moritz Hertzog zu Sachssen / etc. Keis. Maies. Oberster in jrer Maies. dienst fürt / Vnd durch die wolgebornen Edlen / Vesten / Reinharten Grauen zu Solms / etc. vnd Christoffeln von Schawenburg / etc. als verordneten Commissarien bei Franckfurt gemustert / derer Reutter Monat auff Mitwochen den 28. tag Mai / Anno 1544. angefangen.
  cs: |-
    Přehlídkový rejstřík {Muster Register} jezdců {Reutter} a jízdních mužů {Reisigen}, které osvícený a vysoce urozený kníže a pán, pan Mořic, vévoda saský atd., plukovník {Oberster} Císařského Veličenstva, vede ve službě Jeho Veličenstva a které u Frankfurtu přehlédli urození, vznešení a stateční Reinhart, hrabě ze Solmsu atd., a Christoffel von Schawenburg atd. jako ustanovení komisaři {Commissarien}; měsíc [služby] těchto jezdců začal ve středu 28. května léta 1544.
- typ: nadpis
  uroven: 3
  de: Muster Zettel.
  cs: Přehlídková cedule {Muster Zettel}.
