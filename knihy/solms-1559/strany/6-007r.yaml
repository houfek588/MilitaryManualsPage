poznamky:
- n: 1
  text: |-
    Karel V. byl zvolen římským králem roku 1519 a jako španělský král vládl od roku 1516; odtud počítání let „císařství“ a „království“.
- n: 2
  text: |-
    „Verung“ ve smyslu „podle“ (vermöge), viz [[6-004v|list 4v]]. „Tabule“ (Tafel) – příspěvek na knížecí stůl a dvůr.
- n: 3
  text: |-
    Rejstřík je v tisku sázen ve dvou sloupcích; zde je přepsán v pořadí čtení (levý sloupec, pak pravý). Čísla jednotlivých oddílů tisk klade u jména nebo u řádku se zbrojnými koňmi. Kyrysníci, trénní koně a vozy se počítají zvlášť vedle zbrojných koní. Jména osob jsou ponechána v podobě tisku (dnes Otto von Dieskau; „Haugelt von Malritz“ je zřejmě Haubold von Maltitz, ze saského šlechtického rodu). „Vberlengende“ (příplatek) je nejistý termín: patrně částka nad běžný žold vyplacená na uvedený počet koní (srov. součty na [[6-007v|listu 7v]]).
