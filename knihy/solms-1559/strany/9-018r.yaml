sken: 655
stav: prelozeno
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    verbotten sein kein Frawen noch Jungkfrawen zuuergeweltigen. Wann solchs alles geschehen / solt jr ewerm Quartirmeister beuelch geben / daß er die jenigen so in der Statt ligen lassen wölle furieren nach seinem wolbedüncken / Dann ich offtermal gesehen / daß groß todtschläg geschehen seind / wann ein Rot ein Hauß eingenommen / vnd ein ander auch hinein gewölt / welchs alles durch den Quartirmeister verhůt mag werden.
  cs: |-
    zakázat znásilňovat ženy či panny. Když se to vše stane, máte svému kvartýrmistrovi {Quartirmeister} poručit, aby ty, které chce nechat ležet ve městě, ubytoval {furieren} podle svého uvážení. Častokrát jsem totiž viděl, že došlo k velkému zabíjení, když jedna rota {Rot} obsadila dům a jiná do něj chtěla také; tomu všemu může kvartýrmistr zabránit.
- typ: odstavec
  de: |-
    Jch hab wol gesehen wann ein Stat ist gewunnen worden / daß mann mit dem gantzen Hauffen wider hinauß in das alt Leger zog / hab auch wol gesehen daß sie in der Stat blieben / darumb ich euch in dem fal nit rathen kan / anders dann wann jhr ein groß Heer habt / vnd die Stat klein ist / daß jr nit mit gůten růhen darinn ligen kündt / rath ich daß jr wider inn das Leger so es anders wol befestigt ziehet / vnd ein Besatzung in der Stat lasset / auch hinein legen das gewunnen Hauptgůt oder Prouiant.
  cs: |-
    Viděl jsem sice, že když bylo město dobyto, táhlo se s celým vojskem {Hauffen} zase ven do starého ležení {Leger}, ale viděl jsem také, že zůstali ve městě. Proto vám v tom nemohu nic radit, leda tolik: máte-li velké vojsko {Heer} a město je malé, takže v něm nemůžete v klidu ležet, radím vám, abyste táhli zpět do ležení, je-li ovšem dobře opevněno, a ve městě nechali posádku {Besatzung}. Dovnitř dejte také uložit získanou kořist {Hauptgůt} nebo proviant {Prouiant}.
- typ: odstavec
  de: |-
    Wann aber das Leger nicht wol beuestiget / vnnd jhr euch weitter vor den Feinden besorgen must / vnd die Stat weit gnůg were ewer gantz Heer hinein zulegen / rath ich daß jr euch in die Stat legt / dann sonst nicht wol möglich ist das nit der mehr theil des Kriegßuolcks allwegen in der Stat auß vnd ein lauffen / welchs verhůt mag werden wann jr in der Stat ligen.
  cs: |-
    Není-li však ležení dobře opevněno a musíte se nepřítele dál obávat, a je-li město dost prostorné, abyste do něj uložili celé své vojsko, radím vám, abyste se uložili do města. Jinak totiž stěží zabráníte tomu, aby větší část válečného lidu {Kriegßuolcks} neustále nepobíhala do města a z města; tomu lze zabránit, ležíte-li ve městě.
- typ: odstavec
  de: |-
    Auch hab ich verheissen euch anzuzeigen / das ich vor mals gesehen / wann mann einen sturm hat wöllen anlauffen vnd der hauff schon in der Ordnung gestanden / daß mann außgerůffen hat / welcher der erst in der Stat sei / wöl mann jhm ein summa gelts geben / dem andern / vnd dem dritten auch ein solches / das macht die Knecht lüstig / daß ein jeglicher gern das best thůn wil / aber solches stehet inn ewerm willen / darumb möcht jrs thůn oder nicht.
  cs: |-
    Slíbil jsem vám také ukázat, co jsem kdysi viděl: když se mělo vyrazit k útoku {sturm} a houf už stál v šiku {Ordnung}, dali vyhlásit, že kdo bude ve městě první, tomu dají jistou sumu peněz, a podobně i druhému a třetímu. To knechty {Knecht} povzbudí, takže každý rád dělá, co může. To však záleží na vaší vůli, a tak to můžete udělat, nebo ne.
- typ: odstavec
  de: |-
    Jch hab wol gesehen wann mann ein Veldleger im Wintter hat wöllen haben / daß dardurch das Kriegßuolck verlauffen / daß mann verrücken hat müssen / vnd vorab vmb der Fußknecht wegen vnd sonderlich der Teutschen die gantz vbel bekleidet / welche Winters zeiten die Wacht nit erleiden mögen / ist von nöten das als dann die vom Adel die wol bekleidt seind wacht halten / deßhalben die Dopffelsolner sein die sich mit kleidungen wol versehen künden / vnd dannoch nit zu frieden seind / mann leg sie dann inn die Stätt oder Dörffer / darinn sie sich vol sauffen / vnd sonderlich murmeln die Edelleut vnnd Reutter die den Frost vnd Regen hart klagen / nit allein von jr sonder der Roß wegen / Deßhalben von nöten sein wirt / wintters zeiten in ein Wintterleger zu ziehen / damit euch sonst kein vnrath darauß
  cs: |-
    Viděl jsem ovšem, že když se chtělo mít polní ležení {Veldleger} i v zimě, válečný lid se proto rozutekl, takže se muselo odtáhnout, a to především kvůli pěším knechtům {Fußknecht}, zvláště Němcům, kteří jsou velmi špatně oblečeni a v zimním čase nesnesou strážní službu {Wacht}. Je pak nutné, aby stráž drželi šlechtici, kteří jsou dobře oblečeni, a proto i dvojžoldnéři {Dopffelsolner}, kteří se mohou dobře opatřit oděvem, a přesto nejsou spokojeni, dokud je neuložíte do měst nebo vsí, kde se opíjejí. Zvláště reptají šlechtici a jezdci {Reutter}, kteří si tvrdě stěžují na mráz a déšť, a to nejen kvůli sobě, nýbrž i kvůli koním. Proto bude nutné v zimním čase táhnout do zimního ležení {Wintterleger}, aby vám z toho jinak nevzešla
