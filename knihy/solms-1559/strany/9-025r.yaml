list: 25 (9. kniha)
strana: recto
sken: 669
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    einen weiten weg ziehen/ da mann sie villeicht im sand oder sonst spüren möchtet/ söllen die so hindennach ziehen groß Nest haben nachschleiffen/ das mann sie nicht spüren künde/ wann sie an das ort komen/ da sie etlich leut heimlich hinlegen wöllen/ sollen sie gleicher massen mit den Nesten die füßstaffen verkern/ nachuolgents sollen sie ein auff einen hohen baum steigen lassen/ der doch vil pleter vnd nest habe damit mann jn nit sehen kundt/ söllen auch den aller höchsten baum darzů erwelen/ wann es aber mit einem baum nit geschehen mag/ solt jr zwen oder drei nemen damit sie weit vmb sich sehen künden/ vnd vnder einem jeglichen Baum soll einer zu roß halten/ dem er anzeigen künde was er sehe/ Wann nun die andern schon bei der Stat sind/ sollen sie warten biß es tag wirt/ nachuolgents einem etlich Knecht zugeben/ die biß an die schrancken herein lauffen/ vnnd was sie finden vnnd ergreiffen mögen/ fahen/ vnd eilents vor jn hinweck treiben/ vnd wenn die auß der Stat herauß fallen/ vnd jhn die gefangen wider abiagen wöllen/ sollen sie weichen biß sie die Feind an das ort bringen da sie die jren verborgen haben/ welche nicht zu bald herfür wüschen sollen/ biß die feinde für sie hinauß kommen/ alsdan sollen sie mit gůter ordnung herauß fallen/ vnd wann jnen Gott die gnad verleihet daß sie die Feind vberwinden/ sollen sie alle gefangen zusamen thůn vnd auff das eilents wider in jren vortheil ziehen/ dann wann sie lang vmbgiengen möcht villeicht einer enttrunnen sein/ der in die nechst Stat lieff vnd einen lermen macht/ daß jhnen der weg verlegt würde/ möcht dann jnen ein grosser schad darauß eruolgen/ etc.
  cs: |-
    táhnout dlouhou cestou, kde by je snad bylo možné vystopovat v písku nebo jinde, mají ti, kdo jdou vzadu, vláčet za sebou velké větve[^1], aby je nebylo možné vystopovat. Když dojdou na místo, kde chtějí tajně uložit několik lidí, mají stejně tak větvemi zahladit stopy. Potom mají nechat jednoho vylézt na vysoký strom, který však má mnoho listí a větví, aby ho nebylo vidět; mají k tomu vybrat ten nejvyšší strom. Nedá-li se to provést s jedním stromem, máte vzít dva nebo tři, aby viděli daleko kolem sebe. Pod každým stromem má stát jeden jezdec, aby mu hlídka na stromě mohla oznámit, co vidí. Když jsou pak ostatní již u města, mají čekat, dokud nebude den. Potom mají jednomu [muži] přidat několik knechtů {Knecht}, kteří doběhnou až k závorám, a cokoli najdou a mohou chytit, zajmou a rychle to před sebou odženou pryč. Když pak ti z města vyrazí a chtějí jim zajatce znovu odebrat, mají ustupovat, dokud nepřítele nepřivedou na místo, kde ukryli své lidi. Ti nemají vyrazit předčasně, nýbrž až nepřítel přejde kolem nich; teprve potom mají v dobrém šiku {ordnung} vyrazit. A popřeje-li jim Bůh milost, že nepřítele přemohou, mají všechny zajatce shromáždit a co nejrychleji se zase stáhnout na své výhodné místo. Kdyby se totiž dlouho zdržovali, mohl by snad někdo uniknout, doběhnout do nejbližšího města a vyvolat poplach {lermen}, takže by jim byla cesta zatarasena, a pak by z toho pro ně mohla vzejít velká škoda atd.
- typ: odstavec
  de: |-
    Jch muß euch auch anzeigen/ wann jr einen platz oder Stat dardurch oder nit weit daruon ein Wasser fleußt/ vberfallen wöllen/ müßt jr an dem ort da jr an lenden wolt/ wissen wie breit vnd tieff die gräben vnd wie hoch die Maurn seien/ vnnd nach dem jr dann die plätz befindt/ nach dem solt jhr mit leidern vnd andern dingen so jhr darzů brauchen wolt/ gerüst sein/ vnd ewer Volck auch darnach ordnen/ allwegen zehen vngefehrlich zusamen/ vnd allweg einem vnder jnen beuelch geben was sie handeln sollen/ vnd hefftiglich verbieten/ daß sie nichts rauben noch plündern biß sie die Stat erobert haben/ Wann solchs alles geschehen/ solt jr etlich Knecht voran schicken/ wie oben gemelt ist/ darnach die wagen vnd Roß ziehen lassen/ die jnen schiff vnd leittern nachfüren/ nachuolgents soll der gantz hauff in seiner ordnung hernach ziehen/ vnd wann sie nahe zu der stat kommen/ doch so weit daß mann nit hören kündt/ so sollen sie die ledern schifflin/ die jr darzů machen solt lassen/ vnd andere rüstung so zu tragen wern/ abladen/ vnd
  cs: |-
    Musím vám také ukázat toto: chcete-li přepadnout nějaké místo nebo město, jímž nebo nedaleko něhož teče řeka, musíte o místě, kde chcete přistát, vědět, jak široké a hluboké jsou příkopy a jak vysoké jsou hradby. Podle toho, jak místa shledáte, máte být připraveni se žebříky a jinými věcmi, jichž k tomu chcete použít, a podle toho také uspořádat svůj lid: vždy asi po deseti pohromadě a vždy jednomu z nich dát rozkaz, co mají dělat. Máte jim také přísně zakázat, aby nic nebrali ani neplenili, dokud město nedobudou. Když se to všechno stalo, máte poslat několik knechtů napřed, jak bylo výše řečeno, potom nechat jet vozy a koně, kteří za nimi vezou lodě a žebříky, a nakonec má za nimi táhnout celý houf ve svém šiku. Když se přiblíží k městu, avšak jen tak blízko, aby je nebylo slyšet, mají složit kožené čluny[^2], které k tomu máte dát zhotovit, a jiné vybavení, které je třeba nést, a
poznamky:
- n: 1
  text: |-
    *Nest* – větve (*Äste*, dialektově *Näste*); podobně dále *pleter vnd nest* = listí a větve.
- n: 2
  text: |-
    *ledern schifflin* – lehké čluny z kůže napjaté na kostře, které se daly vézt na voze a u příkopu nebo řeky rychle spustit na vodu.
