  de: |-
    Räth vnd Commissarien/ das schadt jm in vil weg/ vnd ist dem obersten gar beschwerlich vnd sehr sorglich. Dann so ein herr die hauptleut vnd dergleichen ämpter selbst besetzen wil/ ist zu besorgen daß es durch der Räth vnd Commissarien angeben/ oder gunst vnd liebnuß geschehe/ so dann das geschicht/ dann ist gůt zu dencken/ wie sie jrem Obersten gehorsam seind/ dann sie gedencken/ Ich hab ein herrn vnd vorderung/ daß ich wol bleiben wil für meinem Obersten/ er darff mich nicht absetzen/ Dann er můß sich vor des herrn vngnad/ vnd der Räth gunst besorgen/ acht sein Obersten nit hoch/ so hat der Oberst auch ein vnwillen darinn/ vnd so dann das geschicht/ So ist gůt zu dencken/ wie es zu geht/ vnd wie ein Oberster wol darmit zu frieden sein kan/ besonder so dieselbigen personn des verstands vnd erfarung nicht seind/ Vnd ein oberster weyß/ daß er mit jm (sein ampt zuuersehn) nit versorgt ist/ vnd der oberst hat gar alte Hauptleut/ die er lange zeit bei jm gehabt vnd gebraucht hat/ die einander kennen/ vnd wissen was sich einer zu dem andern zu vertrawen darff/ dieselbigen můß der Oberst verlassen/ wie wol er sie allezeit vnderhalten hat/ vnd jm solche leut geben lassen/ da er bößlich mit versehen ist/ wie oben gemelt. Darauß kan ein herr wol erkennen/ was für gehorsam vnd versehung darauß geschehen mag/ vnd was eim herrn vnd dem kriegsuolck für sorg darauff steht/ oder stehn mag/ Darumb soll ein herr den Obersten darmit gewalten lassen/ wolt aber ein herr etwan eim gůten gesellen ein vortheil thůn/ so solt derselbig das dem Obersten personlich sagen/ daß jn der Oberst annemen/ vnd das ampt befelhen wöl/ würde er aber ein ampt nit wol wissen zuuersehn/ so kan der herr jm doch bei seinem Obersten ein vortheil verschaffen/ vnd jm befelhen/ daß er sich seines Obersten gehorsam halte. Aber ein Herr soll selbst daruff sehn/ das ein Oberster seine ämpter zum besten/ vnd nit noch freundschafft oder gunst/ besetze/ Darumb ists gůt/ wann der Kriegsherr selbs im feld/ vnd selber Oberster ist/ sicht mit zů/ vnd leßt die schweren sachen für jn komen/ oder mit seim wissen handeln/ da wird ein herr groß gůt vnd nutzen schaffen.
  cs: |-
    rady a komisaře {Commissarien}, škodí mu to v mnoha ohledech a pro plukovníka {obersten} je to velmi obtížné a povážlivé. Chce-li totiž pán hejtmany {hauptleut} a podobné úřady obsazovat sám, lze se obávat, že se to stane na doporučení radů a komisařů nebo z přízně a náklonnosti. A když se to stane, lze si snadno domyslet, jak jsou pak tito lidé svému plukovníkovi poslušní. Myslí si totiž: „Mám pána a přímluvce, takže se před svým plukovníkem udržím; on se mě neodváží sesadit, protože se musí bát pánovy nemilosti a přízně radů.“ Takový člověk si svého plukovníka neváží a plukovník z toho má zase nevoli. Když k tomu dojde, je snadné si představit, jak to chodí a jak s tím plukovník může být spokojen, zvláště nemají-li ti lidé rozum ani zkušenost a plukovník ví, že se na takového při výkonu jeho úřadu nemůže spolehnout. Přitom má plukovník staré hejtmany, které měl dlouho při sobě a užíval je, kteří se navzájem znají a vědí, v čem se jeden na druhého může spolehnout. Ty však musí plukovník opustit, ačkoli je stále vydržoval, a dát si přidělit lidi, s nimiž je zle zaopatřen, jak bylo řečeno výše. Z toho může pán dobře poznat, jaká poslušnost a jaká správa z toho může vzejít a jaká starost z toho pánovi i válečnému lidu {kriegsuolck} hrozí nebo může hrozit. Proto má pán nechat plukovníka v této věci volně jednat. Chtěl-li by pán někdy nějakému dobrému druhovi prokázat přízeň, má to plukovníkovi říci osobně, aby ho přijal a svěřil mu úřad. Kdyby však ten člověk úřad nedokázal dobře zastávat, může mu pán přesto u svého plukovníka zjednat nějakou výhodu a přikázat mu, aby byl svému plukovníkovi poslušný. Pán má ale sám dbát na to, aby plukovník obsazoval své úřady co nejlépe, a ne podle přátelství či přízně. Proto je dobré, je-li válečný pán {Kriegsherr} sám v poli a sám plukovníkem, dohlíží-li na věci a dává-li si těžké věci předkládat nebo je nechává vyřizovat se svým vědomím. Tím pán zjedná veliké dobro a užitek.
- typ: odstavec
  de: |-
    Dann es ist wol zudencken/ wann ein junger oder vnerfarner/ ein solchs schwers ampt hat/ daruff dann grosse sorg steht in Schlachten vnd dergleichen/ das also mit geschicklicheit/ vortheil vnd außforschung zugehn soll/ vnd die person ein solches ampt nit versteht/ oder nie gebraucht hat/ vnd begegnet jhm ein sollicher/ eillender/ schwerer zufall/ dann steht er vor dem hauffen/ wolt gern thůn was er solt/ hett auch woll das Hertz darzů/ weyß aber nicht/ wie er die sach weißlich angreiffen soll/ dieweil er nichts darumb weyß/ so kan nit felhen auß gůtem gemůt můß er sich entsetzen/ vnd so sich dann ein person die das
  cs: |-
    Lze si totiž snadno představit, co se stane, má-li mladý či nezkušený člověk tak těžký úřad, na němž v bitvách a podobných situacích spočívá veliká starost a kde se má postupovat obratně, s výhodou a po průzkumu. Ten člověk takovému úřadu nerozumí nebo ho nikdy nevykonával, a potká ho náhlá, těžká příhoda. Pak stojí před houfem {hauffen}, rád by konal, co má, a měl by k tomu i srdce, neví však, jak věc moudře uchopit, protože se v ní nevyzná. Nemůže to jinak dopadnout: i při vší dobré vůli se musí zděsit. A když se ten, kdo má
