  de: |-
    Räth vnd Commissarien/ das schadt jm in vil weg/ vnd ist dem obersten gar beschwerlich vnd sehr sorglich. Dann so ein herr die hauptleut vnd dergleichen ämpter selbst besetzen wil/ ist zu besorgen daß es durch der Räth vnd Commissarien angeben/ oder gunst vnd liebnuß geschehe/ so dann das geschicht/ dann ist gůt zu dencken/ wie sie jrem Obersten gehorsam seind/ dann sie gedencken/ Ich hab ein herrn vnd vorderung/ daß ich wol bleiben wil für meinem Obersten/ er darff mich nicht absetzen/ Dann er můß sich vor des herrn vngnad/ vnd der Räth gunst besorgen/ acht sein Obersten nit hoch/ so hat der Oberst auch ein vnwillen darinn/ vnd so dann das geschicht/ So ist gůt zu dencken/ wie es zu geht/ vnd wie ein Oberster wol darmit zu frieden sein kan/ besonder so dieselbigen personn des verstands vnd erfarung nicht seind/ Vnd ein oberster weyß/ daß er mit jm (sein ampt zuuersehn) nit versorgt ist/ vnd der oberst hat gar alte Hauptleut/ die er lange zeit bei jm gehabt vnd gebraucht hat/ die einander kennen/ vnd wissen was sich einer zu dem andern zu vertrawen darff/ dieselbigen můß der Oberst verlassen/ wie wol er sie allezeit vnderhalten hat/ vnd jm solche leut geben lassen/ da er bößlich mit versehen ist/ wie oben gemelt. Darauß kan ein herr wol erkennen/ was für gehorsam vnd versehung darauß geschehen mag/ vnd was eim herrn vnd dem kriegsuolck für sorg darauff steht/ oder stehn mag/ Darumb soll ein herr den Obersten darmit gewalten lassen/ wolt aber ein herr etwan eim gůten gesellen ein vortheil thůn/ so solt derselbig das dem Obersten personlich sagen/ daß jn der Oberst annemen/ vnd das ampt befelhen wöl/ würde er aber ein ampt nit wol wissen zuuersehn/ so kan der herr jm doch bei seinem Obersten ein vortheil verschaffen/ vnd jm befelhen/ daß er sich seines Obersten gehorsam halte. Aber ein Herr soll selbst daruff sehn/ das ein Oberster seine ämpter zum besten/ vnd nit noch freundschafft oder gunst/ besetze/ Darumb ists gůt/ wann der Kriegsherr selbs im feld/ vnd selber Oberster ist/ sicht mit zů/ vnd leßt die schweren sachen für jn komen/ oder mit seim wissen handeln/ da wird ein herr groß gůt vnd nutzen schaffen.
  cs: |-
    rady a komisaře {Commissarien}, škodí mu to v mnoha směrech a pro plukovníka {obersten} je to velmi obtížné a povážlivé. Neboť chce-li pán hejtmany {hauptleut} a podobné úřady obsazovat sám, lze se obávat, že se to děje na doporučení radů a komisařů nebo z přízně a náklonnosti; a když se tak stane, lze si snadno domyslet, jak jsou pak poslušní svému plukovníkovi. Myslí si totiž: „Mám pána a přímluvce, takže před svým plukovníkem obstojím, on si mě nedovolí sesadit, protože se musí bát pánovy nemilosti a přízně radů.“ Takový člověk si svého plukovníka neváží, plukovník k němu zase chová nevoli, a když k tomu dojde, je snadné si představit, jak to pak vypadá a jak s tím může být plukovník spokojen – zvláště nemají-li ti lidé rozvahu ani zkušenost a plukovník ví, že se na takového v zastávání jeho úřadu nemůže spolehnout. Přitom má plukovník dávné osvědčené hejtmany, které měl dlouho při sobě a osvědčil si je, kteří se navzájem znají a vědí, v čem se jeden na druhého může spolehnout; ty však musí plukovník opustit, ačkoli je vždy vydržoval, a dát si vnutit lidi, s nimiž je zle opatřen, jak bylo výše řečeno. Z toho může pán dobře poznat, jaká poslušnost a správa z toho může vzejít a jaké nebezpečí z toho pánovi i válečnému lidu {kriegsuolck} hrozí nebo může hrozit. Proto má pán nechat plukovníka jednat v tom volně; kdyby však pán chtěl někdy nějakému dobrému druhu {gesellen} prokázat přízeň, má to říci plukovníkovi osobně, aby ho přijal a svěřil mu úřad – kdyby však ten člověk úřad neuměl dobře zastávat, může mu pán přesto u svého plukovníka zjednat výhodu a přikázat mu, aby byl svému plukovníkovi poslušný. Pán však sám má dbát na to, aby plukovník obsazoval své úřady co nejlépe, a ne podle přátelství či přízně. Proto je dobré, když je válečný pán {Kriegsherr} sám v poli a je sám nejvyšším velitelem, dohlíží na věci a dává si těžké případy přednášet nebo je nechává vyřizovat s jeho vědomím; tím pán zjedná veliké dobro a užitek.
