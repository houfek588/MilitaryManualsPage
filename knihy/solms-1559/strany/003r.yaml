  cs: |-
    Neboť lze snadno pochopit, že má-li mladý či nezkušený člověk tak těžký úřad, na němž spočívá veliká odpovědnost v bitvách a podobných situacích – kde se má jednat s obratností, výhodou a průzkumem –, a ten člověk takovému úřadu nerozumí nebo ho nikdy nevykonával, a potká ho náhlá, těžká příhoda: pak stojí před houfem {hauffen}, rád by konal, co má, a měl by k tomu i srdce, neví však, jak se věci moudře chopit, protože o ní nic neví. Pak nemůže jinak, než že i při dobré mysli ztratí rozvahu; a když se ten, kdo má
