bloky:
- typ: odstavec
  de: |-
    Wann nun also bei allen Stätten die Schiffleut dermassen verordnet / vnd bestellt werden / vnnd sich der jeder selbst mit notturfft der Schiff / auch sein Knechten / welch jeder zu einer geladen Schiffart bedürfftig / versehen haben / Als mag der greydt / so bei den bestimpten Stätten im vorrath ligt / abgewechselt / vnd vnuerfürter Schiff von einem Flecken zu dem andern fürderlich furt gefürt werden / nemlich der gestalt: Ich will setzen daß der Schiffman so zu Ingolstatt verordnet vnd bestellt ist / seine 2. Schiff / der jedes vngefehrlich 60. oder 70. schaff / wie vorgemelt / an getreydt ertregt / geladen hett / soll hinzwischen seine roß / inhalt meins vorigen anzeigens / damit er bei den nechst verordneten Flecken vnder jm / als zu Regenspurg ligende / desselben Schiffmans schiff eins widerumb herauß fůren mag / hinab auff dem landt gehn lassen / Also daß dieselben roß eben des tags gen Regenspurg / daran er auch mit der geladen schiffart einer antreffen vnd ankommen mag / damit er des andern tags seim nachgesetzten Schiffman / das geladen schiff gegen den leeren / welchs er wider herauff / vffs lengst in dreien tagen treiben / mag vberantworten / wie dann zu stund an der ander Schiffman / sich allermassen mit verfürung desselben / vnd also ein jeder durchauß am wasser abgewechselt halten sol / nemlich das nach des nechsten Flecken Schiffman / die ander alle ein geladens vnd ein ledigs schiff vor der hand haben / damit kein durchauß abwechselung für vnd für dermassen beschehen / daß bei gleicher wasser in 12. tagen vngefehrlich 12. schiffart treydts / der jede / wie gemelt / in die 70. schaff treydts ertragen gen Ofen / oder derselben orten nach einander ankommen. Möcht aber einer sagen / Wie / wann bei der ersten Stat / also auch der nachuolgenden an getreydt zerrun / vnd nichts mehr vff denselben kasten vorhanden / alßdann möcht abwechselung vnd verenderung dermassen wie angezeigt / nit beschehen? Darzů gib ich die antwort / daß solchs in dem weg / da die kasten alle mit gleicher anzal am getreydt versehen / vnd sonderlich der erst mit eim mehrern vorrat staffiert / gentzlich verhüt ist / darumb sollen auch (wie vor gesagt) die kasten zeitlich vnd zuuor mit aller notturfft gespeißt vnd versehen sein. So man nun dermassen in die fert vnd abrechnung kompt / Hat ein jeder leichtlich zugedencken / was trefflicher vorrat allein in monats frist hinab gen Ofen gefürt / vnd eim kriegsuolck vberlieffert werden möcht. Daß dann die 12. schiffart / je eine vor 70. schaff gerechnet / thůt 840. schaff. Nun wigt ein schaff weytzen oder Korn Ingolstätter gewich 8. Centner / daran geht ab wie ich das probiert vngefehrlich dem Müller vor seine mühe vnnd lohn der 16. theil an disem getreyde / das thůt 50. pfundt / vnd bleiben noch an Meel 750. pfundt.
  cs: |-
    Když jsou tedy ve všech městech lodníci takto ustanoveni a najati a každý se sám opatřil vším potřebným pro lodě i pacholky, jichž je k plavbě s nákladem zapotřebí, lze obilí[^1], které leží v zásobě v určených městech, předávat střídavě a bez odplouvání lodí je rychle dopravovat z jednoho místa k druhému, a to takto. Dejme tomu, že lodník ustanovený a najatý v Ingolstadtu naložil své 2 lodě, z nichž každá uveze přibližně 60 nebo 70 korců {schaff} obilí, jak bylo uvedeno výše. Mezitím má podle mého předchozího pokynu poslat po souši dolů své koně, aby mohl od nejbližšího určeného místa pod sebou, totiž od Řezna, odvézt zpět nahoru jednu z lodí tamějšího lodníka. Koně mají do Řezna dojít téhož dne, kdy tam dorazí i on s jednou naloženou lodí, aby druhého dne mohl následujícímu lodníkovi předat naloženou loď výměnou za prázdnou, kterou nejpozději do tří dnů vytáhne zpět nahoru. Hned nato se má stejně zachovat druhý lodník při odvozu té lodi, a tak každý podél celé řeky ve střídání: počínaje lodníkem nejbližšího městečka mají všichni ostatní po ruce jednu loď naloženou a jednu prázdnou, aby [mohlo] docházet k plynulému střídání[^2] stále dál. Za stejného stavu vody tak za 12 dní připluje do Budína {Ofen} či do tamních končin jeden po druhém přibližně 12 lodních nákladů obilí, z nichž každý, jak bylo řečeno, uveze kolem 70 korců. Kdyby však někdo namítl: „Co když v prvním městě i v následujících dojde obilí a v jejich sýpkách už nic nezůstane? Pak by se střídání a výměna, jak byla popsána, nemohly konat!“ Na to odpovídám, že tomu se zcela předejde tím, že všechny sýpky budou zásobeny stejným množstvím obilí a ta první ještě větší zásobou; proto mají být také sýpky (jak již bylo řečeno) včas a předem zásobeny a opatřeny vším potřebným. Když se tedy takto rozjede plavba a výpočet, snadno si každý domyslí, jak velkou zásobu by bylo možno jen za měsíc dopravit dolů do Budína a dodat válečnému lidu {kriegsuolck}. Neboť 12 lodních nákladů, počítá-li se každý po 70 korcích, činí 840 korců. Jeden korec pšenice nebo žita ingolstadtské váhy pak váží 8 centů {Centner}; z toho podle mé zkoušky ubude mlynáři za jeho práci a mzdu přibližně 16. díl tohoto obilí, to činí 50 liber {pfundt}, a zbývá ještě 750 liber mouky.
poznamky:
- n: 1
  text: |-
    Tisk má tiskařskou chybu „greydt“ místo „getreydt“, na konci listu též „gewich“ místo „gewicht“.
- n: 2
  text: |-
    Tisk má zjevně chybnou negaci „damit kein durchaus abwechselung … beschehen“ (místo „ein“ či „fein“, tj. aby plynulé střídání mohlo probíhat).
