sken: 271
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    sie alle verseumpt wirt / er soll jn das auch sagen daß er das darumb thůt / damit ers wisse zuuerantworten / daß er sie lern vnd exempel geb daß sie lernen sorgfeltig sein / ob sie in solch versehung auch forter kommen werden daß sie dergleichen sorgfeltig seien. Darumb soll ein Zeugmeister sie sonder andere neben jm auch lernen vnd vnderrichten / so dient er seim Herrn wol / vnd dienen jm solche personn gern / gehorchen / förchten vnd lieben jn / Er sol sie zu seiner Tafeln nemen / tag vnd nacht souils sein kan bei jm behalten / sie sollen auch jre Zelt vnd Losament / zu nacht bei dem Zeugmeister haben vnd ligen.
  cs: |-
    ně všechny zanedbáno; má jim také říci, že to činí proto, aby se z toho uměl zodpovídat, aby je vyučil a dal jim příklad, nechť se naučí být pečliví, kdyby v budoucnu také přišli do takového úřadu, aby byli stejně starostliví. Proto je má zbrojmistr {Zeugmeister} vedle sebe obzvlášť před jinými učit a poučovat; tak dobře poslouží svému pánu a takové osoby mu budou sloužit rády, budou jej poslouchat, bát se ho i milovat jej. Má je brát ke svému stolu, dnem i nocí je mít u sebe, jak jen to bude možné, a i jejich stany a ubytování {Losament} mají v noci stát a být u zbrojmistra.
- typ: odstavec
  de: |-
    Darumb soll ein Herr sich selbst bedencken was jm auff der Arcolorei steht / besonder zu disen zeiten wie es jetzt gehet / dann wann ein Herr eim aufflegt daß er nit tragen kan / ist die versaumnuß / nachteil vnd schaden des Herren / Darumb soll ein Herr das wol bedencken vnd versehen / wiewol mann auch befindt / daß die Zeugmeister vnd dergleichen verwalter sich zuuil vndernemen wöllen / alle sachen allein versehen daß jn nit zuthůn ist / mögen kein andern bei jn leiden / gönnen auch keinem andern nichts / So ein Herr das von eim vernimpt soll er jm das nit gestatten / vnd die gefahr bestehn wie oben gemelt / sonder er soll jm die notturfft ansagen / Er wöl es also haben / vnd seiner Ordnung also nachkomen. Dann mein bedencken vnd trewer Ratschlag ist / daß ein Herr sein Geschütz wol spandt / damit er fürderlich von den Feinden vnd weg komen mag / mit person sich darzu geschickt mach / damit zu eillen vnd zu treiben sei / dan eiln ist ein grosser vorteil in vilen sachen in disem spil / wie man des vil findt in den Historien der alten Kriegshandlungen / vnd auch noch teglich geschicht.
  cs: |-
    Proto má pán sám uvážit, co všechno mu závisí na dělostřelectvu {Arcolorei}, zvláště v dnešní době, jak to nyní chodí; neboť uloží-li pán někomu břemeno, jež nemůže unést, jde zanedbání, újma i škoda na pánův vrub. Proto to má pán dobře promyslet a zařídit, třebaže se také shledává, že si zbrojmistři a podobní správci chtějí brát na sebe příliš mnoho a obstarávat všechno sami, ačkoli to nezvládnou; nesnesou vedle sebe nikoho jiného a ani jinému nic nepřejí. Uslyší-li pán o někom takovou věc, nemá mu to dovolit ani podstupovat nebezpečí, jak řečeno výše, nýbrž má mu oznámit, co je třeba: že to tak chce mít a že se má řídit jeho řádem. Neboť mé mínění a věrná rada je, aby pán svá děla {Geschütz} dobře zapřáhl, aby se mohl rychle dostat od nepřátel pryč,[^1] a zařídil se s takovými osobami, aby se dalo spěchat a hnát kupředu; vždyť spěch je v tomto válečném díle v mnoha věcech velkou výhodou, jak se hojně nalézá v dějinách dávných válečných činů a jak se i dnes každodenně děje.
- typ: odstavec
  de: |-
    Aber dem Herrn gefelts wol wan einer kompt / sich alle sachen außzurichten vndersteht / schön daruon redt / spricht : Herr es ist nicht von nöten daß jr ein besonder person darzů ordnet / spart die Besoldung ich will das wol außrichten / oder stifft ein andern an der das vor jn redt Das ist nit gůt in solchen sorgfeltigen Amptern daran vil gelegen ist / gemeinlich wer gern vil Ampter hat der wolt jr auch gern vil geniessen vnd darzů finantzen / Das soll ein Herr wol bedencken / was jhm vnd seinem Kriegsuolck vor versaumnuß darauff steht / vnd wie sein Kriegsuolck dardurch geschetzt wirt / das alles dem Herren nit zu gůtem kompt / derhalben ist gůt das ein Herr seine Ampter wol versehe / vnd geb den ein Ordnung jrer versehung / halt hart darob / gestat jnen kein finantzen noch schatzung am Kriegsuolck / noch an denen die zu dem Kriegsuolck gehörn vnd die müssen vnderhalten.
  cs: |-
    Pánovi se však líbí, když někdo přijde, uvolí se všechno zařídit, pěkně o tom hovoří a říká: „Pane, není třeba, abyste k tomu ustanovoval zvláštní osobu, ušetřete žold {Besoldung}, já to dobře obstarám,“ anebo navede jiného, aby to za něj přednesl. To není dobré v takových úřadech vyžadujících péči, na nichž mnoho záleží; obyčejně kdo má rád mnoho úřadů, ten by z nich také rád mnoho těžil a k tomu prováděl finty {finantzen}. Pán má dobře uvážit, jaké zanedbání z toho hrozí jemu i jeho válečnému lidu {Kriegsuolck} a jak tím bývá jeho válečný lid odírán – to vše pánovi k dobrému neslouží. Proto je dobré, aby pán své úřady dobře obsadil, dal jim řád jejich správy, přísně na něj dbal a nedovolil jim žádné finty ani vymáhání poplatků na válečném lidu ani na těch, kteří k válečnému lidu náležejí a musejí jej vydržovat.[^2]
poznamky:
- n: 1
  text: |-
    V tisku „von den Feinden vnd weg komen mag“ (dosl. od nepřátel a pryč).
- n: 2
  text: |-
    Těmi, kdo „k válečnému lidu náležejí a musejí jej vydržovat“, se rozumějí buď poddaní a zásobovači, nebo trén a pomocníci nesoucí břímě vojska.
