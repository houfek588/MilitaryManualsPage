stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    werden sie bald vneins/ daß sie selbst vnder einander lermen haben/ wie offt beschehen.
  cs: |-
    se brzy znesváří, takže mezi sebou samými vyvolají poplach {lermen}, jak se často stalo.
- typ: odstavec
  de: |-
    Wann der Oberst Feldhauptman Stät/ Schloß oder Flecken erobert/ die sich ergeben/ soll er disen Obersten allweg mit etwas verehrung begaben/ es sei roß/ gelt/ kleider/ kleinet/ silbergeschier/ Fůtterung oder prouiant/ damit er dester williger bleibe.
  cs: |-
    Dobude-li nejvyšší polní hejtman {Oberst Feldhauptman} města, zámky nebo městečka, která se vzdají, má tohoto plukovníka {Obersten} vždy obdarovat nějakým čestným darem {verehrung} – ať koněm, penězi, šatstvem, klenotem, stříbrným nádobím, pící nebo proviantem {prouiant} –, aby zůstal o to ochotnější.
- typ: odstavec
  de: |-
    Alles was der Oberst Feldhauptman vnder disem Obersten haben will/ soll er dem Obersten ansagen lassen/ der soll volgents mit den seinen zuthůn verschaffen.
  cs: |-
    Vše, co chce nejvyšší polní hejtman od tohoto pluku mít, má dát plukovníkovi oznámit; ten pak má zařídit, aby to jeho lidé vykonali.
- typ: odstavec
  de: |-
    Es möchte auch einer vnder disem Regiment der massen vbel handeln/ der Oberst liesse jn gleich an leib vnd leben straffen/ wan es aber die notturfft zuthůn nit eillents erfordert/ so strafft er mit Recht.
  cs: |-
    Někdo z tohoto pluku {Regiment} by se také mohl dopustit tak zlého činu, že by jej plukovník dal ihned potrestat na hrdle; nevyžaduje-li to však nutnost vykonat spěšně, potrestá jej soudně {Recht}.
- typ: odstavec
  de: |-
    Wiewol aber diser Oberster/ wie in seinem anfang gemelt/ sein eigen Regiment hat/ mag doch der Oberst Feldhauptman vil vnder disem Regiment/ so sich inn harter straff verwirckt hetten/ begnaden/ doch seinem Obersten seiner gerechtigkeit on schaden.
  cs: |-
    Ačkoli má tento plukovník, jak bylo řečeno na začátku, svůj vlastní pluk, může nejvyšší polní hejtman přesto mnohé z tohoto pluku, kteří by propadli přísnému trestu, omilostnit, ovšem bez újmy na právech jejich plukovníka.
- typ: odstavec
  de: |-
    In kurtzen jarn ist ein gebrauch beim Römischen Keiser/ König von Franckreich/ vnd andern auff gestanden/ daß vnder einem Hauffen Lantsknecht/ vier/ fünff oder mehr Obersten gewesen sein/ für einem solchen Regiment hůt sich ein jeder Kriegsherr auffs aller höchst/ angesehen/ es wircket nichts dann vnwillen/ zwitracht/ wenig außrichtung/ vnd dem herren grossen vberflüssigen/ vnnötigen vnkosten.
  cs: |-
    V posledních letech vznikl u římského císaře, francouzského krále i jinde zvyk, že u jednoho houfu {Hauffen} lancknechtů {Lantsknecht} bývali čtyři, pět i více plukovníků. Takového velení[^1] ať se každý válečný pán {Kriegsherr} co nejvíce varuje, neboť nepřináší nic než nevoli, sváry, málo užitku a pánovi velké, zbytečné a nepotřebné náklady.
- typ: odstavec
  de: |-
    Diser Obester soll gantz ernstlich/ wann er durch den Feldhauptman oder andere erferet/ wie starck das volck in einer besatzung ist versehen/ daß er dem volck in der belegerung gemest/ das geschütz in der schantzen tag vnd nacht verwachen vnd verwaren lasse/ damit er die außfell vber das geschütz verhüte.
  cs: |-
    Jakmile se tento plukovník[^2] od polního hejtmana nebo od jiných dozví, jak silný je lid v obléhaném místě {besatzung}, má co nejbedlivěji zařídit, aby úměrně síle tohoto lidu dával dnem i nocí střežit a chránit děla {geschütz} v šancích {schantzen}, a zabránil tak výpadům na děla.
poznamky:
- n: 1
  text: |-
    „Regiment“ zde znamená velení, správu (mnohovládí několika plukovníků nad jedním šikem).
- n: 2
  text: |-
    V tisku tisková chyba „Obester“ místo „Oberster“; „gemest“ ve významu „gemäß“ (úměrně, přiměřeně).
