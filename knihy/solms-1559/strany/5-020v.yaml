    Celostránkový dřevořez natočený o 90° na šířku, s letopočtem „1559.“ u pravého okraje a signaturou „.BF.“ u levého okraje: čtyřúhelníkový zemní srub s oblými baštami na třech stranách osazenými děly a s dlouhým krytým přístupovým záhybem a dřevěným mostem na čtvrté straně; uvnitř prostranství děla a vojáci podél vodoteče a vnějších zákopů.
