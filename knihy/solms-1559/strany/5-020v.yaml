    Celostránkový dřevořez otočený o 90° (letopočet „1559.“ vpravo, monogram „BF“ vlevo) k [[5-021r|čtvrtému srubu]]: čtverhranný srub s půlkruhovými bočními obranami uprostřed tří stran, osazenými děly; na čtvrté straně (vlevo) zahnutý krytý vchod. Uvnitř dřevěný most přes potok, děla a vojáci.
