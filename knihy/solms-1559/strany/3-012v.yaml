bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    gemacht sein wan man ein nagel zeucht daß das gestel an den Pferden bleibt vnd der wagen ledig ist / also streicht sich die Wagenburgk all auff ein seiten mit grossem vnd kleim geschütz / auch fürt man wagen mit schirmen / hat einer drei löcher darinn legt man dopel hacken so mann der hat / mag man die auch in die Wagenburgk eintheilen darnach mann der vil oder wenig hat / vnd die handtschützen also darhinder auch ein getheilt.
  cs: |-
    udělán tak, aby po vytažení čepu zůstal podvozek u koní a vůz stál samostatně; takto se celá vozová hradba {Wagenburgk} postřeluje na jedné straně velkými i malými děly {geschütz}. Vozí se také vozy se štíty {wagen mit schirmen},[^1] z nichž každý má tři otvory; do nich se kladou dvojité hákovnice {dopel hacken}, jsou-li k dispozici – i ty lze rozdělit do vozové hradby podle toho, zda jich je mnoho či málo, a za ně se rovněž rozdělí střelci {handtschützen}.
- typ: odstavec
  de: |-
    Vnnd so er wirt die Wagenburg vmb das Leger schlagen / soll er dieselbig außrückung auch machen / dz gibt gůt ordnung / wo er aber wolt nicht also außrücken mit vilen wagen / soll er doch mit etlichen ein kropffung hinauß vor die andern wagen machen / vnnd das geschütz darein zu streichen stellen mit den wagen / da das geschütz vnd die doppelnhacken auff sind / wo das geschütz steht da soll ers lassen vergraben darmit die büchsen sicher vnd frei stehen. Wie ich nun vermein daß die außrückung von beiden theilen zu der streich sein sol zu ziehen vnd zu Legern / deßgleichen die wagen mit dem geschütz wil ich hernach in ein figur augenscheinlich auffreissen.
  cs: |-
    A bude-li rozbíjet vozovou hradbu kolem ležení {Leger}, má provést totéž vysunutí – to vytváří dobrý pořádek. Kdyby však nechtěl takto vybočovat s mnoha vozy, má přece s několika vozy udělat před ostatními vozy vysunutý zlom {kropffung} ven a do něj postavit k postřelování děla s vozy, na nichž jsou děla a dvojité hákovnice; a tam, kde děla stojí, má dát vykopat zákop, aby děla {büchsen} stála bezpečně a volně. Jak si pak představuji, že má být vysunutí z obou stran k boční palbě při tažení i při táboření, jakož i vozy s děly, to dále názorně vyobrazím.
- typ: odstavec
  de: |-
    Vnd so mann also wirt die Wagenburg gebrauchen zu farn vnd zu legern / soll der Wagenburgmeister mit dem Feldmarschalck vnd dem Zeugmeister vor ziehen / helffen das leger schlagen / besehen wie er sein Wagenburgk stellen vnd ordnen wöl / vnd wie er sicht daß die Regiment zu roß vnd fůß gequartiert sind / darnach sol er auch die wagen ordnen das vor ein jedes quartier seiner leut wagen komen / damit ein jeder sein wagen möcht bei jm haben / es soll der Feldmarschalck das Leger darnach schlagen vnd quartiern das sich die Wagenburgk darzů reim.
  cs: |-
    A bude-li se tedy vozová hradba používat k jízdě i k táboření, má mistr vozové hradby {Wagenburgmeister} táhnout napřed s polním maršálkem {Feldmarschalck} a zbrojmistrem {Zeugmeister}, pomáhat rozbít ležení a prohlédnout si, jak chce svou vozovou hradbu postavit a uspořádat; a jak vidí, že jsou pluky {Regiment} jízdní i pěší ubytovány, podle toho má také seřadit vozy, aby před každý kvartýr {quartier} přišly vozy jeho lidí a každý mohl mít svůj vůz u sebe. Polní maršálek pak má ležení rozbít a rozdělit na kvartýry tak, aby se k tomu vozová hradba hodila.
- typ: odstavec
  de: |-
    Wann sichs dann also wirt zůtragen daß mann muß in der Wagenburg ziehen vnd ligen / sollen alle wagen dem Wagenburgmeister vnderworffen vnd gehorsam sein / alle die besoldung auff jhre wagen haben sollen jhre wagen also inn der ordnung des Wagenburgkmeisters bleiben lassen / vnd keiner ein darauß vor sich selbst nemen / bedarff aber einer seines wagen zu der fütterung oder sonst etwas zu hollen / soll er den Wagenmeister darumb ansprechen / der soll jm daß verfolgen / es wer dann das es in der not wer oder sich der were versehen / vnd so er den dann gebrauchen wirt mit verwilligung / sol er so bald er kompt inn die Wagenburgk da er jhn genommen hat / wider stellen / also sind alle wagen die besoldung haben / dem Wagenburgkmeister befolhen / sonder die zu der Arcolorei gehörn / Diß ist nun das meist vnd fürnembst stück das eim Wagenburgmeister zuuersehn vnd seim ampt gebürt / darumb sol ein solcher ein ansehlich person sein die verstandt hat / dann es ist an jm etwas gelegen.
  cs: |-
    Kdyby pak došlo k tomu, že by bylo třeba táhnout a ležet ve vozové hradbě, mají být všechny vozy mistru vozové hradby podřízeny a poslušny; všichni, kdo pobírají žold {besoldung} na své vozy, mají své vozy nechat takto v sestavě určené mistrem vozové hradby a nikdo z ní nesmí žádný svévolně vyjímat. Potřebuje-li však někdo svůj vůz na píci {fütterung} nebo aby pro něco dojel, má o to požádat vozmistra {Wagenmeister}, který mu jej vydá – ledaže by bylo zle či se očekával boj; a když jej pak se svolením použije, má jej ihned po návratu postavit zpět do vozové hradby tam, odkud jej vzal. Takto jsou všechny vozy, na něž se bere žold, svěřeny mistru vozové hradby, kromě těch, které náležejí k dělostřelectvu {Arcolorei}. Toto je tedy nejdůležitější a nejhlavnější věc, kterou má mistr vozové hradby obstarávat a která přísluší jeho úřadu; proto to má být vážená osoba, která má rozum, neboť na něm mnoho záleží.
poznamky:
- n: 1
  text: |-
    Tzv. štítové vozy (*Schirmwagen*), tj. vozy opatřené svislou prkennou zástěnou se střílnami.
