  popis: |-
    Celostránkový dřevořez rozdělený na dvě pole („A“ a „B“):
    • Horní pole („A“): obléhací baterie s koši, pikami a dvěma děly na hliněném rondelu před městskou zdí s nárožní věží; kamenný sokl okrouhlé bašty nese na čelní štítkové pásce letopočet „1558“ a z obou stran ze suchého příkopu k němu ústí podzemní štoly pod úpatí zdiva (u pravého vchodu snad značka rytce).
    • Dolní pole („B“): rozkreslený podzemní půdorys pod přímou hradební zdí vlevo a pod okrouhlou baštou („rondel“) vpravo, podepsaný uprostřed dole monogramem „BF“. Z podzemní štoly (vstup u zdi označen drobným písmenem „m“) vedou křížové komory podél zdiva i pod středem a rameny kříže uvnitř rondelu, nabité řadami soudků prachu (na přechodu pravého kříže vidět i pytle), zajištěné u vstupů příčnými uzavíracími trámy.
