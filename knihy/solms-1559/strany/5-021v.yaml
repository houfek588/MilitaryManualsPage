  popis: |-
    Celostránkový dřevořez orientovaný na výšku, signovaný dole uprostřed „BF“ a uvnitř čela horní hranaté bašty zrcadlově rytým letopočtem „1559“: kruhový zemní srub s vnějším příkopem a valem, opatřený na třech stranách (nahoře, vlevo a vpravo) hranatými čtvercovými baštami po dvou dělech a dole zahnutým krytým vchodem s potokem a dřevěným mostem na nádvoří (vlevo dole spřežení tažné síly vyváží či přiváží dělo).
