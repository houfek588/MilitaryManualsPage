  popis: |-
    Celostránkový dřevořez na výšku (monogram „BF“ dole, letopočet „1559“ zrcadlově v horním stanovišti) k [[5-022r|pátému srubu]]: kruhový srub s vnějším příkopem a valem. Stanoviště pro děla jsou zapuštěna dovnitř kruhu (nahoře, vlevo a vpravo, po dvou dělech), dole je zalomený krytý vchod; uvnitř dřevěný most přes potok, děla a vlevo dole potah s dělem.
