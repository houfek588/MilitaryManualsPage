  popis: |-
    Celostránkový dřevořez o dvou polích:
    • Horní pole („.E. .a. 1558.“ uprostřed nahoře, monogram „BF.“ vlevo dole): město s věžemi, hradbami a obrněnci za proutěnými koši; zákopem před zaobleným palisádovaným rondlem či pevnůstkou horníci vynášejí vykopanou zeminu na hromadu u zákopu pomocí neckového trakaře, čtyřkolového bedýnkového vozíku taženého lanem a pleteného koše – v popředí leží hornické nástroje (špičáky, motyky, kladivo, necek a podkovy).
    • Dolní pole („F“): vysoká nechráněná městská zeď nad hlubokým příkopem s okrouhlou věží a obránci na ochozu; z úpatí svahu vede otevřené klenuté ústí široké podkopové štoly, v níž pět horníků odváží zeminu na kolečkách (trakařích), dole průřez poškozenou patou přední zdi.
