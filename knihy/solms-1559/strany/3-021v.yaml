- typ: odstavec
  de: |-
    Summasummarum / Prech vnnd Feldgeschütz thůt neunerlei Sort vnd stück 72.
  cs: |-
    Celkový součet: průlomových a polních děl to činí devatero druhů a 72 kusů.
- typ: odstavec
  de: |-
    Im ersten Capitel wirt deren sort vnd gattung jede Büchsen insonderheit / wie schwer vnd lang sie sein / wieuil sie eisens schiessen / vnnd was jeder sort anheims zuerhalten / oder im fall der notturfft mit 100. kugeln vnd so schwer puluers in ein Feld zufürn / allenthalben sonder zugehörung sei angezeigt vnd beschriben.
  cs: |-
    V první kapitole bude o každém děle {Büchsen} z těchto druhů a tříd jednotlivě vyloženo a popsáno, jak je těžké a dlouhé, jak těžkou železnou kouli střílí a co je ke každému druhu třeba k udržování doma nebo v případě potřeby k vypravení do pole se 100 koulemi {kugeln} a stejně těžkým množstvím střelného prachu {puluers} spolu se vším příslušenstvím.
- typ: odstavec
  de: |-
    Im andern geschicht vermeldung / was disem Prech vnd Feldgeschütz in gemein allenthalben zugehörig.
  cs: |-
    Ve druhé kapitole se podává zpráva o tom, co náleží těmto průlomovým a polním dělům společně a vesměs.
- typ: odstavec
  de: |-
    Im dritten / wirt beschriben ein trefflich Handtgeschütz / vnd auff was form vnd maß dasselbig mit aller seiner zugehörung / gerüst vnd staffiert sein soll / nemlich Handtror 2000.
  cs: |-
    Ve třetí se popisují znamenité ruční palné zbraně {Handtgeschütz} a v jaké podobě a míře mají být opatřeny a vystrojeny se vším svým příslušenstvím, totiž 2000 ručnic {Handtror}.
- typ: odstavec
  de: |-
    Im vierdten von einem ansehlichen vorrat der allweg auff das geschütz vorhanden / vnd wie derselb so nicht bleiblich widerumb mit der zeit verendert / abgewechselt vnd erstat werden soll.
  cs: |-
    Ve čtvrté o značné zásobě, která je vždy k dispozici pro děla, a jak se má ta část zásob, jež není trvanlivá, časem opět obměňovat, vyměňovat a doplňovat.
poznamky:
- n: 1
  text: |-
    V originále stojí *vnd ein Brechgeschütz* (patrně tiskařská chyba místo *im Brechgeschütz*, tj. „u průlomových děl“).
- n: 2
  text: |-
    V originále sazečská přesmyčka *Perchgeschütz* místo *Prechgeschütz*.
