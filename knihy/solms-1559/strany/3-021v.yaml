bloky:
- typ: nadpis
  uroven: 2
  de: |-
    Beschreibung / wie eines Stathafftigen Fürsten oder Herrn Zeughauß / mit grossem vnd kleinem Geschütz / Auch allerlei andern Gewehrn / Kriegßrüstungen vnd vorat / Darzů in was summa gelts vngefehrlich sich solliches alles verlauffen möcht / deren jedes vnderschiedtlich / wie hernach volgt / angezeigt wirt / Vnd in zehen Capitel getheilt.
  cs: |-
    Popis, jak má být zařízena zbrojnice {Zeughauß} zámožného knížete nebo pána velkými i malými děly {Geschütz}, jakož i všelikými jinými zbraněmi, válečnou výzbrojí {Kriegßrüstungen} a zásobami, a dále na jakou peněžní sumu by to vše přibližně mohlo přijít – z čehož každé jednotlivě, jak níže následuje, bude vyloženo; rozděleno do deseti kapitol.
- typ: odstavec
  de: |-
    ANfangs werden diser Ordnung nach fürgenomen vnd gesetzt neunerlei Sort / Maurbrecher / Feldgeschütz vnd ein Brechgeschütz / ausserhalb der Mörser vier vnd in dem Feldgeschütz fünff gattung / doch allweg einer Sort ( wie es dann der notturfft nach bedacht worden ) mehr dann der andern benantlichen / wie hernach volgt.
  cs: |-
    Zpočátku se podle tohoto řádu bere a stanovuje devatero druhů – bořiče hradeb {Maurbrecher} a polní děla {Feldgeschütz} –, a to u průlomových děl {Brechgeschütz},[^1] mimo moždíře {Mörser}, čtyři druhy a u polních děl pět druhů, přičemž od jednoho druhu vždy více kusů než od druhého (jak to bylo podle potřeby uváženo), jmenovitě jak níže následuje:
