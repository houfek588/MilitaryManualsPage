  popis: |-
    Celostránkový dřevořez nejvyššího profouse pěchoty s doprovodem v obloukovém rámu s rostlinným ornamentem v cviklech (signováno dole vlevo monogramem HD – Hans Döring – a datováno 1546): vousatý profous v plátovém kyrysu přes drátěnou košili, v helmě s bohatým péřovým chocholem a s mečem u boku jede vlevo; před ním kráčí drabant v kroužkovém rukávu s halapartnou přes rameno a vedle koně i za ním jdou tři profousovi pacholci v nabíraných lancknechtských šatech a baretech s peřím, nesoucí přes rameno dřevěné hole – odznak svého úřadu.
