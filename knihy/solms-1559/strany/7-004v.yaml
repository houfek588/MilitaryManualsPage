- typ: obrazek
  soubor: drevorez-556.jpg
  popis: |-
    Devět obrazových karet jízdy strany Hannibalovy (černý tisk), bez nápisů úřadů (pořadí po řádcích zleva doprava): 1. sevřený houf těžkých jezdců – kyrysníků na obrněných koních s čabrakami zdobenými křížem, s lesem vztyčených kopí a korouhví; 2. jízdní houf s pruhovanou korouhví, v čele dva jezdci; 3. hustý houf kopiníků s praporky na kopích a korouhví; 4. lehká jízda v trysku – jezdci s luky a vrhanými kopími či oštěpy; 5. houf kopiníků se vztyčenými kopími, před ním jezdec s žerdí a velitel na koni v síťované čabrace; 6. jízdní houf s číslem „100“; 7. hustý jízdní houf s korouhví nesoucí šikmý (burgundský) kříž; 8. menší karta s houfem jezdců a číslem „50“; 9. nejmenší karta s malou skupinou jezdců, místo čísla jen inkoustová skvrna.
