poznamky:
- n: 1
  text: |-
    Čísla udávají sílu oddílu, kterou karta zastupuje (srov. [[7-002r|výklad na listu 2]]: každá karta platí za počet jedné korouhve či praporce). Na odpovídající nejmenší červené kartě Římanů ([[7-008r|list 8]]) je číslo „25“; zde je místo něj jen skvrna.
