bloky:
- typ: odstavec
  de: |-
    DIse 20. Figur gehört auch zu einem Sturm/ vnd ist ein Holtz das Creutzweiß mit löchern gebort ist/ als ein Loch vmb das ander wie die Figur das anzeigt vnd weiset/ in solches Holtz mit den löchern sollen stecken geschlagen werden/ der einer vber haupt sechs schůhe lang ist/ die sollen inn das Holtz mit den löchern geschlagen werden/ das sie auff beiden seiten gleich fürgehen/ vnd auff beiden seiten gespitzt sein/ auff einer seiten ein absatz haben/ darauff mann sie einschlegt damit mann jnen die spitzen nit zuschlegt wann mann sie in das Holtz mit den löchern schlegt/ wie das die Figur außweist.
  cs: |-
    Tato 20. figura patří rovněž k [obraně proti] útoku {Sturm}: je to břevno provrtané křížem otvory, jeden otvor vedle druhého, jak figura ukazuje. Do tohoto břevna s otvory se mají zatlouct kůly, každý celkem šest stop {schůhe} dlouhý, a to tak, aby na obě strany vyčnívaly stejně. Na obou koncích mají být zašpičatělé a na jedné straně mít osazení, za něž se zatloukají, aby se jim při zatloukání do břevna neotloukly hroty, jak figura ukazuje.
- typ: odstavec
  de: |-
    Diß Holtz mit seinen ein geschlagnen pfellen ist gůt zugebrauchen in einem Sturm so etwan in ein Befestigung ein loch auffgeschossen wirt/ vnd zu besorgen daß mann dardurch sturmen möchte/ wann mann dann diser geschrenckte pfel blöcher hett/ kan man damit wol ein löcke verlegen vnd verdarressen/ so mann dann derselbigen hat vnd zwergs vnd die leng vber vnd in einander würffet alßdan sind sie nit von oder auß ein ander zu ziehen/ so ist auch nit gůt darüber zu stürmen.
  cs: |-
    Toto břevno se zaraženými kůly se dobře hodí při útoku, když je do opevnění prostřelena díra a je třeba se obávat, že by jí mohl [nepřítel] útočit. Má-li člověk takové špalky s křížem prostrčenými kůly (*geschrenckte pfel blöcher*), může jimi otvor dobře zahradit a zatarasit (*verdarressen*)[^1]; a má-li jich víc a nahází je napříč i podélně přes sebe a do sebe, nelze je od sebe odtáhnout ani rozebrat a přes ně se také špatně útočí.
- typ: odstavec
  de: |-
    Die 21. Figur ist ein Materitz vnder einen grossen Haupt mortier zu legen/ wann mann den auff einmal sehr gebraucht/ so stossen sie jre Gefeß entzwei wann sie auff einem steinigen oder harten grundt stehn/ aber dise maderitz wert vnd bricht jm den stoß.
  cs: |-
    21. figura je tlumicí matrace {Materitz}, která se klade pod velký hlavní moždíř {mortier}. Když se z něj totiž najednou hodně střílí, roztříštějí si moždíře své lafety {Gefeß}, stojí-li na kamenitém nebo tvrdém podkladu; tato matrace (*maderitz*) však zachytí a zlomí jeho ráz.
- typ: odstavec
  de: |-
    Die 22. Figur ist ein Faß das ist gefült mit gestossenem vngelechstem Kalck/ vnd mitten in dem Kalck sol ein Feßlin mit puluer stehn/ vnd ein Rör oben durchauß gehn haben/ vnd mit faulem puluer gefült sein/ stehn oder ligen da man sich zu stürmen versicht auch lauffen Fewer darzu machen/ wann das angeht so zu schlegts das Faß vnd schlegt den Kalck vmb sich/ das macht ein dampff vnd blendt.
  cs: |-
    22. figura je sud naplněný tlučeným nehašeným vápnem[^2]; uprostřed vápna má stát soudek s prachem {puluer}, nahoře opatřený trubkou, která prochází ven a je naplněná pomalým prachem. Sud se postaví nebo položí tam, kde se očekává útok, a připraví se k němu také zápalná stopina (*lauffen Fewer*). Když se vznítí, sud se roztrhne a rozmetá vápno kolem sebe; to udělá dým a oslepuje.
- typ: odstavec
  de: |-
    Die 23. Figur ist ein Bechring wie der gedrehet ist das sind Seck mit werffzeug auß gefült/ als ein sack mit röscherem Zeug dann der ander/ dann also durch einander getrehet wie die Figur außweiset/ wann sie dann also durch einander gedrehet/ vnd zu einem Ring gemacht werden so taufft mann den Ring im Zeug wie sich das gebürt/ die braucht mann dann im stürmen.
  cs: |-
    23. figura je smolný věnec {Bechring}, jak je stočený: jsou to pytle naplněné zápalnou směsí (*werffzeug*), jeden pytel s prudší složí než druhý, a pak takto stočené do sebe, jak figura ukazuje. Když se takto stočí do sebe a udělá se z nich kruh, namočí se věnec ve směsi, jak se patří; takové věnce se pak používají při útoku.
- typ: odstavec
  de: |-
    Die 24. Figur ist ein gebachene Kugel von hafen erden vnd einer gůten dicke gemacht/ so springt vnd schlegt sie hart/ wan sie von dünnem zeug ist/ dann bricht sie bald vnd schlegt nit hart/ solliche Kugel soll einen langen halß haben vnd der halß mit faulem zeug gefült werden/ daß er langsam brenne biß er in das rösch Puluer kompt/ vnd soll hart im halß auff einander geschlagen wie ein Racket/ daß es langsam brenne/ vnd ein schnor durch beide ohrn gezogen werden/ die
  cs: |-
    24. figura je pálená koule {Kugel} z hrnčířské hlíny, udělaná s dobrou tloušťkou stěny: taková se roztrhne a prudce udeří; je-li z tenké hlíny, rozbije se snadno a neudeří prudce. Taková koule má mít dlouhé hrdlo naplněné pomalou složí, aby hořelo zvolna, než oheň dojde k prudkému prachu {Puluer}; slož se má v hrdle pevně udusat vrstvu na vrstvu jako u rakety {Racket}, aby hořela pomalu. Oběma oušky se má protáhnout šňůra dlouhá
poznamky:
- n: 1
  text: |-
    V tisku *verdarressen* (nářeční či tiskařská podoba za *verbarressen* / *verbarrikadieren* = „zatarasit“).
- n: 2
  text: |-
    V tisku *vngelechstem Kalck* za *vngeleschtem Kalck* („nehašené vápno“).
