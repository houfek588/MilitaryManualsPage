bloky:
- typ: odstavec
  de: |-
    DIse 20. Figur gehört auch zu einem Sturm/ vnd ist ein Holtz das Creutzweiß mit löchern gebort ist/ als ein Loch vmb das ander wie die Figur das anzeigt vñ weiset/ in solches Holtz mit den löchern sollen stecken geschlagen werden/ der einer vber haupt sechs schůhe lang ist/ die sollen inn das Holtz mit den löchern geschlagen werden/ das sie auff beiden seiten gleich fürgehen/ vnd auff beiden seiten gespitzt sein/ auff einer seiten ein absatz haben/ darauff mann sie einschlegt damit mann jnen die spitzen nit zuschlegt wann mann sie in das Holtz mit den löchern schlegt/ wie das die Figur außweist.
  cs: |-
    Tato 20. figura patří rovněž k obraně při útoku {Sturm} a jest to břevno křížem provrtané otvory, střídavě jeden otvor za druhým, jak ukazuje vyobrazení; do takového břevna s otvory mají být zatlučeny koly, každý vcelku šest stop {schůhe} dlouhý, a mají se do břevna zarazit tak, aby na obě strany vyčnívaly stejně daleko. Na obou koncích mají být zašpičatělé a na jedné straně mají mít osazení, na nějž se tluče, aby se při zatloukání do břevna neztupily hroty, jak figura ukazuje.
- typ: odstavec
  de: |-
    Diß Holtz mit seinen ein geschlagnen pfellen ist gůt zugebrauchen in einem Sturm so etwan in ein Befestigung ein loch auffgeschossen wirt/ vnd zu besorgen daß mann dardurch sturmen möchte/ wann mann dann diser geschrenckte pfel blöcher hett/ kan man damit wol ein löcke verlegen vnd verdarressen/ so mann dann derselbigen hat vnd zwergs vnd die leng vber vnd in einander würffet alßdan sind sie nit von oder auß ein ander zu ziehen/ so ist auch nit gůt darüber zu stürmen.
  cs: |-
    Toto břevno s jeho zaraženými kůly jest dobré k použití při útoku {Sturm}, když bývá do opevnění proražen průlom a hrozí nebezpečí, že by jím nepřítel vzal pevnost ztečí; má-li obránce takovéto křížem prostrkané rohatiny, může jimi mezeru snadno založit a zatarasit (*verdarressen*)[^1], a nahází-li je napříč i po délce přes sebe a do sebe, pak je nelze odtáhnout ani rozebrat a nedá se přes ně dobře útočit.
- typ: odstavec
  de: |-
    Die 21. Figur ist ein Materitz vnder einen grossen Haupt mortier zu legen/ wann mann den auff einmal sehr gebraucht/ so stossen sie jre Gefeß entzwei wann sie auff einem steinigen oder harten grundt stehn/ aber dise maderitz wert vnd bricht jm den stoß.
  cs: |-
    21. figura jest tlumicí matrace {Materitz}, která se klade pod veliký hlavní moždíř {mortier}; když se totiž z něj najednou hodně střílí, roztříští si své lafety {Gefeß}, stojí-li na kamenitém nebo tvrdém podkladě, ale tato matrace {maderitz} chrání a tlumí jeho zpětný ráz.
- typ: odstavec
  de: |-
    Die 22. Figur ist ein Faß das ist gefült mit gestossenem vngelechstem Kalck/ vnd mitten in dem Kalck sol ein Feßlin mit puluer stehn/ vnd ein Rör oben durchauß gehn haben/ vnd mit faulem puluer gefült sein/ stehn oder ligen da man sich zu stürmen versicht auch lauffen Fewer darzu machen/ wann das angeht so zu schlegts das Faß vnd schlegt den Kalck vmb sich/ das macht ein dampff vnd blendt.
  cs: |-
    22. figura jest sud naplněný tlučeným nehašeným vápnem;[^2] uprostřed vápna má stát soudek se střelným prachem {puluer} opatřený trubkou vedoucí nahoru skrz víko a naplněnou pomalým prachem; má stát či ležet tam, kde se očekává zteč, a má se k němu položit zápalná stopina. Když se vznítí, roztrhne sud a rozmetá vápno kolem sebe, což vyvolá hustý oblak a oslepí útočníky.
- typ: odstavec
  de: |-
    Die 23. Figur ist ein Bechring wie der gedrehet ist das sind Seck mit werffzeug auß gefült/ als ein sack mit röscherem Zeug dann der ander/ dann also durch einander getrehet wie die Figur außweiset/ wann sie dann also durch einander gedrehet/ vnd zu einem Ring gemacht werden so taufft mann den Ring im Zeug wie sich das gebürt/ die braucht mann dann im stürmen.
  cs: |-
    23. figura jest smolný věnec {Bechring}; jak jest stočen, to jsou pytle naplněné zápalnou směsí, přičemž jeden pytel má prudší slož než druhý, a potom jsou takto stočeny do sebe, jak figura ukazuje. Když se takto spletou a stočí v kruh, namočí se věnec v horké zápalné směsi, jak se sluší; těch se pak užívá při odražení zteče.
- typ: odstavec
  de: |-
    Die 24. Figur ist ein gebachene Kugel von hafen erden vnd einer gůten dicke gemacht/ so springt vnd schlegt sie hart/ wan sie von dünnem zeug ist/ dann bricht sie bald vnd schlegt nit hart/ solliche Kugel soll einen langen halß haben vnd der halß mit faulem zeug gefült werden/ daß er langsam brenne biß er in das rösch Puluer kompt/ vñ soll hart im halß auff einander geschlagen wie ein Racket/ daß es langsam brenne/ vnd ein schnor durch beide ohrn gezogen werden/ die
  cs: |-
    24. figura jest vypálená koule {Kugel} z hrnčířské hlíny zhotovená v dobré tloušťce stěny – pak rozletem prudce trhá a bije, kdežto jest-li z tenké hlíny, rozbije se snadno a neudeří silně. Taková koule má mít dlouhé hrdlo, jež se naplní pomalou směsí, aby hořela zvolna, než oheň dospěje k prudkému prachu {Puluer}; směs se má v hrdle silně udusat na sebe jako u rakety {Racket}, aby hořela pomalu, a oběma oušky se má protáhnout šňůra dlouhá
poznamky:
- n: 1
  text: |-
    V tisku *verdarressen* (nářeční či tiskařská podoba za *verbarressen* / *verbarrikadieren* = „zatarasit“).
- n: 2
  text: |-
    V tisku *vngelechstem Kalck* za *vngeleschtem Kalck* („nehašené vápno“).
