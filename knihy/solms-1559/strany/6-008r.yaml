poznamky:
- n: 1
  text: |-
    Rejstřík jezdců naverbovaných Andresem Pflugem (viz [[6-007v|předchozí stranu]]), v pořadí čtení: levý sloupec, pak pravý. Součet 33 v pravém sloupci zahrnuje oddíly 5–8. Jména jsou ponechána v podobě tisku; jde vesměs o saské a durynské šlechtické rody (dnes Mansfeld, Schönberg, Ebeleben, Vitzthum, Pflugk). Oddíl 5 tvoří společně tři muži (Gleissendhal, Sigmund Pflug, Rosenkrantz), oddíl 12 dva (Rutzleben a Wangertz). „Guden“ je tisková chyba za „gulden“.
