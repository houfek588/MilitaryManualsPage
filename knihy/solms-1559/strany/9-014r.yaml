bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    gehn so weit daß die Statmaur erreichen künden / wirt es jnen nicht vil felen daß sie die Maurn mit durch schiessen / vnnd dermassen zersprengen / daß kein Mensch darauff bleiben kan / dieweil die der gestalt schiessen / mögen die andern mit den Schlangen vnnd Carthaunen auch darzů kommen / vnd in die Maurn vnd Polwercker darauß sich die in der Satt weichen künden schiessen / Nachuolgents rückt mann noch neher mit den mitteln stücken herzů / vnnd was die grossen stück erschelt stossen sie wol vmb / darnach die Falckenetlein vnnd Schlangen welche on vnderlaß schiessen sollen in die Polwercker vnd Thürn / wann sie dermassen in die Statt geschossen biß in die nacht / mögen sie nachuolgent mit gůten růhen die Schantz machen / darnach mögen sie das Geschütz auff dreissig oder viertzig schrit zu dem graben füren / oder neher wann es gesein mag / wann sie das Geschütz dahin gestelt da sie vermeinen gůt sein / sol ein jeglichs groß stück zwölff zu fuß haben / die auff der seiten bei dem Puluer ein kleine Schantz machen / darinn zwölff oder dreitzehen sein mögen / welche darzů gůt seind / daß sie das Puluer an jr ort wider stellen / ehe dann der rauch vergeht / vnd als nahe bei dem Geschütz als mann kan / macht mann ein grosse schantz / darinn ein starck wacht lige die das Geschütz verware / vor denen in der statt wann sie herauß fielen / odder wann es von nöten mag mann wol zwo oder drei Wachten haben / vnnd darnach in der nacht machen sie die schantzen / daß mann von einer schantzen in die andern ringßweiß herumb kommen kan / als hüpsch vnd gůt sie es machen künden / nach dem sie auch vil Fußknecht bei jnen haben / Vnd wann sie sich der gestalt befestigen mit schantzen vnd anderm daß sie sicher seien / vnd machen zwo oder drei schantzen die auß dem Leger biß zu dem Geschütz gehn / mögen sie sicher zu vnnd von dem Geschütz kommen / das ist die Manier der schantzen so ich inn Franckreich gesehen / nachuolgents zerschiessen sie die Thürn vnd pasteien / daß mann allenthalben mit gůter sicherheit schantzen kan / wann jnen jr Wehrn vnd Polwerck abgeschossen seind.
  cs: |-
    tak daleko vpřed, aby dostřelila na městskou hradbu. Málokdy se jim stane, že by hradby neprostřelili a nerozrazili tak, že by na nich nemohl zůstat žádný člověk. Zatímco takto střílejí, mohou se přidat i ostatní s kulverinami {Schlangen} a kartounami {Carthaunen} a střílet do hradeb a do bolverků {Polwercker}, odkud by se mohli bránit ti ve městě.[^1] Potom se postoupí ještě blíž se středními děly {mitteln stücken} a co velká děla otřásla, to snadno povalí. Následují falkonety {Falckenetlein} a kulveriny, které mají bez ustání střílet do bolverků a věží. Když takto střílejí do města až do noci, mohou potom v klidu stavět šanci {Schantz}. Poté mohou děla {Geschütz} dopravit na třicet nebo čtyřicet kroků {schrit} k příkopu {graben}, nebo i blíž, je-li to možné. Když děla postaví tam, kde to pokládají za dobré, má mít každé velké dělo {stück} dvanáct pěších, kteří po straně u prachu {Puluer} postaví malou šanci pro dvanáct nebo třináct mužů; ti jsou k tomu, aby prach znovu uložili na jeho místo, dřív než se rozplyne dým. Co nejblíže k dělům se postaví velká šance, v níž leží silná stráž {wacht}, aby děla chránila před těmi z města, kdyby vyrazili ven; je-li třeba, lze mít i dvě nebo tři stráže. Potom v noci stavějí šance tak, aby se dalo z jedné šance do druhé dostat dokola, tak úhledně a dobře, jak to jen dokážou, podle toho, kolik mají u sebe pěších knechtů {Fußknecht}. Když se takto opevní šancemi a jiným, aby byli v bezpečí, a postaví dvě nebo tři šance vedoucí z ležení {Leger} až k dělům, mohou bezpečně chodit k dělům i od nich. To je způsob stavby šancí, jaký jsem viděl ve Francii. Potom rozstřílejí věže a bašty {pasteien}, takže se všude dají stavět šance zcela bezpečně, když je obráncům rozstřílena jejich obranná místa {Wehrn} a bolverky.
- typ: odstavec
  de: |-
    Damit aber jr auch wisset wieuil Geschütz in ein grosse schantz ein Maur zubrechen gehör / sollen in einer jeglichen schantzen sechs Carthaunen / zwei grosse hauptstück / vier mittel stück / vnd zwölff Falckenetlin wol gestaffiert mit allem so darzů gehörig sein mag / auch Leut die geschickt seind darinn zu helffen / vnnd ist kein Carthaun die nicht viertzig schöß in einem langen tag thůn soll / es sei dann glück oder sonst ein gůter zufall dabei / vnd die andern noch mehr / Wann das alles (wie ich gesagt) alda ist / ist es ein gantze wol gerüste schantz / vnd ein solliche / deren jr zwo oder drei vor einer statt must haben / die inn
  cs: |-
    Abyste však také věděli, kolik děl patří do velké šance k rozbití hradby: v každé šanci má být šest kartoun, dvě velká hlavní děla {hauptstück}, čtyři střední děla a dvanáct falkonetů, dobře vybavených vším, co k nim patří, a také lidé zruční v tom, aby při nich pomáhali. Není kartouny, která by za dlouhý den neměla vypálit čtyřicet ran, ledaže by při tom bylo štěstí nebo jiná dobrá náhoda,[^2] a ostatní děla ještě víc. Je-li tam všechno, jak jsem řekl, je to úplná a dobře vyzbrojená šance, a takové musíte mít před městem dvě nebo tři, které
poznamky:
- n: 1
  text: Tisk má „darauß sich die in der Satt weichen künden“ – „Satt“ je tisková chyba místo „Statt“; „weichen“ patrně místo „wehren“ (bránit se), jinak „kam by se mohli ti z města uchýlit“.
- n: 2
  text: Smysl – kartouna má denně vypálit 40 ran, ledaže by se cíle dosáhlo dříve šťastnou náhodou.
