id: 3-009r
list: '9'
strana: recto
sken: 269
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    ES seind verordnet/ wie die hieuor Beschreibung mit sich brengt/ etlich vom Adell/ vnd auch sonst ehrliche/ geschickte personen/ die lust zu disem Geschütz haben/ vnd sich darzů mit gebrauchen lassen/ denselbigen wirdt das Geschütz vndergeben/ darnach die stück groß oder klein/ vnd die personen geschickt seind/ ist jnen zubeuelhen.
  cs: |-
    Jak přináší výše uvedený popis, jsou určeni někteří ze šlechty i jiné čestné, obratné osoby, které mají zálibu v těchto dělech {Geschütz} a dávají se k tomu zaměstnat; těm se děla svěřují a podle toho, jak jsou kusy velké či malé a osoby obratné, jim má být veleno.
- typ: odstavec
  de: |-
    Nun mag wol gesagt werden/ es stehe solliche versehung einem Zeugmeister vnd seinem vnder Zeugmeister oder Leutenant zů/ es sei vnnot souil Zeugmeister zu haben/ ist zwifacher kosten/ wann ein Zeugmeister seinen Leutenant vnd Büchsenmeister habe/ so seien jhr gnůg/ jm gebürt seine sachen selbst zuuersehen/ Ist wol schön daruon geredt in der Stuben/ vnd von denen die es nicht verstehen noch darmit vmbgangen haben. Aber damit mann verstehn mag warzů es einem Herrn nütz/ fürderlich vnd gůt ist/ daß er sein Geschütz im feld in Zügen/ wie gemelt/ vilen personen solches zuuerwalten vnd zuuersehen ordnen soll/ ist zum ersten dises ein vrsach/ Daß ein Zeugmeister/ er sei so geschickt/ verstendig/ redtlich vnd arbeitsam als ein man oder mensch sein mag/ so steht doch grösser gefahr darauff/ dann auff keinem menschen/ zů dem das noch vil inn solchem ampt zuuersehen die notturfft erfordert/ daß eim Zeugmeister allein vor sein person vnmöglich ist. Dieweil es dann einer persein[^1] vnmöglich/ vnd des Herrn notturfft ist das es möcht alles wol versehn werden/ wann es nit geschicht/ daß darauß schaden vnd versaumnuß kompt/ were dann nit besser gewesen/ daß mann souil personen darzů hielt/ damit solchs gefürdert/ vnd nichts dardurch verseumpt würde/ Dann es ist je vor augen/ wann ein Herr einn zug mit seinem Kriegsuolck vnd gewaltigen geschütz thůt/ daß der gemein gebrauch ist/ daß mann im ziehen das Geschütz theilt/ nemlich das geringst vnd wenigst Geschütz inn das theil des Kriegsuolcks/ als der vorzug vor eins/ das ander/ das gewaltigst oder gröst geschütz in den gewaltigen grossen hauffen/ das drit theil/ mit den geringsten Stücken in den nachzug/ also ist diß geschütz schon in drei theil getheilt/ Wie ists nun möglich einem Zeugmeister/ daß er zu gleich an allen dreien orten sein mag/ so ist von nöten daß an einem jeden ort ein Hauptman were/ darauff die andern ein auffsehen vnd sorg hetten/ Dann auff die Büchsenmeister ist sich nit zuuerlassen/ warumb? Es folgt keiner dem andern/ dann es wil einer so gůt vnd vil geacht als der ander sein. Wo aber ein Oberster/ als einer vom Adel vber jn ist/ den müssen sie dann achten vnnd gehorsam sein/ demselbigen ists zu beuelhen/ der muß auch darumb stehn/ redt vnd antwort geben/ das mit dem gemeyn hauffen nicht zuuersehen ist/ als durch oder mit einer person.
  cs: |-
    Někdo by sice mohl říci, že taková správa přísluší zbrojmistrovi {Zeugmeister} a jeho podzbrojmistrovi {vnder Zeugmeister} či poručíkovi {Leutenant}, že není třeba mít tolik zbrojmistrů a je to dvojí náklad; má-li prý zbrojmistr svého poručíka a puškaře {Büchsenmeister}, je jich dost a jemu náleží, aby své věci zastával sám. To je ovšem pěkná řeč v jizbě od těch, kdo tomu nerozumějí ani s tím nezacházeli. Avšak aby se pochopilo, k čemu je pánovi užitečné, prospěšné a dobré ustanovit k řízení a správě svých děl v poli na taženích {Zügen}, jak řečeno, mnoho osob, je k tomu předně tento důvod: že zbrojmistr – ať je tak obratný, rozumný, poctivý a pracovitý, jak jen může muž či člověk být – je přece jen ve větším nebezpečí než kdokoli jiný, a kromě toho vyžaduje potřeba v takovém úřadu zařídit ještě tolik věcí, že je to jednomu zbrojmistrovi samému osobně nemožné. Jelikož je to tedy jedné osobě[^1] nemožné a potřeba pána žádá, aby bylo vše dobře obstaráno – neboť nestane-li se tak, vzejde z toho škoda a zanedbání –, nebylo by pak lepší držet k tomu tolik osob, aby to bylo podpořeno a nic se tím nezameškalo? Neboť je přece zjevné před očima, že když pán koná tažení se svým válečným lidem {Kriegsuolck} a mocným dělostřelectvem, je obecným zvykem při pochodu děla rozdělit: totiž nejmenší a nejslabší děla k tomu oddílu válečného lidu, kterým je předvoj {vorzug}, za prvé; za druhé nejmohutnější a největší děla do hlavního velikého šiku {hauffen}; a třetí díl s nejmenšími kusy do zadního voje {nachzug} – tak je již toto dělostřelectvo rozděleno na tři díly. Jak je pak možné jednomu zbrojmistrovi, aby byl na všech třech místech zároveň? Proto je zapotřebí, aby na každém místě byl jeden hejtman {Hauptman}, na něhož by ostatní hleděli a dbali ho; na puškaře se totiž nelze spolehnout – proč? Žádný neposlouchá druhého, neboť každý chce být pokládán za stejně dobrého a váženého jako druhý. Kde však nad nimi stojí nějaký plukovník {Oberster} jakožto někdo ze šlechty, toho pak musejí ctít a být mu poslušni; tomu je třeba [děla] svěřit a on za ně také musí ručit a skládat účty – což u obecného houfu nelze obstarat jinak než skrze takovou osobu či s ní.
- typ: odstavec
  de: Zum andern/ so mann dann also besonder personen hat/ so mag
  cs: Za druhé, má-li člověk takto zvláštní osoby, může[^2]
poznamky:
- n: 1
  text: Tisk má v tomto místě omylem *persein* (tisková chyba za *person*).
- n: 2
  text: |-
    Tento závěrečný řádek strany je v originále tištěn na nalepeném opravném proužku papíru na spodním okraji sazby (v BSB OCR přepisu zcela chyběl) a plynule navazuje na začátek strany `3-009v`.
