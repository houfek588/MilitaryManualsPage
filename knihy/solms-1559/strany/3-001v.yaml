bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    versuchten vnd verstendigen Kriegsleuten gedenck vnd bekom/ besonder die die Obersten sein sollen/ dann warlich es ist vil daran gelegen an versůchten vnd verstendigen Kriegsleuten/ vnd ob der schon nit vil oder grosse hauffen sind/ ist nit alle zeit angelegen/ sonder die geschicklicheit vnd der fortteil der ist das principal stück neben dem glück darauff/ wie vil findet mann junger Kriegsleut von Obersten vnd gemeinen Knechten/ die wol gůte freudige Leut sind/ auch ehrlich/ haben aber den verstandt daruon nit/ sind nit vil gepraucht/ auch ein teil gar nit mehr darbei gewesen/ ist gůt zugedencken wann einer vor nit mehr dar bei gewesen das jm das spil seltzam ist/ vnd so es sich etwan erstlich ein wenig erschrecklich an lest/ so wissen sie des kein fortteil wider zu begegnen/ warumb? sie sind des nit gebraucht noch gewont/ vnd ist also den vnuersůchten beuelchsleuten jrrig/ vor dem hauffen wissen sie nit tröstlich mit forteilhafftigen anschlägen jnen zu begegnen/ so dann die Befelchsleut so vnwissen da stehn/ was wil dann der gemein man thůn der zuuor gar nit mehr darbei gewesen/ vnd ist sonst auch nit besonders freudig/ also ist zubesorgen wo ein halber hauff an die keme/ die jren fortteil verstünden/ weren des spils gewont/ vnd thetten also an eim klein vnglück nit erschrecken/ sehen daß sie nit verstünden mit jren sachen vnd fortheil vmb zu gehen/ vnd nemen den fortteil an vnd kennen einander/ dem ist nun wol zubedencken wie es wirt zůgehn/ vnd mit wellichem theil es zu halten wer/ wie das vil in erfarung ist.
  cs: |-
    zkušené a rozumné válečníky {Kriegsleuten} a opatřil si je – zvláště ty, kteří mají být plukovníky {Obersten}. Neboť věru velmi mnoho záleží na zkušených a rozumných válečnících; a i když jich není mnoho ani nejsou veliké houfy {hauffen}, na tom vždy tolik nesejde, nýbrž obratnost a výhoda jsou vedle štěstí hlavním základem. Kolik jen se najde mladých válečníků, od plukovníků až po prosté knechty {Knechten}, kteří jsou sice dobří, odvážní i čestní lidé, ale nemají v tom rozhled, nejsou příliš zkušení a někteří u toho ještě nikdy nebyli! Lze si snadno pomyslet, že kdo u toho dříve nikdy nebyl, tomu ta hra připadá podivná; a když se zpočátku ukáže poněkud hrozivou, nevědí, jakou výhodou tomu čelit – proč? Nejsou v tom vycvičeni ani na to zvyklí. A tak jsou nezkušení velitelé {beuelchsleuten} zmateni: před houfem neumějí s odvahou čelit nepříteli obratnými plány. Když tedy velitelé stojí takto bezradně, co si pak počne prostý muž, který u toho dříve nikdy nebyl a ani jinak není zvlášť smělý? Je tedy třeba se obávat, co se stane, kdyby na ně narazila byť jen polovina houfu takových, kteří znají svou výhodu a jsou na tu hru zvyklí: ti se při menším nezdaru nezaleknou, poznají, že protivníci neumějí zacházet se svými věcmi a výhodou, sami se výhody chopí a navzájem se znají. Pak si lze snadno domyslet, jak to dopadne a ke které straně by bylo lépe se přidat, jak to zkušenost mnohokrát potvrdila.
- typ: odstavec
  de: |-
    Nun ist es war das nit alle zeit sein kan das ein Herr mag alweg die alten verstendigen Obersten haben/ auch nit alle zeit die alten besten vom kern der alten Kriegsleut von dem gemeinn Kriegsuolck/ vnd ein Herr der kriegen vnd Leut haben muß/ der thůt wie er kan/ nun wollan so solle ein Herr es Gott befelhen vnd vertrawen/ den Krieg desto ordenlicher fürnemen also Christlich vnd nit Tirannisch so vil müglich ist/ vnd sein mag/ vnd der Krieg leiden wille/ so ist Gott darmit.
  cs: |-
    Je ovšem pravda, že nemůže být vždy tak, aby pán měl pokaždé staré rozumné plukovníky, ani pokaždé staré nejlepší muže z jádra starých válečníků z řad obecného válečného lidu {Kriegsuolck}; a pán, který musí válčit a potřebuje lidi, jedná tak, jak může. Nuže tedy: má to pán poručit Bohu a svěřit se mu, vést válku o to řádněji, tedy křesťansky a nikoli tyransky, jak jen je možné a může být a jak válka snese – pak bude Bůh při tom.
- typ: odstavec
  de: |-
    Dieweil dann ein Herr also ein jung Kriegsuolck hat von grossem vnd kleinem standt/ so soll er bedencken das er im krieg bedechtlich handel/ vnd ein Kriegsuolck bei sich geschickt/ forteilhafftig/ bedechtlich/ arbeitsam vnd sorgfeltig mach/ vnd sie lern erkennen was hinder einem jeden ist/ damit er auch wisse/ was er sich auff sie zuuertrösten/ vnd eim jeden zubefelhen/ vnd zuuertrawen/ solchs zu erfarn bedeucht mich das diser weg mit jn were für zu nemen/ das ein Herr so er sein Volck aller bei einander hat/ vnd verordnet mit allen Ämptern groß vnd klein das er hett allen tag Rath gehalten vnd dann alle sein
  cs: |-
    Jelikož má tedy pán takto mladý válečný lid vysokého i nízkého stavu, má pamatovat na to, aby ve válce jednal rozvážně a učinil svůj válečný lid obratným, vynalézavým, rozvážným, pracovitým a pečlivým a naučil se poznávat, co v každém z nich vězí, aby také věděl, na koho se může spolehnout a co komu přikázat a svěřit. Aby to poznal, zdá se mi, že je s nimi třeba zvolit tuto cestu: jakmile má pán všechen svůj lid pohromadě a uspořádaný se všemi úřady, velkými i malými, ať každý den koná radu a všechny své
