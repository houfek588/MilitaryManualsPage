  pokracovani: true
  de: |-
    stiffte vnd ordnen daß er zu aller zeit möcht vnd muß bleiben/ also das verordnet werde ein gelt was mann vermeint das ein Jar darauff gehn wirt/ zů ersten/ des Zeugmeisters vnderhaltung oder besoldung/ zum andern/ der verordneten Edelleut/ Zeugschreiber/ zum dritten der Büchsenmeister/ zů vierdten die werckleut/ als giesser/ puluermacher Salpeter/ Wagner/ Schmiden/ Schlossern/ vnd was das ist das in eins Fürsten Zeughauß gehört/ das solchs gelt was darauff gehört von der Landtschafft in ein Renten des Zeughauß gestifft werd/ deßgleichen ein vberiges gelt damit der vorrat alle jar möcht gebessert werden/ das solchs gelt auff das Zeughauß besonder gelieffert vnd durch den Zeugmeister alle jar dem Fürsten vnd der landtschafft verrechnet werd/ vnd also bei dem Zeughauß bleibe/ nit in die kamer oder anders wohin gelieffert wirt/ sonder muß da bleiben/ so das gelt das zu erhaltung der person verordnet were/ nit alle jar wirt an das geschütz oder vorrat zu kauffen gewendt oder auff gieng/ dasselbig soll bei dem Zeughauß vnd anderm vorrat in verwarung als ein schatz bleiben biß zu der not daß mann etwan muß in ein zug oder Krieg im Landt brauchen/ das wer ein Fürstlich Landtzeughauß/ vnd ein bleiblichs/ doch das ein Fürst solchs Zeughauß in seiner verwarung/ inn seim Landt an eim verwarten festen ort het/ das nit der gemein hauff darüber verwaltung haben möcht/ sonder der Fürst/ die Ritterschafft/ vnd der außschoß von der Landtschafft/ vor denen muß auch alle jar rechnung vnd liefferung geschehn augenscheinlich/ wo das gelt wer angelegt von dem jar/ an ein newes geschütz/ Puluer/ Kogeln/ vnd was wer/ also muß alle jar verrechnet vnd dar gethan werden der zu vnd ab gang alles dings/ vnd ein newes Bůch des ab vnd zugangs von allen jarn gemacht vnd hingelegt in die verwarung der obgemelten/ so würt ein Furst vnd Landtschafft was sie zu aller zeit im vorrat helten wissen/ vnd jhre sachen darnach zuordnen vnd schicken.
  cs: |-
    založily a ustanovily tak, aby mohl a musel zůstat na všechny časy: totiž aby byly vyčleněny peníze podle toho, kolik se soudí, že na to za rok padne – předně na vydržování neboli žold {besoldung} zbrojmistra {Zeugmeisters}, za druhé na pověřené šlechtice a zbrojní písaře {Zeugschreiber}, za třetí na puškaře {Büchsenmeister}, za čtvrté na řemeslníky, jako odlévače, prachaře, ledkaře {Salpeter}[^1], koláře, kováře, zámečníky a vše, co náleží do knížecí zbrojnice {Zeughauß}. Ty peníze, které k tomu náležejí, mají být zemskými stavy nadány do stálého důchodu zbrojnice, stejně jako přebytek peněz, aby bylo možno zásoby každého roku vylepšovat; tyto peníze mají být dodávány zvlášť zbrojnici a každoročně zbrojmistrem vyúčtovány knížeti a zemským stavům, a mají tak zůstávat při zbrojnici, nikoli odváděny do komory ani jinam, nýbrž musejí zůstat tam. Kdyby se pak peníze určené na vydržování osob každého roku nevynaložily či nespotřebovaly na nákup děl {geschütz} nebo zásob, mají zůstat při zbrojnici a ostatních zásobách v úschově jako poklad až do chvíle nouze, kdy bude třeba vytáhnout na tažení {zug} nebo vést válku v zemi. To by byla knížecí zemská zbrojnice, a to trvalá – avšak tak, aby kníže měl takovou zbrojnici ve své správě na nějakém chráněném pevném místě ve své zemi, aby nad ní neměl správu obecný lid, nýbrž kníže, rytířstvo a výbor zemských stavů. Před nimi se také musí každého roku konat zjevné vyúčtování a předložení toho, kam byly toho roku peníze vloženy – na nové dělo, střelný prach {Puluer}, koule {Kogeln} a cokoli jiného; tak se musí každého roku vyúčtovat a doložit příbytek i úbytek všech věcí a sepsat nová kniha příbytku a úbytku za všechny roky a uložit ji do úschovy výše zmíněných. Tak budou kníže i zemské stavy vždy vědět, co mají v zásobě, a podle toho budou své věci řídit a zařizovat.
- typ: nadpis
  uroven: 3
  de: Des Leutenants Befelch vnd versehung
  cs: Velení a správa poručíka {Leutenants}.
- typ: odstavec
  de: |-
    DEr Leutenant soll auch einer vom Adel sein/ vnd auch einer der sich des Kriegs gebraucht vnd verstant hat/ sol dem Zeugmeister wie sich gebürt/ vnderworffen sein vnd sich seins beuelchs halten/ in allen sachen sich vben/ der Zeugmeister soll jn auch also vben/ brauchen vnd befelhen alle sachen zuuersehen gleich jm/ soll auch ob jm halten/ vnd so der Zeugmeister nit bei der handt ist oder sein kan soll er fleissig darbei sein vnd alles was zuthůn vnd zuuersehen ist mit allem fleiß versehen/ sol auch fleissig ob den arbeitern sein was die im Zeughauss arbeiten daß dasselbig in rechter zeit zum fleissigsten geschehe.
  cs: |-
    Poručík má být rovněž ze šlechty a někdo, kdo se vyzná ve válce a má v ní zkušenost; má být zbrojmistrovi podřízen, jak se sluší, držet se jeho rozkazů a ve všech věcech se cvičit. Zbrojmistr ho také má takto cvičit, zaměstnávat a přikazovat mu, aby zastával všechny věci stejně jako on sám, a má ho podporovat; a není-li či nemůže-li být zbrojmistr po ruce, má poručík být pilně při tom a se vší pílí obstarávat vše, co je třeba učinit a zařídit. Má také pilně dohlížet na dělníky, co pracují ve zbrojnici, aby se to dálo v pravý čas a co nejpilněji.
poznamky:
- n: 1
  text: |-
    Tisk uvádí *Salpeter* ve výčtu řemesel jako zkratku za *Salpetersieder* („vařič ledku, ledkař“).
