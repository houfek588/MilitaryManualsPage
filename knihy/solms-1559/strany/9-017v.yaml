bloky:
- typ: odstavec
  de: |-
    Dieweil mann stürmpt / solt jhr Leut verordnet haben / die allenthalben sehen was mangel sei / es sei an Leidern / Spiessen odder Hawen / vnd anders das sie nottürfftig seind / solt jr das bringen lassen / welche Instrument ligen sollen in den Schantzen da mann stürmpt / auch solt jr fleiß ankeren mit ewern Büchsenmeistern das sie schiessen / doch der gestalt / daß sie den ewern keinen schaden zufügen / jr solt auch nimmer an einem ort stil stehn / sonder allweg von einem ort zum andern verrücken / jr seien dann an einem ort da jr den gantzen sturm vnd all ewer Volck sehen möcht / wann aber auff der seiten ein hauff in ewer Leger fallen wolt / sollen die so stürmen nicht vom sturm weichen / sonder der Veldmarschalck mit seinem hauffen sollen widerstandt thůn / Es ist wol geschehen das etlich auß der Statt herauß stellen dieweil mann stürmpt / vnd dardurch die vom sturm dringen wollen / als ob ein hinderhut darhinden were / deßhalben jhr ein gůt auffsehen darauff haben solt / damit wo solchs geschehe / das der Veldmarschalck jnen einen hauffen zu roß vnd fuß anhencke / die sie bald wider in die Stat hinein jagten / vnd fleiß ankeren ob sie mit jnen hinein kommen möchten / solches geschicht nicht offt / doch soll mann fleiß anwenden ob es geschehe.
  cs: |-
    Zatímco se útočí {stürmpt}, máte mít určené lidi, kteří všude hledí, čeho je nedostatek, ať žebříků {Leidern}, pík {Spiessen}, motyk nebo jiných věcí, které potřebují; to máte dát přinést. Tyto nástroje mají ležet v šancích {Schantzen}, odkud se útočí. Máte také u svých puškařů {Büchsenmeistern} pilně dbát, aby stříleli, ale tak, aby vašim lidem nezpůsobili žádnou škodu. Nikdy také nemáte stát na jednom místě, nýbrž se stále přesouvat z místa na místo, ledaže byste byli na místě, odkud můžete vidět celý útok i všechen svůj lid. Kdyby však ze strany chtěl do vašeho ležení {Leger} vpadnout nějaký houf, nemají ti, kdo útočí, od útoku ustupovat, nýbrž má se mu postavit polní maršálek {Veldmarschalck} se svým houfem. Stalo se už, že se někteří z města ukázali venku, zatímco se útočilo, a chtěli tím útočníky od útoku odlákat, jako by za nimi byla záloha {hinderhut}. Proto na to máte dávat dobrý pozor, aby polní maršálek, kdyby se to stalo, vyslal za nimi houf jízdních a pěších, který by je hned zase zahnal do města, a aby se pilně snažil, zda by se s nimi nemohli dostat dovnitř. To se nestává často, ale je třeba se snažit, zda se to nepodaří.
- typ: odstavec
  de: |-
    Wann es sich nu begebe das jr die Stat mit demselbigen sturm gewünnt / solt jr jederman hinein lassen / die gleich als wol so dieweil ob euch in der Ordnung gehalten als die so gestürmpt / dann wo solchs nit geschehe / würden jr nit vil finden die ob euch hielten wann mann stürmet / sonder ein jeglicher seim gewinn nach gehn / vnd als bald die Stat gewunnen / solt jr dreissig oder viertzig Edelleut vnnd Hetschier zu euch nemen / vnd in die fürnembste Kirchen der Stat gehn / alda Gott dem Allmechtigen lob vnd danck sagen / das er euch die gnad verliehen hat / vnd das heilig Sacrament beschirmen / damit es nicht von den gemeinen Knechten geunehrt / vnnd die zierden inn der Kirchen nit geplündert werden / vnd leut hinein verordnen die sie verwaren / vnd mit aller ewer macht vnd krafft darfür sein das kein blůtuergiessen geschehe / dann das Hauß Gottes vnd Kirch soll frei sein / solt auch in die andern Kirchen gehn / vnd gleicher weiß darfür sein / daß kein schmach darinn geschehe / gleich außrůffen lassen vnd bei dem höchsten verbieten / daß keiner kein Kirch beraube odder plündere / wann aber etwas genommen were sollen sie es wider geben / Wann jr aber einen ergreiffet (wie dann ich selbst einmal gefunden hab / die so vnuerschampt vnd Gottloß gewesen / daß sie das hochwirdig Sacrament auß geschüt vnd das Kästlin darinn es gewesen / genommen) soll er von stunden an gehenckt werden / Bei gleichförmiger straff soll es
  cs: |-
    Stane-li se pak, že město tímto útokem dobudete, máte dovnitř vpustit každého – ty, kdo mezitím stáli při vás v šiku {Ordnung}, stejně jako ty, kdo útočili. Kdyby se tak nestalo, nenašli byste při příštím útoku mnoho těch, kdo by při vás stáli, nýbrž každý by šel za svou kořistí. Jakmile je město dobyto, máte vzít s sebou třicet nebo čtyřicet šlechticů a hartšířů {Hetschier}, jít do nejpřednějšího kostela ve městě a tam vzdát Bohu Všemohoucímu chválu a díky, že vám udělil tuto milost. Máte ochránit svatou svátost, aby ji obecní knechti {Knechten} nezneuctili a aby nebyly vypleněny ozdoby v kostele, a ustanovit tam lidi, kteří je budou střežit. Vší svou mocí a silou máte zabránit, aby došlo ke krveprolití, neboť dům Boží a kostel má být svobodný. Máte jít také do ostatních kostelů a stejně tak zabránit, aby se v nich dála nějaká potupa. Dejte ihned vyhlásit a pod nejvyšším trestem zakázat, aby kdokoli vykrádal nebo plenil kostel; bylo-li však něco vzato, mají to vrátit. Chytíte-li někoho (jak jsem sám jednou zastihl takové, kdo byli tak nestoudní a bezbožní, že vysypali velebnou svátost a vzali schránku {Kästlin}, v níž byla), má být na místě oběšen. Pod stejným trestem se má
