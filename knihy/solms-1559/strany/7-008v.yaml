  popis: |-
    Osm obrazových karet pěchoty, dělostřelectva a vozů římské strany (červený tisk), bez nápisů, protějšek černých karet na [[7-005r|listu 5]]; pořadí po řádcích zleva doprava: 1. pochodující pěší střelci s ručnicemi na rameni; 2. dva vozy s převrácenými loďmi (pontony) pro lodní most, každý se čtyřspřežím a vozkou; 3. dvě lehká polní děla na kolových lafetách tažená koňmi; 4. vozy naložené dělovými koulemi, tažené spřežením s vozkami; 5. několik těžkých děl na lafetách tažených koňmi; 6. naložené válečné vozy pod plachtami, v pozadí stany s praporky; 7. další skupina těžkých děl s velkými koly; 8. velké dělo na lafetě, u něhož stojí puškař s chocholem na klobouku a přikládá zapalovací hůl k zátravce (místo moždíře na černé straně).
