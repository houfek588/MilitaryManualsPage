  popis: |-
    Celostránkový dřevořez polního šikovatele pěchoty v obloukovém rámu s rozvilinami v cviklech (signováno dole uprostřed monogramem HD – Hans Döring): prostovlasý vousatý šikovatel s baretem s peřím zavěšeným na zádech, v drátěném pláštíku, prostřiženém oděvu s nabíranými nohavicemi a s kordem u boku stojí v horské krajině mezi smrkem a uschlým stromem s choroši; pravou rukou nese šikmo přes rameno halapartnu.
