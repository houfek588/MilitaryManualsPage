id: 9-004r
list: 4 (9. kniha)
strana: recto
sken: 627
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    sich selbst/ derhalben vor Gott vnd der Welt jr verpflicht seit jnen zu helffen/ es sei mit gewalt oder andern mitteln/ vnd nicht leiden daß sie dermassen vmb gezogen werden/ deßgleichen auch seind sie schuldig euch für andern lieb zu haben vnnd ehre zubeweisen/ wann sie es aber nicht thůn wöllen/ verschulden sie souil desto ein grössere straffe/ etc.
  cs: |-
    sebe sama. Proto jste před Bohem i světem povinen jim pomoci, ať mocí, či jinými prostředky, a nestrpět, aby s nimi bylo takto zle nakládáno. Stejně tak jsou i oni povinni milovat vás víc než jiné a prokazovat vám čest; nechtějí-li to však činit, zaslouží si o to větší trest atd.
- typ: odstavec
  de: |-
    Deßgleichen möcht jr auch haben einen Fürsten so euch mit nichten weder verfreundt noch bündtnuß verbunden/ aber jr habt denselbigen vmb seiner person/ tugenden oder dienst so er euch gethan hat/ lieb/ solt jr jm in seinem anligen auch helffen/ dann ob er schon nicht ewer Diener ist/ solt jhr doch wissen daß er euch vmb zweierlei vrsachen dient/ die erst vmb der lieb willen die er vmb euch hat/ die ander daß jr jm in seinem anligen helffen künden.
  cs: |-
    Stejně tak můžete mít knížete, který s vámi není nijak spřízněn ani spojen spolkem, ale vy jej máte rád pro jeho osobu, ctnosti nebo služby, které vám prokázal. Takovému máte v jeho nesnázích také pomoci. I když totiž není vaším služebníkem, máte vědět, že vám slouží ze dvou příčin: zaprvé pro lásku, kterou k vám chová, zadruhé proto, abyste mu v jeho nesnázích mohl pomoci vy.
- typ: odstavec
  de: |-
    Aller gnedigster Herr das sein die vrsachen die mich zu dem billichsten beduncken Krieg anzufahen/ jedoch wann die Theologi daruon disputierden/ würden sie euch den weg in dem fall nicht so weit machen als ich/ aber dieweil ich der geschickten vnnd weisen keiner/ auch meine tag nicht vil Bücher gelesen/ schreib ich solchs meiner Fantasei nach/ so ferr jr aber mehr wissen wolt/ möcht jr diejenigen so ewer Beichtuätter vnnd sich ewer Concientz beladen weitter nach fragen.
  cs: |-
    Nejmilostivější pane, to jsou příčiny, které se mi zdají nejspravedlivější k započetí války. Kdyby o tom však disputovali teologové, nevyměřili by vám v této věci cestu tak široce jako já. Poněvadž však nepatřím mezi učené a moudré a za svůj život jsem mnoho knih nepřečetl, píšu to podle svého vlastního úsudku. Chcete-li vědět víc, můžete se dále otázat těch, kdo jsou vašimi zpovědníky a mají na starosti vaše svědomí.
- typ: odstavec
  de: |-
    Weitter Herr/ solt jr kein Krieg vmb neidt/ haß/ wollust/ blůtuergiessung oder andere bösen anfechtungen anfahen/ sonder allein vmb ehrlicher/ billicher vrsachen willen/ wann gerechtigkeit keinen fürgang will haben es geschehe dann mit gewalt/ solcher vrsachen halben solt jr kriegen/ vnd nicht anderst/ nicht vmb geitz willen daß jr ewer Königreich mehrn/ jr habt dann fug vnd recht darzů/ wie oben gemelt ist.
  cs: |-
    Dále, pane, nemáte začínat válku ze závisti, nenávisti, z rozmaru, pro krveprolití nebo z jiných zlých pohnutek, nýbrž jen z čestných a spravedlivých příčin – když spravedlnost nemůže dojít průchodu jinak než mocí. Z takových příčin máte válčit, a ne jinak; ne z lakoty, abyste rozmnožil své království, leda byste k tomu měl dobrý důvod a právo, jak bylo řečeno výše.
- typ: odstavec
  de: |-
    Wann jhr in einen Krieg ziecht/ vnnd euch Gott der Allmechtig den sig vnd Victorien verleicht/ solt jhr die ehr Gott vnnd nicht euch zumessen/ dann wie oben gemelt/ nicht die streitbaren Mäner/ sonder Gott gibt den sig/ daß solt jhr gewißlich glauben/ hůttet euch auch wann jhr ein vberwinder seit/ daß jhr euch nicht grausamlich erzeiget/ dann Got ein groß mißfallen darob hat/ habt ein mitleiden mit ewern freunden vnd Feinden/ vnd laßt bitten für diejenigen so auff denselbigen tag erstochen werden/ wann jr euch dermassen haltet/ vngezweiffelt wirdt euch Gott zu jederzeit helffen vnd gnedig sein.
  cs: |-
    Když táhnete do války a všemohoucí Bůh vám popřeje vítězství, máte tu čest připsat Bohu, a ne sobě. Jak bylo řečeno výše, vítězství nedávají bojovní muži, nýbrž Bůh; tomu máte pevně věřit. Chraňte se také, když jste vítězem, abyste se neprokazoval krutým, neboť Bůh v tom má velikou nelibost. Mějte soucit se svými přáteli i nepřáteli a dejte se modlit za ty, kdo toho dne padli. Budete-li se tak chovat, bude vám Bůh bezpochyby vždy pomáhat a bude vám milostiv.
