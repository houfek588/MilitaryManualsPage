  popis: |-
    Celostránkový dřevořez vůdce či furýra pěchoty v obloukovém rámu s rozvilinami v cviklech (signováno v pravém dolním rohu monogramem HD – Hans Döring): muž s knírem v baretu s pery, bohatě prostřiženém kabátci a nohavicích, s dlouhým kordem u boku vykračuje mezi listnatým stromkem a vysokým pařezem, pravou rukou nese přes rameno halapartnu a levou rukou ukazuje před sebe; v pozadí kopcovitá krajina s lesy a vzdáleným městečkem.
