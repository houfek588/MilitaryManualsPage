  popis: |-
    Celostránkový dřevořez vůdce či furýra pěchoty v obloukovém rámu s rozvilinami v cviklech (signováno dole vpravo pod pařezem monogramem HD – Hans Döring): muž s knírem v baretu s peřím, bohatě prostřiženém kabátci a nohavicích, s kordem u boku stojí pod stromy před kopcovitou krajinou, pravou rukou nese přes rameno halapartnu a levou ukazuje k seřazeným houfům pěchoty s píkami v pozadí.
