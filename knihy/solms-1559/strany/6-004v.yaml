id: 6-004v
list: 4 (6. kniha)
strana: verso
sken: 500
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    verstendigen / der jnen alßdan Jr Mai. meinung / vnd allen notturfftigen bericht thůn wirt.
  cs: |-
    oznámit; ten jim pak sdělí mínění Jeho Veličenstva a podá jim všechno potřebné vysvětlení.
- typ: odstavec
  de: |-
    Item so sein F. G. zu mehr malen inn jrem schreiben gemelt haben / daß die Pomerischen reisigen biß in zwei hundert sechszig pferde lenger außbleiben möchten / sollen sie wo das geschehe einen verordenen / der sie seiner F. G. auff dem fußstapffen nachfürt / vnd wann sie vff zwo tag reiß zum hauffen komen / sollen sie dasselbig dem Grauen von Solms oder Christoffeln von Schawenburg zu wissen thůn / der dann zu jnen komen soll vnd sie mustern / vnnd sollen in einer Besoldung gleich die ersten wie die andern begriffen sein.
  cs: |-
    Dále: protože Jeho knížecí Milost ve svých dopisech několikrát uvedla, že pomořanští jezdci {reisigen}, až do dvou set šedesáti koní, by se mohli déle zdržet, mají [komisaři], kdyby se tak stalo, ustanovit někoho, kdo je povede za Jeho knížecí Milostí v jejích stopách. Až se přiblíží na dva dny cesty k vojsku {hauffen}, mají to oznámit hraběti ze Solmsu nebo Christoffelovi von Schawenburg; ten k nim pak má přijet a přehlédnout je. A mají být zahrnuti do téhož služného, stejně ti první jako ti další.
- typ: odstavec
  de: |-
    Item so bald die vorgemelte reutter in allem abgefertigt / vnd auff das lengst acht vnd zwentzig oder neun vnd zwentzig diß in zug bracht / sollen sie beide den nechsten sich nach Landaw / daselbst auff den letsten Mai anzukomen / verfügen / alda sie den ersten Junij Margraff Albrechten zu Brandenburg / etc. mit seiner F. G. achthundert pferden (dieweil Graue Wilhelms von Fürstenbergs hundert vnd fünff vnd zwentzig / vnd Graue Hansen vō Nassens hundert pferdt vnder sein F.G. vnd dero tausent pferde zal gethan) zu mustern / auch wo sein F.G. hundert oder hundert vnd zehen / oder hundert vnd zwentzig pferde vngefehrlich vber gemelte tausent pferde / darinn die Fürstenbergischen vnd Nassischen gerechnet / brechte / sollen auch wie die andern vnd Hertzog Moritzen nach verung jrer F. G. bestallung gemustert werden / nach laut der Copei solcher bestallung hiemit vberantwort / darnach sie sich zu richten im mustern des abzelens vnd anrits gelt vnd sonst in alle andere weg zuhalten haben / wie mit Hertzog Moritzen / allein sollen hochgedachtem Margraff Albrechten viertausent sechßhundert gulden / die sein F.G. auff rechnung auff jr reutter empfangen / abgezogen vnnd darauff bezalt werden / So aber das anrit gelt mehr betreff / soll mann das wie mit Hertzog Moritzen anstehen lassen / vnd allein den Monat sold bezallen / wie sie dem allem als die Verstengigen zuthůn wissen. Dieweil nun solchs alles hochgedachter Kei. Mai. ernstlicher / mündtlicher beuelch / will vnnd meinung ist / Hab ich Johan von Lier / Herr zu Bercheim / Kei. Ma. rath vnd öberster teutscher kriegs Commissarius / solchs demselben gemeß in dise Instruction verfast / die mit eigner handt vnderschriben / vnnd mein angeborn Petschier zu ende für vnd auff getruckt / Actum Speir den 24. Mai. der mindern zall Christi / Im 44.
  cs: |-
    Dále: jakmile budou uvedení jezdci ve všem odbaveni a nejpozději dvacátého osmého nebo dvacátého devátého tohoto [měsíce] vypraveni na tažení {zug}, mají se oba nejkratší cestou odebrat do Landau, kam mají dorazit posledního května. Tam mají prvního června přehlédnout markraběte Albrechta Braniborského atd. s osmi sty koňmi Jeho knížecí Milosti (protože hrabě Wilhelm z Fürstenbergu se sto dvaceti pěti a hrabě Hans z Nassau se sty koňmi byli přiřazeni pod Jeho knížecí Milost a do jejího počtu tisíce koní). Přivede-li Jeho knížecí Milost nad uvedený tisíc koní, v němž jsou započteni fürstenberští a nasavští, asi sto, sto deset nebo sto dvacet koní navíc, mají být i ti přehlédnuti jako ostatní a jako u vévody Mořice podle služebního listu {bestallung} Jeho knížecí Milosti,[^1] a to podle znění jeho opisu {Copei}, který se jim tímto odevzdává. Podle něho se mají řídit při přehlídce, při odpočítávání a příjezdném {anrits gelt} i ve všech ostatních věcech, stejně jako u vévody Mořice. Jen se jmenovanému markraběti Albrechtovi mají odečíst čtyři tisíce šest set zlatých, které Jeho knížecí Milost přijala na účet za své jezdce, a teprve potom se mu má vyplácet. Kdyby však příjezdné činilo více, má se to jako u vévody Mořice odložit a vyplatit jen měsíční žold {Monat sold}, jak to všechno jako znalí lidé dobře umějí. Poněvadž je to všechno vážný ústní rozkaz, vůle a mínění jmenovaného Jeho císařského Veličenstva, sepsal jsem já, Johan von Lier, pán z Berchemu, rada Jeho císařského Veličenstva a nejvyšší německý válečný komisař {kriegs Commissarius}, toto v souladu s ním do této instrukce, kterou jsem vlastní rukou podepsal a na konci opatřil svou rodovou pečetí {Petschier}. Dáno ve Špýru 24. května léta Kristova menšího počtu 44.[^2]
- typ: odstavec
  de: |-
    Die Schützen belangen / wie Keis. Mai. die bestallung jres inhalts auff die tausent pferde gehalten haben / wo aber die Fürsten mehr als 1000. pferde brechten / dasselbig bewilligt jr Mai. daß halb spiesser vnd das anderhalb theil Schützen sein mögen.
  cs: |-
    Co se týče střelců {Schützen}, platí služební list Jeho císařského Veličenstva podle svého obsahu na tisíc koní. Přivedou-li však knížata více než 1000 koní, povoluje Jeho Veličenstvo, aby polovina z nich byli kopiníci {spiesser} a druhá polovina střelci.
poznamky:
- n: 1
  text: |-
    „Nach verung“ (také na [[6-005r|listu 5]] „Verung mündtlicher abrede“) zjevně znamená „podle, na základě“ (vermöge); jde buď o tiskovou chybu, nebo o nerozepsanou zkratku. Podobně „Verstengigen“ je tisková chyba za Verstendigen.
- n: 2
  text: |-
    Johan von Lier (Jan van Lier), pán z Berchemu u Antverp, byl císařským radou a nejvyšším válečným komisařem pro německé vojsko. „Der mindern zall“ – letopočet zkrácený o tisíce a stovky, tj. [15]44.
