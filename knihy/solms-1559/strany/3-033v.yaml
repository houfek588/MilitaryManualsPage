bloky:
- typ: nadpis
  uroven: 2
  de: |-
    Von Feurwerck.
  cs: |-
    O ohňostroji {Feurwerck}.
- typ: odstavec
  de: |-
    DIeweil dann zu der Artolorei auch gehört das Feurwerck/ so will dasselbig geordnet vnnd versehen sein/ Erstlich mit dem Geschütz/ als Mörser mit dem Zeug darzů vnnd personen die damit wissen vmbzugehen/ Dieweil dann das Geschütz mit sampt dem Zeug vnd aller Rüstung nichts nütz ist/ es seien dann personen darbei die darmit wissen vnd künden/ So hab ich zum ersten für mich genommen den Zeug/ den mann darzů haben muß/ wie die personen den zuerkennen wissen/ brauchen vnnd machen sollen/ vnnd den von etlichen setzen oder zusamen vermischung stuckweiß verordnet/ daß mich bedünckt es sei der recht Zeug/ damit mann etwas gewaltigs mag außrichten/ vnd an dem geringsten bekommen/ wiewol mann noch vil Feurwercks macht von köstlichem Gummi vnd Matrealien auß der Apotecken/ dieselbigen gehören zu den Schůler künsten/ die im grossen werck nicht sind auch schwer zubekommen/ Darumb soll ein jeder der darmit vmbgehet/ sich zu disem verzeichneten zeug halten vnd vben.
  cs: |-
    Poněvadž tedy k dělostřelectvu {Artolorei} patří také ohňostroj, vyžaduje si, aby byl řádně uspořádán a opatřen – nejprve děly {Geschütz}, jako jsou moždíře {Mörser}, dále příslušnou hmotou a osobami, které s tím dovedou zacházet. Jelikož však děla spolu s hmotou a veškerou výzbrojí {Rüstung} nejsou k ničemu, není-li u nich lidí, kteří se v tom vyznají a umějí to, předsevzal jsem si nejprve pojednat o hmotě, kterou k tomu je třeba mít, jak ji lidé mají umět rozpoznat, používat a vyrábět, a po částech jsem ji sestavil z několika receptů neboli směsí, takže se mi zdá, že to je ta pravá hmota, s níž lze provést něco mocného a pořídit ji za nejnižší cenu; ačkoliv se dělá ještě mnoho ohňostrojů z drahých pryskyřic a látek[^1] z lékárny, ty náležejí k žákovským kouskům, které se ve velkém díle neužívají a také se těžko shánějí. Proto nechť se každý, kdo s tím zachází, drží těchto zde zapsaných směsí a cvičí se v nich.
- typ: odstavec
  de: |-
    Zum andern lern ich hiebei den Zeug einzufassen vnd zuuerbinden/ zu werffen vnd zuschiessen/ deßgleichen schlagende vnd springende kugeln/ das mich bedünckt wan ein Büchsenmeister souil kön/ vnd die verzeichnuß wol wist zumachen vnd zu zůrichten/ er soll wol damit bestehen/ doch ist die vbung das best stuck daruff/ dann so einer lenger mit vmbgeht/ so er alles mehr sindt/ wie er den Zeug starck/ röß/ schwach oder langsam setzen vnd machen sollen.
  cs: |-
    Za druhé zde učím, jak tu hmotu plnit a ovazovat, jak ji vrhat a střílet, a stejně tak třaskavé a tříštivé koule {kugeln}; a zdá se mi, že když toho puškař {Büchsenmeister} bude tolik znát a bude umět tyto předpisy dobře zhotovit a připravit, dobře s tím obstojí, avšak cvik je v tom to nejlepší, neboť čím déle s tím kdo pracuje, tím lépe shledává,[^2] jak má hmotu sestavit a učinit silnou, prudkou, slabou nebo pomalou.
- typ: odstavec
  de: |-
    Item ein jeder der mit dem Puluer/ Feurwerck vnd dergleichen handelt/ soll sich hüten daß er nit nüchtern damit vmbgehe/ dann der rauch vnd dampff von dem Puluer vnd Feurwerck schlecht sich eim in den kopff vnd hirn/ legt sich auch an das hertz vnd feult die Leber/ macht schwach/ hitzig vnd dörret/ auch soll er sich hüten vor hitzigem getränck vnd essen das stopfft/ halt sich an linde essen was weicht vnd kült ist gůt/ Nim des ein exempel wan einer geschoffen wirt/ wie jm das puluer die wunden anzindt vnd erhitzt/ Also thůt es auch besonder so ein Mensch wundt vnnd geschwörig im leib ist/ darumb welcher mit Feurwerck wil oder muß vmbgehn/ das soll er im lufft vnd windt thůn/ das er den dampff von jm treibe.
  cs: |-
    Dále: každý, kdo zachází se střelným prachem {Puluer}, ohňostrojem a podobnými věcmi, má se chránit toho, aby s tím pracoval nalačno; neboť kouř a výpary ze střelného prachu a ohňostroje stoupají člověku do hlavy a mozku, ukládají se také na srdce, kazí játra, oslabují, rozpalují a vysušují. Rovněž se má varovat horkých nápojů a jídel, která ucpávají; ať se drží jemných jídel, což změkčuje a chladí a je dobré. Vezmi si příklad z toho, když je někdo postřelen, jak mu střelný prach ránu roznítí a rozpálí; totéž činí zvláště tehdy, je-li člověk uvnitř těla raněn nebo má vředy. Proto kdokoli chce nebo musí zacházet s ohňostrojem, má tak činit na čerstvém vzduchu a ve větru, aby od něho výpary odháněl.
poznamky:
- n: 1
  text: V tisku přesmyčka *Matrealien* místo *Materialien* („látky, suroviny“).
- n: 2
  text: V tisku stojí sazečská záměna *f* za dlouhé *ſ*, tedy *sindt* místo *findt* („shledává, zjišťuje“).
