bloky:
- typ: nadpis
  uroven: 2
  de: |-
    Von Feurwerck.
  cs: |-
    O ohňostroji {Feurwerck}.
- typ: odstavec
  de: |-
    DIeweil dann zu der Artolorei auch gehört das Feurwerck/ so will dasselbig geordnet vnnd versehen sein/ Erstlich mit dem Geschütz/ als Mörser mit dem Zeug darzů vnnd personen die damit wissen vmbzugehen/ Dieweil dann das Geschütz mit sampt dem Zeug vnd aller Rüstung nichts nütz ist/ es seien dann personen darbei die darmit wissen vnd künden/ So hab ich zum ersten für mich genommen den Zeug/ den mann darzů haben muß/ wie die personen den zuerkennen wissen/ brauchen vnnd machen sollen/ vnnd den von etlichen setzen oder zusamen vermischung stuckweiß verordnet/ daß mich bedünckt es sei der recht Zeug/ damit mann etwas gewaltigs mag außrichten/ vnd an dem geringsten bekommen/ wiewol mann noch vil Feurwercks macht von köstlichem Gummi vnd Matrealien auß der Apotecken/ dieselbigen gehören zu den Schůler künsten/ die im grossen werck nicht sind auch schwer zubekommen/ Darumb soll ein jeder der darmit vmbgehet/ sich zu disem verzeichneten zeug halten vnd vben.
  cs: |-
    Poněvadž tedy k dělostřelectvu {Artolorei} patří také ohňostroj, je třeba jej uspořádat a opatřit: předně děly {Geschütz}, jako jsou moždíře {Mörser}, dále k tomu potřebnou hmotou a lidmi, kteří s tím umějí zacházet. Děla i s hmotou a veškerou výzbrojí {Rüstung} totiž nejsou k ničemu, nejsou-li u nich lidé, kteří se v tom vyznají a umějí to. Proto jsem si nejprve vzal za úkol pojednat o hmotě, kterou je k tomu třeba mít, a o tom, jak ji mají lidé umět rozpoznat, užívat a vyrábět. Z několika receptů čili směsí jsem ji sestavil po jednotlivých složkách tak, že ji pokládám za tu pravou hmotu, s níž lze vykonat něco mocného a kterou lze pořídit nejlaciněji. Dělá se sice ještě mnoho ohňostrojů z drahých pryskyřic a látek[^1] z lékárny, ty však patří ke školským kouskům, které se ve velkém díle neuplatní a také se těžko shánějí. Proto se má každý, kdo s tím zachází, držet zde zapsaných směsí a cvičit se v nich.
- typ: odstavec
  de: |-
    Zum andern lern ich hiebei den Zeug einzufassen vnd zuuerbinden/ zu werffen vnd zuschiessen/ deßgleichen schlagende vnd springende kugeln/ das mich bedünckt wan ein Büchsenmeister souil kön/ vnd die verzeichnuß wol wist zumachen vnd zu zůrichten/ er soll wol damit bestehen/ doch ist die vbung das best stuck daruff/ dann so einer lenger mit vmbgeht/ so er alles mehr findt/ wie er den Zeug starck/ röß/ schwach oder langsam setzen vnd machen sollen.
  cs: |-
    Za druhé zde učím, jak hmotu plnit a ovazovat, jak ji vrhat a střílet, a také třaskavé a tříštivé koule {kugeln}. Zdá se mi, že bude-li toho puškař {Büchsenmeister} tolik umět a dovede-li tyto předpisy dobře provést a připravit, dobře s tím obstojí. Nejlepší je ovšem praxe, neboť čím déle s tím kdo zachází, tím víc zjišťuje, jak má hmotu sestavit a udělat silnou, prudkou, slabou nebo pomalou.
- typ: odstavec
  de: |-
    Item ein jeder der mit dem Puluer/ Feurwerck vnd dergleichen handelt/ soll sich hüten daß er nit nüchtern damit vmbgehe/ dann der rauch vnd dampff von dem Puluer vnd Feurwerck schlecht sich eim in den kopff vnd hirn/ legt sich auch an das hertz vnd feult die Leber/ macht schwach/ hitzig vnd dörret/ auch soll er sich hüten vor hitzigem getränck vnd essen das stopfft/ halt sich an linde essen was weicht vnd kült ist gůt/ Nim des ein exempel wan einer geschoffen wirt/ wie jm das puluer die wunden anzindt vnd erhitzt/ Also thůt es auch besonder so ein Mensch wundt vnnd geschwörig im leib ist/ darumb welcher mit Feurwerck wil oder muß vmbgehn/ das soll er im lufft vnd windt thůn/ das er den dampff von jm treibe.
  cs: |-
    Dále: každý, kdo zachází se střelným prachem {Puluer}, ohňostrojem a podobnými věcmi, se má vyvarovat toho, aby s tím pracoval nalačno; kouř a výpary ze střelného prachu a ohňostroje totiž stoupají člověku do hlavy a mozku, usazují se i na srdci, kazí játra, oslabují, rozpalují a vysušují. Také se má vyhýbat horkým nápojům a jídlům, která zacpávají, a držet se lehkých jídel, která změkčují a chladí; to je dobré. Vezmi si příklad z toho, když je někdo postřelen: jak mu prach ránu zanítí a rozpálí. Stejně působí [výpary], zvláště je-li člověk uvnitř těla raněný nebo má vředy. Proto kdo chce nebo musí zacházet s ohňostrojem, má tak činit na vzduchu a ve větru, aby od něho vítr výpary odvál.
poznamky:
- n: 1
  text: V tisku přesmyčka *Matrealien* místo *Materialien* („látky, suroviny“).
