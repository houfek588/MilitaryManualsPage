bloky:
- typ: odstavec
  de: |-
    EIn jeder Oberster Feldhauptman / so er von einem Kriegsherrn mit Kriegsuolck / in ein frembd Landt / dasselbig zu erobern / geschickt wirt / ist schuldig allen müglichen fleiß fürzuwenden / daß er nit allein von den Feinden / seinem vndergebenem Kriegsuolck zubezalen gelt bekeme / sonder daß er auch seinem Herrn gelt auß dem Landt schicke. Dieweil die Obersten der person halb vngleich seind / als etliche Fürsten / Grauen / Herren / vnnd vom Adell / so mag von wegen jhrer besoldung nichts beschließlichs angezeigt werden.
  cs: |-
    Každý nejvyšší polní hejtman {Oberster Feldhauptman}, je-li vyslán válečným pánem {Kriegsherrn} s válečným lidem {Kriegsuolck} do cizí země, aby ji dobyl, je povinen vynaložit veškerou možnou píli nejen k tomu, aby od nepřátel získal peníze na zaplacení podřízeného válečného lidu, nýbrž aby i svému pánovi posílal ze země peníze. Poněvadž jsou však nejvyšší velitelé co do svého postavení různí – někteří jsou knížata, jiní hrabata, páni či šlechtici –, nelze o jejich žoldu {besoldung} uvést nic konečného.
- typ: odstavec
  de: |-
    Die obersten Feldhauptleut / werden auch inn zweierlei form mit jren Instructionen in das Feld abgefertiget.
  cs: |-
    Nejvyšší polní hejtmani bývají také do pole vypravováni se svými instrukcemi dvojím způsobem.
- typ: odstavec
  de: |-
    Erstlich mit volkommenem gewalt also / wann schon alle Kriegßräth (deren ein jeder Kriegsherr / oder Oberster verstendiger soll haben) sampt den Hauptleuten einhellig ein handlung fürzunemen riethen / daß er dannoch ein andere meinung fürnemen vnd handeln möcht. Zum andern / das der Oberst zum mehrntheil seinen zugeordneten Kriegsräthen folgen muß.
  cs: |-
    Za prvé s plnou mocí tak, že i kdyby všichni váleční radové {Kriegßräth} (jichž má mít každý válečný pán či rozumný nejvyšší velitel dostatek) spolu s hejtmany {Hauptleuten} jednomyslně radili podniknout nějakou akci, on přesto může přijmout jiné rozhodnutí a jednat podle něj. Za druhé tak, že nejvyšší velitel musí většinou následovat k němu přidělené válečné rady.
- typ: odstavec
  de: |-
    Disen Artickel soll billich ein jeder Oberster Kriegsherr wol bedencken / vnd fleissig vernemen / was er für ein Obersten / auch darzů für Kriegsräthe / wider die feind zuhandeln hab.
  cs: |-
    Tento článek má po právu každý nejvyšší válečný pán dobře uvážit a pilně zkoumat, jakého má nejvyššího velitele a k tomu jaké válečné rady pro jednání proti nepřátelům.
- typ: odstavec
  de: |-
    Deßhalben wirt von vil Kriegserfarnen fürs fruchtbarlichs geacht / wann ein Kriegsherr ein geschickten / verstendigen / erfarnen obersten Feldhauptman außsendet / daß er demselbigen volkomnen gewalt (der gestalt) gebe / wann der Oberst ziehen / stilligen / schlagen / Flecken belegern / schantzen / schiessen / stürmen / oder andere handlung im Krieg fürnemen wolt / das er andere hohe ämpter vnd Kriegsräth nicht fragen darff / ob er solchs thůn oder vnderlassen sol / sonder allein zufragen habe / er sei solchs zuthůn willens / daß sie jhm rathen / wie ers auffs geschicklichst anfahe / damit es zuuersichtlich / fruchtbarlich / werden möcht / Dise meinung wirt darumb angezeigt / daß ein jrriger eygensinniger / widerspenniger man / vnder 25. oder 20. Kriegsräten im Rath ein anhang bekompt / vnd dardurch ein laborint macht / das niemandt im feld nichts trefflichs außrichten noch handeln kan.
  cs: |-
    Proto mnozí zkušení válečníci pokládají za nejužitečnější, když válečný pán vysílá schopného, rozumného a zkušeného nejvyššího polního hejtmana, aby mu dal plnou moc v tom smyslu, že chce-li nejvyšší velitel táhnout, ležet v klidu, svést bitvu, obléhat městečka, stavět šance, střílet, podnikat útoky nebo jiné válečné činy, nemusí se ptát jiných vysokých úředníků a válečných radů, zda to má učinit nebo nechat být, nýbrž se má ptát pouze tak, že zamýšlí takto jednat a aby mu poradili, jak to provést co nejobratněji, aby to přineslo nadějný a plodný výsledek. Toto mínění se uvádí proto, aby nějaký pomýlený, svéhlavý a vzpurný člověk mezi dvaceti pěti či dvaceti válečnými radami v radě nezískal přívržence a nevytvořil tím takový labyrint, že nikdo v poli nedokáže nic závažného vykonat ani zařídit.
- typ: odstavec
  de: |-
    Ein jeder Oberster Feldhauptman regiert vnd verwalt das gantz Leger / gibt beuelch inn allen sachen / außgenommen etlich Artickel / die den anderen hohen ämptern vnder jhm zugehören / Nemlich dem Obersten Leutenant / Feldmarschalck / Obersten vber das Fußuolck / Zeugmeister / vnd oberster Prouiantmeister / doch wann jetzt dieselben
  cs: |-
    Každý nejvyšší polní hejtman řídí a spravuje celé ležení {Leger} a vydává rozkazy ve všech věcech, s výjimkou některých článků, které příslušejí jiným vysokým úřadům pod ním – totiž nejvyššímu poručíkovi {Leutenant}, polnímu maršálkovi {Feldmarschalck}, plukovníkovi nad pěchotou {Fußuolck}, zbrojmistrovi {Zeugmeister} a nejvyššímu proviantmistrovi {Prouiantmeister}; avšak když tito jmenovaní
