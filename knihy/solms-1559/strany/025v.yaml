bloky:
- typ: odstavec
  de: |-
    Wann aber die beid angeregten Renfanen / als sichs wol begeben möcht / wider den Türcken in das feld zusamen kämen / wirt von den Kriegsuerstendigen für billich geacht / sie vergleichen sich des vor vnd nach zugs ein tag vmb den andern / wann aber die beide oder ein theil allein gemelter vergleichung / nicht zu frieden sein wolten / lassen sie sich billich hierinn zu jederzeit eins Römischen Keysers / Königs oder Ertzhertzogen von Osterreich / auch derselben obersten Feldhauptleut / vnd Kriegsrath entscheiden vnd benügen.
  cs: |-
    Kdyby se však obě zmíněné předvojové korouhve {Renfanen} – jak by se snadno mohlo přihodit – sešly v poli společně proti Turkům, pokládají znalci vojenství za spravedlivé, aby se obden střídaly v předvoji a zadním voji {vor vnd nach zugs}; kdyby však obě strany nebo jedna z nich nechtěly být s takovým vyrovnáním spokojeny, nechť se v tom pokaždé po právu podrobí rozhodnutí římského císaře, krále či rakouského arcivévody, jakož i jejich nejvyšších polních hejtmanů {obersten Feldhauptleut} a válečné rady {Kriegsrath}, a s tím se spokojí.
- typ: odstavec
  de: |-
    Dises anzeigen von Steuern vnd Schwaben / geschicht allein darumb / daß ein jeder Kriegsman / der zů hohen ämptern kompt in Teutschland / dise vnd andere Kriegsbreuch im Reich wissen soll.
  cs: |-
    Tento výklad o Štýřanech a Švábech se podává jedině proto, aby každý válečník {Kriegsman}, který v Německu dosáhne vysokých úřadů, znal tyto i jiné válečné zvyklosti v Říši.
- typ: odstavec
  de: |-
    Der Feldmarschalck soll allweg das Leger / darinn mann ligen will / zubesichtigen fürziehen / vnnd sollen / der oberst Zeugmeister / Wacht vnd Quartier meister / alle zů roß vnd fuß auff jhn warten / wann dann der Marschalck / Zeugmeister / vnnd andere sich des Legers auch platzes / da das Geschütz stehn soll / mit jhrem Rathschlag entschlossen haben / so soll der Feldmarschalck / das Leger mit des fußuolcks Quartirmeister theilen / vnnd alßdann Reuttern vnd Knechten quartieren lassen.
  cs: |-
    Polní maršálek {Feldmarschalck} má vždy vyjet napřed prohlédnout ležení {Leger}, v němž se má tábořit, a mají na něj čekat nejvyšší zbrojmistr {oberst Zeugmeister}, vachmistr {Wacht} a kvartýrmistr {Quartier meister}, všichni na koni i pěšky; když se pak maršálek, zbrojmistr a ostatní poradou usnesou na ležení i na místě, kde mají stát děla {Geschütz}, má polní maršálek rozdělit ležení s kvartýrmistrem pěchoty {fußuolcks} a poté nechat ubytovat jezdce {Reuttern} i knechty {Knechten}.
- typ: odstavec
  de: |-
    Der oberst Feldhauptman mag auch wann es jhn für notwendig ansicht / dem Feldmarschalck mehr leut / dann dem Obersten vber die Knecht / oder andere sampt dem Zeugmeister zů ordenen / auch etwan nach seiner gelegenheit das Leger zubesichtigen / selbst darbei sein / wie ers dann macht so ists recht / wenn er aber nicht darbei ist / vnnd hernach kompt / vnd jhm das Leger / vnd platz zu dem Geschütz nicht gefellt / mag er es alles nach seinem gefallen endern / auch sollen / Feldmarschalck vnd Zeugmeister fleissig acht haben / daß sie den Lermen platz nicht zů klein nemen / vnd das Kriegsuolck zu roß vnnd fuß / im Lermen dem Geschütz nicht vnder augen rennen vnd lauffen müsse / etc. Darzů daß ein jeglich Leger Wasser vnd Holtz hab / wie in des Obersten 18. Artickels gemelt.
  cs: |-
    Nejvyšší polní hejtman {oberst Feldhauptman} může také, uzná-li to za nutné, přidělit polnímu maršálkovi více lidí, a to plukovníka {Obersten} nad knechty nebo jiné spolu se zbrojmistrem, a rovněž někdy podle své příležitosti při prohlídce ležení být sám přítomen; jak to zařídí, tak je to správně. Není-li však přítomen a přijde později a ležení či místo pro děla se mu nelíbí, může vše podle své libosti změnit. Polní maršálek a zbrojmistr mají také pilně dbát na to, aby místo poplachu {Lermen platz} nezvolili příliš malé a válečný lid {Kriegsuolck} na koni i pěší nemusel při poplachu běžet a hnát se přímo před ústí děl atd., a kromě toho aby každé ležení mělo vodu a dřevo, jak bylo zmíněno v 18. článku o nejvyšším veliteli.
- typ: odstavec
  de: |-
    Wider die Türcken ist nit gůt fürziehen / sonder nahe bei dem Hauffen vnd Wagenburg bleiben / sonst were das Volck / so voran züge / alles nider zulegen.
  cs: |-
    Proti Turkům není radno táhnout daleko napřed, nýbrž zůstat blízko u hlavního šiku {Hauffen} a vozové hradby {Wagenburg}, jinak by byl lid, který by táhl napřed, všechen pobit.
- typ: odstavec
  de: |-
    Der Feldmarschalck soll wol auffmercken / das alle Prouiant auff den platz inn das Leger komme / vnnd vor dem Leger gar nichts verkaufft werde / vnd mit allem fleiß den freien Marck fürdern / vnd welcher vorm leger im zufürn / zů seiner notturfft prouiant kaufft vnd sie wider im leger verkauffen will / oder Prouiant im leger vngeschätzt verkaufft / dieselben haben die Prouiant sampt weitter straff verwirckt.
  cs: |-
    Polní maršálek má dobře dbát na to, aby veškerý proviant {Prouiant} přišel na tržiště do ležení a aby se před ležením vůbec nic neprodávalo, a se vší pílí má podporovat svobodný trh; a kdokoli před ležením při dovozu koupí proviant nad svou potřebu a chce jej v ležení znovu prodat, anebo prodává proviant v ležení bez úředního odhadu ceny, ten propadá tímto proviantem i dalším trestem.
