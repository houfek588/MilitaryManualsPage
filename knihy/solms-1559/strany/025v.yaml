bloky:
- typ: odstavec
  de: |-
    Wann aber die beid angeregten Renfanen / als sichs wol begeben möcht / wider den Türcken in das feld zusamen kämen / wirt von den Kriegsuerstendigen für billich geacht / sie vergleichen sich des vor vnd nach zugs ein tag vmb den andern / wann aber die beide oder ein theil allein gemelter vergleichung / nicht zu frieden sein wolten / lassen sie sich billich hierinn zu jederzeit eins Römischen Keysers / Königs oder Ertzhertzogen von Osterreich / auch derselben obersten Feldhauptleut / vnd Kriegsrath entscheiden vnd benügen.
  cs: |-
    Kdyby se však obě zmíněné předvojové korouhve {Renfanen} sešly v poli společně proti Turkům, jak se snadno může stát, pokládají znalci válečnictví {Kriegsuerstendigen} za spravedlivé, aby se v předvoji a zadním voji {vor vnd nach zugs} střídaly obden. Kdyby však s takovým vyrovnáním nechtěly být spokojeny obě strany nebo jedna z nich, mají se v tom po právu vždy podrobit rozhodnutí římského císaře, krále nebo rakouského arcivévody a jejich nejvyšších polních hejtmanů {obersten Feldhauptleut} a válečné rady {Kriegsrath} a spokojit se s ním.
- typ: odstavec
  de: |-
    Dises anzeigen von Steuern vnd Schwaben / geschicht allein darumb / daß ein jeder Kriegsman / der zů hohen ämptern kompt in Teutschland / dise vnd andere Kriegsbreuch im Reich wissen soll.
  cs: |-
    Tuto zmínku o Štýřanech a Švábech činím jen proto, aby každý válečník {Kriegsman}, který v Německu dosáhne vysokých úřadů, znal tyto i jiné válečné zvyklosti v Říši.
- typ: odstavec
  de: |-
    Der Feldmarschalck soll allweg das Leger / darinn mann ligen will / zubesichtigen fürziehen / vnnd sollen / der oberst Zeugmeister / Wacht vnd Quartier meister / alle zů roß vnd fuß auff jhn warten / wann dann der Marschalck / Zeugmeister / vnnd andere sich des Legers auch platzes / da das Geschütz stehn soll / mit jhrem Rathschlag entschlossen haben / so soll der Feldmarschalck / das Leger mit des fußuolcks Quartirmeister theilen / vnnd alßdann Reuttern vnd Knechten quartieren lassen.
  cs: |-
    Polní maršálek {Feldmarschalck} má vždy vyjet napřed prohlédnout místo pro ležení {Leger}, kde se má tábořit. Mají na něj čekat nejvyšší zbrojmistr {oberst Zeugmeister}, vachmistr a kvartýrmistr {Wacht vnd Quartier meister}, všichni na koni i pěšky. Když se pak maršálek, zbrojmistr a ostatní po poradě shodnou na ležení i na místě, kde mají stát děla {Geschütz}, má polní maršálek rozdělit ležení s kvartýrmistrem pěchoty {fußuolcks} a potom dát ubytovat jezdce {Reuttern} i knechty {Knechten}.
- typ: odstavec
  de: |-
    Der oberst Feldhauptman mag auch wann es jhn für notwendig ansicht / dem Feldmarschalck mehr leut / dann dem Obersten vber die Knecht / oder andere sampt dem Zeugmeister zů ordenen / auch etwan nach seiner gelegenheit das Leger zubesichtigen / selbst darbei sein / wie ers dann macht so ists recht / wenn er aber nicht darbei ist / vnnd hernach kompt / vnd jhm das Leger / vnd platz zu dem Geschütz nicht gefellt / mag er es alles nach seinem gefallen endern / auch sollen / Feldmarschalck vnd Zeugmeister fleissig acht haben / daß sie den Lermen platz nicht zů klein nemen / vnd das Kriegsuolck zu roß vnnd fuß / im Lermen dem Geschütz nicht vnder augen rennen vnd lauffen müsse / etc. Darzů daß ein jeglich Leger Wasser vnd Holtz hab / wie in des Obersten 18. Artickels gemelt.
  cs: |-
    Nejvyšší polní hejtman {oberst Feldhauptman} může také, uzná-li to za nutné, přidělit polnímu maršálkovi více lidí než plukovníkovi {Obersten} nad knechty nebo jiným spolu se zbrojmistrem[^1] a někdy může být při prohlídce ležení, když se mu to hodí, i sám; jak to zařídí, tak je to správné. Není-li však přítomen, přijde později a ležení či místo pro děla se mu nelíbí, může vše podle svého uvážení změnit. Polní maršálek a zbrojmistr mají také pilně dbát, aby poplachové shromaždiště {Lermen platz} nevyměřili příliš malé a válečný lid {Kriegsuolck} na koni i pěší nemusel při poplachu běžet a hnát se dělům přímo před ústí atd. A dále, aby každé ležení mělo vodu a dřevo, jak bylo řečeno v 18. článku o plukovníkovi.
- typ: odstavec
  de: |-
    Wider die Türcken ist nit gůt fürziehen / sonder nahe bei dem Hauffen vnd Wagenburg bleiben / sonst were das Volck / so voran züge / alles nider zulegen.
  cs: |-
    Proti Turkům není dobré táhnout napřed; je třeba zůstat blízko hlavního šiku {Hauffen} a vozové hradby {Wagenburg}, jinak by lid, který by táhl napřed, byl všechen pobit.
- typ: odstavec
  de: |-
    Der Feldmarschalck soll wol auffmercken / das alle Prouiant auff den platz inn das Leger komme / vnnd vor dem Leger gar nichts verkaufft werde / vnd mit allem fleiß den freien Marck fürdern / vnd welcher vorm leger im zufürn / zů seiner notturfft prouiant kaufft vnd sie wider im leger verkauffen will / oder Prouiant im leger vngeschätzt verkaufft / dieselben haben die Prouiant sampt weitter straff verwirckt.
  cs: |-
    Polní maršálek má dobře dbát, aby veškerý proviant {Prouiant} přicházel na tržiště v ležení a aby se před ležením vůbec nic neprodávalo; svobodný trh má podporovat se vší pílí. Kdo před ležením při dovozu nakoupí proviant pro svou potřebu a chce jej v ležení znovu prodat, anebo kdo prodává proviant v ležení bez úředního odhadu ceny, propadá tento proviant a podléhá dalšímu trestu.
poznamky:
- n: 1
  text: |-
    V tisku *dem Feldmarschalck mehr leut / dann dem Obersten vber die Knecht / oder andere sampt dem Zeugmeister zů ordenen* – *dann* chápeme jako „než“ (na to ukazuje dativ *dem Obersten*); možné je i čtení „přidělit mu navíc plukovníka nad knechty nebo jiné spolu se zbrojmistrem“.
