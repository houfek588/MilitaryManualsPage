bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Kriegßuolck ist / das ist einem Herren zurathen / dann es fert kein Herr wol damit / vnnd solches volck das also außgefürt wirdt / das thůts nicht gern / gedenckt wider hindersich zu seinem Weib / Kindern / gůtern vnd handtierungen die es verseumpt / deßgleichen sollen sie dann im Feld in Regen / Schne / Kelte vnd hitz sein / wider jhren gebrauch so sie daheim haben / das thůt jhnen wehe / seind des nicht gewonet / dann schreiben vnd entbieten jnen jre Weiber nach mit klagen vnnd vngedult / das bewegt sie dann noch weitter / vnd dergleichen vnlust / vnd wann ein Krieg in einem Landt möcht plündern / brennen / wie mann weiß daß solliches geschicht / so würde ein Lantßuolck noch vnwilliger. Deßgleichen wann mann vor den Feind kompt / vnnd etwas ernstlichs zugehn will / das seind sie nicht gewont / lauffen daruon / machen fluchten / vnd wirt ein Feld von jnen entblöst / vnd bringen andere Kriegßleut auch in not vnd schande.
  cs: |-
    válečným lidem {Kriegßuolck} – to pánovi [nelze] radit,[^1] neboť žádný pán s tím nepochodí dobře. Takový lid, který se takto vyvede do pole, nekoná to rád, myslí jen nazpět na svou ženu, děti, statky a živnosti, které zanedbává; stejně tak mají být potom v poli v dešti, sněhu, chladu a horku proti svému zvyku, jaký mají doma, což jim působí strast, nejsou na to zvyklí; pak jim jejich ženy píší a vzkazují s nářky a netrpělivostí, což je rozrušuje ještě více, a podobnou nevolí; a kdyby se ve válce v zemi plenilo a pálilo, jak je známo, že se tak děje, stal by se zemský lid ještě neochotnějším. Stejně tak když se přijde před nepřítele a má dojít na něco vážného, nejsou na to zvyklí, utíkají pryč, dávají se na útěk, pole se jimi obnaží a uvrhnou i ostatní vojáky {Kriegßleut} do tísně a hanby.
- typ: odstavec
  de: |-
    Solt es etwan zu einem schlagen komen / vnd ein Herr die schlacht verliere / dann were jm sein Landtuolck geschlagen / vnnd das Landt mit Volck entblöst / so hett der Feind nach zutrucken / vnd in das landt zutringen / dann were das Volck vom landt entplöst vnd ledig / da ist zu gedencken was schrecken das in einem landt bringen würde.
  cs: |-
    Došlo-li by pak k bitvě a pán by bitvu prohrál, byl by mu jeho zemský lid pobit a země zbavena lidu; nepřítel by tak mohl dotírat a vniknout do země, neboť by země byla lidu zbavena a prázdná – tu si lze představit, jakou hrůzu by to v zemi vyvolalo.
- typ: odstavec
  de: |-
    Vnd wann einem Herren also sein landtuolck geschlagen wirdt / wo er sich wider erholen möcht mit Schatzung vnd dergleichen steur / wann sein Volck erschlagen were.
  cs: |-
    A je-li takto pánovi pobit jeho zemský lid, kde by se mohl znovu vzpamatovat berněmi a podobnými dávkami, když by jeho lid byl pobit?
- typ: odstavec
  de: |-
    Derhalben thůt es einem Herren nicht so wehe / oder ist jm so nachtheillig / wann jm ein frembd Volck zweimal geschlagen / als daß sein Volck einmal geschlagen wirt.
  cs: |-
    Proto pánovi nečiní takovou bolest ani není pro něj tak škodlivé, když je mu dvakrát poražen cizí lid, jako když je mu jednou poražen jeho vlastní lid.
- typ: odstavec
  de: |-
    Darumb soll ein Herr der Krieg füren will / frembd Kriegsuolck haben / die ziehen dem Krieg auß jren landen nach / fragen nichts darnach man brenne oder here / so haben sie dannoch nichts zuuerliern / macht jnen kein anfechten / würde dann schon einem Herren von solchem Kriegßuolck etwas abgeschlagen / oder mit sterben abgeht / so hat ein Herr solliches allezeit wider zuersetzen / mit anderm frembden Kriegßuolck vnd künden die landtschafften wider gelt darzů geben / also spart ein Herr sein landtuolck / vnd bleiben die land besetzt.
  cs: |-
    Proto má pán, který chce vést válku, mít cizí válečný lid; ti táhnou za válkou ze svých zemí, nedbají na to, zda se pálí či pustoší, neboť stejně nemají co ztratit a nedělá jim to žádné starosti. A kdyby pánovi i část takového válečného lidu byla pobita nebo ubyla úmrtím, může to pán vždy znovu nahradit jiným cizím válečným lidem a zemské stavy k tomu mohou opět poskytnout peníze; takto pán šetří svůj zemský lid a země zůstávají obsazeny.
- typ: odstavec
  de: |-
    Darumb ist einem Herren nit zurathen / daß er mit seinem landtuolck kriege / sonder mit frembden / vnd spar sein landtuolck gelt vnnd Prouiant zugeben vnd zu beleitten / deßgleichen Wagen vnd Pferde bei jnen zu ordnen vnd zu finden / vnd dergleichen rüstung Artolorei vnd derselbigen zugehörde notturfft zufüren / vnnd arbeits Volck zu ordnen vnd zugeben / daß kan ein landtschafft wol thůn on beschwerd.
  cs: |-
    Proto nelze pánovi radit, aby válčil se svým zemským lidem, nýbrž s cizím, a nechť šetří svůj zemský lid k tomu, aby dával a doprovázel peníze a proviant {Prouiant}, stejně tak aby u nich opatřoval a zajišťoval vozy a koně, přivážel podobnou výzbroj {rüstung}, dělostřelectvo {Artolorei} i potřeby k němu náležející a zřizoval a poskytoval pracovní lid – to dokáže země dobře konat bez obtíží.
- typ: odstavec
  de: Das aber ein Herr in seinem landt gůt herrn vnd vom Adell hat /
  cs: Že však má pán ve své zemi dobré pány a šlechtice
poznamky:
- n: 1
  text: |-
    V tištěném znění zde zjevnou tiskovou chybou chybí zápor či předpona (*das ist einem Herren zurathen*, dosl. „to lze pánovi radit“), ač ze souvislosti i z následujícího textu plyne význam opačný. V dochovaném mnichovském výtisku tuto chybu opravil dobový či pozdější čtenář rukopisným vpiskem *wider)* nadepsaným nad záhlavím přímo nad slovem *zurathen* (tj. *widerrathen* = „odrazovat, zrazovat“).
