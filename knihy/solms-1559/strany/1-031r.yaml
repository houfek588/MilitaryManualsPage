bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Kriegßuolck ist / das ist einem Herren zurathen / dann es fert kein Herr wol damit / vnnd solches volck das also außgefürt wirdt / das thůts nicht gern / gedenckt wider hindersich zu seinem Weib / Kindern / gůtern vnd handtierungen die es verseumpt / deßgleichen sollen sie dann im Feld in Regen / Schne / Kelte vnd hitz sein / wider jhren gebrauch so sie daheim haben / das thůt jhnen wehe / seind des nicht gewonet / dann schreiben vnd entbieten jnen jre Weiber nach mit klagen vnnd vngedult / das bewegt sie dann noch weitter / vnd dergleichen vnlust / vnd wann ein Krieg in einem Landt möcht plündern / brennen / wie mann weiß daß solliches geschicht / so würde ein Lantßuolck noch vnwilliger. Deßgleichen wann mann vor den Feind kompt / vnnd etwas ernstlichs zugehn will / das seind sie nicht gewont / lauffen daruon / machen fluchten / vnd wirt ein Feld von jnen entblöst / vnd bringen andere Kriegßleut auch in not vnd schande.
  cs: |-
    válečným lidem {Kriegßuolck} – to pánovi [nelze] radit,[^1] neboť žádný pán s tím dobře nepochodí. Lid, který se takto vyvede do pole, nejde rád a myslí jen na návrat ke své ženě, dětem, statkům a živnostem, které zanedbává. Navíc má být v poli v dešti, sněhu, zimě i horku, proti zvyklostem, jaké má doma; to ho trápí, protože na to není zvyklý. Ženy jim pak píší a posílají vzkazy plné nářků a netrpělivosti, což je rozrušuje ještě víc, a podobné mrzutosti. A kdyby se ve válce v zemi plenilo a pálilo – a to se, jak známo, děje –, byl by zemský lid ještě neochotnější. Stejně tak když se přijde před nepřítele a má dojít na něco vážného, nejsou na to zvyklí: utíkají, dávají se na útěk, pole po nich zůstane obnažené a ostatní válečníky {Kriegßleut} uvrhnou do nouze a hanby.
- typ: odstavec
  de: |-
    Solt es etwan zu einem schlagen komen / vnd ein Herr die schlacht verliere / dann were jm sein Landtuolck geschlagen / vnnd das Landt mit Volck entblöst / so hett der Feind nach zutrucken / vnd in das landt zutringen / dann were das Volck vom landt entplöst vnd ledig / da ist zu gedencken was schrecken das in einem landt bringen würde.
  cs: |-
    Kdyby pak došlo k bitvě a pán ji prohrál, byl by mu jeho zemský lid pobit a země zbavena lidu. Nepřítel by pak mohl dotírat dál a vniknout do země, protože by v ní žádný lid nezůstal. Lze si představit, jakou hrůzu by to v zemi vyvolalo.
- typ: odstavec
  de: |-
    Vnd wann einem Herren also sein landtuolck geschlagen wirdt / wo er sich wider erholen möcht mit Schatzung vnd dergleichen steur / wann sein Volck erschlagen were.
  cs: |-
    A je-li pánovi takto pobit jeho zemský lid, odkud by se mohl znovu vzpamatovat berněmi a podobnými dávkami, když by byl jeho lid pobit?
- typ: odstavec
  de: |-
    Derhalben thůt es einem Herren nicht so wehe / oder ist jm so nachtheillig / wann jm ein frembd Volck zweimal geschlagen / als daß sein Volck einmal geschlagen wirt.
  cs: |-
    Proto pána tolik nebolí ani mu tolik neuškodí, když je mu cizí lid poražen dvakrát, jako když je jednou poražen jeho vlastní lid.
- typ: odstavec
  de: |-
    Darumb soll ein Herr der Krieg füren will / frembd Kriegsuolck haben / die ziehen dem Krieg auß jren landen nach / fragen nichts darnach man brenne oder here / so haben sie dannoch nichts zuuerliern / macht jnen kein anfechten / würde dann schon einem Herren von solchem Kriegßuolck etwas abgeschlagen / oder mit sterben abgeht / so hat ein Herr solliches allezeit wider zuersetzen / mit anderm frembden Kriegßuolck vnd künden die landtschafften wider gelt darzů geben / also spart ein Herr sein landtuolck / vnd bleiben die land besetzt.
  cs: |-
    Proto má pán, který chce vést válku, mít cizí válečný lid. Ti táhnou za válkou ze svých zemí a nedbají, zda se pálí či plení; stejně nemají co ztratit, a tak je to nic netrápí. A i kdyby byla pánovi část takového válečného lidu pobita nebo mu vymřela, může ji vždy nahradit jiným cizím válečným lidem a zemské stavy mu na to mohou opět dát peníze. Tak pán šetří svůj zemský lid a země zůstávají zalidněné.
- typ: odstavec
  de: |-
    Darumb ist einem Herren nit zurathen / daß er mit seinem landtuolck kriege / sonder mit frembden / vnd spar sein landtuolck gelt vnnd Prouiant zugeben vnd zu beleitten / deßgleichen Wagen vnd Pferde bei jnen zu ordnen vnd zu finden / vnd dergleichen rüstung Artolorei vnd derselbigen zugehörde notturfft zufüren / vnnd arbeits Volck zu ordnen vnd zugeben / daß kan ein landtschafft wol thůn on beschwerd.
  cs: |-
    Proto nelze pánovi radit, aby válčil se svým zemským lidem, nýbrž s cizím. Svůj zemský lid ať šetří k tomu, aby dodával peníze a proviant {Prouiant} a doprovázel je, aby se u něj opatřovaly a sháněly vozy a koně, aby převážel výzbroj {rüstung}, dělostřelectvo {Artolorei} a jeho potřebné příslušenství a aby určoval a dával pracovní lid. To země dokáže dobře zastat bez obtíží.
- typ: odstavec
  de: Das aber ein Herr in seinem landt gůt herrn vnd vom Adell hat /
  cs: Že však má pán ve své zemi dobré pány a šlechtice
poznamky:
- n: 1
  text: |-
    V tisku zde chybí zápor (*das ist einem Herren zurathen*, dosl. „to lze pánovi radit“), ač ze souvislosti i z následujícího textu plyne opak. V mnichovském exempláři to opravil dobový či pozdější čtenář rukopisným vpiskem *wider)* nad záhlavím strany, zhruba nad slovem *zurathen* (tj. *widerrathen* = „zrazovat“).
