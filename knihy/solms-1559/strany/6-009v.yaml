poznamky:
- n: 1
  text: Summa lateris – mezisoučet „strany“, tj. úseku rejstříku (v tisku vždy se svorkou); součty nemusí odpovídat celé tištěné stránce, rejstřík je ve dvou sloupcích a čte se nejprve levý, pak pravý sloupec.
- n: 2
  text: Droß / Drosser – trénní kůň (s trénním pacholkem) pro zavazadla; v rejstříku se platí polovinou sazby zbrojného koně (6 zl. proti 12 zl.), zpravidla jeden na 12 zbrojných koní.
- n: 3
  text: Neděle Exaudi (6. neděle po Velikonocích) připadla roku 1544 na 25. května, následující středa tedy skutečně na 28. května. Jména jezdců ukazují převážně na hesenskou a franskou šlechtu (dnes von der Tann, Urff, Völkershausen, Linsingen, Rückershausen); jména se ponechávají v podobě tisku.
- n: 4
  text: V tisku „Krān“ s nadtržením nad a; v rejstříku příjezdného (list 14) stojí „Frantz von Kran“ bez znaménka, proto přepsáno „Kran“ (snad rod von Cramm), čtení nejisté.
- n: 5
  text: Tisková chyba – součet položek 5–8 je 46 zbrojných koní (12 + 10 + 12 + 12); s touto hodnotou souhlasí i celkový součet 152 koní na následující straně.
