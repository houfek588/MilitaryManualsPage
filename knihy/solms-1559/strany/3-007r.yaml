bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    desto mehr fleiß mit jn haben auß gemelten vrsachen/ dann er soll jn jmmer etwas vorgeben zu machen/ zuordnen/ zu reissen vnd zu beschreiben/ damit sie nimer müssig gehn/ mag einer sagen/ sol mann sie also hart halten als wann sie noch buben vnd Schüler weren? ja mit seiner maß/ wie sich das gebürt vnd darumb sie da sind/ als mit zu rüstung noch notturfft des Zeughauß was das bedarff/ deßgleichen was im feld darzů sein wil vnd in aller Kriegshandlung/ wann einer sich in söllichen sachen vbet/ schreibt/ reißt/ schnitzet vnd malet/ macht des alle ordnung vnd der gleichen/ ist jhnen gůt hilff/ darzů soll ein Herr jnen helffen vnd selbst vorgeben/ also werden sie lustig vnd willig der Herr/ Zeugmeister/ die verwalter im Zeughauß/ die gemein Büchsenmeister alle geübt vnd gebraucht werden/ alle sachen wol mit der zeit geordnet vnd zugericht/ wann ein Herr lust darzů hat/ selbst darmit vmbgeht vnd zusicht/ darumb soll sich ein grosser Herr jn seim landt nach gůten/ armen gesellen vom Adel vmbsehen/ die auß schicken/ in zügen verlegen/ beschreiben bei die Zeugmeister vnd Beuelchsleut jnen geben jhre Instruction war auff sie sich vben vnnd sehen sollen/ so sie sich dann wol halten soll ein Herr sie wider wol halten/ lernen vnd woll gebrauchen mit der arbeit vnd vbung der Arcolorei vnd was zu dem Krieg gehört/ dann was Herrn selbst thůn vnd außrichten ist vilfeltiger dann daß andere thůn/ aller vorteil/ gewin verlust/ vnd was darauff steht ist alles des Herren/ der halben soll ein Herr es selbs mit versehen/ vnd sein Zeughauß an gůter zurichtung vnd ordnung halten/ des schöne rechnung darüber machen lassen/ allen vorrat was das ist/ nit allein im Zeughauß/ auch auff dem Landt in allen Ämptern vnd Pflegen was alle Jar an einem jeden ort gebessert vnd zugemacht/ deßgleichen was das jar dar von kompt vnd verendert wirt/ soll alles alle jar verrechnet werden/ solche Rechnung dem Fürsten vberantworten/ das soll ein Herr fleissig vbersehn/ damit er wisse was sein vorrat sei/ was jhm mangelt oder fehlet/ mit dem Zeugmeister anders verordnen.
  cs: |-
    věnovat jim z uvedených příčin o to větší píli, neboť jim má ustavičně ukládat něco dělat, pořádat, rýsovat a zapisovat, aby nikdy nezaháleli. Někdo by mohl namítnout: „Mají se tedy držet tak přísně, jako by ještě byli chlapci a žáci?“ Ano, se správnou mírou, jak se sluší a kvůli čemu tu jsou – totiž s přípravou podle potřeby zbrojnice {Zeughauß}, čeho je k ní třeba, a stejně tak toho, co má být v poli a při všem válečném jednání. Když se někdo v takových věcech cvičí, píše, rýsuje, vyřezává a maluje, sepisuje k tomu všechny řády a podobně, je jim to dobrou pomocí; k tomu jim má pán pomáhat a sám jim dávat podněty. Tak budou mít chuť i ochotu – a pán, zbrojmistr {Zeugmeister}, správci ve zbrojnici i prostí puškaři {Büchsenmeister} budou všichni vycvičeni a osvědčeni, všechny věci budou časem dobře uspořádány a připraveny, má-li o to pán zájem, sám se tím zabývá a přihlíží tomu. Proto se má veliký pán ve své zemi poohlédnout po dobrých, chudých tovaryších ze šlechty, vysílat je, vydržovat je na taženích {zügen}, dávat je zapsat u zbrojmistrů a velitelů {Beuelchsleut} a dávat jim poučení, v čem se mají cvičit a na co hledět; chovají-li se pak dobře, má s nimi pán na oplátku dobře nakládat, učit je a hojně je zaměstnávat prací a cvičením v dělostřelectvu {Arcolorei} a v tom, co náleží k válce. Neboť co činí a zařizují páni sami, má mnohonásobně větší účinek než to, co dělají jiní; veškerá výhoda, zisk, ztráta a vše, co na tom závisí, jest pánovo. Proto na to má pán sám spolu dohlížet a udržovat svou zbrojnici v dobré vybavenosti a pořádku, dát o tom pořizovat řádné vyúčtování veškerých zásob, ať jsou jakékoli – nejen ve zbrojnici, nýbrž i na venkově ve všech úřadech a správách {Pflegen}, co se každého roku na kterém místě opravilo a pořídilo a stejně tak co toho roku ubylo a změnilo se; to vše má být každého roku vyúčtováno a takové vyúčtování se má předložit knížeti, jenž je má pilně přehlédnout, aby věděl, jaké jsou jeho zásoby a co mu chybí nebo schází, a mohl to se zbrojmistrem zařídit jinak.
- typ: odstavec
  de: |-
    Nun ist in disen dingen ein grosse fürsorg vnd bedenckens zuhaben/ auß disen vrsachen ist hieoben gnůg dauon gemelt/ wie ein Herr selbs mit zusehn solt was fürdern mag/ vnd so die zusehung von dem Herren nicht geschehen/ wirts schaden brengen.
  cs: |-
    V těchto věcech je tedy třeba mít velikou předvídavost a rozvahu; z těchto příčin bylo výše řečeno dost o tom, jak má pán sám přihlížet ke všemu, co může věci prospět, a nebude-li pán dohlížet, přinese to škodu.
- typ: odstavec
  de: |-
    Darauff ists zuuorkomen/ meins bedunckens/ damit solches nit möcht wider/ so es zugericht were/ durch einn Herrn der darzů kein lust hett/ in ein abfall kommen.
  cs: |-
    Podle mého mínění je třeba tomu předejít, aby takové dílo, jakmile bude jednou zřízeno, nemohlo skrze pána, jenž by k tomu neměl chuti, opět upadnout.
- typ: odstavec
  de: |-
    Daß mann solchs/ dieweils eins Landts schatz vnd trost ist/ wirdt verordnet mit einer Landtsschafft/ daß dieselbig darzů ein ewig Rent
  cs: |-
    Proto nechť se to – jelikož jde o poklad a záštitu země – zařídí se zemskými stavy, aby k tomu věčný důchod
