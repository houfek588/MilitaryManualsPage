bloky:
- typ: odstavec
  de: |-
    Des Feldmarschalcks Ampt das hat vil arbeit / dann der Feldmarschalck ist stehts vnder den Reuttern / vnnd hat das erst treffen an die Feinde in einer Schlacht mit seinen Reuttern / ordenet einen hie den andern dort hin / als auff die Wachten / Warten / Fundierungen / Scharmützel besichtigung zuthůn / zu streiffen inn dem feld / mit den Reuttern Ordnung zumachen / die Leger einzunemen vnd zu regieren mit den Polliceien / Justitien vnd dergleichen Regirungen / er můß der erst wann mann zeucht auß dem Leger / vnd der letst darinn sein / Daß derselbig für vnnd für zuthůn hat / da er dich vnd deines gleichen wol von allem anweisen kan / welcher auff jhn wartet der kan denn solche arbeit bestellen von allem was ich vermeltet habe sehen vnnd lernen / das für einen jungen Gesellen ist / das einer nicht thůn kan bei einem Obersten / der ist der mehrer theil mit seinen Ampts verwaltern im rath / da kompts du odder deines gleichen nicht hinein / vnnd was alßdan von jhnen bedacht zuthůn wirt / das beuilcht er dann zuthůn den Ampts verwaltern / die richten es dann auß vnd thůn die arbeit / wann du dann bei der einem bist vnd auff jhn wartest / dann sichts du das werck mit dem außrichten.
  cs: |-
    Úřad polního maršálka {Feldmarschalcks} má mnoho práce, neboť polní maršálek je ustavičně mezi jezdci {Reuttern} a má v bitvě se svými jezdci první srážku s nepřáteli; posílá jednoho sem a druhého tam, jako na stráže {Wachten}, hlídky, průzkumy,[^1] konat obhlídky šarvátek, vyjíždět na výpravy v poli, stavět s jezdci šik, zabírat ležení {Leger} a spravovat je veřejným řádem {Polliceien}, spravedlností {Justitien} a podobným řízením; když se táhne z ležení, musí být první venku a poslední v něm. Tak má neustále co na práci, v čemž může tebe i tobě rovné ve všem dobře poučit; kdo mu slouží, může takovou práci zařizovat a ze všeho, co jsem uvedl, se dívat a učit, což je pro mladíka to pravé – to člověk nemůže činit u nejvyššího polního hejtmana {Obersten}, neboť ten je většinou v radě se svými správci úřadů, kam ty ani tobě rovní nevstoupíte;[^2] a co se pak u nich rozhodne vykonat, to poručí vykonat správcům úřadů, kteří to potom provedou a odvedou práci – když tedy jsi u některého z nich a sloužíš mu, tehdy vidíš dílo při samém provádění.
- typ: odstavec
  de: |-
    Das dirtte Ampt ist der Artoloreimeister / das auch ein můhsam schwer / sörglich / ernstlich vnd ehrlich Ampt ist / vnnd da ein junger Gesell auch wol etwas bei sehen vnd lernen kan / zeucht mann so hat er groß můhe vnnd arbeit / ligt mann vor einer Stat odder Schloß dann hat er arbeit vnd sorg tag vnd nacht / soll mann schlagen so hat er dergleichen sorg vnnd arbeit / dann er můß die zeit bei dem Geschütz sein / dasselbig zu der Schlacht anrichten vnd arbeiten / Das also ein Artoloreimeister ein můhsam vnnd ehrnstlichs Ampt hat / darinn ein junger Man wol mag gebraucht werden / etwas sehen vnd leren das manlich vnd ehrlich ist.
  cs: |-
    Třetím[^3] úřadem je zbrojmistr {Artoloreimeister}, což je rovněž namáhavý, těžký, nebezpečný, vážný a čestný úřad, u něhož může mladík také mnohé vidět a naučit se: táhne-li se, má velkou námahu a práci; leží-li se před městem či hradem, má práci a starost dnem i nocí; má-li se svést bitva, má stejnou starost a práci, neboť v tu dobu musí být u děl {Geschütz}, připravovat je k bitvě a pracovat s nimi. Zbrojmistr má tedy namáhavý a vážný úřad, v němž může být mladý muž dobře zaměstnán, aby viděl a naučil se něčemu, co je mužné a čestné.
- typ: odstavec
  de: |-
    Diß seind nun die fürnembsten Ampter / da ein junger Gesell bald etwas sehen vnnd lernen kan / so hast du gehört was vngefehrlich vnd in der kürtz daruon jres beuelchs vnd thůn geredt vnnd vermelt ist / darauff hast du dich zubedencken / welches dir am gefellichsten sein wirt / da magst du den Herren bitten / daß er dich zu demselbigen verschreiben wöl.
  cs: |-
    Toto jsou tedy nejpřednější úřady, u nichž může mladík zakrátko něco vidět a naučit se; slyšel jsi tedy, co bylo přibližně a v krátkosti řečeno a zmíněno o jejich pravomoci a činnosti. Na základě toho si máš rozmyslet, který se ti bude nejlépe zamlouvat, a tehdy můžeš pána poprosit, aby tě k němu doporučil.
- typ: nadpis
  uroven: 3
  de: Son.
  cs: Syn.
- typ: odstavec
  de: |-
    Lieber alter Vater ich hab den bericht der hohen Ampter von euch von hertzen gern gehört / vnd neme es zu grossem danck an / dieweil jr dann sagt / ich sol nu selber bedencken welchs mir am nützsten sein wöl /
  cs: |-
    Milý starý otče, zprávu o vysokých úřadech jsem od vás ze srdce rád vyslechl a přijímám ji s velikým díkem; poněvadž tedy říkáte, že si mám nyní sám rozvážit, který by mi byl nejužitečnější,
poznamky:
- n: 1
  text: |-
    V tisku *Fundierungen* – pravděpodobně tiskařská záměna za *Futerungen* (pícování) či *Kundierungen* (výzvědy, průzkum), popř. zakládání a vyměřování stanovišť.
- n: 2
  text: |-
    V tisku přesmyčky souhlásek *kompts* za *kömpst* a *sichts* za *sichst*.
- n: 3
  text: |-
    V tisku přesmyčka *dirtte* za *dritte* („třetí“) a níže *leren* bez *n* ve významu *lernen*.
