bloky:
- typ: odstavec
  de: |-
    Des Feldmarschalcks Ampt das hat vil arbeit / dann der Feldmarschalck ist stehts vnder den Reuttern / vnnd hat das erst treffen an die Feinde in einer Schlacht mit seinen Reuttern / ordenet einen hie den andern dort hin / als auff die Wachten / Warten / Fundierungen / Scharmützel besichtigung zuthůn / zu streiffen inn dem feld / mit den Reuttern Ordnung zumachen / die Leger einzunemen vnd zu regieren mit den Polliceien / Justitien vnd dergleichen Regirungen / er můß der erst wann mann zeucht auß dem Leger / vnd der letst darinn sein / Daß derselbig für vnnd für zuthůn hat / da er dich vnd deines gleichen wol von allem anweisen kan / welcher auff jhn wartet der kan denn solche arbeit bestellen von allem was ich vermeltet habe sehen vnnd lernen / das für einen jungen Gesellen ist / das einer nicht thůn kan bei einem Obersten / der ist der mehrer theil mit seinen Ampts verwaltern im rath / da kompts du odder deines gleichen nicht hinein / vnnd was alßdan von jhnen bedacht zuthůn wirt / das beuilcht er dann zuthůn den Ampts verwaltern / die richten es dann auß vnd thůn die arbeit / wann du dann bei der einem bist vnd auff jhn wartest / dann sichts du das werck mit dem außrichten.
  cs: |-
    Úřad polního maršálka {Feldmarschalcks} dá mnoho práce. Polní maršálek je totiž ustavičně mezi jezdci {Reuttern} a v bitvě se svými jezdci jako první naráží na nepřítele. Posílá jednoho sem, druhého tam – na stráže {Wachten}, na hlídky, na průzkumy,[^1] na obhlídky šarvátek {Scharmützel} a na výpady do pole; s jezdci staví šik {Ordnung}, zabírá ležení {Leger} a spravuje je veřejným řádem {Polliceien}, spravedlností {Justitien} a podobným řízením. Když se táhne, musí z ležení vytáhnout první a zůstat v něm poslední. Má tedy ustavičně co dělat, a proto může tebe i tobě podobné ve všem dobře vyučit. Kdo mu slouží, může takovou práci vykonávat a u všeho, co jsem uvedl, přihlížet a učit se. To je pro mladíka to pravé, a to u plukovníka {Obersten} nejde: ten je většinou se správci svých úřadů v radě, kam ty ani tobě podobní nepřijdete;[^2] a co tam usoudí, že se má vykonat, to poručí vykonat správcům úřadů, kteří to provedou a odvedou práci. Když jsi tedy u některého z nich a sloužíš mu, vidíš dílo přímo při provádění.
- typ: odstavec
  de: |-
    Das dirtte Ampt ist der Artoloreimeister / das auch ein můhsam schwer / sörglich / ernstlich vnd ehrlich Ampt ist / vnnd da ein junger Gesell auch wol etwas bei sehen vnd lernen kan / zeucht mann so hat er groß můhe vnnd arbeit / ligt mann vor einer Stat odder Schloß dann hat er arbeit vnd sorg tag vnd nacht / soll mann schlagen so hat er dergleichen sorg vnnd arbeit / dann er můß die zeit bei dem Geschütz sein / dasselbig zu der Schlacht anrichten vnd arbeiten / Das also ein Artoloreimeister ein můhsam vnnd ehrnstlichs Ampt hat / darinn ein junger Man wol mag gebraucht werden / etwas sehen vnd leren das manlich vnd ehrlich ist.
  cs: |-
    Třetím[^3] úřadem je zbrojmistr {Artoloreimeister}. I to je namáhavý, těžký, nebezpečný, vážný a čestný úřad, u něhož může mladík také leccos vidět a naučit se. Když se táhne, má zbrojmistr velkou námahu a práci; když se leží před městem nebo hradem, má práci a starosti dnem i nocí; má-li se svést bitva, má právě tolik starostí a práce, neboť v tu dobu musí být u děl {Geschütz}, připravit je k bitvě a obsluhovat je. Zbrojmistr má tedy namáhavý a vážný úřad, v němž se mladý muž může dobře uplatnit a vidět a naučit se něco, co je mužné a čestné.
- typ: odstavec
  de: |-
    Diß seind nun die fürnembsten Ampter / da ein junger Gesell bald etwas sehen vnnd leren kan / so hast du gehört was vngefehrlich vnd in der kürtz daruon jres beuelchs vnd thůn geredt vnnd vermelt ist / darauff hast du dich zubedencken / welches dir am gefellichsten sein wirt / da magst du den Herren bitten / daß er dich zu demselbigen verschreiben wöl.
  cs: |-
    To jsou tedy nejpřednější úřady, u nichž může mladík brzy něco vidět a naučit se. Slyšel jsi, co bylo přibližně a ve stručnosti řečeno o jejich pravomoci a činnosti. Nyní si máš rozmyslet, který se ti bude nejvíc zamlouvat; pak můžeš pána poprosit, aby tě k němu doporučil.
- typ: nadpis
  uroven: 3
  de: Son.
  cs: Syn.
- typ: odstavec
  de: |-
    Lieber alter Vater ich hab den bericht der hohen Ampter von euch von hertzen gern gehort / vnd neme es zu grossem danck an / dieweil jr dann sagt / ich sol nu selber bedencken welchs mir am nützsten sein wöl /
  cs: |-
    Milý starý otče, vaši zprávu o vysokých úřadech jsem ze srdce rád vyslechl a jsem vám za ni velmi vděčný. Protože tedy říkáte, že si mám nyní sám rozvážit, který by mi byl nejužitečnější,
poznamky:
- n: 1
  text: |-
    V tisku *Fundierungen* – nejasné slovo; snad tisková chyba za *Futerungen* (pícování) nebo *Kundierungen* (výzvědy), popř. vyhledávání a vyměřování stanovišť. Překlad volí „průzkumy“.
- n: 2
  text: V tisku *kompts* za *kömpst* a *sichts* za *sichst*.
- n: 3
  text: |-
    V tisku *dirtte* za *dritte* („třetí“); dvakrát též *leren* za *lernen*.
