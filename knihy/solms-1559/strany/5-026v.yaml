id: 5-026v
list: 26 (5. kniha)
strana: verso
sken: 490
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Ordnung Rüstung vnd vorrat steht/ so hat mann dann zur zeit der not vnd in der eil die besatzung zuuersehen/ würde es aber etwan die gelegenheit haben/ daß etlich Blochäuser/ Schleusung oder dergleichen Befestung nahe bei oder für den feinden legen/ dieselben müssen alle zeit in gůter hůt besetzt vnd versehen sein/ wie sich das gebürt/ vnd ein jeder wol abnemen vnnd verstehn kan/ aber im fall so sich etwan derhalben ein gewaltiger Zug zutragen würde/ das man das landtuolck in die besatzung erfordern oder legen müst oder würde/ so hat mann allezeit recht Kriegßuolck vnd Kriegßuerstendigen jnen zuzugeben vnd in die besatzung bei sie zulegen.
  cs: |-
    řádu, výbavě a zásobě. Pak lze v čase nouze a ve spěchu posádku {besatzung} zaopatřit. Kdyby však snad nastala taková okolnost, že by některé sruby {Blochäuser}, stavidla {Schleusung} nebo podobná opevnění {Befestung} ležela blízko nepřátel nebo přímo před nimi, musejí být po všechen čas dobře střežena, obsazena a zaopatřena, jak se sluší a jak každý snadno pochopí. Kdyby se však kvůli tomu přihodilo mocné tažení, takže by se zemský lid {landtuolck} musel povolat nebo vložit do posádky, má se mu vždy přidat a k němu do posádky vložit řádný válečný lid a znalci válečnictví {Kriegßuerstendigen}.[^1]
poznamky:
- n: 1
  text: |-
    Tímto odstavcem končí Pátá kniha. Spodní polovinu strany zaujímá titul (*Reinhart der Elter Graue zu Solms/ vnd Herr zu Müntzenberg/ etc.*) a solmský erb uvozující Šestou knihu o přehlídce (*Das sechst Bůch*, titulní list [[6-titul|6-titul]]).
