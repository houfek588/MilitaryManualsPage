id: 5-026v
list: 26 (5. kniha)
strana: verso
sken: 490
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Ordnung Rüstung vnd vorrat steht/ so hat mann dann zur zeit der not vnd in der eil die besatzung zuuersehen/ würde es aber etwan die gelegenheit haben/ daß etlich Blochäuser/ Schleusung oder dergleichen Befestung nahe bei oder für den feinden legen/ dieselbẽ müssen alle zeit in gůter hůt besetzt vnd versehen sein/ wie sich das gebürt/ vñ ein jeder wol abnemen vnnd verstehn kan/ aber im fall so sich etwan derhalben ein gewaltiger Zug zutragen würde/ das man das landtuolck in die besatzung erfordern oder legen müst oder würde/ so hat mann allezeit recht Kriegßuolck vnd Kriegßuerstendigen jnen zuzugeben vnd in die besatzung bei sie zulegen.
  cs: |-
    řádu, výbavě a zásobě – pak jest možno v čase nouze a ve spěchu posádku {Besatzung} zaopatřit. Kdyby však nastala taková okolnost, že by některé sruby {Blochhaus}, stavidla či podobná opevnění {Befestung} ležela blízko u nepřátel nebo přímo před nimi, musejí být v každém čase dobře střežena, obsazena a zásobena, jak se sluší a každý snadno pochopí. V případě však, že by se kvůli tomu přihodilo mocné tažení, že by se zemský lid musel povolat či vložit do posádky, má se jim vždy přidat a do posádky k nim vložit řádný válečný lid a znalce válečnictví {Kriegßuerstendige}.[^1]
poznamky:
- n: 1
  text: |-
    Tímto odstavcem v horní části rubové strany 26. listu (`5-026v`, sken `490`) končí Pátá kniha; spodní polovina téže strany již nese titul (*Reinhart der Elter Graue zu Solms/ vnd Herr zu Müntzenberg/ etc.*) a solmský erbovní strom uvozující následující Šestou knihu (*Das sechst Bůch / Die Musterung belangende*, sken `491`), která v této edici ještě není zařazena.
