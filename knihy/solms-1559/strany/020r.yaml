bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    des Sturms mit der ordnung des platzes halben nit wol erwarten / können auch an denselben orten nicht wol plätz / Darzas oder Paßteien verborgen sein / dammen stende / oder das Geschütz darauff gebrauchen mögen / noch blintgräben vnd dergleichen.
  cs: |-
    pro nedostatek místa řádně vyčkat útoku {Sturms} v šiku; rovněž na takových místech nemohou být snadno skryta prostranství, tarasy[^1] či bašty {Paßteien}, kde by obránci stáli nebo odkud by mohli používat děla {Geschütz}, ani skryté příkopy a podobně.
- typ: odstavec
  de: |-
    Mitler weil soll der Oberst dem Feldmarschalck das Leger zuschlagen befelhen / damit diejenigen / welche dieselb nacht wachen sollen / bei gůter zeit essen vnd fütern / wann dann der Oberst sampt seinen Kriegsuerstendigen / den Flecken gnugsam besichtiget / vnd sich mit denselbigen des schantzens vnd beschiessens wegen / beschlossen hat / mag er als bald in das Leger rücken / doch daß er das geschütz mit fußuolck wol verwahr / auch den Renfanen stercke / wo jn notwendig bedunckt / dieselben bei dem geschütz bleiben / auch den Renfanen halten lassen / biß die Wächter zu roß vnd fuß angefürt werden / Hiemit fürkompt man die außfel vber das Geschütz vnd inn das Leger / die sonst leichtlich mit schaden geschehen mögen.
  cs: |-
    Mezitím má nejvyšší velitel přikázat polnímu maršálkovi {Feldmarschalck} rozbít ležení {Leger}, aby se ti, kdo mají té noci držet stráž, včas najedli a nakrmili koně. Jakmile pak nejvyšší velitel spolu se svými války znalými muži městečko dostatečně prohlédl a dohodl se s nimi o kopání šancí a ostřelování, může se ihned přesunout do ležení; děla však musí dobře zajistit pěchotou {fußuolck} a také posílit předvojovou korouhev {Renfanen}, uzná-li to za nutné, a nechat je zůstat u děl a předvojovou korouhev držet v pohotovosti, dokud nebudou strážní na koni i pěšky přivedeni na místa. Tím se předejde výpadům na děla a do ležení, k nimž jinak snadno dochází se škodou.
- typ: odstavec
  de: |-
    Als bald dann nach rath geschantzt ist / vnd der Zeugmeister das Geschütz gestelt vnd gelegert hat / welchs auffs allereillents geschicht / so soll dann der Zeugmeister streng ob den Büchsenmeistern sein / das dieselben arbeiten / vnd als vil die stück erleiden mögen / schiessen / Mit was ordnung auch eillents geschossen werden soll / wil ich bei dem Zeugmeister ampt von handeln / Sein auch Mörsser vorhanden / darzů Feuerwerck / damit soll mann tag vnd nacht werffen / vil Lermen machen / da geht des Zeugmeisters arbeit an / Auch sollen alle hohe ämpter fleiß an kern daß sie die in der Besatzung vnrühigen vnd erschrecken / die fliessende Bäch abwenden / die Bronnen so mit kendeln geleit sein / abgraben / auch die Wassergräben trucken machen / das geschicht durch auß malen mit Roßmülen / der Oberst soll auch etlich Ertzknappen zum sprengen vnd fußuolck haben / auch soll der Oberst alle Kriegsuerstendigen lassen besehen / ob nicht etlich Wäl / Maurn / Thürn / Polwerck zu graben vnd zu sprengen wern / jhnen die Müllen / wo er kan / nemen / darzů verhindern das niemand ein oder auß der Besatzung wandern möge.
  cs: |-
    Jakmile jsou tedy podle rady vykopány šance a zbrojmistr {Zeugmeister} rozestavil a usadil děla – což se děje co nejrychleji –, má zbrojmistr přísně dohlížet na puškaře {Büchsenmeistern}, aby pracovali a stříleli, co jen kusy snesou; v jakém pořadí se také má rychle střílet, o tom pojednám při úřadu zbrojmistra. Jsou-li po ruce také moždíře {Mörsser} a k tomu ohňostroje {Feuerwerck}, má se jimi metat dnem i nocí a vyvolávat mnoho poplachů {Lermen} – zde začíná pravá práce zbrojmistra. Také všichni vysocí úředníci mají vynaložit píli, aby ty v posádce {Besatzung} znepokojovali a děsili: mají odvést tekoucí potoky, překopat studny a prameny vedené žlaby a také vysušit vodní příkopy, což se děje odčerpáváním pomocí koňských žentourů; nejvyšší velitel má mít také několik horníků k podkopávání a odstřelování i pěchotu a má dát všem války znalým mužům prohlédnout, zda by se nedaly podkopat a vyhodit do povětří některé valy, hradby, věže či bolverky {Polwerck}; má jim také vzít mlýny, kde jen může, a k tomu zabránit, aby nikdo nemohl chodit do posádky ani z ní ven.
- typ: odstavec
  de: |-
    Der Oberst soll fleissig warnemen lassen / an welchen orten die inn der Besatzung bawen / daß soll er dem Zeugmeister / als vil möglich / mit schiessen vnd werffen zuwehrn / befelhen.
  cs: |-
    Nejvyšší velitel má dávat pilně pozor, na kterých místech ti v posádce stavějí opevnění, a to má přikázat zbrojmistrovi, aby jim v tom podle možnosti bránil střelbou a metáním.
- typ: odstavec
  de: |-
    Wann nun ein Stat / Schloß oder Fleck / nach gůtbeduncken des Obersten vnd der Kriegserfarnen / mit schiessen / gräben außfüllen / mit gräben zurichten zum sprengen / zum stürmen / gearbeit ist / soll der Oberst aller hohen ämpter / aller Hauptleut / sampt andern alten erfarnen Kriegsleuten rath pflegen / ob er gleich (wie im anfang
  cs: |-
    Když pak je město, hrad nebo městečko podle uvážení nejvyššího velitele a zkušených válečníků {Kriegsleuten} zpracováno střelbou, zasypáváním příkopů a hloubením štol k odstřelu i k útoku, má se nejvyšší velitel poradit se všemi vysokými úředníky, všemi hejtmany {Hauptleut} i s jinými starými zkušenými válečníky – i kdyby měl (jak na počátku
poznamky:
- n: 1
  text: |-
    V originále „Darzas“ (patrně z „Tarzas“ / „Tarras“ – taras, dřevěný či sypaný obranný val a krytí pro obránce a děla).
