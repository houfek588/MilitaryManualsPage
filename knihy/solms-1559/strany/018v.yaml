bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    thůn wolt / nit anders von dir abziehen / so mach jm vber ein Wasser / oder festen pasß ein silberin brücken / Dann welcher theil im Leger für dem anderen abzeucht / so hat der ander das Feld mehr dann halb gewunnen.
  cs: |-
    učinil, jinak odtáhnout, postav mu přes vodu či pevný průsmyk stříbrný most.“ Neboť která strana v ležení {Leger} odtáhne před druhou, tam má druhá strana pole již více než z poloviny vyhrané.
- typ: odstavec
  de: |-
    Ein jeder Oberster / soll gůt kundtschafft machen / daß er bei zeit / der Feind abzug / es sei tag oder nacht / innen werde / vnd sein dises gewisse anzeigungen eins zuuersichtlichen abzugs / wann ein Leger grossen mangel an prouiant vnd futerung gewint / oder sich das Kriegsuolck heimlich vom Leger hinweg stilt / oder offentlich von seinem Obersten felt / oder wann vngefehrlich zwei Leger zusamen kommen / vnd daß ein vil stercker zu roß / fuß / vnd geschütz / dann das ander ist / alßdann mag mann sich eines abzugs oder vberfals versehen.
  cs: |-
    Každý nejvyšší velitel {Oberster} si má opatřit dobré zprávy {kundtschafft}, aby se včas dozvěděl o odchodu nepřátel, ať ve dne nebo v noci; a jistými znameními nadějného odchodu jsou tato: když v ležení nastane veliký nedostatek proviantu {prouiant} a píce, anebo se válečný lid {Kriegsuolck} potají z ležení vytrácí či veřejně odpadá od svého nejvyššího velitele, anebo když se náhodou sejdou dvě ležení a jedno je mnohem silnější na koni, pěšky i děly {geschütz} než druhé – tehdy se lze nadít ústupu nebo přepadu.
- typ: odstavec
  de: |-
    Von einem vberfall zu reden / kan auh nicht statlich / wie vor von einer schlacht zuhandeln / geschehen / sonder es wirt auch einem Obersten sampt seinen Kriegserfarnen beuolhen / allein darauff mag mann acht haben / wann ein Oberster mit seinem Volck verächtlich lege / nicht gůte wacht hielten / der mehrer theil (wie offt geschicht) auff die beut vnd füterung geritten vnnd gelassen weren / wann ein Oberster solches erfert / soll er sich nit lang seumen.
  cs: |-
    Rozepisovat se o přepadu nelze také tak zevrubně, jak bylo řečeno výše o jednání v bitvě, nýbrž se to rovněž svěřuje nejvyššímu veliteli spolu s jeho zkušenými válečníky; pouze na to je třeba dávat pozor, když by nějaký velitel ležel se svým lidem lehkomyslně, nedrželi dobrou stráž {wacht} a větší část lidí by (jak se často stává) vyjela či se rozeběhla za kořistí a pící – jakmile se nejvyšší velitel něco takového dozví, nemá dlouho váhat.
- typ: odstavec
  de: |-
    Der Oberst soll auch fleissige erfarung haben / wie sich seine feind am zug vnd mit dem Leger halten / dann wann ein Kriegsuolck vnordenlich / vnd ein hauffen weit von dem andern zeucht / odder der mehrerteil auß der ordnung reiten / vmblauffen maussen vnd Kisten fegen / alßdann ist wol etwas zuuersuchen.
  cs: |-
    Nejvyšší velitel má také pilně zjišťovat, jak si jeho nepřátelé počínají na pochodu i v ležení; neboť když válečný lid táhne nepořádně a jeden houf {hauffen} daleko od druhého, anebo větší část vyjíždí ze šiku, potuluje se, slídí po kořisti a vymetá truhly {Kisten fegen}, tehdy stojí za to se o něco pokusit.
- typ: odstavec
  de: |-
    Gleicher gestalt ists auch / wann sich ein Kriegsuolck vnordenlich zerstreit vnd weit von einander legert / vnnd dieselbigen im leger auff die beut oder füterung reitten vnd lauffen / oder da ein Kriegsuolck in der hitz gezogen / vnd im leger oder nahe darbei / vil weins findet / da werden die Teutschen / auch etwan andere Nationen geren vol / dargegen ist dann gar gůt handeln / sonderlich wann sich (wie etlicher Reutter gewonheit ist) dieselbigen vom leger in die Flecken legern / daß mann sie auffhebe.
  cs: |-
    Stejně tak je tomu i tehdy, když se válečný lid nepořádně rozptýlí a utáboří daleko od sebe, a ti v ležení jezdí a běhají za kořistí či pící, anebo když válečný lid táhl v horku a v ležení nebo blízko něj najde mnoho vína – tehdy se Němci a občas i jiné národy rádi opijí; proti nim se pak jedná velmi snadno, zvláště když se (jak bývá zvykem některých jezdců {Reutter}) od ležení rozloží po městečkách, takže je lze snadno zajmout.
- typ: odstavec
  de: |-
    Es möcht auch ein Kriegsuolck am zuge mit jhrem Geschütz / also vnordenlich vmbgehn / daß der Oberst billich dasselbig seinen Feinden zu nemen / odder auff das wenigest zuuerschlagen vnderstünde.
  cs: |-
    Mohlo by se také stát, že by některý válečný lid zacházel na pochodu se svými děly tak nepořádně, že by se nejvyšší velitel právem pokusil svým nepřátelům tato děla odebrat nebo alespoň zatlouci a zničit.
- typ: odstavec
  de: |-
    Wann ein Oberster kundtschafft bekompt / daß jn sein gegentheil vberfallen wil / wirdt er dann also dasselbig zeitlich innen / wie die vberfäll gewonlich gegen morgen geschehen / es geschehe dann durch vrsachen / wie kurtz hieuor bestimpt / so soll der Oberst mit nichte
  cs: |-
    Dostane-li nejvyšší velitel zprávu, že jej chce jeho protivník přepadnout, a dozví-li se to takto včas – neboť přepady se obvykle dějí k ránu, neděje-li se tak z příčin, jak bylo krátce výše uvedeno –, pak nejvyšší velitel nemá v žádném případě dávat
