bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    sonst ein Oberster nicht wissen / wann er Reutter im Leger helt oder nicht / die Hauptleut sollen auch den Reuttern jre Leutenant anzeigen / damit sie dieselben kennen.
  cs: |-
    plukovník {Oberster} vědět, kdy má jezdce {Reutter} v ležení {Leger} a kdy ne. Hejtmani {Hauptleut} mají také jezdcům představit své poručíky {Leutenant}, aby je znali.
- typ: odstavec
  de: |-
    Ein jeder Hauptman soll allen morgen vnnd abents / bei dem Obersten vmb bescheidt ansůchen / vnnd nicht in seinem Losament ligen / vnd auff das blasen warten / kan er aber selbst etwan nicht gehen / soll er seinen leutenant / oder auff das wenigst den Trometer oder sein Forierer zu jm schickten / vnd sonderlich wann mann nahe bei den Feinden ligt / es sei im an oder abziehen. Die Hauptleut sollen sampt jren Leutenanten am zug gůt acht haben / daß sich die Reutter nach dem mausen vnd kisten fegen / nit auß der Ordnung heimlich stehlen / dardurch sie etwan niderligen / jren Herren vnnd Edelleuten die Roß verliern / vnnd wann es not thůt / oder ein lermen wirt / das wenig Reutter bei dem fanen seien / oder doch die Geschwader sehen als hetten die Wolff darauß gefressen.
  cs: |-
    Každý hejtman se má každé ráno i večer hlásit u plukovníka pro rozkazy, a ne se válet ve svém ubytování {Losament} a čekat, až se zatroubí. Nemůže-li však někdy jít sám, má k němu poslat svého poručíka nebo alespoň trubače {Trometer} či svého furýra {Forierer}, zvláště když se leží blízko nepřátel, ať při postupu, nebo při ústupu. Hejtmani mají spolu se svými poručíky na tažení {zug} dávat dobrý pozor, aby se jezdci kvůli loupení a vymetání truhel {kisten fegen} tajně nevytráceli ze šiku {Ordnung}. Tím by totiž mohli padnout do zajetí a jejich páni a šlechtici by přišli o koně; a když by bylo třeba nebo nastal poplach {lermen}, bylo by u korouhve {fanen} málo jezdců a švadrony {Geschwader} by vypadaly, jako by z nich vlci kus sežrali.
- typ: odstavec
  de: |-
    Die Hauptleut sollen sich gantz freuntlich mit einander vergleichen / vnd keiner seinen Reuttern gestatten / daß sie andern jre Quartier / losament / Fůterung / Beutten / Prouiant / oder anders nemen / wo es aber geschicht / soll derselbigen Hauptman was genommen ist / den bescheidigten wider schaffen oder bezalung daruon thůn / auch die jenigen so andern jhre Quartier oder losament eingenommen hetten / außtreiben / damit solchs nicht für den Obersten oder Feldmarschalck kome / dieselben sein dann schuldig mit ernstlicher straff darinn zůgreiffen / Sonst wann mann es nicht abstellt / würde gar leichtlich grosse auffrůr vnd blůtuergiessen darauß volgen / wie auch offt geschehen / were auch die sach so wichtig / vnnd die partheien jren Hauptleuten nicht volgen wolten / so bleibts bei des Obersten vnd jrer Kriegsräth Spruch / wie in des Feldmarschalcks 21. Artickels vermelt.
  cs: |-
    Hejtmani se mají mezi sebou zcela přátelsky dohodnout a žádný nemá svým jezdcům dovolit, aby jiným brali kvartýry {Quartier}, ubytování, píci {Fůterung}, kořist, proviant {Prouiant} či cokoli jiného. Stane-li se to však, má příslušný hejtman to, co bylo vzato, poškozenému vrátit nebo za to zaplatit a ty, kdo by jiným zabrali kvartýry nebo ubytování, vyhnat, aby se věc nedostala až před plukovníka nebo polního maršálka {Feldmarschalck}; ti by pak byli povinni zakročit přísným trestem. Kdyby se tomu nezamezilo, vzešla by z toho snadno veliká vzpoura a krveprolití, jak se už často stalo. Byla-li by však věc tak závažná, že by strany nechtěly uposlechnout svých hejtmanů, platí výrok plukovníka a jeho válečných radů {Kriegsräth}, jak je uvedeno v 21. článku {Artickels} polního maršálka.
- typ: odstavec
  de: |-
    Die Hauptleut sollen alles so jnen sampt jren Reuttern beuolhen wirt / vnd sie schuldig sein / willig vnd fleissig versehen / es sei an zügen / wachten / ob den fůtern halten / Prouiant oder anders geleiden / der Feinde flecken oder sonst etwas besichtigen / darmit nichts durch einen Hauptman oder seine Reutter versaumpt werde / sonst ist es jenen Herren schedtlich / dem Hauptman vnd seinen reutern spötlich / strefflich / auch etwan schendtlich.
  cs: |-
    Hejtmani mají vše, co je jim a jejich jezdcům uloženo a k čemu jsou povinni, ochotně a pilně vykonat – ať jde o tažení, stráže {wachten}, krytí pícovníků, doprovod proviantu či jiných věcí, nebo o ohledání nepřátelských městeček či čehokoli jiného –, aby hejtman ani jeho jezdci nic nezanedbali. Jinak je to pánům ke škodě a hejtmanovi i jeho jezdcům k posměchu, k trestu a někdy i k hanbě.
