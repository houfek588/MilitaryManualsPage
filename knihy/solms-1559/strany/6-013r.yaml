poznamky:
- n: 1
  text: Na předchozí straně jsou peníze za trénní koně vyčísleny na 67 zl. 8 bac.; zbytek 2194 zl. 13 bac. však odpovídá odečtu 67 zl. 5 bac. od celkových 2262 zl. 3 bac.
- n: 2
  text: Začíná vyúčtování příjezdného korouhve Henickena von Bortzfelt (srov. jeho přehlídkový lístek z 28. května 1544 [[6-009r|na listu 9]]); jezdci přijížděli z Dolního Saska (Hildesheim, Brunšvik, Sommersburg). První položka není v tisku očíslována.
- n: 3
  text: Za 12 dní by vůz činil 9 zl. 9 bac.; suma 42 zl. 6 bac. však s tištěnými 8 zl. 12 bac. souhlasí.
