bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    holen / wie er den morgen mit den Wagen ziehen soll / neben oder inn der Ordnung / wirt aber der Feldmarschalck kein beuelch von dem Obersten derhalben haben / so soll er den bescheid selbst von dem Obersten holen / damit er wisse die Wagen zufüren / dann so er feld haben mag / So ist der gebrauch / daß mann die Wagen leßt neben der Ordnung gehn / vnd so das also sein wirt / so soll er die Wagen lassen neben einander gehn / souil er kan / damit er die reyhe kürtzen künde / So er aber neben der Ordnung nicht ziehen kan / so gehört er hinder den gewaltigen hauffen / vnd darnach darauff ein zeucht / so soll er doch dann auch die wagen / souil er wegs halben haben mage neben einander in jrer Ordnung gehn lassen / Wirt aber der wagenburgmeister die wagen wöllen haben zu der wagenburg / so soll er die jm lassen ordnen nach seim gefallen / Darzů soll er jm mit seinem Gesinde mit fleiß behilfflich sein. Das ist also des wagenmeisters ampt vnd beuelch / damit hat er gnůg zuthůn / so anders ein Zuge etwas groß ist / Darumb gehöret ein geschickter Man darzů / dann es hat wol nicht ein klein arbeit vnd versehung / vnnd so ein geschickter wagenmeister ist / der kan vil jrrung vnder den wagen verkommen / vnd vil im feld den Zug kürtzen vnd fürdern.
  cs: |-
    vyzvednout rozkaz, jak má ráno s vozy táhnout – vedle šiku {Ordnung}, nebo v něm. Nebude-li však mít polní maršálek {Feldmarschalck} o tom od plukovníka {Obersten} žádný rozkaz, má si vozmistr pokyn vyzvednout sám u plukovníka, aby věděl, jak vozy vést. Má-li totiž v poli dost místa, bývá zvykem nechat vozy jet vedle šiku; a bude-li tomu tak, má nechat vozy jet vedle sebe v tolika řadách, kolik jen může, aby zkrátil kolonu. Nemůže-li však táhnout vedle šiku, patří se svými vozy za hlavní houf {gewaltigen hauffen}; a když pak za ním vjede na cestu, má i tehdy nechat vozy jet v jejich pořadí vedle sebe, nakolik mu to cesta dovolí. Bude-li však mistr vozové hradby {wagenburgmeister} chtít vozy pro vozovou hradbu {wagenburg}, má mu je vozmistr přenechat, aby je seřadil podle svého, a má mu přitom se svou čeledí pilně pomáhat. To je tedy úřad a povinnost vozmistra {wagenmeisters}. Má s tím dost práce, je-li tažení {Zuge} jen trochu velké; proto k tomu patří schopný muž, neboť to vyžaduje nemálo práce a péče. Schopný vozmistr {wagenmeister} dokáže předejít mnoha zmatkům mezi vozy a tažení v poli značně zkrátit a urychlit.
- typ: odstavec
  de: |-
    Würde mann aber mit Welschen ziehen / die vil Esel haben / vnd nicht wagen / so mag mann die Esel auch wol in der Ordnung wie die wägen / behalten / aber doch nicht vnder / sonder neben den wägen / sie sollen auch nicht vnder das Kriegsuolck / sondern allein auff einem hauffen ziehen / vnnd so etwan würden böse weg sein / vnnd die Esel vortringen wolten / vnnd die wägen auff halten / daß soll mann jhn nicht gestatten / sie bleiben dann in der Ordnung / vnder die wägen eingetheilt / oder sollen ein eigen weg fürnemen / oder so mann wirt ein wagenburg ordnen vnnd füren / da gehören die Esel gar nicht hin / Darumb were gůt daß die Esel würden allein geordnet / vnd die wägen nicht bekömmerten / vnd auch jhren eygen Forirer hetten.
  cs: |-
    Táhlo-li by se však s Vlachy {Welschen}, kteří mají místo vozů mnoho oslů, lze i osly udržovat v pořadí stejně jako vozy, nikoli však mezi vozy, nýbrž vedle nich. Nemají také táhnout mezi válečným lidem {Kriegsuolck}, nýbrž zvlášť v jednom houfu. A kdyby byly špatné cesty a osli se chtěli tlačit dopředu a zdržovat vozy, nemá se jim to dovolit: buď ať zůstanou v pořadí rozděleni mezi vozy, nebo ať si zvolí vlastní cestu. Když se však sestavuje a vede vozová hradba, tam osli vůbec nepatří. Proto by bylo dobré, aby osli byli seřazeni zvlášť, vozům nepřekáželi a měli také vlastního furýra {Forirer}.
- typ: odstavec
  de: |-
    Darzů soll jhm von dem Kriegsherrn Knecht vnd Pferde / nach gelegenheit / vnd wie es die notturfft erfordern würde / vnnd ein Leger groß oder klein were / darnach gehalten werden / damit er dasselbig versehen möge.
  cs: |-
    K tomu mu má válečný pán {Kriegsherrn} vydržovat čeledíny {Knecht} a koně podle okolností a podle potřeby, totiž podle toho, zda je ležení {Leger} velké, či malé, aby mohl svůj úřad zastat.
