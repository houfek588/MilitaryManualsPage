poznamky:
- n: 1
  text: |-
    Vilém Oranžský (1533–1584), pozdější vůdce nizozemského povstání, tehdy jeden z velitelů jízdy Karla V.; tisk „Printz von Vranien“. Seznam je v tisku sázen ve dvou sloupcích; zde je přepsán v pořadí čtení (levý sloupec, pak pravý). Řádek „Der herr von Bussy / Oberster vber“ dole v levém sloupci pokračuje nahoře v pravém sloupci („800. pferdt / vnd sein eigen Bende…“).
- n: 2
  text: |-
    Bende (niz. bende, fr. bande d’ordonnance) – stálé ordonanční roty těžké jízdy habsburského Nizozemí, každá pod velením šlechtice-kapitána, zpravidla o několika stech koní; proto „Benden Reutter“ níže.
- n: 3
  text: |-
    „Černí jezdci“ (Schwarze Reiter) – němečtí jízdní střelci s pistolemi a začerněnou zbrojí, kteří se právě v 50. letech 16. století prosazovali v císařských i francouzských službách. Tři jména jsou v tisku spojena svorkou s nápisem „Schwartzen schützen Reutter“; svorka je připojena k poslední položce.
- n: 4
  text: |-
    Tisk má „Schwartzenberg“; nejspíš je míněn hrabě Günther XLI. ze Schwarzburgu (1529–1583), který tehdy sloužil Karlu V. jako plukovník jízdy v Nizozemí.
- n: 5
  text: |-
    Luis de Ávila y Zúñiga (asi 1504–1573), velitel lehké jízdy a kronikář šmalkaldské války; tisk „Don Lois Dauila“.
- n: 6
  text: |-
    Jména kapitánů band jsou v tisku zkomolená. Pravděpodobně: Filip de Croÿ, vévoda z Aarschotu (Aschgot); Jan de Glymes, markrabě z Bergen op Zoom; Petr Arnošt z Mansfeldu; pán z Morbecque (Merbeck); Jan de Croÿ, hrabě z Roeulx (Röß); Antoine de Lalaing, hrabě z Hoogstraten (Hochstrassen); Jan de Hennin, hrabě z Boussu (Bussy), velitel nizozemské jízdy; Adolf Burgundský, pán z Beveren (Befern). „Aberkor“, „Nöllen“, „Binecrot“ a „Ceummu“ se nepodařilo bezpečně ztotožnit, proto jsou ponechány v podobě tisku.
- n: 7
  text: |-
    Hornoněmečtí (oberländische) lancknechti – z jihoněmeckých zemí. Konrad z Bemelbergu (Boyneburgu, 1494–1567), zvaný „malý Hesenec“, proslulý plukovník lancknechtů Karla V.; hrabě Filip z Ebersteinu; „Hanß von Nassaw“ snad Jan z Nassau-Dillenburgu.
- n: 8
  text: |-
    Karel z Brimeu, hrabě z Megenu; Jan z Ligne, hrabě z Arenbergu; Maarten van Rossem (asi 1490–1555), gelderský vojevůdce v císařských službách; tisk „Merten von Roßheim“. „Landtuolck“ je zemská hotovost.
