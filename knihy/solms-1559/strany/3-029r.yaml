id: 3-029r
list: '29'
strana: recto
sken: 309
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    genommen werden / vnd solche Hacken sollen auch von der vorbeschribenen anzal herkommen / thůt auff die 25. Wagen 100. Toppelhacken.
  cs: |-
    sejmout. I tyto hákovnice {Hacken} se mají vzít z výše uvedeného počtu; na 25 vozů to činí 100 dvojitých hákovnic {Toppelhacken}.
- typ: odstavec
  de: |-
    Wie nun dergleichen wagen gemacht vnd formiert / das wirt hernach an seinem ordenlichen ort auch klärlicher beschriben.
  cs: |-
    Jak se takové vozy zhotovují a utvářejí, bude dále na příslušném místě popsáno ještě jasněji.
- typ: odstavec
  de: |-
    Item der gemelten wagen einen in den andern angeschlagen vor sich / thůn die 100. wagen in summa / etc.
  cs: |-
    Dále zmíněné vozy, každý oceněný jeden jako druhý po […], činí za těch 100 vozů celkem […] atd.
- typ: odstavec
  de: |-
    Wiewol dise jetzt beschriben stürm oder schirm wagen / für ein gemeine zugehörung allem Geschütz billich gerechnet / vnd deßhalben hernach in seinem ordenlichen Capitel daruon tractiert soll worden sein / ist es doch darumb / dieweil sie dem kleinn Geschütz anhengig / hieher zusetzen / für gůt angesehen.
  cs: |-
    Ačkoli se tyto právě popsané útočné {stürm} čili štítové vozy {schirm wagen} právem počítají ke společnému příslušenství všeho dělostřelectva {Geschütz}, a mělo se o nich proto pojednat až níže v jejich vlastní kapitole, bylo přece uznáno za dobré zařadit je sem, protože patří k lehkým dělům.
- typ: odstavec
  de: |-
    Der anschlag Eysens vnd Puluers / wirt hernach inn einem sondern Capitel / darinn von allem vorrat meldung geschicht / angeregt / vnd eingeschlossen werden.
  cs: |-
    Rozpočet železa a střelného prachu {Puluers} bude zmíněn a zahrnut níže ve zvláštní kapitole, v níž se pojednává o všech zásobách.
- typ: odstavec
  de: |-
    Summa summarum alles vnkostens / so vber das hieuor nachleng beschriben Geschütz / vmb giesserlohn / sein selbs zeug / vnd alles anders / nichts außgenomen / vorgemeltem anschlag nachlauffent / thůt an gelt / etc.
  cs: |-
    Celkový součet veškerého nákladu na výše obšírně popsaná děla – za slévárenskou mzdu, vlastní kov i všechno ostatní, nic nevyjímaje – podle výše uvedeného rozpočtu činí na penězích […] atd.
- typ: odstavec
  de: |-
    DIeweil inn aller welt das geschütz erkennt wirt / was sein vermögen ist / vnnd dasselbig nun mehr am höchsten steht / vnd nit wol mag höher noch stercker gefunden vnd gemacht werden / Vnd jhm nachgerechnet wirt / was mit einem jeden stück / es sei groß oder klein / einn tag / die wochen / vnd den Monat mag geschossen vnd außgericht werden / vnnd was für kosten darauff mit aller zugehörung geht / so wirt vnnd ist demselbigen nachgedacht wie man dem mit bawen begegnen kan / damit die Bäw dermassen gemacht / daß solchs geschütz nichts daran schaffen mag / auch die Herrn es die leng zu schiessen nit vermögen / wirt demselbigen als weiter nachdacht / vnd mit vortheil gefunden / vor solchem geschütz zuhalten / vnd vngefehrlich bäw daruor zumachen / Hab ich bedacht / daß dem zubegegnen sei mit einem geringen kosten / mit dem grossen Geschütz in kurtzer zeit / vnd ist das mein bedencken / wie volgt.
  cs: |-
    Po celém světě je už známo, čeho je dělostřelectvo schopno; dosáhlo nyní vrcholu a stěží může být vynalezeno a zhotoveno ještě mocnější a silnější. Propočítává se také, co lze každým kusem {stück}, ať velkým nebo malým, za den, za týden a za měsíc vystřílet a pořídit a jaké náklady to i se vším příslušenstvím stojí. Proto se přemýšlí, jak tomu čelit stavbami opevnění, aby byly zřízeny tak, že jim taková děla nic neudělají a páni proti nim nebudou s to dlouho střílet; a přemýšlí se o tom dál a s důvtipem se nalézají způsoby, jak takovým dělům odolat a stavět proti nim bezpečné stavby. Uvážil jsem tedy, jak by se tomu dalo čelit s malými náklady a s velkými děly[^1] v krátkém čase; a moje úvaha je tato:
poznamky:
- n: 1
  text: |-
    V originále stojí *mit einem geringen kosten / mit dem grossen Geschütz in kurtzer zeit* („s malými náklady, s velkým dělostřelectvem v krátkém čase“ – míněno buď dosažení účinku velkých děl v krátkém čase pomocí níže navržených moždířů, nebo elipticky *proti* velkým dělům či *namísto* velkých děl; v BSB OCR na ř. 31 bylo *Herꝛn* chybně přečteno jako *Hermes*).
