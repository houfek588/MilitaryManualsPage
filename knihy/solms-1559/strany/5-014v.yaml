list: 14 (5. kniha)
strana: verso
sken: 464
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    wann einer mit einem Kriegßuolck in ein Landt kompt/ vnd jm die Prouiant abgestreckt wirdt/ so hat er einen geschlagen hauffen mit spot/ schaden vnd schanden/ oder muß mit jhm handeln lassen/ als mit einem gefangnen man oder hauffen.
  cs: |-
    když někdo vtrhne s válečným lidem {Kriegßuolck} do země a odříznou mu proviant {Prouiant}, má poražený houf {hauffen} k posměchu, škodě i hanbě, anebo musí strpět, aby se s ním nakládalo jako se zajatým mužem či houfem.
- typ: odstavec
  de: |-
    Bei disem hieuorn vberschlagen vnd bericht ist auch zuuerstehen/ was gefahr auff eim grossen hauffen zu fürn für sorg/ mühe vnd beschwerdt steht/ Dann es ist nit allwegen sich so hoch vor eim grossen hauffen zu erschrecken/ wo die landt dahin gericht sein/ daß sie peß oder Wasser/ Wald vnd gemöß hetten/ die man vergraben oder mit befestigung verbawen mag/ dardurch mann die prouiant verhalten vnd abbroch thůn kündt/ vnd das landt mit prouiant vnd fütterung/ wo möglich/ so weit wüst machen als mann kan/ darmit die Feind nichts bekommen/ vnd das Volck vnd Thierer mat vnd vnwillig gemacht werden.
  cs: |-
    Z tohoto výše uvedeného rozpočtu a zprávy je také patrné, jaké nebezpečí, starosti, námaha a obtíže jsou spojeny s vedením velikého houfu. Není se proto vždy třeba velikého houfu tolik lekat tam, kde jsou země uzpůsobeny tak, že mají průsmyky {peß} nebo vody, lesy a močály, které lze přetnout příkopy nebo zahradit opevněním {befestigung}. Tím lze zadržet [nepříteli] proviant a způsobit mu újmu a zemi, pokud možno, co nejdál vyplenit, pokud jde o proviant a píci, aby nepřátelé nic nedostali a lid i zvířata byli vysíleni a malomyslní.
- typ: odstavec
  de: |-
    Dieweil mann sagt/ daß der Türck vnd Muscabiter souil Volcks in das veld vermögen/ das mag wol sein/ aber weit auß dem landt in frömbde landt zufüren von jren Fundieren vnd vortheil der Prouiant ist wol zuuermuten/ daß sie das nicht thůn werden/ wann sie kein Füterung noch Prouiant für jnen wissen.
  cs: |-
    Říká se, že Turek a Moskvan {Muscabiter} dokážou postavit do pole tolik lidu; to může být pravda. Ale vést jej daleko ze země do cizích zemí, pryč od svých základen {Fundieren} a zásob proviantu – to, jak lze dobře soudit, neučiní, nevědí-li před sebou o žádné píci ani proviantu.
- typ: odstavec
  de: |-
    Aber das ist war wie mann sagt/ daß der Türck allezeit sein vortheil auff die Füterung schafft vnd bei einander bringt/ daß er die in kürtz erlangen kan/ vnd ligt also sein gewaltigs leger vber ein oder zwen tag zuziehen nit daruon/ dann er verlest sein Prouiant nicht/ also acht ich daß der Muscabiter/ auch die Römer vnd Griechen gethan haben.
  cs: |-
    Pravda však je, jak se říká, že Turek si vždy zajišťuje a shromažďuje zásoby píce tak, aby je měl brzy po ruce; jeho hlavní ležení se tedy od nich nevzdaluje dál než na jeden nebo dva dny pochodu, neboť svůj proviant neopouští. Tak, myslím, činil i Moskvan, a také Římané a Řekové.
- typ: odstavec
  de: |-
    Das kan aber wol sein/ wann sie also mit einer sollichen macht ziehen oder auff sein würden/ daß sie mit dem grossen hauffen oder hauptleger bei der Prouiant vnd Fütterung bleiben/ daß sie doch von solchen gewaltigen hauffen einen geringen hauffen abtheiln/ vnd denselbigen fürt in ein landt schicken vnd allezeit vnderhalten nach notturfft sterckten/ entsetzten/ abwechselten/ daß sie also allzeit ein sichers ab vnd zuziehen haben.
  cs: |-
    Může se však dobře stát, že když takto vytáhnou s takovou mocí, zůstanou s velikým houfem čili hlavním ležením {hauptleger} u proviantu a píce, a přesto od tohoto mohutného houfu oddělí menší houf, pošlou jej dál do země a budou jej stále podle potřeby zásobovat, posilovat, vyprošťovat a střídat, takže budou mít vždy bezpečný odchod i příchod.
- typ: odstavec
  de: |-
    Dargegen sollen wir gedencken/ befestung der landt vnd peß zu machen/ es geschehe gleich durch bawung der Schloß/ Stät/ Wasser vnd was in dem einander zu hilff vnd vortheil kommen mag.
  cs: |-
    Proti tomu máme my pamatovat na opevnění zemí a průsmyků, ať se to stane stavbou hradů, měst, vodních překážek či čímkoli, co si může navzájem pomáhat a prospívat.
- typ: odstavec
  de: |-
    Vnd wann einer sich prouiant zubestellen vndernemen wil/ soll derselbig zum ersten die summen oder zall des Kriegßuolcks wissen/ vnd auff ein Person ein maß ordnen wie schwere ein Brot soll sein/ vnd auff solche summen soll er sein Rechnung zu rück machen auff die summen des Korns/ gewicht vnd maß wie hieuor in ein bericht
  cs: |-
    Kdo se chce ujmout zajišťování proviantu, má předně znát úhrnný počet válečného lidu a stanovit na osobu míru, kolik má vážit chléb; z tohoto úhrnu má pak zpětně spočítat množství žita, jeho váhu a míru, jak bylo výše
