bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    wann einer mit einem Kriegßuolck in ein Landt kompt/ vnd jm die Prouiant abgestreckt wirdt/ so hat er einen geschlagen hauffen mit spot/ schaden vnd schanden/ oder muß mit jhm handeln lassen/ als mit einem gefangnen man oder hauffen.
  cs: |-
    když někdo vtrhne s vojskem do země a odříznou mu proviant, má poražený houf {Hauffen} s posměchem, škodou i hanbou, anebo s ním budou nakládat jako se zajatým člověkem či zajatým houfem.
- typ: odstavec
  de: |-
    Bei disem hieuorn vberschlagen vnd bericht ist auch zuuerstehen/ was gefahr auff eim grossen hauffen zu fürn für sorg/ mühe vnd beschwerdt steht/ Dañ es ist nit allwegen sich so hoch vor eim grossen hauffen zu erschrecken/ wo die landt dahin gericht sein/ daß sie peß oder Wasser/ Wald vnd gemöß hetten/ die man vergraben oder mit befestigung verbawen mag/ dardurch mann die prouiant verhalten vnd abbroch thůn kündt/ vnd das landt mit prouiant vnd fütterung/ wo möglich/ so weit wüst machen als mann kan/ darmit die Feind nichts bekommen/ vnd das Volck vnd Thierer mat vnd vnwillig gemacht werden.
  cs: |-
    Podle tohoto výše uvedeného rozpočtu a zprávy jest rovněž pochopit, jaké nebezpečí, starost, námaha a tíže spočívá na vedení velikého houfu. Neboť se není vždy třeba tolika velikého houfu lekat tam, kde jsou kraje uzpůsobeny tak, že mají průsmyky {Paß} či vody, lesy a močály, které se dají prokopat příkopy nebo zahradit opevněním {Befestigung}, čímž lze zadržet proviant a působit nepříteli újmu – a zemi kolem, pokud možno, co nejdále zbavit zásob a píce, aby nepřátelé nic nedostali a lid i zvířata byli zemdleni a zmalomyslněni.
- typ: odstavec
  de: |-
    Dieweil mann sagt/ daß der Türck vñ Muscabiter souil Volcks in das veld vermögen/ das mag wol sein/ aber weit auß dem landt in frömbde landt zufüren von jren Fundieren vnd vortheil der Prouiant ist wol zuuermuten/ daß sie das nicht thůn werden/ wann sie kein Füterung noch Prouiant für jnen wissen.
  cs: |-
    Že se říká, jak Turek a Moskvan dokážou postavit do pole tolik lidu, to může být pravda; ale vyvést je daleko ze své země do cizích zemí od jejich hranic a zásobáren proviantu – lze dobře soudit, že to neučiní, pokud před sebou nevědí žádnou píci ani proviant.
- typ: odstavec
  de: |-
    Aber das ist war wie mann sagt/ daß der Türck allezeit sein vortheil auff die Füterung schafft vnd bei einander bringt/ daß er die in kürtz erlangen kan/ vnd ligt also sein gewaltigs leger vber ein oder zwen tag zuziehen nit daruon/ dann er verlest sein Prouiant nicht/ also acht ich daß der Muscabiter/ auch die Römer vnd Griechen gethan haben.
  cs: |-
    Ale pravda jest, jak se říká, že Turek vždy zajišťuje své zásoby píce a shromažďuje je pospolu, aby jich mohl brzy dosáhnout, a jeho hlavní ležení neleží od nich dále než jeden či dva dny pochodu, neboť svůj proviant neopouští – a stejně myslím, že činil i Moskvan, jakož i Římané a Řekové.
- typ: odstavec
  de: |-
    Das kan aber wol sein/ wann sie also mit einer sollichen macht ziehen oder auff sein würden/ daß sie mit dem grossen hauffen oder hauptleger bei der Prouiant vnd Fütterung bleiben/ daß sie doch von solchen gewaltigen hauffen einen geringen hauffen abtheiln/ vnd denselbigen fürt in ein landt schicken vnd allezeit vnderhalten nach notturfft sterckten/ entsetzten/ abwechselten/ daß sie also allzeit ein sichers ab vnd zuziehen haben.
  cs: |-
    To se však snadno stát může, když by takto táhli či vytáhli s takovou mocí, že zůstanou s hlavním houfem či hlavním táborem {Hauptleger} u proviantu a píce, a přece od takového mohutného houfu oddělí menší houf a pošlou jej dále do země, a budou jej stále podle potřeby vydržovat, posilovat, střídat a vyprošťovat, takže budou mít vždy bezpečný odchod i příchod.
- typ: odstavec
  de: |-
    Dargegen sollen wir gedencken/ befestung der landt vnd peß zu machen/ es geschehe gleich durch bawung der Schloß/ Stät/ Wasser vnd was in dem einander zu hilff vnd vortheil kommen mag.
  cs: |-
    Proti tomu máme my pomýšlet na opevňování zemí a průsmyků, ať se tak děje stavbou hradů, měst, vodních přehrad či čímkoli jiným, co si navzájem může být k pomoci a výhodě.
- typ: odstavec
  de: |-
    Vnd wann einer sich prouiant zubestellen vndernemen wil/ soll derselbig zum ersten die summen oder zall des Kriegßuolcks wissen/ vnd auff ein Person ein maß ordnen wie schwere ein Brot soll sein/ vnd auff solche summen soll er sein Rechnung zu rück machen auff die summen des Korns/ gewicht vñ maß wie hieuor in ein bericht
  cs: |-
    A kdo se chce ujmout opatřování proviantu, má předně znát úhrn čili počet válečného lidu a určit na jednu osobu míru, jak těžký má být chléb; na základě takového součtu má zpětně udělat výpočet na množství žita, váhu a míru, jak bylo výše ve zprávě
