id: 9-008v
list: 8 (9. kniha)
strana: verso
sken: 636
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    sonder andere päß suchen/ dann ein tausent die inn einer befestigung ligen/ vnd ein gůt Geschütz bei jn haben/ mögen zehen tausent auffhalten/ daß sie nicht hinüber ziehen/ Darumb mann gůt fleiß haben sol/ die Brück zu machen/ daß die Feind nicht die zeit haben sich an demselbigen ort zu befestigen/ wann jhr der letsten so wol besorget als der ersten/ wolt ich den halben hauffen der Fußknecht/ wann anders die fünffhundert den paß eingenommen/ hinüber ziehen lassen/ vnnd nachuolgends den gantzen reisigen Zeug vnd den andern theil Fußknecht wolt ich inn ein Ordnung an dem Wasser ab biß zu der Brücken stellen/ wolt darnach alle Wagen hinüber füren lassen/ würden sie beschlossen sein auff der einen seiten mit den Wagen/ auff der andern seiten mit dem Wasser/ dermassen daß jhnen die Feinde on jren schaden nicht abbrechen künden/ vnnd wann die letsten Wagen auff der Brücken sein/ sollen die Fußknecht nachziehen/ doch hundert mit Spiessen/ vnd hundert Schützen hinden nach ziehen lassen mit einem par Falckenetlein/ welche stehen sollen auff der Brücken am ort/ vnd das angesicht gegen den Feinden keren/ biß die andern hinüber kommen/ wann sie schon da gestanden seind/ sollen sie jhre Spieß nach jn schleiffen/ die Eysen in die Hend nemen/ damit sie desto ehe gerüst seien zu handeln.
  cs: |-
    nýbrž abyste hledal jiné přechody {päß}. Tisíc [mužů], kteří leží v opevnění a mají u sebe dobrá děla {Geschütz}, totiž může zadržet deset tisíc, aby nepřešli. Proto se má vynaložit velká píle na stavbu mostu, aby nepřítel neměl čas se na tom místě opevnit. Obáváte-li se o poslední [oddíly] stejně jako o první, nechal bych přejít polovinu houfu pěších knechtů {Fußknecht}, pokud ovšem těch pět set přechod obsadilo. Potom bych celou jízdu {reisigen Zeug} a druhou část pěších knechtů postavil v šiku {Ordnung} podél vody až k mostu a pak bych dal převézt všechny vozy. [Ti na druhém břehu] by tak byli uzavřeni z jedné strany vozy a z druhé vodou, takže by jim nepřítel nemohl bez vlastní škody nic učinit. Když jsou poslední vozy na mostě, mají za nimi táhnout pěší knechti; vzadu však nechte jít sto [mužů] s píkami {Spiessen} a sto střelců {Schützen} s několika falkonety {Falckenetlein}. Ti mají stát na konci mostu a obrátit se tváří k nepříteli, dokud ostatní nepřejdou. Když tam již odstáli, mají své píky táhnout za sebou a železa vzít do rukou, aby byli tím dříve připraveni k boji.[^1]
- typ: odstavec
  de: |-
    Es dunckt mich das der sicherst weg sein vber ein paß odder Brücken zu ziehen/ wann jhr euch aber besorget vor eweren Feinden/ vnd ein weit Veld habt da jhr ewer Ordnung machen kundt/ dann nemet drei odder vier dapfferer Mäner/ die euch ein Wagenburg (von den fünffhundert Knechten) machen/ daß sie dieweil sich inn Ordnung stellen/ alßdan möcht jhr ewern Feinden warten odder furtziehen/ nach dem jhr sicht was jhr für einen vortheil habt/ so ferr aber die Landtschafft eng ist/ möcht jhr inn einer Ordnung ziehen/ wie obstehet/ wann aber der weg gar eng were/ solt jhr nicht mehr dann einen Wagen vorhin gehen lassen/ vnd wann er etwas breitter ist/ zwen/ Dann die im gewaltigen hauffen den im vor odder nachzug/ wo es von nöten were zu hilff kommen kunden/ Es sollen auch die Buchsenmeister vnnd Prouosen des Marschalcks Knecht alwegen die Ordnung mit Wagen halten/ daß kein schad darnach geschehen möge.
  cs: |-
    Zdá se mi, že to je nejbezpečnější způsob, jak táhnout přes přechod nebo most. Obáváte-li se však svých nepřátel a máte-li široké pole, kde můžete sestavit svůj šik, vezměte tři nebo čtyři statečné muže, kteří vám (z oněch pěti set knechtů {Knechten}) udělají vozovou hradbu {Wagenburg}, aby se mezitím [ostatní] stavěli do šiku. Potom můžete na nepřítele čekat nebo táhnout dál, podle toho, jakou výhodu vidíte. Je-li však krajina úzká, můžete táhnout v takovém pořádku, jak stojí výše. Byla-li by však cesta úplně úzká, nemáte nechat jet napřed víc než jeden vůz, a je-li o něco širší, dva. Ti v hlavním houfu {gewaltigen hauffen} pak mohou v případě potřeby přijít na pomoc těm v předvoji či zadním voji {vor odder nachzug}. Puškaři {Buchsenmeister} a knechti maršálkova profousa {Prouosen} mají také vždy udržovat pořádek mezi vozy, aby se potom nestala žádná škoda.
- typ: odstavec
  de: |-
    Wann aber jhr ein weit Landt habt/ biß dahin jhr ziehen wolt/ möcht jhr ewer Leger dermassen schlagen/ wie vorn geschriben steht/ vnd ewerm Marschalck etlich zu roß vnnd fuß/ nach dem jhr dann einen grossen hauffen habt/ zugeben/ vnd inn einer gůten Ordnung
  cs: |-
    Máte-li však až tam, kam chcete táhnout, otevřenou zemi, můžete své ležení {Leger} rozbít tak, jak je popsáno výše, a přidat svému polnímu maršálkovi {Marschalck} několik [mužů] na koni a pěšky, podle toho, jak velký houf máte, a v dobrém pořádku
poznamky:
- n: 1
  text: |-
    Zadní voj ustupuje přes most pozpátku tváří k nepříteli: muži s píkami drží píky těsně za hrotem (*Eysen*) a ratiště vlečou za sebou, aby je mohli okamžitě sklopit proti útočníkovi.
