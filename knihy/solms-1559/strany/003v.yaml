bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    regieren soll/ vnd die andern auff den bescheiden seind/ also entsetzen sich dann dieselbigen auch. Vnd also mag wol etwan ein verseumnuß geschehen das zu grossem nachtheil kompt/ so bald auß seiner eil vnnd freudigkeit als auß verzagkeit/ were aber ein erfarne person da/ die wißt dem zubegegnen mit einem vortheil/ vnd were frei tröstlich/ vnd eillet darzů/ so hat das gantz volck ein trost/ vnd würde wol/ was jhm möglich ist/ vnd zu gůtem kommen möcht/ außgericht/ dann mann hat es wol erfarn/ das souil Schlachten durch vortheil vnd geschickte erfarne leut/ mit weniger zal des volcks gewunnen worden/ als mit gar grossen hauffen oder vilen geringen leuten/ die nicht geschickt noch versucht seind/ dann ein vngeschickter hauff/ der kan also ein vnordnung oder flucht machen/ daß die gůten die darunder seind/ mit jm zuschanden vnd schaden kommen/ vnd sich des nit erweren können. Dann mann sagt inn einem alten sprichwort/ Mit gůten leuten helt mann ein zaun.
  cs: |-
    velet a na koho jsou ostatní odkázáni, takto zalekne, zaleknou se pak i ti druzí. A tak se může snadno stát nějaké opomenutí, které povede k veliké škodě – stejně tak z jeho ukvapenosti a zbrklosti jako z malomyslnosti. Kdyby tam však byl zkušený člověk, věděl by, jak tomu čelit s výhodou, byl by neohrožený a spěchal by k věci; pak má celý lid odvahu a vykoná se vše, co je možné a co může prospět. Zkušenost totiž dobře ukázala, že stejně tolik bitev bylo vyhráno obratností a schopnými zkušenými lidmi s malým počtem lidu, jako s převelikými houfy {hauffen} či s mnoha méně zdatnými lidmi, kteří nejsou vycvičení ani ostřílení; nezkušený houf totiž dokáže vyvolat takový zmatek či útěk, že i ti dobří, kteří jsou mezi nimi, s ním přijdou k hanbě a ke škodě a nemohou se tomu ubránit. Neboť se říká ve starém přísloví: S dobrými lidmi se plot udrží.
- typ: odstavec
  de: |-
    Dieweil dann alles was wir in diser welt handlen vnd begehn/ das etwas ist/ wehren vnd bestendig bleiben soll/ vnnd daran gelegen/ vnd gefahr darauff steht/ daß dieselbigen mit gůtem wol bedachtem rath vnd gůter ordenung fürgenommen/ vnnd mit gestrenger straff (so daß die notturfft erfordert) gehalten werden sollen/ Dann alles das so in gůter/ ordenlicher/ billicher straff ist/ dasselbig geht wol zů/ ist bestendig/ bessert vnd mehrt sich/ Dann gerechte/ harte vnd strenge straff die macht forcht/ wo forcht ist/ da ist gehorsam/ wo gehorsam ist/ da ist sorg/ forcht vnd fleiß/ vnd durch solche sorg/ forcht vnd fleiß/ wirt alle ding wol außgericht/ vnd steht alles in gůter hůt vnd achtung/ vnd alle die also in denen sachen gebraucht vnd geübt/ die müssen geschickt werden/ ist anders etwas in jnen/ ist aber nichts in jnen/ so werden sie doch erkennt/ das man wissen mag/ was sich auff sie zuuerlassen oder zuuertrawen/ vnd ob sie zubehalten oder zuuerlassen seien/ dann alles das regiert soll werden/ das wil durch gehorsam vnd gůte ordenung geschehen/ das kan dann nit wol on straff/ on forcht vnd gehorsam zugehen. Dieweil dann ein krieg zu fürn/ ein schwer/ můhsam/ sorglich Regierung ist/ so erfordert die notturfft/ daß derselbig werd wol bedacht vnd berathschlagt/ dann ein Krieg erfordert ein verstendiges groß regiment/ mit vilen vnder regierungen oder Regimenten/ vnd ist durch eine Regierung nit zuuersehen nach menschlicher möglicheit. Dieweil es dann also vil regenten haben wil vnd můß/ so erfordert die notturfft/ das darzů personn geordnet werden/ damit alle ämpter vnd Regiment zu dem besten versehn würden/ dann in disen regierungen wil mit grosser sorg/ můhe vnd arbeit tag vnd zu nacht regiert werden/
  cs: |-
    Poněvadž tedy všechno, co na tomto světě konáme a podnikáme – má-li to mít nějakou váhu, trvat a zůstat stálým –, záleží na tom a hrozí nebezpečí, aby se to předsevzalo s dobrou, uvážlivou radou a dobrým řádem a udržovalo přísným trestem, kdykoli to potřeba vyžaduje: všechno totiž, co je pod dobrou, řádnou a spravedlivou kázní, daří se dobře, je stálé, zlepšuje se a rozmáhá. Neboť spravedlivý, tvrdý a přísný trest budí bázeň; kde je bázeň, tam je poslušnost; kde je poslušnost, tam je péče, obezřetnost a píle; a skrze takovou péči, obezřetnost a píli se všechny věci dobře vykonají a vše je v dobré ochraně a pozornosti. Všichni pak, kteří se v těchto věcech takto zaměstnávají a cvičí, musejí se stát schopnými, je-li v nich aspoň něco; a není-li v nich nic, alespoň se poznají, aby se vědělo, nač se lze u nich spolehnout či jim důvěřovat a zda si je nechat nebo propustit. Neboť všechno, co má být řízeno, musí se dít skrze poslušnost a dobrý řád, a to se nemůže obejít bez trestu, bez bázně a poslušnosti. Jelikož je tedy vedení války těžká, namáhavá a nebezpečná správa, vyžaduje potřeba, aby byla dobře promyšlena a uvážena; válka totiž vyžaduje rozumnou velkou správu {regiment} s mnoha dílčími správami či úřady {Regimenten}, a podle lidských možností ji nelze obstarat jedinou správou. Jelikož tedy vyžaduje a musí mít tolik správců, je nezbytné, aby k tomu byly ustanoveny osoby tak, aby všechny úřady a správy byly co nejlépe opatřeny; v těchto správách je totiž třeba vládnout s velikou péčí, námahou a prací dnem i nocí,
