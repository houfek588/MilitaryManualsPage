bloky:
- typ: odstavec
  de: |-
    Dann ein jeder platz zum Leger / sonderlich nahent bei den Feinden sein soll / als vil möglich vortheilich sein / auch Wasser vnd zimlich holtz haben / darzů das Prouiant vnd futerung darinn zubrengen sei / angesehen / wann ein Oberster von der Prouiant vnd füterung zeucht / geberet einen solchen vnwiderbrenglichen / schädlichen nachtheil / Als etliche Kriegsleut in kurtzen jaren wol erkündiget vnd erfaren haben.
  cs: |-
    Neboť každé místo pro ležení {Leger}, zvláště poblíž nepřátel, má být co možná nejvýhodnější, mít také vodu a dostatek dřeva a musí být možné do něj přivážet proviant {Prouiant} a píci; neboť když nejvyšší velitel {Oberster} odtáhne od proviantu a píce, přinese to takovou nenapravitelnou a škodlivou újmu, jakou někteří válečníci {Kriegsleut} v posledních letech dobře poznali a zakusili.
- typ: odstavec
  de: |-
    Damit auch die Futerung ordenlich / wenn es die notturfft erfordert / geschehe / soll der Oberst einen Futer hauptman vnd Fanen auffrichten / vnd sonst niemands / schadens halben / dann vnder dem Fanen fütern lassen.
  cs: |-
    Aby se také pícnění, když si to potřeba vyžádá, dělo v pořádku, má nejvyšší velitel ustanovit hejtmana {hauptman} pro píci a korouhev {Fanen} a nikomu jinému nesmí kvůli škodám dovolit pícnit než pod touto korouhví.
- typ: odstavec
  de: |-
    Es soll auch ein jeder Oberster / ehe er zu den Feinden kompt / sein Kriegsuolck ordenen / damit wann er mit den Feinden schlahen sol / wil oder muß ein jeglicher geordnet hauff / zu roß vnd fuß / wie er treffen / vnd am treffen auff einander warten sollen / wissen / Dann wo solchs nit geschicht / mag leichtlich verlierung des felds darauß folgen.
  cs: |-
    Každý nejvyšší velitel má také, dříve než dorazí k nepřátelům, seřadit svůj válečný lid {Kriegsuolck}, aby – až bude mít, chtít nebo muset svést s nepřáteli bitvu – každý seřazený houf {hauff} jízdy i pěchoty věděl, jak má udeřit a jak na sebe mají v boji čekat a navazovat; neboť kde se tak nestane, může z toho snadno vzejít prohra v poli.
- typ: odstavec
  de: |-
    Der Oberst soll auch / wann er (wie im nechsten Artickel gemelt) geordenet hat / vnd nahe zu den Feinden kompt mit seinen hauffen / zu roß vnd fuß / hart bei einander bleiben / in gůter gewarsam / vnd nit weit züge eins tags thůn / es hab dann sonderliche / treffliche vrsachen / als vnuersehenlich durch oder vber einen fest paß zukomen / ein Flecken oder fest Leger einzunemen / auch die feind / wann sie verächtlich zügen / oder Leger anzugreiffen oder zu vberfallen.
  cs: |-
    Nejvyšší velitel má také poté, co vojsko (jak zmíněno v předchozím článku) seřadil a přiblíží se k nepřátelům, zůstat se svými houfy jízdy i pěchoty těsně pohromadě v dobré ostražitosti a nekonat v jednom dni daleké pochody, ledaže by k tomu měl zvláštní závažné příčiny, jako je nečekaně projít či přejít pevným průsmykem, obsadit městečko či opevněné ležení, anebo napadnout či přepadnout nepřátele či jejich ležení, táhnou-li neopatrně.
- typ: odstavec
  de: |-
    Auch sol der Oberst / wann er mit seim kriegsuolck vnd geschütz / den feinden gemeß gewest ist / sich auffs nechst zun Feinden / da er ein vortheilich leger hat / sein Leger dahin schlagen / wie obbestimpt / das er allweg prouiant vnd füterung gehaben / vnd zu jm brengen möge.
  cs: |-
    Rovněž má nejvyšší velitel, jakmile se svým válečným lidem a děly {geschütz} vyrovnal síly nepřátelům, přiblížit se k nim co nejblíže tam, kde má výhodné postavení, a rozbít tam své ležení tak, jak bylo výše stanoveno, aby vždy mohl mít proviant i píci a přivážet si je k sobě.
- typ: odstavec
  de: |-
    So dann ein Oberster nahe bei den Feinden ligt / sol er einmal oder zwei / vnd nit vil mehr / es erforders dann durch etliche vrsachen / die hohe notturfft seins Kriegsuolcks eins theils zu roß vnnd fuß / nach gelegenheit des platzs vnd der feind erzeigen / in gůter fürsichtigkeit scharmützeln lassen / vnd der Oberst selbs sampt seinen zu roß vnd fuß Kriegsuerstendigen auffmercken / vnd wo für gůt angesehen würde der Kriegs erfarnen / soll sich doch der Ober nicht mit in den Scharmützel begeben / sonder fleissig acht haben / wie sich das Kriegsuolck gegen den feinden / auch die Feind gegen den seinen halte / vnnd das Kriegsuolck on gefehrlich nachtheil zu rechter zeit in ordnung abmanen / Auß einer solchen handlung kan ein Oberster / vil erfarung entpfahen / was er sich in Schlachten / stürmen / vnd anderer not / zum Kriegsuolck soll vnd möge vertrösten.
  cs: |-
    Leží-li tedy nejvyšší velitel blízko nepřátel, má dát jednou či dvakrát – a ne o mnoho vícekrát, ledaže by si to z určitých příčin vyžadovala nejvyšší nouze – ukázat část svého válečného lidu na koni i pěšky podle povahy místa a chování nepřátel a v dobré opatrnosti je nechat šarvátkovat; přitom má sám nejvyšší velitel spolu se svými války znalými muži od jízdy i pěchoty pozorně přihlížet, a i kdyby to zkušení válečníci uznali za vhodné, sám nejvyšší velitel[^1] se nemá pouštět do šarvátky, nýbrž má pilně sledovat, jak se chová jeho válečný lid proti nepřátelům i nepřátelé proti jeho lidem, a v pravý čas válečný lid bez nebezpečné újmy v pořádku odvolat. Z takového střetnutí může nejvyšší velitel získat mnoho zkušeností o tom, jak moc se může na svůj válečný lid spolehnout v bitvách, při útocích a v jiné tísni.
poznamky:
- n: 1
  text: V tisku chybně zkráceno „der Ober“ namísto „der Oberst“.
