bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    haben mögen / vnd nicht durch die anderen Personen als die Commissarien gehn muß / sonder mann soll auff das haupt ein auffsehens haben / vnd nit auff die andern vnd also das kleinst vor das gröst setzen / dann ein wunderbarlich werck vnd bedencken ists darumb zuhaben / wie ein Kriegs Commissarius zu solchem verstandt vnnd erfarung kompt / daß er aller Ampter Regirung wissen vnd verstehn wil vnd sol. Vnd noch mehr ist zubedencken / das sie alle Ampter zu regiren vndernemen dörffen / vnd sich so weiß vnd geschickt selbst achten / mehr als die solche Ampter lange jar vor jnen versehen vnd gebraucht haben / dann warlich es hett jrer einer mit der Ampter einem zuuersehen gnůg zuthůn / ich geschweig daß einer solche Ampter alle zu regiren versehen wil.
  cs: |-
    mít mohly a nemusely jít přes jiné osoby, jako jsou komisaři {Commissarien}. Naopak je třeba hledět na hlavu, a ne na ty ostatní, a nestavět tak nejmenší před největší. Je přece podivuhodné a hodné uvážení, jak válečný komisař přijde k takovému rozumu a zkušenosti, že chce a má znát a chápat správu všech úřadů. A ještě víc je třeba uvážit, že se odvažují ujímat řízení všech úřadů a pokládají se za moudřejší a schopnější než ti, kdo takové úřady zastávali a vykonávali dlouhá léta před nimi. Vždyť by věru každý z nich měl dost práce zastat jediný z těch úřadů – natož aby někdo chtěl řídit všechny.
- typ: odstavec
  de: |-
    Noch vil mehr ist sich zuuerwundern / daß ein Kriegsherr oder Oberster solliche ehr vnd hohe versehung auß jhren händen geben / vnd andern vor jhnen vertrawen vnd die ehr lassen / dann es ist des Kriegßherrn oberst Ampt solliches zuuersehen vnnd wissens zu haben / dann sein Regierung kompt durch die Ampter / darumb soll er die allezeit wissen vnd in verstandt haben / vnd zeitlich mit jnen rath halten / so kriegen die Kriegs personen ein lieb vnd sorg zu jren Obersten / Dann mann findt in den alten Römischen vnnd Griechischen Historien / daß sie jre Kriegßampter gar statlich wolbesetzt vnd regirt haben / deßgleichen haben die hoch Teutschen solch Ampter sitter der Römer zeitten hernach allezeit gehabt / besatzt / gebraucht vnd die krieg damit regirt / auch solchs nötig vnd gůt gefunden.
  cs: |-
    Ještě mnohem víc je s podivem, že válečný pán {Kriegsherr} nebo plukovník {Oberster} takovou čest a vysoké pověření vydávají ze svých rukou, svěřují je jiným a přenechávají jim tu čest před sebou samými. Je přece nejvyšším úřadem válečného pána, aby to obstarával a měl o tom přehled, neboť jeho vláda se uskutečňuje skrze úřady. Proto je má vždy znát, rozumět jim a včas se s nimi radit; tak si vojenské osoby získají lásku a oddanost ke svým plukovníkům. Ve starých římských a řeckých dějinách se totiž dočteme, že své válečné úřady {Kriegßampter} velmi skvěle obsazovali a spravovali. Rovněž horní Němci takové úřady od dob Římanů vždy měli, obsazovali je a užívali jich, řídili jimi války a shledali to potřebným a dobrým.
- typ: odstavec
  de: |-
    Aber ich sehe das etliche Kriegßherrn dahin beredt werden / es sei nit von nöten solche ampter alle zu haben / mann künde solches kostens vil sparn / vnd wirt dahin gericht / daß mann etlichen personen zwei / drei oder vier Ampter zusamen gibt / vnd der namen auch außthůt vnd zusamen Commissarien nennt / so das also soll vorgehn vnnd bleiben / dann werden die Ampter alle abgehn vnnd Commissarien werden / vnnd auff das letst dann werden die Commissarien also erfarn vnd geschickt / das eitel Obersten darauß wern werden.
  cs: |-
    Vidím však, že se někteří váleční páni nechávají přesvědčit, že prý není třeba mít všechny takové úřady a že by se tím ušetřilo mnoho nákladů. Směřuje to k tomu, že se několika osobám dávají dohromady dva, tři nebo čtyři úřady, jejich názvy se ruší a souhrnně se jim říká komisaři. Půjde-li to takto dál a zůstane-li to tak, pak všechny úřady zaniknou a stanou se z nich komisaři; a nakonec budou komisaři tak zkušení a obratní, že z nich budou samí plukovníci {Obersten}.
- typ: odstavec
  de: |-
    Ich sehe es aber nicht für gůt an / daß mann solliche hohe vnnd namhafftige Ampter laß abgehn / dann ein Krieg vnd Kriegs Regierung on die Ampter ist gar nackent vnd bloß / vnnd hat der Krieg sein ehr verlorn vnd wirt ein Schreiber werck vnd Kauffhandel darauß werden / wie mann sicht was für Kriegßleut die Commissarien seind / vnd wer die Commissen regiert vnd die vnder sich bringt / Darbei souil die Commissen belangt / will ich es bleiben lassen / vnnd den Kriegßherren die es angehet zu bedencken geben vnd beuelhen.
  cs: |-
    Já však nepokládám za dobré nechat takové vysoké a významné úřady zaniknout. Válka a válečná správa bez úřadů je totiž docela nahá a holá; válka tím ztrácí svou čest a stane se z ní písařská práce a kupecký obchod – vždyť je vidět, jací válečníci {Kriegßleut} ti komisaři jsou a kdo řídí komisy {Commissen}[^1] a strhává je pod sebe. Tím chci ve věci komisů skončit a přenechat to k uvážení a na starost válečným pánům, kterých se to týká.
poznamky:
- n: 1
  text: |-
    Solms zde používá výraz *Commissen* nejen pro samotné zásobovací a výdajové komisy, ale v širším ironickém smyslu i pro komisařské úřady a zakázky, které komisaři soustřeďují ve svých rukou.
