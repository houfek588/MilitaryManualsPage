bloky:
- typ: odstavec
  de: |-
    Zum vierdten/ so würde durch solche gemeine Rathschläg vil sachen dem Kriegsherrn eröffnet/ vnd an tag gebracht/ die dem Kriegsherrn auch zubedencken von nöten sein/ die etwan villeicht durch zwo oder drei personn nit bedacht werden möchten.
  cs: |-
    Za čtvrté by takové společné porady válečnému pánovi {Kriegsherrn} odhalily a vynesly na světlo mnoho věcí, které musí válečný pán také uvážit a na které by snad dvě nebo tři osoby nepomyslely.
- typ: odstavec
  de: |-
    Zum fünfften vnd letsten/ so möcht durch dise vil personn/ etwan etlich Artickel/ daran dem Herren vnd dem gemeinen hauffen angelegen sein würd/ verhalten werden/ vmb derselbigen geitz/ finantz/ oder gewinß willen. Derhalben so achten wir den gemeinen Rath/ durch obgemelte beuelchs leut/ nicht für vndienstlich.
  cs: |-
    Za páté a naposledy: bez těchto mnoha osob by mohly být některé články, na nichž záleží pánovi i obecnému vojsku, zamlčeny kvůli lakotě, fintám {finantz} či zisku [několika rádců].[^1] Proto nepokládáme společnou radu uvedených velitelů {beuelchs leut} za neužitečnou.
- typ: odstavec
  de: |-
    Den fünfften Artickel den Troß betreffent/ ist nicht gůt ein grossen Troß zu haben/ vnd souil müglich ist/ den Troß zu geringern/ dann der Troß wil gleich so wol essen/ als der recht geschaffen hauff/ das brengt dem Leger ein nachtheil/ für das erst.
  cs: |-
    K pátému článku, který se týká trénu {Troß}: není dobré mít veliký trén a je třeba jej co nejvíce zmenšit. Trén totiž chce jíst stejně jako řádně vypravený houf {hauff}, a to je pro ležení {Leger} na škodu. To zaprvé.
- typ: odstavec
  de: |-
    Zum andern/ im ziehen so der Troß groß ist/ so helt er den nachzug auff/ daß er weit dahinden bleiben můß/ das helt einen hauffen lang auff/ daß sie nit zusamen mögen/ besonder in der enge.
  cs: |-
    Za druhé: je-li trén na pochodu veliký, zdržuje zadní voj {nachzug}, takže ten musí zůstávat daleko vzadu. To houf dlouho zdržuje, takže se nemohou spojit, zvláště v úžinách.
- typ: odstavec
  de: |-
    Soll mann dann von den Feinden ziehen/ vnd der Troß hinfür auff den fürzug zeucht/ so helt er den gantzen hauffen auff/ vnnd wann mann eyllens ziehen můßt/ auß not/ möcht das vor dem grossen Troß nit geschehen/ vnd so der Troß dann also groß ist/ dringt er den fürzug vnd den rechten hauffen weit von einander/ vnd so dann etwann würd in den Troß gefallen von den Feinden/ inn der enge durch die lange reyhe/ so kan ein Troß ein flucht gemachen/ vnd die grossen hauffen auch in vnordenung brengen oder flucht/ wiewol zu achten ist. Nun ist es aber nicht fast wol zuuorkommen/ auß vilen vrsachen/ dann die Knecht haben vil Weiber/ eins ist sein eheweib/ der ander wil sunst on sein Hůrn nit ziehen/ vnnd dergleichen hat es also ein jrrung/ so wöllen ein theil buben haben/ vnnd wann mann also beittet/ biß daß mann in der Feind landt ist/ vnd wil dann den Troß mustern/ das ist beschwerlich/ vnd macht grossen vnwillen.
  cs: |-
    Má-li se pak táhnout pryč od nepřátel a trén jde vpředu u předvoje {fürzug}, zdržuje celý houf; a kdyby se z nouze muselo táhnout ve spěchu, kvůli velikému trénu by to nešlo. Je-li trén tak velký, rozdělí předvoj a hlavní houf daleko od sebe. Kdyby pak nepřátelé v úžině vpadli do trénu, protaženého v dlouhé řadě, může trén způsobit útěk a uvést v nepořádek či na útěk i velké houfy, jak si lze snadno domyslet. Tomu se však z mnoha příčin nedá dobře předejít. Knechti {Knecht} mají totiž mnoho žen: jeden má manželku, druhý zase nechce táhnout bez své děvky, a tak je v tom zmatek; někteří chtějí mít pacholata {buben}.[^2] A čeká-li se, až se vstoupí do nepřátelské země, a teprve pak se má trén přehlížet {mustern}, je to obtížné a vyvolává to velikou nevoli.
- typ: odstavec
  de: |-
    Vns bedunckt aber ob es durch disen weg zuuorkommen wer/ daß mann inn dem ersten vmbschlagen vnd annemen der knecht/ wann mann die annimpt vnd einschreibt/ vorgehalten hett/ daß man jnen solchen troß nicht zulassen wirt/ es weren dann jre Eheweiber/ vnnd welcher also mit Hůren wöl vmbziehen/ denselbigen wolt er nicht annemen/ was von eintzlichen Knechten weren/ dann dasselbig ist doch liederlich volck/ vnd ist kein gluck noch frieden darbei.
  cs: |-
    Zdá se nám však, že by se tomu dalo předejít tak, že by se knechtům hned při prvním verbování a najímání, když se přijímají a zapisují, oznámilo, že jim takový trén nebude dovolen, leda jejich manželky; a kdo by chtěl táhnout s děvkami, toho [hejtman] nepřijme, pokud jde o svobodné knechty. Je to totiž stejně prostopášná cháska a není při ní štěstí ani pokoj.
- typ: odstavec
  de: |-
    Were es aber der gesindt hett/ vnd ein Köche haben můßt/ der kan nit wol eines Weibs entberen/ zu kochen/ waschen vnnd warten/ das muß mann zulassen/ wolt aber einer eine mit fůren/ die allein auff sein
  cs: |-
    Kdyby však měl někdo čeleď a musel mít kuchyni, ten se bez ženy na vaření, praní a obsluhu dobře neobejde; to je třeba dovolit. Kdyby však chtěl někdo s sebou vozit ženu, která má obsluhovat jen jeho
poznamky:
- n: 1
  text: |-
    Tisk má *durch dise vil personn* („skrze tyto mnohé osoby“); smysl celé úvahy je, že široká rada zabrání, aby úzký okruh rádců věci pro svůj prospěch zamlčel.
- n: 2
  text: |-
    Pacholata (něm. *Buben*) a služebné ženy tvořily běžnou součást trénu (*Troß*).
