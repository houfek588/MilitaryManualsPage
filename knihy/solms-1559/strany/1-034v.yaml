  popis: |-
    Dřevořez znázorňující rozmluvu zkušeného staršího muže a mladého šlechtice (nad postavami tištěné popisky „Alter Vatter.“ vlevo a „Son.“ vpravo). Vlevo stojí vousatý stařec v baretu, v kožešinou podšitém kabátci s nabranými rukávy, širokých prostřihovaných kalhotách a s pobočním kordem a měšcem u pasu, jak pozdviženou levou rukou poučuje mladíka. Vpravo stojí mladý muž s knírem v širokém baretu zdobeném pery, v prostřihovaném kabátci a úzkých nohavicích s kordem po levém boku; pravou ruku má přátelsky položenou na starcově rameni a levou zdviženou před hrudí, jak pozorně naslouchá jeho radám.
