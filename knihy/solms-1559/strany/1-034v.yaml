  popis: |-
    Celostránkový dřevořez se dvěma stojícími postavami, které se k sobě obracejí v rozhovoru; nad nimi tištěné popisky „Alter Vatter.“ (vlevo) a „Son.“ (vpravo). Vlevo vousatý starší muž v nabraném baretu, v kabátci s kožešinovým límcem a širokými nabíranými rukávy a v prostřihovaných kalhotách po kolena; jednu ruku má u opasku s krátkým mečem, druhou vlídně vztahuje k mladíkovi. Vpravo mladý muž s knírem v širokém plochém baretu zdobeném pery, v kabátci s vysokým nabíraným límcem, s mohutně nabíranými a prostřihovanými rukávy a v pruhovaných prostřihovaných kalhotách, rovněž s krátkým mečem napříč u pasu. Oba v módě lancknechtské doby stojí na travnatém pahorku s rostlinami; svislá spára v půdě uprostřed ukazuje, že obraz je složen ze dvou samostatných štočků.
