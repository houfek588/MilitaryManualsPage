bloky:
- typ: odstavec
  de: |-
    DIse Figur ist ein Büchsenzog mit dreien bein/ vnd die zwei bein bleiben allezeit bei vnd an einander/ wie mann sicht daß sie starck oben mit eisen zusamen gefast sind/ vnnd das drit bein ist nicht eingemacht daß es stets darinn bleibt/ sonder mann setzt es mit einem zappen oben in die zwei zu samen gemachte bein/ daß mann also die zwei bein mit einander tregt auff ein seiten der Büchsen/ vnd setzt sie dann oben zusamen/ dann haben die zwei zusamen gemachte bein oben ein loch so hat das einig bein oben ein zappen den setzt mann in das loch/ dann stehts fest on schliessung eines nagels.
  cs: |-
    Tato figura je dělový kladkostroj {Büchsenzog} na třech nohách. Dvě nohy zůstávají vždy spolu – jak je vidět, jsou nahoře pevně spojeny železem; třetí noha však není upevněna natrvalo, nýbrž se nahoře čepem zasazuje do obou spojených noh. Obě spojené nohy se tak nesou společně na jednu stranu děla a nahoře se pak sestaví: spojené nohy mají nahoře otvor a samostatná noha nahoře čep, který se do otvoru zasadí; pak vše stojí pevně i bez zajišťovacího hřebu.
- typ: odstavec
  de: |-
    Die scheiben mit dem sayl hangen oben an den zweien bein/ vnnd das loch darinn ist vber dem hacken da die scheiben anhangen/ vnd wann das drit bein eingesetzt wirt/ dann zeugt das gewicht die drei bein zusamem/ daß sie nicht auß einander künden.
  cs: |-
    Kladky (*scheiben*) s lanem visí nahoře na obou spojených nohách a otvor je nad hákem, na němž kladky visí. Když se třetí noha zasadí, táhne břemeno svou tíhou všechny tři nohy k sobě, takže se nemohou rozjet.
- typ: odstavec
  de: |-
    Die Figur mit 9. verzeichnet ist genant ein schůch den legt mann an ein Rat wann ein Büchs den berg abgeht/ daß das nit vmbgehn kan/ dann es steht in dem schůch/ vnnd er ist vber des Rats felgung an ein speyche gebunden/ daß der schůch am Rat bleiben muß/ vnder ist mitten an den wagen gehengt/ das thůt keinem Rat so wehe als wans mit ketten gehempt wirt/ dann ein kette zereist die schwere Reder.
  cs: |-
    Figura označená číslem 9 se nazývá brzdná bota (*schůch*); dává se pod kolo, když dělo jede z kopce, aby se kolo nemohlo otáčet, neboť stojí v botě. Bota je přes loukoť kola přivázána k paprsku, takže musí zůstat u kola, a dole je zavěšena doprostřed vozu. To kolu neškodí zdaleka tolik, jako když se brzdí řetězem, neboť řetěz těžká kola roztrhá.
