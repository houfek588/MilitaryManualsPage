bloky:
- typ: odstavec
  de: |-
    DIse Figur ist ein Büchsenzog mit dreien bein/ vnd die zwei bein bleiben allezeit bei vnd an einander/ wie mann sicht daß sie starck oben mit eisen zusamen gefast sind/ vnnd das drit bein ist nicht eingemacht daß es stets darinn bleibt/ sonder mann setzt es mit einem zappen oben in die zwei zu samen gemachte bein/ daß mann also die zwei bein mit einander tregt auff ein seiten der Büchsen/ vnd setzt sie dañ oben zusamen/ dann haben die zwei zusamen gemachte bein oben ein loch so hat das einig bein oben ein zappen den setzt mañ in das loch/ dann stehts fest on schliessung eines nagels.
  cs: |-
    Tato figura jest dělový kladkostroj {Büchsenzog} na třech nohách (trojnožka); dvě nohy zůstávají vždy pohromadě a u sebe, jak jest vidět, že jsou nahoře pevně spojeny železem, a třetí noha není upevněna natrvalo, nýbrž se nahoře čepem zasazuje do dvou spojených noh. Dvě spojené nohy se tak přenesou spolu na jednu stranu děla a nahoře se spojí se třetí; spojené nohy mají nahoře otvor a samostatná noha má nahoře čep, jenž se vsadí do tohoto otvoru – pak vše stojí pevně i bez zajištění závlačným hřebem.
- typ: odstavec
  de: |-
    Die scheiben mit dem sayl hangen oben an den zweien bein/ vnnd das loch darinn ist vber dem hacken da die scheiben anhangen/ vnd wann das drit bein eingesetzt wirt/ dann zeugt das gewicht die drei bein zusamem/ daß sie nicht auß einander künden.
  cs: |-
    Kladnice s lanem visí nahoře na dvou spojených nohách a otvor pro čep jest nad hákem, na němž kladky visí; a když se třetí noha zasadí, pak břemeno svou tíhou stahuje všechny tři nohy k sobě, takže se nemohou rozjet.
- typ: odstavec
  de: |-
    Die Figur mit 9. verzeichnet ist genant ein schůch den legt mann an ein Rat wann ein Büchs den berg abgeht/ daß das nit vmbgehn kan/ dann es steht in dem schůch/ vnnd er ist vber des Rats felgung an ein speyche gebunden/ daß der schůch am Rat bleiben muß/ vnder ist mitten an den wagen gehengt/ das thůt keinem Rat so wehe als wans mit ketten gehempt wirt/ dann ein kette zereist die schwere Reder.
  cs: |-
    Vyobrazení označené číslem 9 se nazývá zarážecí bota (*schůch*); ta se podkládá pod kolo, když dělo sjíždí z kopce, aby se kolo nemohlo otáčet, neboť stojí v této botě, jež jest přes loukoť kola přivázána k paprsku, takže musí u kola zůstat, a dole jest zavěšena ke středu vozu. To neškodí kolu zdaleka tolik, jako když se brzdí řetězem, neboť řetěz těžká kola roztrhá.
