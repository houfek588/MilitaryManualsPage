bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    flucht wenden / oder in einen vortheil zusamen thetten / daß sein volck auff jhn weichen / oder wann sie sich zusamen (wie gehört) gethon hetten / er sie auß dem vortheil widerumb in die flucht schiessen vnnd schlagen möcht / hierinn bedarff ein Oberster grosser fürsichtigkeit / sonderlich wider die Türcken / die schlagen offt jhre feinde / dann die Türcken am anfang zu jrem vortheil pflegen zu fliehen / vnd so dann jre feind jnen nachiagen / vnd in vnordnung begeben / alßdann wenden sie sich / vnd siegen / oder füren ein Kriegsuolck von jrem Troß vnd wägen so weit / ehe dann sie wider kommen / haben die Türcken den Troß vnd Wägen erschlagen / vnnd geplündert / Deßhalben erfordert in einer solchen handlung / eines jeden Obersten hohe notturfft / daß er die Wägen / Troß / vnd groß Geschütz / wol mit fußuolck verware / damit jm kein solches (wie etwan geschehen) begegne / Die Türcken seind auch mit haltsteten / vnd in Scharmützeln die geschicksten Kriegsleut in der gantzen welt.
  cs: |-
    útěku obrátili nebo se shromáždili v nějakém výhodném postavení, aby se k němu jeho lid mohl stáhnout, anebo kdyby se takto (jak řečeno) seskupili, aby je z toho výhodného postavení mohl opět rozstřílet a zahnat na útěk. V tom potřebuje plukovník {Oberster} veliké opatrnosti, zvláště proti Turkům {Türcken}: ti často porážejí své nepřátele tím, že zpočátku ke svému prospěchu zdánlivě prchají, a když je pak jejich nepřátelé pronásledují a rozptýlí se v nepořádku, obrátí se proti nim a zvítězí; anebo odvedou válečný lid {Kriegsuolck} tak daleko od jeho trénu {Troß} a vozů, že než se stačí vrátit, Turci pobijí a vyplení trén i vozy. Proto je v takovém případě pro každého plukovníka nanejvýš nutné, aby vozy, trén i velká děla {Geschütz} dobře zajistil pěchotou {fußuolck}, aby se mu nic takového (jak se už stalo) nepřihodilo. Turci jsou také v kladení záloh {haltsteten} i v šarvátkách nejobratnější válečníci {Kriegsleut} na celém světě.
- typ: odstavec
  de: |-
    Welchem Obersten dann Gott sieg verleihet / der soll nicht darauff (wie etwan geschehen) Bancket halten / doll vnd vol sein / sonder er soll sampt dem gantzen hauffen Gott dem Allmechtigen / vnd seinen göttlichen gnaden lob / ehr / vnd preiß singen vnd sagen / Der Oberst soll auch darüber sonderlich rath halten / damit sie alle gemelt danckbarkeit gegen Gott / andechtiglich vnd Christlich volbringen.
  cs: |-
    Kterému plukovníkovi pak Bůh udělí vítězství, ten nemá hned poté (jak se někdy stávalo) pořádat hostiny a opíjet se, nýbrž má spolu s celým houfem {hauffen} zpívat a vzdávat všemohoucímu Bohu a jeho božské milosti chválu, čest a slávu. Plukovník má o tom také zvlášť poradit, aby všichni tuto vděčnost vůči Bohu vykonali zbožně a křesťansky.
- typ: odstavec
  de: |-
    Hat sich dann der Oberst mit seinem Kriegsuolck einer gemeiner Beute verglichen / alßdann wirt es nach altem Kriegsbrauch / doch on schaden der Beutmeister / verhandelt / diser Artickel ist bei den Kriegsleuten so gemein / daß es daruon keiner meldung bedarff / wo aber kein gemeine Beut gemacht / da behelt ein jeglicher was er gewint / doch etlicher hohen vnd andern ämptern jrer Gerechtigkeit on schaden / daruon hernach anzeigung bei denselbigen ämptern geschehen soll / so ist des Kriegsherrn gerechtigkeit im anfang gnůgsam erklert worden.
  cs: |-
    Dohodl-li se pak plukovník se svým válečným lidem na společné kořisti, nakládá se s ní podle starého válečného obyčeje, avšak bez újmy pro mistry kořisti {Beutmeister}. Tento článek je mezi válečníky tak běžný, že o něm netřeba šířeji mluvit. Kde se však společná kořist nedělá, tam si každý ponechá, co získá, avšak bez újmy pro práva některých vysokých i jiných úřadů, o nichž bude dále při těchže úřadech podána zpráva. Práva válečného pána {Kriegsherrn} byla již dostatečně vyložena na počátku.
- typ: odstavec
  de: |-
    Wann aber die Feind von einem Obersten / der nahe bei jnen ligt / abziehen wöllen / soll er abermals vernünfftig handeln / vnd nit mit weitender / schneller / vnordnung jnen nacheilen / auch sein Volck nit bald plündern lassen / dann vber denen beiden stücken sein etliche / bei menschen gedencken auff Wasser vnd Land / geschlagen worden / der Oberst sol auch die so abziehen / vmbzubrengen nicht vnderstehn / oder jnen den abzug mit gewalt wehrn / sonder sie wol in volkommen abzug lassen kommen / vnd darnach kein fleiß sparen / ob er sie inn die flucht brengen möcht / Deßhalben haben die alten Kriegsuerstendigen ein sprichwort gehabt / vnd ist auch war / Kan dein Feind / wann ers gern
  cs: |-
    Když však nepřátelé chtějí odtáhnout od plukovníka, který leží blízko nich, má opět jednat rozumně a nepronásledovat je v rozptýleném, zbrklém nepořádku, ani nenechat svůj lid hned plenit; neboť kvůli těmto dvěma věcem byli někteří za lidské paměti poraženi na vodě i na souši. Plukovník se také nemá pokoušet pobít ty, kdo odtahují, ani jim násilím bránit v odchodu, nýbrž má je nechat zcela nastoupit ústup a teprve potom nešetřit úsilím, aby je zahnal na útěk. Proto mívali staří váleční znalci přísloví – a je to i pravda: „Nemůže-li od tebe tvůj nepřítel, když by to rád
