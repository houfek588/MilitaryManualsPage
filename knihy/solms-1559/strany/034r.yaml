bloky:
- typ: odstavec
  de: |-
    DIeweil die Prouiant das Hauptstück ist des Kriegs / vnd so mann die Prouiant nit haben mag / ist der gantz Krieg mit aller seiner Rüstung so darzů gehört / nichts / wann die Prouiant nit darbei ist / Dann Prouiant die můß das leben von dem menschen vnd Thiern erhalten / danns leben das regiert vnd richt alle rüstung des Kriegs / on das leben stehet die Rüstung still / kan jr selber nicht helffen / sie sei so starck / so vil vnnd wol zu gericht / wie sie wöl / Dieweil dann durch das leben alle Instrument des Kriegs regiert müssen werden / so můß mann für allen dingen / das leben erhalten / welches dann on Prouiant nicht geschehen mag.
  cs: |-
    Proviant {Prouiant} je hlavní věcí války: nelze-li proviant mít, není celá válka se vší výzbrojí {Rüstung}, která k ní patří, ničím, chybí-li při ní proviant. Proviant totiž musí udržovat život lidí i zvířat, a život řídí a vede veškerou válečnou výzbroj; bez života výzbroj stojí a nemůže si sama pomoci, ať je jakkoli silná, početná a dobře připravená. Poněvadž tedy všechny nástroje války musí řídit život, je třeba nade vše zachovat život, a to se bez proviantu nemůže stát.
- typ: odstavec
  de: |-
    Vnd so ein Herr einen Krieg füren will oder můß / soll er inn der zeit seine Prouiant verordnen / daß jm dieselbig gewiß nachkommen mög / vnd so der Herr der Landt mechtig / daß er dieselbigen in seiner verwaltung hat / soll er vertrawte / ehrliche Person darzů verordnen / die des verstandt haben / die gelegenheit der Landt wissen vnnd kennen / auch mit dem Landtuolck darin wissen geschicklich vnd gütlich vmb zugehn / derselbig Herr / es sei einer oder mehr / die sollen in derselbigen Landtschafft vnd pflegen / die ende vnd ort da die Prouiant liegen soll / es sei von Korn / Habern vnd Wein / bereiten vnnd besichtigen / vnd mit denselbigen Personen / es seien Fürsten / Prelaten / Grauen / Herrn / Edelleut / Clöster / Stät / oder gemein / handlen / die frücht besichtigen / vnd alle Kasten wo sie die finden / die summa der frücht darauff vberschlahen / alßdann mit denselben personen darumb handeln / vnd eins kauffs der billich wer zu vergleichen / so ferr daß dieselbigen Kasten an den orten gelegen weren / da der Krieg oder zug hin auß würt gehn / vnd so dieselbigen sich des kauffs mit einander vergleichen würden / So sollen sie die maß die da gebreuchlich ist / wigen lassen / wie schwer ein maß an gewicht sei / vnd soll derselbigen maß eins / mit kundtschafft oder beisein / malen lassen / vnd sein abgang des gewichts durch das malen wider mercken vnnd auffschreiben / darnach wider / in beisein / zu teyg machen / vnd alßdann darauß die prob auff das gewicht / alls auff zwei vnd vier pfundt machen lassen / So das brot also auff das gewicht gebacken wirdt / die zwei vnnd vier pfundt behalten / darnach kan er wissen wieuil brot vnnd pfundt / das maß so er gemessen vnnd gewigen / brot hat geben / So kan er vberschlagen / wieuil personen er einn tag von solchem maß erhalten kan / vnd fort dem maß nach den gantzen hauffen der frucht vberschlahen /
  cs: |-
    Chce-li nebo musí-li pán vést válku, má včas zařídit proviant, aby jej za ním spolehlivě dováželi. Je-li pán zemí mocen, takže je má ve své správě, má k tomu určit spolehlivé a poctivé osoby, které tomu rozumějí, znají poměry v zemi a umějí s tamním venkovským lidem jednat obratně a vlídně. Tito pověřenci, ať jeden nebo více, mají v té krajině a v jejích úřadech objet a prohlédnout místa, kde má proviant ležet, ať jde o žito, oves nebo víno, a jednat s tamními lidmi, ať jsou to knížata, preláti, hrabata, páni, šlechtici, kláštery, města nebo obce. Mají prohlédnout obilí a všechny sýpky, kde je najdou, odhadnout v nich množství obilí, pak s majiteli vyjednat a dohodnout spravedlivou kupní cenu, ovšem jen tehdy, leží-li ty sýpky v místech, kudy povede válka čili tažení {zug}. Shodnou-li se na koupi, mají dát zvážit tamní obvyklou míru, kolik jedna míra váží, a jednu takovou míru dát před svědky či za přítomnosti obou stran semlít a úbytek na váze při mletí si poznamenat a zapsat. Pak z ní opět za přítomnosti [svědků] zadělat těsto a dát z něj upéct zkušební chleby na váhu, totiž po dvou a čtyřech librách {pfundt}. Když se chléb takto upeče na váhu, mají se ty dvou- a čtyřliberní chleby uschovat; pak lze vědět, kolik chlebů a liber chleba dala míra, která byla změřena a zvážena. Tak lze spočítat, kolik osob se z takové míry uživí za den, a dále podle té míry odhadnout celé množství obilí
