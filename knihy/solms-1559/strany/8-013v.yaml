strana: verso
sken: 614
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    außweisen vnd anzeigen / wie die Tonnen oder Fässer gemacht vnd zugericht sein sollen / deßgleichen wie mann die setzen oder legen soll / vnd wann die Tonnen auffrichtig stehen / so künden sie mehr vmb sich schlagen dann wann sie auff einer seiten ligen / wann sie auff der seiten ligen / so schlecht die seit darauff sie ligen vndersich in die Erd / wann sie aber auffrichtig stehen / so sind jnen alle seiten außzuschlagen frei.
  cs: |-
    ukazují a vykládají: jak mají být soudky {Tonnen} neboli sudy {Fässer} zhotoveny a připraveny a také jak se mají postavit či položit. Stojí-li soudky zpříma, mohou kolem sebe bít víc, než když leží na boku. Leží-li na boku, bije strana, na níž leží, dolů do země; stojí-li však zpříma, mohou volně bít na všechny strany.
- typ: odstavec
  de: |-
    Die 23. Figur zeigt an wie mann Bechring die mann zum störmen braucht / vnd dem Volck an die Hälß wirfft / machen soll / vnnd erstlich soll mann leynen Tůch nemen / vnd darauß lange Seck wie Würst / vnd zwen Finger weit machen / vnd mit einem faullen Puluer oder Zeug außföllen / vnnd der zwen vmb einander drehen / wie die Figur anzeiget / wann das geschehen daß sie zusamen geschlossen sind / soll mann die in einem warmen Schwefel vnd Hartz durch einander geschwelt wol tauffen / vnd so warm ein Flachs oder Hanff darumb binden / vnd wider wie zuuor tauffen / mann soll die Seck an zweien orten mit zweien Zipffeln gegen einander in dem zusamen winden / vnd an zweien orten fürgehn lassen / wann mann sie brauchen will / so schneit mann die vorgenenten Zipffel fornen auff / vnd zündt sie bei den selben zweien Zipffeln an / vnd wirfft sie vnder das Volck im storm.
  cs: |-
    Vyobrazení č. 23 ukazuje, jak se mají dělat smolné věnce {Bechring}, jichž se užívá při útoku {störmen} a které se házejí lidem na krk. Předně se vezme lněné plátno a ušijí se z něho dlouhé pytlíky jako klobásy, na dva prsty široké, naplní se pomalým prachem {Puluer} neboli složí {Zeug} a dva z nich se stočí kolem sebe, jak ukazuje vyobrazení. Když jsou takto spojené [do kruhu], mají se dobře namočit v teplé síře {Schwefel} a pryskyřici rozpuštěných dohromady, ještě teplé se mají ovinout lnem nebo konopím a znovu namočit jako předtím. Pytlíky se mají při stáčení na dvou místech položit dvěma cípy proti sobě a na dvou místech je nechat vyčnívat. Když se pak mají použít, nařížnou se vpředu řečené cípy, věnec se u těchto dvou cípů zapálí a hodí se mezi lid při útoku.
- typ: odstavec
  de: |-
    Die 24. Figur ist ein gebachene Kugel von Haffen Erden / vnd soll 8. Zöl dick oder groß / vnd 4. Zöl hol / an Zeug 2. Zöl dick sein / vnd einn langen halß mit zweien Rören / vnd ein loch eines kleinen Fingers weit dardurch gehen / haben / vnd vnden enger dann oben sein / auch wol gemacht vnd gebachen werden / darnach mit gůtem Puluer biß an den engen halß / oder wol ein zwerg finger in die enge des Hals gefölt / alßdan soll mann ein faullen gestossenen Zeug der langsam brennet / nemen / vnd die Rörn etwan zwen Finger hoch außföllen / vnd daßselbig mit einem ronden Holtz hart auff einander schlagen / darnach daßselbig widerumb zwen Finger hoch mit solchem faullen gestossenen Zeug außföllen / vnd dann wider hart auff einander wie vor schlagen / vnd also fürtan biß der Halß vol wirt / vnnd dann mit einem Leder oben zugebunden / vnd verwarlich hingelegt / biß zur zeit daß mann es brauchen soll.
  cs: |-
    Vyobrazení č. 24 je pálená koule {Kugel} z hrnčířské hlíny. Má být 8 palců {Zöl} silná neboli velká, 4 palce dutá a stěna má být 2 palce silná. Má mít dlouhé hrdlo se dvěma trubkami[^1], jímž prochází otvor na malíček široký, dole užší než nahoře; má být dobře udělaná a vypálená. Potom se naplní dobrým prachem až k úzkému hrdlu, nebo klidně ještě na prst napříč do zúžení hrdla. Pak se vezme pomalá drcená slož, která hoří zvolna, trubky {Rörn} se jí naplní asi na dva prsty vysoko a kulatým dřívkem se to pevně upěchuje; potom se zase na dva prsty vysoko naplní touž pomalou drcenou složí a znovu jako předtím pevně upěchuje, a tak dále, dokud hrdlo není plné. Pak se nahoře převáže kůží a bezpečně uloží až do doby, kdy se má použít.
- typ: odstavec
  de: |-
    Vnd so mann es in einem Storm brauchen wil / soll mann an die oren am halß ein schnor einer Elen lang / vnd am ende der schnorn ein Kneblin eines Fingers lang binden / daß einer den Knebel mit der Schnor mög zwischen die Finger nemen vnd fornen anzünden /
  cs: |-
    A když se má použít při útoku {Storm}, má se k uším na hrdle přivázat šňůra loket {Elen} dlouhá a na konec šňůry kolíček na prst dlouhý, aby mohl člověk kolíček se šňůrou vzít mezi prsty, [kouli] vpředu zapálit
poznamky:
- n: 1
  text: |-
    Tisk má „mit zweien Rören“ (se dvěma trubkami); podle vyobrazení č. 24 i podle následujícího odstavce („an die oren am halß“) jde spíše o dvě ucha (Oren) na hrdle, za něž se uváže šňůra.
