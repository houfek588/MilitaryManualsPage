id: 9-021r
list: 21 (9. kniha)
strana: recto
sken: 661
stav: prelozeno
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    seind/ so laßt einen Gottsdienst für sie volbnbringen/ wann jhr etlich namhafftig auß den ewern verloren habt/ solt jr euch vbel vmb sie gehaben/ so wirt es euch einen gůten willen gegen den ewern machen/ vnd euch auch ehrlich sein.
  cs: |-
    dejte za ně sloužit bohoslužbu[^1]. Ztratili-li jste ze svých lidí některé význačné muže, máte nad nimi zjevně truchlit; získá vám to u vašich lidí dobrou vůli a bude vám to i ke cti.
- typ: odstavec
  de: |-
    Es seind noch vil ding die mann wol zu der Ordnung vnd schlagen brauchen möcht/ aber sie lassen sich nit schreiben sonder mussen gemalt werden/ dieweil ich aber vermein jr werd solcher stück nicht betürffen/ wil ich nichts daruon schreiben.
  cs: |-
    Je ještě mnoho věcí, jichž by se dalo dobře užít při šiku {Ordnung} a v bitvě, ale nedají se popsat, nýbrž musely by se namalovat. Protože však míním, že takových věcí nebudete potřebovat, nechci o nich nic psát.
- typ: odstavec
  de: |-
    Es ist ein gefehrlich ding ein stat oder ort das nit fest ist/ vnd darinn nit leut seind die lust haben es zubehalten/ vor den Feinden zu beschliessen/ doch weiß ich wol daß jr der mann nit seit der sich beschlossen halt/ noch sonst in ein Stat oder ort belegert/ ich wolts euch auch nit rathen/ also lang jr anderst daruor sein kundt/ dann solches euch als einem grossen Herren nit zůsteht/ sonder solt herauß sein/ damit jr denen so belegert zu hilff kommen kündt/ doch solt jhr vor allen dingen einen kecken vnd witzigen Hauptman in die besatzung legen/ vnd wann derselbig vor mals nie belegert ist gewesen/ ist von nöten daß jr jm ein zůgebt der vor mehr belergert ist worden/ Zum ersten wirt daß das gröst geschefft sein/ daß er das Volck willig behalt/ daß sie nit vber die groß arbeit vnd elend so sie leiden müssen/ klagen werden/ das kund jr in dreierlei weg fürkommen/ das erst daß jr als wenig jhr ehrlich leut habt die gůt auff ewer seiten/ vnd bereit seind zu leiden alles das darzů gehörig ist/ dardurch sie jr ehr vnd die Stat behalten/ solche vnder ewer Volck außtheiln/ welche die ewern trösten vnd hertzhafftig machen/ vnnd wo sie von einem ein vntröstlich wort hören/ daß sie von stunden an solches ernstlich wider sprechen/ vnd es nicht vnder den gemeinen man kommen lassen/ dann einer der ein wenig ein ansehen hat/ vnd so vntröstlich von den sachen reden wolt/ würde einen grossen hauffen verfüren/ vnd hinden nach auch ein aufflauff vnder dem Kriegßuolck machen/ euch dardurch zwingen die Stat oder das ort auffzugeben/ das dann wider ewer ehr würde sein.
  cs: |-
    Je nebezpečná věc dát se před nepřítelem zavřít v městě nebo místě, které není pevné a v němž nejsou lidé ochotní je udržet. Vím ovšem dobře, že nejste muž, který by se dal zavřít nebo jinak oblehnout v nějakém městě či místě, a ani bych vám to neradil, dokud se tomu můžete jinak vyhnout. Vám jako velikému pánu to totiž nepřísluší; máte být venku, abyste mohli obleženým přijít na pomoc. Především však máte do posádky {besatzung} dosadit smělého a rozumného hejtmana {Hauptman}. Jestliže ten ještě nikdy obležen nebyl, je třeba přidat mu někoho, kdo už obležen byl[^2]. Za prvé bude jeho největší starostí udržet lid ochotným, aby si nestěžoval na velkou práci a bídu, kterou musí snášet. Tomu můžete předejít trojím způsobem. Za prvé: ať máte poctivých mužů, kteří stojí věrně na vaší straně a jsou připraveni snést vše, co k tomu patří, aby uhájili svou čest i město, sebeméně, rozdělte je mezi svůj lid. Ti mají vaše lidi těšit a dodávat jim odvahy, a kdykoli od někoho uslyší malomyslné slovo, mají mu ihned důrazně odporovat a nedopustit, aby se to dostalo mezi obec {gemeinen man}. Kdyby totiž někdo, kdo má trochu vážnosti, chtěl o věcech tak malomyslně mluvit, svedl by velký houf lidí a nakonec by i ve válečném lidu {Kriegßuolck} vyvolal vzpouru. Tím by vás donutil vzdát město nebo místo, což by bylo proti vaší cti.
- typ: odstavec
  de: |-
    Zum andern ist von nöten/ daß jr offt vnder jnen seit/ es sei auff den befestungen/ wacht oder sonst/ vnd euch gemein mit jnen macht/ Auch wo etwas zu bawen oder machen ist/ solt jhr der erst die hand anlegen/ darnach jnen zusprechen mit gůten oder hefftigen worten/ nach dem die sach eine gestalt hat/ vnnd daß sie fleissig arbeiten/ mit sollichem geding möcht jhr sie zu frieden stellen/ vnnd vnklegklich halten.
  cs: |-
    Za druhé je třeba, abyste byli často mezi nimi, ať na opevnění, na stráži {wacht}, nebo jinde, a abyste se s nimi družili. Také kde je třeba něco stavět nebo dělat, máte první přiložit ruku k dílu a potom k nim promlouvat dobrými nebo důraznými slovy, podle toho, jak se věc má, aby pilně pracovali. Takovým jednáním je můžete udržet spokojené a bez nářků.
- typ: odstavec
  de: |-
    Zu dem dritten vnd letsten ist das/ wann jhr einen vnder euch habet/ der euch vnd ewer Heer auffhalten/ oder wider den gantzen hauffen
  cs: |-
    Za třetí a naposledy: máte-li mezi sebou někoho, kdo by chtěl vás a vaše vojsko mařit nebo mluvit proti celému houfu
poznamky:
- n: 1
  text: |-
    *volbnbringen* – tak v tisku, zřejmě tisková chyba za *volnbringen* / *volbringen* („vykonat, dát sloužit“).
- n: 2
  text: |-
    *belergert* – tisková chyba za *belegert* („obležen“).
