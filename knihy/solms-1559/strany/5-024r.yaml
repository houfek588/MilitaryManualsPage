stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: nadpis
  uroven: 2
  de: |-
    Das sibend Blochauß.
  cs: |-
    Sedmý srub.
- typ: odstavec
  de: |-
    Dises Blochauß ist gleicher gestalt/ wie dise hieoben vierung/ ein Außfürung an einer Schantzen/ so auch von einem Blochauß zum anderen gehet.
  cs: |-
    Tento srub {Blochauß} je téže podoby jako tento čtverec výše: výběžek na šanci {Schantzen}, která rovněž vede od jednoho srubu ke druhému.[^1]
poznamky:
- n: 1
  text: |-
    Text je vytištěn v levé horní části rozkládacího listu (sken 483), jehož rub nese velké vyobrazení [[5-024v|osmého srubu]]. Slova „dise hieoben vierung“ se vztahují k čtverhrannému výběžku na předchozím dřevořezu [[5-023v|5-023v]].
