poznamky:
- n: 1
  text: Tisk čísluje položky „14“ a „25“; po položce 23 má jít o položky 24 a 25.
- n: 2
  text: Nejisté místo – „vndergesteckter Drosser“ patrně znamená, že trénní koně byli „zastrčeni“ (započteni) do počtu vozů, a proto se za ně odečítá. Rejstřík Helwicka von Rückerßhausen a Daniela Scheurschloße tím končí s čistou částkou 423 zl. 14 bac.
- n: 3
  text: Čtení „Hantgelt“ odpovídá tisku; snad zkomolené křestní jméno (např. Haugold) příslušníka míšeňského rodu von Maltitz. Otto a Hanß von Dißkaw patří k saskému rodu von Dieskau.
