poznamky:
- n: 1
  text: Na předchozí straně činí peníze za trénní koně 7 zl. 7½ bac.; zbytek 602 zl. 12 bac. odpovídá odečtu 7 zl. 4½ bac. od 610 zl. 1½ bac. (podobně jako u předchozího rejstříku).
- n: 2
  text: Tisk uvádí 6 dní a vzápětí „7 tag“; částka 9 zl. 9 bac. odpovídá 6 dnům (6 × 4 × 6 bacenů).
- n: 3
  text: V tisku chybí sazba („zu batzen“); 7 dní × 6 koní × 6 bacenů dává 16 zl. 12 bac. Ani součty strany (62 zl., 64 zl. 9 bac.) se s položkami přesně nekryjí.
