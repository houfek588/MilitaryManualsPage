bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    oder Dörffern / wo sie ligen werden / einiger gewalt noch vberlast widerfare.
  cs: ani ve vsích, kde budou ležet, nebylo činěno žádné násilí ani útisk.
- typ: odstavec
  de: |-
    Also sollen die Reuter im Regiment ziehen / dieweil sie bezalt vnd in der Hauptbesoldung seind / biß in das Leger / da sollen sie dann dem Feldobersten vberlieffert vnd zugestelt werden.
  cs: |-
    Takto mají jezdci {Reuter} táhnout v kázni,[^1] protože jsou už placeni a v plném žoldu, až do ležení {Leger}; tam mají být předáni a odevzdáni nejvyššímu polnímu hejtmanovi {Feldobersten}.
- typ: odstavec
  de: |-
    Vnd so dann alle hauffen zu Roß vnd fůß in das Feldleger zusamen komen / so soll der Kriegßherr / oder in seinem abwesen sein Feldoberster / alle Obersten vnnd Ritmeister / von allen Nationen bei einander fordern / die zu rath nidersetzen / vnd anzeigen sie sehen das jhr Herr ein schweren Krieg vorhabe vnd füren můß / vnd von allen Nationen volck habe der Krieg sich auch in die harr oder lenge ziehen möchte / derhalben so wölle ein Ordnung fürgenomen / darmit solches Kriegßuolck in friden vnnd einigkeit / durch ein gleiche Justitien / gůte Pollicei vnd Kriegßordnung möge erhalten werden / Darumb sei sein begeren / sie wöllen in dem thůn wie die Kriegßuerstendigen / vnd auff der vertrawen / so er zu jn habe / nach gůtem Regiment in allem jhre gůte bedencken vnd rath mittheilen / solche regirung in ein ordentlich beschreibung stellen / darmit sie dem Herrn in dem / vnd für dem Kriegßuolck / desto bessere regirung helffen halten mögen / darmit alle sachen desto gehorsamer vnd statlicher möchten vorgenomen vnnd gehandelt werden / vnd zu gůtem glücklichen sig vnd ehrn geraten / Darauff so soll der Kriegßherr Artickel gestelt haben / was er gern beratschlagt vnd geordnet hette / dieselbige jnen vbergeben / vnd an sie begeren / die zu vbersehen / nach aller notturfft erwegen / was sie dann darinen fehl oder mangel haben werden / oder zuuerbessern wissen / das sie dasselbig thůn wöllen / jme dem Kriegßherrn als dann wider zustellen / so wölle er dasselbig besichtigen / vnd sich dessen weiter mit jnen vergleichen vnnd beschliessen / auch als dann mit jhnen solchs fürt regiren.
  cs: |-
    A když se pak všechny houfy {hauffen} na koni i pěšky sejdou v polním ležení {Feldleger}, má válečný pán {Kriegßherr}, nebo v jeho nepřítomnosti jeho nejvyšší polní hejtman, svolat všechny plukovníky {Obersten} a rytmistry {Ritmeister} ze všech národů, posadit je k radě a oznámit jim: Sami vidí, že jejich pán má před sebou těžkou válku, kterou musí vést, že má lid ze všech národů a že by se válka mohla i protáhnout. Proto chce zavést řád, aby takový válečný lid {Kriegßuolck} mohl být udržen v míru a svornosti stejnou spravedlností {Justitien}, dobrým veřejným řádem {Pollicei} a válečným řádem. Žádá je tedy, aby v tom jednali jako znalci války a s důvěrou,[^2] kterou k nim chová, mu ve všem sdělili své dobré mínění a radu, jak dobře vládnout, a takovou správu sepsali v řádný spis. Tak mu pomohou udržet v této věci i před válečným lidem tím lepší vládu, aby se všechny záležitosti mohly podnikat a vyřizovat tím poslušněji a důstojněji a vedly k dobrému, šťastnému vítězství a ke cti. Válečný pán má mít k tomu sepsané články o tom, co by rád dal projednat a nařídit; má jim je odevzdat a požádat je, aby je prohlédli a podle veškeré potřeby zvážili. Shledají-li v nich nějakou chybu či nedostatek nebo budou-li vědět, jak je vylepšit, ať tak učiní a pak mu je vrátí; on si je prohlédne, dále se s nimi dohodne a usnese a potom s nimi bude podle toho vládnout.
- typ: odstavec
  de: |-
    So ein Herr solches thůn wirt vnd also mit jnen schliessen / so müssen sie es dann helffen halten vnnd handthaben / als jren eigen rath / vnnd gůt bedencken / Also hat ein Herr sie gefast / darumb so soll er vil gůter Adellicher vnd andere ehrliche Leut darbei nemen / vnd sie also fahen / an solchem thůt ein Herr jnen wol / vnd zeugt ein Herr gůte Leut darmit / vnd macht ein zucht vnd gehorsam.
  cs: |-
    Učiní-li to pán takto a usnese-li se s nimi, budou to pak muset pomáhat zachovávat a prosazovat jako svou vlastní radu a dobré uvážení. Tím si je pán zaváže; proto má přibrat mnoho dobrých šlechticů i jiných čestných lidí a takto si je získat. Pán jim tím prokáže dobro, vychová si dobré lidi a zjedná kázeň a poslušnost.
- typ: odstavec
  de: |-
    Vnd so dann der Kriegßherr sich also mit jnen / der Kriegßregirung vnd Ordnung beschlossen / so soll er sie wider nider setzen / vnd jnen solche regirung zuuerwalten mit beisetzung jhres Raths vnd hilff des Feldmarschalcks / so offt er sie zu jm erfordern werde zugehorsamen vnd bei zustehen / das wölle er jnen wie den Kriegs vnd
  cs: |-
    A když se pak válečný pán takto s nimi usnese na válečné správě a řádu, má je opět posadit a uložit jim, aby tuto správu vykonávali se svou radou a s pomocí polního maršálka {Feldmarschalcks} a aby jej poslouchali a stáli při něm, kdykoli je k sobě povolá. To vše jim chce přikázat jako mužům válečným a
poznamky:
- n: 1
  text: |-
    *Im Regiment ziehen* – táhnout pod řádnou správou a v kázni; *Regiment* zde neznamená pluk, nýbrž vládu a pořádek.
- n: 2
  text: |-
    V tisku stojí *auff der vertrawen* (rodová odchylka za *auff das vertrawen*).
