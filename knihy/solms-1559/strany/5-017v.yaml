  popis: |-
    Celostránkový dřevořez natočený o 90° na šířku, datovaný „.1559.“ na pravém obvodovém valu a signovaný „.BF.“ v půdorysu brány vlevo uprostřed: polokruhový zemní srub či opevněný tábor obehnaný vnějším vodním příkopem a chráněný na zadní rovné straně mohutným příkopem se dvěma zalomenými křídly. Uprostřed levé rovné strany vede krytá lomená vstupní chodba s můstkem přes příkop do vnitřního prostranství se stany vojáků; na půlkruhovém valu stojí pět děl a zvenčí zleva vlevo táhnou oddíly děl a vojáků podél zákopu.
