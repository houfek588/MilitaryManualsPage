    Celostránkový dřevořez otočený o 90° (letopočet „.1559.“ na valu, monogram „BF“ u vstupu) k [[5-018r|prvnímu srubu]]: polokruhový srub ze dvou soustředných valů s vodním příkopem mezi nimi i vně. Rovnou zadní stranou přiléhá k dlouhé přímé šanci, která pokračuje na obě strany (na obrázku vlevo). Ze šance vede dovnitř lomený krytý vchod s dřevěným můstkem; na vnitřním valu stojí ve střílnách děla, uvnitř jsou stany a vojáci, podél šance venku táhne dělo s potahem a pěšáci.
