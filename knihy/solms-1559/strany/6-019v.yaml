poznamky:
- n: 1
  text: |-
    Albrecht II. Alkibiades, markrabě braniborsko-kulmbašský (1522–1557), sloužil v roce 1544 Karlu V. ve válce proti Francii. Přehlídkovým komisařem byl Christoph von Schaumburg; Landau in der Pfalz leží západně od Špýru. Jezdecký měsíc služby začal 5. června 1544.
- n: 2
  text: |-
    Tisk sází rejstřík ve dvou sloupcích; v edici je přepsán souvisle (nejprve levý, pak pravý sloupec), úhrny spojené v tisku svorkou se slovem *Summa* jsou rozepsány po řádcích. Zlomky jsou v tisku sázeny jako ½. *Drosser* (*Trosser*) jsou koně trénu se svými pacholky – jezdci je počítali vedle zbrojných koní, žold za ně byl nižší (viz [[6-022r|s. 6-022r]]). Jména osob jsou ponechána v podobě tisku; kde je známa dnešní podoba, uvádí ji poznámka (Hennenberg = Henneberg, Würtzburg/Wirtzberg = Wirsberg, Egloffstein, Leuchtenberg). Hrabata Christoph (1510–1548) a Poppo XII. (1513–1574) z Hennebergu pocházela z linie Henneberg-Schleusingen.
- n: 3
  text: |-
    Součet položek skupiny (Leuchtenberg ½, Hennenberg 2, Egloffstein 0) dává 2½ vozu; tisk má 3½. Celkový úhrn 27 vozů na [[6-020v|s. 6-020v]] však počítá s 3½, takže chyba bude spíše ve vynechané položce (snad vůz Egloffsteina).
