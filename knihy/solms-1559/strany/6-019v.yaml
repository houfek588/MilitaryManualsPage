bloky:
- typ: nadpis
  uroven: 2
  de: |-
    Muster Register solcher Reutter vnd Reisigen / so der Durchleuchtig / Hochgeborn Fürst vnnd Herr / Herr Albrecht Marggraue zu Brandenburg / etc. Keiserlicher Maiestat Oberster / in jrer Maies. dienst fürt / Vnd durch den Edlen / Vesten / Herrn Christoffeln von Schawenburg / etc. Als verordneten Commissarien bei Landaw gemustert / deren Reutter Monat Donstag den 5 Junij / Anno / etc. 44 angefangen hat.
  cs: |-
    Přehlídkový rejstřík {Muster Register} jezdců a jízdy {Reisigen}, které vede osvícený, vysoce urozený kníže a pán, pan Albrecht, markrabě braniborský atd., plukovník {Oberster} Císařského Veličenstva {Keiserlicher Maiestat}, ve službě Jeho Veličenstva, a které u Landavy přehlédl {gemustert} urozený a statečný pan Christoffel von Schawenburg atd. jako ustanovený komisař {Commissarien}; jezdecký měsíc služby jim začal ve čtvrtek 5. června léta [15]44.[^1]
- typ: odstavec
  de: |-
    Erstlich die Reutter so auß seiner Fürst. Gna. Stall reiten / sampt derselben Einrosser / Einspennigen vnd Knaben.
  cs: |-
    Nejprve jezdci, kteří jezdí ze stáje Jeho knížecí Milosti {Fürst. Gna.}, spolu s jejími jezdci o jednom koni {Einrosser}, jednokoními jezdci {Einspennigen} a pacholky {Knaben}.[^2]
