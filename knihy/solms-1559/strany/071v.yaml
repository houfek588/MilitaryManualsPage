    Celostránkový dřevořez kvartýrmistra pěchoty v obloukovém rámu s rozvilinami v cviklech (signováno dole vlevo na kameni monogramem HD – Hans Döring): vousatý velitel v půlzbroji s plechovými šosy a v přilbě s bohatým péřovým chocholem stojí v říční krajině s dřevěným mostem, městečkem, mlýnem a hradem na kopci (na obloze hejno ptáků); pravou rukou drží svisle opřenou halapartnu, levou se opírá o jílec kordu u pasu.
