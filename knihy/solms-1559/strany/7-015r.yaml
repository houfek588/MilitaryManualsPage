bloky:
- typ: odstavec
  de: |-
    Item zwischen den zweien gewaltigen Hauffen soll gefürt werden das Brechgeschütz / sampt aller derselben Monition vnd zůgehörung / nemlich zwölff Cartaunen der eine biß in fünffvndvierdtzig pfundt scheußt / zwölff halb Cartaunen die vierundzwentzig pfundt / vier Notschlangen die sechßzehen oder achtzehen pfundt / vnd acht halb Schlangen die sechs pfundt / schiessen.
  cs: |-
    Dále: mezi oběma hlavními houfy {gewaltigen Hauffen} se mají vézt průlomová děla {Brechgeschütz} se vší jejich municí {Monition} a příslušenstvím, totiž dvanáct kartoun {Cartaunen}, z nichž každá střílí až čtyřicet pět liber {pfundt}, dvanáct polovičních kartoun {halb Cartaunen}, které střílejí dvacet čtyři libry, čtyři těžké kulveriny {Notschlangen}, které střílejí šestnáct nebo osmnáct liber, a osm polovičních kulverin {halb Schlangen}, které střílejí šest liber.
- typ: odstavec
  de: |-
    Auff solches Geschütz vnd deßselbigen zůgehörungen / sollen alle andere Wagen nach verordnen / beuelch vnnd versehung des Obersten auch auß gefürt werden.
  cs: |-
    Za těmito děly {Geschütz} a jejich příslušenstvím se mají podle nařízení, rozkazu a opatření plukovníka {Obersten} vypravit také všechny ostatní vozy.
- typ: odstavec
  de: |-
    Nota / sonderlich so schwere die Kugeln wiegen / also schwere soll mann Puluer zu gleichem gewicht mit füren.
  cs: |-
    Poznámka: obzvlášť se má s sebou vézt prach {Puluer} ve stejné váze, jakou mají koule {Kugeln}.
- typ: odstavec
  de: |-
    Damit mann sich aber nit hab zuuerwondern / dieweil der Kugel schwere nach nicht souil puluers zum schiessen genommen vnd geladen wirt / vnd doch dasselbig im vorrat souil die Kugeln wiegen / mit gefürt soll werden / geschicht der vrsachen.
  cs: |-
    Aby se však nikdo nedivil, proč se do zásoby má vézt tolik prachu, kolik váží koule, když se ho ke střelbě nebere a nenabíjí tolik, kolik koule váží, děje se to z tohoto důvodu.
- typ: odstavec
  de: |-
    Daß zu zeiten das Puluer durch das Feur schaden nimpt / auch zum theil durch vnfleiß der Büchsenmeister / vnd in andere weg verschüt vnd verbrennt wirdt / soll mann dann den vorrat des puluers nit höher anschlagen / dann mann des der Ordnung nach zur Ladung bedarff / vnd der mangel auß gehorten vrsachen züfiel / wo wolt mann sich alßdan solches abgangs / im fal der notturfft / widerumb erholen.
  cs: |-
    Prach totiž občas utrpí škodu ohněm, zčásti se také nedbalostí puškařů {Büchsenmeister} a jinými způsoby rozsype a spálí. Kdyby se tedy zásoba prachu nepočítala výše, než kolik je ho podle řádu třeba k nabíjení, a ze zmíněných příčin by nastal nedostatek, kde by se pak v případě nouze dal takový úbytek znovu nahradit?
- typ: odstavec
  de: |-
    Mann thůt gemeynem Kriegs anschlag nach / auß dem grossen stücke / so es die notturfft erforderet / vngefehrlich biß inn die dreissig schüß / etc.
  cs: |-
    Podle obecného válečného rozpočtu se z velkého děla {grossen stücke}, vyžaduje-li to potřeba, vypálí přibližně až třicet ran atd.
- typ: odstavec
  de: |-
    Vorzeiten bei den Alten hat mann sich hart auff die Wagenburg bei dem Kriegßuolck zu haben geflissen / vnd darzů besondere leut gehabt / als einn General Obersten / der des einn verstandt mit sampt darzu auch der gleichen Personen hatt / welche jm die vff sein Ordnen zufüren vnnd zu regiren gewüßt haben.
  cs: |-
    Za starých časů si předkové velmi zakládali na tom, aby měli u válečného lidu {Kriegßuolck} vozovou hradbu {Wagenburg}, a měli k tomu zvláštní lidi, například generálního plukovníka {General Obersten}, který tomu rozuměl, a k tomu i další takové osoby, které ji uměly na jeho rozkaz vést a řídit.
- typ: odstavec
  de: |-
    Aber da hat man die Leger auch darnach zum vortheil zuschlagen gewüßt / damit mann die Wagenburgk darnach hat anfüren vnnd schliessen künden / das hat fürware starcke Leger geben / vnd hat viel Wacht gespart.
  cs: |-
    Tehdy se však také ležení {Leger} umělo výhodně rozbíjet tak, aby se k nim vozová hradba mohla přivézt a uzavřít. To dávalo opravdu silná ležení a ušetřilo mnoho stráží {Wacht}.
- typ: odstavec
  de: |-
    Deßgleichen so hat man die auch im ziechen neben den zug geordnet / das sie also in gůter ordnung neben dem Kriegßuolck hergangen seind / dieselbigen zu einer seiten für einfal verdeckt haben / daß der Feindt nicht zu allen seiten künde einfallen / das Kriegßuolck zu vbereilen / vnnd durch vil anrennen oder angreiffen / von allen seiten jrr machen / vnd in ein vnordnung oder drennung bringen möchte.
  cs: |-
    Stejně tak se vozová hradba na pochodu řadila vedle tažného šiku, takže jela v dobrém pořádku vedle válečného lidu a kryla ho z jedné strany proti přepadu. Nepřítel tak nemohl vpadnout ze všech stran, válečný lid zaskočit a častým najížděním či útoky ho ze všech stran zmást a uvést do nepořádku nebo roztržení.
