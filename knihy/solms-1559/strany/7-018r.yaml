stav: prelozeno
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Zum zehenden / daß die Leger geschlagen werden / daß geräume Gassen dardurch gehn / damit wann ein lermen wirt / daß mann bald zusamen / vnd auß den legern kommen möcht / deßgleichen ists auch gůt wann ein leger brennet.
  cs: |-
    Za desáté: aby se ležení {Leger} rozbíjela tak, aby jimi procházely prostorné uličky {Gassen}; když nastane poplach {lermen}, může se tak lid rychle shromáždit a dostat se z ležení ven. Totéž je dobré i tehdy, když ležení hoří.
- typ: odstavec
  de: |-
    Zum eilfften daß die vbrige Artolorei oder Büchsen / so nit in den Schantzen oder auff den Lermenplätzen stehn würden / daß dieselbige bei dem Leger jren eigen freien standt mit sampt zůgehöriger Monition / vnd alle Rüstung darzů haben möchten / vnd die sollen vergraben vnd verwacht werden.
  cs: |-
    Za jedenácté: aby ostatní dělostřelectvo {Artolorei} neboli děla {Büchsen}, která nebudou stát v šancích {Schantzen} ani na poplachových místech {Lermenplätzen}, měla u ležení své vlastní volné stanoviště spolu s příslušnou municí {Monition} a veškerou výzbrojí, která k nim patří; tato stanoviště se mají obehnat příkopem a hlídat.
- typ: odstavec
  de: |-
    Zum zwölfften so ein Leger an einem ort etwan sorglichen oder vnuerwart lege / so soll mann das so vil möglich vergraben / vnd mit der Wagenburg vorziehen vnd verwaren.
  cs: |-
    Za dvanácté: leželo-li by ležení na nějakém nebezpečném nebo nechráněném místě, má se pokud možno obehnat příkopem, předsunout před ně vozová hradba {Wagenburg} a tak je zabezpečit.
- typ: odstavec
  de: |-
    Weiter hat sich im veldt auch ein handlung zugetragen / daß vnser Volck auff der Füterung gewesen / vnd dem Herrn von Graueln / von den Frantzösischen etliche Tragesel genommen worden / vnd vnser volck jagten den Feinden nach / vnd namen jnen solche Tragesel widerumb / vnd wolten sie weren jr / dieweil sie die Esel den Frantzösischen abgeiagt vnd widerumb genommen hatten / dann sie weren in der Feinde hände gewesen.
  cs: |-
    Dále se v poli přihodila také tato věc: naši lidé byli na pícování {Füterung} a Francouzi vzali pánovi z Graueln[^1] několik soumarských oslů {Tragesel}. Naši lidé pronásledovali nepřátele a osly jim zase vzali. Pak tvrdili, že osli patří jim, protože je Francouzům vyhnali a znovu získali – vždyť už byli v rukou nepřítele.
- typ: odstavec
  de: |-
    Solches ist zuerkennen gestalt / vnd darauff erkant / worden / Daß die so darbei gewesen weren / schuldig sind bei jren ehren / jre Mitgesellen helffen zuerretten / es were an personen / gütern / Thierern oder anders mehr / dann es were für keiner Feinde gůt zůrechnen / Vnd so were es noch in frischer handlung gewesen / vnd die Feind hetten sie noch in jrer sicherer verwarung nit gehabt / sonder sie weren inn frischer flücht gewesen / Wann aber die Feinde die Tragesel in jhre bewarsam bracht / vnd vierundzwentzig stundt darinn gehabt hetten / so were es für Feinde gůt zuerkennen / Das ward also mit recht das mal erkant / daß sie dem Herrn von Graueln seine Esel widergeben musten.
  cs: |-
    Věc byla předložena k rozhodnutí a byl vynesen nález, že ti, kdo byli u toho, jsou na svou čest povinni pomáhat svým druhům {Mitgesellen} zachránit, co jim patří, ať jde o osoby, majetek, zvířata nebo cokoli jiného; nelze to totiž počítat za nepřátelský statek. Bylo to ještě v čerstvé akci {frischer handlung}, nepřátelé osly ještě neměli v bezpečném opatrování, ale byli na čerstvém útěku. Kdyby však nepřátelé osly dopravili do svého opatrování a měli je tam dvacet čtyři hodin, pak by se to muselo uznat za nepřátelský statek. Tak bylo tehdy právem nalezeno, že pánovi z Graueln musejí jeho osly vrátit.[^2]
- typ: odstavec
  de: |-
    Solche Rechtliche erkantunß stück oder Artickel / thůn ich also mit in vnser Teutsche Kriegßregierung vnd Ordnung setzen / darmit zu sehen vnd zufinden ist / daß die Teutschen von alters her gůt Kriegßordnung / Regierung vnd Justitien gehalten haben.
  cs: |-
    Takové právní nálezy či artikuly {Artickel} tedy zařazuji také do naší německé válečné správy {Kriegßregierung} a řádu, aby bylo vidět a poznat, že Němci odedávna zachovávali dobrý válečný řád {Kriegßordnung}, správu a justici {Justitien}.
poznamky:
- n: 1
  text: |-
    Tisk „Herr von Graueln“; snad pán z Gravelines (Grevelingen) ve Flandrech, nebo jiný nizozemský šlechtic z tažení 1554 – identifikace nejistá.
- n: 2
  text: |-
    Nález odpovídá obecnému válečnému obyčeji o kořisti: věc ukořistěná nepřítelem se stávala jeho „dobrou kořistí“ teprve tehdy, když ji dopravil do bezpečí a měl ji tam 24 hodin; do té doby ji vlastníkovi znovu dobytá patřila zpět.
