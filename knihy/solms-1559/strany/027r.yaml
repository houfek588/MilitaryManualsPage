bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    ein frieden nach Kriegsbrauch / als lang derselbig Krieg wehrt / geloben / er treibt auch auß die andern jre Quartier oder Losamenter eingenommen hetten / er schafft auch im namen des Feldmarschalcks / den jenigen / so etwas von jren beuten oder eygen Rossen / wie offt geschicht / genommen oder auffgefangen wehre / wider / deßgleichen an Prouiant vnd Füterung.
  cs: |-
    slíbit mír {frieden} podle válečného obyčeje, dokud ta válka potrvá. Vyhání také ty, kdo zabrali jiným kvartýry {Quartier} nebo ubytování {Losamenter}. Jménem polního maršálka {Feldmarschalcks} také zjednává navrácení těm, jimž bylo – jak se často stává – něco z jejich kořisti nebo z vlastních koní vzato či zachyceno; totéž platí o proviantu {Prouiant} a píci.
- typ: odstavec
  de: |-
    In summa / alles was der Feldmarschalck seinem vnder Marschalck in angeregten oder andern Artickeln beuilcht / zuuerrichten / ist er zu volnziehen schuldig.
  cs: |-
    Zkrátka vše, co polní maršálek svému podmaršálkovi {vnder Marschalck} v uvedených či jiných článcích nařídí vykonat, je podmaršálek povinen splnit.
- typ: odstavec
  de: |-
    Es ist auch kürtzlich darzů kommen / vnd vorzeiten nicht gewesen / daß mann dem Feldmarschalck ein eigen Prouosen / vnd etlich Stecken Knecht helt / welcher die reuter so es verschulden / gefengklich annimpt vnd verwaret / wann aber kein solcher Prouoß vorhanden ist / alßdann versichts der vnder Marschalck.
  cs: |-
    Nedávno se také ujalo, co dříve nebývalo, že se polnímu maršálkovi vydržuje vlastní profous {Prouosen} a několik profousových pacholků {Stecken Knecht}. Profous bere jezdce {reuter}, kteří se proviní, do vazby a střeží je; není-li takový profous k dispozici, obstarává to podmaršálek.
- typ: odstavec
  de: |-
    Wann auch des Volcks wenig ist / mag mann diser beider ämpter wol mangeln / vnd dem Herrn dise Besoldung ersparn / vnd versicht der Feldmarschalck sein geschefft durch seine besolten Personen / alßdann werden die straffmessigen reutter / von des Obersten Feldhauptmans seines Leutenants / oder Feldmarschalcks Trabanten gefengklich angenommen / vnd durch der Knecht Prouosen in verwarung enthalten.
  cs: |-
    Je-li lidu málo, lze se bez obou těchto úřadů dobře obejít a ušetřit pánovi {Herrn} tento žold {Besoldung}. Polní maršálek pak obstarává své záležitosti svými placenými lidmi; jezdce hodné trestu zatýkají drabanti {Trabanten} nejvyššího polního hejtmana {Obersten Feldhauptmans}, jeho poručíka {Leutenants} nebo polního maršálka a ve vazbě je drží profous knechtů {Knecht}.
- typ: odstavec
  de: |-
    Ein jeder Feldmarschalck bedarff guter fürsehung / wanner ein Leger zubesichtigen vnd zuschlahen vorzeucht / daß jm die Trosser buben vnd andere so sich die losamenter einzunemen / an jn hencken / nicht ein flucht machen / wann die Feinde vngefehrlich oder mit fleiß auff jhn stossen / der vrsach soll er keinen Meutzkopff am zug für sich hudeln lassen / sonder dieselbigen / wann wort nicht helffen / hindersich schlahen vnd stechen / daß nit durch ein solliche flucht in ein gantzen Hauffen ein schrecke kommen möcht.
  cs: |-
    Každý polní maršálek musí dobře pamatovat, když táhne napřed prohlédnout a rozbít ležení {Leger}, aby se trénní pacholci {Trosser buben} a jiní, kteří se k němu přidávají, aby si zabrali ubytování, nedali na útěk, kdyby na něj náhodou nebo úmyslně narazili nepřátelé. Proto nemá na pochodu nechat žádného svéhlavého pobudu {Meutzkopff}[^1], aby se před ním tlačil vpřed; takové má, nepomohou-li slova, bitím a bodáním zahnat zpět, aby takový útěk nevnesl do celého šiku {Hauffen} zděšení.
- typ: odstavec
  de: |-
    Der Feldmarschalck soll auch inn gemelten Zügen nicht zu weit von den Hauffen ziehen damit er nicht selbst mit seinem Gesind flüchtig hindersich weichen müsse / er hett dann gewisse kundtschafft / daß die Feinde nicht vorhanden weren / wiewol ein Kriegsman darauff nicht hoch bawen soll / sonder allweg fürsichtige Ordnung halten / Vnd ist vil besser alle hauffen warten ein weil in der Ordnung / biß er daß leger besehe vnd schlahe / dann daß er muß hindersich weichen / oder schanden empfangen / er soll sich auch / wann es von nöten ist / im vorzug stercken lassen.
  cs: |-
    Polní maršálek se také na zmíněných taženích {Zügen} nemá vzdalovat od hlavních houfů příliš daleko, aby nemusel se svou čeledí sám na útěku ustupovat, ledaže by měl spolehlivé zprávy {kundtschafft}, že nepřátelé nejsou nablízku. Ani na to však válečník {Kriegsman} nemá příliš stavět, nýbrž má vždy zachovávat obezřetný pořádek. Je mnohem lepší, když všechny houfy chvíli počkají v šiku, než maršálek ležení prohlédne a rozbije, než aby musel ustoupit nebo utržit hanbu. Je-li to třeba, má si také dát předvoj {vorzug} posílit.
poznamky:
- n: 1
  text: |-
    *für sich hudeln lassen* – nechat (pobudu) bez rozkazu předbíhat vojsko za kořistí nebo noclehem.
