bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    teil in das Erdrich gesenckt/ vnd das halb theil außgeworffen in stat der Schantzkörb/ die mann sonst zum andern Geschütz haben muß/ vnd bedarff keiner lucken dardurch er scheußt/ sonder wirfft auß dem loch vber das geschüt Erdrich herauß/ deßgleichen soll er neben der gruben auch eine haben darinn sein puluer stehet vnnd kugeln ligen/ auch seine Leut die jm bald auß der gruben puluer vnnd Kugeln fürderlich zutragen/ dann wann solche gruben vnd Schantzen recht gemacht werden/ ist nicht gůt zu jnen schiessen/ besonder bei der nacht/ Es sollen aber alle die da werffen/ jhre stück der Mörser zugleich gericht vnd geladen haben/ vnd sollen sich mit dem Zeugmeister/ wann sie alle fertig seind/ eines Kreidenschoß vergleichen/ vnnd wann sie alle gefertigt/ soll der Zeugmeister jnen ein Kreidenschoß thůn/ so bald der geschicht/ sollen sie alle darauff fürderlich anzinden/ damit vil kugeln auff einmal hinein fallen/ vnd sollen dieselbigen als die ersten gemacht sein/ daß sie in der lufft wol brennen/ damit ein Büchsenmeister sehen kan war sie fallen/ vnd sich mit den andern schössen darnach zurichten wisse/ auch daß die inn der Stat an denselbigen Kugeln freudig werden zu leschen vnd zu dempffen/ vermein mit den andern auch der gestalt vmbzugehn/ wann aber die schlagenden Kugeln hernach kommen/ vnd sie also zulauffen/ möchten sie daran jr abfertigung bekommen/ damit sie die andern lassen gehn werden.
  cs: |-
    díl se zapustí do země a druhá polovina vyháže namísto šancovních košů {Schantzkörb}, jež je jinak třeba mít k ostatním dělům {Geschütz}; a nepotřebuje žádnou střílnu, kterou by střílel, nýbrž vrhá z jámy přes navršenou hlínu ven. Stejně tak má mít vedle své jámy ještě jednu, v níž stojí jeho střelný prach {puluer} a leží koule {kugeln}, a rovněž své lidi, kteří mu z té jámy rychle přinášejí střelný prach i koule; neboť jsou-li takové jámy a šance {Schantzen} udělány správně, nedá se na ně dobře střílet, zvláště v noci. Všichni pak, kdo vrhají, mají mít své moždíře {Mörser} zároveň zaměřené a nabité a mají se se zbrojmistrem {Zeugmeister} smluvit na výstřelu polního znamení {Kreidenschoß}, až budou všichni hotovi; a jakmile budou všichni připraveni, má jim zbrojmistr dát výstřel polního znamení. Jakmile k němu dojde, mají všichni hned zapálit, aby dovnitř dopadlo mnoho koulí najednou; a ty první mají být udělány tak, aby ve vzduchu jasně hořely, aby puškař {Büchsenmeister} viděl, kam padají,[^1] a dovedl podle toho zamířit další rány, a také aby lidé ve městě s těmito koulemi směle spěchali je hasit a dusit v domnění, že tak naloží i s ostatními; když však potom přiletí třaskavé koule {schlagenden Kugeln} a oni k nim takto přiběhnou, dostanou od nich své vyřízení, takže ty další už nechají být.
- typ: odstavec
  de: |-
    Darumb wolt ich rathen daß mann sich schickt auff vil Möser/ damit es auff einmal in der eil geschehen möcht/ dann das Feurwerffen wil nicht langsam oder mit der zeit gethan sein/ sonder in der eil mit dem hauffen vnd vnuersehenlich/ Wie dise Kugeln in die Mörser von aller obgeschribner gattung gemacht werden/ wirdt hernach eigentlich beschriben vnd figurs weiß auffgerissen/ deßgleichen wie die Schantzen darzů gemacht sein sollen/ vnnd wann mann solliche machen will/ soll mann sie bei der nacht/ vnnd nicht nahe bei einander/ machen/ sonder souil möglich ringsrumb gemacht/ vnnd wann sie in einer nacht nicht möchten fertig werden/ soll mann die Mörser nit hinein füren/ damit sie den tag darinn stehn müsten/ darumb ist besser gewart biß die Schantzen gar gefertigt/ dann die Mörser zugericht/ geladen vnd bei der nacht in eil in die Schantzen gefürt mit jrer zugeordneten Rüstung vnd notturfft/ das auff den Kreidenschoß möcht fürderlich geschossen vnd geworffen werden/ zu solchem werffen vnd Rüstung wöllen geschickte Meister sein/ die zuuor jre Mörser von aller gattung der Kugeln geworffen/ vnd das Instrument auff ein jede gericht haben/ damit sie beileufftig die weitte der Schantzen von dem Flecken vberschlagen mögen/ welche Mörser nit auff den
  cs: |-
    Proto bych radil zařídit se na mnoho moždířů {Möser},[^2] aby se to mohlo stát naráz a ve spěchu; neboť vrhání ohňů {Feurwerffen} se nemá dít pomalu či pozvolna, nýbrž kvapně, hromadně a nenadále. Jak se tyto koule do moždířů všech výše popsaných druhů vyrábějí, bude níže zevrubně popsáno a v nákresech zobrazeno, stejně tak jak mají být k tomu zřízeny šance; a chce-li je někdo dělat, má je dělat v noci a ne blízko sebe, nýbrž pokud možno dokola kolem, a nemohly-li by být hotovy za jedinou noc, nemají se do nich moždíře zavážet, aby tam musely stát přes den. Proto je lépe počkat, až jsou šance zcela dokončeny, a pak moždíře připravit, nabít a v noci ve spěchu zavézt do šancí s příslušnou výzbrojí {Rüstung} a potřebami, aby se na výstřel polního znamení mohlo ihned střílet a vrhat. K takovému vrhání a výstroji je třeba zručných mistrů, kteří už dříve ze svých moždířů vrhali všechny druhy koulí a na každý z nich zaměřili měřický přístroj, aby mohli přibližně odhadnout vzdálenost šancí od městečka; které moždíře se nestřílejí z
poznamky:
- n: 1
  text: |-
    V tisku stojí nářeční či zkrácené *war* ve významu *wohin* („kam“). Podobně níže *vermein* místo *vermeinen* („domnívajíce se“).
- n: 2
  text: V tisku je sazečský překlep *Möser* (vypadlé *-r-*) místo *Mörser*.
