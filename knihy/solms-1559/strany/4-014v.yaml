id: 4-014v
list: 14 (4. kniha)
strana: verso
sken: 416
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Vnd fürt oben auff den Achsen fornen so weit die Achsen geröndt ist/ sol mañ auch ein Blech oder schien schlagen/ vñ forn auch gelocht dem vndern Eisen gleich/ da die Achse in der mit geuierdter ist da sie in der Büchsen gefeß stelt/ vñ sollen forn da die Rönde angeht an beiden Seiten der vierung zwen geuierdte starcke Eisen Ring sein/ die solches vnder Legeisen/ die Achsen oder schien mit einander fassen vnd zusamen treiben vnnd binden/ also leit die Achsen fein gleich auff dem vndern Legeisen/ vnd für demselbigen Eisen kan die Achsen kein not leiden/ dann sie leit auff dem Eisen stet vnnd dregt gleich/ vnd bleibt die Achse an dem Holtz fein gantz.
  cs: |-
    A dále nahoře na koncích nápravy vpředu, kam až sahá její zaoblení, má se rovněž přibít plech či šína a vpředu stejně provrtat pro zákolník jako spodní železo; tam pak, kde jest náprava uprostřed hranatá a spočívá v lafetě {gefeß} děla, mají být vpředu v místě, kde začíná zaoblení, po obou stranách čtyřhranu dva silné hranaté železné kruhy, které toto spodní podkladové železo, nápravu i horní šínu spolu obejmou, stáhnou a svážou. Tak leží náprava pěkně rovně na spodním podkladovém železe a díky témuž železu nemůže náprava nijak trpět, neboť spočívá stále na železe, nese rovnoměrně a dřevo nápravy zůstává zcela neporušené.
- typ: odstavec
  de: |-
    Wann mann aber geuierdt Legeisen macht wie der gebrauch ist/ vnd süekt die in das Holtz der Achsen/ so verhawet mann die Achs daß sie schwach wirt/ vnd ist das legeisen geuierdt vnnd schmal das helt auch nichts/ so hilfft das holtz dem eisen nichts/ vnnd das eisen dem holtz nichts/ dann es mit dem legeysen sencken geschwecht wirt/ Darumb halt ich nichts daruon/ da halt ich aber von daß mann die Achs gantz laß/ dann behelt sie jre sterck/ vnnd mach das legeisen so breit wie die Achs/ vnd sie darauff verbinde vñ faß sie zusamen/ wie oben gemelt ist/ vnd zwing sie mit den geuierdten ringen fest bei einander daß kan leiden vnd halten.
  cs: |-
    Když se však dělá hranaté podkladové železo, jak jest obyčejem, a zapouští se do dřeva nápravy[^1], tím se náprava prosekaně zeslabí; a protože jest takové podkladové železo hranaté a úzké, také nic nevydrží a dřevo nepomáhá železu ani železo dřevu, neb se dřevo vysekáním drážky pro podkladové železo zeslabí. Proto o tom nic nedržím; naopak za správné pokládám ponechat nápravu celou – tím si uchová svou pevnost –, udělat podkladové železo stejně široké jako náprava, spojit ji s ním a sevřít dohromady, jak výše povězeno, a pevně vše stáhnout hranatými kruhy k sobě; to pak unese zátěž a vydrží.
poznamky:
- n: 1
  text: |-
    V tisku *sückt* (snad sazečský či nářeční tvar za *senckt* – „zapouští“ – či *fügt* – „vkládá“; v tomtéž odstavci o dva řádky níže již stojí *sencken*). Autentické příslovce *fein* („pěkně, čistě“) v prvním odstavci odpovídá předloze.
