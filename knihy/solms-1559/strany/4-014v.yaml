id: 4-014v
list: 14 (4. kniha)
strana: verso
sken: 416
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Vnd fürt oben auff den Achsen fornen so weit die Achsen geröndt ist/ sol mann auch ein Blech oder schien schlagen/ vnd forn auch gelocht dem vndern Eisen gleich/ da die Achse in der mit geuierdter ist da sie in der Büchsen gefeß stelt/ vnd sollen forn da die Rönde angeht an beiden Seiten der vierung zwen geuierdte starcke Eisen Ring sein/ die solches vnder Legeisen/ die Achsen oder schien mit einander fassen vnd zusamen treiben vnnd binden/ also leit die Achsen fein gleich auff dem vndern Legeisen/ vnd für demselbigen Eisen kan die Achsen kein not leiden/ dann sie leit auff dem Eisen stet vnnd dregt gleich/ vnd bleibt die Achse an dem Holtz fein gantz.
  cs: |-
    Dále se má nahoře na nápravě vpředu, kam až sahá její zaoblení, také přibít plech či šína, vpředu stejně provrtaná jako spodní železo. Tam, kde je náprava uprostřed hranatá a kde spočívá v lafetě {gefeß} děla, mají být vpředu, kde začíná zaoblení, po obou stranách čtyřhranu dva silné hranaté železné kruhy, které toto spodní podkladové železo, nápravu i šínu spolu obejmou, stáhnou a svážou. Tak leží náprava pěkně rovně na spodním podkladovém železe a díky němu nemůže nijak utrpět, neboť na železe pevně leží a nese rovnoměrně; dřevo nápravy tak zůstane pěkně celé.
- typ: odstavec
  de: |-
    Wann mann aber geuierdt Legeisen macht wie der gebrauch ist/ vnd sückt die in das Holtz der Achsen/ so verhawet mann die Achs daß sie schwach wirt/ vnd ist das legeisen geuierdt vnnd schmal das helt auch nichts/ so hilfft das holtz dem eisen nichts/ vnnd das eisen dem holtz nichts/ dann es mit dem legeysen sencken geschwecht wirt/ Darumb halt ich nichts daruon/ da halt ich aber von daß mann die Achs gantz laß/ dann behelt sie jre sterck/ vnnd mach das legeisen so breit wie die Achs/ vnd sie darauff verbinde vnd faß sie zusamen/ wie oben gemelt ist/ vnd zwing sie mit den geuierdten ringen fest bei einander daß kan leiden vnd halten.
  cs: |-
    Když se však podkladové železo dělá hranaté, jak je zvykem, a zapouští se do dřeva nápravy[^1], náprava se vysekáním zeslabí. A je-li podkladové železo hranaté a úzké, také nic nevydrží: dřevo pak nepomáhá železu ani železo dřevu, protože se náprava zapuštěním podkladového železa oslabí. Proto o tom nic nedržím. Za správné však pokládám nechat nápravu celou – tak si zachová svou pevnost –, udělat podkladové železo stejně široké jako náprava, nápravu na ně připevnit a stáhnout dohromady, jak bylo řečeno výše, a hranatými kruhy ji pevně sevřít; to pak unese zátěž a vydrží.
poznamky:
- n: 1
  text: |-
    V tisku *sückt* (ověřeno ve skenu `416`; snad sazečský či nářeční tvar za *senckt* – „zapouští“; o dva řádky níže stojí *sencken*). Příslovce *fein* („pěkně“) v prvním odstavci odpovídá předloze.
