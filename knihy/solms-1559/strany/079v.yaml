  de: |-
    Hauptman vnd Obersten 4. Monat lang die nechsten nach dem tag der Musterung/ welchs vffs fürderlichst so jmmer möglich/ nach dato diß Brieffs beschehen/ vnd alßdan die besoldung angehn/ so bestelt vnd angenommen haben/ Vnnd thůn das wissentlich in krafft diß Brieffs/ mit der bescheidenheit also/ daß wir jetztgedachten vnsern Obersten vber ehgemelt 10. Fendlin Knecht vnd 5000. sold sampt gemeinen Hauptleuten vnd Kriegsknechten in vnserm dienst vnd besoldung die obberürt zeit auffzuhalten/ Sol derselb Conrat von Bammelberg vnser Oberster/ deßgleichen auch andere vnsere Hauptleut/ Fendrich Beuelchaber vnd gemeine Knecht so vnder seim Regiment sein werden/ vnd ob die gedacht zeit auß wer/ wir aber derselben lenger notturfftig sein würden/ auff weiter Bestallung auch dienen/ vnd ein jeder sein besoldung nach inhalt vnd vermög des stants vnd artickels Brieff/ jnen derhalb zugestelt eins jeglichen Monats/ den Manot zu 30. tagen gerechnet/ vnd für ein Monat sold 4. gulden müntz/ zu 60. kreutzern das stück gerechnet/ wol bezalt vnd entricht werden/ Dargegen gemelter Conrat von Bammelberg/ gemeine Hauptleut/ Fendrich vnnd knecht/ so vnder seinem Regiment seind/ vns vnsern gefallen/ willen vnd notturfft nach in allen vnd jeden Kriegs vnd andern sachen handeln/ zu wasser vnd landt gegen aller meniglich/ gar niemant außgenomen/ redtlich/ fleissig vnd getrewlich/ wie fromme/ ehrliche Kriegsleut jrem Herrn zuthůn schuldig seind/ auch jnen gebürt vnd wol zůsteht zu dienen/ sich gůtwillig brauchen lassen/ wen wir jr nit lenger notturfftig vnd jnen vrlaub geben/ wöllen wir jnen ein halben Monat sold für den abzug reichen vnd geben. Gebieten/ beuelhen vnd ordnen daruff/ allen vnd jeglichen Hauptleuten/ Fendrichen/ Beuelchabern vnd gemein kriegsknechten/ so vnder berürts Conrats von Bammelbergs Regiment seind/ daß sie jn als jren Obersten halten/ ehren vnd das sie jm als jrem Obersten/ thůn was sie schuldig sein zuthůn/ nach inhalt vnd vermög des artickels Brieff. Disem allem nach/ sagen wir zů/ vnd versprechen bei vnsern Keys. würden vnd glauben/ daß wir alles so hierinn vnd in gedachtem standt vnd artickels Brieff gemelt wirt/ souil vns das berürt/ steht/ fest vnd vnuerbröchlich halten/ dem also nachkommen vnd geleben/ alles getrewlich vnd on argelist thůn wöllen mit vrkundt dises Brieffs/ mit vnser eigen handt vnderschriben/ vnd vnserm auffgetruckten Insigel besigelt. Geben zu Rom den 6. Aprilis/ Anno/ etc. im 36. vnsers Keyserthumbs in dem 16. vnd vnserer Reych im 21.
  cs: |-
    hejtmanem {Hauptman} a plukovníkem {Obersten} na dobu nejbližších 4 měsíců ode dne přehlídky {Musterung}, jež se má konat co nejrychleji po datu tohoto listu, kdy má také začít běžet žold {besoldung}, tímto ustanovili a přijali. A činíme tak vědomě z moci tohoto listu s tou podmínkou, že nyní zmíněného našeho plukovníka nad dříve řečenými 10 praporci {Fendlin} knechtů {Knecht} a 5000 žoldy spolu s řadovými hejtmany a válečnými knechty {Kriegsknechten} po výše dotčenou dobu v naší službě a žoldu vydržíme. Týž Konrád z Bemelbergu, náš plukovník, a stejně tak i ostatní naši hejtmani, praporečníci {Fendrich}, velitelé {Beuelchaber} a řadoví knechti, kteří budou pod jeho plukem {Regiment}, mají – kdyby zmíněná doba uplynula a my bychom jich dále potřebovali – sloužit i na další služební smlouvu {Bestallung}; a každému z nich má být podle obsahu a znění listu o stavu a artikulního listu {artickels Brieff}[^1], který jim k tomu byl vydán, každý měsíc – počítaje měsíc za 30 dní[^2] a za jeden měsíční žold 4 zlaté {gulden} v mincích po 60 krejcarech za kus – řádně vyplacen a uhrazen. Naproti tomu zmíněný Konrád z Bemelbergu, řadoví hejtmani, praporečníci a knechti, kteří jsou pod jeho plukem, mají ve všech válečných i jiných věcech jednat podle naší libosti, vůle a potřeby, na vodě i na souši proti komukoli, nikoho nevyjímaje, poctivě, pilně a věrně sloužit a ochotně se nechat upotřebit, jak jsou řádní a čestní válečníci {Kriegsleut} svému pánu povinni činit a jak se na ně sluší a patří; a kdybychom jich už dále nepotřebovali a dali jim propuštění, chceme jim na odchodné {abzug} poskytnout a vyplatit půl měsíčního žoldu. Přikazujeme, poroučíme a nařizujeme proto všem a každému hejtmanovi, praporečníkovi, veliteli i řadovým válečným knechtům, kteří jsou pod plukem dotčeného Konráda z Bemelbergu, aby jej měli a ctili jako svého plukovníka a aby mu jako svému plukovníkovi činili to, co jsou povinni činit podle obsahu a znění artikulního listu. Podle toho všeho přislibujeme a zavazujeme se při naší císařské důstojnosti a víře, že vše, co je zde i ve zmíněném listu o stavu a artikulním listu uvedeno, pokud se nás to týká, budeme pevně, stále a neporušitelně zachovávat, podle toho jednat a žít, vše věrně a bez lsti. Na svědomí toho je tento list podepsán naší vlastní rukou a zpečetěn naší přitištěnou pečetí. Dáno v Římě dne 6. dubna roku atd. 36[^3], našeho císařství v 16. a našich království v 21.
- typ: odstavec
  de: Carolus.
  cs: Karel.
poznamky:
- n: 1
  text: |-
    „Stants vnd artickels Brieff“ – list o vydržování/stavu (seznam úřadů a žoldů pluku) a artikulní list.
- n: 2
  text: |-
    V tisku přesmyčka „Manot“ za „Monat“.
- n: 3
  text: |-
    Tj. 6. dubna 1536, kdy Karel V. po vítězném tažení do Tunisu navštívil Řím; 16. rok od korunovace římským králem v Cáchách (1520) a 21. rok španělské vlády (od 1516).
