  popis: |-
    Celostránkový dřevořez profouse se dvěma popravčími pomocníky (katem a žalářníkem) v obloukovém rámu se dvěma sovami v cviklech (signováno dole uprostřed monogramem HD – Hans Döring): vpravo stojí vousatý profous v širokém baretu s pštrosími pery, kožešinou podšitém plášti, kordem u boku a odznakem s vyobrazením šibenice na hrudi; vlevo před ním stojí dva muži s provazy v rukou – mladší v baretu s dlouhým perem a starší vousatý muž s rancem přes rameno.
