  popis: |-
    Celostránkový dřevořez profouse se dvěma pomocníky (patrně katem a žalářníkem, případně profousovými pacholky) v obloukovém rámu se dvěma sovami držícími myši v cviklech (signováno dole uprostřed monogramem HD – Hans Döring): vpravo stojí profous s knírem a kadeřavými vlasy v širokém baretu s pštrosími pery a v širokém plášti s nabíranými rukávy, s malým odznakem na hrudi a rukou na jílci kordu; vlevo stojí dva muži se svazky provazů v rukou – mladší bezvousý v baretu s dlouhým perem a starší vousatý muž s rancem na zádech a kordem u boku.
