bloky:
- typ: nadpis
  uroven: 3
  de: Wie mann gut Feur pfeil soll anrichten vnd machen.
  cs: Jak se mají chystat a zhotovovat dobré zápalné šípy {Feur pfeil}.
- typ: odstavec
  de: |-
    NIm ein gůten filtz vnd mach ein säckel darauß / vnd nim den 8. lot Salpeter / da jetzund von gelert ist / vnd 2. lot schwefels / vnd 1. lot koln vnd 2. Quintat vrnes glaß / vnd stoß jeglichs besonder wol vnd misch das vnter einander mit gebrantem wein / vnd thů das also naß in den filtz sack / vnd preß das ein tag oder zwen das es trucken werd / vnd thů es denn herauß / vnd mach dir von barchent seckel in aller maß vnd gestalt / vnd in größ als ein füllige spindel einer Beuerin mit garn / nehe sie zu / vnd steck den pfeil dardurch gleich als die spindel in dem garn steckt / vnd der pfeil soll so groß sein als ein federkil / vnnd viereckigt / vorn spitzig / vnnd hinden ein düllen haben / vnd vmb windt den pfeil mit hanff oder mit flechsenem werch / vnd walg es in zuerlaßnem schwefel zu zweien malen oder mehr / das es ein haut gewinnet eins halms dick / vnd wenn du wilt schiessen so schneit es oben bei den düllen ab / auff daß das feur zu dem Puluer komen mag / vnd wenn du jn anzindest / vnd schessest jn an als ein andern pfeil / vnd mach jm ein gůts groß gefider / auch so magstu den pfeil / werffen in ein wasser oder in einen mist / vnd es heist ein wildes feur vnd ist abenteurlich vnd frembd.
  cs: |-
    Vezmi dobrou plsť a ušij z ní pytlík; pak vezmi 8 lotů {lot} ledku {Salpeter}, o němž již bylo vyloženo, 2 loty síry {schwefels}, 1 lot dřevěného uhlí {koln} a 2 kvintlíky {Quintat} čistého skla,[^1] všechno zvlášť dobře utluč a smíchej dohromady s páleným vínem. Dej to takto mokré do plstěného pytlíku a lisuj to den nebo dva, až to vyschne; pak to vyjmi a zhotov si z barchetu pytlíčky zcela takové míry, podoby a velikosti jako plné vřeteno selky s přízí. Zašij je a prostrč jimi šíp, právě tak jako vězí vřeteno v přízi. Šíp má být silný jako brk, čtyřhranný, vpředu špičatý a vzadu má mít tulejku.[^2] Oviň šíp konopím nebo lněnou koudelí a vyválej jej v rozpuštěné síře dvakrát či vícekrát, až získá kůrku silnou jako stéblo. A když chceš střílet, odřízni to nahoře u tulejky, aby se oheň mohl dostat k prachu {Puluer}; pak jej zapal a vystřel stejně jako jiný šíp, přičemž mu udělej dobré veliké opeření. Takový šíp můžeš také hodit do vody nebo na hnůj; nazývá se to divoký oheň {wildes feur} a je to podivuhodné a nevšední.
- typ: nadpis
  uroven: 3
  de: Wiltu machen Feurpfeil die so wol inn dem Wasser als darauß brennen / ist ein wilds Feur
  cs: Chceš-li zhotovit zápalné šípy, které hoří jak ve vodě, tak na vzduchu – je to divoký oheň.
- typ: odstavec
  de: |-
    SO nim 8. lot Salpeter / 3. lot Schwefel / vnnd 1. lot Koln / nim dann den Barchent mach darauß Secklin in der größ wie ein Daum / vnd einer fordern span lang / nim dann das Puluer thůs in das secklin wol vber einander mit einem spitzigen holtz / vnnd nim dann ein eysen das einer fordern span lang ist / vnd so groß wie ein Schreibfeder / viereckigt / vorn spitzig / vnnd hab hinden ein dullen / stoß durch das secklin gar gleich / vnd bindt es dann oben zu dem eysen / vnd laß es zum ersten außschefften / wie einen andern Pfeil / vnd wenn du es hindurch stoßt / soll es eines fingers lang fürgehn / so zu laß denn den Schwefel in einem Töpffen / vnd weltz den Pfeil darinn vmb so ist es breit / wilt du denn schiessen / so schneidt vorn einen Krinnen darein auff die spitz / vnd zindt jn an / vnd laß wol erbrennen / vnd scheuß.
  cs: |-
    Vezmi tedy 8 lotů ledku, 3 loty síry a 1 lot dřevěného uhlí; pak vezmi barchet a ušij z něj pytlíčky veliké jako palec a dlouhé na přední píď.[^3] Pak vezmi ten prach a pěchuj jej špičatým dřívkem pevně do pytlíčku; potom vezmi železo dlouhé na přední píď a silné jako psací brk, čtyřhranné, vpředu špičaté a vzadu opatřené tulejkou, prostrč je přímo skrz pytlíček a upevni jej nahoře k železu. Nejprve však nech šíp nasadit na dřík jako jiný šíp; a když jej protáhneš skrz, má železo vpředu vyčnívat na délku jednoho prstu. Poté rozpusť síru v hrnku a vyválej v ní šíp, čímž je připraven.[^4] Chceš-li pak střílet, vyřízni vepředu u hrotu zářez, zapal jej, nech dobře rozhořet a vystřel.
poznamky:
- n: 1
  text: |-
    Tisk uvádí zkomolený tvar *vrnes glaß* – pravděpodobně písařská či tiskařská obměna za *reines glaß* („čisté sklo“), *grünes glaß* („zelené sklo“) nebo *firnes glaß* („staré sklo“); jemně tlučené sklo se přidávalo do zápalných směsí.
- n: 2
  text: |-
    *Dülle* (*Tülle*) – dutá tulejka na konci železného hrotu šípu, do níž se zasazuje dřevěný dřík.
- n: 3
  text: |-
    Přední píď (*vordere Spanne*) – délková míra odpovídající rozpětí mezi palcem a ukazovákem (asi 15–18 cm).
- n: 4
  text: |-
    V tisku stojí zjevný sazečský překlep *breit* („široké“) místo *bereit* („připraveno“).
