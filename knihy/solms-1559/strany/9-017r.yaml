sken: 653
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    zwei orten / Jch hab auch wol gesehen daß mann mit grossem geschrei an einem andern ort da mann nicht willens zu stürmen / angelauffen / damit sie in der Statt desto mehr erschrecken / vnd jhr Volck inn vil ort trennen vnd zertheilen / darumb solt jr ewer Volck darnach in ein Ordnung stellen / nemlich an zwei odder drei ort / vnnd ein jeglichen Hauffen mit der Ordnung / wie hernach volgt.
  cs: |-
    dvou místech. Viděl jsem také, že se s velkým křikem útočilo na jiném místě, kde se útočit nezamýšlelo, aby se ti ve městě tím víc polekali a museli svůj lid rozdělit a roztříštit na mnoho míst. Proto máte svůj lid podle toho rozestavit do šiku {Ordnung}, totiž na dvou nebo třech místech, a každý houf {Hauffen} v takovém pořádku, jak následuje.
- typ: odstavec
  de: |-
    Erstlich sollen Leut verordnet sein Leidern zutragen / nachuolgends Knecht die wol angethan vnd gerüst seien / gleich auff sie ziehen / vnd inn den Schantzen allweg gůt Schützen ligen die sie vor den in der Stat entschütten / vnd wann sie anlauffen / soll das gantz Geschütz abgehn / damit die Feind nicht rhů haben / die so inn gräben steigen zu rück schiessen oder schlagen / vnd nicht auffhören zu schiessen wann schon die Poluerck vnd Maurn einfallen / biß daß sie mit Schwertstreichen einander erreichen mögen / auch sollen stets die Hackenschützen auff dem Graben stehen / vnnd zu jhnen hinein schiessen / daß keiner den Kopff auß der Statt hinauß stecken künde oder dörffe.
  cs: |-
    Nejprve mají být určeni lidé, kteří ponesou žebříky {Leidern}; za nimi mají hned táhnout knechti {Knecht}, dobře oblečení a vyzbrojení. V šancích {Schantzen} mají vždy ležet dobří střelci {Schützen}, kteří je budou krýt před těmi ve městě. Když vyrazí do útoku, má vypálit všechno dělostřelectvo {Geschütz}, aby nepřítel neměl klid odrážet střelbou nebo zbraní ty, kdo slézají do příkopů {gräben}. Střílet se nemá přestat, ani když se bolverky {Poluerck} a hradby hroutí, dokud se nemohou navzájem zasáhnout meči. Také střelci z hákovnic {Hackenschützen} mají stále stát na příkopu {Graben} a střílet dovnitř, aby nikdo nemohl ani se neodvážil vystrčit z města hlavu.
- typ: odstavec
  de: |-
    Ferrner solt jhr ewern Veldmarschalck ordnen an das ort da mann Wacht helt mit einem gůten Hauffen zu roß vnd fuß / vnnd auß dreien vrsachen alda nicht verrücken lassen / biß daß der Sturm auß ist.
  cs: |-
    Dále máte svého polního maršálka {Veldmarschalck} s dobrým houfem jízdních i pěších postavit na místo, kde se drží stráž {Wacht}, a ze tří důvodů ho odtamtud nenechat odejít, dokud útok {Sturm} neskončí.
- typ: odstavec
  de: |-
    Die erst vrsach / wann euch die Feind in das Leger fallen wolten / soll er dermassen mit Leutten verfast sein / das sich tausent mit zehen tausent schlagen.
  cs: |-
    První důvod: kdyby vám nepřítel chtěl vpadnout do ležení {Leger}, má být lidmi zaopatřen tak, aby se tisíc mohlo bít s deseti tisíci.
- typ: odstavec
  de: |-
    Die ander / wann jhr notturfftig im stürmen ein Fendlin odder einen gantzen hauffen zu stercken / soll er euch schicken so vil jhr begeret.
  cs: |-
    Druhý: budete-li při útoku potřebovat posílit praporec {Fendlin} nebo celý houf, má vám poslat tolik [lidí], kolik budete žádat.
- typ: odstavec
  de: |-
    Zum dritten / wann jhr den sturm verliert / das kan nicht on schaden vnd vnordnung des Kriegßuolcks geschehen mag / dann es je nicht anders in dem fall zugehen kan / Wann dann die auß der Stat herauß vnder euch fielen / kündt jr so bald nicht mehr die so inn dem sturm gewesen / in ein Ordnung bringen / sonder der Veldmarschalck muß mit seinem Hauffen wider zu samen bringen / vnnd die Feinde widerumb in die Stat schlagen / alda sicht jr was die Ordnung thůt / Wann sich aber der fall begebe daß jr den sturm verliert / solt jhr als vil Schützen vnd sonst leut jr kündt vnd möcht inn den schantzen behalten / vnd ewer Büchsenmeister gerüst abzuschiessen / dann so sich der vberfal begibt / lassen sich gewönlich mehr in den wehrn sehn dann vor / dann sie vil hertzhaffter vnd kecker werden / vnnd vermeinen mann künde jnen kein schaden mehr zufügen / so möcht jhrs jnen mit dem Geschütz das jr in sie gern gehn last / wol vergelten.
  cs: |-
    Zatřetí: prohrajete-li útok, nemůže se to obejít bez škody a nepořádku mezi válečným lidem {Kriegßuolcks}, neboť v takovém případě to jinak ani dopadnout nemůže. Kdyby pak ti z města vyrazili mezi vás, nemohli byste ty, kdo byli v útoku, tak rychle znovu uvést do pořádku; to musí polní maršálek se svým houfem znovu shromáždit a nepřítele zahnat zpět do města. Tu vidíte, co zmůže pořádek. Kdyby se však stalo, že útok prohrajete, máte v šancích ponechat tolik střelců a jiných lidí, kolik jen můžete, a své puškaře {Büchsenmeister} připravené k palbě. Když totiž dojde k takové porážce, ukazuje se jich [obránců] na hradbách {wehrn} obvykle víc než předtím, protože jsou mnohem odvážnější a smělejší a myslí si, že jim už nelze uškodit. Tehdy jim to můžete dobře oplatit děly, která na ně rádi necháte spustit.
