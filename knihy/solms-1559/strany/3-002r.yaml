bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Beuelchsleut in rath erfordern vnd sie dahin halten/ daß sie zurechter/ erforderter/ oder verordneter stundt bei einander sein/ vnd als dann jnen zuberatschlagen fürgeben was für ein fal das were.
  cs: |-
    velitele {Beuelchsleut} povolával do rady a vedl je k tomu, aby se v určenou, požadovanou či stanovenou hodinu shromáždili, a pak jim předložil k poradě jakýkoli případ.
- typ: odstavec
  de: |-
    Vnd nit vnderlassen/ eins jeden Rathschlag besonder vnd eigentlich auffschreiben nach einander wie die fragen vmb gehen/ darauff mag wol gesagt werden/ das ist nit gůt noch weißlich/ were das mann ein Rathschlag solt in viler wissen kommen lassen/ auch einn Kriegshandel soll mann heimlich halten/ dann es legen die feinde vil auff kuntschafft/ sie sehen das villerlei leut nicht bekent/ einer mag vndrew sein/ der ander vnuersorgt/ der drit ein trunckner man/ mage sich in der truncknen weiß des fürnemen etwan daß wissen lasen/ vnd der feindt das durch obgemelte vrsachen solliches erfaren/ seine sachen vnnd anschläg darnach richten/ ist wol was/ es ist etwas das jhm gleich lauttet/ aber dem kan sein maß geben werden/ vnd ich sag also/ ein Herr der helt also sein Rathstundt/ wie oben daruon gemelt/ gebe ein fal hinein zuberatschlagen da nichts angelegen ist besonder zum ersten anfang/ so wirt ein Herr oder Oberster hörn was ein jeder für Rathschläg gibt/ vnd lernt damit also eines jeden verstand vnd sein geschicklicheit in dem daran noch nit gelegen ist/ das ist für das erst/ Zum andern/ so macht er sein volck als die Beuelchsleut sorgfeltig/ damit sie sich schicken vnnd nach dencken müssen/ dieweil sie sehen daß mann sie im Rath gebraucht vnd jren Rahthschlag auff schreibt/ damit wann er wider in Rath kompt das er auch nicht mit spot vnd für den geringsten besteh vnd geacht werde/ also muß er sich besorgen/ trinckens vnd andere vngesichlichkeit[^1] sich meiden vnnd enthalten/ den sachen nach dencken/ vnd hören der andern Ratschläg daran hat er sich auch zu bedencken/ zu lernen/ vnd zu bessern/ thůt er das oder souil jr sind/ so hat ein Herr gar wol daran gethan/ daß er die geschickt macht die er haben vnd gebrauchen muß/ dann je sie die sachen geschickter angreiffen vnd handeln/ so einem Herrn auch besser ist vnd bekömpt/ auch so etwan ein gůts gemüt inn der person eine ist/ so jn die ehr besser thůt/ weiter darnach trachtet vnnd sich vbet/ ist es aber an jm nit angenem wart seins trinckes vnd andere leichtfertigkeit/ weiß im Rath auch nichts zu sagen/ was will ein Herr dann mit jm thůn/ so hat der Herr sein gemüt vnnd wandel durch dises gelernet/ vnd die andern des gleichen/ so mag ein Herr solliches ampt von jm wol nemen vnd mit eim andern versehen/ so wissen auch die andern Raths personen vnd Beuelchßleut wol warumb das geschicht/ müssen das auch helffen bekennen vnd zeugen/ ist alles dem Herrn zu gůtem/ So ein Herr dise Ordnung also hat mit dem ersten in geringen
  cs: |-
    A nemá opomenout nechat si zvlášť a přesně zapsat radu každého jednoho po sobě, jak jdou otázky dokola. Na to by někdo mohl říci: „To není dobré ani moudré, aby se rada dostala do vědomí tolika lidí; válečnou věc je třeba držet v tajnosti, neboť nepřátelé mnoho vynakládají na vyzvědy {kuntschafft}; vidí, že rozliční lidé nejsou spolehliví – jeden může být nevěrný, druhý neopatrný, třetí opilec, který v opilosti může z toho záměru ledacos prozradit, a nepřítel se to skrze uvedené příčiny dozví a zařídí podle toho své věci a plány.“ Něco na tom je, zní to podobně, ale i tomu lze dát správnou míru. A já pravím takto: Pán, který takto drží svou radní hodinu, jak bylo řečeno výše, ať předloží k poradě takový případ, na kterém nic nezáleží, zvláště na samém počátku; tak pán nebo plukovník {Oberster} uslyší, jaké rady každý dává, a pozná tak rozum a obratnost každého v tom, na čem ještě nezáleží – to za prvé. Za druhé tím učiní svůj lid, totiž velitele, pečlivými, takže se musejí snažit a přemýšlet, když vidí, že se jich užívá v radě a jejich rada se zapisuje, aby – až přijde do rady příště – neobstál s hanbou a nebyl pokládán za nejmenšího. Tak se musí mít na pozoru, vyhýbat se a zdržovat se pití i jiné nešikovnosti[^1], promýšlet věci a poslouchat rady druhých; podle toho se má i zamýšlet, učit a zlepšovat. Činí-li tak on – či kolik jich je –, pak pán udělal velmi dobře, že činí obratnými ty, které musí mít a užívat; neboť čím obratněji se věcí chápou a jednají, tím lépe to i pánovi prospívá a svědčí. A je-li snad v některé osobě dobrá povaha, které čest prospívá, usiluje dále a cvičí se; není-li to však při něm vítáno a on dbá jen na své pití a jinou lehkovážnost a v radě ani neví, co říci, co si s ním má pán pak počít? Tak pán skrze toto poznal jeho povahu a mravy – a ostatní rovněž –, takže může takový úřad od něho snadno odejmout a svěřit jej jinému; a ostatní členové rady i velitelé pak dobře vědí, proč se tak děje, a musejí to i dosvědčit a potvrdit – a vše je k dobru pánovi. Když takto pán začne s tímto řádem nejprve v drobných
poznamky:
- n: 1
  text: |-
    Tisk má podobu *vngesichlichkeit* (sazečský překlep za *vngeschicklichkeit* – nešikovnost, neřest). V témže odstavci je rovněž drobná tisková podoba *Rahthschlag* (za *Rathschlag*).
