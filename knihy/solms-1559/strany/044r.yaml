bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    aber das / so er bei den Beckern bestelt / vnder sein Volck nit reichen / so soll er seinen vorrath der Commiß auch angreiffen / souil die notturfft erfordert / vnd darüber auch seine Becker vnnd Fürleut ordenen / Vnd mann soll allwegen / da mann Brot beckt / gůte achtung haben / in der zeit wann daß daran abgehen wolt / dem Prouiantherrn anzeigen / damit er sich möge in der zeit darnach in die Commiß schicken / dieweil er aber mag in der Landtschafft / von dem gemeinen Volck die Prouiant haben / vnd sie die auch vmb gebürlich gelt geben / so soll der Prouinatherr dieselben lassen gewerden / damit sie auch geniessen / so bleiben sie gůtwillig / vnnd brengen zuwegen hin vnd wider / da sonsten nichts zuerfaren ist.
  cs: |-
    však to, co objednal u pekařů, pro jeho lid nestačilo, má sáhnout i na svou zásobu komisu {Commiß}, kolik potřeba vyžaduje, a nadto ustanovit i své pekaře a vozky {Fürleut}. A všude, kde se peče chléb, se má dávat dobrý pozor a včas, kdykoli by ho chtělo ubývat, to oznámit proviantnímu pánovi {Prouiantherrn}, aby se podle toho mohl včas zařídit v komisu. Dokud však může mít proviant {Prouiant} v kraji od prostého lidu a ten jej dává za slušné peníze, má je proviantní pán[^1] nechat prodávat, aby i oni měli užitek. Tak zůstanou ochotní a sem i tam obstarají, co by se jinak sehnat nedalo.
- typ: odstavec
  de: |-
    Vnd so ein Herr die Commiß brauchen můß / so soll er doch dasselbig nit vberschetzen / damit das Kriegsuolck nicht beschwert / vnd zukommen möge / so kan ein Herr sie auch desto lenger vnnd gůtwilliger behalten. So aber ein Herr zu hart wil mit der Prouiant vmbgehn / vnd zuuil geniessen / so macht er einen vnwilligen Hauffen / verderbt das Leger / vnd was er an der Prouiant zugewinnen vermeint / das gehet an dem Kriegsuolck doppel widerumb hin / vnd macht einem Herren nicht ein gůt gerücht / als ein Kriegsherrn billich haben solt / vnnd leßt sich einander mal niemands gern bestellen / dann mit hoher besoldung / das gewinnet ein Herr daran / darumb ist ordnung vnd maß gůt.
  cs: |-
    A musí-li pán použít komis, nemá jej přece předražovat, aby válečný lid {Kriegsuolck} nebyl zatěžován a mohl vyjít; pán si jej tak také udrží déle a ochotnější. Chce-li však pán s proviantem nakládat příliš tvrdě a příliš na něm vydělávat, vyvolá si nevrlý houf {Hauffen}, zkazí ležení {Leger}, a co si myslel, že na proviantu získá, to na válečném lidu dvojnásob ztratí; navíc si pán neudělá dobrou pověst, jakou by válečný pán {Kriegsherrn} po právu měl mít, a příště se k němu nikdo nebude chtít nechat najmout, leda za vysoký žold {besoldung} – to na tom pán získá. Proto je pořádek a míra dobrá věc.
- typ: odstavec
  de: |-
    Vnd soll derhalben ein Herr / der des Lands ein Herr vnd mechtig ist / alle Kasten einnemen / sich einer billichen bezallung mit jnen vergleichen / vnd also den vorrat an allen orten vberschlagen / daß er wisse / was er vermag zubekommen / so weiß er dann auch zu vberschlagen / was er vermag oder erhalten kan / vnnd seine sachen darnach richten.
  cs: |-
    Proto má pán, který je pánem země a má v ní moc, zabrat všechny sýpky, dohodnout se s jejich majiteli na slušné platbě a takto odhadnout zásoby na všech místech, aby věděl, co může dostat. Pak také dokáže spočítat, co zmůže a koho uživí, a podle toho zařídit své věci.
- typ: odstavec
  de: |-
    Der Prouiantherr soll auch alle Kasten mit hafern besehen / vnd vberschlagen / vnd auch nemen / vnd den Kauff machen das billich ist / vnd darnach er dann pferd zufůtern hat / soll er die Kasten ordnen / darnach ein Kasten groß ist / soll er auch Pferde darauff ordnen / daß die wissen / wo oder an welchem Kasten sie nemen sollen / vnnd der Prouiantherr soll auch darbei sein / vnd hart halten / daß dieselbigen so die frucht haben vnnd geben můssen / laut seiner schatzung / bezalt werden. Der Prouiantherr soll auch / so er in das feld kompt / mit denen in Stätten ein ordnung machen / wie hoch sie das Brot geben sollen / vnd von was gewicht / deßgleichen fleisch / vnnd was mann also für gemein prouiant vnd speiß bedörffe.
  cs: |-
    Proviantní pán má také prohlédnout a odhadnout všechny sýpky s ovsem, zabrat je a ujednat cenu, jež je slušná; a podle toho, kolik má koní ke krmení, má rozdělit sýpky – podle toho, jak je která sýpka veliká, má na ni přidělit i koně, aby věděli, kde či ze které sýpky si mají brát. A proviantní pán má být také u toho a přísně dbát na to, aby ti, kdo mají obilí a musejí je vydat, dostali zaplaceno podle jeho odhadu. Proviantní pán má rovněž, jakmile přitáhne do pole, ujednat s městy řád, za jakou cenu a o jaké váze mají dávat chléb, stejně tak maso a cokoli dalšího je potřeba k obecnému proviantu a stravě.
- typ: odstavec
  de: Es soll auch ein Herr / so der inn die Lande seiner Feinde kompt /
  cs: Pán také, když vstoupí do zemí svých nepřátel,
poznamky:
- n: 1
  text: Tisk má v tomto výskytu přesmyčku „Prouinatherr“.
