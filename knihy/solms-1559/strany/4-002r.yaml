id: 4-002r
list: 2 (4. kniha)
strana: recto
sken: 391
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    ZVm sibenzehenden gleich diser hieuorn Mortier steht auch inn einem stůl/ das nichts verhengt sonder der grundt vnd bogen angezeigt/ darauff er in dem bodem stehet vnd vmbgehet/ darumb der stul liecht ist daß mann den Mortier wol sehen kan/ wie er in dem bodem gehet vnd gemacht ist.
  cs: |-
    Za sedmnácté:[^1] podobný moždíř {Mortier} jako ten výše stojí rovněž ve stolici {stůl}, která nic nezakrývá, nýbrž ukazuje podstavu a oblouk, na nichž moždíř v podstavci stojí a otáčí se. Stolice je proto otevřená (*liecht*), aby bylo moždíř dobře vidět – jak v podstavci chodí a jak je sestrojen.
- typ: odstavec
  de: |-
    Das Instrument so in dem Mortier mit dem E. verzeichnet steht/ ist sein Quadrant damit mann ein sölt/ deßgleichen der Zirckel mit dem G. verzeichnet.
  cs: |-
    Nástroj označený písmenem E, který stojí v moždíři, je jeho kvadrant {Quadrant}, jímž se nastavuje [náměr][^2]; stejně tak kružidlo {Zirckel} označené písmenem G.
- typ: odstavec
  de: |-
    Die stangen mit dem F. verzeichnet mit dem strick vnd ring daran/ damit hept mann die kugel auß vnd ein/ wie die in der Figuren mit dem A. ein kugel mit einem hacken daran verzeichnet ist/ dann wann die kugel gar groß sein würde/ muß mann sie also auß vnd ein heben/ oder mit einem Büchsenzog/ aber mit der stangen gehet es behender vnd fürderlicher dann mit dem zog zů.
  cs: |-
    Tyč označená písmenem F s provazem a kroužkem slouží k vyzvedávání a vkládání koule {kugel} – tak, jak je na figuře písmenem A označena koule s hákem. Je-li totiž koule velmi veliká, musí se takto vyzvednout a vložit, anebo dělovým kladkostrojem {Büchsenzog}; s tyčí to však jde obratněji a rychleji než s kladkostrojem.
poznamky:
- n: 1
  text: |-
    V dochovaném svazku `Rar. 986` chybějí po čtrnáctém kusu (`4-001v`) položky 15 a 16 včetně vyobrazení se značkami `A`, `E`, `F`, `G`, na něž se následující odstavce odvolávají.
- n: 2
  text: |-
    V tisku *ein sölt* (nářeční či tiskařský tvar za *einstellt*, tj. „nastavuje, seřizuje“).
