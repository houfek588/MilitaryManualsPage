bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    kriegen wie Kriegs gebrauch ist / vnd vor jnen gewesen / darmit dem Kriegßherrn trewlich gedienet / vnd das Kriegßuolck mag erhalten werden inn gůter Pollicei / vnnd ein Herr die Krieg erhalten möge / Deßgleichen das wider ein gůt Justitien erhalten / vnd das Kriegsuolck in ein gůt Kriegßordnung vnnd gehorsam gebracht werden / dann muß die Kriegßhandlung widerumb durch ehrliche verstendige Kriegßleut vor die handt genommen werden / vnnd wider wie von alters gewesen / anstellen / ordnen vnd sein maß geben vnd halten / vnd der Commissarien Ampts versehung mit maß geben / was einer jeden Commiß verwaltung sein soll / vnd nicht ein jeder Commissarius solliches nach seinem sinn vnd zu seinem nutzen ordnet / sonder zu des Herren vnd gantzen Legers auch gemeines Kriegsuolcks besten / dann wann mann ein vnordnung leßt einbrechen / so volgen alßdan noch mehr hernach / vnd vbersicht als einer dem andern / dardurch geht die gůt Regirung zu bodem / dann wo kein gůte Regirung ist / da ist auch kein gůt Justitien / wo dann kein gůt Justitien ist / da ist auch kein gehorsan / wie ist zu gedencken wer darbei wol regiren kan.
  cs: |-
    válčit tak, jak je válečným zvykem a jak bývalo před nimi, aby se válečnému pánovi {Kriegßherrn} věrně sloužilo, aby válečný lid {Kriegßuolck} mohl být udržován v dobrém veřejném řádu {Pollicei} a pán mohl války vydržet, a také aby byla opět zachována dobrá spravedlnost {Justitien} a válečný lid přiveden k dobrému válečnému řádu a poslušnosti. K tomu se válečných věcí musejí znovu ujmout čestní a rozumní válečníci {Kriegßleut}. Ti je mají opět uspořádat tak, jak bývalo odedávna, stanovit jim míru a tu dodržovat. Také úřadu komisařů {Commissarien} je třeba vymezit, co má spadat pod správu každého komisu {Commiß}, aby si to žádný komisař neuspořádal podle své vůle a k vlastnímu prospěchu, nýbrž k nejlepšímu prospěchu pána, celého ležení {Legers} i obecného válečného lidu. Jakmile se totiž dopustí, aby vnikl jeden nepořádek, následují další a jeden druhému všechno promíjí; tím dobrá správa upadá. Kde totiž není dobrá správa, není ani dobrá spravedlnost, a kde není dobrá spravedlnost, není ani poslušnost[^1] – jak si pak lze představit, že by při tom někdo dokázal dobře vládnout?
- typ: odstavec
  de: |-
    Darumb soll mann sehen nach gůten Kriegßordnungen / vnd die Ampter besetzen mit ehrlichen verstendigen Personen / die werden wol regiren / wann mann dann wol regiert / da kan mann auch gůt Justitien halten / wo dann gůt Justitien ist / da ist gehorsam / wo dann gehorsam ist vnder dem Kriegßuolck / da ist gůt vnnd getröstlich mit zu handeln / vnd etwas ehrlichs damit außzurichten.
  cs: |-
    Proto je třeba dbát na dobré válečné řády a obsazovat úřady čestnými a rozumnými osobami; ty budou dobře vládnout. Když se dobře vládne, lze také udržovat dobrou spravedlnost; kde je dobrá spravedlnost, je poslušnost; a kde je mezi válečným lidem poslušnost, dá se s ním dobře a s důvěrou jednat a vykonat s ním něco čestného.
- typ: odstavec
  de: |-
    Das ich in diser Kriegs beschreibung hab vermelt vnd vor gůt angesehen / daß in die Bestallung solt gesetzt oder mit einuerleibt werden / daß mann des Kriegßherrn Justitien vnnd derselbigen verwalter soll gehorsam sein vnd beistehn / das sehe ich noch vor gůt vnnd billich an / es gebürt sich auch darinn gehorsam zu sein / vnnd stehet ein grosses dem krieg darauff / Dieweil dann ein grosses dem krieg darauff steht / vnd der krieg dardurch will gefürt werden / so soll der Kriegßherr besehen / daß er gůt Kriegßregirung anstelle / mit gůtem Rath der Kriegßuerstendigen vnd gůten Leuten die Ampter versehe vnd bestelle / so hat mann wol zu regiren / vnnd ist das Kriegßuolck durch sich selber damit gefangen.
  cs: |-
    Co jsem v tomto válečném popisu uvedl a uznal za dobré – totiž aby se do služebního listu {Bestallung} vložilo či začlenilo, že spravedlnosti válečného pána a jejím správcům se má prokazovat poslušnost a pomoc –, to i nadále pokládám za dobré a spravedlivé. Sluší se v tom být poslušný a válka na tom velmi závisí. A protože na tom válka tolik závisí a má se tím řídit, má válečný pán dbát, aby zřídil dobrou válečnou správu a s dobrou radou znalců válečnictví {Kriegßuerstendigen} obsadil a zajistil úřady dobrými lidmi. Pak se dá dobře vládnout a válečný lid je tím sám od sebe [ke kázni] zavázán.
- typ: odstavec
  de: |-
    Solt es aber nicht ein einsehens bekommen / vnd inn bessere weg / dann ein zeitlang geschehen / geordnet werden / so hett ich sorg es würde je lenger je böser werden / vnd das Kriegßuolck je lenger je
  cs: |-
    Nedojde-li však k nápravě a neuspořádá-li se to lépe, než jak se to už nějaký čas děje, obávám se, že bude stále hůř a válečný lid bude čím dál
poznamky:
- n: 1
  text: V tisku *gehorsan* za *gehorsam*.
