list: 13 (9. kniha)
strana: verso
sken: 646
stav: prelozeno
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    ist / vnd künden nit der weil haben zu brennen noch euch verhindern das Leger zuschlagen / oder das Geschütz vnd anders mehr zunemen / das sie thůn künden wann jhr weit von der Statt legt / Jch hab wol gesehen / daß mann sich auff ein mal für drei oder vier Pforden gelegert / das mich bedünckt gantz gůt sein / wann jhr anders den platz vnd Volcks gnůg habet.
  cs: |-
    a oni nebudou mít čas pálit [předměstí] ani vám bránit v rozbití ležení {Leger}, nebo [vám] vzít děla {Geschütz} a jiné věci, což by mohli udělat, kdybyste se položili daleko od města. Viděl jsem ovšem také, že se vojsko položilo najednou před tři nebo čtyři brány, a to se mi zdá docela dobré, máte-li ovšem dost místa i lidí.
- typ: odstavec
  de: |-
    Es bedünckt mich auch gůt sein / wann jhr ein Leger für ein Stat schlacht / vnnd mit sollicher Ordnung ziehet wie obgemelt / nach dem das Landt weit oder eng ist / vnnd solt dem Marschalck souil Leut zu roß vnd zu fuß zugeben / daß er stercker sei dann die in der Statt / vnd wann sie zu roß oder zu fůß herauß fallen / daß mann sie auff das aller hefftigst als mann kan wider zu dem Thor hineinschlage / dann etwan kommen sie in ein solliche forcht vnnd flucht / daß mann mit jnen hinein kompt / oder mann jnen sonst einen trefflichen Hauptman oder sonst vil Leut erschlecht / daß nachuolgends die Statt souil desto geringer gewunnen wirdt / Auch wann sie also hinein gejagt werden / mögen die Büchsenmeister desto bequemlicher jren vortheil ersehen / auch wo sie jhr Geschütz hinauß geordnet / künden sie sich daruor hüten.
  cs: |-
    Zdá se mi také dobré, když rozbíjíte ležení před městem a táhnete v takovém pořádku {Ordnung}, jak bylo řečeno výše, podle toho, je-li kraj otevřený, nebo úzký, abyste polnímu maršálkovi {Marschalck} dali tolik lidí na koních i pěších, aby byl silnější než ti ve městě. Když pak vyrazí ven na koních nebo pěšky, ať je co nejprudčeji zažene zpět do brány. Někdy totiž propadnou takovému strachu a útěku, že se s nimi dostanete dovnitř, nebo jim aspoň zabijete znamenitého hejtmana {Hauptman} či mnoho jiných lidí, takže se potom město dobude o to snáze. Když je takto zaženete dovnitř, mohou si také puškaři {Büchsenmeister} tím pohodlněji vyhlédnout výhodná místa, a zjistí-li, kam [obránci] namířili svá děla, mohou se před nimi chránit.
- typ: odstavec
  de: |-
    Wann sie nun der gestalt widerumb hinein gejagt werden / soll der Marschalck jnen abblasen lassen / vnd das Leger schlagen auff das nechst zu der Stat vnd darzů schantzen.
  cs: |-
    Když jsou takto zahnáni zpět, má polní maršálek dát svým lidem troubit k ústupu, rozbít ležení co nejblíže u města a stavět k němu šance {schantzen}.
- typ: odstavec
  de: |-
    JCh hab zwo oder drei manirn der Schantzen gesehen / das mann Körb genommen hat vnd sie auff spitzige Pfeel gestelt / vnnd sein vngefehrlich eines Mans hoch / sechs oder siben Schůh lang / vier oder fünff breit / Hab auch gesehen etlich rund die grösser vnd kleiner sein gewesen dann die / solche sol mann zu nachts an das ort setzen da mann schantzen will / vnd sie dick machen daß das Geschütz sicher darunder sei / vnd die Körb mit erden außfüllen / der massen macht mann schantzen / vorab an den orten da mann nicht tieff graben kan vor Wasser oder Velsen.
  cs: |-
    Viděl jsem dva nebo tři způsoby stavby šancí {Schantzen}. Brali se koše {Körb} a stavěly se na zašpičatělé kůly {Pfeel}; byly asi na výšku muže, šest nebo sedm stop {Schůh} dlouhé a čtyři nebo pět široké. Viděl jsem také některé kulaté, které byly větší i menší než tyto. Takové koše se mají v noci postavit na místo, kde se chce budovat šance, a to hustě, aby pod jejich krytem byla děla v bezpečí, a koše se mají vyplnit zeminou. Takto se staví šance, zvláště na místech, kde se kvůli vodě nebo skále nedá kopat do hloubky.
- typ: odstavec
  de: |-
    Jch hab ein Manier zu schantzen inn Franckreich gesehen nicht mit vil Geschütz / dann als bald die so auß der Statt gefallen wider hinein gejagt worden / mögen die Büchsenmeister wol sehen was sie der Statt abbrechen künden / so lassen sie die grossen Stück voran
  cs: |-
    Ve Francii jsem viděl způsob, jak stavět šance bez velkého množství děl. Jakmile byli ti, kdo vyrazili z města, zahnáni zpět, a puškaři dobře vidí, čím mohou městu uškodit, nechají jít velká děla {Stück}
