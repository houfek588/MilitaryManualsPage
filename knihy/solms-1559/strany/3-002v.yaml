bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    sachen daran nicht gelegen ist angefangen/ vnd die personen also hat erlernt/ die gůten vnd bösen oder geschickten vnd vngeschickten so hat er wolgethan/ ist jm ein grosser vortheil/ weiß nun wie er ein vor dem andern halten oder beuelhen soll/ also allen tag mit jn fort farn/ vnd sie nit darauß lassen die weil es ander geschefft halben sein kan/ vnd ob ein Herr seiner person nit alle zeit kan darbei sein/ so soll er doch nicht desto weniger den Rathschlag lassen fort gehn/ vnd darzu einen fall zubedencken jnen geben/ wie vorgemelt/ vnd in eines jeden Rathschlag beschrieben.
  cs: |-
    věcech, na nichž nezáleží, a takto poznal ty lidi – dobré i špatné, obratné i neobratné –, pak učinil dobře a je to pro něj veliká výhoda; nyní ví, jak má jednoho před druhým ctít nebo mu velet, a tak má s nimi denně pokračovat a nenechat je z toho vyjít, pokud to pro jiné záležitosti může být. A kdyby pán nemohl být osobně vždy přítomen, nemá přesto nechat poradu ustat, nýbrž má jim předložit nějaký případ k rozvaze, jak bylo řečeno výše, a dát jej zapsat do záznamu rad každého z nich.
- typ: odstavec
  de: |-
    Vnd so ein Herr dann hat einen heimlichen Rathschlag denselbigen mag er besonder berathschlagen neben disem Rathschlag/ dar zu nemen von disen Räthen vnd Beuelchsleuten welche jm gefallen vnd vertrauen darff/ solche redt mit denselbigen beschliessen/ darumb so sage ich das ein Herr oder Oberster gar wol daran thůt/ wann er sein Kriegs ampts personn also vbet/ vnd in gůter ordnung sie mit helffen berathschlagen/ die in Legern zu gebrauchen sind/ halten sie auch desto baß/ dieweil sie daß mit haben helffen berathschlagen/ vnd lernet ein Herr sie auch kennen/ so lernen sie auch durch die Rathschläg einer von dem andern/ kommen darnach zusamen reden selbst weiter mit einander daruon/ dencken dann dem vnd andern weiter nach/ vnd es kan auch nicht felhen ein Herr der muß auch vil dings im rathschlag durch die vil Rathschläg erindert werden/ vnd zu weiteterm[^1] nach dencken verursacht/ dann wann er von niemant nicht gehört hett/ dann von seinem selbst bedencken/ oder von wenigen/ Dann es ist ein altes sprichwort/ reden macht widerreden/ macht weiters nach dencken/ also ist es in disem auch. Derhalben ist gůt das ein Herr also zu aller zeit rath helt/ vnd mit den seinen ordnung vnd Pollicei diß Kriegs vnd im Leger vernemen/ so dann also wirt Ordnung berathschlag[^2]/ den Räthen vnd Beuelchsleuten einem jeden das sein zu handeln vnd halten befolhen wirt/ so er dem dann also nach kompt vnd helt/ ist wol vnnd recht/ Wo aber einer sich desselben nit halten wirt/ ist er darumb im Rath wider zubereden vnd nach befindung darumb zůstraffen/ das wirt gůt ordnung machen vnd halten/ da so mage mann sagen/ so nun wirt also ordnung gemacht vnd gehalten/ was soll mann dann alle tag darumb Rath halten/ die weil es recht geht/ daruon ist nit geredt so das also recht gehet/ so soll es doch zu rathen nicht vnder wegen bleiben/ mann soll alwegen etwas sůchen vnd fell für sich nemen/ vmb der vbung willen/ also wil ich achten das ein Herr wirt sagen/ ich bin das gegen meinem feindt für zunemen/ so ich das thů/ wirt er mir also wider begegenen/ wie
  cs: |-
    A má-li pak pán nějakou tajnou poradu, může ji projednat zvlášť vedle této rady, přibrat k ní z těchto radů {Räthen} a velitelů {Beuelchsleuten} ty, kteří se mu líbí a jimž smí důvěřovat, a takové věci s nimi uzavřít. Proto pravím, že pán nebo plukovník {Oberster} činí velmi dobře, když osoby svých válečných úřadů takto cvičí a v dobrém pořádku s nimi spoluporadívá o tom, čeho je třeba v leženích {Legern} – tím spíše to pak i dodržují, když o tom sami pomáhali radit; pán je tím také poznává a oni se rovněž prostřednictvím porad učí jeden od druhého, pak se scházejí, sami spolu dále o tom rozmlouvají a přemýšlejí o tom i onom dále. A nemůže minout, že i sám pán musí být v radě skrze mnohé rady na mnohou věc upomenut a pohnut k dalšímu[^1] přemýšlení než tehdy, kdyby od nikoho nic neslyšel, leda ze své vlastní úvahy nebo od nemnohých. Neboť praví staré přísloví: „Řeč budí odvět, odvět další přemýšlení,“ a tak je tomu i zde. Proto je dobré, aby pán takto v každém čase držel radu a se svými projednával pořádek a veřejný řád {Pollicei} této války i v ležení. Když se takto řád usnese[^2] a radům i velitelům se přikáže každému jednat a držet své, pak koná-li a dodržuje-li to podle toho, je to dobré a správné; kdo by se toho však nedržel, má být v radě znovu napomenut a podle zjištění za to potrestán – to způsobí a udrží dobrý řád. Tu by někdo mohl říci: „Když je tedy řád už takto učiněn a dodržován, nač o něm každý den radit, dokud vše jde správně?“ O tom není řeč: i když vše jde takto správně, přesto se nemá upouštět od radění, nýbrž se má vždy něco vyhledávat a předkládat si případy kvůli cviku; tak soudím, že pán řekne: „Chystám proti svému nepříteli podniknout toto – učiním-li to, on mi zase odpoví takto, jak
poznamky:
- n: 1
  text: |-
    Tisk má zdvojenou slabiku *weiteterm* (za *weiterem*).
- n: 2
  text: |-
    Tisk má tvar *berathschlag* (vypadlé koncové *-t* za *berathschlagt*).
