bloky:
- typ: odstavec
  de: |-
    Dieweil aber ein Krieg ein schwere sach ist / Landt vnd Leut darauff gesatzt vnnd gewagt sein mussen / ob es zu glück oder zuuerheren geraten wöl / soll man keinem Herrn bald in einen Krieg rathen der Landt vnd Leut hat / Würde sichs aber zutragen / daß sich ein sach darnach schicken wolt / daß es ein Krieg erfordern möchte / dann soll ein Herr sein Landtschafft bei einander fordern / jnen den fall vorhalten / vnd sie berathschlagen lassen / ob ein ander mittel dann den Krieg anzunemen gefunden möcht werden / würde dann ein mittel gefunden / daß es nicht zum Krieg kommen darff / dann ist es wol geraten / würde es aber dahin bedacht werden / daß mann einen Krieg vornemen můst / zu erhaltung der Landt oder dergleichen / so soll ein Herr als dann nemen Kriegßleut die den Krieg verstehen / sie seien auß den Landen oder frembden / so ein vertrawen haben / vnnd mit denselbigen den Krieg weitter berathschlagen vnnd ordnen lassen auff ein summa Kriegßuolck / was mann darzů zuhaben vermeint / es sei zu roß oder zu fuß / vnd was zu solchem Krieg von rüstung von nöten ist.
  cs: |-
    Válka je však těžká věc, v níž se musí vsadit a dát v sázku země i lidé, ať už se to obrátí ke štěstí, nebo ke zpustošení[^1]. Proto se nemá pánovi, který má země a lidi, ukvapeně radit do války. Přihodilo-li by se však, že by se věc vyvíjela tak, že by mohla vyžadovat válku, má pán svolat své zemské stavy, předložit jim ten případ a nechat je poradit se, zda by se nedal nalézt jiný prostředek než sáhnout k válce. Najde-li se prostředek, aby k válce nemuselo dojít, je to dobře vyřešeno. Dospěje-li se však k závěru, že se válka musí podniknout k zachování zemí nebo z podobné příčiny, má si pán vzít válečníky {Kriegßleut}, kteří válce rozumějí – ať jsou z jeho zemí, či cizí, jen když jim lze důvěřovat –, a dát s nimi válku dále projednat a rozvrhnout na určitý počet válečného lidu {Kriegßuolck}, kolik se ho k tomu zamýšlí mít, ať na koni, či pěšky, a jaká výzbroj {rüstung} je k takové válce zapotřebí.
- typ: odstavec
  de: |-
    Wann dann solches geordnet vnd inn anschlag gebracht / dann soll mann solchs rechnen / vnd in ein summa des gelts stellen / so mit der zeit darauff gehn wirt / vnd als dann mit der landtschafft wider berathschlagen / ob sie solchs gelt bei sich vermögen oder auff zubringen vnd zuerhalten wissen. Vnd im fall so sie das zu erhalten nit finden mögen / daß alßdan weg gesucht würden etwan durch mittel personen / die es zu einem leidtlichen vertrag bringen möchten / oder zu eim andern rechtlichen außgang / damit es on Krieg vnd verderbung der landt kome. Solts aber den Krieg vorzunemen bewilligt vnnd gerathen werden / vnd mann mit dem gelt vnnd anderm darzů gefaßt were oder werden möcht / vnd also vorgenomen solt werden / dann sol der Herr sich mit gůten verstendigen Kriegßleuten verfassen vnnd versehen / besonder zu den Kriegßamptern / daß die wol mit tüglichen Personen bestellet vnd versehen werden / darmit der Krieg geregieret vnd gefürt werde / vnd beuelhe dann den Krieg den Kriegßleuten zu füren vnd zuuerwalten / in dem namen Gottes / vnd nicht den Doctorn noch langen Röcken / die nicht darbei kommen / vnnd laß den Krieg also vorgehn so lang die notturfft das erfordert / biß zu seim end gebracht vnd gefürt wirt / es geschehe mit gewalt oder vertrag / wie das geraten mag. So eim Herrn dann also ein Krieg zufürn geriet / dann soll er sich nit bereden lassen / daß er sein landuolck darzů gebrauche / dann seinen Reisigenzeug / vnd was er für Fußuolck hett / das vorhin Kriegßleut wern / den Kriegen nachgezogen hetten oder noch thetten / aber ein landtuolck zurüsten vnd außzufürn das nit vorhin / wie gemelt /
  cs: |-
    Když se to pak rozvrhne a sestaví rozpočet, má se to spočítat a vyjádřit peněžní sumou, která na to postupem času padne. Potom se má pán znovu poradit se zemskými stavy, zda takové peníze mají nebo je dokážou opatřit a udržet. Kdyby shledali, že je udržet nedokážou, mají se hledat cesty, třeba skrze prostředníky, kteří by věc mohli dovést k snesitelné smlouvě nebo k jinému právnímu vyřízení, aby se to obešlo bez války a zkázy zemí. Bude-li však schváleno a doporučeno válku podniknout, má-li se na ni dost peněz a všeho ostatního, nebo může-li se to opatřit, a má-li se tedy k válce přikročit, pak se má pán zaopatřit dobrými a zkušenými válečníky {Kriegßleuten}, zvláště pro válečné úřady {Kriegßamptern}, aby byly dobře obsazeny a opatřeny způsobilými osobami, jež budou válku řídit a vést. Válku pak ať ve jménu Božím svěří válečníkům, aby ji vedli a spravovali, a ne doktorům ani dlouhým sukním[^2], kteří do pole nepřijdou. A ať nechá válku probíhat tak dlouho, jak to potřeba vyžaduje, dokud nebude dovedena ke svému konci, ať už mocí, nebo smlouvou, jak se to zdaří. Má-li tedy pán takto vést válku, nemá se dát přemluvit, aby k ní použil svůj zemský lid, leda svou jízdu {Reisigenzeug} a tu pěchotu {Fußuolck}, kterou by měl a která by již předtím byla válečníky a táhla za válkami nebo tak dosud činí; avšak vyzbrojit a vyvést do pole zemský lid, který předtím, jak bylo řečeno, nebyl
poznamky:
- n: 1
  text: |-
    Něm. *zuuerheren* = *zu verheeren* (zpustošit, zničit), nikoli *verlieren*.
- n: 2
  text: |-
    „Doctorn noch langen Röcken“ – učencům, právníkům a civilním dvorským rádcům v dlouhých šatech či talárech, kteří se sami neúčastní polních tažení.
