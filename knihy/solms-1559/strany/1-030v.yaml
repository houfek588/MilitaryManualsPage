bloky:
- typ: odstavec
  de: |-
    Dieweil aber ein Krieg ein schwere sach ist / Landt vnd Leut darauff gesatzt vnnd gewagt sein mussen / ob es zu gluck oder zuuerlieren geraten wöl / soll man keinem Herrn bald in einen Krieg rathen der Landt vnd Leut hat / Würde sichs aber zutragen / daß sich ein sach darnach schicken wolt / daß es ein Krieg erfordern möchte / dann soll ein Herr sein Landtschafft bei einander fordern / jnen den fall vorhalten / vnd sie berathschlagen lassen / ob ein ander mittel dann den Krieg anzunemen gefunden möcht werden / würde dann ein mittel gefunden / daß es nicht zum Krieg kommen darff / dann ist es wol geraten / würde es aber dahin bedacht werden / daß mann einen Krieg vornemen můst / zu erhaltung der Landt oder dergleichen / so soll ein Herr als dann nemen Kriegßleut die den Krieg verstehen / sie seien auß den Landen oder frembden / so ein vertrawen haben / vnnd mit denselbigen den Krieg weitter berathschlagen vnnd ordnen lassen auff ein summa Kriegßuolck / was mann darzů zuhaben vermeint / es sei zu roß oder zu fuß / vnd was zu solchem Krieg von rüstung von nöten ist.
  cs: |-
    Poněvadž však válka je těžká věc, v níž musí být vsazeny a dány v sázku země i lidé, ať už se to obrátí ke štěstí nebo ke ztrátě, nemá se žádnému pánovi, jenž má země a lidi, jen tak radit do války. Přihodilo-li by se však, že by se věc chýlila k tomu, že by mohla vyžadovat válku, tehdy má pán svolat své zemské stavy, předložit jim ten případ a nechat je poradit se, zda by se nedal nalézt jiný prostředek než sáhnout k válce. Nalezne-li se pak prostředek, aby k válce nemuselo dojít, tehdy je to dobře vyřešeno; dospělo-li by se však k tomu, že se válka musí podniknout k zachování zemí nebo z podobné příčiny, má si pán tehdy vzít vojáky {Kriegßleut}, kteří válce rozumějí – ať jsou z jeho zemí nebo cizí, kteří požívají důvěry – a dát s nimi válku dále projednat a rozvrhnout na určitý počet válečného lidu {Kriegßuolck}, kolik se ho k tomu zamýšlí mít, ať na koni či pěšky, a jaká výzbroj {rüstung} je k takové válce zapotřebí.
- typ: odstavec
  de: |-
    Wann dann solches geordnet vnd inn anschlag gebracht / dann soll mann solchs rechnen / vnd in ein summa des gelts stellen / so mit der zeit darauff gehn wirt / vnd als dann mit der landtschafft wider berathschlagen / ob sie solchs gelt bei sich vermögen oder auff zubringen vnd zuerhalten wissen. Vnd im fall so sie das zu erhalten nit finden mögen / daß alßdan weg gesucht würden etwan durch mittel personen / die es zu einem leidtlichen vertrag bringen möchten / oder zu eim andern rechtlichen außgang / damit es on Krieg vnd verderbung der landt kome. Solts aber den Krieg vorzunemen bewilligt vnnd gerathen werden / vnd mann mit dem gelt vnnd anderm darzů gefaßt were oder werden möcht / vnd also vorgenomen solt werden / dann sol der Herr sich mit gůten verstendigen Kriegßleuten verfassen vnnd versehen / besonder zu den Kriegßamptern / daß die wol mit tüglichen Personen bestellet vnd versehen werden / darmit der Krieg geregieret vnd gefürt werde / vnd beuelhe dann den Krieg den Kriegßleuten zu füren vnd zuuerwalten / in dem namen Gottes / vnd nicht den Doctorn noch langen Röcken / die nicht darbei kommen / vnnd laß den Krieg also vorgehn so lang die notturfft das erfordert / biß zu seim end gebracht vnd gefürt wirt / es geschehe mit gewalt oder vertrag / wie das geraten mag. So eim Herrn dann also ein Krieg zufürn geriet / dann soll er sich nit bereden lassen / daß er sein landtuolck darzů gebrauche / dann seinen Reisigenzeug / vnd was er für Fůßuolck hett / das vorhin Kriegßleut wern / den Kriegen nachgezogen hetten oder noch thetten / aber ein landtuolck zurüsten vnd außzufürn dz nit vorhin / wie gemelt /
  cs: |-
    Když se to pak rozvrhne a sestaví se rozpočet, má se to spočítat a vyjádřit peněžní sumou, která na to postupem času padne, a potom se znovu poradit se zemskými stavy, zda takové peníze u sebe mají či jak je dokážou opatřit a udržovat. A v případě, že by shledali, že na to nestačí, mají se tehdy hledat cesty třeba skrze prostředníky, kteří by to mohli dovést k snesitelné smlouvě nebo k jinému právnímu vyústění, aby se to obešlo bez války a zkázy zemí. Bylo-li by však schváleno a doporučeno válku podniknout a byli-li by opatřeni či mohli-li by být opatřeni penězi i ostatním k tomu potřebným, a mělo se tak k ní přikročit, tehdy se má pán zaopatřit dobrými zkušenými vojáky, zvláště pro válečné úřady, aby byly dobře obsazeny a opatřeny způsobilými osobami, aby byla válka řízena a vedena, a ať pak ve jménu Božím poručí válku vést a spravovat vojákům, a nikoli doktorům ani dlouhým sukním,[^1] kteří do pole nejdou; a nechť nechá válku takto postupovat, dokud to nutnost vyžaduje, až bude dovedena a přivedena ke svému konci, ať už se tak stane mocí nebo smlouvou, jak se to zdaří. Přikročí-li tedy pán takto k vedení války, nemá se dát přemluvit, aby k tomu použil svůj zemský lid, vyjma svou jízdu {Reisigenzeug} a to, co by měl za pěchotu {Fůßuolck}, která by již dříve byla vojáky, táhla za válkami nebo tak dosud činila; avšak vyzbrojit a vyvést do pole zemský lid, který předtím, jak bylo řečeno, nebyl
poznamky:
- n: 1
  text: |-
    „Doctorn noch langen Röcken“ – učencům, právníkům a civilním dvorským rádcům v dlouhých šatech či talárech, kteří se sami neúčastní polních tažení.
