id: 3-047v
list: '47'
strana: verso
sken: 346
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Wiltu gůt feur Kugeln machen die mann auß der Büchsen scheußt / so nim Büchsen Puluer / als vil du wilt / vnnd knet das mit gebrantem wein / mach einn senbeln deig darauß als ein Kugel / nim dör heßlein stäblein vnd stoß durch die Kugeln / die stäblein sollen so groß sein als ein federkil / vnnd solt die Kugel vberziehen mit barchen / sie dann inn Schwefel schwemen darnach vberziehen mit Deig / der mit Salpeter vnnd Schwefel wol gemischt sei / vnnd vberzeuch das aber mit barchen / vnd dann wider mit dem vorigen deig / zum letsten mal vber zeuch sie mit zwillichen loden / vnd mit eisern dreten Creutzweiß / darnach schwemb die Kugel in halb schwefel vnnd halb hartz / vnd wenn sie also bereith ist so bor mit einem nebiger Creutzweiß dardurch / vnd wenn du schiessen wilt / so bor aber ein löchlein durch den klotz / das die löchlein gleich gegen einander stehen / vnnd nim denn ein kleins rütlein / stoß es durch die Kugel / vnd durch den klotz in das Puluer / das es aneinander gleich zusag / vnd zindt denn die Büchsen an.
  cs: |-
    Chceš-li zhotovit dobré ohnivé koule {feur Kugeln}, jež se střílejí z děla {Büchsen}, vezmi střelného prachu {Büchsen Puluer}, kolik chceš, a uhněť jej s páleným vínem; udělej z toho kulaté těsto[^1] jako kouli {Kugel}, vezmi suché lískové hůlky a prostrč je skrz kouli – ty hůlky mají být silné jako brk. Kouli potáhni barchetem, namoč ji pak v síře {Schwefel} a poté ji potáhni těstem dobře smíchaným s ledkem {Salpeter} a sírou; znovu ji potáhni barchetem a pak opět předešlým těstem, a naposledy ji potáhni hrubým cvilinkovým suknem a oviň křížem železnými dráty. Poté kouli namoč ve směsi poloviny síry a poloviny pryskyřice; a když je takto hotova, provrtej ji nebozezem křížem skrz naskrz. Když pak chceš střílet, vyvrtej rovněž otvůrek skrz zátku {klotz}, aby oba otvůrky stály přesně proti sobě, vezmi pak tenký proutek a prostrč jej skrz kouli a skrz zátku až do prachu, aby na sebe přesně navazovaly, a pak dělo zapal.
- typ: nadpis
  uroven: 3
  de: Wiltu ein schrecklichen Schoß thun.
  cs: Chceš-li vypálit strašlivou ránu.
- typ: odstavec
  de: |-
    SO nim Pappir / vnd leim das vber einander / als groß der klotz sein soll / vnnd schlach den klotz nicht auff das Puluer / auch nicht gar in das Ror der Büchsen / vnd lade den stein vorn klotz verstopff den stein / dieselben Büchsen schlach ob von dem stein mit einem verwichsten tůch / richt die Büchsen inn gleichs gewicht / vnd zinde sie an / thůt der stein vber hundert sprüng / vnd die Büchsen soll vorn an dick sein / vnd wol eingeschlagen / vnnd nicht für den stein auffgehn.
  cs: |-
    Vezmi tedy papír a slep jej na sebe tak velký, jak velká má být zátka; nezarážej však zátku až na prach, ani docela hluboko do hlavně {Ror} děla, a nabij kámen {stein} před zátku a utěsni jej. Tuto hlaveň pak u kamene uzavři[^2] povoskovaným plátnem, nastav dělo vodorovně a zapal je – kámen udělá přes sto odskoků; dělo však má být vpředu silné a [ucpávka] dobře zaražena, aby nevyletěla dříve než kámen.[^3]
- typ: nadpis
  uroven: 3
  de: Nun steht hernach geschriben ein gar heffliche kunst wie ein Meister des nachs schiessen soll / vnd das wissen mag wo er hin geschossen hat.
  cs: Nyní je níže popsáno velmi znamenité umění,[^4] jak má mistr střílet v noci a vědět, kam zasáhl.
- typ: odstavec
  de: |-
    NIm zehen pfundt hartz / vnd 1. pfundt jnßlet / vnd zulasse das in einem kessel / vnnd dunck den stein darein / vnnd nim jhn bald darauß / werff inn ein Büchsen Puluer / das hecket vnd weichet sich in dem hartz / vnd darnach soltu die Büchsen damit laden / vnd denn stein mit hadern wol verstopffen / vnnd scheuß wenn du wilt so sichstu den stein brennend von der Büchsen faren / du darfft den stein nicht anzinden / wenn er wirt selber brinnend / von der Büchsen vorn von dem feur des Puluers.
  cs: |-
    Vezmi deset liber {pfundt} pryskyřice a 1 libru loje, rozpusť to v kotli, ponoř do toho kámen, rychle jej vyjmi a vhoď jej do střelného prachu, který se k pryskyřici přichytí a vsákne do ní. Potom tím nabij dělo, dobře utěsni kámen hadry a vystřel, kdy chceš – uvidíš kámen letět hořící z děla; kámen nemusíš předem zapalovat, neboť se sám vznítí vpředu u ústí děla od ohně prachu.
poznamky:
- n: 1
  text: |-
    Hornoněmecké nářeční *senbel* (*sinwel*) znamená „okrouhlý, kulatý“.
- n: 2
  text: |-
    *dieselben Büchsen schlach ob von dem stein mit einem verwichsten tůch* – zřejmě zkomolený obrat ve smyslu „uzavři hlaveň před kamenem navoskovaným plátnem“.
- n: 3
  text: |-
    Podmět v tisku chybí (*vnd wol eingeschlagen / vnnd nicht für den stein auffgehn*); patrně jde o ucpávku z navoskovaného plátna, nikoli o papírovou zátku, která se naopak nemá zarážet až na prach.
- n: 4
  text: |-
    V tisku zjevné překlepy *heffliche* (místo *höffliche* – „znamenité, vznešené“) a *des nachs* (vypadlé *-t-* místo *des nachts* – „v noci“).
