bloky:
- typ: odstavec
  de: |-
    DIse hieuor Figur mit I. verzeichnet/ ist ein Wasserplaßbalch vnd zugebrauchen/ so mann ein stolle zu eim vndergraben treiben/ vnd dieselbig Gruben oder Stol wasser haben wirdt/ so mag mann in der Gruben vnnd nit heraussen am tage/ ein Loch vndersich sencken/ so tieff als mann vermeint vndersich zu faren/ vnd solchen Blaßbalch vnd Loch in der Krafft aufflegen/ vnnd von dannen des Blaßbalchs ein Ror vnden in die Gruben gesenckt/ welches Ror oben im Balg ein windtuentel haben/ deßgleichen vnden im wasser auch eins/ so mann den Balg auffziehen/ vnd er das wasser noch in jm auff in die höhe ziehen wirt/ alßdan so mann den Balg wider niderlest fallen die ventel für/ verschliessen das wasser das es nicht wider zuruck vndersich fallen mag/ vnd wann mann den balg widerumb wirt auffziehen/ alßdan so heben sich die ventel der Lufft nach widerumb vff/ vnd ziehen wider Wasser in die höche gleich wie vor/ so stöst daß selbig newe gehaben wasser/ das ander wasser so nach in der Rörn were als zu der fordern rörn des Balgs hinauß in gang/ also mag mann ein wasser stil schweigent vnd verborgen außheben/ damit mann als fürt graben mag.
  cs: |-
    Předchozí vyobrazení označené `I` je vodní měch {Wasserplaßbalch}. Užívá se, když se pro podkop razí štola {stolle} a tato jáma či štola má vodu: tehdy lze v jámě, a ne venku na povrchu, vyhloubit otvor dolů tak hluboko, jak se zamýšlí sestoupit, nad tento otvor v chodbě {Krafft}[^1] položit měch a od měchu spustit dolů do jámy trubici. Ta má mít nahoře v měchu vzduchovou záklopku {windtuentel} a stejně tak jednu dole ve vodě. Když se měch roztáhne vzhůru, nasaje do sebe vodu do výšky; když se pak opět stlačí dolů, záklopky zapadnou a uzavřou vodu, aby nemohla stéct zpět dolů. Když se měch znovu roztáhne, záklopky se proudem vzduchu opět zvednou a natáhnou vodu nahoru jako předtím; tato nově nasátá voda pak vytlačí ostatní vodu, která ještě byla v trubici, přední hubicí měchu ven do chodby. Tak lze vodu tiše a skrytě odčerpávat a stále kopat kupředu.
- typ: odstavec
  de: |-
    Vnd ferner zeigt dise Figur mit K. signirt an/ wie man von leder Rörn machen sol/ gleich wie die Rörn da mann wein durch ablest/ vnd dieselbigen Rörn sollen an einem ort ein weitte haben/ darmit eine in die andern Rörn zustecken sei vnd so lang als mann dasselbig von nöten ist/ zu dem Stoln herauß/ vnnd solche Rörn so mann die legen wirt/ sollen sie mit Bech in einander wol versteckt vnd verbicht sein/ vnnd dieselbige rörn die sollen mit Puluer außgefült werden biß gar herfür/ vnnd hinden in die Gruben soll mann das Puluer setzen/ mit donnen souil als der von nöten sein wirt/ vnd dieselbigen donen sollen auch zum gehebsten damit kein wasser vnden hinin seigt verbicht sein/ Vnd solche Rörn sollen also in ein donn oder zwo eingesteckt werden vnnd auch verbicht/ vnd die donen sollen oben auff einem Boden offen sein/ darmit das Fewer flucks hinein schlagen mög/ vnd so die donn mit dem Puluer also noch jrer notturfft gesetzt würde/ sol mann die ledern Rörn ein breitten kasten darin sie liegen herauß machen biß gegen tag/ vnd solcher Kast soll wie volgt gemacht werden/ als nemlich soll mann ein Bret nemen/ vnd auff dasselbig Bret zwo leisten neben einander fest nageln/ die so hoch als die ledern rörn sind/ vnd dan sollen sie die Rörn in denselbigen Kasten legen vnnd oben mit einem Bret darauff wider zunageln/ das thut mann also lang alß die Rörn sind/ biß mann herauß gegen tag kömpt/ zu einer mehrer versicherung mag mann den Kasten da die rörn innen
  cs: |-
    Dále ukazuje toto vyobrazení označené `K`, jak se mají dělat kožené trubice {ledern Rörn}, podobné hadicím, jimiž se stáčí víno. Na jednom konci mají být rozšířené, aby se jedna dala zastrčit do druhé, a mohou být tak dlouhé, jak je potřeba ven ze štoly. Při kladení se mají do sebe dobře zasunout a zalít smůlou {Bech} a naplnit se prachem {Puluer} až docela dopředu. Vzadu v jámě se uloží prach v tolika soudcích {donnen}, kolik bude potřeba, a i ty mají být co nejtěsněji zasmoleny, aby do nich zespodu neprosakovala voda. Trubice se zastrčí do jednoho či dvou soudků a rovněž se zasmolí; soudky mají být nahoře na jednom dnu otevřené, aby do nich oheň rázem vnikl. Když jsou soudky s prachem podle potřeby uloženy, má se pro kožené trubice zhotovit široký žlab {kasten}, v němž budou ležet, a to až ven na denní světlo. Žlab se udělá takto: vezme se prkno a vedle sebe se na ně pevně přibijí dvě lišty, vysoké jako kožené trubice; pak se trubice do žlabu vloží a shora se zase přitlučou prknem. Tak se postupuje po celé délce trubic, až se vyjde ven na povrch. Pro větší jistotu lze žlab, v němž trubice
poznamky:
- n: 1
  text: |-
    Tisk má „in der Krafft“, zřejmě jen tiskovou záměnu za *Grafft* („podkopová chodba“), jak se slovo píše jinde v této knize.
