bloky:
- typ: odstavec
  de: |-
    DIse hieuor Figur mit I. verzeichnet/ ist ein Wasserplaßbalch vnd zugebrauchen/ so mann ein stolle zu eim vndergraben treiben/ vnd dieselbig Gruben oder Stol wasser haben wirdt/ so mag mann in der Gruben vnnd nit heraussen am tage/ ein Loch vndersich sencken/ so tieff als mann vermeint vndersich zu faren/ vnd solchen Blaßbalch vnd Loch in der Krafft aufflegen/ vnnd von dannen des Blaßbalchs ein Ror vnden in die Gruben gesenckt/ welches Ror oben im Balg ein windtuentel haben/ deßgleichen vnden im wasser auch eins/ so mann den Balg auffziehen/ vnd er das wasser noch in jm auff in die höhe ziehen wirt/ alßdan so mann den Balg wider niderlest fallen die ventel für/ verschliessen das wasser das es nicht wider zuruck vndersich fallen mag/ vnd wañ mann den balg widerumb wirt auffziehen/ alßdan so heben sich die ventel der Lufft nach widerumb vff/ vnd ziehen wider Wasser in die höche gleich wie vor/ so stöst daß selbig newe gehaben wasser/ das ander wasser so nach in der Rörn were als zu der fordern rörn des Balgs hinauß in gang/ also mag mann ein wasser stil schweigent vñ verborgen außheben/ damit mann als fürt graben mag.
  cs: |-
    Toto předchozí vyobrazení označené `I` jest vodní měch {Wasserplaßbalch} a slouží k tomu, když se razí štola {Stol} pro podkop a tato jáma či štola má vodu: tehdy lze v jámě – a nikoli venku na povrchu – prohloubit jámu dolů tak hluboko, jak se zamýšlí sestoupit, a na ten otvor v chodbě položit takový měch; od měchu se pak spustí dolů do jámy trubice, jež má mít nahoře v měchu vzduchovou záklopku a rovněž dole ve vodě jednu. Když se měch vytáhne vzhůru, nasaje do sebe vodu do výšky; jakmile se pak měch opět spustí dolů, záklopky spadnou před proud a uzavřou vodu, aby nemohla spadnout zpět dolů. A když se měch opět zdvihne, záklopky se vzduchem znovu otevřou a natáhnou nahoru další vodu stejně jako dříve; tak tato nově vytažená voda vytlačí přední hubicí měchu do odtoku ostatní vodu, která ještě byla v trubici. Takto lze tiše, mlčky a skrytě odčerpávat vodu, aby bylo možno stále kopat kupředu.
- typ: odstavec
  de: |-
    Vnd ferner zeigt dise Figur mit K. signirt an/ wie man von leder Rörn machen sol/ gleich wie die Rörn da mann wein durch ablest/ vnd dieselbigen Rörn sollen an einem ort ein weitte haben/ darmit eine in die andern Rörn zustecken sei vnd so lang als mann dasselbig von nöten ist/ zu dem Stoln herauß/ vnnd solche Rörn so mann die legen wirt/ sollen sie mit Bech in einander wol versteckt vnd verbicht sein/ vnnd dieselbige rörn die sollen mit Puluer außgefült werden biß gar herfür/ vnnd hinden in die Gruben soll mann das Puluer setzen/ mit donnen souil als der von nöten sein wirt/ vnd dieselbigen donen sollen auch zum gehebsten damit kein wasser vnden hinin seigt verbicht sein/ Vnd solche Rörn sollen also in ein donn oder zwo eingesteckt werden vnnd auch verbicht/ vnd die donen sollen oben auff einem Boden offen sein/ darmit das Fewer flucks hinein schlagen mög/ vnd so die donn mit dem Puluer also noch jrer notturfft gesetzt würde/ sol mann die ledern Rörn ein breitten kasten darin sie liegen herauß machen biß gegen tag/ vnd solcher Kast soll wie volgt gemacht werden/ als nemlich soll mann ein Bret nemen/ vnd auff dasselbig Bret zwo leisten neben einander fest nageln/ die so hoch als die ledern rörn sind/ vnd dan sollen sie die Rörn in denselbigen Kasten legen vnnd oben mit einem Bret darauff wider zunageln/ das thut mann also lang alß die Rörn sind/ biß mann herauß gegen tag kömpt/ zu einer mehrer versicherung mag mañ den Kasten da die rörn innen
  cs: |-
    Dále pak ukazuje toto vyobrazení označené `K`, jak se mají dělat kožené trubice {ledern Rörn}, podobné trubicím, jimiž se stáčí víno: tyto trubice mají mít na jednom konci rozšíření, aby se jedna dala zastrčit do druhé a mohly být tak dlouhé, jak jen je zapotřebí ven ze štoly. Když se tyto trubice budou klást, mají být do sebe smůlou {Bech} dobře zasazeny a zasmoleny, a mají být naplněny prachem {Puluer} až docela dopředu; vzadu v komoře se uloží prach v tolika soudcích, kolik bude potřeba, a tyto soudky mají být rovněž co nejtěsněji zasmoleny, aby do nich zespodu neprosakovala voda. Tyto trubice se tedy zastrčí do jednoho či dvou soudků a rovněž se zasmolí; soudky mají být nahoře na jednom dnu otevřené, aby do nich oheň mohl rázem vniknout. Jakmile jsou soudky s prachem podle potřeby uloženy, má se pro kožené trubice vyrobit až na denní světlo prkenný žlab, v němž budou ležet, a takový žlab se zhotoví takto: vezme se prkno a vedle sebe se na něj pevně přibijí dvě lišty tak vysoké, jako jsou kožené trubice; pak se trubice položí do toho žlabu a shora se opět přitlučou prknem. Tak se pokračuje po celé délce trubic, až se vyjde ven na povrch; pro ještě větší jistotu lze žlab, v němž trubice
