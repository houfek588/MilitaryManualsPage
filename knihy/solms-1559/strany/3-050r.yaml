strana: recto
sken: 351
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    denn aber mit dem vorgeschriben leim / vnder das die Büchsen vol werdt / schlag sie mit einem tribel fast wol auffeinander / lug das du die Büchs fast wol versorgest / das nichts vor darinn sei / vnd zündt sie dann an.
  cs: |-
    opět předepsanou hlínou, až bude dělo {Büchsen} plné;[^1] napěchuj je dřevěným pěchovákem velmi pevně na sebe, hleď dělo velmi dobře ošetřit, aby v něm nic předem nezůstalo, a pak je zapal.
- typ: nadpis
  uroven: 3
  de: Wie mann ein Igel schiessen soll vnter das volck / etc.
  cs: Jak se má mezi lid střílet ježek {Igel}[^2] atd.
- typ: odstavec
  de: |-
    WIltu ein Igel schiessen von vier hundert stücken / nach dem als die Büchsen groß ist / so lad die Büchsen gar fast mit einem Büchsen klotz / heiß dir ein eiseren peck machen vor den klotz / vnd abschroten / souil eiseren stücklein als du denn verschiessen wilt / lad die hert für das pecklin / das vor dem klotz ist.
  cs: |-
    Chceš-li vystřelit ježka o čtyřech stech kouscích, podle toho, jak je dělo veliké, nabij dělo velmi pevně dělovou zátkou {klotz}, nech si před zátku zhotovit železnou misku[^3] a nasekat tolik železných kousků, kolik jich chceš vystřelit, a nabij je těsně před tu mističku, která je před zátkou.
- typ: nadpis
  uroven: 3
  de: Wie mann ein starck wasser machen soll / damit mann so wol kan schiessen / als mit starckem Puluer / etc.
  cs: Jak se má dělat silná voda, kterou lze střílet stejně dobře jako silným střelným prachem {Puluer} atd.
- typ: odstavec
  de: |-
    NIm Salpeter vnd distillier den zu wasser / vnnd den Schwefel zu öle / Salarmoniac auch zu wasser / nim oleum Benedictum auch darzů / als du wirst hören / vnd wenn du dise wasser alle gehaben magst so nim 6. theil Salpeter wasser / 2. theil Schwefel öl / 2. theil Salarmoniac wasser / 2. theil de Oleo Benedicto / vnd lad die Büchsen fast wol / mit klötzen stein oder mit wem du schiessen wilt / vnd menge die wasser gar vnter einander / geuß das in die Büchsen / ein zehentheil / röres hinder den klotz / vnd zündt sie an mit zunter / das du dauon kommen magst / lug das die Büchs sehr starck sei / vnd mit disem wasser scheustu ein gemein schoß mehr dann drei tausent schrit weit.
  cs: |-
    Vezmi ledek {Salpeter} a předestiluj jej na vodu, síru {Schwefel} na olej a salmiak rovněž na vodu; přidej k tomu také *Oleum benedictum*, jak uslyšíš. A když budeš mít všechny tyto vody pohromadě, vezmi 6 dílů ledkové vody, 2 díly sírového oleje, 2 díly salmiakové vody a 2 díly oleje *Oleum benedictum*. Nabij dělo velmi pevně zátkami, kamenem {stein} nebo čím chceš střílet, smíchej ty vody důkladně dohromady, nalij je do děla za zátku na jednu desetinu délky hlavně,[^4] a zapal je troudem, abys mohl odstoupit; hleď však, aby dělo bylo velmi silné – s touto vodou vystřelíš obyčejnou ránu dále než tři tisíce kroků {schrit}.
- typ: nadpis
  uroven: 3
  de: Wie weit mann mit einem gemeinen Puluer ein gemeinen schoß schiessen mag.
  cs: Jak daleko lze obyčejným prachem vystřelit obyčejnou ránu.
- typ: odstavec
  de: |-
    EIn gemein schoß von Büchsen vnd Puluer / ist fünfftzehen hundert schrit lang / oder weit in derselben maß / oder von gestercktem Puluer scheust man wol zwei Tausent schrit weit oder in derselben maß.
  cs: |-
    Obyčejný výstřel z děla a prachu je dlouhý či daleký patnáct set kroků v téže míře; zesíleným prachem pak se dostřelí jistě dva tisíce kroků daleko nebo v téže míře.
- typ: nadpis
  uroven: 3
  de: Keiner Büchsen ist zuuertrawen sie sei groß oder klein.
  cs: Žádnému dělu není radno důvěřovat, ať je veliké či malé.
poznamky:
- n: 1
  text: |-
    V záhlaví tisku je na tomto listu chybně vytištěno číslo listu *70* namísto správného *50*.
- n: 2
  text: |-
    *Igel* („ježek“) zde označuje kartáčovou náplň ze stovek nasekaných kousků železa, jež se při výstřelu rozletí do šířky proti živé síle.
- n: 3
  text: |-
    *eiseren peck* / *pecklin* – železná miska či plochá destička (*Becken* / *Blech*), která se vkládá mezi dřevěnou zátku a sekané železo.
- n: 4
  text: |-
    V tisku stojí *ein zehentheil / röres* (snad genitiv *Rores*, tj. desetina délky hlavně, případně zkomoleně *rühr es* „zamíchej to“).
