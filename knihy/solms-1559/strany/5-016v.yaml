bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vnd Pessen gelegen weren/ daß sie die verwaren/ vnd durch zuziehen wehren möchten/ so were solchs gůt/ vnd wan es dann ein paß were/ der einer stat ie zubewarn zu weitleufftig ist/ so mag man der zu hilff neben eins oder zwei Blochauß/ was die notturfft erfordert/ machen/ vnd darzwischen vergraben vnd verhegen/ gleich wie die alten Teutschen gethan haben/ dem nach sie inn den Wälden/ Gemösen vnd Gebürgen gelegen/ vnd die Landt noch nit gebawet sind gewesen/ vnd sich der Römer lang auffgehalten vnd erwehrt haben/ vnd on zweifel die zeit nach nit mit Blochäusern vnd der gestalt befestungen/ wie jetzund für handen vnd im gebrauch ist/ Derhalben sag ich daß solchen Zügen vnd streiffen wol zu wehrn were so die Befestung Blochäuser/ Vergrabung vnd verhegung der wält vorgenomen/ mit dem Geschütz vnd was darzů gehört/ nach notturfft versehn würde/ solches Geschütz vnd zugehörende röstung/ sollen in denen befestungen zugericht vnd mit allem vorrath darzu behalten werden/ biß zur zeit der not/ so hett mann das in eil zufüren vnd zu ordnen wo das hingehört/ doch soll jedes Geschütz mit seiner zůgehörende in Blochhäuser oder andere wehr verordnet/ vnd beschreiben wo ein jedes hin gehört vñ geschafft sol werden das alle ding in gůter Ordnung stehn/ vñ mit darzů verordneten Leuten/ die solchs verwalten sollen.
  cs: |-
    a průsmyků ležela, aby je střežila a bránila průchodu, bylo by to dobré. A kdyby šlo o průsmyk {Paß}, který by přece jen byl pro jedno město k obraně příliš rozlehlý, lze mu ku pomoci postavit vedle jeden či dva sruby {Blochhaus}, jak potřeba žádá, a prostor mezi nimi prokopat příkopy a zahradit záseky, právě tak jako činili staří Germáni, když leželi v lesích, bažinách a horách, kdy země ještě nebyly vzdělány, a dlouho se před Římany zdržovali a ubránili – a bez pochyby tehdy ještě bez srubů a takových opevnění, jaká jsou dnes po ruce a v užívání. Proto pravím, že takovým tažením a nájezdům by se dalo dobře čelit, kdyby se přistoupilo k opevňování sruby, prokopáváním a zasekáváním lesů a opatřily se děly {Geschütz} a tím, co k nim náleží, podle potřeby. Taková děla a příslušná výzbroj {Rüstung} mají být připravena v těch pevnostech a držena tam se vší zásobou až do chvíle nouze – pak je bude možné spěšně vyvézt a rozestavit tam, kam náležejí. Každé dělo s příslušenstvím však má být přiděleno do srubů či jiných obran a má být zapsáno, kam které patří a má být dopraveno, aby všechny věci stály v dobrém pořádku a s k tomu ustanovenými lidmi, kteří je mají spravovat.
- typ: odstavec
  de: |-
    Deßgleichen sollen Leut von den Landschafften inn solche Blochhäuser verordnet werden/ die im fall der not darinn ziehen vnnd liegen mit jrem darzů geordnetem Geschütz vnnd Büchsenmeistern/ daß auch die Blochäuser ein jedes sein eigen Hauß habe/ da solches Geschütz mit seiner zůgehörde röstung möcht drocken vnnd verwart stehn/ vnd das dem Geschütz seine stendt zu der wehr zugericht würden/ daß solches allezeit fertig were/ als mit jhren Brücken darauff sie stehn sollen/ solche kan mann machen/ daß mann die auß einander schlagen/ vnd vnder dach in das drocken legen kan.
  cs: |-
    Stejně tak mají být do takových srubů {Blochhaus} ustanoveni lidé ze zemských krajů, kteří se v případě nouze do nich nastěhují a zaujmou posádku s přidělenými děly a puškaři {Büchsenmeister}; také každý srub má mít svůj vlastní dům, kde by taková děla s příslušnou výbavou stála v suchu a pod ochranou, a pro děla se mají upravit stanoviště k obraně, aby byla vždy pohotová – totiž s ložnými dřevěnými podlahami {Brücken}, na nichž mají stát; ty se dají zhotovit tak, aby se daly rozebrat a uložit pod střechu do sucha.
- typ: odstavec
  de: |-
    Also soll ein jedes Blochauß mit seiner röstung zugericht/ bereit vnd geordnet sein/ wann mann es bedarff daß manns in der eil haben kündt/ vnd zu wissen ist wo ein jedes hin/ vnd warzů gehört.
  cs: |-
    Takto má být každý srub se svou výbavou upraven, připraven a uspořádán, aby když je ho zapotřebí, byl rázem k mání a bylo známo, kam co patří a k čemu slouží.
- typ: odstavec
  de: |-
    Deßgleichen sollen Bachofen vnnd Hauß auch darinn gemacht werden/ mit vorrat Holtz oder brant was mann darzů haben muß. Auch alle Prouiant võ gesalznem Flaysch/ Fisch/ Buttern/ Käß vñ Saltz darnach die gelegenhait der Landt das geben mag/ das also all ding wie kortz sichs zu tragen würde/ nach aller notturfft vorhanden vnd zugericht sei/ derhalben sollen die leut allzeit daruff geordnet sein/ das ein jeder sich darzů gerüst halten kan.
  cs: |-
    Rovněž se tam mají zřídit pekařské pece i dům se zásobou dřeva či paliva, čeho je jen zapotřebí; i všechen proviant {Prouiant} ze soleného masa, ryb, másla, sýra a soli, podle toho, jak to kraj může poskytnout, aby bez ohledu na to, jak náhle by to nastalo, bylo vše podle vší potřeby pohotově a připraveno; proto k tomu mají být lidé vždy určeni, aby se každý mohl držet v pohotovosti.
- typ: odstavec
  de: |-
    Das ich aber schreib von Blochäusern/ das hat ein grossen onderscheidt/
  cs: |-
    Že však píši o srubech {Blochhaus}, má to veliký rozdíl:
