bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vnd Pessen gelegen weren/ daß sie die verwaren/ vnd durch zuziehen wehren möchten/ so were solchs gůt/ vnd wan es dann ein paß were/ der einer stat ie zubewarn zu weitleufftig ist/ so mag man der zu hilff neben eins oder zwei Blochauß/ was die notturfft erfordert/ machen/ vnd darzwischen vergraben vnd verhegen/ gleich wie die alten Teutschen gethan haben/ dem nach sie inn den Wälden/ Gemösen vnd Gebürgen gelegen/ vnd die Landt noch nit gebawet sind gewesen/ vnd sich der Römer lang auffgehalten vnd erwehrt haben/ vnd on zweifel die zeit nach nit mit Blochäusern vnd der gestalt befestungen/ wie jetzund für handen vnd im gebrauch ist/ Derhalben sag ich daß solchen Zügen vnd streiffen wol zu wehrn were so die Befestung Blochäuser/ Vergrabung vnd verhegung der wält vorgenomen/ mit dem Geschütz vnd was darzů gehört/ nach notturfft versehn würde/ solches Geschütz vnd zugehörende röstung/ sollen in denen befestungen zugericht vnd mit allem vorrath darzu behalten werden/ biß zur zeit der not/ so hett mann das in eil zufüren vnd zu ordnen wo das hingehört/ doch soll jedes Geschütz mit seiner zůgehörende in Blochhäuser oder andere wehr verordnet/ vnd beschreiben wo ein jedes hin gehört vnd geschafft sol werden das alle ding in gůter Ordnung stehn/ vnd mit darzů verordneten Leuten/ die solchs verwalten sollen.
  cs: |-
    a průsmyků, aby je střežila a mohla bránit průchodu, bylo by to dobré. A kdyby šlo o průsmyk, který by byl pro jedno město k uhájení příliš rozlehlý, lze mu na pomoc postavit vedle jeden nebo dva sruby {Blochauß}, jak potřeba žádá, a mezi nimi prokopat příkopy a udělat záseky {verhegen}, tak jako to činili staří Germáni, když sídlili v lesích, močálech a horách a země ještě nebyly vzdělány; tak se dlouho drželi a bránili proti Římanům – a bez pochyby tehdy ještě ne sruby a takovými opevněními, jaká jsou nyní po ruce a v užívání. Proto pravím, že takovým tažením a nájezdům by se dalo dobře bránit, kdyby se přistoupilo k opevnění, srubům, příkopům a zásekům v lesích a kdyby se to podle potřeby opatřilo děly {Geschütz} a tím, co k nim patří. Taková děla a příslušná výzbroj {röstung} se mají v těch pevnostech připravit a uchovávat se vší zásobou až do času nouze; pak by se dala rychle dopravit a rozmístit tam, kam patří. Každé dělo s příslušenstvím však má být přiděleno do srubů či jiných obranných míst a má se zapsat, kam které patří a kam se má dopravit, aby všechny věci byly v dobrém pořádku a měly k tomu ustanovené lidi, kteří je mají spravovat.
- typ: odstavec
  de: |-
    Deßgleichen sollen Leut von den Landschafften inn solche Blochhäuser verordnet werden/ die im fall der not darinn ziehen vnnd liegen mit jrem darzů geordnetem Geschütz vnnd Büchsenmeistern/ daß auch die Blochäuser ein jedes sein eigen Hauß habe/ da solches Geschütz mit seiner zůgehörde röstung möcht drocken vnnd verwart stehn/ vnd das dem Geschütz seine stendt zu der wehr zugericht würden/ daß solches allezeit fertig were/ als mit jhren Brücken darauff sie stehn sollen/ solche kan mann machen/ daß mann die auß einander schlagen/ vnd vnder dach in das drocken legen kan.
  cs: |-
    Stejně tak se mají do takových srubů ustanovit lidé ze zemských krajů {Landschafften}, kteří se tam v případě nouze nastěhují a budou v nich ležet s děly a puškaři {Büchsenmeistern}, kteří jsou jim k tomu přiděleni. Každý srub má mít také svůj vlastní dům, kde by děla s příslušnou výbavou mohla stát v suchu a v bezpečí. Pro děla se mají připravit stanoviště k obraně, aby byla vždy pohotová, totiž s podlahami {Brücken}, na nichž mají stát; ty lze zhotovit tak, aby se daly rozebrat a uložit pod střechu do sucha.
- typ: odstavec
  de: |-
    Also soll ein jedes Blochauß mit seiner röstung zugericht/ bereit vnd geordnet sein/ wann mann es bedarff daß manns in der eil haben kündt/ vnd zu wissen ist wo ein jedes hin/ vnd warzů gehört.
  cs: |-
    Takto má být každý srub se svou výbavou upraven, připraven a uspořádán, aby jej bylo možné v případě potřeby rychle mít k dispozici a aby se vědělo, kam co patří a k čemu slouží.
- typ: odstavec
  de: |-
    Deßgleichen sollen Bachofen vnnd Hauß auch darinn gemacht werden/ mit vorrat Holtz oder brant was mann darzů haben muß. Auch alle Prouiant von gesalznem Flaysch/ Fisch/ Buttern/ Käß vnd Saltz darnach die gelegenhait der Landt das geben mag/ das also all ding wie kortz sichs zu tragen würde/ nach aller notturfft vorhanden vnd zugericht sei/ derhalben sollen die leut allzeit daruff geordnet sein/ das ein jeder sich darzů gerüst halten kan.
  cs: |-
    Rovněž se v nich mají postavit pekařské pece a dům se zásobou dřeva čili paliva, kolik je ho třeba; také všechen proviant {Prouiant} – solené maso, ryby, máslo, sýr a sůl –, podle toho, co kraj může poskytnout, aby bylo všechno, jakkoli rychle by se to přihodilo, podle vší potřeby po ruce a připraveno. Proto k tomu mají být lidé vždy určeni, aby se každý mohl držet v pohotovosti.
- typ: odstavec
  de: Das ich aber schreib von Blochäusern/ das hat ein grossen
  cs: Pokud však píši o srubech, je mezi nimi veliký
