overeno_clovekem: false
bloky:
- typ: nadpis
  uroven: 2
  de: Volgt von Redern/ Scheiben/ Zögen vnd Hebzeugen.
  cs: |-
    Následuje o kolech, kotoučích {Scheiben}, kladkostrojích {Zögen} a zvedácích {Hebzeugen}.
- typ: odstavec
  de: |-
    DIeweil dann an der Artolorei/ Geschütz vnd rüstung eins grossen Hern Zeughauß so vil vnd hoch gelegen vnd darzů so vil Rüstung vnd zurichtung gehört vnd sein wil/ so ist hoch von nöten das ein Zeugmeister oder Artoloreimeister wol verstehe vnd wisse/ auch (wie hieuorn vermelt) leut habe die solches künden vnd verstehn/ vnd noch solchem drachte vnd zu wegen bring/ vnd selber die vnderricht/ lehrn vnd anweiß/ wie in der rechten Beschreibung desselbigen Ampts Bůch zu finden vnd klar angezeigt ist/ on not solchs widerumb zu erholen/ Dieweil aber doch (wie gemelt) in ein Zeughauß von Geschütz souil gehört/ hab ich nit vnderlassen wöllen solche stück ein jedes besonder inn den augenschein zubringen/ vnd darbei ein kurtzen bericht wie das verstanden soll werden/ dann der augenschein gibt der beschreibung vil bericht vnd verstandt/ daß mann durch dieselbigen Patron desto baß verstehn mag/ vnd ist auch dem Zeugmeister ein grosser behelff sein Werckleut damit anzuweisen/ wann sie den augenschein also mit seinen massen vnd gerechter kreiden vor jnhaben/ Also zeugt vnd macht ein Zeugmeister gůt Werckleut/ dann künden sie sich desto weniger entschůldigen/ wann sie gerechte Patron vor sich haben.
  cs: |-
    Poněvadž na dělostřelectvu {Artolorei}, dělech {Geschütz} a výzbroji {rüstung} zbrojnice {Zeughauß} velkého pána tolik a tak vysoce záleží a patří k nim tolik výzbroje a příprav, je nanejvýš nutné, aby tomu zbrojmistr {Zeugmeister} neboli mistr dělostřelectva {Artoloreimeister} dobře rozuměl a vyznal se v tom. Má také (jak bylo řečeno výše) mít lidi, kteří to umějí a chápou, o takové usilovat a opatřovat si je a sám je poučovat, učit a vést, jak je to k nalezení a jasně ukázáno v řádném popisu tohoto úřadu v knize; netřeba to tedy znovu opakovat. Protože však (jak řečeno) k dělům ve zbrojnici patří tolik věcí, nechtěl jsem opomenout předvést každý takový kus zvlášť názorně před oči spolu s krátkým výkladem, jak se mu má rozumět. Názorný obraz totiž popisu dodává mnoho vysvětlení a srozumitelnosti, takže podle těchto vzorů (*Patron*) lze vše tím lépe pochopit. Zbrojmistrovi je to také velkou pomocí při navádění jeho řemeslníků, mají-li před sebou takový obraz s jeho rozměry a správnými značkami (*kreiden*)[^1]. Tak si zbrojmistr vychová a vytvoří dobré řemeslníky; ti se pak také tím méně mohou vymlouvat, mají-li před sebou správné vzory.
- typ: odstavec
  de: |-
    Deßgleichen werden alle zeugdiener wann sie solche Patronn für sich haben auch desto geschickter/ vnd wissen den Arbeitern desto baß darauff zu sehen vnd einreden/ in der zeit alle sachen den Werckleuten in formen bestellen.
  cs: |-
    Stejně tak i všichni zbrojní služebníci {zeugdiener}, mají-li takové vzory před sebou, budou tím zručnější: dokážou na dělníky tím lépe dohlížet a mluvit jim do díla a včas řemeslníkům všechnu práci podle forem objednávat.
- typ: odstavec
  de: |-
    Darumb hab ich solche Figurn allein mit jren beschreibnngen vnd bericht gestalt/ wiewol inn dem rechten Bůch auch vil meldung daruon geschicht/ So will ich doch ein Figur nach der anderen beschreiben vnd jren bericht geben.
  cs: |-
    Proto jsem tyto figury sestavil zvlášť jen s jejich popisy[^2] a výkladem. Ačkoli se o nich mnoho zmiňuje i ve vlastní knize [o dělostřelectvu], chci přesto popsat jednu figuru po druhé a podat o ní výklad.
poznamky:
- n: 1
  text: |-
    *kreiden* – doslova „křídy“, tj. křídou vyznačené rysky a obrysy, podle nichž řemeslník pracuje; zde přeneseně správné značky a míry.
- n: 2
  text: V tisku *beschreibnngen* s obráceným *u* (*n*) místo *beschreibungen*.
