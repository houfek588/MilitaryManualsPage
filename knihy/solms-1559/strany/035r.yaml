bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    damit er sich mög in der zeit darnach in der Commiß schicken / Dieweil er aber mag in der Landschafft / von dem gemeynen Volck die Prouiant haben / vnd sie das auch vmb gebürlich gelt geben / so soll der Prouiantherr dieselbigen lassen gewerden / damit sie es auch geniessen / so bleiben sie gůtwillig / vnnd brengen zu wegen gnůg / das sonst nicht zuerharren ist.
  cs: |-
    aby se podle toho mohl včas zařídit v komisu {Commiß}. Dokud však může mít v krajině proviant {Prouiant} od prostého lidu a ti jej také dávají za náležité peníze, má je proviantní pán {Prouiantherr} nechat volně obchodovat, aby z toho rovněž měli užitek; tak zůstanou ochotní a seženou ho dostatek, čehož by jinak nebylo možno dosáhnout.
- typ: odstavec
  de: |-
    Vnd so ein Herr die Commiß brauchen můß / soll er doch dasselbig nicht vbersetzen / damit das Kriegsuolck nicht beschwert / vnd zůkommen mög / so mag ein Herr sie auch desto williger behalten.
  cs: |-
    A musí-li pán použít komis, nemá jej přesto předražovat, aby válečný lid {Kriegsuolck} nebyl přetěžován a mohl si jej opatřit; tak si jej pán udrží tím ochotnější.
- typ: odstavec
  de: |-
    Wo aber ein Herr zuhart mit der Prouiant vmbgehen / vnd zuuil geniessen will / so macht er ein vnwilligen hauffen / vertreibet das Leger / vnd was er vermeint an der Prouiant zugewinnen / das geht jm am Kriegsuolck doppel wider hin / vnd macht ein Herr jm ein böß gerücht / vnnd leßt sich ein ander mal niemands gern bestellen / sonder mit hoher Besoldung / das gewinnt ein Herr daran / Darumb ist ordnung vnd maß gůt.
  cs: |-
    Kde však pán zachází s proviantem příliš tvrdě a chce z něj mít nadměrný zisk, vyvolá nevrlost v houfu {hauffen}, rozežene ležení {Leger}, a co se domnívá na proviantu vydělat, o to dvojnásob přijde na válečném lidu; a navíc si pán udělá špatnou pověst, takže se příště nikdo nenechá rád najmout, leda za vysoký žold {Besoldung} – to je pak pánův výdělek; proto je dobrý řád a míra.
- typ: odstavec
  de: |-
    Derhalben soll ein Herr / der des Lands ein herr vnd mechtig ist / alle Kasten einnemen / sich einer billichen bezallung mit jhn vergleichen / vnd also den vorrat an allen orten vberschlagen / was er erhalten kan / vnd seine sachen darauff richten.
  cs: |-
    Proto má pán, který je pánem země a má ji v moci, převzít všechny sýpky, dohodnout se s nimi na spravedlivé platbě a tak na všech místech spočítat zásobu, kolik může uživit, a podle toho zařídit své věci.
- typ: odstavec
  de: |-
    Der Prouiantherr soll auch alle Haberkasten besehen / vberschlahen vnd einnemen / vnd den kauff auch machen das billich ist / vnnd darnach er denn Pferd zu fütern hat / soll er den Kasten ordnen / darnach ein Kasten groß ist / soll er pferd darauff ordnen / daß sie wissen / wo oder an welchem Kasten sie nemen sollen / Vnnd der Prouiant Herr soll auch darob sein vnd hart halten / daß dieselbigen / so die frücht haben vnd geben müssen / laut seiner Schatzung bezalt werden / würd aber das Leger von den Stätten kommen / so soll der Prouiantherr die Füterung dem Leger nachschaffen.
  cs: |-
    Proviantní pán má také prohlédnout, spočítat a převzít všechny sýpky s ovsem a rovněž sjednat spravedlivou cenu; a podle toho, kolik má koní ke krmení, má sýpky rozvrhnout – podle velikosti každé sýpky k ní má přidělit koně, aby věděli, kde a ze které sýpky mají brát. A proviantní pán má také dbát a přísně dohlížet na to, aby ti, kdo obilí mají a musejí je vydat, dostali zaplaceno podle jeho úředního odhadu; kdyby se pak ležení vzdálilo od měst, má proviantní pán zajistit dopravu píce {Füterung} za ležením.
- typ: odstavec
  de: |-
    Der Prouiantherr soll auch / so er jn die Stät kompt / mit den von den Stätten ein Ordnung machen / wie sie das Brot geben sollen / vnd von was gewicht / deßgleichen fleysch / vnnd was mann für gemeyn Prouiant vnd speiß bedarff. Es soll auch ein Herr / so er inn die Landt seiner Feinde kompt / was er von Landen / Stätten / Dörffern vnd Flecken erobert / das Prouiant hett oder geben kündt / verschonen / daß es nicht verbrent oder verwüst werde / sonder Brantschatzen vmb Prouiant / wo es sein mag / vnnd was sich gibt vnd zufürn will / soll mann alles verschon / so bleiben sie gůtwillig / vnd helffen das Leger halten vnd speisen / dann es wirdt manchs mal vil gůter Füterung verbrennet / da mann sich wol lang zeit von speisen kündt / des soll der
  cs: |-
    Proviantní pán má také, kdykoli přijde do měst, stanovit s měšťany řád, jak mají vydávat chléb a v jaké váze, stejně tak maso a vše, co je zapotřebí k běžnému proviantu a stravě. Rovněž má pán, když vstoupí do zemí svých nepřátel, ušetřit všechno, co dobude z krajů, měst, vesnic a městeček a co by mělo nebo mohlo vydat proviant, aby to nebylo vypáleno ani zpustošeno, nýbrž má na nich vymáhat výpalné {Brantschatzen} v proviantu, kdekoli je to možné; a každého, kdo se poddá a je ochoten zásoby dovážet, je třeba ušetřit, tak zůstanou povolní a pomohou ležení udržovat a živit. Mnohdy se totiž spálí mnoho dobré píce, z níž by se bylo možné po dlouhý čas živit; proto má
