bloky:
- typ: odstavec
  de: |-
    Deßgleichen sol er allen tag ein maß nemen/ wie die 24. stundt gefarn oder arbeit worden sei.
  cs: |-
    Stejně tak má každý den vzít míru, jak se za těch 24 hodin razilo a pracovalo.
- typ: odstavec
  de: |-
    Ein Schicht ist 4. stundt lang/ vnd so 4. stundt jr ende haben/ dann gehn andere arbeiter an/ die arbeiten auch ein Schicht/ das sind auch 4. stundt/ also geht es für vnd für biß 24. für komen/ das sind in den 24. stunden 6. Schichten/ die Schicht 6. stundt lang.
  cs: |-
    Jedna směna {Schicht} je 4 hodiny dlouhá, a když 4 hodiny uplynou, nastupují jiní dělníci a ti rovněž pracují jednu směnu, což jsou také 4 hodiny; tak to jde stále dokola, až se naplní 24 hodin, to jest za 24 hodin 6 směn, každá směna 6 hodin dlouhá.[^1]
