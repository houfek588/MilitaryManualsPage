poznamky:
- n: 1
  text: |-
    Zřejmý tiskový omyl na konci věty: „die Schicht 6. stundt lang“ místo *4. stundt lang* (6 × 4 = 24 hodin, jak Solms v téže větě sám uvádí).
- n: 2
  text: |-
    Zde i dále se počítá 1 zlatý (`fl.` / `flo.`) = 15 bacenů: 100 × 5 = 500 bacenů = 33 fl. 5 b. Součet 18 jmen levého sloupce dává přesně 100 směn. Horník *Christan thů kein gůt* nese přezdívku „Nedělá nic dobrého“.
- n: 3
  text: |-
    Patnáct jmen pravého sloupce nahoře dává jen 66 směn; s nimi se však zřejmě sčítá i sedm rubačů z levého sloupce dole (*Wolff Butz* až *Jörg Aschawer*, 7 × 5 = 35 směn), takže 66 + 35 = 101 směn a 101 × 6 = 606 bacenů = 40 fl. 6 b. přesně. Devět rubačů pravého sloupce dole (50 směn) s *Hanß Vogelßberger* na `5-010r` (6 směn) pak dává tamní součet 56 směn. Sazba sloupců tedy neodpovídá pořadí součtů (ověřeno ve skenu 454).
