poznamky:
- n: 1
  text: |-
    Zřejmý tiskový omyl na konci věty: „die Schicht 6. stundt lang“ místo správného *4. stundt lang* (6 × 4 = 24 hodin, jak sám Solms v téže větě uvádí).
- n: 2
  text: |-
    Zde i dále se počítá 1 zlatý (`fl.` / `flo.`) = 15 batzů: 100 × 5 = 500 batzů = 33 fl. 5 batzů. V seznamu figuruje horník s přezdívkou *Christan thů kein gůt* („Kristián Nezdárný“ / „Nic dobrého nedělá“).
- n: 3
  text: |-
    Součet 101 × 6 = 606 batzů = 40 fl. 6 batzů je početně přesný; vytištěná čísla u patnácti mužů pravého sloupce však dávají jen 66 směn (u posledních dvou jmen jsou vedle číslice 4 slabě otisknuté sazečské značky). Navazující seznam rubačů dole pokračuje vlevo sedmi muži po 5 směnách a vpravo devíti muži (u prvního jména *Vesper schambeck* poškozená číslice 3), k nimž na rubu (`5-010r`) přistupuje *Hanß Vogelszberger* (6) – pravý sloupec rubačů tak dává přesně 56 směn.
