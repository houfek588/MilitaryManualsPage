bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    stellen. Er soll sich auch in einem solchem trefflichen Zug zu ehrlicher geselschafft vnd Leuten thůn / die ampts verwaltung vnnd regirung haben / da kan er bei einem dise bei dem andern ein andere regirung sehen vnd lernen.
  cs: |-
    vydávat. Má se také na takovém znamenitém tažení {Zug} přidružovat k čestné společnosti a lidem, kteří mají správu a vedení úřadu; tam může u jednoho vidět a naučit se tuto správu a u druhého jinou.
- typ: odstavec
  de: |-
    Er soll auch ein fleissig achtung haben / wann etwas im feld gehandelt wirt / daß er dasselbig zu můssiger zeit fleissig beschreib / wie die selbig handlung / vnd durch was weg / so sie anders zu gůtem geraten / geschehen sei.
  cs: |-
    Má také pilně dávat pozor, když se něco koná v poli, aby si to ve volném čase pečlivě zapsal – jak se ten čin stal a jakou cestou, pokud ovšem dopadl dobře.
- typ: odstavec
  de: |-
    Her widerumb so etwan ein handlung im feld mißraten wirdt / daß er dieselbig gleich fals fleissig beschreib / vnd durch was vrsach odder vbersehung die mißratung zum vbel vnd schaden geschehen vnd kommen sei.
  cs: |-
    Naopak, nezdaří-li se někdy nějaký čin v poli, nechť si jej rovněž pečlivě zapíše a z jaké příčiny či přehlédnutím se ten nezdar ke zlému a ke škodě stal a přihodil.
- typ: odstavec
  de: |-
    Es soll auch allwegen ein junger gesell / der vmb ehren vnd lerens willen außzeucht / gedencken / daß er jm die zeit nutz mach / vnd kein zeit vergeblich hingehn laß / besonder wann er vergeblich zeit / daß er im feld nicht sein můß vnd nichts zu arbeiten / hat / daß er dann zu solcher ledigen zeit hin gehe in sein Losament / vnd wie hie vermelt / alle sachen zu dem fleissigsten beschreib / vnd in gedechtnuß bringe / dann solche vbung mit dem beschreiben bringt jhm warheit / einem jeden ein grossen behalt vnnd nach denckens.
  cs: |-
    Každý mladík, který táhne do pole pro čest a učení, má také vždy myslet na to, aby si čas učinil užitečným a žádnou chvíli nenechal uplynout nadarmo – zvláště když má prázdný čas, že nemusí být v poli a nemá nic na práci, nechť v takovém volném čase zajde do svého ubytování {Losament} a jak zde uvedeno, všechny věci co nejpilněji zapíše a uloží si do paměti; neboť takové cvičení v zapisování přináší vpravdě[^1] každému velikou paměť a hloubku rozvahy.
- typ: odstavec
  de: |-
    Dann zu solcher zeit vnd vbung kompt einer von böser vnd liederlicher gesellschafft / als mit spilen / trincken / vnnd andern leichtfertigen sachen / dardurch einer wol in grossen vnrat vnd schaden komen mag / vnd die gůt můssige zeit mit solchem vbel zubringen / vnnd doch jm solche zeit wol in allem gůtem hett mögen anlegen.
  cs: |-
    Neboť při takovém čase a cvičení se člověk uchrání zlé a lehkovážné společnosti, jako hraní, pití a jiných lehkomyslných věcí, kterými může upadnout do veliké nouze a škody a pěkný volný čas takovým zlem promarnit, ačkoli jej mohl dobře vynaložit na všechno dobré.
- typ: odstavec
  de: |-
    Das ist mein rath (lieber Son) den ich zu diser zeit dir zu deinem fürnemen in der kürtz geben kan / vnd bit du wöllest mein geringes bedencken vnd rath zu hertzen nemen / vnd nicht verachten / dann solt du (wils Gott) wol faren / vnd dein vorgenommene handlung vnd zeit mit ehrn vnd zu nutz hin bringen.
  cs: |-
    To je má rada, milý synu, kterou ti v tuto chvíli mohu v krátkosti dát k tvému předsevzetí, a prosím, abys mou skrovnou úvahu a radu vzal k srdci a nepohrdel jí; pak se ti (dá-li Bůh) bude dobře dařit a své předsevzaté počínání i čas strávíš se ctí a k užitku.
- typ: odstavec
  de: Ende des ersten Bůchs.
  cs: Konec první knihy.
poznamky:
- n: 1
  text: V tisku zjevná odchylka *jhm warheit* za *inn warheit* („vpravdě“).
