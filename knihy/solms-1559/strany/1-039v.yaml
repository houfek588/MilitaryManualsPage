bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    stellen. Er soll sich auch in einem solchem trefflichen Zug zu ehrlicher geselschafft vnd Leuten thůn / die ampts verwaltung vnnd regirung haben / da kan er bei einem dise bei dem andern ein andere regirung sehen vnd lernen.
  cs: |-
    vydávat. Na takovém významném tažení {Zug} se má také přidružit k čestné společnosti a k lidem, kteří mají na starosti správu a řízení úřadů; tam může u jednoho vidět a naučit se jeden způsob správy a u druhého jiný.
- typ: odstavec
  de: |-
    Er soll auch ein fleissig achtung haben / wann etwas im feld gehandelt wirt / daß er dasselbig zu můssiger zeit fleissig beschreib / wie die selbig handlung / vnd durch was weg / so sie anders zu gůtem geraten / geschehen sei.
  cs: |-
    Má také pilně dávat pozor, když se v poli něco podniká, aby si to ve volné chvíli pečlivě zapsal: jak k tomu činu došlo a jakou cestou, pokud ovšem dopadl dobře.
- typ: odstavec
  de: |-
    Her widerumb so etwan ein handlung im feld mißraten wirdt / daß er dieselbig gleich fals fleissig beschreib / vnd durch was vrsach odder vbersehung die mißratung zum vbel vnd schaden geschehen vnd kommen sei.
  cs: |-
    A naopak, nezdaří-li se někdy v poli nějaký čin, ať si ho rovněž pečlivě zapíše, i to, z jaké příčiny či kvůli jakému přehlédnutí se nezdar obrátil ke zlému a ke škodě.
- typ: odstavec
  de: |-
    Es soll auch allwegen ein junger gesell / der vmb ehren vnd lerens willen außzeucht / gedencken / daß er jm die zeit nutz mach / vnd kein zeit vergeblich hingehn laß / besonder wann er vergeblich zeit / daß er im feld nicht sein můß vnd nichts zu arbeiten / hat / daß er dann zu solcher ledigen zeit hin gehe in sein Losament / vnd wie hie vermelt / alle sachen zu dem fleissigsten beschreib / vnd in gedechtnuß bringe / dann solche vbung mit dem beschreiben bringt jhm warheit / einem jeden einen grossen behalt vnnd nach denckens.
  cs: |-
    Mladík, který táhne do pole pro čest a pro učení, má také vždy pamatovat, aby svůj čas využil k užitku a žádnou chvíli nenechal uplynout nadarmo. Zvláště když má volný čas, protože nemusí být v poli a nemá co dělat, ať v takové volné chvíli zajde do svého ubytování {Losament} a, jak zde řečeno, všechno co nejpečlivěji zapíše a uloží do paměti. Takové cvičení v zapisování totiž každému vpravdě[^1] přináší dobrou paměť a schopnost rozvahy.
- typ: odstavec
  de: |-
    Dann zu solcher zeit vnd vbung kompt einer von böser vnd liederlicher gesellschafft / als mit spilen / trincken / vnnd andern leichtfertigen sachen / dardurch einer wol in grossen vnrat vnd schaden komen mag / vnd die gůt můssige zeit mit solchem vbel zubringen / vnnd doch jm solche zeit wol in allem gůtem hett mögen anlegen.
  cs: |-
    V takovém čase a při takovém cvičení se totiž člověk vyhne zlé a lehkovážné společnosti – hraní, pití a jiným lehkomyslným věcem –, kterými by se snadno mohl dostat do velké nesnáze a škody a pěkný volný čas promarnit takovým zlem, ačkoli jej mohl dobře vynaložit na všechno dobré.
- typ: odstavec
  de: |-
    Das ist mein rath (lieber Son) den ich zu diser zeit dir zu deinem fürnemen in der kürtz geben kan / vnd bit du wöllest mein geringes bedencken vnd rath zu hertzen nemen / vnd nicht verachten / dann solt du (wils Gott) wol faren / vnd dein vorgenommene handlung vnd zeit mit ehrn vnd zu nutz hin bringen.
  cs: |-
    To je má rada, milý synu, kterou ti v tuto chvíli mohu v krátkosti dát k tvému předsevzetí. Prosím tě, abys mou skrovnou úvahu a radu vzal k srdci a nepohrdl jí; pak se ti (dá-li Bůh) bude dobře dařit a své zamýšlené počínání i čas strávíš se ctí a k užitku.
- typ: odstavec
  de: Ende des ersten Bůchs.
  cs: Konec první knihy.
poznamky:
- n: 1
  text: V tisku *jhm warheit*, zřejmě tisková chyba za *in warheit* („vpravdě“).
