bloky:
- typ: odstavec
  de: |-
    Auch seind etlich Leut wann sie schlagen wöllen/ so haben sie achtung auff die Sonn/ deßgleichen auch ob sie gegen Berg oder Thal streitten müssen/ es ist recht daß mann den Wind vnnd Sonnen annimpt/ aber etwan wann mann solliches sucht/ kompt das Volck inn ein vnordnung oder wann es ewer Feinde sehen/ vermeinen sie jhr wölt brennen/ oder villeicht fliehen/ vnd werden dardurch desto hertzhaffter/ warlich solliches ding ist vor etlichen jaren gůt vnd fast besser gewesen dann jetzund/ dann zur selben zeit haben sie wol offt drei oder vier stundt/ ja wol einen halben tag geschlagen/ vnnd der mehr theil zu fuß/ darumb ist es von nöten gewesen den Wind oder Sonnen anzuzeigen/ aber jetzund zur zeit seind vnsere Schlachten so bald auß/ daß ich nit vermein das vns der Wind oder Sonn vil schaden oder nutzen künde/ Vor alten zeiten haben sie für einen vortheil gehabt/ wann die Feind gegen thal/ als klein vnd wenig es gewesen ist/ nur ein fuß vmb etwas niderer stehn dann der ander/ hat mussen angreiffen/ Jetzund wolt ich mich lieber gegen Berg wann er doch nicht gar zu hoch were/ schlagen/ dann daß Geschütz vil weniger schaden gegen Berg dann gegen thal thůn kan/ ich will nit streitten das mein meinung die best sei/ sonder zeige euch allein mein gůt bedüncken an. Jch kan euch nichts mehr sagen was die Schlachtordnung belangt/ dann ich hab gesehen/ gelesen vnd gehort von so villerlei maniern der Ordnungen/ daß nit gůt schrifftlich darinn zu raten ist/ dann es allwegen ein sonder art inn jeglichem Landt haben muß/ Es ist wol war wann es in einem Bergigen Land ist/ dann soll mann acht haben/ daß mann die vortheil vor den Feinden einneme/ deßgleichen auch in den engen bösen Wälden ein vortheil zum besten sei/ wirt euch der augenschein leren/ dann es von nöten ist/ daß solchs in den orten geschehe/ doch darnach jhr Leut habt darnach möcht jr wol handeln.
  cs: |-
    Někteří lidé, když chtějí svést bitvu, dbají na slunce a také na to, zda musí bojovat do kopce, nebo z kopce. Je správné brát v úvahu vítr a slunce. Někdy však, když se o to člověk snaží, upadne lid do nepořádku, anebo když to vaši nepřátelé spatří, domnívají se, že chcete pálit[^1] nebo snad prchat, a tím nabudou tím větší odvahy. Věru, taková věc byla před několika lety dobrá a mnohem užitečnější než nyní, neboť v oné době se často bojovalo tři nebo čtyři hodiny, ba i půl dne, a většinou pěšky; proto bylo nutné brát ohled na vítr a slunce. Ale nyní v naší době jsou bitvy tak rychle u konce, že nemyslím, že by nám vítr nebo slunce mohly mnoho uškodit či prospět. Za starých časů pokládali za výhodu, když nepřítel musel útočit zdola, i kdyby stál jen nepatrně, třeba jen o stopu níže než druhá strana. Nyní bych se raději bil do kopce, pokud by ovšem nebyl příliš vysoký, protože děla {Geschütz} mohou do kopce nadělat mnohem méně škody než z kopce. Nechci tvrdit, že můj názor je nejlepší, jen vám sděluji, co sám pokládám za dobré. O bitevním šiku {Schlachtordnung} vám víc říci nemohu, neboť jsem viděl, četl a slyšel o tolika rozličných způsobech šiků, že se v tom nedá dobře radit písemně; v každé zemi se totiž musí postupovat zvláštním způsobem. Je ovšem pravda, že v hornaté zemi je třeba dbát na to, abychom nepříteli zabrali výhodná místa. A co je nejvýhodnější v úzkých a zlých lesích, to vás naučí pohled na místo, neboť právě tam je toho zapotřebí. Jednat však můžete podle toho, jaké lidi máte.
- typ: odstavec
  de: |-
    Aber wie dem allem mit welcherlei manier jr die Feind schlacht vnd vberwindt/ solt jr Gott dem allmechtigen danck sagen/ vnd jhm die gemelt victoria zůgeben vnd sonst niemand/ vnd solt euch die nacht legern an das ort da jr die Feind geschlagen/ oder in jr Leger wann es im Somer ist/ vnd morgens Gottes wort hören/ Gott dem Allmechtigen danck sagen/ daß er euch vnd allen denen auff ewer seiten den sig geben hab/ für die erschlagen bitten/ auff die walstat schicken/ vnd besichtigen lassen was für Fußuolck erschlagen sei/ wann dann etlich namhafftig erfunden werden/ solt jr an die ort schicken da sie seßhafftig sein/ oder sonst inn ein namhafftige Kirch ehrlich begraben/ nachuolgents auff die walstat groß gruben machen/ darinn die Feinde eben so wol als die ewern begraben lassen/ vnd wann sie begraben
  cs: |-
    Ať však nepřítele porazíte a přemůžete jakýmkoli způsobem, máte vzdát díky Bohu všemohoucímu a připsat to vítězství jemu a nikomu jinému. Na noc se máte utábořit na místě, kde jste nepřítele porazili, nebo v jeho ležení {Leger}, je-li léto. Ráno máte vyslechnout slovo Boží, poděkovat Bohu všemohoucímu, že vám i všem, kdo stáli na vaší straně, dal vítězství, a pomodlit se za padlé. Potom pošlete [lidi] na bojiště a dejte prohlédnout, jací pěšáci {Fußuolck} padli. Najdou-li se mezi nimi někteří význační, máte je poslat do míst, kde byli usedlí, nebo je jinak počestně pohřbít v některém význačném kostele. Poté dejte na bojišti vykopat velké jámy a pohřbít v nich nepřátele stejně jako své vlastní. A když jsou pohřbeni,
poznamky:
- n: 1
  text: |-
    *brennen* – „pálit“ (snad ve smyslu zapalování vlastního ležení před ústupem); možná též tisková chyba za *rennen* („utíkat“). Smysl je každopádně, že nepřítel si přesouvání šiku vyloží jako přípravu k útěku.
