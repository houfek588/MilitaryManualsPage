bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    annemen/ so kan er wissen/ so er seinem Herren (wie jme gebürt) Ordenung odder Anschleg machen solte/ was er für Volck habe/ Damit er seinem Herrn des zuberichten/ jre anschleg darauff zumachen haben/ der Oberst soll auch fleissig darauff achtung vnd bestallung haben/ daß jm die Hauptleut recht zusagen/ vnd nichts verhalten/ Auch so soll der Oberst vnuermerckt fleissig darauff sehen/ wann die Knecht auff die Wacht ziehen/ wie starck die Fendlin seind/ deßgleichen inn den Legern/ an den Spiessen bei einem jeden Fendlin/ vnnd so ein Oberster also auff die stück gůten fleiß vnd achtung hat/ so dienet er seinem Herren wol vnd kan inn der Musterung desto baß darauff sehen/ wann er zuuor weyß/ wie die Fendlin gefast gewesen seind/ kompt dann ein Fendlin inn die Musterung/ vnnd ist starck von Personen/ So weyß der Oberst wann er also achtung darauff gehabt hat/ wie es vor gewesen ist/ vnnd hat dann den Hauptman darumb anzusprechen/ daß er jme darumb rede vnd antwort gebe. Noch eins soll ein Oberster bei seinen Hauptleuten bestellen/ dieweil sie jn den abgang der Knecht also alle Wochen ansagen/ was sie wider annemen/ vnd in was bestallung/ Alßdann können sie nicht in der Musterung sagen/ ich habe souil wider angenommen/ dieweil der Oberst vmb das angenommen auch weyß. Darumb so ligt vil an einem trewen/ fleissigen/ Obersten/ der kan also mit der zeit inn einem Leger vil ersehen vnnd erfaren/ wann er sich darumb wil bemühen vnnd annemen/ vnnd den Hauptleuten darauff sehen.
  cs: |-
    přijímat. Tak může vědět, jaký lid má, kdykoli má pro svého pána (jak mu přísluší) sestavit šik {Ordenung} nebo válečné plány, aby o tom mohl pánovi podat zprávu a mohli podle toho dělat své plány. Plukovník {Oberst} má také pečlivě dbát a zařídit, aby mu hejtmani {Hauptleut} hlásili pravdu a nic nezatajovali. Rovněž má plukovník nenápadně a bedlivě sledovat, jak silné jsou praporce {Fendlin}, když knechti {Knecht} táhnou na stráž {Wacht}, a stejně tak v leženích {Legern} u pík {Spiessen} každého praporce. Věnuje-li plukovník těmto věcem dobrou píli a pozornost, slouží svému pánovi dobře a při přehlídce {Musterung} může dohlížet o to lépe, protože předem ví, jak byly praporce obsazeny. Přijde-li pak některý praporec na přehlídku a má mnoho osob, ví plukovník, který na to takto dával pozor, jak tomu bylo předtím, a může hejtmana vyzvat, aby mu z toho vydal počet. Ještě jedno má plukovník svým hejtmanům nařídit: když mu takto každý týden hlásí úbytek knechtů, ať hlásí i to, koho zase přijali a za jakých podmínek. Pak nemohou při přehlídce říkat: „Přijal jsem jich zase tolik a tolik,“ protože plukovník o nově přijatých také ví. Proto záleží mnoho na věrném a pilném plukovníkovi. Ten může takto časem v ležení mnoho zpozorovat a poznat, chce-li se o to snažit, ujmout se toho a hejtmanům dohlížet na prsty.
- typ: odstavec
  de: |-
    Auff den dritten Artickel/ des vngehorsams vnd schreien der Knecht halben/ haben wir vnns auch bedacht/ wie das zuuorkommen seie/ vnd halten darfür/ So den Knechten jre schreien so sie thůn/ wann sie auff die Wacht ziehen sollen/ vnd anders dergleichen in jren Artickels Brieffen verbotten würde/ das solten sie aber zuthůn macht haben/ wo sie etwann einen mangel hetten/ daß sie daß jhrem Hauptman ansagten/ alßdann solt der Oberst solches dem Kriegsherrn anzeigen/ vnd mit demselbigen daruon reden/ des bescheids sollen sie sich auch halten/ So sichs aber zutrüge/ daß sie ein wichtige sach haben würden/ so können sie ein ander handlung mit dem Kriegsherrn gehaben. Darumb sollen sie für keiner andern handlung also vnbillich schreien haben/ noch jnen dasselbig gestattet werden/ sonder jhre verwirckte straff derhalben empfahen/ dann es ist der vnfletter vnd schreier auch der Hauptleut vrsach/ wann dieselben mit den Knechten/ also inn Practica vnnd Finantz ligen/ so können sie die nicht straffen/ dann
  cs: |-
    K třetímu článku, o neposlušnosti a křiku knechtů, jsme také uvažovali, jak tomu předejít. Soudíme, že by se knechtům mělo v jejich artikulních listech {Artickels Brieffen} zakázat pokřikování, které tropí, když mají táhnout na stráž, a jiné podobné věci. Právo by však měli v tom, že by nějaký nedostatek mohli oznámit svému hejtmanovi; plukovník by to pak oznámil válečnému pánovi {Kriegsherrn} a promluvil s ním o tom, a jeho rozhodnutí by se měli držet. Kdyby se však stalo, že by měli nějakou závažnou věc, mohou s válečným pánem vést zvláštní jednání. Kvůli ničemu jinému tedy nemají takto neoprávněně křičet ani se jim to nemá trpět; mají za to dostat zasloužený trest. Za takové výtržníky a křiklouny totiž mohou i hejtmani: jsou-li s knechty zapleteni v úkladech {Practica} a fintách {Finantz}, nemohou je trestat, neboť
