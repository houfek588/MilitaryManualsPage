bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    etwas zutrůge / jr ewer frischen roß hetten / aber jhr solt bei berürtem Quartirmeister sein / alda berathschlagen wie jhr das Leger schlagen wölt / mit sampt andern verstendigen Kriegßleuten / wiewol solches des Quartirmeisters ampt vnd beuelch ist / allein verstendig gnůg sein solt solches zu berathschlagen / aber als ich Krieg gebraucht / hab ich allwegen auch darbei sein wöllen / wiewol der Quartirmeister geschickter gewesen dann ich / doch hab vrsachen hörn wöllen / warumb sie das Veldleger an das vnd nicht an ein ander ort schlagen / vnnd mich bedünckt ich hab dardurch vil geleret / Deßhalben ich euch rath solches auch zuthůn / ich will nicht mehr sagen vom berathschlagen / wie mann sich Legern soll / dann ich oben daruon geredt / da ich geschriben hab was eins Quartirmeisters ampt sei / aber doch Herr den artickel daß jr selbs dabei seien / möcht jr thůn oder lassen nach ewerm wolgefallen / dann wanns gefehrlich were wolts ich euch nicht raten / wann jr nicht selbst darbei seit / künds jr ewerm Marschalck beuelhen was er handeln soll. Es ist auch von nöten das ich euch anzeige / wann jr das felt besichtigt / soll der Quartirmeister vnd die Furirer mit jm auch die zwen Wachtmeister welcher das erst losament in haben sol / daß sie mögen růhen / dieweil sie zu nacht müssen schaffen / wann die Quartir außteilt vnd die losamenter gemacht / wie oben steht / soll der Marschalck mit seim fendlin zum ersten in das leger ziehen / sein losament innemen / vnd soll bei jm 40. oder 50. roß oder mehr / nach dems gefehrlich ist / oder nach dem bei jm Fürsten oder herrn / ligen / damit er gerüst sei tags wacht zuhalten / wo jm beuelch geben wirt / vnd sollen sich legern ehe dann die im nachzug ins leger kommen / solt auch ewer wagen mit dem geschütz ins leger fürn lassen / damit der Schützmeister vnd Prouos ein ordnung stellen wie gemelt / sol der gewaltig hauff in der ordnung stehn biß das geschütz / oder der groß hauff der wagen inn das leger kompt / mitler weil sol der Marschalck das feld besehen / das höchst ort so er finden kan / doch daß dem leger auch gelegen / einnemen / damit er im tag die wacht daselbst mag haben / so ferr aber die wacht den vorteil nit gar einnemen kan / soll derselbige Oberster allweg weit mit einander vor oder auff die seiten schicken / der gestalt daß er sie allweg in dem gesicht hab / damit die Feind das Leger nit vberfallen / durch täler / holweg oder wälde / daß die wacht nit innen werde / vnd soll gedachte wacht so an eim sichern ort sein / daß die feind sie nit vom hauffen tringen künden sie werdens dann zuuor innen / Soll alweg der bemelt Wachtmeister euch berichten / was jm kundt gethan wirt / auch was jm begegnet es sei von vil oder wenig leuten / vnd soll von der Wacht nit weichen es geschehe dann mit gewalt / sol
  cs: |-
    něco přihodilo, měli čerstvé koně. Vy sami však máte být u zmíněného kvartýrmistra {Quartirmeister} a spolu s dalšími zkušenými válečníky {Kriegßleuten} tam rokovat, jak chcete ležení {Leger} rozbít. Je to sice úřad a povinnost kvartýrmistra a sám by měl být dost zkušený, aby to uvážil. Když jsem však vedl války, chtěl jsem být vždy při tom, ačkoli kvartýrmistr byl zručnější než já; chtěl jsem přesto slyšet důvody, proč polní ležení {Veldleger} rozbíjejí právě na tomto, a ne na jiném místě, a zdá se mi, že jsem se tím mnohému naučil. Proto vám radím, abyste to činili také. Víc o tom, jak se má rokovat o rozložení ležení, říkat nechci, neboť jsem o tom mluvil výše, kde jsem psal, v čem spočívá úřad kvartýrmistra. Ten článek, že máte být sami při tom, však, pane, můžete zachovat nebo opominout podle své libosti. Kdyby to bylo nebezpečné, neradil bych vám to; nebudete-li sami přítomni, můžete svému polnímu maršálkovi {Marschalck} uložit, co má dělat. Musím vám také připomenout: zatímco prohlížíte pole, má kvartýrmistr a s ním furýři {Furirer} i oba vachmistři {Wachtmeister} dostat první ubytování {losament}, aby si mohli odpočinout, protože v noci musejí pracovat. Když jsou kvartýry {Quartir} rozděleny a ubytování připravena, jak stojí výše, má polní maršálek se svou korouhví {fendlin} vtáhnout do ležení jako první a zaujmout své ubytování. Má mít u sebe 40 nebo 50 koní, nebo i víc, podle toho, jak je to nebezpečné nebo kolik knížat či pánů u něho leží, aby byl připraven držet denní stráž tam, kde mu bude rozkázáno; ti se mají utábořit dřív, než do ležení dorazí zadní voj {nachzug}. Své vozy s děly {geschütz} máte rovněž dát zavézt do ležení, aby mistr střelby {Schützmeister} a profous {Prouos} postavili pořádek, jak bylo řečeno. Hlavní voj {gewaltig hauff} má stát v šiku, dokud děla nebo velký houf vozů nevjedou do ležení. Mezitím si má polní maršálek prohlédnout pole a obsadit nejvyšší místo, jaké najde a jež je přitom pro ležení příhodné, aby tam mohl mít přes den stráž. Nemůže-li však stráž výhodné místo plně obsadit, má tento plukovník {Oberster}[^1] vždy posílat [jezdce] daleko vpřed nebo do stran, a to tak, aby je měl stále na očích, aby nepřítel nepřepadl ležení údolími, úvozy nebo lesy, aniž by si toho stráž všimla. Zmíněná stráž má být na tak bezpečném místě, aby ji nepřítel nemohl zatlačit od vojska, aniž by to předtím zpozorovala. Zmíněný vachmistr vám má vždy podat zprávu o tom, co se mu oznámí, i o tom, co ho potká, ať jde o mnoho, nebo o málo lidí. Od stráže nemá ustoupit, leda by byl k tomu přinucen násilím. Nemá
poznamky:
- n: 1
  text: „Oberster“ zde označuje velitele stráže, o němž je řeč – podle souvislosti polního maršálka, resp. vachmistra, kterého zmiňuje následující věta. Překládáno závazně jako „plukovník“.
