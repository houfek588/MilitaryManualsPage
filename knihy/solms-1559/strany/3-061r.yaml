sken: 373
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    WIltu Salpeter röß / starck vnd gůt machen / so nim Salpeter als vil du wilt / oder gehaben magst / thů den in ein saubern Kessel / vnnd thů souil Wein oder Essig darzů / das es bloß vber den Salpeter gehe / rür vnd misch jn gar wol vntereinander / vnd stoß ein rüten darein / meß den Wein oder Essig / vnd zeichen das gleich halb / seud das halb an das zeichen der Růtten / wenn du es also gesotten hast / so geuß den Wein oder Essig herab / vnd seig das vnsauber alß ab / also wol alß das sauber / wie in disem Bůch geschriben steht / so findestu das Saltz an dem boden inn dem Kessel / vnd der Salpeter steht im wasser / du solt jn nemen / vnd wol dören an der Sonnen / so hastu gůten geleuterten Salpeter.
  cs: |-
    Chceš-li učinit ledek {Salpeter} ostrým, silným a dobrým, vezmi ledku, kolik chceš nebo můžeš mít, dej jej do čistého kotle a přilej tolik vína nebo octa, aby jen tak překryl ledek; dobře jej promíchej, ponoř do něj proutek, odměř víno či ocet a označ přesně polovinu, pak polovinu vyvař až po značku na proutku. Když jsi jej takto povařil, slij víno či ocet a sceď všechno nečisté stejně pečlivě jako čisté, jak je psáno v této knize – tak najdeš sůl na dně v kotli a ledek bude ve vodě; vezmi jej a dobře jej usuš na slunci, a budeš mít dobrý přečištěný ledek.
- typ: nadpis
  uroven: 3
  de: Aber ein ander lere wie mann den Salpeter leutern / Saltz vnd Alaun dauon scheiden soll / vnd ist die beste lere als sie im Bůch geschriben steht.
  cs: Jiné poučení, jak se má čistit ledek a oddělovat od něj sůl a kamenec, a je to nejlepší poučení, jaké je v knize psáno
- typ: odstavec
  de: |-
    ALso soltu den besten Salpeter machen / Saltz vnd Alaun dauon scheiden / nim 2. pfundt vngeleschten Kalch / 1. pfundt Ispontcum / 1. pfundt Galitzenstein / 1. pfundt Saltz / vnd auß den allen mach ein Laug von Wein oder Essig / laß die drei tag stehn / das sie lauter werde darnach thů salpeter in ein Kessel als vil du wilt / vnd thů dise Laug darein als vil das die Laug vber den salpeter auff gehe / misch das alles wie vorgeschriben steht / vnd seude das gleich halb ein / geuß das denn ab so findestu den Alaun vnd saltz / vnd alle vnreinigkeit an dem boden in dem Kessel / laß das salpeter wasser das vor Laug ist gewesen kalt werden / so steht der salpeter als sei er gefroren / wenn er dann also gefron ist / so schüt die laug ab / vnd trucken den salpeter an der sonnen / so hastu den aller besten salpeter / den jemant gehaben mag / man gibt den salpeter der also gereinigt vnd geleutert ist teiwer / vnd thůt 1. pfundt mehr war zu man jn nimpt / dann sonst fünff pfundt gethun können.
  cs: |-
    Takto máš dělat nejlepší ledek a oddělovat od něj sůl a kamenec: vezmi 2 libry {pfundt} nehašeného vápna, 1 libru měděnky (*Ispontcum*),[^1] 1 libru skalice (*Galitzenstein*)[^2] a 1 libru soli a ze všech těchto přísad udělej louh z vína nebo octa; nech jej tři dny stát, aby se vyčistil. Poté dej do kotle ledku, kolik chceš, a nalej do něj tohoto louhu tolik, aby louh vystoupil nad ledek; vše to smíchej, jak je předepsáno výše, a odvař přesně na polovinu. Pak to slij – tak najdeš kamenec, sůl i veškerou nečistotu na dně v kotli; ledkovou vodu, která dříve byla louhem, nech vychladnout, a ledek se srazí, jako by byl zmrzlý. Když je takto ztuhlý, slij louh a usuš ledek na slunci – tak budeš mít ze všech nejlepší ledek, jaký jen kdo může mít. Takto vyčištěný a přečištěný ledek se prodává dráž, ale 1 libra vykoná, k čemukoli se použije, víc než jinak pět liber.
- typ: nadpis
  uroven: 3
  de: Ein Lere ob Saltz vnter geleutertem Salpeter wer / wie man das dann scheiden soll.
  cs: Poučení, byla-li by v přečištěném ledku sůl, jak se má pak oddělit
- typ: odstavec
  de: |-
    WIltu saltz von geleutertem salpeter scheiden / so nim den salpeter / leg jn in ein kalt wasser / daß das wasser bloß vber den salpeter auffgehe / aber du solt den salpeter vor messen mit einem stecken / ehe du das wasser darein thůst / so zugeht das saltz / vnd bleibt denn der salpeter in dem wasser kalt / dann salpeter in kaltem wasser mag nit zugehen / er gestehet wol von der kelt / geuß das wasser ab / vnd laß denn den salpeter wol erseigen / vnd thu jn an die sonnen das er wol trucken werde / so vergeht er sich Meisterlichen wol / vnd ist gůt.
  cs: |-
    Chceš-li oddělit sůl od přečištěného ledku, vezmi ledek a vlož jej do studené vody tak, aby voda jen tak sahala nad ledek – avšak nejprve si ledek odměř klacíkem, než do něj naleješ vodu –, a tak se sůl rozpustí a ledek zůstane v té studené vodě, neboť ledek se ve studené vodě nemůže rozpustit a chladem dobře ztuhne. Pak vodu slij, nech ledek dobře okapat a dej jej na slunce, aby dobře vyschl; tak se mistrně vyčistí[^3] a bude dobrý.
poznamky:
- n: 1
  text: |-
    *Ispontcum* – dobová zkomolenina za *viride hispanicum* („španělská zeleň“, měděnka), popř. alchymický název (*spodium* / *sal ponticum*); srov. recept na l. 61v, kde na jejím místě stojí *Grünspan* („měděnka“).
- n: 2
  text: |-
    *Galitzenstein* – skalice (zvl. bílá skalice neboli síran zinečnatý, případně modrá skalice měďnatá).
- n: 3
  text: |-
    V tisku stojí *vergeht er sich* – patrně ve smyslu „urovná se / vyčistí se“ (nebo tisková obměna za *verfertigt / verbessert sich*).
