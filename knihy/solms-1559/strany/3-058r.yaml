bloky:
- typ: nadpis
  uroven: 3
  de: Ein Puluer zumachen zum Feldschiessen.
  cs: Jak dělat střelný prach {Puluer} pro polní střelbu
- typ: odstavec
  de: |-
    NIme 3. pfundt Salpeters / 1. pfundt graben Schwefels / ein halb pfundt Koln / vnd ein halb stettit weissen Arsenicum / stoß das klein durch einander / vnd ein Quertlin eines vierdten theils von einer maß gebranten Wein / vnd ein quintlin Kampfer / laß vnder einander sieden / vnd wann es kalt wirt / so schütz vnder das Puluer / stoß dann abermals wol / darnach laß wol trucken an der Sonnen / so ist es gůt.
  cs: |-
    Vezmi 3 libry {pfundt} ledku {Salpeters}, 1 libru surové síry {Schwefels}, půl libry dřevěného uhlí {Koln} a půl štetitu (*stettit*) bílého arzeniku (*weissen Arsenicum*) a utluč to dohromady najemno. [Vezmi] čtvrtku {Quertlin}, totiž čtvrtinu mázu {maß}, páleného vína a jeden kvintlík {quintlin} kafru a nech to spolu povařit; až to vychladne, vlij to do prachu, znovu dobře utluč a potom nech dobře uschnout na slunci – tak je dobrý.
- typ: nadpis
  uroven: 3
  de: Nota.
  cs: Poznámka
- typ: odstavec
  de: |-
    Stettit ist ein vierdttheil von einem lot / das ist ein Quintlin.
  cs: |-
    Štetit (*Stettit*)[^1] je čtvrtina lotu {lot}, to jest kvintlík.
- typ: nadpis
  uroven: 3
  de: Puluer on Salpeter vnd Schwefel zumachen / etc.
  cs: Jak dělat střelný prach bez ledku a síry atd.
- typ: odstavec
  de: |-
    ITem mann neme eisern sindern Kolen vnd Quecksiber / zerstoß vntereinander / thůs in ein Büchsen / vnd ladt die hart / scheußt aber nit so weit als ander Puluer / weit zu schiessen ist das best stück Salpeter.
  cs: |-
    Dále vezmi železné okuje (*eisern sindern*),[^2] uhlí a rtuť (*Quecksiber*),[^3] rozdrť to spolu, dej do děla {Büchsen} a pevně je nabij. Nestřílí to však tak daleko jako jiný prach; pro dalekou střelbu je nejlepší složkou ledek.
- typ: nadpis
  uroven: 3
  de: Puluer das sich selber von wasser anzünd.
  cs: Střelný prach, který se sám vznítí od vody
- typ: odstavec
  de: |-
    ITem man neme salpeter 5. theil / Schwefel 9. theil / Koln 3. theil / die auß Alberholtz gebrant seind / stoß das vndereinander zu einem Puluer / vnd nim geleschten Kalch / der auß einem weissen kißstein gebrennt / vnd wol gestossen sei / 3. theil darunter / vnd ein theil Campfer temperier das alles wol durcheinander / vnd laß es wol trucken werden.
  cs: |-
    Dále vezmi 5 dílů ledku, 9 dílů síry a 3 díly uhlí vypáleného z topolového dřeva (*Alberholtz*), utluč to dohromady na prach a přidej k tomu 3 díly hašeného[^4] vápna vypáleného z bílého křemene a dobře utlučeného a jeden díl kafru; to vše spolu dobře promíchej a nech dobře vyschnout.
- typ: nadpis
  uroven: 3
  de: Puluer zu stein Büchsen zuschiessen.
  cs: Střelný prach pro střelbu z kamenných děl {stein Büchsen}
- typ: odstavec
  de: |-
    ITem man neme 2. lot Schwefel / 3. lot Salpeter / 1. lot Kolen / stoß es wol / vnd mischs vndereinander / machs ein wenig naß mit einem wasser / vnd thů es in ein sib oder Durchsack rürs mit eim Löffel durch das sib / vnd wann es durch das sib ist gefaln / so setz es an die Sonnen / vnd laß es gar woldör werden.
  cs: |-
    Dále vezmi 2 loty síry, 3 loty ledku a 1 lot uhlí, dobře je utluč a smíchej dohromady, trochu je navlhči vodou, dej do síta či cedníku (*Durchsack*) a protři lžící přes síto; a až to sítem propadne, postav to na slunce a nech docela vyschnout.
- typ: nadpis
  uroven: 3
  de: Ein Puluer zu hant Büchsen.
  cs: Střelný prach pro ručnice {hant Büchsen}
- typ: odstavec
  de: |-
    ITem mann neme 1. lot Kolen / 3. lot schwefel / 6. lot Salpeter / vnnd mach es wie obgeschriben.
  cs: |-
    Dále vezmi 1 lot uhlí, 3 loty síry a 6 lotů ledku a připrav jej, jak je psáno výše.
- typ: nadpis
  uroven: 3
  de: Zündtpuluer zumachen.
  cs: Jak dělat zápalný prach {Zündtpuluer}
poznamky:
- n: 1
  text: |-
    *Stettit* (též na l. 54v *stettit*) – dobová lékárnická váhová jednotka odpovídající jednomu kvintlíku (čtvrtině lotu).
- n: 2
  text: |-
    *eisern sindern* (*Eisensinter*) – železné okuje či kovářská struska.
- n: 3
  text: |-
    Tisková chyba předlohy: *Quecksiber* místo *Quecksilber* („rtuť“).
- n: 4
  text: |-
    V tisku stojí doslova *geleschten Kalch* („hašeného vápna“), ač podle smyslu i obdobného receptu na l. 57r by mělo jít o vápno nehašené (*ungeleschten*).
