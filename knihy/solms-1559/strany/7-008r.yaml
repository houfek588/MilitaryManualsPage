  popis: |-
    Devět obrazových karet jízdy římské strany (červený tisk), protějšek černých karet na [[7-004v|listu 4v]]; pořadí po řádcích zleva doprava: 1. sevřený houf těžkých obrněných jezdců s lesem vztyčených kopí a korouhví s orlem; 2. houf kopiníků se vztyčenými kopími a korouhví, před ním velitel na koni a jezdec s žerdí; 3. jízdní houf s korouhví nesoucí šikmý kříž; 4. lehká jízda v trysku s luky a kopími; 5. jízdní houf s korouhví se šikmým křížem; 6. jízdní houf s číslem „100“; 7. jízdní houf s korouhví, v čele dva jezdci; 8. menší karta s houfem jezdců a číslem „50“; 9. nejmenší karta s malou skupinou jezdců a číslem „25“.
