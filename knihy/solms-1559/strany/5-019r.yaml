- typ: odstavec
  de: |-
    Dise ander Figur ist ein gewaltigs Blochhaus/ daraus mann aus solchem schleusen Blochaus hinder der Schantzen verwart gehn möcht/ ist auch inwendig mit dreien plätzen auffgefürt/ zu stenden des Geschützs/ wann mann hinaus die weite nicht haben kündt.
  cs: |-
    Toto druhé vyobrazení je mohutný srub {Blochhaus}, z něhož lze z takového stavidlového srubu chodit krytě za šancí {Schantzen}. Uvnitř jsou také navršena tři prostranství pro stanoviště děl {Geschützs}, kdyby se ven nedalo dostatečně rozložit.
