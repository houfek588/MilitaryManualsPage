  de: |-
    Das ander Blochaus.
  cs: |-
    Druhý srub.
- typ: odstavec
  de: |-
    DIse ander Figur ist ein gewaltigs Blochhaus/ daraus mann auß solchem schleusen Blochaus hinder der Schantzen verwart gehn möcht/ ist auch inwendig mit dreien plätzen auffgefürt/ zu stenden des Geschütz/ wann mann hinaus die weite nicht haben kündt.
  cs: |-
    Toto druhé vyobrazení jest mohutný srub {Blochhaus}, z nějž se dá z takovéhoto stavidlového srubu chodit krytě za zákopy {Schantz}; uvnitř jest rovněž vyveden se třemi prostranstvími pro postavení děl {Geschütz}, kdyby se nedala mít potřebná šířka směrem ven.
