bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    deinem Herren nicht gefallen / vnd ein vngnad dir geberen / das wirt dir nicht fürderlich noch gůt sein / das bedünckt mich aber solt sich schicken / wann du etwan mit deinem Herren zu reden kämest von solchen sachen / daß du hettest gesagt / Gnediger Herr / Ewer Gnaden haben mich erzogen biß hieher / so bin ich ein junger gesell / vnd weiß nichts weitters dann was am Hoff gebreuchlich ist / vnd sein Ewer gnaden nichts weitters nutz / nun hett ich wol ein willen vnd lust etwas weitters zusehen vnd zu lernen / dieweil ich doch jetzund ein ledige zeit hab / vnd wie ein junger noch nichts außrichten / vnd Ewer Gnaden auch nichts stattlichs noch nützlichs dienen kan / vnnd die zeit meiner jugent vergeblich herbringe / so werde ich bedacht Ewer Gnaden vndertheniglich zu bitten / dieweil dieselbig mich so weit erzogen haben / so wöl sie mir die gnaden erzeigen / wann ein ehrlicher Zug würde / mir gnediglich erleuben / befürdern vnd verhelffen mit Vorschriefften an einen Obersten / da ich bei kommen möcht / etwas sehen vnnd lernen künde / dann were ich on zweifel es würde Ewer Gnaden nichts abgeschlagen / vnd mir zu gůtem vnnd fürderung kommen / wolt dann Gott daß ich etwas lernen möcht / so kündt ich dann Ewer Gnaden desto stattlicher dienen vnd nutz werden / dann ich gesinnet bin Ewer gnaden für andern zu dienen. Vnd mit solchem ehrlichen bitten vnnd erbieten solt du zu deinem Herren kommen / wann dann dein Herr dein ehrliches begeren vnnd vorhaben vernemen / wirt er auch on zweifel desto geneigter vnd bewegter werden dir zu erlauben vnd zu helffen / Wann du dann also ein gnedige abfertigung wirts bekommen / war du dann mit solchen verschreibungen kömpts / das ist ehrlich vnd tüglch / vnd kömpts etwan bei ein ansehenlichen Man oder Herren da du wol bist / da du sonst noch lang zeit ein gemeiner sein müssest / vnd lang dienen wie ein gemeiner / biß du bekant vnd bei einen solchen ansehenlichen Herren kommen mögst / Das ist mein bedencken vnd rath den ich dir dißmal geben kan.
  cs: |-
    tvému pánovi nebylo vhod a vyneslo by ti to jeho nemilost, což by ti nebylo ku prospěchu ani k dobru. Myslím však, že by se slušelo, abys mu, až s ním někdy přijdeš na řeč o takových věcech, řekl: „Milostivý pane, Vaše Milost mne až dosud vychovávala. Jsem však mladík a neznám nic víc, než co je obvyklé u dvora, a Vaší Milosti nejsem k dalšímu užitku. Rád bych proto viděl a naučil se něco víc, když mám nyní volný čas, jako mladý ještě nic nezmohu, Vaší Milosti nemohu nijak významně ani užitečně sloužit a čas svého mládí trávím nadarmo. Odhodlal jsem se proto Vaši Milost poníženě poprosit, aby mi – když mne až dosud vychovala – prokázala tu milost a kdyby nastalo nějaké čestné tažení {Zug}, milostivě mi dovolila odejít, podpořila mne a dopomohla mi doporučujícími listy k některému plukovníkovi {Obersten}, u něhož bych se uplatnil a mohl něco vidět a naučit se. Pak nepochybuji, že by Vaší Milosti nebylo nic odepřeno a mně by to přišlo k dobru a k prospěchu. A dá-li Bůh, abych se něčemu naučil, mohl bych pak Vaší Milosti tím lépe sloužit a být k užitku, neboť jsem odhodlán sloužit Vaší Milosti přede všemi jinými.“ S takovou čestnou prosbou a nabídkou máš předstoupit před svého pána. Až pak tvůj pán uslyší tvou čestnou žádost a úmysl, bude bezpochyby tím ochotnější a pohnutější ti to dovolit a pomoci. Dostaneš-li tak milostivé vypravení, je čestné a náležité, kamkoli s takovými doporučujícími listy přijdeš;[^1] třeba se dostaneš k nějakému váženému muži nebo pánovi, u něhož se ti dobře povede, kdežto jinak bys musel ještě dlouho být prostým vojákem a dlouho sloužit jako prostý voják, než by ses stal známým a mohl se dostat k takovému váženému pánovi. To je má úvaha a rada, kterou ti tentokrát mohu dát.
- typ: nadpis
  uroven: 3
  de: Son.
  cs: Syn.
- typ: odstavec
  de: |-
    Lieber alter Vatter es ist ein gůter rath / vnd ich wil euch volgen / zu gelegener zeit wann sich es zutragen würde mit meinem Herren auff ewer bedencken reden vnnd handeln / was mir begegnet wider anzeigen / Bitt ihr wöllet mitler zeit meiner Instruction vnnd beredung ingedenck sein.
  cs: |-
    Milý starý otče, je to dobrá rada a já vás poslechnu. Ve vhodnou chvíli, až se naskytne příležitost, promluvím se svým pánem a budu s ním jednat podle vaší úvahy, a co se mi přihodí, zase vám oznámím. Prosím, abyste mezitím pamatoval na mou instrukci a na to, co jsme spolu probrali.
- typ: nadpis
  uroven: 3
  de: Alter Vatter.
  cs: Starý otec.
- typ: odstavec
  de: |-
    Lieber Son ich will es nicht vergessen / sonder dir mit fleiß machen vnd beschreiben.
  cs: Milý synu, nezapomenu na to, nýbrž ti ji pilně sestavím a sepíši.
poznamky:
- n: 1
  text: |-
    V tisku přesmyčky koncovek *wirts* za *wirst* a *kömpts* za *kömpst*; dále *tüglch* za *tüglich*.
