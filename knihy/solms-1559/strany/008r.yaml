bloky:
- typ: odstavec
  de: |-
    Auff den anderen Artickel die Musterung betreffen/ So bedünckt vnns gůt sein/ daß Ewer Römische Keyserliche Maiestat/ den Obersten vnnd Hauptleuten/ jhre Bestallung hett gemacht/ einem jeden nach seinem Ampt/ wie vil er Personen auff seinen Leib haben soll/ der er notturfftig were/ daß dieselbigen jme inn seiner Bestallung frei genennet/ vnd besoldet werden/ vnnd nicht/ ja ich wil dir einen namen odder zwen gůt machen vnder dem Fendlin/ neyn/ das ist nicht gůt/ wann jm also ein name ledig passiern soll/ derselbig name geht offt durch/ odder gehet durch mit einem doppelnsold/ vnnd ist ein betrug/ Ja mag einer sagen/ was ist das für ein betrug/ wann ich einen laß durch gehn/ vnd bekenne/ daß er mir durch geht/ auff den namen der mir zugesagt ist? Ist wol war/ es hat aber einen anderen weg/ Ich bestelle zwen odder drei/ die zweimal durch gehn sollen/ Vnd laß einen also zweimal durch gehn/ wirt mann es gewar/ so verantworte ich den/ vnd sprich: Er geht mir auff meinen zugelassen namen durch/ wirdt es aber vbersehen/ so schweige ich still/ laß den andern auch auff solliche abentheur durch gehn/ wirdt mann sein jnnen/ so spreche ich wider wie vor/ Das ist mein zugelassen name/ so ist er verantwort/ wirdt mann es nicht jnnen/ so laß ich jn gehn/ vnnd schweig still/ habe noch einen der thůt dergleichen gestalt.
  cs: |-
    Co se týče druhého článku {Artickel}, jenž se vztahuje k přehlídce {Musterung}, zdá se nám dobré, aby Vaše římská císařská Milost zřídila plukovníkům {Obersten} a hejtmanům {Hauptleuten} jejich služební list {Bestallung} každému podle jeho úřadu, kolik osob má mít k své osobě, kterých má zapotřebí – aby tito lidé byli v jeho služebním listu výslovně jmenováni a placeni, a ne tak, že se řekne: „Dobrá, já ti pod praporcem {Fendlin} uznám jedno nebo dvě jména navíc.“ Nikoli, to není dobré! Má-li mu takto projít prázdné jméno, prochází takové jméno často víckrát nebo prochází s dvojitým žoldem {doppelnsold}, a to je podvod. Někdo by mohl namítnout: „Jakýpak je to podvod, když nechám jednoho projít a přiznám, že mi prochází na jméno, které mi bylo přislíbeno?“ Je to sice pravda, ale má to i druhou stránku: najmu si dva nebo tři lidi, aby prošli dvakrát, a nechám tak jednoho projít dvakrát. Když se na to přijde, ospravedlním ho a řeknu: „Ten mi prochází na mé povolené jméno.“ Když se to ale přehlédne, mlčím a nechám také druhého na takové štěstí projít; všimnou-li si ho, řeknu zase jako dříve: „To je mé povolené jméno,“ a tím je ospravedlněn. Nevšimnou-li si ho, nechám ho projít a mlčím – a mám ještě dalšího, který udělá totéž.
- typ: odstavec
  de: |-
    Also mögen vil auff einen durch gehen/ wirdt mann es schon an einem jnnen/ Es sei der erst/ der zweit oder drit/ vnd ist noch einer dahinden/ der bleibt auß/ Ist aber der vor jhm durch vngerechtfertiget/ sihet er auch hinnach/ vnd schweiget auch still/ wann es dann vbersehen wirdt/ so laß ich es also bleiben/ vnnd dann im abzalen/ so sage ich wider den Musterherrn: Jr wißt daß mir ein name zugelassen ist worden/ macht mir jn auch in das Register/ der weyß es dann nicht besser/ vnd schreibt jm das also ins Register. Also wirdt der Musterherr betrogen/ ist aber der Musterherr nicht gůt/ so mag er also vil namen dem Hauptman passieren lassen als er wil/ vnd leßt der Hauptman jm dergleichen auch geschehen/ oder theilen es mit einander.
  cs: |-
    Tak jich může projít mnoho na jednoho: i když už na jednoho přijdou – ať je to první, druhý nebo třetí –, a je tam ještě další vzadu, ten se vytratí; jestli však ten před ním prošel bez vyšetřování, dívá se za ním a také mlčí, a když se to přehlédne, nechám to tak být, a pak při vyplácení řeknu přehlídkovému komisaři {Musterherrn}: „Víte, že mi bylo povoleno jedno jméno, zapište mi je také do rejstříku {Register}.“ Ten to pak lépe neví a zapíše mu to tak do rejstříku. Tak bývá přehlídkový komisař oklamán; není-li však přehlídkový komisař poctivý, může nechat hejtmanovi projít tolik jmen, kolik chce, a hejtman mu to na oplátku dovolí také, anebo se o to rozdělí.
- typ: odstavec
  de: |-
    Darumb so soll mann keinen ledigen namen machen lassen/ sonder sein besoldung frei bekennet machen/ was billich ist. Es können auch die Musterherrn die/ die Knecht erst annemen/ einem einen sold zwen/ drei/ vier oder fünff machen/ daruon gibt er jm einen/ das geschicht offt. Darumb soll ein Herr/ dem Obersten solliche stück zu dem aller hertesten einbinden vnd verbieten/ vnd daß der Oberst eins fleissigen auffsehens sei auff solche stück/ vnd besehe wo die Knecht
  cs: |-
    Proto se nemá dovolit uvádět žádné prázdné jméno, nýbrž se má otevřeně stanovit řádný žold {besoldung}, jak se sluší. Přehlídkoví komisaři, kteří knechty {Knecht} teprve přijímají, mohou také jednomu přiznat jeden, dva, tři, čtyři nebo pět žoldů {sold} a z toho mu dají jeden – to se stává často. Proto má pán takové kousky plukovníkovi co nejpřísněji zakázat a uložit mu to na svědomí, a plukovník má na takové kousky bedlivě dohlížet a podívat se tam, kde knechti
