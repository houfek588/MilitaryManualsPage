  text: |-
    Sken `461` nese tištěné číslo listu `13` (v BSB OCR chybně čteno jako `83`) a dole signaturu `C ij`. K prvnímu odstavci bylo ze skenu `460` přeneseno rozdělené slovo `lassen` (tištěné jako kustod na předchozím rubu).
