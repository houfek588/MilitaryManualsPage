id: 5-013r
list: 13 (5. kniha)
strana: recto
sken: 461
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    lassen rücken/ dieselbigen sollen jre seiten wart versehn vnd in acht haben/ vnd wann sie etwas vernemen/ sollen sie dasselbig allezeit jrer vorwart auffs eilents zuwissen thůn.
  cs: |-
    vedle nich vyrazit do pole. Ti mají obstarávat a střežit svou boční stráž {seiten wart}, a kdykoli něco zpozorují, mají to vždy co nejrychleji oznámit své přední hlídce {vorwart}.
- typ: odstavec
  de: |-
    Zum dritten/ soll die vorwart von jnen 6. pferdt außnemen/ die nachziehen lassen/ den zwen hindersten sollen zwen nachziehen/ weitter wider zwen den nach/ also daß sie die wart hinder jnen vnd zwischen dem vorzug haben/ ob jnen etwas in der fördersten wart auffstiß oder begegnet daß dem vorzug zuwissen von nöten/ soll eilents von den zweien einer hindersich zurück reiten/ den andern zweien solches anzeigen/ darnach soll von stundtan von solchen zweien wider einer zurück reiten/ vnd den zweien hindersten anzeigen/ vnd so bald von den zweien letsten auch einer zu rück zum vorzug vnd Renfanen rennen/ vnd jnen die werbung oder zeitung ansagen/ vnd wo mit er von dem vorzug oder Veldmarschalck beantwort/ wider hinfür zu seinen gesellen reiten/ findt er dann noch den andern so jn hinweg geschickt hat/ soll er jm solch antwort sagen/ findt er aber denselbigen nit noch da/ so laß er sein gesellen mit dere Botschafft zu den andern zweien hinfür rennen/ vnd also fört biß zu der vorwart/ das ist ein vorwart Post. Auff solch sollen 1000. Schantzgräber mit jren Schauffeln/ Bickeln vnd was jnen zusteht ziehen/ daß sie die weg raumen/ mit Brücken/ förden vnd was derhalben von nöten ist machen. Vnd bei solchen Schantzgräbern sollen jre wagen/ die allen werckzeug vnd Rüstung mit fürn/ deßgleichen bei jnen die Schiffbrücken gehn haben. Vnd auff solches alles soll der Veldmarschalck ziehen/ als der vorzug vnnd Renfan/ vnd ein geschwader Reuter als 1000. pferdt haben/ Neben solchen 1000. pferden auff der rechten seiten sollen ziehen 500. Pferdt schützen/ das wil ich den vorzug Teutsch pferdt sein lassen/ die wissen was des Renfans beuelch vnd versehung ist. Vnd auff der lincken seiten bei dem vorzug oder Renfanen sollen ziehen die Teutsche Knecht/ die inn verlorn hauffen verordnet vnd beschlossen sind/ von den Rotten die Losamenter einzunemen vnd zu quartirn. Auff solchen vorzug soll ein Regiment 10. Fendlein Teutsche Knecht ziehen/ vnd bei jnen Büchsen fürn/ Darnach wider ein Regiment Knecht/ als 10. Fendlein. Neben disen zweien Regimentern Knechten/ soll auff der rechten seiten ein Geschwader Musca Reutter ziehen/ vnd neben jn auff der rechten seiten ein seitenwart von 200. pferden von jren Musca Reutern haben. Vnd auff der lincken seiten neben den Knechten soll auch ein Geschwader Musca Reuter auff jrer lincken seiten 200. pferde von jren Reuttern schützen zu einer seiten wart ziehen/ vnd zwischen dem geschwader vnd seiten wart sollen Büchsen vorziehen.
  cs: |-
    Za třetí[^1] má přední hlídka vyčlenit ze sebe 6 koní a nechat je jet za sebou: za dvěma nejzadnějšími mají jet dva a za nimi opět dva, takže tvoří spojovací stráž mezi sebou a předvojem {vorzug}. Kdyby přední hlídka na něco narazila nebo ji něco potkalo, co je třeba dát předvoji na vědomí, má jeden z první dvojice spěšně jet zpátky a oznámit to druhé dvojici. Nato má ihned jeden z této dvojice opět jet zpět a oznámit to nejzadnější dvojici, a jakmile se to stane, má také jeden z poslední dvojice uhánět zpět k předvoji a k předvojové korouhvi {Renfanen} a vyřídit jim poselství či zprávu. S odpovědí, kterou mu dá předvoj nebo polní maršálek {Veldmarschalck}, má jet opět kupředu ke svým druhům. Najde-li tam ještě toho, kdo ho vyslal, vyřídí mu odpověď; nenajde-li ho tam již, ať pošle svého druha s tím poselstvím kupředu k dalším dvěma, a tak dále až k přední hlídce. Tomu se říká předstrážní pošta. Za nimi má táhnout 1 000 zákopníků {Schantzgräber} s lopatami, krumpáči a s tím, co jim náleží, aby upravovali cesty a stavěli mosty, brody a cokoli je k tomu dále potřeba. U těchto zákopníků mají jet jejich vozy, které vezou všechno nářadí a výbavu, a rovněž mají mít u sebe lodní mosty {Schiffbrücken}. Za tím vším má táhnout polní maršálek jako předvoj a předvojová korouhev a mít jednu švadronu {geschwader} jezdců, totiž 1 000 koní. Vedle těchto 1 000 koní mají po pravé straně táhnout 500 jízdních střelců; ty chci nechat jako německý předvoj, neboť vědí, co je úkolem a povinností předvojové korouhve. Po levé straně u předvoje či předvojové korouhve mají táhnout němečtí knechti {Knecht}, kteří jsou určeni a zařazeni do ztraceného houfu {verlorn hauffen}, aby po rotách {Rotten} zabírali a rozdělovali ubikace {Losamenter}. Za tímto předvojem má táhnout jeden pluk {Regiment} o 10 praporcích {Fendlein} německých knechtů a vézt s sebou děla {Büchsen}, a potom opět pluk knechtů o 10 praporcích. Vedle těchto dvou pluků knechtů má po pravé straně táhnout švadrona moskevských jezdců a mít vedle sebe na pravé straně boční stráž o 200 koních ze svých moskevských jezdců. Po levé straně vedle knechtů má rovněž táhnout švadrona moskevských jezdců a na své levé straně mít jako boční stráž 200 jízdních střelců ze svých jezdců; mezi švadronou a boční stráží mají jet vpředu děla.
poznamky:
- n: 1
  text: |-
    Tak v tisku: výčet pokračuje *Zum dritten*, ačkoli předchozí odstavec (`5-012v`) žádné *Zum andern* nenese; za „druhý“ krok lze považovat vyslání 100 koní před předvoj.
