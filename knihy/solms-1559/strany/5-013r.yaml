bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    lassen rucken/ dieselbigen sollen jre seiten wart versehn vnd in acht haben/ vnd wann sie etwas vernemen/ sollen sie dasselbig allezeit jrer vorwart auffs eilents zuwissen thůn.[^1]
  cs: |-
    po boku do pole; ti mají obstarávat a střežit boční hlídku, a kdykoli něco zpozorují, mají to vždy své přední hlídce co nejrychleji oznámit.[^1]
- typ: odstavec
  de: |-
    Zum dritten/ soll die vorwart von jnen 6. pferdt außnemen/ die nachziehen lassen/ den zwen hindersten sollen zwen nachziehen/ weitter wider zwen den nach/ also daß sie die wart hinder jnen vñ zwischen dem vorzug haben/ ob jnen etwas in der fördersten wart auffstiß oder begegnet daß dem vorzug zuwissen von nöten/ soll eilents von den zweien einer hindersich zurück reiten/ den andern zweien solches anzeigen/ darnach soll von stundtan von solchen zweien wider einer zurück reiten/ vnd den zweien hindersten anzeigen/ vnd so bald von den zweien letsten auch einer zu rück zum vorzug vnd Renfanen rennen/ vnd jnen die werbung oder zeitung ansagen/ vnd wo mit er von dem vorzug oder Veldmarschalck beantwort/ wider hinfür zu seinen gesellen reiten/ findt er dann noch den andern so jn hinweg geschickt hat/ soll er jm solch antwort sagen/ findt er aber denselbigen nit noch da/ so laß er sein gesellen mit dere Botschafft zu den andern zweien hinfür rennen/ vnd also fört biß zu der vorwart/ das ist ein vorwart Post. Auff solch sollen 1000. Schantzgräber mit jren Schauffeln/ Bickeln vñ was jnen zusteht ziehen/ daß sie die weg raumen/ mit Brücken/ förden vñ was derhalben von nöten ist machen. Vnd bei solchen Schantzgräbern sollen jre wagen/ die allen werckzeug vnd Rüstung mit fürn/ deßgleichen bei jnen die Schiffbrücken gehn haben. Vnd auff solches alles soll der Veldmarschalck ziehen/ als der vorzug vnnd Renfan/ vnd ein geschwader Reuter als 1000. pferdt haben/ Neben solchen 1000. pferden auff der rechten seiten sollen ziehen 500. Pferdt schützen/ das wil ich den vorzug Teutsch pferdt sein lassen/ die wissen was des Renfans beuelch vnd versehung ist. Vnd auff der lincken seiten bei dem vorzug oder Renfanen sollen ziehen die Teutsche Knecht/ die inn verlorn hauffen verordnet vnd beschlossen sind/ võ den Rotten die Losamenter einzunemen vñ zu quartirn. Auff solchen vorzug soll ein Regiment 10. Fendlein Teutsche Knecht ziehen/ vnd bei jnen Büchsen fürn/ Darnach wider ein Regiment Knecht/ als 10. Fendlein. Neben disen zweien Regimentern Knechten/ soll auff der rechten seiten ein Geschwader Musca Reutter ziehen/ vnd neben jn auff der rechten seiten ein seitenwart võ 200. pferden von jren Musca Reutern haben. Vnd auff der lincken seiten neben den Knechten soll auch ein Geschwader Musca Reuter auff jrer lincken seiten 200. pferde von jren Reuttern schützen zu einer seiten wart ziehen/ vnd zwischen dem geschwader vnd seiten wart sollen Büchsen vorziehen.
  cs: |-
    Za třetí má přední hlídka vyčlenit 6 koní a nechat je táhnout za sebou – za dvěma nejzadnějšími mají jet dva a za nimi opět dva, tak aby tvořili spojovací stráž za přední hlídkou a před předvojem {vorzug}. Kdyby se přední hlídce něco přihodilo či potkalo, co by předvoj potřeboval vědět, má jeden z té dvojice spěšně jet zpět a oznámit to druhé dvojici; nato má ihned jeden z této dvojice jet nazpět a oznámit to nejzadnější dvojici, a hned nato má také jeden z poslední dvojice uhánět nazpět k předvoji a útočné korouhvi {Rennfanen} a vyřídit jim zprávu či novinu. A s jakou odpovědí jej předvoj či polní maršálek {Veldmarschalck} vypraví, s tou ať jede opět kupředu ke svým druhům: najde-li ještě toho druhého, jenž jej vyslal, vyřídí mu takovou odpověď; nenajde-li jej tam však již, ať pošle svého druha s tím poselstvím kupředu k dalším dvěma a tak dále až k přední hlídce – tomu se říká předstrážní pošta. Za tím má táhnout 1 000 zákopníků {Schantzgräber} s lopatami, krumpáči a tím, co jim náleží, aby upravovali cesty, stavěli mosty, brody a co je k tomu potřeba; u takových zákopníků mají jet jejich vozy, jež vezou veškeré nářadí a náčiní, a stejně tak při nich mají jít lodní mosty {Schiffbrück}. Za tím vším má táhnout polní maršálek jakožto předvoj a útočná korouhev {Rennfanen} a mít jedno švadro jezdců o 1 000 koních; vedle těchto 1 000 koní po pravé straně má táhnout 500 jízdních střelců – to ponechám jako německý předvoj, neboť ti vědí, co jest rozkazem a úkolem útočné korouhve. A po levé straně u předvoje či útočné korouhve mají táhnout němečtí landsknechti {Knecht}, kteří jsou určeni a začleněni do ztraceného houfu {Verlorn hauff}, aby po rotách zabírali a ubytovávali {quartirn} ležení. Za tímto předvojem má táhnout jeden pluk {Regiment} o 10 korouhvích {Fendlin} německých pěšáků a vézt s sebou děla {Büchsen}, a pak opět jeden pluk pěších, totiž 10 korouhví. Vedle těchto dvou pluků pěchoty má po pravé straně táhnout jedno švadro moskevské jízdy a po pravém boku mít boční stráž 200 koní ze svých moskevských jezdců; a po levé straně vedle pěšáků má rovněž jedno švadro moskevské jízdy vést na svém levém boku 200 jízdních střelců jako boční stráž, a mezi švadrem a boční stráží mají jet vpředu děla.
poznamky:
