bloky:
- typ: nadpis
  uroven: 3
  de: |-
    Darmit mann dise Figur verstehn kan/ volgt ein kurtzer bericht.
  cs: |-
    Aby bylo lze tomuto vyobrazení porozumět, následuje krátká zpráva.
- typ: odstavec
  de: |-
    DIser ronde Thurn ist also zuuerstehen/ daß er ist gegraben/ gesprengt vnd geworffen/ vnd am Maurwerck fünfftzehen schůhe dick gewesen/ vnd vber erden darinn gebrochen worden wie mit A. verzeichnet/ vnd ein loch mit fünff langen starcken hölzer fürgesetzt ist/ dieselbigen Hölzer sind darumb fürgesatz/ daß solliches loch odder broch für oben herab werffen gedeckt sei/ also ist ein loch in sollichen Thurn bisz halben weg in die dicke gebrochen/ so tieff ist daß halb theil auff beiden seiten neben sich in die maur gebrochen/ dz ein man darin hat künden sitzen vnd brechen/ wie die ronde des Thurns vnd grund mit A. verzeichnet anzeigt vnd außweist/ vnd solche seiten bröch sind mit Puluer gefast worden/ als nemlich zehen Don/ vñ als ein Don Puluers zwischen die ander gestrawet/ vnd den andern Donen waren einer jeglichen ein bodem auffgeschlagen nach dem Puluer darin war/ vnd lange hölzer die der Maurn dick leng hatten/ also in den broch des eingangs hinein geschoben/ souil mann inn das loch hat bringen künden/ vnd mit gewalt hinein geschlagen vnnd gekeilt/ vnder solchem eingekeilten holtz ist der einlauff zu dem anzünden gemacht gewesen/ vnd solche Hölzer die inn das loch gekeilt/ die sind forn vor dem Haupt wider verkeilt/ also wann das Puluer angehet/ vnd wil zu rück/ so stöst es auff beiden seiten zwergs wider das holtz/ dann kan das holtz nit herauß/ dieweil das Puluer zwergs wider die Hölzer vnd nicht vor das haupt stöst/ also muß es bresten oder springen/ wie die ronde des Thurns grundt anzeigt.
  cs: |-
    Této okrouhlé věži jest rozumět takto: byla podkopána, odstřelena a svržena. Zdivo měla patnáct střevíců {schůh} silné a nad zemí se do ní prolomilo vchodem označeným `A`, před který se jako ochrana postavilo pět dlouhých silných klád; tyto klády byly přistaveny proto, aby byl takový otvor či průlom chráněn před shazováním shora. Do takové věže se tedy vylámal otvor až do poloviny její tloušťky, a tak hluboko se pak v polovině tloušťky vysekalo zdivo do obou stran, aby v něm mohl člověk sedět a lámat, jak ukazuje a vykládá okrouhlý půdorys věže s písmenem `A`. Tyto boční komory byly nabity střelným prachem {Puluer}, totiž deseti soudky, a z jednoho soudku byl prach vysypán mezi ostatní; ostatním soudkům bylo poté, co v nich byl prach, vyraženo po jednom dnu. Nato se do vstupního otvoru zasunuly dlouhé klády o délce tloušťky zdi – kolik se jich jen do otvoru vešlo – a mocně se zatloukly a zaklínovaly. Pod tímto zaklínovaným dřevem byl veden zápalný žlab a klády zaklínované v otvoru byly ještě vpředu před čelem znovu zapřeny klíny: když pak prach vzplane a tlačí nazpět, opře se na obou stranách napříč proti dřevu, takže dřevo nemůže ven, neboť prach netlačí čelně proti konci klád, nýbrž příčně do nich – a tak to musí prasknout či vyletět do povětří, jak ukazuje okrouhlý půdorys věže.
- typ: odstavec
  de: |-
    Dann die ligenden ronden ist des Thurns grundt/ darinn zusehn ist wie es inwendig gemacht oder gemacht sol werden/ dann an dem auffgerichten Thurn ist solches nicht zusehen/ wie es inwendig gethan ist oder mann thůn soll/ darumb ist allwegen vor den auffzog ein grundt gerissen vnnd gelegt/ vmb gůts berichs vnnd verstands halben geschehen.
  cs: |-
    Neboť ležící kruh je půdorys věže, v němž lze spatřit, jak jest to uvnitř zřízeno či má být zřízeno; na vztyčené věži totiž nelze vidět, jak je to uděláno uvnitř ani jak se to má dělat. Proto byl vždy před nárysem narýsován a položen půdorys, aby posloužil k dobré zprávě a porozumění.
- typ: odstavec
  de: |-
    Die Hölzer so in das loch zuuerdammen oder zuuerschliessen das Puluer eingeschoben vnd verkeilt sind/ sollen hindersich ein Schůch zu dem wenigsten in die Maur gehen für die zwerg brechung da das Puluer steht oder gefast ist/ damit solche Hölzer an beiden orten ein widerhalt oder stoß haben mögen/ damit das Puluer die Hölzer nit für das haupt treffe/ vnd herauß scheiben künde/ sonder vberzwerg/ wie vorn gemelt ist/ gegen einander wider solliche Hölzer oder drem wann das puluer angezündt ist stosse.
  cs: |-
    Klády zasunuté a zaklínované do otvoru k ucpání a uzavření prachu mají zasahovat dozadu alespoň jeden střevíc {Schůch} do zdiva až před příčný průlom, kde stojí či je uložen prach, aby měly na obou stranách oporu a doraz. Pak prach nezasáhne klády do čela a nemůže je vytlačit ven, nýbrž po zapálení narazí napříč, jak výše řečeno, proti sobě a proti těmto kládám či trámům.
