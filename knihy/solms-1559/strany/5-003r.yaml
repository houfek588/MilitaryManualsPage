id: 5-003r
list: 3 (5. kniha)
strana: recto
sken: 441
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: nadpis
  uroven: 3
  de: |-
    Darmit mann dise Figur verstehn kan/ volgt ein kurtzer bericht.
  cs: |-
    Aby bylo lze tomuto vyobrazení porozumět, následuje krátká zpráva.
- typ: odstavec
  de: |-
    DIser ronde Thurn ist also zuuerstehen/ daß er ist gegraben/ gesprengt vnd geworffen/ vnd am Maurwerck fünfftzehen schůhe dick gewesen/ vnd vber erden darinn gebrochen worden wie mit A. verzeichnet/ vnd ein loch mit fünff langen starcken höltzer fürgesetzt ist/ dieselbigen Höltzer sind darumb fürgesatzt/ daß solliches loch odder broch für oben herab werffen gedeckt sei/ also ist ein loch in sollichen Thurn biß halben weg in die dicke gebrochen/ so tieff ist daß halb theil auff beiden seiten neben sich in die maur gebrochen/ dz ein mann darinn hat künden sitzen vnd brechen/ wie die rönde des Thurns vnd grund mit A. verzeichnet anzeigt vnd außweist/ vnd solche seiten bröch sind mit Puluer gesatzt worden/ als nemlich zehen Don/ vnd als ein Don Puluers zwischen die ander gestrawet/ vnd den andern Donen waren einer jeglichen ein bodem auffgeschlagen nach dem Puluer darin war/ vnd lange höltzer die der Maurn dick leng hatten/ also in den broch des eingangs hinein geschoben/ souil mann inn das loch hat bringen künden/ vnd mit gewalt hinein geschlagen vnnd gekeilt/ vnder solchem eingekeilten holtz ist der einlauff zu dem anzünden gemacht gewesen/ vnd solche Höltzer die inn das loch gekeilt/ die sind forn vor dem Haupt wider verkeilt/ also wann das Puluer angehet/ vnd wil zu rück/ so stöst es auff beiden seiten zwergs wider das holtz/ dann kan das holtz nit herauß/ dieweil das Puluer zwergs wider die Höltzer vnd nicht vor das haupt stöst/ also muß es bresten oder springen/ wie die rönde des Thurns grundt anzeigt.
  cs: |-
    Této okrouhlé věži je třeba rozumět takto: byla podkopána, odstřelena a svržena. Zdivo měla patnáct stop {schůhe} silné a nad zemí se do ní prolomilo, jak je označeno písmenem `A`; před otvor bylo postaveno pět dlouhých silných klád, a to proto, aby byl takový otvor či průlom chráněn proti tomu, co se shazuje shora. Do věže se tedy vylámal otvor až do poloviny tloušťky zdi a v této hloubce se zdivo vylámalo do obou stran, tak aby v něm mohl člověk sedět a lámat, jak ukazuje a vykládá okrouhlý půdorys věže s písmenem `A`. Tyto boční komory byly nabity střelným prachem {Puluer}, totiž deseti soudky {Don}: prach z jednoho soudku se rozsypal mezi ostatní a ostatním soudkům se po naplnění prachem vyrazilo po jednom dnu. Nato se do vstupního průlomu zasunulo tolik dlouhých klád o délce tloušťky zdi, kolik se jich do otvoru vešlo, a mocně se zatloukly a zaklínovaly. Pod tímto zaklínovaným dřevem byl zřízen zápalný kanálek. Klády zaklínované v otvoru se pak ještě vpředu před čelem znovu zaklínovaly: když prach vzplane a tlačí nazpět, opře se na obou stranách napříč o dřevo, a dřevo nemůže ven, protože prach netlačí do čela klád, nýbrž napříč proti nim. Proto musí zeď prasknout a vyletět, jak ukazuje okrouhlý půdorys věže.
- typ: odstavec
  de: |-
    Dann die ligenden rönden ist des Thurns grundt/ darinn zusehn ist wie es inwendig gemacht oder gemacht sol werden/ dann an dem auffgerichten Thurn ist solches nicht zusehen/ wie es inwendig gethan ist oder mann thůn soll/ darumb ist allwegen vor den auffzog ein grundt gerissen vnnd gelegt/ vmb gůts berichs vnnd verstands halben geschehen.
  cs: |-
    Ležící kruh je totiž půdorys věže, v němž je vidět, jak je to uvnitř uděláno či jak se to má udělat; na vztyčené věži nelze vidět, jak je to uvnitř provedeno nebo jak se to má provést. Proto je vždy před nárysem narýsován a položen půdorys, aby to bylo dobře vyloženo a srozumitelné.
- typ: odstavec
  de: |-
    Die Höltzer so in das loch zuuerdammen oder zuuerschliessen das Puluer eingeschoben vnd verkeilt sind/ sollen hindersich ein Schůch zu dem wenigsten in die Maur gehen für die zwerg brechung da das Puluer steht oder gesatzt ist/ damit solche Höltzer an beiden orten ein widerhalt oder stoß haben mögen/ damit das Puluer die Höltzer nit für das haupt treffe/ vnd herauß scheiben künde/ sonder vberzwerg/ wie vorn gemelt ist/ gegen einander wider solliche Höltzer oder drem wann das puluer angezündt ist stosse.
  cs: |-
    Klády, které se zasouvají do otvoru a zaklínovávají, aby prach zahradily a uzavřely, mají sahat dozadu nejméně o jednu stopu {Schůch} do zdi za příčný průlom, kde je prach uložen, aby měly na obou koncích oporu a doraz. Prach pak klády nezasáhne do čela a nemůže je vytlačit, nýbrž po zapálení narazí, jak bylo řečeno výše, napříč proti těmto kládám či trámům {drem}.
