    Celostránkový dřevořez s číslem „12“, monogramem Hanse Döringa „HD“ a letopočtem „1544“: nahoře trojrozměrný šikmý pohled na podseknuté (kónické) dělové kolo okované vnějšími železnými pásy a vnitřními krátkými příložkami se hřeby kolem dvanácti paprsků a vysokého kovaného náboje; uprostřed kolo v bočním profilu s vyznačeným zapuštěním čepů paprsků a rozměrným středovým nábojem; dole rozkreslené součásti – čtyři hlavičkové a průchozí kolářské hřeby, vnitřní krátká šína, samostatný osazený paprsek a vnější zahnutá šína s ohyby na koncích.
