id: 5-007r
list: 7 (5. kniha)
strana: recto
sken: 449
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    DIse hieuorn Figur mit G. verzeichnet/ zeigt an ein dicke gar alte Maur/ die ein trucken Graben vor jr hat/ vnd wann mann dañ auß der Schantzen zu solcher Maurn grebt/ es sei durch odder vnder dem Graben/ wie mann darbei komen kan. Vnd wann mann bei die Maur kompt vnd darein brechen will/ vnd wann mann so tieff vnder den grundt kem/ dann soll mann nit vnder die Maur graben/ vnd Puluer darunder setzen/ daßselbig vndern grundt setzen ist nicht gůt/ dann wann das Puluer angeht/ so ist zu dencken daß die maur also dick vnd hoch ein groß last hat/ vnd dem Puluer schwer zu heben/ wann dann die last so schwer/ vnnd das Erdtrich neben der Maurn grundt nit so hoch/ vnd auch nit so starck als die Maurn ist/ daß das Puluer die leichte vñ schweche suchen wirt/ da es am ersten außkommen vnd lufft haben mag/ das ist das Erdtrich neben der Maurn/ da wirt das Puluer durch das Erdtrich außbrechen/ vnd zu der lufft komen/ dann thůt es der dicken maurn nichts/ dieweil es neben die lufft ereicht hat/ so hat es kein krafft noch gewalt mehr wie das natürlich zu dencken ist.
  cs: |-
    Toto předchozí vyobrazení označené `G` ukazuje tlustou prastarou zeď, jež má před sebou suchý příkop; když se tedy ze zákopu k takové zdi kope – ať už skrze příkop nebo pod ním, jak se k ní lze dostat – a když člověk dospěje ke zdi a chce se do ní probourat, dostane-li se tak hluboko pod základ, nemá kopat pod zeď a ukládat prach pod ní. Ukládat nálož pod základ není dobré: neboť když prach vzplane, lze si představit, že tak tlustá a vysoká zeď má velikou tíhu a pro prach je těžké ji zvednout; je-li tedy zátěž tak těžká a zemina vedle základu zdi není ani tak vysoko, ani tak pevná jako zeď, pak si prach vyhledá nejsnadnější a nejslabší místo, kudy by nejrychleji unikl a nabyl vzduchu – a tím jest zemina vedle zdi. Tam prach vyrazí skrz hlínu a vyjde na vzduch, takže tlusté zdi nic neudělá; jakmile totiž nabyl po straně vzduchu, nemá již žádnou sílu ani moc, jak si lze snadno pomyslet.
- typ: odstavec
  de: |-
    Wie mann aber dem thůn soll/ zeigt dise Figur auch an/ vnd ist zu sehn auff der schmalen seiten an diser Figurn/ wie vnden im grundt vñ in der mitten der maurn dicke ein don oder fasz steht/ also soll mañ die maur brechen/ daß mann das puluer darein/ vnnd nit vnder die maur setze/ darnach der Donnen souil neben einander als mann vermeint zu werffen/ wann dañ das Puluer darin angeht/ dañ sprengt es vnden die maur von einander/ daß der grundt der maurn gar zerbricht vnd von einander springt/ hebt sie auch mit dem Puluer/ vnd ist allenthalben in der maurn gefangen/ vnd bricht also mit gewalt herauß.
  cs: |-
    Jak se však má postupovat, ukazuje toto vyobrazení rovněž: na úzké boční straně tohoto obrázku jest vidět, jak dole v základu a uprostřed tloušťky zdi stojí soudek či sud. Takto se má zeď vylámat, aby se prach uložil do ní a nikoli pod zeď, a podle toho vedle sebe tolik soudků, kolik je třeba k vyhození; když v nich pak prach vzplane, roztrhne zeď dole od sebe, takže se základ zdi docela rozlomí a rozskočí, zvedne ji také silou prachu, neboť je ze všech stran sevřen ve zdivu a prorazí tedy mocně ven.
- typ: odstavec
  de: |-
    Die ander Figur mit H. verzeichnet/ zeigt an/ wie mann auß der schantzen zu der Maurn farn vnd arbeiten soll/ vñ nit auff der schmalen seiten/ wie die Figur mit G. anzeigt da die Donn steht also hinein gebrochen vnd gearbeit werden/ sonder wie die ander Figur anzeigt/ wo es die gelegenheit geben wil/ auff einer oder beiden seiten in die maur zubrechen/ langst der maurn lang oder kurtz/ darnach mañ vil Donnen setzen wil/ darnach verrigelt wie hieuorn in der andern Figurn gnůgsam augenscheinlich vnnd schrifftlich bericht geschicht vnd angezeigt wirt.
  cs: |-
    Druhé vyobrazení označené `H` ukazuje, jak se má jet ze zákopu ke zdi a pracovat – a nikoli z úzké strany zdi, jak ukazuje obrázek `G` se stojícím soudkem, nýbrž jak ukazuje druhý obrázek: kdekoli to příležitost dovolí, prolomit se do zdi na jedné či na obou stranách podél zdi, delší či kratší komorou podle toho, kolik soudků chceš uložit, a poté ji zazávorovat, jak se výše na jiném vyobrazení dostatečně názorně i písemně vykládá a ukazuje.
