id: 5-007r
list: 7 (5. kniha)
strana: recto
sken: 449
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    DIse hieuorn Figur mit G. verzeichnet/ zeigt an ein dicke gar alte Maur/ die ein trucken Graben vor jr hat/ vnd wann mann dann auß der Schantzen zu solcher Maurn grebt/ es sei durch odder vnder dem Graben/ wie mann darbei komen kan. Vnd wann mann bei die Maur kompt vnd darein brechen will/ vnd wann mann so tieff vnder den grundt kem/ dann soll mann nit vnder die Maur graben/ vnd Puluer darunder setzen/ daßselbig vndern grundt setzen ist nicht gůt/ dann wann das Puluer angeht/ so ist zu dencken daß die maur also dick vnd hoch ein groß last hat/ vnd dem Puluer schwer zu heben/ wann dann die last so schwer/ vnnd das Erdtrich neben der Maurn grundt nit so hoch/ vnd auch nit so starck als die Maurn ist/ daß das Puluer die leichte vnd schweche suchen wirt/ da es am ersten außkommen vnd lufft haben mag/ das ist das Erdtrich neben der Maurn/ da wirt das Puluer durch das Erdtrich außbrechen/ vnd zu der lufft komen/ dann thůt es der dicken maurn nichts/ dieweil es neben die lufft ereicht hat/ so hat es kein krafft noch gewalt mehr wie das natürlich zu dencken ist.
  cs: |-
    Předchozí vyobrazení označené `G` ukazuje tlustou, velmi starou zeď, která má před sebou suchý příkop {Graben}, a jak se k takové zdi kope ze šance {Schantzen} – ať skrze příkop, nebo pod ním –, aby se k ní dalo dostat. Když se pak dojde ke zdi a má se do ní lámat a kdyby se přitom dostalo až tak hluboko pod základ, nemá se kopat pod zeď a ukládat prach pod ni. Ukládat nálož pod základ není dobré: když prach vzplane, je třeba uvážit, že tak tlustá a vysoká zeď má velkou tíhu, kterou prach jen těžko zvedne. Je-li tíha tak velká a zemina vedle základu zdi není tak vysoká ani tak pevná jako zeď, vyhledá si prach nejlehčí a nejslabší místo, kudy by nejdřív unikl a nabyl vzduchu – a tím je zemina vedle zdi. Tudy prach vyrazí zeminou ven na vzduch a tlusté zdi nic neudělá; jakmile totiž po straně dosáhne vzduchu, nemá už žádnou sílu ani moc, jak se dá přirozeně usoudit.
- typ: odstavec
  de: |-
    Wie mann aber dem thůn soll/ zeigt dise Figur auch an/ vnd ist zu sehn auff der schmalen seiten an diser Figurn/ wie vnden im grundt vnd in der mitten der maurn dicke ein don oder faß steht/ also soll mann die maur brechen/ daß mann das puluer darein/ vnnd nit vnder die maur setze/ darnach der Donnen souil neben einander als mann vermeint zu werffen/ wann dann das Puluer darin angeht/ dann sprengt es vnden die maur von einander/ daß der grundt der maurn gar zerbricht vnd von einander springt/ hebt sie auch mit dem Puluer/ vnd ist allenthalben in der maurn gefangen/ vnd bricht also mit gewalt herauß.
  cs: |-
    Jak se to však má dělat, ukazuje toto vyobrazení také: na jeho úzké straně je vidět, jak dole v základu, uprostřed tloušťky zdi, stojí soudek či sud {faß}. Tak se má zeď vylámat, aby se prach uložil do ní, a ne pod ni, a k tomu vedle sebe tolik soudků, kolik je podle odhadu třeba k vyhození. Když v nich prach vzplane, roztrhne zeď dole od sebe, takže se základ zdi docela rozlomí a rozletí; prach ji zároveň zvedne, a protože je ve zdivu ze všech stran sevřen, prorazí mocně ven.
- typ: odstavec
  de: |-
    Die ander Figur mit H. verzeichnet/ zeigt an/ wie mann auß der schantzen zu der Maurn farn vnd arbeiten soll/ vnd nit auff der schmalen seiten/ wie die Figur mit G. anzeigt da die Donn steht also hinein gebrochen vnd gearbeit werden/ sonder wie die ander Figur anzeigt/ wo es die gelegenheit geben wil/ auff einer oder beiden seiten in die maur zubrechen/ langst der maurn lang oder kurtz/ darnach mann vil Donnen setzen wil/ darnach verrigelt wie hieuorn in der andern Figurn gnůgsam augenscheinlich vnnd schrifftlich bericht geschicht vnd angezeigt wirt.
  cs: |-
    Druhé vyobrazení, označené `H`, ukazuje, jak se má ze šance razit ke zdi a pracovat – ne z úzké strany, kde se podle obrázku `G` prolomilo dovnitř a stojí tam soudek, nýbrž jak ukazuje druhý obrázek: kde to poloha dovolí, prolomit se do zdi z jedné nebo z obou stran a vést komoru podél zdi, delší či kratší podle toho, kolik soudků se má uložit, a pak ji zahradit, jak se výše na jiném vyobrazení dostatečně názorně i písemně vykládá a ukazuje.
