strana: verso
sken: 358
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Ist ein Puluer verdorben vor alter vnd ist der Salpeter darinn gůt so nim das Puluer / vnd seud das in gůtem wein / vnd rür daß fast vnd es sich vor dicke nicht wil lassen rüren / vnd thů denn dar zů frische Kolen / alsouil du jhr bedarffest / vnd thů das denn in ein gůten hären sack / vnd heng den sack in ein heisse stuben / vnd daß das Puluer wol getrucknet.
  cs: |-
    Je-li střelný prach {Puluer} stářím zkažený a ledek {Salpeter} je v něm dobrý, vezmi ten prach, vař jej v dobrém víně a usilovně jej míchej, až se pro hustotu nebude chtít dát míchat;[^1] potom k němu přidej čerstvého dřevěného uhlí {Kolen}, kolik ho potřebuješ, dej to do dobrého žíněného pytle a pověs pytel do vytopené světnice, aby prach dobře vyschl.
- typ: nadpis
  uroven: 3
  de: Wenn ein Puluer vor alter verdorben ist / so soltu jm also wider helffen / etc.
  cs: Když je prach stářím zkažený, máš mu takto opět pomoci atd.
- typ: odstavec
  de: |-
    WIltu böß Puluer von einander scheiden / vnnd dennoch wider gůt machen / nim das Puluer vnd thů das in einn guten zwilchen sack vnd thů Wein in ein Kessel / vnd seud daß das wol vbergehe / vnd leg den sack hinein so zeucht der Salpeter in den wein / vnd bleibt der Schwefel in dem sack / vnd schüt denn den wein ab in ein sauber geschirr / vnd laß jhn kalt werden / vnd ehe es ist kalt worden / so nim den Salpeter herauß / vnd seud den wein zum andernmal / vnd thů Salarmoniac darzů / so scheidt vnd reinigt es sich.
  cs: |-
    Chceš-li špatný prach rozdělit a přesto z něj opět udělat dobrý, vezmi prach, dej jej do dobrého cvilichového pytle, nalej do kotle víno a vař je, až dobře vzkypí; vlož do něj pytel – tak se ledek vytáhne do vína a síra {Schwefel} zůstane v pytli. Potom víno slij do čisté nádoby a nech je vychladnout; a než docela vystydne, vyjmi ledek, víno povař podruhé a přidej k němu salmiak (*Salarmoniac*), čímž se oddělí a vyčistí.
- typ: nadpis
  uroven: 3
  de: Wie mann Puluer vnter einander scheiden soll.
  cs: Jak se má prach od sebe oddělovat
- typ: odstavec
  de: |-
    ES geschicht dick vnd offt daß das Puluer vor alter böß wirt / vnd daß die Koln feucht werden / aber das der Salpeter nicht wol geleutert ist / vnd daß das verdirbt / dem soltu also wider helffen / du solt nemen gebranten wein / vnd solt darinnen sieden / Salpeter vnnd Salpartica gleich / vnd solt das Puluer auch heiß sieden / dann du möchst den wein verschüten / vnd darnach soltu das gar wol stossen / vnd solt nemen ein Erden Hafen / vnd thůs darein / vnd vermach den Hafen wol / vnd setz jn in einen Bachofen der nicht zu heiß sei / vnd daß das Puluer jn dem Hafen wol ertrücken / so nim es denn herauß vnd vberstosse das ein wenig / vnd nicht zu vil / so kompt das Puluer alles zu jhm selber / vnd wirt besser dann es vor je gewesen ist.
  cs: |-
    Stává se často a zhusta, že se prach stářím zkazí a že uhlí zvlhne anebo že ledek není dobře přečištěný a prach se zkazí; tomu máš pomoci takto: vezmi pálené víno a vař v něm stejným dílem ledek a skalnou sůl (*Salpartica*),[^2] a máš prach také zatepla vařit, neboť bys jinak mohl víno rozlít.[^3] Potom to velmi dobře utluč, vezmi hliněný hrnec, dej to do něj, hrnec dobře uzavři a vlož jej do pekařské pece, která není příliš horká, aby prach v hrnci dobře vyschl; pak jej vyjmi a lehce jej přetluč, avšak ne příliš – tak přijde prach opět k sobě a bude lepší, než byl kdy předtím.
- typ: nadpis
  uroven: 3
  de: Item in disem nachgeschriben Capetel / findstu ein gůt gewisse lere / wie du die drei stück / Salpeter / Schwefel / vnd Koln / wenn sie gestossen sein vnd zu Büchsenpuluer vnter einander scheidest / vnd das jeglichs stück besonder von einander nimbst.
  cs: Dále v této následující kapitole[^4] najdeš dobré a spolehlivé poučení, jak rozdělit všechny tři složky – ledek, síru a uhlí –, když jsou utlučeny v puškový prach {Büchsenpuluer}, a jak každou složku zvlášť od sebe oddělit
poznamky:
- n: 1
  text: |-
    V tisku stojí *vnd es sich vor dicke nicht wil lassen rüren* – ve smyslu „až (dokud) se to pro hustotu nebude dát míchat“ (*vnd* zde zastupuje časové *biß*).
- n: 2
  text: |-
    *Salpartica* – zkomolený název pro druh soli či ledku (snad *Sal gemmae* / *Sal petrae* nebo *Sal practika*).
- n: 3
  text: |-
    Text v předloze zřejmě zkomolen (*vnd solt das Puluer auch heiß sieden / dann du möchst den wein verschüten*) – původní recept nejspíše varoval před přílišným varem či vzkypěním (*nit zu heiß sieden*), při němž by pálenka překypěla.
- n: 4
  text: |-
    Tisk má nářeční tvar *Capetel* místo *Capitel* („kapitola“).
