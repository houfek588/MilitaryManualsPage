bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    geschehen / daß mich bedeucht / so mann das in der zeit recht ordnen / vnd darüber gestreng halten würde / es solt auch recht zugehn / vnnd das Volck desto statlicher zuerhalten sein.
  cs: |-
    vznikají; takže se mi zdá, že kdyby se to včas řádně uspořádalo a přísně se na to dbalo, šlo by všechno správně a lid by se dal tím lépe uživit.
- typ: odstavec
  de: |-
    Item / ein maß von Korn oder Treidt wirt in disem Landt genennet / Ein Achtel Korn / ist gemeinlich vnnd vngefehrlich auff 163. pfundt angeschlagen vnd geeicht / auch helt diß Achtel nach in sich 8. kleiner maß / deren ein vngefehrlich schwer ist / zwentzig vnd ein halb pfundt.
  cs: |-
    Dále: míra žita nebo obilí se v této zemi nazývá achtel {Achtel}[^1] žita; je obvykle a přibližně odhadnut a cejchován na 163 liber {pfundt}, a tento achtel obsahuje dále 8 menších měr, z nichž jedna váží přibližně dvacet a půl libry.
- typ: odstavec
  de: |-
    Item / auß disem grossen Achtel wirt ein Brot / welches an Teyg schwer ist zwei pfundt vnd dreizehen loth / wann es gebachen wirdt / so helt es geradt zwei pfundt / vnd werden auß obgemeltem maß oder Achtel deren Brot neuntzig / vnd auß dem kleinen maß eilff / vnd ein vierteil eins Brots.
  cs: |-
    Dále: z tohoto velkého achtelu se peče chléb, který v těstě váží dvě libry a třináct lotů {loth}; když se upeče, má právě dvě libry. Z výše uvedené míry čili achtelu se upeče devadesát takových chlebů, a z malé míry jedenáct a čtvrt chleba.
- typ: odstavec
  de: |-
    Item / wann von sollichen Brotten / einer Person einen tag ein Brot gelieffert wirt / so geht auff hundert personen hundert Brot / die wigen zwei hundert pfundt / Darnach auff fünffhundert personen / fünffhundert Brot / die wigen tausent pfundt.
  cs: |-
    Dále: vydává-li se z takových chlebů jedné osobě jeden chléb na den, připadá na sto osob sto chlebů, které váží dvě stě liber; a dále na pět set osob pět set chlebů, které váží tisíc liber.
- typ: odstavec
  de: |-
    Item / auff die fünffhundert Personen / geht ein wochen fünff vnd zwentzig hundert Brot / vnd ist schwer an gewicht sibentausent pfund / das seind sibentzig Centner / jeden Centner zu hundert pfunden gerechnet / vnnd thůt an Korn daruon das Brot gebachen wirt / acht vnd dreissig Achtel / vnd siben metzen.
  cs: |-
    Dále: na pět set osob připadá za týden dva tisíce pět set chlebů[^2], a na váhu je to těžké sedm tisíc liber, to jest sedmdesát centů {Centner}, každý cent počítán po stu librách, a na žito, z něhož se ten chléb peče, to činí třicet osm achtelů a sedm měřic {metzen}[^3].
- typ: odstavec
  de: |-
    Item / auff die fünffhundert personen gehet einen Monat lang (welches dreissig tag seind) fünfftzehen tausent Brot / vnnd wigen dreissig tausent pfundt / das macht drei hundert Centner / vnd thůt an Korn / hundert sechs vnd sechzig Achtel / vnd fünff Metzen.
  cs: |-
    Dále: na pět set osob připadá za jeden měsíc (což je třicet dní) patnáct tisíc chlebů a váží třicet tisíc liber, to činí tři sta centů a v žitě to činí sto šedesát šest achtelů a pět měřic.
- typ: odstavec
  de: |-
    Item / auff tausent Personen geht ein Wochen sibentausent brot / wigen vierzehentausent pfundt / ist hundert vnd viertzig Centner / das thůt an Korn siben vnd sibentzig Achtel / vnd sechs Metzen / Thůt einen Monat lang dreissigtausent Brot / die wigen sechzig tausnet Pfundt / macht sechshundert Centner / thůt an Korn dreihunder drei vnd dreissig Achtel / vnd zwo Metzen.
  cs: |-
    Dále: na tisíc osob připadá za týden sedm tisíc chlebů, váží čtrnáct tisíc liber, to jest sto čtyřicet centů, a v žitě to činí sedmdesát sedm achtelů a šest měřic. Za jeden měsíc to činí třicet tisíc chlebů, které váží šedesát tisíc liber, to je šest set centů, a v žitě to činí tři sta třicet tři achtely a dvě měřice.
- typ: odstavec
  de: |-
    Item / auff fünff tausent Person gehet einn tag fünfftausent Brot / ist zehentausent pfundt / thůt 100. Cenßner / mach an Korn 55. Achtel / vnd vier Metzen / Darnach ein Wochen auff 5000. Personen / gehet fünff vnd dreissig tausent brot / thůt an gewicht sibentzig tausent pfund / thůt an Korn 388. Achtel / siben Metzen. Ein Monat lang auff die benente Personen gehet hundert vnd fünfftzigtausent Brot / thůt an gewicht dreihundert tausent pfundt / macht 3000. Centner / thůt an korn tausent sechs vnd sechzig Achtel / vnd fünff Mentzen.
  cs: |-
    Dále: na pět tisíc osob připadá za jeden den pět tisíc chlebů, to jest deset tisíc liber, což činí 100 centů a v žitě 55 achtelů a čtyři měřice. Dále za jeden týden na 5000 osob připadá třicet pět tisíc chlebů, na váhu sedmdesát tisíc liber a v žitě 388 achtelů a sedm měřic. Za jeden měsíc na jmenované osoby připadá sto padesát tisíc chlebů, na váhu tři sta tisíc liber, to činí 3000 centů a v žitě tisíc šedesát šest achtelů a pět měřic[^4].
poznamky:
- n: 1
  text: |-
    Achtel – regionální obilná míra (zde ~163 liber, tj. asi 80 kg), dělená na 8 menších měr zvaných měřice (Metzen) po ~20,5 libře.
- n: 2
  text: |-
    Chyba tisku: pro 500 osob na 7 dní vychází 3500 chlebů (nikoli 2500), čemuž také odpovídá uvedená váha 7000 liber (70 centů) i spotřeba žita 38 achtelů a 7 měřic (3500 : 90 = 38,89 achtelu). Starý čtenář do levého okraje rukou dopsal „35“ a „dreißig“.
- n: 3
  text: |-
    Metzen – menší dutá obilná míra (zde osmina achtelu, asi 20,5 libry; později na fol. 41v dvanáctina šeflu/korce po 12 librách).
- n: 4
  text: |-
    Chyba tisku: 150 000 chlebů vyžaduje 150 000 : 90 = 1666 achtelů a 5 měřic (tisk vynechal „sechshundert“ a uvádí jen 1066 achtelů). V originálu stojí tvary „Cenßner“, „tausnet“, „dreihunder“ a „Mentzen“.
