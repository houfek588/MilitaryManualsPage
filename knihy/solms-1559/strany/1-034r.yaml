bloky:
- typ: odstavec
  de: |-
    So will ich mit diser beschreibung beschliessen / als vor einen bericht einer Kriegßregirung / die vermeldet die mengel vnd einfallende mißbreuch die eigen nützig geacht / vnnd gůter Kriegßregierung zu wider vnd entgegen sein mögen / gnůgsam angezeigt / bleiben lassen / vnd nun fürt vnd weitter greiffen vnder die Ampter des Kriegs wie die vor zeiten vnd biß noch von den Teutschen nach der Römer gebrauch gehalten seind worden / ein jedes besonder mit aller seiner gebürenden versehung beschreiben vnd bericht thůn / welcher der Ampter die fürnembsten Artickel anzeigen vnd berichten wirt / vnd seind sollicher Ampter vnderschiedlich vier vnd zwentzig in summa / So ist einem Herren zurathen / daß er sich nach verstendigen Kriegßleuten vmb thů / die gůts Raths sein vnd mit denen handel / vnd nicht auff die Schnarcher vnd Bocher / die von vilem geschrei / vnnd nicht gůts Raths seind / sonder jre sachen allein auff vil bochen vnnd schnarckens stellen / vnd nicht gůts Raths befunden werden / dann wirt ein Herr mit seinem Krieg wol faren vnd regieren. Doch so will ich dise meine Beschreibung nicht dahin vermeint noch verstanden haben / als daß ich dem gnůgsam sein maß geben wöl / sonder souil ich das verstehe / vnd darinn gebrechen oder mengel gesehen hab / trewlich berichten / darmit wider gůt Kriegßordnung möcht auffgericht vnd gehalten werden / vnd besonder daß die Teutschen bei jren alten ehrlichen vnd gůten Kriegßordnungen / wie allwegen / bleiben möchten / das Gott mit gnaden verleihen wöl.
  cs: |-
    Tímto chci tento popis uzavřít a ponechat jej jako zprávu o válečné správě, která dostatečně ukázala nedostatky a vnikající zlořády, jež lze pokládat za zištné a jež mohou dobré válečné správě odporovat a překážet. Nyní chci postoupit dále k válečným úřadům, jak je Němci odedávna až dosud zachovávali podle římského zvyku: popsat každý zvlášť se vším, co mu náleží, a podat zprávu, která ukáže a vyloží nejpřednější články těchto úřadů. Takových rozdílných úřadů je dohromady dvacet čtyři.[^1] Pánovi tedy lze radit, aby se ohlédl po rozumných válečnících {Kriegßleuten}, kteří umějí dobře poradit, a jednal s nimi – a ne s křiklouny a chvastouny, kteří nadělají mnoho povyku, ale dobře poradit neumějí, své věci stavějí jen na chlubení a chvástání a dobrá rada se u nich nenajde. Pak pán ve své válce dobře pochodí a bude dobře vládnout. Nechci však, aby byl tento můj popis míněn či chápán tak, jako bych tomu chtěl dostatečně vyměřit míru. Chci jen věrně podat zprávu, nakolik tomu rozumím a jaké vady či nedostatky jsem v tom spatřil, aby mohl být opět zřízen a zachováván dobrý válečný řád, a zvláště aby Němci mohli jako vždy zůstat při svých starých, čestných a dobrých válečných řádech. To nechť Bůh z milosti popřeje.
- typ: nadpis
  uroven: 2
  de: |-
    Volget ein gesprech zweier Personen / wie ein Alter einen Jungen vnderricht / mit sampt einer Instruction wie sich der Jung halten soll.
  cs: |-
    Následuje rozmluva dvou osob, v níž Starý poučuje Mladého, spolu s instrukcí, jak se má Mladý chovat.
poznamky:
- n: 1
  text: |-
    Odkaz na dvacet čtyři vojenských úřadů, které Solms podrobně popisuje v následující Druhé knize.
