list: 22 (9. kniha)
strana: verso
sken: 664
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Wann yr dise ordnung/ wie oben yetzt geschrieben/ machen kündt/ ehe daß die Stat belegert/ wirt es euch vnd den ewern wunderbarlich wol erschiessen/ dann ein yeglicher desto rühiger ist wann er weiß was er thůn soll/ dann wann yr belegert seind/ ehe yr ewer Volck dermassen geordnet/ werd yr fünff oder sechs tag gnůg vnd mehr zu schaffen haben mit dem Geschirr dann mit den Feinden.
  cs: |-
    Můžete-li tento řád, jak byl právě popsán, zavést dřív, než bude město obleženo, přijde to vám i vašim lidem podivuhodně vhod, neboť každý je klidnější, ví-li, co má dělat. Budete-li však obleženi dřív, než takto uspořádáte svůj lid, budete mít pět nebo šest dní víc než dost práce, a to spíš s náčiním {Geschirr}[^1] než s nepřítelem.
- typ: odstavec
  de: |-
    Es ist auch von nöten daß jhr einen gůten theil ewers hauffens darnach er groß ist/ mitten inn der Stat/ es sei auff dem Marck oder sonst auff einem platz/ der bequemlich vnd tüglich darzů ist/ behalten/ vnd wann ein lermen wirt sollen sie auff demselbigen platz inn einer ordnung stehn/ vnd nit verrücken sonder warten wo mann jrer notturfftig were daß mann sie dahin gebrauchen künde.
  cs: |-
    Je také nutné, abyste si dobrou část svého houfu, podle toho, jak je velký, ponechali uprostřed města, ať na tržišti, nebo na jiném prostranství, které je k tomu příhodné a vhodné. Když nastane poplach {lermen}, mají na tomto prostranství stát v šiku {ordnung} a nehnout se z místa, nýbrž čekat, kde by jich bylo zapotřebí, aby je tam bylo možné nasadit.
- typ: odstavec
  de: |-
    Jr solt auch für ein jeglichs hauß ein faß mit wasser stellen lassen/ ob ein feur außging daß mans leschen künde/ zu solchem geschefft solt jr man vnd frawen so noch in der Stat blieben/ verordnen/ wann jr Häusser habt die mit stro oder schindeln gedeckt seind/ solt jhr dieselbigen als dick jr kundt mit erden bedecken lassen/ darmit die Feind nit fewer hinein werffen oder schiessen/ Das ist die ordnung die jr meins bedünckens in einer stat halten solt/ wann jr ewers feinds darinn warten wolt. Wann jr nun alles (wie oben steht) gethan/ vnd doch die feind noch nit komen/ wil ich euch anzeigen wie jr die stat tag vnd anch verwarn solt/ Erstlich wann jr euch vor denen in der stat besorgt/ solt jr zu einem jeglichen Thor einen Hauptman mit zehen oder zwölff gerüster man stellen/ der da den gantzen tag bleib/ deßgleichen wolt ich auff die Polwerck auch Wechter bestellen/ vnd einen auß meinem hoffgesind zugeben/ damit kein verretei darauß würde/ solchen fleiß solt jr nachts auch brauchen/ Dann warlich vor etlichen jarn vil verreterei dardurch geschehen/ auch solt jr allweg zwen die auff den Thorheusern wachen/ verordnen/ die zu denen auff die Polwerck gehn/ wann sie einn betrug mercken/ daß sie die schützgeter gleich zu fallen liessen/ wann jr aber der Porten zuuil in der Stat habt die nit fest vnnd gůt sein/ möcht jr wol die jenigen so euch nit nützlich seind vermaurn laslasen/ auch wann ein lermen wirt solt yr verbieten das keiner für die Thor oder schrancken hinauß gehe/ biß yhr kompt/ vnd verordnen welcher hinauß ziehen solt/ vnnd ye weniger yr herauß fallet im anzug der Feind ye besser es ist/ dann es bösen lon gibt/ yr habt dann ein vortheil innen daß euch die feind desto weniger schaden zufügen künden.
  cs: |-
    Také máte dát ke každému domu postavit sud s vodou, aby se dalo hasit, kdyby vypukl oheň; k této práci máte určit muže a ženy, kteří ve městě ještě zůstali. Máte-li domy kryté slámou nebo šindelem, dejte je pokrýt co nejsilnější vrstvou hlíny, aby do nich nepřítel nemohl házet nebo střílet oheň. To je řád, který byste podle mého zdání měli ve městě zachovávat, chcete-li v něm nepřítele očekávat. Když jste nyní všechno vykonali, jak výše stojí, a nepřítel ještě nepřišel, chci vám ukázat, jak máte město ve dne i v noci[^2] střežit. Za prvé, obáváte-li se těch, kdo jsou ve městě, máte ke každé bráně postavit hejtmana {Hauptman} s deseti nebo dvanácti ozbrojenými muži, který tam zůstane celý den. Stejně tak bych i na bolverky {Polwerck} postavil hlídače a přidal k nim někoho ze svého dvorního služebnictva, aby z toho nevzešla žádná zrada[^3]. Stejnou péči máte vynaložit i v noci, neboť věru se tím před několika lety dopustilo mnoho zrad. Také máte vždy ustanovit dva muže, kteří budou bdít na branních věžích a chodit k těm na bolverkách; zpozorují-li nějakou lest, ať ihned spustí padací mříže {schützgeter}. Máte-li však ve městě příliš mnoho bran, které nejsou pevné a dobré, můžete dát zazdít ty, které vám nejsou užitečné[^4]. Když nastane poplach, máte také zakázat, aby kdokoli vyšel před brány nebo závory, dokud nepřijdete, a máte určit, kdo má vytáhnout ven. Čím méně budete vyrážet ven, když nepřítel přitahuje, tím lépe, neboť to přináší zlou odplatu – leda byste tam měli nějakou výhodu, takže by vám nepřítel mohl uškodit tím méně.
- typ: odstavec
  de: |-
    Jch wolt auch die Thor bei gůtem hellen Sonnen schein zůthun lassen/ vnd zwen verordnen die auff die Thor warten müssen biß die
  cs: |-
    Brány bych také dal zavírat ještě za jasného slunce a ustanovil bych dva muže, kteří musí u bran čekat, dokud
poznamky:
- n: 1
  text: |-
    *Geschirr* – zde obecně náčiní, vybavení a výstroj (nářadí, povozy, postroje), jejichž uspořádání by obleženým zabralo víc času než sám nepřítel.
- n: 2
  text: |-
    V tisku *tag vnd anch* – tisková chyba za *tag vnd nacht* („ve dne i v noci“).
- n: 3
  text: |-
    *verretei* – tak v tisku (vypadlá slabika), o několik slov dál správně *verreterei* („zrada“).
- n: 4
  text: |-
    *vermaurn laslasen* – v tisku na přelomu řádku zdvojená slabika (*las-|lasen*) místo *lassen*.
