bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    schiessen nit abzubrechen ist / wie hieuorn auch daruon gemelt / als nemlich durch festung / vnd ein starcke besatzung mit menig der leut / so nun die menge der leut in einer Stat sind / so will es auch ein grosse Prouiant erfordern mit viler vnderhaltung / vnd so ein grosser hauff leut bei einander sind / vnd mit prouiant nit versehen / so ist gůt zu achten / daß sie die leng nit bleiben mögen / wirts nun glücken / das ein Stat also durch die Mörser mit Feurwerffen gebrant mocht werden so ist gůt zu dencken / daß der Vorradt mit Prouiant verbrent / so der dann also verbrent ist wie mögen sie dann bleiben / wer wil sich dann auch zu jn hinein thůn. Vnd weiter so es glücken / daß es wie gemelt / von schiessen angehn wirt / so möcht man ein sturm darauff ordnen / wolten sie dann zum sturm lauffen / so mussen sie es brennen lassen / wolten sie dann dem Feur wehrn / so mussen sie den sturm oder anlauff geschehen lassen. Möcht einer sagen / Man kan besondere leut zum Feur ordnen / als weiber vnd vnwehrlich leut / vnd was wehrlich wer / auff den Letzen vnd wehrn lassen / ist wol ein rede / Mann sicht aber wol / so man ein sturm wehren soll daß man vnd weib zuthůn haben mit zutragen vnd dergleichen / So wirts mit disem feurwerffen nit so gemach zugehn / wie bisher geschehen ist / dann diß wirt mit einem andern vorteil dann vor geschwinder geschehen / das nit vor weiber sein wirt / dann es muß still vnd vnuerschenlich zugehn.
  cs: |-
    ublížit střelbou, jak už o tom bylo výše řečeno – totiž díky opevnění a silné posádce {besatzung} s množstvím lidí. Je-li však ve městě množství lidí, vyžaduje to také velké zásoby proviantu {Prouiant} k jejich obživě; a je-li pohromadě tak veliký houf {hauff} lidí, kteří nejsou zásobeni proviantem, lze snadno usoudit, že nemohou dlouho vydržet. Podaří-li se tedy město zapálit ohněm vrhaným z moždířů {Mörser}, je nasnadě, že shoří i zásoby proviantu; a když shoří, jak pak mohou vydržet? A kdo by se k nim potom chtěl přidat dovnitř? Podaří-li se dále, jak bylo řečeno, že město od střelby začne hořet, dal by se na ně nařídit útok {sturm}. Kdyby pak [obránci] chtěli běžet k útoku, museli by nechat oheň hořet; a kdyby chtěli hasit, museli by útok čili zteč dopustit. Mohlo by se namítnout,[^1] že k ohni lze určit zvláštní lidi, jako ženy a neozbrojený lid, a ty, kdo jsou schopni boje, nechat na stanovištích {Letzen} a na obraně. To se snadno řekne, je však dobře vidět, že když se má odrážet útok, mají muži i ženy dost práce se snášením [potřeb] a podobně. A s tímto vrháním ohně to nepůjde tak pomalu jako dosud: půjde to s jinou výhodou a rychleji než dříve, takže to nebude nic pro ženy, neboť se to musí dít tiše a nenadále.
- typ: odstavec
  de: |-
    So ich nun mit meinn 40. Mörsern vnnd Kugeln geschickt bin / wie ich angezeigt hab mit aller ordnung / vnd mein Schantzen seind gemacht / vnd durch Büchsenmeister die schiessen sollen besehen vnd zugericht / damit ein jeder wisse wo er mit seinem stuck vnd zeug ligen will / So wil ich nit bei tag sonder bei der nacht fürziehen / wil auch solchen zeug nit im leger machen daß man es sehe / aber wils also zurichten daruorn / so ich nahent hinbei kom wil ich die pferdt abspannen von Büchsen vnd wagen / vnd mit leuten thůn damit es still zugeht wie das zugericht sein soll / wirt hernach eigentlich angezeigt.
  cs: |-
    Jsem-li tedy se svými 40 moždíři a koulemi {Kugeln} připraven ve vší pořádku, jak jsem ukázal, a mé šance {Schantzen} jsou hotovy, prohlédnuty a upraveny puškaři {Büchsenmeister}, kteří mají střílet, aby každý věděl, kde má se svým kusem {stuck} a náčiním ležet, nechci postupovat ve dne, nýbrž v noci. Ani nechci takové náčiní chystat v ležení {leger}, aby to bylo vidět, nýbrž je chci připravit předem tak, abych jakmile se přiblížím, odpřáhl koně od děl {Büchsen} i vozů a nechal je táhnout lidmi, aby to šlo tiše. Jak to má být zařízeno, bude dále podrobně ukázáno.
- typ: odstavec
  de: |-
    Vnd were mein bedencken wann man den abent spat in die schantzen keme / daß mann etwan vmb die 12. vhren anheb zuschiessen wan das volck im schlaff were also daß die Büchsenmeister das vereinigt hetten / so bald sie in die schantz kemen / daß jr leut mit allem in der arbeit wern / daß nit sobald ein Büchs möcht abgeschossen werden / das einer mit puluer der ander mit der Kugeln da wern / vnd jre sachen zu der eil vnd fürterung richten. Vnd ob es schon an einem ende oder etlich in der stat brent / sollen die Büchsenmeister doch nit auff hörn / sonder alles fort geworffen biß sie durch Hauptleut die darüber geordnet / geheissen werden auffzuhören / Nun ist zubedencken / wann es
  cs: |-
    Mým míněním by bylo, aby se do šancí přišlo pozdě večer a začalo se střílet asi kolem dvanácté hodiny,[^2] kdy lid spí. Puškaři by se měli předem domluvit, aby jejich lidé byli hned po příchodu do šance se vším v plné práci: sotva jedno dělo vystřelí, má už u něj stát jeden se střelným prachem {puluer} a druhý s koulí a chystat vše co nejrychleji a nejhbitěji. A i kdyby už ve městě na jednom či několika místech hořelo, nemají puškaři přestávat, nýbrž vrhat dál, dokud jim hejtmané {Hauptleut}, kteří jsou nad nimi ustanoveni, nepřikážou přestat. Nyní je třeba uvážit, když se
poznamky:
- n: 1
  text: |-
    BSB OCR zde četlo *Nicht einer sagen* místo *Möcht einer sagen* (tím by se obrátil smysl námitky) a *Legen* místo *Letzen* („stanoviště“).
- n: 2
  text: |-
    V BSB OCR bylo *vhren* („hodin“) chybně přečteno jako *ohren* a *nit auff hörn* („nepřestávat“) jako *mit auff hörn*.
