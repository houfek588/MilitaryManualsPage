bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vnd wirt billich der vrsachen halben widerrathen/ dann wann ein Hauptman wachen zuthůn/ odder sonst etwas mit seinen Knechten versehen soll/ schickt er gewonlich sein Leutenant/ dardurch wirt leichtlich etwas verwarloßt/ daß dem gantzen Leger zu nachtheil reicht.
  cs: |-
    a z dobrých důvodů se od toho odrazuje; neboť má-li hejtman {Hauptman} držet stráž {wachen} nebo se svými knechty {Knechten} obstarat něco jiného, posílá obvykle svého poručíka {Leutenant}, čímž se snadno něco zanedbá k újmě celého ležení {Leger}.
- typ: odstavec
  de: |-
    Nachuolgend ordinarie Ampter die der gemein Man setzt/ vnd allen Monat zuentsetzen hat/ nemlich vnder jeglichem Fendlin.
  cs: |-
    Následují řádné úřady, které ustavuje obec {gemein Man} a může je každý měsíc sesadit, a to u každého praporce {Fendlin}:
- typ: seznam
  de:
  - Ein Fürer/
  - zwen Weibel/
  - ein Forierer.
  cs:
  - jeden vůdce {Fürer},
  - dva šikovatelé {Weibel},
  - jeden furýr {Forierer}.
- typ: odstavec
  de: |-
    Der Oberst vber die Knecht/ hat den zehenden pfenning/ von allen beuten so die Knecht gewinnen.
  cs: |-
    Plukovník {Oberst} nad knechty má desátý peníz ze veškeré kořisti, kterou knechti získají.
- typ: odstavec
  de: |-
    Welcher Knecht von schendlicher thatten wegen sein Eher/ leib/ vnd leben verwirckt/ das gůt was er im Leger hat/ ist dem Obersten verfallen.
  cs: |-
    Propadne-li některý knecht pro hanebné činy čest, hrdlo i život, propadá majetek, který má v ležení, plukovníkovi.
- typ: odstavec
  de: |-
    Diser Oberst gibt den Metzlern die sein volck mit fleisch versehen/ auch den marcatanten/ welche in seim Leger vil haben potenten oder Compaßbrieffe/ daruon hat er etwas/ aber nit vil/ er soll auch gůt Ordnung in disem Artickel lassen halten/ damit als vil möglich/ das sterben verhüt werde.
  cs: |-
    Tento plukovník vydává řezníkům, kteří zásobují jeho lid masem, i markytánům, jichž v jeho ležení bývá mnoho, povolení neboli průvodní listy[^1]; má z toho nějaký příjem, ne však veliký. Má také v této věci dbát na dobrý pořádek, aby se pokud možno předešlo hromadnému umírání[^2].
- typ: odstavec
  de: |-
    Der Oberst gibt allen Kriegsleuten/ die vnder seiner verwaltung ligen/ Pasporten/ vnd sonst one sein bewilligung niemant/ welchers darüber thůt/ der handelt vnreht vnd strefflich/ darzu wist der Oberst Veldhauptman nit wen er leut im Leger hett oder nit.
  cs: |-
    Plukovník vydává průvodní listy {Pasporten} všem válečníkům {Kriegsleuten}, kteří jsou pod jeho správou, a bez jeho svolení je nikdo jiný nedostane. Kdo tak přesto učiní, jedná neprávem a trestuhodně; nejvyšší polní hejtman {Oberst Veldhauptman} by navíc nevěděl, zda má v ležení lidi, či nikoli.
- typ: odstavec
  de: |-
    Der Oberst/ wann er die hohen vnd nidern Ampter besatzt hat/ zeigt er einem jeden im ringe an/ darmit ein jeglicher wisse/ von welchen die ämpter versehen werden sollen.
  cs: |-
    Jakmile plukovník obsadí vyšší i nižší úřady, oznámí to každému v kruhu {ringe}, aby každý věděl, kým mají být úřady spravovány.
- typ: odstavec
  de: |-
    Der Oberst verordnet seine hauffen im zuge/ wann die Feinde nit vorhanden sein/ dergestalt/ seind der hauffen zwen/ zeuch einer einn tag vmb den andern vor/ seind aber der hauffen drei oder mehr so geht es doch mit den zügen gleich vmb/ wie sich gebürt.
  cs: |-
    Plukovník rozvrhuje své houfy {hauffen} na pochodu {zuge}, nejsou-li nablízku nepřátelé, takto: jsou-li houfy dva, táhne jeden obden před druhým; jsou-li však houfy tři nebo více, střídají se na pochodu stejně po řadě, jak se sluší.
- typ: odstavec
  de: |-
    So aber die Feinde vorhanden sein/ macht der Oberst ein Hauffen/ der allweg zu den Feinden den vorzug/ vnnd von Feinden den nachzug hat/ darzu nimpt er nach gelegenheit der Knecht/ auß einer Rot ein/ zwen/ drei/ oder wie es jhn mit seinen Kriegsuerstendigen für notwendig ansicht/ disen heissen die Landsknecht/ den verlorn vnd etwan den lauffenden Hauffen/ die Schweitzer nennen jn die Harst.
  cs: |-
    Jsou-li však nepřátelé nablízku, zřídí plukovník houf, který má vždy při postupu k nepřátelům předvoj {vorzug} a při ústupu od nich zadní voj {nachzug}. K tomu vybere podle počtu knechtů z každé roty {Rot} jednoho, dva, tři, nebo kolik se mu se znalci válečnictví {Kriegsuerstendigen} zdá potřebné. Lancknechti {Landsknecht} tomuto houfu říkají ztracený houf {verlorn Hauffen}, někdy též běžící houf; Švýcaři jej nazývají harst {Harst}.
- typ: odstavec
  de: |-
    Der jetzund gemelt Hauff greifft vnder den Knechten allweg die Feinde am ersten an/ gleich wie der Renfanen bei den Reuttern.
  cs: |-
    Právě zmíněný houf napadá u pěchoty vždy nepřítele jako první, stejně jako předvojová korouhev {Renfanen} u jezdců {Reuttern}.
poznamky:
- n: 1
  text: |-
    „Potenten oder Compaßbrieffe“ – patenty či průvodní (povolovací) listy opravňující k prodeji v táboře; v tisku též níže „vnreht“ místo „vnrecht“.
- n: 2
  text: |-
    „Das sterben“ – hromadné umírání, mor či nakažlivá nemoc v táboře, které měl plukovník předcházet dohledem nad čistotou a kvalitou potravin.
