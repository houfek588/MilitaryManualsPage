bloky:
- typ: nadpis
  uroven: 3
  de: Vom Obersten Prouosen ampt
  cs: O úřadu nejvyššího profouse {Prouosen}
- typ: odstavec
  de: |-
    DEr Prouoß soll/ wann er im Ring durch den Obersten vber die Knecht eröffnet wirdt/ anzeigen/ Dieweil er/ wie sie gehört/ zu einem Prouosen angenommen/ so sie sein begern/ daß sie jhm seinen Leutenant/ Steckenknecht/ vnnd Trabanten/ so sie einen oder mehr gefengklich annemen nit verhindern/ sondern jm vnd die seinen inhalt jres auff den Artickelsbrieff geschwornen eydts darzů fürdern/ auch in zeit der not hanthaben wöllen/ er wöl sie auch in disem vnd allen andern Artickeln/ sie seien im Artickelsbrieff begriffen oder sonst Kriegsbrauch/ daß sie darinn nit verwircken/ treulich gewarnt haben.
  cs: |-
    Když profouse představí v kruhu {Ring} plukovník {Obersten} nad knechty {Knecht}, má profous oznámit: jelikož byl, jak slyšeli, přijat za profouse, žádá je[^1], aby jemu, jeho poručíkovi {Leutenant}, profousovým pacholkům {Steckenknecht} a drabantům {Trabanten} nebránili, když někoho, jednoho či více, zatknou, nýbrž aby jemu i jeho lidem podle své přísahy {eydts} složené na artikulní list {Artickelsbrieff} pomáhali a v čas nouze je chránili. On je pak chce před tímto i všemi ostatními články, ať jsou obsaženy v artikulním listu, nebo patří k válečnému obyčeji, věrně varovat, aby se proti nim neprovinili.
- typ: odstavec
  de: |-
    Der Prouoß schätzt in der Knecht Leger die Prouiant/ doch soll er sich mit dem vnder Marschalck deßhalb vergleichen/ wie in des Feldmarschalcks 24. Artickel dauon meldung geschicht.
  cs: |-
    Profous stanovuje v ležení {Leger} knechtů ceny proviantu {Prouiant}; má se však o tom dohodnout s podmaršálkem {vnder Marschalck}, jak se o tom zmiňuje 24. článek polního maršálka {Feldmarschalcks}.
- typ: odstavec
  de: |-
    Der Prouoß entpfecht vom Obersten Feldhauptman das maß zum tranck/ die ellen zum tůch/ das gewicht den metzlern vnd Marcatanten.
  cs: |-
    Profous přejímá od nejvyššího polního hejtmana {Obersten Feldhauptman} míru na nápoje, loket na sukno a závaží pro řezníky a markytány.
- typ: odstavec
  de: |-
    Der Prouoß hat vom tranck es sei wein oder bier/ auch von denen die der Knecht Leger zu füren/ deßgleichen von den Marcatanten am einnemen/ wie jm daß der Oberst Feldhauptman taxiert/ vnd wann der Prouoß die Leut darüber weitter beschweret/ so ist er hochstrefflich.
  cs: |-
    Profous má příjem z nápojů, ať z vína, nebo piva, také od těch, kdo je do ležení knechtů dovážejí, i od markytánů, a to takový, jaký mu stanoví nejvyšší polní hejtman. Kdyby profous lidi zatěžoval nad tuto sazbu, zasluhuje těžký trest.
- typ: odstavec
  de: |-
    Welcher in der Knecht Leger falsche masse/ ellen oder gewicht braucht/ der ist alle sein gůt so er im leger hat dem Obersten vber die Knecht verfallen/ wiewol solches der Prouoß zu zeiten allein nimpt/ vnder weilen theilen sie es miteinander.
  cs: |-
    Kdo v ležení knechtů užívá falešné míry, lokte nebo závaží, propadá všechen jeho majetek, který v ležení má, plukovníkovi nad knechty; někdy si jej však bere sám profous, jindy se o něj oba dělí.
- typ: odstavec
  de: |-
    Alle Prouiant die in der Knecht Leger verwirckt wirt/ ist des Prouosen allein/ das viehe außgenomen/ das gehört dem Obersten vber die Knecht/ etwan theilen sie es auch mit einander.
  cs: |-
    Veškerý proviant, který v ležení knechtů propadne, náleží jen profousovi, kromě dobytka – ten patří plukovníkovi nad knechty; někdy se o něj také dělí.
- typ: odstavec
  de: |-
    Der Prouoß hat von allen Rindern die inn der Knecht Leger gemetzlet werden die zungen.
  cs: |-
    Profous dostává jazyky ze všech kusů hovězího dobytka, které jsou v ležení knechtů poraženy.
poznamky:
- n: 1
  text: |-
    V tisku „so sie sein begern“ (patrně přesmyčka za „so sei sein begern“, tj. „je tedy jeho žádostí“).
