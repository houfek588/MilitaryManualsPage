bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vnd also mit der Schnor hinweg schlengern oder werffen / dann es sich weit mit der schnor wirfft / vnd so bald es angeht vnd fewer fecht / soll manns vnder das Krigßuolck im storm da sie am dickisten stehn werffen / so brennt es langsam durch den langen halß biß in die weite der Kugeln in den röschen Zeug kompt / zersprengt die Kugel mit gewalt vnd schlecht vmb sich im hauffen / wo die Kugeln dicker von Zeug gemacht vnd gebachen sind / so sie härter sprengen vnd schlagen / wann sie aber dön von Zeug sind so brechen sie bald vnd hat das puluer lofft / so sind die stöcker daruon leicht / drucken nit durch wie die schweren.
  cs: |-
    a tak ji šňůrou odmrštit neboli hodit, neboť se šňůrou dohodí daleko. Jakmile se vznítí a chytí oheň, má se hodit mezi válečný lid {Krigßuolck} při útoku {storm} tam, kde stojí nejhustěji. Hoří pak pomalu dlouhým hrdlem, až se dostane do dutiny koule k prudké složi {röschen Zeug}; ta kouli mocně roztrhne a ta bije kolem sebe do houfu {hauffen}. Jsou-li koule udělány a vypáleny se silnější stěnou, roztrhnou se a bijí tím prudčeji. Mají-li však stěnu tenkou, rozbijí se brzy a prach má volno; střepy jsou pak lehké a neproniknou tak jako těžké.
- typ: odstavec
  de: |-
    Mann soll auch lettern Eimer inn einer Besatzung haben / dann es kompt wol daß mann Fewer hinein wirfft / oder vor sich selber etwan angeht / darumb soll mann alle zeit mit Röstung gefast sein.
  cs: |-
    V posádce {Besatzung} se mají mít také kožená vědra {Eimer}, neboť se snadno stane, že nepřítel vhodí oheň dovnitř nebo že někde něco samo chytne; proto se má být vždy připraven náčiním.
- typ: odstavec
  de: |-
    Vor alten zeiten hat mann Instroment gehabt / die hat mann Schleudern oder Schlengern genant / das sind Werffzeug gewesen / mit denselbigen hat mann todt schelmen vnd andere werck mehr als Stein vnd dergleichen in die Befestung geworffen / solcher gestalt haben die darinn widerumb herauß gethan / darumb sollen solche Instroment auch noch in einer Besatzung / vnd recht vnd wol zugericht sein / damit ob mit solchem Zeug etwas hinein geworffen würde / dasselbig vnd dergleichen anders mehr so in der Befestung sterben vnd vnfledig sein möcht / wider mit dergleichen Rüstung herauß werffen / solches Instroment mag mann auch mit grossen Wacken laden / vnd in die Schantzen werffen / wie ich gesehen hab das geschehen ist / also ist mit solchem Instroment vil außzurichten vnd vorzunemen / Wie solche Instroment gemacht sein sollen / hab ich hie / wie zusehen ist / ein Abriß vnd Figur gestalt / damit auß dem ein besserer verstandt dann allein auß dem blosen schreiben geschehen möcht.
  cs: |-
    Za starých časů se měly nástroje, jimž se říkalo metadla {Schleudern} nebo praky {Schlengern}; byly to vrhací stroje {Werffzeug}. Házely se jimi do pevnosti {Befestung} zdechliny a jiné věci, jako kameny a podobně, a obránci je stejným způsobem zase vyhazovali ven. Proto mají být takové nástroje i dnes v posádce, a to řádně a dobře připravené, aby se, kdyby nepřítel takovým strojem něco vhodil dovnitř, dalo to i jiné podobné věci, které by v pevnosti pošly a zahnívaly, takovým zařízením zase vyhodit ven. Takový nástroj lze nabít také velkými balvany {Wacken} a vrhat je do šancí {Schantzen}, jak jsem to sám viděl; takovým nástrojem lze tedy mnoho svést a podniknout. Jak mají být takové nástroje zhotoveny, k tomu jsem zde, jak je vidět, připojil nákres a vyobrazení[^1], aby se z něho dalo lépe porozumět než z pouhého psaní.
- typ: odstavec
  de: |-
    Mann soll auch alle Fütterung / es sei Haw / Stro vnd dergleichen an sicher ort / da es vor Fewer verwart sei legen / damit nit fewer darinn geworffen vnd geschossen werde / dann mann kundtschafft daruff macht wo vnd an welchem ort das ligt / darnach sucht mann weg daß mög in brant gebracht werden / dann es fewers halben gefahr bringt.
  cs: |-
    Také veškerou píci {Fütterung}, ať je to seno, sláma nebo podobně, je třeba uložit na bezpečné místo, kde je chráněna před ohněm, aby do ní nemohl být vhozen nebo vstřelen oheň. Nepřítel totiž vyzvídá, kde a na kterém místě leží, a pak hledá cestu, jak ji zapálit, neboť je kvůli ohni nebezpečná.
- typ: odstavec
  de: |-
    Deßgleichen soll mann das Puluer wol verwarn / vnd an sicher ort setzen da es vor feur verwart stehe / vnd wer gůt daß manns theilt / vnd mehr dann an eim ort stehen möcht / ob schon ein vnrat eim ort geschehe / daß doch das ander behalten würde / vnnd mann schon den gantzen vorrat des puluers nit theiln noch an sicher ort behalten künde / sonder an eim sichern ort bei einander haben müst / sol mann verhůten / vnd nit allzeit / wann puluer von nöten were / so leichtlich vber den
  cs: |-
    Stejně tak je třeba dobře opatrovat prach {Puluer} a uložit jej na bezpečné místo, kde je chráněn před ohněm. Bylo by dobré jej rozdělit, aby stál na více než jednom místě, takže kdyby se na jednom místě stalo neštěstí, zachová se přece ostatní. A i kdyby nebylo možné celou zásobu prachu rozdělit ani uložit na [více] bezpečných míst a musela by být pohromadě na jednom bezpečném místě, je třeba dbát a nepouštět se, kdykoli je prachu třeba, tak lehkovážně do
poznamky:
- n: 1
  text: |-
    Vyobrazení vrhacího stroje se v Osmé knize tohoto exempláře nenachází; po textu (sken 616) následuje přímo erbovní frontispis Deváté knihy. Odkaz se patrně týká obdobného vyobrazení v jiné části díla nebo bylo vyobrazení zamýšleno, ale nevytištěno.
