strana: verso
sken: 60
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    ALso seind dise hieuor geschrieben zwölff bedenck Artickel gestalt das mann zusehen hat / das mann also Artickel stellen / den Kriegßrethen zu berathschlagen vnd zuordnen / vbergeben soll / aber nit dahin zuuerstehen / das mit disen verzeichneten Artickeln gleich gnug sei / sonder wie oben gemelt ein Form vnd bericht / wie darmit gehandelt werden soll / aber mann soll alles das in einem Krieg anzůstellen von nöten sein wil / also in Artickel stellen / zu dem aller fleissigsten vnd in gůte Ordnung bringen / darmit ein gůt ordentliche Regirung möge angestelt vnd gehalten werden / dann wo gůt Regirung vnd Justitia ist da ist gehorsam / vnd kan hören vnd weren.
  cs: |-
    Takto je uspořádáno těchto dvanáct výše zapsaných článků k uvážení, z nichž je zřejmé, že se mají takové články sepsat a předložit válečným radům {Kriegßrethen} k projednání a uspořádání; avšak nemá se tomu rozumět tak, jako by se těmito zapsanými články věc již vyčerpala, nýbrž, jak bylo řečeno výše, jsou jen vzorem a návodem, jak se má v tom jednat. Má se však vše, co bude třeba ve válce zařídit, takto sepsat do článků, co nejpilněji a uvést v dobrý řád, aby mohla být zavedena a udržována dobrá řádná správa; neboť kde je dobrá správa a spravedlnost, tam je poslušnost a tam lze vyslechnout i zjednat ochranu.[^1]
- typ: nadpis
  uroven: 2
  de: Ein gebrauch vnd ordnung einer Wagenburg.
  cs: Užívání a řád vozové hradby {Wagenburg}.
- typ: odstavec
  de: |-
    ES ist bei den alten als bei den Römern der gebrauch gewest / das sie allezeit ein gerüste Wagenburg gehabt haben / vnnd dasselbige sehr gebraucht / vnd jhre sachen / Ordnung vnd formen daruff gerichtet / wie mann das in den Historien der Römer klerlich vnd fil findet / vnd die Behemen vnd Vngern biß hernach gar fast gebraucht vnd in gůter Rüstung gehalten / deßgleichen die Engelischen noch im gebrauch haben / wie man bei jnen noch befindet vnd sicht / derhalben ichs bei mir noch ein gůt nützlichs werck / vnd Kriegßstück halte.
  cs: |-
    U starých národů, jako u Římanů, bývalo zvykem, že měli vždy připravenou vozovou hradbu a velmi jí užívali a přizpůsobovali jí své věci, řády i sestavy, jak to jasně a hojně nacházíme v římských dějinách; a také Češi a Uhři {Vngern} jí až do nedávné doby hojně užívali a udržovali ji v dobrém vybavení {Rüstung}, stejně jako ji dosud užívají Angličané, jak se u nich ještě shledává a vídá. Proto ji sám dosud pokládám za dobré, užitečné dílo a válečný prostředek.
- typ: odstavec
  de: |-
    Aber wiewol die gar abgegangen seind / vnd nit vil geachtet / vnd die sachen nur auff das gereum Feld gericht vnd gestelt / vermeint es sei ein beschwerung mit zůfüren / vnd bringe grossen kosten / vnd sei mit allem im Feld schwerlich zu vnderhalten / das ist wol war / das es etwas kostet zu vnderhalten vnd nachzubringen / vnd wo mann im Feld lige / so möge mann sich in stat der Wagenburg / mit schantzen vergraben / das ist war / vnnd ist ein gar gůt werck / so mann stil ligt / vnnd ist gewiß ein ansehenliche gůt verwarung vmb ein Leger / darumb verachte ichs nit / sonder ich halt es für nützlich vnd gůt.
  cs: |-
    Ačkoli však vozové hradby téměř zanikly a nedbá se jich mnoho, a vše se zaměřuje a staví jen na otevřené pole – s tím, že je prý obtížné je s sebou vézt, že přinášejí veliké náklady a těžko se v poli se vším všudy udržují –, je sice pravda, že něco stojí je udržovat a vézt s sebou a že když se leží v poli, lze se namísto vozové hradby zakopat pomocí šancí {schantzen}. To je pravda a je to věru velmi dobré dílo, když se stojí na místě, a jistě je to úctyhodná a dobrá ochrana kolem ležení {Leger}; proto tím nepohrdám, nýbrž pokládám to za užitečné a dobré.
- typ: odstavec
  de: |-
    Aber wie dem so halte ich ein Wagenburg auch gůt vnnd nützlich / vnnd ist in vil wege zůgebrauchen / das mann mit schantzen nit thůn kan / vnnd vnmöglich ist / aber sie seind beide gůt vnnd gebreuchlichen bei einander / vnd ein jedes selbst für sich zu seiner notturfft vnd gelegenheit / vnd beide zusamen vnd in einander gezogen.
  cs: |-
    Nicméně pokládám také vozovou hradbu za dobrou a užitečnou, a lze ji použít v mnoha ohledech, v nichž se šancemi nelze nic pořídit a je to nemožné; obojí je však dobré a upotřebitelné vedle sebe, každé samo o sobě podle své potřeby a příležitosti, i obojí dohromady a navzájem spojené.
poznamky:
- n: 1
  text: |-
    Něm. *vnd kan hören vnd weren* – tj. lze vyslechnout strany i zjednat ochranu či zamezit bezpráví.
