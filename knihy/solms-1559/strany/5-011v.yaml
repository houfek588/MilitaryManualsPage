id: 5-011v
list: 11 (5. kniha)
strana: verso
sken: 458
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Die Keiserliche Maiestat soll allen vnkosten halten von lichten vnd Zeug vnd von holtz geben was die notturfft erfurdert.
  cs: |-
    Jeho Císařské Veličenstvo má nést veškeré náklady na světla a nářadí {Zeug} a dodávat dříví, kolik potřeba vyžaduje.
- typ: odstavec
  de: |-
    Zwen Hutleut sol mann haben die zu aller Zeit bei der arbeit seien/ vnd zu sehen daß recht gefarn vnd die arbeit gefürdert werde.
  cs: |-
    Je třeba mít dva důlní dozorce {Hutleut}, kteří budou po celý čas při práci a budou dohlížet, aby se správně razilo a práce postupovala.
- typ: odstavec
  de: |-
    Item/ es soll auch kein Ampt dem andern inn sein arbeit fallen oder verhindern/ sonder ein jeglichen seinen beuelch lassen verrachten/ vnd welcher sein dienst nicht recht außricht soll der Oberst jn darumb anreden/ vnd nach gelegenheit straffen sonst hat er keinen frieden im leger.
  cs: |-
    Dále nemá žádný úřad {Ampt} druhému zasahovat do jeho práce ani mu v ní bránit, nýbrž má každého nechat vykonávat jeho povinnost {beuelch}. Kdo svou službu nekoná správně, toho má plukovník {Oberst} napomenout a podle okolností potrestat; jinak nebude mít v ležení {leger} pokoj.[^1]
poznamky:
- n: 1
  text: |-
    V posledním řádku na konci rejstříku tištěno nářečně či sazečským přehmatem „verrachten“ (za *verrichten*, „vykonávat“); pod textem následuje tiskařská ozdoba lístku.
