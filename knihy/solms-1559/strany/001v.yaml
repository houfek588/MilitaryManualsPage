bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    bekennte alte Kriegsleut/ die kennen die alte gebrauchte Knecht/ so kennen dieselbige Knecht die andern auch/ vnnd kommen also die gůten bekante Knecht zusamen/ Nun mag gesagt werden/ ja dieselbige Knecht wöllen grosse besoldung haben/ mann helt sonst zwen oder drei knecht von des einigen besoldung/ ist wol war/ derselbige knecht einer weiß wol souil/ als jener zwen oder drei/ ist dem Herrn auch wol souil nützer. Dann wan es an die not geht so kan ein solcher knecht in schweren sachen rathen/ trösten/ vortheil finden als ein erfarner/ der dergleichen mehr gesehen hat/ daß ein anderer newer oder junger knecht nit weyß/ sonder der ernstlichen handlung erschrocken/ machet auch ein flucht vnd vnordnung auß seiner vnerfarnheit/ were er mehr darbei gewesen/ so verstündt er das/ wers geübt vnd erfarn/ hielt sich dann auch desto baß.
  cs: |-
    znalí staří válečníci {Kriegsleut} znají staré ostřílené knechty {Knecht}, ti pak zase znají ostatní, a tak se sejdou dobří a osvědčení knechti pohromadě. Někdo by mohl namítnout: ano, takoví knechti chtějí vysoký žold {besoldung}, jinak se za plat jediného z nich vydržují dva nebo tři knechti. To je sice pravda, ale jediný takový knecht ví tolik co tamti dva nebo tři a pánovi je také o tolik užitečnější. Neboť když dojde k nouzi, dokáže takový knecht v těžkých chvílích poradit, povzbudit a najít výhodu jako zkušený muž, který už ledacos takového zažil, což jiný, nový nebo mladý knecht neumí – ten se naopak vážné srážky poleká a ze své nezkušenosti způsobí útěk a zmatek; kdyby u toho byl víckrát, rozuměl by tomu, a kdo je vycvičený a zkušený, ten se také drží o to lépe.
- typ: odstavec
  de: |-
    Vnd so ein Herr schon also ein grossen hauffen jung gesindt zusamen bringt/ vnd eine schlechte besoldung hat/ vermeint es sei gar wol darmit gehandelt/ so hat er durch solliches ein vngehorsam volck/ das nichts thůt dann schreien/ vnd weder ordnung noch Regiment helt/ vnd geht grosse můhe vnd sorg auff sie/ vnd kan niemand mit jhn reit werden. Deßgleichen so gehört auch ein grosse Prouiant auff sie/ auß ville der Person/ dann sie seien gůt oder böß/ so isset ein böse person so uil als ein gůte. Darumb ist einem Herrn zurathen/ daß er ein zimlichs das auch leidlich ist/ nicht ansehe/ so er ein altes erfarn gůts Kriegsuolck kan zuwegen bringen/ dann in erfarung ist es/ das mann wol weisse/ was man mit einem Kriegsuolck außgericht hat/ daß ein zeitlang bei einander gewesen ist/ vnd ob jr gleichwol nit vil gewesen/ doch gegen grossen hauffen gesiegt/ das macht jhr verstandt vnnd geschicklichkeit/ vnd einer den andern kennt vnd vertrawet.
  cs: |-
    A když už takto pán sebere veliký houf {hauffen} mladé holoty a dává jim nízký žold v domnění, jak dobře tím pořídil, má z toho jen neposlušný lid, který nedělá nic jiného než křičí a nedrží ani pořádek, ani kázeň {Regiment}; je s nimi jen veliká námaha a starost a nikdo si s nimi neví rady. Stejně tak je pro ně kvůli velkému počtu osob zapotřebí mnoho proviantu {Prouiant} – neboť ať jsou dobří nebo zlí, špatný člověk sní stejně tolik jako dobrý. Proto je třeba pánovi radit, aby nehleděl na přiměřený a snesitelný výdaj, může-li získat starý, zkušený a dobrý válečný lid {Kriegsuolck}; zkušenost totiž potvrzuje, jak dobře je známo, co se dokázalo s válečným lidem, jenž byl nějaký čas pospolu – třebaže jich nebylo mnoho, přesto zvítězili nad velkými houfy, a to působí jejich rozvaha a obratnost i to, že se navzájem znají a důvěřují si.
- typ: odstavec
  de: |-
    Vnd ein Herr soll sich hůten vor vilen Obersten vnder den knechten/ dañ da vil Obersten sind/ tregt sich selten ein sach oder fürnemen einig vnnd gleich zů/ das kompt auß dem/ so drei oder vier Obersten sind/ so wöllen sie gleich Regiment haben/ vnnd keiner weniger sein dann der ander/ wil keiner dem anderen weichen noch nachlassen/ gönt keiner dem andern die ehr/ besonder so sie zuuor etwan einander nit holt sind/ dann einer hat disen/ der ander ein andern sin/ biß man die einig gemacht in der eil oder not/ ist wol etwas verseumpt/ vnnd hat auch mancher ein solchen harten sin/ wann er einem andern folgen můß/ so thůt ers doch nit mit gůtem willen/ vnd kan er hindernuß darinn thůn/ so thůt er das/ vnd solt er selbs mit not leiden/ damit dem andern sein sachen nicht recht naher gehn möcht/ also geht es auch zů/ wann mann die Hauptmanschafften/ Fenderichen vnd
  cs: |-
    Také se má pán varovat příliš mnoha plukovníků {Obersten} mezi knechty, neboť kde je mnoho plukovníků, tam se zřídka nějaká věc či podnik vede svorně a jednotně. To pochází z toho, že jsou-li tři nebo čtyři plukovníci, chce každý mít stejnou velitelskou moc a žádný nechce být méně než druhý; žádný nechce druhému ustoupit ani slevit a žádný nepřeje druhému čest, zvláště nejsou-li si už od dřívějška nakloněni – jeden má totiž tu hlavu a druhý jinou. Než se je podaří ve spěchu nebo v nouzi sjednotit, bývá už leccos zameškáno; a leckdo má i tak tvrdou hlavu, že když musí druhého poslouchat, nečiní to s dobrou vůlí, a může-li mu v tom klást překážky, udělá to, i kdyby tím sám měl trpět, jen aby se druhému jeho věc nepodařila. Stejně tak to chodí, když se hejtmanství {Hauptmanschafften}, praporečnictví {Fenderichen} a
