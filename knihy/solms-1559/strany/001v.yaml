bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    bekennte alte Kriegsleut/ die kennen die alte gebrauchte Knecht/ so kennen dieselbige Knecht die andern auch/ vnnd kommen also die gůten bekante Knecht zusamen/ Nun mag gesagt werden/ ja dieselbige Knecht wöllen grosse besoldung haben/ mann helt sonst zwen oder drei knecht von des einigen besoldung/ ist wol war/ derselbige knecht einer weiß wol souil/ als jener zwen oder drei/ ist dem Herrn auch wol souil nützer. Dann wan es an die not geht so kan ein solcher knecht in schweren sachen rathen/ trösten/ vortheil finden als ein erfarner/ der dergleichen mehr gesehen hat/ daß ein anderer newer oder junger knecht nit weyß/ sonder der ernstlichen handlung erschrocken/ machet auch ein flucht vnd vnordnung auß seiner vnerfarnheit/ were er mehr darbei gewesen/ so verstündt er das/ wers geübt vnd erfarn/ hielt sich dann auch desto baß.
  cs: |-
    známí staří válečníci {Kriegsleut} znají staré ostřílené knechty {Knecht}, ti zase znají ostatní, a tak se sejdou dobří a osvědčení knechti pohromadě. Někdo by mohl namítnout: „Ano, jenže takoví knechti chtějí vysoký žold {besoldung}; za plat jediného z nich by se jinak vydržovali dva nebo tři knechti.“ To je sice pravda, ale jeden takový knecht ví tolik co oni dva nebo tři a je pánovi také o tolik užitečnější. Když totiž jde do tuhého, dokáže v těžkých chvílích poradit, povzbudit a najít výhodu jako zkušený muž, který už leccos takového viděl. To nový nebo mladý knecht neumí; ten se naopak vážné srážky poleká a ze své nezkušenosti zaviní útěk a zmatek. Kdyby u toho býval víckrát, rozuměl by tomu, a kdyby to měl vycvičené a zakusil to, držel by se také o to lépe.
- typ: odstavec
  de: |-
    Vnd so ein Herr schon also ein grossen hauffen jung gesindt zusamen bringt/ vnd eine schlechte besoldung hat/ vermeint es sei gar wol darmit gehandelt/ so hat er durch solliches ein vngehorsam volck/ das nichts thůt dann schreien/ vnd weder ordnung noch Regiment helt/ vnd geht grosse můhe vnd sorg auff sie/ vnd kan niemand mit jhn reit werden. Deßgleichen so gehört auch ein grosse Prouiant auff sie/ auß ville der Person/ dann sie seien gůt oder böß/ so isset ein böse person so uil als ein gůte. Darumb ist einem Herrn zurathen/ daß er ein zimlichs das auch leidlich ist/ nicht ansehe/ so er ein altes erfarn gůts Kriegsuolck kan zuwegen bringen/ dann in erfarung ist es/ das mann wol weisse/ was man mit einem Kriegsuolck außgericht hat/ daß ein zeitlang bei einander gewesen ist/ vnd ob jr gleichwol nit vil gewesen/ doch gegen grossen hauffen gesiegt/ das macht jhr verstandt vnnd geschicklichkeit/ vnd einer den andern kennt vnd vertrawet.
  cs: |-
    A když pán takto sežene velký houf mladé holoty za nízký žold a myslí si, jak dobře tím pořídil, získá jen neposlušný lid, který nic nedělá, jen křičí, a nedbá ani pořádku, ani kázně. Je s nimi veliká námaha a starost a nikdo si s nimi neví rady. Kvůli velkému počtu osob je pro ně také zapotřebí mnoho proviantu {Prouiant}, neboť ať jsou dobří, nebo zlí, špatný člověk sní stejně jako dobrý. Proto lze pánovi radit, aby nehleděl na přiměřený a snesitelný výdaj navíc, může-li získat starý, zkušený a dobrý válečný lid {Kriegsuolck}. Ze zkušenosti se totiž dobře ví, co se dokázalo s válečným lidem, který byl nějaký čas pospolu: třebaže jich nebylo mnoho, zvítězili přesto nad velkými houfy. To působí jejich rozvaha a obratnost a to, že se navzájem znají a jeden druhému důvěřuje.
- typ: odstavec
  de: |-
    Vnd ein Herr soll sich hůten vor vilen Obersten vnder den knechten/ dann da vil Obersten sind/ tregt sich selten ein sach oder fürnemen einig vnnd gleich zů/ das kompt auß dem/ so drei oder vier Obersten sind/ so wöllen sie gleich Regiment haben/ vnnd keiner weniger sein dann der ander/ wil keiner dem anderen weichen noch nachlassen/ gönt keiner dem andern die ehr/ besonder so sie zuuor etwan einander nit holt sind/ dann einer hat disen/ der ander ein andern sin/ biß man die einig gemacht in der eil oder not/ ist wol etwas verseumpt/ vnnd hat auch mancher ein solchen harten sin/ wann er einem andern folgen můß/ so thůt ers doch nit mit gůtem willen/ vnd kan er hindernuß darinn thůn/ so thůt er das/ vnd solt er selbs mit not leiden/ damit dem andern sein sachen nicht recht naher gehn möcht/ also geht es auch zů/ wann mann die Hauptmanschafften/ Fenderichen vnd
  cs: |-
    Pán se má také vyvarovat mnoha plukovníků {Obersten} nad knechty, neboť kde je mnoho plukovníků, tam se nějaká věc či podnik zřídka vede svorně a jednotně. Pochází to odtud, že jsou-li tři nebo čtyři plukovníci, chce mít každý stejnou velitelskou moc a žádný nechce být menší než druhý. Žádný nechce druhému ustoupit ani povolit a žádný nepřeje druhému čest, zvláště nejsou-li si už odedávna nakloněni; jeden má totiž to smýšlení a druhý jiné. Než se je podaří ve spěchu nebo v nouzi sjednotit, bývá leccos zameškáno. A leckdo má tak tvrdou hlavu, že když musí druhého poslouchat, nečiní to s dobrou vůlí; může-li mu v tom překážet, udělá to, i kdyby tím měl sám trpět, jen aby se druhému jeho věc nedařila. Stejně tak to chodí, když se hejtmanství {Hauptmanschafften}, praporečnictví {Fenderichen} a
