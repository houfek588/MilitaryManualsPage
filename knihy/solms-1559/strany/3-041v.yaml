bloky:
- typ: nadpis
  uroven: 3
  de: Wie mann ein Feur machen soll das es gar starck vnd gůt wirt.
  cs: Jak udělat oheň, aby byl velmi silný a dobrý.
- typ: odstavec
  de: |-
    NIm Albitram das ist gloriat/ Schwefel/ öle vnd eyertotern auß gebrant alles mit einer teilung/ vnd rösse das gleich in einer pfannen ob einem Kolfeur/ daß es als ein Confect werde/ vnnd nim darzů ein vierteil wachs/ misch das alles vnder einander/ thů es dann in ein Rinderene plater die wol gestrichen sei mit öle/ vermach es dann mit einem wachs/ vnd wan du es anzinden wilt/ so leg die Materien an ein stat/ daß sie lüfftig ligt/ vnd wan der windt darzů geht/ so wirt es brennent/ vnd verwüst was es nur begreifft/ wann mann wasser darauff geußt/ gewint es tödtlich flamen/ wo mann die materien also bereit vnd hinstrewet das enzindt sich von der Sonnen/ wann sie die hitz begreifft/ verbrennt alles das vmb es mag sein oder ist.
  cs: |-
    Vezmi dehet (*Albitram*), to jest benátský terpentýn {gloriat}, síru, olej a pálené vaječné žloutky, všeho stejným dílem, a opraž to stejnoměrně na pánvi nad ohněm z uhlí, až z toho bude pasta; přidej k tomu čtvrt dílu vosku, vše to smíchej dohromady, vlož pak do hovězího měchýře dobře vymazaného olejem a uzavři voskem. Až to budeš chtít zapálit, polož směs na místo, kde je průvan; jak k ní zavane vítr, rozhoří se a zničí vše, čeho se jen dotkne, a když se na ni nalije voda, nabude smrtících plamenů. Kde se takto připravená hmota rozsype, vznítí se od slunce, jakmile ji zachvátí žár, a spálí vše, co kolem ní jest.
- typ: nadpis
  uroven: 3
  de: Wiltu Feur machen das es sich von Regen anzindt.
  cs: Chceš-li udělat oheň, který se vznítí od deště.
- typ: odstavec
  de: |-
    SO nim lebendigen Kalchstein der in gůter größ sei/ vnnd mach darinn ein gruben/ vnd lebendigen Schwefel der wol gestossen ist/ vnd misch den vnder buhartz gar wol/ thů das in die gruben/ vnd bedeckt sie wol mit lebendigem Kalch/ thů es dann in einen Erdin hafen/ vnd werff jn mit stro wol bewunden auff ein dach/ wann es dann darauff regnet/ so zindt es sich an vnnd brennt sehr von der feuchtigkeit des Regens.
  cs: |-
    Vezmi tedy kus živého vápence slušné velikosti, udělej v něm důlek, vezmi dobře utlučenou živou síru, důkladně ji vmíchej do borové pryskyřice (*buhartz*),[^1] vlož to do důlku a dobře přikryj živým vápnem; pak to dej do hliněného hrnce, dobře jej oviň slámou a hoď na střechu – když na něj zaprší, vznítí se a prudce hoří od dešťové vlhkosti.
- typ: nadpis
  uroven: 3
  de: |-
    Wiltu jetztbenennt feur also starck machen daß du deine Feinde damit verbrennen mag.
  cs: |-
    Chceš-li výše jmenovaný oheň učinit tak silným, abys jím mohl spálit své nepřátele.[^2]
- typ: odstavec
  de: |-
    SO nim geriben Schwefel vnnd seudt das zwei dritteil in einer maß des vorbenennten wassers/ darnach ein halb maß alt öle vnd weyn/ Ochsen gallen ein Quertlin/ Bulbech zwei dritteil/ picem naualem et sulfur viuum/ calcem viuam et auripigmentum/ alle gleich/ vnd thů das alles zusamen/ daß es auff sanfftem Feur reiniglich vnder einander gemischt werde/ vnnd behalt es dann zu deinem werck inn einem gůten Venedischen glaß/ das einen langen halß hab/ vermachs wol mit wachs/ daß die krafft der materien nit dauon riechen mög/ Vnd wenn du Feur wilt anzünden/ vnd deine feinde schedigen/ so stoß ein Baumwollen tůch darinn/ winde es vmb einn pfeil zwei mal/ nim dann einen sulfur trat. vnd ein schwemblin wie mann zu den Feurpfeiln nimpt/ vnd vmbwinde sie zusamen mit einem fadem/
  cs: |-
    Vezmi tedy rozetřenou síru a povař její dvě třetiny v jednom mázu {maß} výše uvedené vody, potom půl mázu starého oleje a vína, čtvrtku {Quertlin} volské žluči, dvě třetiny borové smůly (*Bulbech*), lodní smůly a živé síry (*picem naualem et sulfur viuum*), nehašeného vápna a auripigmentu (*calcem viuam et auripigmentum*),[^3] všeho stejným dílem; a dej to všechno dohromady, aby se to na mírném ohni čistě promíchalo. Uchovej to pak pro své dílo v dobré benátské sklenici s dlouhým hrdlem a dobře ji zalep voskem, aby síla směsi nemohla vyprchat. A až budeš chtít rozdělat oheň a poškodit své nepřátele, namoč v tom bavlněné plátno, oviň je dvakrát kolem šípu, pak vezmi sirný drát (*sulfur trat.*)[^4] a kousek zápalné houby, jaká se bere k zápalným šípům {Feurpfeiln}, svaž je dohromady nití
poznamky:
- n: 1
  text: |-
    *Buhartz* (též *bulhartz*, níže *Bulbech*) – druh smůly či pryskyřice (patrně borová či stromová smůla).
- n: 2
  text: V tisku stojí 3. osoba *mag* místo 2. osoby *magst* („abys mohl“).
- n: 3
  text: |-
    Latinská řada přísad – *pix navalis* (lodní smůla), *sulphur vivum* (živá síra), *calx viva* (nehašené vápno) a *auripigmentum* (operment, žlutý sirník arsenitý).
- n: 4
  text: '*Sulfur trat.* – sirný drát (knot či vlákno napuštěné sírou).'
