id: 9-erb-solms
list: předsádka (9. kniha)
strana: recto
sken: 617
frontispis: true
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: Reinhart der Elter Graue zu Solms/ vnd Herr zu Müntzenberg/ etc.
  cs: Reinhard starší, hrabě ze Solmsu a pán z Münzenbergu atd.[^1]
- typ: obrazek
  soubor: drevorez-617.jpg
  popis: |-
    Dřevořez s erbem hrabat ze Solmsu a pánů z Münzenbergu (z téhož štočku jako před Druhou až Čtvrtou knihou), zasazeným v koruně mohutného listnatého stromu a lemovaným věncem z listí a plodů: čtvrcený štít se solmským lvem (1. a 4. pole) a děleným štítem münzenberským (2. a 3. pole), nad ním dvě turnajské přilby s klenoty a bohatými přikryvadly. V pozadí krajina s hradem na skalnatém vrchu vpravo, u kořenů stromu nápisová stuha s nápisem „REINHA[RT] VND HER[R] / RT. GRAFF. ZV / ZV MINCZE[N] / SOLMS / BORGK“.
poznamky:
- n: 1
  text: |-
    Erbovní frontispis uvozuje Devátou knihu souborného tisku – *Burgundský válečný řád* (*Borgundische Kriegßordnung*) Filipa Klévského, který Solms vydal v německém znění. Rubová strana (sken 618) je nepotištěná, a proto se v edici vynechává.
