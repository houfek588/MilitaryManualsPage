bloky:
- typ: odstavec
  de: |-
    Dergestalt bin ich desto freier meines geringes gemůt vnd verstandt in dem mich zuerkleren/ vnd weittern bericht in meinem vnuerstandt darinnen zu leren vnd zuerfaren/ darmit Ihr Keiserliche Maiestat meines getrewes gemüt inn dem spüren vnnd ersehen mögen/ Mit dem vnderthenigsten biten/ jhr Maiestat wöl mir solche meine geringe anzeigung vnd bericht/ warinnen ich fehlen werde/ allergnedigst zu gnaden halten/ vnd mich in dem gnedigst zu recht vnderweisen/ vnd als derselbigen gehorsam vnderthan in gnedigstem beuelch halten.
  cs: |-
    Tím směleji mohu v tom projevit své skromné smýšlení a rozum a v té věci se při své prostotě učit i nabývat dalšího poučení a zkušenosti, aby Jeho císařské Veličenstvo mohlo v tom spatřit a poznat mou věrnou mysl – s nejpokornější prosbou, aby Jeho Veličenstvo ráčilo tuto mou nepatrnou zprávu a výklad, v čemkoli bych pochybil, vzít nejmilostivěji na milost, v tom mne nejmilostivěji správně poučit a mne jakožto svého poslušného poddaného zachovat v nejmilostivější přízni.
- typ: nadpis
  uroven: 2
  de: Kriegs Ordnung.
  cs: Válečný řád.
- typ: odstavec
  de: |-
    DIeweil die Krieg biß also in ein vnordnung komen seind/ vnd das Kriegßuolck gar kein gehorsam mehr leiden will/ das kompt anders nirgent her/ dann daß mann lange zeit kein ordenliche Regirung vnnd Justitia gehalten/ Dieweil von denen die regirn sollen/ mehr auff den finantz vnd wucherei gesehen/ dann auff die gůt regirung vnd wolfart gemeines Legers/ Kriegßuolcks nutz vnd fürderung/ besonder die so die Leger prouiantiern/ vnnd andere derselbigen notturfft der Pollicei versehung thůn sollen/ sonder es ist also gemelte Regirung alle in ein Kauffhandel geraten/ das ist eins.
  cs: |-
    Že války upadly až v takový nepořádek a válečný lid {Kriegßuolck} již nechce snášet žádnou poslušnost, nepochází odnikud jinud než odtamtud, že se po dlouhou dobu nezachovávala žádná řádná správa ani spravedlnost {Justitia}, poněvadž ti, kdo mají vládnout, hleděli více na finty {finantz} a lichvu než na dobrou správu a blaho obecného ležení {Legers}, na užitek a prospěch válečného lidu – zvláště pak ti, kdo mají ležení zásobovat proviantem a obstarávat jiné jeho potřeby veřejného řádu {Pollicei} –, nýbrž veškerá řečená správa se takto zvrhla v kramářství: to je jedno.
- typ: odstavec
  de: |-
    Zum andern/ so seind ein zeitlang vil gefehrlicher eillender Krieg vnd vberziehung vnuersehentlich geschehen/ dardurch das Kriegsvolck also in einn vngehorsam/ vnd auß aller gůten ordenlichen Regirung komen/ vnd nur seinen eigen mutwillen vnd vnbillicheit vorgenomen/ darbei mann sie hat lassen müssen/ auß vrsachen/ daß die Kriegßhern solches Volck haben in der eil auffbringen/ vnnd jhnen allen willen lassen müssen/ damit sie die eillent haben vnd auffbringen mögen/ also vnuersehentlich einen schwermenden hauffen auffgebracht/ vnnd einen hie den anderen da vbereillett/ vnnd also darmit schuldig vnd vnschuldig vberfallen/ geplündert/ gebrantschatzt vnnd gelt gemacht/ solliches hat dem gemeinen losen hauffen gefallen/ vnd ist denselben vil nützer gewesen dann daß sie wol bezalt weren worden mit gebürlicher besoldung/ vnnd Regiment halten musten/ wie das wol zu sehn ist/ wann man ein Kriegsuolck zusamen bringt/ besonder von Reuttern was sich fur ein loß Volck mit
  cs: |-
    Za druhé se po nějakou dobu přihodilo mnoho nebezpečných, spěšných válek a nenadálých vpádů, čímž válečný lid upadl v takovou neposlušnost a vyšel ze vší dobré řádné správy a předsevzal si jen vlastní svévoli a nepravost; při tom jej lidé museli nechat z té příčiny, že váleční páni {Kriegßhern} museli takový lid sbírat ve spěchu a ponechávat mu všechnu jeho vůli, aby jej mohli rychle mít a sebrat. Takto znenadání sebrali toulavý houf {hauffen}, jednoho přepadli tu a druhého tam a takto přepadali vinné i nevinné, plenili, vybírali výpalné {gebrantschatzt} a dobývali peněz. To se obecnému rozpustilému houfu zalíbilo a bylo mu to mnohem užitečnější, než kdyby byli dobře placeni náležitým žoldem {besoldung} a museli zachovávat kázeň {Regiment}; jak je ostatně dobře vidět, když se shromažďuje válečný lid, zvláště pak u jezdců {Reuttern}, jaká holota se k nim
