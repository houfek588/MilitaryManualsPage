bloky:
- typ: odstavec
  de: |-
    WAnn mann drücken greben hat/ die mit wällen bedeckt weren vnd Ründtel hetten/ wie mann dann solcher vil findt/ vnnd doch mit gemaurten festern eingefast/ wann mann vnden in den Greben darbei komen kündt/ zeigt dise Figur an/ wie mann darinnen brechen vnnd graben soll/ erstlich fahre mann darinn/ wie an der Figur zusehen ist/ im Fal das mann nit im Graben hinein kündt/ so fahe mann außwendig an vnd fahr vnderm Graben hinein/ aber so fer? die Figurn beide ein Ründel vnnd stercke anzeigen/ ist also zuuerstehn daß der Baw auffrichtig steht/ vnnd anzusehen ist/ souil aber daß Ligend reissen anzeigt/ ists der grundt wie er ist vnnd ligt vnder dem Baw/ vnd des baws anfang soll also verstanden werden/ wann mann vnder erden darin eingrebt/ soll es vnder Erden vnnd nit am tag geschehen/ ob schon die Figur anzusehen ist als sei es offen gerissen/ so wirt mann sehen wie mann ein Fahrn soll/ vnd wie sichs im fahrn vnd graben/ so mann mehr dann an eim ort Puluer setzt theilen wil/ erstlich zu eim Loch ein farn vnd an heben/ deßgleichen kan mann auch in eim Loch anzünden so daß Puluer gesetzt ist/ dañ theilt sich daß Fewer zu beiden gengen biß zum Puluer setzen/ zündt beide setz mit einander an/ daß Sprengen eilent mit einander geht/ Weitter ist auch in solcher liegender Figur zusehen/ wie mann das Puluer setzen vnd verdaressen soll/ erstlich hat das Ründel in der mit ein runden Zirckelriß/ vnnd dardurch ein Kreutzgraben miet 4. neben außgetheilten greben/ vnd dieweil daß Ründtel weit in die Ründe ist/ vnd mit ernst vnd Gewalt wil geworffen werden/ sind die 4. Kreutzgreben gemacht/ das sie die Ründe nit allein in der mit/ sonder an den 4. orten vnd in der mit zugleich angreiffen vnd werffen/ das auff allen orten vber vnd neben arbeit/ wirfft vnnd zerreist.
  cs: |-
    Jsou-li před pevností suché příkopy kryté valy a s rondely, jakých se nachází mnoho a které jsou přesto lemovány zděnými patami, když se k nim člověk dostane dole v příkopu {Graben}, ukazuje toto vyobrazení, jak se do nich má lámat a kopat. Nejprve se vnikne dovnitř, jak je na vyobrazení vidět; kdyby však nebylo možné dostat se do příkopu, začne se zvenčí a vede se štola pod příkopem. Pokud obě vyobrazení ukazují rondel i pevný val, rozumí se tím u horního, že stavba stojí zpříma a takto se na ni hledí; ležatý nákres pak ukazuje půdorys, jak jest a leží pod stavbou. Začátek podkopu pod stavbou se má chápat tak, že když se pod zemí dovnitř vkopává, děje se to pod zemí a nikoli na povrchu, i když vyobrazení vypadá, jako by bylo otevřeně narýsováno; tak se pozná, jak se má postupovat a jak se při kopání i vedení chodeb má práce rozdělit, ukládá-li se prach na více místech než na jednom: nejprve se vnikne jedním otvorem a začne se, a stejně tak lze v jediném otvoru zapálit, jakmile je prach uložen – oheň se pak rozdělí oběma chodbami až k místům náloží a zapálí oba soubory náloží naráz, takže odstřel proběhne rázem společně. Dále je na tomto půdorysném vyobrazení vidět, jak se má prach ukládat a utěsňovat: nejprve má rondel uprostřed okrouhlý výrub a skrze něj křížovou chodbu se 4 postranními rameny; protože má rondel velký obvod a musí být vyhozen s důrazem a silou, jsou zřízeny ty 4 křížové chodby, aby obvod nebraly jen uprostřed, nýbrž napadly a rozmetaly jej zároveň na všech 4 stranách i ve středu, takže nálož pracuje, vyhazuje a trhá na všech stranách nahoru i do boků.
- typ: odstavec
  de: |-
    Deßgleichen auch in dem ligenden gerissen grund zusehn ist/ wie mann das Puluer setzen soll/ vnd die Runden dinglin bedeuten die Puluer Donnen/ vnd die langen dingling zwischen den Donen bedeutten hölzen Dremlin/ dieselbigen werden also zwischen vnd auff die Doñen mit eingelegt/ das nit vil ledigs darin ist/ vnd das Puluer weide haben mög/ sonder es muß arbeiten vnd brechen dieweil es nit raum hat/ vñ in der enge gefangen ist. Weiter so die drem mit darin sind/ so reissen vnd schlagen sie sehr/ treiben das gebew von ein ander/ besonder was von erden ist/ dañ das holtz weicht vñ beugt sich nit wie erdtrich dañ es geht mit gewalt/ vnd was trifft das wirffs fürt/ Aber die zwerg hölzen drem die forn im loch in der graff ligen/ damit ists verigelt/ vnd so die zwerg hölzer lenger sind dan das loch weit ist/ daß sie vff jeder seiten ein schůch vorgehn/ vnd inwendig wider der maurn anligen/ dann kan das Puluer die drem nit herauß gestossen/ dann sie halten an beiden orten wider/ vnd stöst das puluer zwergs wider die hölzer/ wie in der langen maurn stock zu sehen/ etc.
  cs: |-
    Rovněž jest v tom ležatém narýsovaném půdorysu vidět, jak se má ukládat prach {Puluer}: ty kulaté útvary znamenají soudky s prachem a ty dlouhé kousky mezi soudky znamenají dřevěné špalky; ty se kladou mezi soudky a na ně tak, aby uvnitř nezůstávalo mnoho volného místa a prach neměl volný prostor k rozletu, nýbrž musel pracovat a lámat, protože nemá místa a je sevřen v úžině. Kromě toho, jsou-li v něm ty trámy, trhají a bijí velice silně a rozhánějí stavbu od sebe, zvláště co je z hlíny, neboť dřevo neustoupí a nepohne se jako hlína, nýbrž jde silou, a co zasáhne, to odmrští pryč. Příčné dřevěné trámy pak, jež leží vpředu v otvoru chodby, tím vše uzavírají závorou; a jsou-li ty příčné klády delší než šířka otvoru tak, že na každé straně o jeden střevíc {schůh} přesahují a zevnitř doléhají ke zdi, pak nemůže prach trámy vyrazit ven, neboť se na obou koncích opírají a prach tlačí napříč proti kládám, jak jest vidět v dlouhé hradbě s patrovým dřevem atd.
