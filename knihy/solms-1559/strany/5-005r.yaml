sken: 445
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    WAnn mann drücken greben hat/ die mit wällen bedeckt weren vnd Ründtel hetten/ wie mann dann solcher vil findt/ vnnd doch mit gemaurten festern eingefast/ wann mann vnden in den Greben darbei komen kündt/ zeigt dise Figur an/ wie mann darinnen brechen vnnd graben soll/ erstlich fahre mann darinn/ wie an der Figur zusehen ist/ im Fal das mann nit im Graben hinein kündt/ so fahe mann außwendig an vnd fahr vnderm Graben hinein/ aber so ferr die Figurn beide ein Ründel vnnd stercke anzeigen/ ist also zuuerstehn daß der Baw auffrichtig steht/ vnnd anzusehen ist/ souil aber daß Ligend reissen anzeigt/ ists der grundt wie er ist vnnd ligt vnder dem Baw/ vnd des baws anfang soll also verstanden werden/ wann mann vnder erden darin eingrebt/ soll es vnder Erden vnnd nit am tag geschehen/ ob schon die Figur anzusehen ist als sei es offen gerissen/ so wirt mann sehen wie mann ein Fahrn soll/ vnd wie sichs im fahrn vnd graben/ so mann mehr dann an eim ort Puluer setzt theilen wil/ erstlich zu eim Loch ein farn vnd an heben/ deßgleichen kan mann auch in eim Loch anzünden so daß Puluer gesetzt ist/ dann theilt sich daß Fewer zu beiden gengen biß zum Puluer setzen/ zündt beide setz mit einander an/ daß Sprengen eilent mit einander geht/ Weitter ist auch in solcher liegender Figur zusehen/ wie mann das Puluer setzen vnd verdarressen soll/ erstlich hat das Ründel in der mit ein runden Zirckelriß/ vnnd dardurch ein Kreutzgraben mit 4. neben außgetheilten greben/ vnd dieweil daß Ründtel weit in die Ründe ist/ vnd mit ernst vnd Gewalt wil geworffen werden/ sind die 4. Kreutzgreben gemacht/ das sie die Ründe nit allein in der mit/ sonder an den 4. orten vnd in der mit zugleich angreiffen vnd werffen/ das auff allen orten vber vnd neben arbeit/ wirfft vnnd zerreist.
  cs: |-
    Jsou-li před pevností suché příkopy {greben} kryté valy {wällen} a opatřené rondely {Ründtel} – jakých se najde mnoho – a přesto obezděné, a dá-li se k nim dostat dole v příkopu, ukazuje toto vyobrazení, jak se do nich má lámat a kopat. Nejprve se vnikne dovnitř, jak je na vyobrazení vidět; kdyby se nedalo vniknout v příkopu, začne se zvenčí a razí se pod příkopem. Pokud obě vyobrazení ukazují rondel a opevnění, rozumí se tím, že stavba stojí zpříma a tak je na ni pohled; co však ukazuje ležatý nákres, je půdorys, jak je a leží pod stavbou. Začátek díla pod stavbou je třeba chápat tak, že když se pod ni kope, má se to dít pod zemí, a ne na povrchu, i když vyobrazení vypadá, jako by bylo nakresleno otevřeně. Tak bude vidět, jak se má razit a jak se při ražení a kopání práce rozdělí, ukládá-li se prach na více místech než na jednom: nejprve se vnikne a začne jedním otvorem; stejně tak lze jedním otvorem i zapálit, když je prach uložen – oheň se pak rozdělí do obou chodeb až k náložím, zapálí obě nálože {setz} najednou a odstřel proběhne rázem a současně. Dále je na tomto ležatém vyobrazení vidět, jak se má prach ukládat a zahrazovat {verdarressen}:[^1] rondel má nejprve uprostřed okrouhlý výrub a skrze něj křížovou chodbu se 4 postranními rameny. Protože rondel má velký obvod a má být vyhozen důrazně a mocně, jsou zřízeny 4 křížové chodby, aby obvod zasáhly a vyhodily nejen uprostřed, ale zároveň na 4 místech i ve středu; nálož tak všude pracuje nahoru i do stran, vyhazuje a trhá.
- typ: odstavec
  de: |-
    Deßgleichen auch in dem ligenden gerissen grund zusehn ist/ wie mann das Puluer setzen soll/ vnd die Ründen dinglin bedeuten die Puluer Donnen/ vnd die langen dingling zwischen den Donnen bedeutten höltzen Dremlin/ dieselbigen werden also zwischen vnd auff die Donnen mit eingelegt/ das nit vil ledigs darin ist/ vnd das Puluer weide haben mög/ sonder es muß arbeiten vnd brechen dieweil es nit raum hat/ vnd in der enge gefangen ist. Weiter so die drem mit darin sind/ so reissen vnd schlagen sie sehr/ treiben das gebew von ein ander/ besonder was von erden ist/ dann das holtz weicht vnd beugt sich nit wie erdtrich dann es geht mit gewalt/ vnd was trifft das wirffs fürt/ Aber die zwerg höltzen drem die forn im loch in der graff ligen/ damit ists verrigelt/ vnd so die zwerg höltzer lenger sind dan das loch weit ist/ daß sie vff jeder seiten ein schůch vorgehn/ vnd inwendig wider der maurn anligen/ dann kan das Puluer die drem nit herauß gestossen/ dann sie halten an beiden orten wider/ vnd stöst das puluer zwergs wider die höltzer/ wie in der langen maurn stock zu sehen/ etc.
  cs: |-
    Rovněž je v tom ležatém narýsovaném půdorysu vidět, jak se má prach {Puluer} ukládat: kulaté útvary znamenají soudky s prachem a dlouhé kousky mezi soudky dřevěné trámky {Dremlin}. Ty se kladou mezi soudky i na ně, aby uvnitř nezůstalo mnoho volného místa a prach neměl prostor, nýbrž musel pracovat a lámat, protože nemá místo a je sevřen v těsnu. Jsou-li do nálože vloženy i trámy, trhají a bijí velmi silně a rozhánějí stavbu, zvláště co je z hlíny; dřevo totiž neustupuje a neohýbá se jako zemina, nýbrž jde silou, a co zasáhne, to odmrští pryč. Příčné dřevěné trámy, které leží vpředu v otvoru chodby {graff}, vše uzavírají jako závora. Jsou-li ty příčné trámy delší, než je otvor široký, takže na každé straně o stopu {schůch} přesahují a zevnitř doléhají ke zdi, nemůže je prach vyrazit ven, protože se na obou koncích opírají a prach tlačí napříč proti nim – jak je vidět na dlouhém úseku hradby atd.
poznamky:
- n: 1
  text: |-
    Tisk (sken 445) má „verdarressen“ (OCR četlo *verdaressen*); sloveso je jinde nedoložené, ze souvislosti jde o zahrazení či utěsnění nálože (srv. *verdammen* na `5-003r` a *verrigelt* níže).
