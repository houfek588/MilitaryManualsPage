stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    würde es ein vberflüssigen schweren vnkosten vnnd mühe mit der menge des volcks/ Prouiant vnd gelts gestehn/ vnd wann es die meinung haben solt/ so were die beschwerde wolbedacht/ aber den weg hat es nit/ solt auch dahin nit verstanden werden/ dann allein auff diesen weg/ wann solche Blochäuser noch gelegenheit vnd der notturfft erforderung gemacht werden solten/ so were diser weg wie volgt fürzunemen/ Vnnd wann solche Blochäuser der gestalt auß gemacht würden/ so soll mann die zu aller zeit nit wehrlich besetzen vnd verhüten/ sonder in zeit des friedes/ so mag man in jeglichs ein Hauß bawen/ das ein man mit seinem gesind darin wonen künde/ der es verschleust vnd verwart/ vnd soll doch nichts desto weniger fein ordenlich beschrieben vnd geordnet werden/ das zur not in der besatzung kriegßuolck darinn sei vnd einen Monat Prouiant mit aller zugehörender Rüstung so darzů von nöten ist haben möge/ deßgleichen Geschütz groß vnd klein/ wie es darinn zubrauchen ist/ Vnd wann dann solche Blochäuser nach eines jeden notturfft gnůgsam verordnet vnnd beschrieben weren/ so kan mann inn Stätten/ Flecken vnd auff dem landt solches Kriegßuolck souil die Blochäuser zubesetzen bedörffen verordnen/ daß dieselbigen allezeit warten wann sie erfordert werden/ vnd ein jeglicher wiß in welches Hauß oder ort er gehört/ vnd sich mit seiner wehr/ so jm zugeordnet/ zu welcher stundt mann jn bescheidet/ bereit vnd gerüst finden laß/ vnd solchem volg thů. Solches Kriegßuolck mag mann von den Stätten vnd Landtuolck/ darff darumb nicht Kriegßuolck in Besoldung halten/ deßgleichen mag man das Geschütz vnd seine zugehörige Rüstung in stätten vnd in andern bewehrlichen befestungen behalten/ biß zur zeit der not/ so hat man dann ein jedes zuschaffen dahin es verordnet were/ deßgleichen so möcht man den vorrat der Prouiant auch in stäten vnd an andern gelegen orten oder kasten verwart halten/ aber doch nit desto weniger müssen die Bloch oder Erdt Häuser jre eigen gebew zum Geschütz vnd Prouiant/ ein jedes mit seiner maß gemacht haben.
  cs: |-
    by to stálo zbytečný, těžký náklad a námahu s množstvím lidu, proviantu {Prouiant} a peněz. Kdyby to tak bylo myšleno, byla by ta námitka dobře uvážená; tak tomu však není a ani se to tak nemá chápat, nýbrž jen takto: mají-li se takové sruby {Blochäuser} stavět podle příležitosti a podle toho, co vyžaduje potřeba, je třeba postupovat, jak dále následuje. Až budou takové sruby tímto způsobem dostavěny, nemají být po všechen čas ozbrojeně obsazeny a střeženy; v čas míru lze v každém postavit dům, aby v něm mohl bydlet jeden muž se svou čeledí, který srub zamyká a opatruje. Nicméně se má všechno pěkně řádně sepsat a uspořádat, aby v čas nouze byl v posádce {besatzung} válečný lid a měl tam proviant na jeden měsíc se vší příslušnou výbavou {Rüstung}, které je třeba, a rovněž děla {Geschütz} velká i malá, jak se jich tam má užívat. A když budou takové sruby podle potřeby každého dostatečně opatřeny a sepsány, lze ve městech, městečkách a na venkově určit tolik válečného lidu {Kriegßuolck}, kolik je k obsazení srubů třeba, aby byli vždy připraveni, až budou povoláni, aby každý věděl, do kterého domu či místa patří, a dostavil se připraven a vyzbrojen zbraní, která mu byla přidělena, v hodinu, kterou mu určí, a uposlechl. Takový válečný lid lze vzít z měst a ze zemského lidu {Landtuolck}, a není proto třeba držet válečný lid v žoldu {Besoldung}. Stejně tak lze děla a jejich příslušnou výzbroj uchovávat ve městech a jiných branných pevnostech {befestungen} až do času nouze; pak se každé dopraví tam, kam bylo určeno. Rovněž by se zásoba proviantu mohla uchovávat ve městech a na jiných vhodných místech či v sýpkách. Přesto však musejí mít sruby čili zemní domy {Erdt Häuser} svá vlastní stavení pro děla a proviant, každé zhotovené podle své míry.
- typ: odstavec
  de: |-
    Vnd solche Personen so inn die Bloch oder Erdt Hauß verordnet werden/ daß dieselbigen beuelch hetten/ die Hauß zubeschliessen vnd in gůter wacht zu halten/ vnd ob dieselbigen etwas schaden am bawen oder dergleichen nemen/ daß dieselbigen von stundtan zumachen verschafften/ damit die Bewe in gůtem wesen bleiben möchten/ Also wirt die vnderhaltung on grosse mühe vnd vnkosten geschehen/ dann es künden solche Krieg oder vberzüg nit so heimlich geschehen/ sonder mann kan allezeit so man glaubhafftige warung oder kundtschafft hat dasselbig versehen/ besonder so zuuor alle sachen in gůter
  cs: |-
    A osoby ustanovené do srubů či zemních domů mají mít rozkaz domy zamykat a držet pod dobrou stráží, a kdyby utrpěly nějakou škodu na stavbě nebo podobně, mají ji ihned dát opravit, aby stavby zůstávaly v dobrém stavu. Tak se udržování obejde bez velké námahy a nákladů. Taková válka či vpád {vberzüg} se totiž nemohou udát tak tajně, aby se člověk nemohl vždy připravit, jakmile má věrohodnou výstrahu {warung} či zprávy od zvědů {kundtschafft} – zvláště když jsou předem všechny věci v dobrém
