list: 26 (5. kniha)
strana: recto
sken: 489
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    würde es ein vberflüssigen schweren vnkosten vnnd mühe mit der menge des volcks/ Prouiant vnd gelts gestehn/ vnd wañ es die meinung haben solt/ so were die beschwerde wolbedacht/ aber den weg hat es nit/ solt auch dahin nit verstanden werden/ dann allein auff diesen weg/ wañ solche Blochäuser noch gelegenheit vnd der notturfft erforderung gemacht werden solten/ so were diser weg wie volgt fürzunemen/ Vnnd wann solche Blochäuser der gestalt auß gemacht würden/ so soll mann die zu aller zeit nit wehrlich besetzen vnd verhüten/ sonder in zeit des friedes/ so mag man in jeglichs ein Hauß bawen/ das ein man mit seinem gesind darin wonen künde/ der es verschleust vnd verwart/ vñ soll doch nichts desto weniger fein ordenlich beschrieben vñ geordnet werden/ das zur not in der besatzung kriegßuolck darinn sei vñ einen Monat Prouiant mit aller zugehörender Rüstung so darzů von nöten ist haben möge/ deßgleichen Geschütz groß vnd klein/ wie es darinn zubrauchen ist/ Vnd wann dann solche Blochäuser nach eines jeden notturfft gnůgsam verordnet vnnd beschrieben weren/ so kan mann inn Stätten/ Flecken vnd auff dem landt solches Kriegßuolck souil die Blochäuser zubesetzen bedörffen verordnen/ daß dieselbigen allezeit warten wann sie erfordert werden/ vnd ein jeglicher wiß in welches Hauß oder ort er gehört/ vnd sich mit seiner wehr/ so jm zugeordnet/ zu welcher stundt mann jn bescheidet/ bereit vnd gerüst finden laß/ vnd solchem volg thů. Solches Kriegßuolck mag mann von den Stätten vnd Landtuolck/ darff darumb nicht Kriegßuolck in Besoldung halten/ deßgleichen mag man das Geschütz vnd seine zugehörige Rüstung in stätten vñ in andern bewehrlichen befestungẽ behalten/ biß zur zeit der not/ so hat man dañ ein jedes zuschaffen dahin es verordnet were/ deßgleichen so möcht man den vorrat der Prouiant auch in stäten vnd an andern gelegen orten oder kasten verwart haltẽ/ aber doch nit desto weniger müssen die Bloch oder Erdt Häuser jre eigen gebew zum Geschütz vnd Prouiant/ ein jedes mit seiner maß gemacht haben.
  cs: |-
    by to stálo nadbytečný těžký náklad a námahu s množstvím lidu, proviantu {Prouiant} i peněz; a kdyby tomu mělo takto být, pak by ta námitka byla dobře uvážena. Takovou cestou to však nejde a ani tak se to nemá rozumět, nýbrž pouze tímto způsobem: mají-li být takové sruby {Blochhaus} zřizovány podle polohy a požadavku potřeby, jest postupovat tak, jak následuje. Když jsou takové sruby takto dobudovány, nemají být po všechen čas ozbrojeně obsazeny a střeženy, nýbrž v době míru lze v každém z nich postavit jeden dům, aby v něm mohl bydlet jeden muž se svou čeledí, jenž srub zamyká a opatruje. Přesto však má být všechno pěkně řádně sepsáno a rozvrženo, aby v čase nouze byla v něm v posádce {Besatzung} hotová branná síla a mohla v něm mít proviant na jeden měsíc se vší příslušnou výbavou {Rüstung}, jíž je zapotřebí, stejně tak i děla {Geschütz} velká i malá, jak se jich tam má užívat. A jakmile jsou takové sruby podle potřeby každého dostatečně zařízeny a zapsány, mohou se ve městech, městečkách i na venkově určit branci z řad poddaných, kolik je k obsazení srubů třeba, aby vždy čekali, kdy budou povoláni, aby každý věděl, do kterého srubu či místa náleží, a dostavil se připraven a ozbrojen se zbraní jemu určenou v kteroukoli hodinu, kdy bude povolán, a vykonal tak svou povinnost. Takovéto vojsko může být z měst a venkovského lidu, takže není třeba držet válečný lid v trvalém žoldu {Besoldung}; stejně tak se mohou uchovávat děla a jejich příslušná výzbroj ve městech a v jiných branných pevnostech až do doby nouze, kdy se každé dopraví tam, kam bylo určeno. Rovněž se dá zásoba proviantu chovat v bezpečí ve městech a na jiných vhodných místech či špýcharech; nicméně však sruby neboli zemní pevnůstky musejí mít svá vlastní stavení pro děla a proviant, každé vystavěno podle své míry.
- typ: odstavec
  de: |-
    Vnd solche Personen so inn die Bloch oder Erdt Hauß verordnet werden/ daß dieselbigen beuelch hetten/ die Hauß zubeschliessen vnd in gůter wacht zu halten/ vnd ob dieselbigen etwas schaden am bawen oder dergleichen nemen/ daß dieselbigen von stundtan zumachen verschafften/ damit die Bewe in gůtem wesen bleiben möchten/ Also wirt die vnderhaltung on grosse mühe vnd vnkosten geschehen/ dann es künden solche Krieg oder vberzug nit so heimlich geschehen/ sonder mann kan allezeit so man glaubhafftige warung oder kundtschafft hat dasselbig versehen/ besonder so zuuor alle sachen in gůter
  cs: |-
    A takové osoby, jež jsou do srubů či zemních pevnůstek ustanoveny, mají mít rozkaz domy zamykat a držet v dobrém dohledu, a kdyby utrpěly nějakou škodu na stavbě či podobně, ihned zařídit opravu, aby stavby zůstávaly v dobrém stavu. Takto se udržování bude dít bez veliké námahy a nákladů: taková válka či vpád se totiž nemůže udát tak tajně, aby se to – jakmile má člověk věrohodné varování {warung} či zpravodajské zprávy {kundtschafft} – nedalo vždy opatřit, zvláště jsou-li předem všechny věci v dobrém
