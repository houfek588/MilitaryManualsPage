bloky:
- typ: odstavec
  de: |-
    Nemlich durch ein Person die darzů geordnet ist / die es allein thůt vnd ist doch ein werck / das die obgemelte vier alle mit zuthůn haben / als der Feldmarschalck für eins besehen soll / das die Quartir wie sich gebürt nach gelegenheit getheilt werden / vnd die wachten darnach zuordnen vnd zubestellen.
  cs: |-
    Totiž prostřednictvím jediné k tomu určené osoby, která to dělá sama, ačkoli je to dílo, na němž se mají podílet všichni čtyři výše jmenovaní. Polní maršálek {Feldmarschalck} má například nejprve dohlédnout, aby se kvartýry {Quartir} podle povahy místa náležitě rozdělily, a podle toho rozvrhnout a rozestavit stráže {wachten}.
- typ: odstavec
  de: |-
    Der Artoloreimeister hat zuuersehen / wo er sein Geschütz stellen soll / als den Lermenplatz darmit zubeziehen / es sei ein Lermenplatz oder mehr / oder das sich etwan ein Leger darnach schicken wirt / das mann geschütz auff ein Berg oder ort stellen můst / ein Paß oder strassen zuuerweren / wie das wol komen kan / das sich solches zutragen / vnd der gelegenheit nach schicket / deßgleichen ob mann solt ein Leger beschantzen oder ein flecken es wer ein Schloß oder Stat / desgleichen sein Platz zu seiner Munition zustellen / vnd seine Artolorei Roß daran auch vil gelegen ist / auß disen vrsachen gehört der Artoloreimeister oder sein Leutenant darbei.
  cs: |-
    Zbrojmistr {Artoloreimeister} má určit, kam postaví svá děla {Geschütz}, aby jimi obsadil poplachové místo {Lermenplatz}, ať je jich jedno, či více; anebo zda se ležení {Leger} neuspořádá tak, že bude nutné postavit děla na nějaký vrch či jiné místo a zahradit jimi průsmyk nebo cestu, jak se to snadno může přihodit, vyžádá-li si to povaha terénu. Rovněž má posoudit, zda se má ležení nebo nějaké místo, ať hrad, či město, opevnit šancemi {beschantzen}. Dále má určit místo pro svou munici {Munition} a pro dělostřelecké koně, na nichž také velmi záleží. Z těchto příčin u toho má být zbrojmistr nebo jeho poručík {Leutenant}.
- typ: odstavec
  de: |-
    Zum dritten so soll der Wagenburgmeister auch darbei sein / ob mann würd ein Wagenburg schlagen oder stellen / das er sehen künd wo die sein solte / damit er sein Wagen souil er bedürffen würd / ehe dan die in das leger komen würden außnemen nach seiner Ordnung vnd rollen / das sollen der Feldmarschalck vnd der Wagenburgmeister sich mit einander vergleichen / des daß die so die wagen geben / zu nacht darbei gequartirt würden / darmit sie bei jhren Wagen sein möchten oder die wagen bei jhnen / so hat der Wagenburgmeister auch zusehen vnd wer an solches ort zu ligen quartirt wirt / auß demselben hat er die Wagenburg zunemen / vnd sein leutenant lassen zu rück reitten / das der dem Wagenmeister sage / das er jm souil wagen als er bedarff / auß dem hauffen das dar quartirt wirt / gebe / dieselbige hat er dann zu forieren / vnd dieselbige soll er bald außfüren / vnd bei solchen platz darmit sie jhre zelten abladen möchten / vnd auff die fütterung faren.
  cs: |-
    Za třetí u toho má být také mistr vozové hradby {Wagenburgmeister}, má-li se rozbíjet či stavět vozová hradba {Wagenburg}, aby viděl, kde má stát, a mohl podle svého řádu a seznamu vybrat tolik vozů, kolik bude potřebovat, ještě než vozy dorazí do ležení. Polní maršálek a mistr vozové hradby se mají spolu dohodnout na tom[^1], aby ti, kdo vozy dávají, byli na noc ubytováni poblíž a mohli tak být u svých vozů, nebo vozy u nich. Mistr vozové hradby má také zjistit, kdo je na takovém místě ubytován, a od těch má vozovou hradbu vzít. Svého poručíka má poslat zpět, aby vozmistrovi {Wagenmeister} vyřídil, ať mu z houfu {hauffen}, který je tam ubytován, vydá tolik vozů, kolik potřebuje. Ty pak má uvést na jejich místo {forieren}, hned je vyvézt a postavit u onoho prostranství, aby z nich mohli složit stany a vyjet pro píci {fütterung}.
- typ: odstavec
  de: |-
    Dieweil dann ein leger zuschlagen also durch die vermelt vier Personen geschehen soll / so ist solches den vier Personen einem in seins Ampts beuelch nit allein zuschreiben / wie fornen vermelt / das die Kriegßampter ein jedes besonder beschrieben werden soll / So wil ich das leger wie das geschlagen werden soll / souil die gelegenheit das geben vnnd leiden wil / in dises Bůch vnd verzeichnuß des Kriegs anfangs Ordnung nit beschreiben / dann es ist das erst stuck / wann das Kriegßuolck bei einander kömpt das mann gen Feld zeugt das leger schlegt / derhalben so wil ich etlich Artickel nemlich fünfftzehen anzeigen / darauß ein leger zu schlagen vorzunemen sein soll / vngefehrlich die Haupt puncten wie volgt.
  cs: |-
    Protože se tedy rozbíjení ležení má dít prostřednictvím zmíněných čtyř osob, nelze je připsat do působnosti úřadu jen jedné z nich – vždyť, jak bylo řečeno vpředu, má být každý válečný úřad {Kriegßampter} popsán zvlášť. Nebudu proto v této knize a zápisu o počátečním válečném řádu popisovat, jak se má ležení rozbíjet podle toho, co okolnosti dovolí a snesou[^2]. Je to totiž první věc, když se válečný lid {Kriegßuolck} shromáždí a táhne do pole, že rozbije ležení; proto chci uvést několik článků, totiž patnáct[^3], podle nichž se má při rozbíjení ležení postupovat – zhruba hlavní body, jak následují:
poznamky:
- n: 1
  text: V tisku zkráceně *des dʒ* místo *des daß* („na tom, aby…“).
- n: 2
  text: |-
    V tisku stojí *nit beschreiben* („nepopsat“); vzhledem k úvodní doložce *souil die gelegenheit das geben vnnd leiden wil* i následující větě *dann es ist das erst stuck…* jde buď o elipsu („nebudu zde popisovat zeširoka, nýbrž uvedu jen hlavní body“), anebo o sazečskou záměnu za *mit beschreiben* („popsat zároveň s tím“).
- n: 3
  text: |-
    Ačkoliv autor zde oznamuje patnáct (*fünfftzehen*) článků, nadpis na následující straně i samotný výčet uvádějí jen dvanáct (*zwelff*) bodů.
