bloky:
- typ: odstavec
  de: |-
    Alle Prouiant so vor dem Leger oder in dem Reutter Leger verwirckt wirt / gehört dem Feldmarschalck allein zů.
  cs: |-
    Veškerý proviant {Prouiant}, který propadne před ležením {Leger} nebo v ležení jízdy {Reutter}, náleží jedině polnímu maršálkovi {Feldmarschalck}.
- typ: odstavec
  de: |-
    Der Marschalck gibt allen die Prouiant auff freyen Marck brengen vnd fürn / auch allen Marcatanten Compaßbriff in der Reuter leger. Welcher Marcatant mit falscher Eln / Gewicht / Maß / oder meß / im Reutter leger straff verwirckt / der gehört dem Feldmarschalckt zů straffen.
  cs: |-
    Maršálek vydává glejty {Compaßbriff} do ležení jízdy všem, kdo přinášejí a dovážejí proviant na svobodný trh, i všem markytánům {Marcatanten}. Propadne-li některý markytán v ležení jízdy trestu za falešný loket, závaží, dutou míru nebo měřidlo, přísluší jej potrestat polnímu maršálkovi.
- typ: odstavec
  de: |-
    Der Feldmarschalck nimpt alle Stät / Schloß vnnd Flecken ein / ergeben sich welcherlei gestalt sie wöllen / er leßt jm auch an stat des Kriegsherren die Einwoner schweren / die sich in gefengknuß ergeben / nimpt er in gelübt / daruon im 67. Artickel des Obersten angezeigt wirt / wann auch ein Kriegsuolck jre Roß in einem Flecken lassen mussen / von denselben nimpt der Feldmarschalck eines welches jm gefelt / die andern sein des Obersten / wie in des Obersten 66. Artickel gehört.
  cs: |-
    Polní maršálek přebírá všechna města, hrady a městečka, ať se vzdají jakýmkoli způsobem. Nechává také obyvatele přísahat {schweren} místo válečného pána {Kriegsherren} a od těch, kdo se vzdají do zajetí, přijímá slib, o čemž se pojednává v 67. článku o plukovníkovi. Musí-li některý válečný lid {Kriegsuolck} zanechat v městečku své koně, vezme si z nich polní maršálek jednoho, který se mu zalíbí; ostatní patří plukovníkovi {Obersten}, jak bylo řečeno v 66. článku o plukovníkovi.
- typ: odstavec
  de: |-
    Ein jeder Feldmarschalck gibt allen so Beutten im Reutter leger kauffen / als Roß / schaaff / oder rinderhafftig viehe / Paßporten daruon / deß ist mann jm den zehenden pfenning schuldig / doch ist es nit in einem ganghafftigen gebrauch / sonder mann soll sich zimlicher massen mit jm vertragen / furnemlich wann einer das viehe im Leger metzeln wolte.
  cs: |-
    Každý polní maršálek vydává všem, kdo v ležení jízdy kupují kořist, jako koně, ovce nebo hovězí dobytek, průvodní listy {Paßporten}. Náleží mu z toho desátý peníz; to však není obecně zavedený zvyk a kupec se s ním má spíše přiměřeně dohodnout, zvláště kdyby chtěl dobytek porážet v ležení.
- typ: odstavec
  de: |-
    Wann die Reutter jrrig oder streittig werden / es sei vmb Wacht / vor oder nachziehen / Beuten / Quartiern / Losament / Futerung / Prouiant oder anders / soll sie der Feldmarschalck vnderstehen zuuertragen / wann aber die Partheien jhm nicht folgen wolten / weist er sie fur den Obersten Feldhauptman vnd seine Kriegsräth / bei derselbigen Spruch den sie nach Kriegsbrauch thůn / sein sie schuldig zů bleiben.
  cs: |-
    Dostanou-li se jezdci do sporu nebo rozepře, ať o stráž {Wacht}, o tah v předvoji či v zadním voji, o kořist, kvartýry {Quartiern}, ubytování {Losament}, píci, proviant nebo cokoli jiného, má se je polní maršálek pokusit smířit. Nechtějí-li ho však strany poslechnout, odkáže je před nejvyššího polního hejtmana {Obersten Feldhauptman} a jeho válečné rady {Kriegsräth}; jejich výroku, vyneseného podle válečného obyčeje, se pak musejí podřídit.
- typ: odstavec
  de: |-
    Der Feldmarschalck soll von allen Reuttern Hauptleuten Zetel nemen / wieuil Reutter ein jeder vnder jm habe / vnd sie den Quartier vnd Wachtmeister vberantworten / wann sich dann der Marschalck beduncken leßt / ein Hauptman wolt im anzeigen vortheil suchen / soll er sich bei der Reutter Mustermeister erkundigen / damit jederman wache / wer derselben nicht frei ist / sonst gebiert es vnwillen / er soll ernstlich darob halten / daß die Wahtmeister die Wacht gleich lassen vmbgehn / nicht einem zweimal ehe etwan einem andern einmal ansagen / vnd wann der Marschalck solchs oder andere gefahr / bei den Wachtmeistern erfert / soll er sie gantz ernstlich straffen.
  cs: |-
    Polní maršálek si má ode všech hejtmanů {Hauptleuten} jízdy vyžádat písemné soupisy, kolik jezdců má každý pod sebou, a předat je kvartýrmistrovi a vachmistrovi {Quartier vnd Wachtmeister}. Zdá-li se pak maršálkovi, že některý hejtman chce při hlášení získat výhodu, má se informovat u přehlídkového mistra {Mustermeister} jízdy, aby stráž držel každý, kdo od ní není osvobozen; jinak to plodí nevoli. Má přísně dbát, aby vachmistři[^1] nechávali stráž kolovat rovnoměrně a nenařizovali ji jednomu dvakrát dřív, než jinému jednou. Zjistí-li maršálek u vachmistrů takovou nebo jinou nepoctivost, má je velmi přísně potrestat.
- typ: odstavec
  de: |-
    Dieweil dann alhie in diser Feldmarschalcks ampts verwaltung vermelt wirt / das Francken / Schwaben / deß gleichen die Steuerer
  cs: |-
    Protože se zde v popisu úřadu polního maršálka uvádí, že Frankové, Švábové a také Štýřané
poznamky:
- n: 1
  text: V tisku chybně *Wahtmeister* místo *Wachtmeister*.
