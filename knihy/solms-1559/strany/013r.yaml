bloky:
- typ: odstavec
  de: |-
    Darumb so wöl Ewer Römische Keyserliche Maiestat fürt faren / vnd das allem Kriegsuolck in gemein fürhalten / vnd sagen lassen / vnd wöl auch darob halten vnd nachkommen / vnd Ewer Römische Keyserliche Maiestat / die wölle sehen welche der tugent / oder also vnchristlich sein wöllen / vnd jr gemüt in dem erkennen / von beiden theilen / welche sich des nach Ewer Römischen Keyserlichen Maiestat halten wöllen / vnd Gott zuuor / vnd jre ehr bedencken / die wölle Ewer Römis. Keyser. Maiest. annemen / behalten / vnnd jhre vertrawen zu jn / als zu ehrlichen / Gottsförchtigen leuten setzen / welche aber jhre vbel nit verlassen / vnd höher dann Gott jr ehr setzen wolten / die soll Ewer Römische Keyserliche Maiestat / auch nicht bei jn wissen / vnd sehen / welcher die ehr vnd Krieg darumb verlassen wölle / vnnd vor Gott sein vbel vnd ehr setzen / welche sich dann also widersetzen / die laß Ewer Römis. Keys. Maiestat nur hinziehen / dann sie besser von dem hauffen dann darbei seind / vnd ziehen sie derhalben hinweg / so ist es jnen nit fast ehrlich / wo das gehört wirt bei aller erbarkeit.
  cs: |-
    Proto nechť Vaše římské císařské Veličenstvo postoupí dále, dá to předložit a oznámit všemu válečnému lidu {Kriegsuolck} obecně a také na tom trvá a podle toho jedná. A Vaše římské císařské Veličenstvo nechť pohlédne, kteří chtějí být ctnostní a kteří takto nekřesťanští, a pozná v tom smýšlení obou stran: ty, kteří se chtějí řídit podle Vašeho římského císařského Veličenstva a mají na mysli především Boha a svou čest, nechť Vaše římské císařské Veličenstvo přijme, ponechá si je a vloží v ně svou důvěru jako v čestné, bohabojné lidi; ty však, kteří nechtějí opustit svou nepravost a chtěli by svou čest klást výše než Boha, nechť Vaše římské císařské Veličenstvo ani u sebe nestrpí a vidí, kdo by pro to chtěl opustit čest i válku a klást své zlo a svou pýchu před Boha. A kteří by se takto vzpírali, ty nechť Vaše římské císařské Veličenstvo prostě nechá odejít, neboť je lépe, jsou-li od houfu {hauffen} pryč než při něm; a odtáhnou-li kvůli tomu, nebude jim to nijak ke cti, kdekoli se o tom mezi počestnými lidmi uslyší.
- typ: odstavec
  de: |-
    Vnd Ewer Römische Keyserliche Maiestat die seien auch mit allem ernst daran / welchen ämptern oder Personen Caplan gehalten werden / daß dieselbigen sie haben vnnd halten / vnnd fleissig vor dem gemeinen Volck / vnnd nicht inn der gezelten / predigen lassen / damit vil Leut zuhören können / vnnd dieselbigen Prediger sollen fast jre Predig darauff stellen / daß das Gottslestern gestrafft werde / die Meß mögen sie wol vnder den gezelten halten / von wegen des vngewitters / wann es aber stil ist / sollen sie die gezelt neben auffthůn.
  cs: |-
    A nechť Vaše římské císařské Veličenstvo také s veškerou vážností dbá o to, aby ti úředníci či osoby, jimž se vydržují kaplani {Caplan}, je skutečně měli a drželi a dávali jim pilně kázat před obecným lidem, a nikoli uvnitř stanů, aby mohlo naslouchat mnoho lidí; a titíž kazatelé mají svá kázání zaměřit především na to, aby bylo trestáno rouhání Bohu. Mši sice smějí sloužit pod stany kvůli nepohodě, když však je tiché počasí, mají stany po stranách otevřít.
- typ: odstavec
  de: |-
    Vnd ob Ewer Römische Keyserliche Maiestat schon etliche besonder Person darzů hielten / die im Leger hin vnd wider predigten / were Göttlich vnd gůt / damit das gemeyn Volck nicht so Gottloß lebet / wie das viehe vnd nicht wie Christliche menschen / Das were Ewer Römische Keyserliche Maiestat vor Gott dienstlich / vnd der welt löblich / vnd würd Gott gnad vnd sieg verleihen / besonder gegen vnserm grossen Feind dem Türcken.
  cs: |-
    A kdyby Vaše římské císařské Veličenstvo dokonce vydržovalo několik zvláštních osob k tomu, aby kázaly po ležení {Leger} sem a tam, bylo by to zbožné a dobré, aby prostý lid nežil tak bezbožně jako dobytek, a ne jako křesťanští lidé. To by bylo pro Vaše římské císařské Veličenstvo záslužné před Bohem a chvályhodné před světem, a Bůh by udělil milost a vítězství, zvláště proti našemu velkému nepříteli Turkovi {Türcken}.
- typ: odstavec
  de: |-
    Wann dann Ewer Römische Keyserliche Maiestat also den krieg / souil jr darinn sein / mit Gottes forch vnd ehr anstellen kan / so wirdt auch gnad vnd sieg darbei sein / vnd ob es schon den ersten zug im anheben / nicht gantz volkomlich naher geht oder gehn würde / so muß mann harren / so kompts mit der zeit in ein gebrauch vnd gewonheit.
  cs: |-
    Když pak Vaše římské císařské Veličenstvo dokáže válku, pokud to na něm záleží, takto zařídit v bázni Boží a se ctí, bude při tom také milost a vítězství; a i kdyby to hned při prvním tažení {zug} od počátku nešlo nebo neprobíhalo zcela dokonale, je třeba vytrvat, a časem se to stane zvykem a obyčejem.
- typ: odstavec
  de: |-
    Zum andern vnd beschluß / so halte Ewer Römische Keyserliche Maiestat gůte Justitie offenlich vnd nicht heymlich / dann was offenlich geschicht / das ist bei jederman verantwort / vor dem gemeynen mann ernstlich vnd erschrecklich / vnd mag nicht gesagt werden / daß
  cs: |-
    Za druhé a na závěr nechť Vaše římské císařské Veličenstvo udržuje dobrou spravedlnost veřejně, a nikoli tajně; neboť co se děje veřejně, to je před každým obhájené, před prostým lidem vážné a odstrašující, a nemůže se říci, že
