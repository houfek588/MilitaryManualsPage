bloky:
- typ: odstavec
  pokracovani: true
  de: Bürger desto friedlicher/ auch die Stat desto lenger behalten.
  cs: měšťany udržet o to pokojněji a město o to déle uhájit.
- typ: odstavec
  de: |-
    Ob auch ein Hauptman von seinem Herren in einer bestimpten zeit rettung halben vertröstet wirt/ vnnd vom Herren nicht geschicht oder geschehen kan/ ist der Hauptman dannoch den Flecken als lang jm jmmer müglich bei sein ehren zuhalten schuldig/ dann welcher einn Flecken der zubehalten ist/ vber oder auff gibt/ der handlet wider sein pflicht/ vnd ist ehrloß zuachten.
  cs: |-
    Kdyby byl také hejtman {Hauptman} od svého pána ubezpečen o vyproštění v určité lhůtě, a od pána by k tomu nedošlo nebo nemohlo dojít, je hejtman přesto povinen při své cti městečko hájit tak dlouho, jak jen bude moci; neboť kdo městečko, jež lze udržet, vydá nebo vzdá, jedná proti svému závazku {pflicht} a má být pokládán za bezectného.
- typ: odstavec
  de: |-
    Ich wil hie nit vil von vber oder auffgeben/ sonder allein fast weren vnd hart halten schreiben/ wie derhalben gnůgsam ins Obensten Feldhauptmans. 66. 67. 68. 69. vnd 70. Artickeln anzeigung geschicht/ darbei laß ichs bleiben.
  cs: |-
    Nechci zde mnoho psát o vydávání či vzdávání se, nýbrž výhradně o pevném bránění a tuhém držení se, jak je o tom ostatně dostatečně pojednáno v 66., 67., 68., 69. a 70. článku o nejvyšším polním hejtmanovi {Feldhauptmans}[^1]; při tom to také ponechám.
- typ: odstavec
  de: |-
    So auch ein Kriegsuolck zu roß vnd fůß in einer besatzung Prouiant muß kauffen/ erheischt die not das der Herr sie bezalle oder jhnen die Prouiant leidlich an der bezalung biß zu der rettung oder abzug gebe.
  cs: |-
    Musí-li si také válečný lid {Kriegsuolck} na koni i pěší v posádce {besatzung} kupovat proviant {Prouiant}, vyžaduje nutnost, aby jim pán platil anebo jim proviant dával na účet výplaty za snesitelnou cenu až do vyproštění či odchodu nepřátel.
- typ: odstavec
  de: |-
    Die Lantzknecht haben kürtzlich zwei vnbilliche fürnemen in den besatzungen erdacht/ eines/ als bald sie von den feinden belegert vnd der Fleck beschlossen wirdt/ soll jhr Monat auß vnd angehen/ der ander/ wann sie ein sturm erhalten/ soll jhn der Herr ein sturm sold zubezalen schuldig sein/ dise beide sein newerung/ vnnd ist es kein Herr schuldig deßhalb wirdt für das best bedacht/ daß der Herr eigentlich im Artickels brieff solchs fürkome.
  cs: |-
    Lancknechti {Lantzknecht} si nedávno v posádkách vymysleli dva neoprávněné požadavky: za prvé, jakmile jsou obleženi nepřáteli a městečko je obklíčeno, má jim skončit měsíc a začít nový; za druhé, když odrazí útok {sturm}, má jim být pán povinen vyplatit útočný žold {sturm sold}. Obojí jsou novoty a žádný pán jimi není povinen; proto se pokládá za nejlepší, aby tomu pán výslovně předešel v artikulním listu {Artickels brieff}.
- typ: odstavec
  de: |-
    Es sein auch kleine besatzung in Flecken vnd Schlossen/ darinnen sollen sie doch alweg nach ordnung handlen/ vnd in allen besatzungen sollen Reutter/ Knecht vnnd einwoner/ so ferr mann die einwoner zur wehre gebrauchen wil/ am anfang zusamen schweren.
  cs: |-
    Bývají také malé posádky v městečkách a na zámcích, v nichž mají přesto vždy jednat podle řádu {ordnung}; a ve všech posádkách mají jezdci {Reutter}, knechti {Knecht} i obyvatelé – pokud se má obyvatel použít k obraně – hned na počátku společně složit přísahu.
- typ: odstavec
  de: |-
    Nach dem nun einem jeden Herren der auß noth ein Stat/ Flecken oder Schloß besetzen wil odder muß/ an verstendigen/ erfarnen Kriegsleutten hochwichtig gelegen ist/ so soll der Herr kein Obersten Hauptman vber den Flecken/ kein Obersten vber die Knecht/ kein Zeugmeister/ Bawmeister noch andere Beuelchsleut hinein verordnen/ sie seien dann vorhin auch in besatzungen belegert gewesen/ sunst handlet Rath vnd Ratschlag ein jeder vnwissender hierinnen/ wie der blindt von den farben/ vnnd bedarff ein jeder Herr eben als wol geschickter erfarner/ verstendiger vnd hertzhaffter beuelchs vnd anderer Kriegsleut in einer besatzung als im felde/ vnd wann sich das Kriegsuolck in einer besatzung gemeinlich vnd etlich sonderlich wol haben biß zur rettung oder abzug gehalten/ soll der Herr in gnaden erkennen es mit Prouiant oder gelt auch sie des am anfang doch nur ein wenig vertrösten.
  cs: |-
    Poněvadž pak každému pánu, který z nutnosti chce nebo musí obsadit posádkou město, městečko či zámek, svrchovaně záleží na rozumných a zkušených válečnících {Kriegsleutten}, nemá pán dovnitř ustanovit žádného nejvyššího hejtmana nad městečkem, žádného plukovníka {Obersten} nad knechty, žádného zbrojmistra {Zeugmeister}, stavitele ani jiné velitele {Beuelchsleut}, ledaže by už dříve byli v posádkách obléháni; jinak každý neznalý v těchto věcech radí a rozumuje jako slepý o barvách. A každý pán potřebuje v posádce zrovna tak jako v poli schopné, zkušené, rozumné a srdnaté velitele i ostatní válečníky; a zachová-li se válečný lid v posádce společně a někteří obzvláště dobře až do vyproštění nebo odchodu nepřátel, má to pán milostivě odměnit proviantem nebo penězi a hned na počátku jim na to dát alespoň malou naději.
poznamky:
- n: 1
  text: |-
    V tisku tisková chyba „Obensten“ místo „Obersten“. Odkaz míří k článkům nejvyššího polního hejtmana v úvodní části Druhé knihy (v tomto tisku bez průběžného číslování).
