bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    October zufeld leit / so müssen die Wachtmeister vmb mitnacht abwechseln vnd vier außtheilung auß tag vnd nacht machen / dan in angeregten Monaten die nächt zu lang vnd zukalt werden / vnd möchtens Leut vnd Roß nit gedulden.
  cs: |-
    říjnu v poli, musejí vachmistři {Wachtmeister} střídat o půlnoci a rozdělit den a noc na čtyři díly, neboť ve zmíněných měsících bývají noci příliš dlouhé a studené a lidé ani koně by to nevydrželi.
- typ: odstavec
  de: |-
    Die Wachtmeister sollen allemal wan sie die Wächter anfůrn / ermanen / daß sie gůt sorg haben / nicht schlaffen / auch von den Pferden nit absitzen / vnd wann sie der feinde innen werden / oder sie doch bedüncket von nöten / sollen sie solches dem Obersten Feldhauptman anzeigen / es jagten sie dann die Feinde mit gewalt ins Leger / so möchten sie Lermen schreien / sonst sollen weder wächter oder andere / on treffelich vrsachen ausserhalb wissen vnd beuelch des Obersten leichlich kein lermen machen.
  cs: |-
    Vachmistři mají pokaždé, když přivádějí strážné, napomínat je, aby dávali dobrý pozor, nespali a nesesedali z koní; a když zpozorují nepřátele nebo se jim to zdá potřebné, mají to oznámit nejvyššímu polnímu hejtmanovi {Obersten Feldhauptman}. Jedině kdyby je nepřátelé mocí hnali do ležení {Leger}, tehdy mohou volat na poplach {Lermen}; jinak nemají ani strážní, ani jiní bez závažných příčin a bez vědomí a rozkazu plukovníka {Obersten} lehkomyslně vyvolávat poplach.
- typ: odstavec
  de: |-
    Wann mann ein Stat belegert darinnen vil Reuter liegen / oder nahe bei den Feinden leit / so sollen die Wachtmeister die Schiltwacht nicht an fůren / sonder sie bei einander halten lassen / biß es also tunckel wirdt / daß sie dieselbigen in der Besatzung oder im leger nicht sehen mögen / sonst liegen sie nider / sonderlich sein die Türcken die wächter / wann sie die bei tag sehen künden / wie sie die nacht halten sollen / dieselben zufahen geschickt.
  cs: |-
    Obléhá-li se město, v němž leží mnoho jezdců {Reuter}, nebo leží-li vojsko blízko nepřátel, nemají vachmistři rozvádět stálou stráž {Schiltwacht} [za dne], nýbrž mají ji nechat stát pohromadě, dokud se nesetmí natolik, aby je nepřátelé v posádce {Besatzung} nebo v ležení nemohli vidět; jinak je přepadnou. Zvláště Turci {Türcken} jsou obratní v tom, že když za dne vidí, kde mají strážní v noci stát, dokážou je pak pochytat.
- typ: odstavec
  de: |-
    Die wachtmeister sollen niemant mit wachen vbersehen / die nicht wacht frei seind / sonder ein jeglicher Hauptman seine Reutter gar wachen lassen / außgenommen wann die gantzen Geschwader wachen müssen / alßdan sein die Fendrich wachtfrei / angesehen / es soll kein Fendrich vnbesetzt seines Fanen auß dem Leger / so soll auch sein person bei dem Fanen bleiben.
  cs: |-
    Vachmistři nemají nikoho osvobozovat od stráže, kdo není od stráže osvobozen, nýbrž každý hejtman {Hauptman} má nechat držet stráž všechny své jezdce – kromě případu, kdy musejí držet stráž celé švadrony {Geschwader}; tehdy jsou praporečníci {Fendrich} od stráže osvobozeni, vzhledem k tomu, že žádný praporečník nesmí z ležení odejít, aniž by zanechal stráž u své korouhve {Fanen}, a rovněž jeho osoba má u korouhve zůstávat.
- typ: odstavec
  de: |-
    Des Obersten Feldhauptmans leutenant / des Feldmarschalck gesinde / was zů jren personen vnd sattel gehört / sampt dem vnder Marschalck vnd Quartiermeister / sein wacht frei.
  cs: |-
    Poručík {leutenant} nejvyššího polního hejtmana, čeleď polního maršálka {Feldmarschalck}, která náleží k jeho osobě a sedlu, spolu s podmaršálkem {vnder Marschalck} a kvartýrmistrem {Quartiermeister} jsou od stráže osvobozeni.
- typ: odstavec
  de: |-
    Die wachtmeister sollen / wann mann nahe bei den Feinden leit / die wacht in der nacht offt bereiten / damit nicht etwan ein beschwerlicher vberfall durch ein heilosen wächter geschehe.
  cs: |-
    Když se leží blízko nepřátel, mají vachmistři v noci stráže často objíždět, aby kvůli nějakému nedbalému strážnému nedošlo ke zlému přepadu.
- typ: odstavec
  de: |-
    Wann ein groß volck zu feld ligt / hat mann gemeinlich Oberst wachtmeister / so die wachten offt bereiten / damit wol vnd recht gewacht werde / wann aber ein klein volck im feld ist / erspart mann dem Herrn den kosten billich.
  cs: |-
    Leží-li v poli velké vojsko, mívá se obvykle nejvyšší vachmistr {Oberst wachtmeister}, který stráže často objíždí, aby se strážilo dobře a řádně; je-li však v poli malé vojsko, ušetří se pánovi tento náklad po právu.
- typ: odstavec
  de: |-
    Wann auch die wachtmeister einem Hauptman der zu wachen schuldig were / ansagten / vnd derselbig nicht wachen wolte / alßdan sollen sie sprechen / Wir sagen dir an / daß du zu der stunde auff dem platz deine Reuter habest / so wollen wir sie auffůren / finden wir sie aber nicht / so wirst du vns morgen vor dem Obersten
  cs: |-
    Když také vachmistři ohlásí stráž hejtmanovi, jenž je povinen držet stráž, a ten by strážit nechtěl, tehdy mají říci: „Oznamujeme ti, abys v tuto hodinu měl své jezdce na místě, abychom je rozvedli; nenajdeme-li je však, budeš se nám zítra před nejvyšším
