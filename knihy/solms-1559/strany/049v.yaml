  popis: |-
    Celostránkový dřevořez v obloukovém rámu s rozvilinami v horních cípech, signovaný dole monogramem HD a letopočtem 1545: vousatý jezdecký velitel (plukovník nade vší jízdou) z profilu, v renesančním oděvu s nabíranými rukávy, v plochém klobouku ověnčeném listím a s dlouhým perem. Před hrudí svírá krátkou velitelskou hůl, u boku mu visí dlouhý meč v pochvě, na botě má ostruhu s hvězdicí. Sedí na mohutném koni kráčejícím doprava, s uzdou, náprsním řemenem a podocasníkem. V pozadí za nohama koně krajina s kostelem či hradem, stromy a kopci, nad jezdcem mohutná oblaka.
