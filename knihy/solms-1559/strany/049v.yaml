  popis: |-
    Celostránkový dřevořez v klenutém rámu s rozvilinami v rozích, signovaný dole monogramem HD 1545: vousatý jezdecký velitel (nejvyšší velitel jízdy) v renesančním oděvu s rozparky, v klobouku ovinutém věncem z listí a s dlouhým perem, s poboční zbraní u pasu a ostruhou na botě, sedí na zdobeně vystrojeném koni kráčejícím doprava a oběma rukama se opírá o velitelskou hůl. V pozadí pod břichem koně krajina s kostelem či hradem, stromy a kopci, nad hlavou jezdce mohutná oblaka.
