bloky:
- typ: odstavec
  de: |-
    DIser Büchsenzog ist doppel zu einer gar schweren Last gemacht/ daß mann auff beiden seitten mit zweien Welbaumen heben můß/ vnnd die Seil auff zwen Welbawmen gehen/ so mussen die Seil auch auff zwo seitten ein gezogen sein.
  cs: |-
    Tento dělový kladkostroj {Büchsenzog} jest zhotoven jako dvojitý pro zvlášť těžké břemeno, takže se musí zvedat po obou stranách dvěma hřídelemi {Welbaumen}, a lana jdou na oba hřídele, proto musejí být lana navlečena také na dvě strany.
- typ: odstavec
  de: |-
    Das einig Bein das auff der Seitten allein stehet/ ist das dritte Bein wann mann mit einem Welbaum zeugt/ das setzt mann dañ zu den zweien bein/ wann der ein Welbaum mit den zweien bein ab gethan wirt in dieselbig stat/ so hat der zog dañ drei bein/ also ist diser doppelzog zu zweien theil gerecht gemacht/ vnnd ist auß disem doppelnzog zwen zög zu einem Welbaum zu machen.
  cs: |-
    Ona jediná noha, která stojí stranou sama, jest třetí nohou pro případ, kdy se táhne jen jedním hřídelem {Welbaum}: tehdy se tato noha přisadí ke dvěma nohám na místo druhého hřídele s jeho dvěma nohami, jakmile se odejme, takže má kladkostroj {zog} potom tři nohy. Takto jest tento dvojitý kladkostroj {doppelzog} uzpůsoben pro dvě části a lze z tohoto dvojitého kladkostroje sestavit dva kladkostroje {zög} s jedním hřídelem.
- typ: odstavec
  de: |-
    Vnd dieweil an disen zweien Figurn die Welbaum zu hoch gelegt sind/ sol mann die Zög machen das die Welbaum niderer ligen/ wie mann sie machen kan/ dann wo sie niderger ligen so mann schwerer mit hepte/ dann an dise Welbaum gehörn nit creutz Hespel/ wie man die pflegt zu machen/ sonder Stangen die sind lang da kan ein man so schwer heben als zwen an eim Haspel/ dann die Hespel haben kurtz Arm/ vnnd was kurtz ist das hept nicht schwer/ so künden die Arm an eim Haspel nit lang sein dann sind sie lang so langen sie inwendig wider die Büchsen/ vnd künden nit vmbgehen/ aber die stangen gehn außwendig hindern nichts an der Büchsen vnnd so die lenger sind/ so mañ schwerer darmit hept.
  cs: |-
    A poněvadž jsou na těchto dvou figurách hřídele {Welbaum} položeny příliš vysoko, mají se kladkostroje {Zög} dělat tak, aby hřídele ležely níže, jak jen to lze sestrojit; neboť čím níže leží, tím těžší břemeno se s nimi zvedne. Na tyto hřídele totiž nepatří křížové kliky {Hespel}, jak se obyčejně dělají, nýbrž dlouhé sochory – jimi dokáže jeden muž zvednout tolik jako dva u kliky, neboť kliky mají krátká ramena, a co jest krátké, nezvedne velkou tíhu. Ramena na klice přitom nemohou být dlouhá, protože jsou-li dlouhá, narážejí zevnitř do hlavně děla a nemohou se otočit; naproti tomu sochory se nasazují zvenčí, ničemu u děla nepřekážejí, a čím jsou delší, tím těžší břemeno se jimi zvedne.
