bloky:
- typ: odstavec
  de: |-
    DIser Büchsenzog ist doppel zu einer gar schweren Last gemacht/ daß mann auff beiden seitten mit zweien Welbaumen heben můß/ vnnd die Seil auff zwen Welbawmen gehen/ so mussen die Seil auch auff zwo seitten ein gezogen sein.
  cs: |-
    Tento dělový kladkostroj {Büchsenzog} je zhotoven jako dvojitý pro zvlášť těžké břemeno, takže se musí zvedat na obou stranách dvěma hřídeli {Welbaumen}; a protože lana jdou na dva hřídele, musejí být lana navlečena také na obě strany.
- typ: odstavec
  de: |-
    Das einig Bein das auff der Seitten allein stehet/ ist das dritte Bein wann mann mit einem Welbaum zeugt/ das setzt mann dann zu den zweien bein/ wann der ein Welbaum mit den zweien bein ab gethan wirt in dieselbig stat/ so hat der zog dann drei bein/ also ist diser doppelzog zu zweien theil gerecht gemacht/ vnnd ist auß disem doppelnzog zwen zög zu einem Welbaum zu machen.
  cs: |-
    Samostatná noha, která stojí stranou, je třetí nohou pro případ, že se táhne jen jedním hřídelem: když se jeden hřídel i s oběma svými nohami odejme, přisadí se tato noha na jeho místo k oběma zbylým nohám a kladkostroj {zog} má pak tři nohy. Tento dvojitý kladkostroj {doppelzog} je tedy uzpůsoben k rozdělení na dvě části a lze z něj udělat dva kladkostroje s jedním hřídelem.
- typ: odstavec
  de: |-
    Vnd dieweil an disen zweien Figurn die Welbaum zu hoch gelegt sind/ sol mann die Zög machen das die Welbaum niderer ligen/ wie mann sie machen kan/ dann wo sie niderger ligen so mann schwerer mit hepte/ dann an dise Welbaum gehörn nit creutz Hespel/ wie man die pflegt zu machen/ sonder Stangen die sind lang da kan ein man so schwer heben als zwen an eim Haspel/ dann die Hespel haben kurtz Arm/ vnnd was kurtz ist das hept nicht schwer/ so künden die Arm an eim Haspel nit lang sein dann sind sie lang so langen sie inwendig wider die Büchsen/ vnd künden nit vmbgehen/ aber die stangen gehn außwendig hindern nichts an der Büchsen vnnd so die lenger sind/ so mann schwerer darmit hept.
  cs: |-
    Protože jsou na těchto dvou figurách hřídele položeny příliš vysoko, mají se kladkostroje dělat tak, aby hřídele ležely níže, jak jen to jde; čím níže totiž leží, tím těžší břemeno se jimi zvedne. Na tyto hřídele navíc nepatří křížové kliky {Hespel}, jak se obvykle dělají, nýbrž dlouhé sochory (*Stangen*): jimi zvedne jeden muž tolik jako dva na klice. Kliky mají totiž krátká ramena, a co je krátké, nezvedne velkou tíhu. Ramena kliky však nemohou být dlouhá, protože dlouhá by uvnitř narážela do děla a nemohla by se otáčet; sochory se naproti tomu nasazují zvenčí, dělu nijak nepřekážejí, a čím jsou delší, tím těžší břemeno se jimi zvedne.
