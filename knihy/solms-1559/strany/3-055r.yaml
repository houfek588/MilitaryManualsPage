id: 3-055r
list: '55'
strana: recto
sken: 361
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vnd dreizehent halb pfundt Koln / drei pfundt Spangrön / vnd ein vierdtteil eins pfunds Salarmoniac / wenn mann eins mals mehr Puluers will machen / denn vor geschriben steht / souil muß mann auch der vorgenanten Species jeglichs nach seinem rechten gewicht mehr nemen.
  cs: |-
    dvanáct a půl libry {pfundt}[^1] dřevěného uhlí {Koln}, tři libry měděnky (*Spangrön*) a čtvrtinu jedné libry salmiaku (*Salarmoniac*); chce-li se najednou vyrobit více střelného prachu {Puluers}, než je psáno výše, o tolik více se musí vzít i každé ze jmenovaných přísad podle její správné váhy.
- typ: nadpis
  uroven: 3
  de: Wie mann ein stercker vnnd besser Puluer machen soll / stehet hernach geschriben / vnnd ist ein Zündtpuluer.
  cs: Jak se má dělat silnější a lepší prach, stojí psáno níže, a je to zápalný prach {Zündtpuluer}
- typ: odstavec
  de: |-
    DV solt nemen des Salpeters der mit gůtem gebrantem Wein vnd Quecksilber gesterckt ist / als in disem Bůch daruon geschriben steht / wie mann den schwefel bereiten soll das er hitzig vnd stercker werd / nim denn desselben Salpeters der dick gereingt vnnd geleutert ist / reib die beide stück jeglichs besonder fast wol vnnd klein auff einem Reibstein / vnd je kleiner geriben wirt je besser er ist / nim denn des Koln / der auß einem verschliffnem Tischtůch / vnd in einem verdeckten Hafen gebrennet ist / Dise Species misch nach gewicht vntereinander / wie denn offt geschriben stehet / thů darunter ein wenig Kampffer vnd nicht zuuil / nim denn des besten gebranten weins so du jn gehaben magst / begeuß das Puluer damit / das es feucht vnd ein wenig naß werde / rür es ein gůte weil vndereinander / vnd laß wol darnach ertrucken / so hastu gar ein gůt Puluer.
  cs: |-
    Máš vzít ledek {Salpeters} posílený dobrým páleným vínem a rtutí, jak je v této knize psáno tam, kde se učí, jak připravit síru {schwefel}, aby byla žhavá a silnější. Vezmi tedy téhož ledku, mnohokrát vyčištěného a přečištěného, a obě přísady rozetři každou zvlášť velmi důkladně a najemno na třecím kameni – čím jemněji se rozetřou, tím lépe. Potom vezmi uhlí, které bylo vypáleno ze starého obnošeného ubrusu v zakrytém hrnci. Tyto přísady smíchej podle váhy, jak již bylo často psáno, a přidej trochu kafru, ne však příliš. Pak vezmi nejlepší pálené víno, jaké můžeš sehnat, polej jím prach, aby zvlhl a byl trochu mokrý, dobrou chvíli jej promíchávej a potom nech dobře uschnout – tak budeš mít velmi dobrý prach.
- typ: nadpis
  uroven: 3
  de: Wie mann ein gut starck Büchsen Puluer machen soll / etc.
  cs: Jak se má dělat dobrý silný střelný prach {Büchsen Puluer} atd.
- typ: odstavec
  de: |-
    WIltu gůt Büchsen Puluer machen / das noch stercker vnd besser ist vnd wirt dann das vorig / so soltu darzů nemen / als in disem vordern Capitel geschriben steht / Hört darzů vnd darunter zunemen ein gůt weiß Puluer / das soltu also machen / nim des gebranten Campfers der ein theil weiß ist / vnd gebranten Salarmoniac / der auch ist weiß / vnd leucht als der Puluerstein / den die Schwertfeger haben / nime des ein achttheil / thů der zweier species von Mercurio sublimato darzů / vnd zusamen in einen Mörser / stoß fast als du magst vnd das ein Puluer darauß werd / wisse das es weiß wirt / Vnd das ist die beste lere die mann in der gantzen Alchimei finden mag / vnd thů gar wenig des weissen puluers in das Puluer / das gemacht ist von Salpeter / Schwefel vnd Koln / ein acht theil eins lots / ist gnug in 1. pfundt des genants Puluers.
  cs: |-
    Chceš-li dělat dobrý střelný prach, který je a bude ještě silnější a lepší než předešlý, máš vzít to, co je psáno v předchozí kapitole, a k tomu přidat a přimíchat dobrý bílý prach. Ten se dělá takto: vezmi páleného kafru, jehož jeden díl je bílý, a páleného salmiaku, který je rovněž bílý a leskne se jako lešticí kámen (*Puluerstein*),[^2] jaký mají mečíři. Vezmi toho jednu osminu, přidej k těm dvěma přísadám sublimovanou rtuť (*Mercurio sublimato*),[^3] dej vše do hmoždíře a tluč, co jen můžeš, aby z toho vznikl prach – věz, že bude bílý. A to je nejlepší naučení, jaké lze v celé alchymii nalézt. Tohoto bílého prachu pak přidej jen docela málo do prachu z ledku, síry a uhlí: osmina lotu {lots} stačí na 1 libru takového prachu.
poznamky:
- n: 1
  text: |-
    Něm. *dreizehenthalb* = dvanáct a půl (dosl. „třinácté napůl“).
- n: 2
  text: |-
    *Puluerstein* – patrně *Polierstein*, jemný lešticí kámen, jímž mečíři leštili čepele; v obdobném receptu na l. 58v stojí *braunstein*.
- n: 3
  text: |-
    *thů der zweier species von Mercurio sublimato darzů* – znění je nejasné; lze je chápat i jako „přidej sublimované rtuti [tolik co] obou přísad“.
