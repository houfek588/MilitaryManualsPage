- typ: odstavec
  de: |-
    Lieber alter Vatter auff ewren getrewen rath vnd bedencken / bin ich wider zu meinem Herren gezogen / vnd einer gelegner stund erwartet / so hat es sich zu getragen / daß mein Herr vnder essens vber der Tafeln ist von solcher sachen zu reden worden / von etlichen Personen die in kurtzer zeit sich wol in die sachen vnd händel geschickt / daß sie hoch herfür komen / vnd in kleiner zeit schlecht gesellen waren / vnd nun mehr in Kriegßsachen vil geschickt vnd gebraucht werden / Da hab ich auff gemerckt / vnd bei mir bedacht / das wirt sich zu meiner handlung wol schicken / vnd hab mich auff ewren getrewen rath zu einer gelegene stundt / da ich bei meinem Herren zeit vnd platz hatt / einer solchen rede / so er vber der Tafeln gethan / erinnert / vnd gebetten / daß er mich auch bedencken wölle / vnnd mir verhelffen daß ich auch an sollichen orten mit zůkom / vnd bei einem ehrlichen Herren platz erlang / damit ich Ewer Gnaden hinfürter nützlicher vnd statlicher dienen möcht / mit andern weitter bitten vnd erbieten / wie jhr mich das vnderricht vnd gelernet habt / Darauff Jr Gnad mir gnediglich geantwort / Er sehe vnd sei war / daß er mich biß noch der zeit erzogen hab / vnd mir mit Jren Gnaden geneigt sei / wo er mir weitter rathen / fürdern vnd helffen künde / das wöl er gern thůn / ich soll bedencken an was Herren standts odder Ampts Person ich begeren vnnd gefürdert gern sein wöl / so wöl er mich gegen derselbigen dergestalt verschreiben / daß ich befinden solt / daß er es getrewlich mit mir gemeint / vnd wöl mich auch mit helffen anrösten / daß ich vor mein standt bestehn mag wo ich hin komme / Das hab ich gegen jren Gnaden mich zum höchsten bedanckt mit erbietens / daß ich das meines vermögens wider gedenck zuuerdienen / daß ich (Gott hab lob) ein gůt zeit vnd stundt droffen hab / bedancke mich ewers gůten getrewen raths / dann es ist mir zu einem anfang (Gott hab lob) wol gerathen.
  cs: |-
    Milý starý otče, na vaši věrnou radu a uvážení jsem se vrátil ke svému pánovi a vyčkal příhodné chvíle. Stalo se pak, že můj pán začal při jídle u tabule mluvit o takových věcech – o některých osobách, které se v krátké době dobře zapracovaly do věcí a záležitostí, takže se vysoko vyšvihly, ačkoli ještě nedávno byly prostými chlapíky, a nyní je ve válečných věcech hojně posílají a užívají. Toho jsem si všiml a pomyslel si, že se mi to k mému záměru dobře hodí. Na vaši věrnou radu jsem mu pak ve vhodnou chvíli, kdy jsem měl u pána čas a příležitost, tu řeč od tabule připomněl a poprosil ho, aby i na mne pamatoval a dopomohl mi, abych se také dostal na taková místa a získal místo u nějakého čestného pána, abych tak mohl Vaší Milosti napříště užitečněji a lépe sloužit. K tomu jsem připojil další prosby a nabídky, jak jste mne poučil a naučil. Jeho Milost mi na to milostivě odpověděla: vidí prý a je pravda, že mne až dosud vychovával a je mi svou milostí nakloněn; v čem by mi mohl dále poradit, podpořit mne a pomoci, to že rád učiní. Mám si prý rozmyslet, ke které osobě panského stavu či k jakému úředníkovi si přeji a chci být doporučen, a on mne k ní doporučí listem tak, abych poznal, že to se mnou myslí věrně; také mi pomůže se vystrojit,[^1] abych obstál podle svého stavu, kamkoli přijdu. Za to jsem Jeho Milosti co nejuctivěji poděkoval a nabídl se, že se mu za to podle svých sil budu snažit odvděčit. Trefil jsem tedy (Bůh buď pochválen) dobrou chvíli a děkuji vám za vaši dobrou a věrnou radu, neboť pro začátek se mi to (Bůh buď pochválen) dobře podařilo.
- typ: odstavec
  de: |-
    Dieweil dann die sachen dahin gerathen seind / vnnd nun mehr an mir steht / als nemlich meinem gnedigen Herren anzuzeigen an wen ich die fürderung haben wöl / So ist nun mehr weitter an euch mein trewliches vnnd fleissiges bitten / jhr wöllet nun mir weitter gerathen sein / an was Herren oder Ampts personen ich das begeren soll / dann jhr verstehet alle Ampter vnnd Regirungen / vnnd ich des kein wissens noch verstandt habe / dieweil ich zuuor nicht mehr darbei gewesen sein / vnnd auch deren thůn noch Regirungen keine weiß.
  cs: |-
    Protože se tedy věci takto vyvinuly a nyní záleží na mně, abych svému milostivému pánovi oznámil, ke komu si přeji doporučení, obracím se dále na vás s věrnou a snažnou prosbou, abyste mi i nadále radil, o kterého pána či úředníka mám žádat. Vy totiž rozumíte všem úřadům a správám, kdežto já o tom nemám žádnou vědomost ani ponětí, protože jsem při tom dosud nikdy nebyl[^2] a neznám ani jejich činnost, ani správu.
- typ: nadpis
  uroven: 3
  de: Alter Vatter.
  cs: Starý otec.
poznamky:
- n: 1
  text: V tisku *anrösten* za *anrüsten* („vystrojit, vyzbrojit“).
- n: 2
  text: V tisku tvar *sein* za *bin* („jsem“).
