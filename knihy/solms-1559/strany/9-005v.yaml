id: 9-005v
list: 5 (9. kniha)
strana: verso
sken: 630
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Alle gefangen so inn das Leger gebracht/ sollen dem Marschalck vberantwort werden/ so sie anderst reich seind/ daß man gelt von jnen schetzen kündt/ darmit er den spruch darinn thů/ vnd gebürt jm der x. pfenning daruon. Soll auch acht darauff geben daß das Leger eben so wol mit Teller/ Trinckgeschirr sei versehen als mit ander dingen. Auch soll er besuchen vnd besichtigen alle prouiant/ auch die Person so sie zu fürn vnd verwarn/ es seien Hauptleut/ Kriegßleut oder ander Volck/ nemlich Bürger inn Stätten/ Kaufleut oder andern wes stands sie seien/ dann solchs eim Marschalck in beisein des Obersten Veldhauptmans zuuersehen zůsteht. Der bemelt Marschalck mit sampt dem Quartirmeister sollen in allen anschlägen vnd berathschlagungen sein/ vnd der Quartirmeister gůter zeit bericht werden/ wo man sich hinlegen wöl. So einer vom Adel hoch oder niderst stands etwas in Kriegßhandlungen vbergeht/ hat der Marschalck denselbigen/ es sei dann daß er seins Fürsten eltester Son sei zustraffen/ nach gelegenheit der mißhandlung so der oberst Veldhauptman nit da ist.
  cs: |-
    Všichni zajatci přivedení do ležení {Leger} mají být vydáni polnímu maršálkovi {Marschalck}. Jsou-li ovšem bohatí, takže by od nich bylo možno vymoci peníze, má o nich vynést výrok a náleží mu z toho desátý fenik {pfenning}.[^1] Má také dbát, aby ležení bylo stejně dobře zásobeno talíři a nádobami na pití jako jinými věcmi. Dále má navštěvovat a prohlížet všechen proviant {prouiant} i osoby, které jej vozí a opatrují, ať jsou to hejtmani, válečníci {Kriegßleut} nebo jiný lid, totiž měšťané z měst, kupci či jiní, jakéhokoli stavu; to totiž přísluší maršálkovi obstarávat za přítomnosti nejvyššího polního hejtmana {Obersten Veldhauptmans}. Řečený maršálek spolu s kvartýrmistrem {Quartirmeister} mají být při všech plánech a poradách a kvartýrmistr má být včas zpraven, kde se [vojsko] má utábořit. Dopustí-li se šlechtic vysokého či nejnižšího stavu nějakého přestupku ve válečných věcech, má ho maršálek potrestat podle povahy provinění, není-li nejvyšší polní hejtman přítomen – leda by to byl nejstarší syn jeho knížete.
- typ: odstavec
  de: |-
    Es ist auch von nöten daß jr einen gůten Quartirmeister habt/ der geschickt vnd vernünfftig ist/ dann er die drit person im Veld sein soll so der Oberst nit vorhanden/ nemlich der Fürst die erst/ der Marschalck die ander/ vnd er die drit/ vnnd bemelter Quartirmeister dem Marschalck vnderworffen sein/ vnd thůn was er jm beuilcht.
  cs: |-
    Je také třeba, abyste měl dobrého kvartýrmistra, který je zkušený a rozumný. Není-li totiž přítomen vrchní velitel {Oberst}, má být třetí osobou v poli: první je kníže, druhý maršálek a on třetí. Řečený kvartýrmistr má být maršálkovi podřízen a činit, co mu přikáže.
- typ: odstavec
  de: |-
    Es gehört auch einem jeden Quartirmeister zů/ daß er nach dem er die Quartir außgetheilt/ alle gelegenheit des Velds mit sampt den kundtschafften besichtige/ damit er nach der zal des Volcks dieselbigen außtheilen künde/ welche zal der Rotten jm die Musterschreiber anzeigen künden. Item was jm von den kundtschafften angezeigt wirt/ soll er den Marschalck berichten/ daß ers den Fürsten oder seim Leutenant so es von nöten anzeige. Der quartirmeister soll allen tag ein mal das Leger besichtigen/ vnd was von nöten darinn zumachen dem Marschalck anzeigen/ vnd nichts on sein wissen handeln. Er soll auch wissen alle brücken/ päß vnd weg dardurch der hauff ziehen muß/ vnd das dem Fürsten oder seim leutenant berichten/ er sol auch vil kundtschafften mit wissen des Fürsten vor andern haben. Der Prouoß des quartirmeisters sol alweg dem Marschalck vnderworffen sein/ sol sich fleissen zuerfarn alles das im Heer geschicht/ es sei gůt oder böß/ waran etwas gelegen sol er dem Marschalck kundt thůn/ wies dann die not erfortert solchs zu volbringen/ sol er all stundt es sei tag oder nacht zum marschalck gehn/ soll allweg für gelassen werden. Der benant Prouoß soll selbst hand anlegen wo es von nöten sein wirt/ was anderst zun gerichts hendeln gehört/ jedoch keinen nit verurtheilen noch straffen on vorwissen des Marschalcks.
  cs: |-
    Každému kvartýrmistrovi také přísluší, aby poté, co rozdělí kvartýry {Quartir}, spolu se zvědy prohlédl celé položení terénu, aby mohl kvartýry rozdělit podle počtu lidu; počet rot {Rotten} mu mohou sdělit přehlídkoví písaři {Musterschreiber}. Dále: co mu zvědové oznámí, má hlásit maršálkovi, aby to maršálek v případě potřeby oznámil knížeti nebo jeho poručíkovi {Leutenant}. Kvartýrmistr má každý den jednou prohlédnout ležení, a co je v něm třeba udělat, oznámit maršálkovi; bez jeho vědomí nemá nic podnikat. Má také znát všechny mosty, průsmyky {päß} a cesty, kudy musí houf {hauff} táhnout, a hlásit to knížeti nebo jeho poručíkovi; s vědomím knížete má mít také více zvědů než jiní. Kvartýrmistrův profous {Prouoß} má být vždy podřízen maršálkovi. Má se snažit zjistit vše, co se ve vojsku děje, ať dobré, či zlé, a co je důležité, oznámit maršálkovi. Vyžaduje-li to potřeba, smí jít k maršálkovi v kteroukoli hodinu, ve dne i v noci, a má být vždy vpuštěn. Řečený profous má sám zakročit, kde bude třeba, ve všem, co patří k soudním věcem; nikoho však nesmí odsoudit ani potrestat bez maršálkova vědomí.
poznamky:
- n: 1
  text: |-
    *der x. pfenning* – desetina z výkupného (franc. *le dixième denier*). Maršálek jako soudce rozhodoval o výši výkupného, kterou lze ze zajatce „vymoci“ (*schetzen*).
