bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    so mögen auch allweg auß der beschribnen zimlichen stuck einem behender vnd fürderlicher zwen / dann auß der vbergrossen Büchsen einer / ein schoß beschehen / es kan sich auch nimermehr fählen / dieselben zwen schöß richten mehr oder zum wenigsten souil als der einig auß / so mann auch daneben erwigt / wie beschwerlich ein solch groß stück / so es abgeschoffen wirt widerumb geladen / vnd allenthalben zu recht gebracht / wieuil das auch mehr Leut bedarff / so wirt sich in gewisser Rechnung befinden / was grosser vnkosten / zu sampt der gefahr beschedigung der armen Leut / vnd anders vnrats / ehe ein sölliche Büchs widerumb in die schantz / vnd zu rechtem brauch gebracht / allenthalben erspart / verhüt vnd fürkommen werden mag.
  cs: |-
    a navíc lze z jednoho z popsaných přiměřených kusů {stuck} vystřelit dvakrát obratněji a rychleji než jednou z jednoho přerostlého děla {Büchsen}. Nikdy přitom nemůže selhat, že by tyto dvě rány nezpůsobily víc, anebo aspoň tolik jako ta jediná. Uváží-li se vedle toho, jak obtížně se tak veliký kus po výstřelu znovu nabíjí a všestranně uvádí do pořádku a o kolik víc lidí to vyžaduje, ukáže se při přesném propočtu, jak veliké náklady – spolu s nebezpečím zranění ubohých lidí i s jinými škodami, než se takové dělo znovu dostane do šance {schantz} a k řádnému použití – lze všestranně ušetřit, odvrátit a předejít jim.
- typ: odstavec
  de: |-
    Gleich wol bereden vnderweilen die Büchsengiesser / jhren nutz bedencken / einn Herrn solche grosse stück fast nütz sein / nemblich den feinden / vnd Bolwercken grossen schaden damit zuzůfügen / zu dem das sie ein Fürstlich Zeughauß wol schmücken vnnd zieren / anzeigend / sie schiessen auch das in schönem lüstigem wetter / auff grönem platz ab / mit grossem Triumph vnd bracht / geht als fein lustig zu.
  cs: |-
    Přesto litci děl {Büchsengiesser}, hledíce vlastního prospěchu, občas pánovi namlouvají, že takové veliké kusy jsou velice užitečné, totiž že se jimi dá nepříteli a bolverkům {Bolwercken} způsobit velká škoda, a nadto, jak tvrdí, že pěkně zdobí a krášlí knížecí zbrojnici {Zeughauß}. Také z nich za pěkného, veselého počasí na zeleném trávníku střílejí s velikou slávou a nádherou – to pak jde všechno pěkně zvesela.
- typ: odstavec
  de: |-
    So aber ein Herr sein Kriegsuolck sampt dem geschütz / Berg vnd Tal bei gůtem vnd bösem tieffem vnd trucknem wetter füren soll vnd můß / hat er zubedencken / daß zu sölchen vbergrossen stücken / in argem weg acht / wo er stonst mit gleichem geschütz vier tag bedürfft / haben můß / daneben wie hoch sölch vberige zeit / auff ein gantz Kriegsuolck laufft zu dem den vnkosten der vberigen Roß / wagen vnd Leut / Item daß man die zeit vnd gelegenheit / darin dem feindt abzubrechen wer / vnderweilen versaumpt oder wie sich offt zutregt / daß ein Herr weichen / vnd in seinen vortheilt ziehen můß / als dann mögen dergleichen stück nit volgen offtermals / derhalben verlassen oder aber darob not gelitten / auch etwan dardurch ein volck geschlagen / vnd das feld verlorn wirt / Welchs aber alles durch dergleichen gattung obuermelt / verhüt / fürderlich vnd mit geringem vnkosten / von vnd zu den feinden gebracht / vnd eben das / ja mehr dann mit dem grossen geschütz / auch mit wenigerm kosten vnd gefahr außgericht werden mag.
  cs: |-
    Když však pán má a musí vést svůj válečný lid {Kriegsuolck} i s děly {geschütz} přes hory a údolí za dobrého i zlého, rozbředlého i suchého počasí, musí uvážit, že s takovými přerostlými kusy bude na špatné cestě potřebovat osm dní tam, kde by s přiměřenými děly jinak[^1] vystačil se čtyřmi. Dále, kolik takový čas navíc stojí, počítá-li se na celé vojsko, a k tomu náklady na koně, vozy a lidi navíc. Dále že se někdy promešká čas a příležitost, kdy by se dalo nepříteli uškodit; anebo, jak se často stává, musí pán ustoupit a stáhnout se do výhodného postavení, a tu takové kusy mnohdy nestačí, takže se musí zanechat, nebo se kvůli nim trpí nouze, ba někdy je kvůli tomu i vojsko poraženo a bitva ztracena. Tomu všemu lze předejít výše uvedenými druhy děl: dají se rychle a s malými náklady dopravit od nepřítele i k nepříteli a dá se jimi pořídit totéž, ba víc než velkými děly, a to s menšími náklady i nebezpečím.
- typ: odstavec
  de: |-
    Zugissung solcher anderer vnd dergleichen stück wirt genomen kopffer vnd zin / also das alweg die 9. theil kopffer vnd der 10 zin zu einer Büchsen vermengt vnd zusamen gegossen wirt / bedarff also das vorgemelt Geschütz an Kopffer 1980. vnd an zin 222. cent. 20. pfundt.
  cs: |-
    K odlévání takových a podobných kusů se bere měď a cín, a to tak, že se na jedno dělo vždy smísí a slijí dohromady 9 dílů mědi a desátý díl cínu. Výše uvedená děla tedy potřebují 1980 centů {cent.} mědi a 222 centů 20 liber {pfundt} cínu.[^2]
- typ: odstavec
  de: |-
    SO mag ein Herr solch geschütz auff zweierlei weg / welcher jhm dann am gelegsten vnd angenembsten ist / machen / erstlich giessen
  cs: |-
    Taková děla si pak pán může pořídit dvojím způsobem, podle toho, který je mu nejpříhodnější a nejmilejší. Za prvé je nechat slít
poznamky:
- n: 1
  text: |-
    V originále stojí tiskařská podoba *stonst* místo *sonst* („jinak“) a *vortheilt* místo *vortheil*.
- n: 2
  text: |-
    Z celkových 2222 centů dělostřeleckého kovu tvoří desetina cínu přesně 222,2 centu, tj. 222 centů a 20 liber; zbylých 9 dílů mědi by však činilo 1999,8 centu (uvedených *1980* centů vychází ze zaokrouhleného základu 2200 centů: 2200 × 0,9 = 1980).
