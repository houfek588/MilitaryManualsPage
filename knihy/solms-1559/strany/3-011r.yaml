bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    will daselbst sein lassen / vnd eilent also hinder den wagen einfallen vnden tieff einsencken / daß die Schantzer bedeckt stehn mögen / dann fort mit dem graben gefarn biß mann zu dem end kompt / vnd also nach einander eingestelt mit Rotten / wie das oben angezeigt ist / vnd die gerissenen Figurn auch anzeigen werden / Die Schantzen da die Büchsen in stehn / die sollen vor den Büchsen auffgeworffen sein biß einn gůten Schůch an die Büchsen / daß die mit den Rorn darüber gehn / vnd derselbig auffworff soll also bereit sein / daß die Körb darauff stehn mögen / es sei dann einfach oder zwifach / wann dann die Körb also in der höh stehn so deck sie wol / mann darff sie auch nicht hoch machen / wie die gerissenen Figurn alles anzeigen werden. Dabei soll der Schantzmeister fleissig sein / sein volck anweisen vnd ob jn sein / auch soll ein Schantzmeister mit grossem fleiß darauff sehn daß er gleich mit dem schantzen vmbgeh / Dann derselben schantzer hauptleut verleihen die schantzer ander leuten / verdienen gelt damit. Darauff soll ein Schantzmeister gůt acht haben / wann er daß erfert / sol ers dem Zeugmeister bei sein pflichten anzeigen / sol auch gůt acht haben daß die schantzer oder Quastitores mit der arbeit gleich gehalten werden / Des soll allweg auff 500. person ein Hauptman sein / dieselben 500. sollen getheilt werden in 5. theil das 20. in eim theil seind / dieselbigen 20. person sollen ein Rotmeister / dieselbigen Rotmeister sol der Schantzmeister beschrieben haben / vnd eins jeden Rotmeisters person auch mit namen / Also sol der Schantzmeister sein Register vnderschieden haben so kan er wissen was abgeht / wie er mit den Rotten arbeiten / abwechseln vnd vmbgehn sol lassen / zeitlich mustern vnd vmb fragen bei eim jeden Rotmeister / was für person abgangen seien / vnd was noch teglich erschossen vnd abgeht soll er einschreiben / dem Zeugmeister anzeigen damit er wissens hab was abgeht / seine sachen darnach zurichten / wider andern an die stat zustellen / vnd darnach zubezallen wisse. Es soll auch der Schantzmeister keinem ein schantzer verleihen ausserhalb des Zeugmeisters wissen vnd willen / beuilch aber der Zeugmeister das er eim Herrn etlich leihen soll / etwan ein halb oder gantze Rot mehr oder weniger / wie sich das zutregt sol ers nach den Rotten thůn / wan jnen etwas geschenckt wirt / soll er es jnen lassen / Wo es jm wider angesagt wirt mehr zuuerleihen / soll er andere Rotten nemen damit es vmbgeht / hat man aber sonst in der Arcolorei zu thůn / daß man der zuuerleihen nit haben möcht / soll ers dem Zeugmeister ansagen / der wirt dann keinem leihen. Der Schantzmeister ist auch die wagen so den schantzern zustehn / daruff sie jr rüstung haben / schuldig zuuerwarn / vnd dem Zeugmeister zuuerrechnen.
  cs: |-
    tam nechat vozy stát, rychle se za vozy zakopat a hluboko zahloubit, aby šancíři {Schantzer} mohli stát krytě, potom s výkopem postupovat kupředu až na konec a takto nastupovat za sebou po rotách {Rotten}, jak je vyloženo výše a jak ukážou i nakreslené obrazy. Šance {Schantzen}, v nichž stojí děla {Büchsen}, mají být před děly navršeny až asi na dobrou stopu {Schůch} pod děla, aby děla mířila hlavněmi {Rorn} přes násep, a ten má být zřízen tak, aby na něm mohly stát šancovní koše {Körb}, ať už v jedné nebo ve dvou řadách; když pak koše stojí takto nahoře, dobře kryjí[^1] a není ani třeba dělat je vysoké, jak to vše ukážou nakreslené obrazy. Přitom má být šancmistr {Schantzmeister} pilný, vést svůj lid a dohlížet na něj; také má šancmistr s velkou pečlivostí dbát na to, aby při kopání šancí postupoval spravedlivě, neboť hejtmani {hauptleut} těchto šancířů půjčují šancíře jiným lidem a vydělávají si tím peníze. Na to má dávat šancmistr dobrý pozor, a jakmile se o tom dozví, má to při svém závazku {pflichten} oznámit zbrojmistrovi {Zeugmeister}; má také dobře dbát na to, aby se šancíři čili kvastitory {Quastitores} bylo při práci nakládáno stejně. Proto má vždy na 500 osob být jeden hejtman a těchto 500 má být rozděleno na 5 dílů, tak aby v jednom dílu bylo 20 osob;[^2] těchto 20 osob má mít jednoho rotmistra {Rotmeister}. Tyto rotmistry má mít šancmistr zapsané, a stejně tak osoby každého rotmistra podle jména. Takto má mít šancmistr svůj rejstřík {Register} přehledně rozčleněn, aby věděl, kolik lidí ubývá a jak má roty střídat a nechávat pracovat na směny; má včas konat přehlídky {mustern} a vyptávat se u každého rotmistra, kolik osob ubylo, a co denně padne zastřeleno či jinak ubyde, má zapsat a hlásit zbrojmistrovi, aby věděl o úbytcích, podle toho se zařídil, doplnil místo nich jiné a věděl, jak podle toho vyplácet. Šancmistr také nesmí nikomu půjčit ani jediného šancíře bez vědomí a vůle zbrojmistra; poručí-li však zbrojmistr, aby nějakému pánovi několik mužů půjčil – třeba půl nebo celou rotu, více či méně –, má tak podle okolností učinit po celých rotách, a když jim někdo něco daruje, má jim to ponechat. Dostane-li pak znovu rozkaz půjčit další, má vzít jiné roty, aby se to střídalo; je-li však jinak práce u dělostřelectva {Arcolorei}, takže je nelze uvolnit k půjčení, má to oznámit zbrojmistrovi, který pak nepůjčí nikomu. Šancmistr je rovněž povinen opatrovat vozy náležející šancířům, na nichž vezou svou výzbroj {rüstung}, a skládat z nich účty zbrojmistrovi.
poznamky:
- n: 1
  text: |-
    V tisku „so deck sie wol“ (zkrácená či nesprávná shoda za *decken sie wol* – „tak dobře kryjí“).
- n: 2
  text: |-
    Početní nesrovnalost tisku: 500 osob rozdělených po 20 lidech dává 25 rot, nikoli 5 dílů (snad vypadla číslice před „5.“, anebo šlo o 5 oddílů po 100 mužích dělených dále po 20).
