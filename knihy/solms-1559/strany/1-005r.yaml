bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Teutschen alte Kriegs leut gewest seind/ vnd jr Römisch Reich biß noch erhalten/ auch jre Kriegßregirung nach der Römer Ordnung vor andern Nationen am besten/ vnd mit aller rüstung halten/ vnd jhre alte regirung ist so lang in gůtem gebrauch gewest/ vnnd nun mehr in vnordnung komen will.
  cs: |-
    Němci byli odedávna válečníky {Kriegs leut}, až dosud si udrželi svou Římskou říši {Römisch Reich} a také svou válečnou správu podle římského řádu zachovávají lépe než jiné národy a se vší výzbrojí {rüstung}. Jejich stará správa byla tak dlouho v dobrém užívání, a nyní hrozí upadnout v nepořádek.
- typ: odstavec
  de: |-
    Derhalben ich nit vnderlassen hab mögen/ die alte/ manlich vnd löblich Römisch Kriegßordnung wider zu beschreiben/ zu ehren den Teutschen/ vnd den Kriegen zum besten/ darmit die Teutschen wider zu der einigkeit sich richten/ vnd in gůter ehrlicher/ manlicher Kriegs regierung (wie die alten gewesen) bleiben möchten/ So weiß ich das niemants baß vnd lieber zu zůschreiben/ dann dem König von Engellandt/ als eim grossen Potentaten/ der nit wol on Krieg sein wirt/ vnd damit jhre Königliche Maiestat/ als ein junger Kriegßherr/ der Teutschen hergebracht Kriegs Regirung vnd Ampts versehung erkenne/ so ist nit zu zweifeln/ jhre Königlich Maiestat werde darauß vernemen werden/ das die Teutsch Kriegsregierung/ so die recht gehalten/ nützlich vnd gůt sein wirt.
  cs: |-
    Proto jsem nemohl opomenout znovu popsat starý, mužný a chvályhodný římský válečný řád ke cti Němců a k prospěchu válečnictví, aby se Němci opět obrátili ke svornosti a mohli setrvat v dobré, čestné a mužné válečné správě (jako bývali staří). A nevím, komu bych to mohl lépe a raději připsat než králi anglickému jakožto velikému mocnáři, který sotva bude bez války, aby i Jeho královské Veličenstvo jakožto mladý válečný pán {Kriegßherr} poznalo zděděnou německou válečnou správu a zastávání úřadů. Nelze totiž pochybovat, že Jeho královské Veličenstvo z toho vyrozumí, že německá válečná správa, je-li správně dodržována, bude užitečná a dobrá.
- typ: odstavec
  de: |-
    Vnd so jhre Königlich Maiestat Krieg mit den Teutschen füren/ vnd jhnen jhre solche Kriegßregierung zuhalten/ zufüren beuelhen/ vnd aufflegen wirdt/ daß sie das mit allem ernst vnd fleiß versehen werden/ vnd jhre Königlich Maiestat treulich vnd wol dienen.
  cs: |-
    A povede-li Jeho královské Veličenstvo válku s Němci a přikáže jim i uloží zachovávat a vést takovou jejich válečnou správu, pak ji budou vykonávat s veškerou vážností a pílí a budou Jeho královskému Veličenstvu věrně a dobře sloužit.
- typ: odstavec
  de: |-
    Dann zusehen ist/ das die Teutschen bei den Keisern sich manlich gehalten/ vnnd die Keiser sie jnen haben lassen gefallen/ so seind die Keiser biß noch bei den Teutschen blieben vnd gewont/ auch die Teutschen den Keiser vnd das Reich in jhren henden behalten/ als noch die wal bei den Teutschen stehet/ den Keiser nach jhrem gefallen zu wehlen/ vnd das Reich in Teutscher handt (Gott lob) noch steht/ Gott verleihe gnad das sie darnach regieren/ das sie es behalten mögen.
  cs: |-
    Je totiž vidět, že Němci se u císařů chovali mužně a císařové v nich měli zalíbení; proto císařové dosud zůstávali a sídlili u Němců a Němci také udrželi císaře i říši ve svých rukou: volba císaře podle jejich vůle dosud náleží Němcům a říše je (chvála Bohu) stále v německých rukou. Bůh jim dej milost, aby podle toho vládli a mohli si ji udržet.
- typ: nadpis
  uroven: 2
  de: Der Teutschen Kriegsrüstung zu Roß vnd fůß.
  cs: |-
    Německá válečná výzbroj {Kriegsrüstung} jízdy i pěchoty.
- typ: odstavec
  de: |-
    DIe Teutschen haben die Kriegs Ordnung seit der Römer zeiten gewaltigklich herbracht/ besonder die Regirung vnnd Rüstung mit dem Reissigen zeuge der Pferdt/ dann zusehen ist bei allen Nationen/ wo mann bei jnen befindt/ also ein schwer gewaltig Rüstung/ vnnd souil als bei den Teutschen vor das erst.
  cs: |-
    Němci od dob Římanů mocně zachovávají válečný řád, zvláště správu a výzbroj jízdy {Reissigen zeuge} na koních. Ať se totiž podíváme ke kterémukoli národu – kde u něj najdeme tak těžkou a mocnou výzbroj a v takovém počtu jako u Němců? To za prvé.
- typ: odstavec
  de: Zum andern die geringe Rüstung der Pferde vnd Leut/ souil vnd
  cs: |-
    Za druhé lehká výzbroj koní a lidí: v takovém počtu a tak
