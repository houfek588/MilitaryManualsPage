  popis: |-
    Celostránkový dřevořez na výšku (bez letopočtu a monogramu) k [[5-024r|sedmému srubu]]: čtverhranný výběžek na dlouhé dvojité šanci, která vede shora dolů od jednoho srubu ke druhému. Okraje výběžku lemují šancovní koše, z jednoho místa pálí dělo (oblak dýmu); uvnitř pikenýři a střelci, zleva vede dlouhý krytý přístup.
