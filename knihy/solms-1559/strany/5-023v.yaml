  popis: |-
    Celostránkový dřevořez orientovaný na výšku (bez podpisu a letopočtu): čtvercově vysunutý hliněný pevnůstkový výspěk (*Pastei*) na ose dvou dlouhých spojovacích zákopů běžících nahoru i dolů ke dvěma sousedním srubům; koruna nádvoří jest po třech stranách chráněna těsnou řadou hlínou plněných proutěných košů (*Schanzkörbe*), ze čtyř střílen pálí dělo doleva/doprava s oblakem dýmu, uvnitř stojí jednotka pikeníků a dělostřelci, zleva vede dlouhá krytá přístupová cesta.
