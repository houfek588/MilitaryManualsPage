bloky:
- typ: nadpis
  uroven: 2
  de: Eingang der Kriegs ordnung.
  cs: Úvod do válečného řádu.
- typ: odstavec
  de: |-
    DIe weil die Römisch Keiserlich Maiestat allezeit vns so die hohe Ampter verwalt haben/ gesagt vnd beuolhen hat/ das wir vnser Beuelch vnd Ampter so wir in verwaltung haben/ zu dem besten versehen vnd Regiren wöllen/ dann jhre Keiserlich Maiestat habe vns mit söllichen hohen vnnd Ehrlichen Amptern zubegnadigen/ vnd wölle jre Keiserlich Maiestat des gnedigest zu vns versehen vnd vertrawen/ wir werden den sachen nachgedencken/ die nach Kriegs gebrauch zu dem besten versehen vnnd verwalten/ in betrachtung das jhre Keiserlich Maiestat vns vor andern mit söllichen hohen vnnd Ehrlichen beuelch vnd Ampter genedigst begnadiget vnd verehret/ vnd nit allein ein jeder sein Ampt allein zuuersehen/ sonder alles das wir sehen vnd befinden/ das jhrer Keiserlich May. vor das erste/ vnnd fürt dem gantzen Leger zu gůtem komen möge/ fürdern/ vnd zu gleichem fal was zu nachtheilt vnd schaden erreichen mag waren/ verkommen/ vnd alles das sůchen vnd thůn/ darmit der nachtheil verhütet vnnd zu besserung gewent werden mögte/ nit allein als verwalter der Ampter/ allein ein jeder das sein/ sonder alles das thůn was möglichen zu rathen/ vnd zu dem thůn was Kriegsräthen bei jhren trewen vnd pflichten zuthůn gebüret.
  cs: |-
    Jelikož Římské císařské Veličenstvo nám, kteří jsme spravovali vysoké úřady, vždy pravilo a přikázalo, abychom svá velení a úřady, jež máme ve správě, co nejlépe zastávali a řídili – neboť prý nás Jeho císařské Veličenstvo chtělo takovými vysokými a čestnými úřady omilostnit a nejmilostivěji k nám chová naději i důvěru, že věci promyslíme a podle válečného zvyku co nejlépe zařídíme a budeme spravovat, maje na zřeteli, že nás Jeho císařské Veličenstvo před jinými tak vysokými a čestnými veleními a úřady nejmilostivěji obdařilo a poctilo –, a nejen aby každý zastával pouze svůj úřad, nýbrž aby vše, co shledáme a poznáme, že by mohlo posloužit k dobru především Jeho císařskému Veličenstvu a dále celému ležení {Leger}, podporovali, a zároveň abychom se vystříhali a předcházeli tomu, co by mohlo vést ke škodě a újmě[^1], a vše vyhledávali a činili, čím by se škodě zabránilo a věci se obrátily k lepšímu; tedy nejen jako správci úřadů, každý pouze toho svého, nýbrž konali vše, co je možno radit a činit, jak válečným radům {Kriegsräthen} podle jejich věrnosti a povinnosti činit náleží.
- typ: nadpis
  uroven: 2
  de: |-
    Vorrede vnd eingang diser beschreibung der Kriegßordnung vnd Regierung Römischem gebrauch nach.
  cs: |-
    Předmluva a úvod k tomuto popisu válečného řádu a správy podle římského zvyku.
- typ: odstavec
  de: |-
    DIe weil die aller gröste lengste schwerlichste vnd manlichste Krieg so in der Welt geschehen/ haben die Römer gefürt/ vnd mit aller ernstlichsten Rüstung/ so in den zeiten hat sein mögen/ vnd in Germania jhre lengst vnd best Kriegsuolck gewesen/ vnnd jnen den Römern/ die Krieg helffen füren/ wie mann des in der Römer geschicht beschrieben findet.
  cs: |-
    Jelikož největší, nejdelší, nejtěžší a nejmužnější války, které se kdy na světě udály, vedli Římané, a to s tou nejopravdovější výzbrojí {Rüstung}, jaká v oněch dobách mohla být, a v Germánii měli svůj nejstálejší a nejlepší válečný lid {Kriegsuolck}, jenž jim Římanům pomáhal války vést, jak se o tom dočítáme v římských dějinách.
- typ: odstavec
  de: |-
    Deßgleichen inn vilen andern mehr beschriben Historien vnnd Cronica befunden wirt/ das also die hoch Teutschen den Kriegen lang anhengig gewest vnd geuolgt/ dann mann wirt nit bald in einem Landt da Krieg in gewest seind/ befinden/ das nit von Teutschen darinn gewest weren/ darzů in hohen Kriegs Amptern vnd
  cs: |-
    Rovněž se v mnoha jiných sepsaných dějinách a kronikách shledává, že Horní Němci byli takto odedávna válkám oddáni a následovali je – vždyť se sotva najde země, v níž se vedly války, kde by v nich nebyli Němci, a k tomu ve vysokých válečných úřadech a
poznamky:
- n: 1
  text: Tisk má podobu *nachtheilt* (tiskařská odchylka za *nachtheil*).
