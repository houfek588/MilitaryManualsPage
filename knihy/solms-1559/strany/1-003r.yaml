bloky:
- typ: nadpis
  uroven: 2
  de: Eingang der Kriegs ordnung.
  cs: Úvod do válečného řádu.
- typ: odstavec
  de: |-
    DIe weil die Römisch Keiserlich Maiestat allezeit vns so die hohe Ampter verwalt haben/ gesagt vnd beuolhen hat/ das wir vnser Beuelch vnd Ampter so wir in verwaltung haben/ zu dem besten versehen vnd Regiren wöllen/ dann jhre Keiserlich Maiestat habe vns mit söllichen hohen vnnd Ehrlichen Amptern zubegnadigen/ vnd wölle jre Keiserlich Maiestat des gnedigest zu vns versehen vnd vertrauen/ wir werden den sachen nachgedencken/ die nach Kriegs gebrauch zu dem besten versehen vnnd verwalten/ in betrachtung das jhre Keiserlich Maiestat vns vor andern mit söllichen hohen vnnd Ehrlichen beuelch vnd Ampter genedigst begnadiget vnd verehret/ vnd nit allein ein jeder sein Ampt allein zuuersehen/ sonder alles das wir sehen vnd befinden/ das jhrer Keiserlich May. vor das erste/ vnnd fürt dem gantzen Leger zu gůtem komen möge/ fürdern/ vnd zu gleichem fal was zu nachtheilt vnd schaden erreichen mag waren/ verkommen/ vnd alles das sůchen vnd thůn/ darmit der nachtheil verhütet vnnd zu besserung gewent werden mögte/ nit allein als verwalter der Ampter/ allein ein jeder das sein/ sonder alles das thůn was möglichen zu rathen/ vnd zu dem thůn was Kriegsräthen bei jhren trewen vnd pflichten zuthůn gebüret.
  cs: |-
    Římské císařské Veličenstvo nám, kteří jsme spravovali vysoké úřady, vždy říkalo a přikazovalo, abychom svá velení a úřady, jež máme ve správě, co nejlépe zastávali a řídili. Jeho císařské Veličenstvo nás prý ráčilo takovými vysokými a čestnými úřady obdařit a nejmilostivěji od nás očekává a důvěřuje, že věci promyslíme a podle válečného zvyku co nejlépe zařídíme a spravovat budeme – vždyť nás Jeho císařské Veličenstvo před jinými tak vysokými a čestnými veleními a úřady nejmilostivěji obdařilo a poctilo. Nemá přitom každý zastávat jen svůj úřad, nýbrž máme podporovat všechno, co shledáme a poznáme, že by mohlo posloužit k dobru především Jeho císařskému Veličenstvu a dále celému ležení {Leger}; stejně tak se máme střežit toho, co by mohlo vést k újmě a škodě[^1], a předcházet tomu a vše hledat a činit, čím by se škodě zabránilo a věci se obrátily k lepšímu. Nejen tedy jako správci úřadů, každý jen toho svého, nýbrž máme činit vše, co lze radit, a konat to, co válečným radům {Kriegsräthen} při jejich věrnosti a povinnosti konat náleží.
- typ: nadpis
  uroven: 2
  de: |-
    Vorrede vnd eingang diser beschreibung der Kriegßordnung vnd Regierung Römischem gebrauch nach.
  cs: |-
    Předmluva a úvod k tomuto popisu válečného řádu a správy podle římského zvyku.
- typ: odstavec
  de: |-
    DIe weil die aller gröste lengste schwerlichste vnd manlichste Krieg so in der Welt geschehen/ haben die Römer gefürt/ vnd mit aller ernstlichsten Rüstung/ so in den zeiten hat sein mögen/ vnd in Germania jhre lengst vnd best Kriegsuolck gewesen/ vnnd jnen den Römern/ die Krieg helffen füren/ wie mann des in der Römer geschicht beschrieben findet.
  cs: |-
    Největší, nejdelší, nejtěžší a nejmužnější války, které se kdy na světě udály, vedli Římané, a to s tou nejvážnější výzbrojí {Rüstung}, jaká v oněch dobách mohla být; v Germánii pak měli svůj nejdéle sloužící a nejlepší válečný lid {Kriegsuolck}, který jim, Římanům, pomáhal války vést, jak se o tom dočítáme v římských dějinách.
- typ: odstavec
  de: |-
    Deßgleichen inn vilen andern mehr beschriben Historien vnnd Cronica befunden wirt/ das also die hoch Teutschen den Kriegen lang anhengig gewest vnd geuolgt/ dann mann wirt nit bald in einem Landt da Krieg in gewest seind/ befinden/ das nit von Teutschen darinn gewest weren/ darzů in hohen Kriegs Amptern vnd
  cs: |-
    Stejně tak se v mnoha dalších sepsaných dějinách a kronikách shledává, že Horní Němci byli válkám odedávna oddáni a táhli za nimi. Sotva se totiž najde země, kde se vedly války, v níž by nebyli Němci, a to i ve vysokých válečných úřadech a
poznamky:
- n: 1
  text: Tisk má podobu *nachtheilt* (tiskařská odchylka za *nachtheil*).
