bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    sechßzig oder sibentzig par Fußknecht / die mann den verlornen hauffen nent / welche on alle Ordnung voran ziehen / nachuolgents vier glied mit Spiessen / darnach zwei mit Hellenbarten / vnd ein Fendlin zu jn / weitter etlich Glieder mit Spiessen nach dem jr vil habt / vngefehrlich das halb theil / vnd in die mitten etlich Spiesser vnd Hellenbarter / vnd die Fendlin alle / nachuolgents solt jr die Spiesser so nach vberblieben ordnen / vnd wann jr schir kompt biß auff vier letster glieder / so stelt zwei glieder mit Hellenparten vnd vier mit Spiessen.
  cs: |-
    šedesát nebo sedmdesát párů pěších knechtů {Fußknecht}, kterým se říká ztracený houf {verlornen hauffen} a kteří táhnou vpředu bez jakéhokoli šiku {Ordnung}. Potom čtyři řady {glied} s píkami {Spiessen}, za nimi dvě s halapartnami {Hellenbarten} a u nich praporec {Fendlin}. Dále několik řad s píkami, podle toho, kolik jich máte, asi polovina, a doprostřed několik pikenýrů {Spiesser} a halapartníků {Hellenbarter} a všechny praporce. Potom máte seřadit pikenýry, kteří ještě zbyli, a když dojdete skoro až k posledním čtyřem řadám, postavte dvě řady s halapartnami a čtyři s píkami.
- typ: odstavec
  de: |-
    Auff der lincken seiten der Fußknecht solt jr ordnen ewer Gesind / allwegen vier für ein Glied vnnd nicht mehr / sonst künden die mit den Lantzen jr Feind nicht wol erreichen / auff der rechten seiten solt jr halten lassen gůt Reutter / nemlich zwentzig gerüster Pferdt zum ersten / vnd nachuolgents zwentzig oder dreissig / dem nach jr vil Reutter habt / jr must auch etlich behalten die neben der Ordnung stehen / allwegen zwen vnd zwen mit gůten Scheffeleinen vnd halben Spiessen / die hin vnd wider lauffen / vnd den Feinden schaden thůn / doch nicht für das erst Glied oder Fendlein lauffen / darumb seind sie darhinden geordnet / vnd an die Ordnung gehenckt / Es soll auch keiner in der Ordnung fester ziehen dann der ander / auch solt jr den Reisigen Zeug hinder dem Geschütz halten lassen / vnd wann das Geschütz in zwei theil getheilt ist / solt jr den gemelten Reisigen Zeug auff die rechte seiten ordnen / solchs geschicht nicht on vrsach.
  cs: |-
    Na levé straně pěších knechtů máte rozestavit svou družinu {Gesind},[^1] vždy čtyři v jedné řadě a ne víc, jinak by ti s kopími {Lantzen} nemohli na nepřítele dobře dosáhnout. Na pravé straně máte nechat stát dobré jezdce {Reutter}, totiž nejprve dvacet zbrojných koní {gerüster Pferdt} a potom dvacet nebo třicet, podle toho, kolik máte jezdců. Musíte si také ponechat některé, kteří stojí vedle šiku, vždy po dvou, s dobrými oštěpy {Scheffeleinen}[^2] a polovičními píkami {halben Spiessen}; ti pobíhají sem a tam a škodí nepříteli, nemají však vybíhat před první řadu nebo praporec, a proto jsou rozestaveni vzadu a připojeni k šiku. Nikdo také nemá v šiku postupovat rychleji než druhý. Jízdu {Reisigen Zeug} máte nechat stát za děly {Geschütz}, a jsou-li děla rozdělena na dvě části, máte zmíněnou jízdu postavit na pravou stranu. To se neděje bez příčiny.
- typ: odstavec
  de: |-
    Erstlich wann ewer Geschütz abgehn wirt / solt jhr wissen daß die Feind zu gleicher massen auch schiessen werden / alßdan wann der Reisig Zeug hinder das Geschütz geordnet ist / haben die Feind souil desto weitter zuschiessen vnd künden euch nicht so wol treffen wie jhr sie / vnnd wann sie anfahen anzuziehen sollen sie nicht schiessen / biß daß stich vmb stich geht.
  cs: |-
    Zaprvé: když vaše děla vypálí, máte vědět, že nepřítel bude stejně tak střílet také. Je-li jízda postavena za děly, musí nepřítel střílet o to dál a nemůže vás zasáhnout tak dobře jako vy jeho. A když [nepřátelé] začnou postupovat, nemají [vaši] střílet, dokud nedojde na bodnutí za bodnutí.
- typ: odstavec
  de: |-
    Zum andern wann ewer Feind stercker seind dann jr / solt jr allwegen Karren auff beiden seiten der Ordnung herab stellen lassen / doch vber zwen oder drei nicht neben einander / dann sie sonst mit dem schiessen nicht hinüber langen möchten / alßdann künden die Feind nicht mehr dann mit dem ersten glied schlagen.
  cs: |-
    Zadruhé: je-li váš nepřítel silnější než vy, máte po obou stranách šiku dát podél postavit káry {Karren}, avšak ne víc než dvě nebo tři vedle sebe, jinak by [vaši] nemohli přes ně dostřelit. Nepřítel se pak nemůže bít jinak než první řadou.
- typ: odstavec
  de: |-
    Jch hab mit solcher gestalt vil Völcker so stercker vnd auch mechtiger gewesen sein dann ich / geschlagen / da zum offter mal vier wider ein gewesen / doch hat mir Gott den sig geben / vnd dünckt mich es sei das sicherst schlagen das mann thůn künde / doch gefelt es nicht jederman / der vrsachen halben wann die Ordnung der gestalt mit einer Wagenburg vmbschlossen / künden sie sich nit nach jrem willen schlagen oder fliehen / aber für mein theil befinde ichs gůt vnd sicher.
  cs: |-
    Tímto způsobem jsem porazil mnoho vojsk, která byla silnější a mocnější než já, takže častokrát stáli čtyři proti jednomu, a přesto mi Bůh dal vítězství. Zdá se mi, že je to nejbezpečnější způsob boje, jaký lze vést. Nelíbí se však každému, protože když je šik takto obklopen vozovou hradbou {Wagenburg}, nemohou se [lidé] bít ani utíkat podle své vůle. Já to však za sebe shledávám dobrým a bezpečným.
poznamky:
- n: 1
  text: „Gesind“ zde znamená vlastní družinu velitele – šlechtice a jejich ozbrojené služebníky s kopími (Lantzen), kteří bojují pěšky po boku pěchoty.
- n: 2
  text: „Scheffelein“ (Schäfflein) – krátký oštěp či vrhací kopí; čtení nejisté.
