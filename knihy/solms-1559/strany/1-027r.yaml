bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    bestelt werden. Also ist ein Wagenburg in vilen vnd inn mancherlei wegen zugebrauchen / darumb soll mann sie nicht verachten noch abgehen lassen.
  cs: |-
    obsazena. Takto lze vozovou hradbu {Wagenburg} použít v mnoha rozmanitých případech, a proto se jí nemá pohrdat ani ji nechat zaniknout.
- typ: odstavec
  de: |-
    Aber dieweil hie also von mir / die Wagenburg zuhalten / so hart angezogen wirt / mit angezeigten vrsachen / das thů ich darumb / darmit die wider in ein gebrauch komen / vnd wie sich gebürt / zugericht würden / dann es ist ein rechte Wagenburg nicht allein zu machen von den gemeinen Heerwagen / sonder es gehören besondere wagen darzů / die mit Geschütz zugericht / darauff ligen vnd verfast sein / deßgleichen wagen gehören vnder die andern wagen einzufüren vnnd zutheilen / deßgleichen ein zimlich Feldgeschütz / ein jedes nach seinem gebrauch vnd verwart bleiben / biß mann der nottürfftig ist / so soll mann die alßdan bei die andern wagen füren vnd eintheilen / wie oben vermelt ist.
  cs: |-
    Že tu však tak důrazně a s uvedením důvodů naléhám na udržování vozové hradby, činím proto, aby se vozové hradby opět dostaly do užívání a byly vystrojovány, jak se sluší. Řádná vozová hradba se totiž nemá skládat jen z obyčejných vojenských vozů; patří k ní zvláštní vozy vystrojené děly {Geschütz}, která na nich leží a jsou na nich upevněna. Takové vozy se mají zařadit a rozdělit mezi ostatní vozy, stejně jako přiměřený počet polních děl, každé podle svého účelu. Mají zůstat uschovány, dokud jich není třeba; pak se mají přivézt k ostatním vozům a vřadit mezi ně, jak bylo řečeno výše.
- typ: odstavec
  de: |-
    Wie solche wagen vnd zurüstung gemacht sein sollen / vnd eingezogen werden / wirt weitter bericht vnd anzeigung hernach geschehen.
  cs: |-
    Jak mají být takové vozy a jejich výstroj zhotoveny a jak se mají zařazovat, o tom bude podána další zpráva a výklad níže.
- typ: odstavec
  de: |-
    Darumb ist es nicht also ein geringe versehung vmb ein Wagenburg / vnnd were gůt daß mann sich wol darinn vbet / vnnd gebrauchte Leut darzů züge / darmit solliches wider in einen gebrauch vnd rüstung kommen möchte.
  cs: |-
    Zajištění vozové hradby tedy není nijak malá věc a bylo by dobré, aby se v něm lidé pilně cvičili a přibírali k tomu zkušené muže, aby se opět dostalo do užívání a výzbroje {rüstung}.
- typ: odstavec
  de: |-
    Daß mann sagen will / wie hieuorn gemelt ist / Es sei mühsam / vnd bring einen grossen kosten / ist wol etwas / aber dem nicht nach zu rechnen / daß wider gůts bringen / vnd schaden verhüten kan / wie das oben bericht gibt.
  cs: |-
    Říká-li se, jak bylo zmíněno již výše, že je to namáhavé a přináší velké náklady, je na tom sice něco pravdy, ale nedá se to srovnat s tím, kolik dobrého to naopak může přinést a jakým škodám zabránit, jak o tom podává zprávu výklad výše.
- typ: odstavec
  de: |-
    Ja mann will es dahin deutten / als solt ein Herr ein gantze Wagenburg allein halten vnd haben / das ist nicht die meinung / Dann ein Herr solt haben inn seinem Zeughauß etliche Wagen / darauff etlich Geschütz steht / als doppel Hacken oder halb Falckonetlein / deßgleichen etliche Schirmwagen / die sollen in der mit so lang der Wagen ist / einen brettern schirm auffgericht haben von leichtem holtz / derselbig schirm soll sein so hoch das ein man darneben steht / vnd wol mit bedeckt sei / vnd ein freien standt haben möge / derselbigen wagen einer ist mit dreien Pferden gespant / dieselbige wagen sollen haben neben dem schirm vnden auff dem wagen ein standt eins Schůchs breit vff jeder seitten / daß man daruff stehn kan / Auß disen vrsachen / es tregt sich offt zů / daß man eilend auß můß auff füteruug etwas zuuerwarn vnd einnemen / dann kan mann vff einn solchen wagen / so bald 4. oder 6. Schützen daruff nemen / die eillend nach fürn / so bald sie dann an die ort komen / da mann sie gebrauchen soll / so künden sie bald abfallen neben die Wagen / vnd im vortheil stehen / das ist vor das erst.
  cs: |-
    Někdo by to snad chtěl vykládat tak, že by pán měl sám vydržovat a mít celou vozovou hradbu; tak to však nemyslím. Pán by měl mít ve své zbrojnici {Zeughauß} několik vozů, na nichž stojí nějaká děla, jako dvojité hákovnice {doppel Hacken} nebo poloviční falkonety {halb Falckonetlein}, a rovněž několik štítových vozů {Schirmwagen}. Ty mají mít uprostřed po celé délce vozu vztyčenou prkennou zástěnu z lehkého dřeva, tak vysokou, aby muž, který stojí vedle ní, byl dobře krytý a měl přitom volné místo k postavení. Takový vůz se zapřahá třemi koňmi a vedle zástěny má mít dole na voze po každé straně stupátko široké jednu stopu {Schůchs}, aby se na něm dalo stát. Důvod je tento: často se stává, že je třeba spěšně vyrazit na pícování[^1], něco zajistit a obsadit. Tu lze na takový vůz hned vzít 4 nebo 6 střelců {Schützen}, kteří rychle dojedou za ostatními; jakmile dorazí na místo, kde jich je třeba, mohou hned seskočit vedle vozů a stát ve výhodném postavení – to za prvé.
poznamky:
- n: 1
  text: V tisku převrácená litera *füteruug* místo *füterung*.
