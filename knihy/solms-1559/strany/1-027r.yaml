bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    bestelt werden. Also ist ein Wagenburg in vilen vnd inn mancherlei wegen zugebrauchen / darumb soll mann sie nicht verachten noch abgehen lassen.
  cs: |-
    obsazena. Takto lze vozovou hradbu {Wagenburg} použít v mnoha a rozmanitých případech, proto se jí nemá pohrdat ani ji nechat zaniknout.
- typ: odstavec
  de: |-
    Aber dieweil hie also von mir / die Wagenburg zuhalten / so hart angezogen wirt / mit angezeigten vrsachen / das thů ich darumb / darmit die wider in ein gebrauch komen / vnd wie sich gebürt / zugericht würden / dann es ist ein rechte Wagenburg nicht allein zu machen von den gemeinen Heerwagen / sonder es gehören besondere wagen darzů / die mit Geschütz zugericht / darauff ligen vnd verfast sein / deßgleichen wagen gehören vnder die andern wagen einzufüren vnnd zutheilen / deßgleichen ein zimlich Feldgeschütz / ein jedes nach seinem gebrauch vnd verwart bleiben / biß mann der nottürfftig ist / so soll mann die alßdan bei die andern wagen füren vnd eintheilen / wie oben vermelt ist.
  cs: |-
    Že však zde tak důrazně naléhám na udržování vozové hradby s uvedenými důvody, činím to proto, aby se opět dostala do užívání a byla vystrojována tak, jak se sluší; neboť řádná vozová hradba se nemá skládat pouze z obyčejných vojenských vozů, nýbrž náležejí k ní zvláštní vozy vystrojené děly {Geschütz}, která na nich leží a jsou upevněna; takové vozy mají být zařazeny a rozděleny mezi ostatní vozy, a stejně tak přiměřená polní děla, každé podle svého účelu, a mají zůstat v ostraze, dokud jich není zapotřebí – pak se mají přivést k ostatním vozům a vřadit, jak bylo výše řečeno.
- typ: odstavec
  de: |-
    Wie solche wagen vnd zurüstung gemacht sein sollen / vnd eingezogen werden / wirt weitter bericht vnd anzeigung hernach geschehen.
  cs: |-
    Jak mají být takové vozy a výzbroj zhotoveny a zařazeny, o tom bude podána další zpráva a výklad níže.
- typ: odstavec
  de: |-
    Darumb ist es nicht also ein geringe versehung vmb ein Wagenburg / vnnd were gůt daß mann sich wol darinn vbet / vnnd gebrauchte Leut darzů züge / darmit solliches wider in einen gebrauch vnd rüstung kommen möchte.
  cs: |-
    Proto není opatření vozové hradby nijak nepatrná věc, a bylo by dobré, aby se v něm lidé pilně cvičili a vychovávali si k tomu zkušené muže, aby se opět dostalo do užívání a výzbroje {rüstung}.
- typ: odstavec
  de: |-
    Daß mann sagen will / wie hieuorn gemelt ist / Es sei mühsam / vnd bring einen grossen kosten / ist wol etwas / aber dem nicht nach zu rechnen / daß wider gůts bringen / vnd schaden verhüten kan / wie das oben bericht gibt.
  cs: |-
    Říká-li se, jak již bylo zmíněno výše, že je to namáhavé a přináší veliké náklady, je na tom sice něco pravdy, ale nelze na to hledět ve srovnání s tím, co dobrého to může přinést a jakým škodám zabránit, jak o tom podává zprávu výklad nahoře.
- typ: odstavec
  de: |-
    Ja mann will es dahin deutten / als solt ein Herr ein gantze Wagenburg allein halten vnd haben / das ist nicht die meinung / Dann ein Herr solt haben inn seinem Zeughauß etliche Wagen / darauff etlich Geschütz steht / als doppel Hacken oder halb Falckonetlein / deßgleichen etliche Schirmwagen / die sollen in der mit so lang der Wagen ist / einen brettern schirm auffgericht haben von leichtem holtz / derselbig schirm soll sein so hoch das ein man darneben steht / vnd wol mit bedeckt sei / vnd ein freien standt haben möge / derselbigen wagen einer ist mit dreien Pferden gespant / dieselbige wagen sollen haben neben dem schirm vnden auff dem wagen ein standt eins Schůchs breit vff jeder seitten / daß man daruff stehn kan / Auß disen vrsachen / es tregt sich offt zů / daß man eilend auß můß auff fütterung etwas zuuerwarn vnd einnemen / dann kan mann vff einn solchen wagen / so bald 4. oder 6. Schützen daruff nemen / die eillend nach fürn / so bald sie dann an die ort komen / da mann sie gebrauchen soll / so künden sie bald abfallen neben die Wagen / vnd im vortheil stehen / das ist vor das erst.
  cs: |-
    Ba dokonce si to někteří vykládají tak, jako by měl pán sám vydržovat a mít celou vozovou hradbu; to však není můj smysl. Neboť pán by měl mít ve své zbrojnici {Zeughauß} několik vozů, na nichž jsou postavena některá děla, jako jsou dvojité hákovnice {doppel Hacken} nebo poloviční falkonety {halb Falckonetlein}, a rovněž několik štítových vozů {Schirmwagen}[^1]; ty mají mít uprostřed po celé délce vozu vztyčenou prkennou zástěnu z lehkého dřeva, a ta zástěna má být tak vysoká, aby vedle ní stál muž, byl jí dobře kryt a měl volné postavení. Jeden takový vůz bývá zapřažen třemi koňmi a vedle zástěny má mít dole na voze po každé straně stupátko široké jednu stopu {Schůchs}, aby se na něm dalo stát. A to z tohoto důvodu: stává se často, že je třeba spěšně vyrazit na pícování {fütterung}, něco zajistit a obsadit; tu lze na takový vůz ihned vzít 4 nebo 6 střelců {Schützen} a rychle je dovézt na místo, a jakmile dorazí tam, kde jich je zapotřebí, mohou hned seskočit vedle vozů a stát ve výhodném postavení – to za prvé.
poznamky:
- n: 1
  text: |-
    Něm. *Schirmwagen* – krytý vůz se svislou dřevěnou zástěnou a bočními stupátky pro rychlou přepravu a palebné krytí střelců.
