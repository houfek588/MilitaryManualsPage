  popis: |-
    Celostránkový dřevořez o dvou polích:
    • Horní pole („G“ vlevo nahoře, na úbočí příkopu „BF / anno 1558.“): vysoká silná cihlová či kvádrová zeď s úzkým předprsňovým ochozem na zemské straně; v úzkém čele zdi dole je zasazen jediný prachový soudek přímo v tloušťce zdiva, z pravé strany vede příkopem podzemní chodba, do níž horníci snášejí pytle s prachem (v pozadí vesnice s kostelem a strom).
    • Dolní pole („H“ vpravo nahoře, monogram „.BF.“ uprostřed nábřeží): táž vysoká zeď, tentokrát však podkopová chodba z příkopu vstupuje bokem přímo do podélné komory v tloušťce zdiva a vede vodorovně podél paty zdi (místo pod základy, odkud by výbuch unikl do měkké zeminy).
