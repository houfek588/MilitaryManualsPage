  popis: |-
    Celostránkový dřevořez obrněného jezdce – velitele – jedoucího vpravo. Jezdec má plátovou zbroj se zdobeným kabátcem, široký klobouk s velkým chocholem z per a v pravé ruce velitelskou hůl, u boku meč a na patě ostruhu. Kůň nese plátovou zbroj hlavy s mřížovými chrániči očí, šupinový nákrčník a bohatě zdobený kropír s rostlinnými ornamenty a rozetou. Jezdce rámují dva stromy, jejichž holé, propletené větve nad ním tvoří klenutou bránu; v pozadí obláčky.
