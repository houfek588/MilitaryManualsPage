  popis: |-
    Celostránkový dřevořez vrchního velitele v plné plátové zbroji a širokém klobouku s chocholem z peří, jedoucího vpravo na koni v plátovém krytu hlavy a krku a v bohatě zdobeném kropíři s rostlinnými a rozetovými vzory. Jezdec je rámován dvěma stromy, jejichž propletené holé větve vytvářejí nad ním klenutou bránu.
