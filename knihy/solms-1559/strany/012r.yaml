bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    leib warten soll / vnd jre eygen Pferdt vnd gesindt haben / die sollen in keinen weg zugelassen werden / Dann je grösser ansehens vnd befelch einer hat / je weniger er das thůn soll / dann es steht nicht ehrlichen leuten zu / dann es wider Gott / vnd jhm verächtlich ist / vnd es ist ein leichtfertigkeit / Dann ein Beuelchßman soll sich der tugent halten / vnd je er inn höherm beuelch ist / je mehr er das thůn soll / so mag er mit Gott vnd ehrn regiern / dann Gott ist bei der erbarkeit / vnd wo Gott ist / geförcht vnd geehrt wirt / da ist glück vnd sieg. Darumb soll der Herr am ersten annemen hart darob halten / daß man das im anfang nicht laß einbrechen / so kan mann das dann desto baß erhalten / dann wann das im anziehen verhůtet / vnd besonder bei den hohen hauptern die regiern sollen.
  cs: |-
    osobně sloužila a měla vlastní koně a čeleď, takové nemají být v žádném případě připuštěny. Čím větší vážnost a velení kdo má, tím méně to má činit. Čestným lidem to totiž nepřísluší, je to proti Bohu a jemu k opovržení a je to lehkovážnost. Velitel {Beuelchßman} se má držet ctnosti, a čím vyšší velení má, tím více to má činit; pak může vládnout s Bohem a se ctí. Bůh totiž stojí při počestnosti, a kde je Bůh, kde se ho bojí a ctí ho, tam je štěstí a vítězství. Proto má pán hned při prvním najímání přísně dbát, aby se to na počátku nevloudilo; pak se to dá tím lépe udržet, zabrání-li se tomu už při nástupu, a zvláště u vysokých hlav, které mají velet.
- typ: odstavec
  de: |-
    Damit aber doch mögen Weiber mitziehen zu der notturfft / so sollen einem jeden Fendlein zugelassen werden sein anzal / was mann bedůnckt daß die zu waschen von nöten haben müssen / die sollen doch einem jeden vnder dem Fendlin verpflicht sein zuwäschen / vmb jre zimliche billiche belonung / darob sollen die Hauptleut halten / daß jn jre belonung werd / vnd sie sich des auch halten darumb sie da seind. Auch soll ein jedes Fendlin seine Garköch haben / die den Knechten jre habende speiß kochen / vnd daruon jhre gesetzte / billiche / belonung nemen.
  cs: |-
    Aby však přece jen mohly pro potřebu táhnout s vojskem ženy, má se každému praporci {Fendlein} povolit takový jejich počet, jaký se uzná za nutný k praní. Ty však mají být povinny prát každému pod praporcem za přiměřenou a slušnou odměnu. Hejtmani {Hauptleut} mají dbát, aby svou odměnu dostaly a aby se také držely toho, kvůli čemu tu jsou. Každý praporec má mít také své polní kuchaře {Garköch}, kteří knechtům {Knechten} uvaří jídlo, které mají, a berou si za to stanovenou slušnou odměnu.
- typ: odstavec
  de: |-
    So soll ein jeder Hauptman dann fleissig darauff achtung haben / daß es also bei der zugelassen maß gehalten werd / mit den nottürfftigen Personen / die also arbeiten vnd des volcks warten / vnd nicht die Junckfrawen die nichts thůn / dann daß mann jnen warten muß vnd vnglück anrichten.
  cs: |-
    Každý hejtman má tedy pilně dbát, aby se zachovala povolená míra, a to u potřebných osob, které takto pracují a lidu slouží, a ne u slečinek, které nic nedělají, jen se jim musí sloužit, a tropí neštěstí.
- typ: odstavec
  de: |-
    Mit den Wagen laß mann es darbei / was mann bestelt / auß notturfft vnd gelegenheit auch zulassen muß / vnd daß die schwere Rüstung mehr wagen erfordert dann die geringe / Dann solten die Knecht stets in der schweren Rüstung reytten / vermöchtens die Knecht vnd auch die pferdt nicht / sonder fürten sich ab daß sie alle zu boden giengen / auch vermögen die pferdt nicht die Barschen vnd schweren zeug für vnd für zutragen / derhalben erfordert die schwere Rüstung mehr wagen / dann die geringe / Darumb soll in dem ein vnderscheydt gehalten werden.
  cs: |-
    U vozů ať se zůstane při tom, co se sjedná a co je podle potřeby a okolností také nutno povolit; přitom těžká zbroj {Rüstung} vyžaduje více vozů než lehká. Kdyby totiž knechti museli stále jezdit v těžké zbroji, nevydrželi by to ani oni, ani koně; uštvali by se tak, že by všichni padli. Koně také nedokážou ustavičně nést koňskou zbroj[^1] a těžkou výstroj {zeug}. Proto vyžaduje těžká zbroj více vozů než lehká a má se v tom činit rozdíl.
- typ: odstavec
  de: |-
    Vnd daß der Adell den titel hat / die Gestrengen vnd Ehrnuesten / des soll der Keyser sie erinnern vnd fürhalten / vnd ob dem tittel halten / das sich der Adell des halten müst / vnd der vnadellichen stück müssiggieng / als wucher / vmbschlag / vnnd dergleichen was dem Adell nicht zusteht / wann der Adell sich wider (wie von alters) der
  cs: |-
    A protože má šlechta titul „stateční a slovutní“,[^2] má jí to císař připomínat a předkládat a trvat na tom titulu: šlechta se ho musí držet a vyhýbat se nešlechtickým kouskům, jako je lichva, peněžní kšefty a podobné věci, které šlechtě nepříslušejí. Kdyby se šlechta opět (jako za starých časů) držela
poznamky:
- n: 1
  text: |-
    V originále *Barschen* (též *Parschen*, z franc. *barde*) – plátová či kroužková zbroj koně (barda), chránící krk, hruď a záď.
- n: 2
  text: |-
    V originále *die Gestrengen vnd Ehrnuesten*, ustálené dobové oslovení nižší šlechty a rytířstva; česky se v listinách téže doby užívalo „statečný“ (rytíř) a „slovutný“ (vladyka).
