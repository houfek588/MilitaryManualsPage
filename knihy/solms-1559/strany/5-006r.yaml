bloky:
- typ: odstavec
  de: |-
    DIse mit E. verzeichnet Figur zeigt vnnd weist/ wie die Knappen in der Grafft das Erdtrich mit Kerlin herauß füren/ der gleichen mit Brettern kestlein/ der eins vier kleine scheiblein/ vnnd fornen ein Seil hat daran zeugt manns herauß. Weitter zeigt diser Figur an/ wie die Grafft neben der Pasteien auff der seiten herauß biß inn die schantz laufft/ das hat den verstandt/ daß mañ nit strack zum ort das mann sprengen will graben soll/ darmit die in der Festen nit sehen/ wo mann sprengen wöl/ vnd ob mann schon inn der schantzen strack zu dem ort zufürt/ da mann vermeint zu sprengen/ so soll das erdrich das mann auß der Grafft fürt/ in die schantz auff ein seiten auff eim hauffen geschüt werden/ wo die in der besatzung sehen/ da man frisch erdtrich außfürt vnd hin schüt/ vermeinen sie mann grabe daselbst hinein/ vnd wissen nit daß die Grafft an einem andern ort hinein geht/ vnd ob sie schon an dem ort da die außgefürte erde ligt/ entgegen graben/ so felhen sie vnd wissen nit wo sie recht zu graben/ daß sie treffen/ vnd wann sie dann etlich mal felh graben/ so seumen sie sich vñ verliern die zeit/ daß die hieauß desto ehe fürt kommen künden.
  cs: |-
    Toto vyobrazení označené `E` ukazuje a předvádí, jak horníci {Knappen} vyvážejí z podkopové chodby {Grafft} zeminu na kolečkách, a rovněž na prkenných vozících {Brettern kestlein}, z nichž každý má čtyři malá kolečka a vpředu provaz, za nějž se vytahují ven. Dále toto vyobrazení ukazuje, jak podkopová chodba běží stranou vedle bašty {Pasteien} ven až do zákopů {Schantz}; to má ten smysl, aby se nekopalo přímo k místu, jež se má vyhodit do povětří, aby ti v pevnosti neviděli, kde chceš odpalovat. A i když se ze zákopu jde rovně k místu, kde máš v úmyslu odpalovat, má se hlína vyvážená z podkopu v zákopu sypat stranou na jednu hromadu: kde posádka {Besatzung} uvidí, že se vyváží čerstvá zemina a sype se tam, bude se domnívat, že se kope právě tamtudy dovnitř, a nebude vědět, že podkop vniká na jiném místě. A i kdyby pak kopali protipodkop na tom místě, kde leží vyvezená zemina, chybně zamíří a nebudou vědět, kudy správně kopat, aby nás zasáhli; a když se tak několikrát minou, zdrží se a ztratí čas, takže ti venku tím spíše pokročí kupředu.
- typ: odstavec
  de: |-
    Die ander figur mit F. verzeichnet/ zeigt an ein Baw wie der vil find von stätten da die maurn hoch auff den wällen stehn/ vnnd tieff drücken gräben darfür/ vnnd die maur steht so hoch bloß daß mann den grundt vnd anfang sicht/ vñ stehn Thurn an den maurn zu streichen/ sind gleich so hoch als die recht maur/ aber hinder die maurn legen sie erdene wäl/ so man denselbigen befestunge die obersten wehrn nimpt/ vnd belegt sie daß sie nit herauß fallen künden/ dan kan man jnen in die graben schantzen/ vnd vnder die maur da die Thürn an stehn graben/ würfft die erden nur auff beide seiten/ vnd grebt vnder die Thurn vnd wäl/ darnach kan mann puluer darunder setzen vnd sprengen/ Wann man jnen die obersten wehr genimpt/ vnd die außfel wehrt/ ob sie darin schon entgegen graben/ so muß man hörn wo/ vnd wol vnder sie graben/ daß mañ vnder jr Graff kome/ wan sie es vbersehn das man vnder sie kompt/ dan soll man Puluer vnder jhre Grafft setzen vnd werffen/ da findt man Knappen die gar geschwind vnd geschicht darauff sind/ vnden oder neben außzu farn/ machen falsche grafften odder stollen/ bochen mit schlegeln/ das schilt hart daß mans hört/ vnd damit farn sie neben hin auff ein andern weg stillschweigend/ vnd machen die andern mit jrem graben jrr/ wie inn einer andern Figurn vnnd bescheibung angezeigt soll werden.
  cs: |-
    Druhé vyobrazení označené `F` ukazuje stavbu, jakých je u měst mnoho, kde zdi stojí vysoko na valech a před nimi jsou hluboké suché příkopy, přičemž zeď ční tak obnaženě vzhůru, že je vidět její základ a pata, a u zdi stojí boční věže k postřelování {streichen}, stejně vysoké jako vlastní hradba, avšak za hradby kladou hliněné valy {Wall}. Seberou-li se takovému opevnění horní obranné ochozy a sevřou se obránci, aby nemohli podnikat výpady, pak se jim dá zakopat do příkopů a kopat pod zeď, kde stojí věže: zemina se vyhazuje jen na obě strany a podkopává se pod věže a valy, načež lze pod ně uložit prach a odpálit je. Když se jim odejmou horní obrany a zabrání se výpadům, i kdyby uvnitř kopali protipodkop, musí člověk naslouchat, kde jsou, a kopat zhluboka pod ně, aby se dostal pod jejich chodbu; přehlédnou-li, že se dostaneš pod ně, pak máš pod jejich podkop položit prach a vyhodit jej. Jsou pak horníci {Knappen} na to velmi hbití a obratní, kteří uhýbají dolů či stranou, dělají falešné chodby neboli štoly {stollen}, tlukou v nich palicemi, což zní silně, aby to bylo slyšet – a přitom sami potichu uhnou jinou cestou do strany a svedou tak protivníky při jejich kopání v omyl, jak bude ukázáno v jiném vyobrazení a popisu.[^1]
poznamky:
- n: 1
  text: |-
    Složka `B`: v prvním odstavci tištěno mylně „wie die Knappen in der Grafft...“ i „diser Figur“, v druhém odstavci „find“ (za *sind*) a v posledním řádku „bescheibung“ (za *beschreibung*).
