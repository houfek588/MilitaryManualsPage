bloky:
- typ: odstavec
  de: |-
    DIse mit E. verzeichnet Figur zeigt vnnd weist/ wie die Knappen in der Grafft das Erdtrich mit Kerlin herauß füren/ der gleichen mit Brettern kestlein/ der eins vier kleine scheiblein/ vnnd fornen ein Seil hat daran zeugt manns herauß. Weitter zeigt diser Figur an/ wie die Grafft neben der Pasteien auff der seiten herauß biß inn die schantz laufft/ das hat den verstandt/ daß mann nit strack zum ort das mann sprengen will graben soll/ darmit die in der Festen nit sehen/ wo mann sprengen wöl/ vnd ob mann schon inn der schantzen strack zu dem ort zufert/ da mann vermeint zu sprengen/ so soll das erdrich das mann auß der Grafft fürt/ in die schantz auff ein seiten auff eim hauffen geschüt werden/ wo die in der besatzung sehen/ da man frisch erdtrich außfürt vnd hin schüt/ vermeinen sie mann grabe daselbst hinein/ vnd wissen nit daß die Grafft an einem andern ort hinein geht/ vnd ob sie schon an dem ort da die außgefürte erde ligt/ entgegen graben/ so felhen sie vnd wissen nit wo sie recht zu graben/ daß sie treffen/ vnd wann sie dann etlich mal felh graben/ so seumen sie sich vnd verliern die zeit/ daß die hieauß desto ehe fürt kommen künden.
  cs: |-
    Toto vyobrazení označené `E` ukazuje a předvádí, jak horníci {Knappen} vyvážejí z podkopové chodby {Grafft} zeminu na kolečkách {Kerlin} a také na prkenných vozících {Brettern kestlein}; každý z nich má čtyři malá kolečka a vpředu provaz, za který se vytahuje ven. Dále vyobrazení ukazuje, jak podkopová chodba vychází stranou vedle bašty {Pasteien} až do šance {schantz}. Smysl je ten, že se nemá kopat přímo k místu, které se má vyhodit, aby ti v pevnosti {Festen} neviděli, kde se chystá odstřel. A i když se ze šance jde rovnou k místu, kde se má odstřelovat, má se zemina vyvážená z chodby sypat v šanci stranou na jednu hromadu. Když posádka {besatzung} uvidí, kde se vyváží a sype čerstvá zemina, bude se domnívat, že se tam kope dovnitř, a nebude vědět, že chodba vede dovnitř jinde. I kdyby obránci na místě, kde leží vyvezená zemina, kopali protipodkop, minou se a nebudou vědět, kudy správně kopat, aby nás zasáhli; a když se několikrát minou, zdrží se a ztratí čas, takže ti venku tím spíš pokročí.
- typ: odstavec
  de: |-
    Die ander figur mit F. verzeichnet/ zeigt an ein Baw wie der vil sind von stätten da die maurn hoch auff den wällen stehn/ vnnd tieff drücken gräben darfür/ vnnd die maur steht so hoch bloß daß mann den grundt vnd anfang sicht/ vnd stehn Thurn an den maurn zu streichen/ sind gleich so hoch als die recht maur/ aber hinder die maurn legen sie erdene wäl/ so man denselbigen befestunge die obersten wehrn nimpt/ vnd belegt sie daß sie nit herauß fallen künden/ dan kan man jnen in die graben schantzen/ vnd vnder die maur da die Thürn an stehn graben/ würfft die erden nur auff beide seiten/ vnd grebt vnder die Thurn vnd wäl/ darnach kan mann puluer darunder setzen vnd sprengen/ Wann man jnen die obersten wehr genimpt/ vnd die außfel wehrt/ ob sie darin schon entgegen graben/ so muß man hörn wo/ vnd wol vnder sie graben/ daß mann vnder jr Graff kome/ wan sie es vbersehn das man vnder sie kompt/ dan soll man Puluer vnder jhre Grafft setzen vnd werffen/ da findt man Knappen die gar geschwind vnd geschicht darauff sind/ vnden oder neben außzu farn/ machen falsche grafften odder stollen/ bochen mit schlegeln/ das schilt hart daß mans hört/ vnd damit farn sie neben hin auff ein andern weg stillschweigend/ vnd machen die andern mit jrem graben jrr/ wie inn einer andern Figurn vnnd bescheibung angezeigt soll werden.
  cs: |-
    Druhé vyobrazení, označené `F`, ukazuje stavbu, jakých je u měst mnoho: zdi stojí vysoko na valech, před nimi jsou hluboké suché příkopy a zeď stojí tak vysoko obnažená, že je vidět její základ i patu. U zdí stojí věže k bočnímu ostřelování {streichen}, stejně vysoké jako vlastní hradba, a za hradby kladou obránci hliněné valy {wäl}. Když se takovému opevnění {befestunge} odejmou horní obrany {wehrn} a obránci se sevřou tak, že nemohou podnikat výpady, lze se k nim zakopat do příkopů a kopat pod zeď, kde stojí věže; zemina se vyhazuje jen do obou stran a podkopávají se věže i valy, načež se pod ně uloží prach a odpálí se. Když se jim odejmou horní obrany a zabrání se výpadům a obránci by přesto uvnitř kopali protipodkop, je třeba naslouchat, kde jsou, a kopat hluboko pod ně, aby se člověk dostal pod jejich chodbu {Graff}; nepostřehnou-li, že se jim kdo dostává pod chodbu, má se pod ni uložit prach a vyhodit ji. Najdou se ovšem horníci, kteří jsou v tom velmi rychlí a obratní: uhnou dolů nebo stranou, dělají falešné chodby či štoly {stollen} a tlukou v nich palicemi, což silně zní, aby to bylo slyšet, a přitom sami potichu razí jinou cestou stranou a svádějí tak protivníky při jejich kopání v omyl, jak bude ukázáno na jiném vyobrazení a v popisu.[^1]
poznamky:
- n: 1
  text: |-
    Podle skenu (447) má tisk ve druhém odstavci *sind* (dlouhé ſ; dřívější čtení „find“ byla chyba OCR) a v prvním odstavci „zufert“; tiskovými chybami jsou „geschicht“ (za *geschickt*, „obratní“) a v posledním řádku „bescheibung“ (za *beschreibung*).
