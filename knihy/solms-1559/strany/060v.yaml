bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Grauen vnnd Herren souil weren / das er jhrer mehr dann zubesetzung des fanen nottürfftig / möchte er die selben in das vorderst glied ordnen / da hielten sie auch ehrlich / so er auch der Grauen / Herren vnd vom Adel als wenig hette / das er vor dem fanen nit gliede gnůg machen künde / mag er ein gliede oder zwei von gůten wolberitenen vnd angethanen Knechten darzů gebrauchen.
  cs: |-
    hrabat a pánů bylo tolik, že by jich měl více, než je třeba k obsazení korouhve {fanen}, mohl by je zařadit do přední řady {glied}; i tam by stáli se ctí. Měl-li by však hrabat, pánů a šlechticů tak málo, že by před korouhví nemohl sestavit dost řad, smí k tomu použít jednu nebo dvě řady dobrých, dobře jízdních a vystrojených čeledínů {Knechten}.
- typ: odstavec
  de: |-
    Hat auch der Hautptman an Fürsten zuordnen / damit soll ers / wie in des Leutenants 16. Artickel angezeigt / halten / wiewol etlich Kriegserfaren wöllen / alle Fürsten sollen zu nechst hinder den fanen geordnet werden / sein doch andere darwider / vnd sagen / Es sei bequemlicher darneben / deßhalben sol es ein Hauptman zu eins Fürsten gefallen stellen / an welcher diser ort eins er geordnet wil sein / da hin soll er jn ordnen / der Hauptman hett dann einn lautern beuelch / von dem Kriegsherrn oder Obersten Feldhauptman / wohin er den Fürsten ordnen solt / demselben soll er volgen.
  cs: |-
    Má-li také hejtman[^1] zařadit knížete, má se tím řídit tak, jak je uvedeno v 16. článku {Artickel} poručíka {Leutenants}. Ačkoli někteří válečně zkušení muži tvrdí, že všechna knížata mají být zařazena těsně za korouhev, jsou jiní proti tomu a říkají, že je vhodnější vedle ní. Proto to má hejtman {Hauptman} ponechat na vůli knížete, na kterém z těchto dvou míst chce být zařazen, a tam jej má zařadit – ledaže by měl hejtman výslovný rozkaz od válečného pána {Kriegsherrn} nebo nejvyššího polního hejtmana {Obersten Feldhauptman}, kam má knížete zařadit; tím se pak má řídit.
- typ: odstavec
  de: |-
    Vnd wann alle Reuter sampt dem Fendrich / da sie hin geordnet sein / halten / soll sie der Hauptman ernstlich bitten / daß ein jeder in seiner ordnung bleibe / auch gůt acht hab / wann ein Lermen werde / es sei tag / nacht oder ein züge / daß er sein stat wider zu finden wisse / der Hauptman soll auch als bald dem Fendrich auß der Ordnung fordern / vnd jn vmb den hauffen lassen reiten / zubesichtigen / ob der fan nach notturfft besetzt sei / vnnd wann der Fendrich ansehenlich mangel fünde / soll er es dem Hauptman / doch als vil billich / für halten / wann aber der Hauptman den Fendrich / wie gehört / die Ordnung zubesichtigen / nicht auffordert / hat es der Fendrich vor sich selbst zuthůn fug vnd macht / vnnd ob es gleich dem Fendrich gefellt / vnd dem Obersten oder Feldmarschalck nit / soll er es nach derselben beuelch machen / wann auch ein hauptman den fanen zu besetzen / nicht Reuter gnůg hat / so stöst der Oberst odder Feldmarschalck zwen zusamen mit jren Reutern / oder ordnet jm mehr Reuter zů.
  cs: |-
    A když všichni jezdci {Reuter} spolu s praporečníkem {Fendrich} stojí tam, kam jsou zařazeni, má je hejtman vážně požádat, aby každý zůstal na svém místě v šiku {ordnung} a dobře si všímal, kde stojí, aby je při poplachu {Lermen} – ať ve dne, v noci, nebo na tažení {züge} – dokázal opět najít. Hejtman má také ihned vyvolat praporečníka ze šiku a nechat jej objet houf {hauffen}, aby prohlédl, zda je korouhev náležitě obsazena. Shledá-li praporečník zjevný nedostatek, má jej hejtmanovi, ovšem slušně, předložit. Nevyzve-li však hejtman praporečníka, jak řečeno, k prohlídce šiku, má praporečník právo a moc učinit tak sám od sebe. A i kdyby se to praporečníkovi líbilo, plukovníkovi {Obersten} nebo polnímu maršálkovi {Feldmarschalck} však nikoli, má to upravit podle jejich rozkazu. Nemá-li také některý hejtman k obsazení korouhve dost jezdců, spojí plukovník nebo polní maršálek dva hejtmany s jejich jezdci dohromady, anebo mu přidělí další jezdce.
- typ: odstavec
  de: |-
    Es soll kein Hauptman auß dem Leger oder auff Beuten reiten / oder seinen Reuttern solliches on wissen vnnd bewilligung des Obersten Feldhauptmans erlaubnuß / thůn gestatten / Deßgleichen sollen auch alle Reutern on jrer Hauptleut bewilligung nit reiten / Wann sich aber hierinn Hauptleut oder Reutter vbersehen / darumb sol der Oberst die Hauptleut vnd die Reuter straffen / es kündt
  cs: |-
    Žádný hejtman nemá vyjíždět z ležení {Leger} ani za kořistí, ani to dovolit svým jezdcům bez vědomí, svolení a povolení nejvyššího polního hejtmana. Stejně tak nesmějí žádní jezdci vyjíždět bez svolení svých hejtmanů. Kdyby se v tom však hejtmani nebo jezdci provinili, má je za to plukovník potrestat, hejtmany i jezdce; jinak by nemohl
poznamky:
- n: 1
  text: |-
    V tisku „Hautptman“ (tiskařská chyba místo *Hauptman*) a „an Fürsten“ (zřejmě místo *einn Fürsten* – jednoho knížete).
