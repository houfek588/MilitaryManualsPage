bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Grauen vnnd Herren souil weren / das er jhrer mehr dann zubesetzung des fanen nottürfftig / möchte er die selben in das vorderst glied ordnen / da hielten sie auch ehrlich / so er auch der Grauen / Herren vnd vom Adel als wenig hette / das er vor dem fanen nit gliede gnůg machen künde / mag er ein gliede oder zwei von gůten wolberitenen vnd angethanen Knechten darzů gebrauchen.
  cs: |-
    hrabat a pánů bylo tolik, že by jich měl více, než je třeba k obklopení korouhve {fanen}, mohl by je zařadit do přední řady {glied}, tam by stáli také se ctí; měl-li by však hrabat, pánů a šlechticů tak málo, že by před korouhví nemohl sestavit dostatek řad, smí k tomu použít jednu nebo dvě řady z dobrých, dobře vsedlých a vystrojených čeledínů {Knechten}.
- typ: odstavec
  de: |-
    Hat auch der Hautptman an Fürsten zuordnen / damit soll ers / wie in des Leutenants 16. Artickel angezeigt / halten / wiewol etlich Kriegserfaren wöllen / alle Fürsten sollen zu nechst hinder den fanen geordnet werden / sein doch andere darwider / vnd sagen / Es sei bequemlicher darneben / deßhalben sol es ein Hauptman zu eins Fürsten gefallen stellen / an welcher diser ort eins er geordnet wil sein / da hin soll er jn ordnen / der Hauptman hett dann einn lautern beuelch / von dem Kriegßherrn oder Obersten Feldhauptman / wohin er den Fürsten ordnen solt / demselben soll er volgen.
  cs: |-
    Má-li také hejtman[^1] zařadit knížete, má se tím řídit tak, jak je uvedeno v 16. článku {Artickel} poručíka {Leutenants}. Ačkoliv někteří ve válce zkušení muži tvrdí, že všechna knížata mají být zařazena těsně za korouhev, jsou jiní proti tomu a říkají, že je vhodnější vedle ní. Proto to má hejtman {Hauptman} ponechat na vůli knížete, na kterém z těchto dvou míst chce být zařazen, a tam jej má zařadit – ledaže by měl hejtman výslovný rozkaz od válečného pána {Kriegßherrn} nebo nejvyššího polního hejtmana {Obersten Feldhauptman}, kam má knížete zařadit; tím se pak má řídit.
- typ: odstavec
  de: |-
    Vnd wann alle Reuter sampt dem Fendrich / da sie hin geordnet sein / halten / soll sie der Hauptman ernstlich bitten / daß ein jeder in seiner ordnung bleibe / auch gůt acht hab / wann ein Lermen werde / es sei tag / nacht oder ein züge / daß er sein stat wider zu finden wisse / der Hauptman soll auch als bald dem Fendrich auß der Ordnung fordern / vnd jn vmb den hauffen lassen reiten / zubesichtigen / ob der fan nach notturfft besetzt sei / vnnd wann der Fendrich ansehenlich mangel fünde / soll er es dem Hauptman / doch als vil billich / für halten / wann aber der Hauptman den Fendrich / wie gehört / die Ordnung zubesichtigen / nicht auffordert / hat es der Fendrich vor sich selbst zuthůn fug vnd macht / vnnd ob es gleich dem Fendrich gefellt / vnd dem Obersten oder Feldmarschalck nit / soll er es nach derselben beuelch machen / wann auch ein hauptman den fanen zu besetzen / nicht Reuter gnůg hat / so stöst der Oberst odder Feldmarschalck zwen zusamen mit jren Reutern / oder ordnet jm mehr Reuter zů.
  cs: |-
    A když všichni jezdci {Reuter} spolu s praporečníkem {Fendrich} stojí tam, kam jsou zařazeni, má je hejtman vážně požádat, aby každý zůstal ve svém šiku {ordnung} a také dobře dbal, když vznikne poplach {Lermen} – ať ve dne, v noci či na tažení {züge} –, aby dovedl opět najít své místo. Hejtman má také ihned vyzvat praporečníka z šiku a nechat jej objet kolem houfu {hauffen}, aby prohlédl, zda je korouhev náležitě obsazena; a shledal-li by praporečník zjevný nedostatek, má to hejtmanovi – nakolik se sluší – přednést. Nevyzve-li však hejtman praporečníka, jak řečeno, k prohlídce šiku, má praporečník právo a moc učinit tak sám od sebe; a i kdyby se to praporečníkovi líbilo, avšak nejvyššímu veliteli {Obersten} nebo polnímu maršálkovi {Feldmarschalck} nikoli, má to upravit podle jejich rozkazu. Nemá-li také některý hejtman k obklopení korouhve dostatek jezdců, spojí nejvyšší velitel nebo polní maršálek dva hejtmany s jejich jezdci dohromady, anebo mu přidělí více jezdců.
- typ: odstavec
  de: |-
    Es soll kein Hauptman auß dem Leger oder auff Beuten reiten / oder seinen Reuttern solliches on wissen vnnd bewilligung des Obersten Feldhauptmans erlaubnuß / thůn gestatten / Deßgleichen sollen auch alle Reutern on jrer Hauptleut bewilligung nit reiten / Wann sich aber hierinn Hauptleut oder Reutter vbersehen / darumb sol der Oberst die Hauptleut vnd die Reuter straffen / es kündt
  cs: |-
    Žádný hejtman nemá vyjíždět z ležení {Leger} ani na kořist a ani svým jezdcům nemá dovolit tak činit bez vědomí, svolení a dovolení nejvyššího polního hejtmana; stejně tak nesmějí vyjíždět žádní jezdci bez svolení svých hejtmanů. Kdyby se však v tom hejtmani nebo jezdci provinili, má za to nejvyšší velitel hejtmany i jezdce potrestat, jinak by nemohl
poznamky:
- n: 1
  text: |-
    V tisku „Hautptman“ (tiskařská chyba místo *Hauptman*) a „an Fürsten“ (zřejmě místo *einn Fürsten* – jednoho knížete).
