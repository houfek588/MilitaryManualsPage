bloky:
- typ: nadpis
  uroven: 2
  de: |-
    Das fünfft Blochaus.
  cs: |-
    Pátý srub.
- typ: odstavec
  de: |-
    Das fünfft ist in die Ründe gemacht/ ob etwan ein platz ein Blochaus in die virung darauff zumachen nit schicken wolt/ oder die weide nicht haben künde/ vnd solches Blochaus in die ründe gezogen müst werden/ so zeigt dise fünfft Figur an/ wie dasselbig meins bedünckens gemacht sein sol/ mit verzeichneter verzeignuß wo die pletz oder Stende des Geschütz hingelegt sollen werden/ als inwendig in die Ründe dieweil sie außwendig solche außfürung gleich dem Platz nit haben möchten/ vnnd mit einem verdecktem eingang.
  cs: |-
    Pátý srub je udělán do kruhu – pro případ, že by se nějaké místo nehodilo k tomu, aby se na něm postavil srub do čtverce, nebo že by nemělo potřebnou šířku a srub by se musel vytáhnout do kruhu. Toto páté vyobrazení ukazuje, jak by podle mého mínění měl být zhotoven, s vyznačením, kam se mají umístit místa čili stanoviště děl {Geschütz}: totiž dovnitř kruhu, protože vně by podle povahy místa nemohla mít takové vysunutí. Má také krytý vchod.
