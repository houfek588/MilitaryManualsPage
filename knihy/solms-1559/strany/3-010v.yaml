bloky:
- typ: nadpis
  uroven: 2
  de: |-
    Volgen hernach andere Ampter die inn das Feld gehören / dem Zeugmeister auch zum theil zuuersehen / vnd die auff jhn bescheiden sollen werden /
  cs: |-
    Následují další úřady, které náležejí do pole, jež zčásti obstarává zbrojmistr {Zeugmeister} a které mají být podřízeny pod něj:
- typ: nadpis
  uroven: 3
  de: Erstlich des Schantzmeisters Ampt / Beuelch vnd außrichtung.
  cs: Předně úřad, pravomoc a povinnosti šancmistra {Schantzmeisters}.
- typ: odstavec
  de: |-
    EIn Schantzmeister soll auff den Zeugmeister bescheiden werden / auff jn warten / seins bescheidts sich halten / auch soll der Schantzmeyster bei dem lermen eines Flecken odder Schloß sein / damit er sehen mag wie daruor zuschansen / ist jm berichtlicher wanner darbei gewesen vnd sehen / dann wann man jn das erst sehen vnd weisen muß im schantzen / Des soll der Schantzmeister sein Losament stets zum nechsten bei den Schantzern oder Quastitorn haben danner gehört zu jnen / vnd so er schantzen soll oder muß / soll er erstlich nach eim vorteil / etwan nach eim grundt oder berglin besehen / dann man zum ersten die Schantz mag anfahen / daß sie die Schantzer nicht gantz entblössen / vnd so er das haben mag soll er daselbst zu schantzen anfahen / wol vndersich einfallen / die Erden aller nebensich werffen lassen / biß so lang die leut sich bedecken mögen / So das geschehen ist / soll er dieselben inn der ersten Schantzgruben fort graben lassen / vnd jmmer neben sich werffen / souil neben einander verdeckt stehen künden / auff die soll man noch mehr andere hinden anstellen / die den nacharbeitten in die tieff vnd weitte / vnd vber das noch ein Rotte die inn gleichem fall denen mit der tieffen vnd weitten nacharbeitten / souil ein ander nach gestellt / biß die Schantz jr tieffe vnd weitte hat / Also soll mann fort farn so lang man vnder sich mag / vnd biß die Schantz jre gnůgsame weitte vnd höhe hat / damit die leut wol verdeckt seind / Dann mann soll daran nichts sparen gůte schantzen zumachen / es spart die leut / vnd macht gůte / starcke / versorgte wachten / vnnd mann soll allezeit für vnd für an schantzen bei der nacht bessern / wo mann sich ein weil ligens versicht / Auch soll ein Zeugmeister vnnd Schantzmeister besehen / wann mann schantzen / vnd gar kein vortheil haben mag / vnd frei schantzen muß / soll mann Wägen zurichten mit Wolsecken / dieselben außfüllen mit graß / stro / häw / oder was man haben kan / so man die seck nit kan bekommen / mag mann die wägen mit stro / häw oder peusch laden / dieselben fürn bei der nacht da man zu schantzen anfahen
  cs: |-
    Šancmistr má být podřízen zbrojmistrovi, být mu k ruce a řídit se jeho rozkazy. Šancmistr má být rovněž při poplachu {lermen} před městečkem či zámkem,[^1] aby mohl vidět, jak před nimi kopat šance {schansen}; lépe se v tom vyzná, když tam sám byl a viděl to, než kdyby mu to museli při kopání teprve ukazovat a vykládat. Proto má mít šancmistr své ubytování {Losament} vždy co nejblíže u šancířů {Schantzern},[^2] neboť patří k nim. A má-li nebo musí-li kopat šance, má se nejprve poohlédnout po nějaké výhodě terénu, třeba po úžlabině nebo pahrbku, kde lze šanci {Schantz} nejprve začít, aby se šancíři docela neodkryli. Najde-li takové místo, má tam začít kopat, dobře se zakopat dolů a všechnu zeminu dávat házet vedle sebe, dokud se lidé nebudou moci skrýt. Jakmile se tak stane, má je nechat v tomto prvním zákopu kopat dále vpřed a stále házet zeminu vedle sebe, kolik jich jen může vedle sebe stát v krytu; za ně se mají postavit ještě další, kteří budou po nich zákop prohlubovat a rozšiřovat, a za nimi ještě jedna rota {Rotte}, která jej stejně po nich prohloubí a rozšíří – tolik jich za sebou nastoupí, až bude mít šance svou hloubku i šířku. Takto se má pokračovat, jak hluboko jen lze dolů a až bude mít šance dostatečnou šířku i výšku, aby byli lidé dobře kryti. Na tom se nemá šetřit, aby se dělaly dobré šance – šetří to lidi a vytváří dobré, silné a zajištěné stráže {wachten}; a tam, kde se očekává delší setrvání, se mají šance v noci stále a neustále vylepšovat. Zbrojmistr a šancmistr mají také dohlédnout, kdyby bylo třeba kopat šance na místě bez jakékoli terénní výhody a muselo se kopat v otevřeném poli: tu se mají připravit vozy se žoky na vlnu a ty vycpat trávou, slámou, senem či čímkoli, co je po ruce; a nejsou-li žoky k sehnání, mohou se vozy naložit slámou, senem nebo otýpkami[^3] a dovézt v noci tam, kde se chce začít kopat šance –
poznamky:
- n: 1
  text: |-
    Něm. *bei dem lermen eines Flecken odder Schloß* – při prvním poplachu či znepokojení posádky před obleženou obcí či hradem (případně písařská obměna za *berennen*, průzkumné obklíčení).
- n: 2
  text: |-
    V tisku „Schantzern oder Quastitorn“ – latinizovaný název *Quastitor* užívá Solms souběžně pro šancíře (selské zákopníky).
- n: 3
  text: |-
    Něm. *peusch* (*Bäusche*) – otýpky, svazky slámy či chrastí užívané jako provizorní krytí.
