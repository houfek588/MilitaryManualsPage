bloky:
- typ: odstavec
  de: |-
    ZVm achtzehenden der hieuorn verzeichnet Stůl mit dem B. ist vberzwerg auffgesatz das er also vber ein seiten anzusehen/ wie er verbunden vnnd mit Holtz durchzogen ist/ vnd deßgleichen wie der wel oder Zogbaum leit.
  cs: |-
    Za osmnácté: výše vyobrazená stolice {Stůl} označená písmenem B je postavena napříč, aby na ni bylo vidět z boku – jak je spojena a vyztužena dřevem a také jak leží hřídel {wel} neboli tažný hřídel {Zogbaum}.
- typ: odstavec
  de: |-
    Die hie ander mit dem C. verzeichnet/ ist wie der Stůl vnd Mortier in dem grund ligt inn seinem maß groß vnnd kleine/ als wann mann oben heraber darauff oder darein sehen wirt.
  cs: |-
    Druhá figura zde označená písmenem C ukazuje, jak stolice a moždíř {Mortier} leží v půdorysu se svými rozměry ve velkém i malém, jako když se na ně nebo do nich hledí shora.
