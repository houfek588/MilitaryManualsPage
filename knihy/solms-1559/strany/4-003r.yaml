bloky:
- typ: odstavec
  de: |-
    ZVm achtzehenden der hieuorn verzeichnet Stůl mit dem B. ist vberzwerg auffgesatz das er also vber ein seiten anzusehen/ wie er verbunden vnnd mit Holtz durchzogen ist/ vnd deßgleichen wie der wel oder Zogbaum leit.
  cs: |-
    Za osmnácté: výše vyobrazená stolice {Stůl} označená písmenem B jest postavena napříč, aby na ni bylo vidět takto ze strany, jak jest spojena a dřevem vyztužena a stejně tak jak leží hřídel {wel} neboli naviják {Zogbaum}.
- typ: odstavec
  de: |-
    Die hie ander mit dem C. verzeichnet/ ist wie der Stůl vnd Mortier in dem grund ligt inn seinem maß groß vnnd kleine/ als wann mann oben heraber darauff oder darein sehen wirt.
  cs: |-
    Druhé vyobrazení zde označené písmenem C ukazuje, jak stolice {Stůl} a moždíř {Mortier} spočívají v půdorysu se svými rozměry ve velkém i malém, jako když se na ně hledí seshora.
