    Celostránkový dřevořez orientovaný na výšku, s letopočtem „.1559.“ vlevo nahoře a monogramem „BF“ dole uprostřed: půlkruhová zděná bašta (*Pastei*) vysunutá do koryta prudce tekoucí řeky lemované na protějším břehu kamenným nábřežím; na baště střílí dělostřelec z jednoho kusu přes vodu, zezadu zleva přes suchý příkop vede k baště dřevěný most.
