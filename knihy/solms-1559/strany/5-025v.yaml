    Celostránkový dřevořez na výšku (letopočet „.1559.“ vlevo nahoře, monogram „BF“ dole): půlkruhová zděná bašta vysunutá do koryta prudce tekoucí řeky, na ní dělo s puškařem; zleva k ní vede přes příkop dřevěný most. Text k vyobrazení v tisku chybí (snad doplněk k vodní polovině [[5-025r|osmého srubu]]).
