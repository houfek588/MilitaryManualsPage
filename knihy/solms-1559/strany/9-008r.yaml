stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    nach den Reisigen wolt ich etlich zu fuß mit vier Falckenetlin ziehen/ vnnd hinder denen allen ein pferdt oder sechßzehen streuffen lassen/ das ich den grossen hauffen Knecht in der mit ziehen lassen wolt/ Ist darumb daß sie denen im vorzug oder nachzug/ welche jren notturfftig weren/ desto ehe helffen künden/ dann inn engen Landen mögen die Fußknecht mehr helffen dann die Reisigen/ vnnd der gestalt ist mein meinung/ möcht mann in engen Landen ziehen/ jedoch wil ich ander geschickter leut dann ich bin/ auch daruon reden lassen/ Vnnd wann es örter seind da mann graben außfüllen kan/ daß mann auff Italienisch Osplanade heist/ bedünckt mich es mög geschehen wann gnug Fußuolck alda sei.
  cs: |-
    za jízdou bych nechal táhnout několik pěších se čtyřmi falkonety {Falckenetlin} a za nimi všemi nechal na hlídky {streuffen} vyjíždět asi šestnáct koní,[^1] kdežto velký houf knechtů {Knecht} bych nechal táhnout uprostřed. To proto, aby mohli tím rychleji pomoci těm v předvoji {vorzug} nebo v zadním voji {nachzug}, kteří by jich potřebovali; v úzkých zemích totiž mohou pěší knechti {Fußknecht} pomoci víc než jízda {Reisigen}. Takto je podle mého mínění možno táhnout úzkými zeměmi; nechám však o tom mluvit i jiné lidi, zkušenější, než jsem já. A jsou-li tam místa, kde lze zasypat příkopy – čemuž se italsky říká esplanade {Osplanade}[^2] –, zdá se mi, že se to může stát, je-li tam dost pěšího lidu {Fußuolck}.
- typ: odstavec
  de: |-
    Dieweil es sich offt begibt/ daß mann durch Wasser/ es sei vber Brücken oder sonst ziehen muß/ da dann grosse gefehrlicheit darauff steht/ dann die Feind einen grossen vortheil haben/ solt jhr es gar wol bedencken vnd geschicklich darinn handeln/ dann keiner so witzig ist es widerfert einem etwan ein torheit/ Ich habe gesehen Brücken zu richten auff Schiffen/ etliche auff Wasser/ doch die auff die Schifflin gemacht seind die besten darüber zuziehen/ trutz ewern Feinden das doch warlich sorglich ist/ vnd vber alles ist in dem handel der fleiß/ Wann es sich dann begibt/ daß jr der obgemelten Brücken eine schlagen müst/ solt jr ewer gantz Geschütz auff das gestat des Wassers stellen/ vnd alles laden damit es gerüst sei inn die Feind zuschiessen/ die euch den paß einnemen wöllen/ vnnd als bald die Brück gemacht/ sollen leut halten die in der Ordnung stehen/ von stund an vber die Brück ziehen ehe es ewer Feind war nemen/ zum ersten hinüber füren lassen vier Falckenetlin/ damit fünff oder sechs hundert zu fuß mit Spiessen vnd Hacken/ vnd gleich auff die etlich Wagen/ darmit wann es von nöten were/ ein Wagenburg für sie machen/ vnnd die Feinde dermassen auffhalten künden/ jr als dann ewer hauffen sich hinüber füren/ Dann fünffhundert Knecht die in einer Wagenburg ligen/ mögen sich vor sechstausenten auff enthalten/ insonderheit wann sie sehen das rettung hernach kompt/ Dann meins bedünckens/ wann jhr souil wie ich gesagt/ hinüber bracht/ künden jr den gantzen hauffen on allen schaden hinüber füren/ vnd wann die fünffhundert man den paß nicht auffenthalten mit hilff ewers Geschützs das an ewerm ort des Wassers stehen wirdt/ werden warlich zehentausent auch nicht auff halten/ dann es allein ein Confuß were souil leut auff die Brück zu stellen vnnd grosse sorg sie zuuerlieren/ so ferr aber ewer Feind ein befestigung bei dem paß gemacht/ were ich nicht des willens/ daß jr euch daselbst vnderfingen hinüber zuziehen
  cs: |-
    Poněvadž se často stává, že se musí táhnout přes vodu, ať po mostech, nebo jinak, a hrozí přitom veliké nebezpečí, neboť nepřítel má velkou výhodu, máte to velmi dobře uvážit a počínat si v tom obratně; nikdo totiž není tak chytrý, aby se mu někdy nepřihodila hloupost. Viděl jsem stavět mosty na lodích, některé na vodě,[^3] avšak mosty postavené na loďkách jsou nejlepší k přechodu navzdory nepříteli, což je ovšem věru ošemetné; a nade vše je při tom zapotřebí píle. Stane-li se tedy, že musíte postavit některý z uvedených mostů, máte všechna svá děla {Geschütz} postavit na břeh řeky a vše nabít, aby byla připravena střílet do nepřátel, kteří by vám chtěli přechod {paß} zabrat. Jakmile je most hotov, mají lidé, kteří stojí připraveni v šiku {Ordnung}, ihned táhnout přes most, dříve než to nepřítel zpozoruje. Nejprve dejte převézt čtyři falkonety, s nimi pět nebo šest set pěších s píkami {Spiessen} a hákovnicemi {Hacken} a hned za nimi několik vozů, aby z nich v případě potřeby mohli udělat vozovou hradbu {Wagenburg} a zadržet nepřítele tak dlouho, než převedete svůj houf. Pět set knechtů, kteří leží ve vozové hradbě, se totiž může ubránit šesti tisícům, zvláště když vidí, že za nimi přichází pomoc. Podle mého zdání totiž, když převedete tolik [lidí], jak jsem řekl, můžete převést celý houf bez jakékoli škody. A neudrží-li přechod pět set mužů s pomocí vašich děl, která budou stát na vašem břehu, neudrží ho věru ani deset tisíc; bylo by jen zmatkem postavit na most tolik lidí a hrozilo by velké nebezpečí, že o ně přijdete. Kdyby však nepřítel u přechodu zřídil opevnění, nebyl bych toho mínění, abyste se tam pokoušel o přechod,
poznamky:
- n: 1
  text: |-
    *ein pferdt oder sechßzehen* – dobová vazba „ein … oder“ + číslovka vyjadřuje přibližný počet („nějakých šestnáct koní“), nejde o tiskovou chybu. *streuffen* (*streifen*) – vyjíždět na hlídky, křižovat terén kolem pochodujícího vojska.
- n: 2
  text: |-
    *Osplanade* – ital. *spianata*, franc. *esplanade*: zarovnaný, volný prostor (zde vyrovnání terénu zasypáním příkopů), aby mohlo vojsko táhnout v širším šiku.
- n: 3
  text: |-
    *etliche auff Wasser* – snad tisková chyba za *auff Fässer* (mosty na sudech), obvyklý dobový druh plovoucího mostu vedle mostů na lodích (srov. heslo lodní most).
