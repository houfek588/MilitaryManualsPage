bloky:
- typ: nadpis
  uroven: 2
  de: |-
    Ein Zug von dem grossen Fürsten Musca genant.
  cs: |-
    Tažení velikého knížete, jemuž se říká Moskevský {Musca}.
- typ: odstavec
  de: |-
    MAnn sagt vnd helt daruor/ daß der Fürst Musca ein mechtiger Herr sei/ vnd ein grossen reisigen Zeug in das Veld vermög/ als 200000. pferde/ doch nicht anders dann geringe pferdt/ gleich dem Türcken/ Vnd dieweil sie dann gleich dem Türcken gerüst sind/ ist zu achten/ daß sie gleich Kriegßgebrauch vnd handlung im veldt gegen einander gebrauchen vnnd füren/ vnd also ein werck/ ordnung vnd handel seie. Vnd wann es dann durch Gottes gnaden dahin gehandelt vnd geraten möcht/ daß genanter Musca mit der heiligen Christlichen Kirchen/ mit dem Königreich Poln/ deßgleichen mit dem Meister in Ifflandt vnd Preussen/ in ein Christliche vereinigung vnd friedlichen bestendigen verstandt komen/ were bei mir zurathen/ daß er darzů angenommen/ befördert vnd geholffen würde/ vnd wann er dann mit gemelten Stenden durch Gottes gnaden vnd mittel verstendigklich vereinigt/ vnd sich gleich mit jnen als ein Christlicher Fürst vnd Hilt gegen dem Türcken erkleren/ vnd zů den obengemelten Stenden gegen dem Türcken setzen/ vnd bei jnen halten wolt/ daß mann dann jm allen beistandt mit zuschickung aller Röstung thet vnd befordert/ dann mich bedünckt/ so gemelter groß Fürst dahin bracht vnd gefast würde/ es sol der Christenheit/ vnd dem Heiligen Reich ein grosser tröstlicher zusatz/ vnnd dem Türcken ein grosser nachtheil vnd abfal sein/ dann wie ich bericht/ sol durch Muscam ein gůter Paß auß Türckei in Poln/ die Marck/ vnd fört in daß Reich sein/ daß als dann von gemelten Fürstenthumen vnd in das Reich der paß versichert/ vnd von disen vnd gemelten Landen durch Muscam gegen dem Türcken zu handeln frei were/ auß solchen vrsachen soll mann solchen grossen Fürsten zu vnns ziegen bewegen/ vnd alle hilff thůn.
  cs: |-
    Říká se a má se za to, že moskevský kníže je mocný pán a dokáže postavit do pole velikou jízdu {reisigen Zeug}, až 200 000 koní {pferde}, ovšem jen lehkých koní, jako mají Turci. A protože jsou vyzbrojeni stejně jako Turci, lze soudit, že v poli proti sobě užívají a vedou stejný válečný způsob i postup, takže je to jedno dílo, řád a jednání. Kdyby se pak z Boží milosti podařilo vyjednat a dosáhnout toho, aby řečený Moskevský vstoupil se svatou křesťanskou církví, s Královstvím polským a rovněž s mistrem v Livonsku {Ifflandt} a v Prusku do křesťanského spolku a pokojné, trvalé dohody, radil bych, aby byl přijat a aby se mu v tom napomáhalo a pomohlo. A kdyby se pak s řečenými stavy z Boží milosti a s jejich pomocí rozumně spojil, spolu s nimi se jako křesťanský kníže a hrdina prohlásil proti Turkovi, postavil se po boku výše jmenovaných stavů proti Turkovi a držel při nich, mělo by se mu poskytnout veškeré přispění a podpora zasíláním vší výzbroje {Röstung}. Zdá se mi totiž, že kdyby byl tento veliký kníže k tomu přiveden a získán, bylo by to pro křesťanstvo i Svatou říši velikou a potěšitelnou posilou a pro Turka velikou škodou a úbytkem. Jak jsem totiž zpraven, vede prý přes Moskevsko {Muscam} dobrý průchod {Paß} z Turecka do Polska, do Marky a dále do Říše; tím by byl průchod z řečených knížectví do Říše zajištěn a z těchto i z oněch zemí by se dalo přes Moskevsko volně podnikat proti Turkovi. Z těchto příčin se má takový veliký kníže pohnout, aby se přidal k nám, a má se mu prokázat veškerá pomoc.[^1]
- typ: odstavec
  de: |-
    Vnd wann Gott die gnad beiden theiln verleihen/ daß sie also in eine gleiche vereinigung kommen würden/ als ich bei mir acht vnd bedencke also geschehen/ wil ich darauff/ auff den bericht so mir geschehen seines Kriegßuolcks vermögens/ noch einen geringen anschlag meines verstands ordnen vnd beschreiben/ mit einem zusatz anderem mehr frömbdem Kriegßuolck/ als Teutschen/ Spaniern/ Italianern vnd alles Christliches Kriegßuolck das in einem
  cs: |-
    Udělí-li Bůh oběma stranám milost, že takto dospějí k jednotné dohodě – a já soudím a myslím, že se tak stane –, chci pak podle zprávy, jíž se mi dostalo o síle jeho válečného lidu {Kriegßuolcks}, sestavit a popsat podle svého rozumu ještě skromný návrh {anschlag}, s posilou dalšího cizího válečného lidu, totiž Němců, Španělů, Italů a všeho křesťanského válečného lidu, který by byl v jednotných
poznamky:
- n: 1
  text: |-
    Solms zde načrtává projekt protiturecké koalice Moskevského velkoknížectví (*Musca*), Polska, Řádu německých rytířů v Livonsku (*Ifflandt*, „mistr“ = zemský mistr řádu), Pruska a Svaté říše. V tisku (sken 459) stojí „ziegen“ (za *ziehen*) a „Hilt“ (*Held*, hrdina).
