  de: |-
    vnd auch die personen. Vnd so das brot also in das gewicht gebacken wirdt / so ist hinfurt dasselbig leichtlich mit gůter ordnung vnder die personen vnnd Regiment gleich zutheilen / So ein Prouiantherr die personen eines Regiments weyß / kan er nach der zall vnnd gewicht ein jedes Regiment abrechnen / vnd dasselbig des Regiments Prouiantmeister vberantworten / so hat derselbig Prouiantmeister dem Regiment die Prouiant vnder die Fendlin auch leichtlich gleich außzutheiln / vnd so ein jedes Fendlin einn eigen Prouiantmeister / der solche lifferung von des Regiments Prouiantmeister empfangen / hat / kan derselbig solliche lifferung den Rotmeistern vberantworten / vnd jede Rot die mag jr anzall empfangen / vnd vnder sich theilen. Also kan es gleich on vnpartheiß vnd klag zůgehn / vnd brengt gůte ordenliche rechnung / vnd so der Prouiantherr die prouiant oder das Getreyt / also im Landt hat eingenommen / soll er doch nicht desto weniger an allen orten / in Stätten vnd Dörffern / die Becker darin bei sich erfordern / mit denselbigen handeln / vnnd hören ob sie wöllen für sich selbst von jrem getreit / brot backen vnd jm liffern / auff solches gewicht / vnd vmb was gelt / vnd an einem jeden sich befragen / wieuil Brot / vnnd von was gewichts er jhm allen tag lieffern kündt oder wöl / vnnd nicht auß der Commiß / dann es haben gemeinlich die Becker kundtschafft vnd anheng mit den Baurn auff dem Landt / da sie vber jar jr getreyt vnd frucht nemen / so solliche Becker sich also würden einlassen / vnnd ein zall zů lieffern versprechen / soll der prouiantherr derselbigen Becker Obrigkeit darzů erfordern / vnd mit denselbigen beschliessen / daß sie die Becker dahin halten / daß jr zůsag oder versprechnuß gewiß sei / So der prouiantherr sein anzall bei den Beckern gewiß gemacht hat / soll er mit der Obrigkeit handeln / daß sie jm bei den Baurn vnd Furleuten / wo die mögen zu wegen bracht werden / wöllen behilfflich sein / daß dieselbigen / so vil die summa des Brots erfordert / füren / deß soll er sich mit der Obrigkeit der fuhr halben / auch gewiß machen / der tag vnd malstat da sie hin sollen faren / vergleichen / wo sie zu dem gleyt zusamen kommen / wo das ligen / vnd die prouiant angenommen wirt. Vnd so der prouiantherr das also hat verordnet / sein summa weiß / vnd hat souil daß er vermeint sein volck damit zu erhalten / soll er sein vorrat der Commiß nicht angreiffen / sonder sparn / würde aber das brot so er (wie oben gemelt) bestelt hat / sein volck nicht erhalten / soll er sein vorrath der Commiß auch souil die notturfft erfordert / angreiffen / darüber auch seine Becker vnd furleut ordnen / mann soll auch allweg da mann brot beckt / gůt achtung haben / wann mann das holt in der zeit dem prouiantherrn anzeigen
  cs: |-
    a také počet osob. Když se takto chléb peče na váhu, lze jej pak snadno a v dobrém pořádku rovnoměrně rozdělovat mezi osoby a pluky {Regiment}. Zná-li proviantní pán {Prouiantherr} počet osob v pluku, může každému pluku podle počtu a váhy vyměřit dávku a předat ji plukovnímu proviantmistrovi {Prouiantmeister}. Ten pak může proviant {Prouiant} v pluku snadno a rovnoměrně rozdělit mezi praporce {Fendlin}. Má-li každý praporec vlastního proviantmistra, který tuto dodávku převezme od plukovního proviantmistra, může ji předat rotmistrům {Rotmeistern}; každá rota {Rot} si pak převezme svůj podíl a rozdělí jej mezi sebe. Tak to může jít rovnoměrně, nestranně a bez stížností[^1] a vznikne z toho dobré a řádné účetnictví. A přestože proviantní pán takto v zemi zajistil proviant čili obilí, má přesto na všech místech, ve městech i vesnicích, povolat k sobě tamní pekaře, jednat s nimi a zjistit, zda chtějí sami ze svého obilí péci chléb a dodávat mu jej v této váze a za jakou cenu. Každého se má vyptat, kolik chleba a o jaké váze by mu mohl nebo chtěl denně dodávat – a to ne z komisu {Commiß}. Pekaři totiž obvykle mají známosti a styky se sedláky na venkově, od nichž po celý rok berou obilí. Uvolí-li se takoví pekaři a slíbí dodávat určitý počet, má proviantní pán povolat jejich vrchnost a dohodnout se s ní, aby pekaře přidržela k tomu, že jejich slib bude spolehlivý. Jakmile si proviantní pán u pekařů zajistí svůj počet, má jednat s vrchností, aby mu pomohla u sedláků a vozků {Furleuten}, kde jen je lze sehnat, aby vozili tolik, kolik vyžaduje množství chleba. S vrchností se má o povozech také pevně dohodnout a ujednat dny a shromaždiště {malstat}, kam mají jet, kde se sejdou s ochranným doprovodem, kde se bude nocovat a kde se bude proviant přebírat. Když to proviantní pán takto zařídí, zná své množství a má ho tolik, že tím podle svého soudu uživí svůj lid, nemá na zásoby komisu sahat, nýbrž je šetřit. Kdyby však chléb, který objednal (jak bylo výše řečeno), jeho lid neuživil, má sáhnout i na zásoby komisu, nakolik je třeba, a určit k tomu také své pekaře a vozky. Všude, kde se peče chléb, je také třeba dávat dobrý pozor a včas proviantnímu pánovi hlásit, kdy se [chléb] odváží[^2],
poznamky:
- n: 1
  text: |-
    V tisku (ověřeno ve skenu) *gleich on vnpartheiß vnd klag* – patrně přesmyčka za *gleich vnd vnpartheiß on klag*; překládáme podle smyslu.
- n: 2
  text: |-
    V tisku (ověřeno ve skenu) *wann mann das holt* – „když se to (chléb) odváží“; méně pravděpodobně chybně za *holtz* („dřevo“ na pečení).
