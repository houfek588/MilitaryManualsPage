  de: |-
    vnd auch die personen. Vnd so das brot also in das gewicht gebacken wirdt / so ist hinfurt dasselbig leichtlich mit gůter ordnung vnder die personen vnnd Regiment gleich zutheilen / So ein Prouiantherr die personen eines Regiments weyß / kan er nach der zall vnnd gewicht ein jedes Regiment abrechnen / vnd dasselbig des Regiments Prouiantmeister vberantworten / so hat derselbig Prouiantmeister dem Regiment die Prouiant vnder die Fendlin auch leichtlich gleich außzutheiln / vnd so ein jedes Fendlin ein eigen Prouiantmeister / der solche lifferung von des Regiments Prouiantmeister empfangen / hat / kan derselbig solliche lifferung den Rotmeistern vberantworten / vnd jede Rot die mag jr anzall empfangen / vnd vnder sich theilen. Also kan es gleich vnd vnpartheiß vnd klag zůgehn / vnd brengt gůte ordenliche rechnung / vnd so der Prouiantherr die prouiant oder das Getreyt / also im Landt hat eingenommen / soll er doch nicht desto weniger an allen orten / in Stätten vnd Dörffern / die Becker darin bei sich erfordern / mit denselbigen handeln / vnnd hören ob sie wöllen für sich selbst von jrem getreit / brot backen vnd jm liffern / auff solches gewicht / vnd vmb was gelt / vnd an einem jeden sich befragen / wieuil Brot / vnnd von was gewichts er jhm allen tag lieffern kündt oder wöl / vnnd nicht auß der Commiß / dann es haben gemeinlich die Becker kundtschafft vnd anheng mit den Baurn auff dem Landt / da sie vber jar jr getreyt vnd frucht nemen / so solliche Becker sich also würden einlassen / vnnd ein zall zů lieffern versprechen / soll der prouiantherr derselbigen Becker Obrigkeit darzů erfordern / vnd mit denselbigen beschliessen / daß sie die Becker dahin halten / daß jr zůsag oder versprechnuß gewiß sei / So der prouiantherr sein anzall bei den Beckern gewiß gemacht hat / soll er mit der Obrigkeit handeln / daß sie jm bei den Baurn vnd Furleuten / wo die mögen zu wegen bracht werden / wöllen behilfflich sein / daß dieselbigen / so vil die summa des Brots erfordert / füren / deß soll er sich mit der Obrigkeit der fuhr halben / auch gewiß machen / der tag vnd malstat da sie hin sollen faren / vergleichen / wo sie zu dem gleyt zusamen kommen / wo das ligen / vnd die prouiant angenommen wirt. Vnd so der prouiantherr das also hat verordnet / sein summa weiß / vnd hat souil daß er vermeint sein volck damit zu erhalten / soll er sein vorrat der Commiß nicht angreiffen / sonder sparn / würde aber das brot so er (wie oben gemelt) bestelt hat / sein volck nicht erhalten / soll er sein vorrath der Commiß auch souil die notturfft erfordert / angreiffen / darüber auch seine Becker vnd furleut ordnen / mann soll auch allweg da mann brot beckt / gůt achtung haben / wann mann das holt in der zeit dem prouiantherrn anzeigen
  cs: |-
    a rovněž i počet osob. A když se takto chléb upeče na váhu, lze jej nadále snadno v dobrém pořádku rozdělovat rovnoměrně mezi osoby i pluky {Regiment}: zná-li proviantní pán {Prouiantherr} počet osob v pluku, může každý pluk podle počtu a váhy spočítat a odevzdat dávku proviantmistrovi {Prouiantmeister} toho pluku; tento proviantmistr pak snadno rozdělí proviant {Prouiant} v pluku rovnoměrně mezi praporce {Fendlin}, a má-li každý praporec vlastního proviantmistra, který tuto dodávku převezme od plukovního proviantmistra, může ji předat rotmistrům {Rotmeistern} a každá rota {Rot} si může převzít svůj podíl a rozdělit jej mezi sebe. Tak to může probíhat spravedlivě, nestranně a bez stížností a dává to dobrý a řádný počet. A jakkoli proviantní pán takto v zemi převzal proviant neboli obilí, má nicméně na všech místech – ve městech i vesnicích – povolat k sobě tamní pekaře, jednat s nimi a vyslechnout, zda chtějí sami ze svého vlastního obilí péci chléb a dodávat mu jej v této váze a za jakou cenu, a každého se vyptat, kolik chleba a o jaké váze by mu mohl či chtěl denně dodávat, a nikoli z komisu {Commiß}; pekaři totiž mívají obvykle známosti a spojení se sedláky na venkově, odkud po celý rok berou své obilí. Kdyby se takoví pekaři uvolili a slíbili dodávat určitý počet, má proviantní pán povolat vrchnost oněch pekařů a dohodnout se s ní, aby pekaře přidržela k tomu, že jejich slib a závazek bude jistý. Jakmile si proviantní pán u pekařů zajistí svůj počet, má jednat s vrchností, aby mu u sedláků a vozků {Furleuten}, kde jen lze je sehnat, pomohla k tomu, aby ti vozili tolik, kolik vyžaduje množství chleba; rovněž se má s vrchností ohledně povozů jistě dohodnout na dnech a místě shromáždění {malstat}, kam mají jet, kde se sejdou s ochranným doprovodem, kde se bude tábořit a kde se bude proviant přebírat. A když to proviantní pán takto zařídí, zná své množství a má tolik, že má za to, že tím svůj lid uživí, nemá na svou zásobu komisu sahat, nýbrž ji šetřit; kdyby však chléb, jejž objednal (jak výše zmíněno), jeho lid neuživil, má sáhnout také na svou zásobu komisu, nakolik potřeba vyžaduje, a ustavit nad tím i své pekaře a vozky. Vždy tam, kde se peče chléb, je také třeba dávat dobrý pozor a včas proviantnímu pánovi hlásit, kdy se zásoby odebírají[^1],
poznamky:
- n: 1
  text: |-
    V tisku *wann mann das holt* („když se to odebírá/odváží“, tj. pekařské zásoby chleba či mouky; možná též zkrácená či chybná podoba za *holtz* „dřevo“ na pečení).
