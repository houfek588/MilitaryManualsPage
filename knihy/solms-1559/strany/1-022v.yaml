bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    auch allem anderen vnbillichem gewalt / vnnd also desto lieber vnd mehr zufüren mögen.
  cs: |-
    ani žádným jiným bezprávným násilím, aby tak mohli přivážet tím raději a hojněji.
- typ: odstavec
  de: |-
    Vnd so als dann der Prouiantherr sein Prouiant also bei einander hat / soll er der Regiment Prouiantmeister zu sich erfordern / die Prouiant vnder sie theilen / einem jeden sein theil vnd gebür lieffern / darnach vil oder wenig da ist / vnd einem jeden Prouiantmeister sein zugeordnete Prouiant auff seines Quartirs vnd Regiments Prouiantplatz füren lassen / solliche soll er mit dem Veldmarschalck vnnd den Prouosen schetzen / darbei soll es in allen Legern bleiben / darauff der vnder Veldmarschalck fleissig achtung geben soll / daß es die Prouosen auch darbei bleiben lassen.
  cs: |-
    Jakmile pak má proviantní pán {Prouiantherr} proviant {Prouiant} takto pohromadě, má k sobě povolat proviantmistry {Prouiantmeister} jednotlivých pluků {Regiment}, rozdělit mezi ně proviant a každému vydat jeho díl a podíl podle toho, zda je ho mnoho, či málo. Každému proviantmistrovi pak má nechat jeho přidělený proviant odvézt na proviantní tržiště {Prouiantplatz} jeho kvartýru {Quartirs} a pluku. Cenu proviantu má stanovit spolu s polním maršálkem {Veldmarschalck} a profousy {Prouosen} a při tomto ocenění má ve všech leženích {Legern} zůstat. Podmaršálek {vnder Veldmarschalck} má pilně dbát, aby se ho drželi i profousové.
- typ: odstavec
  de: |-
    Würden aber etwan eigene Leut bestelt haben / die jhnen zufüren sollen / oder daß es auß seiner Landtschafft keme auff sein bestellung / dieselbig / dieweil sie nicht von dem Prouiantherrn bestelt / sollen nit von jhm noch von den seinen auff sein prouiantplatz zufarn getrungen sein / sonder sie frei lassen.
  cs: |-
    Objednal-li by si však někdo[^1] vlastní lidi, kteří mu mají dovážet, anebo by mu něco přicházelo na jeho objednávku z jeho země, ti nemají být – poněvadž je neobjednal proviantní pán – nuceni ani jím, ani jeho lidmi jezdit na jeho proviantní tržiště; je třeba ponechat jim volnost.
- typ: odstavec
  de: |-
    Deßgleichen die Körbler vnd so vberrück tragen / soll mann auch frei gehn lassen zu wem sie wöllen / da sie vermeinen wolgehalten zu werden.
  cs: |-
    Stejně tak je třeba nechat košíkáře a ty, kdo nosí zboží na zádech[^2], volně chodit, ke komu chtějí, tam, kde očekávají dobré zacházení.
- typ: odstavec
  de: |-
    Vnd was also frei von sich selber kompt / es seien wagen / zu roß odder fuß / soll mann lassen faren vnd handeln wo sie wöllen / doch daß solliche Prouiant wie die andern / billicher weiß geschetzt werde.
  cs: |-
    Vše, co takto přichází volně samo od sebe – ať s vozy, na koni, či pěšky –, je třeba nechat jezdit a obchodovat, kde chtějí; jen ať se takový proviant stejně jako ostatní spravedlivě ocení.
- typ: odstavec
  de: |-
    Dises mit kurtzem von der Prouiant geredt / welliche volnkommene versehung im Bůch der Ampter / wie auch hieoben vermelt / nach leng außgefürt wirt.
  cs: |-
    Tolik krátce o proviantu; jeho úplné zajištění je, jak bylo zmíněno již výše, zevrubně vyloženo v Knize úřadů.
- typ: odstavec
  de: |-
    Dieweil dann auff die Prouiant die versehung der Artolorei billich gehen soll / dann sie im Krieg die ernstlichste vnd die gewaltigste stuck ist / vnd im 1552. vnd 53. Jar sampt andern Kriegßhandlungen / nicht gnůgsam versehen gewesen / so hab ich jhr ein eigen Bůch gemacht / vnd solches an disem ort sonder ferrner daruon zuschreiben / anzuzeigen dienstlich gemeint / Dann einem Herren welcher einen Krieg füret oder füren will / gar hoch daran gelegen ist / dann mann kan ehr vnd vil darunder erlangen vnd gewinnen / vnd in gleichem fall / so mag mann auch grossen schaden darmit leiden vnd schand erlangen.
  cs: |-
    Po proviantu má právem následovat zajištění dělostřelectva {Artolorei}, neboť to je ve válce nejvážnější a nejmocnější složka, a v letech 1552 a 1553 nebylo stejně jako jiné válečné záležitosti dostatečně zajištěno[^3]. Proto jsem o něm sepsal zvláštní knihu a pokládal jsem za užitečné to na tomto místě oznámit, aniž bych o něm dále psal. Pánovi, který vede nebo chce vést válku, na tom totiž velmi záleží: může jím získat čest a mnoho dobrého, ale stejně tak jím může utrpět velikou škodu a utržit hanbu.
- typ: odstavec
  de: |-
    Deßgleichen so ist noch ein versehung zum Krieg / so mann ein Schloß oder Statt mit allem ernst angreiffen vnd nöttigen will / als in dem vndergraben vnnd sprengen / welliche versehung auch dem Zeugmeister zugehörig / Daruon ich dann ein besonder Bůch
  cs: |-
    Dále je tu ještě jedno válečné zajištění pro případ, že se má nějaký hrad či město se vší vážností napadnout a přinutit ke vzdání, totiž podkopávání a odstřelování; i to přísluší zbrojmistrovi {Zeugmeister}. Také o tom jsem zvláštní knihu
poznamky:
- n: 1
  text: |-
    V předloze je před *etwan* vypuštěn podmět (např. jednotliví velitelé, páni či pluky).
- n: 2
  text: |-
    Něm. *die Körbler vnd so vberrück tragen* – drobní trhovci a podomní prodejci přinášející potraviny do ležení v koších a nůších na zádech.
- n: 3
  text: |-
    Narážka na válku říšských knížat proti císaři Karlu V. (1552) a na neúspěšné císařovo obléhání Mét (1552–1553). O dělostřelectvu a zbrojnici pojednává Solms ve [[3-titul|Třetí knize]].
