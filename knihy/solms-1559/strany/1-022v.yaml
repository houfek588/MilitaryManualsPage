bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    auch allem anderen vnbillichem gewalt / vnnd also desto lieber vnd mehr zufüren mögen.
  cs: |-
    a jakémukoli jinému bezprávnému násilí, aby tak přiváželi tím raději a ve větším množství.
- typ: odstavec
  de: |-
    Vnd so als dann der Prouiantherr sein Prouiant also bei einander hat / soll er der Regiment Prouiantmeister zu sich erfordern / die Prouiant vnder sie theilen / einem jeden sein theil vnd gebür lieffern / darnach vil oder wenig da ist / vnd einem jeden Prouiantmeister sein zugeordnete Prouiant auff seines Quartirs vnd Regiments Prouiantplatz füren lassen / solliche soll er mit dem Veldmarschalck vnnd den Prouosen schetzen / darbei soll es in allen Legern bleiben / darauff der vnder Veldmarschalck fleissig achtung geben soll / daß es die Prouosen auch darbei bleiben lassen.
  cs: |-
    A jakmile pak má proviantní pán {Prouiantherr} svůj proviant {Prouiant} takto pohromadě, má k sobě povolat proviantmistry {Prouiantmeister} jednotlivých pluků {Regiment}, proviant mezi ně rozdělit a každému dodat jeho díl a podíl podle toho, zda je ho mnoho či málo, a každému proviantmistrovi nechat jeho přidělený proviant odvézt na proviantní tržiště {Prouiantplatz} jeho kvartýru {Quartirs} a pluku. Ten má spolu s polním maršálkem {Veldmarschalck} a profousy {Prouosen} ocenit, a při tom má ve všech leženích {Legern} zůstat; na to má podmaršálek {vnder Veldmarschalck} pilně dohlížet, aby u toho zůstávali i profousové.
- typ: odstavec
  de: |-
    Würden aber etwan eigene Leut bestelt haben / die jhnen zufüren sollen / oder daß es auß seiner Landtschafft keme auff sein bestellung / dieselbig / dieweil sie nicht von dem Prouiantherrn bestelt / sollen nit von jhm noch von den seinen auff sein prouiantplatz zufarn getrungen sein / sonder sie frei lassen.
  cs: |-
    Objednal-li by si však někdo[^1] vlastní lidi, kteří mu mají dovážet, anebo by to přicházelo z jeho země na jeho objednávku, ti – poněvadž nebyli najati od proviantního pána – nemají být ani od něho, ani od jeho lidí nuceni jezdit na jeho proviantní tržiště, nýbrž je třeba jim nechat volnost.
- typ: odstavec
  de: |-
    Deßgleichen die Körbler vnd so vberrück tragen / soll mann auch frei gehn lassen zu wem sie wöllen / da sie vermeinen wolgehalten zu werden.
  cs: |-
    Rovněž košíkáře a ty, kdo nosí zboží na zádech[^2], je třeba nechat volně chodit, ke komu chtějí, kde se domnívají, že s nimi bude dobře jednáno.
- typ: odstavec
  de: |-
    Vnd was also frei von sich selber kompt / es seien wagen / zu roß odder fůß / soll mann lassen faren vnd handeln wo sie wöllen / doch daß solliche Prouiant wie die andern / billicher weiß geschetzt werde.
  cs: |-
    A vše, co takto přichází dobrovolně samo od sebe – ať už s vozy, na koních či pěšky –, má se nechat jezdit a obchodovat, kdekoli chtějí, avšak tak, aby takový proviant byl stejně jako ostatní spravedlivě oceněn.
- typ: odstavec
  de: |-
    Dises mit kurtzem von der Prouiant geredt / welliche volnkommene versehung im Bůch der Ampter / wie auch hieoben vermelt / nach leng außgefürt wirt.
  cs: |-
    Tolik krátce řečeno o proviantu, jehož úplné opatření je zevrubně vyloženo v Knize úřadů, jak již bylo výše zmíněno.
- typ: odstavec
  de: |-
    Dieweil dann auff die Prouiant die versehung der Artolorei billich gehen soll / dann sie im Krieg die ernstlichste vnd die gewaltigste stuck ist / vnd im 1552. vnd 53. Jar sampt andern Kriegßhandlungen / nicht gnůgsam versehen gewesen / so hab ich jhr ein eigen Bůch gemacht / vnd solches an disem ort sonder ferrner daruon zuschreiben / anzuzeigen dienstlich gemeint / Dann einem Herren welcher einen Krieg füret oder füren will / gar hoch daran gelegen ist / dann mann kan ehr vnd vil darunder erlangen vnd gewinnen / vnd in gleichem fall / so mag mann auch grossen schaden darmit leiden vnd schand erlangen.
  cs: |-
    Poněvadž pak po proviantu má po právu následovat opatření dělostřelectva {Artolorei} – neboť to je ve válce nejzávažnější a nejmocnější složka, a v letech 1552 a 1553 nebylo spolu s dalšími válečnými podniky dostatečně zajištěno[^3] –, sepsal jsem o něm zvláštní knihu a pokládal jsem za užitečné na tomto místě to oznámit, aniž bych o něm zde dále psal. Neboť pánovi, který vede nebo chce vést válku, na tom velmi záleží: může jím získat a dobýt čest i mnoho prospěchu, a stejně tak jím může utrpět velikou škodu a utržit hanbu.
- typ: odstavec
  de: |-
    Deßgleichen so ist noch ein versehung zum Krieg / so mann ein Schloß oder Statt mit allem ernst angreiffen vnd nöttigen will / als in dem vndergraben vnnd sprengen / welliche versehung auch dem Zeugmeister zugehörig / Daruon ich dann ein besonder Bůch
  cs: |-
    Stejně tak jest ještě jedno válečné opatření pro případ, když chce člověk s veškerou vážností napadnout a sevřít nějaký hrad či město, totiž podkopávání a vyhazování do povětří, kteréžto opatření rovněž přísluší zbrojmistrovi {Zeugmeister}; o tom jsem pak zvláštní knihu
poznamky:
- n: 1
  text: |-
    V předloze je před *etwan* vypuštěn podmět (např. jednotliví velitelé, páni či pluky).
- n: 2
  text: |-
    Něm. *die Körbler vnd so vberrück tragen* – drobní trhovci a podomní prodejci přinášející potraviny do ležení v koších a nůších na zádech.
- n: 3
  text: |-
    Narážka na válečné tažení říšských knížat proti císaři Karlu V. a následné obléhání Mét (1552–1553); o dělostřelectvu pojednává Solms samostatně ve Třetí knize (*Von der Artollerei*).
