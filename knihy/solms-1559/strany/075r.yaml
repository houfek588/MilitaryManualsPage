bloky:
- typ: nadpis
  uroven: 3
  de: Von den Fürern.
  cs: O vůdcích {Fürern}.
- typ: odstavec
  de: |-
    DIe Fürer bleiben gewönlich alweg bei den Knechten/ vnd fürhen sie auff den weg biß in das Leger in jr Quarttier oder biß der Forirer kompt.
  cs: |-
    Vůdcové zůstávají obvykle vždy u knechtů {Knechten} a vedou je cestou až do ležení {Leger} do jejich kvartýru {Quarttier}, nebo dokud nepřijde furýr {Forirer}.
- typ: odstavec
  de: |-
    Die Fürer werden gleich den erst gemelten Weibeln vom gemeinen man monatlich entsetzt/ gehörn auch mit jrer bezalung vnder die Hauptleut.
  cs: |-
    Vůdce stejně jako prve zmíněné šikovatele {Weibeln} obec {gemeinen man} každý měsíc sesazuje; svým žoldem rovněž náležejí pod hejtmany {Hauptleut}.
- typ: nadpis
  uroven: 3
  de: Von den Forierern.
  cs: O furýrech.
- typ: odstavec
  de: |-
    DIe Forirer wann sie jr Quarttier von dem Quartiermeister empfangen haben/ warten sie biß jre Fendlein kommen/ alß dann fürt er erstlich den Hauptman darnach den Fendrich in jr Losament/ volgents die Rotten nach einander.
  cs: |-
    Jakmile furýři převezmou svůj kvartýr od kvartýrmistra {Quartiermeister}, čekají, až dorazí jejich praporce {Fendlein}; potom každý uvede do ubytování {Losament} nejprve hejtmana, pak praporečníka {Fendrich} a nakonec jednu rotu {Rotten} po druhé.
- typ: odstavec
  de: |-
    Die Forierer warten sonst auch auff jre Hauptleut/ wann sie jr bedörffen im Leger oder im zug/ die Forierer werden auch vom gemeinen mann gesetzt vnd entsetzt/ vnd von jren Hauptleutten bezalt.
  cs: |-
    Furýři jsou jinak také k ruce svým hejtmanům, když jich potřebují v ležení nebo na pochodu {zug}. I furýry obec dosazuje a sesazuje a platí je jejich hejtmani.
