bloky:
- typ: odstavec
  de: |-
    VOr das erst soll einer Gottßförchtig sein vnd denselbigen vor augen haben / alle sein thůn / vorhaben vnd werck in Gottes namen anfahen vnd füren / zum andern / soll er sich hüten für der schendtlichen Gotteslesterung / die ist zu nichts gůt dann Gott vergeblich auß leichtfertigkeit vnnd einer schendtlichen bösen gewonheit zuerzörnen / darmit keinem nicht geholffen ist / noch nichts damit erlangen noch außrichten kan / er ist nicht desto weiser / anschlägiger noch gůts raths / er schlecht nicht desto härter / er ist nicht desto stercker / mann förchtet jn nit desto mehr / vnd ist zu nicht gůt dann Gott zu erzörn / vnd daß er leichtfertig dardurch erkant vnd geacht wirt / dann zugedencken vnd zuuerstehn ist / wann er Gott also hoch erzörnet / durch auffhebung vnd verschwerung seines bittern schweren leidens / so er vor vns gethan / vnd von dem ewigen todt erlöst hat / daß einer der nit allein vndanckbar ist / sonder vergeblich schwert / das doch Gott im andern Gebot der ersten Tafeln so hoch verbeut / Auch ist wol zu dencken wann ich Gottes zorn so gering acht / was gnaden / trost vnd hilff von Gott ich inn meinen nöten haben kan / noch zu hoffen odder zu trösten haben mag / ob auch meine sachen glücklich odder wol gehn mögen / besonder inn Kriegs handlungen da einer der gefahr / sterben vnd andern schwerlichen händeln nach zeucht / vnd darinn ist vnd arbeit / ob einer nit Gots gnad / trost vnd hilff bedürfftig sei in solcher zeit vnd gefahr / da einem sein Seel / ehr / gůt vnd alle wolfart auff steht / das will ich einem das erst vnd höchst bedencken sein lassen.
  cs: |-
    Za prvé má být člověk bohabojný a mít Boha před očima; všechno své počínání, záměry a skutky má začínat a vést ve jménu Božím. Za druhé se má vystříhat hanebného rouhání, které není k ničemu jinému než k tomu, aby z lehkomyslnosti a ze zlého, hanebného zvyku zbytečně hněvalo Boha. Nikomu tím není pomoženo a nikdo tím nic nezíská ani nepořídí: rouhač není o nic moudřejší, důvtipnější ani lepší v radě, nebije o nic tvrději, není o nic silnější a nikdo se ho nebojí víc. Je to dobré jen k tomu, aby rozhněval Boha a aby ho lidé poznali a měli za lehkomyslného. Je totiž třeba uvážit a pochopit, že kdo Boha tak těžce hněvá tím, že se dovolává jeho hořkého a těžkého utrpení, které pro nás podstoupil, když nás vykoupil z věčné smrti, a zaklíná se jím, ten je nejen nevděčný, ale také přísahá nadarmo, což přece Bůh ve druhém přikázání první desky[^1] tak přísně zakazuje. Také je dobré pomyslet: beru-li Boží hněv tak na lehkou váhu, jaké milosti, útěchy a pomoci se mohu od Boha ve svých nesnázích dočkat, v co mohu doufat a čím se těšit a zda se mé věci mohou šťastně a dobře dařit – zvláště ve válečných podnicích, kde člověk táhne za nebezpečím, smrtí a jinými těžkými věcmi a žije a pracuje uprostřed nich. Nepotřebuje snad člověk Boží milost, útěchu a pomoc v takové době a nebezpečí, kdy jde o jeho duši, čest, statek a veškeré blaho? To chci každému dát k uvážení jako první a nejvyšší věc.
- typ: odstavec
  de: |-
    Zum dritten wann einer ein Kriegßman sein will in ehrlichen vnd ritterlichen dingen / vnd vmb lerens willen außzeucht odder ziehen wil / dann soll er sehen daß er gůt Knecht oder Diener hab / die nicht Gottßlesterer noch allezeit volle / trunckne Leut seien / deßgleichen soll er sich mit gůten pferden vnd Harnisch rösten / dann hat er Knecht die Gottes lesterer vnd trunckene leut seind / so ist eben gleich die beschwerung widerumb da bei jnen / das sich keins glücks noch wolfart zuuerhoffen ist / wie daruon mehr vermelt / hat er gůt pferde vnd Rüstung so kan er vor den Feinden desto statlicher vnnd ehrlicher handeln vnd sein ehr verwaren / hat einer zu nichtig Knecht vnd pferd / so kan einer dardurch wie gůt sein gemüt ist / in schand vnd schaden kommen / Darumb hüt sich einer für losem gesindt / vnd laß sich den geitz nit vbertragen / das er mit liederlichem gesind sich reich machen wöl / sein Herrn betriegen / seiner pflicht vergessen / vnd sich in gefahr
  cs: |-
    Za třetí: chce-li být někdo válečníkem {Kriegßman} v čestných a rytířských věcech a táhne-li nebo chce-li táhnout do pole, aby se učil, má dbát, aby měl dobré pacholky či služebníky, kteří nejsou rouhači ani ustavičně opilí. Stejně tak se má vystrojit dobrými koňmi a zbrojí {Harnisch}.[^2] Má-li totiž pacholky, kteří jsou rouhači a opilci, tíží ho u nich zase totéž a nelze doufat v žádné štěstí ani zdar, jak bylo řečeno výše. Má-li dobré koně a výzbroj {Rüstung}, může před nepřítelem jednat tím zdatněji a čestněji a uchránit svou čest. Má-li však pacholky a koně k ničemu, může tím upadnout do hanby a škody, ať je jeho mysl sebelepší. Proto ať se každý vystříhá špatné čeládky a nedá se přemoci lakotou, aby chtěl na bídné čeládce zbohatnout, podvádět svého pána, zapomínat na svůj závazek {pflicht} a do nebezpečí se
poznamky:
- n: 1
  text: |-
    Podle luterského i katolického dělení Desatera zakazuje druhé přikázání první desky brát jméno Boží nadarmo (Ex 20,7; Dt 5,11).
- n: 2
  text: V tisku *rösten* za *rüsten* („vystrojit“).
