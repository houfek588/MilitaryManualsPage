bloky:
- typ: odstavec
  de: |-
    VOr das erst soll einer Gottsförchtig sein vnd denselbigen vor augen haben / alle sein thůn / vorhaben vnd werck in Gottes namen anfahen vnd füren / zum andern / soll er sich hüten für der schendtlichen Gotteslesterung / die ist zu nichts gůt dann Gott vergeblich auß leichtfertigkeit vnnd einer schendtlichen bösen gewonheit zuerzörnen / darmit keinem nicht geholffen ist / noch nichts damit erlangen noch außrichten kan / er ist nicht desto weiser / anschlägiger noch gůts raths / er schlecht nicht desto härter / er ist nicht desto stercker / mann förchtet jn nit desto mehr / vnd ist zu nicht gůt dann Gott zu erzörn / vnd daß er leichtfertig dardurch erkant vnd geacht wirt / dann zugedencken vnd zuuerstehn ist / wann er Gott also hoch erzörnet / durch auffhebung vnd verschwerung seines bittern schweren leidens / so er vor vns gethan / vnd von dem ewigen todt erlöst hat / daß einer der nit allein vndanckbar ist / sonder vergeblich schwert / das doch Gott im andern Gebot der ersten Tafeln so hoch verbeut / Auch ist wol zu dencken wann ich Gottes zorn so gering acht / was gnaden / trost vnd hilff von Gott ich inn meinen nöten haben kan / noch zu hoffen odder zu trösten haben mag / ob auch meine sachen glücklich odder wol gehn mögen / besonder inn Kriegs handlungen da einer der gefahr / sterben vnd andern schwerlichen händeln nach zeucht / vnd darinn ist vnd arbeit / ob einer nit Gots gnad / trost vnd hilff bedürfftig sei in solcher zeit vnd gefahr / da einem sein Seel / ehr / gůt vnd alle wolfart auff steht / das will ich einem das erst vnd höchst bedencken sein lassen.
  cs: |-
    Za prvé má být člověk bohabojný a mít Boha před očima, všechno své počínání, záměry a skutky začínat a vést ve jménu Božím. Za druhé se má vystříhat hanebného rouhání Bohu, jež není k ničemu dobré než k tomu, aby zbytečně z lehkomyslnosti a z hanebného zlého zvyku hněvalo Boha, čímž nikomu není pomoženo ani tím nelze nic získat či pořídit – není tím nikdo ani moudřejší, ani vynalézavější či dobré rady, nebije tím silněji, není tím mocnější, ani se ho lidé nebojí více, a není to k ničemu dobré než hněvat Boha a být tím pokládán a uznáván za lehkomyslného. Neboť je třeba uvážit a pochopit, když někdo Boha tak velice hněvá tím, že zneužívá a zaklíná se jeho hořkým těžkým utrpením, které pro nás podstoupil a vykoupil nás z věčné smrti, že takový člověk je nejen nevděčný, nýbrž nadarmo přísahá, což přece Bůh ve druhém přikázání první desky[^1] tak přísně zakazuje. Také si je třeba dobře pomyslet: beru-li Boží hněv tak na lehkou váhu, jaké milosti, útěchy a pomoci od Boha mohu dosáhnout ve svých tísních, či v jakou mohu doufat a z ní se těšit, a zda se mé věci mohou šťastně a dobře dařit – zvláště ve válečném konání, kde člověk táhne za nebezpečím, smrtí a jinými těžkými věcmi, v nichž žije a pracuje –, zda člověk nepotřebuje Boží milost, útěchu a pomoc v takové chvíli a nebezpečí, kdy jde člověku o duši, čest, statek a veškeré blaho. To chci každému zanechat jako první a nejvyšší rozjímání.
- typ: odstavec
  de: |-
    Zum dritten wann einer ein Kriegßman sein will in ehrlichen vnd ritterlichen dingen / vnd vmb lerens willen außzeucht odder ziehen wil / dann soll er sehen daß er gůt Knecht oder Diener hab / die nicht Gottslesterer noch allezeit volle / trunckne Leut seien / deßgleichen soll er sich mit gůten pferden vnd Harnisch rüsten / dann hat er Knecht die Gottes lesterer vnd trunckene leut seind / so ist eben gleich die beschwerung widerumb da bei jnen / das sich keins glücks noch wolfart zuuerhoffen ist / wie daruon mehr vermelt / hat er gůt pferde vnd Rüstung so kan er vor den Feinden desto statlicher vnnd ehrlicher handeln vnd sein ehr verwaren / hat einer zu nichtig Knecht vnd pferd / so kan einer dardurch wie gůt sein gemüt ist / in schand vnd schaden kommen / Darumb hüt sich einer für losem gesindt / vnd laß sich den geitz nit vbertragen / das er mit liederlichem gesind sich reich machen wöl / sein Herrn betriegen / seiner pflicht vergessen / vnd sich in gefahr
  cs: |-
    Za třetí, chce-li být někdo válečníkem {Kriegßman} v čestných a rytířských věcech a táhne nebo chce táhnout do pole, aby se učil, tehdy má dbát, aby měl dobré pacholky či služebníky, kteří nejsou rouhači ani ustavičně opilí, zpití lidé; stejně tak se má vybavit dobrými koňmi a zbrojí {Harnisch}. Neboť má-li pacholky, kteří jsou rouhači a opilci, je u nich hned zase totéž břímě, takže nelze doufat v žádné štěstí ani zdar, jak bylo výše řečeno; má-li však dobré koně a výzbroj {Rüstung}, může před nepřáteli jednat tím skvěleji a čestněji a zachovat svou čest. Má-li kdo pacholky a koně k ničemu, může tím, jakkoli je jeho mysl dobrá, upadnout v hanbu a škodu. Proto nechť se člověk vystříhá špatné čeládky a nedá se přemoci lakomstvím, aby se chtěl na bídné čeládce obohacovat, svého pána podvádět, zapomínat na svůj závazek {pflicht} a do nebezpečí se
poznamky:
- n: 1
  text: |-
    Podle tradičního dělení Desatera (luterského i katolického) zakazuje druhé přikázání první desky zneužívat jméno Boží nadarmo (Ex 20,7; Dt 5,11).
