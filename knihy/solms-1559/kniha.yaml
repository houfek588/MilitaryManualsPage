id: solms-1559
nazev: Válečný popis a řád válečné správy
nazev_orig: Dises Buch vnd Kriegsbeschreibung ist vermelten vnd berichten einer guten ordentlichen Kriegsregierung
podtitul: 'nach alter Teutschen ordnung gebrauch vnd herkomen mit andern noch Büchern von aller Kriegsregierung vnd Rüstung so zu dem Krieg gehört (Das ander Buch: Beschreibung der viervndzwentzigsten Kriegßämpter)'
autor: Reinhard hrabě ze Solmsu
autor_zivot: 1491–1562
vydani: Lich, vlastní tiskárna hraběte Reinharda ze Solmsu, 1559
rok: 1559
vd16: VD16 R 938
katalog: VD16 R 938
rozsah: '[1], 87 listů (Druhá kniha v rámci souborného tisku), 2°'
jazyk_orig: raná nová horní němčina
popis: >-
  Druhá kniha monumentálního válečného díla říšského hraběte Reinharda ze Solmsu popisuje
  dvacet čtyři vojenských úřadů starého německého vojenství z dob císaře Maxmiliána I.
  (válečný pán, nejvyšší polní hejtman, polní maršálek, nejvyšší zbrojmistr, proviantní pán,
  plukovník pěchoty, profous, soud, posádka aj.), včetně žoldů, služebních listů a artikulního listu.
prekladatel: Pracovní překlad části knihy z Google Docs revidovaný a doplněný s pomocí LLM, 2026.
strankovani: folio
strany_poznamka: >-
  Edice obsahuje hlavní titulní list svazku (sken 9) a úplnou Druhou knihu (skeny 90–248),
  číslovanou arabskou foliací po listech (1–87): r = líc, v = rub. V řadě listů edice jsou
  vynechána čísla 5 (rozkládací tabule na skenu 102; sken 101 je její prázdný líc), 30 (list 031r
  na skenu 151 má v tisku číslo 30 a následující list 032r číslo 32, takže v tisku je přeskočeno
  číslo 31), 33, 47, 51, 56, 58, 63, 68, 70 (sken 215 je prázdný líc, sken 216 celostránkový
  dřevořez rubu 070v) a 77; listy 29, 31, 41 a 81 mají v tisku čísla 27, 30, 42 a 82, text
  a kustody však plynule navazují.
