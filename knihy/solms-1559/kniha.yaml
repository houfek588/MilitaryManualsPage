    `drabant`; *Steckenknecht* → `profousův pacholek`; *Stockmeister* → `žalářník`;
    *Nachrichter / Scharpffrichter* → `kat`; *Feldscherer* → `ranhojič`; *Prouiantmeister* →
    `proviantmistr`; *Lantsknecht* → `lancknecht`; *Doppelsöldner / Toppelfoldner* → `dvojžoldnéř`;
