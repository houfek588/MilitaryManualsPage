poznamky_k_prekladu: |
  ZDROJ ORIGINÁLU: německý text vychází z OCR digitalizace BSB München (`zdroje/ocr_bsb/NNNN.txt`,
  bsb00085168), které je nutné opravovat podle stažených náhledů skenů (`sNNN.jpg`) při zachování
  dobového pravopisu tisku (`vnd`, `auff`, `Lantsknecht`, `Prouoß`, `Reutter`). Rozdělená slova přes
  přelom stran přesuň celá na stranu, kde končí; záhlaví (*Das ander Buch.*, *Von beschreibung der
  24. Kriegsämpter.*), signatury archů a kustody vynech.

  STRUKTURA NADPISŮ:
  - uroven: 1 = hlavní titulní listy (`titul-svazek`, `titul`).
  - uroven: 2 = hlavní kapitoly válečných úřadů a řádů (např. *Oberster Kriegsherr*, *Oberster
    Feldhauptman*, *Von des Feldmarschalcks ampt*, *Von dem obersten Zeugmeister Ampt*, *Oberst
    Prouiantherr*, *Oberster vber alle Reutter*, *Von des Oberster ampt vber das Fußuolck*,
    *Artickelsbriff der Lantsknecht*, *Ordnung einer Besatzung*, *Gerichtsordnung der Lantsknecht*).
  - uroven: 3 = podkapitoly a dílčí oddíly (*Vom Obersten Prouofen ampt*, *Von der Lantskneckt
    Hauptleut*, *Commis Ordnung* atd.).

