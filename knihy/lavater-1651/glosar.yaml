# Glosář a věcný rejstřík – Lavater, Kriegs-Büchlein (1651)
# Formát a pravidla jako u knihy fronsberger-1564 (viz její glosar.yaml a PRAVIDLA_PREKLADU.md).
# Základ převzat z glosáře Fronspergera (jednotná terminologie obou knih), doplněny termíny opevňování 17. století.

kategorie:
  velitele: Velitelé a úřady
  jednotky: Vojsko, jednotky a šiky
  delostrelectvo: Dělostřelectvo a munice
  zbrane: Zbraně a výstroj
  opevneni: Ležení, opevnění a obléhání
  pravo: Vojenské právo a soudnictví
  zold: Žold, peníze a zásobování
  sluzba: Služba, stráže a pochod
  osoby: Osoby
  mista: Místa a národy
  miry: Míry, váhy a mince
# Německé tvary, které se nemají propojovat s heslem, ač se z glosáře odvodí koncovkou
# (build k tvarům z glosáře doplňuje pádové koncovky; Massen = měrky na prach, ne máz).
bez_odkazu: [Massen]

