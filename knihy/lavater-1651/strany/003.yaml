strana: recto
sken: 37
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    mögen. Sie hat jnnwendig wenig docierung oder schräge/ vnd eben auff sechs schuh zween schuh.
  cs: |-
    Uvnitř má jen malý sklon {docierung} neboli šikminu, a to právě dvě stopy na šest stop.
- typ: nadpis
  uroven: 2
  de: Wie die Brustwehr beschaffen seyn solle.
  cs: Jaká má být předprseň.
- typ: odstavec
  de: |-
    Sie soll 6 schuh hoch seyn/ vnd von vngefahr 2. schuh gegen dem Graben jhren ablauff oder schräge nemmen/ weil man besser mit dem Geschütz vndersich langen mag: doch solle sie nicht zu vil schräg seyn/ damit sie nicht oben zu schwach werde: vnd jnsonderheit nicht zu wenig schräg/ damit man den Feind in dem Graben vnd bedeckten weg sehen vnd entdecken möge/ vnd ist derselben aussere schräge der schräge des Wals gleich: die jnner aber hat auff drey schuh einen zur abdachung/ vnd ist jhr fuß von 12. biß in 24. schuh dick/ je nach dem es ein Vestung ist: die aber weniger seind/ gehören vnder die Feldschantzen.
  cs: |-
    Předprseň {Brustwehr} má být 6 stop vysoká a k příkopu se svažovat neboli klonit asi o 2 stopy, protože tak lze s děly lépe dosáhnout dolů. Nemá však být skloněná příliš, aby nebyla nahoře příliš slabá, a zvláště ne příliš málo, aby bylo možno nepřítele v příkopu a na kryté cestě {bedeckten weg} vidět a odhalit. Její vnější šikmina se rovná šikmině valu, vnitřní má na tři stopy jednu stopu sklonu. Pata předprsně je silná 12 až 24 stop podle toho, jaká je to pevnost; [předprsně] slabší patří k polním šancím {Feldschantzen}.
- typ: nadpis
  uroven: 2
  de: Was die Courtine seye.
  cs: Co je kurtina.
- typ: odstavec
  de: |-
    Sie ist die grade linien oder strich zwischen zweyen Bollwercken oder Flancken/ vnd ist jhr länge in einer Realvestung 36. schuh lang.
  cs: |-
    Kurtina {Courtine} je přímá linie neboli čára mezi dvěma baštami {Bollwercken} či flankami {Flancken}; v královské pevnosti {Realvestung} je dlouhá 36 stop.[^1]
- typ: nadpis
  uroven: 2
  de: Was die Streychwehr oder Flancken seye.
  cs: Co je boční obrana neboli flanka.
- typ: odstavec
  de: |-
    Die Streychwehr wird auch flügel/ axel oder schulter genannt/ vnd ist das perpendicular oder die senckelrechte linien/ so auff die Courtine gezogen/ allwo sie die käl-linien berührt: jhr namm entspringt von jhrem Ampt/ dann von jhren werden die Bollwerck/ der Graben/ vnd des Grabenslauff bestrichen vnd flanckiert. Jhr länge ist von 10. biß in 12. ruhten/ vnd solle also beschaffen seyn/ damit sie jhre Courtine beschirmen möge.
  cs: |-
    Boční obrana {Streychwehr} se nazývá též křídlo, paždí neboli rameno; je to kolmice {perpendicular} čili olovnicová přímka vztyčená na kurtinu v místě, kde se jí dotýká linie hrdla {käl-linien}. Jméno má podle svého úkolu, neboť se z ní ostřelují a z boku pokrývají {bestrichen vnd flanckiert} bašty, příkop a průběh příkopu. Je dlouhá 10 až 12 prutů {ruhten} a má být udělána tak, aby mohla chránit svou kurtinu.
- typ: nadpis
  uroven: 2
  de: Was die Affter oder Hinderstreych seye.
  cs: Co je zadní obrana.
- typ: odstavec
  de: |-
    Die Affter oder Hinderstreych heißt auch secund-flanck/ ist wider ein stuck der Courtine, so von der Streychwehr zum puncten lauffet/ darauß das gesicht des Bollwercks mag gezogen vnd bestrichen werden: vnd je länger die Affterstreych/ je besser sie zu verthädigung der Veste/ dann sie mehr Soldaten vnd fewr fasset: doch müssen sie dergestalten genommen werden/ daß es die eck erleiden/ vnd die Bollwerck nicht zu gar spitzig fallen: vnd ist man solcher Affterstreychen hoch von nöhten/ dann sonst wo die Flanck vom Feind verderbet wurde/ hette er keinen widerstand mehr/ vnd wurde man von jhme zur auffgebung der Vestung getrungen.
  cs: |-
    Zadní obrana {Affter oder Hinderstreych} se nazývá též druhá flanka {secund-flanck};[^2] je to zase kus kurtiny, který vede od flanky k bodu, z něhož lze vést [linii] k čelu bašty a čelo ostřelovat. Čím delší je zadní obrana, tím lépe slouží k hájení pevnosti, neboť pojme více vojáků a palby; musí se však vyměřit tak, aby to úhly snesly a bašty nevyšly příliš ostré. Takových zadních obran je velice zapotřebí, neboť kdyby jinak nepřítel zničil flanku, neměl by už před sebou žádný odpor a donutil by [obránce] pevnost vydat.
- typ: nadpis
  uroven: 2
  de: Von den Gesichtlinien/ grossen Streychwinckeln oder Flancken.
  cs: O čelech bašt {Gesichtlinien}, velkých obranných úhlech {Streychwinckeln} neboli flankách.
- typ: odstavec
  de: |-
    Wann auß dem puncten/ da sich die Affterstreych endet/ vber das ausser ende vnd der Streychwehr oder Flanck/ linien gezogen werden/ welche mit der Streychwehr oder Flanck den winckel der Schulteren machen/ doch nur von der Streychwehr zum bestrichnen winckel sichtig/ die werden Stirnen vnd Gesichter der Bollwercken genannt/ vnd wo die einanderen gegen der
  cs: |-
    Když se z bodu, kde končí zadní obrana, vedou přes vnější konec flanky přímky, které s flankou svírají úhel ramene {winckel der Schulteren}, viditelné však jen od flanky k ostřelovanému úhlu {bestrichnen winckel},[^3] nazývají se čela {Stirnen} neboli tváře {Gesichter} bašt; a kde se navzájem proti
poznamky:
- n: 1
  text: 36 stop (tj. 3 pruty) je na kurtinu nepravděpodobně málo; patrně tisková chyba za 36 prutů (432 stop).
- n: 2
  text: Druhá flanka (franc. second flanc) – část kurtiny mezi flankou a bodem, kde ji protíná prodloužená obranná linie; z ní se ostřeluje čelo protější bašty.
- n: 3
  text: Úhel ramene (úhel mezi flankou a čelem) a ostřelovaný úhel, tj. úhel špice bašty (franc. angle flanqué).
