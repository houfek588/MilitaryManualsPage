bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    bey seinem Gewehr vnd in der Ordnung sein Raht haben muß/ vnd sollen vornen vor den Ordnungen die Fendlein auffgesteckt werden vnd fliegen/ damit die jenigen/ so etwan Holtz/ Stroh/ oder dergleichen holen/ verjrret sind/ sich darbey widerumb erkennen mögen: hinder den Compagnien ligen die Capitain vnd Leutenammt: in der mitte der Regimenteren der Oberste vnd Regimentspersonen/ der General sampt anderen hohen Officierern vnd Generalspersonen/ sampt der Munition/ so mit anderen Wägen vmbgeben wird/ auch die Haupt-Artillerey vnd Proviant mit jhren Officierern vast in der mitte der Armaden: die Reuterey wird rings vmb das Fůßvolck gelosiert/ darnach werden die Wägen vmb die Armee herumb geführt/ vnd mit Kettenen an einanderen beschlossen. Die Hauptwachten werden Compagnienweis vor den Quartieren/ vnd Hauptgeschütz: Jtem/ vor der Munition gehalten/ vnd etliche Schiltwachten für die Wagenburg hinauß gesetzt: die Reuter aber halten die Wachten aussert der Wagenburg/ vnd halten meisttheils zween Reuter auff einer Schiltwacht.
  cs: |-
    musí poradit u své zbraně a ve svém šiku. Vpředu před šiky se mají zapíchnout praporce {Fendlein} a nechat vlát, aby se podle nich opět vyznali ti, kdo by šli třeba pro dříví, slámu a podobně a zabloudili. Za kompaniemi {Compagnien} leží hejtmani a poručíci, uprostřed pluků plukovník a plukovní osoby; generál s ostatními vyššími důstojníky a generálními osobami spolu s municí, která se obklopí jinými vozy, a také hlavní dělostřelectvo a proviant se svými důstojníky [leží] téměř uprostřed armády. Jízda se ubytuje kolem dokola pěchoty; potom se kolem armády rozestaví vozy a spojí se navzájem řetězy. Hlavní stráže {Hauptwachten} se drží po kompaniích před kvartýry a před hlavními děly, rovněž před municí, a několik stálých stráží {Schiltwachten} se vysadí ven před vozovou hradbu {Wagenburg}; jezdci však drží stráže vně vozové hradby, a to většinou po dvou jezdcích na jedné stálé stráži.
- typ: nadpis
  uroven: 2
  de: Wie vnd wo man des Nachts die Haupt- vnd Schiltwachten halte.
  cs: Jak a kde se v noci drží hlavní a stálé stráže.
- typ: odstavec
  de: |-
    Man haltet die Hauptwachten vor jedem Regiment/ allzeit mit einer Compagnie/ vnd werden die Schiltwachten also außgestellt. Man stellet rings vmb die Armaden herumb die Sentinells perdu/ oder verlohren Schiltwachten/ welche die Gefreyten thun sollen: jnmassen du in dem anderen Theil meines Kriegsbüchleins gelehret bist. Dise stehen in jhrer Distantz von einanderen/ alß weit einer den anderen des Nachts sehen oder rüffen hören mag. Hinder disen stehet widerumb ein Schiltwacht/ doch also/ daß je eine des hindersten Reyens zwüschen zwo der vorderen hindurch sehen mag/ vnd werden auch Sentinells perdu genannt/ so auch ein gantze Armaden in die ründe beschliessen sollen. Hinder disen zweyen Reyen stehen die anderen Schiltwachten mit verborgnen Lunden/ auch Reyenweis gleich den anderen/ vnd dise Schiltwachten ins gemein werden von den Compagnien der Hauptwachten aussert vnd für das Läger gestellt: wie sie sich aber verhalten sollen/ hast du in meinem anderen Theil dises Kriegsbüchleins vernommen. Die Hauptwacht wird auch bey den Schlagbäumen gehalten/ vnd werden bey allen Außgängen des Quartiers Schiltwachten von den wachthabenden Compagnien auffgestellt: sie lassen auch etliche Soldaten in dem Quartier/ solches zu verwahren. Man haltet auch ein Hauptwacht bey der Munition/ Hauptgeschütz vnd Proviant: Jtem/ bey des Generals Quartier/ da dann zwo Compagnien wachen sollen: von denselben werden die Losamenter der Generalspersonen/ sampt dero Bagage mit Schiltwachten versehen. Die Schiltwachten aber bey dem grossen Geschütz werden mit Spiessen gehalten/ vnd kein brennender Lunden darzu gelassen: vnd dann die Compagnien/ so
  cs: |-
    Hlavní stráže {Hauptwachten} se drží před každým plukem, vždy s jednou kompanií, a stálé stráže {Schiltwachten} se rozestavují takto: Kolem celé armády se rozestaví ztracené stráže {Sentinells perdu} neboli ztracené stálé stráže, které mají konat svobodníci {Gefreyten}, jak jsi byl poučen ve Druhém dílu mé Válečné knížky. Stojí od sebe tak daleko, aby jeden druhého v noci viděl nebo slyšel volat. Za nimi stojí opět stálá stráž, avšak tak, aby každá ze zadní řady viděla mezi dvěma předními; i ty se nazývají ztracené stráže a mají také obepínat celou armádu dokola. Za těmito dvěma řadami stojí ostatní stálé stráže se skrytými doutnáky {Lunden}, rovněž v řadách jako ty ostatní; tyto stálé stráže obecně vysílají kompanie hlavních stráží ven před ležení. Jak se však mají chovat, ses dozvěděl v mém Druhém dílu této Válečné knížky. Hlavní stráž se drží také u závor {Schlagbäumen} a u všech východů z kvartýru rozestavují stálé stráže kompanie, které mají službu; nechávají také několik vojáků v kvartýru, aby jej střežili. Hlavní stráž se drží rovněž u munice, hlavních děl a proviantu, dále u generálova kvartýru, kde mají hlídat dvě kompanie; ty opatří stálými strážemi ubytování {Losamenter} generálních osob i jejich bagáž. Stálé stráže u velkých děl se však drží s píkami {Spiessen} a nepouští se k nim žádný hořící doutnák. A kompanie, které
