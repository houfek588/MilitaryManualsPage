bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Bley/ Eysen/ Ertz/ Zinn/ Glockenspeiß: Jtem/ Raspen/ Sänfften/ Kommet/ Rosseysen/ Sättel/ Afftergeschirr/ Lonen/ Seiler/ Sträng/ Strick/ eysen Ketten/ Zimmerholtz/ klein vnd grosse Sturmpfäl/ Palissaden/ Barricaden/ Haacken/ Hebsteig/ Strauben/ allerley Schroteysen/ eysen- vnd höltzene Bissen/ Nägel: Jtem/ ein Feldschmitten/ vnd allerley Küffer- Müller- Schlosser- Schmid- Wagner-Zimmerleuth- vnd dergleichen Handwercksleuthen Werckzeug: deßgleichen Wägen zu küpffernen Backöfen/ Handmülinen/ Proviant/ Frücht/ Zweybach/ etc. vnd was zur Wagenburg dienstlich/ so allhie zu erzellen vil zu lang were/ alles fleissig außrechnen/ wie vil man deren dingen nachführen/ vnd wie vil man Wägen/ Ross/ Fůhrleuth vnd Schneller darzu von nöhten/ auch was man jedes Monats auff ein Pferd/ Fůhrmann/ Schneller vnd dergleichen/ etc. für sold geben/ vnd solches kosten wurde. Wann man nun also mit dem kleinen vnd grossen Geschütz/ Bagage/ Munition/ vnd anderen dergleichen Rüstwägen: Jtem/ mit Fůhrleuth vnd dergleichen/ auch mit Gelt solches alles im Feld zu erhalten versehen ist/ vnd die Commissarij das Volck gemustert/ die Rödel durchgangen/ vnd man alles wol vberschlagen/ den vnkosten gerechnet/ vnd alle Mittel darzu gefunden vnd berahtschlaget hat/ so solle man alßdann die Patenten hin vnd wider in die Guarnisonen oder Befatzungen schicken/ vnd auff einen gleichen bestimmten Tag den Randevous vnd vergaderung anzeigen/ damit sie sich auff den gemeldten Tag vnfehlbar auff bestimmtem ort finden lassen/ etc.
  cs: |-
    olovo, železo, kov {Ertz}, cín, zvonovinu. Dále rašple, nosítka {Sänfften}, chomouty, podkovy, sedla, podocasníky {Afftergeschirr}, zákolníky {Lonen}, lana, postraňky, provazy, železné řetězy, stavební dříví, malé i velké útočné kůly {Sturmpfäl}, palisády, barikády, háky, {Hebsteig}[^1], šrouby, všelijaké sekáče {Schroteysen}, železné i dřevěné klíny {Bissen}, hřebíky. Dále polní kovárnu a všelijaké nářadí bednářů, mlynářů, zámečníků, kovářů, kolářů, tesařů a podobných řemeslníků; rovněž vozy na měděné pekařské pece, ruční mlýny, proviant, obilí, suchary atd. a co slouží k vozové hradbě {Wagenburg}, což by bylo příliš dlouhé zde vypočítávat. To vše je třeba pečlivě spočítat: kolik těch věcí se má vézt s sebou, kolik je k tomu třeba vozů, koní, vozků a zvedačů {Schneller}, a také jaký žold se má každý měsíc dávat na koně, vozku, zvedače a podobně atd. a kolik by to stálo. Když je tedy [vojsko] takto opatřeno malými i velkými děly, bagáží {Bagage}, municí a jinými podobnými výzbrojními vozy {Rüstwägen}, rovněž vozky a podobně, a také penězi, aby to vše mohlo v poli vydržovat, a když komisaři provedli přehlídku vojska, prošli rejstříky {Rödel}, vše bylo dobře rozpočteno, náklady spočteny a všechny prostředky k tomu nalezeny a projednány, mají se rozeslat patenty {Patenten}, [tj. otevřené listy,] na všechny strany do garnizon neboli posádek a na jeden určený den ohlásit sraz {Randevous} a shromáždění, aby se v uvedený den neomylně dostavili na určené místo atd.
- typ: nadpis
  uroven: 2
  de: Wann man am bequemsten zu Feld ziehen könne.
  cs: Kdy je nejvhodnější vytáhnout do pole.
- typ: odstavec
  de: |-
    Es ist die bequemste zeit darzu im anfang des Meyen/ dann zu derselben zeit wachset das fůtter den Pferden in das maul/ vnd ist gut zu marschieren/ vnd in allweg für Ross vnd Mann/ vnd zum graben kommlich.
  cs: |-
    Nejvhodnější doba k tomu je počátkem května, neboť tehdy koním roste píce přímo do huby, dobře se pochoduje a ve všem je to příhodné pro koně i muže, i ke kopání.
- typ: nadpis
  uroven: 2
  de: Wo man die vergaderung oder versamlung am besten anstellen solle.
  cs: Kde je nejlépe uspořádat sraz {vergaderung} neboli shromáždění.
- typ: odstavec
  de: |-
    Sie sollen an einem schiffreichen Wasser/ da man an vilen enden darzu fahren kan/ oder bey einer Vestung vnd an einem sicheren Ort angestellt werden/ damit der Feind das Volck nicht etwan vngewahrneter Sach vberfallen vnd gar zertrennen möge.
  cs: |-
    Mají se konat u splavné vody, kam lze připlout z mnoha stran, nebo u pevnosti a na bezpečném místě, aby nepřítel vojsko nějak nečekaně nepřepadl a docela nerozprášil.
- typ: nadpis
  uroven: 2
  de: Wie man sich im ersten auffbruch verhalten solle.
  cs: Jak si počínat při prvním vyražení.
- typ: odstavec
  de: |-
    Es erscheinet alle abend der General Major/ oder Wachtmeister bey dem General/ vnd empfanget von demselben die Ordre vnd Losung/ auch allen bescheid: Er hat auch seinen Leutenammt den General Adjutant/ so mit jhme reitet/ vnd zugleich die Ordre empfahet/ vnd hat der General Major den halben theil/ der Adjutant den anderen halben theil der Regimenteren mit der Ordre zu versehen. Wann nun die Wacht auffgeführt worden/ so reitet ein jeder Regiments-Major von jedem Regiment zu seinem bestimmten General
  cs: |-
    Každý večer se generálmajor neboli [generální] vachmistr {Wachtmeister} dostaví ke generálovi a přijme od něho rozkaz {Ordre} a heslo {Losung} i veškeré pokyny. Má také svého poručíka, generálního pobočníka {General Adjutant}, který jezdí s ním a zároveň přijímá rozkaz; generálmajor má rozkazem opatřit jednu polovinu pluků, pobočník druhou. Když je pak stráž vyvedena, jede každý plukovní major od každého pluku ke svému určenému
poznamky:
- n: 1
  text: Hebsteig – význam nejistý; snad zvedací podstavec či stupně (k nakládání děl).
