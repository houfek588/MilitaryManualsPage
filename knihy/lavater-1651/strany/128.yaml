bloky:
- typ: nadpis
  uroven: 2
  de: |-
    Wie man die Contrascarpen durchbricht/ vnd Gallerey machet.
  cs: Jak se prolamuje kontreskarpa a dělá galerie.
- typ: odstavec
  de: |-
    Wann nun die Approche biß an die Parapetta des Contrascarps kommen ist/ führet man Battereyen auff/ darvon die Streychen vnd andere Wehren der Vestung zu demolieren; fangt auch zu gleich an die Contrascarp zu durchbrechen: wann nun die Contrascarp hoch ist/ so machet man einen verdeckten Gang dareyn/ wie eine Mina/ also/ daß der eyngang in den Graben dem obersten theil des Wassers gleich lauffe: diser eyngang aber ist abhangend: ist der obertheil des eyngangs in den Graben: die höhe des Gangs ist 6. schuh vnd 5. schuh breit/ oder vmb etwas breiter/ damit man die Erden desto füglicher außführen möge/ vnd die Leuth besser auß- vnd eyngehen mögen. Eh man aber vnder die Erden kommt/ machet man ein decke von 5. schuhen/ so lang biß man so tieff gegraben/ daß die Erden nicht zusammen falle/ vnd den eyngang zufülle/ setzt man zur seiten dännine brätter an die seiten die nicht zu breit seind/ legt oben darauff ein eychen brätt von gleicher breite/ vnd fahret man darmit also im graben weiter fort: etwan werden auch Joch von dänninem holtz jnnwendig auffgeführt nahe an einanderen/ darnach mit dänninen brätteren beschlagen/ dardurch hinab sich in den Graben zu sencken: wo aber die Contrascarp wegen der nidrigkeit der Erden nicht eröffnet kan werden/ so fahret man mit dem vndergraben fort biß an den Graben. Damit man aber vor fewrwerffen versicheret seye/ so decket man denselben mit Läden vnd Erden/ vnd werden die seiten mit Wollsäcken vnd Schantzkörben wol zugedecket: jnzwüschen werden die Schützen rings vmbher in die Lauffgräben gecommandiert/ die tag vnd nacht auff die Vestung schiessen/ vnd da sich etwar blicken laßt/ fewr geben/ vnd den Arbeitern frid schaffen.
  cs: |-
    Když aproše {Approche} dospěje až k předprsni {Parapetta} kontreskarpy {Contrascarps}, postaví se baterie, aby se z nich rozbily flanky {Streychen} a jiná obranná díla pevnosti; zároveň se začne prolamovat kontreskarpa. Je-li kontreskarpa vysoká, udělá se do ní krytá chodba jako mina {Mina}, a to tak, aby vchod do příkopu vedl v úrovni hladiny vody. Tento vchod je však svažitý; [tím] je horní část vchodu do příkopu[^1]. Chodba je 6 stop vysoká a 5 stop široká nebo o něco širší, aby se dala zemina snáze vynášet a lidé mohli lépe vycházet a vcházet. Než se však dostanou pod zem, dělá se strop {decke} po 5 stopách; a dokud se nevykope do takové hloubky, aby se zemina nesesula a nezasypala vchod, stavějí se po stranách ne příliš široká jedlová prkna, nahoru se na ně položí dubové prkno stejné šířky, a tak se v kopání pokračuje dál. Někdy se také uvnitř těsně vedle sebe postaví rámy {Joch} z jedlového dřeva, obijí se jedlovými prkny a tudy se sestupuje do příkopu. Kde však kontreskarpu nelze otevřít, protože je terén nízko, pokračuje se v podkopávání až k příkopu. Aby byl člověk chráněn před vrhaným ohněm, kryje se [chodba] prkny {Läden} a zeminou a boky se dobře zakryjí pytli s vlnou {Wollsäcken} a šancovními koši. Mezitím se do aproší {Lauffgräben} kolem dokola vyšlou střelci, kteří dnem i nocí střílejí na pevnost, a kdekoli se někdo ukáže, pálí po něm a zjednávají dělníkům klid.
- typ: nadpis
  uroven: 2
  de: |-
    Wie man den Graben außfülle/ vnd die Gallerey darüber mache.
  cs: Jak se vyplňuje příkop a staví přes něj galerie.
- typ: odstavec
  de: |-
    So bald die Contrascarp durchbrochen ist/ wirfft man ein grosse menge fantaseyen/ oder büschelein mit reyß/ vnd Frantzösisch Saussysen in den Graben/ solchen zu füllen: es springen auch etliche Soldaten hinunder/ die sich wagen dörffen/ vnd werffen die büschelein zu recht gegen dem Bollwerck/ einen weg dahin/ vnd die Gallerey daher zu machen/ vnd ist dieselbig Gallerey vngefahr 7. oder 8 schuh hoch/ vnd 7. 6. oder 8. schuh breit/ dann je breiter je besser sie ist/ weil desto mehr Leuth darinn gehen mögen: die ripp stehen vngefahr 6. schuh von einanderen/ die dann oben mit eychenen brätteren/ vnd mit Erden darauff oben bedecket/ vnd soll die Erden darauff eines schuhs dick seyn: es stehet einer oder zween in dem Graben an der Vestung-Wal/ vnd theilen die Erden mit Schaufflen/ so lang styl haben/ ordenlich vnd gleich/ damit das fewr an der Gallerey nichts schaden möge.
  cs: |-
    Jakmile je kontreskarpa prolomena, naháže se do příkopu velké množství fašin[^2] {fantaseyen} neboli otýpek chrastí a [takzvaných] francouzských saucissonů {Saussysen}, aby se zaplnil. Seskočí také dolů několik vojáků, kteří si troufnou, a rovnají otýpky směrem k baště {Bollwerck}, aby k ní udělali cestu a odtud galerii {Gallerey}. Ta galerie je asi 7 nebo 8 stop vysoká a 7, 6 nebo 8 stop široká, neboť čím je širší, tím je lepší, protože jí může jít více lidí. Žebra {ripp} stojí asi 6 stop od sebe a shora se kryjí dubovými prkny a na ně zeminou, která má být na stopu tlustá. Jeden nebo dva muži stojí v příkopu u valu pevnosti a lopatami s dlouhými násadami rozhrnují zeminu pořádně a rovnoměrně, aby oheň galerii nemohl uškodit.
- typ: nadpis
  uroven: 2
  de: |-
    Wie man die Minen machen solle.
  cs: Jak se mají dělat miny.
- typ: odstavec
  de: |-
    Wann nun die Gallerey gemachet/ so fanget man die Minen an/ eint-
  cs: Když je galerie hotova, začíná se s minami {Minen}, a to
poznamky:
- n: 1
  text: 'Věta je v originále nejasná („diser eyngang aber ist abhangend: ist der obertheil des eyngangs in den Graben“); patrně chce říci, že chodba klesá a její ústí do příkopu leží v úrovni hladiny.'
- n: 2
  text: '„fantaseyen“ – zkomolené franc. fascines (fašiny, svazky proutí); saucissons jsou dlouhé a silné fašiny.'
