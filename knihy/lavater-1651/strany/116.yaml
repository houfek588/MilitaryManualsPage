bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    nun vil oder wenig Geschůtz bey dir hast/ so solt du alßdann deinen vberschlag machen wie vil Volck/ Pferd/ Munition/ Hagel/ Gestrew/ Canoniers/ Fewrwercker/ Petardier/ Bineurs/ Matrosen/ Handlangers/ Lavyten zu den Wägen/ Räder vnd dergleichen haben müssest: es werden auch Seyler/ Ketten/ Winden/ Bickel/ Wüscher/ Ladschaufflen/ Zündruthen/ äxt/ Hauwen/ Stäckvnd Wurffschaufflen/ Hebstangen/ Zugböck/ Geißfüß/ Trämmel/ Karrensalb/ Rossgeschirr/ Kommet/ Constablers Rüstwägen/ Gelten mit eysen ring beschlagen/ vnd oben mit lidernen säcken/ vnd dergleichen erforderet. Du solt auch vberschlagen wie vil Wägen/ Ross vnd Männer darzu von nöhten seyen. Darnach solt du ein vberschlag der Wägen halber machen/ alß es werden erforderet Wägen zu der hohen Officierern Bagage/ was man einer Generalsperson/ einem Obersten Hauptmann vnd dergleichen für Wägen zur Bagage gebe/ was man zu der Munition der Soldaten/ zu den Waaffen/ äxen/ Hauwen/ Beyel/ Bickel/ Reuthauwen/ vnd anderen Bawren-Jnstrumenten: Jtem/ zun Kriegsscheyben/ Geißfüß/ Zugböck/ Schiffbrucken/ Eselböcken/ vnd Ersätzbäumen/ Winden/ Kolben/ Scheiben: Jtem/ zu den Brech- Heb- vnd Legeysen/ Nägel/ Hämmer/ Schlägel/ Stössel/ Bätzen/ Hebträmmel/ Zangen/ Speitel/ Sträng/ Schnür/ Strick/ Kronseiler/ Fůßeysen/ Trög/ Rossbären/ Můlten/ grosse vnd kleine Sätzbäum/ vnd allerley Zimmerwerck: Jtem/ Kästen für die Constabels/ Fäßlein mit beschlossenen deckenen zu den Lunden/ Strick vnd Fewrzeug: Jtem/ vil 1000. Fäßlein mit Musquetenkuglen eines loths: vil 1000. groß vnd klein stück Kuglen/ Fewrkuglen/ Handgranaten/ Bächring/ vnd anderem Fewrwerck: Jtem/ Sylscheiter/ Stäb/ Lindstangen/ Sprossen zu den Leiteren/ Sturmleiteren/ Nebenspeichel vnd dergleichen: Jtem/ zu den bereiteten vnd außgemachten Räderen/ Läden/ Holtz/ Balcken/ Reiß/ Fäßlein zu dem Pulfer vnd Kuglen/ etc. Musqueten/ Pistolen/ Handrohr/ Fewrrohr/ Bandelierrohr/ halb vnd gantz Haacken/ Doppelhaacken/ Spießeysen/ Spießschäfelein/ Schweinsspieß/ Schweinsfederen/ Hellenparten/ Spießnägel/ Helmstangen/ Harnast/ Beckelhauben/ Kürraß/ Sturmpflegel/ Morgenstern/ Prügel/ etc. Jtem/ zu dem Fewrwerck/ Speck/ Geißmilch/ Vnschlit/ Ancken/ allerley öl/ Terpentin/ Gloriet/ Spießnägel/ Hartz/ Schmär/ Brantenwein/ Honig/ Bäch/ Salpeter/ Schwebel/ Kolen/ Reiffring/ Windliechter/ Laternen/ Facklen/ Fewrleiteren/ Fewrhaacken/ Fewrsprützen/ Fewreymer/ Wachs/ vil 1000. Schläg in das Fewrwerck/ grosse Granaten/ Fewrpfeil/ Sturmkolben/ Bächkessel vnd Pfannen/ vnd dergleichen hierzu dienstlichen Sachen: Jtem/ zu Ladschaufflen/ Sessel/ Wüscher/ Kolen/ Winden/ ämbd/ Stroh/ Höw zun Stucken/ Pulfersäck/ Zündrůthen/ Zündhorn oder Fläschen/ Lunden/ Hagelgestrew/ Ladungen zu den Feldstücklinen: Jtem/ Armbrust/ Pfeil/ Handbogen/ vnd dergleichen Sachen: Jtem/ zu den Formen/ Modlen/ Zangen/ Gießlöfflen/ Schlägschrot/
  cs: |-
    máš u sebe děl mnoho, nebo málo, máš si pak udělat rozpočet {vberschlag}, kolik budeš potřebovat lidí, koní, munice, kartáčů {Hagel}, drobné střely {Gestrew}, kanonýrů, ohňostrůjců, petardýrů {Petardier}, pionýrů {Bineurs}, lodníků {Matrosen}, pomocníků, lafet {Lavyten} k vozům, kol a podobně. Vyžadují se také lana, řetězy, navijáky, krumpáče, vytěráky {Wüscher}, nabíjecí lžíce {Ladschaufflen}, zapalovací hole {Zündruthen}, sekery, motyky, rýče a házecí lopaty, sochory, tažné kozy {Zugböck}, kozí nohy {Geißfüß}, válce {Trämmel}, kolomaz, koňské postroje, chomouty, výzbrojní vozy {Rüstwägen} pro konstábly, putny okované železnými obručemi a nahoře [opatřené] koženými pytli a podobně. Rozpočti také, kolik vozů, koní a mužů je k tomu zapotřebí. Potom si udělej rozpočet vozů: vyžadují se totiž vozy pro bagáž vyšších důstojníků – kolik vozů na bagáž se dává generální osobě, plukovníkovi, hejtmanovi a podobně –, [dále] kolik pro munici vojáků, pro zbraně, sekery, motyky, tesařské sekery {Beyel}, krumpáče, klučovnice {Reuthauwen} a jiné selské nářadí. Dále pro válečné štíty {Kriegsscheyben}[^1], kozí nohy, tažné kozy, lodní most {Schiffbrucken}, kozlíky {Eselböcken} a náhradní trámy {Ersätzbäumen}, navijáky, palice a kladky. Dále pro páčidla, sochory a podkládací železa {Brech- Heb- vnd Legeysen}, hřebíky, kladiva, palice, tlouky, {Bätzen}, zvedací trámky, kleště, klíny {Speitel}, postraňky, šňůry, provazy, jeřábová lana {Kronseiler}, ježky {Fůßeysen}, koryta, nosítka {Rossbären}, necky {Můlten}, velké i malé stavěcí trámy {Sätzbäum} a všelijaký tesařský materiál. Dále truhly pro konstábly {Constabels}, soudky s uzavíratelnými víky na doutnáky, provazy a zapalovací náčiní. Dále mnoho tisíc soudků s mušketovými koulemi o jednom lotu {loths}; mnoho tisíc velkých i malých dělových koulí, ohnivých koulí {Fewrkuglen}, ručních granátů, smolných věnců {Bächring} a jiného ohňostroje {Fewrwerck}. Dále vahadla {Sylscheiter}, hole, luntovníky {Lindstangen}, příčle k žebříkům, útočné žebříky, náhradní paprsky kol {Nebenspeichel} a podobně. Dále pro připravená a hotová kola, prkna, dříví, trámy, chrastí, soudky na prach a koule atd. Muškety, pistole, ručnice {Handrohr}, ohnivé ručnice {Fewrrohr}, ručnice na bandalír {Bandelierrohr}, poloviční a celé hákovnice {Haacken}, dvojité hákovnice, hroty pík, ratiště pík, kančí oštěpy, kančí péra {Schweinsfederen}[^2], halapartny {Hellenparten}, hřeby do pík, násady, zbroje {Harnast}, přilby {Beckelhauben}, kyrysy, útočné cepy, kropáče {Morgenstern}, kyje atd. Dále pro ohňostroj: slanina, kozí mléko, lůj, máslo {Ancken}, všelijaké oleje, terpentýn, {Gloriet}, hřeby do pík[^3], pryskyřice, sádlo, pálenka, med, smůla, ledek {Salpeter}, síra, uhlí, obruče, větrné svíce {Windliechter}, lucerny, pochodně, požární žebříky, požární háky, stříkačky, požární vědra, vosk, mnoho tisíc výbušných náloží {Schläg} do ohňostroje, velké granáty, ohnivé šípy, útočné palice {Sturmkolben}, smolné kotle a pánve a podobné k tomu užitečné věci. Dále pro nabíjecí lžíce, stoličky {Sessel}, vytěráky, uhlí, navijáky, otavu {ämbd}, slámu a seno k dělům, pytle na prach, zapalovací hole, prachovnice {Zündhorn} neboli lahve, doutnáky {Lunden}, kartáčovou drť {Hagelgestrew}, náboje do polních dělek. Dále kuše, šípy, ruční luky a podobné věci. Dále pro formy, kadluby, kleště, licí lžíce, sekané broky {Schlägschrot},
poznamky:
- n: 1
  text: |-
    Význam výrazů Kriegsscheyben (snad pojízdné štíty, mantelety), Bätzen a Gloriet (zjevně hořlavá surovina) se nepodařilo spolehlivě určit; překlad je odhadem nebo je ponechán původní výraz.
- n: 2
  text: |-
    Schweinsfeder („kančí péro“, tzv. švédské péro) – krátké kopí, které mušketýři zarážejí šikmo do země před sebe jako překážku proti jízdě; někdy spojené s vidlicí.
- n: 3
  text: |-
    Spießnägel (hřeby do pík) se ve výčtu surovin pro ohňostroj opakují; snad tisková chyba za Spießglas (antimon), běžnou přísadu ohňostrojných slož.
