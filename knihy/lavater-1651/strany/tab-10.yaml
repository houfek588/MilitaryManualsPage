  popis: |-
    Mědirytina k šikům proti jízdě, vlevo dole označená *… IV* („[list] IV“; začátek nápisu je odříznutý, v textu „das vierte Kupfferblat“).
    *I* (nahoře): šestý bitevní šik, kulatý ježek {Igel} (str. [[104|104]]–[[105|105]]). Píky (kroužky s čárkou) jsou rozestavené paprskovitě kolem korouhve uprostřed, po obvodu klečí a pálí mušketýři. Okolo krouží a střílí nepřátelští jezdci s pistolemi.
    *II* (uprostřed): sedmý bitevní šik (str. [[105|105]]). Čtvercový houf pikenýrů s korouhví je ze všech stran „oblečen“ jednou řadou mušketýrů. Ze čtyř stran jsou k němu křížem připojeny čtyři malé oddíly mušketýrů *A* (text: „wie der buchstaben A. außweiset“).
    *III* (dole): osmý bitevní šik (str. [[106|106]]). Houf pikenýrů s korouhví a čtyři švadrony mušketýrů (1–4) rozestavené před ním, za ním a po stranách. Písmena *B* na všech čtyřech stranách ukazují, kam píky vypadnou, když se mušketýři před jízdou stáhnou pod ně. Text odkazuje na „die grosse zahl VII“ (zjevně místo III) a na švadrony 1, 2, 7, 8.
    Vpravo drobná schémata pikenýrů (kroužek = muž, čárka = píka): *IV* – píky sklopené a překřížené na všechny strany proti jízdě (str. [[106|106]]: „wie die groß zahl IV. außweiset/ vber einanderen schrencken“); *VI* – píky vypadnuté do čtyř rohů; *V* a *III* – píky sklopené na dvě protilehlé strany. Text se výslovně odvolává jen na *IV*; *V*, *VI* a malé *III* zřejmě ilustrují „zu allen 4. ecken die Spieß außfallen lassen“ a sklápění na strany (str. [[106|106]]).
