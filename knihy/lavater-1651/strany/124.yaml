bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Quartier eynführt/ so laufft ein jeder nach besetzter Haupt- vnd Schiltwacht hin Holtz vnd Stroh zu holen/ damit sie jhre hütten machen: es sollen aber die thüren der hütten gegen den straassen sehen: die allervordersten gegen dem Lermenplatz/ die hindersten aber gegen den Capitains/ vnd der Capitains gegen der Soldaten thüren gehen: zu vorderst an den Reyen der Soldaten hütten losieren die Fendrich/ Corporaln/ vnd Feldschärer: hinden aber die Leutenammt/ Wachtmeister vnd Capitain des armes: es soll ein jeder vngefahr einen schuh hoch von reyßwerck ein betthstatt oder geliger machen/ damit er nicht wegen feuchte der Erden erkrancken: vor disen hütten werden bäncklein gemachet/ vnd in die hütten kleine gesichter: es müssen auch die Soldaten alle Sambstag vor den thüren wüschen/ oder kehren: vornen sollen die Fendlein alle fliegen/ vnd darneben zwo stützen auffgerichtet werden/ darüber man dann ein stangen leget/ wird einem Galgen gleich/ an welchen man die Spieß stellet/ vnd wird darneben vor einer jeden Compagnie ein Brunnen gegraben/ zum trincken/ wäschen/ vnd zur brunsts-zeit sich dessen zu gebrauchen: die Kuchen zu dem kochen werden zu allerhinderst ein gute distantz von dem Quartier gemachet/ vnd das dach mit graßböschen/ oder breiten sooden/ wegen bewahrung des fewrs/ gedecket/ vnd das Quartier sauber vnd rein gehalten.
  cs: |-
    uvede do kvartýru, běží každý, jakmile je obsazena hlavní a stálá stráž {Haupt- vnd Schiltwacht}, pro dřevo a slámu, aby si postavili chýše. Dveře chýší však mají hledět do uliček: ty úplně přední k poplašnému shromaždišti {Lermenplatz}, ty zadní k hejtmanům {Capitains} a dveře hejtmanů k dveřím vojáků. Na samém předním konci řad vojenských chýší jsou ubytováni praporečníci {Fendrich}, desátníci {Corporaln} a ranhojiči {Feldschärer}, vzadu pak poručíci {Leutenammt}, vachmistři {Wachtmeister} a zbrojíři {Capitain des armes}. Každý si má z chrastí {reyßwerck} udělat postel neboli lože asi stopu vysoko, aby neonemocněl od vlhkosti země. Před těmito chýšemi se dělají lavičky a do chýší malá okénka {gesichter}. Vojáci také musejí každou sobotu před dveřmi zamést neboli uklidit. Vpředu mají vlát všechny praporce {Fendlein} a vedle nich se mají postavit dvě podpěry, přes které se položí tyč – podobá se to šibenici – a o ni se opírají píky. Vedle toho se před každou kompanií vykope studna k pití, k mytí a pro potřebu v čase požáru {brunsts-zeit}. Kuchyně na vaření se zřizují úplně vzadu v dobrém odstupu od kvartýru a střecha se kvůli ochraně před ohněm kryje travnatými drny nebo širokými pláty drnu {sooden}; a kvartýr se udržuje čistý a v pořádku.
- typ: nadpis
  uroven: 2
  de: |-
    Wie vnd wann man die Tranche machen solle.
  cs: Jak a kdy se má dělat zákop {Tranche}.
- typ: odstavec
  de: |-
    Den anderen tag darauff da wird jederer Compagnie 2. 3 4. oder mehr oder weniger růthen/ je nach beschaffenheit der grösse des Lägers/ zu graben vnd zu bawen gegeben/ von welchem man jhnen kein haller schuldig ist/ vnd wird geheissen/ die Arbeit seye für den Printzen. Dise Tranche soll in einem tag vmb die gantze Armee zu beyden seiten herumb geführt werden/ vnd die wird folgender gestalten gemachet: der Graben 6. 7. oder 8. schuh weit: der Banck ein schuh hoch/ zween oder drey breit: vornen vnd hinden wird die Parapetta oder Brustwehre von böschen oder sooden auffgeführt. Man machet auch die Tranche dicker vnd höher/ da der Feldfeind ankommet: vnd werden auch alßdann die Gräben erweiteret vnd tieffer/ auch doppelte Gräben gemachet. Jn der mitte der Tranche/ oder Vmbschantzung/ machet man halbe Reducten/ so je eine von der anderen 40. oder 50. růthen stehet. Man solle auch ausserthalb gevierte Reducten legen/ deren jedere seiten 4. 5. oder 6. růthen halte/ vnd auff die 30. oder 50. Musquetierer begreiffen möge: solche sollen 40. oder 50. růthen von einanderen stehen/ mit disen werden die Päß verleget vnd bewahret: insonderheit wo man an die Tranche keine Bollwerck zu legen gesinnet ist/ kan man sich mit den Reducten behelffen/ vnd ist der Graben solcher Reducten 8. schuh breit/ vnd 6. tieff: der Berm 2. schuh: die höhe der Brustwehr 6. schuh: vnd die schräge die helfft der schräge: man leget auch an dise Reducten/ oder Quadrat/ oder Vierung/ Bollwerck: an
  cs: |-
    Nazítří se každé kompanii {Compagnie} přidělí ke kopání a stavbě 2, 3, 4 nebo více či méně prutů {růthen} podle velikosti ležení; za to se jim nedluží ani haléř a říká se, že je to práce pro knížete[^1] {für den Printzen}. Tento zákop se má za jediný den vést kolem celé armády po obou stranách a dělá se takto: příkop 6, 7 nebo 8 stop široký, střelecký stupeň {Banck} stopu vysoký a dvě nebo tři stopy široký; vpředu i vzadu se z travnatých trsů nebo drnů navrší předprseň {Parapetta oder Brustwehre}. Kde přitahuje nepřátelské polní vojsko {Feldfeind}, dělá se zákop také silnější a vyšší a příkopy se pak rozšiřují a prohlubují, dělají se i příkopy dvojité. Uprostřed zákopu neboli obvodového opevnění {Vmbschantzung} se dělají poloviční reduty {halbe Reducten}, vzdálené od sebe 40 nebo 50 prutů. Vně se mají také položit čtvercové reduty, jejichž každá strana měří 4, 5 nebo 6 prutů a které pojmou 30 až 50 mušketýrů; mají stát 40 nebo 50 prutů od sebe a jimi se zahrazují a střeží průchody. Zvláště tam, kde se k zákopu nemíní stavět bašty {Bollwerck}, lze si pomoci redutami. Příkop takových redut je 8 stop široký a 6 hluboký, berma {Berm} 2 stopy, výška předprsně 6 stop a sklon polovina [výšky][^2]. K těmto redutám neboli čtvercům se přikládají také bašty.
poznamky:
- n: 1
  text: 'Patrně narážka na nizozemskou armádu, jejímž vrchním velitelem byl princ Oranžský (Moric, později Frederik Hendrik); jeho obléhací praxe byla vzorem doby.'
- n: 2
  text: 'Tisk má „die schräge die helfft der schräge“ (sklon polovina sklonu) – zřejmě tisková chyba; smysl je patrně „polovina výšky“.'
