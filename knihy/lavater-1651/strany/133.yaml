bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    vor dem Feind eynnemmen: Auff solche folgen etliche Trouppen Reuter hinnach/ sampt einem geringen Feldgeschütz/ darzu ein starcke Hauptwacht von Fůßvolck: da aber der Feind jenseits zu starck ansetzte/ ehdie Armada oder etwas vil Volcks hinüber kommt/ vnd dasselbig vbereylen oder vberfallen/ vnd jhnen zu mächtig seyn wolte/ so sollen neben solcher Brucken etliche ledige Schiff geordnet seyn; da ferr das Volck nicht raums vnd platz genug hette/ widerumb sich vber die Brucken zu salvieren; daß es alßdann in dise dabey-haltende Schiff springen/ vnd ohne gefahr des Feinds widerumb hindersich kommen möge: Wo man aber die Armee hinüber bringet/ so soll man gestracks ein Schantz/ zu versicherung derselben/ jenseits auffwerffen/ vnd mit aller nohtdurfft nacheylen/ vnd den Feind fürters treiben.
  cs: |-
    před nepřítelem obsadit. Za nimi následuje několik oddílů {Trouppen} jízdy s několika lehkými polními děly a k tomu silná hlavní stráž {Hauptwacht} z pěchoty. Kdyby však nepřítel na druhém břehu dotíral příliš silně, dříve než přejde armáda nebo větší počet lidu, a chtěl by je zaskočit nebo přepadnout a byl by na ně příliš mocný, má být vedle takového mostu připraveno několik prázdných lodí: pro případ, že by lidé neměli dost místa a prostoru, aby se zachránili zpět přes most, aby pak mohli naskákat do těchto připravených lodí a dostat se bez nebezpečí od nepřítele zpět. Když se však armáda převede na druhý břeh, má se tam hned k jejímu zajištění navršit šance {Schantz}, se vším potřebným za ní pospíšit a hnát nepřítele dál.
- typ: nadpis
  uroven: 2
  de: |-
    Wie man sich in einem Haupt-treffen oder Schlacht verhalten solle.
  cs: Jak si počínat v hlavním střetnutí neboli bitvě.
- typ: odstavec
  de: |-
    Man solle nicht schlagen ohn andächtiges demütiges gebätt: auch nicht man seye dann darzu gezwungen/ oder habe einen guten vortheil/ in deme der Feind in wind/ kälte/ oder hitz/ vnd sonsten mit allerley außgemärglet/ vnd sein armůt verspüret wird/ vnd man den obersten platz eyngenommen/ Läger vnd Troß wol verwahret/ Vieh vnd Leuth wol gefüteret/ des Feinds heimliche list wol verhütet vnd erkundiget/ der Zeit/ Tags/ Nachts/ Hagels/ Rägen vnd Winds gewahret/ den Feind etliche Tag vnd Nacht mit scharmützieren ins Gewehr gebracht/ ermüdet/ vnd man dargegen das seinige durch secundieren ruhen gelassen. Wo man nun schwach/ solle man Abends in der finstere/ oder des Morgens in einem Näbel angreiffen: mit kleinem hauffen soll man seinen vortheil in der enge vnd höhe/ neben Morast/ Wasser/ Holtz/ vnn dergleichen suchen: Jtem/ gewahren/ daß dem Feind Sonn/ Mond/ oder Hitz/ Kälte/ Rägen/ Wind vnd Staub schade: vnd bey einem Wasser/ da sich Leuth vnd Vieh erlaben mögen: auch hinderwerts zu nechst ein Statt/ Vestung/ Schloß/ Wasser/ Maaß/ See/ Weyer/ oder hohen Felsen zu seiner retirada habe/ damit der Feind nicht leicht darhinder kommen/ vnd man jhne dargegen dardurch auffhalten/ vnd sich widerumb zusammen thun möge. Man soll Füßvolck gegen Fůßvolck vnd nicht gegen Reuteren commandieren: je breiter auch ein Ordnung je besser sie ist: dann je mehr auff ein mal zu fechten kommen/ je besser ichs halte: die Proviant vnd Munition sollen wol verwahret werden: es sollen auch etlich Trouppen hinder der Munition vnd dem Volck halten: die Fůhrleuth/ wo sie mit jhren Pferden außreissen wolten/ auch die außreissenden Soldaten mit gewalt widerumb an den Feind zu ruck treiben: es soll aber der General vil Leib-Pferd halten/ vnd bey jedem Regiment ein lediges stehen haben/ damit er geschwind von einem Regiment zum anderen reiten/ vnd den Obersten Ordre ertheilen möge darzu auch vil Diener/ die seinen Befehl außrichten: die Major der Regimenteren sollen alle jhm ab-
  cs: |-
    Nemá se svádět bitva bez zbožné, pokorné modlitby; a také ne, leda by k tomu byl člověk donucen nebo měl dobrou výhodu: když je nepřítel vysílen větrem, zimou či horkem a všelijak jinak a je znát jeho nouze; když člověk obsadil nejvyšší místo, dobře zajistil ležení a trén {Troß}, dobře nakrmil dobytek i lidi, dobře se ubránil skrytým nepřátelským lstem a vyzvěděl je, dal pozor na čas, den, noc, krupobití, déšť a vítr, několik dní a nocí držel nepřítele šarvátkami ve zbrani a unavil ho, a naproti tomu nechal své lidi střídáním {secundieren} odpočinout. Je-li však člověk slabý, má udeřit večer za tmy nebo ráno v mlze; s malým houfem má hledat svou výhodu v úžinách a na výšinách, u bažin, vod, lesů a podobně. Dále dbát, aby nepříteli škodilo slunce, měsíc nebo horko, zima, déšť, vítr a prach; [stát] u vody, kde se lidé i dobytek mohou osvěžit, a mít také za zády nablízku město, pevnost, zámek, vodu, rašeliniště {Maaß}, jezero, rybník nebo vysoké skály pro svůj ústup {retirada}, aby se nepřítel nemohl snadno dostat do týlu a aby ho tím naopak bylo lze zadržet a znovu se shromáždit. Pěchota se má posílat proti pěchotě, a ne proti jezdcům. Čím širší je šik, tím je lepší, neboť čím více jich může bojovat najednou, tím lépe to pokládám. Proviant a munice mají být dobře střeženy. Několik oddílů má také stát za municí a za vojskem a vozky, kdyby chtěli se svými koňmi utéci, i prchající vojáky násilím hnát zpět proti nepříteli. Generál má však mít mnoho vlastních koní a u každého pluku mít jednoho volného připraveného, aby mohl rychle přejíždět od jednoho pluku k druhému a dávat plukovníkům rozkazy {Ordre}; k tomu i mnoho sluhů, kteří vyřizují jeho rozkazy. Plukovní majoři {Major} mají všichni být u něho
