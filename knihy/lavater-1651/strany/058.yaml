bloky:
- typ: nadpis
  uroven: 3
  de: Wie/ wo vnd wann die Schiltwachten sollen auffgestellt werden.
  cs: Jak, kde a kdy se mají rozestavovat stálé stráže.
- typ: odstavec
  de: |-
    Sie werden auffgesetzt des nachts/ Winterszeit vmb 7. des Sommers aber vmb 9. vhren/ vnd werden alßdann solche gedopplierte Schiltwachten genennt/ weiln sie zwey oder mehrfacht alß aber des tags auffgestellt werden: vnd sollen die Sentinellhäußlein vnd Schiltwachten stehen/ namlich in jedem Bollwerck drey: Jtem/ in mitte der Courtine eine: jnnert vnd auff jeder Porten eine: bey jedem Zeug- Proviant- vnd Rahthauß eine: deßgleichen bey der Cantzley eine. Dise gehen des tags/ wann die Trommel Reveille schlaget/ alle ab/ vndverbleibt des tags keine/ aussert in jedem Bollwerck eine. Man haltet auch tags vnd nachts Schiltwachten: erstlich vor der Officierer Corps degarde der Hauptwacht/ bey den grossen Stücken auff dem Marckt. Jtem/ auff den Schutzporten/ vnd jnnert den Porten bey den Corps de garde: des tagsaber eine auff jeder Fallbrucken in der mitte. Jtem/ die an jedem aussersten Schlagbaum.
  cs: |-
    Rozestavují se v noci, v zimě v 7 a v létě v 9 hodin, a nazývají se pak zdvojené stálé stráže {gedopplierte Schiltwachten}, protože se stavějí dvakrát i vícekrát silnější než ve dne. Strážní budky {Sentinellhäußlein} a stálé stráže mají stát takto: v každé baště {Bollwerck} tři; dále jedna uprostřed kurtiny {Courtine}; uvnitř a na každé bráně {Porten} jedna; u každé zbrojnice, proviantního domu a radnice jedna; rovněž jedna u kanceláře. Ve dne, když buben bubnuje budíček {Reveille}, všechny odcházejí a přes den nezůstává žádná, kromě jedné v každé baště. Stálé stráže se drží i ve dne a v noci: nejprve před důstojnickou strážnicí {Corps degarde} hlavní stráže, u velkých děl {Stücken} na náměstí; dále u ochranných bran {Schutzporten} a uvnitř bran u strážnic; ve dne pak jedna uprostřed každého padacího mostu {Fallbrucken}; dále ty u každé nejzazší závory {Schlagbaum}.
- typ: nadpis
  uroven: 3
  de: Wie sich ein Musquetierer auff der Schiltwacht verhaltet.
  cs: Jak si počíná mušketýr na stálé stráži.
- typ: odstavec
  de: |-
    Ein Musquetierer soll auff der Schiltwacht allzeit an seinem Londen ein schön brennende kolen haben: die Musqueten soll scharpff geladen/ vnd die pfanneu mit gutem zündpulfer versehen seyn: Er soll von jnnen/ vnd sonderlich von aussenher des Wals fleissig sehen vnd lausteren/ ob er villeicht etwas getöß oder Feind gehören vnd spüren möge: Auff der Schiltwacht soll er des Nachts weder pfeiffen/ singen/ stampffen oder trampen/ damit er nicht vom Feind erhört vnd vberfallen werde. Niemand/ wer der were/ klein oder groß Hanß/ gefreundte oder bekannte soll er des Nachts kennen/ noch selbige vnder sein Gewehr/ bey Leibsstraaff/ kommen lassen: Er soll die Rond/ mit dem wort (Wer da) so laut er mag/ anschreyen/ damit es die anderen Schiltwachten hören/ vnd sich desto besser verfaßt machen können: Vnd alßdann/ wo her/ wo auß/ vnd welchen weg sich die Ronde wendet/ er sich auch allzeit mit auffgetrucktem brennenden Lunden erzeigen/ die Ronde von seinem Leib abhalten/ vnd wohin sie sich wendet/ allzeit auch mit seinem Angesicht vnd Gewehr wenden/ vnd so lang er sie sehen mag/ das Gewehr bereit halten/ auch sich weiter nicht alß vier oder fünff schritt von seinem Gewehr lassen/ damit er nicht etwan vngewahrneter sach erschlichen/ vnd in groß vngelegenheit gebracht werden möge. Da auch ein Ronde fürsetzlicher weis auff das vierte oder fünffte anschreyen sich nicht wolte zu erkennen geben/ auff dieselbig zu schiessen/ zu stechen vnd zu hauwen gut fug vnd macht haben. Zu nechst der Corps de garde oder Hauptwacht stehet meistentheils ein Musquetierer: diser soll die Ronde laut anschreyen/ vnd nicht für das Wachthauß/ neben jhne/ oder vnder sein Gewehr vorbey lassen/ sondern jhro zuschreyen mit dem
  cs: |-
    Mušketýr {Musquetierer} má mít na stálé stráži na svém doutnáku {Londen} vždy pěkně žhnoucí uhlík; mušketa {Musqueten} má být ostře nabita a pánvička opatřena dobrým zápalným prachem. Má bedlivě hledět a naslouchat dovnitř, a zvláště ven z valu {Wals}, zda by snad neuslyšel a nezpozoroval nějaký hluk nebo nepřítele. Na stálé stráži nesmí v noci pískat, zpívat, dupat ani podupávat, aby ho nepřítel nezaslechl a nepřepadl. Nikoho, ať je to kdokoli, malý či velký pán, přítel nebo známý, nesmí v noci znát ani pod tělesným trestem pustit na dosah své zbraně. Obchůzku {Rond} má co nejhlasitěji zastavit voláním „Kdo tam?“, aby to slyšely i ostatní stálé stráže a mohly se tím lépe připravit. A potom, ať obchůzka přichází odkudkoli, odchází kamkoli a obrací se kterýmkoli směrem, má se jí vždy ukazovat s nasazeným hořícím doutnákem, držet si ji od těla a kamkoli se obrátí, obracet se za ní vždy tváří i zbraní; a dokud ji vidí, má mít zbraň připravenou. Také se nemá od své zbraně vzdálit na víc než čtyři nebo pět kroků,[^1] aby nebyl nějak nenadále přepaden a nedostal se do velké nesnáze. Kdyby se obchůzka úmyslně ani na čtvrté či páté zavolání nechtěla dát poznat, má plné právo a moc na ni střílet, bodat a sekat. Nejblíže u strážnice {Corps de garde} neboli hlavní stráže {Hauptwacht} stojí většinou mušketýr; ten má obchůzku hlasitě zastavit a nenechat ji projít před strážnicí, vedle sebe ani na dosah své zbraně, nýbrž na ni zavolat
poznamky:
- n: 1
  text: |-
    Doslova „ať se nenechá dál než čtyři nebo pět kroků od své zbraně“; místo lze chápat i tak, že obchůzku nemá pustit blíž než na čtyři až pět kroků ke své zbrani.
