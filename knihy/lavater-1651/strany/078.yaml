bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Morgensternen/ Hellenparten/ Stecken eines Manns lang/ so oben einen kolben gleich einem Küfferschlägel hat/ vnd mit spitzigen Näglen beschlagen/ haben. Sie sollen auch die Handgranaten/ krüg mit Pulfer außgefüllt vnd Londen behenckt: Jtem/ Fässer voll Bäch/ Schwäbel/ Ancken/ Vnschlit/ Pulfer/ Hartz/ Terpentin/ Honig vnd Kienholtz durch einanderen zerlassen/ vnd außgefüllt: deßgleichen häfelein voll reinen gerädenen vngelöschten Kalck vnd Füßeysen: wie auch vil hundert Füßeysen neben jhnen stehen haben. Sie sollen auch vil Bächring vnd Fewrwerck: Jtem/ Sturmpfeil/ Sturmkolben (deren kolben von Schwäbel/ Hartz/ Bäch/ Pulfer vnd Terpentin gemachet) haben: Mehr sollen oben auff der Brustwehr grosse Gassenstein: Jtem/ runde Blöcher ligen. Man solle auch haben Armbrüst vnd Pfeil/ Streitax/ Fässer voll reinen vnd pulferisierten vngelöschten Kalck/ sampt Fůßeysen: Jtem/ Fässer voll reiner wol gedörrter äschen: gantze Kessel voll Vnschlit/ Terpentin/ Hartz/ Oel/ Honig/ alt Schmär vnd Späck durch einanderen zerlassen: deßgleichen gantze Kessel heiß siedig Wasser/ darinnen äschen vnd Mähl gesotten ist: Jtem/ Büchsen/ so kurtz vnd weite mundlöcher haben/ die man mit runden Kiselsteinen lade: Es sollen auch eysene Gablen vorhanden seyn/ oder Stangen mit eysenen haacken/ die Sturmleiteren vmbzureissen/ vnd sollen etliche Compagnien zu Ross vnd fuß in einer ordnung auff dem Marckt vnd bey den Porten halten/ damit sie im fahl der noht/ je nach dem es mangelt/ die nohtleidenden secundieren mögen.
  cs: |-
    kropáče {Morgensternen}, halapartny {Hellenparten} a hole na muže dlouhé, které mají nahoře palici podobnou bednářské paličce, pobitou ostrými hřeby. Mají mít u sebe také ruční granáty, džbány naplněné prachem a ověšené doutnáky {Londen}; dále sudy naplněné smůlou, sírou, máslem, lojem, prachem, pryskyřicí, terpentýnem, medem a smolným dřevem, vše spolu rozpuštěné; rovněž hrnečky plné čistého prosetého nehašeného vápna a nášlapných ježků {Füßeysen}, jakož i mnoho set nášlapných ježků vedle sebe. Mají mít také mnoho smolných věnců {Bächring} a ohňostrojů {Fewrwerck}, dále útočné šípy {Sturmpfeil} a útočné palice {Sturmkolben} (jejichž hlavice je zhotovena ze síry, pryskyřice, smůly, prachu a terpentýnu). Dále mají nahoře na předprsni {Brustwehr} ležet velké dlažební kameny a také kulaté klády. Mají se mít také kuše a šípy, válečné sekery, sudy plné čistého, na prach rozemletého nehašeného vápna spolu s nášlapnými ježky, dále sudy plné čistého, dobře vysušeného popela, celé kotle loje, terpentýnu, pryskyřice, oleje, medu, starého sádla a špeku, spolu rozpuštěných; rovněž celé kotle horké vroucí vody, v níž se vařil popel a mouka; dále pušky {Büchsen} s krátkými a širokými ústími, které se nabíjejí kulatými křemínky. Mají být po ruce také železné vidlice nebo tyče se železnými háky, jimiž se strhávají útočné žebříky; a několik kompanií {Compagnien} jízdních i pěších má stát v šiku {ordnung} na náměstí a u bran, aby v případě nouze, podle toho, kde je čeho třeba, mohly přispět na pomoc těm, kdo jsou v tísni.
- typ: odstavec
  de: |-
    Wann nun der Sturm angehet so sollen die Constabler nicht alle zugleich loß schiessen/ sondern fleissig auff die menge des Volcks achtung geben/ vnd jhnen in die seiten das Hagelgestrew oder Carthusch gehen lassen. Die Musquetierer sollen auch dapffer arbeiten/ vnd jhre Musqueten mit hagel vnder sie gehen lassen/ auch einander fleissig entsetzen. Vnd dann/ so sollen etliche Trouppen durch die Soratori oder heimliche eyngäng in den Graben dem Feind mit grossem geschrey in die seiten fallen: die vbrigen aber sollen sich mit Schlachtschwerteren/ Morgensternen/ Hellenparten/ angesteckten Sturmkolben/ Streitaxen/ Armbrusten/ Gassensteinen/ Handgranaten/ welche zerspringen vnd häßlich sprützen: Jtem/ mit krügleinen so von Kalck vnd Fůßeysen außgefüllt/ damit die Feind dareyn tretten/ das Kalck aber jhnen in die augen stiebe: Jtem/ mit Fässern voll Kalck vnd äschen/ auff daß die Feind darvon nicht sehen/ vnd halb ersticken/ erwehren: die Blöcker von dem Wal/ den anlauffenden Feind zu ruck zu halten/ vnd jhme arm vnd bein zu brechen/ hinab lassen rolen. Sie sollen auch Fewrwerck/ so nicht leichtlich zu löschen seind/ in den Graben werffen/ damit man des Nachts des Feinds fürhaben gesehen möge. Darnach so sollen die grossen Granaten vnd andere Kuglen gespielt werden/ welche durch jhre schläg vnn das zerspringen grausamen schaden thun: die Sturmschlägel mit schlägen sollen auch nicht vergessen werden/ welche
  cs: |-
    Když pak útok {Sturm} začne, nemají konstáblové {Constabler} vypálit všichni najednou, nýbrž bedlivě sledovat, kde je lidu nejvíc, a pustit jim do boku kartáčovou střelu {Hagelgestrew} nebo kartuše {Carthusch}. Také mušketýři mají statečně pracovat, pálit mezi ně z mušket broky {hagel} a pilně se navzájem střídat. Potom mají některé oddíly {Trouppen} vyrazit výpadními brankami {Soratori}[^1] neboli tajnými vchody do příkopu a s velkým křikem vpadnout nepříteli do boku; ostatní se však mají bránit obouručními meči {Schlachtschwerteren}, kropáči, halapartnami, zapálenými útočnými palicemi, válečnými sekerami, kušemi, dlažebními kameny a ručními granáty, které se roztrhnou a ošklivě rozstříknou; dále džbánky naplněnými vápnem a nášlapnými ježky {Fůßeysen}, aby do nich nepřátelé šlapali a vápno jim prášilo do očí; dále sudy plnými vápna a popela, aby nepřátelé neviděli a napůl se dusili; a z valu mají pouštět dolů klády, aby dotírajícího nepřítele zadržely a lámaly mu ruce i nohy. Mají také házet do příkopu ohňostroje {Fewrwerck}, které se nedají snadno uhasit, aby bylo v noci vidět, co nepřítel chystá. Potom se mají pouštět do hry velké granáty a jiné koule, které svými náložemi {schläg} a roztržením působí hroznou škodu; nemá se zapomínat ani na útočné palice {Sturmschlägel} s náložemi, které
poznamky:
- n: 1
  text: Soratori – snad zkomolené ital. sortita, „výpad“; tj. výpadní branky (poterny) vedoucí z pevnosti do příkopu.
