  popis: |-
    Mědirytina k Prvnímu dílu, vpravo dole označená *blat II* („list II“, v textu „das 2. Kupffer“). Zobrazuje překážky, šancovní koše a polní díla, každé označené *fig.* a písmenem.
    *Fig. B*: kůlový plot {Stagketen} – řada hranatých kůlů spojených nahoře dvěma trámy, osazená v základových trámech (str. 13).
    *Fig. C*: palisády {Palissaden} – svazek kulatých kůlů dole zahrocených, s vbitými železnými hřeby trčícími jako rohy (str. 14).
    *Fig. D*: útočná kozlice {Sturmhäspel} („frízský jezdec“) – kmen, jímž jsou do hvězdy prostrčeny zahrocené poloviční píky (str. 14–15).
    *Fig. L*: dva čtyřhroté nášlapné železné ježky (Fußängel), z nichž jeden hrot vždy trčí vzhůru (str. 15).
    *Fig. G*: jednotlivý šancovní koš {Schantzkorb} upletený z prutů na zahrocených kůlech (str. 15–16).
    *Fig. E*: dva šancovní koše jako předprseň pro dělo, mezi nimi dělo na lafetě a puškař s doutnákem; vlevo nahoře muž, který střílí zpoza malých střeleckých košíků (Schützenkörblein) postavených na předprsni (str. 16–17).
    *Fig. F*: předprseň baterie sestavená z mnoha šancovních košů, z jejíž střílny vychází dým výstřelu (str. 9–10 a 16).
    *Fig. H*: baterie na navršeném násypu – děla mezi šancovními koši během palby (str. 9–10).
    *Fig. I*: půdorys fronty opevnění – kurtina mezi dvěma baštami s čárkovanými obrannými liniemi; k ní vedou klikaté aproše {Approchen} (*fig. K*) se třemi bateriemi (str. 17).
    Výklad cizích slov (strany vyklad-3 a vyklad-4) cituje „das 2. Kupffer“ s jinými písmeny, než nese rytina: baterie fig. B, kůlový plot fig. D, palisády fig. B, útočná kozlice fig. E, nášlapní ježci fig. F, šancovní koše fig. H, střelecké košíky fig. I, aproše fig. K. Shoduje se jen písmeno K, ostatní odkazy výkladu k této rytině nesedí (na stranách výkladu je skutečné písmeno doplněno v hranatých závorkách). Věcně list patří ke stranám 9–10 (baterie) a 13–17 (kůlové ploty, palisády, útočné kozlice, nášlapní ježci, šancovní koše, střelecké košíky, aproše). Podle pokynu knihaři z roku 1651 se má vevázat za stranu 12 („das ander klein mit den Stacketen/ Schantzkörben“).
