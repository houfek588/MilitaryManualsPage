  de: |-
    schuldig/ biß in den todt zu halten: wie wir dann zu dem Allerhöchsten steiffe hoffnung haben/ Er vns hierzu sein Gnad verleihen werde.
  cs: |-
    povinni, dodržíme až do smrti; v čemž máme pevnou naději v Nejvyššího, že nám k tomu udělí svou milost.“
- typ: nadpis
  uroven: 2
  de: |-
    Wann der Feind für die Vestung kommt/ wie man sich alßdann verhalten solle.
  cs: Jak si počínat, když nepřítel přitáhne před pevnost.
- typ: odstavec
  de: |-
    So bald ein Vestung mit der Reuterey berennt wird/ soll man alle Vhren vnd Glockenstreich hinderstellig machen/ auch nicht leuten/ so lang man belägert ist: Es sollen auch allerley Fewrwerck præpariert werden: die Constabler sollen keinen schuß thun/ biß sie meynen er seye gantz wol vnder einem Hauffen angelegt. Das meiste Volck leget man in die aussere Werck: Vil äschen/ Mist/ Holtz/ Kalck/ Stein/ hauffen mit Sand vnd Erden werden durch das vnnütz Gesindlein zusammen getragen. Man versihet sich auch mit Küh-häuten/ Fewreymeren/ Gelten/ Küblen/ Fewrhaacken/ Eymeren/ Fewrsprützen/ etc. welche man ins Wasser zu wäichen legt/ das Fewr darmit zu löschen. Die nechsten Häuser jnnert dem Wal/ die man meynt der Feind angreiffen werde/ sollen oben abgenommen/ vnd mit Stein/ Holtz/ Sand/ Mist/ Erden vnd anderem außgefüllt werden: auch die Gassen mit eysenen Ketten vermachet: vnd also zwischen den Häuseren tieffe Gräben vnd Brustwehrinen gemacht/ damit/ wo der Feind etwan den Wal in einem ort eroberte/ auffgehalten/ vnd widerumb hindersich getriben werden möge. Die Porten soll man innwendig mit Mist/ Holtz/ Höw/ Stroh/ Sand/ Erden/ Stein/ vnd anderem wol vermachen: alle Proviant- vnd Zeughäuser sollen vor Fewr wol verwahret werden: Man soll auch Retrenche/ Ausserwerck/ Gegenlauffgräben/ Schützenkörblein/ Schantzkörb/ Lämeysen/ jrdine/ metalline/ höltzine vnd innwendig außgehölete Kuglen/ so mit allerley Fewrwerck außgefüllt werden/ haben: Man soll sich auch mit Höw zu den Stücken/ mit Stagketen/ Palissaden/ Sturmhäspeln/ Sturmpfälen/ grossen eysenen Näglen/ Morgensternen/ Böhmischen Ohrlöfflen/ Sturmkolben/ so vornen in Bäch/ Schwäbel/ Pulfer/ Hartz vnd Terpentin wol geduncket seind/ versehen: Es soll auch vngelöschter Kalck geräden/ gepülfert vnd getröcknet werden: auch allerley Bächring/ Handgranaten/ fässer mit Pulfer/ fäßlein mit Kalck/ Leiterwägen/ so mit Mist vnd Erden gefüllt vnd zu den Sprengenen gebraucht werden: deßgleichen grosse runde Blöcher/ Stein/ vnd dergleichen auff die Brustwehr gelegt/ vnd im fahl der noht hinunder gerollet vnd geworffen werden. Alles Volck soll mit Kraut vnd Loth genugsam versehen seyn/ vnd tag vnd nacht am Wal ligen. Der Cavalieurs vnd Ausserwercken soll auch nicht vergessen/ die Proviant durchgangen/ derselben mangel verbessert/ vnd alles/ wie gering es joch seye/ zu raht gehalten/ das Pulfer vnd Kuglen in kleine fäßlein/ damit ein Mann eins tragen möge/ gethan; alles Ertz/ Kupffer/ Zinn/ Bley- vnd Eysenwerck auß allen Häuseren genommen/ zu hauffen getragen: die Batterey vnd Brüginen derselben verbesseret/ Wollsäck/ Schantz- vnn Schützenkörblein
  cs: |-
    Jakmile jízda pevnost obklíčí, mají se zastavit všechny hodiny a odbíjení a po celou dobu obležení se nemá zvonit. Mají se také připravit všelijaké ohňostroje {Fewrwerck}. Konstáblové {Constabler} nemají vypálit ani jednu ránu, dokud nebudou mít za to, že je dobře namířena do hustého houfu. Většinu lidu je třeba rozmístit do vnějších děl {aussere Werck}. Neužitečná chasa má snášet hodně popela, hnoje, dříví, vápna, kamení a hromady písku a hlíny. Je také třeba opatřit se kravskými kůžemi, požárními vědry, škopky, kbelíky, požárními háky, vědry, stříkačkami atd., které se kladou do vody, aby nasákly, a hasí se jimi oheň. Nejbližší domy uvnitř valu, na které by podle odhadu mohl nepřítel zaútočit, se mají shora odkrýt a vyplnit kamením, dřívím, pískem, hnojem, hlínou a jinými věcmi; také ulice se mají přehradit železnými řetězy a mezi domy se mají vykopat hluboké příkopy a zřídit předprsně {Brustwehrinen}, aby byl nepřítel zadržen a opět zahnán zpět, kdyby snad na některém místě dobyl val. Brány se mají zevnitř dobře zatarasit hnojem, dřívím, senem, slámou, pískem, hlínou, kamením a jinými věcmi. Všechny sklady proviantu a zbrojnice {Zeughäuser} je třeba dobře chránit před ohněm. Mají být také připraveny retranšementy {Retrenche}, vnější díla {Ausserwerck}, protiaproše {Gegenlauffgräben}, střelecké a šancovní koše, nášlapní ježci {Lämeysen} a hliněné, kovové a dřevěné, uvnitř vyhloubené koule, které se plní všelijakými ohňostroji. Je třeba se zásobit i senem pro děla,[^1] kůlovými ploty {Stagketen}, palisádami, útočnými kozlicemi {Sturmhäspeln}, útočnými kůly {Sturmpfälen}, velkými železnými hřeby, kropáči {Morgensternen}, českými ušatými kopími {Böhmischen Ohrlöfflen},[^2] útočnými kyji {Sturmkolben}, jejichž přední konce jsou dobře namočené ve smůle, síře, prachu, pryskyřici a terpentýnu. Nehašené vápno se má prosít, rozemlít a vysušit. Dále [je třeba] všelijakých smolných věnců {Bächring}, ručních granátů, sudů s prachem, soudků s vápnem a žebřinových vozů, které se naplní hnojem a hlínou a použijí se při výbuších min;[^3] rovněž se mají na předprseň položit velké kulaté klády, kameny a podobně, aby se v případě nouze daly svalit a shodit dolů. Všechen lid má být dostatečně zásoben prachem {Kraut} a olovem {Loth} a dnem i nocí ležet na valu. Nemá se zapomínat ani na kavalíry {Cavalieurs} a vnější díla; zásoby proviantu se mají prohlédnout a jejich nedostatek napravit a se vším, ať je to sebemenší, se má šetrně hospodařit. Prach a koule se mají rozdělit do malých soudků, aby každý unesl jeden muž; všechen bronz, měď, cín, olovo a železné předměty se mají pobrat ze všech domů a snést na hromadu; baterie {Batterey} a jejich dělové podlahy {Brüginen} se mají opravit; vlněné pytle, šancovní a střelecké košíky
poznamky:
- n: 1
  text: |-
    Seno sloužilo jako ucpávka (zátka) mezi prachem a koulí při nabíjení děla.
- n: 2
  text: |-
    Böhmischer Ohrlöffel – druh krátkého kopí či partyzány s křidélky (ušima) pod čepelí.
- n: 3
  text: |-
    „zu den Sprengenen“ – patrně k ucpání průlomů po výbuchu nepřátelských min (Sprengenen = miny, srov. str. [[074|74]]).
