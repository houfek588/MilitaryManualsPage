- typ: nadpis
  uroven: 2
  de: Nota. Wie die Kupffer sollen eyngebunden werden.
  cs: 'Poznámka: Jak se mají vevázat mědirytiny.'
- typ: odstavec
  de: |-
    1. Das erst vnd ander Kupfferblat sollen zu vorderst für das 1. blat des ersten Theils gebunden werden.
  cs: |-
    1. [[tab-01|První]] a [[tab-02|druhá]] mědirytina se mají vevázat úplně dopředu, před 1. stranu Prvního dílu.
- typ: odstavec
  de: |-
    2. Die drey Kupffer der Exereitien: Musqueten/ für das 1. blat: Spieß vnd Schilt aber zwüschen das 2. vnd 3. blat des dritten Theils Kriegsbüchleins.
  cs: |-
    2. Tři mědirytiny cviků {Exereitien}: [[tab-04|s mušketami]] před 1. stranu, [[tab-05|s píkou]] a [[tab-06|se štítem]] pak mezi 2. a 3. stranu Třetího dílu Válečné knížky.
- typ: odstavec
  de: |-
    3. Das sibende Kupffer soll zwüschen das 90. vnd 91. blat gesetzt werden.
  cs: 3. [[tab-07|Sedmá mědirytina]] se má vložit mezi strany 90 a 91.
- typ: odstavec
  de: |-
    4. Die vbrigen aber von Schlacht-Ordnungen nach der Num. der Kupfferblatten zu end des dritten Theils.
  cs: |-
    4. Ostatní, se šiky {Schlacht-Ordnungen}, pak podle čísel tabulí na konec Třetího dílu.
poznamky:
- n: 1
  text: |-
    „Gemein“ zde ve smyslu „obecný, prostý, soukromý“ (srov. franc. particulier = soukromá osoba); přesný smysl Lavaterovy glosy není jistý.
- n: 2
  text: |-
    Quartier geben – ušetřit poraženého nepřítele (dát pardon) a zaručit mu bezpečné propuštění („sicher gleit“ = bezpečný průvod, glejt).
