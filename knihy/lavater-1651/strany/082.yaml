bloky:
- typ: seznam
  pokracovani: true
  de:
  - '25. Trettet mit dem rechten fuß fürsich/ vnd schwencket die Musqueten gegen der lincken seiten.'
  - '26. Vmbträhet die Musqueten/ vnd schleiffet die Gablen.'
  - '27. Offnet ewer Massen vnd Ladungen.'
  - '28. Thut das Pulfer vnd Kuglen ins Rohr.'
  - '29. Jn zween griffen ziehet den Ladstecken auß dem Schafft der Musqueten.'
  - '30. Vmbkehrt vnd stoßt den Ladstecken an die Brust.'
  - '31. Ziehet den Ladstecken auß dem Rohr/ stoßt jhn an die Brust.'
  - '32. Widerumb in den Musquetenschafft eyngesteckt.'
  - '33. Ergreifft mit der rechten hand die Musqueten hinder der Pfannen. Trettet mit dem rechten fůß hindersich/ vnd haltet das Rohr hoch vom Leib.'
  - '34. Nemmet die Musqueten auff die Schulteren.'
  - '35. Nemmet ewere Musqueten von der Achßlen.'
  - '36. Leget die Musqueten in die Gablen.'
  - '37. Haltet ewere Musqueten auff der Gablen mit der lincken hand imgewicht.'
  - '38. Nemmet mit zween fingeren den Lunden auß der hand.'
  - '39. Blaset den Lunden ab.'
  - '40. Straubet den Lunden auff.'
  - '41. Probiert den Lunden.'
  - '42. Decket ewere Pfannen mit zween fingeren.'
  cs:
  - '25. Vykročte pravou nohou vpřed a přehoďte mušketu {Musqueten} k levé straně.'
  - '26. Obraťte mušketu a vlečte vidlici {Gablen}.'
  - '27. Otevřete své měrky {Massen} a nálože {Ladungen}[^1].'
  - '28. Nasypte prach a vložte kouli do hlavně.'
  - '29. Dvěma chvaty vytáhněte nabiják {Ladstecken} z pažby mušketě.'
  - '30. Obraťte nabiják a opřete ho o prsa.'
  - '31. Vytáhněte nabiják z hlavně, opřete ho o prsa.'
  - '32. Zase zastrčit do pažby mušketě.'
  - '33. Uchopte pravou rukou mušketu za pánvičkou. Pravou nohou ustupte vzad a držte hlaveň vysoko od těla.'
  - '34. Vezměte mušketu na rameno.'
  - '35. Sejměte mušketu z ramene.'
  - '36. Položte mušketu do vidlice.'
  - '37. Držte mušketu na vidlici levou rukou v rovnováze.'
  - '38. Vezměte dvěma prsty doutnák {Lunden} z ruky.'
  - '39. Ofoukněte doutnák.'
  - '40. Upevněte doutnák.'
  - '41. Vyzkoušejte doutnák.'
  - '42. Zakryjte pánvičku dvěma prsty.'
- typ: nadpis
  uroven: 3
  de: Die Wörter mit der Musqueten ohne Gablen.
  cs: Povely s mušketou bez vidlice
- typ: seznam
  de:
  - '1. Nemmet die Musqueten auff die Achßlen/ vnd den Lunden in die lincke hand.'
  - '2. Trettet mit dem rechten fůß hindersich/ vnd laßt vornen die Musqueten sincken.'
  - '3. Ergreiffet mit der rechten hand die Musqueten hinder der Pfannen.'
  - '4. Nemmet die Musqueten von der Achßlen/ vnd haltets vom Leib hoch.'
  - '5. Leget die Musqueten in die lincke hand/ vnd trettet mit dem rechten füß hindersich.'
  - '6. Nemmet mit zween fingeren den Lunden auß der lincken hand.'
  - '7. Blaset den Lunden hinder der Pfannen ab.'
  - '8. Straubt den Lunden auff.'
  - '9. Decket mit zween fingeren die Pfannen.'
  - '10. Blaset den Lunden ab.'
  - '11. Offnet die Pfannen.'
  - '12. Das Rohr vornen hoch.'
  - '13. Leget an/ vnd brennet loß.'
  - '14. Rechts oder lincks abtretten.'
  - '15. Den Lunden abgenommen.'
  - '16. Mit dem Daumenfinger die Pfannen außgebutzt.'
  - '17. Zündpulfer in die Pfann/ vnd beschlossen.'
  - '18. Trettet mit dem rechten fůß fürsich/ vnd schwencket die Musqueten an die lincke seiten.'
  - '19. Die Musqueten vmbträhet.'
  - '20. Pulfer vnd Kugel ins Rohr.'
  - '21. Ziehet den Ladstecken auß.'
  - '22. Vmbkehrt den Ladstecken vnd an die Brust gestossen.'
  - '23. Den Ladstecken in das Rohr/ vnd stampfft das Pulfer.'
  - '24. Den Ladstecken widerumb außgezogen.'
  - '25. Vmbkehrt den Ladstecken/ vnd an die Brust stoßt.'
  - '26. Stecket jhn widerumb in den Schafft.'
  - '27. Bringet mit der lincken hand die Musqueten herfür/ ergreifft die Musqueten hinder der Pfannen.'
  - '28. Trettet mit dem rechten fůß hindersich/ vnd haltet das Rohr hoch vom Leib.'
  - '29. Nemmet das Rohr widerumb auff die Achßlen.'
  cs:
  - '1. Vezměte mušketu na rameno a doutnák do levé ruky.'
  - '2. Pravou nohou ustupte vzad a nechte mušketu vpředu klesnout.'
  - '3. Uchopte pravou rukou mušketu za pánvičkou.'
  - '4. Sejměte mušketu z ramene a držte ji vysoko od těla.'
  - '5. Vložte mušketu do levé ruky a pravou nohou ustupte vzad.'
  - '6. Vezměte dvěma prsty doutnák z levé ruky.'
  - '7. Za pánvičkou ofoukněte doutnák.'
  - '8. Upevněte doutnák.'
  - '9. Zakryjte dvěma prsty pánvičku.'
  - '10. Ofoukněte doutnák.'
  - '11. Otevřete pánvičku.'
  - '12. Hlaveň vpředu vzhůru.'
  - '13. Zaličte a vypalte.'
  - '14. Vpravo nebo vlevo odstoupit.'
  - '15. Doutnák sejmout.'
  - '16. Palcem pánvičku vyčistit.'
  - '17. Zápalný prach na pánvičku a zavřít.'
  - '18. Vykročte pravou nohou vpřed a přehoďte mušketu k levé straně.'
  - '19. Mušketu obrátit.'
  - '20. Prach a kouli do hlavně.'
  - '21. Vytáhněte nabiják.'
  - '22. Nabiják obrátit a opřít o prsa.'
  - '23. Nabiják do hlavně a upěchujte prach.'
  - '24. Nabiják zase vytáhnout.'
  - '25. Obraťte nabiják a opřete ho o prsa.'
  - '26. Zastrčte ho zase do pažby.'
  - '27. Přiveďte levou rukou mušketu před sebe, uchopte mušketu za pánvičkou.'
  - '28. Pravou nohou ustupte vzad a držte hlaveň vysoko od těla.'
  - '29. Vezměte hlaveň {Rohr} zase na rameno.'
poznamky:
- n: 1
  text: Měrky a nálože – dřevěná či plechová pouzdérka s odměřenou dávkou prachu zavěšená na bandalíru (bandalír s „apoštoly“).
