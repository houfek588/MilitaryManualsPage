bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    seiten stellt sich 2. der ander bruch fein gleich in Reyen vnd Glider/ vnd also fortan/ je ein bruch dem anderen an sein lincke seiten.
  cs: |-
    straně se postaví 2, druhý oddíl, pěkně vyrovnaný v zástupech {Reyen} a řadách {Glider}, a tak dále, vždy jeden oddíl {bruch} po levém boku druhého.
- typ: nadpis
  uroven: 2
  de: Wie man die erste Schlachtordnung mit einer Compagnie machen solle.
  cs: Jak se má tvořit první bitevní šik s jednou kompanií
- typ: odstavec
  de: |-
    Darvon besihe obangezogen ander Kupfferblat mit der grossenzahl V. Dise mache also: Marschiere mit 1. dem ersten flügel oder bruch Musquetierer für die Ordnung beyseits hinauff: also thue auch mit 8. dem letsten flügel oder bruch Musquetierer/ vnd bleibe mit den vbrigen Squadronen oder flüglen 2. 3. 4. 5. 6. 7. in jhrer guten Distantz vnd Ordnung stehen.
  cs: |-
    K tomu viz výše uvedenou druhou mědirytinu {Kupfferblat}, [část] s velkým číslem V. Ten [šik] utvoř takto: S 1, prvním křídlem neboli oddílem mušketýrů {Musquetierer}, vytáhni stranou dopředu před šik; totéž učiň s 8, posledním křídlem neboli oddílem mušketýrů, a se zbylými švadronami {Squadronen} neboli křídly 2, 3, 4, 5, 6, 7 zůstaň stát v jejich náležitém rozestupu {Distantz} a pořádku.
- typ: nadpis
  uroven: 3
  de: Worzu solche Battaille oder Schlachtordnung dienstlich/ vnd wie man darmit fechten solle.
  cs: K čemu slouží takový šik {Battaille} neboli bitevní sestava a jak se s ním má bojovat
- typ: odstavec
  de: |-
    Wann du dich mit dem Feind zu schlagen bedacht/ so lasse sich die Musquetierer mit Kraut/ Loth vnd Lunden wol versehen: die Lunden an beyden enden anstecken/ Kuglen in den Mund nemmen/ vnd die Kriegssäck vnd anders/ so jhnen verhinderlich von sich auff einen hauffen legen/ führe alßdann die erste 2. Squadronen Musquetierer so mit 1. vnd 8. bezeichnet gegen deinem Feind an: Jnzwüschen sollen die vbrigen Musquetierer sich auch gefaßt halten/ vnd beyneben den Spießknechten sich auff den boden nider thun/ damit das geschooß vber sie hinauß gehe/ vnd nichts schaden möge. Jm scharmützieren sollen die Musquetierer gliderweis einanderen ablösen/ vnd auff den knien vnd gerad für sich hinauß gegen des Feinds knien fewr geben/ vnd sich im laden/ wie du vornen in disem Büchlein gelehret bist/ verhalten. Es soll auch die Ordnung allgemach vnderweilen hinnach rucken/ vnd sich allzeit widerumb darnider lassen. Wo nun die 2. ersten Squadronen Musquetierer das jhrige gethan/ so sollen die vbrigen 2. Squadronen 7. vnd 2. Musquetierer mit einem frischen muht vnd geschrey auffwütschen vnd die ersten entsetzen/ vnd auff ein newes angreiffen/ die abgelößten aber widerumb jhre alte Distantz oder Stell neben die Spieß auff beyden seiten nemmen/ sich widerumb ermunteren vnd mit Kraut vnd Loth versehen/ vnd darnach jhre erlöser widerumb entsetzen/ so lang vnd vil die hauffen auff einanderen stossen/ alßdann so sollen auch die Spießknecht auffwütschen vnd mit grossem geschrey auff den Feind anfallen. Es sollen auch etliche mit grossen Prüglen vnd Helleparten auff die seiten gecommandiert werden/ welche die Spieß des Feinds zuvorderst in den boden oder auffwerts schlagen/ so dann ein grosser vortheil/ vnd dargegen dem Feind einen grossen nachtheil bringet. Es soll auch der Fendrich in der mitte der Spiessen vnd wol bedeckt halten/ vnd seinen Fahnen empor heben/ vnd fliegen lassen.
  cs: |-
    Když se rozhodneš bít se s nepřítelem, nech mušketýry dobře zásobit prachem {Kraut}, olovem {Loth} a doutnáky {Lunden}: doutnáky ať zapálí na obou koncích, kule vezmou do úst a polní vaky {Kriegssäck} a jiné věci, které by jim překážely, odloží na jednu hromadu. Potom veď proti nepříteli první 2 švadrony mušketýrů, označené 1 a 8. Mezitím se mají ostatní mušketýři také držet v pohotovosti a spolu s pikenýry {Spießknechten} si lehnout na zem, aby střely letěly přes ně a nemohly jim uškodit. Při šarvátce se mají mušketýři po řadách střídat a pálit vkleče přímo před sebe, nepříteli na kolena, a při nabíjení si mají počínat tak, jak tě to učí dříve v této knížce. Také šik se má občas pomalu posunout za nimi a pokaždé si zase lehnout. Když první 2 švadrony mušketýrů vykonají své, mají zbylé 2 švadrony mušketýrů, 7 a 2, se svěží odvahou a s pokřikem vyskočit, první vystřídat a znovu udeřit; vystřídaní pak mají opět zaujmout své dřívější postavení či místo vedle pík na obou stranách, znovu se vzpamatovat, doplnit prach a olovo a potom zase vystřídat ty, kdo vystřídali je – a to tak dlouho, dokud se houfy nesrazí. Potom mají také pikenýři vyskočit a s velkým pokřikem udeřit na nepřítele. Několik [mužů] s velkými kyji a halapartnami {Helleparten} se má také vyslat na boky, aby nepřátelské píky u hrotů sráželi k zemi nebo vzhůru; to přináší velkou výhodu a naopak nepříteli velkou škodu. Praporečník {Fendrich} se má držet uprostřed pík, dobře krytý, prapor zvedat vysoko a nechat jej vlát.
- typ: nadpis
  uroven: 2
  de: Die ander Bataille oder Schlachtordnung.
  cs: Druhý šik neboli bitevní sestava
- typ: odstavec
  de: |-
    Darvon besihe das ander Kupfferblat mit der grossen zahl VI.
  cs: |-
    K tomu viz druhou mědirytinu, [část] velkým číslem VI
