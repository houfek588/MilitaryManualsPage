  pokracovani: true
  de: |-
    zur rechten hand in 6. Gliderstellen: zur lincken seiten lasse die Spieß von allen 8. Compagnien vnd gantzem Regiment neben die Musquetierer hinan ziehen/ sich jhren Glideren vnd Reyen gleich stellen: alßdann so stelle die vbrigen Musquetierer der letsten 4. Compagnien neben die Spieß auch auff die lincke hand in gleiche Reyen vnd Glider. Wann du nun ein Zugordnung machen wilt/ so kanst du deß ersten je ein Squadron/ oder je 2. oder 4. oder 6. oder 8. Squadronen Musquetierer neben einanderen marschieren lassen/ je nach dem Paß vnd Weg ist: vnd da die Musquetierer von 2. Compagnien also ziehen/ so soll ein zimliche weite gelassen werden/ vnd darauff ein Regimentsstücklein folgen: alßdann die vbrigen Squadronen Musquetierer von den ersten 4. Compagnien: vnd darauff widerumb ein Regimentsstücklein: auff solche folgen die ersten Squadronen Spieß von 4. Compagnien: widerumb die 8. Fendlein des gantzen Regiments mit den letsten Squadronen Spieß der 4. letsten Compagnien: alßdann wird ein weite gelassen: auff solche kommen zwey Regimentsstücklein/ sammt dem halben theil Musquetierer der 4. letsteren Compagnien/ auff solche widerumb ein Regimentsstücklein/ vnd zu letst der vbrige halbe theil Musquetierer der 4. letsteren Compagnien. Man soll aber/ man marschiere gleich Trouppen/ halb- oder gantzen Compagnien- oder Regimenterweis/ allzeit ein verlohrnen Trouppen Musquetierer/ so auß allen Compagnien commandiert wird/ so weit vorher marschieren lassen/ daß man sie bloß sehen mag: dise sollen den weg entdecken/ vnd sehen ob Feind vorhanden/ vnd ob er sich etwan versteckt hette: deßgleichen sollen auch zur seiten vnd hinden Musquetierer seiten vnd hinderwachten commandiert werden. Wann man aber ein Fundamentsordnung mit einem gantzen Regiment formieren will so sollen allzeit von 2. Compagnien die Musquetierer in einen Trouppen gebracht werden/ vnd so das geschicht/ so kommen in ein Glid 24. Musquetierer/ vnd in einen Reyen 6. Mann/ gibt 6. Glider/ diser flügel/ Trouppen oder Squadron haltet/ deme marschiert auff die rechte seiten ein wenig vorauß/ sein Regimentsstücklein: disem flügel Musquetierer marschiert alßdann der ander Trouppen Musquetierer von 2. Compagnien in gleichen Glideren vnd Reyen an die lincke seiten/ vnd an dieselben sein Regimentsstücklein/ vnd wird alßdann ein weite oder platz gelassen/ da dann die Spieß sich alle zugleich in ein gevierte Ordnung stellen/ vnd seind an der höhe den Musquetierern zu der rechten seiten gleich: die Fendlein aber halten vor den Spiessen in der mitte/ vnd werden widerumb 2. Regimentstücklein/ das eine neben die Spieß zur rechten/ das ander aber neben die Spieß zur lincken seiten hinan geführt: neben disere Spieß werden in gleicher form zur lincken seiten die vbrigen letsten Musquetierer/ von den 4. letsteren Compagnien/ in gleicher höhe vnd breite/ wie die Musquetierer zur rechten seiten/ sampt jedes Trouppen Regimentsstücklein angeführt vnd beschlossen. Wann du nun
  cs: |-
    postavit po pravé ruce do 6 řad {Glider}; po levé straně nech přitáhnout píky {Spieß} ze všech 8 kompanií {Compagnien} a celého pluku vedle mušketýrů {Musquetierer} a vyrovnat se s jejich řadami a zástupy {Reyen}; potom postav zbylé mušketýry posledních 4 kompanií vedle pík rovněž po levé ruce do stejných zástupů a řad. Chceš-li pak utvořit pochodový šik {Zugordnung}, můžeš nejprve nechat pochodovat vedle sebe vždy jednu švadronu {Squadron} nebo 2, 4, 6 či 8 švadron mušketýrů, podle toho, jaký je průsmyk a cesta; a když takto táhnou mušketýři 2 kompanií, má se nechat přiměřená mezera a za ní má následovat plukovní dělko {Regimentsstücklein}; potom zbylé švadrony mušketýrů z prvních 4 kompanií a za nimi opět plukovní dělko; za nimi následují první švadrony pík ze 4 kompanií; opět 8 praporců {Fendlein} celého pluku s posledními švadronami pík 4 posledních kompanií; potom se nechá mezera; za ni přijdou dvě plukovní dělka spolu s polovinou mušketýrů 4 posledních kompanií, za nimi opět plukovní dělko a nakonec zbylá polovina mušketýrů 4 posledních kompanií. Ať se však pochoduje po houfech {Trouppen}, po polovičních či celých kompaniích nebo po plucích, má se vždy nechat jít napřed ztracený houf {verlohrnen Trouppen} mušketýrů, vyčleněný ze všech kompanií, tak daleko, aby byl ještě sotva vidět: ten má prozkoumat cestu a hledět, zda je nepřítel nablízku a zda se snad neskryl; stejně tak se mají na bocích a vzadu vyčlenit mušketýři jako boční a zadní stráže. Chce-li se však s celým plukem zformovat základní šik {Fundamentsordnung}, mají se vždy mušketýři 2 kompanií spojit do jednoho houfu; a když se tak stane, přijde do jedné řady 24 mušketýrů a do jednoho zástupu 6 mužů, což dává 6 řad. Toto křídlo, houf čili švadrona stojí a po jeho pravé straně jde kousek napřed jeho plukovní dělko; k tomuto křídlu mušketýrů pak po levé straně přitáhne druhý houf mušketýrů 2 kompanií ve stejných řadách a zástupech a vedle něj jeho plukovní dělko. Potom se nechá mezera čili místo, kde se všechny píky naráz postaví do čtvercového šiku a do hloubky se vyrovnají mušketýrům na pravé straně; praporce však stojí před pikami uprostřed a opět se přivedou 2 plukovní dělka, jedno vedle pík napravo, druhé vedle pík nalevo. Vedle těchto pík se stejným způsobem po levé straně přivedou a [šik] uzavřou zbylí, poslední mušketýři ze 4 posledních kompanií, ve stejné hloubce a šířce jako mušketýři na pravé straně, spolu s plukovním dělkem každého houfu. Chceš-li nyní
