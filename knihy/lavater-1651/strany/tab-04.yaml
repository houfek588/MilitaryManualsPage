  popis: |-
    Skládaná dvoustránková mědirytina, vlevo dole označená *Bl. iii* („list III“). Zobrazuje cvičení mušketýra s mušketou a vidlicí {Gabel}: zhruba čtyřicet postav mušketýrů v klobouku s pérem, s bandalírem, kordem a doutnákem ve čtyřech vodorovných pásech, které se čtou zleva doprava přes obě poloviny listu. Postavy nejsou číslované (několik jich zakrývá hřbet vazby), pořadím ale odpovídají 42 povelům oddílu „Das Exercitium mit der Musqueten vnd Gablen zugleich“ na stranách [[081|81]]–[[082|82]]. První pás začíná mušketou na rameni a vidlicí s doutnákem v levé ruce (povel 1) a pokračuje přípravou doutnáku a pánvičky. Druhý pás začíná výstřelem z muškety položené na vidlici (povel 13) a pokračuje odstoupením a nasypáním prachu na pánvičku. Třetí pás ukazuje nabíjení s mušketou skloněnou k levému boku a s nabijákem. Ve čtvrtém pásu je mušketa znovu na vidlici a mušketýr připravuje doutnák k další ráně.
    Podle pokynu knihaři z roku 1651 se má vevázat před stranu [[081|81]] (začátek Třetího dílu); starší pokyn na straně slovnicek-2 ji řadí „für das 1. blat … des dritten Theils“.
