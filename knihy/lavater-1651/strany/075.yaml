bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    ist nicht möglich darauff zu antworten. Doch ist hoch nohtwendig/ daß man das Geschütz gegen des Feinds Geschütz richte/ vnd also gegen des Feinds Battereyen Contrabattereyen mache: dann wo kein Offension/ da ist keiner Defension vom Geschütz nöhtig/ etc. Man soll auch das Geschütz nicht alles an die gefahrlichsten ort stellen/ sondern etliche auch an den allersichersten ort zum vorraht behalten. Du hast aber gehört vornen an seinem ort/ wie daß am besten die Stück/ Mörser vnd Doppelhaacken/ etc. in den Bollwercken stehen/ die theils in die Facen oder Stirnen/ theils in die Espaulen oder Streychwehrinen abgetheilt werden: es seye dann daß man kein Defension brauchen/ sondern den Feind in freyem Feld beschädigen wölle/ so stellt man etliche in die Courtine. Du solt auch deinen Ronde-weg erweiteren/ vnd Stück in die Faussebrayen plantieren: die Stück werden auch in die Contrascarpa gestellt/ darauß die schüß dem Horizont parallel gehen/ vnd sollen Battereyen oder Brittschen/ wie vornen gemeldt/ darzu gemachet werden. Man sencket auch die Battereyen wo hohes Land ist/ 7. oder 8. schuh tieff/ vnd vngefahr 7. schuh breit vnd lang in die Erden/ vnd heißt man dieselbige/ eyngesenckte Battereyen: dann solche vnder dem Horizont gemachet werden sollen. Man machet auch Cavalieurs vnd Platteformen/ von welchen ich vornen angezogen hab/ darauff werden auch die Stück gestellt. Wie du dich auch mit den Schantzkörben/ Wollsäcken/ Schützenkörbleinen/ Wolsäcklein/ Sandsäcken/ Palissaden/ Stagketen/ Barricaden/ Sturm- vnd anderen Pfälen: Jtem/ mit Mist vnd anderem versehen sollest/ bist du vornen genugsam gelehret.
  cs: |-
    nelze na to odpovědět. Je však velmi nutné obrátit děla proti nepřátelským dělům, a tak proti nepřátelským bateriím {Battereyen} zřizovat kontrabaterie {Contrabattereyen}; neboť kde není útoku {Offension}, není ani zapotřebí obrany {Defension} děly atd. Nemají se také všechna děla stavět na nejnebezpečnější místa, nýbrž některá se mají ponechat v záloze i na nejbezpečnějších místech. Slyšel jsi však již dříve na příslušném místě, že děla {Stück}, moždíře {Mörser} a hákovnice {Doppelhaacken} atd. stojí nejlépe na baštách {Bollwercken}, kde se rozdělují zčásti na čela {Facen} neboli líce {Stirnen}, zčásti na ramena {Espaulen} neboli flanky {Streychwehrinen}; ledaže by obrana nebyla zapotřebí, ale chtělo se nepříteli škodit v otevřeném poli – pak se některá postaví na kurtinu {Courtine}. Máš také rozšířit svou obchůzkovou cestu {Ronde-weg} a rozestavit děla na dolní val {Faussebrayen}; děla se staví také na kontreskarpu {Contrascarpa}, odkud jdou rány rovnoběžně s obzorem, a k tomu se mají zřídit baterie neboli palebné plošiny {Brittschen}, jak bylo uvedeno výše. Kde je terén vysoký, zapouštějí se baterie také do země, 7 nebo 8 stop hluboko a přibližně 7 stop zšíří i zdélí, a nazývají se zapuštěné baterie, neboť se mají zřizovat pod obzorem. Dělají se také kavalíry {Cavalieurs} a plošiny {Platteformen}, o nichž jsem se zmínil výše; i na ně se staví děla. Jak se máš zásobit šancovními koši, pytli s vlnou, střeleckými košíky {Schützenkörbleinen}, pytlíky s vlnou, pytli s pískem, palisádami, kůlovými ploty {Stagketen}, barikádami, útočnými a jinými kůly, dále hnojem a jinými věcmi, o tom jsi byl výše dostatečně poučen.
- typ: nadpis
  uroven: 2
  de: 'Von den Contra- oder Gegenapprochen: was sie seyen.'
  cs: 'O kontraaproších neboli protiaproších: co jsou'
- typ: odstavec
  de: |-
    Es seind Lauffgräben/ so gegen des Feinds Approchen gemachet werden/ vnd werden also angestellt/ daß sie des Feinds seiten in den Lauffgräben entdecken vnd bloß machen mögen. Doch sollen selbige angestellt werden/ daß sie wol secundiert/ vnd dem Feind/ da er sie darauß treibet kein vortheil seyenvnd mit Musqueten vnd Stücken vber sie gereichet/ vnd sie defendiert wer/ den mögen. Solche Gegenlauffgräben seind vngefahr lang 60. ruthen/ der Graben 6. schuh tieff/ vnd 5. schuh weit: vnd dann theilt man die Erden zu beyden seiten. Man machet auch wider die Approchen allerley gegenwehr/ Ausser- oder Vorwerck/ alß Horn- Kronwerck/ Ravelein/ halbe Mön/ etc. darvon genugsamen bericht an seinem ort allbereit empfangen haben wirst.
  cs: |-
    Jsou to aproše {Lauffgräben}, které se vedou proti nepřátelským aproším {Approchen}, a zakládají se tak, aby odkrývaly a obnažovaly nepříteli bok v jeho aproších. Mají se však zakládat tak, aby byly dobře podporovány {secundiert} a aby nepříteli, kdyby z nich [obránce] vyhnal, nebyly k výhodě, a aby se přes ně dalo dostřelit mušketami a děly a tak je hájit. Takové protiaproše {Gegenlauffgräben} bývají asi 60 prutů dlouhé, zákop 6 stop hluboký a 5 stop široký; zemina se pak rozhrne na obě strany. Proti aproším se dělají také všelijaká obranná díla, vnější neboli předsunutá díla {Ausser- oder Vorwerck}, jako hornwerky {Horn-}, korunní díla {Kronwerck}, raveliny {Ravelein}, půlměsíce {halbe Mön} atd., o nichž ses už na příslušném místě dostatečně poučil.
- typ: nadpis
  uroven: 2
  de: Wie man sich in mangel der Kuglen verhalten solle.
  cs: Jak si počínat při nedostatku koulí
- typ: odstavec
  de: |-
