bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    den Tranchen werden auch öffnungen gelassen zum auß- vnd eyngang/ vnd ist derselben breite 7. oder 8. schuh/ nach gelegenheit/ so in feinds gefahr mit Palissaden vermachet werden: vnd wann man sich also eyngeschantzet oder eyntrenchiert hat/ soll man anfangen sich gegen der Statt zu mit Lauffgräben approchieren/ oder näheren/ wie folget.
  cs: |-
    V zákopech {Tranchen} se také nechávají otvory k vycházení a vcházení, široké podle potřeby 7 nebo 8 stop, které se při nebezpečí od nepřítele zahrazují palisádami {Palissaden}. A když se vojsko takto zašancuje neboli zakope, má se začít přibližovat {approchieren} k městu aprošemi {Lauffgräben}, jak následuje.
- typ: nadpis
  uroven: 2
  de: |-
    Wie man die Lauffgräben zu machen anfange.
  cs: Jak se začínají kopat aproše.
- typ: odstavec
  de: |-
    Eh daß man anfanget/ soll man vor allen dingen die Erden erkennen: Büsch/ Hecken/ Weg/ Hölinen/ Bäum/ Hügel/ Berg vnd Thal ist auch ein guter behelff darzu. Man solle die auff 1000. schuh anfangen: etlicher meynung ist ein schuß von einem Doppelhaacken: dann je näher man bey dem Quartier anfanget/ je besser man von dem Quartier selbige defendieren kan. Man soll auch sehen/ wo man der Vestung am besten beykommen möge: vnd seind die face/ puncten vnd eck der Bollwerck am allerschwächsten. Wann nun der anfang geschehen soll/ so werden von jeder Compagnie 10. oder mehr/ oder minder Soldaten mit Bawren-Jnstrumenten/ alß Bickel/ Hawen/ Schaufflen/ etc. gecommandiert/ die werden von dem Jngenieur in ein gerade linea deß nachts/ da es finster ist/ angeführt/ vnd in ein jede růthen 3. oder 4. Mann gestellet/ doch so vil es möglich/ daß das Volck aussert gefahr seye: man setzet auch darbey ein Corps de garde/ oder Reduct/ vnd ein Wacht von Reutern vnd Fußvolck/ auch rings vmbher Schiltwachten/ die die Arbeiter vor des Feinds vberfahl wahrnen: vnd da Feind vorhanden/ stellet sich die Wacht zur wehr/ inzwüschen die Arbeiter sich auff ein seit machen. Da nun der Feind widerumb in die Vestung getriben wird/ vnd aber derselbig gar zu starck were/ begibt sich die Wacht in die Reduct/ oder Corps de gard: hierauff fangen die Arbeiter widerumb an zu wercken/ vnd so bald sie ein loch von 3. schuh tieff vnd 3. schuh breit gemachet haben/ seind sie ausser der gefahr/ danaher ein jeder mit allem ernst vnd vermögen arbeitet/ sich selbsten zu versicheren: vnd da ein jeder ein solches loch machet/ gibt es einen Graben/ wie obbemeldt/ 3. schuh breit vnd tieff: die Erde/ so man hinauß wirfft/ wirfft man gegen der Statt zu auff den rand des Grabens: wann man aber ein gerade linea gegen der Statt zu machet/ da wird die Erden zu beyden seiten auffgeworffen/ vnn 6. schuh breit vnn 6. tieff der Graben gemachet. Man machet auch die linea vngleich/ vnd laufft je ein linea gegen der anderen schlämm/ oder auch grad: wo nun der Graben 6. schuh tieff/ da wird ein Bancket für die Musquetierer gemachet: je breiter die Gräben seind/ je mehr sollen die Brustwehrinen erhaben werden/ damit man in dem Graben bedeckt seye: weiln man aber des nachts in der finstere nicht alles so richtig machen kan/ wird der fehler des tags durch etliche Verdinger verbesseret. An dem aussersten theil der linien machet man gemeiniglich ein geviertes schäntzlein/ oder reduct/ oder quadrat/ oder Corps de garde/ vnd ist von einem biß zu dem anderen 40. oder 50. růthen/ darinn haltet man
  cs: |-
    Dříve než se začne, má se především prozkoumat terén; křoví, živé ploty, cesty, prohlubně, stromy, pahorky, hory a údolí jsou k tomu také dobrou pomocí. Začínat se má na 1000 stop; podle mínění některých na dostřel dvojité hákovnice {Doppelhaacken}. Čím blíže u kvartýru se totiž začne, tím lépe lze aproše z kvartýru bránit. Má se také hledět, kde se lze k pevnosti nejlépe přiblížit; nejslabší jsou čela {face}, hroty a rohy bašt {Bollwerck}. Když se pak má začít, vyšle se z každé kompanie {Compagnie} 10 nebo více či méně vojáků se selským nářadím, jako jsou krumpáče, motyky, lopaty atd. Ty inženýr v noci, když je tma, zavede do přímé linie a na každý prut se postaví 3 nebo 4 muži, ovšem pokud možno tak, aby lidé byli mimo nebezpečí. Zřídí se při tom také strážnice {Corps de garde} neboli reduta {Reduct} a stráž z jezdců a pěchoty a kolem dokola stálé stráže {Schiltwachten}, které dělníky varují před nepřátelským přepadem. Objeví-li se nepřítel, postaví se stráž na odpor a dělníci se mezitím uklidí stranou. Nepřítel se pak zažene zpět do pevnosti; kdyby však byl příliš silný, uchýlí se stráž do reduty neboli strážnice. Potom dělníci opět začnou pracovat, a jakmile vykopou jámu 3 stopy hlubokou a 3 stopy širokou, jsou mimo nebezpečí; proto každý pracuje se vší vážností a ze všech sil, aby se sám zajistil. A protože každý vykope takovou jámu, vznikne příkop, jak bylo řečeno, 3 stopy široký a hluboký. Zemina, kterou vyhazují, se hází směrem k městu na okraj příkopu. Vede-li se však linie přímo proti městu, nahazuje se zemina na obě strany a příkop se dělá 6 stop široký a 6 hluboký. Linie se také vedou nepravidelně, takže vždy jedna linie běží k druhé šikmo, nebo i přímo. Kde je příkop 6 stop hluboký, udělá se pro mušketýry střelecký stupeň {Bancket}. Čím širší jsou příkopy, tím výše se mají zvedat předprsně {Brustwehrinen}, aby byl člověk v příkopu krytý. Protože však v noci za tmy nelze všechno udělat tak správně, opraví chyby přes den několik úkolníků[^1] {Verdinger}. Na nejzazším konci linií se obvykle dělá čtvercová šančička {schäntzlein} neboli reduta, čtverec či strážnice; od jedné k druhé je 40 nebo 50 prutů a v nich se
poznamky:
- n: 1
  text: 'Verdinger – dělníci najatí smluvně „od díla“ (verdingen = zadat práci za smluvenou cenu), placení od prutu hotového příkopu; viz s. 126.'
