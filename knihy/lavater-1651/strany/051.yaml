bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    schiessen/ also: daß alle Kuglen in alle Musqueten gerecht seyen/ vnd haltet man continuierlich etliche Kugelgiesser darzu/ vnd werdend alßdann die Kuglen in kleine röhrlein eyngemachet/ vnd nachgeführt. Man gibt gewohnlich auff jeden Soldaten des Monats ein pfundt Bley/ machet an zweylöhtigen Kuglen 18. vnd des Monats auff 1000. Mann 10. centner.
  cs: |-
    a to tak, aby všechny koule {Kuglen} pasovaly do všech mušket. K tomu se neustále drží několik slévačů koulí {Kugelgiesser}; koule se pak balí do malých trubiček {röhrlein} a vezou se za vojskem. Obvykle se na každého vojáka dává měsíčně libra {pfundt} olova, což dělá 18 dvoulotových koulí,[^1] a na 1000 mužů měsíčně 10 centů {centner}.
- typ: nadpis
  uroven: 3
  de: Vom Zünd- vnd anderem Pulfer.
  cs: O zápalném a jiném prachu.
- typ: odstavec
  de: |-
    Man soll das grob Pulfer durch ein kleines siblein räden/ vnd das rein darvon nemmen/ an der sonnen wol dörren/ vnd alßdann lebendigen Schwebel gantz klein zu Pulfer verreiben/ vnd vnder das Zündpulfer mischen/ so ist es schnell vnd gut Zündpulfer. Man solle auch des Monats jedem Soldaten ein pfundt Pulfer geben/ dann er hat die freyheit alle Abend sein Musqueten abzuschiessen vnd widerumb frisch zu laden/ damit er versicheret vnd auff der Wacht versehen seye.
  cs: |-
    Hrubý prach {Pulfer} se má prosít malým sítkem, jemný podíl z něj vzít a na slunci dobře vysušit; potom se má živá síra {lebendigen Schwebel}[^2] rozetřít na jemný prášek a přimísit do zápalného prachu – tak vznikne rychlý a dobrý zápalný prach {Zündpulfer}. Také se má každému vojákovi měsíčně dávat libra prachu, neboť smí každý večer svou mušketu {Musqueten} vystřelit a znovu čerstvě nabít, aby se na ni mohl spolehnout a byl na stráži dobře připraven.
- typ: nadpis
  uroven: 3
  de: Von der Růstung.
  cs: O zbroji.
- typ: odstavec
  de: |-
    Ein jeder soll mit seiner Rüstung auff Zug vnd Wacht erscheinen/ vnd sollen die Harnast dem Mann biß auff den Latz gehen/ vnd fein glatt hinden vnd vornen anschliessen.
  cs: |-
    Každý má na tažení {Zug} i na stráž přicházet ve své zbroji {Rüstung}; zbroj {Harnast} má muži sahat až k poklopci {Latz} a vzadu i vpředu hladce přiléhat.
- typ: nadpis
  uroven: 3
  de: Von der Picken/ oder Spieß.
  cs: O píce neboli kopí.
- typ: odstavec
  de: |-
    Die gattungen der Spieß seind am besten/ welche von Eschinemholtz gemachet werden/ der spitz derselben solle zum wenigsten sampt der fäderen 7. spannen vnd wol mehr lang seyn/ damit die Spieß von den Reuteren nicht leichtlich zerhawen werden: dann je länger die fäderen/ je besser man sich darauff verlassen mag. Der spitz soll 4. daumen lang vnd 1. breit seyn/ die viereckigen seind alich nicht böß: man muß die Spieß eben legen/ damit sie nicht krumb werden.
  cs: |-
    Nejlepší jsou píky {Spieß} z jasanového dřeva. Jejich hrot má být i s pery {fäderen}[^3] dlouhý nejméně 7 pídí {spannen}, klidně i víc, aby píky jezdci {Reuteren} nemohli snadno přesekat; neboť čím delší pera, tím víc se lze na píku spolehnout. Samotný hrot má být 4 palce {daumen} dlouhý a 1 palec široký; ani čtyřhranné hroty nejsou špatné. Píky se musejí ukládat rovně, aby se nezkřivily.
- typ: nadpis
  uroven: 3
  de: Vom Sturmhüt.
  cs: O útočné přilbě.
- typ: odstavec
  de: |-
    Jm stürmen sollen so wol die Musquetierer alß die Spieß Sturmhüt tragen/ damit sie wegen des Feinds außwerffens vnd schlägen/ so hinab auff jhre köpff geschehen/ verwahret seyen/ vnd were gut daß alle Musquetierer allzeit Sturmhüt/ insonderheit wegen Reuterey auff dem kopff trügen. Es sollen auch die Spieß hinden am rucken des Harnasts haacken haben/ daran sie jhre Sturmhüt oder Beckelhauben hencken mögen.
  cs: |-
    Při útoku {stürmen} mají mušketýři {Musquetierer} i pikenýři {Spieß} nosit útočné přilby {Sturmhüt}, aby byli chráněni před tím, co nepřítel háže a čím bije dolů na jejich hlavy; a bylo by dobré, aby všichni mušketýři nosili útočnou přilbu na hlavě stále, zvláště kvůli jízdě {Reuterey}. Pikenýři mají mít také vzadu na zádech zbroje háček, na který si mohou zavěsit útočnou přilbu nebo lebku {Beckelhauben}.[^4]
- typ: nadpis
  uroven: 2
  de: Von den Lermenplätzen.
  cs: O poplachových shromaždištích.
- typ: nadpis
  uroven: 3
  de: Was ein Lermenplatz seye.
  cs: Co je poplachové shromaždiště.
- typ: odstavec
  de: |-
    Es ist ein Platz/ darauff sich das Volck im fahl der noht versamlen/ worvon die nohtleidenden Posten entsetzt vnd secundiert werden.
  cs: |-
    Je to místo {Platz}, kde se má mužstvo v případě nouze shromáždit a odkud se ohroženým stanovištím {Posten} posílá pomoc a posila.
- typ: nadpis
  uroven: 3
  de: Wo gemeiniglich dieselbigen gesetzt werden.
  cs: Kde se obvykle zřizují.
- typ: odstavec
  de: |-
    Der gröste soll seyn auff dem Marckt/ so weiten vnd grossen raum hat
  cs: |-
    Největší má být na náměstí {Marckt}, které má dost širokého a velkého prostoru, aby se na ně dalo postavit
poznamky:
- n: 1
  text: Při 32 lotech na libru by z libry vyšlo 16 dvoulotových koulí; Lavater počítá 18 (patrně s ohledem na vůli lehčích „běžících“ koulí). Údaj na 1000 mužů (1000 liber = 10 centů) odpovídá.
- n: 2
  text: Živá síra (lebendiger Schwefel) – přírodní, ryzí síra, na rozdíl od přetavené síry v prutech.
- n: 3
  text: Pera (Federn) – železné pásy (langety) vybíhající od hrotu dolů po ratišti, které ho chrání před useknutím. Píď (Spanne) měří asi 20–23 cm, hrot s pery tedy asi 1,5 m.
- n: 4
  text: Beckelhaube (Pickelhaube) – jednoduchá okrouhlá přilba, „lebka“, lehčí než útočná přilba (Sturmhut, šturmhaube).
