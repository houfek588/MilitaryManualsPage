bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    soll auch ein lädernes Jnstrument haben/ so einer Glocken gleich geformieret/ welches an ein stangen/ daran man es traget/ gehenckt wird/ damit die schläg so in den Kuglen seind/ nichts operieren mögen/ welche man mit gutem leim/ so wol gebeert ist/ mehr alß einer spannen dick/ innwendig verkleibet/ vnd mit sand vnd äschen vber decket. Wann sich aber ein ander fewr erhebet/ da solle dasselbig mit haacken vmbgezogen vnd mit Wasser gelöschet werden: vnd da ein Camin brunne/ soll ein/ zween oder drey schüß dareyn gethan werden/ so wird es bald löschen.
  cs: |-
    také mít kožený nástroj ve tvaru zvonu, zavěšený na tyči, na níž se nosí, aby výbušné nálože {schläg}, které jsou v koulích, nemohly nic způsobit[^1]; zevnitř se vymaže dobrou, dobře prohnětenou hlínou {leim} silněji než na píď a pokryje se pískem a popelem. Vznikne-li však jiný oheň, má se [hořící stavení] strhnout háky a uhasit vodou; a kdyby hořel komín, má se do něj jednou, dvakrát nebo třikrát vystřelit, a brzy uhasne.
- typ: nadpis
  uroven: 2
  de: Wann der Feind allbereit vnder dem Werck/ vnd man dasselbig verlohren schätzet.
  cs: Když už je nepřítel pod dílem a pokládá se za ztracené
- typ: odstavec
  de: |-
    So nun der Feind vnder einem Bollwerck oder Wal sein Bresche fürgenommen hette/ so soll man dasselbig abschneiden/ vnd darhinder ein newe Brustwehr von vngefahr 14. schuhen dick auffwerffen/ vnd also Affterschantzen machen/ damit wo der Feind anfallen wolte/ darhinder widerumb ein new Werck funde. Man soll auch hinder dem Wal blinde Gräben machen/ vngefahr 10. schuh breit/ vnd so tieff alß man kan/ darhinder Blockhäuser/ so mit Sand/ Mist oder Erden außgefüllt seind/ auffrichten/ auch in die Gräben etliche Teuchel mit Pulfer außgefüllt/ legen/ vnd etliche fässer mit Kalck vnd Steinen darauff setzen/ vnd darinn heimlich vergraben/ doch von runden außgehölten Zieglen laufffewrlein machen/ damit so der Feind daselbst anfiele/ solches angesteckt/ vnd sie vbel zugericht vnd verhindert werden: Es sollen auch Blockhäuser vnaußgefüllt darhinder stehen/ darinnen sich die Musquetierer halten vnd auff den Feind schiessen vnd arbeiten mögen/ doch daß allwegen die Gräben sich nach der Bresche/ oder dem geruinierten ortschicken/ auch an den vbrigen Wal sampt den Blockhäusern angehenckt werden.
  cs: |-
    Kdyby tedy nepřítel začal dělat průlom {Bresche} pod některou baštou nebo valem, má se toto místo odříznout, za ním navršit nová předprseň {Brustwehr} asi 14 stop silná a tak zřídit zadní šance {Affterschantzen}, aby nepřítel, kdyby chtěl zaútočit, našel za ním zase nové dílo. Za valem se mají také vykopat slepé příkopy {blinde Gräben}, asi 10 stop široké a tak hluboké, jak jen lze, a za nimi postavit sruby {Blockhäuser} vyplněné pískem, hnojem nebo hlínou. Do příkopů se má také položit několik dřevěných trub {Teuchel} naplněných prachem, na ně postavit několik sudů s vápnem a kameny a vše tam tajně zakopat; z kulatých vyhloubených tašek (prejzů) se však mají udělat zápalné stopy {laufffewrlein}, aby se to, kdyby tam nepřítel zaútočil, zapálilo a útočníci byli zle pocuchováni a zastaveni. Za nimi mají stát také nevyplněné sruby, v nichž se mohou držet mušketýři {Musquetierer}, střílet na nepřítele a bojovat, avšak tak, aby se příkopy vždy řídily průlomem či zničeným místem a byly i se sruby napojeny na ostatní val.
- typ: nadpis
  uroven: 2
  de: Wann der Feind die Mine sprengt vnd Sturm laufft.
  cs: Když nepřítel odpálí minu a vyrazí do útoku
- typ: odstavec
  de: |-
    So bald der Feind ein Bresche machet/ soll man die Sturmpfäl; jtem/ Barricaden in die lucken schlagen/ auch Leiterwägen/ so mit Mist vnd Erden außgefüllt: deßgleichen Wollsäck/ Schantzkörb/ darfür stellen: vnd da man so hart geträngt vnd vbereylet wurde/ Höw/ Reiß/ Stroh vnd Mist in die lucken werffen/ damit wo der Feind anfiele/ man solches durch Fewrwerck anstecken/ vnd den Feind durch desselben gestanck abtreiben möge. Alßdann sollen alle Stück mit eysen Kettenen/ Musquetenkuglen/ kleinen Kiselsteinen/ Näglen/ stücklein Eysen etc. geladen/ vnd nach dem Feind in den Graben gerichtet seyn: vnd solle man an allen orten auffsehens haben: alle Hartzpfannen/ Windliechter sollen des nachts angestecket/ alle Posten mit Soldaten wol besetzet: die Böler auch mit Carthusch: Jtem/ die Doppelhaacken vnd Musqueten mit Endtengeschröt vnd Pistolenkuglen geladen werden. Die Pickquenierer sollen neben jhren Picken/ Brügel mit eysen Näglen/
  cs: |-
    Jakmile nepřítel udělá průlom, mají se do mezery zatlouct útočné kůly {Sturmpfäl}, dále barikády, a před ni postavit žebřiňáky vyplněné hnojem a hlínou, rovněž pytle s vlnou a šancovní koše. A kdyby byli [obránci] tak tvrdě tísněni a zaskočeni, má se do mezery naházet seno, chrastí, sláma a hnůj, aby se to při nepřátelském útoku dalo zapálit ohňostrojem {Fewrwerck} a nepřítel byl zahnán jeho smradem. Potom mají být všechna děla nabita železnými řetězy, mušketovými koulemi, malými křemínky, hřebíky, kousky železa atd. a namířena na nepřítele v příkopu; a na všech místech se má bdít: všechny pánve s pryskyřicí a větrné svíce {Windliechter} se mají v noci zapálit, všechna stanoviště dobře obsadit vojáky, moždíře {Böler} nabít kartušemi {Carthusch}, dále hákovnice {Doppelhaacken} a muškety nabít kachními broky {Endtengeschröt} a pistolovými koulemi. Pikenýři {Pickquenierer} mají mít kromě svých pík kyje se železnými hřeby,
poznamky:
- n: 1
  text: Kožený „zvon“ se přiklopí na dopadlý granát či ohnivou kouli, aby se střepiny a plamen při výbuchu zachytily.
