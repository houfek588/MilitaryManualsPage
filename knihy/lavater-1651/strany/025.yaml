bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    nichts/ vnd wurde man durch mangel derselbigen zur auffgebung der Vestung gezwungen: wie dann solches vilen Vestungen widerfahren seyn/ die Historien zeugnuß geben werden. Es soll auch den Soldaten auffs geringste die Vivres oder Proviant außgetheilt/ vnd jhnen nicht mehr dann die blosse vnvermeydenliche nohtdurfft gegeben werden: dann zumalen eh das Volck noht gelitten/ vnd vnwillig worden/ ist es vil benügter alß da man jhnen am ersten die völle gegeben/ vnd letstlich an der Proviant abbrechen wolte: da auch die Belägerung etwan lange zeit gewähret/ vnd das Kriegsvolck vngedultig werden wolte/ mag man es darmit gestillen vnd zu friden machen/ wann man jhme mit vermehrung der Proviant zu hilff kommt.
  cs: |-
    nic a pro nedostatek proviantu by byl donucen pevnost vzdát, jak se to už mnoha pevnostem přihodilo, o čemž podávají svědectví dějiny. Vojákům se má také potrava {Vivres}[^1] neboli proviant vydávat co nejskrovněji a nemá se jim dávat víc než holá, nevyhnutelná potřeba. Neboť i když lid zprvu strádá a reptá, je mnohem spokojenější, než kdyby se mu zpočátku dávalo plnou měrou a nakonec se mu měl proviant krátit. A protáhne-li se obléhání třeba na dlouhou dobu a vojsko by začalo být netrpělivé, lze je utišit a uspokojit tím, že se mu přijde na pomoc zvýšením přídělu.
- typ: nadpis
  uroven: 2
  de: Wie man die Proviant weiters ordenlich außtheilen solle.
  cs: Jak se má proviant dále řádně rozdělovat.
- typ: odstavec
  de: |-
    Erstlich nimmt der Proviant-Herr einen Muster-rodel von jeder Compagnie/ vnd zellet das gantz Volck ab: alßdann gibt er auff ein jegliche Person sein genannts jederem seinen Vnder-Proviantmeistern auff zwo oder mehr Compagnien/ so vnd so vil: Hernach so theilen dieselbigen die Proviant vnder die Hauptleuth/ vnd dise vnder jhre Wachtmeister/ dieselbigen aber vnder jhre Corporalen oder Rottmeister/ vnd dise vnder jhre Rottgesellen fein ordenlich/ gleich vnd vnklagbar auß. Wann nun die Hauptleuth auff jhr Volck Commiß empfahen/ geben sie dem Proviant-Herren von jhren eignen händen geschribne Zedel oder Reverß/ was vnd wie vil ein jeder auff die seinigen empfangen habe/ damit der Proviant-Herr sich darnach verhalten/ vnd zur zeit/ da man jhme rechnung abforderet/ solches aufflegen möge.
  cs: |-
    Nejprve si proviantmistr {Proviant-Herr} vezme od každé kompanie {Compagnie} přehlídkový seznam {Muster-rodel}[^2] a sečte všechen lid. Potom vydá každému ze svých podproviantmistrů {Vnder-Proviantmeistern}, z nichž každý má na starosti dvě nebo více kompanií, tolik a tolik – totiž stanovený příděl na každou osobu. Ti pak rozdělí proviant mezi hejtmany {Hauptleuth}, hejtmani mezi své vachmistry {Wachtmeister}, vachmistři mezi své desátníky {Corporalen} neboli rotmistry {Rottmeister} a ti mezi své rotní druhy {Rottgesellen} – vše pěkně po pořádku, rovným dílem a tak, aby si nikdo nemohl stěžovat. Když pak hejtmani přijímají pro svůj lid příděl {Commiß}[^3], dávají proviantmistrovi vlastnoručně psané lístky {Zedel} neboli potvrzenky {Reverß}, co a kolik kdo pro své lidi přijal, aby se proviantmistr mohl podle toho řídit a předložit je, až se od něho bude žádat vyúčtování.
- typ: nadpis
  uroven: 2
  de: Vom Wasser/ so zum wäschen vnd trincken für Leuth vnd Vieh nohtwendig.
  cs: O vodě, které je třeba k praní a pití pro lidi i dobytek.
- typ: odstavec
  de: |-
    Man soll alle Brunnen fleissig verwachen/ damit sie nicht vergifftet oder abgegraben werden: auch gute Sodbrunnen graben/ damit man zu trincken vnd träncken: jtem/ zum wäschen/ backen/ fewr löschen vnd kochen haben möge. Jn mangel desselbigen aber/ soll das Regenwasser jnsonderheit auffgefasset werden/ namlich in besonderbare Gehalter/ Cisternen genannt/ die in der Erden mit grossen quaderstucken rings vmbher ins geviert auffgemauret vnd wol verköttet/ dareyn die Känel der Tächeren gerichtet werden. Jtem/ so es regnet/ sollen Thücher auffgespannen/ auch das Thaw durch die auffgespannene Thücher auffgefasset/ vnd alßdann dasselbig Wasser darauß getrucket werden.
  cs: |-
    Všechny studny {Brunnen} se mají bedlivě střežit, aby nebyly otráveny nebo odkopány. Mají se také vykopat dobré šachtové studny {Sodbrunnen}, aby bylo dost vody k pití a k napájení dobytka, dále k praní, pečení, hašení ohně a vaření. Kde jich je nedostatek, má se zvlášť jímat dešťová voda, a to do zvláštních nádrží zvaných cisterny {Cisternen}, které jsou v zemi dokola do čtverce vyzděny velkými kvádry a dobře utěsněny tmelem a do nichž se svádějí okapové žlaby ze střech. Dále se mají za deště napínat plachty; napjatými plachtami lze zachycovat i rosu a vodu z nich pak vyždímat.
- typ: nadpis
  uroven: 2
  de: |-
    Was für klein vnd groß Geschütz/ Munition/ vnd anders in das Zeughauß gehören.
  cs: |-
    Jaká malá i velká děla, munice a jiné věci patří do zbrojnice.
- typ: odstavec
  de: |-
    Das Zeughauß soll versehen seyn mit allerley klein vnd grossem Geschütz/ vnd zu jedem Stuck drey Schäfft/ mit jhren Räderen/ alles von starckem Holtz/ damit sie das schiessen außstehen können/ vnd nicht von dem ersten
  cs: |-
    Zbrojnice {Zeughauß} má být zásobena všelijakými malými i velkými děly {Geschütz} a ke každému kusu {Stuck} mají být tři lafety {Schäfft} s koly, vše z pevného dřeva, aby vydržely střelbu a nerozbily se hned při prvním
poznamky:
- n: 1
  text: Vivres (fr.) – potraviny, zásoby; Lavater často klade francouzský výraz vedle německého (Proviant).
- n: 2
  text: Rodel – švýcarský výraz pro soupis, rejstřík (z lat. rotulus); Muster-rodel = jmenný seznam z přehlídky.
- n: 3
  text: Commiß – příděl potravin (hlavně chleba) vydávaný vojákům na účet vrchnosti; odtud pozdější „komisárek“.
