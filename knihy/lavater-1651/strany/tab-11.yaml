  popis: |-
    Mědirytina k šikům pluku, vpravo dole označená *blat V* („list V“, v textu „das fünffte Kupfferblat“). Levý okraj je při vazbě částečně odříznutý.
    *I* (nahoře): první šik pluku o osmi praporcích, asi 1600 mužů (str. [[106|106]]–[[108|108]]). Uprostřed velký houf pikenýrů s osmi korouhvemi. Před ním a po stranách jsou čtyři vysunuté švadrony mušketýrů (na rytině 1, 2, 7, 8) s plukovními dělky. Další dvě dělka stojí po stranách houfu vzadu, mezi oddíly jezdí důstojníci.
    Pod dělicí čarou šik pluku s jízdou, devátý bitevní šik (str. [[108|108]]–[[110|110]]). *II*: houf pikenýrů s osmi korouhvemi a dvěma dělky po stranách. *III*: švadrony mušketýrů (1–4) s dělky, rozestavené šikmo před pikami a vedle nich. *IV* (vlevo i vpravo nahoře): obě křídla jízdy, každé ze šesti jízdních kompanií s korouhvičkami (1–6 a 7–12), rozestavená do skupin po třech podle textu „wie dich die groß zahl IV. lehret“. *V* (dole): hlavní dělostřelectvo, devět děl na pahorku, za ním jízda znovu seřazená do jedné linie dvanácti jízdních kompanií (1–12) – záloha, s níž se po výstřelu z děl znovu útočí (str. [[109|109]]–[[110|110]]).
    Text k tomuto listu odkazuje slovy „das fünffte Kupfferblat mit der grossen zahl I.“ a „mit den grossen zahlen II. IV. V.“; číslování švadron mušketýrů v *III* (1–4) se liší od textu (1, 2, 7, 8).
