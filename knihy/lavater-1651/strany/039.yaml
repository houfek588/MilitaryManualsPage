bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    haben/ vnd hierinn das best zu thun/ so weit vnd ferr sie mögen/ getrewlich vnd vngefahrlich.
  cs: |-
    a že v tom učiní to nejlepší, nakolik jen budou moci; vše věrně a bez falše.
- typ: nadpis
  uroven: 3
  de: Ein andere Eyds-Form.
  cs: Jiná podoba přísahy.
- typ: odstavec
  de: |-
    Der Hauptmann soll schweeren/ daß er bey den Knechten das best thun/ sich mit denselben auff Zug vnd Wachten in Besatzung/ vnd wo jhne der Kriegsherr/ oder derselben Oberste vnd Anwäld/ hinschicken/ bescheiden oder verordnen werden/ brauchen lassen/ vnd das best vnd wegst (wie es einem ehrlichen Soldaten gebürt) hierinn thun wölle: daß er auch in der Musterung oder in ander weg/ kein finantz oder betrug gebrauchen/ anderen nicht zusehen/ noch solches gestatten: sonsten seines bestimmten tractaments/ vnd das so jhme von dem Zahlherren vber dasselbig auß gnaden gewerden lasset/ wol vernügt vnd zu frieden seyn/ vnd hierinn vnd sonst vberal des Kriegs/ oder Zahlherren nutz vnd frommen fürderen/ dessen schaden vnd nachtheil wenden/ verhüten vnd verhinderen/ vnd da er zu raht gezogen/ seinem höchsten vnd besten verstand nach dem Zahlherren zum besten rahten/ vnd was jhm also vertrawet/ biß in sein end verschweigen/ vnd bey jhme selbsten behalten wölle.
  cs: |-
    Hejtman má přísahat, že u knechtů {Knechten} učiní to nejlepší, že se s nimi dá použít na pochodech {Zug} a strážích v posádce {Besatzung} i všude, kam ho válečný pán {Kriegsherr} nebo jeho nejvyšší velitelé {Oberste} a zmocněnci pošlou, povolají nebo vyšlou, a že v tom učiní to nejlepší a nejvhodnější (jak se na čestného vojáka sluší); že se ani při přehlídce {Musterung}, ani jinak nedopustí žádné finty {finantz} či podvodu, nebude k tomu u jiných přihlížet ani to trpět; že se jinak spokojí se svým stanoveným platem {tractaments} a s tím, co mu plátce žoldu {Zahlherr} nad to z milosti dopřeje; že v tom i jinde všude bude hájit užitek a prospěch válečného pána čili plátce žoldu a odvracet, předcházet a bránit jeho škodě a újmě; a že bude-li přizván k radě, poradí plátci žoldu podle svého nejvyššího a nejlepšího rozumu k jeho prospěchu, a co mu bude takto svěřeno, zamlčí až do své smrti a ponechá to jen při sobě.
- typ: nadpis
  uroven: 2
  de: Von dem Leutenammt/ dessen Nammen/ Eyd/ Ordinantz vnd Beruff.
  cs: O poručíkovi, jeho jménu, přísaze, řádu a povolání.
- typ: odstavec
  de: |-
    Ein Leutenammt wird von dem wörtlein Lieutenant quasi locumtenens, Ort/ Platz/ Stell/ oder Statthaltender eines Capitains genannt/ dieweil er in abwesen seines Capitains die Stell/ Platz/ oder Lucken versihet. Er soll ein dapfferer/ auffrichtiger/ kriegsgeübter vnd prafer Cavalier seyn/ vnd ist nechst dem Capitain: in desselbigen abwesen commandiert er vollkommen/ vnd hat auch in gegenwart des Capitains den gantzen befelch vber die Compagnie: dann wann dem Capitain etwas von dem Regiment commandiert ist/ so ertheilt er Direction vnd Ordre dem Leutenammt/ wie er sich in einem vnd anderem verhalten solle/ der dann durch seine nachgegebene Officier den befelch vollnstrecken laßt: Er soll auch des Capitains guten Nammen/ Ehr vnd Reputation lieb haben/ vnd also beschirmen/ so lieb jhme sein eygen Leben vnd Ehr ist/ vnd sich sonderlich vmb dapffere vnd versuchte Soldaten dem Capitain vmbschawen/ auch wie er die Soldaten logieren vnd wol eynquartieren möge: darneben soll er fleissig auffsehen daß alles gleich zugehe/ nach guter ordnung vnd ohne klag. Alle Abends soll er sich auff der Paraden finden lassen/ vnd sehen wo mangel erscheine: ob auch die Parade/ Wacht vnd Ordre wol angestellt vnd gehalten werden: dargegen soll er sich in seinem Commandement gravitetisch vnd ernsthafft erzeigen/ damit jhne seine vndergebene Officier vnd Soldaten ehren/ vnd mehr alß den Capitain förchten. Es werden auch die Soldaten durch jhne gestraafft/ vnd ligt aller last jhme
  cs: |-
    Poručík {Leutenammt} se jmenuje podle slova lieutenant, jako by locumtenens, tj. ten, kdo drží místo, prostor či stanoviště hejtmana {Capitain}, čili jeho zástupce; neboť v nepřítomnosti svého hejtmana zastává jeho stanoviště, místo či mezeru. Má to být statečný, upřímný, ve válce zběhlý a chrabrý kavalír; je nejbližší po hejtmanovi: v jeho nepřítomnosti velí s plnou mocí a i za přítomnosti hejtmana má celé velení nad kompanií {Compagnie}. Když je totiž hejtmanovi od pluku {Regiment} něco nařízeno, dá poručíkovi pokyny a rozkaz {Ordre}, jak si má v tom či onom počínat, a ten pak dá rozkaz vykonat prostřednictvím svých podřízených důstojníků. Dobré jméno, čest a pověst hejtmana mu mají být drahé a má je chránit, jako je mu drahý jeho vlastní život a čest; zvláště se má pro hejtmana poohlížet po statečných a zkušených vojácích a také po tom, jak by vojáky ubytoval a dobře rozmístil po kvartýrech. Vedle toho má pilně dohlížet, aby vše šlo rovným dílem, v dobrém pořádku a bez stížností. Každý večer se má ukázat při parádě {Paraden} a hledět, kde se vyskytne nedostatek a zda jsou paráda, stráž a rozkazy dobře zařízeny a dodržovány. Naproti tomu se má ve svém velení projevovat důstojně a vážně, aby ho podřízení důstojníci a vojáci ctili a báli se ho více než hejtmana. Vojáky také trestá on a celé břemeno mu leží
