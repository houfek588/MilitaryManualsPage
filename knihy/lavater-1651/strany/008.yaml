bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    starcke eychene brätter/ deren 4. oder 5. zusammen genaglet/ vnd mit eysernen klammeren vnd riglen wol in einander gefügt/ damit sie von einem Musquetenschuß frey seyen: der Gang zwischen den Porten wird mit starcken balcken vnd brätteren/ in form einer gallerie, doch höher vnd breiter gebawen: sie werden auch gewölbt: doch sollen die Porten nicht gleich vor einanderen vber/ sonder schlimbsweis gesetzet werden/ damit nicht ein schuß durch alle Thor zu gleich gehen/ vnd man darzwüschen sicher vnd rühwig wandlen/ vnd dardurch auß- vnd eynfahren möge: sie seind jnnwendig vngefahr 14. oder 15. schuh hoch/ vnd 10. oder 12. schuh breit: jhr länge aber ist der dicke des Wals gleich.
  cs: |-
    silná dubová prkna, čtyři nebo pět na sebe přibitých a železnými skobami a závorami dobře spojených, aby odolala výstřelu z muškety. Průchod mezi branami se staví ze silných trámů a prken v podobě galerie {gallerie}, avšak vyšší a širší; brány se také klenou. Nemají však stát přímo proti sobě, nýbrž šikmo, aby jeden výstřel neprošel všemi vraty najednou a aby se mezi nimi dalo bezpečně a klidně chodit a jimi vyjíždět i vjíždět. Uvnitř jsou asi 14 nebo 15 stop vysoké a 10 nebo 12 stop široké; délkou se rovnají tloušťce valu.
- typ: nadpis
  uroven: 2
  de: Von beschaffenheit einer Schutzporten.
  cs: Jaká má být ochranná brána.
- typ: odstavec
  de: |-
    Man setzet dieselbig zu ausserst auff den ausseren rand des Grabens zu end der Brucken. Dise wird mit einem Zaun von Stagketen vnd starcken Höltzeren vmbgeben/ wie der Buchstab A. außweiset. Jhr höhe ist den anderen jnneren Porten gleich: die breite ist von 12. schuhen. Dise Porten wird gewölbt/ vnd darauff gleich einem Thurn/ ein Wachthäußlein (wie B. anzeigt) gesetzet/ in welchem auff dem boden in der mitte ein vierecket loch ist/ wordurch man schiessen/ werffen/ vnd den Feind zwüschen den Porten von seinem vorhaben verhinderen mag: gegen der Statt oder Vestung aber seind reyenweis ein halben schuh von einander gevierte löcher (wie C. andeutet.) Dise löcher seind rings vmb mit eysernen blächen beschlagen/ vnd neben jeglichem ein vngefahr vierspänniger eyserner rigel/ so in seinem gleych gehet: durch gemeldte löcher aber gehen viereckige/ grosse/ dicke/ lange/ vnd an allen vier ecken mit eysernen blächen beschlagene/ eychene balcken/ so eysene schuh haben: ob solchen vngefahr eines schuhs hoch/ an dem einen eck seind kerben auch mit bläch beschlagen/ in welche obbemeldte eyserne rigel gehen/ vnd die balcken auffhalten/ damit sie nicht hinab fallen (wie bey D. zu sehen ist:) da man dise balcken hinab lassen will/ so ist ein eyserner Hammer an einer ketten darbey angeschmidet/ mit welchem man alßdann die rigel auß den kerben der balcken schlaget/ die tieff hinunder in die Erden fallen. Es hat aber dise Porten zwey Thor/ das eine jnnwendig/ das ander aber außwendig/ gleich den anderen Porten/ mit sampt einem außlaßpörtlein. Auff gedachter Schutzporten haltet man tag vnd nacht die Wacht/ darauff dann zwey Thürnlein mit schießlöcheren gemachet werden (wie E. anzeiget.) Es hat auch ein Wacht- vnd Schutzportenhäußlein: gegen dem Feld aber seind erhabene bänck/ die gehen vber das gesimbs der Porten/ seind vngefahr 4 schuh hoch/ man kan die Läden auffheben/ vnd dardurch für die ausserste Porten auff die Feind hinunder schiessen vnd werffen (wie auch die Zahl I. lehret.) Die thür aber gemeldten Wachthäußleins ist mit dicken eychenen brätteren vnd schußfrey gemachet: vor diser thür ist ein gänglein von 3. schuh breit/ an welchem ein Leiter so biß
  cs: |-
    Ochranná brána {Schutzporten}[^1] se staví úplně vpředu na vnějším okraji příkopu, na konci mostu. Obklopuje se kůlovým plotem {Stagketen} a silnými trámy, jak ukazuje písmeno A. Výškou se rovná ostatním, vnitřním branám, šířka je 12 stop. Tato brána se klene a nahoru se na ni jako věž postaví strážní domek (jak ukazuje B); v jeho podlaze je uprostřed čtyřhranný otvor, jímž lze střílet, házet [kamení] a překazit nepříteli mezi branami jeho záměr. Směrem k městu či pevnosti jsou pak v řadě, půl stopy od sebe, čtyřhranné otvory (jak naznačuje C). Tyto otvory jsou kolem dokola pobity železným plechem a vedle každého je asi čtyři pídě dlouhá železná závora, která se otáčí ve svém kloubu. Těmi otvory procházejí čtyřhranné, velké, tlusté a dlouhé dubové trámy, na všech čtyřech hranách pobité železným plechem a opatřené železnými botkami. Asi stopu nad botkou jsou na jedné hraně zářezy, rovněž pobité plechem, do nichž zapadají zmíněné železné závory a drží trámy, aby nespadly dolů (jak je vidět u D). Když se mají trámy spustit, je u nich na řetězu přikováno železné kladivo, jímž se závory vyrazí ze zářezů trámů, a ty pak padnou hluboko dolů do země.[^2] Tato brána má dvoje vrata, jedna uvnitř a druhá vně jako ostatní brány, a k tomu výpadní branku {außlaßpörtlein}. Na zmíněné ochranné bráně se drží stráž ve dne i v noci; proto se na ní dělají dvě věžičky se střílnami (jak ukazuje E). Je tu také strážní domek ochranné brány; směrem k poli jsou vyvýšené lavice, které přesahují přes římsu brány a jsou asi 4 stopy vysoké; lze zvednout okenice a jimi před nejzazší branou střílet a házet dolů na nepřítele (jak ukazuje i číslo I). Dveře zmíněného strážního domku jsou z tlustých dubových prken a odolné proti střelbě; před nimi je ochůzek 3 stopy široký a na něm žebřík, který sahá až
poznamky:
- n: 1
  text: Schutzporte – předsunutá brána (předbraní) na vnější straně příkopu u předmostí. Písmena A–E a čísla I–II odkazují na vyobrazení, které v dochovaném výtisku nebylo s jistotou určeno.
- n: 2
  text: Popisovaná zábrana ze samostatných spouštěcích trámů odpovídá tzv. varhanům (franc. orgues), obdobě padací mříže.
