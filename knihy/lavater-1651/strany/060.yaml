bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    auch offt der Major/ oder Gubernator selbst/ vnd meistentheils des Sommers vmb 10. vnd des Winters vmb 8. vhren. Dise visitieren die Schiltwachten/ ob solche in rechter ordnung stehen/ vnd gute Wacht haben: den Corporalen nemmen sie das Wort ab/ vnd so selbige das Wort nicht recht hetten/ geben sie es jhnen anderst: vnd soll ein solche Hauptronde niemalen nach mitternacht/ sondern allzeit darvor geschehen. Darauff werden die Gefreyten alle stund/ vnd da gefahr verhanden/ alle halb stund/ allzeit zween derselben: Namlich/ einer von N. vnd der ander von N. Compagnie mit einanderen zu der obersten: vnd die anderen zween/ namlich der von N. vnd der von N. Compagnie zu der vndersten Porten gegen einanderen geschicket/ welche vmb die gantze Statt gehen sollen/ vnd so bald selbige widerumb in das Wachthauß kommen/ sollen an deren statt andere gecommandiert werden/ damit der Wal nie von der Ronde lähr seye. Wann sie nun von den Corporalen auffgehalten werden/ sollen sie jhr Gewehr gegen jhnen pręsentieren/ vnd jhnen leyßling das Wort in jhr Ohr geben: vnd also solle es bey allen Wachthäuseren geschehen. Jhr Ampt ist/ daß sie auff die Schiltwacht gut achtung geben/ ob sie auch jhr Ampt verrichten/ vnd in rechter ordnung gestellt seyen/ vnd da sie etwas mangels befunden/ verbesseren/ oder schaffen gebesseret zu werden: die schlaffenden haben sie gewalt tod zu schlagen/ oder jhnen jhr Gewehr zu nemmen/ vnd verschaffen gestrafft zu werden: jnsonderheit sollen sie offt still stehen/ vnd vber den Wal hinauß sehen vnd lausteren/ ob sie nichts gehören mögen: auch sollen sie das wort/ so jhnen vertrawt worden/ fleissig behalten/ vnd solches niemand aussert den Corporalen geben vnd öffnen. Es soll auch kein Ronde der anderen auff dem Wal begegnend/ das Wort zu geben schuldig seyn.
  cs: |-
    často také major {Major} či sám guvernér {Gubernator}, a to většinou v létě v 10 a v zimě v 8 hodin. Ti prohlížejí stálé stráže {Schiltwachten}, zda stojí ve správném pořádku a dobře bdí; od desátníků {Corporalen} přebírají heslo {Wort}, a nemají-li je desátníci správně, dají jim je správné. Taková hlavní obchůzka {Hauptronde} se nemá nikdy konat po půlnoci, nýbrž vždy před ní. Potom se každou hodinu, a je-li nebezpečí, každou půlhodinu vysílají svobodníci {Gefreyten}, vždy po dvou: totiž jeden z kompanie {Compagnie} N. a druhý z kompanie N. spolu k horní bráně a druzí dva, totiž ten z kompanie N. a ten z kompanie N., k dolní bráně {Porten}, proti sobě; ti mají obejít celé město, a jakmile se vrátí do strážnice {Wachthauß}, mají být místo nich vysláni jiní, aby val {Wal} nikdy nezůstal bez obchůzky {Ronde}. Když je pak desátníci zastaví, mají proti nim prezentovat zbraň a potichu jim pošeptat heslo do ucha; a tak se to má dít u všech strážnic. Jejich úkolem je dávat dobrý pozor na stálé stráže, zda konají svou povinnost a jsou správně rozestaveny, a najdou-li nějaký nedostatek, napravit jej nebo zařídit jeho nápravu. Spící mají moc ubít, nebo jim vzít zbraň a zařídit, aby byli potrestáni. Zvláště mají často zůstat stát, hledět přes val ven a naslouchat, zda něco neuslyší; také mají heslo, které jim bylo svěřeno, pečlivě uchovat a nikomu kromě desátníků je nesdělovat ani neprozrazovat. Žádná obchůzka také není povinna dát heslo jiné obchůzce, kterou potká na valu.
- typ: nadpis
  uroven: 3
  de: Wie sich ein Corporal im wachen verhalten solle.
  cs: Jak si má desátník počínat na stráži.
- typ: odstavec
  de: |-
    So bald der Corporal in das Wachthauß kommt/ solle er die frömbden Schiltwachten gestracks ohn verzug ablösen lassen/ vnd die seinigen auffstellen/ damit die Schiltwachten nicht lähr stehen: auch etliche Soldaten commandieren/ holtz auff die Wacht zu holen: vnd jnsonderheit weder Tag noch Nacht/ Sommers noch Winters/ das fewr nicht außgehen lassen/ damit die Musquetierer im fahl der noht jhre Lunden anstecken können: auch des Nachts die Hartzpfannen vnd Handgranaten (deren vil auff der Wacht ligen sollen) in der noht anzünden/ vnd damit den Feind auff halten vnd beschädigen mögen. Jnsonderheit soll er der Soldaten Gewehr visitteren/ vnd die vngehorsamen darumb straffen: auch nicht gestatten/ daß einer weder Ringkragen/ Pandelier/ Schuh oder Dägen von sich lege: auch allzeit die Lunden in dem Rohr erstecken/ vnd alßdann dieselbigen darinn stecken lassen/ damit ein jeder ein hübsche todte kolen habe/ vnd in einem augenblick selbige anstecken könne. Es sollen auch allzeit vier stück Lunden/ so jedes zwey
  cs: |-
    Jakmile desátník přijde do strážnice, má neprodleně dát vystřídat stálé stráže jiné kompanie a postavit své, aby stanoviště stálých stráží nezůstala prázdná; také má určit několik vojáků, aby přinesli na stráž dřevo; a zvláště nesmí ve dne ani v noci, v létě ani v zimě nechat vyhasnout oheň, aby si mušketýři {Musquetierer} mohli v případě nouze zapálit doutnáky {Lunden}; také [má] v noci v nouzi zapálit smolné pánve {Hartzpfannen} a ruční granáty {Handgranaten} (kterých má na stráži ležet mnoho), aby jimi mohli nepřítele zadržet a poškodit. Zvláště má prohlížet zbraně vojáků a neposlušné za to trestat; také nesmí dovolit, aby kdokoli odložil nákrčník {Ringkragen}, bandalír {Pandelier}, boty nebo kord {Dägen}. Doutnáky má dát vždy udusit v hlavni {Rohr} a pak je v ní nechat, aby měl každý pěkný mrtvý uhlík {todte kolen}[^1] a mohl jej v okamžiku zapálit. Také mají být vždy čtyři kusy doutnáku, každý dva
poznamky:
- n: 1
  text: „Mrtvý uhlík“ – zuhelnatělý, uhašený konec doutnáku, který se při přiložení k ohni okamžitě znovu rozžhaví.
