bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Major/ oder Adjutanten an sein Losament/ vnd empfahet von jhme das Wort vnd was zu thun ist: alßdann verfüget sich ein jeder nach seinem Quartier vnd Regiment/ vor welchem alßdann die Sergeanten von den Compagnien des Regiments auff die Ordre warten/ vnd von dem Regiments-Majoren empfahen/ vnd solche widerumb den Hauptleuthen/ Leutenammten/ Fendrichen vnd wachthabenden Sergeanten/ Corporalen vnd Gefreyten bringen/ vnd was weiter zu thun befohlen/ anzeigen. Vnd da man des anderen Tags auffbrechen will/ wird solches den Hauptleuthen angezeiget/ damit sie den Soldaten Gelt verschaffen/ vnd sich auff 4. 5. 6. 7. 8. oder mehr oder weniger Tag mit Käß/ Brot vnd Ancken/ oder Proviant versehen/ je nach dem man meynt der marsch gehen/ vnd man kein Proviant finden möchte: wo aber kein Proviant zu kauffen were/ soll man von dem Commiss- Brot vnd Zweybach außtheilen. So bald nun der Tag anbricht/ so werden die Trommel gerührt/ vnd die Trompeten geblaasen: erstlich die procell vnd vergaderung: darnach zu Pferd vnd Trouppen: vnd des dritten mals der marsch: vnd da man das dritte mal in die Trompeten stoßt/ vnd die Trommel rührt/ so muß alles Volck in der Fundaments-Ordnung halten: darauff verfügt sich der General/ General-Major/ Adjutant/ General Quartier-Brucken- Wagen- Proviantmeister: Jtem/ der General von der Cavalerey vnd Artillerey sampt dem Capitain vber die Wegweiser vnd Bineurs oder Schauffelbawren/ sampt anderen Officierern/ so disem anhängig/ auff den Lermenplatz/ vnd nun sie sich mit einanderen/ wo/ vnd wie sie den marsch nemmen wöllen/ vnderredet/ so wird die Zugordnung folgender massen angestellt.
  cs: |-
    generálmajorovi nebo pobočníkovi do jeho ubytování {Losament} a přijme od něho heslo {Wort} a pokyny, co je třeba vykonat. Potom se každý odebere do svého kvartýru {Quartier} a ke svému pluku, před nímž již čekají na rozkaz seržanti {Sergeanten} kompanií toho pluku; přijmou jej od plukovního majora a donesou jej dále hejtmanům, poručíkům, praporečníkům a seržantům, desátníkům {Corporalen} a svobodníkům {Gefreyten}, kteří mají stráž, a oznámí, co je dále nařízeno. A má-li se příštího dne vyrazit, oznámí se to hejtmanům, aby vojákům opatřili peníze a [vojáci] se zásobili na 4, 5, 6, 7, 8 nebo více či méně dní sýrem, chlebem a máslem {Ancken} nebo proviantem, podle toho, jak dlouho má pochod podle odhadu trvat a zda by snad nebylo možné proviant najít. Kde by však nebyl proviant ke koupi, má se rozdávat komisní chléb a suchary. Jakmile se rozední, víří bubny a troubí trubky: nejprve „procell“[^1] a shromáždění, potom „na koně a k oddílům“ {zu Pferd vnd Trouppen} a potřetí pochod. A když se potřetí zatroubí a zabubnuje, musí všechno vojsko stát v základním šiku {Fundaments-Ordnung}. Nato se generál, generálmajor, pobočník, generální kvartýrmistr, mostmistr, vozmistr a proviantmistr, dále generál jízdy a generál dělostřelectva s hejtmanem {Capitain} nad průvodci a pionýry {Bineurs} neboli lopataři {Schauffelbawren} a s dalšími důstojníky, kteří k tomu patří, odeberou na poplachové shromaždiště {Lermenplatz}; a když se spolu domluví, kudy a jak chtějí vést pochod, stanoví se pochodový šik {Zugordnung} takto.
- typ: nadpis
  uroven: 2
  de: Wie man mit einer Armaden in Zugordnung marschiere.
  cs: Jak táhnout s armádou v pochodovém šiku.
- typ: odstavec
  de: |-
    Die Zugordnungen werden vnderschiedenlich angestellt: vnd deß ersten marschiert die Avantguarde/ oder Vorzug in jhrer guten Distantz so weit vorher/ alß den Generalen gut duncket: auff solche folget die Battaille oder Corpus/ oder Mittelzug: vnd dann zu letst die Retroguarde/ Deriereguarde/ Nachzug oder Nachhůt/ alle einanderen nach/ in jhrer gebürenden Ordnung vnd Distantz: darnach wird die Bagage behörlichen distribuiert vnd zertheilt. Bey dem Vorzug oder Avantguarde halten etliche Trouppen zu Pferd/ welche den weg entdecken/ vnd so weit vorher marschieren/ daß man sie bloß gesehen mag: disen werden die Wegweiser zugegeben/ mit welchen etlich Bioneurs oder Schantzbawren/ sampt etlichen lähren Wägen: Jtem/ einem Wagen mit allerley Bawren-Jnstrumenten/ vnd zween/ drey oder mehr Wägen mit groß vnd klein Holtz/ vnd der Schiffbrucken marschieren: auff solche folgen etliche Squadronen Musquetierer/ darnach etliche kleine Feldstücklein/ sampt derselben Lavyten oder Schiffen/ Canoniers/ Munition vnd zugehörigen Sachen: alßdann das erste Fußvolck/ Regimenterweis mit jhrer
  cs: |-
    Pochodové šiky se zřizují různě. Jako první táhne avantgarda {Avantguarde} neboli předvoj {Vorzug} v náležitém odstupu tak daleko vpředu, jak se generálům zdá dobré; za ní následuje bataille {Battaille} neboli tělo, střední voj, a nakonec retrogarda, ariergarda, zadní voj {Nachzug} neboli zadní stráž – všichni jeden za druhým v náležitém pořádku a odstupu. Potom se bagáž {Bagage} náležitě rozdělí a rozčlení. U předvoje neboli avantgardy jsou některé jízdní oddíly {Trouppen}, které prozkoumávají cestu a jedou tak daleko vpředu, že je lze ještě právě zahlédnout. K nim se přidělí průvodci {Wegweiser}, s nimiž táhne několik pionýrů {Bioneurs} neboli šancířů {Schantzbawren} s několika prázdnými vozy, rovněž s vozem se všelijakým selským nářadím, se dvěma, třemi nebo více vozy s velkým i malým dřívím a s lodním mostem {Schiffbrucken}. Za nimi následuje několik švadron {Squadronen} mušketýrů, potom několik malých polních dělek i s jejich lafetami {Lavyten} nebo loďmi, kanonýry, municí a příslušenstvím; potom první pěchota po plucích se svou
poznamky:
- n: 1
  text: Procell – výraz nejasný; podle souvislosti první signál ráno (budíček, svolání). Snad zkomolenina; v Druhém dílu Lavater mezi signály bubnu uvádí mj. „Rebell“ (budíček, franc. réveil).
