  popis: |-
    Mědirytina k šikům více pluků, vlevo dole zbytek označení *… I*, tj. „[blat V]I“ („[list] VI“; v textu „das sechßte Kupfferblat“). Levý okraj je při vazbě odříznutý.
    *I* (nahoře): desátý bitevní šik o jedenácti plucích pěchoty (str. 110–111). Vpředu na pahorku osm velkých děl hlavního dělostřelectva, za nimi pluky ve dvou šachovnicově posunutých liniích: vpředu pět vysunutých pluků (2, 4, 6, 8, 10), za nimi ostatní (1, 3, 5, 7, 9, 11). Každý pluk tvoří houf pikenýrů s korouhvemi, mušketýři na křídlech a před ním stojí důstojník s partyzánou.
    *II*: základní šik týchž pluků – pluky v jedné linii vedle sebe, uprostřed mezi nimi děla (str. 110).
    *IV* (vlevo a vpravo): obě křídla jízdy po šesti jízdních kompaniích (1–6 a 7–12). *V* (dole): jízda v základním šiku, dvanáct jízdních kompanií v jedné linii vzadu za bitevním šikem (str. 111: „die Reuterey/ so mit der grossen zahl V. anzeiget/ zu hinderst der Battaille“).
    *III* (uprostřed): jedenáctý bitevní šik proti jízdě (str. 112). Čtyři kompanie pikenýrů jsou sestavené do kříže a ze všech stran obklopené mušketýry, uprostřed kříže stojí korouhve a praporečníci. Malá čísla v houfech jsou špatně čitelná, text uvádí „wie 2. 3. 4. 5. außweisen … wie I. zeiget“. Kolem kříže stojí čtyři důstojníci s partyzánami.
    Dole je nečitelný slabý podpis rytce.
