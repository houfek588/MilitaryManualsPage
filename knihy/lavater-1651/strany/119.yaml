bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Bagage: hinder disen etliche Munition- vnd Rüstwägen/ welche etliche trouppen Reuter beschliessen/ vnd diser erste theil heißt Vorzug. Darauff folget widerumb das Fůßvolck/ Feld- vnd Regimentsstücklein/ Bagage/ Munitionvnd Rüstwägen: dise werden widerumb mit Reutern beschlossen: inzwüschen ordnet der General von der Artillerey sampt seinen vndergegebenen das groß Geschütz zusammen/ vnd darmit auch desselben zugehörige Munition- vnd andere Wägen/ sampt den Canoniers/ Bineurs/ Matrosen/ Handlangern/ Pulferhütern/ Sattlern/ Schmiden/ Küfferen/ Wagneren/ Schlosseren/ Seileren/ Zimmerleuthen/ vnd dergleichen. Die Proviantwägen aber werden von dem General-Profosen durch seine vndergebene/ zusampt der Bagage geordnet: die Cavalerey ordnet meistentheils jhre Wägen selbsten: es soll sich aber vnder das Geschütz vnd zugehörigen Wägen kein Marckitänter vermischen: wo auch ein Wagen gebrochen/ soll er auß der Ordnung gethan werden: doch ist zu wüssen/ daß zu allervorderst ein besonderbar Jnstrument/ darmit man das gleiß zeichnet/ auff der straassen/ die man reyset/ seyn soll: vor dem Geschütz marschieren die kleinen Feldstücklein/ vnd hernach das Hauptgeschütz/ die grossen Stück/ sammt den Rüst-Munitionvnd vbrigen Wägen. Zu letst auff dise Artillerey vnd Wägen marschieret die hinderhůt/ oder nachzug/ namlich der dritte vnd letste theil des Füßvolcks mit jhren Regimentsstücklinen vnd etlichen Munitionwägen/ so für das Fůßvolck gehört/ Bagage- vnd andere Wägen/ so zu der Wagenburg dienstlich/ welche die vbrigen Reuter beschliessen. Es werden auch in währender Zugordnung etliche Compagnien zu Ross vnd Fůß neben auff beyd seiten/ vornen vnd zu hinderst gecommandiert/ solche sollen die vor-hinder- vnd seitenwachten halten. Die hinder- oder nachwacht soll so weit hinder der gantzen Zugordnung marschieren/ alß weit sie den nachzug bloß sehen mögen/ vnd seind dise Wachten gut/ wo sich etwan der Feind verstecket/ vnd in seinen vortheil geleget/ selbigen zu entdecken.
  cs: |-
    bagáží {Bagage}; za nimi několik muničních a výzbrojních vozů {Rüstwägen}, které uzavírá několik jízdních oddílů; a tato první část se nazývá předvoj {Vorzug}. Pak následuje opět pěchota, polní a plukovní dělka, bagáž, muniční a výzbrojní vozy; ty opět uzavírají jezdci. Mezitím generál dělostřelectva se svými podřízenými seřadí velká děla a s nimi i jejich muniční a jiné vozy, spolu s kanonýry, pionýry {Bineurs}, lodníky {Matrosen}, pomocníky, strážci prachu {Pulferhütern}, sedláři, kováři, bednáři, koláři, zámečníky, provazníky, tesaři a podobnými. Proviantní vozy však spolu s bagáží řadí generální profous {General-Profosen} prostřednictvím svých podřízených; jízda si své vozy většinou řadí sama. Mezi děla a vozy k nim patřící se však nemá vmísit žádný markytán; a rozbije-li se nějaký vůz, má být vyřazen z řady. Je však třeba vědět, že úplně vpředu má být na silnici, po níž se jede, zvláštní nástroj, kterým se vyznačuje kolej {gleiß}[^1]. Před děly táhnou malá polní dělka a za nimi hlavní dělostřelectvo, velká děla spolu s výzbrojními, muničními a ostatními vozy. Nakonec za tímto dělostřelectvem a vozy táhne zadní stráž {hinderhůt} neboli zadní voj {nachzug}, totiž třetí a poslední část pěchoty se svými plukovními dělky a několika muničními vozy, které patří k pěchotě, s vozy bagáže a jinými vozy, které slouží k vozové hradbě {Wagenburg}; ty uzavírá zbytek jezdců. Během pochodu se také vysílá několik kompanií {Compagnien} jízdy a pěchoty po obou stranách, vpředu i vzadu, které mají držet přední, zadní a boční stráže. Zadní stráž má táhnout tak daleko za celým pochodovým šikem, aby ještě právě viděla na zadní voj. Tyto stráže jsou dobré k tomu, aby odhalily nepřítele, kdyby se někde ukryl a zaujal výhodné postavení.
- typ: nadpis
  uroven: 2
  de: |-
    Wann man des Nachts in das Quartier kommt/ wie vnd wo man die Nacht vber sich lägeren vnd eynquartieren soll.
  cs: |-
    Když se na noc přichází do kvartýru: jak a kde se má [vojsko] přes noc rozložit a ubytovat.
- typ: odstavec
  de: |-
    So bald man des Abends still ligen vnd ruhen will/ so soll der General- Quartiermeister etwan mit 100. mehr oder weniger Reuteren ein groß stück wegs bey guter zeit vorher reiten/ die gelegenheit außsehen/ vnd alle anschaffung thun. Das Quartier soll er an Holtz/ Morast/ Wasser/ vnd dergleichen ort/ da man Holtz zu brennen/ Wasser für Ross vnd Mann zu trincken/ vnd sonsten der Feind dem Läger nicht leichtlich beykommen/ vnd das Läger vortheilhafftig ligen möge. Die gelegenheit des Orts reißt er auff Papyr/ zeigts dem General/ vnd theilt darnach das Feld den Special-Quartiermeisteren auß: dises bedarff nicht vil abmessens/ sonder sie/ die Regimenter werden in einer Ordnung neben oder hinder einanderen eyngeführt/ da dann ein jeder
  cs: |-
    Jakmile se má večer zastavit a odpočívat, má generální kvartýrmistr {General-Quartiermeister} asi se 100 jezdci, více či méně, včas vyjet hodný kus cesty napřed, obhlédnout místní poměry a vše zařídit. Kvartýr {Quartier} má [zvolit] u lesa, močálu, vody a na podobném místě, kde je dříví k topení a voda k pití pro koně i muže, kde by se nepřítel k ležení {Läger} nemohl snadno dostat a ležení by mohlo ležet výhodně. Polohu místa zakreslí na papír, ukáže ji generálovi a podle toho rozdělí pole jednotlivým kvartýrmistrům {Special-Quartiermeisteren}. To nevyžaduje mnoho vyměřování: pluky se totiž zavedou v šiku vedle sebe nebo za sebou, a tu si každý
poznamky:
- n: 1
  text: Patrně zařízení (vůz nebo rám s koly), které vyznačí nebo prověří rozchod kolejí na cestě, aby jí projela děla a vozy.
