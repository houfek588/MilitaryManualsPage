bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    gemachet/ nach dem man hohe berg vor sich hat/ gegen welchen man dieselbigen bawen soll: man zeucht sie parallel (verstand die plattenformen/ so gegen den bergen gemachet werden/ sonst seind das ander erhabene Bollwerck:) Die länge ist vnderschiedenlich/ nach dem man vil oder wenig/ klein oder groß Geschütz darauff stellen will/ doch machen sie etliche vornen her 160. oder 180. schuh breit/ vnd erheben sie nur 24. schuh vber den Wal (doch/ wie vor gemeldt/ seind die Situationen vngleich:) die Brustwehr wird 15. schuh dick.
  cs: |-
    dělá různá podle toho, jak vysoké hory má člověk před sebou, proti nimž se mají stavět. Vedou se rovnoběžně (rozuměj plošiny {plattenformen}, které se dělají proti horám; jinak jsou to jen další vyvýšené bašty). Délka je různá podle toho, zda se na ně má postavit mnoho, nebo málo, malých, nebo velkých děl; někteří je však dělají vpředu 160 nebo 180 stop široké a zvedají je jen 24 stopy nad val (ovšem, jak už řečeno, polohy {Situationen} bývají nestejné). Předprseň {Brustwehr} se dělá 15 stop silná.
- typ: nadpis
  uroven: 3
  de: Von den Brucken oder Brittschen/ darauff das Geschütz stehet.
  cs: O podlahách neboli pryčnách, na nichž stojí děla.
- typ: odstavec
  de: |-
    Dieselbigen seind von solcher importantz/ daß/ wann sie nicht gemachet/ vnd die Stuck nicht wol darauff ruhen vnd stehen können/ die schüß eintweders zu hoch oder zu nider/ dann auff dise/ dann auff jene seiten gehen: Sie werden für die Stuck auff den Wal vnd Pasteyen verordnet/ damit dieselbigen darauff ruhen/ jhren vollkommnen lauff im abschiessen hindersich nemmen/ vnd widerumb geladen vnd gewendet werden mögen: dann weiln die Erden den gewalt eines Stucks nicht wol ertragen/ vnd den stoß des Geschützes im abschiessen nicht wol außstehen mag/ so sencken sich dieselbigen mit den Räderen in die Erden/ vnd seind mit grosser müh widerumb außzubringen/ sonderlich wann es feucht vnd naß Wetter ist/ dardurch die vngewüssen schüß vervrsachet werden/ die Räder geschwächt/ vnd vil Volck vnd gefahrs solche zu wenden vnd zu laden erforderet wird. Solche Brittschen aber müssen nach einer gewüssen breite vnd länge/ vnd nach der grösse der Stucken gemachet werden.
  cs: |-
    Dělové podlahy {Brucken oder Brittschen}[^1] jsou tak důležité, že když se neudělají a děla na nich nemohou dobře spočívat a stát, jdou rány buď příliš vysoko, nebo příliš nízko, jednou na tu, jindy na onu stranu. Zřizují se pro děla na valu a baštách {Pasteyen}, aby na nich děla spočívala, při výstřelu mohla plně couvnout a dala se znovu nabít a natočit. Protože totiž zemina nesnese dobře tíhu děla ani ráz při výstřelu, boří se děla koly do země a jen s velkou námahou se zase vytahují, zvláště za vlhkého a deštivého počasí; tím vznikají nejisté rány, kola se oslabují a k natáčení a nabíjení je třeba mnoho lidí a nemalého nebezpečí. Takové podlahy se však musí dělat v určité šířce a délce a podle velikosti děl.
- typ: nadpis
  uroven: 3
  de: Wie die Brüttschen zu den Stucken gemachet werden.
  cs: Jak se dělají podlahy pro děla.
- typ: odstavec
  de: |-
    Etliche machen dieselbige also: Sie legen grosse höltzer vberzwerch auff einander/ vnd fügen die läden vnd bretter wol vnd gleich zusammen. Etliche aber legen läden von Lindenem holtz darauff/ vnd giessen hinder die Stuck bley/ damit die Stuck wol zu ruck lauffen mögen. Etlicher meynung aber ist/ man solle vornen von der Brustwehr vnd so weit die Stuck sich erstrecken/ einen esterich von 30. oder 40. schuh lang machen/ vnd grosse quaderstück darauff thun/ dero jedes anderthalben schuh dick/ vnd so breit alß man sie haben kan/ wol gehawen vnd fleissig zusammen geklammert oder auch geköttet/ doch nicht gar zu glatt/ sonder ein wenig rauch vnd hart/ welche wie auch die Britschen ein wenig fürsich haldind/ damit die Stuck nicht zu weit lauffen können/ vnd were gar gut/ wo es nicht zu vil kosten wurde.
  cs: |-
    Někteří je dělají takto: kladou velké trámy křížem na sebe a fošny a prkna na nich pevně a rovně spojí. Jiní na ně kladou fošny z lipového dřeva a za děla lijí olovo, aby děla mohla dobře couvat.[^2] Někteří však míní, že se má od předprsně, kam až děla sahají, udělat 30 nebo 40 stop dlouhá dlažba {esterich} a na ni položit velké kvádry, každý půldruhé stopy silný a tak široký, jaký jen lze dostat, dobře otesané a pečlivě sepjaté skobami nebo i stmelené, ne však příliš hladké, nýbrž trochu drsné a tvrdé; ty se stejně jako dřevěné podlahy mají trochu svažovat dopředu, aby děla nemohla couvat příliš daleko. Bylo by to velmi dobré, kdyby to nestálo příliš mnoho.
- typ: nadpis
  uroven: 2
  de: Von den ausseren Wercken.
  cs: O vnějších dílech.
- typ: nadpis
  uroven: 3
  de: Was die ausseren Werck seyen.
  cs: Co jsou vnější díla.
- typ: odstavec
  de: |-
    Sie seind die Werck/ so ausserhalb einer Vestung den Feind von der
  cs: |-
    Vnější díla {ausseren Werck} jsou ta, která se stavějí vně pevnosti, aby nepřítele
poznamky:
- n: 1
  text: Dřevěná plošina (platforma) pod dělem na valu; „Britsche“ je totéž slovo jako české pryčna.
- n: 2
  text: Smysl lití olova za děla není jasný; snad šlo o vyrovnání a zpevnění dráhy zákluzu.
