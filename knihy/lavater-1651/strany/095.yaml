bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    allhiesig Quartier zu exercieren geritten bin. Da sollen nun jhr alß vnserer gnädigen Herren Nachgesetzte vnd beeydete treffenlich vnd ernstlich ermahnet seyn/ daß jhr mit erstem vnverzogenlich euch auff dem Gmeindhauß zusammen thügind/ vnd mit einanderen die Rotten allerwegens ergäntzen/ die vnaußgezogene Mannschafft aber verzeichnen/ vnd von Hauß zu Hauß gehen/ die Wehr vnd Waaffen besichtigen/ vnd da jhr etwas mangels an Wehr vnd Waaffen/ auch an der Munition befinden/ daß jhr dann ein vnd anderen vermahnen/ sich besser verfaßt zu machen/ wo er anderst vnserer gnädigen Herren straaff nicht erwarten will: darneben sollen jhr auch das Volck vermahnen zur Gottsforcht vnd gehorsame der Oberkeit/ vnd jhnen wol zu gemüht führen/ die jetzigen schwären vnd gefaarlichen zeiten/ vnd daß ein Ehrsame Oberkeit nichts anders suche/ dann deß gemeinen Vatterlands Nutz vnd Wolstand/ vnd daß ein jeder bidermann ohne das schuldig seye Weib vnd Kind wider feindlichen vberfahl zu schützen vnd zu schirmen. Wann jhr nun dises also in trewen außrichten/ werden jhr eben das jenig thun/ was ewer Ehr vnd Eyd außweißt/ vnd mein gnädig Herren euch vertrawen/ vnd können wir alßdann die hoffnung haben/ vnser Herr vnd Gott werde hierzu verleihen sein Gnad vnd heiligen Geist/ auch vns weiters in vnserem geliebten Vatterland gnädig erhalten.
  cs: |-
    zdejšího obvodu {Quartier} konat cvičení. Vy, jakožto podřízení a přísahou zavázaní [úředníci] našich milostivých pánů, buďte tedy důrazně a vážně napomenuti, abyste se co nejdříve a bez odkladu sešli na obecním domě, společně všude doplnili roty {Rotten}, mužstvo, které není ve výběru, zapsali, chodili od domu k domu a prohlíželi zbraně a zbroj; a kde shledáte nějaký nedostatek ve zbraních a zbroji či v munici, abyste toho či onoho napomenuli, aby se lépe vybavil, nechce-li jinak očekávat trest našich milostivých pánů. Kromě toho máte také napomínat lid k bázni Boží a k poslušnosti vrchnosti a dobře mu připomenout nynější těžké a nebezpečné časy; a že ctihodná vrchnost nehledá nic jiného než užitek a blaho společné vlasti a že každý řádný muž je beztak povinen chránit a bránit ženu a dítě před nepřátelským přepadením. Vyřídíte-li to tak věrně, učiníte právě to, co vám ukládá vaše čest a přísaha a v co moji milostiví páni ve vás důvěřují; a pak můžeme mít naději, že nám náš Pán a Bůh k tomu propůjčí svou milost a Ducha svatého a i nadále nás v naší milované vlasti milostivě zachová.
- typ: nadpis
  uroven: 3
  de: |-
    Ein andere form: Wie ein Quartierhauptmann sein Commission bey einem Obervogt ableget.
  cs: |-
    Jiný vzor: Jak obvodní hejtman {Quartierhauptmann} vyřizuje své pověření {Commission} u vrchního fojta {Obervogt}.[^1]
- typ: odstavec
  de: |-
    Edler/ etc. Es möchte den Herren villeicht wunder nemmen/ warumb ich dißmals zu jhm komme/ die vrsach ist kurtz dise. Es haben vnser gnädig Herren vnd Oberen auß anlaß jetziger gefaaren/ vnd deß hin- vnd her/ an den Eydgnössischen grentzen/ schwebenden frömbden Kriegsvolck/ kurtz abgeweyleter tagen/ für gut angesehen/ daß man/ etc. Vnd dann in ander weg wider feindlichen gewalt nohtwendige pręparatoria zum nohtfahl mache. Vnder solchen mittlen nun/ dardurch dem Feind (mit der gnädigen hilff Gottes) abbruch geschehen mag/ haben sie auch für gut vnd rahtsam befunden/ daß etc. Das ist nun von mir vnd vbrigen Herren/ denen es aufferlegt/ beschehen/ vnd von vnserer gnädigen Herren approbiert vnd gut geheissen worden. Damit aber/ etc. vnd dann allen jhren Herren Obervögten ein solches zu verrichten anbefohlen werde. Darumb haben sie mich zu dem Herren abgesandt/ daß ich neben jhrem freundlichen Gruß/ gnädigen vnd günstigen Willen jhme etc. anzeigen thue: Wird hierauff der Herr/ seinem hohen verstand vnd ansehen nach wol wüssen/ wie er mit seinen Ampts-angehörigen solle vmbgehen/ damit vnserer gnädigen Herren Befehl erstattet/ vnd im fahl der noht jedermeniglich zur gegenwehr gefasset seye. Das werden vnser gnädig Herren in allem gutem erkennen. Vnd wo auch ich besonderbar für mein Person dem
  cs: |-
    Urozený [pane] atd. Pána možná udiví, proč k němu tentokrát přicházím; příčina je krátce tato. Naši milostiví páni a vrchnost uznali v nedávno minulých dnech z důvodu nynějších nebezpečí a cizího válečného lidu, který se pohybuje sem a tam u hranic Spříseženstva, za dobré, aby se atd. a aby se i jinak proti nepřátelské moci učinila nutná opatření {pręparatoria} pro případ nouze. Mezi takovými prostředky, jimiž lze (s milostivou pomocí Boží) nepříteli uškodit, shledali také za dobré a radné, aby atd. To nyní bylo vykonáno mnou i ostatními pány, jimž to bylo uloženo, a našimi milostivými pány schváleno a potvrzeno. Aby však atd. a aby pak bylo všem jejich pánům vrchním fojtům uloženo toto vykonat. Proto mě k pánovi vyslali, abych mu vedle jejich přátelského pozdravu, milostivé a laskavé vůle oznámil atd. Pán pak podle svého vysokého rozumu a vážnosti jistě bude vědět, jak má jednat s příslušníky svého úřadu, aby byl rozkaz našich milostivých pánů splněn a v případě nouze byl každý připraven k obraně. To naši milostiví páni ve všem dobrém ocení. A kde já zvlášť za svou osobu
poznamky:
- n: 1
  text: >-
    Obervogt – vrchní fojt, správce venkovského úřadu (Obervogtei) dosazovaný z řad městské rady.
