bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Reyß außfüllen wolte/ man jhme dasselbig nemmen vnd verbrennen könte: da er aber Stein/ Erden vnd anders hineyn wirfft/ kan mans jhme bey der nacht hinweg tragen/ vnd jhne in dem Graben durch die heimlichen außgäng vnversehens vberfallen: es ist auch besser lufft/ weder bey dem stinckenden vnd allzeit stehendem Wasser.
  cs: |-
    chrastím zasypat, lze mu to vzít a spálit; a hází-li do nich kamení, zeminu a jiné věci, lze mu to v noci odnést a jeho samého v příkopu tajnými východy nenadále přepadnout. Je tam také lepší vzduch než u páchnoucí a stále stojaté vody.
- typ: nadpis
  uroven: 3
  de: Warumb etlich die Wassergräben den trocknen vorziehen.
  cs: Proč někteří dávají vodním příkopům přednost před suchými.
- typ: odstavec
  de: |-
    Dieweil alles holtzwerck/ so der Feind in den Graben werffen thut/ durch das Wasser fort geflötzet wird/ vnd die Erden vnd Stein versincken/ auch mit grosser mühe vnd langsam außzufüllen seind. Man ist sicher wegen des vndergrabens/ vnd ob schon der Feind die Contrascarpe (oder gegenschräg) eyngenommen hat/ so hat er sich doch des Grabens noch nicht bemächtiget. Es halten auch jhren etliche die trocknen Gräben nicht für gut/ es were dann in der mitte desselbigen ein tieffes Wassergräblin: vnd wiewol der Feind sich vnderstehen wolte einen Wassergraben abzuführen/ so geschicht doch solches nicht ohne sondere mühe vnd kosten: wann auch der Feind Schiff- oder andere Brucken hinüber machen wolte/ so kan doch derselbig kein bedeckung haben/ sonder jhme dieselbige mit Fewr-Jnstrumenten zerrissen werden.
  cs: |-
    Protože všechno dřevo, které nepřítel hází do příkopu, voda odplaví, zemina a kamení se potopí a [vodní příkopy] se zasypávají jen s velkou námahou a pomalu. Je se v nich v bezpečí před podkopáním, a i když nepřítel obsadí kontreskarpu {Contrascarpe} (neboli protisvah), ještě se tím příkopu nezmocnil. Někteří také nepokládají suché příkopy za dobré, leda by měly uprostřed hluboký vodní příkopek {Wassergräblin}.[^1] A i kdyby se nepřítel pokusil vodní příkop vypustit, nestane se to bez zvláštní námahy a nákladů; a kdyby přes něj chtěl postavit lodní {Schiff-} nebo jiné mosty, nemohou mít žádné krytí a lze mu je rozbít ohnivými nástroji {Fewr-Jnstrumenten}.
- typ: nadpis
  uroven: 2
  de: Von des Grabens Schräge.
  cs: O svazích příkopu.
- typ: odstavec
  de: |-
    Die Abdachung oder Schräge des Grabens ist zweyerley/ jnnerlich vnd ausserlich. Die gegen dem Wal zu ist die jnnerliche: die ausserlich aber/ so gegen dem Feld gehet/ die gegenschräg oder gegenböschung genannt.
  cs: |-
    Sklon {Abdachung} neboli šikmina příkopu je dvojí, vnitřní a vnější. Ta, která je obrácena k valu, je vnitřní; vnější, obrácená k poli, se nazývá protišikmina neboli protisvah {gegenschräg oder gegenböschung} [tj. kontreskarpa].
- typ: nadpis
  uroven: 2
  de: Was der bedeckte Weg seye.
  cs: Co je krytá cesta.
- typ: odstavec
  de: |-
    Er ist der Gang ausserthalb dem rand des Grabens gelassen/ darauff man bedeckt gehen/ vnd den Feind von dem Graben abhalten kan.
  cs: |-
    Krytá cesta {bedeckte Weg} je ochoz ponechaný vně okraje příkopu, po němž lze chodit kryt a odrážet nepřítele od příkopu.
- typ: nadpis
  uroven: 2
  de: Von der Brustwehr des bedeckten wegs.
  cs: O předprsni kryté cesty.
- typ: odstavec
  de: |-
    Es ist ein Brustwehr/ so sich von 50. bis in 100. schuh in das Feld verlieret vnd zuspitzet/ hinder welche sich die Soldaten im außfallen/ vnd da sie zu ruck getriben werden/ alß zu einem vortheil begeben/ vnd dem Feind widerstand thun mögen.
  cs: |-
    Je to předprseň {Brustwehr}, která se v délce 50 až 100 stop pozvolna ztrácí do pole a vybíhá v ostří;[^2] vojáci se za ni při výpadu, a když jsou zahnáni zpět, uchylují jako do výhodného postavení a mohou odtud nepříteli klást odpor.
- typ: nadpis
  uroven: 2
  de: Von den Porten/ wo dieselbigen gemeinlich hingesetzt werden.
  cs: O branách a kam se obvykle umisťují.
- typ: odstavec
  de: |-
    Sie stehen am besten in der mitte der Courtine, weil sie von den Bollwercken am besten beschützet seind/ vnd jhnen der Feind am wenigsten beykommen mag.
  cs: |-
    Nejlépe stojí uprostřed kurtiny {Courtine}, protože je tam bašty {Bollwercken} nejlépe chrání a nepřítel se k nim nejméně dostane.
- typ: nadpis
  uroven: 2
  de: Von der Porten beschaffenheit.
  cs: Jaké mají být brány.
- typ: odstavec
  de: |-
    Dieselbigen sollen inn- vnd außwendig gemachet werden. Die jnnwendigen werden nicht so vest/ alß die außwendigen gemachet: darumb soll man dise fleissig vnd starck bawen vnd anordnen/ darzu gehören
  cs: |-
    Brány se mají dělat vnitřní i vnější. Vnitřní se nedělají tak pevné jako vnější; proto se mají vnější stavět a zřizovat pečlivě a silně. K tomu patří
poznamky:
- n: 1
  text: Úzký vodní kanál ve dně suchého příkopu, pozdější kyneta (franc. cunette).
- n: 2
  text: Popis odpovídá glacis – mírnému násypu před krytou cestou, který se k poli svažuje do ztracena.
