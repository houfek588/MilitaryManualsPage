bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    handlen/ daß sie den Weg vnd Paß des Lands zeigen/ damit nichts verhinderlich seye. Alle solche anschläg sollen gantz heimlich gehalten werden/ damit der Feind sie nicht in erfahrung bringe/ vnd jhnen zu schaden nicht begegne: mit wenigen soll man sich berahtschlagen/ vnd die endliche resolution gar niemandem vertrawen.
  cs: |-
    jednat tak, aby ukázali cestu a průchody {Paß} v zemi, aby nic nebylo na překážku. Všechny takové záměry {anschläg} se mají držet v naprosté tajnosti, aby se o nich nepřítel nedozvěděl a nepostavil se jim na škodu. Radit se má jen s málokým a konečné rozhodnutí nesvěřovat vůbec nikomu.
- typ: nadpis
  uroven: 2
  de: Wie man für ein Statt ziehet/ vnd das Läger schlaget.
  cs: Jak se táhne před město a rozbíjí ležení.
- typ: odstavec
  de: |-
    Man soll in voller Battaille oder Schlachtordnung/ doch weit vnd vornen breit marschieren/ damit es dem Feind ein schräcken gebäre/ vnd er die Armee für stärcker alß sie ist/ ansehe/ doch daß das Volck mit den Stücken nicht erreichet werden möge: alßdann solle man/ wo die Wäld nahe an dem Läger/ vnd der Feind bedeckung haben möchte/ alle Päß/ daß der Feind die Proviant nicht abschneiden möge/ wol verwahren/ vnd darauff die Quartier außtheilen/ namlich in drey oder vier Haupt-Quartier: die Regiment von einer Nation solle man zusammen ordnen/ vnd die Nationen/ wo möglich/ sönderen: alßdann soll man jedem Quartier Stück/ Munition/ Proviant vnd andere nohtwendigkeiten zur nohtdurfft verordnen: der General soll in der mitte oder am besten vnd sichersten ort beyneben den Generalspersonen vnd anderen hohen Officierern gelosiert/ vnd mit etlichen Regimenteren vmbgeben werden: hinder denselbigen des Generals-Proviantplatz: die frömbden Krämer vnd Marckitänter sollen beysammen nicht weit darvon losieren: deßgleichen wird darbey gemachet ein geraumer platz für die Haupt- Artillerey/ so nicht in die Schantzen gebraucht werden/ sampt der Munition: das Pulfer wird oben mit Rosshärinen deckenen vberdecket/ so für Fewr vnd Wasser gut ist: vnd werden die Wägen mit Kuglen; darnach die mit Lunden; hernach andere Rüstwägen/ sampt einem Graben darumb geführt/ die wird starck verwachet/ vnd Spießknecht zur Schiltwacht gestellt/ so darbey Schiltwacht halten: hinder demselben ist der Marckt: zu aller hinderst aber des gantzen Lägers ist ein platz für die Metzger: vnd hinder denselben der platz die Leibs-nohtdurfft zu thun/ so von den Steckenknechten mit stangen/ daran strohwüsch seind/ abgezeichnet wirdt. Der General-Wagenmeister vnd der General von der Artillerey sollen beysammen losieren: die Obersten vnd Hauptleuth bey jhren Soldaten: die Obersten in der mitte jhres Regiments: etlich Feldgeschütz soll auff dem Lermenplatz/ so zwüschen den Regimenten vnd den Tranchen oder Verschantzungen seind/ in einer Ordnung geladen stehen: ein jeder Constabel/ sampt den Matrosen/ Handlangers/ Bineurs oder Schauffelbawren halten sich ein jeder bey jhren Stücken: Es soll aber die Munition nicht in der mitte des Quartiers/ sondern an einem besonderen ort wol verwahret stehen: die vbrigen Wägen sollen hinder dem Quartier/ ein jeder an seinem behörlichen ort stehen/ vnd die Wagenmeister vnd Fůhrleuth darbey halten. Wann nun ein Quartier soll abgestochen wer-
  cs: |-
    Táhnout se má v plném bitevním šiku {Battaille oder Schlachtordnung}, avšak rozvinutě a vpředu zeširoka, aby to nepříteli nahnalo strach a pokládal armádu za silnější, než je; avšak tak, aby vojsko nemohlo být zasaženo děly {Stücken}. Potom se mají – jsou-li lesy blízko ležení {Läger} a mohl-li by v nich mít nepřítel krytí – dobře zajistit všechny průchody, aby nepřítel nemohl odříznout proviant, a nato rozdělit kvartýry {Quartier}, totiž do tří nebo čtyř hlavních kvartýrů. Pluky jednoho národa se mají řadit k sobě a národy, je-li to možné, oddělovat. Pak se má každému kvartýru přidělit podle potřeby děl, munice, proviantu a jiných nezbytností. Generál má být ubytován uprostřed nebo na nejlepším a nejbezpečnějším místě vedle generálních osob a jiných vyšších důstojníků a obklopen několika pluky; za nimi [je] generálovo proviantní místo. Cizí kramáři a markytáni mají být ubytováni pohromadě nedaleko odtud. Rovněž se při tom zřídí prostorné místo pro hlavní dělostřelectvo, pokud se nepoužívá v šancích {Schantzen}, spolu s municí. Prach se shora přikryje žíněnými houněmi, které chrání před ohněm i vodou; kolem se rozestaví vozy s koulemi, potom vozy s doutnáky {Lunden} a dále ostatní výzbrojní vozy {Rüstwägen} a celé se to obežene příkopem. Místo se silně střeží a ke stálé stráži {Schiltwacht} se tam staví pikenýři {Spießknecht}, kteří tu drží stráž. Za ním je trh; úplně vzadu za celým ležením je místo pro řezníky a za nimi místo k vykonání tělesné potřeby, které profousovi pacholci {Steckenknechten} vyznačí tyčemi s věchty slámy. Generální vozmistr {General-Wagenmeister} a generál dělostřelectva mají být ubytováni pohromadě; plukovníci a hejtmani u svých vojáků, plukovníci uprostřed svého pluku. Několik polních děl má stát nabitých v řadě na poplachovém shromaždišti {Lermenplatz}, které je mezi pluky a zákopy {Tranchen} neboli opevněními. Každý konstábl {Constabel} se drží s lodníky {Matrosen}, pomocníky a pionýry {Bineurs} neboli lopataři u svých děl. Munice však nemá stát uprostřed kvartýru, nýbrž na zvláštním, dobře střeženém místě. Ostatní vozy mají stát za kvartýrem, každý na svém náležitém místě, a vozmistři a vozkové se mají držet u nich. Když se má tedy kvartýr
