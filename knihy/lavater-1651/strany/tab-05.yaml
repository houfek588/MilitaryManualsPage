  popis: |-
    Skládaná dvoustránková mědirytina, vpravo dole označená *Bl. IV* („list IV“). Zobrazuje cvičení pikenýrů s píkou: 32 číslovaných postav (1–32) ve třech pásech, které se čtou zleva doprava přes obě poloviny listu. Pikenýři mají přilbu (morion) s chocholem, kyrys s plátovými šosy (tasetami) a kord. Čísla odpovídají 32 povelům oddílu „Hie folget das Exercitium der Spießknechten“ na straně 83. Například: 1 – píka postavená u pravé nohy; 2–4 zvednutí a nesení píky vzhůru; 8–9 píka na rameni; 10 nesení vodorovně; 12–13 sklopení píky „proti bráně“; 14 sklopení proti nepříteli; 20 vlečení píky; 25 hluboký výpad s píkou opřenou u pravé nohy proti jízdě a s tasením kordu; 27–29 sklopení dozadu; 30–32 píka znovu na rameni.
    Podle pokynu knihaři z roku 1651 se má vevázat za stranu 82. Seznam tiskových chyb (strana errata) k tomu poznamenává: „Jn der 4. lin. im 84. blat ist das Exercitium der Spieß auch in Kupffer gebracht“ („na 84. straně ve 4. řádku: cvičení s píkou je také v mědirytině“).
