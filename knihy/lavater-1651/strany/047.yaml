bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Eyd schweeren/ daß sie alle/ vnd ein jeder insonderheit/ einem Herren Burgermeister vnd Raht/ auch gantzer Ehrsamen Burgerschafft der Statt N. vnseren gnädigen Herren gewähr/ vnd alle gebürende observantz vnd gehorsame leisten/ deren schaden wahrnen vnd nutzen fürderen/ auch dero zimlichen gebotten vnd verbotten nachkommen/ vnd in abwesen des Obersten/ den Hauptleuthen/ deroselben verordneten Kriegs-Rähten/ oder anderen so befelch haben/ gehorsamen: auch sich ein jeder gegen dem anderen/ alß Brüderen erzeigen vnd halten. Sie sollen auch schweeren/ daß ein jeder zu lob/ ehr vnd wolfahrt hochgedachter Statt N. vnd dero Landschafft/ sein Leib vnd Leben/ Gut vnd Blut wölle darstrecken/ guts vnd böses gedulden/ tragen vnd leiden/ auch bey der Versamlung sterben vnd genäsen. Jtem: Daß keiner rebellische meuterey oder vnwillen dem Obersten mache. Es soll auch ein jeder/ wo er von seinen vorgesetzten commandiert wird (da es anderst nicht wider sein gewüssen ist) sich ohne einiges widersprechen gehorsam finden lassen: deßgleichen auch keiner auß der Guarnison/ wie vnd welcher gestalten solche beschaffen/ vnd was darinnen gehandlet wurde/ etwas offenbaren: auch da der ein oder ander sich mit worten oder wercken argwöhnisch erzeigte/ wordurch der Oberkeit vnd Besatzung vngemach/ oder nachtheil widerfahren möchte/ ein jeder solches anzuzeigen verpflichtet seyn: auch keiner mit dem Feind/ desselben Trompeteren/ Trommenschlageren/ oder anderen/ ohne vorwüssen seiner vorgesetzten/ spraach halten. Es soll auch keiner Brieff/ sie seyen offen oder zu/ ohne vorwüssen der Oberkeit/ weder empfangen noch hinweg schicken: auch keiner solle sich mit pfeiffen/ schreyen/ singen/ schiessen/ leuten/ klopffen/ noch an vngewohnlichen orten sich gegen den Feinden mit deuten oder wincken mercken oder fehen lassen. Jtem: Es soll sich keiner weder tags noch nachts/ ohne erlaubnuß/ auch nicht ohne Poleten/ so von dem Obersten vnderzeichnet vnd besiglet seyn soll/ aussert der Besatzung finden lassen. Es soll auch ein jeder verbunden seyn/ wo einige versamlung vnd meuterey wider die Oberkeit/ die Besatzung/ oder die Officierer fürgenommen werden möchte/ vnfählbar in eyl anzuzeigen/ vnd den Obersten/ Hauptleuthen/ vnd anderen Nachgesetzten/ mit Gut vnd Blut beyspringen. Vnd letstlichen: Ein jeder/ wo die Statt belägert/ bestürmbt vnd angegriffen wurde/ von keinem auffgeben hören/ geschweigen zu rahten/ sondern sich auff das aller ausserste/ vnd biß auff den letsten blutstropffen wehren. Alles getrewlich/ vngefahrlich/ etc.
  cs: |-
    přísahu {Eyd}, že všichni i každý zvlášť budou panu purkmistrovi a radě i veškerému ctihodnému měšťanstvu města N., našim milostivým pánům, věrni a budou jim prokazovat veškerou náležitou úctu a poslušnost, varovat je před škodou a hájit jejich prospěch, plnit jejich náležité příkazy i zákazy a v nepřítomnosti plukovníka {Obersten} poslouchat hejtmany {Hauptleuthen}, jimi ustanovené válečné rady {Kriegs-Rähten} nebo jiné, kdo mají velení; a také že se každý bude k druhému chovat a projevovat jako k bratru. Mají také přísahat, že každý chce pro slávu, čest a blaho řečeného města N. a jeho krajiny nasadit tělo i život, statek i krev, dobré i zlé trpělivě snášet, nést a trpět a se svým sborem {Versamlung} umřít i přežít. Dále: Že nikdo nebude proti plukovníkovi strojit vzbouřeneckou vzpouru ani nevoli. Také se má každý, kamkoli ho jeho nadřízení komandují (není-li to ovšem proti jeho svědomí), bez jakéhokoli odmlouvání ukázat poslušným; rovněž nikdo nesmí nic vyzradit o tom, jak a jakým způsobem je posádka {Guarnison} zřízena a co se v ní projednává; a projevoval-li by se ten či onen slovy či skutky podezřele, čímž by vrchnosti a posádce {Besatzung} mohla vzejít nesnáz či újma, je každý povinen to oznámit; a nikdo nesmí bez vědomí svých nadřízených mluvit s nepřítelem, s jeho trubači {Trompeteren}, bubeníky ani s jinými. Nikdo také nesmí bez vědomí vrchnosti přijímat ani odesílat dopisy, ať otevřené, či zapečetěné; a nikdo se nesmí vůči nepříteli dát poznat ani spatřit pískáním, křikem, zpěvem, střelbou, zvoněním, klepáním ani ukazováním či kynutím na neobvyklých místech. Dále: Nikdo se nesmí ve dne ani v noci zdržovat mimo posádku bez dovolení a bez propustky {Poleten}, kterou má podepsat a zapečetit plukovník. Každý je také zavázán, kdyby se chystalo nějaké srocení a vzpoura proti vrchnosti, posádce nebo důstojníkům, to neprodleně a spěšně oznámit a plukovníkovi, hejtmanům a ostatním ustanoveným [velitelům] přispět statkem i krví. A konečně: Bude-li město obléháno, bude-li na ně veden útok a bude-li napadeno, nemá nikdo ani slyšet o vzdání, natož k němu radit, nýbrž se má bránit do nejzazšího konce a do poslední kapky krve. Vše věrně, bez falše atd.
- typ: nadpis
  uroven: 3
  de: Der Eyd selbst.
  cs: Vlastní přísaha.
- typ: odstavec
  de: |-
    Was mir hie vor gelesen ist/ hab ich genugsam verstanden/ dem will ich gnug thun/ vnd nachkommen/ getrewlich vnd ohngefahrlich/ alß ich bitt/ daß mir Gott helff.
  cs: |-
    Tomu, co mi zde bylo předčteno, jsem dostatečně porozuměl; chci tomu učinit zadost a dostát tomu, věrně a bez falše, jakož prosím, ať mi Bůh pomáhá.
