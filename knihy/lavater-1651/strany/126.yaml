bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    des tags die Wachten: es soll aber vor tags ein solche Corps de garde/ oder schäntzlein fertig seyn: dise seind die der linien beschützung oder defensen/ darauß man die linien bestreychen/ vnd den außfallenden Feind widerumb abtreiben mag: die seiten derselben seind 4. 5. oder 6. růthen: es sollen aber zwey eck dises quadrats/ oder Corps de garde grad in die Lauffgräben gerichtet seyn/ danaher man nicht allein die Lauffgräben/ oder approchen/ zu beyden seiten/ sonder auch das Feld im gesicht haben kan: wo man es aber nicht gut befinden wurde dergleichen Reducten zu machen/ soll man sie ausserthalb/ oder vor den Lauffgräben machen etwan anderthalbe/ oder zwo růthen von denselbigen/ also daß selbige seyen zwüschen der Statt vnd den Corps de garde/ mit einer parallel seiten gegen der Approche/ daß man bey der nacht vnd sonsten darzwüschen gehen/ auch Kärren/ Wägen vnd grosse Stück zwüschen der Corps de garde vnd Approchen führen möge/ vnd also werden die Corps de garde die Approchen an der seiten bestreychen. Wann nun dise Arbeiter das jenige verrichtet/ so führet ein jeder Sergeant die seinigen widerumb ohne Trommelschlag ab/ vnd ins Quartier/ alßdann liferet ein jeglicher Soldat sein Jnstrument/ vnd wird jeglichem zum lohn 5. gut batzen gegeben. Die reparation oder verbesserung der Gräben wird verdinget/ vnd gibt man so vnd so vil von einer růthen/ je nach dem es heiß vnd gefahrlich ist zu arbeiten: dann es müssen die Lauffgräben auff 8. schuh weit seyn/ damit man mit Wägen/ Stücken vnd dergleichen hindurch fahren möge. Die letsteren Linien werden von den Verdingeren gemachet: dann es sehr gefahrlich ist/ vnd wird vil von einer růthen gegeben/ damit man jhnen ein Hertz mache/ vnd die Arbeit gefürderet/ vnd kein zeit verlohren werde: wann man nun mit den Lauffgräben nicht weiters kommen kan/ so fangt man an zu vndergraben.
  cs: |-
    přes den drží stráže. Taková strážnice {Corps de garde} neboli šančička má však být hotova ještě před rozedněním. Ty slouží k ochraně neboli obraně linií: z nich lze linie z boku postřelovat {bestreychen} a nepřítele, který vypadne, zase zahnat. Jejich strany měří 4, 5 nebo 6 prutů. Dva rohy tohoto čtverce neboli strážnice mají však mířit přímo do aproší {Lauffgräben}, takže člověk má v dohledu nejen aproše {approchen} na obě strany, ale i pole. Kdyby se však neuznalo za dobré dělat takové reduty {Reducten} [přímo na aproších], mají se dělat vně neboli před aprošemi, asi jeden a půl nebo dva pruty od nich, a to tak, aby [aproše] ležely mezi městem a strážnicemi[^1], se stranou rovnoběžnou s aproší, aby se mezi nimi dalo v noci i jindy procházet a mezi strážnicemi a aprošemi vozit káry, vozy a velká děla; tak budou strážnice postřelovat aproše z boku. Když pak tito dělníci vykonají, co měli, odvede každý seržant {Sergeant} své lidi bez bubnování zpět do kvartýru; tam každý voják odevzdá své nářadí a každému se dá za odměnu 5 dobrých bacenů {batzen}. Oprava neboli vylepšení příkopů se zadává úkolem {verdinget} a platí se tolik a tolik od prutu podle toho, jak horká a nebezpečná je to práce; aproše totiž musejí být až 8 stop široké, aby jimi mohly projíždět vozy, děla a podobně. Poslední linie dělají úkolníci {Verdingeren}, neboť je to velmi nebezpečné, a platí se od prutu mnoho, aby se jim dodalo srdce, práce postupovala a neztrácel se čas. Když se pak s aprošemi už nelze dostat dál, začne se podkopávat.
- typ: nadpis
  uroven: 2
  de: |-
    Was man weiters wegen der Reducten vnd Lauffgräben zu beobachten habe.
  cs: Čeho je třeba dále dbát u redut a aproší.
- typ: odstavec
  de: |-
    Es werden die Reducten geviert Regular: etliche aber ablang/ gleich dem rechtgewinckelten parallelogramm gemachet: vnn werden die Regular bißweilen zur seiten fünffthalb/ von 5. vnd sechßthalb růthen haben. Die ablangen parallelogrammischen aber seind in jhrem begriff nicht mehr dann 16. 20. oder 12. růthen: die kleineste seiten von den kurtzen aber 2. růthen: wo man nun kein gute Erden gehaben mag/ machet man höltzene Reducten von brätteren/ vnd thut zwüschen 2. Reyen brätter sand. Der Reducten höhe aber ist nicht mehr alß 6. schuh/ vnd ist derselben anlegung gemeiniglich von 14. oder 20. schuh: die höhe offt auch 8. oder 10. schuh: die breite der Brustwehr 4. oder 6. schuh: die Banquet 2. oder 3. der Fůß oder Berm 3. schuh: der Graben 15. auch offt 24. die tieffe/ je nach dem der grund ist. Wann nun Morast ist/ vnd man nicht graben kan/ so machet man den boden mit reyßgestochtnen hurden/ vnd wirfft alßdann Erden darauff/ vnd werden zu beyden Schantzkörb ge-
  cs: |-
    Reduty se dělají čtvercové, pravidelné, některé však podlouhlé, jako pravoúhlý rovnoběžník. Pravidelné mají někdy stranu čtyři a půl, 5 a pět a půl prutu. Podlouhlé, obdélníkové však mají v obvodu {begriff} nejvýše 16, 20 nebo 12 prutů, nejmenší z kratších stran pak 2 pruty. Kde nelze mít dobrou zeminu, dělají se dřevěné reduty z prken a mezi dvě řady prken se dává písek. Výška reduty však není větší než 6 stop a její základna {anlegung} je obvykle 14 nebo 20 stop; výška bývá často i 8 nebo 10 stop, šířka předprsně {Brustwehr} 4 nebo 6 stop, střelecký stupeň {Banquet} 2 nebo 3, pata neboli berma {Berm} 3 stopy, příkop 15, často i 24, hloubka podle toho, jaká je půda. Je-li tam však bažina a nelze kopat, zpevní se půda lísami {hurden} spletenými z proutí, na ně se pak nahází zemina a po obou [stranách] se šancovní koše {Schantzkörb}
poznamky:
- n: 1
  text: 'Podmět věty („selbige“) není jednoznačný; podle smyslu (strážnice stojí stranou aproše a kryjí ji z boku) jde o aproše, které leží mezi městem a strážnicemi.'
