  popis: |-
    Skládaná dvoustránková mědirytina, vlevo dole označená *Bl. V* („list V“). Zobrazuje dvě číslované řady cviků se štítem, obě k povelům na straně 84.
    První řada, postavy 1–30 v horních třech pásech: pěšák v přilbě s chocholem a v kyrysu cvičí s kulatým štítem (rondelem, Rondelle) a píkou, později s rondelem a kordem. Odpovídá oddílu „Das Exercitium mit der Rondellen vnd Spieß/ wie auch mit der Rondellen vnd Dägen“ (povely 1–30). Například: 5–6 krytí levého boku a prsou rondelem; 8–9 sklopení píky; 15–16 položení píky na zem; 17 prostrčení paže řemeny rondelu; 18–22 tasení kordu, kord u ucha a předložení kordu dopředu a vpravo; 26–27 hození rondelu na záda; 28 zvednutí píky ze země; 29–30 postavení píky.
    Druhá řada, postavy 1–13 (vpravo ve třetím pásu a ve spodním pásu): muž v plné zbroji s uzavřenou přilbou cvičí s velkým podlouhlým štítem (Schilt, Targe) a kordem. Odpovídá oddílu „Das Exercitium mit dem Schilt oder Targe vnd Dägen“ (povely 1–13): 2–3 krytí levého boku a prostrčení paže řemenem; 4–9 tasení kordu, krytí prsou, kord u hlavy a nad hlavou, krytí vpředu a vpravo; 11 zasunutí kordu; 12 vytažení paže z řemenů; 13 štít na zádech.
    Podle pokynu knihaři z roku 1651 se má vevázat za stranu 83 („das dritte mit Schilten“).
