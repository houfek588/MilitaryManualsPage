poznamky:
- n: 1
  text: |-
    Rüstmeister i Gewehrmeister označují téhož poddůstojníka kompanie – správce zbraní (viz glosář); nezaměňovat se zbrojmistrem dělostřelectva (Zeugmeister) ani se zbrojním správcem (Zeugwart).
- n: 2
  text: |-
    Auditor – vojenský soudce, právník pluku, který vede vyšetřování a soudní řízení; v lancknechtských plucích 16. století tuto úlohu plnil rychtář (Schultheiß).
- n: 3
  text: |-
    „Geschröt“ = sekané olovo či železo, broky; jde tedy o kartuše s kartáčovou náplní (srov. heslo kartáč).
- n: 4
  text: |-
    Lavater vykládá Corporal starším německým slovem Rottmeister (rotmistr). V překladu knihy se Corporal jednotně překládá jako desátník (viz glosář).
- n: 5
  text: |-
    Přepis DTA má „Stechbelm“; ve skenu jde nejspíš o „Stechhelm“ (kolčí přilba). Casquet byla ve skutečnosti lehká otevřená přilba; Lavaterova glosa je jen přibližná.
- n: 6
  text: |-
    Commiß – vojenské zásoby a dávky, zvl. chléb vydávaný mužstvu (odtud něm. Kommissbrot).
- n: 7
  text: |-
    Lancepasade (franc. anspessade) – zástupce desátníka, nejnižší poddůstojnická funkce.
