bloky:
- typ: nadpis
  uroven: 3
  de: Wie sich ein Fendrich auff der Parade verhalte.
  cs: Jak si má při parádě počínat praporečník.
- typ: odstavec
  de: |-
    Ein Fendrich hat kein Wacht/ es seye dann daß die gantze Compagnie wache: doch solle er allzeit vmb Wachtzeit auff der Parade erscheinen/ den Soldaten zusprechen/ vnd sehen wo mangel/ das solcher verbessert werde. Wann man nun mit der gantzen Compagnie auff die Wacht zeucht/ stellt er sich für den dritten Squadron oder bruch der Spiessen: Laßt seinen Fahnen fliegen/ vnd da es zeit zu marschieren/ schwingt er den Fahnen vber den kopff zu ruck gegen den Soldaten/ zeucht seinen Hůt ab/ wendet sich alßdann wider vmb/ vnd marschiert. Da man nun für die Hauptwacht kommt/ vnd die frömbd Hauptwacht abgelößt wird/ steckt er des tags den Fahnen vor dem Wachthauß auff/ laßt denselben fliegen: des nachts aber stellt er jhne in das Wachthauß.
  cs: |-
    Praporečník {Fendrich} nedrží stráž, leda by ji držela celá kompanie {Compagnie}; přesto se má v čase stráže vždy dostavit na parádu {Parade}, promluvit k vojákům a dohlédnout, aby byl napraven každý nedostatek. Táhne-li se pak na stráž s celou kompanií, postaví se před třetí oddíl {Squadron} neboli díl pikenýrů {Spiessen}, nechá svůj praporec vlát, a když je čas k pochodu, zamává praporcem přes hlavu dozadu k vojákům, smekne klobouk, potom se zase obrátí a vykročí. Když se pak přijde k hlavní stráži {Hauptwacht} a dosavadní hlavní stráž jiné kompanie je vystřídána, zasadí ve dne praporec před strážnicí {Wachthauß} a nechá ho vlát; v noci jej však postaví do strážnice.
- typ: nadpis
  uroven: 3
  de: Wie er sich im ab zug verhaltet.
  cs: Jak si počíná při odchodu.
- typ: odstavec
  de: |-
    Jm abzug haltet er seinen Fahnen offen in die höhe/ stehet vor den Spiessen zu vorderst/ vnd so man marschiert/ führet er die Compagnie ab/ also: Die Spieß gehen eng alle in einem trouppen/ jhre Picken auffwerts tragende/ auff jhne vorher: darnach ein Wachtmeister/ so seine Helleparten den Spießknechten gleich traget: alßdann die Musquetierer alle auch eng in einem trouppen: vnd zu letst der Leutenammt hinden nach alleinig. Die Trommenschlager marschieren vor den Spiessen auff den Fendrichen/ vnd schlagen einen besonderbaren trouppenschlag. Wo man nun für des Fendrichs Losament kommt/ zertheilt sich das Volck in zween theil/ vnd machen eine gassen. Der Fendrich stehet zu oberst in mitte derselben/ schwingt seinen Fahnen/ wickelt jhne alßdann zusammen/ zeucht den Hůt ab/ wünschet den Soldaten einen guten abend/ vnd verfüget sich darauff mit dem Fahnen in sein Losament/ darauff auch ein jeder (aussert denen/ so die Wacht haben) zu Hauß gehet: Die Wachthabenden aber stellen sich alßbald auff ein ort in die ordnung/ vnd marschieren auff die Wacht/ dahin sie bescheiden seind.
  cs: |-
    Při odchodu drží praporec rozvinutý vysoko, stojí úplně vpředu před pikenýry, a když se vyráží, odvádí kompanii takto: pikenýři jdou hned za ním vpředu, všichni těsně v jednom houfu {trouppen}, a nesou píky {Picken} vzhůru; za nimi vachmistr {Wachtmeister}, který nese halapartnu {Helleparten} stejně jako pikenýři {Spießknechten} své píky; potom mušketýři {Musquetierer}, rovněž všichni těsně v jednom houfu, a nakonec úplně vzadu sám poručík {Leutenammt}. Bubeníci {Trommenschlager} pochodují před pikenýry za praporečníkem a bubnují zvláštní signál pro houf {trouppenschlag}. Když se přijde před praporečníkovo ubytování {Losament}, rozdělí se mužstvo na dvě části a utvoří uličku. Praporečník stojí nahoře uprostřed ní, zamává praporcem, potom jej svine, smekne klobouk, popřeje vojákům dobrý večer a odebere se s praporcem do svého ubytování; nato jde každý (kromě těch, kdo mají stráž) domů. Ti, kdo mají stráž, se však hned na jednom místě seřadí do šiku a pochodují na stráž, kam jsou určeni.
- typ: nadpis
  uroven: 3
  de: Wie sich der Leutenammt auff der Parade verhaltet.
  cs: Jak si při parádě počíná poručík.
- typ: odstavec
  de: |-
    Es hat ein beschaffenheit mit dem Leutenammt wie mit dem Fendrich durchauß: allein marschiert er mit einer Partisanen zu allerhinderst alleinig/ da man auff die Hauptwacht mit der gantzen Compagnie zeucht.
  cs: |-
    S poručíkem je to ve všem stejné jako s praporečníkem, jenom když se s celou kompanií táhne na hlavní stráž, pochoduje s partyzánou {Partisanen} sám úplně vzadu.
- typ: nadpis
  uroven: 3
  de: Wie sich ein Capitain auff der Parade verhaltet.
  cs: Jak si při parádě počíná hejtman.
- typ: odstavec
  de: |-
    Er verhaltet sich dem Fendrichen vnd Leutenammt gleich/ marschiert vorher der Ordnung/ traget ein Spieß/ zeucht aber selten mit der Compagnie widerumb ab: vnd da er abziehet/ marschiert er auff der rechten hand neben dem Fendrichen.
  cs: |-
    Hejtman {Capitain} si počíná stejně jako praporečník a poručík: pochoduje před šikem {Ordnung} a nese píku {Spieß}; s kompanií však zpět odchází jen zřídka, a když odchází, pochoduje po pravé ruce vedle praporečníka.
- typ: nadpis
  uroven: 3
  de: Wie sich ein Major auff der Parade verhaltet.
  cs: Jak si při parádě počíná major.
- typ: odstavec
  de: |-
    Er soll sich/ so bald es Wachtzeit ist/ auff dem Marckt vor dem
  cs: |-
    Jakmile nastane čas stráže, má se major {Major} dostavit na náměstí ještě před
