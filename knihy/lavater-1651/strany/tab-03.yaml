  popis: |-
    Menší nečíslovaná mědirytina označená jen *fig. A*; v pokynu knihaři se jmenuje „das klein abgeschnitten blat des thurns“ (malý ořezaný list s věží). Zobrazuje ochrannou bránu (Schutzporte) postavenou na vnějším okraji příkopu u konce mostu, jak ji popisuje text na stranách 8–9; písmena odpovídají textu.
    Čtyřboká zděná věž s klenutým průjezdem a okovanými dveřmi je obehnána kruhovým plotem z kůlů s dvoukřídlými vraty (*A*: „mit einem Zaun von Stagketen … vmbgeben“). Na plošině věže je čárkovaně naznačena jehlancová střecha strážní budky (*B*); uprostřed podlahy je čtvercový otvor zakrytý mříží, jímž se střílí a hází na nepřítele mezi branami. Řada svislých trámů (*C*) stojí v otvorech, jimiž lze spustit těžké okované trámy a zatarasit průjezd. V rozích plošiny jsou malé věžičky se střílnami (*E*), po obvodu zvýšené lavice s odklopnými okenicemi ke střelbě a házení dolů (*I*) a na boku věže (*II*) žebřík, po němž se na bránu vystupuje. Na plošině stojí obránci, jeden pálí z muškety.
    Vpravo samostatně (*D*) jeden ze spouštěcích dubových trámů, okovaný plechem a dole zakončený železnou botkou, a pod ním vodorovně železná závora či kladivo, jímž se závory vyrážejí ze zářezů, aby trámy spadly. V popředí postupují čtyři střílející mušketýři – nepřítel útočící na bránu.
    Patří k oddílu „Von beschaffenheit einer Schutzporten“ na stranách 8–9 Prvního dílu. Podle pokynu knihaři z roku 1651 se má vevázat za stranu 8.
