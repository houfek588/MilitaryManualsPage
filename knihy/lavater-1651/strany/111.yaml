  pokracovani: true
  de: |-
    mercken lassen/ vnd inzwüschen sich die Regimenter auff den boden darnider lassen. Wann du nun sihest den Feind auff dich zurucken/ vnd die Musquetierer fewr geben/ kommt ein Regiment/ so commandier alßdann widerumb eins/ oder mehr/ je nach dem du lust vnd vortheil hast gegen denselbigen/ behalte aber die Regimentstücklein wol zwüschen den Regimenteren verborgen: da es nun an dem/ daß man nahe zuhauffe kommt/ so lasse sich dein Ordnung ein wenig von einanderen theilen/ vnd die Stücklein mit hagel würcken/ alßdann mache ein geschrey/ vnd treibe des Feinds Volck zu ruck: wo nun der Feind die seinigen entsetzt/ so solt du die deinigen nicht stecken lassen/ sondern auch entsetzen: vnd wird also ein Regiment das ander ablösen/ vnd sich ein jedes abgelößte Regiment in sein vorige ordnung vnd distantz begeben. Wann aber der Feind mit dem gantzen Volck auff dich zu marschierte/ so solt du alßdann deine Stück bedecken/ vnd stellen daß sie auß dem wind seyen/ alßdann deine säck mit äschen/ staub vnd vngelöschtem Kalck auffthun/ vnd disen staub vnd rauch den Feinden durch den wind ins gesicht fliegen/ vnd die Artillerey mit grausamem geschrey abgehen lassen: die Reuterey aber/ so mit der grossen zahl V. anzeiget/ zu hinderst der Battaille in einer Fundamentsordnung/ vnd in solcher form/ wie IV. die groß zahl außweiset/ zu beyden seiten in den Feind mit sampt dem Fußvolck/ so mit 2. 4. 6. 8. 10. bezeichnet/ vornen/ vnd auff beyd seiten für die Artillerey oder Hauptgeschütz marschieren: die anderen Regimenter aber in jhrer Distantz mit gutem andacht des außtrags erwarten lassen/ vnd da dein Volck getriben/ widerumb die frischen Regimenter mit erlabetem hertzen/ muht vnd grossem geschrey/ alß wann der Feind flohe/ rüffen/ vnd anfallen/ vnd den Feind in die flucht schlagen. Was aber die Regimentsstücklein belanget/ führet ein jedes Regiment die seinigen mit/ vnd da man darmit geschossen/ werden alßdann die Ross widerumb angespannet/ die Stück widerumb geladen/ vnd dem Regiment nachgeführt. Du solt auch/ wo du ein bühel sehen kanst/ vnd zum Geschütz dienstlich were/ auch alle Hölenen/ Hecken/ Morast/ Wasser/ Holtz/ vnd dergleichen/ vor dem Feind zu deinem vortheil eynnemmen/ vnd deine Musquetierer darhinder legen: dein Munition vnd besten Sachen/ Jtem/ das groß Geschütz wol verwahren/ vnd dich nicht lassen vmbgeben: vnd je mehr mit einanderen zu schiessen kommen/ je besser ist es für dich/ vnd ist das meiste am angriff gelegen: insonderheit/ da das Geschütz wol angehet vnd trifft/ das dann im vortreffen grossen schräcken gibt. Wo das Geschütz aber durch vngeschickte Constabels zu hoch gehet/ so ist die halb vnd vast gantze Schantz verlohren/ darumb vil an guten Constabels gelegen ist/ vnd damit das Handgeschütz nicht zu hoch gehe/ solle man die Soldaten gewennen daß sie auff den knien gestracks fürsich außwährts fewr geben/ vnd je mehr in einem Glid fewr geben vnd fechten mögen/ je
  cs: |-
    dát o sobě vědět; pluky mají mezitím ulehnout na zem. Když pak vidíš, že nepřítel na tebe postupuje a mušketýři {Musquetierer} pálí, a blíží-li se jeden [jeho] pluk, vyšli proti němu opět jeden nebo více [svých], podle toho, jakou k tomu máš chuť a výhodu; plukovní dělka {Regimentstücklein} však drž dobře ukrytá mezi pluky. Když už dojde k tomu, že se [vojska] k sobě přiblíží, nech svůj šik trochu rozestoupit a dělka zapůsobit kartáči {hagel}; pak spusť pokřik a zatlač nepřátelské vojsko zpět. Přijde-li nepřítel svým na pomoc, nenechávej ani ty své ve štychu a pošli jim pomoc také; tak bude jeden pluk střídat druhý a každý vystřídaný pluk se vrátí do svého předešlého šiku a odstupu. Kdyby však nepřítel táhl proti tobě s celým vojskem, máš svá děla zakrýt a postavit je tak, aby stála mimo vítr; potom otevři své pytle s popelem, prachem a nehašeným vápnem, nech vítr hnát ten prach a dým nepřátelům do tváře a za strašlivého pokřiku nech vypálit dělostřelectvo. Jízdu, kterou ukazuje velké číslo V a která stojí úplně vzadu za bitevním šikem {Battaille} v základním šiku {Fundamentsordnung}, nech v takové formě, jakou ukazuje velké číslo IV, vyrazit z obou stran do nepřítele spolu s pěchotou označenou 2, 4, 6, 8, 10, a to vpředu a po obou stranách před dělostřelectvo neboli hlavní děla. Ostatní pluky však nech v jejich odstupu bedlivě vyčkávat, jak věc dopadne; a bude-li tvé vojsko zatlačeno, nech zase čerstvé pluky s občerstveným srdcem a odvahou a s velkým pokřikem volat, jako by nepřítel prchal, zaútočit a obrátit nepřítele na útěk. Co se týče plukovních dělek, každý pluk si veze svá s sebou; když se z nich vystřelí, zase se zapřáhnou koně, dělka se znovu nabijí a vezou se za plukem. Kde uvidíš pahorek, který by se hodil pro děla, a také všechny úvozy, živé ploty, močály, vody, lesy a podobně, máš je ke svému prospěchu obsadit dříve než nepřítel a rozmístit za ně své mušketýry. Svou munici a nejcennější věci, rovněž velká děla, dobře ochraňuj a nenech se obklíčit. Čím více [mužů] se dostane ke střelbě zároveň, tím lépe pro tebe; nejvíce záleží na prvním náporu, zvláště když děla dobře vypálí a zasáhnou, což v předním šiku [nepřítele] vyvolá velké zděšení. Střílejí-li však děla kvůli neobratným konstáblům {Constabels} příliš vysoko, je polovina, ba skoro celá šance[^1] ztracena; proto velmi záleží na dobrých konstáblech. A aby ani ruční zbraně nestřílely příliš vysoko, mají se vojáci navyknout pálit vkleče, přímo před sebe; a čím více [mužů] může v jedné řadě střílet a bojovat, tím
poznamky:
- n: 1
  text: |-
    Schantz zde ve smyslu „šance, výhra ve hře“ (z franc. chance), nikoli polní opevnění; „die Schanz verlieren“ = prohrát.
