bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    weders auff der rechten oder lincken hand/ vnd wo es sich am besten schicket/ Namlich also: Man machet einen Gang in die Erden/ so vngefahr 4. schuh hoch vnd 3. breit ist/ vnd vnderbawet jhn mit holtz vnd pfälen/ damit die Erden nicht widerumb eynfalle: diser Gang wird krumm gemachet/ auch dardurch die auß der Minen gegrabene Erden geführet. Wo nun die belägerten deiner Minen gewahr weren worden/ so must du dieselbig verlassen/ vnd ein andere anfangen. Man approchiert offt auß 2. oder 3. Quartieren gegen einer Vestung/ vnd werden an vnderschiedlichen orten Minen gemachet die Vestung zu vndergraben: Wann man nun die Kammeren/ dahin man die Pulferthonnen setzet/ machen will/ so soll man sie etwan 4. oder 5. schuh hoch/ vnd 3. oder 4. breit/ je nach dem der Wal schwär vnd dick ist/ machen: da du nun den Wal hineynwerts fellen wilt/ must du denselben durchgraben biß an 6. schuh/ oder auch 8. schuh/ so wird die Kammer nicht vber 4. schuh hoch/ vnd 3. oder 4. weit seyn/ vnn 6. lang/ je nach dem man vil thonnen mit Pulfer dahin stellen will/ vnd der Wal dick ist: Wann nun die Kammeren 4. schuh vnd nicht höher/ so wendet sich der gewalt des Pulfers nach der Statt eynwendligen zu/ weiln daselbsten der geringste widerstand ist: soll aber der Wal vber sich springen/ so solle die Mina vmb etwas erhöcht werden/ biß daß sie 6. oder 7. schuh hoch ist: man soll aber den eyngangin die Kammer treffenlich starck vnd wol verstopffen/ daß der dunst kein lufft habe gegen dir zudringen/ vnd du hierdurch grossen schaden empfangest: er solle auch vornen mit balcken/ so vberzwerch gehen/ auff das allergenawest vnd mit Erden zugestopffet werden/ vnd sprenget ein thonnen Pulfer 12. schuh Erden: darnach dann die Bresche außgerechnet werden kan.
  cs: |-
    buď po pravé, nebo po levé ruce, tam, kde se to nejlépe hodí, a to takto: Udělá se do země chodba asi 4 stopy vysoká a 3 široká a vyztuží se dřevem a kůly, aby se zemina zase nesesula. Tato chodba se dělá křivá a vynáší se jí také zemina vykopaná z miny {Minen}. Kdyby obléhaní tvou minu zpozorovali, musíš ji opustit a začít jinou. K pevnosti se často přibližuje {approchiert} ze 2 nebo 3 kvartýrů a na různých místech se dělají miny, aby se pevnost podkopala. Když se pak mají dělat komory {Kammeren}, do nichž se kladou sudy s prachem, mají být asi 4 nebo 5 stop vysoké a 3 nebo 4 široké, podle toho, jak mohutný a tlustý je val. Chceš-li val svalit dovnitř, musíš se jím prokopat až na 6, nebo i 8 stop; komora pak nebude vyšší než 4 stopy, bude 3 nebo 4 široká a 6 dlouhá, podle toho, kolik sudů s prachem tam chceš postavit a jak tlustý je val. Jsou-li komory 4 stopy vysoké a ne vyšší, obrátí se síla prachu dovnitř k městu, protože tam je nejmenší odpor. Má-li však val vyletět vzhůru, má se mina o něco zvýšit, až bude 6 nebo 7 stop vysoká. Vchod do komory se však má neobyčejně silně a dobře ucpat, aby dým {dunst} neměl průchod směrem k tobě a nezpůsobil ti tím velkou škodu; vpředu se má co nejtěsněji zahradit příčnými trámy a ucpat zeminou. Jeden sud prachu vyhodí 12 stop země, a podle toho lze pak vypočítat průlom {Bresche}.
- typ: nadpis
  uroven: 2
  de: |-
    Wie sich die Soldaten in den Lauffgräben verhalten sollen.
  cs: Jak si mají vojáci počínat v aproších.
- typ: odstavec
  de: |-
    Sie sollen alle jhre Spieß schleiffen/ darmit man sie nicht darbey erkennen/ vnd jhnen die Eysen vnd Spieß entzwey schiessen möge: Man stellet auch kleine Schützenkörblein auff die Brustwehr dick vnd reyenweis an einanderen/ wie du im ersten Büchlein von einer Vestung gelehret bist/ durch welche die Musquetierer auff dem Wal/ so sich nur einer herfür blicken laßt/ fewr geben/ vnd dardurch die Arbeiter defendieren: da sie mit den Approchen nahe an des Feinds Wercken seind/ sollen sie ohn vnderlaß auff die Brustwehrinen des Feinds Wercken spielen vnd schiessen/ auch Handgranaten hineyn werffen: da nun ein Handgranaten neben einen fallet/ solle er sich auff das gesicht legen biß sie gespielt hat/ dise schlaget alßdann in die höhe/ vnd schadet jhme nichts. Man soll auch von den Battereyen starck gegen des Feinds flancken vnd durch den Creutzschuß auff die puncten oder gesichtlinien der Bollwercken spielen/ vnd in allweg sehen/ daß man oben dem Feind seine defensen nemmen/ vnd alß jmmer möglich seine Battereyen/ vnd Constablers zu grund richten: auch die Stück auff das allerfleissigst bewahren/ vnd vor den beläger-
  cs: |-
    Všichni mají své píky {Spieß} vléci [po zemi], aby je podle nich nepoznali a nepřestříleli jim hroty a ratiště. Na předprseň {Brustwehr} se také kladou malé střelecké košíky {Schützenkörblein}, hustě a v řadách vedle sebe, jak ses naučil v první knížce o pevnosti; skrze ně mušketýři pálí po každém na valu, kdo se jen ukáže, a tím chrání dělníky. Když se s aprošemi {Approchen} dostanou blízko k nepřátelským dílům, mají bez ustání pálit a střílet na předprsně nepřátelských opevnění a házet do nich i ruční granáty. Padne-li ruční granát vedle někoho, má si lehnout tváří k zemi, dokud granát nevybuchne; ten pak vyrazí vzhůru a nic mu neudělá. Také se má z baterií silně pálit na nepřátelské flanky {flancken} a křížovou palbou na hroty či čela {gesichtlinien} bašt a všemožně hledět, aby se nepříteli nahoře vzala jeho obrana a pokud možno se zničily jeho baterie a konstáblové; také se mají děla co nejpečlivěji chránit a před obléhanými
