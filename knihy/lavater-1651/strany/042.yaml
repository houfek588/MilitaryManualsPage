bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    sich dareyn wicklen/ vnd sein Leib vnd Leben darmit vbergeben/ eh er das Fendlein vbergibt vnd mit gewalt nemmen laßt: vnd sonsten beyneben vbrigen gemeinen Puneten vnd Articklen/ wie andere Befelchsleuth der Statt N. lob/ nutz vnd ehre zu fürderen vnd schaden zu wenden. Alles getrewlich vnd sonder gefehrde.
  cs: |-
    do něho zavinout a raději s ním odevzdat tělo i život, než by praporec {Fendlein} vydal a nechal si ho násilím vzít; a jinak má spolu s ostatními obecnými body a články, jako jiní velitelé {Befelchsleuth}, hájit slávu, užitek a čest města N. a odvracet škodu. Vše věrně a bez falše.
- typ: nadpis
  uroven: 2
  de: Von den Wachtmeistern/ deren Ampt/ Eyd vnd Beruff.
  cs: O vachmistrech, jejich úřadu, přísaze a povolání.
- typ: odstavec
  de: |-
    Es sollen vnder einer Compagnie zween bestellt werden: dieselbigen sollen wol schreiben vnd lesen können: vnd ist auch einer Compagnie am meisten gelegen an einem guten Leutenammt vnd zween guten Wachtmeistern/ welche fromm/ gottsförchtig/ auffrecht/ im Kriegswesen wol geübte Soldaten seyen. Deren Ampt ist/ dem Leutenammt die Compagnie helffen bestellen: die Wachten auff- vnd abführen: sich auff dem gewohnlichen platz/ da der Major alle Abend die Ordre außtheilt/ neben anderen vor Wachtzeit finden zu lassen: die Ordre vnd das Wort/ vnd was der Major weiter befilcht/ fleissig in gedächtnuß zu behalten: die Wachtzedel fleissig zu bewahren/ vnd nach auffgeführter Wacht/ den hohen Officierern von jhrer Compagnie/ alß dem Capitain/ Leutenammt vnd Fendrichen/ wie auch den Wachthabenden Corporalen/ auff jhren Wachtposten die Ordre/ vnd was zu thun befohlen worden ist/ ordenlich vnd recht zu geben vnd anzuzeigen. Sie helffen die ordnung machen/ marchieren auch neben der ordnung beyseits/ vnd da der ein oder ander im reyen oder glid vngleich stehet oder gehet/ zu recht weisen. Die Stattschlüssel der Porten helffen sie den Gefreyten der Hauptwacht vnd Majoren convojieren/ die Porten eröffnen vnd beschliessen/ die Schlüssel widerumb auff die Hauptwacht (da jhre Compagnie wachet) bringen. Es werden auch die Wachtmeister vnder die Porten der Vestung/ allzeit vnder jegliche einer/ so offt an jhnen die Hauptwacht ist/ gecommandiert: deren Ampt ist/ auff die frömbd-ankommenden Leuth/ Wägen/ Kärren/ Schiff vnd Fůhren gut achtung zu geben: die Leuth zu examinieren/ vnd die Wägen zu visitieren: Sie werden auch Convojen zu commandieren/ vnd selbige zu führen: Jtem/ auff Anschläg/ Scharmützieren/ Stürmen/ auff Päß/ Klausen/ Schantzen oder Castell gecommandiert/ so alßdann vollkommen Commandament haben/ derwegen von jhnen gut Kriegserfahrenheit erforderet wirdt. Sie sollen täglich die Wacht auff- vnd abführen/ vnd solches vnder jhnen vmbgehen lassen: deßgleichen die Soldaten in armis exercieren/ sich alle stund bey den Officierern vnd Knechten finden lassen/ damit so man jhrer bedürfftig/ sie bey der hand weren. Jm commandieren sollen sie sich also erzeigen/ daß sie nicht weniger alß die Capitain geförcht werden/ vnd sich von den Soldaten nicht cujonieren vnd meisteren lassen. Wann auch der Soldatesca etwas von nöhten/ sollen sie es an die Wachtmeister gelangen lassen/ nachmals die
  cs: |-
    V kompanii {Compagnie} mají být ustanoveni dva; ti mají umět dobře psát a číst. Kompanii také nejvíce záleží na dobrém poručíkovi {Leutenammt} a dvou dobrých vachmistrech {Wachtmeistern}, kteří mají být řádní, bohabojní, přímí a ve válečnictví dobře zběhlí vojáci. Jejich úřadem je pomáhat poručíkovi spravovat kompanii; vyvádět stráže na stanoviště a odvádět je; dostavit se s ostatními před strážní dobou na obvyklé místo, kde major {Major} každý večer vydává rozkazy; pilně si pamatovat rozkaz {Ordre}, heslo {Wort} a co major dále nařídí; pilně opatrovat strážní lístky {Wachtzedel} a po nástupu stráže řádně a správně předat a oznámit rozkaz a to, co bylo nařízeno, vyšším důstojníkům své kompanie, totiž hejtmanovi {Capitain}, poručíkovi a praporečníkovi {Fendrichen}, jakož i desátníkům {Corporalen}, kteří mají stráž, na jejich strážních stanovištích. Pomáhají stavět šik {ordnung}, na pochodu jdou stranou vedle šiku, a stojí-li či jde-li ten či onen v zástupu {reyen} nebo v řadě {glid} nerovně, srovnávají ho. Pomáhají svobodníkům {Gefreyten} hlavní stráže {Hauptwacht} a majorům doprovázet městské klíče od bran, otevírat a zavírat brány a klíče opět odnášet na hlavní stráž (když na ní stojí jejich kompanie). Vachmistři bývají také komandováni do bran pevnosti, vždy po jednom do každé, kdykoli na ně připadne hlavní stráž; tam je jejich úřadem dávat dobrý pozor na cizí příchozí lidi, vozy, káry, lodi a povozy, lidi vyslýchat a vozy prohlížet. Bývají také určováni, aby veleli doprovodům {Convojen} a vedli je; rovněž bývají komandováni na přepady {Anschläg}, šarvátky, útoky, do průsmyků, soutěsek, šancí {Schantzen} nebo kastelů, kde pak mají plné velení, a proto se od nich žádá dobrá válečná zkušenost. Mají denně vyvádět stráž a odvádět ji a v tom se mezi sebou střídat; rovněž cvičit vojáky ve zbrani {in armis} a být kdykoli k zastižení u důstojníků a knechtů, aby byli po ruce, kdyby jich bylo třeba. Při velení se mají projevovat tak, aby se jich vojáci báli neméně než hejtmanů, a nesmějí se od vojáků nechat šikanovat {cujonieren} ani ovládat. A potřebuje-li vojsko {Soldatesca} něco, mají [vojáci] s tím přijít k vachmistrům a vachmistři
