bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    wort (Stehe still Ronde) vnd dem Corporal rüffen mit disen worten (Corporal herauß:) Wann aber die Ronde vber das wolte fort gehen/ soll er sie auffhalten vnd nicht passieren lassen/ biß der Corporal kommt/ vnd derselben das Wort abgenommen hat: wo sie aber mit gewalt darwider thete/ hat er macht auff sie zu schiessen vnd zu stechen.
  cs: |-
    slovy „Stůj, obchůzko!“ a zavolat desátníka {Corporal} slovy „Desátníku, ven!“. Kdyby však obchůzka {Ronde} chtěla přesto jít dál, má ji zadržet a nenechat projít, dokud nepřijde desátník a nepřevezme od ní heslo {Wort}; kdyby se však násilím vzpírala, má moc na ni střílet a bodat.
- typ: nadpis
  uroven: 3
  de: Wie sich ein Spießknecht auff der Schiltwacht verhaltet.
  cs: Jak si počíná pikenýr na stálé stráži.
- typ: odstavec
  de: |-
    Er solle sich in allem dem Musquetierer gemäß halten/ allein daß er den Spieß oben auff die Brustwehre lege/ vnd den spitz vornen in der hand habe/ damit er sich wenden möge: Sein Rüstung vnd Sturmhůt soll er auffhaben. Die Spießknecht sollen zu der Munition gestellt werden/ damit das Pulfer vor dem fewr der Londen gesicheret seye.
  cs: |-
    Pikenýr {Spießknecht} si má ve všem počínat jako mušketýr {Musquetierer}, jenom píku {Spieß} položí nahoru na předprseň {Brustwehre} a drží ji v ruce hrotem vpřed, aby se s ní mohl obracet. Má mít na sobě zbroj {Rüstung} a útočnou přilbu {Sturmhůt}. Pikenýři se mají stavět k munici {Munition}, aby byl prach v bezpečí před ohněm doutnáků {Londen}.
- typ: nadpis
  uroven: 3
  de: Wie sich ein Schiltwacht im Lermen verhaltet.
  cs: Jak si počíná stálá stráž při poplachu.
- typ: odstavec
  de: |-
    Wann die Schiltwacht etwas vernimmt/ soll sie dasselbig/ so laut sie vermag/ anschreyen: den anderen Schiltwachten zurüffen: vnd so sie ein Musqueten hat/ fewr darauff geben/ vnd Lermen machen: alßdann die anderen Musquetierer dergleichen auch thun/ vnd soll das schiessen rings vmb den Wal herumb gehen: alßdann so schlagen die Trommelschlager Lermen: vnd soll sich kein Schiltwacht bey Leibsstraaff von seinem Posten begeben/ sondern daselbsten des entsatzes vnd hilffs erwarten.
  cs: |-
    Zpozoruje-li stálá stráž {Schiltwacht} něco, má na to co nejhlasitěji zavolat a zavolat na ostatní stálé stráže, a má-li mušketu, vystřelit na to a vyvolat poplach {Lermen}; potom mají totéž učinit ostatní mušketýři a střelba má obejít dokola celý val {Wal}; nato bubeníci {Trommelschlager} bubnují poplach. Žádná stálá stráž nesmí pod tělesným trestem opustit své stanoviště {Posten}, nýbrž má tam vyčkat posily a pomoci.
- typ: nadpis
  uroven: 3
  de: Was die Sentinell-perdu seye.
  cs: Co je ztracená stráž {Sentinell-perdu}.
- typ: odstavec
  de: |-
    Es ist die verlohren ausserste Schiltwacht/ so vor dem Feind gehalten wirdt. Dise hat kein Obergewehr aussert jhrem Dägen/ auch offt ein halben Spieß: Wo nun ein Mann allein von dem Feind sich gegen jhro nahet/ so erwehret sie sich desselben so vil sie mag: kommen aber jhren zween Mann/ so begibt sie sich hindersich zu der anderen nechst hinder jhro stehenden Schiltwacht. Dise zween wehren sich der zween Feinden: kommen aber jhrer mehr/ so retirieren sie sich zur Wacht/ vnd machen Lermen: wo aber solches darvor geschehe/ daß die ein oder ander wegen eines oder zweyer Feinden ohne noht Lermen machte/ der oder dieselben werden ohn alle gnad gehenckt: dann vil blinde Lermen das Volck sorgloß machen/ darauß offt groß vnheyl entstehet: dann kein Feind offenbaret sich mit schiessen/ sonsten ist er verrahten: Deßwegen auch die aussersten Schiltwachten keine Musqueten haben. Dise verlohrne Schiltwachten halten die Gefreyten/ sie werden aber alle stund ordenlich abgelößt/ weiln es gar warm daselbsten. Man stellt auch an die gefahrlichsten ort zwo verlohren Schiltwachten zusammen.
  cs: |-
    Je to ztracená, nejzazší stálá stráž, která se drží před nepřítelem. Nemá žádnou hlavní zbraň {Obergewehr} kromě kordu {Dägen}, často také poloviční kopí {halben Spieß}. Blíží-li se k ní od nepřítele jediný muž, brání se mu, jak jen může; přijdou-li však dva, ustoupí dozadu k nejbližší stálé stráži, která stojí za ní. Tito dva se pak brání dvěma nepřátelům; přijde-li jich však víc, stáhnou se ke stráži a vyvolají poplach. Kdyby se však stalo, že by ten či onen předčasně a bez potřeby vyvolal poplach kvůli jednomu či dvěma nepřátelům, bude ten nebo ti bez milosti oběšeni; neboť mnoho planých poplachů činí mužstvo bezstarostným, z čehož často vzejde velké neštěstí. Žádný nepřítel se totiž neprozradí střelbou, jinak by byl odhalen; proto také nejzazší stálé stráže nemají muškety. Tyto ztracené stráže drží svobodníci {Gefreyten}, avšak každou hodinu se řádně střídají, protože je tam velmi horko. Na nejnebezpečnější místa se stavějí i dvě ztracené stráže pohromadě.
- typ: nadpis
  uroven: 3
  de: Wie die Ronde gethan werde.
  cs: Jak se koná obchůzka.
- typ: odstavec
  de: |-
    Es wird die Ronde von der Hauptwacht gethan: die erste Hauptronde thut der Capitain/ oder Leutenammt/ oder Fendrich/ Wachtmeister/ oder wol
  cs: |-
    Obchůzka se koná z hlavní stráže {Hauptwacht}: první hlavní obchůzku {Hauptronde} koná hejtman {Capitain}, poručík {Leutenammt}, praporečník {Fendrich} či vachmistr {Wachtmeister}, nebo
