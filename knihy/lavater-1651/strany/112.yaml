bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    besser es ist. Du solt auch etliche Bagagie/ so nicht vil wärth/ an einem ort stehen lassen/ damit sich die Feind darhinder machen/ vnd auff/ vnd vber disem raub zertrennt vnd geschlagen werden. Du solt auch kein Schlacht liferen/ du seyest dann darzu gezwungen/ vnd habest gewiß die Victori in der hand/ oder sonsten grossen vortheil. Jn der flucht solt du deinem Feind guldine Brucken schlagen. Du solt auch die gefangenen Feind wol examinieren. Jm Beuthen etliche Beuthmeister ordinieren/ vnd nur etliche Reuter vnd Fußvolck nachsetzen lassen/ aber dem Feind weder tag noch nacht rhu lassen/ daß er sich widerumb erhole vnd samle/ sondern deiner Victori nachhengen. Wo du dich mit deinem Feind schlagen wilt/ solt du allzeit sehen/ daß du ein Vestung/ Statt/ Schantz/ oder dergleichen hinder dir habest/ darzu du dein zuflucht vnd retirada/ in dem du geschlagen wurdest/ haben könnest. Dein Troß vnd Weiber solt du weit von dem Treffen/ von dem Volck etwan auff einen bühel/ oder sonsten dem Feind zu sehen stellen/ vnd darumb vom Volck/ damit sie durch jhres geschrey nicht dein eygen Volck erschrecken: Du kanst auch in währendemschlagen deinen Reuteren etliche Musquetierer zu ordnen/ so zwüschen jhnen Squadronenweis halten vnd marchieren mögen. Die Trompeter in währender Schlacht sollen alle beysammen an einem besonderen ort beyseits der Ordnung halten vnd blaasen. Die Trommelschlager aber marschieren ein jeder bey seiner Compagnie in dem dritten Glid.
  cs: |-
    lépe. Máš také nechat na jednom místě stát nějakou bagáž {Bagagie} malé ceny, aby se do ní nepřítel pustil a byl při té kořisti a kvůli ní rozptýlen a poražen. Také nemáš svádět bitvu, leda bys k tomu byl donucen a měl vítězství {Victori} jistě v rukou nebo jinou velkou výhodu. Prchajícímu nepříteli máš stavět zlaté mosty.[^1] Zajaté nepřátele máš také důkladně vyslechnout. Při kořistění ustanov několik kořistních mistrů {Beuthmeister} a k pronásledování nech vyrazit jen část jízdy a pěchoty; nepříteli však nedopřej klidu ve dne ani v noci, aby se nevzpamatoval a znovu neshromáždil, nýbrž své vítězství dotáhni. Kde se chceš s nepřítelem bít, dbej vždy, abys měl za sebou pevnost, město, šanci nebo něco podobného, kam by ses mohl utéci a ustoupit {retirada}, kdybys byl poražen. Svůj trén {Troß} a ženy postav daleko od bojiště a od vojska, třeba na nějaký pahorek nebo jinam, kde je nepřítel uvidí; a stranou od vojska proto, aby svým křikem nepoděsili tvé vlastní lidi. Během bitvy můžeš také ke svým jezdcům přidělit několik mušketýrů, kteří mohou mezi nimi stát a pochodovat po švadronách {Squadronenweis}. Trubači mají během bitvy stát všichni pohromadě na zvláštním místě stranou šiku a troubit. Bubeníci však pochodují každý u své kompanie {Compagnie} ve třetí řadě.
- typ: nadpis
  uroven: 2
  de: Die eilffte Battaille oder Schlachtordnung.
  cs: Jedenáctý šik {Battaille} neboli bitevní sestava.
- typ: odstavec
  de: |-
    Besihe das sechßte Kupfferblat die groß zahl III. Wann du ein solche Ordnung mit 4. Compagnien machen wilt/ so wider die Reuterey dienen solle/ so lasse ein jede Compagnie besonderbar marschieren/ mache alßdann ein solches Creutz/ wie 2. 3. 4. 5. außweisen/ vnd bekleide sie mit Musquetierern/ wie I. zeiget: lasse alßdann die Spießknecht jhre Spieß rings vmbher gegen den Reuteren fellen/ vnd die Musquetierer sich darunder salvieren: wie du allbereit vornen gelehrt bist.
  cs: |-
    Podívej se na [[tab-12|šestou mědirytinu]] {Kupfferblat}, velké číslo III. Chceš-li ze 4 kompanií vytvořit takový šik, který má sloužit proti jízdě, nech každou kompanii pochodovat zvlášť; pak z nich vytvoř takový kříž, jaký ukazují čísla 2, 3, 4, 5, a obklop jej mušketýry, jak ukazuje I. Potom nech pikenýry {Spießknecht} sklopit píky kolem dokola proti jezdcům a mušketýry se pod nimi ukrýt, jak jsi už byl poučen výše.
- typ: odstavec
  de: |-
    Also hast/ lieber Leser/ genugsam gesehen/ wie man die Stell-Zug-Fundaments- vnd Schlachtordnungen/ Compagnien/ halb- vnd gantzen Regimenterweis zu Ross vnd fůß machen/ stellen/ vnd darmit fechten solle/ vnd da du nun die Ordnungen der Compagnien wol machen vnd anordnen wirst können/ wirst du leichtlich mit der Regiments Schlachtordnung fort kommen/ solche darnach stellen vnd anrichten können: doch solt du darbey wüssen daß alle Compagnien zu 200. Mann gestellt seyen/ so in disem meinem Kriegsbüchlein gefunden werden.
  cs: |-
    Tak jsi tedy, milý čtenáři, dostatečně viděl, jak se po kompaniích, polovičních i celých plucích, na koni i pěšky tvoří a staví postojové, pochodové, základní a bitevní šiky a jak se v nich bojuje. Až budeš umět dobře tvořit a uspořádat šiky kompanií, snadno si poradíš i s bitevním šikem pluku a dokážeš jej podle toho postavit a zřídit. Přitom však věz, že všechny kompanie, které v této mé Válečné knížce najdeš, jsou počítány po 200 mužích.
- typ: odstavec
  de: |-
    Ende des dritten Theils Kriegs-Büchleins/ von übung allerley Wehr vnd Waaffen.
  cs: Konec Třetího dílu Válečné knížky, o cvičení ve všelijakých zbraních.
poznamky:
- n: 1
  text: |-
    Přísloví – poraženému nepříteli je moudré nechat volnou cestu k ústupu, aby se ze zoufalství znovu nebránil.
