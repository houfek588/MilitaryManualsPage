list: výklad cizích slov
strana: verso
sken: 10
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Banck/ Banquet: statio: scanno: scamnum, scabellum, gradus ad loricam (oder bancket/ stazio/ sganno/ sgamnum/ sgabellum/ gradus ad loricam/) liß das 2. bl. das 1. Kupffer fig. C, mit o, andeutet.
  cs: |-
    {Banck}, Banquet; statio; scanno; scamnum, scabellum, gradus ad loricam (vyslov bancket, stazio, sganno, sgamnum, sgabellum, gradus ad loricam) – střelecký stupeň. Čti s. 2; na 1. mědirytině, fig. C, je označen o.
- typ: odstavec
  de: |-
    Brustwehr/ parapet: parapeta, thorax, lorica: liß das 2. bl. das 1. Kupffer/ fig. C, mit i, bezeichnet.
  cs: |-
    {Brustwehr}, parapet; parapeta, thorax, lorica – předprseň. Čti s. 2; na 1. mědirytině, fig. C, je označena i.
- typ: odstavec
  de: |-
    Courtine, die Cortin/ Chorda; vallum inter duo propugnacula affixa; Cortina (oder Kortine/ korda/ vallum inter duo propugnackula affixa/ kortina/ liß das 3. bl. das 1. Kupffer. fig A, mit p. bezeichnet.
  cs: |-
    {Courtine}, die Cortin, Chorda; vallum inter duo propugnacula affixa; Cortina (vyslov Kortine, korda, vallum inter duo propugnackula affixa, kortina) – kurtina. Čti s. 3; na 1. mědirytině, fig. A, je označena p.
- typ: odstavec
  de: |-
    Affterstreych/ ala Secundaria, ala Cortinæ, der Streychplatz/ second flanc (oder ala sekundaria/ sekond flanck) liß das 3. bl. das 1. Kupffer fig A, mit ii, vnd 12. andeutet.
  cs: |-
    {Affterstreych}, ala Secundaria, ala Cortinæ, der Streychplatz, second flanc (vyslov ala sekundaria, sekond flanck) – zadní obrana.[^1] Čti s. 3; na 1. mědirytině, fig. A, ji ukazují ii a 12.
- typ: odstavec
  de: |-
    Gesichtlinien/ facies, frons, face, la face, il fronte, el fronte, (oder fazies/ frons/ fasse/ la fasse/ il fronte/ el fronte) sonsten auch gesichter/ stirnen/ genant/ liß das 3. bl. das 1. Kupffer. fig. A, wie 6. 9. a, vnd 13. außweißt.
  cs: |-
    {Gesichtlinien}, facies, frons, face, la face, il fronte, el fronte (vyslov fazies, frons, fasse, la fasse, il fronte, el fronte), jinak nazývané také gesichter, stirnen [tváře, čela] – čela bašty. Čti s. 3; na 1. mědirytině, fig. A, je ukazují 6, 9, „a“ a 13.
- typ: odstavec
  de: |-
    Groß Streychwinckel/ angle flanquant exterieur, angle de tenaille: Angulus defensionis major, vel exterior, angulus à latere propugnans exterior, major. liß das 3. bl. das 1. Kupffer/ fig. A, mit 9. bezeichnet.
  cs: |-
    {Groß Streychwinckel}, angle flanquant exterieur, angle de tenaille; Angulus defensionis major, vel exterior, angulus à latere propugnans exterior, major – velký obranný úhel.[^2] Čti s. 3; na 1. mědirytině, fig. A, je označen 9.
- typ: odstavec
  de: |-
    Streychwehr/ flanck/ humerus propugnaculi affixi, la ligne dú flanc, (oder la linie dü flanck) espaule, flanc, ala, spala, oreilon (oder epole/ flanck/ etc.) flanck/ achsel/ schulteren/ flügel/ streych: liß das 3. bl. das 1. Kupffer. fig. A, mit 7. vnd 11. bezeichnet.
  cs: |-
    {Streychwehr}, flanck, humerus propugnaculi affixi, la ligne dú flanc (vyslov la linie dü flanck), espaule, flanc, ala, spala, oreilon (vyslov epole, flanck atd.), flanck, achsel, schulteren, flügel, streych [bok, plece, ramena, křídlo, „stírání“] – flanka.[^3] Čti s. 3; na 1. mědirytině, fig. A, je označena 7 a 11.
- typ: odstavec
  de: |-
    Bollwerck/ Boulevart, Bastion, propugnaculum (oder Bulewart/ bastion/ propugnakulum) Sporen: liß das 4. bl. das 1. Kupffer. fig. A, mit 2. bezeichnet.
  cs: |-
    {Bollwerck}, Boulevart, Bastion, propugnaculum (vyslov Bulewart, bastion, propugnakulum), Sporen [ostruhy] – bašta. Čti s. 4; na 1. mědirytině, fig. A, je označena 2.[^4]
- typ: odstavec
  de: |-
    Hauptlinien/ ligne capitale, (oder linie kapitale) linea principalis, liß das 4. bl. das 1. Kupffer fig A, mit o, vnd 6. bezeichnet.
  cs: |-
    {Hauptlinien}, ligne capitale (vyslov linie kapitale), linea principalis – hlavní linie (kapitála).[^5] Čti s. 4; na 1. mědirytině, fig. A, je označena o a 6.
- typ: odstavec
  de: |-
    Blatte Bollwerck/ propugnaculum lineæ rectæ, plat Boulevart,) oder propugnakulum linie räckte.)
  cs: |-
    {Blatte Bollwerck}, propugnaculum lineæ rectæ, plat Boulevart (vyslov propugnakulum linie räckte) – plochá bašta.[^6]
- typ: odstavec
  de: |-
    Streychlinien/ ist die linien/ so auß der Affterstreych mit der Gesichtlinien in einem strich gezogen wird/ sonsten la ligne de deffense flanquante (oder la linie de deffanseflanckante) linea defensionis minor, defensiva stringens, linea defensionis mobilis, die klein Streychlinien/ etc. liß das 5. bl. das 1. Kupffer. fig. A, mit 12. vnd 13. andeutet.
  cs: |-
    {Streychlinien} – obranná linie je linie, která se vede ze zadní obrany v jedné přímce s čelem bašty; jinak la ligne de deffense flanquante (vyslov la linie de deffanseflanckante), linea defensionis minor, defensiva stringens, linea defensionis mobilis, malá obranná linie atd.[^7] Čti s. 5; na 1. mědirytině, fig. A, je označena 12 a 13.
- typ: odstavec
  de: |-
    Groß Streychlinien/ die beständige defenslinien/ la ligne de defense fischante, ist die linien/ so auß dem Punckt der Cortin vnd Flanck des Bollwercks gezogen wird/ linea defensionis affixa, defensionis major, defensiva figens, angeheffte Streychlinien: liß das 4. vnd 5. bl. das 1. Kupffer. fig. A, mit 11. vnd a, bezeichnet.
  cs: |-
    {Groß Streychlinien}, stálá obranná linie {beständige defenslinien}, la ligne de defense fischante – velká obranná linie je linie, která se vede z bodu, kde se stýká kurtina s flankou bašty; linea defensionis affixa, defensionis major, defensiva figens, připojená obranná linie {angeheffte Streychlinien}. Čti s. 4 a 5; na 1. mědirytině, fig. A, je označena 11 a „a“.
- typ: odstavec
  de: |-
    Erlängerung der Streychen/ ala humeri producta, alæ continuatio, flanc prolongè: besihe das 1. Kupffer. fig. A, mit 11. vnd 8. bezeichnet.
  cs: |-
    Erlängerung der Streychen, ala humeri producta, alæ continuatio, flanc prolongè – prodloužení flanky. Viz 1. mědirytinu, fig. A, kde je označeno 11 a 8.
poznamky:
- n: 1
  text: |-
    Úsek kurtiny od flanky k bodu, odkud lze ještě ostřelovat čelo protější bašty (s. 3; viz glosář). „Streychplatz“ = místo, odkud se „stírá“, tj. vede boční palba. V tisku „ii“ – snad tisková chyba za 11.
- n: 2
  text: |-
    Franc. angle de tenaille = „klešťový úhel“. Podle s. 3–4 vzniká tam, kde se prodloužená čela dvou sousedních bašt protínají proti středu kurtiny; odkaz „mit 9.“ (9 = špice bašty) tomu přesně neodpovídá.
- n: 3
  text: |-
    Lavater řadí mezi synonyma flanky i espaule (plece, rameno) a oreilon (ucho, orillon); u pozdějších autorů jde o samostatné části bašty – rameno je úhel mezi čelem a flankou (srov. úhel ramene, s. 5), orillon zaoblený výstupek, který kryje zasunutou flanku. „Streych“ = boční palba, jíž se „stírá“ příkop a čelo sousední bašty.
- n: 4
  text: |-
    Na rytině má číslice 2 dobový tvar podobný písmenu „z“; tak jsou označeny bašty na obou vyobrazeních fig. A.
- n: 5
  text: |-
    Podle s. 4 linie vedená od bodu hrdla ke špici bašty, tj. osa bašty; v pozdější terminologii kapitála.
- n: 6
  text: |-
    Plochá bašta (franc. bastion plat) stojí na přímé linii, např. uprostřed příliš dlouhé kurtiny. Závorky jsou v tisku chybně umístěné.
- n: 7
  text: |-
    Lavater rozlišuje dvě obranné linie: malou (franc. flanquante, později „rasantní“), která prodlužuje čelo bašty až ke kurtině, takže palba ze zadní obrany čelo jen „stírá“, a velkou neboli stálou (fichantní), vedenou od styku kurtiny s flankou ke špici protější bašty; k ní se vztahuje délka 60 prutů na s. 1 a 4 (dostřel muškety).
