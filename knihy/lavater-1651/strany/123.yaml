bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    den/ so theilet der General-Quartiermeister solches den Regiments-Quartiermeisteren auß/ vnd gibt auff zween Soldaten zu einer hütten 8. schuh in die breite/ vnd 8. schuh in die länge/ vnd machet man dielänge des Quartiers nach advenant vnd beschaffenheit: dann je breiter vnd weniger hoch ein Quartier vor einer Statt ist/ je besser ichs halte: man gibt auch einer Compagnie von 200. Mann offt 4. Reyen zu den hütten/ offt mehr oder weniger eyn/ je nach dem es die gelegenheit mit gibt/ vnd werden die hütten parallel gezogen/ vnd darff kein Soldat ein zwerchhand für den anderen aussen bawen/ sonder eben/ sonst muß er sein hütten widerumb abbrechen: zwüschen zweyen Reyen hütten ist die gassen 8. schuh breit: hinder den Soldaten losieren die Capitain/ denen man 40. schuh in die länge/ vnd 40. schuh in die breite gibt: die distantz vnd gassen zwüschen den Soldaten vnd Capitain halten 20 schuh: hinder denselben losieren die Marckitänter/ deren hütten 20. schuh/ vnd die distantz jhrer gassen auch 20. schuh breit: der Lermenplatz soll zwüschen den Soldaten vnd Tranche 200. schuh oder 250. schuh vornen seyn: die Regimenter sollen 40. oder 50. oder 100. schuh weit von einanderen gesönderet seyn: der Collonels Losamenter halten 68. oder auch 80. vnd in die länge 40. schuh: der General hat zum Quartier in 600. biß in 700. schuh: die länge ist nach der länge der Soldaten Quartier vnd Reyen: dem General von der Artillerey gibt man platz je nach dem er Gesind/ Artillerey/ Munition vnd Wägen bey sich hat: für die Proviant gehört ein absonderlicher platz: auff der rechten hand losieren die hohen Officier oder Generalspersonen einanderen nach/ vnd sollen zwüschen den hütten zu einer distantz 50. oder 60. schuh gelassen werden/ damit man vngehindert von einem ort zu dem anderen/ jnsonderheit zur Munition passieren möge. Die Reuter sollen abgesönderet werden von den Soldaten/ damit allerley vngelegenheit vermitten bleibe: Sie werden hinder den Marckitänteren auff 50. oder 60. schuh gelosiert/ jedem gibt man zur hütten 10. schuh/ zu den Pferden 14. vnd 20. zu der gassen: die gassen ist zwüschen den hütten vnd häupteren der Pferden 6. schuh: der Reuteren hütten vnd gesichter sollen gegen jhrem Lermenplatz gehen: der Rittmeisteren Losament seind 40. schuh: den Krämeren so dem Läger nachziehen/ gibt man allen mit einanderen zween Reyen/ oder mehr/ je nach dem jhren vil seind: das spatium der gassen ist 200. schuh: da soll der Marckt nicht weit von des Generals Quartier seyn/ ist 300. schuh.
  cs: |-
    vytyčit, rozdělí jej generální kvartýrmistr {General-Quartiermeister} plukovním kvartýrmistrům a dává na dva vojáky pro jednu chýši 8 stop na šířku a 8 stop na délku; délka kvartýru se pak určí úměrně {nach advenant} a podle povahy místa. Neboť čím je kvartýr před městem širší a čím menší má hloubku[^1], tím lepší jej pokládám. Kompanii {Compagnie} o 200 mužích se také často přidělují 4 řady chýší, někdy více, jindy méně, podle toho, jak to dovoluje místo. Chýše se stavějí souběžně a žádný voják nesmí postavit svou ani o šířku dlaně {zwerchhand} před druhého, nýbrž v rovině, jinak musí svou chýši zase zbořit. Mezi dvěma řadami chýší je ulička 8 stop široká. Za vojáky jsou ubytováni hejtmani {Capitain}, jimž se dává 40 stop na délku a 40 stop na šířku. Odstup a ulička mezi vojáky a hejtmany činí 20 stop. Za nimi jsou ubytováni markytáni, jejichž chýše mají 20 stop a jejich ulička je rovněž 20 stop široká. Poplašné shromaždiště {Lermenplatz} má být vpředu mezi vojáky a zákopem {Tranche} a mít 200 nebo 250 stop. Pluky mají být od sebe odděleny 40, 50 nebo 100 stop. Ubytování {Losamenter} plukovníků {Collonels} má 68 nebo také 80 [stop na šířku] a 40 stop na délku. Generál má pro svůj kvartýr 600 až 700 stop; délka se řídí délkou kvartýrů a řad vojáků. Generálovi dělostřelectva {General von der Artillerey} se dává místo podle toho, kolik má u sebe čeledi, děl, munice a vozů. Pro proviant náleží zvláštní místo. Po pravé ruce jsou ubytováni vysocí důstojníci neboli generální osoby jeden vedle druhého a mezi chýšemi se má nechat odstup 50 nebo 60 stop, aby se dalo bez překážek procházet z jednoho místa na druhé, zvláště k munici. Jezdci mají být odděleni od pěších vojáků, aby se předešlo všelijakým nesnázím. Ubytují se 50 nebo 60 stop za markytány; každému se dává na chýši 10 stop, na koně 14 a na uličku 20. Ulička mezi chýšemi a hlavami koní má 6 stop. Chýše jezdců a jejich průčelí[^2] {gesichter} mají hledět k jejich poplašnému shromaždišti. Ubytování rytmistrů má 40 stop. Kramářům {Krämeren}, kteří táhnou za ležením, se dávají všem dohromady dvě řady nebo více, podle toho, kolik jich je. Prostor uličky je 200 stop. Trh tam nemá být daleko od generálova kvartýru, [totiž] 300 stop.
- typ: nadpis
  uroven: 2
  de: |-
    Wann das Quartier abgestochen ist/ wie man sich alßdann verhaltet.
  cs: Jak si počínat, když je kvartýr vytyčen.
- typ: odstavec
  de: |-
    Alßdann werden 6. oder mehr Musquetierer weit vor der Ordnung her mit den Sergeanten von jederer Compagnie gecommandiert/ die lauffen mit dem Regiments-Quartiermeister vorher/ vnd nemmen jhre Quartier eyn: so bald man nun ein Regiment nach dem anderen in die
  cs: |-
    Tehdy se z každé kompanie vyšle 6 nebo více mušketýrů se seržanty {Sergeanten} daleko před šikem; ti běží napřed s plukovním kvartýrmistrem a zaberou své kvartýry. Jakmile se pak jeden pluk po druhém
poznamky:
- n: 1
  text: 'V originále „weniger hoch“ (méně vysoký) – míněn rozměr kvartýru kolmo k frontě, tj. jeho hloubka směrem od města, jak se kreslí na plánu.'
- n: 2
  text: '„Gesichter“ – zde patrně průčelí s okénky (srov. s. 124 „kleine gesichter“ = malá okénka); méně pravděpodobně tváře jezdců.'
