id: basne-4
list: básně
strana: verso
sken: 18
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: verse
  pokracovani: true
  de:
  - 'Wie jungen Helden zimmt: den Namm der dapffer’n Alten'
  - 'Auff die Begebenheit/ mit Růhme zů erhalten;'
  - 'Dem wärthen Vatterland zů dienen vngespart/'
  - 'Jst eüwers schreibens zweck/ nach eüwer Forder’n art/'
  - 'So weyser Forderen! (wie kund ist aller Welte)'
  - 'So frommer Forderen! die nun ob dem gezelte'
  - 'Der gstirnten Vestung sind: jhr Krantz bleibt vngeraufft/'
  - 'So lang der Limmat-Fluß dem edlen Rhein zůlaufft!'
  - 'Vnd weil Erfahrenheit; alß man zů reden pfleget;'
  - 'Die beste Meisterin/ die gleich zur Practic leget/'
  - 'Was in der Theorey ein kopff wie scharff besinnt/'
  - 'Durch Trachtung nur allein so leichtlich nicht befindt;'
  - 'Jst eüwer Manual vmb so vil mehr bewähret/'
  - 'Weil nicht ein jeder Mann der Practic hie begäret/'
  - 'Vnd/ o daß Gott verleyh/ daß dise Wüssenschafft'
  - 'Nur bloß ein Wüssen bleib’; ohn nachtruck/ ohne krafft'
  - 'Der blůts-verderbten Kunst! Wir wöllen lieber wüssen'
  - 'Was kunstlich Kriegen sey/ dann solchs erfahren müssen!'
  - 'Wann aber je das Spil müßt angeträtten seyn/'
  - 'Vnd nichts zur Sühnung hulff/ was wir gleich wendten eyn;'
  - 'So schaff der starcke Gott/ daß Amaleck verstehe/'
  - 'Daß auch dem Jsraël der Waaffen Kunst angehe;'
  - 'Weil Moses seine Händ auffhebt/ vnd Gott anschreyt'
  - 'Gesetzt auff einen Felß/ biß jhm der Sieg gedeyt!'
  cs:
  - 'jak mladým hrdinům sluší: jméno statečných předků'
  - 'v případě potřeby se slávou uchovat,'
  - 'drahé vlasti sloužit, sebe nešetříce –'
  - 'to je cíl vašeho psaní, po způsobu vašich předků,'
  - 'tak moudrých předků! (jak známo celému světu),'
  - 'tak zbožných předků! kteří teď nad stanem'
  - 'hvězdné pevnosti dlí: jejich věnec zůstane neoškubán,'
  - 'dokud řeka Limmat k ušlechtilému Rýnu poteče!'
  - 'A protože zkušenost, jak se říkává,'
  - 'je nejlepší učitelka, jež hned do praxe uvádí,'
  - 'co hlava, byť sebebystřejší, v teorii vymyslí'
  - 'a pouhým rozjímáním tak snadno nenalezne,'
  - 'je vaše příručka o to víc osvědčená,'
  - 'že ne každý muž tu po praxi touží.[^1]'
  - 'A ó, kéž Bůh dá, aby toto vědění'
  - 'zůstalo pouhým věděním, bez důrazu, bez síly'
  - 'toho krvavého, zhoubného umění! Raději chceme vědět,'
  - 'co je umné válčení, než to muset zakusit!'
  - 'Kdyby však přece ta hra musela začít'
  - 'a nic nepomohlo k smíru, co bychom vynaložili,'
  - 'ať silný Bůh způsobí, aby Amalek poznal,'
  - 'že i Izraele se umění zbraní týká,'
  - 'zatímco Mojžíš ruce zvedá a k Bohu volá,'
  - 'usazen na skále, dokud mu vítězství nevzejde![^2]'
- typ: odstavec
  de: |-
    G. M.
  cs: |-
    G. M.[^3]
poznamky:
- n: 1
  text: 'Smysl: protože zkušenost je nejlepší učitelka a ne každý touží získat ji ve skutečné válce, je kniha zprostředkující praktickou zkušenost o to cennější. Výklad verše je mírně sporný.'
- n: 2
  text: 'Narážka na Ex 17,8–13: v boji Izraelitů proti Amalekovi vítězil Izrael, dokud Mojžíš, sedící na kameni na vrcholu pahorku, držel ruce vzhůru.'
- n: 3
  text: 'Iniciály autora básně; osobu se nepodařilo určit.'
