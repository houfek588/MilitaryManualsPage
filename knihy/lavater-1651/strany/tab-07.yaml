  popis: |-
    Mědirytina k nácviku obratů a zdvojování, vlevo dole označená *Blat I.* („list I.“). Je to první list řady mědirytin k šikům Třetího dílu; v pokynu knihaři se jmenuje „das abgeschnittne bl. von Dopplierung“ (ořezaný list o zdvojování). Malé postavičky mušketýrů a pikenýrů jsou rozděleny do sloupců označených velkými římskými čísly. Tečkované čáry s kroužkem na konci ukazují, kam muž při obratu přejde.
    *I*: mušketýři po třech, řady {Glider} střídavě označené *a* a *b*. Muži z řad *b* přecházejí do mezer vedle mužů z řad *a*, takže se řady zdvojují. Dole totéž v širších řadách po šesti mužích.
    *II*: stejný postup u pikenýrů s píkami na rameni.
    *III*: jeden zástup {Reyen} mužů střídavě označených *a* a *b*: muži *b* vystupují stranou a zástupy se zdvojují. *IV*: obdobný zástup při okraji desky, částečně odříznutý.
    *V*, *VI*, *VII*: drobná schémata celého houfu (píky jako čárky, mušketýři jako kroužky) v šikmé poloze – zřejmě otáčení celého šiku (schwencken).
    Patří k povelům „Befelch vnd Wörter fur die gantze Ordnung/ so im wenden vnd dopplieren gebraucht werden“ na stranách 84–85 a k jejich výkladu na stranách 86–91. Písmena *a/b* odpovídají návrhu na straně 91 nazývat řady střídavě A „Spießgesellen“ (ti stojí) a B „Rottgesellen“ (ti zdvojují). Podle pokynu knihaři z roku 1651 se má vevázat před stranu 91; starší pokyn na straně slovnicek-2 ji jako „sedmou mědirytinu“ řadí mezi strany 90 a 91. Dole uprostřed je slabý, nečitelný podpis rytce.
