bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    weite Feld flanckieren. Man soll auch vier gedoppelte Carthaunen; wo deren nicht mehr; haben/ des Feinds Batterey oder Stuckbrüginen zu grund zu richten. Die Falckonet aber seind gut die Arbeiter vom herzu-schantzen abzutreiben vnd zu verhinderen. Jnsonderheit ist es nohtwendig/ daß man allerhand gattung Geschützes in einer Vestung habe/ damit wo sie der Feind belägeret hette/ man im mangel der kuglen/ wann sie verschossen seind/ desselben kuglen/ so er in die Vestung schiesset/ brauchen könne.
  cs: |-
    boční palbou ostřelovat daleké pole {flanckieren}. Mají se mít také čtyři dvojité kartouny {Carthaunen}, ne-li víc, aby se jimi rozbily nepřítelovy baterie {Batterey} čili dělové plošiny {Stuckbrüginen}. Falkonety {Falckonet} se zase hodí k tomu, aby se jimi odháněli dělníci, kteří se se šancemi přibližují {herzu-schantzen}, a bránilo se jim v tom. Zvlášť je nutné mít v pevnosti děla {Geschütz} všeho druhu, aby se v případě, že by ji nepřítel oblehl, mohlo při nedostatku koulí, až se vystřílejí, užívat jeho koulí, které střílí do pevnosti.
- typ: nadpis
  uroven: 2
  de: |-
    Wie die Provianthäuser angestellt/ vnd wie selbige sollen gebawet werden.
  cs: Jak se mají zařídit a stavět proviantní sklady
- typ: odstavec
  de: |-
    Der Provianthäuseren sollen in einer Besatzung etliche seyn/ vnd an vnderschiedenliche wol verwahrte vnd sichere plätz vnd örter gesetzt werden/ damit der Feind mit schiessen vnd fewr werffen nicht etwan denselben schaden zufüge/ oder solche durch vngewitter oder andere vnfäl zu grund gehen/ vnd die Proviant nicht mit einanderen verdärbe: Darumb solche weit von einanderen abgesönderet/ vnd deren etliche seyn sollen. Es werden dieselbigen gewölbt/ vnd deren thüren mit einem gantzen eysenen bläch außwendig beschlagen/ vnd mit mist (rev.) vnd starcken brätteren außwendig vermachet/ damit nicht dieselbigen eintweders durch verrähterey/ oder des Feinds fewrwerck angesteckt werden.
  cs: |-
    Proviantních skladů {Provianthäuseren} má být v posádce {Besatzung} několik a mají se umístit na různá dobře chráněná a bezpečná místa, aby jim nepřítel střelbou a vrháním ohně nějak neuškodil nebo aby nepřišly nazmar nepohodou či jinými nehodami a proviant se nezkazil všechen najednou. Proto mají být od sebe daleko odděleny a má jich být několik. Jsou klenuté a jejich dveře se zvenčí pobíjejí celým železným plechem a zvenčí se zahrazují hnojem (s prominutím) a silnými prkny, aby je nikdo nezapálil, ať zradou, nebo nepřítelovým ohňostrojem {fewrwerck}.
- typ: nadpis
  uroven: 2
  de: Wie der Proviant halber des allerersten fürsehung beschehen soll.
  cs: Jak se má o proviant postarat nejprve
- typ: odstavec
  de: |-
    So bald einem Gubernatorn ein Vestung anvertrawet wird/ so solle er einen frommen vnd getrewen Commissari des Vivres/ oder Proviantherren erwehlen: diser soll auff alle Kornböden vnd Burgershäuser mit seinen nachgesetzten Proviantmeistern gehen/ sampt einem Commiß- oder Proviantschreibern vnd dem obersten Profosen/ vnd das Korn/ Rocken/ Habern/ Weytzen/ Bonen/ Linsen/ Gersten/ Erbsen/ Mäl/ Habermäl/ Brot/ Käß/ Butter/ dürr Obbs/ eyngemacht Kraut/ dürr Fisch vnd Fleisch/ Vieh/ Hüner/ Gänß/ Endten/ Schmär/ Oel/ Vnschlit/ Hartz/ Kolen/ Schmaltz/ Saltz/ etc. Jn summa/ alles was zu menschlicher Leibs auffenthaltung dienet/ auffzeichnen/ vnd in die Provianthäuser verschaffen vnd tragen/ vnd dasselbige denen/ so es gewesen/ vmb einen zimlichen Groschen bezahlen lassen.
  cs: |-
    Jakmile je guvernérovi {Gubernatorn} svěřena pevnost, má si zvolit řádného a věrného komisaře pro potraviny {Commissari des Vivres} neboli proviantního pána {Proviantherren}. Ten má se svými podřízenými proviantmistry {Proviantmeistern}, s komisním neboli proviantním písařem {Commiß- oder Proviantschreibern} a s nejvyšším profousem {Profosen} obejít všechny sýpky a měšťanské domy a sepsat obilí {Korn},[^1] žito, oves, pšenici, boby, čočku, ječmen, hrách, mouku, ovesnou mouku, chléb, sýr, máslo, sušené ovoce, nakládané zelí, sušené ryby a maso, dobytek, slepice, husy, kachny, sádlo {Schmär}, olej, lůj, pryskyřici, uhlí, přepuštěné máslo {Schmaltz}, sůl atd. – zkrátka všechno, co slouží k obživě lidského těla –, dát to dopravit a přenést do proviantních skladů a těm, jimž to patřilo, za to zaplatit slušný groš.
- typ: nadpis
  uroven: 2
  de: Wie man weiter die Provianthäuser versehen solle.
  cs: Jak se mají proviantní sklady zásobovat dále
- typ: odstavec
  de: |-
    Man soll dieselbigen mit essens Speiß/ von allerhand nohtdurfft/ durch den Proviantherren versehen lassen/ auch auff die vmbligende Landschafft etliche Proviantwägen/ sampt etlichen hauffen zu Roß vnd Fuß vmb Proviant zu holen/ commandieren/ vnd alles in die Provianthäuser der Vestung ordnen/ damit die Vestung auff Jahr vnd Tag genugsam versehen werde. Wo aber sich ein Vestung des Feinds halber besorget/ so werden die biderben Landleuth/ solches gutwillig herzugeben/ biß auff gelegenheit/ da mans jhnen
  cs: |-
    Proviantní pán je má dát zásobit potravinami všeho potřebného druhu a také vyslat do okolní krajiny několik proviantních vozů s několika oddíly jízdních a pěších pro proviant a všechno uložit do proviantních skladů pevnosti, aby byla pevnost dostatečně zásobena na rok a den. Obává-li se však pevnost nepřítele, nebudou se poctiví venkované zdráhat to dobrovolně vydat až do doby, kdy jim to bude
poznamky:
- n: 1
  text: |-
    Ve švýcarské němčině znamená „Korn“ zpravidla špaldu (Dinkel), ne žito; žito je zde zvlášť jako „Rocken“.
