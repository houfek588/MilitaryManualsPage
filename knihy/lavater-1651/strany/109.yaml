bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    seiten allhie in diser Ordnung die Reuterey haltet/ je ein Compagnie oder Cornet neben einanderen/ vnd das Hauptgeschütz zu hinderst. Wann du nun ein Haupt-Battaille oder Schlachtordnung darauß machen wilt/ so lasse die Spieß alle zugleich mit jhren zweyen Stücken in guter ordnung vorher marschieren: 2. vnd 7. aber auff jhrer Stell sampt jhren Stücklinen verbleiben/ vnd rucke mit 1. vnd 8. neben den Squadronen Musquetierer. 2. vnd 7. beyseits hinab hinder dieselben/ vnd bleibe auff solcher Stellhalten. Mit den Reutern/ so neben dem Fußvolck zu beyden seiten halten/ solt du dich also verhalten/ wie die groß zahl V. anzeiget. Laß 1. vnd 2. Jtem 5. vnd 6. zur rechten seiten verbleiben/ vnd marschiere mit 3. vnd 4. neben einanderen vorher/ neben den Spiessen zur rechten hand/ dises wird der recht flügel der Reuterey genannt: mit dem lincken flügel aber/ so mit 7. 8. 9. 10. 11. 12. bezeichnet/ solt du dich/ wie du es mit dem rechten flügel gemachet hast/ durchauß verhalten. Wilt du aber nur mit einer Compagnie deß ersten zur rechten/ vnd mit einer zur lincken zugleich/ oder mit dreyen zur rechten/ vnd dreyen zur lincken widerumb zugleich fechten/ so must du deine beyde flügel Reuter also abtheilen/ wie dich die groß zahl IV. lehret: Namlich mit 1. 2. vnd 3. zur rechten seiten vorher/ vnd darauff mit 4. 5. 6. neben den Spiessen marschieren für die ersten 2. 1. vnd 3. marschieret vorher 2. mit den anderen dreyen aber die fünffte zahl. Also thue auch mit dem lincken flügel Reuterey/ so mit der grossen zahl IV. angedeutet wird/ deren Squadronen mit 7. 8. 9. 10. 11. vnd 12. bezeichnet seind/ vnd bleibt das Hauptgeschütz hinder der Ordnung halten.
  cs: |-
    stranách tohoto šiku stojí jízda, vždy jedna kompanie {Compagnie} čili korouhev {Cornet} vedle druhé, a hlavní dělostřelectvo {Hauptgeschütz} úplně vzadu. Chceš-li z toho nyní utvořit hlavní šik {Haupt-Battaille} čili bitevní sestavu, nech všechny píky {Spieß} naráz s jejich dvěma děly v dobrém pořádku pochodovat dopředu; 2 a 7 však ať zůstanou na svém místě i se svými dělky, a ty postup s 1 a 8 podél švadron {Squadronen} mušketýrů 2 a 7 stranou dolů za ně a na tom místě zůstaň stát. S jezdci, kteří stojí po obou stranách vedle pěchoty, si počínej tak, jak ukazuje velké číslo V. Nech 1 a 2, rovněž 5 a 6, zůstat na pravé straně a se 3 a 4 vedle sebe vytáhni dopředu podél pík po pravé ruce; to se nazývá pravé křídlo jízdy. S levým křídlem, označeným 7, 8, 9, 10, 11, 12, si počínej zcela tak, jak jsi to udělal s pravým křídlem. Chceš-li však bojovat nejprve jen s jednou kompanií napravo a jednou nalevo zároveň, anebo opět se třemi napravo a třemi nalevo zároveň, musíš obě svá křídla jezdců rozdělit tak, jak tě učí velké číslo IV: totiž s 1, 2 a 3 [táhnout] na pravé straně napřed a potom se 4, 5, 6 pochodovat podél pík; před prvními dvěma, 1 a 3, jede napřed 2, u ostatních tří však číslo pět[^1]. Totéž učiň i s levým křídlem jízdy, které je naznačeno velkým číslem IV a jehož švadrony jsou označeny 7, 8, 9, 10, 11 a 12; hlavní dělostřelectvo pak zůstává stát za šikem.
- typ: nadpis
  uroven: 3
  de: Wie man mit diser Schlachtordnung zu Ross vnd Fůß fechten solle.
  cs: Jak se má s tímto bitevním šikem bojovat na koni i pěšky
- typ: odstavec
  de: |-
    Wann dich der Feind mit Reuterey angreiffen wolte/ so solt du dich deß ersten/ je nach dem er starck ist/ mit etlichen/ oder nur mit zweyen/ wie 8. vnd 2. in der grossen zahl IV. außweiset/ vnd je nach dem er starck auff dich setzet/ jhme mit Reuterey begegnen vnd auff jhne treffen. Kommt er aber zimlich starck/ so kanst du dich mit 6. oder aber wie V. die groß zahl lehret mit 8. Squadronen/ oder Compagnien Reuter herfür thun: vnd da er noch stärcker/ vnd deine ersten Trouppen zu ruck getriben wurden/ mit der anderen helffte Reuter zu beyden seiten vnd grossem geschrey vnd tumult entsetzen vnd anfallen. Wann der Feind aber mit frischen hauffen Reutern ansetzen wurde/ vnd dir an Reuterey vberlegen were/ also daß du dich hindersich thun müßtest/ so solt du mit deinen Spiessen auffwütschen/ vnd mit den zwey Regimentsstücklinen/ so mit hagel geladen seyn sollen/ sampt den Spiessen treffen: der stügel vnd Squadron 7. vnd 2. sampt jhren zugebenen Stücklinen sollen herfür rucken/ vnd dapffer fewr vnder die Feind geben: were der Feind aber noch stärcker/ so werden dieselben mit den außgeruheten flüglen 1. vnd 8. auffs new/ vnd mit einem geschrey entsetzt/ vnd durch jhre
  cs: |-
    Kdyby tě nepřítel chtěl napadnout jízdou, máš mu nejprve s jízdou vyjet vstříc a udeřit na něj podle toho, jak je silný, s několika [švadronami] nebo jen se dvěma, jak ukazují 8 a 2 u velkého čísla IV, a podle toho, jak silně na tebe dotírá. Přijde-li však dosti silný, můžeš vyrazit se 6, anebo, jak učí velké číslo V, s 8 švadronami čili kompaniemi jezdců; a je-li ještě silnější a tvé první houfy {Trouppen} byly zatlačeny, [máš je] s druhou polovinou jezdců na obou stranách s velkým pokřikem a hlukem vystřídat a [nepřítele] napadnout. Kdyby však nepřítel nasadil čerstvé houfy jezdců a měl nad tebou v jízdě převahu, takže bys musel ustoupit, máš se svými pikami vyrazit vpřed {auffwütschen} a se dvěma plukovními dělky {Regimentsstücklinen}, nabitými kartáči {hagel}, udeřit spolu s pikami; křídlo čili švadrona 7 a 2 s přidělenými dělky mají postoupit vpřed a statečně pálit do nepřátel. Byl-li by nepřítel ještě silnější, vystřídají se tito znovu s pokřikem odpočatými křídly 1 a 8 a [nepřítel] bude zadržen jejich
poznamky:
- n: 1
  text: |-
    Nejasné místo tisku („für die ersten 2. 1. vnd 3. marschieret vorher 2. mit den anderen dreyen aber die fünffte zahl“). Patrně: z první trojice jede švadrona 2 před 1 a 3, z druhé trojice (4, 5, 6) jede napřed 5 – švadrony tak tvoří dva klíny (srov. mědirytinu „blat V“, [[tab-11|tab-11]]).
