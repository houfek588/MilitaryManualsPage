- typ: nadpis
  uroven: 2
  de: Was in dem Exercitio der Wehr vnd Waaffen fürnemlich zu bedencken seye.
  cs: Co je při cvičení se zbraněmi třeba především uvážit
- typ: nadpis
  uroven: 3
  de: Von der Musquetierern handgriff.
  cs: O chvatech mušketýrů
- typ: odstavec
  de: |-
    Es sollen alle Officierer alle morgen im Sommer/ es seye gleich in der Guarnison oder im Feld/ jhr Volck/ jetzt ein Rott/ dann zwo/ drey/ vier/ fünff vnd mehr Rotten zu halben vnd gantzen Compagnien täglich in Armis exercieren/ vnd jhme die handgriff vorweisen/ vnd die Wort selbsten darzu reden/ damit es der new Soldat verstehe: dann durch so vil wort machen/ auch der geschickteste perturbiert vnd verwirret wird/ vnd kan durch freundlich zusprechen/ vnd selbs vorweisung hundert mal mehr ein vnerfahrner vnd vngeübter/ alß aber durch schläg/ böse vnd vil wort oder balgen/ gelehrt vnd vnderrichtet werden. Es gehören auch den Soldaten ringferige Musqueten/ damit sie nicht vberwehret seyen: dann ein vberwehrter Mann halb geschlagen/ vnd nicht wol fort kommen mag. Die abgerichten Soldaten haben im schiessen disen vortheil/ sie nemmen zum ersten den Mund voller Lauffkuglen/ vnd den Hosensack voller Pulfer/ (so mich vmb etwas gefahrlich duncket) werffen die Gablen der Musqueten hinweg/ vnd da sie sich fertig machen wöllen/ nemmen sie ein hand voll Pulfer auß dem Hofensack/ schütten
  cs: |-
    Všichni důstojníci {Officierer} mají v létě každé ráno, ať v posádce {Guarnison}, nebo v poli, denně cvičit své lidi ve zbrani, jednou jednu rotu {Rott}, pak dvě, tři, čtyři, pět i více rot, až po poloviční a celé kompanie {Compagnien}, předvádět jim chvaty a sami k tomu říkat povely, aby tomu nový voják porozuměl; neboť přílišným mnohomluvením se zmate a poplete i ten nejobratnější, kdežto nezkušeného a necvičeného lze vlídným domlouváním a vlastní ukázkou naučit a vycvičit stokrát lépe než bitím, zlými a mnohými slovy nebo láním. Vojákům také náležejí lehké muškety {Musqueten}, aby nebyli přetíženi zbraní; neboť přetížený muž je napůl poražen a nemůže se dobře hýbat. Vycvičení vojáci mají při střelbě tento fortel: nejprve si naberou plná ústa volně běžících koulí {Lauffkuglen}[^2] a plnou kapsu u kalhot prachu (což mi připadá poněkud nebezpečné), odhodí vidlice {Gablen} od mušket, a když se chtějí připravit [ke střelbě], naberou hrst prachu z kapsy, nasypou
poznamky:
- n: 1
  text: V tisku omylem dvakrát číslo 24; správně 25.
- n: 2
  text: Lauffkugel – koule o něco menší ráže než hlaveň, která do ní volně vběhne bez dotlačování nabijákem; umožňovala rychlou, ale méně přesnou a slabší střelbu.
