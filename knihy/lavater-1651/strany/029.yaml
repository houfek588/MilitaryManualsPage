bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    die jugend/ vnerfahrenheit vnd schnelle thorheit jrre/ vnd sein Volck ingrosse noht bringe. Der Alt aber seines schwachen/ blöden vnd vnvermöglichen Alters/ dardurch er in allem gutem fürnemmen gejrret vnd gehinderet werden mag/ vnd ist die fürsichtigkeit in deme der nicht zu jung ist: dann wo die stärcke vnd krafft/ alß jhres Dieners beraubet ist/ da mag nichts geglaubet werden/ dann sie seind beyde sorglich vnd nachtheilig: welcher aber in der stärcke vnd weyßheit bewähret ist/ der mag zu allen dingen nutz werden. Es soll auch ein Gubernator gespräch vnd beredt seyn/ vnd belesen in vilen Bücheren/ darauß dann den Kriegssachen vil nutzens entspringen mag: dann ein beredter Gubernator mag das Kriegsvolck bereden/ alle gefahr ring vnd gar verachten/ mehr alß kein Jnstrument der Trompeten/ Trommel oder Pfeiffen: dann an der wolredenheit vil gelegen: Jetz muß man das Kriegsvolck ermahnen/ dann trösten/ dann straaffen/ dann wahrnen; geschweigen was man mit den Feinden zu tagen vnd zu thädigen haben mag. Es soll auch kein Gubernator von reichthumbs wegen erwehlet/ vnd keiner armuhts halber geschmähet werden/ so er allein geschickt/ gottsförchtig/ getrostlich vnd auch Kriegs erfahren/ vnd sonderlich inn- vnd vor Belägerungen gewesen ist/ damit er auch wissen möge ob ein Platz vest seye: dann ein vnvester Platz mißlich zu verthädigen/ ob schon vil redliche Leuth darinnen: Jtem/ wo er am schwächsten/ ob er mit erfabrnen Baw- vnd Büchsenmeistern/ mit Geschütz/ Kraut/ Loth/ Essig: jtem/ Brot/ Saltz/ Holtz/ Kolen/ Wasser/ Wein/ Korn/ Schmitten/ Mülinen/ oder zum wenigsten Handmülinen/ auch mit Thuch vnd Kleidungen genugsam versehen seye/ ja vberflüssig: dann ein langwirige Belägerung frisset alles hinweg: wann er auch die außfähl vnd scharmützel/ convojieren/ recognoscieren vnd anders gestatten: wo er contraminieren vnd rebatterieren solle: wo/ vnd wie man die Cavallier oder Katzen auffsetzen/ vnd wie solche beschaffen seyn sollen. Vorauß soll ein Gubernator hertzhafft seyn: dann wo solches mangelte/ er nicht allein für sein Person sich selbsten bald zu ergeben geneigt/ sonder machet auch seine Soldaten (so billich auff jhn sehen) verzagt/ welches so es der Feind vermerckt/ die Vestung allbereit halb verlohren ist/ etc.
  cs: |-
    mládí, nezkušenost a ukvapená pošetilost nesvedly z cesty a on nepřivedl svůj lid do veliké nouze. Starého pak [je třeba zamítnout] pro jeho slabé, chabé a nemohoucí stáří, které ho může ve všem dobrém předsevzetí mást a brzdit. Prozíravost se tedy nachází u toho, kdo není příliš mladý; kde však byla [prozíravost] zbavena síly a moci jakožto svého služebníka, tam nelze ničemu věřit – obojí [krajnost] je totiž riskantní a škodlivá. Kdo se však osvědčil v síle i moudrosti, ten může být užitečný ke všemu. Guvernér {Gubernator} má být také vlídný v hovoru, výmluvný a sečtělý v mnoha knihách, z čehož může válečným věcem vzejít mnoho užitku; výmluvný guvernér totiž dokáže vojsko přemluvit, aby každé nebezpečí pokládalo za lehké a docela jím pohrdalo, a to víc než kterýkoli nástroj – trubky, bubny či píšťaly. Na výmluvnosti totiž mnoho záleží: hned je třeba vojsko napomínat, hned těšit, hned trestat, hned varovat; nemluvě o tom, co je snad třeba s nepřítelem projednávat a vyjednávat. Žádný guvernér také nemá být volen pro bohatství ani nikdo pohrdán pro chudobu, je-li jen schopný, bohabojný, srdnatý a zkušený ve válce, a zvláště byl-li při obléháních uvnitř [pevnosti] i před ní, aby také uměl posoudit, zda je místo pevné; neboť nepevné místo se brání těžko, i kdyby v něm bylo mnoho statečných lidí. Dále [má vědět], kde je místo nejslabší a zda je dostatečně, ba hojně zásobeno zkušenými staviteli a puškaři {Büchsenmeistern}, děly {Geschütz}, prachem {Kraut}, olovem {Loth}, octem[^1], dále chlebem, solí, dřívím, uhlím, vodou, vínem, obilím, kovárnami, mlýny nebo aspoň ručními mlýnky a také suknem a oděvy; neboť dlouhé obléhání všechno pohltí. [Má vědět] také, kdy povolit výpady a šarvátky, doprovody {convojieren}, průzkum {recognoscieren} a jiné; kde má vést protiminy a odpovídat palbou na palbu {rebatterieren}; kde a jak se mají stavět kavalíry {Cavallier} neboli „kočky“ a jak mají být zřízeny. Především má být guvernér srdnatý; kdyby mu to chybělo, byl by nejen sám náchylný se brzy vzdát, ale zbavil by odvahy i své vojáky (kteří k němu právem vzhlížejí); a jakmile to nepřítel zpozoruje, je pevnost již napůl ztracena atd.
- typ: odstavec
  de: |-
    So bald nun einem Gubernator ein Vestung anvertrawet ist/ solle er vmb ein Vestung mit seinen vndergebnen Officierern vnd Jngenieurn reiten/ dieselbig berahtschlagen/ vnd jhme selbst fürnemmen/ alß wolte er sie selbsten belägeren vnd angreiffen/ dann auß der Offensen sihet vnd erfindt man die besten Defensen: vnd so er etwas mangels funde/ stracks durch die Jngenieur reparieren vnd machen lassen: die Provianthäuser/ deßgleichen auch die Zeug- vnd Munitionhäuser visitieren/ vnd gute fürsehung thun. Darnach gebürt jhme alle ämpter einer Vestung zu bestellen/ Kriegs-Räht zu setzen/ vnd die Wachten ordenlich vnd gleich auß- vnd abzutheilen/ die Ronde
  cs: |-
    Jakmile je guvernérovi svěřena pevnost {Vestung}, má ji se svými podřízenými důstojníky a inženýry objet, poradit se o ní a sám si představit, jako by ji chtěl obléhat a dobývat; neboť z útoku se nejlépe vidí a vymýšlí nejlepší obrana. A najde-li nějaký nedostatek, má jej ihned dát inženýry opravit a vybudovat; má prohlédnout proviantní sklady i zbrojnice a muniční sklady a učinit dobrá opatření. Potom mu náleží obsadit všechny úřady pevnosti, jmenovat válečné rady {Kriegs-Räht} a stráže řádně a rovnoměrně rozvrhnout a rozdělit; obchůzku {Ronde}
poznamky:
- n: 1
  text: Ocet sloužil k chlazení rozpálených hlavní při střelbě a k hašení.
