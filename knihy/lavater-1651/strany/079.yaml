bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    durch Harnast vnd Pantzer schlagen/ nicht leichtlich zu löschen/ vnd hefftig brennen. Man soll auch vil tausend krüg mit Pulfer gefüllt/ vnd brennenden Lunden behenckt/ damit selbige im zerbrechen sich selbst anstecken/ vnd vnder den Feinden grossen schaden thüyen/ hauffenweis hinab werffen. Man solle Füßängel/ auch allerley Faßreyff/ allzeit sechs oder vier zusammen gebunden/ vnd von einander zerthan: Jtem/ Leiterwägen/ Brätter mit eysenen Näglen beschlagen/ vnd anders dergleichen in den Graben werffen/ damit der Feind nicht fort kommen möge. Die Sturmreyff vnd Bächring sollen auch angesteckt werden/ vnd das heisse Wasser/ darinn äschen vnd Mähl gesotten: Jtem/ gantz Kessel voll Schmär/ Vnschlit vnd Honig durch einanderen zerlassen/ auff die Feind gegossen vnd geworffen werden/ welches sie hefftig verbrennt/ etc. Man solle auch fleissig mit Hagel vnd allerley Fewrwerck vnder den Feinden handlen/ vnd von allen orten dapffer vnd ohne vnderlaß schiessen vnd schlagen: vnd da der Feind durch die Bresche käme/ jhne alßdann erst recht hinder den new gemachten Affter-schantzen empfangen/ die vergrabenen Teuchel/ so von Pulfer außgefüllt/ anstecken/ vnd sampt dem Kalck die Feind in die lüfft sprengen/ alßdann mit Geschütz von den Battereyen widerumb dapffer in sie spielen/ vnd von allen orten mit gantzer macht auff sie anfallen vnd widerumb zu ruck treiben/ vnd darauff bey Nacht/ best vermögens/ das verruinierte Ort reparieren.
  cs: |-
    prorážejí zbroj {Harnast} i pancíř, nedají se snadno uhasit a prudce hoří. Má se také dolů po hromadách házet mnoho tisíc džbánů naplněných prachem a ověšených hořícími doutnáky {Lunden}, aby se při rozbití samy zapálily a natropily mezi nepřáteli velkou škodu. Do příkopu se mají házet nášlapní ježci {Füßängel}, také všelijaké obruče ze sudů, vždy po šesti nebo po čtyřech svázané a od sebe roztažené, dále žebřiňáky, prkna pobitá železnými hřeby a jiné podobné věci, aby se nepřítel nemohl dostat dál. Mají se také zapálit útočné obruče {Sturmreyff} a smolné věnce {Bächring} a na nepřátele se má lít a házet horká voda, v níž se vařil popel a mouka, dále celé kotle sádla, loje a medu spolu rozpuštěných, což je těžce popálí atd. Má se také pilně pracovat mezi nepřáteli kartáči {Hagel} a všelijakými ohňostroji {Fewrwerck} a ze všech míst statečně a bez ustání střílet a bít. A kdyby nepřítel pronikl průlomem {Bresche}, má se teprve pořádně přivítat za nově zřízenými zadními šancemi {Affter-schantzen}: mají se zapálit zakopané trouby naplněné prachem a nepřátelé i s vápnem vyhodit do povětří, pak do nich znovu statečně pálit z děl z baterií, ze všech stran na ně celou silou udeřit a zahnat je zpět, a potom v noci, jak nejlépe lze, zničené místo opravit.
- typ: nadpis
  uroven: 2
  de: Wo ein Vestung so weit eyngethan wird/ daß sie sich ergeben muß/ wie man alßdann parlamentieren soll.
  cs: Když je pevnost tak sevřena, že se musí vzdát, jak se má potom vyjednávat
- typ: odstavec
  de: |-
    Wann es nun so weit kommt/ daß man sich von dem Kriegsherren keines Succurs oder Entsatzes zu vertrösten/ vnd doch biß auff das eusserste gehalten vnd das best gethan hette/ also daß man mit dem Feind zu parlamentieren genöhtiget wurde: so solle man des morgens/ oder da sie zeit zu seyn vermeynten/ durch einen Trommelschläger (welcher deß ersten den Hůt an einem stecken hinder den Schantzkörben herfür zum dritten mal/ damit er nicht erschossen werde/ auffzeiget/ vnd darzu die Trommel drey mal auff einanderen schlaget) ein Brieff dem General zuschicken/ welchesse innhalt vngefahr also lautet. Wiewol sie täglicher hilff vnd entsatzung gewärtig/ aber wie dem allem/ so ferrn sie der Gegentheil wölle halten/ wie Kriegers/ vnd sie sampt den Burgeren/ vnd menglichen/ niemanden außgenommen/ mit Haab vnd Gut/ Harnast vnd Gewehr/ fliegendem Fahnen/ brennendem Lunden/ Kuglen in dem mund/ vnd offenem Trommelschlag/ auch alles das/ so zu jhnen geflöhnet vnd vertrawt worden/ ab vnd zu jhrem Herren zu ziehen: vuch jhnen alles Geschütz/ Munition/ vnd was darzu dienstlich/ vngehinderet mit lassen/ frey sicher vnd vngeschädiget passieren/ so weren sie in willen kommen die Vestung zu vbergeben: so ferr aber deme nicht wurde oder könte statt gethan werden/ so weren sie täglich Succurs von jhrem
  cs: |-
    Dojde-li to tak daleko, že se od válečného pána {Kriegsherren} nelze nadít žádné pomoci {Succurs} ani vyproštění {Entsatzes}, a přece se [posádka] držela do krajnosti a učinila, co mohla, takže je nucena vyjednávat {parlamentieren} s nepřítelem, má se ráno, anebo kdy to [obránci] uznají za vhodné, poslat generálovi dopis po bubeníkovi (ten nejprve zpoza šancovních košů třikrát vystrčí klobouk na holi, aby ho nezastřelili, a k tomu třikrát za sebou udeří na buben); jeho obsah zní přibližně takto. Ačkoli denně očekávají pomoc a vyproštění, přesto – bude-li s nimi protivná strana jednat jako s válečníky a nechá-li je i s měšťany a se všemi, nikoho nevyjímaje, odtáhnout k jejich pánu s majetkem a statkem, se zbrojí a zbraněmi, s vlajícími korouhvemi {Fahnen}, s hořícími doutnáky, s koulemi v ústech[^1] a za víření bubnů, i se vším, co k nim bylo uchráněno a jim svěřeno, a ponechá-li jim také všechna děla, munici a co k nim patří, a nechá je volně, bezpečně a bez úhony projít, jsou ochotni pevnost odevzdat. Kdyby se však tomu nevyhovělo nebo vyhovět nemohlo, očekávají denně pomoc od svého
poznamky:
- n: 1
  text: Mušketýři nosili při pochodu bojové pohotovosti olověné koule v ústech, aby mohli rychle nabíjet; „s koulí v ústech“, s hořícím doutnákem a vlajícími korouhvemi znamenalo čestný odchod ozbrojené posádky.
