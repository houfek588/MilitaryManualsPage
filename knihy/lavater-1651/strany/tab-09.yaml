  popis: |-
    Mědirytina k bitevním šikům jedné kompanie, vlevo dole označená *blat III* („list III“, v textu „das dritte Kupfferblat“).
    *I* (nahoře, velký výjev): čtvrtý bitevní šik (str. 103–104). Uprostřed čtyři švadrony pikenýrů (9–12) s praporečníkem a korouhví, kolem nich osm polovičních švadron mušketýrů po třech řadách (1–8), rozestavených před pikami, za nimi i po stranách, takže se kompanie může bránit na všechny strany. Mušketýři střílejí z vidlic, čárkované rámečky naznačují místo, odkud oddíl vystoupil. Nahoře velitel na koni.
    *II* (dole uprostřed): pátý bitevní šik – kříž ze švadrony mušketýrů rozdělené na čtyři skupiny (1–4) kolem jezdce uprostřed, proti kroužící jízdě (str. 104).
    *III* (vpravo dole, drobné schéma): tentýž šik jako *I* stažený do kříže proti jízdě – švadrony pikenýrů (9–12) vypadnou mezi mušketýry a uprostřed stojí korouhev; text: „vnd also ein Creutz/ wie die groß zahl III. andeutet/ machen“ (str. 104).
