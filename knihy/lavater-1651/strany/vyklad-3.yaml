id: vyklad-3
list: výklad cizích slov
strana: recto
sken: 11
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Käl/ schlund/ gorge (oder gorsche.) Sie wird auch Käl-linien/ linea faucium (oder fauzium) genannt. Kälpunct/ a ngle polygone: angulus circumferentiæ, angulus polygoni: liß das 5. bl. das 1. Kupffer. fig. A. mit 11. vnd o, r, bezeichnet.
  cs: |-
    {Käl}, schlund [jícen], gorge (vyslov gorsche) – hrdlo bašty. Nazývá se též linie hrdla {Käl-linien}, linea faucium (vyslov fauzium). Bod hrdla {Kälpunct}: a ngle polygone; angulus circumferentiæ, angulus polygoni.[^1] Čti s. [[005|5]]; na [[tab-01|1. mědirytině]], fig. A, je označeno 11 a o, r.
- typ: odstavec
  de: |-
    Das eck Centri/ Angulus ad Centrum: anglc, ou Centre: liß das 5. bl. besihe das 1. Kupffer. fig. A. mit m, bezeichnet.
  cs: |-
    Das {eck Centri}, Angulus ad Centrum; anglc, ou Centre – úhel středu.[^2] Čti s. [[005|5]] a viz [[tab-01|1. mědirytinu]], fig. A, kde je označen m.
- typ: odstavec
  de: |-
    Der klein halbe Diameter der Vestung/ Semi-Diameter polygoni oder arcis interioris: le petit demi-diametre: besihe das 1. Kupffer. fig. A. mit m, r, vnd o, bezeichnet.
  cs: |-
    Der klein halbe Diameter der Vestung, Semi-Diameter polygoni neboli arcis interioris; le petit demi-diametre – malý poloměr pevnosti.[^3] Viz [[tab-01|1. mědirytinu]], fig. A, kde je označen m, r a o.
- typ: odstavec
  de: |-
    Der groß halb Diameter/ Semi-diameter polygoni exterioris distantia centri ab extremitate propugnaculi affixi: demi-diametre le grand: besihe das 1. Kupffer. fig. A. mit m, vnd 9. bezeichnet.
  cs: |-
    Der groß halb Diameter, Semi-diameter polygoni exterioris, distantia centri ab extremitate propugnaculi affixi [vzdálenost středu od špice bašty]; demi-diametre le grand – velký poloměr. Viz [[tab-01|1. mědirytinu]], fig. A, kde je označen m a 9.
- typ: odstavec
  de: |-
    Berm/ zehen/ oder füß am Wal/ lisiere: margovalli: liß das 5. bl. besihe das 1. Kupffer. fig. C. mit r, bezeichnet.
  cs: |-
    {Berm}, zehen neboli füß am Wal [prsty neboli pata valu], lisiere; margovalli – berma. Čti s. [[005|5]] a viz [[tab-01|1. mědirytinu]], fig. C, kde je označena r.
- typ: odstavec
  de: |-
    Faussebraye (oder fossebraye) Succinctus: vnderwal/ vnderstand/ vnderlauff: chemin (oder schemin) des rondes: runde weg/ die Brustwehr/ parapet de la faussebraye: lorica horizontalis: liß das 5. 75. 74. bl. das 1. Kupffer. fig. C. mit l, m, n, vnd p, bezeichnet.
  cs: |-
    {Faussebraye} (vyslov fossebraye), Succinctus; vnderwal, vnderstand, vnderlauff [dolní val, dolní stanoviště, dolní ochoz]; chemin (vyslov schemin) des rondes, runde weg [obchůzková cesta] – dolní val; jeho předprseň {Brustwehr}: parapet de la faussebraye, lorica horizontalis.[^4] Čti s. [[005|5]], [[075|75]], [[074|74]]; na [[tab-01|1. mědirytině]], fig. C, je označen l, m, n a p.
- typ: odstavec
  de: |-
    Graben/ fosse: fossa: liß das 6. vnd 7. bl. das 1. Kupffer. fig. A. mit 3. bezeichnet.
  cs: |-
    {Graben}, fosse; fossa – příkop. Čti s. [[006|6]] a [[007|7]]; na [[tab-01|1. mědirytině]], fig. A, je označen 3.
- typ: odstavec
  de: 'Die tieffe des Grabens/ profunditas fossæ: profundeur du foßè.'
  cs: |-
    Die tieffe des Grabens, profunditas fossæ; profundeur du foßè – hloubka příkopu.
- typ: odstavec
  de: |-
    Der jnner abhang des Grabens/ heißt acclivitas fossæ interior: die scarpa, boss- oder docierung/ schröge/ vnd jnnerliche gähe des Grabens/ wie die fig. C. mit 7. audeutet.
  cs: |-
    Vnitřní svah příkopu se nazývá acclivitas fossæ interior; dále {scarpa}, boss- neboli docierung, schröge a vnitřní gähe příkopu – eskarpa,[^5] jak ukazuje fig. C číslem 7.
- typ: odstavec
  de: |-
    Die ausserliche abdachung des Grabens/ heißt contrescarpa: acclivitas exterior: liß das 7. bl. das 1. Kupffer. fig. C. mit v, bezeichnet.
  cs: |-
    Vnější svah příkopu se nazývá {contrescarpa}, acclivitas exterior – kontreskarpa. Čti s. [[007|7]]; na [[tab-01|1. mědirytině]], fig. C, je označena v.
- typ: odstavec
  de: |-
    Bedeckter weg/ via cooperta, strada coperta, vallado, spianade, corridor, ou chemin couvert, auch abusivè contrescarp, liß das 7. bl. das 1. Kupffer. fig. C. mit vv, der banck aber mit x, bezeichnet.
  cs: |-
    {Bedeckter weg}, via cooperta, strada coperta, vallado, spianade, corridor, ou chemin couvert, nesprávně (abusivè) též contrescarp – krytá cesta.[^6] Čti s. [[007|7]]; na [[tab-01|1. mědirytině]], fig. C, je označena vv, její střelecký stupeň {banck} pak x.
- typ: odstavec
  de: |-
    Brustwehr des bedeckten wegs/ Altitudo loricæ viæ coopertæ, Hauteur, oder parapet du rampart du chemin couvert.
  cs: |-
    Brustwehr des bedeckten wegs, Altitudo loricæ viæ coopertæ, Hauteur neboli parapet du rampart du chemin couvert – předprseň kryté cesty.
- typ: odstavec
  de: |-
    Batterey/ Batteries: collis, aut agger tormentarius, suggestus, es seind höhenen von Erden auffgeschüttet/ auff welche man Stück stellet/ den Feind darmit zu beschädigen/ liß das 9. 76. 127. bl. besihe das 2. Kupffer. fig. B.
  cs: |-
    {Batterey}, Batteries; collis aut agger tormentarius, suggestus – baterie: jsou to vyvýšeniny nasypané ze země, na které se stavějí děla {Stück}, aby se jimi škodilo nepříteli. Čti s. [[009|9]], [[076|76]], [[127|127]] a viz [[tab-02|2. mědirytinu]], fig. B [na rytině baterie fig. F a H].[^7]
- typ: odstavec
  de: Cavalieurs, Katzen/ Reuter/ colles aut aggeres propugnaculorum.
  cs: |-
    {Cavalieurs}, Katzen, Reuter [kočky, jezdci], colles aut aggeres propugnaculorum – kavalíry.
- typ: odstavec
  de: |-
    Ravellein/ Castellum defixum, moles: Ravelin: liß das 12. bl. das 1. Kupffer. fig. A. mit i, bezeichnet.
  cs: |-
    {Ravellein}, Castellum defixum, moles; Ravelin – ravelin.[^8] Čti s. [[012|12]]; na [[tab-01|1. mědirytině]], fig. A, je označen i.
- typ: odstavec
  de: 'Hornwerck/ opera Cornuta: ouurages â Corne: liß das 13. bl. besihe'
  cs: |-
    {Hornwerck}, opera Cornuta; ouurages â Corne – hornwerk. Čti s. [[013|13]] a viz
poznamky:
- n: 1
  text: |-
    „Schlund“ = jícen, hrdlo. Podle s. [[005|5]] jsou linie hrdla prodloužené kurtiny až k jejich průsečíku, bodu hrdla. „a ngle“ = tisková chyba za angle.
- n: 2
  text: |-
    Úhel, který ve středu pevnosti svírají dva poloměry vedené k sousedním vrcholům mnohoúhelníku (s. [[005|5]]). „anglc, ou Centre“ je zkomolené franc. angle du centre.
- n: 3
  text: |-
    Malý poloměr vede ze středu pevnosti k bodu hrdla (vrcholu vnitřního mnohoúhelníku), velký poloměr ke špici bašty (vrcholu vnějšího mnohoúhelníku).
- n: 4
  text: |-
    Lavater na s. [[005|5]]–[[006|6]] rozlišuje: rozšířená berma s nízkou zdí na vnější hraně je obchůzková cesta (Ronde-weg, chemin de ronde); nese-li místo zdi zemní předprseň, jde o dolní val (Faussebraye). Ve výkladu uvádí obojí jako synonyma. „Lorica horizontalis“ – předprseň, z níž se střílí vodorovně do příkopu.
- n: 5
  text: |-
    „Gähe“ = strmost, strmý svah; „boss- oder docierung“ = bossierung, docierung (viz svah). „audeutet“ v tisku = andeutet.
- n: 6
  text: |-
    Spianade (esplanade) se jinde užívá pro glacis před krytou cestou (viz glosář, glacis); užití slova contrescarpe pro krytou cestu Lavater označuje za nesprávné (abusivè).
- n: 7
  text: |-
    Písmena, která výklad cituje u „2. mědirytiny“ ([[tab-02|tab-02]]), neodpovídají rytině v tomto výtisku – shoduje se jen fig. K (aproše). Na rytině je: fig. B kůlový plot, C palisády, D útočná kozlice, E šancovní koše s dělem a střeleckými košíky, F předprseň baterie z šancovních košů, G jednotlivý šancovní koš, H baterie na násypu, I fronta opevnění, K aproše, L nášlapní ježci. Výklad zřejmě vznikl podle jiné (starší?) podoby desky. Skutečné písmeno uvádí překladatel v hranatých závorkách.
- n: 8
  text: |-
    Lavater zde ravelin (Ravellein, s. [[012|12]]) odlišuje od půlměsíce (Halber Mon), který podle něho stojí před baštami (viz další stranu); jinde je klade naroveň (viz glosář). „Moles“ = lat. hráz, násep.
