  de: |-
    vnd anderen schuß zerbrechen: Jnsonderheit sollen sie mit eisernenblächen wol beschlagen/ vnd darbey Wüscher/ Ansetzkolben/ vnd vbrige darzu dienende Sachen vberflüssig seyn. Jtem/ etliche Feldschlangen mit kettenen vnd kuglen: drey/ vier/ oder mehr Fewrmörsel oder Böler zum fewrwerck/ Fewrkuglen darauß zu werffen. Jtem/ halbe/ gantze vnd doppelte Haacken/ sampt jhrer bereitschafft: auch Musqueten/ etlich 1000. Mann damit zu bewehren/ mit allerley zugehör/ sampt den Vnderwehren. Jtem/ vil 1000. Fäßlein voll kuglen/ die alle ein loth an der grösse vnd schwäre führen: auch etlich 1000. kuglen zu den grossen Stücken/ vnd model darzu. Jtem/ Picken oder Spieß/ Harnast/ Helleparten/ Morgenstern/ Brügel mit eysernen näglen beschlagen/ Sturmkolben/ Schlachtschwerdter/ Fausthämmer: deßgleichen für die Reuterey Cürras/ Hinder- vnd Vorstuck schutzfreyer Harnast/ Pistolen/ Carabinen/ Bandalier-rohr/ Fewr-röhrer vnd Schloß/ Lunden-schloß. Jtem/ vil 100. centner Lunden/ Pulfer/ Carthausch/ in Zwilchensäcklein/ die an dem boden einen höltzen spiegel haben/ eyngemachet: deßgleichen Pulfer für die Artillerey vnd Musquetierer. Dises soll in kleine Fäßlein/ deren ein Mann eins tragen mag/ darauß dann kommlich zuladen ist/ eyngemachet werden. Jtem/ höltzene Eymer mit eysenen reyffen beschlagen/ vnd oben mit lädernen säcken/ die man wie ein seckel zuschnüren mag/ vorhanden seyn; vnd darneben vil läderne säck/ die sich gleichfals oben zuschnüren/ vnd vnden einen runden breiten boden haben/ in welchen man die Munition kommlich tragen mag. Es sollen auch im vorraht seyn eyserne/ bleyene/ steinene vnd jrrdine Stuck-kuglen in grosser menge/ vnd vil 100. centner Bley/ Ertz/ Eysen/ sauber Salpeter/ Schwebel/ etc. Jtem/ die besten kolen zum Pulfer vnd Fewrwerck/ Handmülinen/ zum Pulfer zu machen: deßgleichen Kummet/ Zäum/ Roßgeschirr/ Sattel/ etlich 1000. Hufeysen/ Lämeysen/ vil 1000. halbe Spieß zu den Sturmhäsplen/ läderne Fewreymer/ Fewrsprützen/ Fewrhaacken/ Fewrleiteren. Jtem/ allerley groß vnd klein Fewrwerck: alß da seind groß vnd klein Granaten/ Fewrkuglen/ Bächring/ Fewrpfeil: etlich 1000. schläg zum Fewrwerck dienstlich. Jtem/ zu 5. biß in 8. ellen lang Sturmkolben mit 6. spitzen. Jtem/ Hartz/ Schwebel/ Terpentin/ Brandtenwein/ allerley Oel/ Abwerck/ Lumpen/ alte Seyler/ Schmär/ Schmaltz/ alt Butter/ Vnschlit/ Bäch/ Speck/ Barcket/ Fewrstangen mit eysernen Eymeren/ Hartzpfannen/ Windliechter/ Kertzen/ Facklen/ Sturmkuglen/ Sturmhäfelein/ vil lähre Fässer. Jtem/ groß Kessel vnd Pfannen/ darinn man Bäch/ Vnschlit/ Hartz/ vnd dergleichen/ zerlasset/ etc. Jtem/ allerley Gezellt in das Feld zu führen. Jtem/ vil 100. Kärren/ Wägen/ Kisten/ Kästen/ vnd vil 100. Räder: Speichen/ Deixel/ Bännen/ Stoßbären/ oder Kärrlein/ härine Deckenen/ das Pulfer darmit zu decken/ vnd vor Fewr vnd Wasser zu bewahren. Jtem/ Handmülenen/ küpfferne Backöfen/ Můlten zum backen/ etc. Jtem/ vil 1000. Eysen zu
  cs: |-
    a druhém výstřelu. Zvláště mají být dobře pobity železnými plechy a k nim má být v hojnosti vytěráků {Wüscher}, nabijáků {Ansetzkolben} a ostatních potřebných věcí. Dále několik kulverin {Feldschlangen} s řetězy a koulemi[^1]; tři, čtyři nebo více ohnivých moždířů {Fewrmörsel} neboli moždířů {Böler} k ohňostroji, aby se z nich házely ohnivé koule {Fewrkuglen}. Dále půl-, celé a dvojité hákovnice {Haacken} s jejich příslušenstvím; také muškety {Musqueten} pro výzbroj několika tisíc mužů, se vším příslušenstvím a s postranními zbraněmi {Vnderwehren}. Dále mnoho tisíc soudků plných kulí, z nichž každá má velikost a váhu jednoho lotu {loth}; také několik tisíc koulí do velkých kusů {Stücken} a k nim formy. Dále píky {Picken oder Spieß}, zbroje {Harnast}, halapartny {Helleparten}, kropáče {Morgenstern}, kyje pobité železnými hřeby, útočné palice {Sturmkolben}, obouruční meče {Schlachtschwerdter}, válečná kladiva {Fausthämmer}; rovněž pro jízdu kyrysy {Cürras}, zádové a prsní plechy neprůstřelné zbroje, pistole, karabiny, bandalírové ručnice {Bandalier-rohr}[^2], ohnivé ručnice {Fewr-röhrer} a zámky, doutnákové zámky {Lunden-schloß}. Dále mnoho set centů {centner} doutnáku {Lunden}, prachu {Pulfer} a kartuší {Carthausch} naplněných do pytlíčků z cvilinku, které mají na dně dřevěné zrcátko[^3]; rovněž prach pro dělostřelectvo {Artillerey} a mušketýry {Musquetierer}. Ten se má plnit do malých soudků, z nichž každý unese jeden muž a z nichž se pohodlně nabíjí. Dále mají být po ruce dřevěná vědra pobitá železnými obručemi, nahoře s koženými vaky, které lze zadrhnout jako měšec; a vedle toho mnoho kožených pytlů, které se rovněž nahoře zadrhují a dole mají kulaté široké dno, v nichž se dá munice pohodlně nosit. V zásobě mají být také železné, olověné, kamenné a hliněné dělové koule {Stuck-kuglen} ve velkém množství a mnoho set centů olova, kovu {Ertz}[^4], železa, čistého ledku {Salpeter}, síry atd. Dále nejlepší uhlí na prach a ohňostroj {Fewrwerck}, ruční mlýnky na výrobu prachu; rovněž chomouty, uzdy, koňské postroje, sedla, několik tisíc podkov, ochromovací železa {Lämeysen}[^5], mnoho tisíc polovičních pík do útočných kozlic {Sturmhäsplen}, kožená hasicí vědra, hasicí stříkačky, požární háky a požární žebříky. Dále všeliký velký i malý ohňostroj, totiž velké i malé granáty {Granaten}, ohnivé koule, smolné věnce {Bächring}, zápalné šípy; několik tisíc náloží {schläg} pro ohňostroj. Dále útočné palice dlouhé 5 až 8 loket se 6 hroty. Dále pryskyřice, síra, terpentýn, pálenka, všelijaké oleje, koudel, hadry, stará lana, tuk, sádlo, staré máslo, lůj, smůla, slanina, barchet {Barcket}, ohnivé tyče se železnými nádobami, pánve na pryskyřici, větrné svíce {Windliechter}, svíčky, pochodně, útočné koule {Sturmkuglen}, útočné hrnce {Sturmhäfelein}, mnoho prázdných sudů. Dále velké kotle a pánve, v nichž se rozpouští smůla, lůj, pryskyřice a podobně, atd. Dále všelijaké stany, které se vezou do pole. Dále mnoho set kár, vozů, truhel a beden a mnoho set kol, loukotí, ojí, sklápěcích kár {Bännen}, trakařů {Stoßbären} neboli vozíků, žíněné houně, jimiž se prach přikrývá a chrání před ohněm a vodou. Dále ruční mlýnky, měděné pece na pečení, díže k pečení atd. Dále mnoho tisíc želez na
poznamky:
- n: 1
  text: |-
    Koule spojené řetězem (řetězové střely), určené hlavně k přerážení lan, ráhen a palisád.
- n: 2
  text: |-
    Bandalier-rohr – lehká ručnice nošená na bandalíru (závěsném řemeni přes rameno), zejména u jízdy. Fewr-röhrer – ručnice s kolečkovým (křesadlovým) zámkem, na rozdíl od zámku doutnákového (Lunden-schloß).
- n: 3
  text: |-
    Spiegel (zrcátko) – dřevěná destička na dně prachové kartuše, která drží tvar náboje a odděluje prach od koule.
- n: 4
  text: |-
    Ertz – ve švýcarské a hornoněmecké dělostřelecké mluvě obvykle dělovina (bronz) určená k lití děl, může však znamenat i rudu.
- n: 5
  text: |-
    Lämeysen – „ochromovací železa“, patrně ostnaté železné hvězdice (Fußangeln), kterými se zasypávaly cesty a brody proti jízdě; výklad není jistý.
