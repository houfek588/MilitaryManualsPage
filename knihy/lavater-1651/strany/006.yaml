poznamky:
- n: 1
  text: Samuel Marolois (asi 1572 – před 1627), nizozemský matematik, autor díla Fortification ou architecture militaire (1615, něm. 1627); v tisku „Maralois“.
- n: 2
  text: Tj. vodorovně, rasantně těsně nad terénem před příkopem.
