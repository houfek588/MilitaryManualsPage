bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Mawr ringsweis vmbher geführt wird/ so heißt es Ronde-weg oder Chemin de Ronde. Wo aber ein Brustwehr vornen von Erden darauff gesetzt wird/ Faussebraye, vnd ist derselben Brustwehr der Brustwehr des Wals an der dicke gleich. Es solle aber die Faussebraye rings vmb die Vestung geführt werden. Maralois leget figurâ 87. in den Sternen-Schantzen zwüschen zwo Streychwehren oder Flancken/ Trauers oder Zwerchwäl/ einen vber den anderen/ allwo die Musquetierer füglich einen stand haben/ vnd den Paß zum Graben erwehren mögen: man kan auch dieselbigen also machen/ daß man Stuck darhinder stellen/ vnd des Feinds gallerie oder schirmdach zu grund richten möge. Ein Bollwerck/ so kein Faussebraye hat/ ist vil böser anzulauffen/ weiln die Erden des Wals in den Graben/ so tieff genug gemachet ist/ fallen/ der zugang vil beschwärlicher seyn wurde/ alß da es ein Faussebraye hette. Es wurd auch der Graben mit grösser beschwerung/ schaden vnd verlurst der zeit/ so eins der fürnembsten stücken ist/ außgefüllt werden/ dann die Belägerten sich vmb nichts mehrers bekümmeren sollen/ dann wie sie den Feind auffhalten/ vmb die zeit bringen/ vnd mühd machen mögen: die breite der Faussebraye ist 12. biß in 24. schuh. Auß diserm mag man den horizont parallel beschiessen/ vnd da man dem Feind von dem oberen stand nicht mehr beykommen kan/ jhme darauß begegnen: Er wird auch darauß von dem vndergraben abgehalten/ vnd werden alle Faussebrayen, Courtine, Gesichtlinien vnd Flancken parallel gezogen/ damit sie jhre richtige flanckierungen haben.
  cs: |-
    dokola vystaví zeď, nazývá se to obchůzková cesta {Ronde-weg} neboli chemin de ronde. Postaví-li se na ni však vpředu předprseň {Brustwehr} ze zeminy, [nazývá se to] dolní val {Faussebraye}; jeho předprseň je stejně silná jako předprseň valu. Dolní val se má vést kolem celé pevnosti. Marolois[^1] klade na obrazci 87 do hvězdicových šancí {Sternen-Schantzen} mezi dvě boční obrany {Streychwehren} neboli flanky {Flancken} traverzy {Trauers} neboli příčné valy {Zwerchwäl}, jeden nad druhým, kde mají mušketýři vhodné stanoviště a mohou bránit průchod k příkopu. Lze je také udělat tak, aby se za ně dala postavit děla a zničit nepřátelskou galerii {gallerie} neboli ochrannou střechu {schirmdach}. Na baštu {Bollwerck}, která nemá dolní val, se útočí mnohem hůře, protože zemina valu padá do příkopu, je-li dost hluboký, a přístup by byl mnohem obtížnější, než kdyby měla dolní val. Také by se příkop zasypával s větší námahou, škodou a ztrátou času, což je jedna z nejdůležitějších věcí, neboť obležení se nemají starat o nic víc než o to, jak nepřítele zdržet, připravit ho o čas a unavit. Dolní val je široký 12 až 24 stop. Z něho lze střílet rovnoběžně s obzorem {horizont}[^2] a tam, kde už na nepřítele nelze dosáhnout z horního stanoviště, čelit mu odtud; také se odtud nepřítel brání v podkopávání. Všechny dolní valy se vedou rovnoběžně s kurtinami {Courtine}, čely {Gesichtlinien} a flankami, aby měly správné boční krytí {flanckierungen}.
- typ: nadpis
  uroven: 3
  de: Wo der eyngang in die Faussebraye zu machen seye.
  cs: Kde se má udělat vchod do dolního valu.
- typ: odstavec
  de: |-
    Man soll jhne in die mitte der Courtine machen/ vnd dann/ so vil möglich/ bedecken.
  cs: |-
    Má se udělat uprostřed kurtiny a pak co nejvíce zakrýt.
- typ: nadpis
  uroven: 2
  de: Von dem Graben.
  cs: O příkopu.
- typ: odstavec
  de: |-
    Der Graben ist die tieffe oder höle/ so ausserthalb rings vmb ein Vestung gehet/ vnd selbige eynschliesset. Es seind aber derselben zweyerley gattung/ erstlich die trocknen/ vnd dann die Wassergräben: die breite solcher Gräben ist von 100. biß in 150. schuh gegen der Gesichtlinien des Bollwercks: die tieffe aber vnderschiedenlich. Man machet die trocknen so groß alß man meynt genug Erden zu auffbawung des Wals darauß zu haben/ vnd je tieffer dieselbige je besser sie seind. Die Wassergräben aber machet man vnder die quellen so tieff man mag/ dann je tieffer sie seind/ je besser sie gehalten werden/ damit die Erden dieselbigen nicht leichtlich außfüllen/ einen stand geben/ vnd die Sturmleiteren nicht wol angeworffen werden können.
  cs: |-
    Příkop {Graben} je prohlubeň neboli dutina, která vede zvenčí kolem celé pevnosti a uzavírá ji. Jsou dvojího druhu: jednak suché, jednak vodní příkopy {Wassergräben}. Šířka takových příkopů je 100 až 150 stop naproti čelu bašty, hloubka však různá. Suché příkopy se dělají tak velké, aby se z nich podle odhadu získalo dost zeminy na stavbu valu, a čím jsou hlubší, tím jsou lepší. Vodní příkopy se však kopou pod úroveň pramenů tak hluboko, jak jen lze, neboť čím jsou hlubší, tím lépe se hájí: zemina je tak snadno nezasype a neposkytne [nepříteli] pevnou půdu a útočné žebříky se nedají dobře přistavit.
- typ: nadpis
  uroven: 3
  de: Warumb die trocknen Gräben von etlichen für nutzlich angesehen werden?
  cs: Proč někteří pokládají suché příkopy za užitečné?
- typ: odstavec
  de: |-
