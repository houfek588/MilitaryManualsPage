popis: >-
  Příručka curyšského hejtmana pro důstojníky zemské milice: stavba pevnosti a jejích děl, služba posádky,
  úřady a přísahy velitelů, cvičení s mušketou a píkou, šiky pěchoty a jízdy, tažení, ležení a obléhání.
  Doplněna výkladem cizích (francouzských a italských) vojenských výrazů.
