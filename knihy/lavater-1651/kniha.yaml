# Strany se řadí podle čísla snímku (pole `sken`).

poznamky_k_prekladu: |
  ZDROJ ORIGINÁLU: německý text (pole de) musí odpovídat přepisu DTA – zdroje/dta/NNNN.txt (NNNN = sken).
  Je to pečlivý ruční přepis, ne OCR: nic v něm „neopravuj“, jen ho rozděl na bloky podle tisku.
  Typografické znaky jsou už převedené (ſ→s, uͤ→ü, ꝛ→r, m̃→mm); tiskové zkratky „rc.“ přepiš na „etc.“.
  Marginálie z DTA („[Marg.: …]“) připoj na konec odstavce, k němuž patří.

  Struktura nadpisů: uroven 1 = díl (Erster/Ander/Dritter/Vierter Theil) a samostatné části předsádky
  (věnování, předmluva, výklad cizích slov, slovníček, básně); uroven 2 = kapitola (tučný nadpis na středu);
  uroven 3 = drobné podnadpisy uvnitř kapitoly (např. otázky, jednotlivé pokyny).
  Název knihy česky: „Válečná knížka“ (Kriegs-Büchlein); díly: „První díl Válečné knížky: O pevnosti“ atd.

  Mědirytiny (tabule) jsou samostatné strany tab-01 … tab-12 a frontispis: blok obrazek se souborem
  tab-NN.jpg (u frontispisu frontispis.jpg) a podrobným popisem (co zobrazuje, popisky a písmena v obraze,
  ke kterým stranám textu patří). Text odkazuje na „Kupffer“ (mědirytinu) a „fig.“ – zachovej to.

  Číslované povely a cviky (Exercitium) a výpočty šiků převeď na seznam/tabulku 1:1 s originálem.
