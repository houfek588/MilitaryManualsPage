popis: >-
  Válečný řád připisovaný císařskému zbrojmistrovi Michaelu Ottovi z Echterdingen: posádka hradů a měst a její
  zásobování, dělostřelectvo a jeho úřady, služební list nejvyššího zbrojmistra, tři „regimenty“ vojska, artikulní
  list lancknechtů a žold. Předloha, z níž později čerpal Leonhart Fronsperger.
prekladatel: Přepis z OCR a překlad s pomocí LLM, 2026.
strankovani: folio
strany_poznamka: >-
  Tisk není foliován (jen signatury archů); edice čísluje listy v hranatých závorkách [1]–[42]: titulní list = [1] r
  (sken 1), text začíná listem [2] r (sken 3) a končí na [42] r (sken 83, „Ende der Kriegs Ordnung“). Prázdné strany
  [1] v (sken 2) a [42] v (sken 84) se vynechávají.
