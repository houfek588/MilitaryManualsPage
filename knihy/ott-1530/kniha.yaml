poznamky_k_prekladu: |
  ZDROJ ORIGINÁLU: německý text vychází z OCR BSB (zdroje/ocr_bsb/NNNN.txt), které je u tohoto tisku velmi chybné
  (švabach, švábský pravopis ai/ay, ů, w = u) – každou stranu porovnej se skenem. Zachovej dobový pravopis
  (ainer, Kriegßherr, Zeügmaister, Büchsenmaister, Locotenent), rozepiš zkratky (vñ → vnd, ē → en, ꝛc. → etc.),
  vynech signatury archů (a ij, b iij …) a kustody.

  STRUKTURA NADPISŮ: uroven 1 = hlavní části: titul; „Stat Regiment vnd Ordnung ainer besatzung der Schlösser“
  (posádka hradů a měst, [2] r); „Stat vnd Regiment der Artelarey“ (dělostřelectvo, [12] v); další samostatné řády
  podle tisku (služební list nejvyššího zbrojmistra, tři regimenty, artikulní list, žold). uroven 2 = kapitoly
  (úřady, articles, „Volgt hernach …“), uroven 3 = drobné oddíly.

  TERMINOLOGIE: glosář je převzatý ze Solmse (stejná doba a látka; Fronsperger z Otta přímo čerpal). Závazně:
  Oberst / Oberster = plukovník (u vrchního velitele celého vojska „vrchní velitel“), Kriegßherr = válečný pán,
  Zeügmaister = zbrojmistr, Büchsenmaister = puškař, Artelarey = dělostřelectvo, Fendlin = praporec (u jízdy
  korouhev), Kriegßleut = válečníci, Locotenent = poručík (zástupce), Besatzung = posádka, Lerman = poplach.
