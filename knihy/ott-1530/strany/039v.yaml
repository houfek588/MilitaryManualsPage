bloky:
- typ: odstavec
  de: |-
    Vnd ob sich zwischen gemelltem Hauptman / vnd N. obgemellts seines Diensts vnd bestallung halben / irrung begebe / deren sy sich gůtlich nit vertragen kündten / Vmb solliche irrung / soll N. vnd N. samentlich / oder durch den mertail / endtlich / vnnd on alle wägerung zuentschaiden haben / Vnnd soll gedachter Oberster Hauptman N. Monat bestellt sein / vnd 30 tag für ain Monat gerechnet werden / vnd jm yedes Monats für seinen Hauptmans Sold N. Reinischer Florin / gegeben / Vnnd sein sold / wie des anndern KriegßVolck / am N. tag / schierst angeen / vnnd in N. Monat für den Abzug gerechnet werden.
  cs: |-
    A kdyby mezi řečeným hejtmanem a N. vznikl spor {irrung} kvůli jeho výše zmíněné službě a služebnímu listu {bestallung}, na němž by se nemohli smírně dohodnout, mají o takovém sporu N. a N. společně nebo většinou {mertail} s konečnou platností a bez jakéhokoli zdráhání rozhodnout. Řečený nejvyšší hejtman {Oberster Hauptman} má být najat na N. měsíců, přičemž se 30 dní počítá za měsíc, a každý měsíc mu má být dáno za jeho hejtmanský žold {Hauptmans Sold} N. rýnských zlatých {Reinischer Florin}. A jeho žold má, stejně jako žold ostatního válečného lidu {KriegßVolck}, začít běžet nejbližšího N. dne a N. měsíc se má počítat jako odchodné {Abzug}.
- typ: odstavec
  de: |-
    Zů dem soll man jm geben des Monats N. Reinischer florin / auff sein Kamerwagen / Zwölff Trabanten / soll er auß andern Ainfachen besoldten Knechten nemen / Der yedem soll deßhalben alle Monat / noch ain Sold gegeben werden.
  cs: |-
    K tomu se mu má dávat měsíčně N. rýnských zlatých na jeho komorní vůz {Kamerwagen}.[^1] Dvanáct drabantů {Trabanten} si má vzít z jiných knechtů s jednoduchým žoldem {Ainfachen besoldten Knechten}; každému z nich se má proto dávat každý měsíc ještě jeden žold {Sold} navíc.
- typ: tabulka
  de:
  - - Seinem Schreyber
    - '3'
    - Sold
  - - Seinem Tolmätschen
    - '2'
    - ''
  - - Seinem Spil
    - '4'
