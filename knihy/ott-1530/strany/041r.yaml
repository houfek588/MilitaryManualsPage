bloky:
- typ: nadpis
  uroven: 2
  de: |-
    Von den andern Ainfachen vnd DopelSöldnern / vnder ain Fendlin gehörig.
  cs: |-
    O ostatních prostých žoldnérech a dvojžoldnérech {DopelSöldnern}, kteří patří k praporci {Fendlin}
- typ: odstavec
  de: |-
    Item alle Knecht / söllen N. vnnd 30 tag für ainen Monat gerechnet sein / vnd ainem yeden Ainfachen Söldner / des Monats 4 florin / Reinische werung.
  cs: |-
    Dále mají být všichni knechti [najati] na N. [měsíců] a 30 dní se má počítat za měsíc; každému prostému žoldnéři {Ainfachen Söldner} [se má dávat] měsíčně 4 zlaté {florin} rýnské měny.
- typ: odstavec
  de: |-
    Vnnd welche obgestympte zeyt / ganntz außdienen / oder vom Obersten Hauptman / auß redlichen Vrsachen / ain Baßporten erlangen 20 tag / für jren Abzug gerechnet werden.
  cs: |-
    A těm, kdo výše stanovenou dobu celou vyslouží nebo od nejvyššího hejtmana {Obersten Hauptman} z poctivých příčin obdrží průvodní list {Baßporten}, se má jako odchodné {Abzug} počítat 20 dní.
