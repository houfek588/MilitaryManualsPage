bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    machen wil. Dann Luc. am 3. Capittel stehet also: Da Johannes der Teuffer am Jordan zur Busse teuffet/ da fragten jhn auch die Kriegesleut/ vnd sprachen/ Was sollen wir thun? Vnd er sprach zu jhnen/ thut niemandt gewalt noch vnrecht/ vnd lasset euch benügen an ewrem Solde/ So verwundert sich auch der HErr Christus/ vber dem grossen glauben/ des Kriegeshauptmans/ zu Capernaum/ das er saget zu denen die mit jhm waren/ Warlich/ solchen glauben habe ich in Israhel nicht funden/ Matth. am 8. Capittel.
  cs: |-
    mnoho a obšírně rozepisovat. U Lukáše v 3. kapitole totiž stojí: Když Jan Křtitel křtil u Jordánu na pokání, ptali se ho i válečníci {Kriegesleut} a říkali: „Co máme dělat?“ A on jim řekl: „Nikomu nečiňte násilí ani křivdy a spokojte se se svým žoldem {Solde}.“ Také Pán Kristus se podivil velké víře válečného hejtmana {Kriegeshauptmans} [setníka] v Kafarnaum, takže řekl těm, kdo byli s ním: „Vpravdě, takovou víru jsem v Izraeli nenalezl.“ (Matouš v 8. kapitole.)
- typ: odstavec
  de: |-
    So saget auch der HErr Christus/ welcher König wil sich begeben in einen Streit/ wider einen andern König/ vnd sitzet nicht zuuor/ vnd ratschlaget/ ob er köndte mit Zehentausent begegnen/ dem/ der vber jhn kömpt mit Zwantzig tausend? Wo nicht/ so schicket er Botschafft/ wenn jener noch ferne ist/ vnd bittet vmb friede/ Luc. am 14. Cap.
  cs: |-
    Pán Kristus také praví: „Který král, chystá-li se do boje proti jinému králi, nezasedne nejprve a neuváží, zda se může s deseti tisíci postavit tomu, kdo na něj táhne s dvaceti tisíci? Jestliže ne, pošle poselstvo, dokud je ten ještě daleko, a prosí o mír.“ (Lukáš ve 14. kapitole.)
- typ: odstavec
  de: |-
    SO schreibet auch der heilige Paulus/ zun Römern am 13. Capittel/ das man sol der Oberkeit vnderthan sein/ denn sie tregt das Schwert nicht vmb sonst. Sie ist Gottes Dienerin/ eine Rächerin zur straffe vber den/ der böses thut.
  cs: |-
    Také svatý Pavel píše Římanům ve 13. kapitole, že se má člověk podřizovat vrchnosti, neboť ta nenosí meč nadarmo. Je služebnicí Boží, mstitelkou k potrestání toho, kdo činí zlo.
- typ: odstavec
  de: |-
    Aber in solche Kriege sich begeben/ das ein Christ/ die sich als Christen rühmen/ wider andere/ die sich auch Christen nennen/ vmb Geldes vnd grossen Gutes willen allda zu erlangen/ gebrauchen lassen/ ob dieselbigen in einem seligen Kriegesstande sein/ achte ich gewis/ die erfahrung wird sie es wol anders berichten/ vnd sie selbst an der that erfahren werden.
  cs: |-
    Pokud však jde o to pouštět se do takových válek, v nichž se křesťan – ti, kdo se chlubí, že jsou křesťany – dá pro peníze a velký zisk, kterého tam chce dosáhnout, použít proti jiným, kteří se také nazývají křesťany: zda jsou takoví ve spásném válečném stavu, o tom jsem si jist, že je zkušenost poučí jinak a že to sami na vlastní kůži poznají.
