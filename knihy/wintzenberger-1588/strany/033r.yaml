id: 033r
list: '[33] r'
strana: recto
sken: 69
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    22. Item / es sol auch keiner dem andern Wehre oder Harnisch auff den Musterplatz leiehen / bey vorlierung Leibes vnd Lebens.
  cs: |-
    22. Dále nikdo nemá druhému půjčovat zbraň nebo zbroj {Harnisch} na přehlídkové místo {Musterplatz}, pod ztrátou těla i života.
- typ: odstavec
  de: |-
    23. Item / es sol kein Hauptman bestelte Knechte / so vnter einem andern Fenlein liegen / annemen / oder abstellen / ohne wissen vnd willen des Obristen.
  cs: |-
    23. Dále žádný hejtman {Hauptman} nemá bez vědomí a vůle plukovníka {Obristen} přijímat ani propouštět najaté knechty {Knechte}, kteří leží u jiného praporce {Fenlein}.
- typ: odstavec
  de: |-
    24. Item / ob einer auff die Wache bescheiden wehre / vnd erschiene vnd keme nicht / der sol nach erkentnüs des Obristen gestraffet werden / Ob auch einer auff der Wach wehre / vnd daruon gienge / der sol ohn alle gnade gestraffet werden / Es sol auch keiner keinen an seine stat auff die Wache stellen / ohne seines Hauptmans wissen vnd willen.
  cs: |-
    24. Dále byl-li by někdo určen na stráž {Wache} a nedostavil se a nepřišel, má být potrestán podle uvážení plukovníka. Byl-li by někdo na stráži a odešel z ní, má být potrestán bez jakékoli milosti. Také nikdo nemá stavět na stráž místo sebe jiného bez vědomí a vůle svého hejtmana.
- typ: odstavec
  de: |-
    25. Item / es sol auch keiner den Freunden / oder dieweil jhr in der Freunde Land lieget / oder jhr seid auff dem Zuge oder Läger / nichts mit gewalt vnd vnbezalt nemen / vnd wer darüber etwas neme / vnd klag kehme / der sol am Leibe gestraffet werden.
  cs: |-
    25. Dále nikdo nemá přátelům – ať ležíte v zemi přátel, nebo jste na tažení {Zuge} či v ležení {Läger} – nic brát násilím a nezaplaceno. Kdo by přesto něco vzal a přišla by na něho stížnost, má být potrestán na těle.
- typ: odstavec
  de: |-
    26. Item / vnd so dem Feldläger Profiant zugeführet würde / vnd in das Läger / so sol keiner darüber fallen oder angreiffen / es sey denn vorhin geschetzet / es sol auch keiner für das Läger hinaus lauffen / Profiant oder anders zu keuffen / sondern das auff freyen Platz führen vnd bringen lassen / vnd warten bis es geschetzet werde / bey Leibsstraff.
  cs: |-
    26. Dále když se do polního ležení {Feldläger} přiváží proviant {Profiant}, nikdo se na něj nemá vrhat ani na něj sahat, dokud nebude nejprve oceněn {geschetzet}[^1]. Také nikdo nemá vybíhat před ležení, aby kupoval proviant nebo jiné věci, nýbrž je nechat dovézt a přinést na volné prostranství a počkat, až budou oceněny, pod trestem na těle.
- typ: odstavec
  de: |-
    27. Item / weil Key: May: etc. andere Nationen auch hat / so sol ewer keiner mit dem andern
  cs: |-
    27. Dále protože Jeho císařské Veličenstvo atd. má [ve službě] i jiné národy, nemá nikdo z vás s ostatními
poznamky:
- n: 1
  text: |-
    „geschetzet“ – úředně oceněn (taxován) profousem či k tomu ustanovenými, aby se proviant v ležení prodával za stanovenou cenu a nedocházelo k předkupu.
