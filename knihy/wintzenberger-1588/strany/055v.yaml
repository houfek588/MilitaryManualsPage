  popis: Tiskařský znak Gimela Bergena – erb v oválném rámu s rohovými akantovými rozvilinami a nápisem GIMEL BERGEN. Ve štítě dvě hroudy (pahorky) porostlé trávou, nad štítem kolčí helm s bohatými přikrývadly a klenotem v podobě košatého stromu.
