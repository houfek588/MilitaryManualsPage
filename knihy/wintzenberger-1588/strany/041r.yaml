  de: Folget das Malefitz vnd langen Spies Recht / welches jetzo bey Keyser / Königen / Chur vnd Fürsten / Herren vnd Potentaten / vber die Kriegsleute gehalten wird / gantz ordentlich beschrieben / etc.
  cs: Následuje hrdelní právo a právo dlouhých pík {Malefitz vnd langen Spies Recht}, jak se nyní u císaře, králů, kurfiřtů a knížat, pánů a mocnářů {Potentaten} drží nad válečníky {Kriegsleute}, zcela řádně popsané atd.
- typ: obrazek
  soubor: drevorez-85.jpg
  popis: Soudní zasedání. Uprostřed pod baldachýnem se závěsy sedí na stolci vousatý soudce (rychtář) s holí či žezlem v ruce, po obou stranách sedí a rokují přísedící v dlouhých šatech a čepicích. V popředí sedí za stolem s knihami a kalamářem soudní písař. Vpravo dole monogram řezáče (snad „HL“).
