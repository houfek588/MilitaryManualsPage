  pozn: 'Velitel pluku (Regiment) – v dobové češtině též „obrist“. Samostatné Oberst / Oberster / Obersten se v této edici překládá vždy „plukovník“, i tam, kde Solms míní vrchního velitele celého vojska (Oberster vber alle Reutter = plukovník nade vší jízdou). Složeniny jako Oberster Feldhauptman (nejvyšší polní hejtman) nebo Oberster Zeugmeister (nejvyšší zbrojmistr) mají vlastní hesla. Výjimka: v Deváté knize (Burgundský řád Filipa Klévského) se Oberst ve smyslu vrchního velitele celého vojska překládá „vrchní velitel“.'
