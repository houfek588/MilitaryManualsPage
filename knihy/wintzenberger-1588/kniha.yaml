poznamky_k_prekladu: |
  ZDROJ ORIGINÁLU: OCR BSB (zdroje/ocr_bsb/NNNN.txt) – fraktura, porovnej každou stranu se skenem. Zachovej
  pravopis tisku (vnd, Obrister, Kriegßvolck, Artalerey, Fenlein), rozepiš zkratky (vñ → vnd, ꝛc. → etc.), vynech
  signatury archů a kustody, slovo rozdělené přes hranici stran patří celé na stranu, kde končí.

  STRUKTURA: titul [1] r, verše „Eine feine Regel vnd Exempel der Alten“ [1] v, věnování Richardovi von der …,
  obsah knihy, PRVNÍ DÍL (rady plukovníka: válečná rada, úřady, pochodový řád, ležení, bitva, obrana města),
  DRUHÝ DÍL od [26] r (sken 55): služební list a artikulní list Karla V. pro vévodu z Alby, lodní řád (sken 83),
  hrdelní a dlouhých pík právo (sken 85), závěr, tiráž a báseň. uroven 1 = titul, věnování, obsah, První díl,
  Druhý díl; uroven 2 = kapitoly; uroven 3 = drobné oddíly, otázky a odpovědi soudu.

  TERMINOLOGIE: glosář převzatý z edice (Solms/Ott). Závazně: Obrister / Oberster = plukovník (u vrchního velitele
  celého vojska „vrchní velitel“), Kriegsherr = válečný pán, Zeugmeister = zbrojmistr, Büchsenmeister = puškař,
  Artalerey = dělostřelectvo, Fenlein = praporec (u jízdy korouhev), Kriegsleute = válečníci, Regiment jako správa
  = zřízení (jako útvar = pluk), Profos = profous, Schultheis = rychtář, Malefitzrecht = hrdelní právo,
  langer Spieß Recht = právo dlouhých pík, Item = „Dále“.
