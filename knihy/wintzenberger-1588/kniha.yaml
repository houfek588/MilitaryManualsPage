id: wintzenberger-1588
nazev: Popis válečného řádu
nazev_orig: Beschreibung einer Kriegs-Ordnung, zu Roß vnd Fueß, sampt der Artalerey vnd zugehörigen Munition
podtitul: von einem Wolgebornen Edlen Herren vnd wolerfahrnen Obristen, welcher seinen trewen Rath etlichen hohen Potentaten, so ihn darumb ersucht, schrifftlich mitgeteilet …
autor: Daniel Wintzenberger
autor_razeni: 'Wintzenberger, Daniel'   # klíč abecedního řazení v Knihovně (příjmení, jméno)
autor_zivot: 2. polovina 16. stol., kurfiřtský saský dvorní úředník
vydani: Drážďany, Gimel Bergen, 1588
rok: 1588
katalog: VD16 W 3555
rozsah: '[56] listů, 4°'
jazyk_orig: raná nová horní němčina (východostředoněmecká)
popis: >-
  Rady zkušeného plukovníka k vedení války, vydané kurfiřtským saským úředníkem Danielem Wintzenbergerem. První díl
  přebírá anonymní spis Trewer Rath und Bedencken (kolem 1522): válečná rada, úřady, pochodový a bitevní řád jízdy, pěchoty a dělostřelectva, ležení
  a obrana města; ve druhé části služební list Karla V., artikulní list, lodní řád a hrdelní právo dlouhých pík.
prekladatel: Přepis z OCR a překlad s pomocí LLM, 2026.
strankovani: folio
strany_poznamka: >-
  Tisk není foliován (jen signatury archů); edice čísluje listy v hranatých závorkách [1]–[56]: titulní list = [1] r
  (sken 5), text končí tiráží na [55] v (sken 114) a básní na [56] r (sken 115). V digitalizaci BSB jsou na místě
  stran [14] v a [15] r (skeny 32–33) omylem znovu nasnímány strany [30] v a [31] r (skeny 64–65; shodné okrajové
  značky i signatura H iij) – pokračování první části mezi skeny 31 a 34 v digitalizaci chybí.
