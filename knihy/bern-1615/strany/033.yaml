bloky:
- typ: odstavec
  pokracovani: true
  de: auffwerts tragen soll/ wie zuvor im ersten Puncten angezeigt.
  cs: nést ji vzpřímeně, jak bylo ukázáno v prvním bodě.
- typ: nadpis
  uroven: 3
  de: Den Spieß fellt.
  cs: Sklopte píku {Spieß}.
- typ: odstavec
  de: |-
    Zum 9. wie er den Spieß in einem Termin/ oder zeit (weiln derselb empor oder auffwerts steht) fellen/ Nemlich soll er denselben/ wie obstaht/ mit der lincken Handt höher angreiffen/ darnach den rechten Arm also gestracks führen/ daß der Ellenbogen vber sich komme/ vnd der Spieß auff der lincken flachen Hand/ vnd nit allein zwischen dem Daumen vnd Zeiger lige. Der lincke Arm seye nicht schweiffendt: sonders rühre vngezwungner massen den Leib in Gürtelhöhe an/ den Spieß desto besser zu halten/ vnnd ein steifferen stoß zu thun. Das
  cs: |-
    Za 9., jak má píku sklopit v jednom tempu {Termin} neboli době (když stojí vzhůru neboli vzpřímeně): má ji totiž, jak je uvedeno výše, uchopit levou rukou výš a potom vést pravou paži přímo tak, aby se loket dostal nahoru a píka ležela na otevřené levé dlani, a ne jen mezi palcem a ukazováčkem. Levá paže ať neodstává stranou, nýbrž se nenuceně dotýká těla ve výši opasku, aby se píka lépe držela a bod byl pevnější. Levé
