id: '041'
list: '41'
strana: recto
sken: 59
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    schwung mit der lincken Hand obsich halten/ vnd mit der rechten widerumb fassen/ darnach legt er denselben/ wie er zuvor war/ vnd ziehet den lincken Fuß wider zuruck: So ist er widerumb in voriger Postur/ oder Standt.
  cs: |-
    švihu držet levou rukou vzhůru a pravou ji znovu uchopit. Potom ji položí tak, jak ležela předtím, a levou nohu přitáhne zpět. Tím je opět ve svém předchozím postoji {Postur} neboli postavení.
- typ: nadpis
  uroven: 1
  de: Volget die Wendung vber ein Schlachtordnung.
  cs: Následují obraty bitevního šiku {Schlachtordnung}.
- typ: nadpis
  uroven: 2
  de: |-
    Commandement/ oder Befelchswörter der Wendungen/ vber ein Schlachtordnung.
  cs: Povely {Commandement} neboli rozkazová slova pro obraty bitevního šiku.
- typ: seznam
  de:
  - 1. Reyen.
  - 2. Glider.
  - 3. Rechtsvmb.
  - 4. Lincksvmb.
  - 5. Richtet euwere Reyen.
  - 6. Richtet euwere Glider.
  - 7. Rechtsvmb kehrt euch.
  - 8. Lincksvmb kehrt euch.
  - 9. Herstelt euch.
  cs:
  - 1. Zástupy {Reyen}.
  - 2. Řady {Glider}.
  - 3. Vpravo vbok.
  - 4. Vlevo vbok.
  - 5. Vyrovnejte zástupy.
  - 6. Vyrovnejte řady.
  - 7. Vpravo čelem vzad.
  - 8. Vlevo čelem vzad.
  - 9. Do původního postavení.
