id: '034'
list: '34'
strana: verso
sken: 52
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    lincke Knie seye gebogen/ vnd die beide Füß rechter distantz von einander/ dann fahls sie anderst gesetzt/ wurde er in seinem stoß zu schwach sein.
  cs: |-
    koleno ať je pokrčené a obě nohy ve správném odstupu {distantz} od sebe; kdyby stály jinak, byl by jeho bod příliš slabý.
- typ: nadpis
  uroven: 2
  de: Den Spieß bey der Spitzen/ oder Eysen faßt.
  cs: Uchopte píku {Spieß} u hrotu nebo u železa {Eysen}.
- typ: odstavec
  de: |-
    Zum 10. wie er den Spieß zierlich bey der Spitzen/ oder eysen fassen sol/ geschicht dasselbe mit vbergreiffen/ in dryen griffen oder zeiten/ daß er die Hand recht vber der Hufft mit der Spitzen halte/ steiff wider den Leib ansetze/ oder/ daß er die Spitzen/ oder Eysen mit der rechten Hand fasse/ dieselbe etwas herfür gehn lasse/ den Daumen lengs auff das Eysen lege/ vnnd mit dem rechten Fuß vor stehe.
  cs: |-
    Za 10., jak má píku úhledně uchopit u hrotu neboli železa[^1]: děje se to přehmatáváním na tři hmaty neboli doby tak, že drží ruku s hrotem přímo nad bokem a pevně ji opře o tělo; anebo tak, že uchopí hrot neboli železo pravou rukou, nechá jej trochu vyčnívat vpřed, palec položí podél železa a stojí pravou nohou vpředu.
poznamky:
- n: 1
  text: >-
    Železem (Eysen) se míní železná hlavice píky s hrotem. Voják přehmatáváním posune ruce po ratišti až k hlavici
    a drží píku zkrácenou; podle 11. bodu se z této polohy vrací opět hmatáním dozadu ke konci ratiště.
