bloky:
- typ: odstavec
  de: |-
    vornen empor halten/ den lincken schenckel vornen anstellen/ zugleich auch die Fourcket vorwerts herauß stellen/ vnd alsdann anlegen vnnd zilen soll.
  cs: |-
    vpředu ji držet vzhůru, levou nohu vysunout dopředu, zároveň také furketu {Fourcket} postavit vpřed před sebe a teprve potom přiložit a zamířit.
  pokracovani: true
- typ: nadpis
  uroven: 2
  de: Die Musquet anlegt vnd schießt.
  cs: Přiložte mušketu {Musquet} a vystřelte.
- typ: odstavec
  de: |-
    Zum 12. wie er wol anlegen vnd zilen/ auch die Musquet vnd Gabel mit der lincken Hand/ den rechten Arm empor/ vnd den Leib gedrehet/ das lincke Knie gebogen/ vnd das rechte steiff halten sol/ damit es nicht allein desto besser stehen/ sonder auch die Musquet desto gewisser halten/ vnd loß gebrennt werden möge. Darneben muß in achtung genommen werden/ wann er anlegen wil/ daß er die Musqueten zierligkeit halben/ hart ansetze/ aber
  cs: |-
    Za dvanácté, jak má dobře přiložit a zamířit a přitom držet levou rukou mušketu i vidlici {Gabel}, pravou paži zdviženou, tělo natočené, levé koleno pokrčené a pravé napnuté, aby nejen lépe stál, ale také mušketu jistěji držel a mohl z ní vystřelit. Přitom je třeba dbát, aby mušketu, když chce přiložit, pro úhlednost pevně opřel, avšak
