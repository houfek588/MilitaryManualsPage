id: '045'
list: '45'
strana: recto
sken: 63
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    gemeint/ daß man sich stelle/ kehre/ oder wende/ wie man anfangs gestanden ist.
  cs: |-
    myslí, že se každý postaví, obrátí nebo otočí tak, jak stál na začátku.
- typ: nadpis
  uroven: 3
  de: 10. Rechs herstelt euch.
  cs: 10. Vpravo do původního postavení.[^1]
- typ: odstavec
  de: |-
    Bedeut/ sich auff dem rechten Fuß/ der rechten Hand nach schwingen/ oder schwencken/ vnnd sich widerumb an sein vorige stell begeben.
  cs: |-
    Znamená to otočit se švihem neboli zatočit se na pravé noze k pravé ruce a vrátit se na své předchozí místo.
- typ: nadpis
  uroven: 3
  de: 11. Lincks herstelt euch.
  cs: 11. Vlevo do původního postavení.
- typ: odstavec
  de: |-
    Damit wirt gemeint/ das man sich auff dem lincken Fuß gegen der lincken Hand/ schwencken vnnd widerumb auff seinen vorigen Platz kommen soll.
  cs: |-
    Tím se myslí, že se každý má na levé noze zatočit k levé ruce a vrátit se na své předchozí místo.
- typ: nadpis
  uroven: 3
  de: 12. Rechts schliesset euwre Reyen.
  cs: 12. Vpravo semkněte zástupy {Reyen}.
- typ: odstavec
  de: |-
    Die erste Reye auff der rechten seiten soll stillstehn/ die 2. 3. 4. 5. etc. sollen sich an derselben anschliessen/ sölcher massen/ das ein jeder seine
  cs: |-
    První zástup na pravé straně má stát na místě a 2., 3., 4., 5. atd. se k němu mají přimknout tak, aby měl každý
poznamky:
- n: 1
  text: >-
    V tisku „Rechs“, tisková chyba místo „Rechts“ (v seznamu povelů na str. 42 správně).
