strana: recto
sken: 47
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    lincken Hand (mit welchen er den Spieß zu vollm auffwerts bringen wirt) geben: Demnach mit selbiger Hand widerumb sincken lassen/ vnnd also bald mit der Rechten denselben zugleich fassen/ vnd inwendig deß rechten Füß mit gebognem Knie/ niderstellen.
  cs: |-
    levé ruce (kterou píku {Spieß} zcela vzpřímí); potom ji toutéž rukou nechat opět klesnout, hned ji zároveň uchopit pravou rukou a s pokrčeným kolenem ji postavit na zem k vnitřní straně pravé nohy.
- typ: nadpis
  uroven: 2
  de: Auff die Schulteren den Spieß legt.
  cs: Položte píku na rameno.
- typ: odstavec
  de: |-
    Zum 3. Auff was weisse er nun den Spieß widerumb vom Boden auffnemmen/ vnd auff die Schulteren in dreyen Zeiten/ mit vnden an dem Spieß Stracks gesetzten Daumen vnd der Schultern/ nach beygethanen Hand (den Spieß desto steiffer zutragen) legen sol. Nemlich greifft er mit der lincken vnder die rechte
  cs: |-
    Za 3., jak má píku opět zvednout ze země a na tři doby ji položit na rameno, s palcem přiloženým rovně zespodu k píce a s rukou přitaženou těsně k rameni (aby se píka nesla pevněji). Sáhne totiž levou [rukou] pod pravou
