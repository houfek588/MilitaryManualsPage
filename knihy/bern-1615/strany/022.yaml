id: '022'
list: '22'
strana: verso
sken: 40
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: nadpis
  uroven: 3
  de: Die Musquet auff der Fourcket halt.
  cs: Držte mušketu {Musquet} na furketě {Fourcket}.
- typ: odstavec
  de: |-
    Zum 37. wie er auff der Schiltwacht die Musquet in der Gabel ligen/ den rechten Arm von sich/ die Hand antrucken/ vnd den Anschlag an der rechten Hufft halten sol.
  cs: |-
    Za sedmatřicáté, jak má na stráži {Schiltwacht} držet mušketu položenou ve vidlici {Gabel}, pravou paži od těla, ruku přitisknutou [k pažbě] a opěrku pažby {Anschlag} držet u pravého boku.
- typ: nadpis
  uroven: 3
  de: |-
    Die Musquet in der Fourcket mit der lincken Hand allein im gwicht halt.
  cs: Držte mušketu ve furketě pouze levou rukou v rovnováze.
- typ: odstavec
  de: |-
    Zum 38. wie er auff der Schiltwacht stehen/ die Fourcket mit der Musquet darin ligend/ für sich halten sol/ also daß er die Musquet in gewicht/ vnd mit der lincken Hand die allein regiere/ vnd die rechte frey haben möge.
  cs: |-
    Za osmatřicáté, jak má stát na stráži a furketu s mušketou v ní položenou držet před sebou tak, aby měl mušketu v rovnováze, ovládal ji pouze samotnou levou rukou a pravou mohl mít volnou.
