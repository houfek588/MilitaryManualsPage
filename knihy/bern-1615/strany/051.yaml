id: '051'
list: '51'
strana: recto
sken: 69
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    wie nechst hievor auff die rechte Hand/ also hie auff die Lincke eingetretten/ vnnd doppliert werden solle.
  cs: |-
    jako se předtím nastupovalo k pravé ruce, tak se zde má nastupovat a zdvojovat k levé.
- typ: nadpis
  uroven: 3
  de: 30. Herstelt euch.
  cs: 30. Do původního postavení.
- typ: odstavec
  de: Da kompt ein jeder widerumb an sein vorige stell.
  cs: Zde se každý vrátí na své předchozí místo.
- typ: nadpis
  uroven: 3
  de: 31. Rechts doppliert euwre Glider von halben Reyen.
  cs: 31. Vpravo zdvojte řady {Glider} polovinami zástupů {Reyen}.
- typ: odstavec
  de: |-
    Da wirdt gesetzt/ das ein Hauffen von zechen Soldaten hoch/ gibt zechen Glider/ so werden die fünff hindersten Glider in die fünff vordersten auff rechter Hand eingeführt/ also zuverstehn/ daß das sechst Glid in das erste/ das sibend in das ander/ das acht in das dritte/ das neundt in das vierte/ vnnd das zehen in das fünfft vnnd letste angeführt werde.
  cs: |-
    Zde se předpokládá šik {Hauffen} hluboký deset vojáků, tedy o deseti řadách. Pět nejzadnějších řad se pak zavede po pravé ruce do pěti nejpřednějších, a to tak, že šestá řada se zavede do první, sedmá do druhé, osmá do třetí, devátá do čtvrté a desátá do páté a poslední.
