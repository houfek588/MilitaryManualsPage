bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    de excidio Iudaico meldet von den Römern/ daß sie jre gewaltige Monarchien nit durch glück/ sondern durch jre herliche Kriegs disciplin/ vnd Tugenden zu wegen gebracht haben. Vnd es werden auch alle Policey (nechst Gott) durch disen stand geschützt/ vnd verthediget.
  cs: |-
    [spisu] O zkáze židovské[^1] uvádí o Římanech, že své mocné monarchie nezískali štěstím, nýbrž svou skvělou válečnou disciplínou a ctnostmi. A také všechna státní zřízení jsou (hned po Bohu) tímto stavem chráněna a bráněna.
- typ: odstavec
  de: |-
    Wann dann disem also: Liebe Getrewe/ daß die Kriegsdisciplin vnd Kunst zu allen zeiten so vil Nutz in weltlichen Stande gehabt/ vnd mit sich gebracht: Als machen wir vns kein zweiffel/ jr/ vnsern befelch/ will/ vnd begeren/ nit allein auffnemen: sondern auch alles das jenig/ so wir weiters befehlen/ vnd zu erhaltung vnsern Standes/ gut befinden werden: jhr dasselbig willig/ vnd bereit/ verrichten/ fürnemen/ vnd effectuieren werdet. Datum Bern den 12. Augstmonats. 1615.
  cs: |-
    Když tomu tedy tak jest, milí věrní, že válečná disciplína a umění měly ve všech dobách pro světský stav tolik užitku a tolik ho přinášely, nepochybujeme nikterak, že nejen přijmete náš rozkaz, vůli a žádost, ale že také vše, co dále přikážeme a k zachování našeho stavu uznáme za dobré, ochotně a pohotově vykonáte, podniknete a uvedete ve skutek. Dáno v Bernu 12. dne měsíce srpna 1615.
poznamky:
- n: 1
  text: |-
    Flavius Josephus, Válka židovská (Bellum Iudaicum, v dobových latinských vydáních též „De excidio Iudaico“), III, 5 podle dnešního číslování (ve starších vydáních kap. 6). Josephus zde popisuje výcvik římského vojska a uzavírá, že Římané získali svou říši zdatností, a ne darem štěstěny.
