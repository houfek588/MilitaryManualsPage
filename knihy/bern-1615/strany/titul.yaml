bloky:
- typ: nadpis
  uroven: 1
  de: Kurtzer Begriff vnd Anleitung Des Kriegs Exercitij vnd Vbung/
  cs: Stručný přehled a návod k válečnému cvičení {Kriegs Exercitij} a výcviku
- typ: odstavec
  de: |-
    Also kurtzlich zum Nutz vnd Gebrauch der Löblichen Republic zu Bern/ vnd derselben Stetten/ vnd Landtschafft zu samen getragen. Vnd Deß Durchleuchtigen/ Hochgebornen Fürsten vnd Herren/ Herrn MAVRITII, Fürsten zu Oranien/ vnnd Graffen zu Nassaw/ etc. gleichförmig gemacht/ vnd angeordnet.
  cs: |-
    Takto stručně sestavený k užitku a potřebě chvalitebné republiky Bern, jejích měst i venkova {Landtschafft}. A shodně s [řádem] osvíceného, vysoce urozeného knížete a pána, pana Mořice, knížete oranžského a hraběte nasavského atd., upravený a uspořádaný.
- typ: odstavec
  de: Gedruckt zu Bern/ Im Jar. 1615.
  cs: Vytištěno v Bernu roku 1615.
