id: '046'
list: '46'
strana: verso
sken: 64
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: Ellebogen frey habe/ sein Gewehr vnverhindert zu führen.
  cs: lokty volné a mohl bez překážky vládnout zbraní {Gewehr}.
- typ: nadpis
  uroven: 3
  de: 13. Lincks schliesset euwre Reyen.
  cs: 13. Vlevo semkněte zástupy {Reyen}.
- typ: odstavec
  de: |-
    Da steht die erste Reye auff der lincken seiten still/ vnnd werden die vbrigen daran geschlossen/ wie obgemelt.
  cs: |-
    Zde stojí na místě první zástup na levé straně a ostatní se k němu přimknou, jak bylo řečeno výše.
- typ: nadpis
  uroven: 3
  de: 14. Schliesset euwre Glider.
  cs: 14. Semkněte řady {Glider}.
- typ: odstavec
  de: |-
    Da steht das vorderst Glid still/ vnd tretten die andern hinder dasselbig/ Rappiers lenge/ eins nach dem anderen/ als zum Exempel/ wie das ander hinder das erste/ also das dritte hinder das ander/ das vierte hinder das dritte Glid/ vnnd also fortan.
  cs: |-
    Zde stojí na místě přední řada a ostatní nastoupí za ni na délku kordu {Rappiers}, jedna za druhou: například jako druhá za první, tak třetí za druhou, čtvrtá za třetí řadu a tak dále.
- typ: nadpis
  uroven: 3
  de: 15. Rechts offnet euwre Reyen.
  cs: 15. Vpravo rozestupte zástupy.
- typ: odstavec
  de: Das ist/ sie wenden sich auff dem rechten Fuß der rechten Hand nach/
  cs: To znamená, že se na pravé noze obrátí k pravé ruce,
