bloky:
- typ: nadpis
  uroven: 1
  de: Vorred.
  cs: Předmluva
- typ: odstavec
  de: |-
    WIR der Schuldtheiß/ der Klein/ vnd Groß Raht/ genant die Zweyhundert der Statt Bern/ Entbieten allen vnnd jeden Weltlichen/ als vnsern Schuldtheissen/ Landtvögten/ Gubernatorn/ Tschachtlanen/ Vögten/ Statthalteren/ Vndervögten/ Freyweiblen/ Ammanen/ Weiblen/ vnd allen vnsern lieben/ getrewen Vassallen/ Lehnherren/ vnd Vnderthanen in vnseren Stetten/ Landen/ vnd Gebieten/ Inwohneren/ Hindersessen/ vnd vnserer Regiments verwaltung/ vnderthenig angehörigen/ vnseren gnedigen vnd günstigen gruß: Liebe Getrewe: Demnach vns nicht vnbewußt/ das die Kriegskunst/ oder Disciplin vnder den dryen
  cs: |-
    My, rychtář {Schuldtheiß},[^1] Malá a Velká rada, zvaná Dvě stě, města Bernu,[^2] vzkazujeme všem vůbec i každému zvlášť ze světského stavu, totiž našim rychtářům, zemským fojtům {Landtvögten}, guvernérům {Gubernatorn}, kastelánům {Tschachtlanen}, fojtům {Vögten}, místodržícím {Statthalteren}, podfojtům {Vndervögten}, zemským biřicům {Freyweiblen}, ammanům {Ammanen} a biřicům {Weiblen},[^3] i všem našim milým a věrným vazalům, lenním pánům a poddaným v našich městech, zemích a územích, obyvatelům, podsedkům[^4] a všem, kdo jsou poddáni správě naší vlády, své milostivé a příznivé pozdravení. Milí věrní! Jelikož nám není neznámo, že válečné umění neboli disciplína patří mezi tři
poznamky:
- n: 1
  text: |-
    Schuldtheiß (Schultheiß, česky též šultys) byl v Bernu nejvyšším voleným představitelem města a republiky a předsedal Malé i Velké radě; úřad zastávali dva šultysové, kteří se každoročně střídali. Podle glosáře překládáme „rychtář“. Ve výčtu níže jde o rychtáře poddanských měst (např. Thun, Burgdorf), které jmenoval Bern.
- n: 2
  text: |-
    Malá rada (Kleiner Rat) byla užší vládou republiky; Velká rada (Großer Rat), podle původního počtu členů zvaná „Dvě stě“ (die Zweyhundert), byla její nejvyšší mocí. Mandáty vydávaly obě rady společně se šultysem.
- n: 3
  text: |-
    Výčet zachycuje bernskou civilní správu venkova: zemští fojti (Landvogt) spravovali venkovské okrsky (panství), guvernér (Gubernator) okrsek Aigle (Älen) ve Vaudu, kasteláni (Tschachtlan) okrsky ve Frutigenu a Simmentalu; místodržící (Statthalter) a podfojti (Undervogt) byli místními zástupci fojtů, ammani (Ammann) stáli v čele obcí a místních soudů.
    Weibel a Freyweibel překládáme „biřic“ a „zemský biřic“, nikoli „šikovatel“. Slovo Weibel (stsas. weibil, „posel, sluha“) označovalo původně civilního zřízence rady a soudu – posla, který doručoval obsílky a nařízení, vymáhal pokuty a prováděl zatčení; to odpovídá staročeskému biřici (soudnímu sluhovi). Vojenský význam Feldweibel, česky šikovatel – poddůstojník, který staví mužstvo do šiku – je odvozený a v této knize patří jen k vojsku. Zde jde o výčet světských úředníků, jimž rada adresuje svůj mandát: bernský Weibel byl obecní a soudní zřízenec a Freyweibel („svobodný biřic“) řídil soudní jednání v zemských soudech (Landgerichte) v okolí Bernu. Překlad „šikovatel“ by čtenáři mylně naznačil vojenskou hodnost.
- n: 4
  text: |-
    Hindersessen (Hintersassen) – usedlí obyvatelé bez plného měšťanského či obecního práva.
