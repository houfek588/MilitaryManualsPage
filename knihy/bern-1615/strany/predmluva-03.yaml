bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Nemlichen/ daß sie diser Disciplin zu hilff kommen/ mit gleicher massen/ wie die Medici einem Krancken Stomacho, oder Magen/ so sie starck erkennen/ die Medicin zu vertragen/ welche dieselben erhalten mag/ nach verenderung der zeiten/ zu hilff kommen/ vnnd curieren pflegen/ damit nit etwan vß nach: vnd fahrlessigkeit/ vnd daß man nicht by zeiten jhre Indisposition, vnd Kranckheit in acht genommen: dieselben im grundt dahin verderben vnnd gar sterben lassen. Vnd in der warheit/ wo hat man jemals gehört/ das eine Monarchia/ oder sonsten eine Hoche Obrigkeit die Possession, oder Besitzung seiner Lendern erhalten/ dann eben durch hilff/ vnd bystand der notwendigen theilen/ vnd anordnungen (so da in der Kriegsdisciplin
  cs: |-
    totiž že této disciplíně přicházeli na pomoc stejně, jako lékaři podle proměn doby pomáhají a léčí nemocný žaludek, o němž poznají, že je dost silný, aby snesl lék, který jej může zachovat; aby [disciplínu] snad z nedbalosti a lehkomyslnosti, a protože by včas nepostřehli její nevolnost a nemoc, nenechali od základu zchátrat a docela zahynout. A vskutku, kde se kdy slyšelo, že by nějaká monarchie nebo jiná vysoká vrchnost udržela držbu neboli vlastnictví svých zemí jinak než právě s pomocí a přispěním nezbytných součástí a zřízení, jež jsou ve válečné disciplíně
