bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    mehrerm Nutz/ fürsechen könten/ die zierliche Kriegsvbung/ vnd fehrtigen gebrauch desselben/ gleich wie andere Nationen/ einzuführen.
  cs: |-
    s větším užitkem spravovat – zavést úhledné válečné cvičení {Kriegsvbung} a jeho pohotové užívání, tak jako jiné národy.
- typ: odstavec
  de: |-
    Wann wir dann auch den Nutz vnd Frommen/ so auß deß Kriegsdisciplin herrührt/ gar wol erkennet: vnnd erwogen/ als haben wir dise Kriegsvbung gantz notwendig zu sein erachtet/ vnd deßwegen auch nit allein in vnser Haubtstatt/ sondern zu Statt vnd Land einzuführen entschlossen. Vnd das auch vmb diese motiven/ dieweil wir augenscheinlich gesehen vnd gespürt/ daß vnsere Vnderthanen Neigung zu derselben getragen. Ja daß sie auch mehstetheils gleichsam geschickt/ gutwillig vnd geneigt/ so wol zu schutz/ vnd erhaltung jhres Vatterlands/ vnd jhrer eignen Freyheiten/ als das sie
  cs: |-
    Když jsme pak velmi dobře poznali a uvážili užitek a prospěch, který z válečné disciplíny plyne, uznali jsme toto válečné cvičení za zcela nezbytné, a proto jsme se rozhodli zavést je nejen v našem hlavním městě, nýbrž po městech i na venkově. A to i z toho důvodu, že jsme na vlastní oči viděli a poznali, že k němu naši poddaní mají náklonnost; ba že jsou většinou takřka způsobilí, ochotní a nakloněni jak k ochraně a zachování své vlasti a svých vlastních svobod, tak i v tom, že
