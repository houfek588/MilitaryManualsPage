bloky:
- typ: nadpis
  uroven: 2
  de: Den Spieß auffhebt/ vnnd auffwerts tragt.
  cs: Zvedněte píku {Spieß} a neste ji vzpřímeně.
- typ: odstavec
  de: |-
    IM Anfang wirt gewisen/ wie ein Soldat in auffnemmung deß Spiesses in drey Zeitten oder griffen mit der rechten Hand einwenig ohngeferlich bey zwey oder drey Finger auffs mehest hoch von der Erden auffheben/ das man es schwerlich spüren mag/ demnach ein zierlich schüpffen gegen der Lincken geben sol/ damit er den Spieß mit beyden Händen ohne zwang vnd vertrehen seines Leibs ergreiffe. Darnach fasset er den Spieß ohngefehr in der mitte zwischen der rechten Hand/ vnd dem ende desselben/ als dann erhebt er in mit der Lincken/ vnnd ergreifft den Spieß ringfertig
  cs: |-
    Na začátku se ukazuje, jak má voják při zvedání píky na tři doby neboli hmaty nadzvednout píku pravou rukou od země jen nepatrně, nanejvýš asi na dva nebo tři prsty, takže je to sotva znát, a potom ji má úhledně postrčit k levé [ruce], aby ji uchopil oběma rukama bez námahy a bez kroucení těla. Potom uchopí píku zhruba uprostřed mezi pravou rukou a jejím [dolním] koncem, načež ji levou [rukou] pozvedne a hbitě ji uchopí
