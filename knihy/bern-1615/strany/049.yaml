id: '049'
list: '49'
strana: recto
sken: 67
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: durchgehen/ nicht weniger/ als in anderer Action/ steiff behalte.
  cs: procházení držel stejně pevně jako při kterémkoli jiném úkonu.
- typ: nadpis
  uroven: 3
  de: 22. Euwre Reyen lincks vmb kehrt.
  cs: 22. Zástupy {Reyen} vlevo čelem vzad.
- typ: odstavec
  de: |-
    Was hievor auff der rechten geschechen/ wirdt alhie auff der lincken seiten ein gleiches verrichtet.
  cs: |-
    Co se předtím provádělo na pravou stranu, totéž se zde provádí na levou.
- typ: nadpis
  uroven: 3
  de: 23. Euwre Glider rechts vmb kehrt.
  cs: 23. Řady {Glider} vpravo čelem vzad.
- typ: odstavec
  de: |-
    Da muß zuvor die Truppen rechts/ oder lincks gewendt sein. Darnach soll man ebner gestalt/ wie obangedeutet/ durchgehn.
  cs: |-
    Zde musí být oddíl {Truppen} nejprve obrácen vpravo nebo vlevo. Potom se má stejným způsobem, jak bylo naznačeno výše, projít [šikem].
- typ: nadpis
  uroven: 3
  de: 24. Euwre Glider lincks vmbkehrt.
  cs: 24. Řady vlevo čelem vzad.
- typ: odstavec
  de: Hat einen ebenmessigen verstand/ wie nechst hievor erklärt.
  cs: Má to stejný smysl, jak bylo vysvětleno hned výše.
- typ: nadpis
  uroven: 3
  de: 25. Rechts doppliert euwre Reyen.
  cs: 25. Vpravo zdvojte zástupy.
- typ: odstavec
  de: |-
    Da sollen auß zweyen/ eine Reye gemacht werden/ vnnd stehen der 1. 3. 5. 7. so gedopplet werden/ auff der rechten seiten still/ vnd also fortan.
  cs: |-
    Zde se má ze dvou zástupů udělat jeden: 1., 3., 5., 7. [zástup], které se takto zdvojují, stojí na pravé straně na místě, a tak dále.
