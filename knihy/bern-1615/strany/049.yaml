id: '049'
list: '49'
strana: recto
sken: 67
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: durchgehen/ nicht weniger/ als in anderer Action/ steiff behalte.
  cs: procházení držel pevně, neméně než při jakémkoli jiném úkonu.
- typ: nadpis
  uroven: 3
  de: 22. Euwre Reyen lincks vmb kehrt.
  cs: 22. Své zástupy {Reyen} vlevo vbok obraťte.
- typ: odstavec
  de: |-
    Was hievor auff der rechten geschehen/ wirdt alhie auff der lincken seiten ein gleiches verrichtet.
  cs: |-
    Co se předtím událo na pravé straně, totéž se zde provádí na straně levé.
- typ: nadpis
  uroven: 3
  de: 23. Euwre Glider rechts vmb kehrt.
  cs: 23. Své řady {Glider} vpravo vbok obraťte.
- typ: odstavec
  de: |-
    Da muß zuvor die Truppen rechts/ oder lincks gewendt sein. Darnach soll man ebner gestalt/ wie obangedeutet/ durchgehn.
  cs: |-
    K tomu musí být oddíl {Truppen} nejprve otočen vpravo nebo vlevo. Poté se má stejným způsobem, jak bylo naznačeno výše, projít skrz.
- typ: nadpis
  uroven: 3
  de: 24. Euwre Glider lincks vmbkehrt.
  cs: 24. Své řady vlevo vbok obraťte.
- typ: odstavec
  de: Hat einen ebenmessigen verstand/ wie nechst hievor erklärt.
  cs: Má to zcela stejný význam, jak bylo vysvětleno hned výše.
- typ: nadpis
  uroven: 3
  de: 25. Rechts doppliert euwre Reyen.
  cs: 25. Vpravo zdvojte své zástupy.
- typ: odstavec
  de: |-
    Da sollen auß zweyen/ eine Reye gemacht werden/ vnnd stehen der 1. 3. 5. 7. so gedopplet werden/ auff der rechten seiten still/ vnd also fortan.
  cs: |-
    Zde se má ze dvou vytvořit jeden zástup; a 1., 3., 5., 7. [zástup], které se takto zdvojují, stojí na pravé straně klidně, a tak dále.
