bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    es gewüß vnd wahr/ das wann wir so wol die H. Schrifft/ als die Weltliche Historien lesen/ so werden wir befinden/ das die Kriegs disciplin zu allen zeiten wert gehalten/ vnd daß dieselbe den Alten ein Receptaculum virtutis genent worden. Dann wir lesen in H. Schrifft/ das so lang das Jüdische Volck sich in Kriegsdisciplin geübet/ vnd vnderrichten lassen/ so lang sey es mit jhnen wolgestanden/ vnd haben sie auch alle Heyden geförchtet: so bald aber die Kinder Israel/ wie Josephus meldet/ die Waffen nidergelegt/ vnd sich auff müssiggang begeben/ vnd der Wollust gepflegt/ sind sie by jhren Feinden in verachtung gerahten/ vnd von jhnen mit bewehrter Hand vberzogen/ vnd zinßbar gemacht worden. Im Buch der Richtern am 20. cap. lesen wir von jhrer Abrichtung vnd vbung/ daß vnder den Kindern Benjamin in Fridens zeiten 700. Mann/ also abgerichtet sind worden/ daß sie gar fertig
  cs: |-
    je jisté a pravdivé, že čteme-li jak Písmo svaté, tak světské dějiny, shledáme, že válečná disciplína byla ve všech dobách chována ve cti a že ji staří nazývali Receptaculum virtutis [schránkou ctnosti]. Neboť v Písmu svatém čteme, že dokud se židovský lid cvičil a dával se vyučovat ve válečné disciplíně, potud se mu dařilo dobře a báli se ho i všichni pohané; jakmile však synové Izraele, jak uvádí Josephus, odložili zbraně, oddali se zahálce a hověli rozkoši, upadli u svých nepřátel v opovržení, ti na ně vytáhli se zbraní v ruce a podrobili si je daněmi. V knize Soudců ve 20. kapitole čteme o jejich výcviku a cvičení, že mezi syny Benjamínovými bylo v dobách míru 700 mužů tak vycvičeno, že docela pohotově
