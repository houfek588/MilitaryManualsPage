id: '030'
list: '30'
strana: verso
sken: 48
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Hand/ welche (rechte Hand) er alsbald hindersich schleiffen laßt (so sehr als er damit gelangen mag) die mitte deß Spiesses zubekommen/ vnnd in gleicher zeit mit dem rechten Füß hindersich tretten. Demnach thut er in sölchen schlipffen der Hand einem Blick hindersich/ damit er seinen hinder jhm stehenden Mitsoldaten nit verletze/ vnd den Spieß in rechter Gewicht auff die Schulteren bekomme.
  cs: |-
    ruku a tu (pravou ruku) hned nechá sklouznout dozadu (tak daleko, jak jen dosáhne), aby se dostala ke středu píky {Spiesses}, a zároveň ustoupí pravou nohou vzad. Při tomto klouzání ruky se ohlédne[^1], aby neporanil spolubojovníka stojícího za ním a aby dostal píku na rameno ve správné rovnováze.
- typ: nadpis
  uroven: 3
  de: Flach oder eben den Spieß tragt.
  cs: Neste píku naplocho nebo vodorovně.
- typ: odstavec
  de: |-
    Zum 4. wie er den Spieß/ flach/ oder eben muß tragen: Nemlich sol der selbig in rechter gegen gwicht grad/ hinden vornen gleicher höche/ auff der Schultern ligen.
  cs: |-
    Za 4., jak má píku nosit naplocho neboli vodorovně: má totiž ležet na rameni rovně, ve správné protiváze, vzadu i vpředu ve stejné výšce.
poznamky:
- n: 1
  text: >-
    V tisku „thut er … einem Blick hindersich“ (ověřeno ve skenu) – dativ místo akuzativu „einen Blick“, tisková
    chyba nebo nářeční tvar; smysl („ohlédne se“) je jasný.
