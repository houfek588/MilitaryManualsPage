strana: recto
sken: 43
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: nadpis
  uroven: 1
  de: Das Exercitium mit dem Spieß.
  cs: Cvičení s píkou {Spieß}.
- typ: nadpis
  uroven: 2
  de: Die Wörter deß Befelchs/ Vber den Spieß.
  cs: 'Povelová slova: O píce.'
- typ: seznam
  de:
  - 1. Den Spieß auffhebt/ vnd auffwerts tragt.
  - 2. Den Spieß niderstelt.
  - 3. Auff die Schulteren den Spieß legt.
  - 4. Flach/ oder eben den Spieß tragt.
  - 5. Abwerts eweren Spieß tragt.
  - 6. Eweren Spieß durch die Porten felt.
  - 7. Den Spieß niderstelt.
  - 8. Auffwerts den Spieß tragt.
  - 9. Fellet eweren Spieß.
  - 10. Den Spieß bey der Spitzen/ oder Eisen faßt.
  - 11. Herstelt euch.
  - 12. Den Spieß schleifft.
  - 13. Den Spieß fellt/ oder herstelt euch.
  - 14. Den Spieß niderstelt.
  cs:
  - 1. Zvedněte píku a neste ji vzhůru.
  - 2. Postavte píku na zem.
  - 3. Položte píku na rameno.
  - 4. Neste píku naplocho nebo vodorovně.
  - 5. Neste svou píku skloněnou dolů.
  - 6. Skloňte svou píku pro průchod branou {Porten}.
  - 7. Postavte píku na zem.
  - 8. Neste píku vzhůru.
  - 9. Skloňte svou píku.
  - 10. Uchopte píku za špičku nebo za železný hrot.
  - 11. Zaujměte původní postoj.
  - 12. Vlečte píku.
  - 13. Skloňte píku nebo zaujměte původní postoj.
  - 14. Postavte píku na zem.
