bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    diser Anfängen vnd Fundamenten bekomen/ daß alsdann die oben fürgeworffne Argumenten jhren Effect in Krieg/ in Schlachten/ vnd in der Noht allererst jren Effect, vnd Krafft gewinnen/ vnd haben können. Vnd das eben durch diß mittel eine Hoche Oberkeit/ jre Macht mit deß Feindes/ so derselb anfallen wolte/ messen/ erkennen/ vnd darnach anstellen mag/ damit also dieselbe by zeiten mit gutem raht/ allen zu fahl vnd vnglegenheit steuren könne: ja daß dieselbe nach enderung der zufähl/ jhre rahtschlege verenderen möge/ vnd die gelegenheiten/ wann dieselben verhanden/ nit in die Lufft schlage: sondern/ wann es die noht erfordert/ gewahr neme. Aber was ist es vonnöten/ solche vnnötige obiectiones, vnd fürwerffung auff die bahn zu bringen? All dieweil
  cs: |-
    těchto počátků a základů, mohou výše vznesené argumenty ve válce, v bitvách a v nouzi teprve nabýt a mít svůj účinek a sílu. A že právě tímto prostředkem může vysoká vrchnost poměřit svou moc s mocí nepřítele, který by ji chtěl napadnout, poznat ji a podle toho se zařídit, aby tak mohla včas dobrou radou zabránit každé nehodě a nesnázi; ano, aby mohla podle proměny okolností měnit své úradky a příležitosti, když se naskytnou, nepromarnila, nýbrž se jich, kdykoli toho nouze žádá, chopila. Ale proč vůbec vytahovat takové zbytečné námitky a výtky? Vždyť
