  uroven: 3
  de: |-
    In die recht Hand die Lont faßt/ die Lont abblaßt/ die Lont aufftruckt/ die Lont auffmeßt.
  cs: |-
    Uchopte doutnák {Lont} do pravé ruky, ofoukněte doutnák, nasaďte doutnák, odměřte doutnák.
- typ: odstavec
  de: |-
    Zum 39. wie er auff der Schiltwacht stehen/ die Lont wol vnd mit vortheil auß der lincken Hand mit dem Daumen/ vnnd den anderen Fingern nemmen soll. Darnach mit denselben Fingern die Lont biß zum Mundt bringen/ vnder der Hand abblasen/ vnd im mittels die Musquet in die Fourcket mit der lincken Hand allein in gewicht ligend/ halten: Auch wie er die Lont mit dem Daumen vnd den zweyen Fingern auff den Hanen trucken/ aber wie zuvor gemelt/ dieselbe nit einschrauben/ Item wie er die Lont mit gesagten dryen Fingern regieren/ mit
  cs: |-
    Za devětatřicáté, jak má na stráži {Schiltwacht} vzít doutnák dobře a obratně z levé ruky palcem a ostatními prsty. Potom má těmiž prsty přiblížit doutnák až k ústům, ofouknout jej pod rukou a mezitím držet mušketu {Musquet} položenou ve furketě {Fourcket} v rovnováze jen levou rukou. Také jak má doutnák palcem a dvěma prsty nasadit do kohoutu {Hanen}, avšak, jak bylo řečeno výše, nepřišroubovat jej. Dále jak má doutnák zmíněnými třemi prsty usměrňovat, s
