id: citaty
list: citáty
strana: verso
sken: 4
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Polyb. 6.
    DVo sunt, quibus omnis Respub. servatur: In hostes fortitudo, & domi concordia:
    (bellica tamen anteponenda.)
  cs: |-
    Polybios, 6. kniha[^1]
    Dvě jsou věci, jimiž se udržuje každá obec: statečnost proti nepřátelům a svornost doma (přednost však náleží válečné [statečnosti]).
- typ: odstavec
  de: |-
    Cic. pro Mur.
    Virtus militaris, praestat caeteris omnibus, Patria enim, Libertas, cives, atque adeò ipsi Reges latent in tutela, ac praesidio bellicae virtutis.
  cs: |-
    Cicero, Řeč na obranu Mureny[^2]
    Vojenská zdatnost předčí všechny ostatní [ctnosti]; vlast, svoboda, občané, ba i sami králové jsou totiž skryti pod ochranou a záštitou válečné zdatnosti.
- typ: odstavec
  de: |-
    Attamen (Cic. 1. de Offi.)
    Temerè in acie versari, & manum cum hoste confligere, immane quiddam, & belluarum simile est.
  cs: |-
    Avšak (Cicero, 1. kniha O povinnostech)[^3]
    Bezhlavě se vrhat do bitevního šiku a potýkat se s nepřítelem zblízka je cosi surového a podobného divé zvěři.
poznamky:
- n: 1
  text: |-
    Polybios z Megalopole (asi 200–118 př. Kr.), řecký dějepisec; v 6. knize Dějin rozebírá římské státní zřízení a vojenství. Citát není doslovný, jde o latinské shrnutí myšlenky, jaké kolovalo v renesančních sbírkách výroků (např. u Justa Lipsia).
- n: 2
  text: |-
    Marcus Tullius Cicero (106–43 př. Kr.), řeč Na obranu Lucia Mureny (Pro L. Murena, IX, 22) z roku 63 př. Kr.; citát volně zkracuje Ciceronův výrok o přednosti vojenské zdatnosti, pod jejíž ochranou je vše, co patří k vládě a stavu obce.
- n: 3
  text: |-
    Marcus Tullius Cicero, spis O povinnostech (De officiis, I, 23, 81) z roku 44 př. Kr.; varuje před bezhlavým bojem bez rozvahy. Tisk citát uvádí slovem „Avšak“ jako protiváhu k předchozí chvále válečné zdatnosti.
