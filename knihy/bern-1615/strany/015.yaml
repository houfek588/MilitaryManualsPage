id: '015'
list: '15'
strana: recto
sken: 33
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Zum 19. wie er das Ladpuluer von dem Pfanndeckel abschütten sol/ damit die Musquet/ wann er die Lundten versuchen wil/ nicht vnversehens loß gehe.
  cs: |-
    Za devatenácté, jak má z víčka pánvičky {Pfanndeckel} oklepat [přebytečný] prach {Ladpuluer}, aby mušketa {Musquet} nečekaně nevystřelila, až bude zkoušet doutnák {Lundten}.
- typ: nadpis
  uroven: 2
  de: Die Pfann abblaßt.
  cs: Ofoukněte pánvičku {Pfann}.
- typ: odstavec
  de: |-
    Zum 20. wie er zum vberfluß das Ladpuluer von dem Pfanndeckel (so etwas darauff were ligen bliben) zu mehrer sicherheit abblasen sol.
  cs: |-
    Za dvacáté, jak má pro jistotu ještě odfouknout prach z víčka pánvičky (pokud by na něm nějaký zůstal), aby bylo bezpečí ještě větší.
- typ: nadpis
  uroven: 2
  de: Die Musquet vmbdrehet.
  cs: Obraťte mušketu.
- typ: odstavec
  de: |-
    Zum 21. wie er die Musquet widrumb zuladen/ mit der Gabel vmbwenden sol/ vnd dieselbe mit der rechter Hand/ von vnden/ nach der lincken seiten zusteuren.
  cs: |-
    Za jednadvacáté, jak má mušketu spolu s vidlicí {Gabel} obrátit, aby ji znovu nabil, a pravou rukou ji zespodu vést k levé straně.
- typ: nadpis
  uroven: 2
  de: Die Gabel schleifft.
  cs: Vlečte vidlici za sebou.
- typ: odstavec
  de: Zum 22. wann er die Musquet
  cs: Za dvaadvacáté, až mušketu
