strana: recto
sken: 31
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: nadpis
  uroven: 2
  de: Die Lont abnembt.
  cs: Sejměte doutnák {Lont}.
- typ: odstavec
  de: |-
    Zum 14. wie er die Lont wol halten/ vnd damit er sie selbs nit außlösche/ mit den Fingern/ mit denen er sie auffgelegt/ widerumb von dannen nemmen/ vnd nit hinweg rucken muß.
  cs: |-
    Za čtrnácté, jak má doutnák dobře držet a – aby jej sám neuhasil – sejmout jej [z kohoutu] týmiž prsty, jimiž jej nasadil, a nikoli jím trhnout.
- typ: nadpis
  uroven: 2
  de: Die Lont wider zwischen die Finger fügt.
  cs: Vložte doutnák zpět mezi prsty.
- typ: odstavec
  de: |-
    Zum 15. wie er die Lont widerumb zwischen den Fingern/ da er sie zuvorhin weg genommen/ fügen sol/ vnd jmmerdar die Musquet in bequemer höche/ empor halte.
  cs: |-
    Za patnácté, jak má doutnák vložit zpět mezi prsty, odkud jej předtím vzal, a mušketu {Musquet} přitom stále držet vzhůru v pohodlné výšce.
- typ: nadpis
  uroven: 2
  de: Die Pfann abblaßt.
  cs: Ofoukněte pánvičku {Pfann}.
- typ: odstavec
  de: |-
    Zum 16. wie er die Funcken/ wo vngeferr etwas auff der Pfannen ligen verbliben/ abblasen sol/ damit das Lad: oder Zündtfleschlin sich nit
  cs: |-
    Za šestnácté, jak má odfouknout jiskry, pokud by jich na pánvičce náhodou trochu zůstalo, aby se nabíjecí neboli zápalná prachovnička {Zündtfleschlin}
