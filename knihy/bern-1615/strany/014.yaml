id: '014'
list: '14'
strana: verso
sken: 32
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    anzünde/ wann er das Puluer darauff schütten wil/ dardurch er sich selbs verletzen möchte/ vnd in mittels das Ladfleschlein (damit er zeit gewinnen möge) in der rechten Hand gefaßt/ fertig halte.
  cs: |-
    nevznítila, až na ni bude chtít sypat prach {Puluer}, čímž by se mohl sám zranit; a mezitím má v pravé ruce držet uchopenou a připravenou prachovničku {Ladfleschlein}[^1], aby tak získal čas.
  pokracovani: true
- typ: nadpis
  uroven: 3
  de: Auff die Pfan Puluer thut.
  cs: Nasypte na pánvičku {Pfan} prach.
- typ: odstavec
  de: |-
    Zum 17. wie er das Puluer auß dem Ladfleschlin/ vnd nicht auß der Musqueten Ladungen/ auff die Pfann thun sol/ dann dieweil dieselbe wegen der Ladung verruckt wurde/ so hinderte sölches sehr im fertig laden.
  cs: |-
    Za sedmnácté, jak má prach na pánvičku sypat z prachovničky, a nikoli z náloží {Ladungen} muškety {Musqueten}, neboť kdyby se [mušketa] kvůli náloži pohnula ze směru, velmi by to zdržovalo při rychlém nabíjení.
- typ: nadpis
  uroven: 3
  de: Die Pfann zuthut.
  cs: Zavřete pánvičku.
- typ: odstavec
  de: Zum 18. wie er die Pfann mit den vordersten Fingern zusperren sol.
  cs: Za osmnácté, jak má pánvičku předními prsty zavřít.
- typ: nadpis
  uroven: 3
  de: Die Pfann abschüttet.
  cs: Oklepejte pánvičku.
poznamky:
- n: 1
  text: >-
    Ladfleschlein (též Zündtfleschlin na str. [[013|13]]) zde označuje malou prachovničku na jemný zápalný prach (srov. Zündtfläschlein na str. [[005|5]]), nikoli odměrky hlavní prachové nálože (Ladungen) na bandalíru.
