bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    fürnembsten Fundamenten/ so da eine wol regulierte vnd bestelte Republic bestetiget/ ja eben durch welche vnsere Vorfahren (mit hilff vnd beystand Gottes des Allmechtigen) sich erhalten/ jhren Stand erhöhet/ vnd vermehrt: Vnd das noch mehr ist/ dise Kriegskunst/ vnd Disciplin/ als ein gantz notwendige/ vnd nutzliche sach von allen Stenden/ so wol in der Monarchey/ Aristocratey/ vnd Democratey/ zu allen zeiten erkant vnd erachtet worden: insonderheit aber by den Römern/ welche die fürnembste/ erste/ vnd berümste Republic vnder allen denen/ so jemals ir wesen gehabt/ vnd regiert/ vnd auch zum ehisten/ das jenig/ so zu erhaltung ihres Standts/ vnd Hochheit gedienet/ erkennet. Deßwegen dann auch sie dises im gebrauch hatten/
  cs: |-
    nejhlavnější základy, které upevňují dobře uspořádanou a zřízenou republiku – ano, právě ty, jimiž se naši předkové (s pomocí a přispěním Boha Všemohoucího) udrželi, svůj stav povznesli a rozmnožili. A co víc, toto válečné umění a disciplína byly ve všech dobách uznávány a považovány za zcela nezbytnou a užitečnou věc všemi státními zřízeními, jak v monarchii, tak v aristokracii i v demokracii; obzvláště pak u Římanů, kteří byli ze všech republik, jež kdy trvaly a vládly, tou nejhlavnější, první a nejslavnější, a kteří také nejdříve rozpoznali to, co sloužilo k udržení jejich stavu a vznešenosti. Proto tedy měli ve zvyku
