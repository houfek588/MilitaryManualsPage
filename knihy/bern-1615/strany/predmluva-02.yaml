bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    fürnembsten Fundamenten/ so da eine wol regulierte vnd bestelte Republic bestetiget/ ja eben durch welche vnsere Vorfahren (mit hilff vnd beystand Gottes des Allmechtigen) sich erhalten/ jhren Stand erhöhet/ vnd vermehrt: Vnd das noch mehr ist/ dise Kriegskunst/ vnd Disciplin/ als ein gantz notwendige/ vnd nutzliche sach von allen Stenden/ so wol in der Monarchey/ Aristocratey/ vnd Democratey/ zu allen zeiten erkant vnd erachtet worden: insonderheit aber by den Römern/ welche die fürnembste/ erste/ vnd berümste Republic vnder allen denen/ so jemals jr wesen gehabt/ vnd regiert/ vnd auch zum ehisten/ das jenig/ so zu erhaltung jhres Standts/ vnd Hochheit gedienet/ erkennet. Deßwegen dann auch sie dises im gebrauch hatten/
  cs: |-
    nejpřednější základy, na nichž stojí dobře uspořádaná a spravovaná republika; ano, právě jimi se naši předkové (s pomocí a přispěním Boha Všemohoucího) udrželi, svůj stav povznesli a rozmnožili. A co víc: toto válečné umění a disciplínu uznávala a měla za věc zcela nezbytnou a užitečnou všechna zřízení, jak monarchie, tak aristokracie i demokracie, a to ve všech dobách. Obzvláště pak Římané, jejichž republika byla ze všech, jaké kdy existovaly a vládly, ta nejpřednější, první a nejslavnější, a kteří také nejdříve poznali, co slouží k zachování jejich stavu a vznešenosti. Proto se u nich také ujal tento zvyk:
