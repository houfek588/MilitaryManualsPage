- typ: odstavec
  pokracovani: true
  de: |-
    die jenigen/ so da die vbung jrer Religion/ vnd gewüssen/ vndertrucken vnderstehn wolten/ dieselben zu verstossen sich behertz/ vnd vnerschrocken bereitwillig/ allzeit befunden.
  cs: |-
    ty, kteří by chtěli usilovat o potlačení svobodného vyznávání jejich náboženství a svědomí, byli vždy odhodlaně a neohroženě ochotni zapudit.
- typ: odstavec
  de: |-
    Vnd damit vnsere Vnderthanen/ nach introducierter dieser Kriegsvbung/ das jenig so jhnen von vnsern Befelchshaber in diser Disciplin desto leichtlicher fassen/ vnd behalten könten; in betrachtung/ das jenig vil besser in der gedechtnuß verbleibt/ was man gleichsam durch eine Ideam, oder Abbildung fürtragt/ vnd representiert. Als haben wir jhnen/ diesen kurtzen begriff mit der Vßlegung zu samen zu tragen/ vnd in Truck zu geben befohlen/ damit gedachte vnsere Vnderthanen desselben gebrauchen/ vnnd die Terminen deß Kriegs/ wie auch
  cs: |-
    A aby naši poddaní po zavedení tohoto válečného cvičení dokázali to, co jim naši velitelé v této disciplíně [vyloží], o to snadněji pochopit a udržet v paměti – s ohledem na to, že v paměti mnohem lépe zůstává to, co se podává a předvádí takříkajíc skrze nějakou ideu či zobrazení –, rozkázali jsme pro ně sestavit a vydat tiskem tento stručný přehled s výkladem, aby jej jmenovaní naši poddaní užívali a válečné termíny, jakož i
