stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    es von nöhten/ hinden nach schleiffen möge/ vnd die Musquet mit dem Trucker an die Schulteren kommen lassen/ die Hand bey dem Daumloch/ vnd die Lont/ so an beyden Enden brennen muß/ zwischen die zwen kleinsten Finger der lincken Hand fügen/ vnd dieselbige innerthalb der Laden/ oder Schaffts niderwerts hangen lassen/ damit er die/ jederzeit lenger machen könne/ vnnd ein theil vmbs ander möge gebrauchen/ vnd abwechßlen: zu gleich auch jederzeit ohne die Ladungs masse/ oder Ladungen/ ein klein Zündtfläschlein mit Zündtpulver/ in die Pfannen zeschütten.
  cs: |-
    toho bylo třeba, mohl táhnout za sebou. Mušketu {Musquet} má nechat spočívat spouští {Trucker} na rameni, ruku u otvoru pro palec, a doutnák {Lont}, který musí hořet na obou koncích, má vložit mezi dva nejmenší prsty levé ruky a nechat jej viset podél vnitřní strany pažby {Laden} (či {Schaffts}) směrem dolů, aby jej mohl kdykoli prodloužit a střídavě používat oba konce. Zároveň má u sebe vždy mít vedle odměrek nálože {Ladungs masse} neboli náloží {Ladungen} také malou prachovničku {Zündtfläschlein} se zápalným prachem {Zündtpulver} k nasypání na pánvičku {Pfannen}.
  pokracovani: true
- typ: nadpis
  uroven: 3
  de: Marschiert vnd tregt die Gabel neben der Musquetten.
  cs: Pochodujte a noste vidlici {Gabel} vedle muškety.
