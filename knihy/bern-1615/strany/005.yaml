bloky:
- typ: odstavec
  de: |-
    es von nöhten/ hinden nach schleiffen möge/ vnd die Musquet mit dem Trucker an die Schulteren kommen lassen/ die Hand bey dem Daumloch/ vnd die Lont/ so an beyden Enden brennen muß/ zwischen die zwen kleinsten Finger der lincken Hand fügen/ vnd dieselbige innerthalb der Laden/ oder Schaffts niderwerts hangen lassen/ damit er die/ jederzeit lenger machen könne/ vnnd ein theil vmbs ander möge gebrauchen/ vnd abwechßlen: zu gleich auch jederzeit ohne die Ladungs masse/ oder Ladungen/ ein klein Zündtfläschlein mit Zündtpulver/ in die Pfannen zeschütten.
  cs: |-
    toho bylo třeba, mohl vléci za sebou. Mušketu {Musquet} má nést tak, aby mu spočívala spouští {Trucker} na rameni, ruku u otvoru pro palec. Doutnák {Lont}, který musí hořet na obou koncích, má vložit mezi dva nejmenší prsty levé ruky a nechat jej viset dolů podél vnitřní strany pažby {Laden} neboli {Schaffts}, aby jej mohl kdykoli prodloužit a oba konce střídavě používat. Zároveň má mít vždy kromě odměrek nálože {Ladungs masse} neboli náloží {Ladungen} také malou prachovničku {Zündtfläschlein} se zápalným prachem {Zündtpulver} k sypání na pánvičku {Pfannen}.
  pokracovani: true
- typ: nadpis
  uroven: 3
  de: Marschiert vnd tregt die Gabel neben der Musquetten.
  cs: Pochodujte a neste vidlici {Gabel} vedle muškety.
