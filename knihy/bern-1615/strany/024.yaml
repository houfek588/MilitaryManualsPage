id: '024'
list: '24'
strana: verso
sken: 42
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    vortheil versuchen/ vnd/ wie obstaht/ die Musquet im gewicht halten soll.
  cs: obratností jej vyzkoušet a mušketu {Musquet}, jak bylo řečeno výše, držet v rovnováze.
  pokracovani: true
- typ: nadpis
  uroven: 3
  de: Die Pfann deckt/ vnnd steht fertig.
  cs: Zakryjte pánvičku {Pfann} a stůjte připraveni.
- typ: odstavec
  de: |-
    Zum 40. wie er auff der Schiltwacht stehen/ in zeit der noht fertig sein/ mit auffgesetzter Lont seinen Standt halten/ vnd die Pfann für den Funcken mit den zweyen vordersten Fingern bedecken sol.
  cs: |-
    Za čtyřicáté, jak má stát na stráži {Schiltwacht}: v čas nouze být připraven, s nasazeným doutnákem {Lont} držet své stanoviště a dvěma předními prsty zakrývat pánvičku před jiskrami.
- typ: odstavec
  de: |-
    NOTA.
    Daß in dem 39. Puncten vier gebiet eingeschlossen/ ist darumb geschehen/ dieweil solche hievor außtrucklich gnug angedeutet/ derwegen dieselben alhie in einen einzigen Puncten verfaßt worden.
  cs: |-
    POZNÁMKA.
    Že jsou v 39. bodě zahrnuty čtyři povely, se stalo proto, že již byly dříve dostatečně výslovně vyloženy; proto jsou zde shrnuty do jediného bodu.
- typ: odstavec
  de: Folget das Exercitium des Spiesses.
  cs: Následuje cvičení s píkou {Spiesses}.
