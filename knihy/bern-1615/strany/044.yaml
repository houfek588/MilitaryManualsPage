id: '044'
list: '44'
strana: verso
sken: 62
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: gegen der lincken Hand wenden.
  cs: obrátit se k levé ruce.
- typ: nadpis
  uroven: 3
  de: 5. Richtet euwre Reyen.
  cs: 5. Vyrovnejte zástupy {Reyen}.
- typ: odstavec
  de: |-
    Damit wirdt gemeint/ das einer hinder dem anderen in grader Lini/ wie obangedeutet/ stehe.
  cs: |-
    Tím se myslí, aby jeden stál za druhým v přímé linii, jak bylo naznačeno výše.
- typ: nadpis
  uroven: 3
  de: 6. Richtet euwre Glider.
  cs: 6. Vyrovnejte řady {Glider}.
- typ: odstavec
  de: |-
    Nemlich/ das ein jeder in seinem Glid in grader Lini/ vnd keiner vor dem andern stehe.
  cs: |-
    Totiž aby každý stál ve své řadě v přímé linii a nikdo nestál před druhým.
- typ: nadpis
  uroven: 3
  de: 7. Rechtsumb kehrt euch.
  cs: 7. Vpravo čelem vzad.
- typ: odstavec
  de: |-
    Das ist/ auff dem rechten Fuß nach der rechten Hand die Stirn wenden/ wa der Rucken war.
  cs: |-
    To znamená na pravé noze obrátit čelo přes pravou ruku tam, kde byla záda.
- typ: nadpis
  uroven: 3
  de: 8. Lincksumb kehrt euch.
  cs: 8. Vlevo čelem vzad.
- typ: odstavec
  de: |-
    Das ist/ auff dem lincken Fuß nach der lincken Hand das Angesicht wenden/ wo der Rucken war.
  cs: |-
    To znamená na levé noze obrátit tvář přes levou ruku tam, kde byla záda.
- typ: nadpis
  uroven: 3
  de: 9. Herstelt euch.
  cs: 9. Do původního postavení.
- typ: odstavec
  de: Durch diß wörtlin wirdt alzeit
  cs: Tímto slovem se vždy
