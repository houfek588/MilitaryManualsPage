id: '032'
list: '32'
strana: verso
sken: 50
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    auffwerts tragt/ so wirt der nur in einem Termin nider gefellt/ wie auch in einer zeit auffgehebt.
  cs: |-
    nese vzpřímeně, sklopí se jen v jednom tempu {Termin}[^1], stejně jako se v jedné době zvedá.
- typ: nadpis
  uroven: 3
  de: Den Spieß niderstelt.
  cs: Postavte píku {Spieß} na zem.
- typ: odstavec
  de: |-
    Zum 7. wie man den Spieß widerumb in dryen griffen/ oder zeiten/ gleich wie im auffnemmen/ auff die Erden/ neben den rechten Fuß niderstellen/ vnd gegen dem Daumen regieren/ auch denselben Augenhöche/ halten soll.
  cs: |-
    Za 7., jak se má píka opět na tři hmaty neboli doby, stejně jako při zvedání, postavit na zem vedle pravé nohy, vést proti palci a držet ve výši očí.
- typ: nadpis
  uroven: 3
  de: Auffwerts den Spieß tragt.
  cs: Neste píku vzpřímeně.
- typ: odstavec
  de: |-
    Zum 8. wie er den nidergestelten Spieß von der Erden/ wie vor gemelt/ in dryen griffen empor heben/ vnnd wann er denselben vnden am ende gefaßt/ in der rechten Hand gegen demselben Arm ziehen vnd
  cs: |-
    Za 8., jak má píku postavenou na zemi zvednout, jak bylo řečeno výše, na tři hmaty, a když ji uchopí dole za konec, přitáhnout ji v pravé ruce k téže paži a
poznamky:
- n: 1
  text: >-
    Termin – zde totéž co „zeit“ (doba), tj. jeden takt pohybu při cvičení se zbraní.
