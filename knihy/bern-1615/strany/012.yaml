id: '012'
list: '12'
strana: verso
sken: 30
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    nicht wider die Schultern/ sonder auff die Brust/ sein Backen auch nit an die Laden/ oder Schafft lege/ er habe dann zuvor die Musquet wider die Brust angesetzt/ sonsten wirt es keine art haben/ vil weniger könte man gewiß schiessen/ sonder mehrtheils sich vbereilen.
  cs: |-
    nikoli o rameno, nýbrž o hruď, a také aby tvář nepřikládal k pažbě {Laden} neboli {Schafft} dříve, než mušketu {Musquet} opře o hruď. Jinak to nebude, jak se patří, a tím méně by se dalo jistě střílet; spíše by se člověk většinou ukvapil.
  pokracovani: true
- typ: nadpis
  uroven: 3
  de: Die Musquet abnembt/ vnd neben an die Gabel faßt.
  cs: Sejměte mušketu a uchopte ji vedle vidlice {Gabel}.
- typ: odstavec
  de: |-
    Zum 13. wann er loß gebrennt haben wirt/ sol man ein wenig die Musquet für sich stossen/ die Gabel wider auffnemmen/ vnd dieselb in der Hand vast/ neben der Musquet/ halten/ vnd nit schleiffen/ es were dann sach/ daß man sich zu schwach befunde: jedoch sol man jmmerdar die Musquet empor halten/ damit niemand/ wann die Musquet versagt hette/ verletzt werde.
  cs: |-
    Za třinácté: když vystřelí, má mušketu trochu postrčit před sebe, vidlici opět zvednout a držet ji pevně v ruce vedle muškety, a nikoli ji vléci po zemi, leda by se cítil příliš slabý. Mušketu však má vždy držet vzhůru, aby nikdo nebyl zraněn, kdyby selhala.
