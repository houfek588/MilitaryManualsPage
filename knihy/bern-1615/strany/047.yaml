id: '047'
list: '47'
strana: recto
sken: 65
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    nemmen ein weitere distantz/ vnnd werden doch die Glider geschlossen bleiben.
  cs: |-
    zaujmou větší rozestup {distantz}, a řady {Glider} přitom zůstanou semknuté.
- typ: nadpis
  uroven: 3
  de: 16. Lincks öffnet euwre Reyen.
  cs: 16. Vlevo rozestupte zástupy {Reyen}.
- typ: odstavec
  de: |-
    Hat einen ebenmessigen Verstand allhie die Reyen zu offnen/ wie hievor steht/ außgenommen/ daß man sich auff dem lincken Fuß gegen der lincken Hand vmbdrehet.
  cs: |-
    Rozestoupení zástupů má zde stejný smysl, jak je uvedeno výše, jen s tím rozdílem, že se každý otočí na levé noze k levé ruce.
- typ: nadpis
  uroven: 3
  de: 17. Vorwerts offnet euwre Glider.
  cs: 17. Vpřed rozestupte řady.
- typ: odstavec
  de: |-
    Da gehn die Glider von einander/ vorwerts/ nemmen eine weitere/ oder die vorige distantien/ vnnd bleibt das letste Glid still stehn.
  cs: |-
    Zde se řady od sebe vzdalují směrem dopředu a zaujmou větší nebo předchozí rozestupy; poslední řada přitom stojí na místě.
- typ: nadpis
  uroven: 3
  de: 18. Hinderwerts offnet euwre Glider.
  cs: 18. Vzad rozestupte řady.
- typ: odstavec
  de: |-
    So kehrt sich der hauffen rechts vmb/ mit offnung vnnd wider herstellung der Glideren/ wie obstaht.
  cs: |-
    Tu se šik {hauffen} obrátí vpravo čelem vzad, rozestoupí řady a opět je uvede do původního postavení, jak je uvedeno výše.
- typ: nadpis
  uroven: 3
  de: 19. Rechts schwingt (oder schwenckt) euch.
  cs: 19. Vpravo zakružte (neboli zatočte).
