id: '004'
list: '4'
strana: verso
sken: 22
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: aufftruckt/ Ewer Lont versucht/ oder auffmesset.
  cs: doutnák {Lont}, vyzkoušejte neboli odměřte doutnák.
  pokracovani: true
- typ: seznam
  de:
  - 40. Ewer Pfann deckt/ vnd stehet fertig.
  cs:
  - 40. Zakryjte pánvičku {Pfann} a stůjte připraveni.
- typ: odstavec
  de: |-
    General Gebott.
    Eweren Lauff oder Rhor empor/ oder in die höche haltet.
  cs: |-
    Obecný rozkaz.
    Držte hlaveň {Lauff} čili {Rhor} vzhůru neboli do výšky.
- typ: nadpis
  uroven: 3
  de: Marschiert mit der Gabel in der Hand.
  cs: Pochodujte s vidlicí {Gabel} v ruce.
- typ: odstavec
  de: |-
    ZVm Ersten/ wirt einem jeden Musquetierer gezeigt/ wie er im fortgehen seine Musquet vnnd Gabel bequemlich tragen sol/ Nemlich daß er die Fourcket in rechter Hand halten/ dieselbige im fortgahn iedes mahls auff der Erden versetzen soll/ vnd sol zuvorhin ein Bändlein daran vest gemacht vnd gebunden haben/ zwen zwerch Finger vnder der Gabel/ damit er dieselbige/ wann
  cs: |-
    Za prvé se každému mušketýrovi {Musquetierer} ukáže, jak má při pochodu pohodlně nést mušketu {Musquet} a vidlici: furketu {Fourcket} má totiž držet v pravé ruce a při chůzi ji pokaždé opřít o zem. Předtím na ni má pevně přivázat řemínek, dva prsty na šířku pod vidlicí[^1], aby ji, kdyby
poznamky:
- n: 1
  text: |-
    „zwen zwerch Finger vnder der Gabel“ – dva prsty na šířku pod vidlicí, tj. pod rozvidlenou železnou hlavicí furkety. Na tomto řemínku se furketa při nabíjení vleče za vojákem (srov. body 22 a 32 na str. [[015|15]] a [[020|20]]).
