    General Gebott.
    Eweren Lauff oder Rhor empor/ oder in die höche haltet.
  cs: |-
    Obecný rozkaz.
    Držte svou hlaveň {Lauff} neboli trubici {Rhor} vzhůru nebo do výše.
- typ: nadpis
  uroven: 3
  de: Marschiert mit der Gabel in der Hand.
  cs: Pochodujte s vidlicí {Gabel} v ruce.
- typ: odstavec
  de: |-
    ZVm Ersten/ wirt einem jeden Musquetierer gezeigt/ wie er im fortgehen seine Musquet vnnd Gabel bequemlich tragen sol/ Nemlich daß er die Fourcket in rechter Hand halten/ dieselbige im fortgahn iedes mahls auff der Erden versetzen soll/ vnd sol zuvorhin ein Bändlein daran vest gemacht vnd gebunden haben/ zwen zwerch Finger vnder der Gabel/ damit er dieselbige/ wann
  cs: |-
    Nejprve se každému mušketýrovi {Musquetierer} ukáže, jak má při chůzi pohodlně nosit svou mušketu {Musquet} a vidlici: totiž tak, že má furketu {Fourcket} držet v pravé ruce a při chůzi ji pokaždé opírat o zem; předtím na ni však má mít pevně přivázaný a uvázaný řemínek [poutko] na šířku dvou prstů pod vidlicí, aby ji, kdyby
