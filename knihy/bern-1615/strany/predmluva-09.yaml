bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Soldaten machet/ vnd die Lection solcher Kriegs Materien mit nichten darzu dienet/ vnd keinen nutz nit hat: in betrachtung/ daß die wahre vnd vollkommene Kriegsschul das Feldleger seye/ vnd nit daheim in die Hüser setzen: daß der rechte Lehrmeister/ die zeit vnnd die gelegenheit zu streiten sey. Item das der vsus vnd gebrauch sey dises/ daß man alsdann verhanden sey/ da man die streich vnd schuß vßtheilet: vnd daß der rechte Meisterstuck sey/ wann man in einicher Person die Effecten verbringen/ vnd vollziehen sichet/ vnd hilffet: Endlichen das die rechte contemplation vnnd obiect in dieser disciplin seye/ wann man den außgang etlicher Schlachten gesehen: Jedoch ist es an dem/ das wann einer zum allerersten die volkomne wissenschafft
  cs: |-
    vojáka a že čtení o takových válečných věcech k tomu nijak neslouží a nemá žádný užitek; vzhledem k tomu, že pravou a dokonalou válečnou školou je polní ležení {Feldleger}, a ne vysedávání doma, a že pravým učitelem je čas a příležitost k boji. Dále že pravým cvikem a praxí je být přítomen tam, kde se rozdávají rány a výstřely; a že pravým mistrovským kusem je, když člověk vlastní osobou[^1] vidí, jak se [válečné] činy provádějí a dovršují, a sám při tom pomáhá; a konečně že pravým předmětem rozjímání v této disciplíně je, když člověk viděl, jak dopadlo několik bitev. Avšak je tomu tak, že teprve když člověk nejprve získá dokonalou znalost
poznamky:
- n: 1
  text: |-
    „in einicher Person“ – doslova „v nějaké (jediné) osobě“; „einig“ zde znamená „sám, jediný“ (srov. „einig vnd allein“ = pouze a jedině o stranu dříve), smysl je tedy „vlastní osobou, osobně“ (jako „in eigner Person“). „Effecten“ jsou skutečné válečné činy, akce v poli – na rozdíl od pouhého čtení a teorie.
