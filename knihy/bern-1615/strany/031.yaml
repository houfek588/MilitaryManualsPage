id: '031'
list: '31'
strana: recto
sken: 49
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: nadpis
  uroven: 3
  de: Abwerts den Spieß tragt.
  cs: Neste píku {Spieß} skloněnou dolů.
- typ: odstavec
  de: |-
    Zum 5. den Spieß abwerts zu tragen/ sol das vorder endt vom Spieß auffs wenigst ein Schuch hoch vom Boden/ nicht höher sein/ vnd der recht Fuß vor geführet werden.
  cs: |-
    Za 5., při nesení píky skloněnou dolů má být přední konec píky alespoň jednu stopu {Schuch} nad zemí, nikoli výše[^1], a pravá noha má být vysunuta vpřed.
- typ: nadpis
  uroven: 3
  de: Den Spieß durch die Porten fellt.
  cs: Skloňte píku pro průchod branou {Porten}.
- typ: odstavec
  de: |-
    Zum 6. wie man den Spieß ab der Axel in dryen zeiten oder griffen durch ein Porten bequemlich mit gebognem Knie/ zufellen/ Nemlich sol man mit lincker Hand den Spieß hinden nider trucken/ damit derselb mit der Spitzen empor komme/ vnd den rechten Arm außgestreckt/ den lincken Ellebogen gegen die Hüfft steiff setzen. Wann man aber den
  cs: |-
    Za 6., jak pohodlně sklopit píku z ramene na tři doby nebo hmaty pro průchod branou s pokrčeným kolenem: levou rukou se má píka vzadu stlačit dolů, aby šla její špička vzhůru, pravá paže se natáhne a levý loket se pevně zapře o bok. Když se však [píka]
poznamky:
- n: 1
  text: >-
    Doslovně „nejméně jednu stopu vysoko od země, ne výše“ – tedy zhruba jednu stopu nad zemí, aby se hrot při pochodu nezabodával do země, ale ani nevyčníval příliš vzhůru.
