id: '031'
list: '31'
strana: recto
sken: 49
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: nadpis
  uroven: 2
  de: Abwerts den Spieß tragt.
  cs: Neste píku {Spieß} skloněnou dolů.
- typ: odstavec
  de: |-
    Zum 5. den Spieß abwerts zu tragen/ sol das vorder endt vom Spieß auffs wenigst ein Schuch hoch vom Boden/ nicht höher sein/ vnd der recht Fuß vor geführet werden.
  cs: |-
    Za 5.: při nesení píky skloněné dolů má být její přední konec nejméně jednu stopu {Schuch} nad zemí, ne však výše[^1], a pravá noha má být vysunuta vpřed.
- typ: nadpis
  uroven: 2
  de: Den Spieß durch die Porten fellt.
  cs: Sklopte píku pro průchod branou {Porten}.
- typ: odstavec
  de: |-
    Zum 6. wie man den Spieß ab der Axel in dryen zeiten oder griffen durch ein Porten bequemlich mit gebognem Knie/ zufellen/ Nemlich sol man mit lincker Hand den Spieß hinden nider trucken/ damit derselb mit der Spitzen empor komme/ vnd den rechten Arm außgestreckt/ den lincken Ellebogen gegen die Hüfft steiff setzen. Wann man aber den
  cs: |-
    Za 6., jak se má píka pro průchod branou pohodlně sklopit z ramene na tři doby neboli hmaty s pokrčeným kolenem: levou rukou se má píka vzadu stlačit dolů, aby se zvedla hrotem vzhůru, pravá paže se natáhne a levý loket se pevně opře o bok. Když však [voják] píku
poznamky:
- n: 1
  text: >-
    Doslova „nejméně jednu stopu vysoko od země, ne výše“ (ověřeno ve skenu) – přední konec píky má tedy být zhruba
    stopu (asi 30 cm) nad zemí: dost vysoko, aby nezavadil o zem, ale ne výš.
