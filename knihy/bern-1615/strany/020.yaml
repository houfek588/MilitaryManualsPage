id: '020'
list: '20'
strana: verso
sken: 38
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: nadpis
  uroven: 3
  de: |-
    Die Musquet mit rechter Hand in die höche/ oder empor/ halt/ vnnd die Gabel erfaßt.
  cs: |-
    Pravou rukou držte mušketu {Musquet} do výšky neboli vzhůru a uchopte vidlici {Gabel}.
- typ: odstavec
  de: |-
    Zum 32. wie er die Musquet mit rechter Hand bey der grossen schrauben (oder Schwanschrauben) widerumb fassen/ vnd empor halten/ vnnd die Gabel/ so noch hernach schleifft/ an einem Band hanget/ vornen herfür bringen sol/ damit er mit vortheil dieselbe biß in die lincke Hand kommen lassen möge.
  cs: |-
    Za dvaatřicáté, jak má mušketu pravou rukou opět uchopit u velkého šroubu {grossen schrauben} (neboli dnového šroubu {Schwanschrauben}) a držet ji vzhůru a vidlici, která se ještě vleče za ním a visí na řemínku, přenést dopředu, aby ji mohl obratně nechat dojít až do levé ruky.
- typ: nadpis
  uroven: 3
  de: Auff die Schultern die Musqueten legt.
  cs: Položte mušketu na rameno.
- typ: odstavec
  de: |-
    Zum 33. wie er die Musquet wol/ leichtlich/ vnd mit einer Hand auff die Schultern legen/ vnd zwischen die Gabel halten sol.
  cs: |-
    Za třiatřicáté, jak má mušketu dobře, lehce a jednou rukou položit na rameno a držet ji u vidlice.[^1]
poznamky:
- n: 1
  text: |-
    „zwischen die Gabel halten“ – doslova „držet mezi vidlicí“. Patrně jde o to, že levá ruka drží mušketu spolu s vidlicí, srov. bod 4 na str. [[007|7]] („zwüschen die Gabel vnd den Daumen“ – mezi vidlici a palec).
