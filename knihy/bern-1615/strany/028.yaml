bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    mit der Rechten zuforderst an seinem end/ also daß er ein/ oder beyde fordere Finger fürschiessen/ vnd den Spieß zuforderst vmb etwas erfasset. Folgendts ziecht er den Spieß an sich an den Arm/ denselben grad/ oder auffwerts zůtragen/ doch daß er den Arm nit zu vast einwerts trehe/ sondern denselben etwas flach/ vnd grad außwerts kehre/ den Spieß desto steiffer zuhalten/ vnnd zierlicher zuführen.
  cs: |-
    pravou rukou zcela na jejím konci, a to tak, že vysune jeden nebo oba přední prsty vpřed a píku {Spieß} uchopí poněkud na jejím samém konci. Následně přitáhne píku k sobě k paži, aby ji nesl rovně neboli vzhůru, avšak tak, aby paži nevytáčel příliš dovnitř, nýbrž ji natočil poněkud naplocho a přímo ven, aby tak píku držel pevněji a vedl ji úhledněji.
- typ: nadpis
  uroven: 3
  de: Den Spieß niderstelt.
  cs: Postavte píku na zem.
- typ: odstavec
  de: |-
    Zum 2. Wie er den auffwerts getragnen Spieß in dreyen Zeyten/ oder griffen niderstellen muß/ Namlich sol er die rechte Hand mit dem Spieß ein wenig sincken lassen/ denselben ein Schüpfflein gegen der
  cs: |-
    Za 2., jak má píku nesenou vzhůru postavit na zem na tři doby neboli hmaty: totiž má nechat pravou ruku s píkou o kousek poklesnout a dát jí lehké popostrčení směrem k
