strana: recto
sken: 53
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: nadpis
  uroven: 3
  de: Herstelt euch.
  cs: Zaujměte původní postoj.
- typ: odstavec
  de: |-
    Zum 11. wie er auß diser Postur sich herstellen/ oder den Spieß fellen soll/ nemlich so greifft er in dryen zeiten wider hindersich: faßt den Spieß (wie zuvor im 9. Articul gesagt) am end desselben/ vnd kompt widerumb mit dem lincken Fuß vor/ wie er den Spieß gefelt.
  cs: |-
    Za 11., jak se má z tohoto postoje {Postur} vrátit do původního neboli sklopit píku {Spieß}: sáhne totiž na tři doby opět dozadu, uchopí píku (jak bylo řečeno v 9. článku) za její konec a znovu předstoupí levou nohou, tak jako když píku sklopil.
- typ: nadpis
  uroven: 3
  de: Den Spieß schleifft.
  cs: Vlečte píku.
- typ: odstavec
  de: |-
    Zum 12. so man den Spieß schleiffen wil/ laßt man desselben Eysen auff den Boden niderfallen. Darnach kehrt man sich rechts vmb/ vnd schleifft den Spieß mit der lincken Hand/ welches gschwinder vnd fehziger geschicht: dann so man sich lincksvmb wenden/ vnd den Spieß mit
  cs: |-
    Za 12.: chce-li [voják] píku vléci, nechá její železo {Eysen} klesnout na zem. Potom se obrátí vpravo a vleče píku levou rukou, což jde rychleji a obratněji[^1]; kdyby se totiž obrátil vlevo a vlekl píku
poznamky:
- n: 1
  text: >-
    V tisku „fehziger“ (ověřeno ve skenu: „feh-|ziger“), zjevná tisková chyba za „fertiger“ – hbitěji, obratněji.
