bloky:
- typ: nadpis
  uroven: 3
  de: Herstelt euch.
  cs: Zaujměte původní postoj.
- typ: odstavec
  de: |-
    Zum 11. wie er auß diser Postur sich herstellen/ oder den Spieß fellen soll/ nemlich so greifft er in dryen zeiten wider hindersich: faßt den Spieß (wie zuvor im 9. Articul gesagt) am end desselben/ vnd kompt widerumb mit dem lincken Fuß vor/ wie er den Spieß gefelt.
  cs: |-
    Za 11., jak se má z této pozice vrátit do původního postoje nebo sklopit píku {Spieß}: totiž hmatá na tři doby opět dozadu, uchopí píku (jak bylo řečeno dříve v 9. článku) na jejím konci a vykročí opět levou nohou vpřed tak, jako když píku sklopil.
- typ: nadpis
  uroven: 3
  de: Den Spieß schleifft.
  cs: Vlečte píku.
- typ: odstavec
  de: |-
    Zum 12. so man den Spieß schleiffen wil/ laßt man desselben Eysen auff den Boden niderfallen. Darnach kehrt man sich rechts vmb/ vnd schleifft den Spieß mit der lincken Hand/ welches gschwinder vnd fehziger geschicht: dann so man sich lincks vmb wenden/ vnd den Spieß mit
  cs: |-
    Za 12., když se má píka vléci, nechá se její železný hrot klesnout na zem. Poté se [voják] otočí vpravo a vleče píku levou rukou, což jde rychleji a hbitěji[^1]: neboť kdyby se otočil vlevo a vlekl
poznamky:
- n: 1
  text: >-
    V tisku „fehziger“, zjevná tisková chyba místo „fertiger“ (hbitěji, obratněji).
