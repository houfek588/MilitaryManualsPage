id: '042'
list: '42'
strana: verso
sken: 60
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: seznam
  de:
  - 10. Rechts herstelt euch.
  - 11. Lincks herstelt euch.
  - 12. Rechts schliesset euwre Reyen.
  - 13. Lincks schliesset euwre Reyen.
  - 14. Schliesset euwre Glider.
  - 15. Rechts offnet euwre Reyen.
  - 16. Lincks offnet euwre Reyen.
  - 17. Vorwerts offnet euwre Glider.
  - 18. Hinderwerts offnet euwre Glider.
  - 19. Rechts schwingt/ oder schwenckt euch.
  - 20. Lincks schwenckt euch.
  - 21. Euwer Reyen rechts vmb kehrt.
  - 22. Euwer Reyen lincks vmb kehrt.
  - 23. Euwer Glider rechtes vmb kehrt.
  - 24. Euwer Glider lincks vmb kehrt.
  - 25. Rechts doppliert euwre Reyen.
  - 26. Lincks doppliert euwre Reyen.
  - 27. Herstelt euch.
  - 28. Rechts doppliert euwre Glider.
  - 29. Lincks doppliert euwre Glider.
  - 30. Herstelt euch.
  - 31. Rechts doppliert euwre Glider von halben Reyen.
  cs:
  - 10. Vpravo do původního postavení.
  - 11. Vlevo do původního postavení.
  - 12. Vpravo semkněte zástupy {Reyen}.
  - 13. Vlevo semkněte zástupy.
  - 14. Semkněte řady {Glider}.
  - 15. Vpravo rozestupte zástupy.
  - 16. Vlevo rozestupte zástupy.
  - 17. Vpřed rozestupte řady.
  - 18. Vzad rozestupte řady.
  - 19. Vpravo zakružte neboli zatočte.[^1]
  - 20. Vlevo zatočte.
  - 21. Zástupy vpravo čelem vzad.[^2]
  - 22. Zástupy vlevo čelem vzad.
  - 23. Řady vpravo čelem vzad.
  - 24. Řady vlevo čelem vzad.
  - 25. Vpravo zdvojte zástupy.
  - 26. Vlevo zdvojte zástupy.
  - 27. Do původního postavení.
  - 28. Vpravo zdvojte řady.
  - 29. Vlevo zdvojte řady.
  - 30. Do původního postavení.
  - 31. Vpravo zdvojte řady polovinami zástupů.
poznamky:
- n: 1
  text: >-
    Schwingt / schwenckt euch – podle výkladu na [[048|str. 48]] se celý semknutý šik zatočí (otočí jako celek, kolem svého
    pravého, u povelu 20 levého křídla) k pravé ruce, „ať napůl, nebo úplně“ (seye halb oder gar). Úhel tisk neuvádí;
    nejspíš jde o čtvrtobrat (90°), nebo o obrat čelem vzad (180°). Ve výkladu povelů 10–11 označují tatáž slovesa
    otočení jednotlivého vojáka na noze.
- n: 2
  text: >-
    Povely 21–24 označují protipochod (kontramarš), ne pouhý obrat na místě. Podle výkladu na [[048|str. 48]]–[[049|49]]
    se muži přední řady obrátí vpravo (vlevo) čelem vzad a projdou šikem dozadu, každý jde za druhem, který stál před
    ním, až přední řada stane na místě, kde stála zadní; šik pak stojí obrácen opačným směrem. U povelů 23–24 se oddíl
    nejprve obrátí vpravo nebo vlevo vbok a protipochod se provede týmž způsobem napříč šikem, takže si pravé a levé
    křídlo vymění místa.
