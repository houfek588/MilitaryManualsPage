id: '002'
list: '2'
strana: verso
sken: 20
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: seznam
  de:
  - 7. Ewer Lont abblaßt/ vnd die wohlhalt.
  - 8. Ewer Lont aufftruckt.
  - 9. Versucht/ oder meßt auff ewere Lonten.
  - 10. Die Pfann deckt/ die Lont abblaßt/ vnd die Pfann auffthut.
  - 11. Ewer Musqueten empor/ oder in die höche halt.
  - 12. Die Musquet anlegt vnd schießt.
  - 13. Die Musquet abnembt/ vnd nebends an die Gabel faßt.
  - 14. Die Lont abnembt.
  - 15. Die Lont wider zwischen die Finger fügt.
  - 16. Die Pfann abblaßt.
  - 17. Auff die Pfann Pulver thut.
  - 18. Die Pfann zuthut.
  - 19. Die Pfann abschüttet.
  - 20. Die Pfann abblaßt.
  - 21. Ewer Musquetten vmbdrehet.
  - 22. Die Gabel schleifft.
  - 23. Ewer Ladmaß/ (oder Ladung) auffthut.
  - 24. Ewer Musquet ladet.
  - 25. Den Ladstecken außziecht.
  - 26. Den Ladstecken kurtz fasset.
  cs:
  - 7. Ofoukněte doutnák {Lont} a dobře jej držte.
  - 8. Nasaďte doutnák.[^1]
  - 9. Vyzkoušejte neboli odměřte doutnák.[^2]
  - 10. Zakryjte pánvičku {Pfann}, ofoukněte doutnák a otevřete pánvičku.
  - 11. Držte mušketu {Musqueten} vzhůru neboli do výšky.
  - 12. Přiložte mušketu a vystřelte.
  - 13. Sejměte mušketu a uchopte ji vedle vidlice {Gabel}.
  - 14. Sejměte doutnák.
  - 15. Vložte doutnák zpět mezi prsty.
  - 16. Ofoukněte pánvičku.
  - 17. Nasypte prach {Pulver} na pánvičku.
  - 18. Zavřete pánvičku.
  - 19. Oklepejte pánvičku.[^3]
  - 20. Ofoukněte pánvičku.
  - 21. Obraťte mušketu.
  - 22. Vlečte vidlici za sebou.
  - 23. Otevřete odměrku nálože {Ladmaß} (nebo nálož {Ladung}).
  - 24. Nabijte mušketu.
  - 25. Vytáhněte nabiják {Ladstecken}.
  - 26. Uchopte nabiják nakrátko.
poznamky:
- n: 1
  text: |-
    „aufftrucken“ – doslova „natlačit“: hořící doutnák se palcem a prsty vtiskne do čelistí kohoutu, nikoli se do nich zašroubuje; rozevření čelistí má být proto předem seřízeno podle tloušťky doutnáku (viz výklad na str. [[009|9]]).
- n: 2
  text: |-
    „Versucht/ oder meßt auff“ – voják kohoutem zkusmo spustí doutnák k pánvičce a prsty upraví, o kolik doutnák z kohoutu vyčnívá (prodlouží, zkrátí, sníží či zvýší), aby dopadal přesně do pánvičky (viz výklad na str. [[010|10]]). Proto se předtím z víčka pánvičky oklepe a odfoukne prach (body 19–20).
- n: 3
  text: |-
    „abschütten“ – setřást, oklepat přebytečný prach z víčka zavřené pánvičky, aby mušketa při zkoušení doutnáku nečekaně nevystřelila (viz výklad na str. [[015|15]]).
