bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Vnderthanen nach verenderungen der zeiten zu versorgen/ vnd zu waffnen seyen: Ja mit solchen Waffen/ so da bequem/ vnd nach gestalten deß Landes gelegenheit/ der Oerteren/ vnd der zeit den Soldaten komlich/ vnd geschickt. Endlichen/ vnd zum vierten/ lehrnet die letzte anleitung/ oder anordnung die fünff aller fürnembsten vnd nutzlichsten Merckzeichen/ so das Ampt des Kriegswesen betrifft. Welches alles/ demnach wir es wolbedacht/ vnd vnder vns erdauret/ als haben wir einhellig für gut befunden/ nach dem Exempel vnser Vorfahren/ so sich zu allen zeiten in Kriegssachen nach gelegenheit der zeit gar wol/ vnd bequem in die zeit zu schicken gewußt/ damit sie dem Regiment/ so jnen von Gott dem Allmechtigen befohlen/ mit
  cs: |-
    poddané podle proměn doby zaopatřit a vyzbrojit – ano, takovými zbraněmi, které jsou příhodné a podle povahy polohy země, míst i času pro vojáky pohodlné a vhodné. Konečně a za čtvrté učí toto poslední poučení neboli nařízení pěti vůbec nejhlavnějším a nejužitečnějším znakům, jež se týkají úřadu válečnictví. Poté, co jsme toto vše dobře uvážili a mezi sebou projednali, jednomyslně jsme uznali za dobré – po vzoru našich předků, kteří se ve válečných věcech vždy dokázali podle okolností doby velmi dobře a příhodně přizpůsobit času, aby o vládu, která jim byla od Boha Všemohoucího svěřena,
