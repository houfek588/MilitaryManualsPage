id: predmluva-05
list: předmluva
strana: recto
sken: 9
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Vnderthanen nach verenderungen der zeiten zu versorgen/ vnd zu waffnen seyen: Ja mit solchen Waffen/ so da bequem/ vnd nach gestalten deß Landes gelegenheit/ der Oerteren/ vnd der zeit den Soldaten komlich/ vnd geschickt. Endlichen/ vnd zum vierten/ lehrnet die letzte anleitung/ oder anordnung die fünff aller fürnembsten vnd nutzlichsten Merckzeichen/ so das Ampt des Kriegswesen betrifft. Welches alles/ demnach wir es wolbedacht/ vnd vnder vns erdauret/ als haben wir einhellig für gut befunden/ nach dem Exempel vnser Vorfahren/ so sich zu allen zeiten in Kriegssachen nach gelegenheit der zeit gar wol/ vnd bequem in die zeit zu schicken gewußt/ damit sie dem Regiment/ so jnen von Gott dem Allmechtigen befohlen/ mit
  cs: |-
    poddané podle proměn doby zaopatřit a vyzbrojit; a to takovými zbraněmi, které jsou příhodné a podle polohy země, míst i času pro vojáky pohodlné a vhodné. Konečně za čtvrté poslední návod neboli nařízení učí pěti vůbec nejpřednějším a nejužitečnějším znakům,[^1] jež se týkají úřadu válečnictví. Když jsme to vše dobře uvážili a mezi sebou probrali, uznali jsme jednomyslně za dobré – po vzoru našich předků, kteří se ve válečných věcech vždy dokázali podle okolností velmi dobře a vhodně přizpůsobit době, aby vládu, kterou jim svěřil Bůh Všemohoucí, mohli
poznamky:
- n: 1
  text: |-
    „Merckzeichen“ – doslova poznávací znamení, znaky. Předmluva je blíže nevysvětluje; snad jde o hlavní zásady či náležitosti válečného úřadu, k nimž vede vlastní výcvik v knize.
