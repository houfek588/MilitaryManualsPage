id: '048'
list: '48'
strana: verso
sken: 66
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Da muß sich der gantze von Reyen vnnd Glideren geschloßne hauffen auff die rechte Hand/ seye halb oder gar/ schwingen/ oder schwencken.
  cs: |-
    Zde musí celý šik {hauffen}, semknutý v zástupech {Reyen} i řadách {Glideren}, zakroužit neboli zatočit k pravé ruce, ať napůl, nebo úplně.
- typ: nadpis
  uroven: 3
  de: 20. Lincks schwenckt euch.
  cs: 20. Vlevo zatočte.
- typ: odstavec
  de: |-
    Da wirdt ein gleiches auff die lincke Seiten/ wie hieob auff der rechten/ verrichtet.
  cs: Zde se provádí totéž na levou stranu jako výše na pravou.
- typ: nadpis
  uroven: 3
  de: 21. Euwere Reyen rechtsumb kehrt.
  cs: 21. Zástupy vpravo čelem vzad.
- typ: odstavec
  de: |-
    Da soll man sich rechts vmb kehren/ vnd also durchgehn/ daß das vorderste Glid auff des hindersten statt/ komme/ vnnd wie es sein Angsicht bringet/ stehn bleibe/ auff dem Platz/ wo das hinderste gestanden. Hierin werde fleissig in acht genommen/ das ein jeder seinem vor jhm stehenden Gesellen nachfolge/ deßgleichen/ daß er sein Glid im
  cs: |-
    Zde se mají muži obrátit vpravo čelem vzad a projít [šikem] tak, aby přední řada přišla na místo nejzadnější a zůstala stát tak, jak je obrácena tváří, na místě, kde stála nejzadnější.[^1] Přitom se musí pečlivě dbát, aby každý šel za rotním druhem {Gesellen}, který stojí před ním, a také aby svou řadu při
poznamky:
- n: 1
  text: >-
    Jde o protipochod (kontramarš) po zástupech: muži přední řady se obrátí a projdou šikem dozadu, ostatní muži
    každého zástupu jdou jeden za druhým za nimi; šik pak stojí obrácen opačným směrem a jeho přední řada tam, kde předtím stála
    zadní. Srov. poznámku na [[042|str. 42]].
