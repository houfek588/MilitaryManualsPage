bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    erfordert werden/ dero dann fürnemblich vier in achtung zu nemen sind. Vnder welchen die erste dieses proprium, oder dise Eigenschafft hat/ daß sie gleichsam eine gestalt/ vnd allgemeine Form/ einem Stande gibt/ in dem die Vnderthanen durch dises gleichsamen angereitzt werden/ jhrer hochen Oberkeit Satzungen/ Befelchen/ vnd billichem begeren/ sich zu vnderwerffen/ vnd derselben in aller demut zu gehorsamen. Die andere gibt gnugsame anleitung/ vnd raht/ wie vnd was für Kriegsvolck in fallender noht nach gelegen: vnd beschaffenheit des Himmelsgestirns/ vnd der Lendern/ in einem Kriege zu gebrauchen sey. Die dritte/ so da weiset/ mit was Waffen eine Hoche Oberkeit jhre Lendern vnnd Gebiet/ wie auch deroselben
  cs: |-
    vyžadovány? Z nich je třeba brát v potaz především čtyři. První z nich má tu zvláštnost neboli vlastnost, že dává státu jakousi podobu a obecný řád, v němž jsou tím poddaní takřka podněcováni, aby se podřizovali ustanovením, rozkazům a spravedlivým požadavkům své vysoké vrchnosti a ve vší pokoře ji poslouchali. Druhá dává dostatečný návod a radu, jak a jaký válečný lid je třeba v nastalé nouzi ve válce použít podle polohy a povahy podnebí[^1] i zemí. Třetí ukazuje, jakými zbraněmi má vysoká vrchnost své země a území, jakož i jejich
poznamky:
- n: 1
  text: |-
    Doslova „nebeského hvězdstva“ (Himmelsgestirn). Podle antické a renesanční nauky (srov. Vegetius I, 2) určovalo podnebí, pod nímž se člověk zrodil, jeho povahu a vojenskou zdatnost; podle toho se mělo volit, jaký lid a kde nasadit.
