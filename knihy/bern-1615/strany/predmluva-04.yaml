bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    erfordert werden/ dero dann fürnemblich vier in achtung zu nemen sind. Vnder welchen die erste dieses proprium, oder dise Eigenschafft hat/ daß sie gleichsam eine gestalt/ vnd allgemeine Form/ einem Stande gibt/ in dem die Vnderthanen durch dises gleichsamen angereitzt werden/ ihrer hochen Oberkeit Satzungen/ Befelchen/ vnd billichem begeren/ sich zu vnderwerffen/ vnd derselben in aller demut zu gehorsamen. Die andere gibt gnugsame anleitung/ vnd raht/ wie vnd was für Kriegsvolck in fallender noht nach gelegen: vnd beschaffenheit des Himmelsgestirns/ vnd der Lendern/ in einem Kriege zu gebrauchen sey. Die dritte/ so da weiset/ mit was Waffen eine Hoche Oberkeit ihre Lendern vnnd Gebiet/ wie auch deroselben
  cs: |-
    vyžadovány, z nichž pak je třeba brát v potaz především čtyři. Z nich ta první má tu zvláštní povahu neboli vlastnost, že dává státu jakousi podobu a obecnou formu, v níž jsou poddaní tímto takříkajíc podněcováni k tomu, aby se podřizovali nařízením, rozkazům a spravedlivým požadavkům své vysoké vrchnosti a ve vší pokoře ji poslouchali. Druhá dává dostatečné vodítko a radu, jak a jaký válečný lid má být v případě nouze ve válce použit podle příležitosti a povahy nebeských hvězd i zemí. Třetí pak ukazuje, jakými zbraněmi má vysoká vrchnost své země a území, jakož i jejich
