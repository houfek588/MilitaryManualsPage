bloky:
- typ: seznam
  de:
  - 32. Lincks doppliert euwre Glider von halben Reyen.
  - 33. Herstelt euch.
  cs:
  - 32. Vlevo zdvojte své řady {Glider} z poloviny zástupů {Reyen}.
  - 33. Zaujměte původní postoj.
- typ: nadpis
  uroven: 2
  de: Außlegung dieses Kriegs Terminen.
  cs: Výklad těchto vojenských termínů.
- typ: nadpis
  uroven: 3
  de: 1. Reye.
  cs: 1. Zástup.
- typ: odstavec
  de: |-
    Ein Reye ist alles das jenige/ was für deinem Angesicht/ vnd an deinem Rucken/ oder vor vnd hinder dir/ in grader Lini stehet.
  cs: |-
    Zástup je všechno to, co stojí v přímé linii před tvou tváří a za tvými zády, neboli před tebou a za tebou.
- typ: nadpis
  uroven: 3
  de: 2. Glid.
  cs: 2. Řada.
- typ: odstavec
  de: |-
    Alle die jenigen/ so neben deiner rechten vnnd lincken Seiten seitenwerts stehen/ das heißt Glider.
  cs: |-
    Všichni ti, kteří stojí po tvém pravém a levém boku směrem do stran, se nazývají řady.
- typ: nadpis
  uroven: 3
  de: 3. Rechtsumb.
  cs: 3. Vpravo vbok.
- typ: odstavec
  de: Das ist/ sich auff dem rechten Fuß gegen der rechten Hand wenden.
  cs: Znamená to obrátit se na pravé noze směrem k pravé ruce.
- typ: nadpis
  uroven: 3
  de: 4. Lincksumb.
  cs: 4. Vlevo vbok.
- typ: odstavec
  de: Das ist/ sich auff den lincken Fuß
  cs: To znamená obrátit se na levé noze
