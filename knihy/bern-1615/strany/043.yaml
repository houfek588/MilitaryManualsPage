bloky:
- typ: seznam
  de:
  - 32. Lincks doppliert euwre Glider von halben Reyen.
  - 33. Herstelt euch.
  cs:
  - 32. Vlevo zdvojte řady {Glider} polovinami zástupů {Reyen}.
  - 33. Do původního postavení.
- typ: nadpis
  uroven: 2
  de: Außlegung dieses Kriegs Terminen.
  cs: Výklad těchto vojenských termínů.
- typ: nadpis
  uroven: 3
  de: 1. Reye.
  cs: 1. Zástup.
- typ: odstavec
  de: |-
    Ein Reye ist alles das jenige/ was für deinem Angesicht/ vnd an deinem Rucken/ oder vor vnd hinder dir/ in grader Lini stehet.
  cs: |-
    Zástup je všechno, co stojí v přímé linii před tvou tváří a za tvými zády, tedy před tebou a za tebou.
- typ: nadpis
  uroven: 3
  de: 2. Glid.
  cs: 2. Řada.
- typ: odstavec
  de: |-
    Alle die jenigen/ so neben deiner rechten vnnd lincken Seiten seitenwerts stehen/ das heißt Glider.
  cs: |-
    Všichni, kdo stojí vedle tebe po pravém i levém boku, tvoří řadu.
- typ: nadpis
  uroven: 3
  de: 3. Rechtsumb.
  cs: 3. Vpravo vbok.
- typ: odstavec
  de: Das ist/ sich auff dem rechten Fuß gegen der rechten Hand wenden.
  cs: To znamená obrátit se na pravé noze k pravé ruce.
- typ: nadpis
  uroven: 3
  de: 4. Lincksumb.
  cs: 4. Vlevo vbok.
- typ: odstavec
  de: Das ist/ sich auff den lincken Fuß
  cs: To znamená na levé noze
