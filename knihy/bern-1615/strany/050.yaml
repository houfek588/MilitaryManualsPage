  de: 26. Lincks doppliert euwre Reyen.
  cs: 26. Vlevo zdvojte zástupy {Reyen}.
- typ: odstavec
  de: Ein ebenmessige meinung hat auch dises dopplieren.
  cs: Stejný smysl má i toto zdvojování.
- typ: nadpis
  uroven: 3
  de: 27. Herstelt euch.
  cs: 27. Do původního postavení.
- typ: odstavec
  de: Da stelt man sich widerumb in die vorige stell.
  cs: Zde se každý opět postaví na své předchozí místo.
- typ: nadpis
  uroven: 3
  de: 28. Rechts doppliert euwre Glider.
  cs: 28. Vpravo zdvojte řady {Glider}.
- typ: odstavec
  de: |-
    Da soll auß zweyen Glideren eins gemacht werden/ vnnd stehet das erste Glid still/ welches durch das ander auff rechter seiten/ oder Hand/ gedoppliert wirdt/ das dritte durch das vierte: vnd also fortan/ biß alle Glider gedopplet/ vnd also an statt zechen Glidern/ nur fünffe seyen.
  cs: |-
    Zde se má ze dvou řad udělat jedna: první řada stojí na místě a druhá ji zdvojí po pravé straně neboli ruce, třetí řadu zdvojí čtvrtá a tak dále, dokud nejsou zdvojeny všechny řady, takže místo deseti řad je jich jen pět.
- typ: nadpis
