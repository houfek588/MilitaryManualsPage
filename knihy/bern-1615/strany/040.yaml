id: '040'
list: '40'
strana: verso
sken: 58
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    lincken/ vnnd die lincke an statt der rechten notwendiglich kommen muß/ dardurch er dann sein Postur bekompt.
  cs: |-
    levé a levá na místo pravé, čímž pak zaujme svůj postoj {Postur}.
- typ: nadpis
  uroven: 2
  de: Ein anders/ den Spieß hinderwerts zu fellen.
  cs: Jiný způsob, jak sklopit píku {Spieß} dozadu.
- typ: odstavec
  de: |-
    Man steht in seiner Postur/ vnd tragt den spieß/ flach/ oder abwerts/ laßt denselben so weit gegen dem endt/ oder orht herfür/ als müglich/ durch die rechte Hand schlipffen/ demnach schwingt man den Spieß vber den Kopff/ vnnd kehrt sich rechts vmb/ beides in einer zeit/ vnnd verfaßt volgendts den Spieß mit der lincken hand/ denselben hinderwelts zufellen. Von dem herstellen ist hievor gnugsam gesagt.
  cs: |-
    [Voják] stojí ve svém postoji a nese píku naplocho nebo skloněnou dolů. Nechá ji proklouznout pravou rukou co nejdále vpřed, ke konci neboli patce[^1], potom švihne píkou přes hlavu a obrátí se vpravo, obojí v jedné době, a pak píku uchopí levou rukou, aby ji sklopil dozadu[^2]. O návratu do původního postoje bylo již dříve řečeno dost.
- typ: nadpis
  uroven: 2
  de: Herstelt euch.
  cs: Zaujměte původní postoj.
- typ: odstavec
  de: |-
    Zum 19. sich widerumb herzustellen/ soll er sich mit gantzem Leib auff dem Lincken Fuß rechts vmb schwingen/ den Spieß in allem
  cs: |-
    Za 19.: chce-li se [voják] opět vrátit do původního postoje, má se celým tělem švihem obrátit na levé noze vpravo a píku během celého
poznamky:
- n: 1
  text: >-
    „endt/ oder orht“ – konec ratiště. Píka proklouzne rukou tak, aby ji voják nakonec držel co nejblíže u patky;
    teprve pak ji lze švihem přes hlavu přenést a sklopit hrotem dozadu.
- n: 2
  text: >-
    V tisku „hinderwelts“ (ověřeno ve skenu), zjevná tisková chyba za „hinderwerts“ (dozadu).
