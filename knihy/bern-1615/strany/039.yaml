  de: Hinderwerts den Spieß fellet.
  cs: Skloňte píku {Spieß} dozadu.
- typ: odstavec
  de: |-
    Zum 18. wann er den Spieß ab der Schultern (er trage jhn gleich flach oder abwerts) hinderwerts fellen wil/ thut er ein blick zu ruck/ vnd behaltet die rechte Hand an jhrem Ort/ darnach greifft er mit der andern an den Spieß hinunder/ so weit er mag/ vnnd schwingt also in einer zeit den lincken Fuß der lincken Hand nach/ vnd zugleich den Spieß vber das Haupt/ vnnd in allem schwung steht er mit dem lincken Fuß still/ vnd kehrt sich auff demselben mit gantzem Leib/ biß er in den rechten stand kommet/ leichtlich ist hierinn zu mercken/ das in allem schwung/ den er mit gantzem Leib thut/ die rechte Hand an statt der
  cs: |-
    Za 18., když chce [voják] sklopit píku dozadu z ramene (ať už ji nese naplocho, nebo skloněnou dolů), ohlédne se vzad a pravou ruku ponechá na jejím místě; poté druhou rukou hmátne po píce dolů, kam až dosáhne, a tak v jedné době švihne levou nohou za levou rukou a zároveň přenese píku přes hlavu. Při celém tom švihu stojí pevně na levé noze a otočí se na ní celým tělem, dokud nedosáhne správného postoje. Zde lze snadno zpozorovat, že při celém švihu, jejž provádí celým tělem, se pravá ruka nutně dostane na místo
