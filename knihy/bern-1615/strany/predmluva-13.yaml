bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Die löbliche Keysern Theodosius, Valentinianus, Arcadius, vnd Leo befehlen/ das die Haubtleut täglicher abrichtung/ vnd vbung jhrer Kriegsleüten obligen/ vnd das die Soldaten durch tägliche vbung in jhren Waffen/ vnd Wehren sich zum Krieg geschickt machen sollen. Plato lib. 7. de Repub. & Legib. lehret/ das junge Manschafft in zeit deß fridens zum Krieg abgericht werden soll/ vnd nicht erwarten/ biß sich der Krieg erhebe. Vnd Seneca Epist. 18. deutet eben das an/ Wann vns wol ergehet/ vnd daß wir ruh haben/ als sollen wir vns wider den Feind fertig machen. Vnd der König Theod. bey Cassiod. lib. 1. saget. Wo die Kriegskunst vorher nit gelehrnet/ vnd geübt: so wirt sie in Ernst vnd Noht manglen. In summa die erfahrung gibt es/ das vil Monarchien/ Königreichen/ Landschafften/ vnd Stette durch werende Kriegsdisciplin sind gewunnen/ vnd erhalten worden. Vnd Ioseph. lib. 3. cap. 6.
  cs: |-
    Chvályhodní císařové Theodosius, Valentinianus, Arcadius a Leo přikazují, aby hejtmani {Haubtleut} dbali na každodenní výcvik a cvičení svých válečných lidí a aby se vojáci každodenním cvičením se svými zbraněmi a zbrojí činili způsobilými k válce. Platón v 7. knize O republice a zákonech[^1] učí, že mladí muži mají být v době míru cvičeni k válce a nemají čekat, až válka vypukne. A Seneca v 18. listu[^2] naznačuje totéž: když se nám daří dobře a máme klid, tehdy se máme připravovat proti nepříteli. A král Theodorich u Cassiodora v 1. knize[^3] říká: „Kde se válečnému umění předem nenaučilo a necvičilo se v něm, tam bude ve vážné chvíli a v nouzi scházet.“ V úhrnu pak zkušenost ukazuje, že mnohé monarchie, království, země i města byly dobyty a zachovány díky vytrvalé válečné disciplíně. A Josephus ve 3. knize, 6. kapitole
poznamky:
- n: 1
  text: |-
    Platón, Zákony (De legibus), VII. kniha (804c–814d); dobový odkaz „de Repub. & Legib.“ spojuje oba Platónovy spisy o státě a zákonech.
- n: 2
  text: |-
    Seneca, Listy Luciliovi (Epistulae morales ad Lucilium), list 18, 6.
- n: 3
  text: |-
    Cassiodorus, Variae I, 40 (výnos krále Theodoricha Velikého o cvičení vojska v době míru).
