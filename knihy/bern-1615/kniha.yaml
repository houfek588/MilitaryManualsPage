poznamky_k_prekladu: |
  ZDROJ ORIGINÁLU: německý text vychází z OCR digitalizace Universitätsbibliothek Bern (e-rara, ID 2050509).
  Je nutné opravovat chyby OCR podle skenu (dlouhé ſ čtené jako f, zkomolená slova, chybné rozdělení slov)
  při zachování dobového pravopisu tisku (vnd, auff, seyn, Musqueten, Spieß).

  STRUKTURA NADPISŮ:
  - uroven: 1 = hlavní části knihy: Titulní list (`titul`), Citáty (`citaty`), Výnos a předmluva rady města Bernu
    (`predmluva-01`), Cvičení s mušketou (`001`), Cvičení s píkou (`025`), Obraty bitevního šiku (`041`).
  - uroven: 2 = pododdíly („Povelová slova a rozkazy…“, „Následuje stráž“, „Výklad těchto vojenských termínů“).
  - uroven: 3 = nadpisy jednotlivých povelů před výkladovými odstavci (u muškety 1–40, u píky 1–19, u obratů 1–33).

  POVELY A SPECIFICKÁ TERMINOLOGIE:
  - Všechny povely (u muškety, píky i obratů) sjednotit na 2. osobu množného čísla rozkazovacího způsobu
    („Skloňte mušketu a sejměte ji z ramene“, „Zvedněte píku…“).
  - *Ladmaß (oder Ladung)* překládat věrně jako „odměrka nálože (nebo nálož)“ (výklad „apoštol“ do poznámky/glosáře).
  - *Fourcket* / *Gabel* důsledně rozlišovat jako „furketa“ / „vidlice“ podle originálu; vždy „mušketa“ (ne „musketa“).
  - *Spieß* důsledně jako „píka“.
  - Bernské úřady v předmluvě sladit s glosáři Lavatera a Fronspergera: rychtář {Schuldtheiß} (s pozn. o bernském šultysovi),
    zemský fojt {Landvogt}, guvernér {Gubernator}, kastelán {Tschachtlan}, fojt {Vogt}, místodržící {Statthalter},
    podfojt {Undervogt}, zemský biřic {Freyweibel}, amman {Ammann}, biřic {Weibel} – Weibel/Freyweibel jsou
    civilní soudní a obecní zřízenci, ne vojenské hodnosti (šikovatel = jen Feldweibel).
