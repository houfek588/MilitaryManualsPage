podtitul: Also kurtzlich zum Nutz vnd Gebrauch der Löblichen Republic zu Bern/ vnd derselben Stetten/ vnd Landschafft zu samen getragen. Vnd Des Durchleuchtigen/ Hochgebornen Fürsten vnd Herren/ Herrn Mauritii, Fürsten zu Oranien/ vndt Graffen zu Nassaw/ &c. gleichförmig gemachet vnd angeordnet.
