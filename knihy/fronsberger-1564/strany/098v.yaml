id: 098v
list: XCVIII
strana: verso
sken: 204
stav: zkontrolovano
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    keck vnd vnuerzagt sein/dann sie wölten sie gewißlich in sechs oder acht tagen retten/daß sie auch jhr fleissig wacht vnd auffsehen haben/wann sie daher ziehen/wölten sie jhnen auff diesem oder jhenem Berg nachts mit fewer/oder tags mit rauch zeychen geben/alßdann solten sie eygentlich wissen/daß jhr rettung zugegen vnnd vorhanden were/So dann sie in der Statt hören vnd mercken würden/daß sie die feind angreiffen/vnd mit jhnen schlahen würden/daß sie sich dann auß der Statt machen mit jrem zusatz/vnd was wehrhaffter personen seyen/herauß ziehen/die feind zu rück angreiffen/vnd das best thůn wölten.
  cs: |-
    smělí a neohrožení, neboť je jistě do šesti nebo osmi dnů vysvobodí; ať také bedlivě drží stráž a dávají pozor, až budou [spojenci] přitahovat, dají jim na té či oné hoře v noci znamení ohněm, ve dne kouřem, a pak ať s jistotou vědí, že jejich vysvobození je nablízku a na dosah. Až pak ve městě uslyší a zpozorují, že [spojenci] na nepřátele útočí a bijí se s nimi, ať vyrazí z města se svou posádkou {zusatz} a se všemi bojeschopnými osobami, napadnou nepřátele zezadu a udělají, co budou moci.
- typ: odstavec
  de: |-
    So dann diese Kundtschafft vnd verrähterey/also verfertigt/alßdann vber etliche tag/so verordne der Oberst das Kriegßvolck so vor der Besatzung ligt/daß man tags auff den angezeygten Berg/welcher etwann zwo oder drey meyl von dannen ligen soll/ein grossen weitsichtigen rauch/oder bey der nacht dergleichen fewr mach/so verhoffen dann die in der Statt/es sey jhr rettung vorhanden.
  cs: |-
    Když je taková zpráva a lest takto připravena, ať po několika dnech nejvyšší [hejtman] {Oberst} nařídí válečnému lidu, který leží před posádkou, aby se ve dne na uvedené hoře, která má ležet asi dvě nebo tři míle odtud, udělal velký, zdaleka viditelný kouř, nebo v noci stejně takový oheň; ti ve městě pak budou doufat, že jejich vysvobození je nablízku.
- typ: odstavec
  de: |-
    Darnach etwann manche stund zu tag oder nacht/laß der Oberst gehlingen im Läger ein lärmen schlahen/vnnd ein groß geschrey vnnd rumor haben/das alles gibt den feinden ein argwohn/jhrer verhofften hülff/Darnach so es vmb mitnacht ist/so laß der Hauptmann wider ein lärmen schlahen/im selbigen lärmen breche er auff/vnd verrück mit dem gantzen hauffen/zu Roß vnnd fůß mit allem geschütz/Zelten/vnd dem gantzen Kriegßzeug/vnd ziehe vngefährlich auff ein Teutsche meyl den Feinden auß den augen/in dem verstecke er beseitz etliche hauffen/dartzů dienstlich zu Roß vnd Fůß/auch etlich gering Feldgeschütz/hinder Wäld oder Bihel/daß die feind so sie auß der Statt ziehen/sie nicht sehen oder mercken können/vnnd ziehe er mit dem andern Kriegßvolck etwann weit für auß/doch nit zu weit/damit er den seinen/so es noth beschehe/wider zu hülff kommen möge/dann verordne er bey seinem hauffen/daß man weidlich mit dem grossen geschütz/auch die handschützen offt vnnd eilends abschiessen/zugleich als ob man ernstlich scharmützelt oder jetzt angriff/vnnd sey mit seinem hauffen in der Ordnung gefasset/so dann die feind in der Statt sollich schiessen hören/so vermeynen sie/es gehe an die Schlacht/vnd ziehen herauß der meynung/den jhren zuhelffen/so sie dann zwischen oder für die versteckte hauffen herauß kommen/brechen dieselbigen hinder/vnnd der Oberst mit seinem hauffen vor den feinden an/schlahen sie/in dem kompt der hinderhalt herfür/daß sie in der flucht nicht wider in die Statt mögen kommen/dann laß von stund an der Oberst alle strassen vnd zugäng zur Statt berennen vnnd verhalten/damit die flüchtigen zerstrewte feind nicht wider in die Statt kommen mögen/So dann also die Statt nicht allein jrs zusatz/sondern auch villeicht vnd ohn zweiffel viel jhrer besten vnnd wehrlichsten Bürger beraubt/so ist die Statt in dem schrecken leichtlich zuerobern/Gott geb wie vest sie auch ist.
  cs: |-
    Potom, za několik hodin ve dne nebo v noci, ať nejvyšší [hejtman] dá v ležení {Läger} náhle bubnovat na poplach a ať se strhne velký křik a hluk; to všechno vzbudí v nepřátelích domněnku o jejich očekávané pomoci. Kolem půlnoci ať hejtman {Hauptmann} znovu dá bubnovat na poplach; za tohoto poplachu ať vytáhne a odtáhne s celým houfem {hauffen}, jízdou i pěšími, se všemi děly, stany a veškerou válečnou výzbrojí, a odtáhne asi na jednu německou míli nepřátelům z očí. Přitom ať stranou skryje několik k tomu vhodných houfů jízdy i pěchoty a také několik lehkých polních děl za lesy nebo kopci, aby je nepřátelé, až vytáhnou z města, nemohli spatřit ani zpozorovat, a s ostatním válečným lidem ať táhne poněkud dál vpřed, ale ne příliš daleko, aby mohl svým lidem v případě nouze zase přispěchat na pomoc. Pak ať u svého houfu nařídí, aby se zostra a často a rychle za sebou pálilo z velkých děl i z ručnic, jako by se vážně potýkalo nebo právě útočilo, a ať stojí se svým houfem sešikován. Když pak nepřátelé ve městě uslyší takovou střelbu, budou se domnívat, že jde o bitvu, a vytáhnou ven v úmyslu pomoci svým; až pak vyjdou mezi skryté houfy nebo před ně, ty na ně udeří zezadu a nejvyšší [hejtman] se svým houfem zepředu a porazí je. Přitom vyrazí záloha, aby se na útěku nemohli dostat zpět do města. Pak ať nejvyšší [hejtman] ihned dá obsadit a zatarasit všechny cesty a přístupy k městu, aby se prchající rozptýlení nepřátelé nemohli vrátit do města. Když je pak město takto připraveno nejen o svou posádku, ale snad a bezpochyby i o mnoho svých nejlepších a nejbojeschopnějších měšťanů, lze je v tom zděšení snadno dobýt, ať je jakkoli pevné.
- typ: nadpis
  uroven: 3
  de: |-
    Ein anschlag ein feind/so mit grosser macht daher zeucht in der eyl zu vberziehen/vnd mit geringer macht zu schlahen.
  cs: |-
    Úskok, jak nepřítele, který přitahuje s velkou mocí, rychle přepadnout a s malou mocí porazit
