id: 056r
list: LVI
strana: recto
sken: 119
stav: zkontrolovano
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    stoltz/spott/zorn oder verachtung üben noch gebrauchen/wie dann das gemeyn Sprichwort lauttet/Es soll niemandt sein Feind verachten/dann zu dem das Gott den Spöttern oder verachtern zuwider ist/so tregt sich es auch gemeynlich zu/daß hierauß ein sörglich leyd erwechst/welches zum offtermal den feinden Thür vnnd Thor zum Sigen auffgethon hat/wachen/fürsehen/sorg haben/nicht verachten gehört einem Kriegsman zu/sonderlich den Hauptleuthen.
  cs: |-
    projevovat ani dávat najevo pýchu, posměch, hněv či pohrdání, jak praví obecné přísloví: Nikdo nemá pohrdat svým nepřítelem. Neboť kromě toho, že se Bůh protiví posměvačům a pohrdačům, obvykle se také stává, že z toho vzejde nebezpečné neštěstí, které nepřátelům už mnohokrát otevřelo dveře i bránu k vítězství. Bdít, předvídat, mít se na pozoru a nepohrdat – to náleží válečníkovi, a zvláště hejtmanům {Hauptleuthen}.
- typ: odstavec
  de: |-
    Zu dem sechsten/Sollen die Kriegßleuth auch bedencken/daß kriegen nit allein dem zu gůtem gereychen soll/von welchem sie besoldet werden/sonder auch sich selbs belangen/sie dienen hierinn nicht allein ihrer Herrschafft die sie bestellt haben/sonder auch ihnen selbs/Derhalben wil einem redlichen Kriegsmann nicht gezimmen oder gebüren in diser sach also zudienen/daß er allein auff sein besoldung sehe vnnd lug wie er bestehe/sonder vil mehr daß er den gemeynen handel trewlich helffe erretten/vnnd sein eygen sach zu gemeyner wolfart.
  cs: |-
    Za šesté: váleční lidé mají také uvážit, že válčení nemá sloužit k dobru jen tomu, od koho dostávají žold, ale týká se i jich samých; neslouží v tom totiž jen své vrchnosti, která je najala, ale i sami sobě. Proto se řádnému válečníkovi nesluší ani nepřísluší sloužit v této věci tak, aby hleděl jen na svůj žold a na to, jak sám obstojí, nýbrž mnohem spíše tak, aby věrně pomáhal zachránit společnou věc a svou vlastní věc [vedl] k obecnému blahu.
- typ: odstavec
  de: |-
    Zum sibenden/Dieweil das ende des Kriegens nicht in vnser macht/auch nicht in des feinds/sonder in Gottes henden steht. Derhalben soll ein Hertzhafftiger vnnd vnuerzagter Christlicher Kriegsmann sich nichts bewegen noch bethawren lassen/es seyen seine Eltern/freund oder feind/auch sein Vatterland/in Summa alle sach/darumb wir angefochten werden/sollen wir alle tag der genaden vnnd güte Gottes/in vnserem gebett inbrünstiglich vnnd mit hertzlichem vertrawen/befelhen/vnnd nicht daran zweiflen/Er der Allmächtig Gott/welcher dann aller vnbilligkeyt vnnd blůtdurstigkeyt ein hasser vnnd feind ist/der beschützt vnnd beschirmpt die seinen die jhn förchten vnnd ehren/im Krieg vnnd Heer eben so wol als an andern orten vnnd enden.
  cs: |-
    Za sedmé: konec války není v naší moci ani v moci nepřítele, nýbrž v rukou Božích. Proto se statečný a neohrožený křesťanský válečník nemá dát ničím zviklat ani zarmoutit, ať jde o jeho rodiče, přátele či nepřátele, nebo i o jeho vlast. Zkrátka všechny věci, pro které jsme sužováni, máme každý den ve své modlitbě vroucně a s upřímnou důvěrou poroučet Boží milosti a dobrotě a nepochybovat, že všemohoucí Bůh, který nenávidí a nepřátelí se s veškerou nespravedlností a krvežíznivostí, chrání a ochraňuje své, kteří se ho bojí a ctí ho, ve válce a ve vojsku stejně jako na jiných místech a koncích.
- typ: odstavec
  de: |-
    Zu dem achten/Sollen die Kriegsleuth ihren Hauptleuthen vnd andern Befelchshabern gehorsamen in allem was nicht wider Gott ist/vnd das nicht allein von wegen der straff/sonder auch auß ein Gottsförchtigen gewissen/Hergegen sollen auch die Hauptleuth den gemeynen Knecht/nicht mütwilliger/sonder billicher notwendiger weiß/zu allem dem/von Ampts wegen ziehen vnd halten/daß dem Allmechtigen gefellig/gemeyner sach fürderlich vnd ersprießlich ist/Es ist nicht wol außzusprechen/was grosser sachen durch die zwey stuck/recht Regiern der Obern/vnnd willigen gehorsam der vnterthanen außgericht werden mögen.
  cs: |-
    Za osmé: váleční lidé mají poslouchat své hejtmany a jiné velitele {Befelchshabern} ve všem, co není proti Bohu, a to nejen kvůli trestu, ale i z bohabojného svědomí. Naproti tomu mají i hejtmani prosté knechty {Knecht} z moci úřadu vést a držet – ne svévolně, nýbrž spravedlivě a jak je nutné – ke všemu, co je milé Všemohoucímu a co obecné věci prospívá a slouží. Ani nelze dobře vyslovit, jak velké věci lze vykonat těmito dvěma věcmi: řádným vládnutím představených a ochotnou poslušností poddaných.
- typ: odstavec
  de: |-
    Es ist der gehorsam nit das kleynest stuck/dardurch der Türck vnd ander Heyden/mit ihrem Kriegßuolck/zu solcher langwirigen bestendigkeyt grosse Krieg geführt/vnd so trefflichen Sieg erobert/daß wol vnd sehr zu bedencken auch zuerwegen ist/daß ein solcher Tyrann ein solchen allgemeynen gehorsam seiner Vnterthanen haben soll/vnnd darneben bey vns Christen viel eygensinnigkeyt gefunden vnnd gebraucht werden/Die vrsach ist/daß bey den höchsten Befelchshabern der betrug vnnd finantz vberhandt genommen/bey den gemeynen vnnd nidrigen oder vnterthanen wie mans nennt/auch keyn zucht noch Erbarkeyt gebraucht wird/Derhalben die Küh wol neben dem Kalb stehn mag.
  cs: |-
    Poslušnost není tou nejmenší věcí, díky níž Turek a jiní pohané vedli se svým válečným lidem tak dlouho a vytrvale velké války a dobyli tak skvělých vítězství. Je věru třeba dobře a důkladně uvážit a rozvážit, že takový tyran má u svých poddaných tak všeobecnou poslušnost, kdežto u nás křesťanů se nachází a projevuje tolik svéhlavosti. Příčinou je, že u nejvyšších velitelů vzaly vrch podvod a finty {finantz}, a u prostých a nízkých, čili poddaných, jak se jim říká, se zase nedodržuje žádná kázeň ani počestnost. Proto může kráva klidně stát vedle telete.[^1]
- typ: odstavec
  de: Zum neundten/Wird auch diß hoch vonnöten sein/daß sich die Kriegßleuth
  cs: |-
    Za deváté: bude také velmi zapotřebí, aby se váleční lidé k sobě navzájem
poznamky:
- n: 1
  text: |-
    Přísloví „die Küh mag wol neben dem Kalb stehn“ – tj. jedni nejsou o nic lepší než druzí; velitelé i mužstvo se sobě vyrovnají.
