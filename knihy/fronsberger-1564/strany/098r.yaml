list: XCVIII
strana: recto
sken: 203
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    wann er auch die gräben/so mit wasser stünden/mit holtz vnd reiß außgefült vnd darein geworffen hett/sol man mit fewrwerck außwerffen/keyn versaumnuß haben/solch holtz vnd reiß anzuzünden/dergleichen in solchem anlauffen des Sturms/sol man außwerffen fewrkolben vnd ballen/fewrkuglen mit schröten/schlegen vnnd schüssen/füß vnd lämeisen/steyn/holtz vnd blöck von der mawr in die gräben werffen vnnd stossen/dergleichen soll man auff/vor/hinden vnd neben der mawr mit Bickeln/ärten vnnd hawen wehren vnd widerstand halten/auch vor allen schüß vnd streitlöchern gůt acht haben/Man soll auch versehen sein mit Jmekörben/Puluer häfen/die außwerffen vnd schütten/vnd sonderlich von den Basteyen vnd Bollwercken/wo mans erreychen mag/allenthalben zuschiessen vnd wehren/auch hagelgeschütz vnd steynbüchssen/auff daß man sich erhelt/mit Ketten vnd schröt laden vnd schiessen.
  cs: |-
    když by také příkopy, v nichž stála voda, vyplnil a zaházel dřívím a klestím, nemá se otálet s vrháním ohňostroje {fewrwerck}, aby se to dříví a klestí zapálilo. Stejně tak se má při takovém náběhu k útoku vrhat ohnivé palice a koule, ohnivé koule s broky, bít a střílet a z hradby do příkopů házet a shazovat nášlapná a mrzačicí železa, kamení, dříví a klády. Rovněž se má na hradbě, před ní, za ní i vedle ní bránit a klást odpor krumpáči, sekerami a motykami a dávat dobrý pozor u všech střílen a bojových otvorů. Mají se také připravit včelí úly[^1] a hrnce s prachem, které se vrhají a vysypávají [na nepřítele], a zvláště z bašt a bolverků {Bollwercken}, kam až lze dostřelit, odevšad střílet a bránit se, také broky a kamenometnými děly, a aby se obránci udrželi, nabíjet a střílet řetězy a sekaným železem.
- typ: odstavec
  de: |-
    So aber der feind vber solche gräben vnd mawr kompt/so můß er erst vber den jnnern graben/der so heymlich gemacht ist/so bald er hinein kompt vnd fellt/sol man das Puluer vnd stro so darinnen zerstrewt vnd zersprengt/anzünden/vnnd darhinder mit einer Schlachtordnung verfaßt sein/vnd zur gegenwehr stehn vnd wehren/so er aber die abtrib vnd jhren vortheyl einnem/sol man auff allen pletzen vnd Märckten inn Schlachtordnungen stehn/Bürger vnd Knecht/Feldgeschütz vnd steynbüchsen bey jhnen haben/dasselb in die gassen richten vnnd den feind wider zu rück treiben/dieweil er nicht gliderweiß/oder in der ordnung kan anlauffen/so er aber in solche flucht getrieben/vnd widerumb abzeucht/sollen die vor auff der Wehr vnd Mawr gestanden/vnd müd seind/abgelößt/vnd die so auff den plätzen/an jhr statt mit behendigkeyt geordnet werden/so aber an vil orten angelauffen vnnd gestürmbt/kan solche verenderung vnd ablösung nicht geschehen/es wer dann gar ein grosse Besatzung.
  cs: |-
    Dostane-li se však nepřítel přes takové příkopy a hradbu, musí ještě přes vnitřní příkop, který byl zhotoven tajně; jakmile do něj vnikne a padá, má se zapálit prach a sláma, které jsou v něm rozházeny a rozptýleny, a za ním má stát připravený bitevní šik {Schlachtordnung}, který se postaví na odpor a brání se. Kdyby však [nepřítel] obránce zahnal a zmocnil se jejich výhodného postavení, mají na všech prostranstvích a tržištích stát v bitevních šicích měšťané i knechti {Knecht}, mít u sebe polní děla a kamenometná děla, namířit je do ulic a zahnat nepřítele zpět, protože ten nemůže útočit v řadách ani v šiku. Když je pak takto zahnán na útěk a stahuje se zpět, mají být ti, kdo předtím stáli na obranných místech a hradbě a jsou unaveni, vystřídáni a na jejich místo mají být rychle postaveni ti z prostranství. Útočí-li se však a vedou-li se útoky na mnoha místech, nemůže k takové výměně a střídání dojít, ledaže by šlo o velmi silnou posádku.
- typ: odstavec
  de: |-
    So in sollichem fewr eingeworffen/wie man pflegt zuthůn/vnnd an vil orten auffgeht/sollen zuuor alle vnwehrliche personen/als Weiber/Kinder/in die gwelb vnd Keller geordnet/vnnd in allen gassen/vor allen heusern wasser/Sand/faul mist/alt Kessel stehn/die verordnete Mann vnd Weib/mit jhren tartschen leschen vnd themmen/auch soll das Puluer an sonderlichen wolverwarten orten stehn/leuth dartzů geordnet werden/daß nicht im thümmel von feinden oder freunden angeht/Zu dem sol es wol verwart vnd verwacht sein/vnd man sich vor mehr anleuffen vnd stürmen besorgen/Darumb soll also in der Ordnung auff den plätzen vnd Wehren ein weil geharret werden/vnnd niemandt abtretten/biß man sicht daß sich der feind zu rühe gesetzt hat.
  cs: |-
    Když se při tom, jak bývá zvykem, vhazuje oheň a na mnoha místech vzplane, mají být předem všechny osoby neschopné boje, jako ženy a děti, umístěny do klenutých místností a sklepů a ve všech ulicích před všemi domy má být připravena voda, písek, shnilý hnůj a staré kotle, a ustanovení muži a ženy mají svými „tarčemi“[^2] hasit a tlumit [oheň]. Také prach {Puluer} má být uložen na zvláštních, dobře zajištěných místech a mají k němu být přiděleni lidé, aby ve zmatku nevzplanul vinou nepřátel ani přátel. Kromě toho má být dobře opatrován a střežen a je třeba se obávat dalších náběhů a útoků. Proto se má v šiku na prostranstvích a obranných místech ještě chvíli setrvat a nikdo nemá odcházet, dokud není vidět, že se nepřítel uložil k odpočinku.
- typ: nadpis
  uroven: 3
  de: Ein anschlag einer Besatzung vor einer Statt.
  cs: Úskok proti posádce, leží-li se před městem
- typ: odstavec
  de: |-
    SO man sich für ein Statt lägert/darinnen ein starcker zusatz ligt/vnnd man die Statt nit erobern vnd gewinnen mag/so mag der Oberst/so vor der Statt ligt/ein solchen anschlag versuchen/Er mach ein verrähterey/also/daß ein Brieff werden zugericht oder zwen vngefehrlich/der gestalt/als wann er von der freund Obersten/oder der freundt Herrschafft were außgangen/des inhalts/daß sie das best thůn/sich ehrlich vnnd Ritterlich wehren/alle noth gedulden/vnd die Statt nit auffgeben wöllen/dann sie in treffenlicher werbung sie zu retten/darumb solten sie
  cs: |-
    Leží-li se před městem, v němž je silná posádka {zusatz}, a nelze-li město dobýt a získat, může nejvyšší [hejtman] {Oberst}, který před městem leží, zkusit takový úskok: ať připraví lest[^3] tak, že se vyhotoví asi jeden nebo dva dopisy, jako by pocházely od nejvyššího [hejtmana] jejich spojenců nebo od spojenecké vrchnosti, toho obsahu, ať vydrží, čestně a rytířsky se brání, snášejí všechnu nouzi a město nevzdávají, neboť [spojenci] usilovně verbují [lid], aby je vysvobodili; proto prý mají být
poznamky:
- n: 1
  text: Jmekörbe (Immenkörbe) – úly se včelami, které se házely na útočníky.
- n: 2
  text: |-
    „tartschen“ – doslova tarče (štíty); zde patrně nějaké hasicí náčiní (plácačky, kožené nádoby). Výraz nejasný.
- n: 3
  text: verrähterey – zde „zrada“ ve smyslu podvržené zprávy, válečné lsti.
