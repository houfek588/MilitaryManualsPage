id: 108r
list: CVIII
strana: recto
sken: 223
stav: zkontrolovano
bloky:
- typ: odstavec
  de: |-
    WJewol Gott durch seine wunderbarliche Rathschleg/etwann auch die fürnembste Fürsten schädiget vnd schlecht/erhelt er doch die entlich am strengsten/so sich seiner heyligen gebott also ernstlich befleissen/daß sie weder durch gewalt/gunst/gelt/liebkosen/trotzen/freundschafft/feindtschafft/list noch betrug/weder zů der rechten noch lincken verwendt werden mögen. Darumb soll ein trewer Fürst in friedes zeiten/durch allen seinen Gerichtszwang/vnpartheyisch Gericht vnnd Recht/vngefälschte gewicht vnd Maß/vnuerwente wahr vnd werschafft/gebürlich gewerb vnnd Käuff/Christliche Gottsdienst/Tugentreiche menschen/zucht/trew/gehorsamkeyt/holdselige gemeyne freundschafft/ståten Landsfried/versicherte strassen/ob allen andern geschefften fürdern/vnd so ferr es müglich ist/auch bey freunden vnd feinden strenglich erhalten/Damit er alßdann/auch in den erschröckenlichsten zufällen sein vnd der seinen seel/leib/ehr vnd gůt/land vnd leuth mit reynem gewissen/in leben vnd sterben getröster hoffnung/durch einen waren Glauben/in den vnüberwindlichen schirm vnsers Allmächtigen Herrn Gotts der Heerzügen ergeben/vnd in allen empörungen/vertrawen/auch gantz gelassen/heymstellen möge/ståter vngezweyfleter zuuersicht/wie starck vnd grausam sein widerparth sey/doch Gott ein vil mechtigerer Sieggeber/aller deren/die erzelter Jurißdiction biß an jhr letzt ende/Ritterlichen beystandt beweisen würden/Dieweil auch die ewig Warheyt Christus nit ohn vrsach sagt/So ein bewapneter Held sein Hoff bewart/stehen all sein haab in sicherer hůt/wann jhn aber ein sterckerer vbervortheyl/so entwer er jm alle seine hoffnung vnd beraub in seiner peut vnd güter/daß er hiemit zumal allen in gemeyn/fürnemlich aber den frommen Oberkeyten ein mannlichen trost inn aller gefärlichkeyt zů der Gottes krafft auch klüglich vorbildet/wie sie in aller jhrer herrligkeyt sich zum höchsten befleissen sollen/allenthalben fried vnnd einigkeyt/auch mit jhres zeitlichen gůts grossem schaden zustifften/den gemeynen nutz zufürdern/jhre Stätt vnd Burgstell vest zubawen/die Felder zuehren/tragheyt vnnd alle weibische wändel/sampt allen weichen vnd vnmannlichen händlen zuwenden/altes vnd newes neydes grollen zuuerhüten/Rotten/spän vnd jrthumb mit bescheydenem mittel/vnnd mit Göttlichem bericht erwägen vnd bethädigen/vnnd mit müglichstem fleiß/nach dem befelch Christi/das blůtdürstig Schwerdt Petri einstecken/Wo aber solches alles nicht helffen/sondern viel argherzige zu seiner dückischen beschedigung bewegen vnd vrsachen würde/mag er alßdann doch vorauß das von Gott befolhen Schwerd der gerechtigkeyt/wie Abraham/Moses/Josue/Judas/Cornelius/Sergius/ja wie die waren Christliche Keyser vnnd Fürsten/mit allen vortheylen zur beschützung seiner Landen/Witwen vnd Weysen/wie hernach folgt/künlich/als wider Gottes vnd der Welt feinde gebrauchen/etc.
  cs: |-
    Ačkoli Bůh ve svých podivuhodných úradcích někdy postihuje a bije i ta nejpřednější knížata, nakonec přece nejpevněji zachovává ty, kdo se o jeho svatá přikázání snaží tak vážně, že je nelze odvrátit napravo ani nalevo – ani násilím, přízní, penězi, lichocením, vzdorem, přátelstvím, nepřátelstvím, lstí, ani podvodem. Proto má věrný kníže v časech míru ve vší své soudní pravomoci {Gerichtszwang} nade všechny ostatní záležitosti podporovat nestranný soud a právo, nefalšované váhy a míry, neporušené zboží a poctivou záruku, náležitou živnost a obchod, křesťanské bohoslužby, ctnostné lidi, kázeň, věrnost, poslušnost, vlídné obecné přátelství, trvalý zemský mír a bezpečné cesty, a pokud je to možné, to vše přísně zachovávat u přátel i nepřátel. Tak bude moci i v těch nejděsivějších příhodách s čistým svědomím, v životě i ve smrti s útěšnou nadějí a skrze pravou víru odevzdat duši, tělo, čest a statky, zemi a lid svůj i svých poddaných pod nepřemožitelnou ochranu našeho všemohoucího Pána Boha zástupů a ve všech bouřích to vše s důvěrou a zcela odevzdaně svěřit Bohu, ve stálé a nepochybné jistotě, že jakkoli silný a krutý je jeho protivník, Bůh je přece mnohem mocnějším dárcem vítězství všem, kdo by výše vylíčenému právnímu řádu {Jurißdiction} až do svého posledního konce rytířsky pomáhali. Vždyť i věčná Pravda, Kristus, ne bez příčiny praví: „Když ozbrojený silák střeží svůj dvůr, je všechen jeho majetek v bezpečí; přemůže-li ho však silnější, odzbrojí ho ve všem, v co doufal, a oloupí ho o kořist i statky.“[^1] Tím dává všem vůbec, především však zbožným vrchnostem, mužnou útěchu v Boží moci v každém nebezpečí a zároveň jim moudře ukazuje, jak mají ve vší své slávě nejvýš usilovat o to, aby všude zakládaly mír a svornost, i za cenu velké škody na svém časném jmění, podporovaly obecný užitek, pevně stavěly svá města a hrady, ctily pole, vystříhaly se lenosti a všeho zženštilého chování i všech změkčilých a nemužných skutků, předcházely staré i nové závisti a zášti, rozbroje, spory a bludy rozvažovaly a urovnávaly mírnými prostředky a Božím naučením a s největší možnou pílí podle Kristova příkazu zasunuly krvežíznivý Petrův meč do pochvy. Kdyby však nic z toho nepomohlo, ale naopak to mnohé zlovolníky podnítilo a zavdalo jim příčinu k úkladnému škození, pak teprve smí, jako Abraham, Mojžíš, Jozue, Juda, Kornélius, Sergius,[^2] ano jako praví křesťanští císařové a knížata, směle použít Bohem svěřený meč spravedlnosti se všemi výhodami k ochraně svých zemí, vdov a sirotků, jak následuje dále, jako proti nepřátelům Boha i světa atd.
poznamky:
- n: 1
  text: |-
    Volně podle Lk 11,21–22. Tisk má „alle seine hoffnung“; v Lutherově překladu bible stojí „seinen Harnisch, darauf er sich verließ“ (jeho zbroj, na niž spoléhal).
- n: 2
  text: |-
    Starozákonní a novozákonní vzory spravedlivých vojevůdců a vojáků: Juda Makabejský, setník Kornélius (Sk 10) a patrně prokonzul Sergius Pavel (Sk 13,7).
