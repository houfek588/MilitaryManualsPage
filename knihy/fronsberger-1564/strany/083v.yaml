id: 083v
list: LXXXIII
strana: verso
sken: 174
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    grimmen zu viel stücken/welliches stück einen erreicht vnnd trifft/das richtet so viel auß/als were einer mit einem Haacken geschossen/die trümmer von den Kuglen mögen nach dem Sturm wider gesucht/auffgelesen vnnd gebraucht werden.
  cs: |-
    zuřivostí na mnoho kusů; koho který kus zasáhne, tomu udělá tolik, jako by byl střelen z hákovnice {Haacken}. Střepiny z koulí lze po útoku {Sturm} zase vyhledat, posbírat a použít.
- typ: odstavec
  de: |-
    Ander dergleichen vil wehrlicher nützer fewrwerck mag man in Besatzungen haben/so die geschickte erfarne Büchsenmeyster wol wissen zumachen/vnnd zubrauchen bericht geben.
  cs: |-
    Mnoho jiných podobných, k obraně účinných a užitečných ohňostrojů {fewrwerck} lze mít v posádkách {Besatzungen}; ty umějí schopní a zkušení puškaři {Büchsenmeyster} dobře udělat a poučit o jejich použití.
- typ: odstavec
  de: |-
    Auff alle wehren soll man grosse hauffen steyn tragen/zur wehr vnter die stürmende feind zuwerffen.
  cs: |-
    Na všechny hradby se mají nanosit velké hromady kamení, aby se jím při obraně házelo mezi útočící nepřátele.
- typ: odstavec
  de: |-
    Item vil gůt Hagelgeschütz vnter die zerschossene Mawren vnnd in die streitwehren gericht/vnter die stürmende abgehn lassen/das verhindert mercklich an stürmen/solches Hagel vnnd ander Geschütz soll nach vortheyl/nach der verstendigen/erfarnen/haupt vnnd befelchsleuth Rath vnnd gůt beduncken angericht werden/also daß die Stück hinder einander/vnnd die hindersten allweg am höchsten stehen/also/daß man nicht zu einem mal alle abschiessen můß/sondern die vordersten am ersten/darnach die andern so höher/darnach die dritten/so noch höher stehn/vbereinander abgeschossen werden/vnnd allwegen drey/vier/oder so viel man am platz haben mag/neben einander gestellet/zu vorderst mit gůten Fässern/Schantzkörben/außgefüllet mit Mist/oder womit man mag/gegen der geschossen Mawren versorget/vnnd gůte tieffe Gräben darhinder gemacht/mit Stroh/dürrem reiß/Holtz vnnd Fewerwerck gefüllt/so der Feind einfall vberhandt wolt nemen/daß dasselbig mit einem darzů gerichten lauffenden Fewer angezündet werden möge.
  cs: |-
    Dále: Mnoho dobrých děl na kartáč {Hagelgeschütz} namířit pod prostřílené zdi a do obranných postavení {streitwehren} a nechat je vypálit do útočících; to útok znatelně ztěžuje. Taková kartáčová i jiná děla {Geschütz} se mají výhodně rozestavit podle rady a dobrého uznání rozumných a zkušených hejtmanů a velitelů, a to tak, aby děla stála za sebou a zadní vždy nejvýše; tak se nemusí vystřelit ze všech najednou, nýbrž se střílí přes sebe: nejprve z předních, potom z druhých, které stojí výše, potom z třetích, které stojí ještě výše. Vždy se jich má postavit tři, čtyři nebo kolik se jich na místo vejde vedle sebe, vpředu chráněných proti prostřílené zdi dobrými sudy a šancovními koši {Schantzkörben} vyplněnými hnojem nebo čímkoli jiným; a za nimi se mají vykopat dobré hluboké příkopy naplněné slámou, suchým chrastím, dřevem a ohňostrojem, aby je bylo možné, kdyby vpád nepřítele začal převládat, zapálit k tomu připraveným běžícím ohněm {lauffenden Fewer}[^1].
- typ: odstavec
  de: |-
    Item es ist auch gůt/daß man zuuor vnnd ehe es zu der Belegerung kompt/ein gůt höltzin Blochhauß mach/von gůten nicht zu grossen Blöchen/die man tragen/heben vnnd legen mag/allein für das Handtgeschütz/das soll fein zusammen gericht/vnnd auffeinander gezeychnet werden/darmit so es vonnöten/man wiß wie es zusammen gefügt werden soll/so man dann anhebt die Besatzung zubeschiessen an dem selbigen orth/darhinder an einem gelegnen ort/mag das Blochhauß fürderlich auffgericht/gůte blinde gräben darhinder vnnd für gemacht werden/so dann die Mawer fellt/vnd der Feind wil zur lucken einstürmen/findt er das Blochhauß/das darzů mit vortheyl gericht/besetzt vnnd verwaret/deß er sich nicht versehen/Solliche Blochheuser sollen dester weniger hoch gemacht sein/darmit man sie auß der Feind Schantz nicht sehen/vnnd mit dem grossen Geschütz schiessen könn/Man mag auch sollicher Blochheuser mehr dann eins/so viel für gůt angesehen wird/haben/vnnd wo man gelegenheyt vnnd platz hat/auffschlagen/solliche Blochheuser mögen zerlegt/an die trückene gelegt/verwaret vnnd viel Jar behalten werden/So dann die Höltzer recht auffeinander gezeychnet/kan mans allwegen zusammen richten.
  cs: |-
    Dále: Je také dobré, aby se předem, dříve než dojde k obležení, zhotovil dobrý dřevěný srub {Blochhauß} z dobrých, ne příliš velkých klád, které lze nosit, zvedat a klást, a to jen proti ručním zbraním. Má být pěkně sestaven a kus po kuse označen, aby se v případě potřeby vědělo, jak ho složit dohromady. Když pak [nepřítel] začne posádku na tom místě ostřelovat, lze srub za ním na vhodném místě rychle postavit a před ním i za ním udělat dobré slepé [skryté] příkopy. Když pak zeď padne a nepřítel chce vtrhnout průlomem, najde srub, výhodně postavený, obsazený a zajištěný, s nímž nepočítal. Takové sruby se mají dělat tím nižší, aby je nebylo vidět z nepřátelské šance {Schantz} a nedalo se do nich střílet z velkých děl. Takových srubů lze mít i více než jeden, kolik se uzná za dobré, a postavit je, kde je k tomu příležitost a místo. Lze je rozebrat, uložit v suchu, uschovat a uchovat mnoho let; jsou-li kusy dřeva správně označeny, lze je kdykoli znovu sestavit.
- typ: odstavec
  de: |-
    Dergleichen möchten auch Blochheuser/so man den kosten darauff gehen lassen wolt/gemacht werden/mit Orgelgeschütz/also so die feind daher fielen/daß
  cs: |-
    Stejně tak by se daly – kdyby se na to chtěly vynaložit náklady – zhotovit sruby s varhanovými děly {Orgelgeschütz}[^2], zařízené tak, aby se, kdyby tudy nepřátelé vtrhli,
poznamky:
- n: 1
  text: |-
    Lauffendes Feuer – zápalná dráha (stopin, prachová stopa), po níž oheň „běží“ k náloži.
- n: 2
  text: |-
    Orgelgeschütz („varhany“) – řada hlavní na společném loži, odpalovaných postupně nebo najednou.
