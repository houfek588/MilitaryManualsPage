stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: nadpis
  uroven: 2
  de: |-
    Folget hernach das Recht wie es die Landtskecht führen mit den langen Spiessen.
  cs: |-
    Následuje právo, jak je lancknechti {Landtskecht} vedou s dlouhými kopími {langen Spiessen}
- typ: obrazek
  soubor: drevorez-153.jpg
  popis: |-
    Dřevořez v oválném rámu zdobeném zbrojí, prapory, bubny, děly a maskarony: v ležení mezi stany stojí lancknechti se vztyčenými dlouhými kopími a prapory a tvoří uličku; v popředí odsouzený s rozpaženýma rukama vstupuje mezi řady, z nichž ho knechti napadají kopími a meči – výkon práva dlouhých kopí.
- typ: odstavec
  de: |-
    ANfencklich wann ein Fürst oder Herr ein hauffen Landßknecht annimpt vnnd befilcht/vnnd gibt das Recht das vbel zustraffen mit den langen Spiessen/So soll der Oberst Feldthauptmann/den der Fürst vber das Regiment Landtsknecht auffwirfft/jhnen fürlassen halten bey einer ordenlichen gemeyn/was recht er mit jnen führen vnnd brauchen werd/vnd ja jhnen anzeygen/daß sich ein jeder vor schaden wöll hüten/dann es muß je einer deß andern straff sein.
  cs: |-
    Předně: když kníže nebo pán přijme houf lancknechtů {Landßknecht}, svěří jim úkol a dá jim právo trestat zlé činy dlouhými kopími {langen Spiessen}, má nejvyšší polní hejtman {Oberst Feldthauptmann}, kterého kníže ustanoví nad plukem {Regiment} lancknechtů, dát jim na řádném shromáždění obce {gemeyn} předložit, jaké právo s nimi povede a jakého užije, a výslovně jim oznámit, ať se každý chrání škody, neboť jeden musí být trestem druhého.
- typ: odstavec
  de: |-
    Darauff soll er jhnen auch den Artickels Brieff verlesen lassen/was das recht vermag/daß sich ein jeder wiß darnach zubewaren/darauff soll ein freye mär gemacht werden/solchs recht zustercken vnd anzuziehen.
  cs: |-
    Nato jim má také dát přečíst artikulní list {Artickels Brieff}, co to právo obnáší, aby se každý věděl podle toho chránit; potom se má vyhlásit svobodné hlasování {freye mär}[^1], aby se takové právo potvrdilo a přijalo.
- typ: odstavec
  de: |-
    Zum andern/sollen sie ein Eydt zu Gott vnd seinen Heyligen thůn/groß vnnd
  cs: 'Za druhé: mají při Bohu a jeho svatých přísahat {Eydt}, velcí i'
poznamky:
- n: 1
  text: |-
    Mär (Mehr) – hlasování obce zvednutím rukou, kde rozhoduje většina („mehr“); šikovatel ho vyhlašuje slovy „Mach ein mär“ (srov. dále).
