id: 066v
list: LXVI
strana: verso
sken: 140
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    stundenan darauff gemüstert/vnd auch gelt auff die hand geben werden. Were aber daß ein Sturm oder Schlacht sich vngefährlich/vnd ohn offentlich/darzů durch die Heroldt/Trometer oder Trommenschlager auß befelch des Obersten Feldthauptmanns geheyß vnnd erfordern zůtragen/vnd dieselbig schon erobert vnnd gewunnen würd/es were inn was weg es wölle/so soll vnnd wird euch N. vnser Gnediger Herr dauon zuthůn weitters nichts schuldig sein/Jhr solt auch N. vnsern Gnedigen Herren darbey bleiben lassen/vnd weiter nicht anfordern/hierinn alle gefährde hindan gesetzt vnd außgeschlossen.
  cs: |-
    být hned nato znovu přehlédnuti {gemüstert} a dostat peníze na ruku. Kdyby se však útok nebo bitva přihodily nahodile, a ne veřejně z rozkazu, příkazu a vyzvání nejvyššího polního hejtmana {Obersten Feldthauptmanns} skrze herolda {Heroldt}, trubače {Trometer} nebo bubeníka, a byly by i dobyty a vyhrány, ať by to bylo jakýmkoli způsobem, nebude vám a nemá vám za to N., náš milostivý pán, nic dalšího povinen; a máte to N., našemu milostivému pánu, tak ponechat a nic dalšího nepožadovat, přičemž se tu vylučuje a odkládá každá zlá lest.
- typ: odstavec
  de: |-
    Item were/daß jhr samenthafftig oder mit eintzigen Fändlin oder Rottenweiß in Besatzungen gelegt vnnd gebraucht würden/das solt jr euch keynes wegs weygern oder zuthůn widern/Alßdann so bald der Feindt für euch kompt/vnd anfacht die Besatzung mit schiessen/graben/oder in ander weg zum Sturm zunöten/vnnd alßbald daruon nicht abzög/soll euch zimlich liferung nachdem es die Besatzung vermag/gereycht/vnd mitgetheylt/oder jedem des Monats N. Gülden/welches dem Kriegßherrn oder seinen verwaltern/vnnd fürgesetzten Obersten gefällig/darfür geben werden/vnnd soll nicht dester weniger so man die Profandt gibt/die Besoldung fürgehn/Were aber daß man das Gelt darfür gebe/sollen jhr alle Profandt wie die getaxiert/bezalen/sie soll euch auch vmb zimlichen werth getaxiert vnnd mitgetheylt werden.
  cs: |-
    Dále: kdybyste byli všichni pospolu nebo po jednotlivých praporcích {Fändlin} či po rotách {Rotten} rozloženi a užiti v posádkách {Besatzungen}, nemáte se tomu nijak vzpírat ani zdráhat to učinit. Jakmile pak nepřítel přitáhne před vás a začne posádku tísnit k útoku střelbou, kopáním nebo jinak a hned od ní neodtáhne, má se vám podávat a rozdělovat přiměřený příděl, podle toho, co posádka zmůže, anebo má být každému místo toho dáváno N. zlatých {Gülden} měsíčně, jak se to bude líbit válečnému pánu {Kriegßherrn} nebo jeho správcům a představeným plukovníkům; a když se dává proviant {Profandt}, má žold {Besoldung} přesto běžet dál. Kdyby se však místo toho dávaly peníze, máte veškerý proviant zaplatit, jak je taxován; má vám však být taxován a vydáván za přiměřenou cenu.
- typ: odstavec
  de: |-
    Item geschehe aber/daß die Feind an der Besatzung mit macht einen offentlichen fürgenommen außgerüfften vnd verordenten Sturm ein oder mehr thůn würden/vnd jhr den Sturm vnnd die Besatzung erhalten/so lang biß der Feind vor euch abzeucht/So soll euch so in der Besatzung gelegen/jedem ein Monat Sold gegeben/vnd zu verehrung mitgetheylt werden/sonst soll man euch weiters nichts zuthůn sein/vnd hierinn alle gefährde außgedingt.
  cs: |-
    Dále: kdyby se však stalo, že by nepřítel na posádku vší mocí podnikl jeden nebo více veřejných, zamýšlených, vyhlášených a nařízených útoků a vy byste útok odrazili a posádku udrželi tak dlouho, dokud nepřítel od vás neodtáhne, pak má být každému z vás, kdo v posádce ležel, dán a jako odměna {verehrung} vyplacen jeden měsíční žold {Sold}; jinak se vám nemá dávat nic dalšího, přičemž se tu vylučuje každá zlá lest.
- typ: odstavec
  de: |-
    Kindtbetterin/Schwanger frawen/Junckfrawen/alte erlebte Leuth/Kinder/vnd was zu seinen mannbaren jaren nicht kommen/Priester/so zu den Pfarrkirchen gehörig/soferr sie sich zur gegenwehr nit stellen/Jetzt gemelte personen sollen gefreyt/vnd an leib noch leben nicht verletzt werden/vnnd wo man mit dem Läger ligen würde/oder am ziehen an ein ort käme/da Pfarkirchen weren/soll sich keyner in die Kirchen lägern/oder darinnen schaden thůn/wer darwider thet/soll am leib gestrafft werden.
  cs: |-
    Šestinedělky, těhotné ženy, panny, staří sešlí lidé, děti a kdo ještě nedospěl, kněží, kteří patří k farním kostelům, pokud se nestaví na odpor: tyto právě jmenované osoby mají požívat ochrany a nemají být poškozeny na těle ani na životě. A kde by se stálo ležením {Läger} nebo kde by se na tažení přišlo na místo s farními kostely, nemá se nikdo v kostele ukládat ani v něm škodit; kdo by jednal proti tomu, má být potrestán na těle.
- typ: odstavec
  de: |-
    Item wo es sich begebe/daß man in Stätten oder Flecken ligen würde/soll keyner dem andern in sein Herberg oder Losament fallen wider sein willen/darauß haußrath/Brot/wein/oder anders zuentwenden noch tragen/welcher das nicht thet/sonder vbertrete/vnnd darüber begriffen würde/der soll an ehren/vnnd am leib gestrafft werden.
  cs: |-
    Dále: kdyby se stalo, že by se leželo ve městech nebo městečkách, nemá nikdo jinému proti jeho vůli vpadnout do jeho hospody či ubytování {Losament} a odcizovat nebo odnášet odtamtud nářadí, chléb, víno nebo cokoli jiného. Kdo by tak nejednal, nýbrž to přestoupil a byl při tom přistižen, má být potrestán na cti i na těle.
- typ: odstavec
  de: |-
    Item es soll auch keyner bey leibstraff/Wein/Korn/Mähl/vnd was zu gemeynem hauffen vnd wolfart gehört vnd dienstlich ist/mütwilliger weiß außlauffen oder verderben lassen/vnd zu schanden bringen.
  cs: |-
    Dále nikdo nemá pod trestem na těle svévolně vypouštět nebo nechávat zkazit a přivádět vniveč víno, obilí, mouku a cokoli, co náleží celému houfu {hauffen} a slouží k jeho blahu.
- typ: odstavec
  de: |-
    Es soll keyner gegen dem andern/keyn alten neid oder haß rechen/den andern
  cs: Nikdo nemá vůči druhému mstít starou závist nebo nenávist, druhého
