stav: zkontrolovano
bloky:
- typ: odstavec
  de: |-
    Wiewol bey den alten gebreuchlich gewesen/daß sie jhre Schlachtordnungen gespitzt/oder in dreyangel gemacht haben/also daß etwann im ersten glid siben Mann/im anderen acht/im dritten neun/im vierdten zehen/also fort an/biß auff den halben theyl der Ordnung vnnd hauffen/darnach seind sie durchauß geuiert gemacht worden/vnd jre Fanen oder Paner eingefürt/wie gebreuchlich
  cs: |-
    Ačkoli bývalo u starých zvykem stavět bitevní šiky {Schlachtordnungen} do špice čili do trojúhelníku, takže v první řadě {glid} bylo třeba sedm mužů, ve druhé osm, ve třetí devět, ve čtvrté deset a tak dále až do poloviny šiku a houfu; odtud byly stavěny zcela čtvercově a byly do nich zařazeny jejich korouhve {Fanen} či prapory {Paner}, jak bylo zvykem.
- typ: odstavec
  de: |-
    Dergleichen seind solche Ordnungen noch auff ein andern weg zumachen/also daß im ersten glid etwann neun Mann/im anderen eilff/im dritten dreitzehen/also fortan biß auff den halben theyl hinein/die Ordnung hernach durchauß geuiert/vnd jhre Fanen vnnd Paner eingefürt vnnd geordnet/wie vorgemelt/wiewol solcher gebrauch nimmer/sondern werden auch fast geuiert wie der Fůßknecht Ordnung gemacht.
  cs: |-
    Takové šiky lze stavět ještě jiným způsobem, totiž tak, že v první řadě je třeba devět mužů, ve druhé jedenáct, ve třetí třináct a tak dále až do poloviny; dále je šik zcela čtvercový a korouhve a prapory se do něj zařadí a rozmístí, jak bylo řečeno výše. Tento zvyk se však už neužívá, nýbrž [jízdní šiky] se rovněž stavějí téměř čtvercové jako šik pěších knechtů {Fůßknecht}.
