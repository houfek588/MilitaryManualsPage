poznamky:
- n: 1
  text: |-
    Fronsperger hledá největší čtverec, který lze z daného počtu mužů postavit: kolik mužů v řadě, tolik řad; zbylí muži se zařadí jinam. Všechny údaje na této a následujících stranách byly přepočítány (např. 26 × 26 = 676, 700 − 676 = 24). Zde tisk uvádí 109 mužů, ale 10 × 10 = 100 a „vyjde to přesně“ platí jen pro 100; při 109 mužích by zbylo 9.
- n: 2
  text: |-
    Početně správně (19 × 19 = 361, 361 + 39 = 400), ale 400 = 20 × 20, takže šik by vyšel přesně po 20 mužích v řadě. U 650 mužů tisk chybně uvádí 28 v řadě (28 × 28 = 784); správně 25 × 25 = 625, zbývá 25.
