- typ: odstavec
  pokracovani: true
  de: |-
    vnuersönlichen abgesagten feind/mit weisen Rathsgenossen von vnuersehenlichen Kriegßfällen Rathschlagen/seinen endlichen bedacht vnd fürsatz in sein hertz beschliessen/denselben erst zu gelegner zeit/ort/noth/eröffnen/in allen dingen niemand/jm selbs auch nit zuuiel ohn sicherheyt vertrawen/betrug zuuerhüten/der feind gelend/berg/thal/hole weg/klausen/bürg/stett/ebne/weld/feldt/heg/gesteud/see/flüß/lachen/moß/brunnen/bäch/gräben/pfäd/strassen/arth/natur/breuch/gewonheyten/kleyder/wehr/rath/dück/weiß/gebärd/macht/schwachheyt/in fried vnd krieg/sich nach sollichem zurichten/weißlich erspähen/vnnd möchts ohn leibs gefärd geschehen/selbs augenscheinlich besichtigen/Aller ämpter vnd Regiment/Reysiger vnnd Fůßknecht/auch aller gewerb thůn vnnd lassen/tag vnnd nacht in eygner oder in still vertrawter leuth person erkündigen/auch offt die gemeyn heymlich wider die Beuelchsleuth/vnd hinwider die Amptleuth wider den gemeynen mann rechtfertigen vnd freundtlich hören/vnd nach wahr erfahrner that/ohn Barmhertzigkeyt in beyder gegenwertigkeyt/vnpartheyisch straffen/vil heymliche arglistigkeyt zuuernemen vnd zuwenden/Allen in gemeyn vätterlich zusprechen/den minsten nicht weniger schützen dann den meysten/dieweil er offtmals nützlicher sein mag in gefährligkeyt dann jhener/mehr nach freundschafft werben dann nach gůt/dapffer vnd thewr in worten/gelübden vnd Eyden/Der billigkeyt allzeit acht haben/seinem gerechten fürnemen also trutzlich nachkommen/vnd dem vngerechten also streng widerstehn/daß er ehe sterb dann abstehe/gastfrey vnd gabreich sey/Der armen bitt vnnd klag senfftmütig hören/rechtlich vrtheylen/vnnd zum gnediglichsten geweren/alles das zu weichmütigkeyt reytzet/hassen/nüchtern/bescheyden/keusch/besinnt/vnd allen falschen kläffern vnd schmeychlerischen ohrenblasern feind sein/Jnn Summa sich zu scheinlichem vorbild der freunde vnnd feinde halten/selbs allweg zum fordersten sehen lassen/in hitz/frost/hunger/durst/lieb/leyd/zügen/wachten/scharmützen/stürmen/schlachten/sieg/vnd fried/Bey solchem Obersten mag nichts so grausams noch gefährlichs verlauffen/das sein hellen hauffen verdrüßlich/gewinnlich oder abscheuchlich mache/zugleich als ein Kirchweihe oder reiche peut zůachten/zu bestreitten vnd zubegeren/sie dann ein jeder begert vor seinem Herrn Ritterlichen zuhandlen.
  cs: |-
    neusmiřitelnému, zapřisáhlému nepříteli s moudrými rádci rokovat o nepředvídaných válečných případech, své konečné rozhodnutí a záměr uzavřít ve svém srdci a odhalit je teprve v příhodný čas, na příhodném místě a v nouzi. V ničem nemá nikomu, ani sám sobě, příliš důvěřovat bez jistoty, aby se uchránil podvodu. Má moudře vyzvídat nepřátelskou krajinu, hory, údolí, úvozy, soutěsky, hrady, města, roviny, lesy, pole, ohrady, křoviny, jezera, řeky, kaluže, močály, studny, potoky, příkopy, stezky a cesty, [a také nepřátelskou] povahu, přirozenost, obyčeje, zvyky, oděv, zbraně, rady, úskoky, způsoby, chování, moc i slabost v míru i ve válce, aby se podle toho zařídil; a dá-li se to učinit bez nebezpečí života, má to sám na vlastní oči prohlédnout. Má ve dne v noci osobně nebo skrze tiché důvěryhodné lidi zjišťovat počínání všech úřadů a pluků, jízdy {Reysiger} i pěchoty {Fůßknecht} a vůbec všechno konání i nekonání. Často má také potají vyslýchat a vlídně slyšet obec {gemeyn} proti velitelům {Beuelchsleuth} a zase úředníky proti prostému muži, a když zjistí, jak se věc skutečně stala, má v přítomnosti obou stran bez milosrdenství a nestranně trestat, aby postřehl a odvrátil mnohou skrytou zlovůli. Ke všem vůbec má otcovsky promlouvat a nejmenšího chránit neméně než největšího, neboť ten může být v nebezpečí často užitečnější než onen. Má se víc ucházet o přátelství než o statky, být pevný a spolehlivý ve slovech, slibech a přísahách, vždy dbát na spravedlnost, svému spravedlivému předsevzetí tak neochvějně dostát a nespravedlivému tak přísně odporovat, že by raději zemřel, než ustoupil. Má být pohostinný a štědrý, prosby a stížnosti chudých vlídně vyslechnout, spravedlivě soudit a co nejmilostivěji jim vyhovět, nenávidět všechno, co svádí ke změkčilosti, být střízlivý, skromný, cudný a rozvážný a být nepřítelem všech falešných pomlouvačů a podlízavých našeptávačů. Zkrátka má být zřetelným vzorem přátelům i nepřátelům a sám se vždy ukazovat v čele: ve vedru, mrazu, hladu, žízni, v radosti i žalu, na taženích, strážích, v šarvátkách, útocích, bitvách, ve vítězství i v míru. U takového nejvyššího [velitele] se nemůže přihodit nic tak hrozného ani nebezpečného, co by jeho celému houfu {hellen hauffen} bylo protivné, hrozné či odpudivé; naopak to bude pokládat za posvícení nebo bohatou kořist, o niž je třeba bojovat a po níž je třeba toužit, neboť každý touží před svým pánem jednat rytířsky.
- typ: nadpis
  uroven: 2
  de: Amptleuth.
  cs: Úředníci
- typ: odstavec
  de: |-
    SO sollen auch alle Beuelchsleuth/Regiment/Herren/Pfenningmeyster/Oberster Trückfäß/Oberster Schultheyß/Oberster Profoß/Hauptleuth/Feldweybel/Quartiermeyster/Prouandmeyster/Wachtmeyster/Musterschreiber/Feldschreiber/Fänderich/Fürer/Weybel/Fürier/Zeugmeyster/Grabmeyster/Büchsenmeyster/Leuthenannten/Toppelsöldner/sampt allen andern verwandten befelchen/jhrer gewöhnlichen ämpter alle augenblick/nach ernstem befelch vnd geheyß jhres Fürsten außwarten/mit vnuermeidlicher straff die vbertretter ernstlich vor künfftiger gefahr/so auß jhrer hinlessigkeyt entspringt/nicht weniger dann der gemeyn mann angehalten werden/sie sollen auch jhrem Fürsten änlich sein/trew vnd fromb/wie ob angezeygt/vnd damit sie nichts wagen ohn erwegung/so tringt Kriegßnoth daß sie auch weder mit trunckenheyt/noch hůrerey/weder mit geitz/hoffart noch vbermuth/betrug vnnd mit dergleichen vntugend/weder in worten/wercken/gebärden/noch in anderer weiß bethört/sonder strenge hasser seyen aller deren laster/die wackere vnd Rittermässige mannshertzen weich/feyg vnd laß machen.
  cs: |-
    Stejně tak mají všichni velitelé {Beuelchsleuth}, plukovní páni {Regiment/Herren}, pokladníci {Pfenningmeyster}, nejvyšší stolník {Oberster Trückfäß},[^1] nejvyšší rychtář {Oberster Schultheyß}, nejvyšší profous {Oberster Profoß}, hejtmani {Hauptleuth}, šikovatelé {Feldweybel}, kvartýrmistři {Quartiermeyster}, proviantmistři {Prouandmeyster}, vachmistři {Wachtmeyster}, přehlídkoví písaři {Musterschreiber}, polní písaři, praporečníci {Fänderich}, vůdci {Fürer}, šikovatelé {Weybel}, furýři {Fürier}, zbrojmistři {Zeugmeyster}, mistři příkopů {Grabmeyster}, puškaři {Büchsenmeyster}, poručíci {Leuthenannten}, dvojžoldnéři {Toppelsöldner} i všichni ostatní příslušní velitelé každou chvíli podle přísného rozkazu a příkazu svého knížete zastávat své obvyklé úřady; přestupníci mají být neodvratným trestem přísně přidržováni [k povinnosti] kvůli budoucímu nebezpečí, které vzniká z jejich nedbalosti, neméně než prostý muž. Mají být také podobni svému knížeti, věrní a řádní, jak bylo výše ukázáno; a aby nic nepodnikali bez uvážení, vyžaduje válečná nouze, aby se nedali poblouznit opilstvím ani smilstvem, lakotou, pýchou ani zpupností, podvodem a podobnými nectnostmi, ať slovy, skutky, chováním nebo jinak, nýbrž aby byli přísnými nepřáteli všech neřestí, které statečná a rytířská mužská srdce činí změkčilými, zbabělými a malátnými.
poznamky:
- n: 1
  text: |-
    Truchsess – dvorský úředník (stolník), který řídí zásobování knížecí kuchyně a tabule; v poli nejvyšší stolník zodpovídal za stravování velitelova dvora.
