id: 105v
list: CV
strana: verso
sken: 218
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: verse
  pokracovani: true
  de:
  - Dir ist nit vmb ein Schlacht gethan/
  - Du magst jhr mehr dann eine erstahn/
  - Würdst aber du vmbkommen/sterben/
  - Wer mancher land vnd leuth verderben.
  - Keyn ehr kompt auß zvil freydigkeyt/
  - Man achts wol ehe für doll künheyt.
  - An Fürsten vil vnd groß ist glegen/
  - Sollen sich nicht leichtlich verwegen/
  - Jhren leib wagen in fehrlichheyt/
  - Dann drauß kompt grosse noth vnd leid.
  - Ob dein feind wich oder würd flihen/
  - Mit gůter Ordnung laß nachziehen.
  - Nit laß dein volck vnd Ordnung trennen.
  - 'Laß nur ettlich hauffen nach rennen:'
  - Ob sich würden widerkehrn/
  - Daß du dich mögst ohn schaden wehrn.
  - Ob sichs dann nun also begeb/
  - Daß dein feind stercker zfelde leg/
  - Vnd du der Schlacht mögst han nachtheyl/
  - Schem dich nit fürkommen vnheyl.
  - Zeuch wider zurück an gwisse stell/
  - Es sag gleich jeder was er wöll.
  - Nit wags leichtlich durch rhum noch zorn/
  - Biß bdacht/was heut nit ist/gschech morn/
  - Vnd magst du zruck nicht widerkehrn/
  - So denck wie dich sunst mögst erwehrn.
  - Vergrab/verzeun/brauch alt vnd jung/
  - Biß dir kompt rettung/entschüttung.
  - Darzu die Wagenburg wern gůt/
  - Die man vor zeitten hett in hůt.
  - Wer mit vernunfft ein vortheyl kan/
  - Halt für ein geübten Kriegs Hauptmann.
  - Jst mancherley vortheyl im Feld/
  - Richt vnd halt dich darnach dirs felt.
  - Man räth nicht all ding vor der zeit/
  - Můß auch thůn darnach sichs begeit.
  - Es ist nit gůt zu langer rath/
  - Man kompt zu zeitten vil zu spat.
  cs:
  - Nejde ti o jedinou bitvu,
  - můžeš jich vybojovat víc než jednu.
  - Kdybys však ty zahynul a zemřel,
  - byla by to zkáza mnoha zemí i lidí.
  - Z přílišné smělosti nevzejde žádná čest,
  - spíš se to pokládá za bláznivou opovážlivost.
  - Na knížatech mnoho a velmi záleží,
  - nemají se proto lehkovážně odvažovat
  - a vydávat své tělo v nebezpečí,
  - neboť z toho vzejde velká nouze a strast.
  - Kdyby tvůj nepřítel ustupoval nebo se dal na útěk,
  - nech jej pronásledovat v dobrém šiku.
  - Nedovol, aby se tvůj lid a šik rozdělil,
  - nech za ním hnát jen několik houfů,
  - kdyby se [nepřátelé] obrátili zpět,
  - aby ses mohl bez škody ubránit.
  - Kdyby se pak stalo,
  - že by tvůj nepřítel stál v poli silnější
  - a ty bys mohl v bitvě utrpět porážku,
  - nestyď se předejít neštěstí.
  - Stáhni se zpět na bezpečné místo,
  - ať si každý říká, co chce.
  - Neriskuj lehkovážně z touhy po slávě ani z hněvu,
  - 'buď rozvážný: co není dnes, stane se zítra.'
  - A nemůžeš-li ustoupit zpět,
  - pomysli, jak by ses jinak ubránil.
  - Zakopej se, ohraď se, využij staré i mladé,
  - dokud ti nepřijde pomoc a vyproštění.
  - K tomu by byly dobré vozové hradby {Wagenburg},
  - jaké se kdysi mívaly na ochranu.
  - Kdo dovede s rozumem využít výhody,
  - toho měj za zkušeného válečného hejtmana.
  - V poli je výhoda rozličná,
  - zařiď se a drž se podle toho, jak ti padne.
  - Ne všechno se dá uradit předem,
  - musí se také jednat podle toho, jak se věci seběhnou.
  - Není dobré příliš dlouho rokovat,
  - leckdy se pak přijde příliš pozdě.
