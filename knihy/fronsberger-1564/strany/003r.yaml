bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    reicher/vermöglicher Mann/der bey andern ämptern vnter jm/auch allem Kriegßuolck bey menigklichen/auch bey den Feinden seines Standts vnnd dapfferkeyt halben ein ansehen/gehorsame vnd forcht habe.
  cs: |-
    bohatý a zámožný muž, který by pro svůj stav a udatnost měl vážnost, poslušnost a respekt u ostatních úřadů pod sebou i u veškerého válečného lidu, u každého, ba i u nepřátel.
- typ: odstavec
  de: |-
    Darzů were gůt/daß er des Kriegßherren naher vnd geborner Freund/Landsäß oder Lehenmann/auch desselbigen Vatterlands were/ein mässiger/nüchtern/leidlich in aller arbeyt/scharpffer vernunfft/nicht geitzig/nicht vnkeusch/nicht zu jung noch zu alt/deßgleichen auch wol beredt sey/damit er nicht geneygt/die sorg der großmechtigen vnd dapffern sachen der Kriegßhändel zuuerlassen/Er soll auch bedächtig vnd nicht gach sein/vnd sich wol enthalten vor zorn/dann wo die vnsinnigkeyt eines Manns vberhand nimpt/daß einer jhm nichts wil wehren lassen/macht jhn verhasset/darzů gebürt jhm nüchterkeyt/daß er den großwichtigen sachen obligen möge/dann offt nachts in der rhůe mögen die rath vnd anschläg des Hauptmans mit gůter betrachtung erwogen/vnd dester baß bestettigt werden/dann offt durch die zeit/so etwann die Hauptleuth in wollust/fressen/sauffen/hingebracht vnnd verzeret/zu grossem vnwiderbringlichen schaden vnd nachtheyl vrsach geben ist worden.
  cs: |-
    Kromě toho by bylo dobré, aby byl blízkým a pokrevním přítelem válečného pána {Kriegßherren}, jeho zemanem {Landsäß} či leníkem a pocházel z téže vlasti; aby byl střídmý, střízlivý, vytrvalý v každé námaze, bystrého rozumu, nelakomý, necudností neposkvrněný, ani příliš mladý, ani příliš starý, a také dobře výmluvný, aby nebyl nakloněn zanedbávat péči o velké a závažné válečné věci. Má být také rozvážný, nikoli zbrklý, a má se dobře chránit hněvu; neboť když v muži převládne nerozum, takže si nedá v ničem zabránit, stane se nenáviděným. Dále mu náleží střízlivost, aby se mohl věnovat nanejvýš důležitým věcem: často totiž lze v nočním klidu rady a plány hejtmana {Hauptmans} s dobrou rozvahou zvážit a tím lépe utvrdit; vždyť čas, který hejtmani leckdy promrhali v rozkoších, obžerství a pitkách, byl často příčinou velké a nenapravitelné škody a újmy.
- typ: odstavec
  de: |-
    So gehört auch gedult der arbeyt/zůuoran dem Obersten General Hauptmann/dann er soll vnter der Ritterlichen arbeyt der letzt müd sein/Er soll auch sein scharpffer/begreifflicher/vnd bald verstendiger vernunfft/vogelschnell/vnnd alle ding durchlauffen/vnd zůfallende oder künfftige sachen zubedencken/von allen orthen zubesinnen geflissen sein/dann wo sich ein zůfall schnell begibt/wird der Hauptmann zu eilendem rathschlag genötigt vnd getrungen/Er soll auch sein Heer vnd Kriegßuolck/vnnd die Summa der sachen nicht gering achten/liederlich in die schantz schlagen/auff gerath wol dem vngetrewen glück vertrawen noch befelhen/Er soll nicht geitzig sein/dann das ist der fördersten eins/welcher eygen nutz nicht ansicht vnd beuor helt/der ist am aller geschicktsten vnnd tauglichsten grosse treffliche sachen zuhandlen/Er soll auch nicht zu jung noch zu alt sein/dann der jung zu viel mißgläubig/der alt zu schwach vnd verdrossen/Der jung ist darumb zuuerwerffen/damit er nit durch sein jugent/vnerfahrenheyt vnnd schnelle thorheyt jrre/vnnd sein Volck in noth bringe/Der alt ist seines schwachen bloden vnuermöglichen alters halben/durch das er in allem gůtem verjrrt vnd verhindert werden mag/zuuermeyden/Aber der mittelmässigs alters ist zuerwehlen/dann er hat vernunfft/krafft vnd stercke/die jhme durch das alter nicht zerstrewet noch benommen/vnnd ist die fürsichtigkeyt in dem der nicht zu jung ist/dann wo stercke vnd krafft ohn weißheyt/vnnd die weißheyt der krafft als seiner Diener beraubt ist/mag nicht gelobet werden/dann sie seind beyde sörglich vnnd nachtheylig/Welcher aber in stercke vnnd weißheyt bewerth ist/der mag zu allen dingen nutz werden/denselbigen haben alle Vnterthanen gemeynlich lieb/besonder wo er eines freien vnd willigen gemüths ist/Sie seind jhme auch gehorsam/glauben jhme was er jhnen sagt/in was gefährligkeyt er sich begibt/helffen sie jhm. Es soll auch ein Oberster Hauptmann gespräch vnd wol beredt sein/in vilen Büchern belesen/dann so er vil liset/erfehrt er vil/besonder im Tito Liuio/wie die alten Römer nach ehren gekriegt haben/dann darauß mag den Kriegßsachen grosser nutz entspringen/dann ein beredter Oberster Hauptmann mag das Kriegßuolck bereden/alle gefährligkeyt ring vnd gar zuuerachten/mehr dann keyn Instrument der Trometen/der Trommen oder Pfeiffen/dann an der wolred vil gelegen/Jetzt můß man das Kriegßuolck
  cs: |-
    K úřadu patří také trpělivost v námaze, a to především u nejvyššího polního hejtmana {Obersten General Hauptmann}, neboť on má být při rytířské práci poslední, kdo se unaví. Má být také bystrého, chápavého a pohotového rozumu, rychlý jako pták, má všechno probírat, uvažovat o nahodilých i budoucích věcech a pilně je promýšlet ze všech stran; neboť když se náhle něco přihodí, je hejtman nucen a tlačen k rychlému rozhodnutí. Své vojsko a válečný lid ani podstatu celé věci nemá podceňovat, lehkomyslně je vydávat v sázku ani je nazdařbůh svěřovat a přenechávat nevěrné štěstěně. Nemá být lakomý, neboť to je jedna z nejpřednějších věcí: kdo nehledí na vlastní prospěch a nehrabe pro sebe, ten je ze všech nejzpůsobilejší a nejschopnější jednat o velkých a významných věcech. Nemá být ani příliš mladý, ani příliš starý, neboť mladý je příliš nedůvěřivý, starý příliš slabý a malátný. Mladého je třeba zavrhnout proto, aby pro své mládí, nezkušenost a ukvapenou pošetilost nechyboval a nepřivedl svůj lid do nouze; starému se je třeba vyhnout pro jeho slabý, nemohoucí a neschopný věk, pro který může být ve všem dobrém zmaten a zdržován. Volit se má muž středního věku, neboť ten má rozum, sílu i zdatnost, které mu stáří ještě nerozptýlilo ani neodňalo; a prozíravost je v tom, kdo není příliš mladý. Kde je totiž síla a moc bez moudrosti a kde je moudrost zbavena síly jakožto svého služebníka, to nelze chválit, neboť obojí je nebezpečné a škodlivé. Kdo se však osvědčil v síle i moudrosti, ten může být užitečný ke všemu; takového mají všichni poddaní obecně rádi, zvláště je-li šlechetné a ochotné mysli. Jsou mu také poslušni, věří tomu, co jim řekne, a v jakémkoli nebezpečí, do něhož se pustí, mu pomáhají. Nejvyšší hejtman má být také hovorný a dobře výmluvný a sečtělý v mnoha knihách – neboť kdo mnoho čte, mnoho se dozví – zvláště v Titu Liviovi {Tito Liuio}, jak staří Římané válčili pro čest; z toho totiž může válečným věcem vzejít velký užitek. Výmluvný nejvyšší hejtman totiž dokáže válečný lid přimět, aby každé nebezpečí pokládal za lehké a zcela jím pohrdal, víc než jakýkoli nástroj, ať trubky, bubny či píšťaly; na výmluvnosti totiž mnoho záleží. Hned je třeba válečný lid
