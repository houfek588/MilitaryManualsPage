bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    fragt/wann er angreiffen wölt/sagt jm/Wie förchst du daß du allein den lärmen nicht hörest? Der König Eumenes wie jhm verkundtschafft ward/daß der fürtreflich Hauptmann Craterus/welchen seine Knecht vmb seiner vortheyligen redligkeyt etlicher maß forchten/mit gerüster Schlachtordnung auff jhn rücket/verwaret er den kundtschaffter/vnnd verschwieg die mär also füglich: Er sagt zum hellen hauffen/es kem sein Feind Neoptolemus/welchen er als ein vnuerstendigen dollen Hauptmann gar verächtlich hielt/Da truckten jhm seine Knecht frölich entgegen/vnwissend daß es Craterus was/biß sie jhn vnnd viel der seinen in der Feldschlacht erwürgt hetten/Daher wol zu vernemen/wie vnglücklich er gestritten/wo er sein Zungen zuuor nit beherrscht/sonder die zukunfft Crateri/mit vnerstattlicher forcht seins hauffens vermeldet hett.
  cs: |-
    ptal, kdy chce zaútočit, mu řekl: „Bojíš se snad, že bys jediný neuslyšel poplach?“[^1] Král Eumenés, když mu bylo oznámeno, že na něj se sešikovaným bitevním šikem {Schlachtordnung} táhne znamenitý vojevůdce {Hauptmann} Krateros, jehož se jeho knechti {Knecht} pro jeho vynikající udatnost poněkud báli, dal zvěda střežit a zprávu chytře zamlčel: celému houfu {hellen hauffen} řekl, že přichází jeho nepřítel Neoptolemos, kterého jako nerozumného a pošetilého vojevůdce velmi pohrdal. Tu proti němu jeho knechti vesele vyrazili, nevědouce, že je to Krateros, až jeho i mnohé z jeho lidí v polní bitvě pobili. Z toho lze dobře poznat, jak nešťastně by byl bojoval, kdyby předtím neovládl svůj jazyk a oznámil příchod Kratera, k nenapravitelnému strachu svého houfu.
- typ: odstavec
  de: |-
    Nit weniger ist auch gefährlich/so ein Herr viel wortbalger vnter seinem hauffen duldet/durch welcher vnnütze wort offt der Feind gewarnet/oder zu rachgiriger künheyt gereytzt wird. Agathocles/der auß eines Haffners Sohn/durch seine redligkeyt zu einem Herren ward vber Siciliam/wie er die Statt Syracusias belägert/vnnd jhn etliche vor der Stattmawr spöttlich frageten/wann er seine Knecht bezalen wölte? Antwortet/Wann ich die Statt einnimm/bedrengt sie auch also streng/daß er sie gewann/Als er aber nach eroberung seine spötter auffs Meer verkaufft/sagt er jn/werdet jr mein ferrer spotten/so wil ich michs vor ewern Herren beklagen. Vmb dergleichen spöttlicher verachtung willen/war Sylla schier bewegt/Athenas die fürnembste Statt deß gantzen Griechenlandts inn grund zuuertilgen/Derhalben der Ehrenfest Fürst Memnon billich gelobt wird/do er Dario beystund wider Alexandrum/daß er einen seiner Knecht/der Alexandrum mit viel verächtlichen schentzelworten schmecht/mit seinem Spieß geschlagen/vnnd zu jhm gesagt hat/ich besolde dich/daß du wider Alexandrum streittest/vnd nit daß du jhn verachtest. Dieweil an dem ort nit die zung/sonder die faust von dem Obersten besoldet wird/bedarff es keynes streitbaren munds/sonst möcht keyn Kriegßmann vor den alten Begeinen mehr zukommen.
  cs: |-
    Neméně nebezpečné je také, když pán ve svém houfu trpí mnoho hádavých mluvků, jejichž zbytečnými slovy je nepřítel často varován nebo podnícen k pomstychtivé smělosti. Když Agathoklés, který se ze syna hrnčířova svou udatností stal pánem Sicílie, obléhal město Syrakusy a někteří se ho z hradeb posměšně ptali, kdy chce zaplatit svým knechtům, odpověděl: „Až dobudu toto město,“ a sevřel je tak tvrdě, že je dobyl. Když pak po dobytí své posměváčky prodal za moře, řekl jim: „Budete-li se mi dál posmívat, budu si na vás stěžovat u vašich pánů.“ Pro podobné posměšné pohrdání se Sulla málem rozhodl vyhladit Athény, nejpřednější město celého Řecka, až do základů. Proto je právem chválen ctihodný kníže Memnón, který stál při Dareiovi proti Alexandrovi: jednoho ze svých knechtů, který Alexandra hanil mnoha opovržlivými a posměšnými slovy, udeřil svým kopím {Spieß} a řekl mu: „Platím tě, abys proti Alexandrovi bojoval, a ne abys ho tupil.“ Protože tam nejvyšší [velitel] {Obersten} neplatí jazyk, nýbrž pěst, netřeba bojovných úst; jinak by se žádný válečník před starými bekyněmi už nedostal ke slovu.[^2]
- typ: nadpis
  uroven: 2
  de: Von Prouand.
  cs: O proviantu
- typ: odstavec
  de: |-
    SIntemal durch die Prouand einem hellen hauffen offt vnwiderbringlicher schad begegnet/erfordert die noth einen trewen Prouandmeyster/der alle notturfft dem Läger lifferen kön/frembde gewerbsleuth außschliessen/die Besatzung bey gleichem pfacht vnterhalten/die Stettspeycher vor anfang deß Kriegs wol spicken/vnd den feinden durch abgerichte ringe pferd alle narung entwenden/vnd also mit hungers noth etwann ohn schwertschleg bezwingen. Die alte Römer haben etwann auch ein theyl deß geblünderten getreyds/von einem getrengten Lande inn verordnete Kästen geschickt/vnd andern in jre eygne Feldbew gesähet/vnd volgender zeit/dieweils reifft/des feinds frucht wider mit gewalt abgeerndt/des feinds Landvolck in die Stett gezwungen/jhre früchte zuuerätzen/vnd alßdann mit jhn vmb die vbrige frucht/dieselbige dem hellen hauffen für den abzug zugeben gethädinget/empfangen/abgezogen/vnnd auß verhälter vrsach eilends die emplößte Stett wider belägert vnnd auffzugeben gezwungen/Dergleichen sich mit etlichen Stetten befridet vnd zugesagt/daß sie jhre erbeutete frücht zu jnen legen vnd behalten wölten/vnd auff den Früling zimlich verkauffen. Liessen aber hie zwischen/dieweil diese Stett jr Korn
  cs: |-
    Protože kvůli proviantu {Prouand} často celý houf utrpí nenapravitelnou škodu, vyžaduje nutnost věrného proviantmistra {Prouandmeyster}, který dokáže do ležení {Läger} dodat vše potřebné, vyloučit cizí obchodníky, zásobovat posádku {Besatzung} za stejnou míru,[^3] před začátkem války dobře naplnit městské sýpky, nepřátelům pomocí vycvičené lehké jízdy {ringe pferd} odejmout všechnu obživu, a tak je hladem někdy přemoci i bez úderu mečem. Staří Římané také někdy část obilí uloupeného v sužované zemi poslali do určených sýpek a jinou část zaseli na jejích vlastních polích; v následujícím období, když dozrálo, nepřátelskou úrodu opět mocí sklidili, nepřátelský venkovský lid zahnali do měst, aby tam projedl své zásoby, a potom s nimi vyjednali, že jim zbylé obilí vydají za to, že vojsko {hellen hauffen} odtáhne. Obilí přijali, odtáhli, a ze skrytého důvodu pak ona vyprázdněná města rychle znovu oblehli a donutili je ke vzdání. Podobně s některými městy uzavřeli mír a slíbili, že u nich své ukořistěné obilí uloží a ponechají a na jaře je za slušnou cenu prodají. Mezitím však, zatímco tato města promrhávala své
poznamky:
- n: 1
  text: |-
    Podle Plútarcha odpověděl Antigonos I. Jednooký svému synu Démétriovi: „Bojíš se, že jediný neuslyšíš trubku?“ – tj. rozkaz k útoku se všichni dozvědí včas a nikdo dřív.
- n: 2
  text: |-
    Begine – bekyně, zbožná žena žijící v polořeholním společenství; zde posměšně o klevetivých stařenách: kdyby se bojovalo ústy, vyhrály by staré ženy.
- n: 3
  text: |-
    „bey gleichem pfacht“ – za stejnou (ustálenou) míru či cenu; Pfacht = úřední míra, cejch.
