id: 087r
list: LXXXVII
strana: recto
sken: 181
stav: zkontrolovano
bloky:
- typ: odstavec
  de: |-
    Auff sollich vnd dergleichen meynung/was der Oberst vermeynt/daß jhm bey dem Kriegßvolck gůten willen mach/soll er sich hören vnd vernemen lassen/besonder daß man jedermann dem wenigern als dem meysten/mit außtheylung der Prouant/vnnd alles so eins jeden notturfft/nach gestalt vnnd gelegenheyt der sachen erheyscht/gleich vnd ohn einichen vortheyl mittheylen wölle.
  cs: |-
    V tomto a podobném smyslu – cokoli plukovník {Oberst} pokládá za vhodné, aby mu to u válečného lidu {Kriegßvolck} získalo dobrou vůli – se má dát slyšet; zvláště [má říci], že se každému, nejmenšímu stejně jako největšímu, bude proviant {Prouant} a všechno, co si potřeba každého podle stavu a okolností věci žádá, rozdělovat rovným dílem a bez jakéhokoli zvýhodňování.
- typ: odstavec
  de: |-
    Item wo jndert ein gůt ehrlich gesell sey/so etwas fähl oder mangel an jchten haben würde/daß derselbig vnter dem gemeynen volck nicht geschrey oder klag machen/sonder sich jhm dem Obersten kecklich vnnd ohn entsetzen anzeygen wölle/dem soll jeder zeit der gepür vnd notturfft nach Rath vnd willen beschehen/Dann mag er anzeygen vnd sie trösten/wie sie ein vesten/vnüberwindtlichen platz vnnd Besatzung haben.
  cs: |-
    Dále, kdyby kdekoli nějaký dobrý čestný druh {gesell} v něčem strádal nebo měl nedostatek, ať kvůli tomu nedělá mezi prostým lidem křik ani nářek, nýbrž ať se směle a beze strachu obrátí na něho, plukovníka; tomu se má vždy dostat rady a vyhovění, jak náleží a jak je třeba. Potom jim může ukázat a dodat jim odvahy, jaké pevné a nedobytné místo a posádku {Besatzung} mají.
- typ: odstavec
  de: |-
    Item wie sie auff so oder so lange zeit mit Prouand/geschütz/Puluer vnd aller Munition/nach aller notturfft versehen vnd versorgt seyen.
  cs: |-
    Dále [má říci], na jak dlouhou dobu jsou proviantem, děly {geschütz}, střelným prachem {Puluer} a veškerou municí {Munition} náležitě zásobeni a zaopatřeni.
- typ: odstavec
  de: |-
    Item wie der Kriegßherr vnd andere seine verwandten in stäter vnnd embsiger vbung stehn sie zuretten/er wiß auch vnd setz keyn zweifel darein/es werde rettung in der oder der zeit kommen.
  cs: |-
    Dále [má říci], že válečný pán {Kriegßherr} a jiní jeho příbuzní se ustavičně a horlivě snaží je vysvobodit; a on [plukovník] ví a nepochybuje o tom, že pomoc přijde v tu či onu dobu.
- typ: odstavec
  de: |-
    Wiewol sie wol keyner rettung bedörfften/dann die Besatzung dermassen an jr selbs/auch mit anderer notturfft/vnnd besonder mit jhnen/als geschickten/erfarnen/dapfferen vnnd behertzten kecken ehrlichen Kriegßleuhten versehen/daß er keyn zweifel noch sorg hab/durch die hülff Gottes/auch jren gůten Rath/mannlich vnd dapffer gemůt vnd ernst/die Besatzung vor allem gewalt/vnd länger dann die feind mögen/gelt/puluer/prouant/vnd jhr leib vnd leben behalten.
  cs: |-
    Ačkoli by vlastně žádnou pomoc nepotřebovali, neboť posádka je sama o sobě i jinými potřebami, a zvláště jimi samými jakožto schopnými, zkušenými, statečnými, odvážnými, smělými a čestnými vojáky, zaopatřena tak, že nemá pochyb ani starostí, že s pomocí Boží a díky jejich dobré radě, mužné a statečné mysli a vážnosti uhájí posádku proti jakékoli moci, a to déle, než si nepřátelé dokážou udržet peníze, prach, proviant a vlastní život.
- typ: odstavec
  de: |-
    Item dann mag er kurtz erzelen/souiel sich fügen wil/die vrsach deß Kriegs/in dem er seiner Herrschafft vil glimpffs vnd rechts/dagegen den feinden gewalt/fräuel vnd vnrecht zumessen mag.
  cs: |-
    Dále může krátce, nakolik se to hodí, vyložit příčinu války, přičemž může své vrchnosti přičíst mnoho slušnosti a práva, nepřátelům naopak násilí, svévoli a bezpráví.
- typ: odstavec
  de: |-
    Er soll auch das Kriegßvolck trösten/so sie sich wol halten/vnd das best bey im thůn/daß sollichs der Kriegßherr in allen gnaden erkennen/vnd nit vnbelohnt lassen werde/insonder eim jedem/nach dem er sich vor anderen herfür thůn vnd wol halten werde/welches er auch in sonderheyt/von einem jeden ders verdient/dem Herrn rühmen/vnd jhn zu gnaden vnd gůtem fürdern wölle.
  cs: |-
    Má také válečný lid ujistit, že budou-li se dobře držet a udělají-li u něho to nejlepší, válečný pán to se vší milostí uzná a nenechá bez odměny, a to zvláště každého podle toho, jak se před ostatními vyznamená a dobře si povede. To chce on [plukovník] také u každého, kdo si to zaslouží, zvlášť pánovi pochválit a přimluvit se za něho k milosti a k dobrému.
- typ: nadpis
  uroven: 3
  de: Nota.
  cs: Poznámka
- typ: odstavec
  de: |-
    Wiewol man nit eygentlichen die form eins Artickels Brieff begreiffen oder setzen mag/so dieselben gemeynlichen nach gestalt vnnd gelegenheyt der handlung gestellt wird/so seind doch jetzt nachfolgend etlich puncten so gemeyn seind/in Artickels Brieff weiß gestellt.
  cs: |-
    Ačkoli nelze přesně vymezit ani stanovit podobu artikulního listu {Artickels Brieff}, protože se obvykle sestavuje podle povahy a okolností dané věci, přesto jsou dále uvedeny některé obecné body, sepsané na způsob artikulního listu.
- typ: nadpis
  uroven: 3
  de: Artickel.
  cs: Artikule
- typ: odstavec
  de: |-
    IR werden schwören leiblich ein Eyd/daß jhr alle vnd ein jeder in sonder/wöllen getrew/gewer vnnd gehorsam sein N. vnserem Gnädigen Herren/oder
  cs: |-
    Budete přísahat tělesnou přísahou {Eyd}[^1], že vy všichni i každý zvlášť chcete být věrní, spolehliví a poslušní N., našemu milostivému pánu, nebo
poznamky:
- n: 1
  text: |-
    Leiblicher Eid – přísaha složená osobně, se zdviženými prsty („mit aufgereckten Fingern“), na rozdíl od slibu daného jen podáním ruky nebo písemně.
