id: 105r
list: CV
strana: recto
sken: 217
stav: zkontrolovano
bloky:
- typ: verse
  pokracovani: true
  de:
  - Jst keyn erschrockner ding auff Erd/
  - Da hilfft keyn wehr/harnisch noch pferd.
  - Jst deins Reysigen Zeugs lützel/
  - Verordne ein theyl zum Scharmützel/
  - Die andern laß darnach hinbrechen
  - Vnd vor dem Fůßzeug rennen/stechen/
  - Sie mögen leiden stich vnd stoß
  - Han sie gůt Harnisch vnd gůt Roß.
  - Seind vnter jhn viel Edelleuth
  - Den lieber ehr ist dann groß beuth.
  - Wiewol auch andern zuuertrawen
  - Noch ist mehr auff den Adel zubawen/
  - Jhr Eltern vnd Kinder ehr wird betracht/
  - Darauff der gmeyn knecht wenig acht/
  - Dein Ordnung mach bey gůter zeit/
  - Besser ist ghart/dann vbereilt im streit.
  - Vertraw so viel nicht deiner macht/
  - Hab allzeit vortheyls fleiß vnd acht.
  - Zun fordern glidern laß erlesen
  - Die freidig mehr im krieg sein gwesen.
  - Dann wie sich dvordersten haltn vnd stehn
  - So richten sich die zhinderst gehn.
  - Bestehn die vornen Ritterlich/
  - So fechten dhindern auch Mannlich.
  - Der ersten treffen/schlahen vnd schertz
  - 'Jst beyder theyl hoffnung vnd Hertz:'
  - Es nutzt auch etwa wol zur schlacht
  - Daß man dem Hauffen flügel macht/
  - Man mags wol theylen in zwen hauffen
  - Sie beid dem feind zu schadn lan lauffen.
  - Jm Feld ist gar ein glücklich stund/
  - So ein hauff dem andern zhülff kompt.
  - Dein ding ordn mit deiner Hauptleuth rath/
  - Daß dir vnd jhn der feind nicht schadt/
  - Wann es kompt zu der rechten Schlacht
  - Verman dein volck/hab dein selb acht.
  - Ob deine würden ligen nider/
  - Das magst du darnach bringen wider.
  cs:
  - Na zemi není nic hroznějšího,
  - proti tomu nepomůže zbraň, zbroj {harnisch} ani kůň.
  - Máš-li málo jízdy {Reysigen Zeugs},
  - urči jednu část k šarvátce
  - a ostatní nech potom vyrazit,
  - aby před pěchotou {Fůßzeug} najížděli a bodali.
  - Snesou bodnutí i náraz,
  - mají-li dobrou zbroj a dobré koně.
  - Je-li mezi nimi mnoho šlechticů,
  - těm je čest milejší než velká kořist.
  - Ačkoli lze důvěřovat i ostatním,
  - přece se dá víc stavět na šlechtu: null
  - ta hledí na čest svých rodičů i dětí,
  - na což prostý knecht málo dbá.
  - Svůj šik {Ordnung} postav v pravý čas,
  - lépe je vyčkat než se v boji unáhlit.
  - Nespoléhej tolik na svou moc,
  - vždy pilně hleď na výhodu.
  - Do předních řad {glidern} nech vybrat ty,
  - kteří už víckrát ve válce prokázali smělost.
  - Neboť jak si počínají a stojí ti vpředu,
  - podle toho se řídí ti, kdo jdou úplně vzadu.
  - Obstojí-li ti vpředu rytířsky,
  - budou i ti vzadu bojovat mužně.
  - První srážka, úder a šarvátka
  - jsou nadějí a srdcem obou stran.
  - V bitvě také někdy dobře poslouží,
  - když se houfu {Hauffen} udělají křídla;
  - lze jej také rozdělit na dva houfy
  - a nechat oba vyrazit nepříteli ke škodě.
  - V poli je to vskutku šťastná chvíle,
  - když jeden houf přijde druhému na pomoc.
  - Své věci uspořádej po radě se svými hejtmany,
  - aby nepřítel neuškodil tobě ani jim.
  - Když pak dojde k vlastní bitvě,
  - povzbuď svůj lid a dbej sám na sebe.
  - I kdyby tvoji [lidé] padli,
  - můžeš to potom zase napravit.
