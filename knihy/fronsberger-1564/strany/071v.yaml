id: 071v
list: LXXI
strana: verso
sken: 150
stav: zkontrolovano
bloky:
- typ: odstavec
  de: |-
    Antwort: HErr Schultheyß jhr habt mich gefragt auff meinen Eyd/ob sach were/daß man auff heutigen tag vmbschlůg das heylig wort Gottes zupredigen vnd zuuerkünden/ob jhr macht haben mit sampt vns auffzustehn vnd dasselbig zuhören/so sag ich bey meynem Eyd/ob sollichs geschehe/daß jhr macht haben mit vns auffzustehn vnnd sollichs zuhören/vnd wann wir sollichs gehört haben/vnd es noch bey gůter bequemer tagzeit ist/das jhr macht haben den stab wider zu ewern handen zunemen/vnnd mit sampt vns Richtern sitzen/vnnd richen vber alles das/so ins Recht fürbracht vnnd anklagt worden.
  cs: |-
    Odpověď: Pane rychtáři {Schultheyß}, ptali jste se mě při mé přísaze {Eyd}, kdyby se dnes vybubnovalo kázání a zvěstování svatého slova Božího, máte-li moc spolu s námi vstát a jít je poslechnout. Pravím tedy při své přísaze: kdyby se tak stalo, máte moc s námi vstát a jít je poslechnout; a až je vyslechneme a bude ještě dobrá a vhodná denní doba, máte moc vzít hůl {stab} opět do svých rukou, zasednout spolu s námi, přísedícími {Richtern}, a soudit o všem, co bylo předneseno a obžalováno před soudem.
- typ: odstavec
  de: |-
    Zum dritten frag ich dich/ob einer oder mehr im Rechten säß/die nit ehrlich oder tüglich darzu weren/daß du dieselbigen wöllest anzeygen/damit das Keyserlich Recht nit geletzt oder gemindert werde/daß ich mit sampt euch köndt vnd möchte verantworten gegen Gott dem HErren.
  cs: |-
    Za třetí se tě ptám: kdyby na soudu zasedal jeden nebo více takových, kdo k tomu nejsou bezúhonní nebo způsobilí, abys je oznámil, aby císařský soud {Keyserlich Recht} nebyl porušen ani umenšen a abych se spolu s vámi mohl a dokázal zodpovídat před Pánem Bohem.
- typ: odstavec
  de: |-
    Antwort: Herr Schultheyß jhr habt mich gefragt auff meinen Eyd/daß ich euch soll anzeygen/ob einer oder mehr am Rechten säß/der nicht ehrlich oder redlich were/so sag ich euch bey meinem Eyd/daß mich bedünckt/daß das Recht besetzt sey mit ehrlichen vnnd weydlichen leuthen/mit Edel vnnd vnedel/daß jhr sampt jhnen richten vnd vrtheylen auff heutigen tag was für ewern stab gebracht wird/es sey vber silber/gold/oder leib/ehr vnnd gůt.
  cs: |-
    Odpověď: Pane rychtáři, ptali jste se mě při mé přísaze, abych vám oznámil, zasedá-li na soudu jeden nebo více takových, kdo nejsou bezúhonní nebo poctiví. Pravím vám tedy při své přísaze, že se mi zdá, že soud je obsazen bezúhonnými a statnými lidmi, urozenými i neurozenými, takže dnešního dne můžete spolu s nimi soudit a rozsuzovat, co bude přineseno před vaši hůl, ať jde o stříbro, zlato, nebo o hrdlo, čest a statek.
- typ: odstavec
  de: |-
    Zum vierten frag ich dich/ob brunst oder wasser vberhand neme/ein lärmen oder ein feind geschrey auffgieng/ob ich mit sampt euch mög auffstehen/vnd solche vrsach helffen retten vnd fürzustehen/vnnd wann sollichs gestillet wird/vnd noch bey gůter tag vnd zeit were/ob ich wider mit sampt euch sitzen möge/vnnd richten alles was für meinen stab klagt vnd fürbracht wird.
  cs: |-
    Za čtvrté se tě ptám: kdyby se rozmohl požár nebo voda, nastal poplach {lärmen} nebo se zvedl křik o nepříteli, mohu-li spolu s vámi vstát a pomáhat v takové věci zachraňovat a bránit; a až se to utiší a bude ještě dobrý den a čas, mohu-li opět spolu s vámi zasednout a soudit vše, co bude žalováno a předneseno před mou holí.
- typ: odstavec
  de: |-
    Antwort: Herr Schultheyß jhr habt mich gefragt auff meinen Eyd/vmb ein außweisung/ob brunst oder wasser/lärmen oder feind geschrey auff käm/vnnd vberhand nem/wie jhr euch halten solt/so sag ich bey meinem Eyd/ob sich sollichs zutrüge/daß jhr den stab mögen von euch legen/vnnd mit vns Richtern lauffen/da dann solch ding vorhanden seind/dasselbig retten vnd abstellen/vnd wann es noch bey gůter tagzeit wer/so mögen jhr wider sitzen mit sampt vns Richtern/vnnd eweren stab wider in die hand nemen/vnd mit richten vnd vrtheyln/alles das für euch bracht ist worden/es sey vber silber/gold/leib/ehr vnd gůt.
  cs: |-
    Odpověď: Pane rychtáři, ptali jste se mě při mé přísaze o nález {außweisung}, jak se máte zachovat, kdyby nastal a rozmohl se požár nebo voda, poplach nebo křik o nepříteli. Pravím tedy při své přísaze: kdyby se tak přihodilo, můžete hůl odložit a s námi, přísedícími, běžet tam, kde se takové věci dějí, zachraňovat a zastavit je; a bude-li pak ještě dobrá denní doba, můžete spolu s námi, přísedícími, opět zasednout, vzít svou hůl znovu do ruky a spolu soudit a rozsuzovat vše, co bylo před vás přineseno, ať jde o stříbro, zlato, hrdlo, čest a statek.
- typ: odstavec
  de: |-
    Zum fünfften frag ich dich/Ob der Oberst nach mir schickt oder schicken würde/ob ich macht hett den stab einem andern zugeben/vnd wann ich dann wider käme/vnnd noch bey gůter tagzeit wer/ob ich den stab wider zu mir möcht nemen/vnnd mit sampt euch richten vnd vrtheyl sprechen/alles was für Recht anklagt ist worden.
  cs: |-
    Za páté se tě ptám: kdyby pro mě plukovník {Oberst} posílal nebo poslal, mám-li moc dát hůl jinému; a až bych se pak vrátil a byla by ještě dobrá denní doba, mohu-li hůl opět vzít k sobě a spolu s vámi soudit a vynášet rozsudek o všem, co bylo před soudem obžalováno.
- typ: odstavec
  de: |-
    Antwort/Herr Schultheyß jr habt mich gefragt auff meinen eyd/daß ich euch soll ein außweisung geben/ob der Oberst nach euch schicken würd/wie jhr euch halten sollen/So sag ich bey meinem eyd/ob sollichs geschehe/so solt jr den stab vberlifern einem andern ehrlichen Mann im Rechten/der euch geschickt darzů dünckt/vnd jr hingehen vnd sehen was der Oberst ewer wöll/vnd wann jr wider zu vns kompt/vnd noch bey gůter tagzeit ist/so mögen jr eweren stab widerumb zu euch nemen/vnd mit sampt vns richten vnnd vrtheylen/vber alles das zu Recht fürbracht ist worden/es sey vber silber/gold/oder leib/ehr vnd gůt.
  cs: |-
    Odpověď: Pane rychtáři, ptali jste se mě při mé přísaze, abych vám dal nález, jak se máte zachovat, kdyby pro vás poslal plukovník. Pravím tedy při své přísaze: kdyby se tak stalo, máte předat hůl jinému bezúhonnému muži ze soudu, který se vám k tomu zdá způsobilý, a jít a zjistit, co od vás plukovník chce; a až se k nám opět vrátíte a bude ještě dobrá denní doba, můžete vzít svou hůl znovu k sobě a spolu s námi soudit a rozsuzovat o všem, co bylo předneseno před soud, ať jde o stříbro, zlato, nebo o hrdlo, čest a statek.
