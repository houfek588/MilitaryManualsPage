id: 056v
list: LVI
strana: verso
sken: 120
stav: zkontrolovano
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    fridlich vnnd freundlich mit einander halten/je einer dem andern vbersehe/vnd eines andern wolfart als lieb er sein eygen habe/was zu zanck/neid/haß vnnd wider will gereychen mag/als spielen/sauffen/balgen/flůchen/füllen/etc. die verstendigen die andern daruon zihen/vnnd nicht einander die glider verderben vnnd verwüsten so zum streit gehörn vnd gebraucht werden/sonder solche jhre gerade vnd gesunde von Gott gegebne glider/vnuerletzt wider den Feind behalten/dann wo sie vntereinander zertrennet werden/wird es ein bösen bestand nemen vnd geben/so kan es auch nicht gebillichet werden/daß ein Kriegßmann soll dem andern sein glider so zum Krieg besoldet werden/zerhacken oder verderben/wie dann jetziger zeit/geschicht/vnnd nicht deßtweniger sein besoldung vom Herrn einnemen/Dann ob schon ein knecht seines leibs nit achten wolte/so kan solliches doch der Eydt/wie im Artickel verfaßt vnnd begriffen ist/nicht zugeben/zu dem die trew mit der er verpflicht ist/nicht dulden oder zulassen.
  cs: |-
    chovali pokojně a přátelsky, aby jeden druhému leccos prominul a měl prospěch druhého stejně rád jako svůj vlastní; a co může vést ke svárům, závisti, nenávisti a nevoli – jako hra, pitky, rvačky, klení, obžerství atd. –, od toho mají rozumní odvádět ostatní. Nemají si navzájem mrzačit a hubit údy, které patří a slouží k boji, nýbrž mají své rovné a zdravé, Bohem dané údy zachovat neporušené proti nepříteli. Budou-li se totiž mezi sebou rozsekávat, vezme to zlý konec. Také nelze schválit, aby jeden válečník druhému sekal nebo mrzačil údy, které jsou placeny pro válku – jak se v nynější době děje –, a přesto bral od pána žold. I kdyby totiž knecht nechtěl dbát svého těla, nemůže to připustit přísaha {Eydt}, jak je sepsána a obsažena v artikulu, a nadto to nemůže strpět ani dovolit věrnost, kterou je zavázán.
- typ: odstavec
  de: |-
    Zum zehenden/Sollen die Kriegßleuth/jeder sich seiner bestimpter Besoldung genügen lassen/wie vornen offt gemelt/vnd Johannes der Tauffer zun Kriegsknechten sagt/niemands gewalt thun/noch das sein mit gewalt oder freuenlicher weiß nemen/entwenden vnnd entführen/Wil je einem sein Besoldung zu gering oder zuschmal sein/so halt er sich in seinem Ampt vnd dienst also/daß ihn sein wol halten zu höcherm Befelch bringe/oder aber lebe also eingezogen/daß er mit seiner Besoldung ohn ander Leuth nachtheyl außkommen kan vnd mag.
  cs: |-
    Za desáté: váleční lidé se mají každý spokojit se svým stanoveným žoldem, jak bylo výše často řečeno a jak praví Jan Křtitel k vojákům: nikomu nečinit násilí a nikomu nic násilím či zpupně nebrat, neodcizovat a neodnášet. Zdá-li se někomu jeho žold příliš malý nebo skrovný, ať se ve svém úřadu a službě chová tak, aby ho jeho dobré chování přivedlo k vyššímu pověření {Befelch}, anebo ať žije tak skromně, aby se svým žoldem vystačil bez újmy jiných lidí.
- typ: odstavec
  de: |-
    Dise zehen stuck vnnd Artickel/welche von einem jeglichen verstendigen vnnd Gottsförchtigen Kriegsmann/nicht können oder mögen verachtet oder verworffen werden/hab ich derhalben auß obgemelten vrsachen zusammen gefügt vnd geordnet/ob der Allmechtig sein genad geben wolte/daß sie sich also halten/daß er mit seiner hülff vnd beystandt bey vns sey/vnnd auch zu seinem lob/ehr vnnd preis/solche gnad verleihe/Durch vnsern Heyland vnd erlöser/Amen.
  cs: |-
    Těchto deset bodů a článků, jimiž žádný rozumný a bohabojný válečník nemůže a nesmí pohrdat ani je zavrhovat, jsem sestavil a uspořádal z výše uvedených důvodů: zda by snad Všemohoucí dal svou milost, aby se [váleční lidé] tak chovali, aby on byl se svou pomocí a podporou s námi, a aby takovou milost propůjčil ke své chvále, cti a slávě. Skrze našeho Spasitele a Vykupitele. Amen.
