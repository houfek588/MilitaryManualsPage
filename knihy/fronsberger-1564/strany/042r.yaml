bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    ermelten N. inn dem wie obgemelt/also gutwillig sich in vnseren dienst sampt seinen geworbnen Kriegßleuthen zubegeben befunden/So bekennen wir doch hiemit offentlich für jedermann/daß ermelter N. jhm/seinen Hauptleuthen vnd gemeynen Landsknechten vorbehalten hat/wider die Protestierende Ständ/Er/seine Haupt vnnd Kriegßleuth nicht gemeynt in vngůtem vnnd mit der that etwas helffen gegen denen fürzunemen oder auch zuthůn. Dieweil wir dann gemelten Ständen vnd seinen glidern in alter herbrachter bündtnuß vnd friden vnsere vorfaren/vnd wir allwegen gestanden/gemeynen hinfürter auch zuuerbleiben/haben wir vielgemeltem N. seinen Haupt vnd Kriegßleuthen solchs billich außnemen nicht weygern können/wöllen es jhnen auch also hiemit zugelassen haben/Vnd so vil die Besoldung der Landsknecht deß gantzen hellen hauffen vnter gemelts N. Regiment belangt/wöllen vnnd sollen wir/daß ein Monat sold für vier gülden/jeden gülden für fünffzehen Batzen gerechnet/vnnd dreissig tag für jeden Monat Sold gerechnet werden. Zu dem auch so bemelter N. seine Haupt vnnd Kriegßleuth ein schlacht auch ein verordneten sturm gethon vnnd erobert/auff denselben tag er geschicht/dergleichen so ein sturm erhalten/soll jhr Monat auß vnd angehn/wöllen auch daß sie deren durch vnsere Commissarien vnd Pfenningmeyster entricht vnd bezalt. So wir auch befridiget/vnd jrer nicht zugebrauchen weitter vonnöten/soll jhnen ein Monat oder ein halber Monat sold/etc. für den abzug zugestellt/vnd geben werden. Versprechen vnd geloben wir hiemit bey vnsern widersechern keyn frieden noch anstand anzunemen noch auffzurichten/vber kurtz oder lang/ermelter N. all seine Haupt vnd Kriegßleuth/weß stands oder wesens/groß oder kleyn die seyen oder sein möchten/sie weren auß den Protestirenden Ständen/oder sonst auß vnser vnd vnsers Fürstenthumbs widersächer Erblanden/sie werden dann zuuor auch darinn begriffen/dardurch sie widerumb zu jhrer haab vnd gütern kommen/Wo jhnen was vnsers diensts halben anderst vnbillicher weiß etwas von jemandts/wer der auch wer/genommen vnd entwendt/Welches alles wie obsteht wir hiemit ermeltem N. seinen Haupt vnd Kriegßleuthen/sampt vnd sonders geloben vnnd zusagen festiglich zuhalten bey vnsern Fürstlichen würden. Wo auch was ferners in dem Artickels brieff/so vns gemelter N. seine Haupt vnd Kriegßleuth schweren jhnen zum besten/vnd hierinn nicht begriffen wer/wöllen daß das gleich als were es in die länge hierinn benent vnd specificiert/gehalten werd/Dessen zu rechter warer vrkund haben wir disen Brieff mit vnser hand vnterschrieben/vnnd Innsigel daran hencken thůn. So geben zů N. des N. tag/etc.
  cs: |-
    zmíněného N. shledali, jak výše uvedeno, tak ochotným vstoupit do našich služeb i se svými naverbovanými válečníky, přesto tímto veřejně před každým vyznáváme, že si zmíněný N. pro sebe, své hejtmany a prosté lancknechty {Landsknechten} vyhradil, že on, jeho hejtmani a válečníci nehodlají ve zlém a skutkem pomáhat podnikat nebo činit cokoli proti protestantským stavům {Protestierende Ständ}[^1]. Protože naši předkové i my jsme s řečenými stavy a jejich členy vždy stáli ve starém zavedeném spolku a míru a hodláme v něm i nadále setrvat, nemohli jsme mnohokrát zmíněnému N., jeho hejtmanům a válečníkům tuto výhradu spravedlivě odepřít a tímto jim ji také povolujeme. A pokud jde o žold lancknechtů celého houfu {hellen hauffen} pod plukem {Regiment} zmíněného N., chceme a máme za to, aby se měsíční žold počítal po čtyřech zlatých {gülden}, každý zlatý po patnácti bacenech {Batzen}, a za každý měsíc žoldu aby se počítalo třicet dní. Kromě toho, když zmíněný N., jeho hejtmani a válečníci svedou bitvu nebo podniknou a vybojují nařízený útok {sturm}, a stejně tak když útok ubrání, má jim v týž den, kdy se to stane, měsíc skončit a nový začít[^2]; a chceme, aby jim to naši komisaři {Commissarien} a pokladník {Pfenningmeyster} vyrovnali a vyplatili. Když také dosáhneme míru a nebudeme jich dále potřebovat, má jim být na odchodnou vydán a dán jeden měsíční nebo půlměsíční žold atd. Dále slibujeme a zavazujeme se, že se svými protivníky nepřijmeme ani neuzavřeme žádný mír ani příměří, ať na krátko, či na dlouho, leda by do něj byli předem zahrnuti i zmíněný N. a všichni jeho hejtmani a válečníci, jakéhokoli stavu či postavení, velcí či malí, ať by byli z protestantských stavů, nebo odjinud z dědičných zemí protivníků našich a našeho knížectví; aby tak opět přišli ke svému jmění a statkům, kdyby jim bylo kvůli službě nám od kohokoli, ať je to kdokoli, něco nespravedlivě vzato a odcizeno. To vše, jak výše stojí, tímto zmíněnému N., jeho hejtmanům a válečníkům, všem společně i každému zvlášť, slibujeme a přislibujeme pevně dodržet při své knížecí důstojnosti. A bylo-li by ještě něco dalšího v artikulním listu {Artickels brieff}, na který nám zmíněný N., jeho hejtmani a válečníci přísahají, jim k dobru a nebylo by to zde obsaženo, chceme, aby se to dodržovalo, jako by to tu bylo obšírně jmenováno a vyjmenováno. Na pravé a skutečné svědectví toho jsme tento list vlastní rukou podepsali a dali k němu přivěsit svou pečeť. Dáno v N., dne N. atd.
- typ: odstavec
  de: |-
    Sein des Obersten besoldung ist Monats auff sein leib vnnd Ampt N. Gülden.
  cs: |-
    Žold plukovníka {Obersten} na jeho osobu a úřad činí měsíčně N. zlatých.
- typ: odstavec
  de: |-
    Jhm wird auch gehalten sechs/etwann acht/etwann zwölff Trabanten/darnach sein Stand ist.
  cs: |-
    Vydržuje se mu také šest, někdy osm, někdy dvanáct drabantů {Trabanten}, podle toho, jaký je jeho stav.
- typ: odstavec
  de: |-
    Jhm wird auch weiter gehalten/Ein Koch mit eim Knaben vnd nottürfftigen Personen.
  cs: |-
    Dále se mu vydržuje kuchař s jedním pacholetem {Knaben} a s potřebnými lidmi.
- typ: seznam
  de:
  - Ein Capplon.
  - Ein Doctor.
  - Item ein Feldtscherer.
  cs:
  - kaplan {Capplon}
  - lékař {Doctor}
  - dále ranhojič {Feldtscherer}
poznamky:
- n: 1
  text: |-
    Protestierende Ständ – říšská knížata a města, která se přihlásila k augsburskému vyznání. Vzor služebního listu zřejmě pochází z doby náboženských válek v Říši (šmalkaldská válka 1546–1547, knížecí povstání 1552): plukovník si pro sebe i své lidi vyhrazuje, že nebude bojovat proti protestantským stavům.
- n: 2
  text: |-
    Monat auß vnd angehn – podle lancknechtského zvyku se po vybojované bitvě nebo zdařilém (i ubráněném) útoku počítal běžný měsíc za dosloužený a začínal nový, tj. vojsko mělo nárok na nový měsíční žold.
