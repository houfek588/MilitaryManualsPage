id: 063v
list: LXIII
strana: verso
sken: 134
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Feldtweybel vnd gemeyne Knecht/den oder dieselben so nit in der Ordnung bleiben wöllen/mit gewalt in die Ordnung treiben/Welcher sich darumb zu wehr stellt/vngehorsam erschiene/vnnd darüber entleibt würde/daran soll niemandts verwirckt haben.
  cs: |-
    šikovatelé {Feldtweybel} a prostí knechti {Knecht} toho nebo ty, kdo nechtějí zůstat v šiku {Ordnung}, zahnat do šiku mocí. Kdo by se proto stavěl na odpor, ukázal se neposlušným a byl přitom zabit, za toho nikdo nenese vinu.
- typ: odstavec
  de: |-
    Item ob sich begebe/daß durch die Obersten der Key. May. ein verordnete Feldtschlacht beschehe/vnd mit Gottes hülff gewünnen würde/So soll alßdann einem jeden Knecht/wie jhn der Monat seins diensts begreifft/auß vnd angehen/vnd soll euch die Key. May. weitter nicht schuldig sein/vnd ob sich begebe daß auff solches das gelt nit gleich von stundan da were/vnd den Feinden abbruch beschehen möcht/so solt jhr euch nach der that nach zutrucken nit widern/zuuorab keynen Zug den Feinden abbruch zuthůn/abschlagen.
  cs: |-
    Dále: kdyby se stalo, že by plukovníci {Obersten} Jeho císařského Majestátu svedli spořádanou polní bitvu {Feldtschlacht} a s Boží pomocí ji vyhráli, pak má každému knechtovi {Knecht} jeho měsíc služby, ať je v něm kdekoli, skončit a začít nový[^1]; a dál vám nebude Jeho císařský Majestát ničím povinován. A kdyby se stalo, že by potom peníze nebyly hned po ruce, a přitom by se nepříteli dalo uškodit, nemáte se po tom činu zdráhat pokračovat v postupu, a zvláště nemáte odmítat žádné tažení, jímž se nepříteli škodí.
- typ: odstavec
  de: |-
    Item nachdem der Röm. Key. May. zu mehrmalen zu nachtheyl vnd vnstatten kommen/daß den Knechten auff den tag wann sie gestürmet/der Monat auß vnnd angangen/darauß erfolgt daß jhr Key. May. den Knechten je zu zeiten ein gantzen Monat zubezalen gehabt/oder noch antreffen möcht/Solch beschwerung zuuerhüten/seind in kurtzen verschienen Jaren die Landtsknecht nicht/sondern andere Nation darzů gebraucht/dardurch jhnen vil trefflicher gůter beuten/auch ehrlicher rhům vnd lob entzogen/vnd andern zu theyl worden. Jst hochgedachte Key. May. entschlossen/hinfürter es käme wann es wöll/eynichen Sturmsold zugeben oder zubezalen nicht schuldig oder pflichtig zusein/sonst were jhr Mayestat mit gnaden geneygt/das jhenig/so gemeynen knechten zu ehren vnd nutz gereychen mag/zufürdern/vnd sie in allen fürfallenden sachen zugebrauchen/auch an orth vnnd ende zu führen/alda sie ehr vnd gůt erlangen vnd gewinnen möchten/Doch wil jhr Key. May. jhnen weiter oder höher dann die beut/oder jr besoldung sonst laufft zugeben nicht schuldig oder verbunden sein. Wo aber solches von den Knechten nicht angesehen noch eingeraumbt/vnnd dahin verstanden werden wölte/daß es jnen selbst geschicht/vnnd das zuhalten nit geloben noch darauff schwören wölten/haben sie leichtlich abzunemen/daß jhr Mayestat nit gelegen sein würde/dieweil vnnd so lang sie andere Nationen gehaben mögen/sie zu sollichen Sturmen zugebrauchen/Sonder würde verursacht/denen so sich an den beutten benügen lassen/sollichen vortheyl zugönnen vnd folgen zulassen/vnd dieselben darzu zufürdern vnd zugebrauchen/damit dieselben auch nit vrsach fassen/solliche Sturmsölde auch zubegern vnd darauff zutringen.
  cs: |-
    Dále: Jeho římskému císařskému Majestátu bylo již několikrát ke škodě a nevýhodě, že knechtům v den, kdy šli do útoku, jejich měsíc skončil a začal nový, takže Jeho císařský Majestát musel knechtům občas vyplatit celý měsíc navíc, nebo by se mu to ještě mohlo přihodit. Aby se tomuto břemeni předešlo, nebyli k tomu v posledních letech užíváni lancknechti {Landtsknecht}, nýbrž jiné národy, čímž lancknechtům ušla mnohá skvělá a dobrá kořist i čestná sláva a chvála a připadly jiným. Proto se výše řečený císařský Majestát rozhodl, že napříště, ať by k tomu došlo kdykoli, nebude povinen ani zavázán dávat či vyplácet jakýkoli útočný žold {Sturmsold}[^2]. Jinak je Jeho Majestát milostivě nakloněn podporovat vše, co může prostým knechtům sloužit ke cti a k užitku, užívat jich ve všech nastalých věcech a vodit je na místa a do krajů, kde by mohli dosáhnout a získat čest i statek; avšak Jeho císařský Majestát jim nechce být povinován ani zavázán dávat víc nebo výš než kořist nebo jejich obvyklý žold. Kdyby to však knechti nechtěli vzít v úvahu ani přijmout a chtěli to vykládat tak, jako by se jim tím křivdilo, a nechtěli to slíbit dodržovat ani na to přísahat, snadno si mohou domyslet, že Jeho Majestátu nebude vhodné užívat jich k takovým útokům, dokud a pokud bude moci mít jiné národy; spíše by byl přinucen přát a přenechat takovou výhodu těm, kdo se spokojí s kořistí, a ty k tomu podporovat a užívat, aby ani oni neměli příčinu takové útočné žoldy rovněž požadovat a na nich trvat.
- typ: odstavec
  de: |-
    Item ob sach were/daß jr durch jhr Mayestat oder derselben Obersten befelch/Fändlins oder Rotten weiß inn ein Besatzung geschickt würden/es were inn Stett/Schlösser/Märckt oder Flecken wie es sich zutrůg/vnd dieselben so in sollicher besatzung weren oder legen/durch die feind ersucht würden/es wer durch ein oder mehr Stürm/so soll jnen der Herr darumb zuthun/weitter dann jhr besoldung reycht/nit schuldig sein.
  cs: |-
    Dále: kdyby se stalo, že byste z rozkazu Jeho Majestátu nebo jeho plukovníků byli po praporcích {Fändlins} nebo po rotách {Rotten} posláni do posádky {Besatzung}, ať do měst, zámků, trhových městeček nebo vsí, jak by se přihodilo, a ti, kdo by v takové posádce byli nebo leželi, byli napadeni nepřítelem, ať jedním, nebo více útoky, nebude jim pán povinen za to dát nic víc, než kolik činí jejich žold.
- typ: odstavec
  de: |-
    Vnnd ob Schlösser/Stett vnnd ander besatzungen mit thäding auffgenommen würden/so soll ewer keyner nit darein fallen oder blündern/auch darein nit gehn oder stehn/auch nichts weitters darwider thůn noch handlen one wissen vnd erlaubnuß deß Obersten/oder wer es von seinet wegen befelch hat/bey leib straff/die gesicherten vnd gehuldigten bey der sicherung vnd huldigung bleiben lassen.
  cs: |-
    A kdyby byly zámky, města a jiná obsazená místa přijata na smlouvu {thäding}[^3], nikdo z vás do nich nemá vpadnout ani je plenit, ani do nich chodit či v nich stát, ani proti tomu nic dalšího činit nebo podnikat bez vědomí a svolení plukovníka {Obersten} nebo toho, kdo má od něho rozkaz, pod trestem na těle; ty, jimž bylo zaručeno bezpečí a kteří složili hold, máte při tomto bezpečí a holdu ponechat.
poznamky:
- n: 1
  text: |-
    Tzv. „bitevní měsíc“ (Schlachtmonat): po vyhrané polní bitvě se běžící měsíc služby uzavřel a začal nový, takže knechti dostali celý měsíční žold navíc. Následující artikul stejnou výsadu pro útok ruší.
- n: 2
  text: |-
    Sturmsold – mimořádný žold za útok na hradby či město; jeho nárok vyplýval z obyčeje, že se po útoku počítal nový měsíc služby (srov. předchozí artikul).
- n: 3
  text: |-
    Thäding (Teiding) – vyjednávání, smlouva; zde vzdání se města či zámku na smluvené podmínky (kapitulace).
