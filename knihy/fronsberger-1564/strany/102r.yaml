id: 102r
list: CII
strana: recto
sken: 211
stav: zkontrolovano
bloky:
- typ: nadpis
  uroven: 2
  de: |-
    Die Lehr/so Keyser Maximilian inn seiner Jugendt/durch erfarne trefliche seine Kriegßräth zugestellet ist.
  cs: |-
    Poučení, které císaři Maxmiliánovi {Maximilian} v jeho mládí předložili jeho zkušení a znamenití váleční radové {Kriegßräth}
- typ: verse
  de:
  - DVrchleuchtigster Edler Fürst/
  - Betrachte was du bist vnd wirst.
  - Wie magst Gott dancken jmmer mehr
  - Deß vnzalbarn glück/gůts vnd ehr.
  - So dir auß gnad verliehen ist/
  - Für andern menschen erhöhet bist/
  - Ein Fürst vber sein Volck zuschalten/
  - O Herr nicht laß in dir erkalten
  - Gottsforcht/lieb/trew vnd gerechtigkeyt/
  - Warheyt/milte vnd Barmhertzigkeyt.
  - Wilt du daß dir nicht soll mißlingen/
  - So verhůte vor allen dingen/
  - Nimb nichts für wider Recht vnd Gott/
  - So kompst du nicht in sünd vnd spott/
  - Nicht laß dich zeit/mühe/arbeyt grawen/
  - Betracht was Gott hat auff dich gebawen/
  - Den grössern theyl der Christen welt
  - Dir Gott der Herr hat zugestellt.
  - Hab frommen lieb vnd erbarkeyt/
  - Stehe allzeit bey der Gerechtigkeyt/
  - Biß züchtig/lieblicher red/still/
  - Verbring nicht allzeit deinen wil.
  - Dann wie soll der sein Feind bestan
  - Der sich selb nicht bezwingen kan?
  - Befleiß dich gůter sitten vnd geberd/
  - Halt deinen Adel schon vnd werth.
  - Auff nichten soll ein Fürst mehr achten/
  - Dann nach ehr/lob vnd tugend trachten/
  - Der ist der höchst vber ander all/
  - Eben lug daß er auch nicht fall.
  - Erzeyg nicht dein vndanckbarkeyt/
  - Biß Gott zu dienen allzeit bereyt/
  cs:
  - Nejjasnější, vznešený kníže,
  - uvaž, co jsi a čím budeš.
  - Jak můžeš Bohu dost kdy děkovat
  - za nesčíslné štěstí, statky, čest,
  - jež z milosti ti byly dány,
  - že nad jiné lidi jsi povýšen,
  - abys jako kníže vládl svému lidu?
  - Ó pane, nedej v sobě vychladnout
  - bázni Boží, lásce, věrnosti a spravedlnosti,
  - pravdě, štědrosti a milosrdenství.
  - Chceš-li, aby tě nestihl nezdar,
  - pak se nade všechno chraň
  - podnikat cokoli proti právu a Bohu;
  - tak hřích ni posměch tě nestihnou.
  - Ať tě nezděsí čas, námaha ni práce,
  - uvaž, co Bůh na tebe vložil: null
  - větší díl křesťanského světa
  - ti svěřil Pán Bůh do rukou.
  - Měj rád zbožnost a počestnost,
  - stůj vždy při spravedlnosti,
  - buď mravný, vlídné řeči, tichý,
  - neprosazuj vždy svou vůli.
  - Neboť jak obstojí proti nepříteli,
  - kdo sám sebe přemoci nedovede?
  - Hleď si dobrých mravů a chování,
  - chovej svou šlechtickou čest v kráse a vážnosti.
  - Na nic nemá kníže víc dbát
  - než o čest, chválu a ctnost se snažit;
  - kdo stojí nejvýš nade všemi,
  - ať bedlivě hledí, aby nepadl.
  - Neprokazuj svou nevděčnost,
  - buď vždy připraven Bohu sloužit.
