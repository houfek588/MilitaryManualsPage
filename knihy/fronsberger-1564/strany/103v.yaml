id: 103v
list: CIII
strana: verso
sken: 214
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: verse
  pokracovani: true
  de:
  - Dartzu haben gůt sorg vnd Wacht/
  - Daß sie nicht als die Narrn vnd Blinden/
  - Vberfallen werden von den Feinden/
  - Darumb laß allzeit hüten/wachen/
  - Daß nit die feind deins schadens lachen.
  - Mit allem dem ists nit genug
  - Daß du hast leuth/gschoß/Gelt mit fug/
  - Sie müssen dartzů tauglich sein/
  - Daß dich nicht bringen vmb das dein/
  - Dann wer mit Hasen Hund wil fahen/
  - 'Mag so viel schaden als nutz empfahen:'
  - Mit all deim Kriegßvolck schaffst du neuth
  - Du habst dann from vnd gschickt Hauptleuth/
  - Den du magst gůt vnd ehr vertrawen/
  - Vnd auff sie deinen anschlag bawen/
  - Die dich nit leichen noch betriegen/
  - Vnd vmb dein selbs eygen gůt kriegen/
  - Als jetzt bschicht viel mahl in der Welt/
  - Damit bekommens gůt vnd gelt/
  - Das wirdt nicht dein Ehr vnd nutz sein/
  - Drumb lug selbs zu den sachen dein/
  - Nit biß verdrüssig/langsam/träg/
  - Hab leuth die wissen weg vnd steg.
  - Jn deins feinds Heer hab gůt kundschafft/
  - Spar nit fleiß/gelt/an solch Bottschafft/
  - Es mag kommen in einer stundt
  - Daß alles zwifach wider kumpt/
  - Was heut thůn magst/spar nit biß morgn/
  - Fleuch Gottslestern vnd vnnütz sorgn.
  - Vertraw deim feind nimmer so gůt/
  - Biß als in gůter wehr vnd hůt/
  - Dann so wol wil er dir nimmer/
  - Er brecht dich gern vmb leib vnd Ehr.
  - Darumb glaub nit seiner listigkeyt/
  - Zu widerstand biß allzeit breyt.
  - Allzeit fürträchtig in deiner sach/
  - Wanns noth ist/schlaff nit/sonder wach/
  - Verachtung/faul/liederlichheyt
  cs:
  - a k tomu bedlivě střeží a hlídají,
  - aby je jako blázny a slepce
  - nepřepadli nepřátelé.
  - Proto dej stále střežit a bdít,
  - ať se nepřátelé tvé škodě nesmějí.
  - Se vším tím však není dost,
  - že máš lid, střelivo a peněz hojnost;
  - musí k tomu být i způsobilí,
  - aby tě nepřipravili o tvé.
  - Neboť kdo chce zajíci chytat psy[^1],
  - může z toho mít škody stejně jako užitku.
  - S celým svým válečným lidem nic nesvedeš,
  - nemáš-li řádné a schopné hejtmany,
  - jimž můžeš svěřit statek i čest
  - a na nichž můžeš stavět své plány,
  - kteří tě neošálí ani neoklamou
  - a neválčí o tvé pro vlastní zisk,
  - jak se nyní ve světě často děje: null
  - tím získávají statky a peníze,
  - to tvou ctí ani užitkem nebude.
  - Proto sám hleď na své věci,
  - nebuď mrzutý, pomalý a líný,
  - měj lidi, kteří znají cesty i stezky.
  - V nepřátelském vojsku měj dobré zvědy,
  - nešetři pílí ni penězi na takové posly: null
  - může přijít hodina,
  - kdy se ti vše dvojnásob vrátí.
  - Co můžeš udělat dnes, neodkládej na zítřek,
  - vyhýbej se rouhání a zbytečným starostem.
  - Nikdy nevěř svému nepříteli tolik,
  - abys nebyl stále ve zbrani a na stráži,
  - neboť tak dobře ti on nikdy nepřeje,
  - rád by tě připravil o život i čest.
  - Proto nevěř jeho lstivosti,
  - k odporu buď vždy připraven.
  - Buď ve své věci vždy prozíravý,
  - když je třeba, nespi, nýbrž bdi.
  - Pohrdání, lenost a lehkomyslnost
poznamky:
- n: 1
  text: |-
    Obrácené rčení (správně se psem chytá zajíc): kdo užívá nevhodný nástroj, nic nepořídí – s nezpůsobilými lidmi se válka vést nedá.
