overeno_clovekem: false
bloky:
- typ: odstavec
  de: |-
    Er soll sich auch verstehn auff schiessen mit grossen stücken/auff fewrwerck machen/schiessen vnd werffen/darmit er seine Büchsenmeyster/vnd was jeglicher kan/erkennen vnd verstehn möge.
  cs: |-
    Má se také vyznat ve střelbě z velkých kusů {stücken} a ve zhotovování, střílení a vrhání ohňostrojů {fewrwerck}, aby mohl poznat a posoudit své puškaře {Büchsenmeyster} a to, co kdo z nich umí.
- typ: odstavec
  de: |-
    Ein Zeugmeyster soll sich allwegen befleissen/im vorzug vornen gegen den feinden/im nachzug von den feinden/dahinden bey dem Obersten vnd Kriegßräthen zusein/etliche seine Zeugdiener bey jhm haben/damit was sich zutregt/daß er bey den Rathschlegen sein möge/dann mag er so es die notturfft erfordert/hinhinder zu der Arckelley nach denen oder jhenen stücken/oder was vonnöten ist schicke/auch so man sich lägern soll/soll er dasselbig helffen berathschlagen/dann es ist nicht ein gerings daran gelegen/in der feind Land/vnnd an den feinden ein Läger schlagen/Es bedarff wol rathschlagens/deßgleichen wo/an welchen enden/wie starck an jedem orth die Wachten besetzt werden sollen/berahtschlagen helffen.
  cs: |-
    Zbrojmistr {Zeugmeyster} se má vždy snažit být při tažení proti nepříteli vpředu v předvoji {vorzug} a při tažení od nepřítele vzadu v zadním voji {nachzug}, u nejvyššího [polního hejtmana] a válečných radů {Kriegßräthen}, a mít u sebe několik svých zbrojních služebníků {Zeugdiener}, aby se mohl účastnit porad o všem, co se přihodí. Pak může, vyžaduje-li to potřeba, poslat dozadu k dělostřelectvu {Arckelley} pro ten či onen kus nebo pro cokoli, co je zapotřebí. Také když se má tábořit, má pomoci o tom radit, neboť rozbít ležení {Läger} v nepřátelské zemi a blízko nepřítele není maličkost; to vyžaduje dobrou poradu. Stejně tak má pomáhat radit, kde, na kterých místech a jak silně se mají na každém místě obsadit stráže {Wachten}.
- typ: odstavec
  de: |-
    Der Zeugmeyster soll auch jeder zeit selbs besehen vnnd erfarung haben/was von der Munition auffgeht/ob an etwas mangel vnnd gebrechen erscheinen wölt/daß dasselbig erstatt/oder sonst die sachen darnach fürgenommen vnnd angestelt werden mögen/vnd sich nicht zuuil auff den Zeugwarten vnd ander seine Amptleuth verlassen/dann jm wird fürnemlich vertrawt.
  cs: |-
    Zbrojmistr má také kdykoli sám prohlížet a zjišťovat, co se spotřebuje z munice {Munition} a zda by se v něčem ukazoval nedostatek a chybění, aby se to mohlo doplnit nebo aby se podle toho věci jinak zařídily a uspořádaly. Nemá se příliš spoléhat na zbrojního správce {Zeugwarten} a jiné své úředníky {Amptleuth}, neboť především jemu je [vše] svěřeno.
- typ: nadpis
  uroven: 3
  de: Forma deß Zeugmeysters Eyd.
  cs: Znění přísahy zbrojmistra
- typ: odstavec
  de: |-
    WJewol dem Zeugmeyster sein Eyd/nach gestalt vnd gelegenheyt der sachen gegeben wirdt/So folgt doch jetzt desselbigen vngefährlich ein gemeyne form hernach.
  cs: |-
    Ačkoli se zbrojmistrovi přísaha {Eyd} dává podle povahy a okolností věci, následuje zde přece její přibližné obecné znění.
- typ: odstavec
  de: |-
    Item daß er N. seinem gnädigen Herrn auff disen fürgenommen Feldtzug getrew vnd gewehr sein wölle/seiner gnaden schaden warnen/frommen vnnd nutzen fürdern vnd schaffen/die gantze Arckelley/sampt aller derselbigen zugehörigen personen getrewlich befolhen zuhaben/nach seinem besten vermögen/ob vnnd vor zusein/dieselbige nutzen vnnd gebrauchen nach notturfft/wie dann das N. vnserm gnädigen Herrn/vnd dem gantzen Feldläger am ehrlichsten vnnd nützlichsten sein mag/alles nach Rath vnd gůtem bedüncken deß Obersten vnnd anderer Kriegßräth/auch sonst alles zuthůn vnd zulassen/daß sich einem ehrlichen vnd redlichen mann zuthůn gepürt/auch mit fleiß darob vnd daran sein/damit ohn sein wissen vnd willen keyn Arckelley person angenommen oder geurlaubt werde. So sich auch span vnnd jrrthumb zutrüge/zwischen dem Kriegßherren/oder dem Obersten Feldhauptmann/vnnd jhme dem Zeugmeyster/deß sie sich gütlichen nicht vereynigen möchten/so soll er sollich spän hinder gůt ehrlich Kriegßleuth zu endtlichem entscheyd kommen lassen/was die darinnen sprechen/vngewägert darbey zubleiben/vnd sonst alles zuthůn vnd zulassen/was einem getrewen Zeugmeyster von Ampts wegen gebürt.
  cs: |-
    Dále, že bude N., svému milostivému pánu, na tomto zamýšleném tažení {Feldtzug} věrný a spolehlivý, bude varovat Jeho Milost před škodou, napomáhat a zjednávat jeho prospěch a užitek, věrně opatrovat celé dělostřelectvo se všemi osobami, které k němu patří, podle svých nejlepších sil nad ním bdít a stát mu v čele, užívat ho a používat podle potřeby tak, jak to bude pro N., našeho milostivého pána, a celé polní ležení {Feldläger} nejčestnější a nejužitečnější – vše podle rady a dobrého uvážení nejvyššího [polního hejtmana] a ostatních válečných radů; a také jinak činit a nečinit vše, co náleží čestnému a poctivému muži. Také bude pilně dbát, aby bez jeho vědomí a vůle nebyla žádná osoba dělostřelectva přijata ani propuštěna. A kdyby vznikl spor a nedorozumění {span vnnd jrrthumb} mezi válečným pánem {Kriegßherren} nebo nejvyšším polním hejtmanem {Obersten Feldhauptmann} a jím, zbrojmistrem, na kterém by se nemohli smírně dohodnout, má takový spor předložit dobrým, čestným válečníkům {Kriegßleuth} ke konečnému rozhodnutí a bez odporu se podřídit tomu, co oni v té věci vyřknou; a jinak činit a nečinit vše, co věrnému zbrojmistrovi z moci úřadu náleží.
- typ: nadpis
  uroven: 3
  de: Deß Obersten Zeugmeysters vnterhaltung.
  cs: Vydržování nejvyššího zbrojmistra {Obersten Zeugmeysters}
