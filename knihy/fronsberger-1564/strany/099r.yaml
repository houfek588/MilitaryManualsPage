bloky:
- typ: odstavec
  de: |-
    JSt daß ein grosse macht einen Herrn in seinem Land vberziehen wölt/so dann der feind im anziehen ist/soll man sein gůte vnd gewisse kundtschafft machen vnd haben/alßdann so der feind noch etwann zehen oder mehr meyl von dannen/so verordne man daß keyner/er sey wer er wöll/auß dem Land gegen den feinden passieren könne vnd fürkomme mit gůter gewahrsame/daß den feinden keyn Kundtschafft oder jhr zukunfft zuwissen zukommen möge/alßdann so brech der Herr mit seinem heuflin/vnd einem geringen Feldgeschütz auff/vnd ziehe eylends bey nacht gegen den feinden so nahe er hinzu kommen mag/den Tag lige er still/inn grosser stille vnd geheym/etwann in einem Wald oder Thal/eng eingezogen/vnd laß niemandts auß dem Läger ziehen/er sey wer er wölle/laß auch weder bey tag noch nacht keyn fewr machen/vnd hab sein gůte kundtschafft wo die feind ligen/wo die Reysigen/wo das Fůßvolck/wo das geschütz/darnach so sein Kundtschafft gůt gemacht/so brech er auff gegen abend/vnnd ruck die nacht hinan an die feind so nahe er mag/doch nit gar in die Wacht/dann verordne er alle sachen nach notturfft/vnnd so es gegen tag/oder an seiner zeit ist/auch vnter seinem Kriegßvolck kreyden vnd losung gegeben/so falle er eylendts ohn gewarneter sachen in das Läger/dardurch mag er mit geringer anzal volcks ein treffenliche grosse sach außrichten/dann der feind/dieweil er vermeynt noch weit von sein feinden zusein/darff wol gar ohn Wacht/hůt vnnd sorg in Dörffern traffter zerstrewt ligen/des vberfalls nicht sorgende/oder ob sie schon die Wacht haben/beschicht es doch mit vnfleiß. So man auch also in ein Läger vngewarneter sachen fellt/vnnd der feind deß nit sorgt/gibt es ein grossen schrecken/Man soll sich auch befleissen daß man gůt Kundtschafft hab/wo alle hauffen zu Roß vnd Fůß ligen/vnnd nicht vnterlassen in der Reysigen Läger zufallen/dann biß dieselbigen in solchem vnuersichtlichen schrecken jhre pferd sattlen/zeumen/in harnisch kommen/ist jhr sach schon versaumpt. Zu dem begibt sich in solchen vnzuuersichtlichen einfällen/besonder bey nacht/daß niemand weyß wo auß/einer begert zuflihen/der ander begert sich zuwehren/ist ein groß geschrey/noch volget keyner dem andern/alle ding seind im schrecken vnnd vnordnung/vnnd ist offt geschehen/daß trefliche gůte sachen durch solche vnd dergleichen gůte anschleg außgericht worden seind.
  cs: |-
    Chtěla-li by velká moc vtrhnout některému pánovi do jeho země, má se v době, kdy nepřítel přitahuje, zařídit a mít o něm dobré a spolehlivé zprávy. Když je pak nepřítel ještě asi deset nebo více mil daleko, ať se pod dobrou ostrahou nařídí, aby nikdo, ať je kdo je, nemohl ze země projít a dostat se k nepřátelům, aby se nepřátelé nedozvěděli žádnou zprávu ani o jejich příchodu. Potom ať pán se svým houfkem a s lehkými polními děly vytáhne a v noci rychle táhne proti nepřátelům tak blízko, jak jen se může dostat; přes den ať leží v naprostém klidu a utajení, třeba v lese nebo v údolí, těsně semknut, a ať nikoho, ať je kdo je, nepustí z ležení {Läger} ven a ve dne ani v noci nedovolí rozdělat oheň; a ať má dobré zprávy, kde nepřátelé leží, kde jízda {Reysigen}, kde pěchota {Fůßvolck} a kde děla. Když pak má své zprávy dobře zjištěny, ať k večeru vytáhne a v noci se přiblíží k nepřátelům, jak nejblíže může, ale ne až ke stráži; potom ať všechno potřebné zařídí, a když se blíží den nebo nastane jeho čas a když jeho válečnému lidu byl dán pokřik a heslo {losung}[^1], ať rychle a bez varování vpadne do ležení. Tak může s malým počtem lidu vykonat znamenitou a velkou věc, neboť nepřítel, protože se domnívá, že je od svých nepřátel ještě daleko, leží snad zcela bez stráží, ostrahy a péče rozptýlen po vesnicích a nepřepadu se neobává; nebo, i když stráže má, drží je nedbale. Vpadne-li se takto bez varování do ležení a nepřítel to nečeká, nastane velké zděšení. Je také třeba se snažit mít dobré zprávy, kde leží všechny houfy jízdy i pěchoty, a neopomenout vpadnout do ležení jízdy; než totiž jezdci v takovém nenadálém zděšení osedlají a uzdí koně a obléknou zbroj {harnisch}, je jejich věc už prohrána. Kromě toho se při takových nenadálých vpádech, zvláště v noci, stává, že nikdo neví kudy kam: jeden chce utéci, druhý se chce bránit, je veliký křik, a přece nikdo nejde za druhým; všechno je ve zděšení a nepořádku. A často se stalo, že takovými a podobnými dobrými úskoky {anschleg} byly vykonány znamenité a dobré věci.
- typ: odstavec
  de: |-
    So man also in ein Läger fallen wil/ist vonnöten/daß man gůte kundtschaffter habe/damit das Kriegßvolck nicht etwann in gräben oder andere verhinderung geführt/vnd dardurch alle ordnung zerstrewt/auch das volck zerstrewt werde.
  cs: |-
    Chce-li se takto vpadnout do ležení, je třeba mít dobré zvědy [znalé krajiny], aby válečný lid nebyl zaveden do příkopů nebo k jiným překážkám a tím se nerozpadl celý šik {ordnung} a lid se nerozptýlil.
- typ: odstavec
  de: |-
    Man soll auch allem Kriegßvolck den anschlag vor dem angriff entdecken vnd offenbaren/sie ermanen vnnd berichten/was sie thůn vnnd wie sie sich halten sollen/jhnen auch gůte ehrliche/dapffere vnd geschickte leuth/die man melden vnd anzeygen sol/zuführen geben.
  cs: |-
    Má se také všemu válečnému lidu před útokem úskok odhalit a vyjevit, napomenout ho a poučit, co má dělat a jak se má chovat, a dát mu za vůdce dobré, čestné, statečné a schopné lidi, které je třeba jmenovat a ukázat.
- typ: odstavec
  de: |-
    Jtem ein Statt graben der trocken vnnd nit gefüttert/oder sonst befestigt ist/mag man also befestigen/Man bring alle die wägen reder/so in der Statt seind zusamen/zerstrew sie im graben/vnnd an der thal helde deß grabens allenthalben traffter/vnd heffte dann die Reder ein jedes mit vier/fünff/oder sechs gůten stötzen in die erden geschlagen/wol auff die erden/damit sie die feind nicht bewegen mögen/So dann die feind den Sturm anlauffen/so mögen sie vor den Redern nit fort kommen/sie tretten zwischen den Speichen/fallen/vnnd zerbrechen die beyn/trucken die hindern hernach/vnnd burtzelt einer vber den andern/Zu dem auch die auffgerichte naben vnnd
  cs: |-
    Dále: Městský příkop, který je suchý a není vyzděný ani jinak zpevněný, lze opevnit takto: Ať se snesou všechna kola od vozů, která jsou ve městě, rozhází se v příkopu a po celém svahu příkopu tu a tam a každé kolo se pak dobře připevní k zemi čtyřmi, pěti nebo šesti dobrými kolíky zatlučenými do země, aby jimi nepřátelé nemohli pohnout. Když pak nepřátelé vyběhnou k útoku, nemohou se přes kola dostat dál: šlapou mezi paprsky, padají a lámou si nohy, zadní se tlačí za nimi a jeden přes druhého padá. Kromě toho [jim] i vztyčené náboje a
poznamky:
- n: 1
  text: |-
    Kreyde (Kreide) – válečný pokřik, poznávací volání vlastních lidí; Losung – heslo.
