bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    die flucht treib/so lang biß die Statt jhr vertrawen auff jhn setz/seiner Rathschleg pfleg/sich jhm auch befelhe vnnd ergeb/die mag gemelter knecht darnach jhm füglich lifferen/wie Sextus Tarquinius die Gabier dem König Cyro/oder Zopirus die Babylonier/seinem Vatter. Also möchten auch alle thůn/so vnter einem schein auß dem Läger in die Statt Feldflüchtig würden/wo er jhnen die redlichste gefäncklich in die Statt zuführen/nachts ein eingang zumachen/zustellte/Er soll etwann vnter erdichter friedwerbung/die erfarneste Knecht/deß Feinds Statt oder Läger/wachten/geschütz/Munition vnd der Hauptleuth Quartier bespähen lassen/dienet fürderlich zu berührter dückischen vortheylen vnd nächtlichem vberfall. Der Späher soll er manchen bestellen/damit etwa falsche mähr/durch vil kundtschafft erkannt oder vermerckt werd/welches dann sicher geschicht/wann keyner den andern weyß noch erkennt/Ergriff er aber ein feindlichen verrähter in seiner Jurißdiction/vnd sein hauff gegen dem Feind zuschwach wer/soll er jhn vnberecht entleiben/oder wer er starck genug/soll er jhn zum leben reichlich begaben/vnnd noch vil mehr verheyssen/so er jhme seines Herren anschleg verkundtschafft/doch wol bewaren/also/daß er mercke/was jhm begegnen werd/wo er vntrew vnnd falsch sein würd/Er soll auch vor jhm/was er förcht das möcht geschehen/wünschen/vnd was er begert/wünschen/daß es nicht geschehe. Wolt hie zwischen einer sein gewaltigen Befelchsleuth/zum feind mit seinem anhang fallen/mit dem soll er sich auffs listigst versünen/alßbald er aber sein nichts mehr bedarff/sampt seiner meuterey auff ein peut schicken/den feinden verkuntschafften/so sie dann einander auffwercken/wird er beyd an feinden vnnd verrähtern ohn seinen nachtheyl gerochen/wie Dauid durch die Rabbahiter am vnschuldigen Uria. Wo jhr aber vil Rathschlagten zum Feind zuziehen/dann soll er etliche Hauptleuth zu gleichem fürnemen auffwiglen/daß sie jhene vnterwegen erlegen/weren sie jhnen hierüber entschlichen/soll er gemeyn halten/vnd jnen in geheym sagen/daß sie mannlich bestehen wöllen/dann alle die jhenigen/so sie für abtrünnige bößwichter halten/hab er mit fleiß zun feinden gesand/jhre anschleg zuuernemen/so bald dann der Feind solche mähr vernimpt/wird er sie als argwönige/feldflüchtige bößwichter suchen/vnd wie verrähter straffen. Weiter soll er auch auß eines jeden Hauptmanns gegenrodel/seine Knecht offt ablesen/vnnd vmbschrancken/welcher dann in oder ausserhalb dem Läger ergriffen wird ohn befelch/denselben nicht allein argwönig achten/sonder ohn alle mittel vnd gnad peinlich rechtfertigen/vnd weg/steg/feld/gesteud/bäß vnnd höff/mit wackerer hůten verlegen/sein Rath/Läger/vnnd alle Befelchsleuth offt endern/das macht fromme Knecht vnd Amptleuth/vnnd wendet vil verrähterische anschleg.
  cs: |-
    na útěk, a to tak dlouho, až mu město začne důvěřovat, řídit se jeho radami, svěří se mu a podrobí; pak mu je zmíněný knecht může snadno vydat, jako Sextus Tarquinius vydal Gabijské králi Kýrovi nebo Zópyros Babylóňany svému otci.[^1] Totéž by mohli učinit všichni, kdo by pod nějakou záminkou zběhli z ležení {Läger} do města, kdyby jim [vojevůdce] svěřil ty nejstatečnější, aby je jako zajatce přivedli do města a v noci jim otevřeli vstup. Někdy má pod záminkou předstíraného vyjednávání o mír nechat nejzkušenější knechty {Knecht} vyzvědět nepřátelské město nebo ležení, stráže, děla {geschütz}, munici a ubytování hejtmanů {Hauptleuth}; to dobře poslouží ke zmíněným lstivým výhodám a k nočnímu přepadu. Zvědů má najmout mnoho, aby se případné falešné zprávy díky mnoha zpravodajstvím poznaly a odhalily; to se jistě stane, když jeden druhého nezná a nepozná. Chytí-li však ve svém obvodu nepřátelského vyzvědače a jeho houf je proti nepříteli příliš slabý, má ho bez soudu zabít; je-li však dost silný, má mu darovat život, štědře ho obdarovat a slíbit mu ještě mnohem víc, prozradí-li mu plány svého pána; má ho však dobře střežit, aby věděl, co ho čeká, bude-li nevěrný a falešný. Má si také před ním přát to, o čem se bojí, že by se mohlo stát, a o tom, po čem touží, si přát, aby se to nestalo. Kdyby mezitím chtěl některý z jeho mocných velitelů {Befelchsleuth} se svými stoupenci přeběhnout k nepříteli, má se s ním co nejlstivěji smířit; jakmile ho však už nebude potřebovat, má ho i s jeho vzbouřenci poslat na kořistnou výpravu a dát o tom vědět nepřátelům. Když se pak navzájem pobijí, bude bez vlastní škody pomstěn na nepřátelích i zrádcích, jako se David skrze Rabbské [Amonity] pomstil na nevinném Urijášovi.[^2] Kdyby však mnozí zosnovali přeběhnout k nepříteli, má několik hejtmanů navést, [aby předstírali] týž úmysl a cestou je pobili. Kdyby jim přesto unikli, má svolat obec {gemeyn} a tajně jí říci, ať se mužně drží, neboť všechny ty, které pokládají za odpadlé ničemy, poslal k nepřátelům úmyslně, aby vyzvěděli jejich plány. Jakmile se nepřítel tu zprávu dozví, bude je jako podezřelé zběhlé ničemy stíhat a trestat jako zrádce. Dále má podle kontrolního rejstříku {gegenrodel}[^3] každého hejtmana často vyvolávat jeho knechty a obstupovat je; kdo je pak bez rozkazu dopaden v ležení nebo mimo ně, toho má nejen pokládat za podezřelého, ale bez prodlení a bez milosti hrdelně soudit. Cesty, stezky, pole, houštiny, průsmyky a dvory má obsadit bdělými strážemi a svou radu, ležení i všechny velitele často měnit; to dělá knechty a úředníky řádnými a odvrací mnohé zrádné úklady.
- typ: nadpis
  uroven: 2
  de: Von geheymnuß vnd stilligkeyt der Zungen.
  cs: O tajnosti a mlčenlivosti jazyka
- typ: odstavec
  de: |-
    ES ist vnter allen anderen tugenden eines thewren Fürstehers zum Sig nichts fürderlichers/dann ein vnüberwindliche verschwigenheyt der zungen vnd geberde/welche offt Land vnd Leuth erhalten/auch offt durch vnbehůtsame rede verderbt hat. Derhalben der Edel Römisch Hauptmann Metellus Cecilius/als er von seinem Feldtweibel gefragt/wie er den sachen thůn wölt/jhm nicht vnweißlich geantwort hat/er wölt sein kleyd außziehen vnd verbrennen/wann er wißt daß es seines Raths geheymnuß verstünde. Antigonus der groß genant/da jhn sein Sohn
  cs: |-
    Mezi všemi ostatními ctnostmi znamenitého vůdce {Fürstehers} není nic, co by k vítězství napomáhalo víc než nepřemožitelná mlčenlivost jazyka i posunků; ta často zachovala zemi i lid, kdežto neopatrná řeč je často zahubila. Proto vznešený římský vojevůdce {Hauptmann} Metellus Caecilius,[^4] když se ho jeho šikovatel {Feldtweibel} ptal, jak chce věci provést, mu nikoli nemoudře odpověděl, že by svůj šat svlékl a spálil, kdyby věděl, že rozumí tajemství jeho rady. Antigonos, zvaný Veliký, když se ho jeho syn
poznamky:
- n: 1
  text: |-
    Fronsperger obě antické historky zaměňuje: Sextus Tarquinius vydal lstí město Gabie svému otci, králi Tarquiniovi Zpupnému (Livius I,53–54), a Zópyros vydal Babylón perskému králi Dareiovi (Hérodotos III,153–158).
- n: 2
  text: |-
    2 Sam 11: David dal Urijáše postavit při obléhání ammonského města Rabba do nejprudšího boje, aby padl.
- n: 3
  text: |-
    Gegenrodel – druhý, kontrolní exemplář přehlídkového rejstříku praporce; podle něj se vyvolávali knechti. „vmbschrancken“ = obehnat ohradou, obstoupit (jako při přehlídce, kde knechti procházeli mezi závorami).
- n: 4
  text: |-
    Quintus Caecilius Metellus Pius, římský vojevůdce ve válce se Sertoriem; výrok o tunice, kterou by spálil, kdyby znala jeho plány, uvádí Frontinus (Strategemata I,1,12).
