id: 074r
list: LXXIIII
strana: recto
sken: 155
stav: zkontrolovano
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    mit jnen auff ein orth/vnnd bittet sie/daß sie jhn wöllen weisen/Rath vnnd lehre geben/daß er dem Profosen auff die schwere klage antwort geben möge/die er auff jhn thůt/das erzelt sein Fürsprech dem Profosen vor dem gemeynen Mann auch.
  cs: |-
    s nimi stranou a prosí je, aby ho poučili, dali mu radu a naučení, jak by mohl profousovi {Profosen} odpovědět na těžkou žalobu, kterou proti němu vznáší. To pak jeho mluvčí {Fürsprech} přednese profousovi rovněž před obcí {gemeynen Mann}.
- typ: odstavec
  de: |-
    Zum neundten/nimpt der Profoß seinen Rath auch zum andern mal/vnnd bleibt bey seiner ersten klag/wil der gefangen vom Profosen sein klag verantworten vnd nit geständig sein/so läßt er die kundtschafft vber jn verlesen wie er gehandelt hab.
  cs: |-
    Za deváté: Profous vezme svou radu i podruhé a trvá na své první žalobě. Chce-li se vězeň proti profousově žalobě hájit a nechce se přiznat, dá [profous] přečíst svědectví {kundtschafft} proti němu o tom, jak si počínal.
- typ: odstavec
  de: |-
    Jetzt gibt der gefangen durch sein Rath dem Profosen antwort auff die kundtschafft/die vber jhn gangen ist/auff das geht der Profoß zum dritten mal mit seinem Rath auß dem Ring/vnd bleibt bey seiner ersten klag vnd der verleßnen kundtschafft/vnd sitzt darmit vor dem gemeynen Mann zu Recht. Jetzt gibt der gefangen dem Profosen durch sein Rath zum dritten mal antwort/vnd setzts auch zu Recht/vnnd bittet den gemeynen Mann vmb ein gnädige vrtheyl.
  cs: |-
    Nyní vězeň skrze svou radu odpoví profousovi na svědectví, které proti němu bylo vedeno. Nato jde profous se svou radou potřetí z kruhu {Ring}, trvá na své první žalobě a na přečteném svědectví a předkládá tím věc obci k rozsudku. Nyní vězeň skrze svou radu odpoví profousovi potřetí, rovněž věc předloží k rozsudku a prosí obec o milostivý rozsudek.
- typ: odstavec
  de: |-
    Zum zehenden/thůn die Fänderich jhre Fändlin zu/vnd steckens mit dem eysen ins Erdrich/vnd thůt einer vnter jhnen das wort/vnd spricht also: Liebe ehrliche Landsknecht/jhr habt des Profosen schwere klag wol vernommen/die er vber den Hansen hat eingefürt/darauff wir vnsere Fändlin zuthůn/vnd kerens vmb mit dem eysen ins Erdrich/vnd wöllens dißmal nimmer fliegen lassen/biß vber solche klag ein vrtheyl geht/auff daß vnser Regiment ehrlich sey/Wir bitten euch auch alle inn gemeyn/jr wöllen im Rath vnpartheysch sein/vnd ein vrtheyl fellen/als weit ewer verstand außreycht/wann das geschicht/so wöllen wir vnser Fändlin widerumb lassen in aller maß vnd gestalt wie vor/fliegen/vnd bey euch thůn/wie ehrlichen Fändrichen zustehet. Jetzt rüfft der Feldweybel einem im Ring/derselbig kompt in Ring/vnd spricht/also/Liebe Landtsknecht/hie bin ich gefragt worden auff meinen Eyd vmb ein rath/bin ich der sach allein nicht weiß gnug/beger gůte ehrliche Kriegßleuth zů mir in meinen Rath im Ring/vnnd auß dem Ring/die befelch haben/Edel/vnedel/als viel als auff viertzig Mann/so wil ich mit denselbigen auß dem Ring an ein ort gehen/vnnd bey jnen rath suchen/trewlich vnd vngefährlich/als viel als vnser verstandt außweiset/Nachdem kommen sie wider in Ring/vnd erzelen dem gemeynen Mann/was sie gerathschlagt haben/vnd ob jnen jr rath nicht gefiel/so wöllen sie von dem jrem zu einem anderen fallen/Jetzt rüfft man einem anderen Rath/der gibt zu gleicher form wie obgemelt/darnach im dritten in aller maß vnd gestalt also/vnnd wann die Räth alle drey gangen seind/so erzelt mans dem gemeynem Mann/einem nach dem anderen/vnnd läßt vmbschlahen mit dreyen Trommen/bey ehr vnd eyd/wann man den Rath mehrt/daß keyner zwey oder dreymal soll auffheben/Jetzt fellt der arm Mann nider/vnd bittet den gemeynen Mann vmb ein gnedige vrtheyl.
  cs: |-
    Za desáté: Praporečníci {Fänderich} svinou své praporce {Fändlin}, zarazí je železným hrotem do země a jeden z nich se ujme slova a praví takto: „Milí čestní lancknechti {Landsknecht}, dobře jste vyslechli těžkou žalobu, kterou profous vznesl proti Hansovi[^1]. Proto svinujeme své praporce, obracíme je hrotem do země a nenecháme je již vlát, dokud o této žalobě nepadne rozsudek, aby náš řád {Regiment} zůstal čestný. Prosíme vás také všechny společně, abyste byli v radě nestranní a vynesli rozsudek, nakolik váš rozum stačí. Až se tak stane, necháme své praporce opět vlát ve všem tak jako dříve a budeme stát při vás, jak se na čestné praporečníky sluší.“ Nyní šikovatel {Feldweybel} vyvolá v kruhu jednoho muže; ten předstoupí do kruhu a praví: „Milí lancknechti, byl jsem zde při své přísaze {Eyd} tázán o radu. Sám nejsem v té věci dost moudrý, a proto si žádám do své rady dobré čestné válečníky z kruhu i mimo kruh, kteří mají velení, urozené i neurozené, asi tak čtyřicet mužů. S nimi chci odejít z kruhu stranou a radit se s nimi věrně a bez lsti, nakolik náš rozum stačí.“ Potom se vrátí do kruhu a oznámí obci, na čem se usnesli; a kdyby se jim jejich rada nelíbila, mohou od ní upustit a přiklonit se k jiné. Nyní se vyvolá jiná rada, která se vyjádří stejným způsobem, jak bylo řečeno, a potom třetí, zcela stejně. A když všechny tři rady proběhly, oznámí se obci jedna po druhé a třemi bubny se vybubnuje, že při cti a přísaze nikdo nesmí při hlasování o radách zvednout ruku dvakrát nebo třikrát. Nyní ubožák padne na kolena a prosí obec o milostivý rozsudek.
- typ: odstavec
  de: |-
    Zum eylfften/wann das vrtheyl gangen ist/so seind die Fänderich da/vnnd bedancken sich fast gegen dem gemeynen Mann/daß sie so willig seind gewesen vnnd so ehrlich/vnd ehrhafftig gůt Regiment zustercken vnd zuhalten/vnd werffen jre Fändlin in die höhe vnd lassens fliegen/vnd ziehen mit gegen auffgang der Sonnen/vnnd machen ein gassen/vnnd dieweil läßt der Profoß den armen Mann beichten/biß die gassen gemacht werden.
  cs: |-
    Za jedenácté: Když byl rozsudek vynesen, předstoupí praporečníci a velice děkují obci, že byla tak ochotná a tak čestně a poctivě posílila a zachovala dobrý řád. Vyhodí své praporce do výšky, nechají je vlát, táhnou s nimi k východu slunce a utvoří uličku {gassen}; a mezitím dá profous ubožáka vyzpovídat, dokud není ulička hotova.
- typ: odstavec
  de: |-
    Zum zwölfften/so kompt der Profoß mit sampt dem gefangnen inn die gassen/vnnd begert daß man mit dreyen Trommen soll vmbschlahen/zum drittenmal/daß
  cs: |-
    Za dvanácté: Potom přijde profous spolu s vězněm do uličky a žádá, aby se třemi bubny potřetí vybubnovalo, aby
poznamky:
- n: 1
  text: |-
    „Hans“ – obecné jméno pro obžalovaného knechta (jako české „Honza“; srov. „velcí i malí Hansové“ na předchozí straně).
