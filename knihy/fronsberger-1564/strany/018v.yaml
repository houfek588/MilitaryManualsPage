id: 018v
list: XVIII
strana: verso
sken: 44
stav: zkontrolovano
bloky:
- typ: odstavec
  de: |-
    Gleicher gestalt soll es mit allem andern Geschütz/es seien Mawrbrecher oder Feldtgeschütz angestelt/vnd mit Rossen nach notturfft versehen werden/inn betrachtung seins lasts vnnd schwere/Doch ist darinnen zubedencken/daß die gefeß an dem mittelmäßigen vnd kleynen Feldtgeschütz nit so schwer/derhalben dasselbig inn besetzung der Pferdt gemerckt vnd angesehen werden mag.
  cs: |-
    Stejným způsobem se má postupovat u všech ostatních děl {Geschütz}, ať jsou to bořiče hradeb {Mawrbrecher}, nebo polní děla {Feldtgeschütz}: mají se náležitě opatřit koňmi s ohledem na svůj náklad a váhu. Přitom je však třeba uvážit, že lafety {gefeß} u středních a malých polních děl nejsou tak těžké; to lze při přidělování koní vzít v úvahu a zohlednit.
- typ: odstavec
  de: |-
    Also wird auch nach gestalt vnnd gelegenheyt der sachen/vnd nach dem beduncken der Kriegßräth ander Geschütz als grosse Böler zum steyn/vnnd kleyne Böler zum Fewr werffen/sampt einer anzal Fewrbüchsen in Feldzug zunemen verordnet/so wird dasselbig auch nach seiner erheyschung der notturfft mit Wägen darzu dienlich/vnd nottürfftiger anzal Roß angestellt vnd versehen.
  cs: |-
    Nařídí-li se tedy podle povahy a okolností věci a podle uvážení válečných radů {Kriegßräth} vzít na tažení {Feldzug} i jiná děla, jako velké moždíře {Böler} na vrhání kamenů a malé moždíře na vrhání ohně spolu s několika ohnivými moždíři {Fewrbüchsen}, opatří se i ona, jak toho potřeba vyžaduje, vhodnými vozy a potřebným počtem koní.
- typ: odstavec
  de: |-
    So nuh im Kriegßrath erwegen vnnd beschlossen/was vnd wieuiel Geschütz man mit führen/was man damit handlen vnd außrichten wil/so ist von nöten fleißig zubedencken/wieuil vnnd was man für Kuglen mit führen vnnd nemen wil/das ist leichtlich zurechnen/so man gut Puluer hat/wieuiel man desselbigen mit führen vnd nemen muß/zu souiel Kuglen von nöten/gemeynlich am gewicht halben theyl souiel als die Kuglen wegen/So ist auch gut zubedencken/wieuiel tag man Kuglen vnd Puluer haben mag/dann so man fertige Büchsenmeyster hat/mag jeder ein tag dreißig oder mehr schüß thun/Demnach muß die Rechnung gemacht werden/wann man weyß wieuiel man Büchsen vnnd Büchsenmeyster hat/doch muß man des Puluers nicht eben demselbigen gewicht der Kuglen nach nemen/dann es ist von nöten/daß man mehr Puluers neme/dann man desselbigen etwann in ander weg zu Fewrwerck vnnd sonst auch nottürfftig ist/so begibt sich etwann/daß man ein Besatzung erobert/dann vberkompt man der geschossen Kuglen den mehrern theyl wider. Sollichs alles vnnd dergleichen so man nicht alles schreiben/vnnd in die fäder bringen mag/steht den Kriegßräthen/vnnd besonder dem Zeugmeyster sampt seinem Leutenandt/Zeugwarten/vnd andern Arckelley Personen/so damit vmb sollen gehn/zubedencken.
  cs: |-
    Když se tedy ve válečné radě uváží a rozhodne, jaká a kolik děl se poveze a co se jimi má podniknout a vykonat, je třeba pilně uvážit, kolik a jakých koulí {Kuglen} se má vézt a vzít s sebou. Má-li se dobrý střelný prach {Puluer}, snadno se pak spočítá, kolik ho je na tolik koulí třeba vézt a vzít: obvykle polovinu toho, co koule váží. Dobře je také uvážit, na kolik dní mohou koule a prach vystačit; má-li se totiž zběhlé puškaře {Büchsenmeyster}, může každý vystřelit za den třicet nebo více ran. Podle toho se musí udělat výpočet, když se ví, kolik je děl {Büchsen} a puškařů. Prachu se však nemá brát právě jen podle váhy koulí; je třeba vzít ho více, protože ho bývá zapotřebí i jinak, k ohňostrojům {Fewrwerck} a k jiným věcem. Někdy se zase stává, že se dobude posádka {Besatzung}, a pak se větší část vystřelených koulí získá zpět. To vše a podobné věci, které nelze všechny popsat a svěřit peru, náleží uvážit válečným radům a zvláště zbrojmistrovi {Zeugmeyster} spolu s jeho poručíkem {Leutenandt}, zbrojními správci {Zeugwarten} a jinými osobami dělostřelectva {Arckelley}, které s tím mají zacházet.
- typ: odstavec
  de: |-
    Es mag aber an solchen Zeugwägen/so Puluer/Kuglen vnnd dergleichen füren/des täglich weniger wird/bedacht/vnd dieselbigen Wägen dester stattlicher vnd schwerer geladen werden.
  cs: |-
    U takových zbrojních vozů {Zeugwägen}, které vezou prach, koule a podobné věci, jichž denně ubývá, se však s tím může počítat a tyto vozy se mohou naložit tím vydatněji a více.
- typ: odstavec
  de: |-
    So dann jetzt alles geschütz sampt aller Munition darzu gehörig berathschlagt/beschlossen/vnd was man mit füren wil/verordnet/So ist leichtlich zurechnen/wieuiel man Personen vnd Wagenpferd darzu gebrauchen vnd haben muß.
  cs: |-
    Když je tedy o všech dělech spolu se vší příslušnou municí {Munition} uradíno a rozhodnuto a nařízeno, co se poveze, lze snadno spočítat, kolik osob a vozních koní je k tomu třeba použít a mít.
- typ: odstavec
  de: |-
    Item so man dann die Wagenleuth vnd Roß bestellt/das thůt man bey dem nechsten so man mag/dann dieweil derselbigen Besoldung inn einem Land anders dann inn dem andern/vnnd täglich nach gelegenheyt enderung hierinn gemacht/auch gelegenheyt hierinn bedacht werden muß/kan man jhr Besoldung nicht wol melden/So sie aber bestellt/vnd man weyß wieuiel der Pferdt/wieuiel der Personen/wieuiel auff jedes Besoldung/so ist jetzt auch durch Rechnung leichtlich zufinden/was kostens es ein Monat erfordert.
  cs: |-
    Dále: když se pak najímají vozkové {Wagenleuth} a koně, činí se to co nejlevněji[^1], jak jen to jde. Protože je jejich žold {Besoldung} v jedné zemi jiný než v druhé, denně se podle okolností mění a i na okolnosti se přitom musí brát ohled, nelze jej dobře uvést. Jsou-li však najati a ví-li se, kolik je koní, kolik osob a kolik žoldu připadá na každého, lze snadno spočítat, kolik to bude stát za měsíc.
- typ: odstavec
  de: |-
    Es ist aber in bestellung vnd annemung der Führleuth zumercken/daß man jnen
  cs: |-
    Při najímání a přijímání vozků {Führleuth} je však třeba dbát na to, aby se jim
poznamky:
- n: 1
  text: |-
    „bey dem nechsten“ – co nejblíže, tj. co nejlaciněji; srov. 22r „man bestellt sie auffs nächst man mag“.
