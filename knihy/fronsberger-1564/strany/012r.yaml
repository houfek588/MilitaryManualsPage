bloky:
- typ: nadpis
  uroven: 3
  de: Zeughauß.
  cs: Zbrojnice
- typ: odstavec
  de: |-
    EJn Zeughauß soll gebawet sein etwann an einem orth/da es dem gemeynen wandel der Leuth nicht zu nahe/auch vonn andern heusern vnnd wonungen abgesondert/vnnd mit Porten vnnd anderer notturfft wol versehen vnnd bewart sey/damit man dester sicherer sein möge vor fewer vnnd anderm vnrath/so etwann vngefährde außgieng/oder sonst mit verrätherey zůgericht werden möcht. Es soll auch mit seinen versperten vnnd verwarten Choren vnd plätzen alles zu notturfftigem brauch geordnet/vnnd nach gelegenheyt vnnd notturfft mit seiner weite/grösse vnnd höhe gebawet sein/Jedoch ist besser/es werde mehr inn die weite dann höhe gebawet/dann die höhe an den Zeugheusern auß vielerley vrsachen zuvermeiden seind. Es were auch treffenlich nutz vnd gůt/daß die Zeugheuser etwann in vesten wol verwarten Berck Schlössern/oder wa die inn Stätten/daß sie mit gůten gräben/Streychwehren vnd auffziehenden Brücken wol verwart würden/damit nit die Feinde alßbald als die Freunde (oder vielleicht etwann mit verrätherey) ehe darzů kommen möchten/sonderlich etwann in auffrhůrn des gemeynen Pöfels. So wir nuh vngefährlich die form vnnd gelegenheyt des Zeughauß angezeygt/wöllen wir jetzt melden/wie dasselbig mit Geschütz vnd Munition versehen soll sein/Dieweil aber hierinn keyn maß angezeygt oder gegeben werden mag/dann ein jeder Herr sein Zeughauß versicht/nachdem er etwann zu sollichen dingen lust oder das vermögen hat/Derhalben so wöllen wir jetzo nicht mehr anzeygen/denn allerley geschlecht des grossen vnd des Feldtgeschütz sampt seiner notturfftigen Munition/desselbigen mag dann ein jeder Kriegßherr machen vnnd zůrichten lassen/souiel er wil oder jhm noth ist. Nuh ist nicht viel daran gelegen/wie man den Büchsen Namen gibt/oder was grösse ein jede hat/dann dasselbig zu ordnen vnd machen in eins jeden gefallen vnd willen steht/werden auch an einem ort anders dann an dem andern genennt/zu dem täglich verendert vnnd anders gemacht/Es haben aber etlich das groß Geschütz in geschlecht außgetheylt/vnd dieweil vns dasselbig auß allerhand vrsachen nit vnförmlich bedünckt/wöllen wir im selbigen jhnen nachfolgen/vnnd erstlichen am grossen Geschütz anfahen.
  cs: |-
    Zbrojnice {Zeughauß} má být postavena pokud možno na místě, kde není příliš blízko běžnému ruchu lidí, odloučena od jiných domů a obydlí a dobře opatřena a zabezpečena branami a dalšími potřebnými věcmi, aby byla tím bezpečnější před ohněm a jinou pohromou, která by snad vypukla nešťastnou náhodou nebo by byla jinak způsobena zradou. Má být také se svými uzamčenými a zajištěnými odděleními {Choren}[^1] a prostorami celá uspořádána k potřebnému užívání a postavena do šířky, velikosti a výšky podle okolností a potřeby. Je však lepší stavět spíš do šířky než do výšky, protože výšce je třeba se u zbrojnic z mnoha důvodů vyhnout. Bylo by také velmi užitečné a dobré, aby zbrojnice stály pokud možno na pevných, dobře opevněných horských hradech, anebo, jsou-li ve městech, aby byly dobře zabezpečeny dobrými příkopy, bočními obrannými stavbami {Streychwehren}[^2] a padacími mosty, aby se k nim nepřátelé nedostali dříve nebo stejně brzy jako přátelé (nebo snad zradou), zvláště při případných vzpourách obecného lidu {Pöfels}. Když jsme tedy přibližně ukázali podobu a umístění zbrojnice, chceme nyní vyložit, jak má být opatřena děly {Geschütz} a municí {Munition}. Protože však v tom nelze ukázat ani stanovit žádnou míru – každý pán totiž vybavuje svou zbrojnici podle toho, jakou má k takovým věcem chuť nebo prostředky –, nechceme nyní uvádět víc než všechny druhy velkých a polních děl s jejich potřebnou municí; těch si pak může každý válečný pán {Kriegßherr} dát zhotovit a připravit, kolik chce nebo potřebuje. Nezáleží přitom mnoho na tom, jaká jména se dělům {Büchsen} dávají nebo jakou velikost které má, neboť jejich uspořádání a zhotovení je na vůli a libosti každého; na jednom místě se také nazývají jinak než na druhém a navíc se denně mění a dělají jinak. Někteří však velká děla rozdělili do druhů {geschlecht}, a protože se nám to z rozličných důvodů nezdá nevhodné, chceme je v tom následovat a začít nejprve u velkých děl.
- typ: odstavec
  de: |-
    Dieweil wir zum anfang das Zeughauß mit allerhandt geschlecht des grossen vnd kleynen Geschütz sampt notturfftiger Munition/vnnd was zum Geschütz in Zeughauß vnnd zum vorrath gehört/beschreiben/vnd daher stellen wöllen/so ist der anfang an dem grossen geschütz zuthůn/vnd wird bey etlichen dafür gehalten/daß ordenlichen nit mehr dann acht geschlecht des Geschütz (deren vier geschlecht heyssen vnd seind Mawrbrecherin/die andern vier geschlecht seind vnd heyssen Feldtgeschütz) sein sollen/wiewol es keyn Gesatz hat/man mags machen vnd nennen wie man wil/Doch wöllen wir vmb besser verstands vnnd ordnung willen bey nachfolgender ordnung bleiben/vnnd erstlich die vier geschlecht der Mawrbrecherin/wie dann die Namen von den Welschen herkommen/nennen/vnnd ordenlich nach einander beschreiben.
  cs: |-
    Protože chceme na začátku popsat a představit zbrojnici se všemi druhy velkých i malých děl, s potřebnou municí a se vším, co k dělům ve zbrojnici a do zásoby patří, je třeba začít u velkých děl. Někteří mají za to, že řádně by nemělo být víc než osm druhů děl (z nich čtyři druhy se nazývají a jsou bořiči hradeb {Mawrbrecherin}, ostatní čtyři druhy jsou a nazývají se polní děla {Feldtgeschütz}), ačkoli o tom není žádný zákon a každý je může dělat a pojmenovat, jak chce. Pro lepší srozumitelnost a pořádek však zůstaneme u následujícího rozdělení a nejprve vyjmenujeme čtyři druhy bořičů hradeb, jak jejich jména pocházejí od Vlachů {Welschen}[^3], a popíšeme je popořadě jeden po druhém.
poznamky:
- n: 1
  text: >-
    Choren – v tisku zřetelně „Choren“; patrně ve smyslu oddělených prostor, komor či ochozů zbrojnice
    (srov. Chor = vyvýšený, oddělený prostor). Čtení „Thoren“ (brány) nelze vyloučit.
- n: 2
  text: >-
    Streichwehr – obranná stavba (malá bašta, kaponiéra) vysunutá do příkopu, z níž se příkop „ometá“ boční palbou.
- n: 3
  text: Welsche – Vlaši, tj. Italové (popř. obecně Románi); italské názvy děl viz dále.
