  de: |-
    ein war grundfeste ist deß vngezweyffelten siegs/Auff welche gemelte Haupttugengen anfencklich müssen gegründt werden/vnd mit obgemelten dreyen stücken/so ich gegen dem anfang/mittel vnnd ende gestellt hab/als mit künstlichem belesen/gehör/vnnd mit eygner erfarenheyt gnůgsam erbawen. Die Kunst lehret den Leser/hörer vnd erfarer/auß alt beschribnen geschichten/die breuch/vbung vnd vortheyl der Waffen/zu roß vnd zu fůß/auch jeder ämpter Beuelchs verwaltung vorhin vnd nach dem Krieg/gegen freunden/verbündten vnnd feinden/auff Zügen/Scharmützen/Stürmen vnd Schlachten/zugleich dem vberwundnen/vnd dem vberwinder nutzbarlich. Das gehör wiewol es etwas lüfftig vnd vnbestendig/ist es doch zur einbildung vortheyliger anschlege/vnd zur erfarenheyt nicht die wenigest anreytzung/auch einbrünstige vrsach zulesen/selbs eygne erfarenheyt ist ja entlich zum hochlöblichsten/viel geäferte Belesung ist aber viel hefftiger vnnd heylsamer/Aber das gehör ist inn allweg zum vortheyl fürderlich. Verstendlich lesen allein die Gelehrten/vnd das in sicherheyt/aber glücklich erfaren/mögen allein die so nach vortheyliger vorbetrachtung der vermerckten vnnd wolbelesenen geschichten obgenenter vier tugenden theylhafftig seind. Jn allweg aber ist die außerlesene kunst allen fürzuhalten/nit allein daß durch geschrifft in kurtzen tagen oder stunden/mehr erlesen vnd weißlich ergriffen/weder in hundert jaren/auch von den klügesten mit der that vnd erfarenheyt mag erlernt werden/sonder auch darumb/daß sie die aller Großmächtigsten Heerführer/Nemlich/Dauid bey den Juden/Darius bey den Persen/Ninus bey den Babyloniern/Alcibiades bey den Griechen/Julius vnd Augustus bey den Römern/Arminius bey den Teutschen/jha inn altem Römischen Reich allezeit/die aller vnüberwindtlichste Kriegleuth/nicht allein geehrt/sonder auch selbs von der wiegen her/ernstlich gelehrnet/auch offt im angriff der feinde/dem hellen hauffen fürgehalten/vnd durch tägliche vbung ein sollichs hertz eingesteckt/daß sie durch bewerte erfarung/gar nach die gantze Welt also bekriegt/daß sie nicht allein auß dem Hirten heuflin Romuli/ein haupt vnd seul der Welt gemacht/sonder auch ein andere Welt Ritterlich zu bestreitten begeret haben/so doch hie zwischen alle Kunstverächter/jhr geschundne vnd außgemärgelte heuflin/jha jhr eygne rhůwinckelin mit jhrem blinden vnwissenhafftigen geytz kaum vor einem nichtigen streyffröttlin bewaren vnd entschütten/weder wissen noch mögen. Dieweil auch solche Kunst/alle zeit stercke der sinn vnnd deß leibs als ein stäten geferten haben/so nötig ich keyn Kriegßman zu erfarung der siben freyen Künste/seytenmal deren jegliche sonderlich inn Menschlichem alter schwerlich erlernet wird/wiewol die der vhralten Ritterschafft nicht vnmähr gewesen seind/sonder erman jeden allein zu souiel kunst/als vil zur besserung vnnd erkantnuß der alten Löblichen gethaten/so Lateinisch vnd Teutsch beschrieben/notturfftig sein mag/durch welche die geschwind vnd thättig stercke der sinnen vnd deß Leibs nicht geschwecht/sonder erleuchtet vnd bekrefftiget werd/Dann wiewol vernünfftige vnnd sinnreiche Rathschleg/Himlische Gottes gaben/etwann in einer Senfft vnd Roßpar zun Schlachten gefürt/seind sie doch nicht gar gewichtig/wo die mit Leibsstercke vnd geringheyt nach gelegenheyt weder beholffen noch erstattet werdend/dienend auch füglicher inn die Pfaltzen dann in die Schlachtordnungen. Solcher stercke arth zeygen vns die Historien im Papirio Cursore/der mit geschwindigkeyt seiner sinn vnnd Leibs/sein zunemen erkriegt/als die nicht für sich selbs vbermütig/sonder allein für die gerechtigkeyt jhres Vatterlandts/biß in den letzten seufftzen großhertzig ist bewiesen/nicht allein im Moyse/Josua vnnd anderen Jsrahelischen Fürsten/sonder inn den Heyden/Horatio/Coclite/Q. Curtio Marco/Steua/Camillo/Fabricio/Regulo/
  cs: |-
    je pravým základem nepochybného vítězství. Na ní musejí být zmíněné hlavní ctnosti od počátku založeny a třemi výše uvedenými prostředky, které jsem přiřadil k počátku, středu a konci – totiž důkladnou četbou, slyšením a vlastní zkušeností – dostatečně vybudovány. Učenost {Kunst} učí čtenáře, posluchače i toho, kdo sám zakouší, ze starých sepsaných dějin obyčejům, cvičení a výhodám zbraní na koni i pěšky, jakož i správě velitelských úřadů před válkou i po ní, vůči přátelům, spojencům i nepřátelům, na taženích, v šarvátkách, útocích a bitvách, což je užitečné poraženému i vítězi. Slyšení, ač je poněkud prchavé a nestálé, není přece nejmenším podnětem k vymýšlení výhodných záměrů a ke zkušenosti, a také horoucí pohnutkou ke čtení. Vlastní zkušenost je ovšem nakonec nejchvályhodnější, avšak mnohé opakované čtení je mnohem účinnější a spasitelnější; slyšení pak je v každém případě k výhodě prospěšné. S porozuměním čtou jen učení, a to v bezpečí, šťastně zakoušet však mohou jen ti, kdo po výhodném předchozím uvážení zaznamenaných a dobře přečtených dějin mají podíl na čtyřech výše jmenovaných ctnostech. V každém případě je však třeba vybranou učenost stavět nade vše ostatní, a to nejen proto, že se z písma za krátké dny či hodiny vyčte a moudře pochopí víc, než by se i ti nejchytřejší mohli naučit činem a zkušeností za sto let, nýbrž také proto, že ji ti nejmocnější vojevůdci, jmenovitě David u Židů, Dareios u Peršanů, Ninos u Babyloňanů, Alkibiadés u Řeků, Julius a Augustus u Římanů, Arminius u Němců, ba ve staré Římské říši vždy ti nejnepřemožitelnější válečníci, nejen ctili, nýbrž se jí sami od kolébky horlivě učili, často ji při útoku na nepřítele předkládali celému houfu {hellen hauffen} a každodenním cvičením mu vštípili takovou odvahu, že osvědčenou zkušeností válčili téměř s celým světem, takže nejen z Romulova pastýřského houfku učinili hlavu a sloup světa, ale toužili i rytířsky dobýt jiný svět. Zatímco všichni, kdo učenosti pohrdají, svůj sedřený a vyhublý houfek, ba ani svůj vlastní klidný koutek nedovedou a nemohou se svou slepou a nevědomou lakotou uchránit a vysvobodit sotva před nicotnou loupeživou rotičkou. Protože takové umění má vždy za stálého průvodce sílu ducha i těla, nenutím žádného válečníka k osvojení sedmi svobodných umění, neboť každé z nich se během lidského věku jen těžko naučí, ačkoli prastarému rytířstvu nebyla cizí; napomínám však každého jen k tolika učenosti, kolik je třeba k polepšení a poznání starých chvalitebných činů, sepsaných latinsky i německy, jíž se bystrá a činná síla ducha i těla neoslabuje, nýbrž osvěcuje a posiluje. Neboť ačkoli rozumné a důmyslné rady jsou nebeské dary Boží, když je někdy do bitev nosí v nosítkách a koňských márách, nemají velkou váhu, nejsou-li podle potřeby podpořeny a doplněny tělesnou silou a hbitostí; hodí se pak spíš do palácových síní než do bitevních šiků. Povahu takové síly nám ukazují dějiny na Papiriu Cursorovi, který si bystrostí ducha i těla vybojoval svůj přídomek,[^1] a na tom, jak se tato síla, nikoli zpupná pro sebe samu, ale jen pro spravedlnost své vlasti, velkodušně projevila až do posledního vzdechu nejen u Mojžíše, Jozua a jiných izraelských knížat, ale i u pohanů: u Horatia Cocla, Quinta Curtia Marka, Scaevy, Camilla, Fabricia, Regula,[^2]
poznamky:
- n: 1
  text: |-
    Lucius Papirius Cursor, římský vojevůdce 4. stol. př. n. l.; přízvisko Cursor („běžec“) dostal pro svou rychlost. „Zunemen“ = příjmí, přídomek.
- n: 2
  text: |-
    Výčet římských hrdinů z Livia: Horatius Cocles (obránce mostu), Marcus Curtius (skočil do propasti na fóru; tisk má chybně „Q. Curtio Marco“), Scaeva (patrně Caesarův setník Cassius Scaeva, nebo Mucius Scaevola), Marcus Furius Camillus, Gaius Fabricius Luscinus a Marcus Atilius Regulus.
