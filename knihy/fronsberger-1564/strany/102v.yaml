id: 102v
list: CII
strana: verso
sken: 212
stav: zkontrolovano
bloky:
- typ: verse
  pokracovani: true
  de:
  - Biß warhafft/halt dein wort Fürstlich/
  - Das ist dir nutz vnd gar ehrlich.
  - Halt gleiches Recht Armen vnd Reich/
  - Freund/gůt oder gelt nicht ansich/
  - Gerechtigkeyt ist die Hauptstatt/
  - Die Gott auff erd dir befolhen hat.
  - Darumb befilch die keym auff erd/
  - Er sey dann fromb vnd ehren werth.
  - Dich mag er müh wol vberheben/
  - Aber Gott für dich nit rechnung geben.
  - Hetstu das Ampt selbs wol versehen/
  - So wer niemands vnrecht geschehen/
  - Der Richter bleibt in Gottes hůt/
  - Der wissend niemands vnrecht thůt.
  - All grosse sachen/oder that
  - Nimb für mit frommer Weisen Rath/
  - Ohn all vernunfft ist/lob vnd preiß/
  - Der nicht folgt/meynt sey allein weiß.
  - Nicht biß dir in dem selbs vntrew/
  - Nach schanden ist vmb sonst die rew/
  - Nicht kümmer noch bemühe dich/
  - Mit dem daß dir ist vnmüglich.
  - Wilt du glück han zu krieg vnd reysen/
  - Beschirm die armen/witwen/weysen.
  - Was du mit Recht vnd fried magst han/
  - Keyn krieg darumb solt fahen an.
  - Kriegen ist groß sorgfeltigkeyt/
  - Auch vieler müh/grosser arbeyt.
  - Mit wachen/reitten/frü vnd spat/
  - Weyß niemandt wie es zu letzt gerad/
  - Wieuil meynst du daß Krieg vnd reysen
  - Mach arme leuth/witwen vnd weysen.
  - Es gsteht vil leuth/vil gůt vnd gelt/
  - Vnd dartzů Gott größlich mißfelt/
  - Es sey dann ehr vnd gůt zu bhalten/
  - Da wehr dich bald/vnd laß Gott walten.
  - Oder das böß vnrecht zustraffen/
  - Da spar nit müh/keyn gůt noch waffen.
  cs:
  - Buď pravdivý, drž své slovo jak kníže,
  - to je ti k užitku i ke cti.
  - Stejné právo měj pro chudé i bohaté,
  - nehleď na přítele, statek ani peníze.
  - Spravedlnost je to přední,
  - co ti Bůh na zemi svěřil.
  - Proto ji nesvěřuj nikomu na zemi,
  - leda tomu, kdo je řádný a cti hodný.
  - On tě sice námahy zbavit může,
  - ale za tebe Bohu účet nesloží.
  - Kdybys ten úřad sám dobře zastával,
  - nikomu by se nestala křivda.
  - Soudce zůstává v Boží ochraně,
  - který vědomě nikomu nekřivdí.
  - Všechny velké věci či činy
  - podnikej s radou zbožných a moudrých.
  - Bez rozumu, chvály a slávy je,
  - kdo rady nedbá, mysle si, že jen on je moudrý.
  - Nebuď v tom sám sobě nevěrný,
  - po hanbě je lítost marná.
  - Netrap se ani se nenamáhej
  - tím, co je pro tebe nemožné.
  - Chceš-li mít štěstí ve válce a na taženích,
  - chraň chudé, vdovy a sirotky.
  - Co můžeš mít po právu a v míru,
  - kvůli tomu žádnou válku nezačínej.
  - Válčení je velká starost,
  - plná námahy a velké práce,
  - bdění a jízdy časně i pozdě,
  - a nikdo neví, jak nakonec dopadne.
  - Co myslíš, kolik válka a tažení
  - nadělají chudáků, vdov a sirotků?
  - Stojí to mnoho lidí, statků a peněz
  - a Bohu se to k tomu velmi nelíbí,
  - leda když jde o uhájení cti a statku: null
  - tu se hned braň a nech vládnout Boha.
  - Nebo když jde o potrestání zlého bezpráví: null
  - tu nešetři námahy, statku ani zbraní.
