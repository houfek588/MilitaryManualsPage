id: 100r
list: C
strana: recto
sken: 207
stav: zkontrolovano
bloky:
- typ: odstavec
  de: |-
    WO die Feind zusammen kommen/vnd man platz vnd malstatt zur Schlacht einnimpt/da man gedenckt zuschlahen/soll ein verständiger Kriegßmann vnd Oberster seiner sachen vnd vortheyl gůt acht haben/eygentlich der feind hauffen/platz vnd vortheyl besichtigen lassen/vnd wo er geschäfft halben mag/selbs besichtigen/auch sein gůt eygentlich auffsehen vnd mercken haben/wie die feind jhr Ordnung vnd hauffen machen/vnd sich zur wehr schicken/wieuiel sie hauffen/wohin das groß geschütz/die handschützen vnnd die Reysigen verordnen/ob sie jhre Ordnungen breyt/schmal/gespitzt oder geuiert machen/ob sie jhre hauffen nach beyeinander/neben oder voreinander/oder weit zerstrewt von einander haben/oder etwann hauffen versteckt hetten/oder ob sie etwann ander vortheyl vor jhnen/neben oder hinder jhnen haben/als wagenburg/gräben/möß/felsen/vnwegsam berg/bihel oder wäld/damit er gegen dem allem der notturfft nach/sein anschleg vnd ordnung mit gůter notturfft fürsichtiglich machen könne/Er soll sich auch befleissen durch etliche geringe Reysigen/alle Bühel vnd höhen so in der nähe seind einzunemen/darob man der feind hauffen eygentlich sehen/vnd was jhr fürnemen ist/mercken mag/damit der Oberst für vnd für von denselbigen starrdten sein bericht/vnnd erfarung haben möge/wie sich die feind halten/wann vnd wie sie anziehen.
  cs: |-
    Když se nepřátelé sejdou a zaujímá se místo a bojiště {malstatt}[^1] k bitvě, kde se zamýšlí bít, má rozvážný válečník a nejvyšší [hejtman] {Oberster} dobře dbát na své věci a výhody: má dát přesně prohlédnout nepřátelské houfy {hauffen}, jejich postavení a výhody, a pokud mu to povinnosti dovolí, prohlédnout je sám; má také dobře a přesně pozorovat a sledovat, jak nepřátelé tvoří své šiky {Ordnung} a houfy a jak se chystají k boji, kolik mají houfů, kam stavějí velká děla, ručnice a jízdu {Reysigen}, zda dělají své šiky široké, úzké, klínovité nebo čtvercové, zda mají své houfy blízko u sebe, vedle sebe nebo za sebou, nebo široce rozptýlené, nebo zda nemají někde skryté houfy, anebo zda nemají před sebou, vedle sebe nebo za sebou jinou výhodu, jako vozovou hradbu {wagenburg}, příkopy, bažiny, skály, neschůdnou horu, pahorky nebo lesy – aby proti tomu všemu mohl podle potřeby prozíravě a s dobrou rozvahou připravit své úskoky a šik. Má se také snažit obsadit několika lehkými jezdci všechny pahorky a výšiny v okolí, z nichž lze nepřátelské houfy dobře vidět a poznat, co zamýšlejí, aby nejvyšší [hejtman] od těch stanovišť[^2] neustále dostával zprávy a věděl, jak si nepřátelé počínají, kdy a jak přitahují.
- typ: odstavec
  de: |-
    Der Oberst soll auch sich befleissen/wo etwann bey der malstatt Thürn/Kirchen/oder gemawrte befestigte Kirchhöff oder Schlösser stünden/daß er dieselbige einneme/nach notturfft mit haacken vnnd handschützen besetze/damit dieselbigen/so die Schlacht angeht/von der höhe vnd von der mawren in die feind schiessen können/sie mögen auch von den höhen der feind ordnung/handlung vnd fürnemen sehen/vnnd jeder zeit den Obersten dasselbig berichten.
  cs: |-
    Nejvyšší [hejtman] se má také snažit, stojí-li snad u bojiště věže, kostely nebo zděné opevněné hřbitovy či zámky, aby je obsadil a podle potřeby osadil hákovnicemi {haacken} a ručnicemi, aby odtud, až bitva začne, mohli z výšky a ze zdí střílet do nepřátel; z výšin také mohou vidět šik nepřátel, co dělají a zamýšlejí, a kdykoli o tom nejvyššímu [hejtmanovi] podat zprávu.
- typ: odstavec
  de: |-
    Er sol auch sein fleissig auffmercken/nachgedencken vnd anschleg machen/wo er die feind inn jhrem vortheyl angreiffen wöll/daß er zuuor alle gräben/zeun/hecken vnd anders/so jhm im weg/vnnd jhn verhindern mag/vmbreissen lasse/damit nicht/so er im angriff ist/durch solche verhinderung sein Kriegßvolck/geschütz vnd Reysigen in gräben stecken bleiben/ein theyl hinüber kom/ein theyl/wie offt mit grossem nachtheyl geschicht/genöth bleiben/Jtem an den Zeunen vnnd hecken die Ordnung zertrennt vnd gebrochen werde.
  cs: |-
    Má také bedlivě uvažovat, přemýšlet a činit plány: chce-li nepřátele napadnout v jejich výhodném postavení, ať předem dá strhnout všechny příkopy[^3], ploty, živé ploty a jiné, co mu stojí v cestě a mohlo by mu překážet, aby během útoku pro takové překážky jeho válečný lid, děla a jízda neuvízli v příkopech, aby část nepřešla a část nezůstala v tísni, jak se často k velké škodě stává, a dále aby se u plotů a živých plotů nerozdělil a nerozbil šik.
- typ: odstavec
  de: |-
    Gleicher gestalt sol bedacht werden/wo du den feind nit angreiffen/sonder in deinem vortheyl seins angriffs erwarten wöltest/nemlich/wo du vor dir oder zun seitten/oder rucken hast gräben/möß/wasser/vnwegsame Bihel/hecken/oder was dir zum vortheyl dienen mag/das alles solt du mit Schützen/oder in ander weg besetzen/vnnd vnterstehn daruor zusein/damit dir derselbigen vortheyl keyner abtrungen werden möge/vnd souiel in der noth vnd eyl geschehen mag/noch mehr verhawen/verhacken/brücken abwerffen vnd befestigen/dann man mag leicht ein vortheyl haben/daran der feind můß ein schnapp oder nachtheyl leiden/darauß jhm das hertz entfellt/vnnd den freunden einen můth vnd hertz macht/vnnd ist aller ding dem berhätigen/besunnen/erfarnen Kriegßmann sein achtung auff den vortheyl zuhaben/vnd deren keyner ohn bessere vrsachen zubegeben.
  cs: |-
    Stejně tak je třeba uvážit, kdybys nepřítele nechtěl napadnout, nýbrž chtěl jeho útok očekávat ve své výhodě: máš-li totiž před sebou, po stranách nebo v zádech příkopy, bažiny, vodu, neschůdné pahorky, živé ploty nebo cokoli, co ti může posloužit k výhodě, máš to všechno obsadit střelci nebo jinak zajistit a snažit se to bránit, aby ti žádná z těch výhod nemohla být vyrvána; a pokud to v nouzi a spěchu jde, ještě víc zatarasit záseky, strhnout mosty a opevnit. Snadno lze totiž mít výhodu, na které nepřítel musí utrpět nezdar či škodu, takže mu klesne srdce, kdežto přátelům to dodá odvahy a srdce. A vůbec náleží uvážlivému, rozvážnému a zkušenému válečníkovi dbát na výhodu a žádné se bez lepšího důvodu nevzdávat.
- typ: odstavec
  de: |-
    Es ist auch/wo es mit gůter gelegenheyt geschehen mag/allwegen die Sonn vnd der Wind auff den rücken zunemen/deß heyssen blendenden/vnnd
  cs: |-
    Je také třeba, lze-li to při dobré příležitosti učinit, brát vždy slunce a vítr do zad, a to kvůli horkému, oslňujícímu a
poznamky:
- n: 1
  text: |-
    Malstatt – místo, kde se strhne bitva (původně místo soudu či shromáždění).
- n: 2
  text: |-
    „von denselbigen starrdten“ – slovo nejasné (snad tisková chyba za „Warten“ = strážní výšiny, nebo „Stätten“ = místa); přeloženo podle smyslu.
- n: 3
  text: |-
    „gräben vmbreissen“ – příkopy nelze strhnout; míněno zasypat či překonat (sloveso se vztahuje hlavně k plotům).
