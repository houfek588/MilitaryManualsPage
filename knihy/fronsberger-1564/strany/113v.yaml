list: CXIII
strana: verso
sken: 234
stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    notturfft zugeführt werden mag/wo er sie bey nacht/näbel oder in regen vnd sturmwind listlich nit möcht vberfortheylen/Ehe er aber für die andere ruckt/soll er auch seine heymliche halten also artlich verschmückt haben/wo die Stättleuth herauß brächen/daß die gehalbierten/mit vnuersehenem geschrey hinder jhn her trumpffen/vnnd der ander halb theyl die Porten abzurennen geflissen sey.
  cs: |-
    potřeby, ledaže by je mohl lstí přemoci v noci, v mlze nebo za deště a vichřice. Než však přitáhne k jinému [městu], má mít své skryté zálohy {heymliche halten} tak obratně ukryté, aby kdyby měšťané vyrazili ven, jedna polovina s nenadálým křikem udeřila za nimi a druhá polovina se snažila zmocnit se bran.
- typ: nadpis
  uroven: 2
  de: Außreytzung seines Feinds.
  cs: Vylákání nepřítele
- typ: odstavec
  de: |-
    WOlt sich ein Belägerung zulang verziehen/dann soll er etliche Fändlin in die alte gemäwr/Gräben oder Schantzen/wie jetzt gemelt verstecken/ein flüchtigen abzug erdichten/den Troß auch langsam vnnd zerzettelt/vorhin schicken vnnd fürstrewen/wie ein Aß den Wolffen/vnnd also die außgefalne Kistenfäger/wie nechst angezeygt/vberlisten/fielen sie aber nit herauß/den abzug nicht desto weniger vollenden sampt dem verlaßnen Troß/nicht anders/dann als ob jhm ernst gewesen/hierunder seltzam vmbziehen/darmit sich keyn verrähter seines vmbziehens berichten könn/Er selb aber die verlaßne hinlessige Statt vngewarnet vberfallen vnd ablauffen/Gerieds jm nicht/so macht er sie doch rachgiriger zu Scharmützeln. Darumb soll er sie etlich mal mit wenig Knechten forchtsam reytzen/vnnd liderlich weichen/biß sie verrucht vnd fräuenlich den flüchtigen etwas zuferr nacheilen/Zuletzt mit jhnen handeln wie Judas mit den Benjamitern/Entlich soll er den verhaltnen etliche materi zugeben/mit der sie den außgefalnen Stättleuthen zu ruck ein scheutzlichen brannt vorbilden können/wann sie hindersich sehen daß sie vermeynen jhr Statt brenne/vnnd auß schrecken zaghafftig werden/Er soll sich auch also herauß locken/Wann berürte halt vnnd materi künstlich verordnet/soll er der Statt in deß Herren namen schreiben/der jhr zugebieten oder zuhelffen pflichtig ist/er wölle den feind nachts mit solcher oder solcher Liberey vnd zeychen heymlich vberfallen/daß sie gedencken vnd alle weisse hembder anlegen/vnd wann sie den lärmen vnnd handrohr vermercken/jhm von stundan auß der Statt zuspringen. Hiezwischen soll er seine Knecht/wie er verschriben vnd versigelt hat/bewaffnen/heymlich auß dem Läger schicken/vnd jhnen befelhen/mit aller weiß vnd geberden/stechen/hawen/schreien/schiessen/thůn/wie feinde pflegen/doch ohn schaden bemelter statt vnd zeit/Wo dann die herauß gefalne seinem flüchtigen heuflin nacheyleten/soll er mit dem fürschrecken die Porten entwehren/vnd allenthalben die weissen hembder aufflesen/Etwann mag er auch etlichen Stätten jr Viech peuten/vnd die außgefalne in der rettung durch versteckte halten erlegen/oder er soll durch einen trewen vnd listigen diener der Statt anzeygen lassen/er sey hoch verursacht von dannen zuscheyden/für jhene Statt/so jhm grossen schaden zugefügt/von Merßpurg gehn Marckdorff sich zulägern/vnd alda mit gewonlichen vbungen vnd breuchen/etlich mal Stürmen/auch also lang daselbst verharren/biß er deren von Merßpurg hinlessigkeyt vernimpt/dann soll er vor Marckdorff sein Wachtzal/Baucken/Trommeten nicht anders halten/als wer er noch da/vnnd die Merßpurger vngefährlich vberstürtzen/Würden sie aber von den Marckdörffern gewarnet/soll er sich mit dem erdichten Lägerschein vor Merßpurg stellen wie dort/vnd die Marckdorffer vnuersehens vberlisten.
  cs: |-
    Kdyby se obléhání příliš protahovalo, má ukrýt několik praporců {Fändlin} ve starém zdivu, příkopech nebo šancích, jak bylo právě řečeno, předstírat překotný odchod, trén {Troß} poslat napřed pomalu a roztroušeně a pohodit jej jako návnadu vlkům, a tak vyběhnuvší vykradače truhel,[^1] jak bylo naposledy ukázáno, přelstít. Kdyby však nevyrazili ven, má odchod přesto dokončit i s opuštěným trénem, nejinak, než kdyby to myslel vážně, přitom táhnout podivnými oklikami, aby se žádný zrádce nemohl o jeho pochodu dozvědět, sám však opuštěné a nedbalé město nenadále přepadnout a vzít útokem. Nepodaří-li se mu to, učiní je tím aspoň dychtivějšími po šarvátkách. Proto je má několikrát s nemnoha knechty jakoby bázlivě dráždit a lehkomyslně ustupovat, dokud nezačnou zpupně a opovážlivě pronásledovat prchající příliš daleko; nakonec s nimi má naložit jako Juda s Benjamínovci.[^2] Konečně má skrytým [zálohám] dát nějaký materiál, jímž mohou vyběhnuvším měšťanům v zádech předvést strašlivý požár, takže když se ohlédnou, budou se domnívat, že jejich město hoří, a strachem ztratí odvahu. Ven je má vylákat také takto: když jsou zmíněné zálohy a materiál umně připraveny, má městu napsat jménem pána, který je povinen mu poroučet nebo pomáhat, že chce nepřítele v noci potají přepadnout v takovém a takovém oděvu {Liberey} a se znameními, ať na to pamatují, všichni si obléknou bílé košile, a jakmile uslyší poplach a střelbu z ručnic {handrohr}, ihned mu z města přiskočí na pomoc. Mezitím má své knechty ozbrojit tak, jak to popsal a zpečetil, potají je vyslat z ležení a přikázat jim, aby se vším způsobem a chováním, bodáním, sekáním, křikem i střelbou počínali, jak to dělávají nepřátelé, ovšem bez škody, na uvedeném místě a v uvedený čas. Kdyby pak ti, kdo vyběhli, pronásledovali jeho prchající houfek, má se v tom úleku zmocnit bran a všude pobít ty v bílých košilích. Někdy může také některým městům vzít jejich dobytek a ty, kdo vyběhnou na jeho záchranu, pobít skrytými zálohami. Nebo má skrze věrného a lstivého služebníka dát městu oznámit, že je velmi nucen odtud odtáhnout a položit se z Meersburgu {Merßpurg} k Markdorfu {Marckdorff} před ono město, jež mu způsobilo velkou škodu,[^3] a tam s obvyklými cviky a zvyklostmi několikrát zaútočit a setrvat tam tak dlouho, dokud se nedozví o nedbalosti Meersburských; potom má před Markdorfem udržovat stráže, kotle a trubky nejinak, než kdyby tam stále byl, a Meersburské znenadání přepadnout. Kdyby však byli varováni Markdorfskými, má se s předstíraným ležením postavit před Meersburg stejně jako tam a nenadále přelstít Markdorfské.
- typ: nadpis
  uroven: 2
  de: Vom Sturm.
  cs: O útoku
poznamky:
- n: 1
  text: |-
    „Kistenfäger“ – posměšně o těch, kdo vyrazí z města, aby vyplenili zanechaný trén (doslova „vymetači truhel“).
- n: 2
  text: |-
    Sd 20: Izraelci pod vedením Judy po dvou porážkách předstírali útěk, vylákali Benjamínovce z Gibeje a s pomocí zálohy, která město zapálila, je porazili. Stejná lest je popsána i v následující větě.
- n: 3
  text: |-
    Meersburg a Markdorf – sousední města u Bodamského jezera; slouží jen jako příklad (dvě blízká města).
