bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    fromme König vnnd Propheten Krieg geführt/wie sich dann im Abraham/der ein Vatter aller Christgläubigen von dem Apostel Paulo genennt wird/Vnd im Buch der Königen vnd Propheten/Dauid/Josaphat/Ezechia vnnd Josua funden wird/Vnnd im Newen Testament haben vil Tausent Christen den Römischen Keysern/die doch nit Christen waren/in Kriegsläuffen gedient/wie das in den Historien hin vnd wider gelesen wird.
  cs: |-
    zbožní králové a proroci, jak je vidět na Abrahamovi, kterého apoštol Pavel nazývá otcem všech věřících, a v Knihách královských a u proroků na Davidovi, Jóšafatovi, Ezechiášovi a Jozuovi. A v době Nového zákona sloužily mnohé tisíce křesťanů ve válkách římským císařům, kteří přece křesťany nebyli, jak se lze v dějepisech tu i tam dočíst.
- typ: odstavec
  de: |-
    Es soll keyn Kriegsmann so verzucht sein/daß er darumb so er ein Kriegsmann ist/wolt leben vnnd handlen das vnchristlich wer/sonder sich in Kriegen also halten/daß man ein Christlich gemüt an ihm spüre/vnnd daß er auch ehe das kriegen fahren lasse/dann die hoffnung deß Christlichen glaubens wolt hinwerffen/etc.
  cs: |-
    Žádný válečník nemá být tak zpustlý, aby proto, že je válečníkem, chtěl žít a jednat nekřesťansky; má se naopak ve válkách chovat tak, aby na něm bylo znát křesťanské smýšlení, a raději má válčení zanechat, než by zahodil naději křesťanské víry atd.
- typ: odstavec
  de: |-
    Zum dritten/Soll ein Kriegsmann wo er das schicken kan/das Wort Gottes gern hören/kan er lesen/dasselbig bey ihm haben/vnd zu zeiten sein gemüt vnd gewissen darauß trösten vnnd erinnern/zu Christlichem glauben vnnd gutem reitzen/dann darauß wird der Mensch verständig/daß er wiß was Gott gefellig sey oder zuwider/vnd von dem schweren/füllen/Gottslästern/hůreren vnnd ander vnzucht ablasse/darmit der Allmächtig Gott gantz höchlich erzürnet vnd beleydiget wird. Es steht einem Kriegsmann viel baß an/Gottsförchtig sein/nüchtern/bescheyden vnnd ehrlichs gemüts vnnd wandels/dann verzucht/truncken/vnbescheyden vnnd vnzüchtig sein/etc.
  cs: |-
    Za třetí: může-li to válečník zařídit, má rád poslouchat slovo Boží, a umí-li číst, mít je u sebe a občas jím těšit svou mysl a svědomí, připomínat si je a povzbuzovat se ke křesťanské víře a k dobrému. Z toho totiž člověk nabude rozumu, aby věděl, co se Bohu líbí a co se mu příčí, a aby zanechal klení, obžerství, rouhání, smilstva a jiné nemravnosti, jimiž je všemohoucí Bůh nanejvýš rozhněván a urážen. Válečníkovi mnohem lépe sluší být bohabojný, střízlivý, skromný a čestného smýšlení i chování, nežli zpustlý, opilý, nevázaný a nemravný atd.
- typ: odstavec
  de: |-
    Zum vierdten/Soll sich der Kriegsmann nicht verlassen auff sein mannheyt/Harnisch oder wehr vnd sterck/noch auff grossen hauffen der Knecht vnd heerskrafft/als ob der Feind vberwunden were/sonder soll wissen daß Sigen von Gott kompt/Es hat nie können sein/daß das Volck Gottes obleg/wann Gott nit mit seiner hülff vnd krafft vnter ihnen was/wird auch noch nit können sein/Also sprach ein Prophet zum König Amazia/in 2. Chro. 25. Welcher neben seinem Volck hundert tausent streitbarer Mann auß Israel zum Krieg wider die Idumeer bestellt hette/König laß das Heer Israel nit mit dir kommen/dann der HErr ist nicht mit Israel/dann so du kompst/daß du ein macht erzeygest im Krieg/wird Gott dich fallen lassen von dein Feinden/dann bey Gott steht die krafft zuhelffen vnnd fallen zulassen/Diesem rath hat König Amazias gefolget/vnd hundert tausent bestelter Mann hingelassen/vnnd mit den vberigen die Feind auß Gottes hülff geschlagen/2.Chro. 20. Vnd der König Josaphat/als er in Streit zihen mußt/thet er zuuor sein gebet zu Gott/bekannt sein schwachheyt vnd vnuermögenheyt zum Krieg/bekannt daß Gott helffen müste/Vermanet auch das Kriegßuolck vnd sprach: Glaubet an den Herren ewren Gott/so werdet ihr sicher sein/vnd glaubet seinen Propheten/so werdet ihr glück haben/vnnd es geschahe also/Darumb soll keyn Kriegsmann auff sein oder ander leuth stercke/macht vnd rüstung sich vertrösten/auch nicht ab der macht vnnd vile der Feind entsitzen/sonder mit gläubigem hertzen auff Gott sehen/vnnd alsdann handlen als einem ehrlichen/redlichen/vnuerzagten Kriegsmann gebürt. Es hat der Allmächtig offtermals ein grossen hauffen Gottloser leuth/mit einem kleynen vnd geringen volck oder heufflin geschlagen/welches er noch thut vnd thun kan/dann sein Arm noch nit verkürtzet ist.
  cs: |-
    Za čtvrté: válečník se nemá spoléhat na svou udatnost, zbroj {Harnisch}, zbraň a sílu ani na velký houf knechtů a moc vojska, jako by už byl nepřítel přemožen, nýbrž má vědět, že vítězství pochází od Boha. Nikdy se nemohlo stát, aby Boží lid zvítězil, nebyl-li s ním Bůh se svou pomocí a silou, a nebude se to moci stát ani nadále. Tak promluvil prorok ke králi Amasjášovi (2. Paralipomenon 25), který si vedle svého lidu najal do války proti Idumejským sto tisíc bojovných mužů z Izraele: „Králi, nedovol, aby s tebou táhlo izraelské vojsko, neboť Hospodin není s Izraelem. Půjdeš-li a budeš chtít ve válce ukázat svou moc, Bůh tě nechá padnout před tvými nepřáteli, neboť u Boha je moc pomoci i nechat padnout.“ Král Amasjáš té radě uposlechl, sto tisíc najatých mužů propustil a se zbylými s Boží pomocí nepřátele porazil (2. Paralipomenon 20)[^1]. A král Jóšafat, když musel vytáhnout do boje, se nejprve pomodlil k Bohu, vyznal svou slabost a nemohoucnost k válce a uznal, že Bůh mu musí pomoci; také napomenul válečný lid a řekl: „Věřte v Hospodina, svého Boha, a budete v bezpečí; věřte jeho prorokům, a povede se vám.“ A tak se i stalo. Proto se žádný válečník nemá spoléhat na svou ani na cizí sílu, moc a výzbroj, ani se nemá děsit moci a množství nepřátel, nýbrž má s věřícím srdcem hledět k Bohu a pak jednat, jak náleží čestnému, poctivému a neohroženému válečníkovi. Všemohoucí už mnohokrát porazil velký houf bezbožných lidí malým a nepatrným lidem či hloučkem, což činí a může činit i nadále, neboť jeho ruka dosud není zkrácena.
- typ: odstavec
  de: |-
    Zum fünfften/Soll auch ein jeglicher Kriegsmann gegen seinem feind keyn
  cs: 'Za páté: žádný válečník nemá vůči svému nepříteli'
poznamky:
- n: 1
  text: |-
    Odkaz tisku „2.Chro. 20.“ stojí za příběhem Amasjáše (2 Pa 25,5–13), patří však k následujícímu příběhu o Jóšafatovi (2 Pa 20,1–30). Překlad zachovává odkazy tak, jak stojí v tisku.
