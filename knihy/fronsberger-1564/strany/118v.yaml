id: 118v
list: CXVIII
strana: verso
sken: 244
stav: zkontrolovano
bloky:
- typ: nadpis
  uroven: 2
  de: Von Klausen vnd enden wegschlegen.
  cs: O průsmycích a úzkých cestách
- typ: odstavec
  de: |-
    ZEucht er auß oder in ein eng gebirgecht Landt/da jhm mag gewehrt werden/leg er an ein orth seinen hauffen/als ob er daselbs durchtringen wöll/vnd wann das Landvolck als zugelauffen ist/verlasse ein theyl seines Heers/gleich als wer er gar da/vnnd neim er den andern vnbewarnten zugang vnuersehenlich ein/oder zeuch ab etliche tag/vnd schick die thewreste Reysigen tag vnd nacht/die verlaßne Flůt vnuersehenlich einzunemen/eyl jhn streng nach/Oder laß die wolbekleydte Knecht wol gespeiset durch etlich öden/die hutten vberfallen/erstechen vnd besetzen/Würde er in einem engen weg ergriffen/schlach behend ein Schantzgraben/vnd die beum darnider/holtz vnnd gesteud darauff/zünds an/vnnd weich zuruck/Oder werd vmb erdichten fried/laß nachts die Wachten vom Blasen vnnd Trommen/zeuch still in einen vortheyl/heyß die Wächter auff den geringsten pferden angehend tags nachreitten/richt etlich blöck auff knechtisch bekleydt/verlaß hund/Müller/Esel vnd Ochsen angebunden/durch welcher geschrey der feind meyne oder denck das Läger beharre noch.
  cs: |-
    Táhne-li ven z úzké hornaté země nebo do ní a mohlo by se mu v tom bránit, ať položí svůj houf {hauffen} na jedno místo, jako by tam chtěl prorazit; a když se tam sběhne všechen venkovský lid, ať tam nechá část svého vojska, jako by tam byl celý, a druhý, nestřežený přístup ať nečekaně obsadí. Nebo ať na několik dní odtáhne a pošle nejlepší jezdce {Reysigen}, aby dnem i nocí [jeli] a nečekaně obsadili opuštěný přechod {Flůt},[^1] a sám ať za nimi rychle spěchá. Nebo ať nechá dobře oděné a dobře nasycené knechty {Knecht} [projít] nějakými pustinami, přepadnout stráže, pobít je a [místo] obsadit. Kdyby byl zaskočen v úzké cestě, ať rychle vykope šancovní příkop, porazí stromy, nahází na ně dřevo a křoví, zapálí to a ustoupí. Nebo ať vyjednává o předstíraný mír, nechá v noci stráže [ohlašovat se] troubením a bubnováním,[^2] potichu odtáhne na výhodné místo a stráže ať za svítání na nejlehčích koních jedou za ním; ať postaví několik špalků oděných jako knechti a nechá tam uvázané psy, mezky, osly a voly, aby se nepřítel podle jejich řevu domníval a myslel, že ležení {Läger} tam stále zůstává.
- typ: nadpis
  uroven: 2
  de: Kundtschafft.
  cs: Zpravodajství
- typ: odstavec
  de: |-
    WOlt jhm der feind die Passierung wehren/soll er vorhin mit Schiffbrücken bereyt sein/die von stund anzuhencken/vnnd mit vil holtzwellen ein halben Mon vmb seinen hauffen machen vnd anzünden. Das wasser aber mag er auch also sicher machen/wann er seine Reysige oder Heerwägen/oder etliche Schiff voller steyn/zwerchs in den furt sencket/oder in viel gräben mit tämmen außtheylt/Oder erspähe wie weit er ob den feinden der mehrtheyl seines Heers hinüber führen vnd verstecken mög/oder in vortheyliger Ordnung gegen dem feind füren/vnd hiezwischen dergleichen thůn/als wöll er mit den ringen pferden passiren/biß sie zusammen stossen/vnd vom gestad getrungen werden/vnnd also hinüber fallen/Oder such zwen fürt/vnd wann er von einem getrieben würd/so lauff er mit gantzem hauffen so lang zum andern/biß die feind meynen/er werde allweg also thůn/Zu letzt wann die Feind alle zu dem einen eylen/heyß er die verordnete sich von jhm theylen/hinüber setzen/vnd jhm auff der seiten zuspringen/Oder thů als wöll er sich auff den nechsten Bühel lägeren/heyß zu betrug deß feinds etliche zeltlin auffrichten/doch jeden sunst bereyt sein/vnd wenig Fewer machen/holtz herzů tragen angesichts deß feinds/biß er auch sein Läger schlecht/vnd sich zubewerbung seiner notturfft vff die Feld zerstrewt/dann soll er nicht allein passieren/sonder auch das Läger beschedigen/Oder er soll bey dem gestat ein halt setzen/vnd gemachsam passieren/so jhm kund ist/daß jhm ein kleynes zeuglin nachstellt/dasselbig erwüschen/Oder zög jhm ein grosse macht auff dem fůß nach/soll er aber etliche verschmücken/auch so weit fliehen/biß schier die helfft vber passiert hett/welche er im geschwinden wenden erwürgen soll.
  cs: |-
    Kdyby mu chtěl nepřítel zabránit v přechodu, má mít předem připraveny lodní mosty {Schiffbrücken}, aby je mohl ihned zavěsit, a má kolem svého houfu udělat z mnoha otepí dřeva půlměsíc a zapálit jej. Vodu si však může zabezpečit také tak, že napříč brodem postaví svou jízdu {Reysige} nebo vojenské vozy či ponoří několik lodí plných kamení,[^3] nebo ji hrázemi rozdělí do mnoha příkopů. Nebo ať vyzví, jak daleko nad nepřítelem by mohl převést a ukrýt větší část svého vojska, nebo [ať ji] ve výhodném šiku vede proti nepříteli, a mezitím ať dělá, jako by chtěl přejít s lehkou jízdou {ringen pferden}, dokud se [nepřátelé] nesrazí [s ní] a nebudou zatlačeni od břehu, a tak [jeho lidé] přejdou. Nebo ať vyhledá dva brody, a když bude od jednoho odražen, ať s celým houfem běží k druhému, a to tak dlouho, až nepřátelé budou myslet, že to tak bude dělat pokaždé; nakonec, až všichni nepřátelé pospíchají k jednomu [brodu], ať přikáže určeným [lidem], aby se od něho oddělili, přepravili se přes [vodu] a vpadli nepříteli do boku. Nebo ať dělá, jako by se chtěl utábořit na nejbližším pahorku, ať k oklamání nepřítele dá postavit několik stánků, každý však jinak připravený [k odchodu], ať rozdělá málo ohňů a nechá nepříteli na očích nosit dřevo, dokud si i [nepřítel] nerozbije ležení a nerozptýlí se po polích, aby si opatřil, co potřebuje; tehdy má nejen přejít, ale i [nepřátelské] ležení poškodit. Nebo má u břehu postavit zálohu {halt} a přecházet pozvolna; ví-li, že ho pronásleduje jen malý oddíl, má jej polapit. Kdyby mu však byla v patách velká síla, má několik [mužů] ukrýt a prchat tak daleko, až [nepřítele] přejde skoro polovina; ty pak má rychlým obratem pobít.
- typ: nadpis
  uroven: 2
  de: Schlacht.
  cs: Bitva
- typ: odstavec
  de: |-
    ER soll nicht schlagen ohn demütiges gebett vnd andechtigs ergeben an Gott/ohn gedrang oder heylsamen vortheyl/er hab dann die feind mit allerley armůt außgemergelt/in wind/regen vnd kelte oder hitz/jhrer vnd der seinen hertz vnd
  cs: |-
    Nemá svádět bitvu bez pokorné modlitby a zbožného odevzdání se Bohu, ani bez nutnosti nebo prospěšné výhody; [smí tak učinit,] teprve když nepřátele vysílil všelijakou nouzí, ve větru, dešti a zimě nebo v horku, když [dobře poznal] srdce a
poznamky:
- n: 1
  text: |-
    „die verlaßne Flůt“ – nejasné; snad tisková chyba za Kluft (rokle, soutěska), nebo Flut ve smyslu vodního toku či brodu. Překládáno neutrálně „přechod“.
- n: 2
  text: |-
    „laß nachts die Wachten vom Blasen vnnd Trommen“ – smysl lsti je, aby stráže v noci dál troubily a bubnovaly a ležení se zdálo obsazené; „vom“ stojí patrně místo „mit“.
- n: 3
  text: |-
    Jízda postavená napříč proudem láme sílu vody, aby mohla pěchota přejít (tak Caesar, De bello Gallico VII,56).
