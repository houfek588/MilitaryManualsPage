poznamky:
- n: 1
  text: >-
    Schneller – podle popisu jejich úřadu dále v knize (l. XXXIv) osm pomocníků pod „zbrojmistrem zvedačů“,
    kteří překládají těžká děla z vozu na vůz, mažou je a pomáhají nakládat a skládat munici; vybírali se
    k tomu tesaři a vozatajové.
