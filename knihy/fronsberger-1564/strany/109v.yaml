bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    Decio/Scipione/Cn. Pompeio/vnd in Codro der Athener König/fürtreffenlichen im Arminio/dem lob aller Teutschen/welcher mit genenten Tugenden alle Exempel der gantzen Welt/in der warheyt zubekennen weit vbertroffen/die Römischen herrscher der gantzen Welt also offt geschlagen/biß er sie mit kleynen heufflin auß allem Teutschen Landt getrieben/vnd zuletzt als er gemeyns Vatterlandt von feinden gereyniget/seinen Geyst den vndanckbaren auffgeben/Welches alles er vngezweyfelt in so grosser armůth der Prouandt/weder Leuth/Gelts vnnd der freunden nicht vermögen hett/wo jhn nicht Gott mit ansehenligkeyt vnd glück auch gefürdert hett/vnd sampt seinem Vatterlandt vber alle Hauptleuth vnd Nationen/geadelt/wann thewrgeschetzte achtbarkeyt ist auch nicht die minst fürderung zum Sieg/wirdt aber gemeynlich auß fürtreffenlicher Reichthumb/auß Herrlichem anhang/auß hochgebornem Stammen/deren er gemanglet/ja auch wie an jhm scheinlichen gewesen/auß Fürstlicher gestalt vnd höffligkeyt der Person vnd Sitten auß mittler vernünfftiger redsprächigkeyt/auß dapfferen Ritterlichen thaten/vnnd zuuoran auß Gottes gunst/der aller Menschen hertzen weiset/wohin er will/erlanget. Der aller klügest König Minos Gnosius bey den Certensern/vnd Scipio bey den Römern/haben sie durch das erdichtet Gesprech deß Gott Jupiters also erlistet/daß alle jhre Red vnnd geheyß schier köstbarlicher geacht wurden/dann hett es Gott selbs hörlichen gesagt. Numa Pompilius/da er dergleichen thet/als empfieng er alle seine Räth vnnd gesatz durch das nächtlich gespräch/von der Göttin Egeria/wardt von seinen Römern schier für ein Gott geachtet/Sercorius aber als er ein zame weisse Hirtzin mit dem Römischen hauffen in Chrabaten bracht/vnd nach etlichen schedlichen Scharmützen betrachtet/wie er das rauch Volck möcht vberwinden/ließ er auch in der Feind Läger rüchtig werden/wie jhm Gott in einer weissen Hirtzin gestalt zu hülff kommen/vnd sein anschleger wer/welches sie nach bald erlittnem schaden glaubten vnnd sich gentzlich an jhn ergaben/bracht also mit erdichter Gottsforcht vnter seinen gewalt/die er mit Schwerdtschlegen/schwerlich gezämpt hett/wann durch sie erzagt der feind/vnd die seinen erstarckten in künheyt vnd Mannheyt/Endtlich seind die Tugendten am scheinlichsten/so jn ein angeborne glückseligkeyt allzeit beysteht/ohn die alles thůn vnnd lassen/hören/lesen/erfarung/kunst/stercke/achtbarkeyt/vnnd was dergleichen vortheyl/nichtig vnnd krafftloß seind/Mit der haben nicht allein Metellus/Sylla/Traianus/vnnd Vencidius Bassus/der auß einem Eseltreiber der glückhafftigest vberwinder der Parther war/sonder viel fürtrefliche vnsere Christliche Fürsten/Theodosius/Carolus der groß/vnnd der seinen Namen mit wercken bekrefftiget/Henricus Barbarossa von hohen Stauffen/deren vnüberwindliche Mayestat mehr zuuerwundern/dann nachzufolgen gewesen/jhre feind also vberwunden vnd sich erzeygt/daß sie nichts hertzlichers wünschten/dann jhrer huld wirdig zuwerden.
  cs: |-
    Decia, Scipiona, Gnaea Pompeia a athénského krále Kodra, nejvýtečněji však na Arminiovi, chloubě všech Němců. Ten uvedenými ctnostmi, má-li se po pravdě přiznat, daleko předčil všechny příklady celého světa: římské vládce celého světa porazil tolikrát, až je s malými houfky vyhnal z celé německé země, a nakonec, když společnou vlast očistil od nepřátel, vydechl naposled mezi nevděčníky. Toho všeho by jistě nebyl dokázal v tak veliké nouzi o proviant, lidi, peníze i přátele, kdyby ho Bůh nebyl podpořil vážností a štěstím a neučinil ho i s jeho vlastí vznešenějším nad všechny vojevůdce a národy. Neboť vysoce ceněná vážnost také není nejmenší pomocí k vítězství; nabývá se jí obvykle znamenitým bohatstvím, skvělou družinou a vysokým rodem – čehož se mu nedostávalo –, ale také, jak se na něm ukázalo, knížecí postavou a dvorností osoby i mravů, střídmou a rozumnou výmluvností, statečnými rytířskými činy a především přízní Boží, jež obrací srdce všech lidí, kam chce. Nejmoudřejší král Mínós Knósský u Kréťanů a Scipio u Římanů si lstí, vymyšlenými rozhovory s bohem Jupiterem, dosáhli toho, že všechny jejich řeči a rozkazy byly ceněny skoro víc, než kdyby je slyšitelně pronesl sám Bůh. Numa Pompilius, když dělal totéž, jako by všechny své rady a zákony přijímal v nočních rozhovorech s bohyní Egerií, byl od svých Římanů pokládán téměř za boha. Sertorius {Sercorius} pak, když s římským houfem přivedl do „Chorvatska“[^1] krotkou bílou laň a po několika škodlivých šarvátkách uvažoval, jak by mohl ten drsný lid přemoci, nechal i v nepřátelském ležení roznést, že mu Bůh přišel na pomoc v podobě bílé laně a je jeho rádcem. Tomu oni po brzy utrpěné škodě uvěřili a zcela se mu vzdali; tak předstíranou bázní Boží podrobil své moci ty, které by údery mečů sotva zkrotil, neboť jí nepřítel zmalátněl a jeho vlastní lidé posílili v odvaze a mužnosti. Nakonec jsou ctnosti nejzřetelnější tehdy, když je vždy provází vrozené štěstí, bez něhož je všechno konání i nekonání, slyšení, čtení, zkušenost, učenost, síla, vážnost a cokoli podobného výhodného marné a bezmocné. S ním nejen Metellus, Sulla, Traianus a Ventidius Bassus, který se z poháněče oslů stal nejšťastnějším přemožitelem Parthů, ale i mnozí naši znamenití křesťanští panovníci – Theodosius, Karel Veliký, jenž své jméno stvrdil činy, a Barbarossa {Henricus Barbarossa} z Hohenstaufen,[^2] jejichž nepřemožitelnému majestátu bylo spíš třeba se divit, než jej napodobit – přemohli své nepřátele a počínali si tak, že [ti] si nic vroucněji nepřáli, než stát se hodnými jejich přízně.
- typ: nadpis
  uroven: 2
  de: Von Eygenschafft deß Obersten.
  cs: O vlastnostech nejvyššího [velitele]
- typ: odstavec
  de: |-
    DErhalben sol der Oberst Fürst/ein Gottsförchtiger ohn befleckter schawspiegel beid freunden vnnd feinden sein/vnnd rechtgleubigen Gottsdienst in heyliger andacht vnd Kirchen versamlung/zu erwerbung Gottes frieds vnd hulden/durch all sein Fürstenthumb auffrichten/vnnd mit strenger vnuermeidlicher straff bey den Reichen vnd Armen/handhaben/auch mit Gottes gnad/wider seinen
  cs: |-
    Proto má být nejvyšší kníže {Oberst Fürst} bohabojným a neposkvrněným zrcadlem přátelům i nepřátelům; má po celém svém knížectví zřídit pravověrnou bohoslužbu ve svaté zbožnosti a církevním shromáždění, aby získal Boží pokoj a přízeň, a přísným, neodvratným trestem ji udržovat u bohatých i chudých. Také má s Boží milostí proti svému
poznamky:
- n: 1
  text: |-
    Tisk „in Chrabaten“; Quintus Sertorius však válčil v Hispánii a Lusitánii (Plútarchos, Sertorius 11), kde bílá laň údajně tlumočila vůli bohyně Diany. „Sercorius“ je tisková chyba za Sertorius.
- n: 2
  text: |-
    Tisk má „Henricus Barbarossa“; přízvisko Barbarossa nesl císař Fridrich I. Štaufský (1122–1190). Patrně záměna se jménem jeho syna Jindřicha VI.
