id: 014r
list: XIIII
strana: recto
sken: 35
stav: zkontrolovano
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    werden also in einer Besatzung gar füglich gebraucht vnter die stürmenden/sonderlich inn einer streichwehren/doch kan mans nicht in die weite brauchen/aber in der nähe zerstrewt es sich weit vnd thůt grossen schaden.
  cs: |-
    v posádce {Besatzung} se tak velmi vhodně užívají proti útočníkům, zvláště v boční obranné stavbě {streichwehren}. Na dálku se jich sice užít nedá, ale zblízka se [náboj] široce rozptýlí a působí velkou škodu.
- typ: odstavec
  de: |-
    Jetzt volgt allerhandt geschlecht des Handtgeschütz/damit man dann auch zum vorrath in einem Zeughauß versehen vnd gefaßt soll sein/als Zielbüchsen/birßbüchsen/vnd halbe hacken/deren ist mancherley/Vnnd dieweil sie gar gemeyn/vnd jedermann bekannt seind/so ist nicht noth viel meldung daruon zuthůn/vnd ist gnůg daß man wissen soll/daß man inn einem jeden Zeughauß mit einer gůten anzal des Handtgeschütz sampt seiner zůgehöre wol gefaßt vnd versehen sein soll.
  cs: |-
    Nyní následují všelijaké druhy ručních palných zbraní {Handtgeschütz}, jimiž má být zbrojnice {Zeughauß} také zásobena a vybavena do zásoby, jako terčovnice {Zielbüchsen}, piršovnice {birßbüchsen}[^1] a půlhákovnice {halbe hacken}, a to mnoha druhů. A protože jsou velmi obecné a každému známé, není třeba o nich mnoho mluvit; stačí vědět, že v každé zbrojnici má být dobrý počet ručních palných zbraní se vším příslušenstvím.
- typ: odstavec
  de: |-
    Wir haben jetzt in gemeyn vngefährlich von allerley des grossen vnnd kleynen Geschütz vom grösten biß auff das kleynst meldung gethan/desselbigen mag ein Herr oder Potentat/in seine Zeugheuser viel oder wenig seiner gelegenheyt vnd notturfft nach machen lassen/dann man hierinnen niemands keyn maß oder ordnung geben kan/dann das zu jedes lust vnnd willen steht. So dann jetzo das Geschütz als das fürnembst beschrieben/ist vonnöten/daß auch alle andere zůgehörde vnd Munition beschrieben vnd angezeygt werden/was in ein Zeughauß vonnöten/derhalben wöllen wirs jetzo nach dem Geschütz am fürnembsten an Puluer/Salpeter/Kuglen/vnd allerhandt notturfftiger Munition anheben.
  cs: |-
    Pojednali jsme nyní obecně a přibližně o všech velkých i malých dělech {Geschütz} od největšího po nejmenší; těch si pán nebo mocnář {Potentat} může do svých zbrojnic dát udělat mnoho či málo podle svých poměrů a potřeby, neboť v tom nelze nikomu dát žádnou míru ani řád, protože to je na libosti a vůli každého. Když jsme tedy nyní popsali děla jako to nejpřednější, je zapotřebí popsat a ukázat také všechno ostatní příslušenství a munici {Munition}, které jsou ve zbrojnici zapotřebí. Proto po dělech začneme tím nejpřednějším: střelným prachem {Puluer}, ledkem {Salpeter}, koulemi {Kuglen} a všelijakou potřebnou municí.
- typ: odstavec
  de: |-
    Vnd ist zu wissen/daß ein jeder Herr oder Potentat in seinem Zeughauß nach viele vnd grösse des Geschütz/mit allerhandt gůtem Puluer gefast vnd versehen soll sein/dann wenig Puluers erscheußt bey grossem Geschütz nit viel/wa mans anhebt zubrauchen/wie dann jeder Zeugmeyster sein Rechnung wol darauff kan machen/wieuiel er schüß mit jedem stück mit einem Centner Puluer thůn kan/darumb ist von nöten ein grossen vorrath an Puluer zuhaben/es ist aber noth daß man auch hab Schlangen Puluer zu den grossen stücken/auch Hacken Puluer vnnd Handtrohr Puluer/der jedes soll stäts eins besser dann das ander/vnnd das Handtrohr Puluer am besten sein/darzů soll man auch gůt zündtpuluer haben.
  cs: |-
    A je třeba vědět, že každý pán nebo mocnář má být ve své zbrojnici zásoben a opatřen všelijakým dobrým prachem podle počtu a velikosti děl, neboť málo prachu u velkých děl mnoho nevystřílí, když se jich začne užívat; to si ostatně každý zbrojmistr {Zeugmeyster} snadno spočítá, kolik ran může z každého kusu {stück} vystřelit s jedním centem {Centner} prachu. Proto je zapotřebí mít velkou zásobu prachu. Je však také nutné mít hadovnicový prach {Schlangen Puluer}[^2] pro velké kusy, dále hákovnicový prach {Hacken Puluer} a prach do ručnic {Handtrohr Puluer}, přičemž každý má být vždy lepší než předchozí a prach do ručnic nejlepší; k tomu má být po ruce i dobrý zápalný prach {zündtpuluer}.
- typ: odstavec
  de: |-
    So nuh der vorrath von Puluer vorhanden/soll man sehen/daß dasselbige vor verrätherey/vnd vntrew wol verwart vnd behalten werde/dann es gehört grosse sorg zu verwarung des Puluers/etwann farläßigkeyt/auch verrätherey/vnd allerhandt vrsachen halben/es ist aber hoch von nöten/daß mans an vielen orten/vnd weit von einander thůe/damit/wo sich vnrath zůtrüge/daß man nit auff ein mal vmb viel/oder gar darumb komme/man pflegts fast in Thürn vnd Gewölben zubehalten/es ist aber allein des Plitz vnnd Wetters halben etwas sörglich/dann es ist offt geschehen/daß das Wetter inn einen Puluerthurn geschlagen/daruon (dieweil derselbig ein stercke vnd gewalt hat) grosser schaden kommen ist. Deßhalben wa es sonst mit gůten statten geschehen mag/so wird es nit baß verwart/dann in einem Hauß zu oberst vnterm dach/dann so es schon vom Wetter oder sonst angehet/so wirffts nur das Dach hinweg/vnnd ist so grosser schaden nit/als in einem vesten Thurn oder Gewölb zubesorgen/Damit man auch zum füglichsten zum Puluer kommen möge/so sollen die Herrn selbs Puluermülen vnd Puluermacher haben/mit denen sollen sie sich wie sie mögen zum besten in vortheyl schicken/doch daß es die armen Gesellen auch erleiden mögen/vnd darbey bleiben können.
  cs: |-
    Když je tedy zásoba prachu po ruce, má se dbát, aby byl dobře opatrován a uchován před zradou a nevěrou, neboť k opatrování prachu je třeba velké péče, ať pro nedbalost, nebo pro zradu a všelijaké jiné příčiny. Je však velmi nutné ukládat ho na mnoha místech a daleko od sebe, aby se při nějaké nehodě nepřišlo najednou o mnoho nebo o všechno. Obvykle se uchovává ve věžích a klenbách, to je však poněkud nebezpečné kvůli bleskům a bouřkám, neboť se často stalo, že blesk udeřil do prachové věže a vzešla z toho (protože má [prach] takovou sílu a moc) velká škoda. Proto, dá-li se to jinak vhodně zařídit, nikde se prach neuchová lépe než v domě nahoře pod střechou: kdyby se totiž od blesku nebo jinak vznítil, odhodí jen střechu a škoda není tak velká, jaké je třeba se obávat v pevné věži nebo klenbě. A aby se k prachu přicházelo co nejsnáze, mají mít páni sami prachové mlýny {Puluermülen} a prachaře {Puluermacher}; s nimi se mají, jak mohou, co nejvýhodněji dohodnout, avšak tak, aby to i chudí tovaryši snesli a mohli při tom řemesle zůstat.
poznamky:
- n: 1
  text: >-
    Birschbüchse – lovecká ručnice k pirši (lovu na čekané či šoulání); Zielbüchse – přesná ručnice ke střelbě na terč.
- n: 2
  text: >-
    Schlangenpulver – hrubší prach pro děla (původně pro hadovnice), na rozdíl od jemnějšího prachu pro hákovnice
    a ruční zbraně a nejjemnějšího zápalného prachu na pánvičku (Zündpulver).
