id: fronsberger-1564
nazev: Válečný řád a zřízení
nazev_orig: Kriegs Ordnung vnd Regiment
podtitul: sampt derselbigen Befehl, Statt vnd Empter, zu Roß vnd Fuß, auch an Geschütz vnd Munition …
autor: Leonhart Fronsperger
autor_zivot: asi 1520–1575
