# Pořadí stran edice (id souborů ve strany/). Předsádka, pak listy I–CXXII (úplné).
predsadka: [titul, venovani-1, venovani-2, predmluva-1, predmluva-2]

poznamky_k_prekladu: |
  Struktura nadpisů (uroven 1 = hlavní části knihy):
  věnování, předmluva, úvod „Was einem Herren so Krieg fürnemen wil“ (1r), První kniha (2v),
  Druhá kniha (17v), Třetí kniha (34r), Čtvrtá kniha (40r), Pátá kniha (79r),
  „Folgen hernach notwendig Ordnungen vnd Lehr“ (107v). Ostatní velké oddíly
  (zbrojnice 11v, soudní řád, artikulní list) mají úroveň 2, přísahy a dílčí oddíly úroveň 3.
  Kapitoly uvnitř knih (nadpis v tisku větším písmem na středu, např. úřad a velení X) = úroveň 2;
  přísahy, podnadpisy seznamů a dílčí oddíly kapitoly = úroveň 3.
