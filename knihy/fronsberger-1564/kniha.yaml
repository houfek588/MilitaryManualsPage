popis: >-
  Příručka organizace žoldnéřského vojska 16. století: úřady, přísahy a povinnosti velitelů
  jízdy, pěchoty a dělostřelectva, soudní řád lancknechtů, artikulní list, posádky a obrana měst
  a obecná poučení o vedení války.
