# Glosář a věcný rejstřík – Fronsperger, Kriegs Ordnung vnd Regiment (1564)
#
# Závazná terminologie překladu. Každé heslo:
#   id        – stabilní identifikátor (používá web v adrese #/heslo/<id>)
#   cs        – kanonický český termín (dobová vojenská čeština 16. stol.)
#   de        – německé tvary, jak se vyskytují v tisku (pro rozpoznání {Termínu} v překladu)
#   kategorie – skupina ve věcném rejstříku (viz `kategorie` na konci)
#   hledat    – kmeny českých tvarů pro vyhledání výskytů v překladu (regulární výrazy, malá písmena)
#   pozn      – vysvětlení; web ho ukáže jako poznámku překladatele u prvního výskytu na stránce
#               a v rejstříku. Krátké, věcné, 1–3 věty.
#
# Pravidla překladu (shrnutí, podrobně v .claude/agents/prekladatel.md):
#  - V textu se používá vždy `cs`. Německý termín se přidá ve složených závorkách {…}
#    při PRVNÍM výskytu na stránce, a to v podobě z tisku (např. „profous {Profoß}“).
#  - Když kontext vyžaduje jiný překlad (např. Ordnung = řád × šik), použij ho a zvaž poznámku.

kategorie:
  velitele: Velitelé a úřady
  jednotky: Vojsko, jednotky a šiky
  delostrelectvo: Dělostřelectvo a munice
  zbrane: Zbraně a výstroj
  opevneni: Ležení, opevnění a obléhání
  pravo: Vojenské právo a soudnictví
  zold: Žold, peníze a zásobování
  sluzba: Služba, stráže a pochod
  osoby: Osoby
  mista: Místa a národy
  miry: Míry, váhy a mince

hesla:

