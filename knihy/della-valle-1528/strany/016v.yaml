bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    seruitio, & honore pigliando ala sprouista quelli dentro, & facendo cossi con piu ragione la matina se ponno leuare le guardie, ma non perho a mi pare che mai se leuano tutte, ma lassare qualcuno, & ancho secondo il tempo como sei constretto anzi de di renouarle can buone uedette in qualche altura, perche se hai fatto uedere che intorno della terra non e per un pezo imboscate, le uedette le discopriranno quando fossero per fare altri motiui li inimici, & cossi haueranno tempo quelli di dentro di metterse allordine de diffendere, & offendere. Et ancho e da notare che ad alcuno tempo accadeno le guardie, & sopra guardie, si de di como di notte non mancando un punto, anzi farle di meglior ordine, e piu che simel fatione soleno essere le piu uolte de di che di notte.
  cs: |-
    prospěchu a ke své cti tím, že by obránce zaskočila. Když se to tak udělá, lze ráno s lepším důvodem stráže {guardie} stáhnout; přesto se mi zdá, že by se nikdy neměly stáhnout všechny, ale některé je třeba ponechat a podle okolností, k nimž jsi nucen, je naopak za dne obnovit dobrými hláskami {uedette}[^1] na nějakém vyvýšeném místě. Když jsi totiž dal prohledat, že kolem města není široko daleko žádná záloha {imboscate}, hlásky odhalí nepřítele, kdyby chtěl podniknout nějaký jiný pohyb, a obránci tak budou mít čas připravit se k obraně i k útoku. Dále je třeba poznamenat, že v některých dobách jsou stráže a vrchní stráže {sopra guardie} potřeba ve dne stejně jako v noci, aniž by se v nich v nejmenším polevilo – ba je třeba je konat v ještě lepším pořádku, neboť takové akce {fatione}[^2] se většinou podnikají spíše ve dne než v noci.
- typ: nadpis
  uroven: 2
  de: DE MONITIONE AD MILITI che hanno ad conseruare un luoco per tempo. Capitolo.XXXIIII.
  cs: Poučení vojákům, kteří mají po nějaký čas hájit nějaké místo. Kapitola XXXIIII.
- typ: odstavec
  de: |-
    ANchora e da notare che quando quelli militi di dentro de la terra uanno fuora per dimostrare le lor magnanimita, & dappiciase ad fatti dico che non conuiene saluo che cautamente cioe che habbiano da comprendere che quelli di fuora non habbiano battaglioni in conserua acio che quando seranno appiciati in scaramuzza che al retirarse per tornare dentro che la furia loro non si mescolasse insieme perche sarebbe un mettere ad compromisso el dubioso caso, del che habiate aduertentia che communeuolmente e per comprendere, & temere simel acceso & pensamento si
  cs: |-
    Dále je třeba poznamenat: když vojáci {militi} z města vycházejí ven, aby ukázali svou statečnost, a pouštějí se do boje, pravím, že se to smí dít jen opatrně. Musejí totiž zjistit, zda obléhatelé nemají v záloze bataillony {battaglioni}, aby se – až se zapletou do šarvátky {scaramuzza} a budou ustupovat zpět do města – obě strany v náporu nesmísily; to by totiž znamenalo vydat se v sázku nejistému osudu. Na to dávejte pozor, neboť obecně je třeba takový přístup [k bráně] a záměr [nepřítele] předvídat a obávat se ho, a to
poznamky:
- n: 1
  text: '„uedette“ (vedette) – stálé denní hlásky na vyvýšeném místě, odkud přehlédnou okolí. „can buone uedette“ – v tisku chybně „can“ místo „con“.'
- n: 2
  text: '„fatione“ (fazione) – vojenská akce, podnik, přepad.'
