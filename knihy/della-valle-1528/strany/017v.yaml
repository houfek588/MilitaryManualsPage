bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    si sera fatto lo argolio, & potralo adoperare per sempre como qui alincontro appare. Et e da notare che lo uaso bisogna che sia tanto longo che uadi la freza con lo Suro a baso, attale che uenga a calare per fino al numero de le uintiquatro hore, Anchora dico che quando el uaso fosse uno barile sarebbe al proposito, quando non si trouasse altro per comodita como qui alincontro uedete, & seria meglio.
  cs: |-
    budou hodiny {argolio}[^1] hotové a bude je možné používat napořád, jak je vidět zde naproti. A je třeba poznamenat, že nádoba musí být tak vysoká, aby šipka {freza} s korkem {Suro} mohla klesat dolů až k číslu dvacet čtyři hodiny. Dále pravím, že kdyby nádobou byl soudek {barile}, bylo by to vhodné, nenajde-li se pohodlně nic jiného, jak to vidíte zde naproti; a bylo by to dokonce lepší.
poznamky:
- n: 1
  text: '„argolio“ – v tisku přesmyk za „arlogio“ (hodiny). Vyobrazení soudku s hodinovou stupnicí je na protější straně (018r). Zbytek strany je v tisku prázdný; text je sázen do zužujícího se trojúhelníku.'
