bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    cossi sera fatto lo argolio, & potralo adoperare per sempre como qui alincontro appare. Et e da notare che lo uaso bisogna che sia tanto longo che uadi la freza con lo Suro a baso, attale che uenga a calare per fino al numero de le uintiquatro hore, Anchora dico che quando el uaso fosse uno barile sarebbe al proposito, quando non si trouasse altro per comodita como qui alincontro uedete, & seria meglio.
  cs: |-
    A tak budou hodiny {argolio}[^1] hotové a můžeš je používat napořád, jak je vidět zde naproti. Je třeba poznamenat, že nádoba musí být tak vysoká, aby šipka s korkem mohla klesat dolů až k číslu dvacet čtyři. Dále pravím, že kdyby nádobou byl soudek, bylo by to vhodné, nenajde-li se po ruce nic jiného, jak vidíte zde naproti; a bylo by to dokonce lepší.
poznamky:
- n: 1
  text: '„argolio“ – v tisku přesmyk za „arlogio“ (hodiny). Vyobrazení je na protější straně [[018r|18 r]]; text je sázen do zužujícího se trojúhelníku a zbytek strany je prázdný.'
