bloky:
- typ: nadpis
  uroven: 2
  de: |-
    Ordine de annumerare de ciaschun battaglione in poco numero per tenerlo a mente lordine che hanno, zoe quadrangolo, ma quando uolesseno fare alcuna ala, ne pigliarete intorno, & cosi squadra, & unisce como a uoi parera hauendoce buono intendimento. Capitolo. XLI.
  cs: |-
    Způsob, jak zapsat každý bataillon několika málo čísly, abyste si zapamatovali jeho uspořádání, totiž čtyřúhelník. Kdyby však chtěli udělat nějaké křídlo, vezmete [muže] z obvodu, a tak se [šik] srovná a spojí, jak uznáte za vhodné, rozumíte-li tomu dobře. Kapitola XLI.
