bloky:
- typ: nadpis
  uroven: 2
  de: |-
    Ordine de annumerare de ciaschun battaglione in poco numero per tenerlo a mente lordine che hanno, zoe quadrangolo, ma quando uolesseno fare alcuna ala, ne pigliarete intorno, & cosi squadra, & unisce como a uoi parera hauendoce buono intendimento. Capitolo. XLI.
  cs: |-
    Způsob, jak každý bataillon zapsat několika málo čísly, abyste si zapamatovali, jaký má řád, totiž čtyřúhelník; když by však chtěli udělat nějaké křídlo, vezmete [muže] zokola, a tak [šik] srovnejte do čtverce a spojte, jak uznáte za dobré, máte-li v tom dobrý rozum. Kapitola XLI.
