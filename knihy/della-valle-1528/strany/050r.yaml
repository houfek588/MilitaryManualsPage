- typ: nadpis
  uroven: 3
  de: El modo de intendere le sopraditte figure.
  cs: Jak rozumět výše uvedeným zápisům
- typ: odstavec
  de: |-
    O. vol dire ordinanza. B. vol dire bandera ad tante filare quando dice labaco. p. vol dire partire a tante /filare quanto ve dice le doe litere de labaco & doe altre litere dice puro lo suo numero/a tante filare. El terzo numero significa a tante filare como el primo: verbi gratia. De ducento picche la. o. significa ordinanza como ho ditto: quella 5 tonda che e la cinque litere de labaco significa cinque picche per filare: la. b. Bandiera: la. p. parte. ad quattordece filare: e a dieci laltro partir: e a quattordeci filara. E quella. p. tagliata significa per fianco dello battaglione quella. 2. significa doi facie del battaglione venera quattordece: e per doi altri quindeci: & cosi per tenere a mente come sa da fare li battaglioni se po notare a questo modo: e la. a. significa auanzare tante picche quanto dice labaco.
  cs: |-
    O. znamená šik {ordinanza}. B. znamená prapor {bandera} po tolika řadách {filare}, kolik udává číslo.[^4] P. znamená rozdělit na tolik řad, kolik vám udávají dvě číslice, a další dvě číslice rovněž udávají svůj počet řad; třetí číslo znamená tolik řad jako první. Například u dvou set pikenýrů {picche} znamená o. šik, jak jsem řekl; ta kulatá pětka, totiž číslice pět, znamená pět pikenýrů v řadě; b. prapor; p. rozdělení na čtrnáct řad, druhý díl na deset a [třetí] na čtrnáct řad. Přeškrtnuté p. znamená „po boku“ {per fianco} bataillonu {battaglione}; dvojka znamená, že dvě strany bataillonu budou mít čtrnáct a druhé dvě patnáct. Takto si lze poznamenat, jak se mají bataillony stavět, abyste si to zapamatovali. A. pak znamená, že přebude tolik pikenýrů, kolik udává číslo.[^5]
poznamky:
- n: 1
  text: |-
    V prvním řádku stojí mezi čísly nejasné „a.ꝑ.m.“ (ve zvětšeném skenu čtení jisté); snad zkomolený údaj o přebytku (a.). Znak ꝑ (p s přeškrtnutou nožkou, jinak zkratka „per“) tu podle výkladu pod tabulkou znamená „per fianco“ – „po boku“ (strany) bataillonu, proto ho edice ponechává. Dvojice „2 2“ nad řádkem se vztahuje ke dvěma údajům ꝑ (dvě strany mají první číslo, dvě druhé).
- n: 2
  text: |-
    Druhý údaj „po boku“ je v tomto řádku vysázen jako p s vlnovkou (p̃) místo přeškrtnutého p; edice sjednocuje na ꝑ.
- n: 3
  text: |-
    Čísla ověřena ve zvětšeném skenu, tisk má skutečně „b.23“ u 500 a „ꝑ.30“ u 700 pikenýrů. Podle ostatních řádků jde patrně o tiskové chyby – b. odpovídá zhruba polovině součtu řad p. (prapor stojí uprostřed: u 500 by čekali asi b.31) a první ꝑ se rovná prvnímu číslu p. (u 700 by čekali ꝑ.26).
- n: 4
  text: |-
    „Litere de labaco“ (číslice počtářů, tj. arabské) a „quanto dice labaco“ = kolik udává číslo; l’abaco = počty, aritmetika.
- n: 5
  text: |-
    Výklad pod tabulkou je na rozdíl od zbytku kapitoly sázen gotickým písmem (rotundou). Podle čísel lze šifru číst takto (výklad edice) – o. udává počet mužů v řadě, p. rozdělení řad na tři díly (čelo, střed s prostranstvím, týl), b. řadu, v níž stojí prapor (zhruba uprostřed), ꝑ. délku stran a a. přebývající pikenýry. Součin o. × součet p. se pak blíží celkovému počtu (např. 500 = 8 × 62 ≈ 496; 700 = 10 × 69 + 6 = 696).
