- typ: nadpis
  uroven: 3
  de: El modo de intendere le sopraditte figure.
  cs: Jak rozumět výše uvedeným obrazcům
- typ: odstavec
  de: |-
    O. vol dire ordinanza. B. vol dire bandera ad tante filare quando dice labaco. p. vol dire partire a tante /filare quanto ve dice le doe litere de labaco & doe altre litere dice puro lo suo numero/a tante filare. El terzo numero significa a tante filare como el primo: verbi gratia. De ducento picche la. o. significa ordinanza como ho ditto: quella 5 tonda che e la cinque litere de labaco significa cinque picche per filare: la. b. Bandiera: la. p. parte. ad quattordece filare: e a dieci laltro partir: e a quattordeci filara. E quella. p. tagliata significa per fianco dello battaglione quella. 2. significa doi facie del battaglione venera quattordece: e per doi altri quindeci: & cosi per tenere a mente come sa da fare li battaglioni se po notare a questo modo: e la. a. significa auanzare tante picche quanto dice labaco.
  cs: |-
    O. znamená šik {ordinanza}. B. znamená prapor {bandera} na tolik řad {filare}, kolik udává číslo {labaco}[^2]. p. znamená rozdělit na tolik řad, kolik vám udávají dvě číslice, a další dvě číslice rovněž udávají svůj počet řad. Třetí číslo znamená tolik řad jako první. Například: u dvou set pikenýrů {picche} znamená o. šik, jak jsem řekl; ta kulatá 5, což je číslice pět, znamená pět pikenýrů v řadě; b. prapor; p. rozdělení na čtrnáct řad, pak na deset druhé dělení a pak na čtrnáct řad. A to přeškrtnuté p. znamená „po boku“ {per fianco} bataillonu {battaglione}: ta 2 znamená, že dvě strany {facie} bataillonu budou mít čtrnáct a druhé dvě patnáct. A tak si lze tímto způsobem poznamenat, jak se mají bataillony stavět, abyste si to zapamatovali; a. pak znamená, že zbude tolik pikenýrů, kolik udává číslo.[^3]
poznamky:
- n: 1
  text: V prvním řádku stojí mezi čísly nejasné „a.ꝑ.m.“ (snad tisková chyba; čtení ověřeno ve skenu). Znak ꝑ (p s přeškrtnutou nožkou, běžná zkratka „per“) tu podle výkladu pod tabulkou znamená „per fianco“ – „po boku“ (na stranách) bataillonu, proto ho edice ponechává. Dvojice „2 2“ za počtem pikenýrů se vztahuje ke dvěma údajům ꝑ (dvě strany bataillonu mají první číslo, dvě druhé).
- n: 2
  text: L’abaco – počty, aritmetika; „litere de labaco“ jsou číslice (zde arabské), „quanto dice labaco“ = kolik udává číslo.
- n: 3
  text: Celý výklad pod tabulkou je na rozdíl od zbytku kapitoly sázen gotickým písmem (rotundou). Zápis tedy obsahuje šik s počtem pikenýrů v řadě (o.), řadu, v níž stojí prapor (b.), rozdělení na tři části (p.), počty mužů na stranách (ꝑ.) a přebytek (a.).
