  popis: |-
    Celostránkový dřevořez bez nápisů k [[006r|kapitole VII]], otištěný naproti jejímu textu: čelní pohled na čtverhrannou baštu „s kotvami, střílnami a dvěma kasematami“. Šest svislých trámů dřevěné kostry spojují vodorovné příčky s kolíky – kotvy (chiaue), které přečnívají přes okraj stěny – a šikmé vzpěry do kříže; mezery vyplňují otepi proutí (manocchie) s udusanou hlínou. Ve dvou vodorovných řadách (dvě kasematy) je po pěti čtvercových střílnách (candonere), kreslených perspektivně jako zužující se otvory.
