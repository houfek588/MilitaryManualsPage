  popis: |-
    Celostránkový dřevořez bez nápisů k [[006r|kapitole VII]], otištěný naproti jejímu textu: čtverhranná bašta „s kotvami a střílnami a se dvěma kasematami“ v čelním pohledu. Svislé trámy dřevěné kostry jsou spojeny vodorovnými příčkami s kolíky – „kotvami“ (chiaue), které přečnívají přes okraj kostry – a šikmými vzpěrami do kříže; mezery vyplňují otepi proutí (manocchie) s udusanou hlínou. Ve dvou vodorovných řadách (dvě kasematy) je po pěti čtvercových střílnách (candonere) vyobrazených perspektivně jako zužující se otvory.
