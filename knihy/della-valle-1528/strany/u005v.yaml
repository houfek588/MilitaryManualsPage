  popis: |-
    Celostránkový dřevořez v dvojitém rámu, bez nápisů: ohňostrojné zbraně, o nichž jednají následující „tři kapitoly o ohni“. Uprostřed dvě zkřížené ohnivé trouby; každá je dlouhé válcové pouzdro ovinuté obručemi, nasazené na dlouhé dřevěné násadě, a z jeho ústí šlehají plameny. Nahoře mezi nimi ohnivá koule (srov. kap. II), z níž srší jiskry. Vlevo a vpravo hořící ohnivé hrnce s uchy (levý puká a plameny z něj vyrážejí do stran), dole uprostřed třetí hrnec s uchy a otvorem, z jehož hrdla vyšlehuje oheň.
