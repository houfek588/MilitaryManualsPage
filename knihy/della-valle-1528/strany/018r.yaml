  popis: |-
    Vodní hodiny z kapitoly XXXV: dřevěný soudek s obručemi, u dna vlevo je výtoková trubička. Ze soudku vyčnívá svislá laťka se stupnicí o 24 polích, očíslovaných shora dolů 1 až 24 (číslice dvoumístných čísel jsou rozděleny do dvou sloupců: vlevo desítky, vpravo jednotky). Středem stupnice vede šipka hrotem nahoru – drátěná ručka korkového plováku, která s klesající vodou ukazuje hodiny. Celá strana je jen vyobrazení (bez textu).
