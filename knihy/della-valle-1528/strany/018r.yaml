  popis: |-
    Vodní hodiny z kapitoly XXXV: dřevěný soudek s obručemi, u dna vlevo s výtokovou trubičkou. Ze soudku vyčnívá svislá laťka se stupnicí o 24 polích, očíslovaných shora dolů 1 až 24; číslice jsou ve dvou sloupcích (u čísel 1–9 je číslice vlevo a vpravo tečka, u dvoumístných čísel vlevo desítky, vpravo jednotky). Středem stupnice vede šipka hrotem nahoru – drátěná ručka korkového plováku, která s klesající vodou ukazuje hodiny. Celá strana je jen vyobrazení (bez textu).
