  popis: |-
    Dva přístupové zákopy (trenciere) ke kapitole II na protější straně, vedené zdola nahoru krajinou s trsy trávy: vlevo zákop vinoucí se ve tvaru hada (esovitě), vpravo zákop lomený do klikatky (cikcak). Ve vnějších ohybech zákopů stojí válcovité pletené koše plněné zeminou (gabiony) – vlevo pět, vpravo šest –, které kryjí zatáčky před pohledem z města. Celá strana je vyobrazení bez textu; pravý okraj dřevořezu zasahuje do hřbetu vazby.
