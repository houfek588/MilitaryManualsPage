  popis: |-
    Dva přístupové zákopy (trenciere) ke kapitole II na protější straně, vedené krajinou s trsy trávy směrem k hradbě nahoře: vlevo zákop vinoucí se ve tvaru hada (esovitě), vpravo zákop lomený do klikatky (cikcak). Na zalomeních a podél zákopů stojí válcovité pletené koše plněné zeminou (gabiony), které kryjí postupující muže. Celá strana je vyobrazení bez textu; pravý okraj dřevořezu zasahuje do hřbetu vazby.
