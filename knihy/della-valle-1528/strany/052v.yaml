  popis: |-
    Bataillon v nůžkách proti bataillonu v trojúhelníku (k [[053r|textu na protější straně]]), sázený z písmen přes celou stranu. Nahoře stojí čtyřhranné tělo bataillonu z písmen „p“ s velkým praporem „B“, nad ním nápis SCHINO – týl; horní řadu a oba krajní sloupce tvoří „Po“. Dole se šik rozevírá do dvou šikmých ramen (nůžky {forfice}); na vnější straně každého ramene je nápis SCHINO – týl, na vnitřní straně FRONTE – čelo a vnitřní řady jsou sázeny „PoPo…“. Do rozevřených nůžek se hrotem vzhůru vkliňuje trojúhelník z písmen „d“ (kraje sázené „do / od“, u hrotu další nápis FRONTE), jehož tělo dole tvoří šikmé řady „d“ a vějíř řad nad základnou „dodo…“; uprostřed u základny stojí prapor „B“ obklopený písmeny „p“.
