  de: |-
    excellentissima signoria per essere da longa, & uetustissima nobilita, & signoria etiam regia desceso, & da natura prudente, iusto, & magnanimo, & modesto producto, & ad ogni cosa, & operatione, da celesti fati inclinato, continuamente seti solito confabulare non de cose lasciue, & Veneree incondecente, & inconueniente ad una summa, inclita & circunspecta uirtu, ma de quello che appertene ad ciaschedun sagace, strenuo, prudente, & magnanimo Caualiero parte del guberno, & regimento de republica ad ogni uigoroso, integro, & iusto Principe condecente, & competente, parte de larte, & scientia, auisamenti, astutie, & consigli militari, mediante lequale uirtu secondo il mio iudicio quantunque sia minimo, ciascheduno stato per indomito & grande che fosse, facilmente gubernare, regere, & augmentare se potra. Onde io desideroso, & auido de continuamente (si como ad uno gentile spirito conuiene) de imparare alcuni documenti, dal uostro iocondo, & piaceuole conspetto, & deletteuole per uarii, & infiniti amaistramenti, colloquio mai in quanto me fosse stato licito, me son partito, quelli precepti curiosamente, & attentamente auscultando in la mia debil mente, & memoria, como ad uno duro marmoro imprimeua, quello che dapoi con experientia, & longo exercitio ho trouato, & experto, scriuea non con limato stilo, elegantia, & abundantia de dire secondo ad tale materia da un tanto sagace, & ingegnoso principe exposta conueneua, ma secondo il mio basso ingegno potea. Onde al presente per hauere in uno picolo, & exiguo uolume tali odoriferi fiori ricolto me ha parso apertamente demonstrando quanta sia
  cs: |-
    převznešená Milost, protože pochází z dávného a prastarého šlechtictví, ba i z královského panství, a od přírody je stvořena moudrou, spravedlivou, šlechetnou a skromnou a nebeskými osudy nakloněna ke všem věcem a činům, ustavičně má ve zvyku hovořit ne o věcech chlípných a milostných, které se nehodí a nesluší k nejvyšší, slavné a rozvážné ctnosti, nýbrž o tom, co přísluší každému bystrému, statečnému, moudrému a šlechetnému rytíři {Caualiero}: zčásti o vládě a správě obce, jak se hodí a přísluší každému ráznému, bezúhonnému a spravedlivému knížeti, zčásti o válečném umění a vědění, o válečných výstrahách, lstech a radách. Pomocí těchto ctností lze podle mého úsudku, byť nepatrného, snadno spravovat, řídit a rozmnožovat každý stát, byť sebeneukrocenější a sebevětší. Proto jsem já, dychtivý a žádostivý (jak se na ušlechtilého ducha sluší) neustále se učit nějakým naučením, nikdy neodcházel, nakolik mi to bylo dovoleno, od Vaší radostné a milé přítomnosti a od Vašeho rozhovoru, potěšujícího rozmanitými a nesčetnými poučeními. Ty předpisy jsem zvídavě a pozorně poslouchal a vtiskoval do své slabé mysli a paměti jako do tvrdého mramoru; a co jsem pak zkušeností a dlouhým cvikem shledal a vyzkoušel, zapisoval jsem, ne vybroušeným slohem, s elegancí a hojností řeči, jak by se slušelo k látce, kterou vyložil tak bystrý a důmyslný kníže, nýbrž jak jen mé nízké nadání dovedlo. Když jsem tedy nyní do malého a skrovného svazku sebral takové vonné květy, zdálo se mi – abych zjevně ukázal, jak veliká je
