  popis: |-
    Druhý typ hodin (ke kapitole XXXVI na protější straně): dřevěný rám ze dvou sloupků a vodorovného otočného válce, na který je navinut provaz. Na levém konci válce visí na provaze vědérko s uchy a s výtokovou trubičkou u dna; z jeho boku míří šipka na stupnici na levém sloupku, očíslovanou zdola nahoru 1 až 24 (šipka ukazuje na 1). Na pravém konci válce visí druhý provaz, ověšený po celé délce kapkovitými závažími – podle textu 24 protizávaží. Jak voda z vědérka vytéká, vědérko stoupá, protizávaží klesají a každou hodinu se jedno z nich dotkne země; šipka na vědérku ukazuje hodinu na stupnici. Pravý sloupek rámu zasahuje do hřbetu vazby a je na skenu useknut. Strana nemá text.
