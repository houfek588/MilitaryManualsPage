bloky:
- typ: nadpis
  uroven: 2
  de: |-
    MODO DE FARE BASTIONI quadri con soi pertinentie. Cap. VII.
  cs: |-
    Způsob, jak stavět čtverhranné bašty, s jejich příslušenstvím. Kapitola VII.
- typ: odstavec
  de: |-
    QVesto e modo de Bastione quadro con le soe chiaue & candonere con doe casematte, elquale bisogna como e stato ditto che sta al sapere murare le soe manocchie, & calcarli como per laltro e ditto, & facendose como conuiene & con larte & intendimento pertinente ad epso sera de gran perfettione. Et piu e da sapere che li Bastioni son trouati per molti boni respetti, prima son piu expeditiui alla guerra chel Muro, & se reseccano piu presto chel muro, & mancho spesa, et anchora resisteno piu ad colpi de artellarie, & piu securo de fauille de pietre che non e cossi el muro, che quando non si po piu resistere ale botte, el muro fa piu dando le pietre de epso muro ad li Militi che la pietra del candoner, o altro pezo, quello che non fanno el riparo prendendo el deuere, che quando si fa uno riparo e prohibito che el terreno che ui metiate che non li sia pietre nisuna che quando la palla del nimico uiene, & troua pietre al riparo lo disfa piu presto & le pietre che usisce fora amaza gli militi che stanno al combattere.
  cs: |-
    Toto je způsob čtverhranné bašty {Bastione} s jejími kotvami {chiaue} a střílnami {candonere} a se dvěma kasematami {casematte}.[^1] U ní, jak bylo řečeno, záleží na tom, umět vyzdít její otepi {manocchie}[^2] a udusat je, jak bylo řečeno jinde; a když se udělá, jak se sluší, s uměním a porozuměním, které k ní patří, bude velmi dokonalá. Dále je třeba vědět, že bašty byly vynalezeny z mnoha dobrých důvodů. Zaprvé se ve válce postaví rychleji než hradba {Muro}, vyschnou dříve než hradba a stojí méně; dále lépe odolávají ranám z děl {artellarie} a jsou bezpečnější před odštěpky kamenů než hradba. Když totiž hradba už nemůže odolávat ranám {botte}, škodí vojákům {Militi} víc kamením, které z ní odlétá, než samotná kamenná koule z kanonu[^3] či jiného děla {pezo}. To záštita {riparo}, je-li provedena řádně, nedělá: když se staví záštita, nesmí být v zemině, kterou do ní dáváte, žádné kameny, protože když přiletí nepřátelská koule {palla} a narazí v záštitě na kameny, rozbije ji rychleji a kameny, které vyletí ven, zabíjejí vojáky, kteří tam bojují.
poznamky:
- n: 1
  text: Obrazec čtverhranné bašty je na protější straně, [[005v|list 5 v]].
- n: 2
  text: Manocchia (mannocchia) – otep, svazek proutí či chrastí; z otepí a udusané hlíny se „zdí“ těleso bašty podobně jako z fašin.
- n: 3
  text: V tisku „la pietra del candoner, o altro pezo“. Candoner zde podle souvislosti („či jiného děla“) zřejmě znamená dělo (cannone), ne střílnu (candonera), jak jinde u autora.
