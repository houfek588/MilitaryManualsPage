  popis: |-
    Zákop s děly ke kapitole III na protější straně: nahoře úsek hradby s cimbuřím (merlony), střílnou a šikmým svahem, vlevo v řezu; pod ní těsně před hradbou řada pletených košů plněných zeminou (gabionů), za níž v ústí zákopu stojí dělo na lafetě namířené na hradbu. Zákop se k němu vine esovitě krajinou zdola; v jeho zatáčkách jsou postaveny další gabiony, v pravém ohbí a ve spodní části zákopu jsou další dvě děla na kolových lafetách, která se po zákopu přisunují k hradbě. Celá strana je vyobrazení bez textu; pravý okraj zasahuje do hřbetu vazby.
