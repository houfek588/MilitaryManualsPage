bloky:
- typ: nadpis
  uroven: 2
  de: |-
    DE PERTINENTIE AD GOVERnare una terra. Capitolo. V.
  cs: |-
    O tom, co náleží ke správě města. Kapitola V.
- typ: odstavec
  de: |-
    ET piu e de necessario chel Capitan uada doi, o tre uolte fuora della terra intorno, & uedere, & spiculare doue lo inimico lo potrebbe offendere si nello scalare, come a trahere artellarie per ammazare gli huomini, uerbi gratia, si gli fosse alcuno passo, o uero stretta pratticabile, & questo uederlo piu, & piu uolte di dentro & di fuora, o altri modi utili al bisogno, E da notare, che chi non sa defendere non sa offendere. E bisogna attendere ad fortificare in reparare, bastioni, & caualleti & meze lunette, & torrete con casematte con soe candonere che batteno per fianchi, & per cantone secondo il luocho, & iudicio de buon guerriero, & sapere mettere legnami ad tanti palmi luno secondo la larghezza del bastione, & de modo tale che uengano le chiaue al proposito del suo Calare, & che non si sconzi alcuno legno, o uero candonera, cossi facendo le cose bene secondo larte, & ragione li sera utile honore & gloria.
  cs: |-
    Dále je nutné, aby kapitán {Capitan} dvakrát nebo třikrát vyšel z města[^1] a obešel je dokola, aby viděl a prozkoumal, kde by ho nepřítel mohl napadnout, ať už zlézáním hradeb {scalare}, nebo střelbou z děl {artellarie}, jíž by zabíjel muže – například kdyby tam byl nějaký průchod nebo schůdná úžina. A to si má prohlédnout znovu a znovu zevnitř i zvenčí, případně i jinak, jak bude potřeba. Je třeba mít na paměti, že kdo neumí bránit, neumí ani útočit. A je třeba dbát o opevňování: o zahrazování {reparare}, o bašty {bastioni}, kavalírky {caualleti} a půlměsíčky {meze lunette}[^2] a o věžičky s kasematami {casematte} a jejich střílnami {candonere}, které střílejí z boku {per fianchi} a přes roh, podle místa a podle úsudku dobrého válečníka. A [kapitán má] umět klást trámy po tolika a tolika pídích {palmi}[^3] od sebe podle šířky bašty, a to tak, aby kotvy {chiaue} šly souběžně s jejím svahem[^4] a aby se žádné dřevo ani střílna neporušily. Když bude dělat věci dobře podle umění a rozumu, bude mu to k užitku, ke cti a ke slávě.
- typ: nadpis
  uroven: 2
  de: |-
    DE FORTIFICARE VNA TERRA Capitolo. VI.
  cs: |-
    O opevnění města. Kapitola VI.
- typ: odstavec
  de: |-
    QVando mancasseno le fascine per reparare bisogna fare de molti gabioni tondi a modo de botte aperti sotto, & sopra & drizando in piede, & metterli doue e il bisogno, e impirli di terra, & calcarli ben forte, & questi gabioni sono molto utili, & mettendoli uno poco larghetti luno da laltro
  cs: |-
    Kdyby chyběly fašiny {fascine} k zahrazování, je třeba udělat mnoho kulatých košů {gabioni} na způsob sudu, otevřených dole i nahoře, postavit je nastojato tam, kde je jich potřeba, naplnit je zemí a velmi pevně udusat. Tyto koše jsou velmi užitečné, a když se postaví trochu od sebe
poznamky:
- n: 1
  text: Terra – u Della Vally obvykle opevněné místo (město nebo hrad), které kapitán hájí; překládáme „město“.
- n: 2
  text: Cavalletto – malý kavalír (vyvýšené dělové stanoviště); mezza lunetta – menší polokruhové předsunuté dílo.
- n: 3
  text: Palmo – italská píď, neapolská asi 26,4 cm, římská asi 22,3 cm.
- n: 4
  text: Sporné místo „uengano le chiaue al proposito del suo Calare“. Calare (klesat, spouštět se) chápeme jako sklon líce bašty, který mají kotvy dřevěné kostry sledovat; srov. kap. IX (list 8 r) „uiene ad Calare secondo cala lo riparo“.
