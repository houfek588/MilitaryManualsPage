bloky:
- typ: nadpis
  uroven: 2
  de: A FARE DOI BATTAGLIONE lun contra laltro. Capitolo. XLII.
  cs: Jak postavit dva bataillony proti sobě. Kapitola XLII.
- typ: odstavec
  de: |-
    QVesti battaglioni sono contrarii luno de laltro, triangolo contra quadrangolo como qui alincontro appare, & ciascuno de epso sono picche trecento, & alo quadrangolo auanzano sedece picche, quale se metteno nella piaza, & allo triangolo auanza quattro, & cosi questi doi battaglioni se deueno affrontare, & ciaschun de epsi potranno spicare una ala per impedire per fianco, & anco doi. Ma uero depende chi la cacciara con piu ragione & ad tempo, & cossi se potriano moltiplicare in gran numero ciaschun de epsi con altri battaglioni per conserua & spalle.
  cs: |-
    Tyto bataillony {battaglioni} stojí proti sobě, trojúhelník {triangolo} proti čtyřúhelníku {quadrangolo}, jak je vidět na protější straně, a každý z nich má tři sta pikenýrů {picche}. Čtyřúhelníku přebývá šestnáct pikenýrů, kteří se postaví na prostranství {piaza},[^1] a trojúhelníku přebývají čtyři. Takto se mají tyto dva bataillony utkat. Každý z nich bude moci vyslat jedno křídlo {ala}, aby [nepříteli] překáželo z boku {per fianco}, i dvě; vskutku však záleží na tom, kdo je vyšle s větším rozmyslem a včas. A tak by se každý z nich mohl rozmnožit na velký počet dalšími bataillony jako doprovodem a zálohou.[^2]
poznamky:
- n: 1
  text: Na obrazci [[050v|50 v]] stojí na prostranství kolem praporu „B“ jen 14 písmen „d“; čtyřúhelník tam má 17 řad po 18 mužích, jak udává šifra kapitoly XLI pro 300 pikenýrů.
- n: 2
  text: „Per conserua & spalle“ – „conserva“ je doprovod, souputník (námořní výraz pro lodě plující spolu), „spalle“ (plece) opora za zády, záloha. Závěr kapitoly je sázen do zužujícího se klínu, jak bývalo zvykem.
