bloky:
- typ: nadpis
  uroven: 2
  de: DE HAVERE AD SCRIVERE E fare legere ad altri di lonzi senza messagio Capitolo XXXVII.
  cs: Jak psát a dávat druhým číst na dálku bez posla. Kapitola XXXVII.
- typ: odstavec
  de: |-
    VNo modo de scriuere da longi quando si puo uedere cioe de notte, & ancho de di, ma da presso non molto da longi, la cosa e questa, che uerbi gratia quando uno capitano e assediato in una terra da uno grosso campo che non si potesse intrare nissuno dentro con littera, ouero quelli dentro non potessero uscire fora con littere, adchi conuenisse de sapere lo bisogno loro, bisogna pigliare questo intendimento de arte luna & laltra parte che se hanno da dare auiso fra loro, El modo e questo, che quello che da auiso che lo tegna scripto in mano, & quello che lara da copiare et legere bisogna che habia carta, & chalamero, con questo alphabetto qui sottoscritto & intenderai.
  cs: |-
    [Zde je] způsob, jak psát na dálku, pokud je vidět – v noci, ale i ve dne –, avšak zblízka, ne příliš zdaleka. Věc je tato: když je například kapitán {capitano} obležen ve městě {terra} velkým vojskem {campo}[^1], takže nikdo nemůže proniknout dovnitř s listem, anebo obránci nemohou vyjít ven s listy k tomu, kdo by se měl dozvědět o jejich potřebě, musejí si obě strany, které si mají navzájem podávat zprávy, osvojit toto umění. Způsob je tento: kdo zprávu podává, ať ji má napsanou v ruce, a kdo ji bude opisovat a číst, musí mít papír a kalamář. S touto abecedou, která je zde níže napsána, porozumíš.
