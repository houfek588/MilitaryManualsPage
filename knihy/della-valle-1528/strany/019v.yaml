  - ['a b c d e f g h i l', 'm n o p q r s t u']
  - ['Tato část jedním světlem', 'Tato část dvěma světly.']
- typ: odstavec
  de: |-
    Per intendere piu chiaramente lo modo dele sopraditte littere e da notare che la prima parte dele littere fin ad l si dimostra con uno lume, & la seconda parte comenciando da, m, fin ad, u, se demonstra con doi lumi, & quella littera che ci bisogna che si scriua se ha da pigliare quando lo lume se ferma, cioe quando se hauesse da scriuere Baptista bisogna pensare che B, e la prima littera e sta nella prima parte, lo lume bisogna che per ciascuna uolta se nasconda incominciando a, b, & ferma, quel lo altro scriue, b, poi mostra lo lume unaltra uolta & ferma che, a, per laltra littera comenza con
  cs: |-
    Abyste lépe pochopili způsob s výše uvedenými písmeny, je třeba poznamenat, že první část písmen až po l se ukazuje jedním světlem {lume} a druhá část, počínaje m až po u, dvěma světly. Písmeno, které se má napsat, se určí tehdy, když se světlo zastaví[^2]. Kdyby se například mělo psát Baptista, je třeba si uvědomit, že B je první písmeno a je v první části. Světlo se musí při každém [písmenu] skrýt, počínaje a, b, a pak se zastaví; ten druhý napíše b. Potom se světlo ukáže ještě jednou a zastaví se, což je a. Další písmeno se začne
poznamky:
- n: 1
  text: 'Campo – polní vojsko, ležení obléhatelů.'
- n: 2
  text: 'Princip optické telegrafie: světlo (pochodeň, lucerna) se pro každé písmeno ukazuje a skrývá tolikrát, kolikáté je písmeno v abecedě své skupiny, a pak se nechá stát („se ferma“); počet světel (jedno, nebo dvě) určuje, zda jde o první (a–l), nebo druhou (m–u) skupinu abecedy o 19 písmenech (bez j, k, v). Příklad se jménem Baptista – autorovým křestním jménem – je v tisku nepřesný (viz pokračování na 20 r).'
