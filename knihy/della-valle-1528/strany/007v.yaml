  popis: |-
    Dřevořez bez nápisů k [[008r|kapitole IX]] (kotvení svažující se záštity), otištěný naproti jejímu textu („jak je vidět zde naproti“): dvě části holé dřevěné kostry bez výplně. Nahoře řada svislých trámů s šikmými vzpěrami sbíhajícími se do špic a s vodorovnými příčkami s kolíky (kotvy, chiaue); u paty je řada sedmi hranolovitých, dovnitř se zužujících střílen (candonere) – patrně patro kasematy. Dole delší úsek kostry: dvě řady svislých trámů, nahoře i dole spojené vodorovnými příčkami a vzpěrami zkříženými do tvaru X.
