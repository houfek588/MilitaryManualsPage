stav: zkontrolovano
overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    doi lumi che, m, n, o, p, & ferma & quello scriue & a laltra monstra el fuoco con uno lume una uolta che e da le diece littere prime, & laltra la monstra con doi lumi & fa in questo modo, m, n, o, p, q, r, s, & scriue ad laltra pur con doi, m, n, o, p, q, r, s, t, & scriui, & como arrai scrito, scriue laltra poi con uno lume & monstra una uolta che, i, & cossi harai scrito baptista, & ancho con questo se potra scriuere qual se uoglia cosa che che uorai.
  cs: |-
    dvěma světly: m, n, o, p – a zastaví se, a ten druhý zapíše. U dalšího [písmene] se ukáže oheň jedním světlem jednou, neboť je z prvních deseti písmen. Další se ukazuje dvěma světly, a to takto: m, n, o, p, q, r, s, a [druhý] píše. Další opět dvěma: m, n, o, p, q, r, s, t, a piš. A až to napíšeš, napiš další, ukázané potom jedním světlem jednou, což je i. A tak budeš mít napsáno baptista[^1]; a stejně se tím dá napsat cokoli, co budeš chtít.
- typ: nadpis
  uroven: 1
  de: LIBRO SECONDO.
  cs: Kniha druhá
- typ: nadpis
  uroven: 2
  de: COMO SE DE PIGLIARE VNA TERRA. CAPITOLO PRIMO.
  cs: Jak se má dobýt město. Kapitola první.
- typ: odstavec
  de: |-
    PER PIGLIARE una terra bisogna chel Capitano uada piu, et piu uolte intorno dela terra, et mandare alcuni de ingegno, & de iudicio, et poi disputare doue, e da qual banda, & in che luoco e da fare fondamento de hauere a pigliare el ditto luoco, & piu non basta sul disputare il caso ma dico che bisogna andare sopra il luoco, & li dire ogni uno il suo parere, & facendo cossi a luoco per luoco & pigliando sempre el meglior modo se ne aspetta certo el bon fine.
  cs: |-
    Chce-li kapitán {Capitano} dobýt město[^2], musí ho mnohokrát objet dokola a vyslat několik důvtipných a soudných mužů; potom se má radit, kde, z které strany a na kterém místě je třeba založit dobývání onoho místa. Nestačí však o věci jen rokovat, nýbrž pravím, že je třeba jít přímo na místo a tam ať každý řekne svůj názor. Když se tak učiní místo od místa a vždy se zvolí nejlepší způsob, lze jistě očekávat dobrý konec.
poznamky:
- n: 1
  text: 'Podle tisku vychází sled b, a, p, a, s, t, i, což neodpovídá jménu Baptista (b, a, p, t, i, s, t, a); text je zřejmě zkrácený nebo porušený, překládán doslova. Baptista je křestní jméno autora. Na konci odstavce je v tisku zdvojené „che che“.'
- n: 2
  text: 'Kniha druhá (listy 20 r – 29 r) pojednává o dobývání měst: průzkum, zákopy, žebříky, mosty, stroje a miny. Kapitola začíná velkou figurální dřevořezovou iniciálou P se scénou Svaté rodiny (sv. Josef, Panna Maria a Ježíšek v jesličkách).'
