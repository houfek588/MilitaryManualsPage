  de: |-
    altro degno de fede, & lui dice che li huomini da bene ueri & magnanimi, & senza timore, & de honore libero non e licito, & non li conuiene che la sua intentione non debba palesare a chi la po resoluere dice assai bene, & anchora quelli li quali hanno animo, & intendimento de essere con le arme in mano per discutire alcune offese, & farse recognoscere, fanno como la militia recerca, atteso che le nobile, & uirile, & de estimatione, anchora conuiene quello che presuma adoperarla, & cognoscerla per nobile, debbe farli honore, & essere anchora lui nobile, & si le uirile bisogna anchora esser uirile, & se le degno de honore, bisogna essere honorato, se induce gran fatti bisogna fare fatti se induce animo & ualore, bisogna hauere animo & ualore, & si le libero non li conuien timore, siche quello che tiene queste parte non parla al uento & non in absentia, ma in presentia, & non con timore, ma con ualore, siche quando in presentia non si offende, o darne notitia per cartello se potrebbe lassarlo passare con modesto modo. Si risponde che i qual se uoglia uia & modo che sia noto ha leso la soa iniuria, & non ui fa alcuna demonstratione & uolerlo apertamente intendere per fare el debito par che lo lassi per timore. Et incarca & deshonora le arme, & non e degno portarle o uero e solito dele altre uolte oldirle, o uer che non cognosce el colore de lhonore, o quel della uergogna o uero e da pensare che uoglia fare la sua uendetta arditamente, & con superchiaria la quale e molto uetata ad caualieri simile maniera, & maximamente quando li combattenti sonno equali de conditione, & quando ne fosseno altri che
  cs: |-
    jiný hodnověrný člověk; a on řekne, že dobrým, pravým a velkomyslným mužům bez bázně a svobodné cti {honore} není dovoleno a nesluší se, aby svůj úmysl nevyjevili tomu, kdo s ním může naložit – a to říká dosti dobře. A také ti, kdo mají odvahu a úmysl postavit se se zbraní v ruce, aby rozřešili nějaké urážky {offese} a dali se poznat, jednají, jak vojenství {militia} žádá. Neboť to je urozené, mužné a vážené, a sluší se, aby ten, kdo se je odvažuje provozovat a uznává je za urozené, mu činil čest a byl sám také urozený; je-li mužné, musí být i on mužný; je-li hodné cti, musí být ctěný; vede-li k velkým činům, musí konat činy; vede-li k odvaze a statečnosti, musí mít odvahu a statečnost; a je-li svobodné, nesluší se mu bázeň. Kdo tedy má tyto vlastnosti, nemluví do větru a ne v nepřítomnosti, nýbrž v přítomnosti, a ne s bázní, nýbrž se statečností. Když [ho] tedy [onen] neurazí v jeho přítomnosti ani mu to nedá na vědomí vyzývacím listem {cartello}, mohl by to skromně nechat být. Odpovídá se: ať se jakoukoli cestou a jakýmkoli způsobem dozvěděl, že ho onen svou urážkou {iniuria} poškodil, a on to nijak nedá najevo a nechce to otevřeně vzít na vědomí, aby učinil, co je povinen, zdá se, že to nechává být z bázně. Tím zatěžuje a zneuctívá zbraně a není hoden je nosit; anebo je zvyklý takové věci slýchat i jindy; anebo nezná barvu cti ani barvu hanby; anebo je třeba se domnívat, že chce svou pomstu vykonat troufale a úkladně {superchiaria}[^1], což je rytířům {caualieri} v takovém případě přísně zakázáno, a zvláště když jsou bojovníci rovného stavu a když by šlo o jiné než
poznamky:
- n: 1
  text: 'Superchiaria (soperchieria) – úklad, násilí z přesily nebo ze zálohy; nečestná pomsta, kterou rytířský kodex zakazuje.'
