poznamky:
- n: 1
  text: |-
    „baltaglione“ – tisková chyba za „battaglione“, ponechána.
- n: 2
  text: |-
    „Pappafico“ – kukla zakrývající hlavu a obličej; zde kožená potápěčská kukla se železnými obručemi, korkem a trubicí ke vzduchu (kap. XXXVII).
- n: 3
  text: |-
    Kapitola XLI na listu 50 r vykládá číselnou šifru, jíž se celý šik zapíše do krátké řady čísel nad obrazcem.
