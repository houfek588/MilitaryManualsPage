bloky:
- typ: nadpis
  uroven: 2
  pokracovani: true
  de: |-
    uno uuole combattere a cauallo, & laltro a piedi, chi conuiene cedere. Capitolo XVII.
  cs: |-
    jeden chce bojovat na koni a druhý pěšky – kdo musí ustoupit. Kapitola XVII.
- typ: odstavec
  de: |-
    SE moue el dubio per il reo qual sera desfidato da lo actore ad tutta oltranza, & dice che per esserli dato el campo, per dare notitia del suo ualore, dice che per suo honor e sforzato acceptare, & per suo auantaggio gli pare uolere combattere ad cauallo, cossi determina, & fara noto alo actore se habia ad preparare, & crede che gli possa strengere farli combattere ad cauallo con quelle arme che ad lui piace, atteso che per consuetudine, & per ragione non puo uno dare lo campo, & larme senza accordo, & uolonta della parte. Se responde per lo actore che per hauere datto el campo ad tutta oltranza che significa ad guerra finita, o preso, & daiutarse comel puo esso intrato in campo, & per parerli che ad cauallo non essere apto, ne saperse adoperare, & pareuali combattere col cauallo, uolendoli adoperare, & non esserce mai admaestrato, quanto che con lo inimico, per tanto lui determina combattere ad piedi, & li dice par fare troppo che lentra dentro el campo, passata la barra ad cauallo, & mentre che lo inimico prende la mossa de laltro canto col suo cauallo, lui smonta & amaza el suo cauallo, & intorno de epso adopera la sua lanza ad modo de piccha uenendo spontando li e licito, tanto piu che piu uolte si e uisto che doi che combatteno a cauallo, & un cadde del suo cauallo in terra uirilmente se defende, & puoi dice uolere remontare ad cauallo non per questo gli sara concesso de remontare,
  cs: |-
    Vzniká pochybnost o vyzvaném {reo}, kterého vyzyvatel {actore} vyzve na život a na smrt {ad tutta oltranza}. Vyzvaný říká, že protože mu bylo dáno kolbiště {campo}, musí kvůli své cti {honor} výzvu přijmout, aby dal na odiv svou statečnost; a že se mu k jeho výhodě zdá bojovat na koni, tak to určí a dá vyzyvateli na vědomí, aby se připravil. A domnívá se, že ho může přimět k boji na koni se zbraněmi, jaké se jemu zlíbí, ježto podle obyčeje ani podle práva nemůže nikdo určit kolbiště a zbraně bez dohody a vůle protistrany. Za vyzyvatele se odpovídá: protože dal kolbiště na život a na smrt, což znamená až do skončení boje nebo do zajetí, a pomoci si, jak kdo může, jakmile vstoupí do kolbiště, a protože se mu zdá, že na koni není zdatný a neumí se ohánět a že by musel bojovat s koněm, chtěl-li by ho používat a nebyl v tom nikdy vycvičen, stejně jako s nepřítelem, rozhodne se proto bojovat pěšky. A dokonce mu říká – byť se to zdá přespříliš –, že smí vjet do kolbiště na koni za závoru {barra}, a zatímco nepřítel na druhé straně se svým koněm nabírá rozjezd, sesednout, svého koně zabít a kolem něho se bránit kopím jako píkou {piccha} proti tomu, kdo přijíždí s napřaženým hrotem[^1]; to je mu dovoleno, tím spíše, že se mnohokrát vidělo, jak ze dvou, kteří bojovali na koni, jeden spadl z koně na zem a statečně se bránil, a když pak řekl, že chce znovu nasednout, nebylo mu to proto dovoleno,
poznamky:
- n: 1
  text: '„uenendo spontando“ – čtení tisku je jisté, smysl (útočící protivník s nastaveným hrotem kopí) je odvozen z kontextu.'
