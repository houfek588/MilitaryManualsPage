overeno_clovekem: false
bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    acio si possa far uenire le candonere. Et quando mancasse il modo de fare li gabioni bisogna hauere de le botte uacue, & sfenestrarle da una banda, & impirle di terra bene, & calcarli como hai fatto a gli gabioni. Et quando mancassero le botte bisogna prendere sacconi de letti pieni de paglia, mattarazi de letti, & piume & altre tapezarie per non mancare al riparare, perche non solo e la perdita de gli huomini per non riparare, ma la importantia, e che ogni diece di dentro importa per cento di fuori.
  cs: |-
    tak, aby se mezi nimi daly udělat střílny {candonere}. A kdyby nebylo možné udělat koše {gabioni}, je třeba opatřit si prázdné sudy, vyříznout jim otvor na jedné straně, dobře je naplnit zemí a udusat, jak jsi to udělal u košů. A kdyby chyběly sudy, je třeba vzít slamníky z postelí plné slámy, matrace z postelí, peřiny a jiné čalouny, aby se nezanedbalo zahrazování {riparare}; protože nejde jen o ztrátu mužů, k níž dojde, když se nezahrazuje, ale hlavně platí, že deset mužů uvnitř má cenu sta venku.[^1]
poznamky:
- n: 1
  text: Zbytek strany je v tisku prázdný; na listu 5 v následuje dřevořez ke kapitole VII, otištěný naproti jejímu textu (list 6 r).
