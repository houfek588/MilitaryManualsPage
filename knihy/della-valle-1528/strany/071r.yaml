bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    mestiero chel sia depento malamente, & essendo cosi per certo se deue fare la sopraditta demonstratione.
  cs: |-
    řemesle, [který shledá], že [vyzvaný] byl potupně vymalován {depento} neprávem; a je-li tomu jistě tak, má se učinit výše uvedené veřejné potrestání.
- typ: odstavec
  de: |-
    QVesti sono li fioreti della Militia Excellentissimo S. mio quali solamente per exercitatione, & per non darme totalmente a locio me ha parso in questo mio libret[to] bre[ue]mente descriuere pregando uostra excellentissima signoria se degna alchuna uolta ascoltare alchuno Capitolo, & se alchuna cosa ue paresse non limatamente exposta uoglia considerare io non hauere inuestigato tanto il terso, & elegante parlare, quanto la uerita.
  cs: |-
    To jsou kvítka vojenství {Militia}[^1], můj přejasný pane[^2], která jsem se jen pro cvik, a abych se docela neoddal zahálce, rozhodl krátce popsat v této své knížečce[^3]. Prosím Vaši přejasnou Milost, aby ráčila někdy vyslechnout některou kapitolu; a zdálo-li by se Vám, že je něco vyloženo neuhlazeně, račte uvážit, že jsem se nesnažil ani tak o uhlazenou a vybranou řeč jako o pravdu.
- typ: odstavec
  de: |-
    Finisse Libro intitolato VALLO pertinente ad militi con noui Capitoli di artificii de fuoco agionti como nella soa tabola appare. Stampata in Venetia per Piero de Rauani. Nel anno del Signore Dio nostro. M.D.XXVIII. Adi. IX. de Decembrio.
  cs: |-
    Končí kniha nazvaná VALLO, náležející vojákům, s nově přidanými kapitolami o ohňostrojných zbraních {artificii de fuoco}, jak ukazuje její obsah {tabola}. Vytištěna v Benátkách u Piera de Ravani[^4] léta Pána Boha našeho 1528, dne 9. prosince.
- typ: nadpis
  uroven: 3
