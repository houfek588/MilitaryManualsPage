poznamky:
- n: 1
  text: 'Fioretti – „kvítka“, tj. výbor, nejlepší kousky (srov. Fioretti sv. Františka).'
- n: 2
  text: 'Oslovení „Excellentissimo S[ignore] mio“ patří hraběti Enricu Pandonovi z Venafra, jemuž je kniha věnována (LIBRO PRIMO, list 1 r).'
- n: 3
  text: 'Slova „libret[to] bre[ue]mente“ jsou ve skenu poškozena (natržený nebo odřený papír); doplněno podle smyslu.'
- n: 4
  text: 'Piero de Ravani (Pietro Ravani) – benátský tiskař a nakladatel, činný asi 1515–1550; jeho tiskařský znak (korunovaná siréna s dvěma ocasy) je na rubu tohoto listu.'
- n: 5
  text: 'Registr – soupis archů pro knihaře: nesignovaný úvodní arch (zde číslice 1) a archy A–I, každý po 4 dvoulistech (kvaternion = 8 listů), celkem 80 listů ([8] + 72). Poslední list I8 ([72]) byl patrně prázdný; v digitalizaci Getty po tiskařském znaku následuje jen prázdný sken 163.'
