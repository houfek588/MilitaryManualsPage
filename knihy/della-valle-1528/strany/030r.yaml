- typ: odstavec
  de: Ordinanza de. 300. Picche. o.6.5. 17.12. 17.per 17.18.
  cs: Šik o 300 pikenýrech. o.6.5. 17.12. 17.per 17.18.
- typ: odstavec
  de: Ordinanza per unire a battaglioni.
  cs: Šik ke spojení do bataillonů.
- typ: obrazek
  soubor: drevorez-79c.jpg
  popis: |-
    Pochodový šik tří set pikenýrů (kapitola III): svislý sloupec po šesti mužích v řadě, přes 50 řad až k dolnímu okraji strany. Nahoře řada „dodododod“, pak asi 16 řad „d“ (pikenýři), řada „o“ (ručničáři), šest řad „d“, dvě řady „p“ s praporem „B“, šest řad „d“, řada „o“ a asi 17 řad „d“. Vpravo nápisy gotickým písmem „C. III.“, „Ordinanza de. 300. Picche. o.6.5. 17.12. 17.per 17.18.“ a „Ordinanza per unire a battaglioni“.
poznamky:
- n: 1
  text: 'V obrazcích bataillonů stojí lance spezzate kolem praporu „B“ na prostranství (piaza) uvnitř šiku; v pochodových šicích této strany se nepočítají.'
- n: 2
  text: 'Číselná šifra šiku, kterou autor vykládá až v kapitole XLI ([[050r|list 50 r]]): o. = šik (ordinanza) s počtem mužů v řadě pochodového sloupce (zde 5); následují počty řad, na něž se sloupec rozdělí (14, 10, 14), a „per“ (po boku) s počty mužů na stranách hotového bataillonu (dvě strany po 14, dvě po 15). Druhá „5“ stojí na místě písmene p. (partire – rozdělit) ze šifry na listu 50 r; čtení „5“ je v tisku jisté a opakuje se u všech šiků, edice je ponechává. Údaj b. (řada praporu, u 200 pikenýrů b.19) tu na rozdíl od listu 50 r chybí.'
