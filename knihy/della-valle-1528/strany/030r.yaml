- typ: odstavec
  de: Ordinanza de cento picche senza le lancie spezate e Capi de Squadra e sergenti.
  cs: Šik {Ordinanza} o sto pikách {picche} bez lance spezzate {lancie spezate}[^1], desátníků {Capi de Squadra} a šikovatelů {sergenti}.
- typ: odstavec
  de: Ordinanza per unire a battaglioni.
  cs: Šik ke spojení do bataillonů {battaglioni}.
- typ: obrazek
  soubor: drevorez-79.jpg
  popis: |-
    Pochodový šik sta pikenýrů (kapitola I), sázený z písmen do úzkého svislého sloupce po třech mužích v řadě, 40 řad. První a poslední řadu tvoří střídavě „o“ a „d“ („ododod“); jinak sloupec tvoří písmena „d“ (pikenýři), v několika řadách „o“ (ručničáři – podle textu na [[031v|listu 31 v]] znamenají „o“ nebo tečky mezi pikenýry ručnice) a v horní polovině tři řady „p“ s praporem „B“ (bandiera) uprostřed. Tečky vpravo vedle sloupce značí další ručničáře. Vpravo od sloupce nápisy (gotickým písmem): „Ordinanza de cento picche senza le lancie spezate e Capi de Squadra e sergenti“ – šik o sto pikách bez lance spezzate, desátníků a šikovatelů; „Ordinanza per unire a battaglioni“ – šik ke spojení do bataillonů.
- typ: nadpis
  uroven: 2
  de: Ca. II.
  cs: Kapitola II.
- typ: odstavec
  de: Ordinanza de. 200. Picche o.5.5. 14.10. 14.per. 14.15.
  cs: Šik o 200 pikenýrech. o.5.5. 14.10. 14.per. 14.15.[^2]
- typ: odstavec
  de: Ordinanza per unire a battaglioni.
  cs: Šik ke spojení do bataillonů.
- typ: obrazek
  soubor: drevorez-79b.jpg
  popis: |-
    Pochodový šik dvou set pikenýrů (kapitola II): svislý sloupec po pěti mužích v řadě, asi 45 řad. Nahoře řada „dododod“, pod ní 13 řad „d“ (pikenýři), dvě řady „o“ (ručničáři), pět řad „d“, tři řady „p“ s praporem „B“ uprostřed, čtyři řady „d“, dvě řady „o“ a asi 13 řad „d“. Vpravo nápisy gotickým písmem „Ca. II.“, „Ordinanza de. 200. Picche o.5.5. 14.10. 14.per. 14.15.“ a „Ordinanza per unire a battaglioni“ (šik ke spojení do bataillonů).
- typ: nadpis
