bloky:
- typ: odstavec
  pokracovani: true
  de: |-
    ragioneuelmente apppiciati che saranno, ponno ben intrare dentro della terra insieme, & maxime quando e deliberato per consiglio di quelli di fuora, siche e de pensare grandemente a tal fine.
  cs: |-
    právem: jakmile se do sebe zapletou, mohou [nepřátelé] snadno vniknout spolu s nimi do města, zvláště je-li to předem usneseno na poradě obléhatelů. Proto je třeba na to velmi pamatovat.
- typ: nadpis
  uroven: 2
  de: EL MODO DI FARE VNO arlogio. Capitolo.XXXV.
  cs: Jak zhotovit hodiny. Kapitola XXXV.
- typ: odstavec
  de: |-
    EL modo di fare uno Arlogio da intendere a hora per hora con epso & mettere le guardie acio possano farle con piu ragione bisogna hauere un uaso di terra, ouer di rame, & a quello farli un busetto piccolo da piedi, & far una cosa de legno larghetta ad modo di una lama de spata ficcata in una piastra de piombo, & mettila dentro del uaso como uolta carta appare, & poi habi un pezo de Suro che uadi dentro dal uaso che sia quadretto, & in mezo del ditto Suro fatili una fissura tanto longa che ci uada quello bastone ad modo de spata ditto di sopra, & nota che al ditto Suro ci metterai un pezo di ferro filato como uolta carta appare, e chel ditto ferro stia ficcato nello Suro et fatto questo impi lo uaso daqua chiara, acio chel buso non se stropasse, & la ditta aqua se uole mettere la sera considerando che sia uintiquatro hore, & senza la cima del ferro nel ditto legno & lassa calare laqua per fina alaltra sera ad quella medesima hora, & doue sera calata la freza del ferro, segnali di nouo e da principio doue toccaua la freza la sera inanti in fine doue e calata la sera appresso, & poi parti in uintiquatro parte che seran uintiquatro hore cioe che ogni parte sera una hora, et
  cs: |-
    Chceš-li zhotovit hodiny {Arlogio}[^1], podle nichž lze poznat hodinu po hodině a rozestavovat stráže {guardie}, aby je mohly konat s větším pořádkem, potřebuješ hliněnou nebo měděnou nádobu a u dna jí udělej malý otvor. Pak zhotov dřevěnou laťku, poněkud širokou jako čepel meče, zaraženou do olověné desky, a postav ji do nádoby, jak je vidět po obrácení listu. Potom si opatři čtverhranný kus korku, který se vejde do nádoby, a doprostřed toho korku vyřízni tak dlouhou štěrbinu, aby jí prošla ona laťka podobná meči, o níž byla řeč výše. A pamatuj, že do korku zapíchneš kus železného drátu, jak je vidět po obrácení listu, a ten drát musí v korku pevně vězet. Když je to hotovo, naplň nádobu čistou vodou, aby se otvor neucpal. Vodu je třeba nalít večer, když je dvacet čtyři hodin[^2]; [označ] na laťce hrot drátu[^3] a nech vodu vytékat až do druhého večera do téže hodiny. Kam pak klesne šipka drátu, tam udělej novou značku, takže na začátku je místo, kam šipka ukazovala předchozího večera, a na konci místo, kam klesla příštího večera. Potom [vzdálenost] rozděl na dvacet čtyři díly, které budou dvacet čtyři hodiny, takže každý díl bude jedna hodina.
poznamky:
- n: 1
  text: 'Vodní hodiny (klepsydra): voda pomalu vytéká otvorem ve dně, korkový plovák („suro“, sughero) s drátěnou šipkou („freza“, freccia) klesá podél svislé laťky a ukazuje na ní hodiny. „Como uolta carta appare“ odkazuje na vyobrazení na [[018r|listu 18 r]].'
- n: 2
  text: 'Italské počítání hodin: dvacátá čtvrtá hodina připadala na západ slunce (večerní klekání), od něhož se počítal nový den; proto se hodiny „nastavují“ večer.'
- n: 3
  text: 'V tisku „& senza la cima del ferro nel ditto legno“ (a bez hrotu drátu na dřevě) – patrně tisková chyba za „segna“ (označ); přeloženo podle smyslu.'
