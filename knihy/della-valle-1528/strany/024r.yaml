  popis: |-
    Žebřík s rumpálem a mostem (ke kapitole VII na protější straně): pojízdný dřevěný vůz na plných kolech (z boku jsou vidět dvě). Uprostřed se tyčí dva vysoké sloupy zakončené kladkami, přes které vedou lana a řetězy; po nich se šikmo vysouvají dva skládací žebříky (most) s ozubenou hranou, zavěšené na kroužcích a hácích. Vpravo velké ozubené kolo s klikou (rumpál), které zabírá do zubů žebříku a vysouvá ho vzhůru; vpravo je vůz vzepřen šikmou vzpěrou. Vlevo v samostatném rámu stojí svislý válcovitý kus ovinutý provazy, s kovaným hrotem dole a čepem nahoře (snad ohnivá trouba zmíněná v textu, nebo vřeteno zvedáku). Celá strana je vyobrazení bez textu.
