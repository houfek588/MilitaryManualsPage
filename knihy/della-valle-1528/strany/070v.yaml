bloky:
- typ: odstavec
  de: |-
    SE moue el dubio per lo actore, & dice hauere depinto per uenire a noua querela ouer causa de combattere, impero se alchuno e leso domanda il debito suo che se li respondera. Se responde per lo reo idest depento attorto, & dice che non uuole altro combattere che la iustitia habia da diuidere el caso, ouer apponera de non metterse colui, o perche e infame o per altra cagione, & finalmente lo fara conuenire in corte, & maxime a corte principale dicendo che se lui deuesse hauere alchuna quantita de dinari & apresentando lo instrumento, li sarebbe fatta iustitia, & cosi quando fosse assaltato e dandoli delle ferite li sarebbe fatta iustitia et cossi ancho se fusse stato arobato li sarebe fatta iustitia & si ancho fosse amazato & altri domandasse iustitia, li sarebbe fatta, & adoncha se lo honore se stima piu che tutte le altre cose, & li e stato tolto, & hauesse lo mal fattore che se fara de lui, conuien pur che sia la satisfactione ad suo arbitrio per lo reo. Se dice anchora piu per lui che non li basta darli morte ma domanda che in ciaschuno loco doue lui ha depento sia frustato, & bollato con fuoco, & cosi facendo a ciaschun loco, & piu satisfactione che sel morisse, chel si denotaria le sue male opere fatte, & se li doueria fare tal iustitia, atteso che le altro che cianze lo acquistare de honore & perdere. Siche non conuien che un scelerato, & huomo insano de hauere possanza ad sua posta mettere in compromesso lo honore delo honorato ad suo modo, & par che li sia commesso & la tristitia & presumptione che gli abonda. Ma uero che conuiene che ue sia sententia de Caualiero, & huomo de guerra, et prattico attal
  cs: |-
    Pochybnost vznáší vyzyvatel {actore} a říká, že [protivníka] potupně vymaloval {depinto}, aby došlo k novému sporu {querela} čili důvodu k boji; je-li totiž někdo poškozen, ať žádá, co mu náleží, a bude mu odpovězeno. Za vyzvaného {reo}, totiž neprávem vymalovaného, se odpovídá, že nechce jiný boj, než aby věc rozsoudila spravedlnost; anebo namítne, že se s tím člověkem nedá do boje, buď proto, že je bezectný {infame}, nebo z jiné příčiny, a nakonec ho dá pohnat před soud {corte}, a to zvláště před knížecí soud. Říká: kdyby měl dostat nějakou sumu peněz a předložil listinu {instrumento}, stala by se mu spravedlnost; stejně tak kdyby byl přepaden a zraněn, stala by se mu spravedlnost; a také kdyby byl oloupen, stala by se mu spravedlnost; a i kdyby byl zabit a jiní žádali spravedlnost, stala by se. Jestliže se tedy čest {honore} cení víc než všechny ostatní věci a byla mu odňata, a dostal-li by zločince [do rukou], musí přece být na vůli vyzvaného, co se s ním stane a jaké bude zadostiučinění. Za něho se říká ještě víc: nestačí mu, aby [onoho] potrestali smrtí, nýbrž žádá, aby byl na každém místě, kde ho vymaloval, zmrskán a ocejchován ohněm; a tak-li se stane na každém místě, je to větší zadostiučinění, než kdyby zemřel, protože by se tím ukázaly jeho zlé skutky. A tak by se s ním mělo naložit, ježto nabývat a ztrácet čest je něco jiného než tlachy. Nesluší se tedy, aby zločinec {scelerato} a pomatený člověk měl moc podle libosti dávat v sázku čest ctného muže, jak se mu zlíbí, a aby se zdálo, že je mu to dovoleno – při ničemnosti a opovážlivosti, jež v něm překypují. Ovšem o tom musí vynést rozsudek rytíř {Caualiero}, válečník zkušený v takovém
