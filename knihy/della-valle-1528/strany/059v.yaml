bloky:
- typ: odstavec
  de: |-
    MOuesi el dubio che molti son che diceno che ad molte cose, & maxime ad combattere se demostrano li pianeti, & signi con loro forze ad uno in fauore, & ad laltro in contrario, & questo procede dal primo actore che moue lo combattere che non piglia lo pianeto de Marte, hora & ponto, & quando e lo suo dominare, quando sera nel segno de Scorpio ne casa soa, quale son dediti a battaglia, & anchora quando la luna sera nel ditto segno de Scorpione, & a tanti gradi & minuti non puo hauere buon fine. Ad questo se responde che non se nega che lhuomo non sia composto deli quattro elementi como Aero, Fuoco, Terra, et aqua & si delle sette pianete como Saturno. Ioue, Marte, Sole, Venere, Mercurio, & Luna, & ancho deli dodeci segni como e Aries, Tauro, Gemini, Cancer, Leone, Virgine, Libra, Scorpione, Sagittario, Capricorno, Aquario, & pisce, per tanto sono cieli corsiui, & se accepta ciaschuno habia loro pertinentie, & inclinatione ali loro affecti, & siano de uarie complexione, zoe chi frigidi, & sicci, & chi calidi, & humidi, & chi de uno piu che dallaltro lhuomo ne participa, ma non per questo che lhuomo sia de compositione non habia in se uero iudicio de arbitrare male, & bene per fugire le cause nocine & mouente, lhuomo e nato libero, & dotato de gran intendimento piu che le altre cose create, attale che lhuomo comprende lhuomo, & lhomo comprende il tutto, siche e dato allhuomo per reparo & armatura, & scudo & arme si per defendere, como per offendere lo libero arbitrio, elquale el tutto applaca, concorda, & uince, e piu che occhi, bocca, mano, & piedi son compositione in
  cs: |-
    Vzniká pochybnost, protože mnozí říkají, že v mnoha věcech, a nejvíce v souboji, se planety a znamení svými silami projevují jednomu ve prospěch a druhému v neprospěch. A to prý pochází od prvního vyzyvatele {actore}, který podnítí souboj, a přitom nezvolí planetu Mars, její hodinu a okamžik a dobu, kdy vládne – když bude ve znamení Štíra, ve svém domě,[^1] [neboť ta] jsou oddána boji; a také když bude Měsíc v řečeném znamení Štíra v tolika a tolika stupních a minutách –, a tak [souboj] nemůže mít dobrý konec. Na to se odpovídá, že se nepopírá, že je člověk složen ze čtyř živlů, totiž vzduchu, ohně, země a vody, a také ze sedmi planet, totiž Saturnu, Jupitera, Marsu, Slunce, Venuše, Merkuru a Měsíce, a také z dvanácti znamení, jimiž jsou Beran, Býk, Blíženci, Rak, Lev, Panna, Váhy, Štír, Střelec, Kozoroh, Vodnář a Ryby. Jsou to tedy oběžná nebesa a připouští se, že každé má své příslušnosti a sklony k [určitým] vášním a že jsou různé povahy {complexione}[^2] – jedna studená a suchá, jiná teplá a vlhká – a že člověk má na jednom podíl víc než na druhém. Z toho, že je člověk takto složen, však neplyne, že by neměl v sobě pravý úsudek, jímž rozsoudí zlé a dobré, aby se vyhnul škodlivým a podněcujícím příčinám. Člověk se rodí svobodný a obdařený velkým rozumem, víc než ostatní stvořené věci, takže člověk chápe člověka a člověk chápe všechno. Proto je člověku dána jako ochrana a zbroj, štít a zbraň k obraně i k útoku svobodná vůle {libero arbitrio}, která všechno uklidňuje, smiřuje a přemáhá. A dále, oči, ústa, ruce a nohy jsou složeny ve
poznamky:
- n: 1
  text: |-
    Štír je v astrologii „domem“ (domicilem) Marsu, planety války. „Ne casa soa“ = „v jeho domě“ (ne = nel, in). Autor líčí soudobou praxi volit pro souboj astrologicky příznivou hodinu (electio), kterou v závěru odmítá ve prospěch svobodné vůle.
- n: 2
  text: |-
    Complexione – v humorální nauce směs čtyř základních vlastností (studené, teplé, suché, vlhké), která určuje povahu těla i planety.
