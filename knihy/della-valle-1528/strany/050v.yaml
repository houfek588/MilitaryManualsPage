- typ: obrazek
  soubor: drevorez-120.jpg
  popis: |-
    Bataillon ve čtyřúhelníku (k [[051r|kapitole XLII]]), sázený z písmen: asi 17 řad po 17 mužích. Nahoře nápis SCHINO – týl, dole Fronte – čelo, po obou stranách Fianco – bok. Většinu šiku tvoří písmena „p“ (pikenýři), první a poslední řada střídá „p“ a „o“, krajní sloupce na bocích tvoří přeškrtnutá „ꝑ“ (muži „po boku“, viz [[050r|šifru v kapitole XLI]]). Uprostřed je volné náměstí {piaza}, v němž stojí tři řady písmen „d“ (14 mužů) kolem praporu „B“ (bandiera). Podle textu má každý z obou bataillonů 300 pikenýrů.
- typ: obrazek
  soubor: drevorez-120b.jpg
  popis: |-
    Bataillon v trojúhelníku, obrácený hrotem proti čelu čtyřúhelníku nad ním. Obě šikmé strany nesou nápis FRONTE – čelo, jejich krajní řady tvoří dvojice „d°“ (písmeno „d“ s malým „o“); základnu uzavírá řada střídající „d“ a „o“. Uvnitř stojí šikmé řady písmen „d“, uprostřed malý čtverec písmen „p“ kolem praporu „B“ a pod ním se řady „d“ rozbíhají vějířovitě k základně.
