  soubor: drevorez-120.jpg
  popis: |-
    Bataillon ve čtyřúhelníku (k [[051r|kapitole XLII]]), sázený z písmen: 17 řad po 18 mužích (srov. „ꝑ.17.ꝑ.18“ v [[050r|šifře pro 300 pikenýrů]]). Nahoře nápis SCHINO – týl, dole Fronte – čelo, po obou stranách Fianco – bok. Většinu šiku tvoří písmena „p“ (pikenýři), první a poslední řada střídá „p“ a „o“, krajní sloupce na bocích tvoří přeškrtnutá „ꝑ“ (muži „po boku“ podle šifry kapitoly XLI). Uprostřed je volné prostranství, v němž stojí tři řady po pěti písmenech „d“ (14 mužů) kolem praporu „B“ (bandiera); nad ním a pod ním je v řadě mezera. Nápis Fianco je vysázen spíše jako „Fidnco“. Podle textu má každý z obou bataillonů 300 pikenýrů.
- typ: obrazek
  soubor: drevorez-120b.jpg
  popis: |-
    Bataillon v trojúhelníku, obrácený hrotem proti čelu čtyřúhelníku nad ním. Obě šikmé strany nesou nápis FRONTE – čelo, jejich krajní řady tvoří dvojice „d°“ (písmeno „d“ s malým „o“); základnu uzavírá řada střídající „d“ a „o“. Uvnitř stojí šikmé řady písmen „d“, uprostřed malý čtverec písmen „p“ (čtyři řady) kolem praporu „B“ a pod ním se řady „d“ rozbíhají vějířovitě k základně.
