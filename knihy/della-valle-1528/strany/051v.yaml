    Dva bataillony ve čtyřúhelníku proti sobě (ke [[052r|kapitole XLIII]]), sázené z písmen přes celou stranu. Horní bataillon z písmen „p“ má nahoře nápis SCHINO – týl a dole FRONTE – čelo; jeho první a poslední řadu tvoří střídavě „p“ a „o“, pravý bok přeškrtnutá „ꝑ“ s nápisem FIANCO – bok, uprostřed stojí prapor „B“ obklopený písmeny „d“. Vlevo z něj vybíhá kus šiku (křídlo) z písmen „p“ s vlastním čelem FRONTE obráceným doprava, proti boku dolního bataillonu. Dolní bataillon z písmen „d“ je obrácený: čelo FRONTE (nápis vzhůru nohama) má nahoře, dole SCHINO – týl, vlevo FIANCO – bok; první řadu tvoří „dodo…“, uprostřed prapor „B“ mezi písmeny „p“. Vpravo z něj vybíhá nahoru křídlo s čelem FRONTE obráceným doleva, proti boku horního bataillonu.
