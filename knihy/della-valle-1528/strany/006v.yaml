  popis: |-
    Celostránkový dřevořez bez nápisů k [[007r|kapitole VIII]] (okrouhlá bašta), otištěný naproti jejímu textu: bašta z otepí a hlíny vyztužená dřevěnou kostrou, v čelním pohledu. Dolní část se od paty nahoru zužuje (svah, po němž „klesají“ kotvy), nad vodorovným pásem uprostřed (patrně římsa či vazba z prken) se horní část opět rozšiřuje – patrně kavalír s předprsní. V každém ze dvou pater (dvě kasematy) jsou čtyři střílny (candonere) zobrazené perspektivně jako zužující se otvory, krajní šikmo do boků. Svislé trámy spojují vodorovné příčky s kolíky („kotvy“, chiaue) a šikmé vzpěry do kříže; mezi nimi jsou otepi (manocchi).
