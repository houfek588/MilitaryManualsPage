poznamky:
- n: 1
  text: |-
    „Casa“ (dům) – krytá pojízdná bouda (lat. testudo, musculus), pod níž se útočníci přibližují k hradbě a podkopávají ji.
- n: 2
  text: |-
    „Lunetta“ (měsíček) – šik nebo jeho křídlo ve tvaru půlměsíce. Tvary „battaglion“, „in quadran.“ (= in quadrangolo) a „in tre cerchi“, „in triangolo“ jsou v tisku zkrácené (battagliõ, q̃drã, ĩ); zkratky jsou rozepsány.
