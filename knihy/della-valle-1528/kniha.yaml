poznamky_k_prekladu: |
  JAZYK: originál je ITALSKY (1528). Pole `de` obsahuje italský text. OCR archivu (zdroje/ocr_ia/NNNN.txt) je velmi
  špatné – text přepisuj ZE SKENU, OCR použij jen k orientaci. Zachovej pravopis tisku (u/v: uarie, hauere; et, &;
  ph, ti/tti: Excellentissimo, expugnare), dlouhé ſ převáděj na s, ligaturu ß na „ss“, zkratky s vlnovkou rozepiš
  (cõ → con, ẽ → en, q̃ → que), vynech živé záhlaví (LIBRO / PRIMO), číslo listu, signatury a kustody.

  STRUKTURA: titul [1] r (sken 5), verše „Se uoi …“ [1] v, Tabola (obsah) [2] r – [5] r, dřevořez [5] v (sken 14),
  „Capitoli tre de artificii de fuoco novamente aggionti“ [6] r – [8] v, LIBRO PRIMO s věnováním hraběti
  Henricovi Pandonovi z Venafra od listu 1 r (sken 21), LIBRO SECONDO od listu 20 r (sken 59; dobývání: mosty,
  žebříky, stroje), LIBRO TERZO od listu 29 v (sken 78; bataillony a šiky – mnoho obrazců z písmen a teček),
  LIBRO QUARTO od listu 53 v (sken 126; šlechtictví, urážky cti a souboje), tiráž a registr 71 r (sken 161), tiskařský znak 71 v (sken 162).
  Úroveň 1 = titul, obsah, úvodní kapitoly o ohni, jednotlivé knihy; úroveň 2 = kapitoly („Capitolo …“);
  úroveň 3 = drobné mezinadpisy.

  TERMINOLOGIE (výchozí, glosář ji upřesní): capitano = kapitán, bastione = bašta, cavaliero = kavalír, artiglieria /
  artegliaria = dělostřelectvo, pezzo = dělo, bombardiero = dělostřelec, polvere = prach, salnitro = ledek,
  battaglione / battaglia = bataillon / šik (battaglione = velký čtvercový šik pěchoty), ordinanza = šik / řád,
  picca / picche = píka / pikenýři, archibuso = arkebuza, scoppietto = ručnice, fante = pěšák, huomo d'arme =
  kyrysník (těžký jezdec), cavallo leggiero = lehký jezdec, sargente = šikovatel, colonello = plukovník
  (velitel kolony), caporale = desátník, alfiere = praporečník, bandiera = prapor, trincea = zákop, cava = mina,
  ponte = most, scala = žebřík, argano = rumpál, tromba de fuoco = ohnivá trouba, disfida = výzva k souboji,
  cartello = vyzývací list, padrino = sekundant, mentita = obvinění ze lži, honore = čest, cavaliero (osoba) = rytíř.
